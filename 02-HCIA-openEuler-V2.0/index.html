"step":3,"description":"Write crontab schedule for Monday 08:00 AM (00 08 * * 1)","required_any":["00 08 * * 1","0 8 * * 1"],"feedback_fail":"Use '00 08 * * 1 /usr/local/bin/backup.sh' for every Monday at 08:00 AM."}],"simulated_output":"9700 (process ID) old priority -18, new priority 12\n[OK] Signal SIGHUP (1) delivered to PID 3389\n\nwarning: commands will be executed using /bin/sh\njob 1 at Tue Nov 17 15:00:00 2026\n1\tTue Nov 17 15:00:00 2026 a root\n\n[Crontab Registered] 00 08 * * 1 /usr/local/bin/backup.sh","quiz_questions":[{"id":"h5_s4_q1","type":"single","question":"[Official Ch.04 Quiz Q1] Which of the following commands can be used to dynamically check the host resource usage?","options":["A. ps","B. top","C. free","D. lscpu"],"answer":"B","explanation":"Official Ch.04 Quiz Q1 (p.249): B (`top`). While `ps` statically displays process information at a point in time, `top` dynamically displays host resource usage and processes in real time."},{"id":"h5_s4_q2","type":"single","question":"When `kill PID` is executed without specifying a signal option (`-s`), which signal is sent by default, and which signal number forces unconditional termination?","options":["A. Default: 1 (HUP); Unconditional termination: 2 (INT)","B. Default: 15 (TERM); Unconditional termination: 9 (KILL)","C. Default: 9 (KILL); Unconditional termination: 15 (TERM)","D. Default: 18 (TSTP); Unconditional termination: 19 (CONT)"],"answer":"B","explanation":"Per Ch.04 (pp.234–235), `kill PID` sends the `TERM` (15) signal by default, while signal `9` (`KILL`) performs unconditional termination."},{"id":"h5_s4_q3","type":"multiple","question":"Which of the following statements about `at` and `crontab` scheduled tasks in openEuler are TRUE?","options":["A. `atq` views the pending `at` job queue, and `atrm <job_ID>` deletes a scheduled `at` job.","B. The five time fields in a `crontab` entry are: `minute hour day-of-month month-of-year day-of-week`.","C. User crontab files are stored in `/var/spool/cron/` named after the user, while system-wide cron tasks are in `/etc/crontab`.","D. You do NOT need to restart the `cron` service after modifying a crontab file because `cron` checks the files every minute."],"answer":"ABCD","explanation":"Per Ch.04 (pp.241–248), all four statements are explicitly verified in the official training material."}],"reference_figures":[{"slug":"p2_h5s4_process_states","title":"Process State Transition State Machine (R, S, D, T, Z)","pdf_page":227}]}}]},{"hour_number":6,"folder_name":"Hour-06-Storage-LVM-and-Network-Management","title":"openEuler Disk Partitioning, LVM & Network Management","chapter_ref":"Chapter 05 (pp. 252–320)","duration_mins":60,"overview":"Master openEuler file systems (`ext4`, `XFS`) and disk naming (`/dev/sd*`, `/dev/hd*`, `/dev/vd*`), partition disks under MBR (`fdisk`) and GPT (`parted`), format (`mkfs`) and mount file systems temporarily and persistently (`/etc/fstab`), create and dynamically resize LVM volumes (PV, VG, LV), and configure/diagnose networks using `nmcli`, `nmtui`, `ip`, `route`, `ping`, `tracepath`, and `ss`.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Storage-File-Systems-and-Disk-Partitioning","exercise_slug":"02-Exercise-Fdisk-and-Parted-Partitioning-Lab","lecture":{"title":"Persistent Storage, File Systems & Disk Partitioning (`fdisk`, `parted`, MBR vs. GPT)","duration_mins":7,"pdf_ref":"Ch.05, pp. 256–276","objectives":["Identify the 3 persistent storage layers, openEuler's default file system (`ext4`), and commands to view file system/disk info (`lsblk -f`, `blkid`, `df -T`, `fdisk -l`, `df -h`)","Decode Linux disk and partition device names (`/dev/xxyN`) across IDE (`hd`), SCSI/SATA/SAS/SSD (`sd`), and virtio (`vd`) drives","Compare MBR vs. GPT partitioning limits and partition drives using `fdisk` and `parted`"],"content_markdown":"### 1. Persistent Storage Layers, File Systems & Disk Inspection\n* **3 Layers of Linux Persistent Storage:** (1) **File system** (organizes/manages file data), (2) **Disk partitions** (logical sections), (3) **Physical drives** (HDD, SSD, NVMe).\n* **File Systems on openEuler:**\n  * **Default file system on openEuler:** **`ext4`** (Ch.05, p.259).\n  * Other supported file systems: **XFS** (high-performance journaling FS by Silicon Graphics, excels at large files), **VFAT** (DOS/Windows FAT16/FAT32), **NFS** (UNIX network file sharing), **ISO 9660** (optical discs/ISOs), **Btrfs**, etc.\n  * **Check File System Type:** **`lsblk -f`**, **`blkid`**, or **`df -T`**.\n  * **Check Disk & Mount Space:** **`fdisk -l`** (lists all mounted and unmounted disks/partitions) and **`df -h`** (checks mounted disk space and usage).\n* **Disk Interfaces:** **IDE (PATA / parallel port)**, **SATA (serial port)**, **SCSI / SAS** (server-grade, hot-swappable, high stability), and **Fibre Channel (FC)**.\n<!-- PDF_FIGS_START -->\n![Linux File System Architecture Stack and VFS Layer (Official Reference: p. 258)](./assets/images/p2_h6s1_vfs_file_system.png)\n*Figure: Linux File System Architecture Stack and VFS Layer (Official Reference: p. 258)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Device Naming (`/dev/xxyN`) & Partition Types\nIn `/dev/xxyN`:\n* **`xx` (Device Type):** **`hd`** (IDE disk), **`sd`** (SCSI, SAS, SATA, and SSD disks), **`vd`** (virtio virtual disk), **`fd`** (floppy disk).\n* **`y` (Device Letter):** `a` = 1st disk, `b` = 2nd disk (e.g., `/dev/hda` = 1st IDE disk, `/dev/sdb` = 2nd SCSI/SATA disk).\n* **`N` (Partition Number):**\n  * **`1 to 4`:** Reserved for **Primary partitions** or the **Extended partition** (at most **1 extended partition** per disk, which cannot be used directly until divided into logical partitions).\n  * **`5 and above`:** **Logical partitions ALWAYS start from 5!** Example: **`/dev/sdb6` is the second logical partition on the second SCSI disk**!\n<!-- PDF_FIGS_START -->\n![Linux Disk Partition Device Naming (/dev/xx[a-z][1-N]) (Official Reference: p. 268)](./assets/images/p2_h6s1_device_naming.png)\n*Figure: Linux Disk Partition Device Naming (/dev/xx[a-z][1-N]) (Official Reference: p. 268)*\n\n![MBR Disk Partition Types (Primary, Extended, Logical Partition Relationship) (Official Reference: p. 267)](./assets/images/p2_h6s1_mbr_partitions.png)\n*Figure: MBR Disk Partition Types (Primary, Extended, Logical Partition Relationship) (Official Reference: p. 267)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. MBR (`fdisk`) vs. GPT (`parted`)\n| Feature | MBR (Master Boot Record — `fdisk`) | GPT (GUID Partition Table — `parted`) |\n| :--- | :--- | :--- |\n| **Firmware & Address Bits** | Legacy **BIOS**; **32-bit** sector values. | **UEFI** standard; **64-bit** LBA values. |\n| **Max Disk/Partition Size** | **2 TB** maximum (`fdisk` does not support >2 TB). | **18 EB** maximum (supports >2 TB). |\n| **Max Partitions** | **4 primary** (or 3 primary + 1 extended). Total usable: **SCSI max 15** (4 primary or 12 logical); **IDE max 63** (4 primary or 60 logical). | **128 partitions** per disk (no primary/extended/logical distinction). |\n| **Interactive Commands** | `fdisk /dev/sdb`: **`n`** (new: `p` primary, `e` extended, `l` logical), **`d`** (delete), **`p`** (print table), **`l`** (list IDs: `82` swap, `83` Linux, **`8e` Linux LVM**), **`t`** (change ID), **`w`** (save & exit), **`q`** (quit without saving). | `parted /dev/sdb`: **`mklabel gpt`** (set GPT table), **`mkpart`** (create partition), **`print`**, **`resizepart`**, **`rm`**, **`quit`**. Non-interactive: `parted /dev/sdb mklabel gpt` -> `parted /dev/sdb mkpart primary 0 1000`. |\n<!-- PDF_FIGS_START -->\n![fdisk Interactive Primary Partitioning Flowchart (Official Reference: p. 271)](./assets/images/p2_h6s1_fdisk_flow.png)\n*Figure: fdisk Interactive Primary Partitioning Flowchart (Official Reference: p. 271)*\n\n![parted Interactive GPT Partitioning Workflow (Official Reference: p. 275)](./assets/images/p2_h6s1_parted_flow.png)\n*Figure: parted Interactive GPT Partitioning Workflow (Official Reference: p. 275)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["The default file system on openEuler is ext4; check file system types using 'lsblk -f', 'blkid', or 'df -T'.","In /dev/xxyN, partitions 1–4 are primary or extended partitions, and logical partitions ALWAYS start at 5 (so /dev/sdb6 is the 2nd logical partition on the 2nd SCSI disk).","MBR (fdisk) is limited to 2 TB and 4 primary partitions (or 3 primary + 1 extended), whereas GPT (parted) supports up to 18 EB and 128 partitions."],"exam_traps":["EXAM TRAP: Even if you create only 1 primary partition (/dev/sdb1) and 1 extended partition (/dev/sdb2), the very first logical partition inside that extended partition is ALWAYS numbered 5 (/dev/sdb5), and the second logical partition is /dev/sdb6!","EXAM TRAP: In fdisk, partition ID '83' is standard Linux, '82' is Linux swap, and '8e' is Linux LVM (must change 83 to 8e using 't' when preparing a partition for LVM)."],"content_html":"<h3>1. Persistent Storage Layers, File Systems &amp; Disk Inspection<\/h3>\n<ul class=\"md-list\">\n<li><strong>3 Layers of Linux Persistent Storage:<\/strong> (1) <strong>File system<\/strong> (organizes/manages file data), (2) <strong>Disk partitions<\/strong> (logical sections), (3) <strong>Physical drives<\/strong> (HDD, SSD, NVMe).<\/li>\n<li><strong>File Systems on openEuler:<\/strong><\/li>\n<li><strong>Default file system on openEuler:<\/strong> <strong><code class=\"inline-code\">ext4<\/code><\/strong> (Ch.05, p.259).<\/li>\n<li>Other supported file systems: <strong>XFS<\/strong> (high-performance journaling FS by Silicon Graphics, excels at large files), <strong>VFAT<\/strong> (DOS/Windows FAT16/FAT32), <strong>NFS<\/strong> (UNIX network file sharing), <strong>ISO 9660<\/strong> (optical discs/ISOs), <strong>Btrfs<\/strong>, etc.<\/li>\n<li><strong>Check File System Type:<\/strong> <strong><code class=\"inline-code\">lsblk -f<\/code><\/strong>, <strong><code class=\"inline-code\">blkid<\/code><\/strong>, or <strong><code class=\"inline-code\">df -T<\/code><\/strong>.<\/li>\n<li><strong>Check Disk &amp; Mount Space:<\/strong> <strong><code class=\"inline-code\">fdisk -l<\/code><\/strong> (lists all mounted and unmounted disks/partitions) and <strong><code class=\"inline-code\">df -h<\/code><\/strong> (checks mounted disk space and usage).<\/li>\n<li><strong>Disk Interfaces:<\/strong> <strong>IDE (PATA / parallel port)<\/strong>, <strong>SATA (serial port)<\/strong>, <strong>SCSI / SAS<\/strong> (server-grade, hot-swappable, high stability), and <strong>Fibre Channel (FC)<\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s1_vfs_file_system.png\" alt=\"Linux File System Architecture Stack and VFS Layer\" data-caption=\"Linux File System Architecture Stack and VFS Layer (Official Reference: p. 258)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Linux File System Architecture Stack and VFS Layer<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 258 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Device Naming (<code class=\"inline-code\">/dev/xxyN<\/code>) &amp; Partition Types<\/h3>\n<p>In <code class=\"inline-code\">/dev/xxyN<\/code>:<\/p>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">xx<\/code> (Device Type):<\/strong> <strong><code class=\"inline-code\">hd<\/code><\/strong> (IDE disk), <strong><code class=\"inline-code\">sd<\/code><\/strong> (SCSI, SAS, SATA, and SSD disks), <strong><code class=\"inline-code\">vd<\/code><\/strong> (virtio virtual disk), <strong><code class=\"inline-code\">fd<\/code><\/strong> (floppy disk).<\/li>\n<li><strong><code class=\"inline-code\">y<\/code> (Device Letter):<\/strong> <code class=\"inline-code\">a<\/code> = 1st disk, <code class=\"inline-code\">b<\/code> = 2nd disk (e.g., <code class=\"inline-code\">/dev/hda<\/code> = 1st IDE disk, <code class=\"inline-code\">/dev/sdb<\/code> = 2nd SCSI/SATA disk).<\/li>\n<li><strong><code class=\"inline-code\">N<\/code> (Partition Number):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">1 to 4<\/code>:<\/strong> Reserved for <strong>Primary partitions<\/strong> or the <strong>Extended partition<\/strong> (at most <strong>1 extended partition<\/strong> per disk, which cannot be used directly until divided into logical partitions).<\/li>\n<li><strong><code class=\"inline-code\">5 and above<\/code>:<\/strong> <strong>Logical partitions ALWAYS start from 5!<\/strong> Example: <strong><code class=\"inline-code\">/dev/sdb6<\/code> is the second logical partition on the second SCSI disk<\/strong>!<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s1_device_naming.png\" alt=\"Linux Disk Partition Device Naming (/dev/xx[a-z][1-N])\" data-caption=\"Linux Disk Partition Device Naming (/dev/xx[a-z][1-N]) (Official Reference: p. 268)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Linux Disk Partition Device Naming (/dev/xx[a-z][1-N])<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 268 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s1_mbr_partitions.png\" alt=\"MBR Disk Partition Types (Primary, Extended, Logical Partition Relationship)\" data-caption=\"MBR Disk Partition Types (Primary, Extended, Logical Partition Relationship) (Official Reference: p. 267)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>MBR Disk Partition Types (Primary, Extended, Logical Partition Relationship)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 267 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. MBR (<code class=\"inline-code\">fdisk<\/code>) vs. GPT (<code class=\"inline-code\">parted<\/code>)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Feature<\/th><th>MBR (Master Boot Record — <code class=\"inline-code\">fdisk<\/code>)<\/th><th>GPT (GUID Partition Table — <code class=\"inline-code\">parted<\/code>)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Firmware &amp; Address Bits<\/strong><\/td><td>Legacy <strong>BIOS<\/strong>; <strong>32-bit<\/strong> sector values.<\/td><td><strong>UEFI<\/strong> standard; <strong>64-bit<\/strong> LBA values.<\/td><\/tr>\n<tr><td><strong>Max Disk/Partition Size<\/strong><\/td><td><strong>2 TB<\/strong> maximum (<code class=\"inline-code\">fdisk<\/code> does not support &gt;2 TB).<\/td><td><strong>18 EB<\/strong> maximum (supports &gt;2 TB).<\/td><\/tr>\n<tr><td><strong>Max Partitions<\/strong><\/td><td><strong>4 primary<\/strong> (or 3 primary + 1 extended). Total usable: <strong>SCSI max 15<\/strong> (4 primary or 12 logical); <strong>IDE max 63<\/strong> (4 primary or 60 logical).<\/td><td><strong>128 partitions<\/strong> per disk (no primary/extended/logical distinction).<\/td><\/tr>\n<tr><td><strong>Interactive Commands<\/strong><\/td><td><code class=\"inline-code\">fdisk /dev/sdb<\/code>: <strong><code class=\"inline-code\">n<\/code><\/strong> (new: <code class=\"inline-code\">p<\/code> primary, <code class=\"inline-code\">e<\/code> extended, <code class=\"inline-code\">l<\/code> logical), <strong><code class=\"inline-code\">d<\/code><\/strong> (delete), <strong><code class=\"inline-code\">p<\/code><\/strong> (print table), <strong><code class=\"inline-code\">l<\/code><\/strong> (list IDs: <code class=\"inline-code\">82<\/code> swap, <code class=\"inline-code\">83<\/code> Linux, <strong><code class=\"inline-code\">8e<\/code> Linux LVM<\/strong>), <strong><code class=\"inline-code\">t<\/code><\/strong> (change ID), <strong><code class=\"inline-code\">w<\/code><\/strong> (save &amp; exit), <strong><code class=\"inline-code\">q<\/code><\/strong> (quit without saving).<\/td><td><code class=\"inline-code\">parted /dev/sdb<\/code>: <strong><code class=\"inline-code\">mklabel gpt<\/code><\/strong> (set GPT table), <strong><code class=\"inline-code\">mkpart<\/code><\/strong> (create partition), <strong><code class=\"inline-code\">print<\/code><\/strong>, <strong><code class=\"inline-code\">resizepart<\/code><\/strong>, <strong><code class=\"inline-code\">rm<\/code><\/strong>, <strong><code class=\"inline-code\">quit<\/code><\/strong>. Non-interactive: <code class=\"inline-code\">parted /dev/sdb mklabel gpt<\/code> -&gt; <code class=\"inline-code\">parted /dev/sdb mkpart primary 0 1000<\/code>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s1_fdisk_flow.png\" alt=\"fdisk Interactive Primary Partitioning Flowchart\" data-caption=\"fdisk Interactive Primary Partitioning Flowchart (Official Reference: p. 271)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>fdisk Interactive Primary Partitioning Flowchart<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 271 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s1_parted_flow.png\" alt=\"parted Interactive GPT Partitioning Workflow\" data-caption=\"parted Interactive GPT Partitioning Workflow (Official Reference: p. 275)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>parted Interactive GPT Partitioning Workflow<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 275 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Inspecting File Systems (`lsblk -f`, `fdisk -l`) and Non-Interactive GPT Partitioning (`parted`)","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You have attached a new 4 TB disk `/dev/sdb` to an openEuler server. Because it exceeds 2 TB, you must inspect existing disks with `fdisk -l` and `lsblk -f`, and then use `parted` in non-interactive mode to initialize `/dev/sdb` with a `gpt` partition table and create a primary partition.","instructions":["Step 1: View all disks and partitions using `fdisk -l` and check file system types using `lsblk -f`.","Step 2: Use `parted` in non-interactive mode to convert `/dev/sdb` to a GPT partition table (`parted /dev/sdb mklabel gpt`).","Step 3: Use `parted` in non-interactive mode to create a 1000 MB partition on `/dev/sdb` (`parted /dev/sdb mkpart primary 0 1000`)."],"starter_code":"# Step 1: List all disks/partitions and check file system types\n<fdisk_list_command>\n<lsblk_fs_command>\n\n# Step 2: Change /dev/sdb partition table format to GPT using parted\n<parted_mklabel_command>\n\n# Step 3: Create a partition from 0 to 1000 MB on /dev/sdb using parted\n<parted_mkpart_command>","solution_code":"# Step 1: List all disks/partitions and check file system types\nfdisk -l\nlsblk -f\n\n# Step 2: Change /dev/sdb partition table format to GPT using parted\nparted /dev/sdb mklabel gpt\n\n# Step 3: Create a partition from 0 to 1000 MB on /dev/sdb using parted\nparted /dev/sdb mkpart primary 0 1000","hints":["Use `fdisk -l` and `lsblk -f`.","Use `parted /dev/sdb mklabel gpt` (exact command from Ch.05 p.276).","Use `parted /dev/sdb mkpart primary 0 1000` (exact command from Ch.05 p.276)."],"validation_checks":[{"step":1,"description":"Inspect disks and file systems with fdisk -l and lsblk -f","required_any":["fdisk -l"],"feedback_fail":"Include 'fdisk -l' and 'lsblk -f'."},{"step":2,"description":"Create GPT disklabel on /dev/sdb with parted","required_any":["parted /dev/sdb mklabel gpt"],"feedback_fail":"Use 'parted /dev/sdb mklabel gpt'."},{"step":3,"description":"Create partition on /dev/sdb with parted mkpart","required_any":["parted /dev/sdb mkpart primary 0 1000"],"feedback_fail":"Use 'parted /dev/sdb mkpart primary 0 1000'."}],"simulated_output":"Disk /dev/vda: 40 GiB, 42949672960 bytes, 83886080 sectors\nDisklabel type: gpt\nNAME               FSTYPE      MOUNTPOINT\nvda1               vfat        /boot/efi\nvda2               ext4        /boot\n└─openeuler-root   ext4        /\n\nInformation: You may need to update /etc/fstab.\nModel: Virtio Block Device (virtblk)\nDisk /dev/sdb: 4000GB\nPartition Table: gpt\nNumber  Start   End     Size    File system  Name     Flags\n 1      1049kB  1000MB  999MB                primary","quiz_questions":[{"id":"h6_s1_q1","type":"single","question":"What is the default file system on openEuler, and what does the device name `/dev/sdb6` represent?","options":["A. `xfs`; the 6th primary partition on the 2nd SATA disk","B. `ext4`; the 2nd logical partition on the 2nd SCSI/SATA disk","C. `btrfs`; the 6th logical partition on the 1st IDE disk","D. `vfat`; the 1st extended partition on the 2nd virtio disk"],"answer":"B","explanation":"Per Ch.05 (p.259 & p.268), the default file system on openEuler is `ext4`. In `/dev/xxyN`, primary/extended partitions are numbered 1 to 4 and logical partitions start from 5, so `/dev/sdb6` is the second logical partition on the second SCSI disk."},{"id":"h6_s1_q2","type":"single","question":"What is the maximum disk/partition size supported by the MBR partitioning scheme (`fdisk`), and how many partitions per disk are supported by GPT (`parted`)?","options":["A. MBR max: 512 GB; GPT max: 64 partitions","B. MBR max: 2 TB; GPT max: 128 partitions (up to 18 EB)","C. MBR max: 18 EB; GPT max: 4 primary partitions","D. MBR max: 4 TB; GPT max: 15 partitions"],"answer":"B","explanation":"Per Ch.05 (pp.269–273), MBR uses 32-bit values and cannot exceed 2 TB, whereas GPT uses 64-bit LBA (up to 18 EB) and supports up to 128 partitions per disk."},{"id":"h6_s1_q3","type":"multiple","question":"Which of the following commands can be used in openEuler to check the file system type of a partition?","options":["A. `lsblk -f`","B. `blkid`","C. `df -T`","D. `pwd -P`"],"answer":"ABC","explanation":"Per Ch.05 (p.260), the three commands used to check the file system type of a partition in Linux are `lsblk -f`, `blkid`, and `df -T`."}],"reference_figures":[{"slug":"p2_h6s1_device_naming","title":"Linux Disk Partition Device Naming (/dev/xx[a-z][1-N])","pdf_page":268},{"slug":"p2_h6s1_mbr_partitions","title":"MBR Disk Partition Types (Primary, Extended, Logical Partition Relationship)","pdf_page":267}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Formatting-Mounting-and-fstab","exercise_slug":"04-Exercise-Mkfs-Mount-and-Fstab-Persistence-Lab","lecture":{"title":"Drive Formatting (`mkfs`), Mounting (`mount`/`umount`) & `/etc/fstab` Persistence","duration_mins":7,"pdf_ref":"Ch.05, pp. 277–282, 318","objectives":["Format partitions using `mkfs -t ext4 <device>` (Official Ch.05 Quiz Q2!) or `mkfs.ext4` and understand `mkfs` options (`-V`, `-t`, `-c`, `-l`)","Distinguish temporary mounting (`mount <device> <dir>`) vs. permanent boot-time mounting via `/etc/fstab`","Configure all 6 fields of `/etc/fstab` (`<file system> <dir> <type> <options> <dump> <pass>`) and fsck `pass` priorities (`0`, `1`, `2`)"],"content_markdown":"### 1. Drive Formatting with `mkfs`\nFormatting initializes a partition with a file system structure (deleting existing data on that partition).\n* **Viewing Supported File System Formatters:** Type `mkfs` and press **`Tab` twice** to list all `mkfs.*` utilities (`mkfs.ext4`, `mkfs.xfs`, `mkfs.vfat`, etc.).\n* **Syntax & Equivalent Forms (Official Ch.05 Quiz Q2!):**\n  ```bash\n  mkfs [-V] [-t fstype] [fs-options] filesys [blocks]\n  # Example 1 (Ch.05 Quiz Q2 exact answer):\n  mkfs -t ext4 /dev/hdb6\n  # Example 2:\n  mkfs.ext4 /dev/sdb2\n  ```\n* **Key `mkfs` Options (Ch.05, p.279):**\n  * **`-t <fstype>`:** Specifies the file system type to build. (**Note:** If `-t` is omitted in plain `mkfs`, the default value for Linux is **`ext2`**!).\n  * **`-c`:** Checks the partition for **bad blocks** before building the file system.\n  * **`-l bad_blocks_file`:** Reads bad block information from `bad_blocks_file`.\n  * **`-V`:** Produces verbose output.\n<!-- PDF_FIGS_START -->\n![Drive Formatting Workflow (View, Format mkfs, Confirm) (Official Reference: p. 278)](./assets/images/p2_h6s2_drive_formatting.png)\n*Figure: Drive Formatting Workflow (View, Format mkfs, Confirm) (Official Reference: p. 278)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Temporary Mounting (`mount`) vs. Permanent Mounting (`/etc/fstab`)\nBecause Linux follows the *\"Everything is a file\"* design, a formatted partition must be linked to a directory (**mount point**, such as `/mnt`, `/media`, or a custom directory) before it can be accessed:\n* **Temporary Mounting:**\n  ```bash\n  mount /dev/sda5 /test\n  ```\n  Mounts `/dev/sda5` to `/test` immediately, **but becomes invalid after the system is restarted!**\n* **Permanent Mounting (`/etc/fstab`):**\n  The OS automatically reads **`/etc/fstab`** at boot (or when **`mount -a`** is run) and mounts all listed file systems.\n<!-- PDF_FIGS_START -->\n![Temporary Mounting (mount) vs Permanent Mounting (/etc/fstab) (Official Reference: p. 280)](./assets/images/p2_h6s2_drive_mounting.png)\n*Figure: Temporary Mounting (mount) vs Permanent Mounting (/etc/fstab) (Official Reference: p. 280)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. The 6 Fields of `/etc/fstab`\n```text\n<file system>   <dir>   <type>   <options>           <dump>  <pass>\ntmpfs           /tmp    tmpfs    nodev,nosuid        0       0\n/dev/sda1       /       ext4     defaults,noatime    0       1\n/dev/sda2       none    swap     defaults            0       0\n```\n1. **`<file system>`:** Device path (`/dev/sda1`) or `UUID=...` (from `blkid`).\n2. **`<dir>`:** Mount point directory (`/` or `none` for `swap`).\n3. **`<type>`:** File system type (`ext4`, `xfs`, `swap`, `tmpfs`).\n4. **`<options>`:** Mount parameters: **`defaults`**, **`auto`** (mounts at boot or `mount -a`), **`ro`** / **`rw`**, **`user`** / **`nouser`**, **`dev`** / **`nodev`**, **`suid`** / **`nosuid`**, **`sync`** / **`async`**, **`noatime`** / **`nodiratime`** (skips updating inode access times to improve performance).\n5. **`<dump>`:** Backup flag (`0` = do not back up with `dump` [recommended]; `1` = back up).\n6. **`<pass>` (`fsck` check priority):**\n   * **`0`**: Device is **not checked** by `fsck`.\n   * **`1`**: **Root partition (`/`)** — checked first!\n   * **`2`**: **Other devices** that need to be checked after root.","key_takeaways":["Format a partition into ext4 using 'mkfs -t ext4 /dev/hdb6' (Official Ch.05 Quiz Q2) or 'mkfs.ext4 /dev/hdb6'; there is NO 'format' or 'makefile' command in Linux!","Mounting with 'mount /dev/sda5 /test' is temporary and lost on reboot; configure permanent mounting in /etc/fstab.","The 6 fields of /etc/fstab are: <file system> <dir> <type> <options> <dump> <pass>, where <pass> is 1 for root (/), 2 for other checked partitions, and 0 for no fsck check."],"exam_traps":["EXAM TRAP (Official Ch.05 Quiz Q2): 'Which of the following commands can be used to format the /dev/hdb6 partition?' -> A. mkfs -t ext4 /dev/hdb6. Distractors like 'format -t ext4' or 'makefile -t ext4' do not exist!","EXAM TRAP: If you run 'mkfs /dev/sdb1' WITHOUT '-t fstype', mkfs defaults to 'ext2' (whereas openEuler's default OS file system is 'ext4'). Always specify '-t ext4' or 'mkfs.ext4'!"],"content_html":"<h3>1. Drive Formatting with <code class=\"inline-code\">mkfs<\/code><\/h3>\n<p>Formatting initializes a partition with a file system structure (deleting existing data on that partition).<\/p>\n<ul class=\"md-list\">\n<li><strong>Viewing Supported File System Formatters:<\/strong> Type <code class=\"inline-code\">mkfs<\/code> and press <strong><code class=\"inline-code\">Tab<\/code> twice<\/strong> to list all <code class=\"inline-code\">mkfs.*<\/code> utilities (<code class=\"inline-code\">mkfs.ext4<\/code>, <code class=\"inline-code\">mkfs.xfs<\/code>, <code class=\"inline-code\">mkfs.vfat<\/code>, etc.).<\/li>\n<li><strong>Syntax &amp; Equivalent Forms (Official Ch.05 Quiz Q2!):<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  mkfs [-V] [-t fstype] [fs-options] filesys [blocks]\n  # Example 1 (Ch.05 Quiz Q2 exact answer):\n  mkfs -t ext4 /dev/hdb6\n  # Example 2:\n  mkfs.ext4 /dev/sdb2<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Key <code class=\"inline-code\">mkfs<\/code> Options (Ch.05, p.279):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-t &lt;fstype&gt;<\/code>:<\/strong> Specifies the file system type to build. (<strong>Note:<\/strong> If <code class=\"inline-code\">-t<\/code> is omitted in plain <code class=\"inline-code\">mkfs<\/code>, the default value for Linux is <strong><code class=\"inline-code\">ext2<\/code><\/strong>!).<\/li>\n<li><strong><code class=\"inline-code\">-c<\/code>:<\/strong> Checks the partition for <strong>bad blocks<\/strong> before building the file system.<\/li>\n<li><strong><code class=\"inline-code\">-l bad_blocks_file<\/code>:<\/strong> Reads bad block information from <code class=\"inline-code\">bad_blocks_file<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">-V<\/code>:<\/strong> Produces verbose output.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s2_drive_formatting.png\" alt=\"Drive Formatting Workflow (View, Format mkfs, Confirm)\" data-caption=\"Drive Formatting Workflow (View, Format mkfs, Confirm) (Official Reference: p. 278)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Drive Formatting Workflow (View, Format mkfs, Confirm)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 278 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Temporary Mounting (<code class=\"inline-code\">mount<\/code>) vs. Permanent Mounting (<code class=\"inline-code\">/etc/fstab<\/code>)<\/h3>\n<p>Because Linux follows the <em>\"Everything is a file\"<\/em> design, a formatted partition must be linked to a directory (<strong>mount point<\/strong>, such as <code class=\"inline-code\">/mnt<\/code>, <code class=\"inline-code\">/media<\/code>, or a custom directory) before it can be accessed:<\/p>\n<ul class=\"md-list\">\n<li><strong>Temporary Mounting:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  mount /dev/sda5 /test<\/code><\/pre><\/div>\n<p>Mounts <code class=\"inline-code\">/dev/sda5<\/code> to <code class=\"inline-code\">/test<\/code> immediately, <strong>but becomes invalid after the system is restarted!<\/strong><\/p>\n<ul class=\"md-list\">\n<li><strong>Permanent Mounting (<code class=\"inline-code\">/etc/fstab<\/code>):<\/strong><\/li>\n<\/ul>\n<p>The OS automatically reads <strong><code class=\"inline-code\">/etc/fstab<\/code><\/strong> at boot (or when <strong><code class=\"inline-code\">mount -a<\/code><\/strong> is run) and mounts all listed file systems.<\/p>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s2_drive_mounting.png\" alt=\"Temporary Mounting (mount) vs Permanent Mounting (/etc/fstab)\" data-caption=\"Temporary Mounting (mount) vs Permanent Mounting (/etc/fstab) (Official Reference: p. 280)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Temporary Mounting (mount) vs Permanent Mounting (/etc/fstab)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 280 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. The 6 Fields of <code class=\"inline-code\">/etc/fstab<\/code><\/h3>\n<div class=\"code-block\"><div class=\"code-header\"><span>TEXT<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>&lt;file system&gt;   &lt;dir&gt;   &lt;type&gt;   &lt;options&gt;           &lt;dump&gt;  &lt;pass&gt;\ntmpfs           /tmp    tmpfs    nodev,nosuid        0       0\n/dev/sda1       /       ext4     defaults,noatime    0       1\n/dev/sda2       none    swap     defaults            0       0<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">&lt;file system&gt;<\/code>:<\/strong> Device path (<code class=\"inline-code\">/dev/sda1<\/code>) or <code class=\"inline-code\">UUID=...<\/code> (from <code class=\"inline-code\">blkid<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">&lt;dir&gt;<\/code>:<\/strong> Mount point directory (<code class=\"inline-code\">/<\/code> or <code class=\"inline-code\">none<\/code> for <code class=\"inline-code\">swap<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">&lt;type&gt;<\/code>:<\/strong> File system type (<code class=\"inline-code\">ext4<\/code>, <code class=\"inline-code\">xfs<\/code>, <code class=\"inline-code\">swap<\/code>, <code class=\"inline-code\">tmpfs<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">&lt;options&gt;<\/code>:<\/strong> Mount parameters: <strong><code class=\"inline-code\">defaults<\/code><\/strong>, <strong><code class=\"inline-code\">auto<\/code><\/strong> (mounts at boot or <code class=\"inline-code\">mount -a<\/code>), <strong><code class=\"inline-code\">ro<\/code><\/strong> / <strong><code class=\"inline-code\">rw<\/code><\/strong>, <strong><code class=\"inline-code\">user<\/code><\/strong> / <strong><code class=\"inline-code\">nouser<\/code><\/strong>, <strong><code class=\"inline-code\">dev<\/code><\/strong> / <strong><code class=\"inline-code\">nodev<\/code><\/strong>, <strong><code class=\"inline-code\">suid<\/code><\/strong> / <strong><code class=\"inline-code\">nosuid<\/code><\/strong>, <strong><code class=\"inline-code\">sync<\/code><\/strong> / <strong><code class=\"inline-code\">async<\/code><\/strong>, <strong><code class=\"inline-code\">noatime<\/code><\/strong> / <strong><code class=\"inline-code\">nodiratime<\/code><\/strong> (skips updating inode access times to improve performance).<\/li>\n<li><strong><code class=\"inline-code\">&lt;dump&gt;<\/code>:<\/strong> Backup flag (<code class=\"inline-code\">0<\/code> = do not back up with <code class=\"inline-code\">dump<\/code> [recommended]; <code class=\"inline-code\">1<\/code> = back up).<\/li>\n<li><strong><code class=\"inline-code\">&lt;pass&gt;<\/code> (<code class=\"inline-code\">fsck<\/code> check priority):<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">0<\/code><\/strong>: Device is <strong>not checked<\/strong> by <code class=\"inline-code\">fsck<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">1<\/code><\/strong>: <strong>Root partition (<code class=\"inline-code\">/<\/code>)<\/strong> — checked first!<\/li>\n<li><strong><code class=\"inline-code\">2<\/code><\/strong>: <strong>Other devices<\/strong> that need to be checked after root.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Formatting `/dev/hdb6` (`mkfs -t ext4`), Temporary Mount & `/etc/fstab` Entry","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You have created logical partition `/dev/hdb6` on an openEuler server. Format `/dev/hdb6` with the `ext4` file system using `mkfs -t ext4`, mount it temporarily to `/test`, and append a persistent mount entry to `/etc/fstab`.","instructions":["Step 1: Format `/dev/hdb6` as `ext4` using `mkfs -t ext4 /dev/hdb6` (exact Ch.05 Quiz Q2 syntax).","Step 2: Create mount point `/test` and mount `/dev/hdb6` to `/test` using `mount /dev/hdb6 /test`.","Step 3: Append the 6-field persistent entry `/dev/hdb6 /test ext4 defaults 0 2` to `/etc/fstab`."],"starter_code":"# Step 1: Format /dev/hdb6 with ext4 using mkfs -t\n<mkfs_command>\n\n# Step 2: Mount /dev/hdb6 to /test\nmkdir -p /test\n<mount_command>\n\n# Step 3: Append persistent mount entry to /etc/fstab\necho \"<fstab_6_fields>\" >> /etc/fstab","solution_code":"# Step 1: Format /dev/hdb6 with ext4 using mkfs -t\nmkfs -t ext4 /dev/hdb6\n\n# Step 2: Mount /dev/hdb6 to /test\nmkdir -p /test\nmount /dev/hdb6 /test\n\n# Step 3: Append persistent mount entry to /etc/fstab\necho \"/dev/hdb6 /test ext4 defaults 0 2\" >> /etc/fstab","hints":["Use `mkfs -t ext4 /dev/hdb6` (Ch.05 Quiz Q2).","Use `mount /dev/hdb6 /test`.","Use `/dev/hdb6 /test ext4 defaults 0 2` inside the echo statement."],"validation_checks":[{"step":1,"description":"Format /dev/hdb6 using mkfs -t ext4 /dev/hdb6","required_any":["mkfs -t ext4 /dev/hdb6","mkfs.ext4 /dev/hdb6"],"feedback_fail":"Use 'mkfs -t ext4 /dev/hdb6' to format the partition."},{"step":2,"description":"Mount /dev/hdb6 to /test","required_any":["mount /dev/hdb6 /test"],"feedback_fail":"Use 'mount /dev/hdb6 /test' to mount the partition."},{"step":3,"description":"Append persistent entry to /etc/fstab","required_any":["/dev/hdb6 /test ext4 defaults"],"feedback_fail":"Include '/dev/hdb6 /test ext4 defaults 0 2' in /etc/fstab."}],"simulated_output":"mke2fs 1.46.5 (30-Dec-2021)\nCreating filesystem with 262144 4k blocks and 65536 inodes\nAllocating group tables: done\nWriting superblocks and filesystem accounting information: done\n\n[root@openEuler ~]# df -Th /test\nFilesystem     Type  Size  Used Avail Use% Mounted on\n/dev/hdb6      ext4  976M  2.6M  907M   1% /test\n[root@openEuler ~]# tail -n 1 /etc/fstab\n/dev/hdb6 /test ext4 defaults 0 2","quiz_questions":[{"id":"h6_s2_q1","type":"single","question":"[Official Ch.05 Quiz Q2] Which of the following commands can be used to format the `/dev/hdb6` partition?","options":["A. mkfs -t ext4 /dev/hdb6","B. format -t ext4 /dev/hdb6","C. format /dev/hdb6","D. makefile -t ext4 /dev/hdb6"],"answer":"A","explanation":"Official Ch.05 Quiz Q2 (p.318): A (`mkfs -t ext4 /dev/hdb6`). `mkfs` ('make file system') creates a Linux file system on a partition; `format` and `makefile` are invalid."},{"id":"h6_s2_q2","type":"single","question":"In `/etc/fstab`, what do the values `0`, `1`, and `2` in the 6th field (`<pass>`) specify?","options":["A. Read-only (0), Read-write (1), Swap (2)","B. The `fsck` check priority: `0` = do not check, `1` = root partition (`/`) checked first, `2` = other devices to be checked","C. The number of backup copies created by `dump`","D. The partition type: `0` = primary, `1` = extended, `2` = logical"],"answer":"B","explanation":"Per Ch.05 (p.282), the `pass` field sets the `fsck` check priority: `1` for the root partition, `2` for other devices that need to be checked, and `0` for devices that will not be checked by `fsck`."},{"id":"h6_s2_q3","type":"multiple","question":"Which of the following statements about `mkfs`, `mount`, and `/etc/fstab` are TRUE?","options":["A. If `-t fstype` is omitted in the `mkfs` command, the default file system type for Linux `mkfs` is `ext2`.","B. `mkfs -c` checks the partition for bad blocks before building the file system.","C. Mounting a partition with `mount /dev/sda5 /test` is temporary and becomes invalid after a system restart.","D. In `/etc/fstab`, the `noatime` option improves performance by not updating inode access records."],"answer":"ABCD","explanation":"Per Ch.05 (pp.279–282), all four statements are explicitly documented in the official training material."}],"reference_figures":[{"slug":"p2_h6s2_drive_mounting","title":"Temporary Mounting (mount) vs Permanent Mounting (/etc/fstab)","pdf_page":280}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-LVM-Creation-Expansion-and-Reduction","exercise_slug":"06-Exercise-LVM-PV-VG-LV-and-Resize-Lab","lecture":{"title":"Logical Volume Management (LVM) — PV, VG, LV Creation, Online Expansion & Reduction","duration_mins":7,"pdf_ref":"Ch.05, pp. 283–300","objectives":["Define the 5 core LVM components: Physical Volume (PV), Volume Group (VG), Physical Extent (PE — default 4 MB), Logical Extent (LE), and Logical Volume (LV)","Create and inspect PVs, VGs, and LVs using `pvcreate`/`pvs`, `vgcreate`/`vgs`, and `lvcreate`/`lvs`","Execute online LV capacity expansion (`lvextend` + `resize2fs`) and safe offline LV capacity reduction (`umount` -> `e2fsck -f` -> `resize2fs` -> `lvreduce` -> `mount`)"],"content_markdown":"### 1. LVM Architecture & Core Components\n**Logical Volume Management (LVM)** is a logical storage layer built **above physical disks/partitions and below file systems**, enabling dynamic capacity expansion/reduction, disk striping, mirroring, and snapshots.\n\n| Component | Definition & Key Rules (Ch.05, pp. 284–285) |\n| :--- | :--- |\n| **PV (Physical Volume)** | Underlying physical drive (`/dev/sdd`) or partition (`/dev/sdb1`, partition ID changed from `83` to **`8e`** in `fdisk`). |\n| **VG (Volume Group)** | Storage pool combining **one or more PVs** (`VG` shields underlying PV boundaries). |\n| **PE (Physical Extent)** | **Smallest unit that can be addressed by LVM.** Default size is **4 MB**. **Once a VG's PE size is determined (`vgcreate -s`), it CANNOT be changed**, and all PVs in the same VG share the same PE size. |\n| **LE (Logical Extent)** | **Minimum storage unit that can be allocated** in LVM. In the same VG, **LE size = PE size** (1:1 correspondence). |\n| **LV (Logical Volume)** | Logical partition carved out of a VG, formatted with `mkfs` and mounted for end users. |\n<!-- PDF_FIGS_START -->\n![LVM Physical Structure: PE to Physical Volume (PV), VG and LV (Official Reference: p. 285)](./assets/images/p2_h6s3_lvm_principles.png)\n*Figure: LVM Physical Structure: PE to Physical Volume (PV), VG and LV (Official Reference: p. 285)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. LVM Creation & Management Commands\n1. **PV Commands:**\n   * Create: **`pvcreate /dev/hda{6,7,8,9}`** (options: `-f` force, `-u` UUID, `-y` answer yes).\n   * Inspect/Manage: **`pvs`** (concise overview), **`pvdisplay`** (detailed), **`pvscan`**, **`pvchange`**, **`pvresize`**, **`pvremove`**, **`pvmove`**, **`pvck`**.\n2. **VG Commands:**\n   * Create: **`vgcreate [-l max_LV] [-p max_PV] [-s PE_size] vg1000 /dev/sdb1 /dev/sdb2`**\n   * Inspect/Manage: **`vgs`**, **`vgdisplay`**, **`vgscan`**, **`vgextend`** (add PVs to VG), **`vgreduce`** (remove PV from VG after moving data), **`vgremove`**, **`vgrename`**, **`vgchange`**, **`vgcfgbackup`**, **`vgcfgrestore`**, **`vgimport`**, **`vgexport`**.\n3. **LV Commands:**\n   * Create: **`lvcreate -L 200M [-n lvname] vg1000`** (`-L` specifies size in K/M/G/T; **`-l`** specifies number of **LEs**; **`-s`** creates a snapshot).\n   * Inspect/Manage: **`lvs`**, **`lvdisplay [-m]`**, **`lvscan`**, **`lvextend [--resizefs]`**, **`lvreduce`**, **`lvresize`**, **`lvremove`**, **`lvrename`**, **`lvconvert`**.\n<!-- PDF_FIGS_START -->\n![LVM Layer Creation Stack (Drive, Partition, PV, VG, LV) (Official Reference: p. 288)](./assets/images/p2_h6s3_lvm_creation_layers.png)\n*Figure: LVM Layer Creation Stack (Drive, Partition, PV, VG, LV) (Official Reference: p. 288)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Expanding vs. Reducing LV Capacity (High-Yield Exam Workflows!)\n* **Expanding LV Capacity (Supports ONLINE expansion without unmounting! — Ch.05, p.298):**\n  1. Run **`vgs`** to check if the VG has sufficient free space (if not, run `vgextend`).\n  2. Expand the LV: **`lvextend -L +SIZE lv_device`** (or `lvresize -L +200M /dev/vg1000/lvol0`).\n  3. Resize the `ext4` file system online: **`resize2fs device`** (or use `lvextend --resizefs` in newer versions).\n* **Reducing LV Capacity (Risky — MUST unmount and shrink file system FIRST! — Ch.05, p.299):**\n  1. Determine target size and verify enough space for existing data.\n  2. Unmount the file system (**`umount`**) and run a forcible check (**`e2fsck -f device`**).\n  3. **Shrink the file system first:** **`resize2fs device TARGET_SIZE`**.\n  4. **Shrink the LV second:** **`lvreduce -L TARGET_SIZE lv_device`**.\n  5. **Mount** the file system again (**`mount`**).\n<!-- PDF_FIGS_START -->\n![Online Expanding Logical Volume Capacity Workflow (vgs, lvextend, resize2fs) (Official Reference: p. 298)](./assets/images/p2_h6s3_lvm_expand.png)\n*Figure: Online Expanding Logical Volume Capacity Workflow (vgs, lvextend, resize2fs) (Official Reference: p. 298)*\n\n![Offline Reducing Logical Volume Safe Workflow (umount, e2fsck, resize2fs, lvreduce, mount) (Official Reference: p. 299)](./assets/images/p2_h6s3_lvm_reduce.png)\n*Figure: Offline Reducing Logical Volume Safe Workflow (umount, e2fsck, resize2fs, lvreduce, mount) (Official Reference: p. 299)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["The default Physical Extent (PE) size in LVM is 4 MB; once set during vgcreate, a VG's PE size cannot be changed, and LE size equals PE size within the same VG.","In lvcreate/lvresize, uppercase '-L' specifies capacity in bytes (K/M/G/T), whereas lowercase '-l' specifies the number of Logical Extents (LEs).","LV expansion can be done ONLINE without unmounting (vgs -> lvextend -> resize2fs), whereas LV reduction MUST be done OFFLINE in strict order: umount -> e2fsck -f -> resize2fs -> lvreduce -> mount."],"exam_traps":["EXAM TRAP: Never run 'lvreduce' BEFORE 'resize2fs'! When expanding, you expand the LV first (lvextend) and the file system second (resize2fs); when reducing, you MUST unmount, check (e2fsck -f), shrink the file system first (resize2fs), and shrink the LV second (lvreduce)!","EXAM TRAP: When using fdisk to create a partition for LVM, the default partition ID is 83 (Linux); change it to 8e (Linux LVM) before running pvcreate."],"content_html":"<h3>1. LVM Architecture &amp; Core Components<\/h3>\n<p><strong>Logical Volume Management (LVM)<\/strong> is a logical storage layer built <strong>above physical disks/partitions and below file systems<\/strong>, enabling dynamic capacity expansion/reduction, disk striping, mirroring, and snapshots.<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Component<\/th><th>Definition &amp; Key Rules (Ch.05, pp. 284–285)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>PV (Physical Volume)<\/strong><\/td><td>Underlying physical drive (<code class=\"inline-code\">/dev/sdd<\/code>) or partition (<code class=\"inline-code\">/dev/sdb1<\/code>, partition ID changed from <code class=\"inline-code\">83<\/code> to <strong><code class=\"inline-code\">8e<\/code><\/strong> in <code class=\"inline-code\">fdisk<\/code>).<\/td><\/tr>\n<tr><td><strong>VG (Volume Group)<\/strong><\/td><td>Storage pool combining <strong>one or more PVs<\/strong> (<code class=\"inline-code\">VG<\/code> shields underlying PV boundaries).<\/td><\/tr>\n<tr><td><strong>PE (Physical Extent)<\/strong><\/td><td><strong>Smallest unit that can be addressed by LVM.<\/strong> Default size is <strong>4 MB<\/strong>. <strong>Once a VG's PE size is determined (<code class=\"inline-code\">vgcreate -s<\/code>), it CANNOT be changed<\/strong>, and all PVs in the same VG share the same PE size.<\/td><\/tr>\n<tr><td><strong>LE (Logical Extent)<\/strong><\/td><td><strong>Minimum storage unit that can be allocated<\/strong> in LVM. In the same VG, <strong>LE size = PE size<\/strong> (1:1 correspondence).<\/td><\/tr>\n<tr><td><strong>LV (Logical Volume)<\/strong><\/td><td>Logical partition carved out of a VG, formatted with <code class=\"inline-code\">mkfs<\/code> and mounted for end users.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s3_lvm_principles.png\" alt=\"LVM Physical Structure: PE to Physical Volume (PV), VG and LV\" data-caption=\"LVM Physical Structure: PE to Physical Volume (PV), VG and LV (Official Reference: p. 285)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>LVM Physical Structure: PE to Physical Volume (PV), VG and LV<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 285 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. LVM Creation &amp; Management Commands<\/h3>\n<ol class=\"md-list\">\n<li><strong>PV Commands:<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Create: <strong><code class=\"inline-code\">pvcreate /dev/hda{6,7,8,9}<\/code><\/strong> (options: <code class=\"inline-code\">-f<\/code> force, <code class=\"inline-code\">-u<\/code> UUID, <code class=\"inline-code\">-y<\/code> answer yes).<\/li>\n<li>Inspect/Manage: <strong><code class=\"inline-code\">pvs<\/code><\/strong> (concise overview), <strong><code class=\"inline-code\">pvdisplay<\/code><\/strong> (detailed), <strong><code class=\"inline-code\">pvscan<\/code><\/strong>, <strong><code class=\"inline-code\">pvchange<\/code><\/strong>, <strong><code class=\"inline-code\">pvresize<\/code><\/strong>, <strong><code class=\"inline-code\">pvremove<\/code><\/strong>, <strong><code class=\"inline-code\">pvmove<\/code><\/strong>, <strong><code class=\"inline-code\">pvck<\/code><\/strong>.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>VG Commands:<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Create: <strong><code class=\"inline-code\">vgcreate [-l max_LV] [-p max_PV] [-s PE_size] vg1000 /dev/sdb1 /dev/sdb2<\/code><\/strong><\/li>\n<li>Inspect/Manage: <strong><code class=\"inline-code\">vgs<\/code><\/strong>, <strong><code class=\"inline-code\">vgdisplay<\/code><\/strong>, <strong><code class=\"inline-code\">vgscan<\/code><\/strong>, <strong><code class=\"inline-code\">vgextend<\/code><\/strong> (add PVs to VG), <strong><code class=\"inline-code\">vgreduce<\/code><\/strong> (remove PV from VG after moving data), <strong><code class=\"inline-code\">vgremove<\/code><\/strong>, <strong><code class=\"inline-code\">vgrename<\/code><\/strong>, <strong><code class=\"inline-code\">vgchange<\/code><\/strong>, <strong><code class=\"inline-code\">vgcfgbackup<\/code><\/strong>, <strong><code class=\"inline-code\">vgcfgrestore<\/code><\/strong>, <strong><code class=\"inline-code\">vgimport<\/code><\/strong>, <strong><code class=\"inline-code\">vgexport<\/code><\/strong>.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>LV Commands:<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Create: <strong><code class=\"inline-code\">lvcreate -L 200M [-n lvname] vg1000<\/code><\/strong> (<code class=\"inline-code\">-L<\/code> specifies size in K/M/G/T; <strong><code class=\"inline-code\">-l<\/code><\/strong> specifies number of <strong>LEs<\/strong>; <strong><code class=\"inline-code\">-s<\/code><\/strong> creates a snapshot).<\/li>\n<li>Inspect/Manage: <strong><code class=\"inline-code\">lvs<\/code><\/strong>, <strong><code class=\"inline-code\">lvdisplay [-m]<\/code><\/strong>, <strong><code class=\"inline-code\">lvscan<\/code><\/strong>, <strong><code class=\"inline-code\">lvextend [--resizefs]<\/code><\/strong>, <strong><code class=\"inline-code\">lvreduce<\/code><\/strong>, <strong><code class=\"inline-code\">lvresize<\/code><\/strong>, <strong><code class=\"inline-code\">lvremove<\/code><\/strong>, <strong><code class=\"inline-code\">lvrename<\/code><\/strong>, <strong><code class=\"inline-code\">lvconvert<\/code><\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s3_lvm_creation_layers.png\" alt=\"LVM Layer Creation Stack (Drive, Partition, PV, VG, LV)\" data-caption=\"LVM Layer Creation Stack (Drive, Partition, PV, VG, LV) (Official Reference: p. 288)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>LVM Layer Creation Stack (Drive, Partition, PV, VG, LV)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 288 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Expanding vs. Reducing LV Capacity (High-Yield Exam Workflows!)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Expanding LV Capacity (Supports ONLINE expansion without unmounting! — Ch.05, p.298):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Run <strong><code class=\"inline-code\">vgs<\/code><\/strong> to check if the VG has sufficient free space (if not, run <code class=\"inline-code\">vgextend<\/code>).<\/li>\n<li>Expand the LV: <strong><code class=\"inline-code\">lvextend -L +SIZE lv_device<\/code><\/strong> (or <code class=\"inline-code\">lvresize -L +200M /dev/vg1000/lvol0<\/code>).<\/li>\n<li>Resize the <code class=\"inline-code\">ext4<\/code> file system online: <strong><code class=\"inline-code\">resize2fs device<\/code><\/strong> (or use <code class=\"inline-code\">lvextend --resizefs<\/code> in newer versions).<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Reducing LV Capacity (Risky — MUST unmount and shrink file system FIRST! — Ch.05, p.299):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Determine target size and verify enough space for existing data.<\/li>\n<li>Unmount the file system (<strong><code class=\"inline-code\">umount<\/code><\/strong>) and run a forcible check (<strong><code class=\"inline-code\">e2fsck -f device<\/code><\/strong>).<\/li>\n<li><strong>Shrink the file system first:<\/strong> <strong><code class=\"inline-code\">resize2fs device TARGET_SIZE<\/code><\/strong>.<\/li>\n<li><strong>Shrink the LV second:<\/strong> <strong><code class=\"inline-code\">lvreduce -L TARGET_SIZE lv_device<\/code><\/strong>.<\/li>\n<li><strong>Mount<\/strong> the file system again (<strong><code class=\"inline-code\">mount<\/code><\/strong>).<\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s3_lvm_expand.png\" alt=\"Online Expanding Logical Volume Capacity Workflow (vgs, lvextend, resize2fs)\" data-caption=\"Online Expanding Logical Volume Capacity Workflow (vgs, lvextend, resize2fs) (Official Reference: p. 298)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Online Expanding Logical Volume Capacity Workflow (vgs, lvextend, resize2fs)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 298 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s3_lvm_reduce.png\" alt=\"Offline Reducing Logical Volume Safe Workflow (umount, e2fsck, resize2fs, lvreduce, mount)\" data-caption=\"Offline Reducing Logical Volume Safe Workflow (umount, e2fsck, resize2fs, lvreduce, mount) (Official Reference: p. 299)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Offline Reducing Logical Volume Safe Workflow (umount, e2fsck, resize2fs, lvreduce, mount)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 299 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Creating PV, VG, LV and Performing Online Capacity Expansion","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are building an LVM storage pool on openEuler using `/dev/sdb1` and `/dev/sdb2` (following Ch.05 pp. 290–300). Initialize both partitions as PVs, combine them into volume group `vg1000`, create a `200M` logical volume on `vg1000`, and expand `/dev/vg1000/lvol0` online by `+200M` followed by `resize2fs`.","instructions":["Step 1: Initialize `/dev/sdb1` and `/dev/sdb2` as PVs (`pvcreate /dev/sdb1 /dev/sdb2`) and create volume group `vg1000` (`vgcreate vg1000 /dev/sdb1 /dev/sdb2`).","Step 2: Create a `200M` logical volume on `vg1000` using `lvcreate -L 200M vg1000`.","Step 3: Expand `/dev/vg1000/lvol0` by `+200M` using `lvextend -L +200M /dev/vg1000/lvol0` (or `lvresize`) and resize the file system using `resize2fs /dev/vg1000/lvol0`."],"starter_code":"# Step 1: Create PVs and combine them into VG vg1000\n<pvcreate_command>\n<vgcreate_command>\n\n# Step 2: Create a 200M LV on vg1000\n<lvcreate_command>\n\n# Step 3: Expand /dev/vg1000/lvol0 by +200M and resize the file system\n<lvextend_command>\n<resize2fs_command>","solution_code":"# Step 1: Create PVs and combine them into VG vg1000\npvcreate /dev/sdb1 /dev/sdb2\nvgcreate vg1000 /dev/sdb1 /dev/sdb2\n\n# Step 2: Create a 200M LV on vg1000\nlvcreate -L 200M vg1000\n\n# Step 3: Expand /dev/vg1000/lvol0 by +200M and resize the file system\nlvextend -L +200M /dev/vg1000/lvol0\nresize2fs /dev/vg1000/lvol0","hints":["Use `pvcreate /dev/sdb1 /dev/sdb2` and `vgcreate vg1000 /dev/sdb1 /dev/sdb2` (Ch.05 p.293).","Use `lvcreate -L 200M vg1000` (Ch.05 p.296).","Use `lvextend -L +200M /dev/vg1000/lvol0` and `resize2fs /dev/vg1000/lvol0` (Ch.05 p.298)."],"validation_checks":[{"step":1,"description":"Create PVs and VG vg1000","required_any":["vgcreate vg1000 /dev/sdb1 /dev/sdb2"],"feedback_fail":"Include 'pvcreate /dev/sdb1 /dev/sdb2' and 'vgcreate vg1000 /dev/sdb1 /dev/sdb2'."},{"step":2,"description":"Create 200M LV on vg1000 with lvcreate -L 200M","required_any":["lvcreate -l 200m vg1000"],"feedback_fail":"Use 'lvcreate -L 200M vg1000'."},{"step":3,"description":"Expand LV by +200M and run resize2fs","required_any":["resize2fs /dev/vg1000/lvol0"],"feedback_fail":"Include 'lvextend -L +200M /dev/vg1000/lvol0' and 'resize2fs /dev/vg1000/lvol0'."}],"simulated_output":"  Physical volume \"/dev/sdb1\" successfully created.\n  Physical volume \"/dev/sdb2\" successfully created.\n  Volume group \"vg1000\" successfully created\n  Logical volume \"lvol0\" created.\n  Size of logical volume vg1000/lvol0 changed from 200.00 MiB (50 extents) to 400.00 MiB (100 extents).\n  Logical volume vg1000/lvol0 successfully resized.\nresize2fs 1.46.5 (30-Dec-2021)\nThe filesystem on /dev/vg1000/lvol0 is now 409600 (1k) blocks long.","quiz_questions":[{"id":"h6_s3_q1","type":"single","question":"In openEuler Logical Volume Management (LVM), what is the smallest unit that can be addressed by LVM, and what is its default size?","options":["A. Physical Volume (PV); default 1 GB","B. Physical Extent (PE); default 4 MB","C. Volume Group (VG); default 100 MB","D. Inode Block; default 512 Bytes"],"answer":"B","explanation":"Per Ch.05 (p.284), a Physical Extent (PE) with a unique number is the smallest unit that can be addressed by LVM, with 4 MB being the default size."},{"id":"h6_s3_q2","type":"single","question":"What is the correct 5-step sequence for safely REDUCING the capacity of an `ext4` Logical Volume in openEuler?","options":["A. `lvreduce` -> `resize2fs` -> `e2fsck -f` -> `umount` -> `mount`","B. Determine target size -> `umount` and `e2fsck -f` -> `resize2fs` -> `lvreduce` -> `mount`","C. `lvextend` -> `resize2fs` -> `mount -a`","D. `vgreduce` -> `pvremove` -> `lvreduce` (online without unmounting)"],"answer":"B","explanation":"Per Ch.05 (p.299), the 5 steps to reduce LV capacity are: (1) Determine target size, (2) Run `umount` and `e2fsck -f`, (3) Run `resize2fs` to shrink the file system, (4) Run `lvreduce` to shrink the LV, and (5) Mount the file system again."},{"id":"h6_s3_q3","type":"multiple","question":"Which of the following statements about LVM commands and options are TRUE?","options":["A. In `lvcreate`, `-L` specifies the size of the LV (in K, M, G, or T), whereas `-l` specifies the number of Logical Extents (LEs).","B. `vgextend` adds one or more PVs to an existing VG, while `vgreduce` removes a PV from a VG.","C. Expanding an LV (`vgs` -> `lvextend -L +SIZE` -> `resize2fs`) supports online capacity expansion without unmounting.","D. `lvcreate -s` creates an LV snapshot."],"answer":"ABCD","explanation":"Per Ch.05 (pp.294–298), all four statements accurately reflect LVM management in openEuler."}],"reference_figures":[{"slug":"p2_h6s3_lvm_principles","title":"LVM Physical Structure: PE to Physical Volume (PV), VG and LV","pdf_page":285},{"slug":"p2_h6s3_lvm_creation_layers","title":"LVM Layer Creation Stack (Drive, Partition, PV, VG, LV)","pdf_page":288}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Network-Configuration-and-Diagnosis","exercise_slug":"08-Exercise-Nmcli-Hostname-and-Network-Diagnosis-Lab","lecture":{"title":"openEuler Network Configuration (`ip`, `nmcli`, `nmtui`, `ifcfg`) & Diagnosis (`ping`, `tracepath`, `ss`)","duration_mins":7,"pdf_ref":"Ch.05, pp. 301–318","objectives":["Query IP addresses, routes, DNS, and hostnames (`ip addr`, `ifconfig`, `ip route show`, `route -n` [temporary — Ch.05 Quiz Q1!], `/etc/resolv.conf`, `hostnamectl`)","Decode Predictable Network Interface Names (`en`, `wl`, `ww` + `p`, `o`, `s`, `x`, `u`) and legacy `/etc/sysconfig/network-scripts/ifcfg-*` files","Configure connections and static routes with `nmcli` and `nmtui`, and diagnose networks with `ping`, `tracepath`, and `ss`"],"content_markdown":"### 1. Querying Network State, Routes & Hostnames\n* **Viewing IP, Gateway & DNS:**\n  * **IP & Mask:** **`ip addr`** or **`ifconfig`**.\n  * **Gateway & Routing Table:** **`ip route show`** or **`route -n`**.\n  * **Official Ch.05 Quiz Q1 Rule:** The **`route`** command can view or configure host route information, **but routes configured via the `route` command are TEMPORARY and do NOT remain valid permanently after a reboot!**\n  * **DNS Server:** **`cat /etc/resolv.conf`** (generated by NetworkManager; `nameserver <IP>`).\n* **Setting the System Hostname (3 Methods — Ch.05, p.305):**\n  1. **Temporary (until next restart):** **`hostname new-name`**\n  2. **Permanent (CLI):** **`hostnamectl set-hostname new-name`** (or via `nmtui`)\n  3. **Permanent (Config file):** Write the new name to **`/etc/hostname`**.\n\n---\n\n### 2. Predictable NIC Naming Rules & `ifcfg-*` Files\nopenEuler uses `systemd/udev` **Predictable Network Interface Names** (e.g., **`enp0s3`**, **`wlp3s0`**; falls back to **`eth0`** if rules cannot be applied):\n* **2-Letter Type Prefix:** **`en`** (Ethernet), **`wl`** (Wireless LAN / Wi-Fi), **`ww`** (WWAN).\n* **Location/Hardware Scheme:**\n  * **`p<bus>s<slot>`**: PCIe slot (`p0s3`).\n  * **`o<index>`**: Onboard integrated NIC (`o1`).\n  * **`s<slot>[f<func>]`**: Hot-swappable slot / SR-IOV virtual function (`s0f1`).\n  * **`x<MAC>`**: MAC address-based (`x78e7d1`).\n  * **`u<port>`**: USB device port (`u2`).\n* **Config Files (`/etc/sysconfig/network-scripts/ifcfg-*`):** Key parameters: `TYPE`, `BOOTPROTO` (`dhcp`/`static`/`none`), `ONBOOT` (`yes`/`no`), `IPADDR`, `NETMASK`, `GATEWAY`, `BROADCAST`, `HWADDR`/`MACADDR`, `PEERDNS`, `DNS1`/`DNS2`, `USERCTL`, `NAME`, `DEVICE`. *(Note: In kernel 3.x+, Huawei recommends **`nmcli`** or **`nmtui`** over manual `ifcfg-*` editing).*\n<!-- PDF_FIGS_START -->\n![Predictable NIC Naming Rules Breakdown (enp0s3) (Official Reference: p. 306)](./assets/images/p2_h6s4_nic_naming_rules.png)\n*Figure: Predictable NIC Naming Rules Breakdown (enp0s3) (Official Reference: p. 306)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. NetworkManager (`nmcli` & `nmtui`) and Network Diagnosis (`ping`, `tracepath`, `ss`)\n* **Device vs. Connection:** A **Device** is a physical/virtual NIC (`enp4s0`); a **Connection** is a configuration profile. **A device can have multiple connections, but only ONE connection can be active on a device at a time!**\n* **`nmcli` Core Commands:**\n  * Show connections: **`nmcli connection show [--active]`**\n  * Add DHCP connection: **`nmcli connection add con-name 'Demo' type Ethernet ifname enp4s0`**\n  * Add Static IP connection: `nmcli con add type ethernet con-name my-eth ifname eth0 ip4 192.168.1.100/24 gw4 192.168.1.1`\n  * Modify DNS / Add secondary DNS (`+`/`-`): **`nmcli con mod 'Demo' ipv4.dns 192.168.100.250`** and **`nmcli con mod \"Euler\" +ipv4.dns 114.114.114.114`**\n  * Configure Static Route: **`nmcli connection modify enp3s0 +ipv4.routes \"192.168.122.0/24 10.10.10.1\"`** (or interactive `nmcli con edit`)\n  * Activate connection (required for modifications to take effect!): **`nmcli connection up 'Demo'`**\n* **`nmtui`:** Text-based curses GUI with 3 main actions: *Edit a connection*, *Activate a connection*, *Set system hostname*.\n* **Network Diagnosis Utilities:**\n  * **`ping`**: Sends **ICMP echo request** packets and waits for echo replies to test connectivity.\n  * **`tracepath`**: Traces packet path from source to destination: (1) hop count/routing nodes, (2) RTT of each hop, (3) **detects Path MTU (`pmtu`) changes**.\n  * **`ss` (Socket Statistics, e.g., `ss -talnp`)**: Displays network sockets/listening ports; **works faster than `netstat` by accessing data directly from the kernel!**\n<!-- PDF_FIGS_START -->\n![Creating Network Connections in nmtui Text UI (Official Reference: p. 315)](./assets/images/p2_h6s4_nmtui_gui.png)\n*Figure: Creating Network Connections in nmtui Text UI (Official Reference: p. 315)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["Routes configured with the 'route' command are temporary and NOT permanent (Ch.05 Quiz Q1); use 'nmcli connection modify <con> +ipv4.routes \"<subnet> <gw>\"' for persistent static routes.","In NetworkManager, a device (NIC) can have multiple connections (profiles), but only ONE connection can be active at a time; run 'nmcli con up <name>' after modifying a connection.","tracepath measures hop count, per-hop RTT, and Path MTU (pmtu); ss (-talnp) is faster than netstat because it queries socket data directly from the kernel."],"exam_traps":["EXAM TRAP (Official Ch.05 Quiz Q1): '(True or false) The route command can view or configure host route information. Configured route information will remain valid permanently.' -> False (F)!","EXAM TRAP: 'hostname new-name' only changes the hostname temporarily until reboot; use 'hostnamectl set-hostname new-name' or edit '/etc/hostname' for a permanent change."],"content_html":"<h3>1. Querying Network State, Routes &amp; Hostnames<\/h3>\n<ul class=\"md-list\">\n<li><strong>Viewing IP, Gateway &amp; DNS:<\/strong><\/li>\n<li><strong>IP &amp; Mask:<\/strong> <strong><code class=\"inline-code\">ip addr<\/code><\/strong> or <strong><code class=\"inline-code\">ifconfig<\/code><\/strong>.<\/li>\n<li><strong>Gateway &amp; Routing Table:<\/strong> <strong><code class=\"inline-code\">ip route show<\/code><\/strong> or <strong><code class=\"inline-code\">route -n<\/code><\/strong>.<\/li>\n<li><strong>Official Ch.05 Quiz Q1 Rule:<\/strong> The <strong><code class=\"inline-code\">route<\/code><\/strong> command can view or configure host route information, <strong>but routes configured via the <code class=\"inline-code\">route<\/code> command are TEMPORARY and do NOT remain valid permanently after a reboot!<\/strong><\/li>\n<li><strong>DNS Server:<\/strong> <strong><code class=\"inline-code\">cat /etc/resolv.conf<\/code><\/strong> (generated by NetworkManager; <code class=\"inline-code\">nameserver &lt;IP&gt;<\/code>).<\/li>\n<li><strong>Setting the System Hostname (3 Methods — Ch.05, p.305):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Temporary (until next restart):<\/strong> <strong><code class=\"inline-code\">hostname new-name<\/code><\/strong><\/li>\n<li><strong>Permanent (CLI):<\/strong> <strong><code class=\"inline-code\">hostnamectl set-hostname new-name<\/code><\/strong> (or via <code class=\"inline-code\">nmtui<\/code>)<\/li>\n<li><strong>Permanent (Config file):<\/strong> Write the new name to <strong><code class=\"inline-code\">/etc/hostname<\/code><\/strong>.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Predictable NIC Naming Rules &amp; <code class=\"inline-code\">ifcfg-*<\/code> Files<\/h3>\n<p>openEuler uses <code class=\"inline-code\">systemd/udev<\/code> <strong>Predictable Network Interface Names<\/strong> (e.g., <strong><code class=\"inline-code\">enp0s3<\/code><\/strong>, <strong><code class=\"inline-code\">wlp3s0<\/code><\/strong>; falls back to <strong><code class=\"inline-code\">eth0<\/code><\/strong> if rules cannot be applied):<\/p>\n<ul class=\"md-list\">\n<li><strong>2-Letter Type Prefix:<\/strong> <strong><code class=\"inline-code\">en<\/code><\/strong> (Ethernet), <strong><code class=\"inline-code\">wl<\/code><\/strong> (Wireless LAN / Wi-Fi), <strong><code class=\"inline-code\">ww<\/code><\/strong> (WWAN).<\/li>\n<li><strong>Location/Hardware Scheme:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">p&lt;bus&gt;s&lt;slot&gt;<\/code><\/strong>: PCIe slot (<code class=\"inline-code\">p0s3<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">o&lt;index&gt;<\/code><\/strong>: Onboard integrated NIC (<code class=\"inline-code\">o1<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">s&lt;slot&gt;[f&lt;func&gt;]<\/code><\/strong>: Hot-swappable slot / SR-IOV virtual function (<code class=\"inline-code\">s0f1<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">x&lt;MAC&gt;<\/code><\/strong>: MAC address-based (<code class=\"inline-code\">x78e7d1<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">u&lt;port&gt;<\/code><\/strong>: USB device port (<code class=\"inline-code\">u2<\/code>).<\/li>\n<li>**Config Files (<code class=\"inline-code\">/etc/sysconfig/network-scripts/ifcfg-*<\/code>):** Key parameters: <code class=\"inline-code\">TYPE<\/code>, <code class=\"inline-code\">BOOTPROTO<\/code> (<code class=\"inline-code\">dhcp<\/code>/<code class=\"inline-code\">static<\/code>/<code class=\"inline-code\">none<\/code>), <code class=\"inline-code\">ONBOOT<\/code> (<code class=\"inline-code\">yes<\/code>/<code class=\"inline-code\">no<\/code>), <code class=\"inline-code\">IPADDR<\/code>, <code class=\"inline-code\">NETMASK<\/code>, <code class=\"inline-code\">GATEWAY<\/code>, <code class=\"inline-code\">BROADCAST<\/code>, <code class=\"inline-code\">HWADDR<\/code>/<code class=\"inline-code\">MACADDR<\/code>, <code class=\"inline-code\">PEERDNS<\/code>, <code class=\"inline-code\">DNS1<\/code>/<code class=\"inline-code\">DNS2<\/code>, <code class=\"inline-code\">USERCTL<\/code>, <code class=\"inline-code\">NAME<\/code>, <code class=\"inline-code\">DEVICE<\/code>. <em>(Note: In kernel 3.x+, Huawei recommends <strong><code class=\"inline-code\">nmcli<\/code><\/strong> or <strong><code class=\"inline-code\">nmtui<\/code><\/strong> over manual <code class=\"inline-code\">ifcfg-<\/em><\/code> editing).*<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s4_nic_naming_rules.png\" alt=\"Predictable NIC Naming Rules Breakdown (enp0s3)\" data-caption=\"Predictable NIC Naming Rules Breakdown (enp0s3) (Official Reference: p. 306)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Predictable NIC Naming Rules Breakdown (enp0s3)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 306 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. NetworkManager (<code class=\"inline-code\">nmcli<\/code> &amp; <code class=\"inline-code\">nmtui<\/code>) and Network Diagnosis (<code class=\"inline-code\">ping<\/code>, <code class=\"inline-code\">tracepath<\/code>, <code class=\"inline-code\">ss<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Device vs. Connection:<\/strong> A <strong>Device<\/strong> is a physical/virtual NIC (<code class=\"inline-code\">enp4s0<\/code>); a <strong>Connection<\/strong> is a configuration profile. <strong>A device can have multiple connections, but only ONE connection can be active on a device at a time!<\/strong><\/li>\n<li><strong><code class=\"inline-code\">nmcli<\/code> Core Commands:<\/strong><\/li>\n<li>Show connections: <strong><code class=\"inline-code\">nmcli connection show [--active]<\/code><\/strong><\/li>\n<li>Add DHCP connection: <strong><code class=\"inline-code\">nmcli connection add con-name 'Demo' type Ethernet ifname enp4s0<\/code><\/strong><\/li>\n<li>Add Static IP connection: <code class=\"inline-code\">nmcli con add type ethernet con-name my-eth ifname eth0 ip4 192.168.1.100/24 gw4 192.168.1.1<\/code><\/li>\n<li>Modify DNS / Add secondary DNS (<code class=\"inline-code\">+<\/code>/<code class=\"inline-code\">-<\/code>): <strong><code class=\"inline-code\">nmcli con mod 'Demo' ipv4.dns 192.168.100.250<\/code><\/strong> and <strong><code class=\"inline-code\">nmcli con mod \"Euler\" +ipv4.dns 114.114.114.114<\/code><\/strong><\/li>\n<li>Configure Static Route: <strong><code class=\"inline-code\">nmcli connection modify enp3s0 +ipv4.routes \"192.168.122.0/24 10.10.10.1\"<\/code><\/strong> (or interactive <code class=\"inline-code\">nmcli con edit<\/code>)<\/li>\n<li>Activate connection (required for modifications to take effect!): <strong><code class=\"inline-code\">nmcli connection up 'Demo'<\/code><\/strong><\/li>\n<li><strong><code class=\"inline-code\">nmtui<\/code>:<\/strong> Text-based curses GUI with 3 main actions: <em>Edit a connection<\/em>, <em>Activate a connection<\/em>, <em>Set system hostname<\/em>.<\/li>\n<li><strong>Network Diagnosis Utilities:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">ping<\/code><\/strong>: Sends <strong>ICMP echo request<\/strong> packets and waits for echo replies to test connectivity.<\/li>\n<li><strong><code class=\"inline-code\">tracepath<\/code><\/strong>: Traces packet path from source to destination: (1) hop count/routing nodes, (2) RTT of each hop, (3) <strong>detects Path MTU (<code class=\"inline-code\">pmtu<\/code>) changes<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">ss<\/code> (Socket Statistics, e.g., <code class=\"inline-code\">ss -talnp<\/code>)<\/strong>: Displays network sockets/listening ports; <strong>works faster than <code class=\"inline-code\">netstat<\/code> by accessing data directly from the kernel!<\/strong><\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h6s4_nmtui_gui.png\" alt=\"Creating Network Connections in nmtui Text UI\" data-caption=\"Creating Network Connections in nmtui Text UI (Official Reference: p. 315)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Creating Network Connections in nmtui Text UI<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 315 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Configuring Connections & Static Routes with `nmcli`, Hostname & `ss` Diagnostics","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are configuring networking on an openEuler server (following Ch.05 pp. 305–317). Permanently set the hostname to `openEuler01`, create and activate an Ethernet connection named `Demo` on `enp4s0`, add a static route `192.168.122.0/24` via `10.10.10.1` to `enp3s0`, and inspect listening TCP sockets with `ss -talnp`.","instructions":["Step 1: Set the permanent hostname to `openEuler01` using `hostnamectl set-hostname openEuler01`.","Step 2: Create connection `Demo` on `enp4s0` (`nmcli connection add con-name 'Demo' type Ethernet ifname enp4s0`) and activate it (`nmcli connection up 'Demo'`).","Step 3: Add a static route on `enp3s0` (`nmcli connection modify enp3s0 +ipv4.routes \"192.168.122.0/24 10.10.10.1\"`) and check listening sockets with `ss -talnp`."],"starter_code":"# Step 1: Permanently set hostname to openEuler01\n<hostnamectl_command>\n\n# Step 2: Create connection 'Demo' on enp4s0 and bring it up\n<nmcli_add_command>\n<nmcli_up_command>\n\n# Step 3: Add static route to enp3s0 and inspect listening TCP sockets\n<nmcli_route_command>\n<ss_command>","solution_code":"# Step 1: Permanently set hostname to openEuler01\nhostnamectl set-hostname openEuler01\n\n# Step 2: Create connection 'Demo' on enp4s0 and bring it up\nnmcli connection add con-name 'Demo' type Ethernet ifname enp4s0\nnmcli connection up 'Demo'\n\n# Step 3: Add static route to enp3s0 and inspect listening TCP sockets\nnmcli connection modify enp3s0 +ipv4.routes \"192.168.122.0/24 10.10.10.1\"\nss -talnp","hints":["Use `hostnamectl set-hostname openEuler01` (Ch.05 p.305).","Use `nmcli connection add con-name 'Demo' type Ethernet ifname enp4s0` and `nmcli connection up 'Demo'` (Ch.05 p.310).","Use `nmcli connection modify enp3s0 +ipv4.routes \"192.168.122.0/24 10.10.10.1\"` (Ch.05 p.313) and `ss -talnp` (Ch.05 p.317)."],"validation_checks":[{"step":1,"description":"Set permanent hostname with hostnamectl set-hostname","required_any":["hostnamectl set-hostname openeuler01"],"feedback_fail":"Use 'hostnamectl set-hostname openEuler01'."},{"step":2,"description":"Create and activate connection Demo on enp4s0 with nmcli","required_any":["nmcli connection up","nmcli con up"],"feedback_fail":"Include 'nmcli connection add con-name Demo type Ethernet ifname enp4s0' and 'nmcli connection up Demo'."},{"step":3,"description":"Add static route with +ipv4.routes and check sockets with ss -talnp","required_any":["+ipv4.routes","ss -talnp"],"feedback_fail":"Include 'nmcli connection modify enp3s0 +ipv4.routes \"192.168.122.0/24 10.10.10.1\"' and 'ss -talnp'."}],"simulated_output":"Connection 'Demo' (789c723b-cd60-4515-99fc-5074b6f38498) successfully added.\nConnection successfully activated (D-Bus active path: /org/freedesktop/NetworkManager/ActiveConnection/16)\n\nState   Recv-Q  Send-Q  Local Address:Port   Peer Address:Port  Process\nLISTEN  0       128     0.0.0.0:22           0.0.0.0:*          users:((\"sshd\",pid=60,fd=3))\nLISTEN  0       128     [::]:22              [::]:*             users:((\"sshd\",pid=60,fd=4))","quiz_questions":[{"id":"h6_s4_q1","type":"tf","question":"[Official Ch.05 Quiz Q1] The `route` command can view or configure host route information. Configured route information will remain valid permanently.","options":["A. True","B. False"],"answer":"B","explanation":"Official Ch.05 Quiz Q1 (p.318): False (`F`). Route information configured via the `route` command is temporary and lost upon system reboot."},{"id":"h6_s4_q2","type":"single","question":"In openEuler's Predictable Network Interface Naming scheme (`systemd/udev`), what does the interface name `enp0s3` signify?","options":["A. `en` = Wireless LAN; `p0` = USB port 0; `s3` = Serial port 3","B. `en` = Ethernet; `p0` = PCIe bus 0; `s3` = slot 3","C. `en` = WWAN; `p0` = Onboard port 0; `s3` = MAC address 3","D. `en` = Virtual bridge; `p0s3` = VLAN ID 3"],"answer":"B","explanation":"Per Ch.05 (p.306), `en` indicates Ethernet (`wl` is Wireless, `ww` is WWAN), `p` indicates PCIe bus, and `s` indicates slot number (`0s3` = slot 3 on bus 0)."},{"id":"h6_s4_q3","type":"multiple","question":"Which of the following statements about NetworkManager (`nmcli`/`nmtui`) and network diagnostic tools in openEuler are TRUE?","options":["A. In NetworkManager, a device (network interface) may have multiple connections, but only one connection can remain active at a time.","B. After modifying an active connection with `nmcli con mod`, you must run `nmcli con up <name>` for the changes to take effect.","C. `tracepath` displays hop counts, measures RTT per hop, and detects changes in the Maximum Transmission Unit (MTU) along a path.","D. `ss` (Socket Statistics) works faster than `netstat` by accessing data directly from the kernel."],"answer":"ABCD","explanation":"Per Ch.05 (pp.308–317), all four statements are explicitly taught in the official HCIA-openEuler V2.0 material."}],"reference_figures":[{"slug":"p2_h6s4_nic_naming_rules","title":"Predictable NIC Naming Rules Breakdown (enp0s3)","pdf_page":306}]}}]},{"hour_number":7,"folder_name":"Hour-07-Shell-Scripting-and-Automation","title":"Shell Scripting, Variables, Control Flow & Automation","chapter_ref":"Chapter 06 (pp. 321–381)","duration_mins":60,"overview":"Master
