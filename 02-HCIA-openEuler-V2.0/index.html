{"id":"h2_s1_q2","type":"single","question":"In the Linux `man` manual classification (Sections 1 to 9), what do Sections 1, 5, and 8 represent respectively?","options":["A. 1: Kernel routines; 5: Games; 8: C library functions","B. 1: User shell commands/programs; 5: File formats and conventions; 8: System management commands (root only)","C. 1: System calls; 5: Device files in /dev; 8: Miscellaneous macros","D. 1: File formats; 5: User commands; 8: Games"],"answer":"B","explanation":"Per Ch.03 (p.65), Section 1 covers commands/programs operated by users in the shell; Section 5 covers file formats and conventions; Section 8 covers system management commands (applicable only to the root user)."},{"id":"h2_s1_q3","type":"multiple","question":"Which of the following statements about `shutdown`, `halt`, and `/var/log/wtmp` are TRUE?","options":["A. `shutdown -h` powers off the server after it is shut down, while `shutdown -r` restarts the server.","B. `shutdown -k` sends a warning signal to each user without actually shutting down the computer.","C. `/var/log/wtmp` is a binary file that records user login times and durations, queried via the `last` command.","D. `halt -w` immediately cuts power to the motherboard without writing to `/var/log/wtmp`."],"answer":"ABC","explanation":"Per Ch.03 (pp.73–77), A, B, and C are true. Option D is false because `halt -w` only writes a record to `/var/log/wtmp` without restarting or shutting down the system."}],"reference_figures":[]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Linux-Directory-Structure-and-Navigation","exercise_slug":"04-Exercise-FHS-and-Directory-Navigation-Lab","lecture":{"title":"Linux File Directory Structure (FHS) & Path Navigation (`pwd`, `cd`, `ls`)","duration_mins":7,"pdf_ref":"Ch.03, pp. 79–87","objectives":["Apply the Linux philosophy 'Everything is a file' and identify the purpose of every standard root subdirectory (`/bin`, `/sbin`, `/etc`, `/proc`, `/var`, `/dev`, `/usr`, `/opt`, etc.)","Differentiate absolute paths vs. relative paths and logical (`pwd -L`) vs. physical (`pwd -P`) working directories","Use `cd` (`~`, `-`, `..`, `.`) and `ls` (`-a`, `-A`, `-l`, `-h`, `-t`, `-S`, `-r`, `-d`, `-R`) with precision"],"content_markdown":"### 1. \"Everything is a File\" & Linux Directory Tree (`/`)\nIn Linux, **everything is a file**—regular files, directories, character/block devices, sockets, pipes, and processes can all be read/written via `fopen()`, `fclose()`, `fwrite()`, and `fread()`. All directories branch from the single **root directory (`/`)**:\n\n| Directory | Purpose & Key Characteristics |\n| :--- | :--- |\n| **`/bin` & `/sbin`** | `/bin` stores frequently used binary commands for all users; `/sbin` (`s` = superuser) stores system management programs for `root`. |\n| **`/boot`** | Core files for starting the Linux OS (kernel images, bootloader, initramfs). |\n| **`/dev`** | External hardware device files (disks, terminals) accessed just like files. |\n| **`/etc`** | All system and service configuration files and subdirectories. |\n| **`/home` & `/root`** | `/home` contains regular users' home directories (`/home/username`); `/root` is the superuser's home directory. |\n| **`/lib` & `/lib64`** | Essential dynamic link libraries (similar to Windows `.dll` files) and 64-bit shared libraries. |\n| **`/media` & `/mnt`** | `/media` auto-mounts removable media (USB drives, CD-ROMs); `/mnt` is for temporary manual mounts. |\n| **`/opt`** | Optional/additional third-party application software (empty by default). |\n| **`/proc`** | **Virtual directory that is a mapping of system memory (RAM).** Access it directly to obtain real-time kernel/process information. |\n| **`/run`** | Temporary file system storing runtime data since boot (cleared on reboot; `/var/run` points to `/run`). |\n| **`/srv` & `/sys`** | `/srv` stores service data; `/sys` mounts `sysfs` (introduced in Linux 2.6 kernel for hardware/kernel objects). |\n| **`/tmp` & `/var`** | `/tmp` stores temporary files; `/var` stores constantly expanding variable files such as **logs (`/var/log`)**. |\n| **`/usr`** | User applications and files (similar to Windows `Program Files`). |\n<!-- PDF_FIGS_START -->\n![Linux Root File Directory Structure Tree (FHS) (Official Reference: p. 79)](./assets/images/p2_h2s2_linux_fhs_tree.png)\n*Figure: Linux Root File Directory Structure Tree (FHS) (Official Reference: p. 79)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Paths, `pwd`, and `cd`\n* **Absolute Path:** Always starts from the root slash **`/`** (e.g., `/var/log/messages`).\n* **Relative Path:** Relative to the current working directory (e.g., `../lib` or `./script.sh`).\n* **`pwd` (Print Working Directory):**\n  * **`pwd -L` (Default):** Prints the **logical** path (preserves symbolic link names from `PWD`).\n  * **`pwd -P`:** Prints the **physical** directory path, resolving all symbolic links!\n* **`cd` (Change Directory):**\n  * `cd` or `cd ~`: Goes to the current user's home directory.\n  * `cd ..`: Moves to the upper-level (parent) directory.\n  * `cd .`: Stays in the current directory.\n  * **`cd -`**: Switches back to the **previous working directory** (fast toggle between two directories).\n\n---\n\n### 3. Listing Files and Directories with `ls`\n* **`-l`**: Long format (file type, permissions, hard links, owner, group, size, timestamp, name).\n* **`-a` vs. `-A`**: **`-a`** shows all hidden files (starting with `.`) **including `.` and `..`**; **`-A`** shows hidden files **excluding `.` and `..`**.\n* **`-h`**: Human-readable sizes (`4.0K`, `12M`, `2G`).\n* **`-d`**: Displays information about the **directory itself** (`ls -ld /etc`) rather than its contents.\n* **Sorting flags:** **`-t`** (sort by modification/creation time), **`-S`** (sort by size), **`-X`** (sort by extension), **`-r`** (reverse sort order), **`-R`** (recursive listing).","key_takeaways":["/proc is a virtual directory that maps system memory (RAM); /var stores constantly growing files like logs; /etc stores configuration files.","pwd -L (default) prints the logical symlink path, whereas pwd -P resolves symlinks and prints the true physical directory path.","ls -a includes '.' and '..', whereas ls -A excludes them; ls -ld <dir> inspects the directory itself rather than listing its contents."],"exam_traps":["EXAM TRAP: Do not confuse /root (the home directory of the superuser) with / (the root directory of the entire Linux filesystem tree)!","EXAM TRAP: If /tmp/link3 points to /tmp/d1 and you run 'cd /tmp/link3', 'pwd' (or 'pwd -L') outputs '/tmp/link3', whereas 'pwd -P' outputs '/tmp/d1'."],"content_html":"<h3>1. \"Everything is a File\" &amp; Linux Directory Tree (<code class=\"inline-code\">/<\/code>)<\/h3>\n<p>In Linux, <strong>everything is a file<\/strong>—regular files, directories, character/block devices, sockets, pipes, and processes can all be read/written via <code class=\"inline-code\">fopen()<\/code>, <code class=\"inline-code\">fclose()<\/code>, <code class=\"inline-code\">fwrite()<\/code>, and <code class=\"inline-code\">fread()<\/code>. All directories branch from the single <strong>root directory (<code class=\"inline-code\">/<\/code>)<\/strong>:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Directory<\/th><th>Purpose &amp; Key Characteristics<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">/bin<\/code> &amp; <code class=\"inline-code\">/sbin<\/code><\/strong><\/td><td><code class=\"inline-code\">/bin<\/code> stores frequently used binary commands for all users; <code class=\"inline-code\">/sbin<\/code> (<code class=\"inline-code\">s<\/code> = superuser) stores system management programs for <code class=\"inline-code\">root<\/code>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/boot<\/code><\/strong><\/td><td>Core files for starting the Linux OS (kernel images, bootloader, initramfs).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/dev<\/code><\/strong><\/td><td>External hardware device files (disks, terminals) accessed just like files.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/etc<\/code><\/strong><\/td><td>All system and service configuration files and subdirectories.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/home<\/code> &amp; <code class=\"inline-code\">/root<\/code><\/strong><\/td><td><code class=\"inline-code\">/home<\/code> contains regular users' home directories (<code class=\"inline-code\">/home/username<\/code>); <code class=\"inline-code\">/root<\/code> is the superuser's home directory.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/lib<\/code> &amp; <code class=\"inline-code\">/lib64<\/code><\/strong><\/td><td>Essential dynamic link libraries (similar to Windows <code class=\"inline-code\">.dll<\/code> files) and 64-bit shared libraries.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/media<\/code> &amp; <code class=\"inline-code\">/mnt<\/code><\/strong><\/td><td><code class=\"inline-code\">/media<\/code> auto-mounts removable media (USB drives, CD-ROMs); <code class=\"inline-code\">/mnt<\/code> is for temporary manual mounts.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/opt<\/code><\/strong><\/td><td>Optional/additional third-party application software (empty by default).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/proc<\/code><\/strong><\/td><td><strong>Virtual directory that is a mapping of system memory (RAM).<\/strong> Access it directly to obtain real-time kernel/process information.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/run<\/code><\/strong><\/td><td>Temporary file system storing runtime data since boot (cleared on reboot; <code class=\"inline-code\">/var/run<\/code> points to <code class=\"inline-code\">/run<\/code>).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/srv<\/code> &amp; <code class=\"inline-code\">/sys<\/code><\/strong><\/td><td><code class=\"inline-code\">/srv<\/code> stores service data; <code class=\"inline-code\">/sys<\/code> mounts <code class=\"inline-code\">sysfs<\/code> (introduced in Linux 2.6 kernel for hardware/kernel objects).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/tmp<\/code> &amp; <code class=\"inline-code\">/var<\/code><\/strong><\/td><td><code class=\"inline-code\">/tmp<\/code> stores temporary files; <code class=\"inline-code\">/var<\/code> stores constantly expanding variable files such as <strong>logs (<code class=\"inline-code\">/var/log<\/code>)<\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/usr<\/code><\/strong><\/td><td>User applications and files (similar to Windows <code class=\"inline-code\">Program Files<\/code>).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h2s2_linux_fhs_tree.png\" alt=\"Linux Root File Directory Structure Tree (FHS)\" data-caption=\"Linux Root File Directory Structure Tree (FHS) (Official Reference: p. 79)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Linux Root File Directory Structure Tree (FHS)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 79 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Paths, <code class=\"inline-code\">pwd<\/code>, and <code class=\"inline-code\">cd<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong>Absolute Path:<\/strong> Always starts from the root slash <strong><code class=\"inline-code\">/<\/code><\/strong> (e.g., <code class=\"inline-code\">/var/log/messages<\/code>).<\/li>\n<li><strong>Relative Path:<\/strong> Relative to the current working directory (e.g., <code class=\"inline-code\">../lib<\/code> or <code class=\"inline-code\">./script.sh<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">pwd<\/code> (Print Working Directory):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">pwd -L<\/code> (Default):<\/strong> Prints the <strong>logical<\/strong> path (preserves symbolic link names from <code class=\"inline-code\">PWD<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">pwd -P<\/code>:<\/strong> Prints the <strong>physical<\/strong> directory path, resolving all symbolic links!<\/li>\n<li><strong><code class=\"inline-code\">cd<\/code> (Change Directory):<\/strong><\/li>\n<li><code class=\"inline-code\">cd<\/code> or <code class=\"inline-code\">cd ~<\/code>: Goes to the current user's home directory.<\/li>\n<li><code class=\"inline-code\">cd ..<\/code>: Moves to the upper-level (parent) directory.<\/li>\n<li><code class=\"inline-code\">cd .<\/code>: Stays in the current directory.<\/li>\n<li><strong><code class=\"inline-code\">cd -<\/code><\/strong>: Switches back to the <strong>previous working directory<\/strong> (fast toggle between two directories).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Listing Files and Directories with <code class=\"inline-code\">ls<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">-l<\/code><\/strong>: Long format (file type, permissions, hard links, owner, group, size, timestamp, name).<\/li>\n<li><strong><code class=\"inline-code\">-a<\/code> vs. <code class=\"inline-code\">-A<\/code><\/strong>: <strong><code class=\"inline-code\">-a<\/code><\/strong> shows all hidden files (starting with <code class=\"inline-code\">.<\/code>) <strong>including <code class=\"inline-code\">.<\/code> and <code class=\"inline-code\">..<\/code><\/strong>; <strong><code class=\"inline-code\">-A<\/code><\/strong> shows hidden files <strong>excluding <code class=\"inline-code\">.<\/code> and <code class=\"inline-code\">..<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">-h<\/code><\/strong>: Human-readable sizes (<code class=\"inline-code\">4.0K<\/code>, <code class=\"inline-code\">12M<\/code>, <code class=\"inline-code\">2G<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-d<\/code><\/strong>: Displays information about the <strong>directory itself<\/strong> (<code class=\"inline-code\">ls -ld /etc<\/code>) rather than its contents.<\/li>\n<li><strong>Sorting flags:<\/strong> <strong><code class=\"inline-code\">-t<\/code><\/strong> (sort by modification/creation time), <strong><code class=\"inline-code\">-S<\/code><\/strong> (sort by size), <strong><code class=\"inline-code\">-X<\/code><\/strong> (sort by extension), <strong><code class=\"inline-code\">-r<\/code><\/strong> (reverse sort order), <strong><code class=\"inline-code\">-R<\/code><\/strong> (recursive listing).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Resolving Symlink Paths (`pwd -P`) and Time-Sorted Directory Listings","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are auditing `/var/run` (which is a symbolic link to `/run`) and `/usr/local`. Navigate into `/var/run`, print both its logical and physical paths, list all files (including hidden files, human-readable sizes, sorted by time) in `/usr/local`, and inspect the `/etc` directory entry itself without listing its contents.","instructions":["Step 1: Change directory to `/var/run` using `cd /var/run` and display the physical path (resolving symlinks) using `pwd -P`.","Step 2: List all files (including hidden files) in `/usr/local` in human-readable long format sorted by time using `ls -ahlt /usr/local`.","Step 3: Display the attributes of the `/etc` directory itself (not its contents) using `ls -ld /etc`."],"starter_code":"# Step 1: Enter /var/run and print the physical path without symlinks\ncd /var/run\n<pwd_physical_command>\n\n# Step 2: List all files in /usr/local with human-readable sizes sorted by time\n<ls_usr_local_command>\n\n# Step 3: Display the directory entry of /etc itself\n<ls_etc_dir_itself_command>","solution_code":"# Step 1: Enter /var/run and print the physical path without symlinks\ncd /var/run\npwd -P\n\n# Step 2: List all files in /usr/local with human-readable sizes sorted by time\nls -ahlt /usr/local\n\n# Step 3: Display the directory entry of /etc itself\nls -ld /etc","hints":["Use `pwd -P` to print the physical working directory without symbolic links.","Combine `-a`, `-h`, `-l`, and `-t` in `ls -ahlt /usr/local`.","Use `ls -ld /etc` so `-d` shows the directory entry itself."],"validation_checks":[{"step":1,"description":"Print physical working directory with pwd -P","required_any":["pwd -p"],"feedback_fail":"Use 'pwd -P' to output the physical path without symbolic links."},{"step":2,"description":"List /usr/local with -a, -h, -l, -t","required_any":["ls -ahlt","ls -alht","ls -lhat","ls -laht","ls /usr/local/ -ahlt"],"feedback_fail":"Use 'ls -ahlt /usr/local' to list all files in human-readable format sorted by time."},{"step":3,"description":"Inspect /etc directory entry itself with ls -ld","required_any":["ls -ld /etc","ls -dl /etc"],"feedback_fail":"Use 'ls -ld /etc' to view the attributes of the /etc directory itself."}],"simulated_output":"/run\n\ntotal 48K\ndrwxr-xr-x. 12 root root 4.0K Jul 28 14:00 ..\ndrwxr-xr-x. 12 root root 4.0K Jul 28 14:00 .\ndrwxr-xr-x.  5 root root 4.0K Jul 28 14:00 share\ndrwxr-xr-x.  2 root root 4.0K Mar 24 05:34 bin\ndrwxr-xr-x.  2 root root 4.0K Mar 24 05:34 etc\ndrwxr-xr-x.  2 root root 4.0K Mar 24 05:34 lib64\ndrwxr-xr-x.  2 root root 4.0K Mar 24 05:34 sbin\n\ndrwxr-xr-x. 102 root root 8192 Nov 17 09:00 /etc","quiz_questions":[{"id":"h2_s2_q1","type":"single","question":"Which directory in the Linux file system hierarchy is a virtual directory that serves as a mapping of system memory (RAM)?","options":["A. /opt","B. /proc","C. /var","D. /boot"],"answer":"B","explanation":"Per Ch.03 (p.80), `/proc` is a virtual directory which is the mapping of the system memory. You can obtain system information by directly accessing this directory."},{"id":"h2_s2_q2","type":"single","question":"If `/tmp/link3` is a chain of symbolic links pointing to the physical directory `/tmp/d1`, and you run `cd /tmp/link3`, what is the output of `pwd -P`?","options":["A. /tmp/link3","B. /tmp/d1","C. /tmp","D. An error message"],"answer":"B","explanation":"Per Ch.03 (p.83), `pwd -L` (default) outputs the symbolic link connection path (`/tmp/link3`), whereas `pwd -P` resolves all symlinks and outputs the physical path (`/tmp/d1`)."},{"id":"h2_s2_q3","type":"multiple","question":"Which of the following statements about the `ls` and `cd` commands are TRUE?","options":["A. `ls -A` displays hidden files and directories, excluding `.` and `..`.","B. `ls -ld /etc` displays the directory attributes of `/etc` itself rather than the files inside `/etc`.","C. `cd -` switches the working directory to the previous directory.","D. `ls -t` sorts files alphabetically by file extension."],"answer":"ABC","explanation":"Per Ch.03 (pp.84–86), A, B, and C are correct. Option D is false because `ls -t` sorts by creation/modification time (`ls -X` sorts by extension)."}],"reference_figures":[{"slug":"p2_h2s2_linux_fhs_tree","title":"Linux Root File Directory Structure Tree (FHS)","pdf_page":79}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-File-and-Directory-Creation-Copy-Move-Delete","exercise_slug":"06-Exercise-File-Lifecycle-Operations-Lab","lecture":{"title":"File & Directory Creation, Copying, Moving & Deletion (`mkdir`, `touch`, `cp`, `mv`, `rm`)","duration_mins":7,"pdf_ref":"Ch.03, pp. 88–95","objectives":["Create single, multiple, and nested parent directories with `mkdir [-p] [-v]` and manage file timestamps with `touch [-a|-m|-t|-d]`","Copy files and directories while preserving attributes or creating links with `cp [-a|-p|-r|-l|-s|-i]`","Move/rename files with `mv [-b|-f|-i|-u]` and safely remove files/directories with `rm [-r|-f|-i|-v]`"],"content_markdown":"### 1. Creating Directories (`mkdir`) and Files/Timestamps (`touch`)\n* **`mkdir [OPTION]... DIRECTORY...` (Make Directory):**\n  * Creates one (`mkdir dir1`) or multiple directories (`mkdir dir1 dir2`).\n  * **`-p` (Parents):** Creates non-existent parent directories automatically (`mkdir -p dir1/dir2/dir3`) and **suppresses errors** if the directory already exists.\n  * **`-v` (Verbose):** Displays a message for each created directory (`mkdir -pv dir1/dir2`).\n* **`touch [OPTION]... FILE...`:**\n  * Creates an empty file if it does not exist, or updates its timestamps if it already exists:\n    * **`touch file`:** Updates all timestamps to the current system time.\n    * **`touch -a file`:** Changes **only the access time (atime)**.\n    * **`touch -m file`:** Changes **only the modification time (mtime)**.\n    * **`touch -d \"2020-01-17 17:14:10\" file`:** Sets the timestamp using a date string.\n    * **`touch -t 202001020304.05 file`:** Sets the timestamp using `[[CC]YY]MMDDhhmm[.ss]` format.\n\n---\n\n### 2. Copying Files and Directories (`cp`)\n* **Syntax:** `cp [OPTION]... SOURCE... DIRECTORY` or `cp [OPTION]... [-T] SOURCE DEST`\n* **Key Options:**\n  * **`-r`:** Recursively copies directories and all subdirectories/files.\n  * **`-p`:** Preserves file content, modification time, ownership, and access permissions.\n  * **`-a` (Archive):** Retains links, file attributes, and copies block/character devices and pipe files intact (`-dpR`).\n  * **`-l` vs. `-s`:** **`-l`** creates a **hard link** instead of copying data; **`-s`** creates a **symbolic (soft) link** (`cp -s /etc/passwd passwd_link`).\n  * **`-t DIRECTORY SOURCE...`:** Specifies target directory first (ideal with `xargs`: `find -name \"*.html\" | xargs cp -t /data/html/`).\n  * **Root Alias Note:** In openEuler's default root shell, `cp`, `mv`, and `rm` are aliased with **`-i` (interactive prompt)** to prevent accidental overwriting. Note that in `cp`, `-f` deletes an unopenable destination file and retries, rather than bypassing the `cp -i` alias prompt.\n\n---\n\n### 3. Moving/Renaming (`mv`) and Deleting (`rm`)\n* **`mv [option] source target` (Move / Rename):**\n  * Moves files/directories across directories, or **renames** a file if source and target are in the same parent directory (`mv test02.log test03.log`).\n  * **`-f`:** Forcibly overwrites target without prompting.\n  * **`-i`:** Prompts for user consent before overwriting. (**Rule:** If both `-i` and `-f` are specified on `mv` or `rm`, **the option on the right (last option) takes effect**!)\n  * **`-b`:** Backs up the target file before overwriting.\n  * **`-u`:** Updates the target file **only when the source file is newer** than the target.\n* **`rm [OPTION] file_or_dir` (Remove):**\n  * **Irreversible Deletion:** Linux `rm` does **not** move files to a recycle bin; deleted files cannot be restored easily.\n  * **`-r` / `-R` / `--recursive`:** Recursively deletes directories and all contents.\n  * **`-f` / `--force`:** Ignores non-existent files and deletes without prompting (`rm -rf dir1`).\n  * **`-i`:** Interactive confirmation before each deletion.","key_takeaways":["mkdir -p automatically creates missing parent directories and reports no error if the target directory already exists.","cp -a preserves all attributes, symlinks, and special device files; cp -p preserves mode, ownership, and timestamps; cp -s creates a symbolic link.","In mv and rm, the shell aliases include -i by default; if both -i and -f are passed on the command line, the rightmost option takes effect."],"exam_traps":["EXAM TRAP: To copy or delete a directory, you MUST include '-r' (or '-a' for cp). Running 'cp dir1 dir2' or 'rm dir1' without '-r' fails!","EXAM TRAP: 'touch -a' updates only the access time, whereas 'touch -m' updates only the modification time."],"content_html":"<h3>1. Creating Directories (<code class=\"inline-code\">mkdir<\/code>) and Files/Timestamps (<code class=\"inline-code\">touch<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">mkdir [OPTION]... DIRECTORY...<\/code> (Make Directory):<\/strong><\/li>\n<li>Creates one (<code class=\"inline-code\">mkdir dir1<\/code>) or multiple directories (<code class=\"inline-code\">mkdir dir1 dir2<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-p<\/code> (Parents):<\/strong> Creates non-existent parent directories automatically (<code class=\"inline-code\">mkdir -p dir1/dir2/dir3<\/code>) and <strong>suppresses errors<\/strong> if the directory already exists.<\/li>\n<li><strong><code class=\"inline-code\">-v<\/code> (Verbose):<\/strong> Displays a message for each created directory (<code class=\"inline-code\">mkdir -pv dir1/dir2<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">touch [OPTION]... FILE...<\/code>:<\/strong><\/li>\n<li>Creates an empty file if it does not exist, or updates its timestamps if it already exists:<\/li>\n<li><strong><code class=\"inline-code\">touch file<\/code>:<\/strong> Updates all timestamps to the current system time.<\/li>\n<li><strong><code class=\"inline-code\">touch -a file<\/code>:<\/strong> Changes <strong>only the access time (atime)<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">touch -m file<\/code>:<\/strong> Changes <strong>only the modification time (mtime)<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">touch -d \"2020-01-17 17:14:10\" file<\/code>:<\/strong> Sets the timestamp using a date string.<\/li>\n<li><strong><code class=\"inline-code\">touch -t 202001020304.05 file<\/code>:<\/strong> Sets the timestamp using <code class=\"inline-code\">[[CC]YY]MMDDhhmm[.ss]<\/code> format.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Copying Files and Directories (<code class=\"inline-code\">cp<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Syntax:<\/strong> <code class=\"inline-code\">cp [OPTION]... SOURCE... DIRECTORY<\/code> or <code class=\"inline-code\">cp [OPTION]... [-T] SOURCE DEST<\/code><\/li>\n<li><strong>Key Options:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-r<\/code>:<\/strong> Recursively copies directories and all subdirectories/files.<\/li>\n<li><strong><code class=\"inline-code\">-p<\/code>:<\/strong> Preserves file content, modification time, ownership, and access permissions.<\/li>\n<li><strong><code class=\"inline-code\">-a<\/code> (Archive):<\/strong> Retains links, file attributes, and copies block/character devices and pipe files intact (<code class=\"inline-code\">-dpR<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-l<\/code> vs. <code class=\"inline-code\">-s<\/code>:<\/strong> <strong><code class=\"inline-code\">-l<\/code><\/strong> creates a <strong>hard link<\/strong> instead of copying data; <strong><code class=\"inline-code\">-s<\/code><\/strong> creates a <strong>symbolic (soft) link<\/strong> (<code class=\"inline-code\">cp -s /etc/passwd passwd_link<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-t DIRECTORY SOURCE...<\/code>:<\/strong> Specifies target directory first (ideal with <code class=\"inline-code\">xargs<\/code>: <code class=\"inline-code\">find -name \"*.html\" | xargs cp -t /data/html/<\/code>).<\/li>\n<li><strong>Root Alias Note:<\/strong> In openEuler's default root shell, <code class=\"inline-code\">cp<\/code>, <code class=\"inline-code\">mv<\/code>, and <code class=\"inline-code\">rm<\/code> are aliased with <strong><code class=\"inline-code\">-i<\/code> (interactive prompt)<\/strong> to prevent accidental overwriting. Note that in <code class=\"inline-code\">cp<\/code>, <code class=\"inline-code\">-f<\/code> deletes an unopenable destination file and retries, rather than bypassing the <code class=\"inline-code\">cp -i<\/code> alias prompt.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Moving/Renaming (<code class=\"inline-code\">mv<\/code>) and Deleting (<code class=\"inline-code\">rm<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">mv [option] source target<\/code> (Move / Rename):<\/strong><\/li>\n<li>Moves files/directories across directories, or <strong>renames<\/strong> a file if source and target are in the same parent directory (<code class=\"inline-code\">mv test02.log test03.log<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-f<\/code>:<\/strong> Forcibly overwrites target without prompting.<\/li>\n<li><strong><code class=\"inline-code\">-i<\/code>:<\/strong> Prompts for user consent before overwriting. (<strong>Rule:<\/strong> If both <code class=\"inline-code\">-i<\/code> and <code class=\"inline-code\">-f<\/code> are specified on <code class=\"inline-code\">mv<\/code> or <code class=\"inline-code\">rm<\/code>, <strong>the option on the right (last option) takes effect<\/strong>!)<\/li>\n<li><strong><code class=\"inline-code\">-b<\/code>:<\/strong> Backs up the target file before overwriting.<\/li>\n<li><strong><code class=\"inline-code\">-u<\/code>:<\/strong> Updates the target file <strong>only when the source file is newer<\/strong> than the target.<\/li>\n<li><strong><code class=\"inline-code\">rm [OPTION] file_or_dir<\/code> (Remove):<\/strong><\/li>\n<li><strong>Irreversible Deletion:<\/strong> Linux <code class=\"inline-code\">rm<\/code> does <strong>not<\/strong> move files to a recycle bin; deleted files cannot be restored easily.<\/li>\n<li><strong><code class=\"inline-code\">-r<\/code> / <code class=\"inline-code\">-R<\/code> / <code class=\"inline-code\">--recursive<\/code>:<\/strong> Recursively deletes directories and all contents.<\/li>\n<li><strong><code class=\"inline-code\">-f<\/code> / <code class=\"inline-code\">--force<\/code>:<\/strong> Ignores non-existent files and deletes without prompting (<code class=\"inline-code\">rm -rf dir1<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-i<\/code>:<\/strong> Interactive confirmation before each deletion.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Nested Directory Creation, Archive Copy, Rename & Cleanup","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are preparing a backup workspace in `/root`. Create a nested directory `/root/backup/logs`, create two log files (`test01.log` and `test02.log`), recursively copy `/var/log/audit` while preserving attributes into `/root/backup/`, rename `test02.log` to `test03.log`, and forcibly remove `test01.log`.","instructions":["Step 1: Create the nested directory `/root/backup/logs` using `mkdir -p /root/backup/logs` and create empty files `test01.log` and `test02.log` using `touch test01.log test02.log`.","Step 2: Copy `/var/log/audit` recursively into `/root/backup/` using `cp -r /var/log/audit /root/backup/` (or `cp -a`).","Step 3: Rename `test02.log` to `test03.log` using `mv test02.log test03.log`, and forcibly delete `test01.log` using `rm -f test01.log`."],"starter_code":"# Step 1: Create nested directory and empty log files\n<mkdir_command>\n<touch_command>\n\n# Step 2: Recursively copy /var/log/audit to /root/backup/\n<cp_command>\n\n# Step 3: Rename test02.log to test03.log and forcibly remove test01.log\n<mv_command>\n<rm_command>","solution_code":"# Step 1: Create nested directory and empty log files\nmkdir -p /root/backup/logs\ntouch test01.log test02.log\n\n# Step 2: Recursively copy /var/log/audit to /root/backup/\ncp -r /var/log/audit /root/backup/\n\n# Step 3: Rename test02.log to test03.log and forcibly remove test01.log\nmv test02.log test03.log\nrm -f test01.log","hints":["Use `mkdir -p /root/backup/logs` and `touch test01.log test02.log`.","Use `cp -r /var/log/audit /root/backup/` to copy the directory recursively.","Use `mv test02.log test03.log` and `rm -f test01.log`."],"validation_checks":[{"step":1,"description":"Create nested directories with mkdir -p and empty files with touch","required_any":["mkdir -p","mkdir -pv"],"feedback_fail":"Use 'mkdir -p /root/backup/logs' and 'touch test01.log test02.log'."},{"step":2,"description":"Copy directory recursively with cp -r or cp -a","required_any":["cp -r","cp -a","cp -rv"],"feedback_fail":"Use 'cp -r /var/log/audit /root/backup/' to copy the directory."},{"step":3,"description":"Rename with mv and forcibly delete with rm -f","required_any":["mv test02.log test03.log"],"feedback_fail":"Use 'mv test02.log test03.log' and 'rm -f test01.log'."}],"simulated_output":"[root@openEuler ~]# ls -la /root/backup/\ntotal 12\ndrwxr-xr-x. 4 root root 4096 Nov 17 09:30 .\ndr-xr-x---. 6 root root 4096 Nov 17 09:30 ..\ndrwx------. 2 root root 4096 Nov 17 09:30 audit\ndrwxr-xr-x. 2 root root 4096 Nov 17 09:30 logs\n[root@openEuler ~]# ls -l test*\n-rw-r--r--. 1 root root 0 Nov 17 09:30 test03.log","quiz_questions":[{"id":"h2_s3_q1","type":"single","question":"Which option of the `mkdir` command enables automatic creation of non-existent parent directories without reporting an error if the directory already exists?","options":["A. -r","B. -p","C. -f","D. -a"],"answer":"B","explanation":"Per Ch.03 (p.88), the `-p` option enables `mkdir` to report no error if a directory already exists and automatically creates any parent directories that do not exist."},{"id":"h2_s3_q2","type":"single","question":"When running `mv` or `rm` in the Bash shell, if both `-i` (interactive) and `-f` (force) options are provided on the command line (e.g., `rm -i -f file1`), which option takes effect?","options":["A. Always `-i`","B. Always `-f`","C. The option on the right (the last option specified)","D. The command fails with a syntax error"],"answer":"C","explanation":"Per Ch.03 (pp.92, 94), if both `-i` and `-f` are provided on `mv` or `rm`, the option on the right takes effect."},{"id":"h2_s3_q3","type":"multiple","question":"Which of the following statements about the `touch` and `cp` commands are TRUE?","options":["A. `touch -a file` changes only the file access time.","B. `touch -m file` changes the file content modification time.","C. `cp -a` copies directories while retaining links, file attributes, and special device/pipe files.","D. `cp -s /etc/passwd passwd_link` creates a symbolic (soft) link to `/etc/passwd`."],"answer":"ABCD","explanation":"Per Ch.03 (pp.89–91), all four statements are explicitly documented in the official training material."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Search-Compression-and-Links","exercise_slug":"08-Exercise-Find-Tar-and-Links-Lab","lecture":{"title":"File Search (`find`, `locate`, `which`), Compression (`gzip`, `tar`) & Links (`ln`)","duration_mins":7,"pdf_ref":"Ch.03, pp. 105–117","objectives":["Search files in real time with `find` (`-name`, `-type`, `-mtime`, `-user`, `-size`, `-empty`, `-exec`), index-based `locate`/`updatedb`, and `PATH`-based `which`","Compress and archive files using `gzip` (60–70% compression ratio) and `tar` (`-c`, `-x`, `-t`, `-z`, `-j`, `-J`, `-v`, `-f`, `-C`)","Compare and create hard links (`ln`) vs. symbolic/soft links (`ln -s`) and trace their behavior when source files are deleted"],"content_markdown":"### 1. File Search Utilities: `find`, `locate`, and `which`\n* **`find [path...] [expression]` (Real-time directory traversal):**\n  * **`-name \"pattern\"` / `-iname`:** Search by filename (case-sensitive / case-insensitive).\n  * **`-type <c>`:** Filter by file type: **`f`** (general file), **`d`** (directory), **`l`** (symbolic link), **`b`** (block device), **`c`** (character device), **`p`** (named pipe).\n  * **`-mtime -n / +n`:** By modification time (`-7` = within last 7 days; **`+7` = earlier than 7 days ago**).\n  * **`-user <uname>` / `-perm <mode>` / `-size <N>`:** By owner, permission, or size.\n  * **`-empty [-delete]`:** Finds (and optionally deletes) empty files/directories.\n  * **`-exec cmd {} \\;`:** Runs `cmd` on each matched file (e.g., `find -name \"*.html\" -exec cp {} /data/html/ \\;`).\n* **`locate [OPTION] PATTERN` (Fast database index search):**\n  * Searches the pre-built index database `/var/lib/mlocate/mlocate.db`.\n  * **Must run `updatedb` first** if the database does not exist or newly created files are not yet indexed!\n* **`which [-a] programname`:** Searches only directories in **`PATH`** to find the absolute path of an executable command (`-a` lists all matches across `PATH`).\n\n---\n\n### 2. Compression & Archiving: `gzip` and `tar`\n* **`gzip [option] [file/dir]`:**\n  * Compresses files in place with a **60% to 70% compression ratio** for text files, appending **`.gz`** and replacing the original file.\n  * Options: **`-d`** (decompress, equivalent to `gunzip`), **`-l`** (list compressed/uncompressed sizes & ratio), **`-r`** (recursively compress files in subdirectories), **`-v`** (verbose), **`-f`** (force).\n* **`tar [OPTION...] [FILE]` (Tape Archive — packs multiple files/directories):**\n  * **Action flags:** **`-c`** (create archive), **`-x`** (extract archive), **`-t`** (list contents without extracting).\n  * **Compression filter flags:**\n    * **`-z`:** `gzip` (`.tar.gz` / `.tgz`)\n    * **`-j`:** `bzip2` (`.tar.bz2`)\n    * **`-J`:** `xz` (`.tar.xz`)\n  * **Helper flags:** **`-v`** (verbose), **`-f <archive_name>`** (must immediately precede archive filename), **`-C <target_dir>`** (extract to specified directory instead of current directory).\n\n---\n\n### 3. Hard Links vs. Soft (Symbolic) Links (`ln`)\nBy default, **`ln Source Target` creates a hard link**; adding **`-s`** (`ln -s Source Target`) creates a **soft (symbolic) link**:\n\n| Feature | Soft Link (`ln -s`) | Hard Link (`ln` default) |\n| :--- | :--- | :--- |\n| **Nature** | A path shortcut (like a Windows shortcut); has its own new inode (`lrwxrwxrwx`). | A file entry pointing to the **exact same inode/data blocks**; does not occupy extra disk space. |\n| **If Source File is Deleted** | **Becomes invalid (broken/dangling link)!** | **No impact!** Data remains accessible via the hard link (`link count` decreases by 1). |\n| **Linking to Directories** | **Supported** | **Not supported** (by default; prevents directory loops). |\n| **Cross-File System Linking** | **Supported** | **Not supported** (inodes are unique per filesystem). |","key_takeaways":["find /var/log/anaconda/ -type f -mtime +7 searches for regular files modified more than 7 days ago; locate requires updatedb to update /var/lib/mlocate/mlocate.db.","tar -zcf packs with gzip (.tar.gz), tar -jcf uses bzip2 (.tar.bz2), tar -Jcf uses xz (.tar.xz), and -C specifies the extraction target directory.","ln creates a hard link by default (survives source file deletion, cannot cross filesystems or link directories); ln -s creates a soft/symbolic link (breaks if source is deleted, can link directories and cross filesystems)."],"exam_traps":["EXAM TRAP: If you create a soft link 'ln -s passwd link_s', delete 'passwd', and then copy a new 'passwd' back to the same name, the soft link 'link_s' works again (points by path), whereas a hard link 'link_h' still points to the old inode and is no longer synchronized with the new 'passwd' file (Ch.03 p.117)!","EXAM TRAP: gzip has a 60%–70% compression ratio for text files and replaces the original file with file.gz."],"content_html":"<h3>1. File Search Utilities: <code class=\"inline-code\">find<\/code>, <code class=\"inline-code\">locate<\/code>, and <code class=\"inline-code\">which<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">find [path...] [expression]<\/code> (Real-time directory traversal):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-name \"pattern\"<\/code> / <code class=\"inline-code\">-iname<\/code>:<\/strong> Search by filename (case-sensitive / case-insensitive).<\/li>\n<li><strong><code class=\"inline-code\">-type &lt;c&gt;<\/code>:<\/strong> Filter by file type: <strong><code class=\"inline-code\">f<\/code><\/strong> (general file), <strong><code class=\"inline-code\">d<\/code><\/strong> (directory), <strong><code class=\"inline-code\">l<\/code><\/strong> (symbolic link), <strong><code class=\"inline-code\">b<\/code><\/strong> (block device), <strong><code class=\"inline-code\">c<\/code><\/strong> (character device), <strong><code class=\"inline-code\">p<\/code><\/strong> (named pipe).<\/li>\n<li><strong><code class=\"inline-code\">-mtime -n / +n<\/code>:<\/strong> By modification time (<code class=\"inline-code\">-7<\/code> = within last 7 days; <strong><code class=\"inline-code\">+7<\/code> = earlier than 7 days ago<\/strong>).<\/li>\n<li><strong><code class=\"inline-code\">-user &lt;uname&gt;<\/code> / <code class=\"inline-code\">-perm &lt;mode&gt;<\/code> / <code class=\"inline-code\">-size &lt;N&gt;<\/code>:<\/strong> By owner, permission, or size.<\/li>\n<li><strong><code class=\"inline-code\">-empty [-delete]<\/code>:<\/strong> Finds (and optionally deletes) empty files/directories.<\/li>\n<li><strong><code class=\"inline-code\">-exec cmd {} \\;<\/code>:<\/strong> Runs <code class=\"inline-code\">cmd<\/code> on each matched file (e.g., <code class=\"inline-code\">find -name \"*.html\" -exec cp {} /data/html/ \\;<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">locate [OPTION] PATTERN<\/code> (Fast database index search):<\/strong><\/li>\n<li>Searches the pre-built index database <code class=\"inline-code\">/var/lib/mlocate/mlocate.db<\/code>.<\/li>\n<li><strong>Must run <code class=\"inline-code\">updatedb<\/code> first<\/strong> if the database does not exist or newly created files are not yet indexed!<\/li>\n<li><strong><code class=\"inline-code\">which [-a] programname<\/code>:<\/strong> Searches only directories in <strong><code class=\"inline-code\">PATH<\/code><\/strong> to find the absolute path of an executable command (<code class=\"inline-code\">-a<\/code> lists all matches across <code class=\"inline-code\">PATH<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Compression &amp; Archiving: <code class=\"inline-code\">gzip<\/code> and <code class=\"inline-code\">tar<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">gzip [option] [file/dir]<\/code>:<\/strong><\/li>\n<li>Compresses files in place with a <strong>60% to 70% compression ratio<\/strong> for text files, appending <strong><code class=\"inline-code\">.gz<\/code><\/strong> and replacing the original file.<\/li>\n<li>Options: <strong><code class=\"inline-code\">-d<\/code><\/strong> (decompress, equivalent to <code class=\"inline-code\">gunzip<\/code>), <strong><code class=\"inline-code\">-l<\/code><\/strong> (list compressed/uncompressed sizes &amp; ratio), <strong><code class=\"inline-code\">-r<\/code><\/strong> (recursively compress files in subdirectories), <strong><code class=\"inline-code\">-v<\/code><\/strong> (verbose), <strong><code class=\"inline-code\">-f<\/code><\/strong> (force).<\/li>\n<li><strong><code class=\"inline-code\">tar [OPTION...] [FILE]<\/code> (Tape Archive — packs multiple files/directories):<\/strong><\/li>\n<li><strong>Action flags:<\/strong> <strong><code class=\"inline-code\">-c<\/code><\/strong> (create archive), <strong><code class=\"inline-code\">-x<\/code><\/strong> (extract archive), <strong><code class=\"inline-code\">-t<\/code><\/strong> (list contents without extracting).<\/li>\n<li><strong>Compression filter flags:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-z<\/code>:<\/strong> <code class=\"inline-code\">gzip<\/code> (<code class=\"inline-code\">.tar.gz<\/code> / <code class=\"inline-code\">.tgz<\/code>)<\/li>\n<li><strong><code class=\"inline-code\">-j<\/code>:<\/strong> <code class=\"inline-code\">bzip2<\/code> (<code class=\"inline-code\">.tar.bz2<\/code>)<\/li>\n<li><strong><code class=\"inline-code\">-J<\/code>:<\/strong> <code class=\"inline-code\">xz<\/code> (<code class=\"inline-code\">.tar.xz<\/code>)<\/li>\n<li><strong>Helper flags:<\/strong> <strong><code class=\"inline-code\">-v<\/code><\/strong> (verbose), <strong><code class=\"inline-code\">-f &lt;archive_name&gt;<\/code><\/strong> (must immediately precede archive filename), <strong><code class=\"inline-code\">-C &lt;target_dir&gt;<\/code><\/strong> (extract to specified directory instead of current directory).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Hard Links vs. Soft (Symbolic) Links (<code class=\"inline-code\">ln<\/code>)<\/h3>\n<p>By default, <strong><code class=\"inline-code\">ln Source Target<\/code> creates a hard link<\/strong>; adding <strong><code class=\"inline-code\">-s<\/code><\/strong> (<code class=\"inline-code\">ln -s Source Target<\/code>) creates a <strong>soft (symbolic) link<\/strong>:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Feature<\/th><th>Soft Link (<code class=\"inline-code\">ln -s<\/code>)<\/th><th>Hard Link (<code class=\"inline-code\">ln<\/code> default)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Nature<\/strong><\/td><td>A path shortcut (like a Windows shortcut); has its own new inode (<code class=\"inline-code\">lrwxrwxrwx<\/code>).<\/td><td>A file entry pointing to the <strong>exact same inode/data blocks<\/strong>; does not occupy extra disk space.<\/td><\/tr>\n<tr><td><strong>If Source File is Deleted<\/strong><\/td><td><strong>Becomes invalid (broken/dangling link)!<\/strong><\/td><td><strong>No impact!<\/strong> Data remains accessible via the hard link (<code class=\"inline-code\">link count<\/code> decreases by 1).<\/td><\/tr>\n<tr><td><strong>Linking to Directories<\/strong><\/td><td><strong>Supported<\/strong><\/td><td><strong>Not supported<\/strong> (by default; prevents directory loops).<\/td><\/tr>\n<tr><td><strong>Cross-File System Linking<\/strong><\/td><td><strong>Supported<\/strong><\/td><td><strong>Not supported<\/strong> (inodes are unique per filesystem).<\/td><\/tr>\n<\/tbody><\/table><\/div>"},"exercise":{"title":"Hands-On Lab: Searching Stale Logs, Packing `.tar.gz` Archives & Testing Links","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You need to locate all regular files in `/var/log/anaconda/` modified more than 7 days ago, pack all `.log` files in the current directory into `log.tar.gz` and extract them into `./log/`, and create both a hard link (`link_h_password`) and a soft link (`link_s_password`) to `passwd`.","instructions":["Step 1: Search `/var/log/anaconda/` for regular files (`-type f`) with modification time earlier than 7 days (`-mtime +7`) using `find`.","Step 2: Pack and compress `*.log` into `log.tar.gz` using `tar -zcf log.tar.gz *.log` and extract it to `./log/` using `tar -zxf log.tar.gz -C ./log/`.","Step 3: Create a hard link `ln passwd link_h_password` and a soft link `ln -s passwd link_s_password`."],"starter_code":"# Step 1: Find regular files in /var/log/anaconda/ modified more than 7 days ago\n<find_command>\n\n# Step 2: Compress *.log into log.tar.gz and extract to ./log/\n<tar_create_command>\nmkdir -p ./log\n<tar_extract_command>\n\n# Step 3: Create hard link and soft link to passwd\n<ln_hard_command>\n<ln_soft_command>","solution_code":"# Step 1: Find regular files in /var/log/anaconda/ modified more than 7 days ago\nfind /var/log/anaconda/ -type f -mtime +7\n\n# Step 2: Compress *.log into log.tar.gz and extract to ./log/\ntar -zcf log.tar.gz *.log\nmkdir -p ./log\ntar -zxf log.tar.gz -C ./log/\n\n# Step 3: Create hard link and soft link to passwd\nln passwd link_h_password\nln -s passwd link_s_password","hints":["Use `find /var/log/anaconda/ -type f -mtime +7`.","Use `tar -zcf log.tar.gz *.log` and `tar -zxf log.tar.gz -C ./log/`.","Use `ln passwd link_h_password` (no flags for hard link) and `ln -s passwd link_s_password` (`-s` for soft link)."],"validation_checks":[{"step":1,"description":"Find regular files older than 7 days with -type f and -mtime +7","required_any":["-mtime +7"],"feedback_fail":"Use 'find /var/log/anaconda/ -type f -mtime +7' to find regular files modified more than 7 days ago."},{"step":2,"description":"Create and extract tar.gz archive using -C ./log/","required_any":["-c ./log"],"feedback_fail":"Use 'tar -zcf log.tar.gz *.log' and 'tar -zxf log.tar.gz -C ./log/'."},{"step":3,"description":"Create both hard link (ln) and soft link (ln -s)","required_any":["ln -s passwd link_s_password"],"feedback_fail":"Include 'ln passwd link_h_password' and 'ln -s passwd link_s_password'."}],"simulated_output":"/var/log/anaconda/anaconda.log\n/var/log/anaconda/syslog\n/var/log/anaconda/storage.log\n\n[root@openEuler ~]# ls ./log\ntest01.log  test02.log\n\n[root@openEuler ~]# ls -l *password*\n-rw-------. 2 root root 2546 Nov 17 09:35 link_h_password\nlrwxrwxrwx. 1 root root    6 Nov 17 09:35 link_s_password -> passwd\n-rw-------. 2 root root 2546 Nov 17 09:35 passwd","quiz_questions":[{"id":"h2_s4_q1","type":"single","question":"When you run `locate filename` on openEuler and receive the error `locate: can not open '/var/lib/mlocate/mlocate.db': No such file or directory`, which command should you run first to generate or update the index database?","options":["A. finddb","B. updatedb","C. mandb","D. mkindex"],"answer":"B","explanation":"Per Ch.03 (pp.108–109), before running `locate` (or if `/var/lib/mlocate/mlocate.db` does not exist), you must run the `updatedb` command to generate/update the database."},{"id":"h2_s4_q2","type":"single","question":"Which `tar` option is used to specify the target directory when extracting an archive, and which compression options correspond to `gzip`, `bzip2`, and `xz` respectively?","options":["A. -d for directory; -g, -b, -x for compression","B. -C for directory; -z (gzip), -j (bzip2), -J (xz)","C. -o for directory; -z (bzip2), -j (gzip), -J (xz)","D. -p for directory; -c, -x, -t for compression"],"answer":"B","explanation":"Per Ch.03 (p.113), `tar xf ball.tar -C /tmp` extracts to `/tmp`, and options `-z`, `-j`, and `-J` correspond to `gzip`, `bzip2`, and `xz` compression tools respectively."},{"id":"h2_s4_q3","type":"multiple","question":"Which of the following statements accurately compare soft links (`ln -s`) and hard links (`ln`) on Linux?","options":["A. If the `ln` command is executed without any option, a hard link is created by default.","B. Deleting the source file invalidates a soft link, but has no impact on accessing data through a hard link.","C. Soft links support linking to directories and cross-file system linking.","D. Hard links support cross-file system linking by default."],"answer":"ABC","explanation":"Per Ch.03 (pp.115–116), A, B, and C are true. Option D is false because hard links share an inode within a single file system and do NOT support cross-file system linking."}],"reference_figures":[]}}]},{"hour_number":3,"folder_name":"Hour-03-Vim-Editor-and-Text-Processing","title":"Vim Editor & Text Processing Utilities","chapter_ref":"Chapter 03 Part 2 (pp. 118–153)","duration_mins":60,"overview":"Master the Vi/Vim text editor across Normal, Insert, Visual, and Command-line modes, view and extract files with `cat`, `more`, `less`, `head`, and `tail`, slice and filter text with `cut`, `grep`, `wc`, `sort`, `diff`, and `tr`, and automate stream processing with `awk` and `sed`.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Vim-Text-Editor-Modes-and-Operations","exercise_slug":"02-Exercise-Vim-Navigation-Search-and-Replace-Lab","lecture":{"title":"Vim Text Editor Modes, Navigation, Editing & Search/Replace","duration_mins":7,"pdf_ref":"Ch.03, pp. 118–133","objectives":["Distinguish Vi vs. Vim (Bram Moolenaar, 1991) and navigate its basic modes (Normal, Insert, Visual, Select, Command-line, Ex) and derivative modes","Execute Vim CLI launch options (`-c`, `-R`, `-M`, `-r`, `+num`, `-`, `-t`, `-q`) and Normal-mode cursor/data commands (`gg`, `G`, `yy`, `dd`, `p`, `u`, `U`, `Ctrl+R`)","Perform Command-line mode operations: line numbering (`:set nu`/`nonu`), search highlighting (`:set hlsearch`), regex substitution (`:%s/old/new/gi`), and saving/exiting (`:wq`, `:q!`)"],"content_markdown":"### 1. Vi vs. Vim and Editor Modes\n* **Vi & Vim Evolution:** **Vi** is the universal standard Unix text editor with three basic modes (Command, Insert, Visual). **Vim** was released in **1991 by Bram Moolenaar** (initially *Vi IMitation*, later renamed **Vi IMproved**). Note: After a minimal openEuler installation, you may need to manually install `vim`.\n* **Vim Modes:**\n  * **6 Basic Modes:** **Normal** (default startup mode for cursor movement and operator commands), **Insert** (entered via `i` or `a`; press `ESC` to return to Normal mode), **Visual** (highlights characters/lines/blocks for operators), **Select** (Windows-like selection where typing replaces highlighted text and enters Insert mode), **Command-line** (`:`, `/`, `?`, `!`), and **Ex** (batch command mode; exit with `:visual`).\n  * **5 Derivative Modes:** **Operator-pending** (waiting for text object like `aw` word, `as` sentence, `ap` paragraph), **Insert Normal** (`Ctrl+O` in Insert mode executes one Normal command then returns to Insert), **Insert Visual**, **Insert Select**, and **Replace** (press **`R`** in Normal mode to overwrite characters).\n  * **Other:** **eVim** (`evim` or `vim -y` — modeless GUI mode staying in Insert mode).\n\n---\n\n### 2. Vim CLI Launch Options & Normal Mode Keybindings\n* **CLI Syntax & Options (`vim [options] [file]...`):**\n  * **`+num`**: Opens file with cursor at line `num`.\n  * **`-R` vs. `-M`**: **`-R`** opens in read-only mode (can still force save with `:w!`); **`-M`** opens in strict read-only mode (**does not allow forcible saving**).\n  * **`-r`**: Recovers a crashed session (swap file).\n  * **`-c <cmd>`**: Runs specified command before opening file; **`-`** reads from `stdin`; **`-t tag`** jumps to tag definition; **`-q [errorfile]`** jumps to first error.\n\n| Category | Normal / Command-Line Mode Keybindings |\n| :--- | :--- |\n| **Cursor Movement** | `k` (up), `j` (down), `h` (left), `l` (right); **`0`** (beginning of line); **`g0`** (leftmost character on screen); **`gg`** (first line of file); **`G`** (last line of file); **`:n`** (jump to line `n`). |\n| **Copy, Cut & Paste** | **`yy` or `Y`** (copy entire line); **`y[n]w`** (copy `n` words); **`[n]dd`** (delete/cut `n` lines; `2dd` equals `dj`); **`d[n]w`** (delete `n` words); **`p`** (paste below line / after cursor); **`P`** (paste above line / before cursor). |\n| **Undo & Redo** | **`u`** (undo latest change); **`U`** (undo **all changes on the current line** since cursor arrived on it); **`Ctrl+R`** (redo last undo). |\n\n---\n\n### 3. Line Numbers, Search/Replace & Saving/Exiting\n* **Line Numbers & Search Highlighting:**\n  * **`:set nu`** (display line numbers) / **`:set nonu`** (hide line numbers).\n  * **`:set hlsearch`** (temporarily highlight search matches; add `set hlsearch` to **`/etc/vimrc`** for permanent configuration).\n* **Find & Replace:**\n  * **`/word`** (search forwards) and **`?word`** (search backwards). Press **`n`** for next match, **`N`** for previous match.\n  * **`:1,5s/word1/word2/g`**: Replaces all `word1` with `word2` in lines 1 to 5 (without `g`, only the first match per line is replaced).\n  * **`:%s/word1/word2/gi`**: Replaces all occurrences across the entire file (`%`), case-insensitively (`i`).\n* **Saving & Exiting:** **`:w`** (save), **`:q`** (quit), **`:wq`** (save and quit), **`:q!`** (force quit without saving), **`:wq!`** (force save and quit).","key_takeaways":["Vim starts in Normal mode by default; press 'i' or 'a' to enter Insert mode, 'R' for Replace mode, 'Ctrl+O' in Insert mode for one-shot Insert Normal mode, and 'ESC' to return to Normal mode.","In Normal mode: 'gg' = first line, 'G' = last line, 'yy' = copy line, '[n]dd' = delete n lines, 'u' = undo last change, 'U' = undo all changes on current line, 'Ctrl+R' = redo.","In Command-line mode: ':set nu' shows line numbers, ':set hlsearch' highlights matches (persisted in /etc/vimrc), and ':%s/old/new/gi' replaces globally and case-insensitively."],"exam_traps":["EXAM TRAP: Distinguishing 'vim -R' vs. 'vim -M': '-R' opens a file in read-only mode but allows forcible saving (:wq!), whereas '-M' opens in read-only mode and DOES NOT allow forcible saving!","EXAM TRAP: In Vim, lowercase 'u' undoes the single latest change, whereas uppercase 'U' undoes ALL changes made on the current line, and 'Ctrl+R' redoes an undone change."],"content_html":"<h3>1. Vi vs. Vim and Editor Modes<\/h3>\n<ul class=\"md-list\">\n<li><strong>Vi &amp; Vim Evolution:<\/strong> <strong>Vi<\/strong> is the universal standard Unix text editor with three basic modes (Command, Insert, Visual). <strong>Vim<\/strong> was released in <strong>1991 by Bram Moolenaar<\/strong> (initially <em>Vi IMitation<\/em>, later renamed <strong>Vi IMproved<\/strong>). Note: After a minimal openEuler installation, you may need to manually install <code class=\"inline-code\">vim<\/code>.<\/li>\n<li><strong>Vim Modes:<\/strong><\/li>\n<li><strong>6 Basic Modes:<\/strong> <strong>Normal<\/strong> (default startup mode for cursor movement and operator commands), <strong>Insert<\/strong> (entered via <code class=\"inline-code\">i<\/code> or <code class=\"inline-code\">a<\/code>; press <code class=\"inline-code\">ESC<\/code> to return to Normal mode), <strong>Visual<\/strong> (highlights characters/lines/blocks for operators), <strong>Select<\/strong> (Windows-like selection where typing replaces highlighted text and enters Insert mode), <strong>Command-line<\/strong> (<code class=\"inline-code\">:<\/code>, <code class=\"inline-code\">/<\/code>, <code class=\"inline-code\">?<\/code>, <code class=\"inline-code\">!<\/code>), and <strong>Ex<\/strong> (batch command mode; exit with <code class=\"inline-code\">:visual<\/code>).<\/li>\n<li><strong>5 Derivative Modes:<\/strong> <strong>Operator-pending<\/strong> (waiting for text object like <code class=\"inline-code\">aw<\/code> word, <code class=\"inline-code\">as<\/code> sentence, <code class=\"inline-code\">ap<\/code> paragraph), <strong>Insert Normal<\/strong> (<code class=\"inline-code\">Ctrl+O<\/code> in Insert mode executes one Normal command then returns to Insert), <strong>Insert Visual<\/strong>, <strong>Insert Select<\/strong>, and <strong>Replace<\/strong> (press <strong><code class=\"inline-code\">R<\/code><\/strong> in Normal mode to overwrite characters).<\/li>\n<li><strong>Other:<\/strong> <strong>eVim<\/strong> (<code class=\"inline-code\">evim<\/code> or <code class=\"inline-code\">vim -y<\/code> — modeless GUI mode staying in Insert mode).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Vim CLI Launch Options &amp; Normal Mode Keybindings<\/h3>\n<ul class=\"md-list\">\n<li><strong>CLI Syntax &amp; Options (<code class=\"inline-code\">vim [options] [file]...<\/code>):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">+num<\/code><\/strong>: Opens file with cursor at line <code class=\"inline-code\">num<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">-R<\/code> vs. <code class=\"inline-code\">-M<\/code><\/strong>: <strong><code class=\"inline-code\">-R<\/code><\/strong> opens in read-only mode (can still force save with <code class=\"inline-code\">:w!<\/code>); <strong><code class=\"inline-code\">-M<\/code><\/strong> opens in strict read-only mode (<strong>does not allow forcible saving<\/strong>).<\/li>\n<li><strong><code class=\"inline-code\">-r<\/code><\/strong>: Recovers a crashed session (swap file).<\/li>\n<li><strong><code class=\"inline-code\">-c &lt;cmd&gt;<\/code><\/strong>: Runs specified command before opening file; <strong><code class=\"inline-code\">-<\/code><\/strong> reads from <code class=\"inline-code\">stdin<\/code>; <strong><code class=\"inline-code\">-t tag<\/code><\/strong> jumps to tag definition; <strong><code class=\"inline-code\">-q [errorfile]<\/code><\/strong> jumps to first error.<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Category<\/th><th>Normal / Command-Line Mode Keybindings<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Cursor Movement<\/strong><\/td><td><code class=\"inline-code\">k<\/code> (up), <code class=\"inline-code\">j<\/code> (down), <code class=\"inline-code\">h<\/code> (left), <code class=\"inline-code\">l<\/code> (right); <strong><code class=\"inline-code\">0<\/code><\/strong> (beginning of line); <strong><code class=\"inline-code\">g0<\/code><\/strong> (leftmost character on screen); <strong><code class=\"inline-code\">gg<\/code><\/strong> (first line of file); <strong><code class=\"inline-code\">G<\/code><\/strong> (last line of file); <strong><code class=\"inline-code\">:n<\/code><\/strong> (jump to line <code class=\"inline-code\">n<\/code>).<\/td><\/tr>\n<tr><td><strong>Copy, Cut &amp; Paste<\/strong><\/td><td><strong><code class=\"inline-code\">yy<\/code> or <code class=\"inline-code\">Y<\/code><\/strong> (copy entire line); <strong><code class=\"inline-code\">y[n]w<\/code><\/strong> (copy <code class=\"inline-code\">n<\/code> words); <strong><code class=\"inline-code\">[n]dd<\/code><\/strong> (delete/cut <code class=\"inline-code\">n<\/code> lines; <code class=\"inline-code\">2dd<\/code> equals <code class=\"inline-code\">dj<\/code>); <strong><code class=\"inline-code\">d[n]w<\/code><\/strong> (delete <code class=\"inline-code\">n<\/code> words); <strong><code class=\"inline-code\">p<\/code><\/strong> (paste below line / after cursor); <strong><code class=\"inline-code\">P<\/code><\/strong> (paste above line / before cursor).<\/td><\/tr>\n<tr><td><strong>Undo &amp; Redo<\/strong><\/td><td><strong><code class=\"inline-code\">u<\/code><\/strong> (undo latest change); <strong><code class=\"inline-code\">U<\/code><\/strong> (undo <strong>all changes on the current line<\/strong> since cursor arrived on it); <strong><code class=\"inline-code\">Ctrl+R<\/code><\/strong> (redo last undo).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Line Numbers, Search/Replace &amp; Saving/Exiting<\/h3>\n<ul class=\"md-list\">\n<li><strong>Line Numbers &amp; Search Highlighting:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">:set nu<\/code><\/strong> (display line numbers) / <strong><code class=\"inline-code\">:set nonu<\/code><\/strong> (hide line numbers).<\/li>\n<li><strong><code class=\"inline-code\">:set hlsearch<\/code><\/strong> (temporarily highlight search matches; add <code class=\"inline-code\">set hlsearch<\/code> to <strong><code class=\"inline-code\">/etc/vimrc<\/code><\/strong> for permanent configuration).<\/li>\n<li><strong>Find &amp; Replace:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">/word<\/code><\/strong> (search forwards) and <strong><code class=\"inline-code\">?word<\/code><\/strong> (search backwards). Press <strong><code class=\"inline-code\">n<\/code><\/strong> for next match, <strong><code class=\"inline-code\">N<\/code><\/strong> for previous match.<\/li>\n<li><strong><code class=\"inline-code\">:1,5s/word1/word2/g<\/code><\/strong>: Replaces all <code class=\"inline-code\">word1<\/code> with <code class=\"inline-code\">word2<\/code> in lines 1 to 5 (without <code class=\"inline-code\">g<\/code>, only the first match per line is replaced).<\/li>\n<li><strong><code class=\"inline-code\">:%s/word1/word2/gi<\/code><\/strong>: Replaces all occurrences across the entire file (<code class=\"inline-code\">%<\/code>), case-insensitively (<code class=\"inline-code\">i<\/code>).<\/li>\n<li><strong>Saving &amp; Exiting:<\/strong> <strong><code class=\"inline-code\">:w<\/code><\/strong> (save), <strong><code class=\"inline-code\">:q<\/code><\/strong> (quit), <strong><code class=\"inline-code\">:wq<\/code><\/strong> (save and quit), <strong><code class=\"inline-code\">:q!<\/code><\/strong> (force quit without saving), <strong><code class=\"inline-code\">:wq!<\/code><\/strong> (force save and quit).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Vim Command-Line Configuration, Global Substitution & Crash Recovery","duration_mins":8,"exercise_type":"config","prompt_label":"root@openEuler:~#","scenario":"You are configuring `/etc/vimrc` and automating a Vim batch script for server configuration files. Specify the exact Vim commands to display line numbers, enable search highlighting, replace all occurrences of `word1` with `word2` case-insensitively across the entire file, and forcibly save and exit.","instructions":["Step 1: Write the Vim command to display line numbers (`:set nu`) and highlight search results (`:set hlsearch`).","Step 2: Write the Vim substitution command to replace all occurrences of `word1` with `word2` across the entire file case-insensitively (`:%s/word1/word2/gi`).","Step 3: Write the Vim command to forcibly save and exit (`:wq!`)."],"starter_code":"# Step 1: Enable line numbers and search highlighting in Vim\n<vim_line_numbers>\n<vim_highlight_search>\n\n# Step 2: Global case-insensitive replacement of word1 with word2\n<vim_global_replace>\n\n# Step 3: Forcibly save and exit Vim\n<vim_force_save_exit>","solution_code":"# Step 1: Enable line numbers and search highlighting in Vim\n:set nu\n:set hlsearch\n\n# Step 2: Global case-insensitive replacement of word1 with word2\n:%s/word1/word2/gi\n\n# Step 3: Forcibly save and exit Vim\n:wq!","hints":["Use `:set nu` to show line numbers and `:set hlsearch` to highlight search matches.","Use `:%s/word1/word2/gi` for full-file (`%`), global (`g`), case-insensitive (`i`) replacement.","Use `:wq!` to forcibly save and exit."],"validation_checks":[{"step":1,"description":"Enable line numbering (:set nu) and search highlighting (:set hlsearch)","required_any":["set nu"],"feedback_fail":"Include ':set nu' and ':set hlsearch'."},{"step":2,"description":"Perform global case-insensitive substitution","required_any":["%s/word1/word2/gi"],"feedback_fail":"Use ':%s/word1/word2/gi' to replace all occurrences case-insensitively."},{"step":3,"description":"Forcibly save and exit with :wq!","required_any":[":wq!"],"feedback_fail":"Use ':wq!' to forcibly save and exit the Vim editor."}],"simulated_output":"  1 hello\n  2 openEuler\n  3 word2 (replaced from word1)\n  4 WORD2 (replaced from WORD1 - case-insensitive)\n\"test.txt\" 4L, 42B written","quiz_questions":[{"id":"h3_s1_q1","type":"single","question":"When starting Vim from the command line, which option opens a file in strict read-only mode and does NOT allow you to forcibly save the file?","options":["A. vim -R","B. vim -M","C. vim -r","D. vim -c"],"answer":"B","explanation":"Per Ch.03 (p.124), `-R` opens a file in read-only mode but allows you to forcibly save the file, whereas `-M` opens a file in read-only mode and does NOT allow you to forcibly save the file."},{"id":"h3_s1_q2","type":"single","question":"In Vim Normal mode, which key combination redoes the last operation that was undone with `u`?","options":["A. U","B. Ctrl+R","C. Ctrl+O","D. yy"],"answer":"B","explanation":"Per Ch.03 (p.132), `u` undoes the latest change, `U` undoes all changes on the current line, and `Ctrl+R` redoes the last undo operation."},{"id":"h3_s1_q3","type":"multiple","question":"Which of the following statements about Vim search, replacement, and configuration are TRUE?","options":["A. `:set nu` displays line numbers, while `:set nonu` hides line numbers.","B. Adding `set hlsearch` to `/etc/vimrc` permanently enables search result highlighting.","C. `:1,5s/word1/word2/g` replaces all occurrences of `word1` with `word2` in lines 1 to 5.","D. Pressing `gg` moves the cursor to the last line of the file, while `G` moves it to the first line."],"answer":"ABC","explanation":"Per Ch.03 (pp.126–130), A, B, and C are true. Option D is reversed: `gg` moves the cursor to the first line of the file, and `G` moves it to the last line."}],"reference_figures":[]}},{"sprint_number":2,"lecture_slug":"03-Lecture-File-Viewing-cat-more-less-head-tail","exercise_slug":"04-Exercise-Viewing-and-Extracting-Files-Lab","lecture":{"title":"File Viewing & Extraction (`cat`, `more`, `less`, `head`, `tail`)","duration_mins":7,"pdf_ref":"Ch.03, pp. 96–104, 135–142, 151","objectives":["View and concatenate files with `cat` (`-n`, `-b`, `-s`, `-E`, `-A`)","Compare paginated viewers `more` (loads entire file upfront) vs. `less` (loads on demand, bidirectional scrolling & search)","Extract file headers and tails using `head` (first 10 lines by default — Ch.03 Quiz!) and `tail` (last 10 lines by default, `-f` real-time log tracking)"],"content_markdown":"### 1. Viewing & Combining Files with `cat`\n`cat` reads entire files to standard output, creates files (`cat > filename`), or combines files (`cat file1 file2 > file3`):\n* **`-n` (`--number`):** Numbers **all** output lines starting from 1.\n* **`-b` (`--number-nonblank`):** Numbers **only non-empty (non-blank)** lines starting from 1.\n* **`-s`:** Squeezes multiple consecutive blank lines into a single blank line.\n* **`-E` (`--show-ends`):** Appends **``** at the end of each line.\n* **`-A` (`--show-all`):** Equivalent to **`-vET`**; displays all non-printable characters (tabs, line endings).\n\n---\n\n### 2. Paginated Viewing: `more` vs. `less`\n| Feature / Key | `more [options] <file>` | `less [option] file` |\n| :--- | :--- | :--- |\n| **Loading Mechanism** | Reads from front to back and **loads the entire file from the very start**. | **Does NOT load the entire file** before displaying; faster on huge logs and more flexible (Vim-like UI). |\n| **CLI Options** | **`+n`** (start at line `n`), **`-n`** (set screen size to `n` lines), **`-c`** (clear screen from top), **`-s`** (squeeze blank lines), **`+/pattern`** (search pattern before displaying). | **`-N`** (show line numbers), **`-i`** (ignore case in search), **`-s`** (squeeze blank lines), **`-f`** (force open special/binary file), **`-o <file>`** (save output to file), **`-g`** (highlight only last match). |\n| **Interactive Keys** | `Space` / `Ctrl+F` (next page), `Enter` (next line), `b` / `Ctrl+B` (previous page), **`=`** (print current line number), **`:f`** (print filename & line number), **`v`** (invoke `vi`), **`!cmd`** (run shell cmd), **`q`** (quit). | `/string` (search down), `?string` (search up), `n`/`N` (repeat search), `b`/`PageUp` (prev page), `d` (down half page), `u` (up half page), `y` (prev line), `h` (help), `q`/`Q` (quit). |\n\n---\n\n### 3. Extracting File Beginnings (`head`) and Ends (`tail`)\n* **`head [option]... [file]...`:**\n  * **Default Behavior (Official Ch.03 Quiz Q1!):** Displays the **first 10 lines** of a file by default!\n  * **`-n num` / `-c num`:** Displays the first `num` lines / bytes (`head -n 3 /etc/passwd`).\n  * **Negative Count (`head -n -num` / `head -c -num`):** Displays **all lines/bytes EXCEPT the last `num` lines/bytes** (e.g., `head -n -40 /etc/passwd` outputs everything except the last 40 lines!).\n  * **`-q` / `-v`:** Hide (`-q`, default for single file) or display (`-v`) the filename header.\n* **`tail [option]... [file]...`:**\n  * **Default Behavior:** Displays the **last 10 lines** of a file by default.\n  * **`-n num` / `-c num`:** Displays the last `num` lines / bytes (`tail -n 3 /etc/passwd`).\n  * **Plus Offset (`tail -n +num` / `tail -c +num`):** Reads data **starting from the `num`-th line/byte to the end of the file** (`tail -n +3 file`).\n  * **`-f`:** **Reads log files cyclically in real time** (traces growing log files like `tail -f ping.log`).","key_takeaways":["By default, both 'head' and 'tail' display 10 lines (the first 10 lines and last 10 lines, respectively — Ch.03 Quiz Q1).","head -n -3 file reads all lines EXCEPT the last 3 lines; tail -n +3 file reads from line 3 to the end of the file; tail -f cyclically follows real-time log updates.","cat -n numbers all lines including blank lines, whereas cat -b numbers only non-blank lines; less does not load the entire file into memory upfront, unlike more."],"exam_traps":["EXAM TRAP (Official Ch.03 Quiz Q1): 'How many lines of a file are displayed by default when using the head command?' -> 10 lines (Option B)!","EXAM TRAP: Watch the sign in head/tail! 'head -n -20 file' excludes the last 20 lines, whereas 'tail -n +3 file' starts outputting from line 3 to the end."],"content_html":"<h3>1. Viewing &amp; Combining Files with <code class=\"inline-code\">cat<\/code><\/h3>\n<p><code class=\"inline-code\">cat<\/code> reads entire files to standard output, creates files (<code class=\"inline-code\">cat &gt; filename<\/code>), or combines files (<code class=\"inline-code\">cat file1 file2 &gt; file3<\/code>):<\/p>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">-n<\/code> (<code class=\"inline-code\">--number<\/code>):<\/strong> Numbers <strong>all<\/strong> output lines starting from 1.<\/li>\n<li><strong><code class=\"inline-code\">-b<\/code> (<code class=\"inline-code\">--number-nonblank<\/code>):<\/strong> Numbers <strong>only non-empty (non-blank)<\/strong> lines starting from 1.<\/li>\n<li><strong><code class=\"inline-code\">-s<\/code>:<\/strong> Squeezes multiple consecutive blank lines into a single blank line.<\/li>\n<li><strong><code class=\"inline-code\">-E<\/code> (<code class=\"inline-code\">--show-ends<\/code>):<\/strong> Appends <strong><code class=\"inline-code\"><\/code><\/strong> at the end of each line.<\/li>\n<li><strong><code class=\"inline-code\">-A<\/code> (<code class=\"inline-code\">--show-all<\/code>):<\/strong> Equivalent to <strong><code class=\"inline-code\">-vET<\/code><\/strong>; displays all non-printable characters (tabs, line endings).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Paginated Viewing: <code class=\"inline-code\">more<\/code> vs. <code class=\"inline-code\">less<\/code><\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Feature / Key<\/th><th><code class=\"inline-code\">more [options] &lt;file&gt;<\/code><\/th><th><code class=\"inline-code\">less [option] file<\/code><\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Loading Mechanism<\/strong><\/td><td>Reads from front to back and <strong>loads the entire file from the very start<\/strong>.<\/td><td><strong>Does NOT load the entire file<\/strong> before displaying; faster on huge logs and more flexible (Vim-like UI).<\/td><\/tr>\n<tr><td><strong>CLI Options<\/strong><\/td><td><strong><code class=\"inline-code\">+n<\/code><\/strong> (start at line <code class=\"inline-code\">n<\/code>), <strong><code class=\"inline-code\">-n<\/code><\/strong> (set screen size to <code class=\"inline-code\">n<\/code> lines), <strong><code class=\"inline-code\">-c<\/code><\/strong> (clear screen from top), <strong><code class=\"inline-code\">-s<\/code><\/strong> (squeeze blank lines), <strong><code class=\"inline-code\">+/pattern<\/code><\/strong> (search pattern before displaying).<\/td><td><strong><code class=\"inline-code\">-N<\/code><\/strong> (show line numbers), <strong><code class=\"inline-code\">-i<\/code><\/strong> (ignore case in search), <strong><code class=\"inline-code\">-s<\/code><\/strong> (squeeze blank lines), <strong><code class=\"inline-code\">-f<\/code><\/strong> (force open special/binary file), <strong><code class=\"inline-code\">-o &lt;file&gt;<\/code><\/strong> (save output to file), <strong><code class=\"inline-code\">-g<\/code><\/strong> (highlight only last match).<\/td><\/tr>\n<tr><td><strong>Interactive Keys<\/strong><\/td><td><code class=\"inline-code\">Space<\/code> / <code class=\"inline-code\">Ctrl+F<\/code> (next page), <code class=\"inline-code\">Enter<\/code> (next line), <code class=\"inline-code\">b<\/code> / <code class=\"inline-code\">Ctrl+B<\/code> (previous page), <strong><code class=\"inline-code\">=<\/code><\/strong> (print current line number), <strong><code class=\"inline-code\">:f<\/code><\/strong> (print filename &amp; line number), <strong><code class=\"inline-code\">v<\/code><\/strong> (invoke <code class=\"inline-code\">vi<\/code>), <strong><code class=\"inline-code\">!cmd<\/code><\/strong> (run shell cmd), <strong><code class=\"inline-code\">q<\/code><\/strong> (quit).<\/td><td><code class=\"inline-code\">/string<\/code> (search down), <code class=\"inline-code\">?string<\/code> (search up), <code class=\"inline-code\">n<\/code>/<code class=\"inline-code\">N<\/code> (repeat search), <code class=\"inline-code\">b<\/code>/<code class=\"inline-code\">PageUp<\/code> (prev page), <code class=\"inline-code\">d<\/code> (down half page), <code class=\"inline-code\">u<\/code> (up half page), <code class=\"inline-code\">y<\/code> (prev line), <code class=\"inline-code\">h<\/code> (help), <code class=\"inline-code\">q<\/code>/<code class=\"inline-code\">Q<\/code> (quit).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Extracting File Beginnings (<code class=\"inline-code\">head<\/code>) and Ends (<code class=\"inline-code\">tail<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">head [option]... [file]...<\/code>:<\/strong><\/li>\n<li><strong>Default Behavior (Official Ch.03 Quiz Q1!):<\/strong> Displays the <strong>first 10 lines<\/strong> of a file by default!<\/li>\n<li><strong><code class=\"inline-code\">-n num<\/code> / <code class=\"inline-code\">-c num<\/code>:<\/strong> Displays the first <code class=\"inline-code\">num<\/code> lines / bytes (<code class=\"inline-code\">head -n 3 /etc/passwd<\/code>).<\/li>\n<li><strong>Negative Count (<code class=\"inline-code\">head -n -num<\/code> / <code class=\"inline-code\">head -c -num<\/code>):<\/strong> Displays <strong>all lines/bytes EXCEPT the last <code class=\"inline-code\">num<\/code> lines/bytes<\/strong> (e.g., <code class=\"inline-code\">head -n -40 /etc/passwd<\/code> outputs everything except the last 40 lines!).<\/li>\n<li><strong><code class=\"inline-code\">-q<\/code> / <code class=\"inline-code\">-v<\/code>:<\/strong> Hide (<code class=\"inline-code\">-q<\/code>, default for single file) or display (<code class=\"inline-code\">-v<\/code>) the filename header.<\/li>\n<li><strong><code class=\"inline-code\">tail [option]... [file]...<\/code>:<\/strong><\/li>\n<li><strong>Default Behavior:<\/strong> Displays the <strong>last 10 lines<\/strong> of a file by default.<\/li>\n<li><strong><code class=\"inline-code\">-n num<\/code> / <code class=\"inline-code\">-c num<\/code>:<\/strong> Displays the last <code class=\"inline-code\">num<\/code> lines / bytes (<code class=\"inline-code\">tail -n 3 /etc/passwd<\/code>).<\/li>\n<li><strong>Plus Offset (<code class=\"inline-code\">tail -n +num<\/code> / <code class=\"inline-code\">tail -c +num<\/code>):<\/strong> Reads data <strong>starting from the <code class=\"inline-code\">num<\/code>-th line/byte to the end of the file<\/strong> (<code class=\"inline-code\">tail -n +3 file<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-f<\/code>:<\/strong> <strong>Reads log files cyclically in real time<\/strong> (traces growing log files like <code class=\"inline-code\">tail -f ping.log<\/code>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Numbering Non-Blank Lines (`cat -b`), `head` Offsets & `tail -f` Log Tracing","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are inspecting system configuration and log files on openEuler. Number all non-blank lines of `/etc/profile`, extract the first 3 lines of `/etc/passwd`, extract `/etc/passwd` excluding the last 40 lines, and view the last 3 lines of `/etc/passwd`.","instructions":["Step 1: View `/etc/profile` and number only non-blank lines starting from 1 using `cat -b /etc/profile`.","Step 2: Display the first 3 lines of `/etc/passwd` using `head -n 3 /etc/passwd`, and display `/etc/passwd` excluding the last 40 lines using `head -n -40 /etc/passwd`.","Step 3: Display the last 3 lines of `/etc/passwd` using `tail -n 3 /etc/passwd`."],"starter_code":"# Step 1: Display /etc/profile with non-blank line numbers\n<cat_nonblank_command>\n\n# Step 2: Display first 3 lines of /etc/passwd, then all except last 40 lines\n<head_first_3_command>\n<head_exclude_last_40_command>\n\n# Step 3: Display last 3 lines of /etc/passwd\n<tail_last_3_command>","solution_code":"# Step 1: Display /etc/profile with non-blank line numbers\ncat -b /etc/profile\n\n# Step 2: Display first 3 lines of /etc/passwd, then all except last 40 lines\nhead -n 3 /etc/passwd\nhead -n -40 /etc/passwd\n\n# Step 3: Display last 3 lines of /etc/passwd\ntail -n 3 /etc/passwd","hints":["Use `cat -b /etc/profile` to number
