hes user identity (`su` keeps current shell env; **`su -`** switches to target user's login shell env). |Temporarily executes a single command as another user (usually `root`). |\n| **Password Required** | **Target user's password** (e.g., `root`'s password). | **Current user's own password** (cached for **5 minutes** by default; unless `NOPASSWD` is set). |\n| **Security & Auditing** | Low security: shares root password, broad permissions, **commands are NOT audited/recorded**. | High security: fine-grained command control in `/etc/sudoers`, **every command is logged by default**. |\n\n---\n\n### 3. Configuring `/etc/sudoers` and `/etc/sudoers.d/`\n* **Best Practice:** Use **`visudo`** (which automatically checks syntax) to edit `/etc/sudoers`, or create a drop-in file **`/etc/sudoers.d/username`** (can be revoked simply by deleting the file).\n* **Syntax Breakdown:**\n  ```text\n  test   openeuler.com=(root)   NOPASSWD:/usr/bin/touch\n  %wheel ALL=(ALL)              ALL\n  ```\n  * **`test` / `%wheel`:** User or **group (prefixed with `%`)** granted privileges.\n  * **`openeuler.com` / `ALL`:** Hostname where the rule applies.\n  * **`(root)` / `(ALL)`:** Target user identity for privilege escalation.\n  * **`NOPASSWD:/usr/bin/touch`:** Optional `NOPASSWD:` tag (skips password prompt) + comma-separated list of allowed absolute command paths.\n* **Key `sudo` Options:** **`-l`** (list current user's allowed `sudo` permissions), **`-k`** (invalidate cached credentials, forcing password on next run), **`-v`** (extend password timeout by 5 mins), **`-u user/#uid`** (run as specific user), **`-b`** (run in background).","key_takeaways":["When the Sticky Bit ('drwxrwxrwt') is set on a directory, only the file owner, directory owner, or root can delete or rename files inside it.","A '+' at the end of 'ls -l' permissions (-rw-rw-r--+) indicates an ACL is active; manage ACLs with getfacl, setfacl (-m modify, -x delete entry, -b remove all), and chacl.","su requires the target user's password and does not log commands; sudo requires the current user's password, checks /etc/sudoers (or /etc/sudoers.d/<user>), and logs all executed commands."],"exam_traps":["EXAM TRAP: 'su username' switches the user identity WITHOUT changing the current shell environment variables, whereas 'su - username' starts a full login shell with the target user's environment!","EXAM TRAP: In /etc/sudoers, a percent sign ('%') before a name (e.g., '%wheel') indicates a user group rather than an individual user."],"content_html":"<h3>1. Sticky Bit (<code class=\"inline-code\">t<\/code>) &amp; Access Control Lists (ACL)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Sticky Bit (<code class=\"inline-code\">drwxrwxrwt<\/code>, octal prefix <code class=\"inline-code\">1<\/code>, <code class=\"inline-code\">chmod o+t<\/code>):<\/strong><\/li>\n<li>Special permission set on shared directories (such as <code class=\"inline-code\">/tmp<\/code> or <code class=\"inline-code\">/share<\/code>).<\/li>\n<li><strong>Rule:<\/strong> When the Sticky Bit is enabled on a directory, <strong>only the file owner, the directory owner, or the <code class=\"inline-code\">root<\/code> user can rename or remove files within that directory<\/strong>—even if all users have <code class=\"inline-code\">rwx<\/code> (<code class=\"inline-code\">777<\/code>) permissions on the directory and files!<\/li>\n<li><strong>Access Control Lists (ACL):<\/strong><\/li>\n<li>Solves the limitation of traditional <code class=\"inline-code\">ugo<\/code> (<code class=\"inline-code\">rwx<\/code>) permissions by granting fine-grained permissions to specific individual users or groups.<\/li>\n<li><strong>Indicator:<\/strong> In <code class=\"inline-code\">ls -l<\/code>, a <strong>plus sign (<code class=\"inline-code\">+<\/code>)<\/strong> at the end of the permission string (<code class=\"inline-code\">-rw-rw-r--+<\/code>) indicates the file has an ACL configured!<\/li>\n<li><strong>3 ACL Commands:<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">getfacl [-aceEsRLPtpndvh] file...<\/code>:<\/strong> Obtains ACLs (<code class=\"inline-code\">-a<\/code> file ACL only, <code class=\"inline-code\">-d<\/code> default ACL only, <code class=\"inline-code\">-c<\/code> omit header, <code class=\"inline-code\">-R<\/code> recursive, <code class=\"inline-code\">-n<\/code> numeric UIDs/GIDs).<\/li>\n<li><strong><code class=\"inline-code\">setfacl [-bkndRLP] {-m|-M|-x|-X} file...<\/code>:<\/strong> Sets ACLs:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">-m<\/code>:<\/strong> Modifies/adds an ACL entry (e.g., <code class=\"inline-code\">setfacl -m u:user1:rwx test<\/code>; cannot be combined with <code class=\"inline-code\">-x<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-x<\/code>:<\/strong> Deletes specified ACL entries.<\/li>\n<li><strong><code class=\"inline-code\">-b<\/code>:<\/strong> <strong>Deletes ALL extended ACL entries<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">-k<\/code>:<\/strong> Removes default/preset directory ACL entries; <strong><code class=\"inline-code\">-d<\/code><\/strong> presets default directory ACLs; <strong><code class=\"inline-code\">-R<\/code><\/strong> recursive.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">chacl<\/code>:<\/strong> Changes file/directory ACLs (<code class=\"inline-code\">-b<\/code> modify file &amp; default dir ACLs, <code class=\"inline-code\">-d<\/code> set default dir ACL, <code class=\"inline-code\">-R<\/code> delete file ACLs only, <code class=\"inline-code\">-D<\/code> delete dir ACLs only, <strong><code class=\"inline-code\">-B<\/code> delete all ACLs<\/strong>, <code class=\"inline-code\">-l<\/code> list ACLs, <code class=\"inline-code\">-r<\/code> recursive).<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Comparing <code class=\"inline-code\">su<\/code> (<code class=\"inline-code\">su -<\/code>) vs. <code class=\"inline-code\">sudo<\/code><\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Dimension<\/th><th><code class=\"inline-code\">su<\/code> (substitute user)<\/th><th><code class=\"inline-code\">sudo<\/code> (superuser do)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Basic Function<\/strong><\/td><td>Switches user identity (<code class=\"inline-code\">su<\/code> keeps current shell env; <strong><code class=\"inline-code\">su -<\/code><\/strong> switches to target user's login shell env).<\/td><td>Temporarily executes a single command as another user (usually <code class=\"inline-code\">root<\/code>).<\/td><\/tr>\n<tr><td><strong>Password Required<\/strong><\/td><td><strong>Target user's password<\/strong> (e.g., <code class=\"inline-code\">root<\/code>'s password).<\/td><td><strong>Current user's own password<\/strong> (cached for <strong>5 minutes<\/strong> by default; unless <code class=\"inline-code\">NOPASSWD<\/code> is set).<\/td><\/tr>\n<tr><td><strong>Security &amp; Auditing<\/strong><\/td><td>Low security: shares root password, broad permissions, <strong>commands are NOT audited/recorded<\/strong>.<\/td><td>High security: fine-grained command control in <code class=\"inline-code\">/etc/sudoers<\/code>, <strong>every command is logged by default<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Configuring <code class=\"inline-code\">/etc/sudoers<\/code> and <code class=\"inline-code\">/etc/sudoers.d/<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong>Best Practice:<\/strong> Use <strong><code class=\"inline-code\">visudo<\/code><\/strong> (which automatically checks syntax) to edit <code class=\"inline-code\">/etc/sudoers<\/code>, or create a drop-in file <strong><code class=\"inline-code\">/etc/sudoers.d/username<\/code><\/strong> (can be revoked simply by deleting the file).<\/li>\n<li><strong>Syntax Breakdown:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>TEXT<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  test   openeuler.com=(root)   NOPASSWD:/usr/bin/touch\n  %wheel ALL=(ALL)              ALL<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">test<\/code> / <code class=\"inline-code\">%wheel<\/code>:<\/strong> User or <strong>group (prefixed with <code class=\"inline-code\">%<\/code>)<\/strong> granted privileges.<\/li>\n<li><strong><code class=\"inline-code\">openeuler.com<\/code> / <code class=\"inline-code\">ALL<\/code>:<\/strong> Hostname where the rule applies.<\/li>\n<li><strong><code class=\"inline-code\">(root)<\/code> / <code class=\"inline-code\">(ALL)<\/code>:<\/strong> Target user identity for privilege escalation.<\/li>\n<li><strong><code class=\"inline-code\">NOPASSWD:/usr/bin/touch<\/code>:<\/strong> Optional <code class=\"inline-code\">NOPASSWD:<\/code> tag (skips password prompt) + comma-separated list of allowed absolute command paths.<\/li>\n<li><strong>Key <code class=\"inline-code\">sudo<\/code> Options:<\/strong> <strong><code class=\"inline-code\">-l<\/code><\/strong> (list current user's allowed <code class=\"inline-code\">sudo<\/code> permissions), <strong><code class=\"inline-code\">-k<\/code><\/strong> (invalidate cached credentials, forcing password on next run), <strong><code class=\"inline-code\">-v<\/code><\/strong> (extend password timeout by 5 mins), <strong><code class=\"inline-code\">-u user/#uid<\/code><\/strong> (run as specific user), <strong><code class=\"inline-code\">-b<\/code><\/strong> (run in background).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Configuring Fine-Grained ACLs (`setfacl`/`getfacl`) and Passwordless `sudo`","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You need to grant user `test` read-write (`rw`) access to `/root/report.txt` without changing its owner or group by using `setfacl`, verify the ACL with `getfacl`, and configure a drop-in `/etc/sudoers.d/test` rule allowing user `test` to run `/usr/bin/touch` as `root` without a password.","instructions":["Step 1: Grant user `test` `rw-` permissions on `/root/report.txt` using `setfacl -m u:test:rw /root/report.txt`.","Step 2: Display the ACL entries of `/root/report.txt` using `getfacl /root/report.txt`.","Step 3: Write the sudoers rule `test ALL=(root) NOPASSWD:/usr/bin/touch` into `/etc/sudoers.d/test`."],"starter_code":"# Step 1: Set ACL granting user 'test' rw permissions on /root/report.txt\n<setfacl_command>\n\n# Step 2: Query the ACL of /root/report.txt\n<getfacl_command>\n\n# Step 3: Create /etc/sudoers.d/test granting passwordless /usr/bin/touch\necho \"<sudoers_rule>\" > /etc/sudoers.d/test","solution_code":"# Step 1: Set ACL granting user 'test' rw permissions on /root/report.txt\nsetfacl -m u:test:rw /root/report.txt\n\n# Step 2: Query the ACL of /root/report.txt\ngetfacl /root/report.txt\n\n# Step 3: Create /etc/sudoers.d/test granting passwordless /usr/bin/touch\necho \"test ALL=(root) NOPASSWD:/usr/bin/touch\" > /etc/sudoers.d/test","hints":["Use `setfacl -m u:test:rw /root/report.txt`.","Use `getfacl /root/report.txt`.","Include `NOPASSWD:/usr/bin/touch` in the `/etc/sudoers.d/test` echo statement."],"validation_checks":[{"step":1,"description":"Modify file ACL using setfacl -m","required_any":["setfacl -m u:test:rw"],"feedback_fail":"Use 'setfacl -m u:test:rw /root/report.txt'."},{"step":2,"description":"Read file ACL using getfacl","required_any":["getfacl /root/report.txt"],"feedback_fail":"Use 'getfacl /root/report.txt' to verify the ACL."},{"step":3,"description":"Configure NOPASSWD:/usr/bin/touch in /etc/sudoers.d/test","required_any":["nopasswd:/usr/bin/touch"],"feedback_fail":"Include 'NOPASSWD:/usr/bin/touch' in the sudoers rule."}],"simulated_output":"# file: root/report.txt\n# owner: root\n# group: root\nuser::rw-\nuser:test:rw-\ngroup::r--\nmask::rw-\nother::r--\n\n[root@openEuler ~]# ls -l /root/report.txt\n-rw-rw-r--+ 1 root root 0 Nov 17 10:00 /root/report.txt\n[root@openEuler ~]# cat /etc/sudoers.d/test\ntest ALL=(root) NOPASSWD:/usr/bin/touch","quiz_questions":[{"id":"h4_s4_q1","type":"single","question":"When the Sticky Bit (`drwxrwxrwt`) is enabled on a shared directory such as `/share`, who is permitted to rename or remove a file inside `/share`?","options":["A. Any user in the system who has read and execute permissions on `/share`","B. Only the file owner, the directory owner, or the `root` user","C. Only users with a UID greater than 1000","D. Nobody, not even `root`, until the Sticky Bit is removed"],"answer":"B","explanation":"Per Ch.04 (p.184), a sticky bit is a special permission set on a directory. When enabled, only the file owner, the directory owner, or the `root` user can rename or remove files within that directory."},{"id":"h4_s4_q2","type":"single","question":"When `ls -l filename` is executed, what character displayed immediately after the 9 permission bits (e.g., `-rw-rw-r--+`) indicates that the file has an Access Control List (ACL) configured, and which `setfacl` option deletes all ACL parameters?","options":["A. `.` (dot); `setfacl -m`","B. `+` (plus sign); `setfacl -b`","C. `*` (asterisk); `setfacl -d`","D. `@` (at sign); `setfacl -R`"],"answer":"B","explanation":"Per Ch.04 (p.185 & p.187), if a plus sign (`+`) is displayed next to the file permission in `ls -l`, the file has an ACL. `setfacl -b` deletes all ACL parameters."},{"id":"h4_s4_q3","type":"multiple","question":"Which of the following statements accurately compare `su` and `sudo` in openEuler?","options":["A. `su` requires the password of the target user (e.g., `root`), whereas `sudo` requires the password of the current user.","B. By default, commands executed via `sudo` are recorded in audit logs, whereas commands executed after `su` are not recorded.","C. In `/etc/sudoers`, a `%` symbol before a name (such as `%wheel`) indicates privilege escalation for a user group.","D. `sudo -k` forces the user to enter a password upon the next execution of `sudo`, even within the default 5-minute timeout window."],"answer":"ABCD","explanation":"Per Ch.04 (pp.190–193), all four statements match the official Huawei training material."}],"reference_figures":[]}}]},{"hour_number":5,"folder_name":"Hour-05-Software-Services-Process-and-Task-Management","title":"Software Packages, systemd Services, Processes & Scheduled Tasks","chapter_ref":"Chapter 04 Part 2 (pp. 194–251)","duration_mins":60,"overview":"Master RPM package operations (`rpm -ivh/-Uvh/-Fvh/-e/-qa/-ql/-qf/-qc`), configure local and remote DNF repositories (`/etc/dnf/dnf.conf`, `/etc/yum.repos.d/*.repo`, `createrepo`, `dnf config-manager`), manage `systemd` unit files (`systemctl`) and `journald` logs (`journalctl`), control processes and priorities (`ps`, `top`, `nice`, `renice`, `kill`), and automate one-off (`at`) and periodic (`crontab`) tasks.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-RPM-Package-Management-and-DNF-Repositories","exercise_slug":"02-Exercise-RPM-Queries-and-Local-Repo-Creation-Lab","lecture":{"title":"RPM Package Management & DNF Repository Configuration (`rpm`, `createrepo`)","duration_mins":7,"pdf_ref":"Ch.04, pp. 194–206","objectives":["Parse the standard RPM package naming format (`name-version-release.arch.rpm`) and execute install, upgrade, uninstall, and query commands (`rpm`)","Explain why DNF ('next-generation YUM') outperforms YUM using `libsolv` and Python 3 plugins","Configure `/etc/dnf/dnf.conf`, `/etc/yum.repos.d/*.repo` files, and local software repositories using `createrepo`"],"content_markdown":"### 1. RPM Package Naming & Core `rpm` Commands\n* **RPM Naming Format:** `name-version-release.arch.rpm` (e.g., `iSulad-2.0.11-1.oe2203.aarch64.rpm`).\n* **Installation, Upgrade & Removal:**\n  * **`rpm -ivh example.rpm`:** Installs a package (`-i` install, `-v` verbose details, `-h` hash `#` progress bar).\n  * **`rpm -Uvh example.rpm`:** Upgrades a package (replaces existing package, or **installs it if not yet installed**).\n  * **`rpm -Fvh example.rpm`:** Freshens/upgrades **only if an earlier version is already installed**.\n  * **`rpm -e example`:** Uninstalls a package. Force options: **`--nodeps`** (ignore dependencies—use with caution) and **`--allmatches`** (remove all versions); **`--force`** (forcibly install/overwrite files).\n* **Query & Validation Options (`rpm -q...`):**\n  * **`-q <pkg>`:** Checks if package is installed. **`-qa`:** Lists **all** installed RPM packages.\n  * **`-qi <pkg>`:** Displays detailed package description/metadata (`-qpi` for an uninstalled `.rpm` file).\n  * **`-ql <pkg>`:** Lists all files and full paths installed by the package (`-qpl` for an uninstalled `.rpm` file).\n  * **`-qf <filepath>`:** Queries **which RPM package owns a specific file** on the server.\n  * **`-qc <pkg>` / `-qd <pkg>`:** Lists **configuration files (`-qc`)** or **documentation files (`-qd`)**.\n  * **`-Va`:** Validates all installed RPM packages to detect missing or modified files.\n<!-- PDF_FIGS_START -->\n![RPM Package Naming Convention Anatomy (name-version-release.arch.rpm) (Official Reference: p. 195)](./assets/images/p2_h5s1_rpm_naming.png)\n*Figure: RPM Package Naming Convention Anatomy (name-version-release.arch.rpm) (Official Reference: p. 195)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Evolution from YUM to DNF & `/etc/dnf/dnf.conf`\n* **Why DNF?** RPM does not resolve dependencies automatically. **YUM** solved dependency management but suffered from high memory usage and slow dependency resolution on large trees. **DNF (Next-Generation YUM)** maintains CLI compatibility with YUM while using the **`libsolv`** library for fast dependency resolution, lower memory footprint, and a modern **Python 3** plugin architecture.\n* **Global Config (`/etc/dnf/dnf.conf` — `[main]` section):**\n  * **`cachedir`:** Directory storing downloaded RPMs and database cache.\n  * **`best`:** Always attempts to install the latest available version (default: **`True`**).\n  * **`installonly_limit`:** Max number of concurrent versions for `installonlypkgs` like kernels (default: **`3`**; do not decrease).\n  * **`clean_requirements_on_remove`:** Automatically removes unused dependency packages during `dnf remove` (default: **`True`**).\n\n---\n\n### 3. Configuring `/etc/yum.repos.d/*.repo` & Local Repositories\nRepository files reside in **`/etc/yum.repos.d/`** by default:\n```ini\n[OS]\nname=OS\nbaseurl=https://repo.openeuler.org/openEuler-24.03-LTS-SP1/OS/basearch/\nmetalink=https://mirrors.openeuler.org/metalink?repo=releasever/OS&arch=basearch\nmetadata_expire=1h\nenabled=1\ngpgcheck=1\ngpgkey=http://repo.openeuler.org/openEuler-24.03-LTS-SP1/OS/basearch/RPM-GPG-KEY-openEuler\n```\n* **`baseurl`** supports three protocols: `http://`, `ftp://`, and **`file:///`** (for local paths).\n* **Creating a Local Repository (`createrepo`):**\n  1. Install tool as root: `dnf install createrepo`\n  2. Place RPM packages in `/mnt/local_repo/`\n  3. Generate metadata database: **`createrepo --database /mnt/local_repo`**","key_takeaways":["rpm -ivh installs, rpm -Uvh upgrades (or installs), rpm -Fvh upgrades only existing packages, rpm -e uninstalls, rpm -qf <file> finds which package owns a file, and rpm -qc lists config files.","DNF ('next-generation YUM') uses the libsolv library and Python 3 plugins; its global config is /etc/dnf/dnf.conf (default installonly_limit=3) and repo files live in /etc/yum.repos.d/.","To build a local repository from a folder of RPMs, install createrepo and run 'createrepo --database /mnt/local_repo'."],"exam_traps":["EXAM TRAP: Do not confuse /etc/dnf/dnf.conf (global DNF configuration) with /etc/yum.repos.d/ (default directory for .repo files)!","EXAM TRAP: To query files inside an UNINSTALLED .rpm package file on disk, you must include the '-p' flag (e.g., 'rpm -qpl pkg.rpm' or 'rpm -qilp pkg.rpm')."],"content_html":"<h3>1. RPM Package Naming &amp; Core <code class=\"inline-code\">rpm<\/code> Commands<\/h3>\n<ul class=\"md-list\">\n<li><strong>RPM Naming Format:<\/strong> <code class=\"inline-code\">name-version-release.arch.rpm<\/code> (e.g., <code class=\"inline-code\">iSulad-2.0.11-1.oe2203.aarch64.rpm<\/code>).<\/li>\n<li><strong>Installation, Upgrade &amp; Removal:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">rpm -ivh example.rpm<\/code>:<\/strong> Installs a package (<code class=\"inline-code\">-i<\/code> install, <code class=\"inline-code\">-v<\/code> verbose details, <code class=\"inline-code\">-h<\/code> hash <code class=\"inline-code\">#<\/code> progress bar).<\/li>\n<li><strong><code class=\"inline-code\">rpm -Uvh example.rpm<\/code>:<\/strong> Upgrades a package (replaces existing package, or <strong>installs it if not yet installed<\/strong>).<\/li>\n<li><strong><code class=\"inline-code\">rpm -Fvh example.rpm<\/code>:<\/strong> Freshens/upgrades <strong>only if an earlier version is already installed<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">rpm -e example<\/code>:<\/strong> Uninstalls a package. Force options: <strong><code class=\"inline-code\">--nodeps<\/code><\/strong> (ignore dependencies—use with caution) and <strong><code class=\"inline-code\">--allmatches<\/code><\/strong> (remove all versions); <strong><code class=\"inline-code\">--force<\/code><\/strong> (forcibly install/overwrite files).<\/li>\n<li><strong>Query &amp; Validation Options (<code class=\"inline-code\">rpm -q...<\/code>):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-q &lt;pkg&gt;<\/code>:<\/strong> Checks if package is installed. <strong><code class=\"inline-code\">-qa<\/code>:<\/strong> Lists <strong>all<\/strong> installed RPM packages.<\/li>\n<li><strong><code class=\"inline-code\">-qi &lt;pkg&gt;<\/code>:<\/strong> Displays detailed package description/metadata (<code class=\"inline-code\">-qpi<\/code> for an uninstalled <code class=\"inline-code\">.rpm<\/code> file).<\/li>\n<li><strong><code class=\"inline-code\">-ql &lt;pkg&gt;<\/code>:<\/strong> Lists all files and full paths installed by the package (<code class=\"inline-code\">-qpl<\/code> for an uninstalled <code class=\"inline-code\">.rpm<\/code> file).<\/li>\n<li><strong><code class=\"inline-code\">-qf &lt;filepath&gt;<\/code>:<\/strong> Queries <strong>which RPM package owns a specific file<\/strong> on the server.<\/li>\n<li><strong><code class=\"inline-code\">-qc &lt;pkg&gt;<\/code> / <code class=\"inline-code\">-qd &lt;pkg&gt;<\/code>:<\/strong> Lists <strong>configuration files (<code class=\"inline-code\">-qc<\/code>)<\/strong> or <strong>documentation files (<code class=\"inline-code\">-qd<\/code>)<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">-Va<\/code>:<\/strong> Validates all installed RPM packages to detect missing or modified files.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h5s1_rpm_naming.png\" alt=\"RPM Package Naming Convention Anatomy (name-version-release.arch.rpm)\" data-caption=\"RPM Package Naming Convention Anatomy (name-version-release.arch.rpm) (Official Reference: p. 195)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>RPM Package Naming Convention Anatomy (name-version-release.arch.rpm)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 195 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Evolution from YUM to DNF &amp; <code class=\"inline-code\">/etc/dnf/dnf.conf<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong>Why DNF?<\/strong> RPM does not resolve dependencies automatically. <strong>YUM<\/strong> solved dependency management but suffered from high memory usage and slow dependency resolution on large trees. <strong>DNF (Next-Generation YUM)<\/strong> maintains CLI compatibility with YUM while using the <strong><code class=\"inline-code\">libsolv<\/code><\/strong> library for fast dependency resolution, lower memory footprint, and a modern <strong>Python 3<\/strong> plugin architecture.<\/li>\n<li><strong>Global Config (<code class=\"inline-code\">/etc/dnf/dnf.conf<\/code> — <code class=\"inline-code\">[main]<\/code> section):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">cachedir<\/code>:<\/strong> Directory storing downloaded RPMs and database cache.<\/li>\n<li><strong><code class=\"inline-code\">best<\/code>:<\/strong> Always attempts to install the latest available version (default: <strong><code class=\"inline-code\">True<\/code><\/strong>).<\/li>\n<li><strong><code class=\"inline-code\">installonly_limit<\/code>:<\/strong> Max number of concurrent versions for <code class=\"inline-code\">installonlypkgs<\/code> like kernels (default: <strong><code class=\"inline-code\">3<\/code><\/strong>; do not decrease).<\/li>\n<li><strong><code class=\"inline-code\">clean_requirements_on_remove<\/code>:<\/strong> Automatically removes unused dependency packages during <code class=\"inline-code\">dnf remove<\/code> (default: <strong><code class=\"inline-code\">True<\/code><\/strong>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Configuring <code class=\"inline-code\">/etc/yum.repos.d/*.repo<\/code> &amp; Local Repositories<\/h3>\n<p>Repository files reside in <strong><code class=\"inline-code\">/etc/yum.repos.d/<\/code><\/strong> by default:<\/p>\n<div class=\"code-block\"><div class=\"code-header\"><span>INI<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>[OS]\nname=OS\nbaseurl=https://repo.openeuler.org/openEuler-24.03-LTS-SP1/OS/basearch/\nmetalink=https://mirrors.openeuler.org/metalink?repo=releasever/OS&amp;arch=basearch\nmetadata_expire=1h\nenabled=1\ngpgcheck=1\ngpgkey=http://repo.openeuler.org/openEuler-24.03-LTS-SP1/OS/basearch/RPM-GPG-KEY-openEuler<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">baseurl<\/code><\/strong> supports three protocols: <code class=\"inline-code\">http://<\/code>, <code class=\"inline-code\">ftp://<\/code>, and <strong><code class=\"inline-code\">file:///<\/code><\/strong> (for local paths).<\/li>\n<li><strong>Creating a Local Repository (<code class=\"inline-code\">createrepo<\/code>):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Install tool as root: <code class=\"inline-code\">dnf install createrepo<\/code><\/li>\n<li>Place RPM packages in <code class=\"inline-code\">/mnt/local_repo/<\/code><\/li>\n<li>Generate metadata database: <strong><code class=\"inline-code\">createrepo --database /mnt/local_repo<\/code><\/strong><\/li>\n<\/ol>"},"exercise":{"title":"Hands-On Lab: Auditing Installed RPMs and Building a Local Repository with `createrepo`","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You need to audit which RPM package owns `/etc/passwd`, list all configuration files belonging to the `bash` RPM package, and initialize a local software repository in `/mnt/local_repo` using `createrepo`.","instructions":["Step 1: Query which RPM package owns `/etc/passwd` using `rpm -qf /etc/passwd`.","Step 2: Query all configuration files installed by the `bash` package using `rpm -qc bash`.","Step 3: Initialize the local repository database in `/mnt/local_repo` using `createrepo --database /mnt/local_repo`."],"starter_code":"# Step 1: Query which RPM package owns /etc/passwd\n<rpm_qf_command>\n\n# Step 2: Query configuration files in the bash RPM package\n<rpm_qc_command>\n\n# Step 3: Create local repository metadata in /mnt/local_repo\n<createrepo_command>","solution_code":"# Step 1: Query which RPM package owns /etc/passwd\nrpm -qf /etc/passwd\n\n# Step 2: Query configuration files in the bash RPM package\nrpm -qc bash\n\n# Step 3: Create local repository metadata in /mnt/local_repo\ncreaterepo --database /mnt/local_repo","hints":["Use `rpm -qf /etc/passwd` to find the owning RPM package.","Use `rpm -qc bash` to list configuration files.","Use `createrepo --database /mnt/local_repo` (exact command from Ch.04 p.206)."],"validation_checks":[{"step":1,"description":"Find package owning /etc/passwd with rpm -qf","required_any":["rpm -qf /etc/passwd"],"feedback_fail":"Use 'rpm -qf /etc/passwd' to query the owning package."},{"step":2,"description":"List configuration files of bash with rpm -qc","required_any":["rpm -qc bash"],"feedback_fail":"Use 'rpm -qc bash' to list configuration files."},{"step":3,"description":"Create local repository metadata with createrepo --database","required_any":["createrepo --database /mnt/local_repo","createrepo /mnt/local_repo"],"feedback_fail":"Use 'createrepo --database /mnt/local_repo'."}],"simulated_output":"setup-2.14.5-2.oe2403.noarch\n\n/etc/skel/.bash_logout\n/etc/skel/.bash_profile\n/etc/skel/.bashrc\n\nDirectory walk started\nDirectory walk done - 42 packages\nTemporary output repo path: /mnt/local_repo/.repodata/\nPreparing sqlite DBs\nPool started (with 5 workers)\nPool finished","quiz_questions":[{"id":"h5_s1_q1","type":"single","question":"Which `rpm` command option queries which installed RPM package a specific server file (such as `/etc/passwd`) belongs to, and which option lists only the configuration files in an installed RPM package?","options":["A. `rpm -ql` and `rpm -qi`","B. `rpm -qf` and `rpm -qc`","C. `rpm -qa` and `rpm -qd`","D. `rpm -qp` and `rpm -Va`"],"answer":"B","explanation":"Per Ch.04 (pp.195, 200), `rpm -qf` searches for the RPM package to which a specified file belongs, and `rpm -qc` queries the configuration files in an installed software package."},{"id":"h5_s1_q2","type":"single","question":"In the global DNF configuration file `/etc/dnf/dnf.conf`, what is the default value of `installonly_limit`, and what does `clean_requirements_on_remove=True` do?","options":["A. `installonly_limit=1`; deletes `/etc/yum.repos.d/` on package removal","B. `installonly_limit=3`; deletes dependencies that are no longer used during `dnf remove`","C. `installonly_limit=5`; disables GPG signature checks","D. `installonly_limit=10`; clears the RPM database cache every hour"],"answer":"B","explanation":"Per Ch.04 (p.204), `installonly_limit` defaults to 3, and `clean_requirements_on_remove` (default True) deletes dependencies that were installed automatically and are no longer needed during `dnf remove`."},{"id":"h5_s1_q3","type":"multiple","question":"Which of the following statements about DNF and software repositories on openEuler are TRUE?","options":["A. DNF leverages the `libsolv` library for faster dependency resolution and supports a plugin system based on Python 3.","B. By default, `.repo` configuration files in openEuler are stored in the `/etc/yum.repos.d/` directory.","C. The `baseurl` parameter in a `.repo` file supports `http://`, `ftp://`, and `file:///` protocols.","D. The `createrepo --database <dir>` command initializes metadata for a local RPM software repository."],"answer":"ABCD","explanation":"Per Ch.04 (pp.202–206), all four statements are explicitly stated in the official training material."}],"reference_figures":[{"slug":"p2_h5s1_rpm_naming","title":"RPM Package Naming Convention Anatomy (name-version-release.arch.rpm)","pdf_page":195}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-DNF-Package-and-Group-Management","exercise_slug":"04-Exercise-DNF-Config-Manager-and-Package-Ops-Lab","lecture":{"title":"DNF Repository, Package & Package Group Management (`dnf`, `dnf config-manager`)","duration_mins":7,"pdf_ref":"Ch.04, pp. 207–214","objectives":["Add, list, enable, and disable repositories using `dnf config-manager` (`--add-repo`, `--set-enable`, `--set-disable`) and `dnf repolist`","Search, list, inspect, download (with dependencies), install, and remove RPM packages using `dnf`","Query, install, and remove software package groups (`dnf groups summary`, `dnf group list`, `dnf group install`, `dnf group remove`)"],"content_markdown":"### 1. Managing Repositories with `dnf config-manager` and `dnf repolist`\nOnly the **`root`** user can add, enable, or disable `.repo` files in `/etc/yum.repos.d/`:\n* **Add a New Repository:**\n  ```bash\n  dnf config-manager --add-repo repository_url\n  ```\n  Automatically generates a corresponding `.repo` file inside `/etc/yum.repos.d/`.\n* **View Repository IDs:**\n  ```bash\n  dnf repolist\n  ```\n* **Enable or Disable a Repository by ID:**\n  ```bash\n  dnf config-manager --set-enable repository_id\n  dnf config-manager --set-disable repository_id\n  ```\n\n---\n\n### 2. Searching, Listing, Downloading, Installing & Removing Packages\n| Task | DNF Command Syntax & Key Options |\n| :--- | :--- |\n| **Search by keyword** | **`dnf search term`** (searches package names, abbreviations, and descriptions). |\n| **List packages** | **`dnf list all`** (lists all installed and available packages) or **`dnf list glob_expression...`**. |\n| **View package details** | **`dnf info package_name...`** |\n| **Download RPMs** | **`dnf download package_name`**. To also download uninstalled dependencies, add **`--resolve`**: **`dnf download --resolve package_name`**. |\n| **Install packages** | **`dnf install package_name`**. When installing multiple packages simultaneously (`dnf install pkg1 pkg2 --setopt=strict=0` or `strict=False` in `/etc/dnf/dnf.conf`), available packages are still installed even if one package name is unavailable. |\n| **Remove packages** | **`dnf remove package_name...`** |\n\n---\n\n### 3. Managing Software Package Groups (`dnf group`)\nA **package group** is a curated collection of related software packages (such as `System Tools` or `Development Tools`) identified by both a **group name** and a **group ID**:\n* **View Summary of Installed & Available Groups:**\n  ```bash\n  dnf groups summary\n  ```\n* **List All Package Groups and Group IDs:**\n  ```bash\n  dnf group list\n  ```\n* **Install or Remove a Package Group:**\n  ```bash\n  dnf group install group_name/groupid\n  dnf group remove group_name/groupid\n  ```","key_takeaways":["Use 'dnf config-manager --add-repo <url>' to add a repository in /etc/yum.repos.d/, 'dnf repolist' to check repo IDs, and '--set-enable' / '--set-disable' to toggle them.","Use 'dnf download --resolve <pkg>' to download an RPM package along with all its uninstalled dependency packages.","Use 'dnf groups summary' and 'dnf group list' to inspect software package groups, and 'dnf group install <name/id>' or 'dnf group remove <name/id>' to manage them."],"exam_traps":["EXAM TRAP: Only the root user can add a .repo file or run 'dnf config-manager --add-repo' / '--set-enable' / '--set-disable'.","EXAM TRAP: When installing multiple packages at once with 'dnf install pkg1 pkg2', adding '--setopt=strict=0' (or setting 'strict=False' in /etc/dnf/dnf.conf) allows DNF to skip unavailable packages and continue installing valid ones."],"content_html":"<h3>1. Managing Repositories with <code class=\"inline-code\">dnf config-manager<\/code> and <code class=\"inline-code\">dnf repolist<\/code><\/h3>\n<p>Only the <strong><code class=\"inline-code\">root<\/code><\/strong> user can add, enable, or disable <code class=\"inline-code\">.repo<\/code> files in <code class=\"inline-code\">/etc/yum.repos.d/<\/code>:<\/p>\n<ul class=\"md-list\">\n<li><strong>Add a New Repository:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  dnf config-manager --add-repo repository_url<\/code><\/pre><\/div>\n<p>Automatically generates a corresponding <code class=\"inline-code\">.repo<\/code> file inside <code class=\"inline-code\">/etc/yum.repos.d/<\/code>.<\/p>\n<ul class=\"md-list\">\n<li><strong>View Repository IDs:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  dnf repolist<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Enable or Disable a Repository by ID:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  dnf config-manager --set-enable repository_id\n  dnf config-manager --set-disable repository_id<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Searching, Listing, Downloading, Installing &amp; Removing Packages<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Task<\/th><th>DNF Command Syntax &amp; Key Options<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Search by keyword<\/strong><\/td><td><strong><code class=\"inline-code\">dnf search term<\/code><\/strong> (searches package names, abbreviations, and descriptions).<\/td><\/tr>\n<tr><td><strong>List packages<\/strong><\/td><td><strong><code class=\"inline-code\">dnf list all<\/code><\/strong> (lists all installed and available packages) or <strong><code class=\"inline-code\">dnf list glob_expression...<\/code><\/strong>.<\/td><\/tr>\n<tr><td><strong>View package details<\/strong><\/td><td><strong><code class=\"inline-code\">dnf info package_name...<\/code><\/strong><\/td><\/tr>\n<tr><td><strong>Download RPMs<\/strong><\/td><td><strong><code class=\"inline-code\">dnf download package_name<\/code><\/strong>. To also download uninstalled dependencies, add <strong><code class=\"inline-code\">--resolve<\/code><\/strong>: <strong><code class=\"inline-code\">dnf download --resolve package_name<\/code><\/strong>.<\/td><\/tr>\n<tr><td><strong>Install packages<\/strong><\/td><td><strong><code class=\"inline-code\">dnf install package_name<\/code><\/strong>. When installing multiple packages simultaneously (<code class=\"inline-code\">dnf install pkg1 pkg2 --setopt=strict=0<\/code> or <code class=\"inline-code\">strict=False<\/code> in <code class=\"inline-code\">/etc/dnf/dnf.conf<\/code>), available packages are still installed even if one package name is unavailable.<\/td><\/tr>\n<tr><td><strong>Remove packages<\/strong><\/td><td><strong><code class=\"inline-code\">dnf remove package_name...<\/code><\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Managing Software Package Groups (<code class=\"inline-code\">dnf group<\/code>)<\/h3>\n<p>A <strong>package group<\/strong> is a curated collection of related software packages (such as <code class=\"inline-code\">System Tools<\/code> or <code class=\"inline-code\">Development Tools<\/code>) identified by both a <strong>group name<\/strong> and a <strong>group ID<\/strong>:<\/p>\n<ul class=\"md-list\">\n<li><strong>View Summary of Installed &amp; Available Groups:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  dnf groups summary<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>List All Package Groups and Group IDs:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  dnf group list<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Install or Remove a Package Group:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  dnf group install group_name/groupid\n  dnf group remove group_name/groupid<\/code><\/pre><\/div>"},"exercise":{"title":"Hands-On Lab: Repository Management (`dnf config-manager`), Dependency Download & Group Installation","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are configuring software packages on an openEuler node. Add the local repository `file:///mnt/local_repo` using `dnf config-manager`, download the `httpd` package along with its uninstalled dependencies, and list all available DNF package groups.","instructions":["Step 1: Add the repository `file:///mnt/local_repo` using `dnf config-manager --add-repo file:///mnt/local_repo`.","Step 2: Download the `httpd` RPM package and all its uninstalled dependencies using `dnf download --resolve httpd`.","Step 3: List all installed and available software package groups using `dnf group list`."],"starter_code":"# Step 1: Add local repository file:///mnt/local_repo\n<dnf_add_repo_command>\n\n# Step 2: Download httpd package and its uninstalled dependencies\n<dnf_download_command>\n\n# Step 3: List all software package groups\n<dnf_group_list_command>","solution_code":"# Step 1: Add local repository file:///mnt/local_repo\ndnf config-manager --add-repo file:///mnt/local_repo\n\n# Step 2: Download httpd package and its uninstalled dependencies\ndnf download --resolve httpd\n\n# Step 3: List all software package groups\ndnf group list","hints":["Use `dnf config-manager --add-repo file:///mnt/local_repo`.","Use `dnf download --resolve httpd` (Ch.04 p.212).","Use `dnf group list` (Ch.04 p.213)."],"validation_checks":[{"step":1,"description":"Add repository with dnf config-manager --add-repo","required_any":["dnf config-manager --add-repo"],"feedback_fail":"Use 'dnf config-manager --add-repo file:///mnt/local_repo'."},{"step":2,"description":"Download httpd with dependencies using dnf download --resolve","required_any":["dnf download --resolve httpd"],"feedback_fail":"Use 'dnf download --resolve httpd' to download the package and its dependencies."},{"step":3,"description":"List package groups with dnf group list","required_any":["dnf group list","dnf groups summary"],"feedback_fail":"Use 'dnf group list' to list available software package groups."}],"simulated_output":"Adding repo from: file:///mnt/local_repo\n\nLast metadata expiration check: 0:00:05 ago.\n(1/3): apr-1.7.4-1.oe2403.aarch64.rpm          125 kB/s | 108 kB     00:00\n(2/3): apr-util-1.6.3-1.oe2403.aarch64.rpm     110 kB/s |  92 kB     00:00\n(3/3): httpd-2.4.58-1.oe2403.aarch64.rpm       1.2 MB/s | 1.4 MB     00:01\n\nAvailable Environment Groups:\n   Minimal Install\n   Server\nAvailable Groups:\n   Development Tools\n   System Tools","quiz_questions":[{"id":"h5_s2_q1","type":"single","question":"Which command generates a new `.repo` configuration file in `/etc/yum.repos.d/` from a specified repository URL?","options":["A. `dnf repolist --create repository_url`","B. `dnf config-manager --add-repo repository_url`","C. `createrepo --url repository_url`","D. `rpm -ivh repository_url`"],"answer":"B","explanation":"Per Ch.04 (p.207), running `dnf config-manager --add-repo repository_url` as user `root` automatically generates the corresponding `.repo` file in `/etc/yum.repos.d/`."},{"id":"h5_s2_q2","type":"single","question":"When using `dnf download package_name` to download an RPM file without installing it, which option must be added to also download any uninstalled dependencies?","options":["A. --nodeps","B. --resolve","C. --allmatches","D. --database"],"answer":"B","explanation":"Per Ch.04 (p.212), if you need to download a dependency that is not installed, add `--resolve` (`dnf download --resolve package_name`)."},{"id":"h5_s2_q3","type":"multiple","question":"Which of the following DNF commands are valid for managing software repositories and package groups in openEuler?","options":["A. `dnf config-manager --set-enable repository`","B. `dnf config-manager --set-disable repository`","C. `dnf groups summary` and `dnf group list`","D. `dnf group install group_name/groupid` and `dnf group remove group_name/groupid`"],"answer":"ABCD","explanation":"Per Ch.04 (pp.208, 213–214), all four command sets are standard DNF operations in openEuler."}],"reference_figures":[]}},{"sprint_number":3,"lecture_slug":"05-Lecture-systemd-Service-and-Journald-Log-Management","exercise_slug":"06-Exercise-Systemctl-and-Journalctl-Service-Lab","lecture":{"title":"`systemd` Service Architecture, Unit Files & `journald` Log Management","duration_mins":7,"pdf_ref":"Ch.04, pp. 215–223","objectives":["Explain `systemd` (PID 1) advantages over SysVinit, its 3 invoked kernel modules (`cgroups`, `autofs`, `kdbus`), and its 12 Unit types","Parse the 3 sections of a `systemd` unit file (`[Unit]`, `[Service]`, `[Install]`) and key directives (`After=`, `Requires=`, `Wants=`, `ExecStart=`, `WantedBy=`)","Control service lifecycle with `systemctl` and query centralized service logs with `journalctl -u <service>`"],"content_markdown":"### 1. `systemd` Architecture (PID 1) & Unit Types\n* **What is `systemd`?** **`systemd`** is the **first system program (`PID 1`)** loaded by the Linux kernel at boot. Compared with legacy `SysVinit`, `systemd` provides fast parallel activation, on-demand activation, process lifecycle tracking via **cgroups**, mount/automount management, transactional dependency management, backwards compatibility with SysVinit scripts, and system snapshots/restoration.\n* **Three Kernel Modules Directly Invoked by `systemd` (Ch.04, p.217):**\n  1. **`cgroups`**: Resource control and restriction.\n  2. **`autofs`**: Automatic file system mounting.\n  3. **`kdbus`**: Kernel message passing.\n* **12 `systemd` Unit Types:**\n  * **`service`** (system service), **`target`** (group of units / runlevel, e.g., `multi-user.target`, `graphical.target`), **`automount`**, **`device`**, **`mount`**, **`path`**, **`scope`** (externally created process), **`snapshot`**, **`slice`** (hierarchical cgroup process tree), **`socket`** (IPC socket), **`swap`**, and **`timer`**.\n<!-- PDF_FIGS_START -->\n![systemd Service Manager Architecture Stack (Official Reference: p. 217)](./assets/images/p2_h5s3_systemd_arch.png)\n*Figure: systemd Service Manager Architecture Stack (Official Reference: p. 217)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Anatomy of a `systemd` Unit File (3 Sections)\nA complete `.service` unit file consists of **three sections** (Ch.04, p.219):\n\n| Section | Key Directives & Meaning |\n| :--- | :--- |\n| **`[Unit]`** | Defines service metadata, startup order, and dependencies:<br>• **`Description=`**: Brief description shown in `systemctl status`.<br>• **`After=`**: Ordering rule—start this unit *after* the specified unit starts.<br>• **`Requires=`**: **Hard dependency**—startup fails if the required dependency is missing/fails.<br>• **`Wants=`**: **Soft dependency**—if the dependency is missing/fails, this service **can still start**. |\n| **`[Service]`** | Defines service execution behavior:<br>• **`ExecStart=` (Mandatory):** Command to start the service.<br>• **`ExecStop=`**: Command to stop the service.<br>• **`Restart=`**: Auto-restart policy (`always`, `on-failure`, etc.).<br>• **`User=`**: User account under which the service runs (`root` by default). |\n| **`[Install]`** | Defines how `systemctl enable` integrates the service into boot targets:<br>• **`WantedBy=`**: Target unit associated when enabled (e.g., `multi-user.target`). |\n\n---\n\n### 3. `systemctl` Operations & `journald` (`journalctl`)\n* **Service Lifecycle Commands (`systemctl`):**\n  * **`systemctl start / stop / restart <name>.service`**\n  * **`systemctl enable / disable <name>.service`** (enable/disable auto-start at boot)\n  * **`systemctl list-units --type service`** (add **`-all`** to view all active and inactive services)\n  * **`systemctl status <name>.service`**: Displays `Loaded` (path & enabled state), `Active` (running status & timestamp), `Main PID`, `CGroup`, and recent log fragments.\n* **Centralized Log Management (`journald` & `journalctl`):**\n  * `journald` is a subsystem of `systemd` that automatically records all service logs.\n  * While `systemctl status <service>` shows only recent log fragments, **`journalctl -u <service_name>`** displays the **complete service logs**!","key_takeaways":["systemd is PID 1 and directly invokes 3 kernel modules: cgroups (resource control), autofs (auto-mounting), and kdbus (message passing).","A systemd unit file has 3 sections: [Unit] (Description, After, Requires [hard dependency], Wants [soft dependency]), [Service] (ExecStart [mandatory], ExecStop, Restart, User), and [Install] (WantedBy).","Use 'systemctl start/stop/restart/enable/disable/status <name>.service' to manage services, and 'journalctl -u <service>' to view complete service logs."],"exam_traps":["EXAM TRAP: In the [Unit] section, 'Requires=' declares a HARD dependency (service fails if dependency is missing), whereas 'Wants=' declares a SOFT dependency (service still starts if dependency is missing)!","EXAM TRAP: 'systemctl status <service>' displays only service log fragments; use 'journalctl -u <service>' to display complete service logs."],"content_html":"<h3>1. <code class=\"inline-code\">systemd<\/code> Architecture (PID 1) &amp; Unit Types<\/h3>\n<ul class=\"md-list\">\n<li><strong>What is <code class=\"inline-code\">systemd<\/code>?<\/strong> <strong><code class=\"inline-code\">systemd<\/code><\/strong> is the <strong>first system program (<code class=\"inline-code\">PID 1<\/code>)<\/strong> loaded by the Linux kernel at boot. Compared with legacy <code class=\"inline-code\">SysVinit<\/code>, <code class=\"inline-code\">systemd<\/code> provides fast parallel activation, on-demand activation, process lifecycle tracking via <strong>cgroups<\/strong>, mount/automount management, transactional dependency management, backwards compatibility with SysVinit scripts, and system snapshots/restoration.<\/li>\n<li><strong>Three Kernel Modules Directly Invoked by <code class=\"inline-code\">systemd<\/code> (Ch.04, p.217):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">cgroups<\/code><\/strong>: Resource control and restriction.<\/li>\n<li><strong><code class=\"inline-code\">autofs<\/code><\/strong>: Automatic file system mounting.<\/li>\n<li><strong><code class=\"inline-code\">kdbus<\/code><\/strong>: Kernel message passing.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>12 <code class=\"inline-code\">systemd<\/code> Unit Types:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">service<\/code><\/strong> (system service), <strong><code class=\"inline-code\">target<\/code><\/strong> (group of units / runlevel, e.g., <code class=\"inline-code\">multi-user.target<\/code>, <code class=\"inline-code\">graphical.target<\/code>), <strong><code class=\"inline-code\">automount<\/code><\/strong>, <strong><code class=\"inline-code\">device<\/code><\/strong>, <strong><code class=\"inline-code\">mount<\/code><\/strong>, <strong><code class=\"inline-code\">path<\/code><\/strong>, <strong><code class=\"inline-code\">scope<\/code><\/strong> (externally created process), <strong><code class=\"inline-code\">snapshot<\/code><\/strong>, <strong><code class=\"inline-code\">slice<\/code><\/strong> (hierarchical cgroup process tree), <strong><code class=\"inline-code\">socket<\/code><\/strong> (IPC socket), <strong><code class=\"inline-code\">swap<\/code><\/strong>, and <strong><code class=\"inline-code\">timer<\/code><\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h5s3_systemd_arch.png\" alt=\"systemd Service Manager Architecture Stack\" data-caption=\"systemd Service Manager Architecture Stack (Official Reference: p. 217)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>systemd Service Manager Architecture Stack<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 217 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Anatomy of a <code class=\"inline-code\">systemd<\/code> Unit File (3 Sections)<\/h3>\n<p>A complete <code class=\"inline-code\">.service<\/code> unit file consists of <strong>three sections<\/strong> (Ch.04, p.219):<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Section<\/th><th>Key Directives &amp; Meaning<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">[Unit]<\/code><\/strong><\/td><td>Defines service metadata, startup order, and dependencies:&lt;br&gt;• <strong><code class=\"inline-code\">Description=<\/code><\/strong>: Brief description shown in <code class=\"inline-code\">systemctl status<\/code>.&lt;br&gt;• <strong><code class=\"inline-code\">After=<\/code><\/strong>: Ordering rule—start this unit <em>after<\/em> the specified unit starts.&lt;br&gt;• <strong><code class=\"inline-code\">Requires=<\/code><\/strong>: <strong>Hard dependency<\/strong>—startup fails if the required dependency is missing/fails.&lt;br&gt;• <strong><code class=\"inline-code\">Wants=<\/code><\/strong>: <strong>Soft dependency<\/strong>—if the dependency is missing/fails, this service <strong>can still start<\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">[Service]<\/code><\/strong><\/td><td>Defines service execution behavior:&lt;br&gt;• <strong><code class=\"inline-code\">ExecStart=<\/code> (Mandatory):<\/strong> Command to start the service.&lt;br&gt;• <strong><code class=\"inline-code\">ExecStop=<\/code><\/strong>: Command to stop the service.&lt;br&gt;• <strong><code class=\"inline-code\">Restart=<\/code><\/strong>: Auto-restart policy (<code class=\"inline-code\">always<\/code>, <code class=\"inline-code\">on-failure<\/code>, etc.).&lt;br&gt;• <strong><code class=\"inline-code\">User=<\/code><\/strong>: User account under which the service runs (<code class=\"inline-code\">root<\/code> by default).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">[Install]<\/code><\/strong><\/td><td>Defines how <code class=\"inline-code\">systemctl enable<\/code> integrates the service into boot targets:&lt;br&gt;• <strong><code class=\"inline-code\">WantedBy=<\/code><\/strong>: Target unit associated when enabled (e.g., <code class=\"inline-code\">multi-user.target<\/code>).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. <code class=\"inline-code\">systemctl<\/code> Operations &amp; <code class=\"inline-code\">journald<\/code> (<code class=\"inline-code\">journalctl<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Service Lifecycle Commands (<code class=\"inline-code\">systemctl<\/code>):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">systemctl start / stop / restart &lt;name&gt;.service<\/code><\/strong><\/li>\n<li><strong><code class=\"inline-code\">systemctl enable / disable &lt;name&gt;.service<\/code><\/strong> (enable/disable auto-start at boot)<\/li>\n<li><strong><code class=\"inline-code\">systemctl list-units --type service<\/code><\/strong> (add <strong><code class=\"inline-code\">-all<\/code><\/strong> to view all active and inactive services)<\/li>\n<li><strong><code class=\"inline-code\">systemctl status &lt;name&gt;.service<\/code><\/strong>: Displays <code class=\"inline-code\">Loaded<\/code> (path &amp; enabled state), <code class=\"inline-code\">Active<\/code> (running status &amp; timestamp), <code class=\"inline-code\">Main PID<\/code>, <code class=\"inline-code\">CGroup<\/code>, and recent log fragments.<\/li>\n<li><strong>Centralized Log Management (<code class=\"inline-code\">journald<\/code> &amp; <code class=\"inline-code\">journalctl<\/code>):<\/strong><\/li>\n<li><code class=\"inline-code\">journald<\/code> is a subsystem of <code class=\"inline-code\">systemd<\/code> that automatically records all service logs.<\/li>\n<li>While <code class=\"inline-code\">systemctl status &lt;service&gt;<\/code> shows only recent log fragments, <strong><code class=\"inline-code\">journalctl -u &lt;service_name&gt;<\/code><\/strong> displays the <strong>complete service logs<\/strong>!<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Managing Services (`systemctl`) and Querying Complete Logs (`journalctl -u`)","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are administering the `sshd` and `k3s` services on openEuler. Restart and enable `sshd.service`, list all running service units using `systemctl list-units --type service`, and query the complete service logs of `k3s` using `journalctl -u k3s`.","instructions":["Step 1: Restart `sshd.service` (`systemctl restart sshd.service`) and enable it to start at boot (`systemctl enable sshd.service`).","Step 2: Display all running service units using `systemctl list-units --type service`.","Step 3: View the complete logs of the `k3s` service using `journalctl -u k3s`."],"starter_code":"# Step 1: Restart and enable sshd.service\n<systemctl_restart_command>\n<systemctl_enable_command>\n\n# Step 2: List running service units\n<systemctl_list_units_command>\n\n# Step 3: View complete logs of the k3s service\n<journalctl_command>","solution_code":"# Step 1: Restart and enable sshd.service\nsystemctl restart sshd.service\nsystemctl enable sshd.service\n\n# Step 2: List running service units\nsystemctl list-units --type service\n\n# Step 3: View complete logs of the k3s service\njournalctl -u k3s","hints":["Use `systemctl restart sshd.service` and `systemctl enable sshd.service`.","Use `systemctl list-units --type service` (Ch.04 p.221).","Use `journalctl -u k3s` (Ch.04 p.223)."],"validation_checks":[{"step":1,"description":"Restart and enable sshd service with systemctl","required_any":["systemctl enable sshd"],"feedback_fail":"Include 'systemctl restart sshd.service' and 'systemctl enable sshd.service'."},{"step":2,"description":"List running service units with systemctl list-units --type service","required_any":["systemctl list-units --type service","systemctl list-units --type=service"],"feedback_fail":"Use 'systemctl list-units --type service'."},{"step":3,"description":"Query complete k3s service logs with journalctl -u k3s","required_any":["journalctl -u k3s"],"feedback_fail":"Use 'journalctl -u k3s' to display complete service logs."}],"simulated_output":"UNIT          LOAD   ACTIVE SUB     DESCRIPTION\natd.service   loaded active running Deferred execution scheduler\ncrond.service loaded active running Command Scheduler\nsshd.service  loaded active running OpenSSH server daemon\n\nJul 28 17:05:18 vbox systemd[1]: Starting Lightweight Kubernetes...\nJul 28 17:05:19 vbox k3s[76]: time=\"2026-07-28T17:05:19+08:00\" level=info msg=\"Starting k3s v1.30.2+k3s1\"","quiz_questions":[{"id":"h5_s3_q1","type":"single","question":"In a `systemd` `.service` unit file, which directive in the `[Service]` section is mandatory, and which directive in `[Unit]` declares a soft dependency that allows the service to start even if the dependency is missing?","options":["A. `ExecStart=` (mandatory); `Wants=` (soft dependency)","B. `ExecStop=` (mandatory); `Requires=` (soft dependency)","C. `WantedBy=` (mandatory); `After=` (soft dependency)","D. `Description=` (mandatory); `User=` (soft dependency)"],"answer":"A","explanation":"Per Ch.04 (p.219), `ExecStart=` is mandatory in `[Service]`, while in `[Unit]`, `Requires=` is a hard dependency and `Wants=` declares a soft dependency (the service can still start if the dependency is missing)."},{"id":"h5_s3_q2","type":"single","question":"Which command displays the complete logs recorded by `journald` for a specific `systemd` service such as `k3s`?","options":["A. `systemctl status k3s`","B. `journalctl -u k3s`","C. `dmesg -s k3s`","D. `last -f k3s`"],"answer":"B","explanation":"Per Ch.04 (p.223), `systemctl status <Service name>` displays only service log fragments, whereas `journalctl -u <Service name>` displays complete service logs."},{"id":"h5_s3_q3","type":"multiple","question":"Which three kernel modules are directly invoked by `systemd` according to the openEuler `systemd` architecture?","options":["A. `cgroups` (for resource control and restriction)","B. `autofs` (for automatic mounting)","C. `kdbus` (for kernel message passing)","D. `ext2fs` (for floppy formatting)"],"answer":"ABC","explanation":"Per Ch.04 (p.217), three key modules in the kernel are directly invoked by `systemd`: `cgroups` for resource control and restriction, `autofs` for automatic mounting, and `kdbus` for kernel message passing."}],"reference_figures":[{"slug":"p2_h5s3_systemd_arch","title":"systemd Service Manager Architecture Stack","pdf_page":217}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Process-Management-and-Scheduled-Tasks","exercise_slug":"08-Exercise-Top-Nice-Kill-At-and-Crontab-Lab","lecture":{"title":"Process Management (`ps`, `top`, `nice`, `kill`) & Scheduled Tasks (`at`, `crontab`)","duration_mins":7,"pdf_ref":"Ch.04, pp. 224–250","objectives":["Explain the 5 Linux process memory segments, Copy-on-Write (`fork`/`exec`/`exit`/`wait`) lifecycle, and 5 kernel process states","Monitor and control processes with `ps`, `top` (dynamically checks host resource usage — Ch.04 Quiz!), `nice`/`renice` (`PRI` vs. `NI`), `&`/`jobs`/`fg`/`bg`, and `kill`/`killall` signals","Schedule one-time tasks with `at` (`atq`, `atrm`) and recurring periodic tasks with `crontab` (5-field syntax `min hour dom month dow`)"],"content_markdown":"### 1. Process Memory, Lifecycle & States\n* **5 Virtual Address Space Segments (Low to High Address):** **Code segment** (read-only executable code/constants) -> **Data segment** (initialized static/global variables) -> **BSS segment** (uninitialized static/global variables) -> **Heap** (dynamic memory) -> **Stack** (local variables).\n* **Lifecycle & Copy-on-Write (COW):** Parent calls **`fork()`** (shares address space via COW) -> Child calls **`exec()`** (loads new program; kernel allocates new physical pages on write) -> Child calls **`exit()`** and becomes a **Zombie process** until the parent reaps it via **`wait()`**.\n* **5 Process States (Ch.04, p.227):**\n  * **`TASK_RUNNING` (`running/0`):** Running in user/kernel space or ready in the run queue.\n  * **`TASK_INTERRUPTIBLE` (`interruptible/1`):** Sleeping; can be woken by resources, signals, or clock interrupts.\n  * **`TASK_UNINTERRUPTIBLE` (`uninterruptible/2`):** Sleeping on hardware I/O; **cannot** be woken by signals.\n  * **`TASK_ZOMBIE` (`zombie/3`):** Terminated, but process control block (PCB) is not yet released by parent `wait()`.\n  * **`TASK_STOPPED` (`stopped/4`):** Stopped (e.g., by debugger or `SIGSTOP`/`SIGTSTP`).\n<!-- PDF_FIGS_START -->\n![Linux Process Life Cycle (fork, exec, exit, wait, Zombie) (Official Reference: p. 226)](./assets/images/p2_h5s4_process_lifecycle.png)\n*Figure: Linux Process Life Cycle (fork, exec, exit, wait, Zombie) (Official Reference: p. 226)*\n\n![Process State Transition State Machine (R, S, D, T, Z) (Official Reference: p. 227)](./assets/images/p2_h5s4_process_states.png)\n*Figure: Process State Transition State Machine (R, S, D, T, Z) (Official Reference: p. 227)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Priority (`PRI`/`NI`), Monitoring (`ps`/`top`), Job Control & Signals\n* **Priority (`PRI` vs. `NI`):** Internal kernel priority is **`0–139`** (`0–99` real-time, `100–139` non-real-time; **smaller value = higher priority**). **`NI` (nice value)** ranges from **`-20` (highest priority)** to **`19` (lowest priority)** (default `0`). Formula: **`PRI(new) = PRI(old) + nice`**. Only **`root`** can set a negative `nice` value!\n  * Launch with nice: `nice -n -18 vi &`\n  * Modify running process: `renice -n 12 -p 9700` (supports `-p` PID, `-g` group, `-u` user; or press `r` inside `top`).\n* **Static vs. Dynamic Monitoring (Official Ch.04 Quiz Q1!):**\n  * **`ps aux` / `ps -ef` / `ps -l`:** **Statically** lists process snapshot at a single point in time.\n  * **`top`:** **Dynamically checks host resource usage and processes in real time** (Ch.04 Quiz Q1!).\n* **Foreground/Background & Signals (`kill` / `killall`):**\n  * **`&`** (run in background), **`Ctrl+Z`** (suspend foreground job to background), **`jobs`** (list background jobs), **`fg`** (bring to foreground), **`bg`** (resume in background).\n  * **Key Signals:** **`1` (`HUP` - Hangup/reload)**, **`2` (`INT` - `Ctrl+C` interrupt)**, **`3` (`QUIT`)**, **`9` (`KILL` - unconditional termination)**, **`11` (`SEGV` - segment error)**, **`15` (`TERM` - default termination signal of `kill PID`)**, **`17` (`STOP`)**, **`18` (`TSTP` - `Ctrl+Z`)**, **`19` (`CONT` - continue)**. Note: `killall python*` supports wildcards by process name!\n<!-- PDF_FIGS_START -->\n![Process Priority Ranges (Real-Time 0-99 vs Common 100-139) and Nice (Official Reference: p. 229)](./assets/images/p2_h5s4_priority_nice.png)\n*Figure: Process Priority Ranges (Real-Time 0-99 vs Common 100-139) and Nice (Official Reference: p. 229)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Scheduled Tasks: One-Time (`at`) vs. Periodic (`cron` / `crontab`)\n* **One-Time Task (`at` — managed by `atd` daemon checking `/var/spool/at`):**\n  * Controlled by `/etc/at.allow` and `/etc/at.deny`.\n  * Interactive: `at 16:30` -> enter commands -> press **`Ctrl+D`** to submit; or script file: **`at -f example.sh 15:00`**.\n  * Relative time examples: `at now+4 hours`, `at now+240 minutes`, `at 4:30pm`, `at teatime` (`16:00`).\n  * Queue inspection & removal: **`atq`** (view job queue) and **`atrm <job_ID>`** (delete job).\n* **Periodic Task (`cron` — wakes up every minute to read `/var/spool/cron/<user>` and `/etc/crontab`):**\n  * Commands: **`crontab -e`** (edit), **`crontab -l`** (list), **`crontab -r`** (remove), **`crontab -u <user>`** (root only). **No need to restart `crond` after editing!**\n  * **5 Time Fields:** `minute(0-59)  hour(0-23)  day-of-month(1-31)  month-of-year(1-12)  day-of-week(0-6, 0=Sunday)  command`\n  * Special symbols: **`*`** (all values), **`/`** (step, e.g., `*/5`), **`-`** (range), **`,`** (discrete list). Example: `00 08 * * 1 commands` (every Monday at 08:00 AM). In `/etc/crontab`, **`run-parts`** executes all scripts inside a directory (`/etc/cron.hourly`, `/etc/cron.daily`, etc.).","key_takeaways":["top dynamically checks host resource usage in real time (Ch.04 Quiz Q1), whereas ps lists a static snapshot.","PRI(new) = PRI(old) + nice, where nice ranges from -20 (highest priority, root only) to 19 (lowest priority); kill sends signal 15 (TERM) by default, while signal 9 (KILL) forces unconditional termination.","at schedules one-time tasks (atq lists, atrm deletes, Ctrl+D ends interactive input); crontab (-e/-l/-r/-u) schedules periodic tasks using 'minute hour day-of-month month-of-year day-of-week command'."],"exam_traps":["EXAM TRAP (Official Ch.04 Quiz Q1): 'Which of the following commands can be used to dynamically check the host resource usage?' -> B. top (ps, free, and lscpu are static snapshots)!","EXAM TRAP: Do NOT restart the cron service after modifying a crontab file—the cron daemon wakes up every minute and automatically re-reads /etc/crontab and /var/spool/cron (Ch.04 p.247)!"],"content_html":"<h3>1. Process Memory, Lifecycle &amp; States<\/h3>\n<ul class=\"md-list\">\n<li><strong>5 Virtual Address Space Segments (Low to High Address):<\/strong> <strong>Code segment<\/strong> (read-only executable code/constants) -&gt; <strong>Data segment<\/strong> (initialized static/global variables) -&gt; <strong>BSS segment<\/strong> (uninitialized static/global variables) -&gt; <strong>Heap<\/strong> (dynamic memory) -&gt; <strong>Stack<\/strong> (local variables).<\/li>\n<li><strong>Lifecycle &amp; Copy-on-Write (COW):<\/strong> Parent calls <strong><code class=\"inline-code\">fork()<\/code><\/strong> (shares address space via COW) -&gt; Child calls <strong><code class=\"inline-code\">exec()<\/code><\/strong> (loads new program; kernel allocates new physical pages on write) -&gt; Child calls <strong><code class=\"inline-code\">exit()<\/code><\/strong> and becomes a <strong>Zombie process<\/strong> until the parent reaps it via <strong><code class=\"inline-code\">wait()<\/code><\/strong>.<\/li>\n<li><strong>5 Process States (Ch.04, p.227):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">TASK_RUNNING<\/code> (<code class=\"inline-code\">running/0<\/code>):<\/strong> Running in user/kernel space or ready in the run queue.<\/li>\n<li><strong><code class=\"inline-code\">TASK_INTERRUPTIBLE<\/code> (<code class=\"inline-code\">interruptible/1<\/code>):<\/strong> Sleeping; can be woken by resources, signals, or clock interrupts.<\/li>\n<li><strong><code class=\"inline-code\">TASK_UNINTERRUPTIBLE<\/code> (<code class=\"inline-code\">uninterruptible/2<\/code>):<\/strong> Sleeping on hardware I/O; <strong>cannot<\/strong> be woken by signals.<\/li>\n<li><strong><code class=\"inline-code\">TASK_ZOMBIE<\/code> (<code class=\"inline-code\">zombie/3<\/code>):<\/strong> Terminated, but process control block (PCB) is not yet released by parent <code class=\"inline-code\">wait()<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">TASK_STOPPED<\/code> (<code class=\"inline-code\">stopped/4<\/code>):<\/strong> Stopped (e.g., by debugger or <code class=\"inline-code\">SIGSTOP<\/code>/<code class=\"inline-code\">SIGTSTP<\/code>).<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h5s4_process_lifecycle.png\" alt=\"Linux Process Life Cycle (fork, exec, exit, wait, Zombie)\" data-caption=\"Linux Process Life Cycle (fork, exec, exit, wait, Zombie) (Official Reference: p. 226)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Linux Process Life Cycle (fork, exec, exit, wait, Zombie)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 226 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h5s4_process_states.png\" alt=\"Process State Transition State Machine (R, S, D, T, Z)\" data-caption=\"Process State Transition State Machine (R, S, D, T, Z) (Official Reference: p. 227)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Process State Transition State Machine (R, S, D, T, Z)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 227 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Priority (<code class=\"inline-code\">PRI<\/code>/<code class=\"inline-code\">NI<\/code>), Monitoring (<code class=\"inline-code\">ps<\/code>/<code class=\"inline-code\">top<\/code>), Job Control &amp; Signals<\/h3>\n<ul class=\"md-list\">\n<li><strong>Priority (<code class=\"inline-code\">PRI<\/code> vs. <code class=\"inline-code\">NI<\/code>):<\/strong> Internal kernel priority is <strong><code class=\"inline-code\">0–139<\/code><\/strong> (<code class=\"inline-code\">0–99<\/code> real-time, <code class=\"inline-code\">100–139<\/code> non-real-time; <strong>smaller value = higher priority<\/strong>). <strong><code class=\"inline-code\">NI<\/code> (nice value)<\/strong> ranges from <strong><code class=\"inline-code\">-20<\/code> (highest priority)<\/strong> to <strong><code class=\"inline-code\">19<\/code> (lowest priority)<\/strong> (default <code class=\"inline-code\">0<\/code>). Formula: <strong><code class=\"inline-code\">PRI(new) = PRI(old) + nice<\/code><\/strong>. Only <strong><code class=\"inline-code\">root<\/code><\/strong> can set a negative <code class=\"inline-code\">nice<\/code> value!<\/li>\n<li>Launch with nice: <code class=\"inline-code\">nice -n -18 vi &amp;<\/code><\/li>\n<li>Modify running process: <code class=\"inline-code\">renice -n 12 -p 9700<\/code> (supports <code class=\"inline-code\">-p<\/code> PID, <code class=\"inline-code\">-g<\/code> group, <code class=\"inline-code\">-u<\/code> user; or press <code class=\"inline-code\">r<\/code> inside <code class=\"inline-code\">top<\/code>).<\/li>\n<li><strong>Static vs. Dynamic Monitoring (Official Ch.04 Quiz Q1!):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">ps aux<\/code> / <code class=\"inline-code\">ps -ef<\/code> / <code class=\"inline-code\">ps -l<\/code>:<\/strong> <strong>Statically<\/strong> lists process snapshot at a single point in time.<\/li>\n<li><strong><code class=\"inline-code\">top<\/code>:<\/strong> <strong>Dynamically checks host resource usage and processes in real time<\/strong> (Ch.04 Quiz Q1!).<\/li>\n<li><strong>Foreground/Background &amp; Signals (<code class=\"inline-code\">kill<\/code> / <code class=\"inline-code\">killall<\/code>):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">&amp;<\/code><\/strong> (run in background), <strong><code class=\"inline-code\">Ctrl+Z<\/code><\/strong> (suspend foreground job to background), <strong><code class=\"inline-code\">jobs<\/code><\/strong> (list background jobs), <strong><code class=\"inline-code\">fg<\/code><\/strong> (bring to foreground), <strong><code class=\"inline-code\">bg<\/code><\/strong> (resume in background).<\/li>\n<li><strong>Key Signals:<\/strong> <strong><code class=\"inline-code\">1<\/code> (<code class=\"inline-code\">HUP<\/code> - Hangup/reload)<\/strong>, <strong><code class=\"inline-code\">2<\/code> (<code class=\"inline-code\">INT<\/code> - <code class=\"inline-code\">Ctrl+C<\/code> interrupt)<\/strong>, <strong><code class=\"inline-code\">3<\/code> (<code class=\"inline-code\">QUIT<\/code>)<\/strong>, <strong><code class=\"inline-code\">9<\/code> (<code class=\"inline-code\">KILL<\/code> - unconditional termination)<\/strong>, <strong><code class=\"inline-code\">11<\/code> (<code class=\"inline-code\">SEGV<\/code> - segment error)<\/strong>, <strong><code class=\"inline-code\">15<\/code> (<code class=\"inline-code\">TERM<\/code> - default termination signal of <code class=\"inline-code\">kill PID<\/code>)<\/strong>, <strong><code class=\"inline-code\">17<\/code> (<code class=\"inline-code\">STOP<\/code>)<\/strong>, <strong><code class=\"inline-code\">18<\/code> (<code class=\"inline-code\">TSTP<\/code> - <code class=\"inline-code\">Ctrl+Z<\/code>)<\/strong>, <strong><code class=\"inline-code\">19<\/code> (<code class=\"inline-code\">CONT<\/code> - continue)<\/strong>. Note: <code class=\"inline-code\">killall python*<\/code> supports wildcards by process name!<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h5s4_priority_nice.png\" alt=\"Process Priority Ranges (Real-Time 0-99 vs Common 100-139) and Nice\" data-caption=\"Process Priority Ranges (Real-Time 0-99 vs Common 100-139) and Nice (Official Reference: p. 229)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Process Priority Ranges (Real-Time 0-99 vs Common 100-139) and Nice<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 229 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Scheduled Tasks: One-Time (<code class=\"inline-code\">at<\/code>) vs. Periodic (<code class=\"inline-code\">cron<\/code> / <code class=\"inline-code\">crontab<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong>One-Time Task (<code class=\"inline-code\">at<\/code> — managed by <code class=\"inline-code\">atd<\/code> daemon checking <code class=\"inline-code\">/var/spool/at<\/code>):<\/strong><\/li>\n<li>Controlled by <code class=\"inline-code\">/etc/at.allow<\/code> and <code class=\"inline-code\">/etc/at.deny<\/code>.<\/li>\n<li>Interactive: <code class=\"inline-code\">at 16:30<\/code> -&gt; enter commands -&gt; press <strong><code class=\"inline-code\">Ctrl+D<\/code><\/strong> to submit; or script file: <strong><code class=\"inline-code\">at -f example.sh 15:00<\/code><\/strong>.<\/li>\n<li>Relative time examples: <code class=\"inline-code\">at now+4 hours<\/code>, <code class=\"inline-code\">at now+240 minutes<\/code>, <code class=\"inline-code\">at 4:30pm<\/code>, <code class=\"inline-code\">at teatime<\/code> (<code class=\"inline-code\">16:00<\/code>).<\/li>\n<li>Queue inspection &amp; removal: <strong><code class=\"inline-code\">atq<\/code><\/strong> (view job queue) and <strong><code class=\"inline-code\">atrm &lt;job_ID&gt;<\/code><\/strong> (delete job).<\/li>\n<li><strong>Periodic Task (<code class=\"inline-code\">cron<\/code> — wakes up every minute to read <code class=\"inline-code\">/var/spool/cron/&lt;user&gt;<\/code> and <code class=\"inline-code\">/etc/crontab<\/code>):<\/strong><\/li>\n<li>Commands: <strong><code class=\"inline-code\">crontab -e<\/code><\/strong> (edit), <strong><code class=\"inline-code\">crontab -l<\/code><\/strong> (list), <strong><code class=\"inline-code\">crontab -r<\/code><\/strong> (remove), <strong><code class=\"inline-code\">crontab -u &lt;user&gt;<\/code><\/strong> (root only). <strong>No need to restart <code class=\"inline-code\">crond<\/code> after editing!<\/strong><\/li>\n<li><strong>5 Time Fields:<\/strong> <code class=\"inline-code\">minute(0-59)  hour(0-23)  day-of-month(1-31)  month-of-year(1-12)  day-of-week(0-6, 0=Sunday)  command<\/code><\/li>\n<li>Special symbols: **<code class=\"inline-code\">*<\/code><strong> (all values), <\/strong><code class=\"inline-code\">/<\/code>** (step, e.g., <code class=\"inline-code\"><em>/5<\/code>), <strong><code class=\"inline-code\">-<\/code><\/strong> (range), <strong><code class=\"inline-code\">,<\/code><\/strong> (discrete list). Example: <code class=\"inline-code\">00 08 <\/em> * 1 commands<\/code> (every Monday at 08:00 AM). In <code class=\"inline-code\">/etc/crontab<\/code>, <strong><code class=\"inline-code\">run-parts<\/code><\/strong> executes all scripts inside a directory (<code class=\"inline-code\">/etc/cron.hourly<\/code>, <code class=\"inline-code\">/etc/cron.daily<\/code>, etc.).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Adjusting Process Priority (`renice`), Sending Signals (`kill`) & Scheduling (`at`/`crontab`)","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are tuning process priorities and configuring scheduled maintenance on openEuler. Adjust the `nice` value of PID `9700` to `12` using `renice`, send the `HUP` signal to PID `3389` using `kill`, schedule `example.sh` to run once at `15:00` using `at`, and write a crontab entry that runs `/usr/local/bin/backup.sh` every Monday at `08:00` AM.","instructions":["Step 1: Change the nice value of running process PID `9700` to `12` using `renice -n 12 -p 9700` and send the `HUP` signal to PID `3389` using `kill -s HUP 3389`.","Step 2: Schedule the script `example.sh` to run once at `15:00` using `at -f example.sh 15:00` and list the queue with `atq`.","Step 3: Write the 5-field crontab schedule for every Monday at 08:00 AM: `00 08 * * 1 /usr/local/bin/backup.sh`."],"starter_code":"# Step 1: Set nice value of PID 9700 to 12 and send HUP signal to PID 3389\n<renice_command>\n<kill_hup_command>\n\n# Step 2: Schedule example.sh at 15:00 using at and view queue\n<at_command>\natq\n\n# Step 3: Crontab line for every Monday at 08:00 AM\n# minute hour dom month dow command\n<crontab_line>","solution_code":"# Step 1: Set nice value of PID 9700 to 12 and send HUP signal to PID 3389\nrenice -n 12 -p 9700\nkill -s HUP 3389\n\n# Step 2: Schedule example.sh at 15:00 using at and view queue\nat -f example.sh 15:00\natq\n\n# Step 3: Crontab line for every Monday at 08:00 AM\n# minute hour dom month dow command\n00 08 * * 1 /usr/local/bin/backup.sh","hints":["Use `renice -n 12 -p 9700` (Ch.04 p.230) and `kill -s HUP 3389` (Ch.04 p.235).","Use `at -f example.sh 15:00` (Ch.04 p.242).","Use `00 08 * * 1 /usr/local/bin/backup.sh` (Ch.04 p.246)."],"validation_checks":[{"step":1,"description":"Adjust nice value with renice and send HUP signal with kill","required_any":["renice -n 12 -p 9700"],"feedback_fail":"Include 'renice -n 12 -p 9700' and 'kill -s HUP 3389'."},{"step":2,"description":"Schedule one-off script with at -f example.sh 15:00","required_any":["at -f example.sh 15:00"],"feedback_fail":"Use 'at -f example.sh 15:00' to schedule the one-off task."},{
