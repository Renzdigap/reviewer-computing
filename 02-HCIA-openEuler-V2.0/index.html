  <script>
    const PILLAR = {"id":"pillar2","folder_name":"02-HCIA-openEuler-V2.0","title":"HCIA-openEuler V2.0 (Operating System & Cloud-Native iSula)","subtitle":"Huawei ICT Competition National Stage — Computing Track Pillar 2","pdf_source":"HCIA-openEuler V2.0 Training Material.pdf","total_hours":9,"lesson_hours":8,"mock_exam_hours":1,"description":"Complete 8-hour intensive technical study curriculum + 1-hour 60-question National Stage Mock Exam covering openEuler Intelligence (AI for OS), Linux/GNU history & MulanPSL v2 licensing, OS installation, CLI file/text processing (Vim, grep, awk, sed), user/group/ACL security, RPM/DNF/systemd/process/cron administration, disk partitioning (MBR/GPT), LVM dynamic storage, NetworkManager (nmcli/ip/route/ss), Bash shell scripting, and the openEuler native C/C++ container engine iSula (iSulad).","hours":[{"hour_number":1,"folder_name":"Hour-01-OS-for-AI-Era-and-Getting-Started","title":"OS for the AI Era & Getting Started with openEuler","chapter_ref":"Chapter 01 (pp. 1–22) & Chapter 02 (pp. 23–54)","duration_mins":60,"overview":"Master the architecture and 5 core functions of openEuler Intelligence (AI for OS), trace the evolution from Unix and Minix to GNU/Linux and openEuler LTS/Innovation releases, walk through openEuler installation and partitioning, and execute local/remote logins and Bash CLI shortcuts.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-OS-for-AI-Era-and-openEuler-Intelligence","exercise_slug":"02-Exercise-openEuler-Intelligence-Architecture-Lab","lecture":{"title":"OS for the AI Era & openEuler Intelligence Architecture","duration_mins":7,"pdf_ref":"Ch.01, pp. 1–22","objectives":["Define Artificial Intelligence (John McCarthy, 1956) and trace the 5-layer AI hierarchy from OS/Infrastructure to Industry Solutions","Explain the openEuler Intelligence ('AI for OS') architecture, including its two interaction entries (Web entry and Intelligent Shell entry)","Differentiate the 5 core functions of openEuler Intelligence: Intelligent Q&A, AI Application Development Framework, Intelligent Optimization, Intelligent Diagnosis, and Intelligent Container Image"],"content_markdown":"### 1. Evolution of AI and the 5-Layer AI Hierarchy\nThe term **Artificial Intelligence (AI)** was coined by **John McCarthy in 1956** as the *\"science and engineering of making intelligent machines, especially intelligent computer programs.\"* In the modern computing stack, AI is structured into five hierarchical layers built upon the Operating System:\n\n| Hierarchy Layer | Core Components & Examples |\n| :--- | :--- |\n| **5. Industry Solution** | Finance, Healthcare, Security, Transportation, Gaming (autonomous driving, smart home, VR/AR, UAVs) |\n| **4. Technology** | Perception & Analysis, Understanding & Thinking, Decision-making & Interaction (Speech/Image/Video recognition, NLP, Knowledge Graph) |\n| **3. Technical Direction** | Speech processing, Computer vision, Natural Language Processing (NLP), Decision-making systems, Big data/Statistical analysis |\n| **2. Algorithm** | Machine learning (ML) and Deep learning (DL) |\n| **1. Infrastructure & OS** | **openEuler and other OSs**, Hardware/Computing capability, and Big Data |\n\n---\n\n### 2. openEuler Intelligence Architecture (\"AI for OS\")\n**openEuler Intelligence** integrates Large Language Model (LLM) capabilities and a rich knowledge base of openEuler source code and O&M data into the OS toolchain.\n* **Two Interaction Entries (Official Ch.01 Quiz Point):**\n  1. **Web Entry:** Easy-to-use browser portal providing openEuler knowledge, community announcements, and O&M solutions via intelligent agents.\n  2. **Intelligent Shell Entry:** Allows O&M engineers and developers to interact with openEuler in the terminal using **natural human language** for heuristic tuning and fault diagnosis.\n* **Core Backend Components:** Orchestration Engine, Historical Context Management, Agent Framework (Intelligent O&M, Intelligent Optimization, CVE Hotfix services), Document Parsing Engine, and **Retrieval-Augmented Generation (RAG)** Knowledge Base.\n<!-- PDF_FIGS_START -->\n![openEuler OS for AI and AI for OS Architecture (Official Reference: p. 7)](./assets/images/p2_h1s1_openeuler_ai_platform.png)\n*Figure: openEuler OS for AI and AI for OS Architecture (Official Reference: p. 7)*\n\n![AI for OS Agent Framework and Knowledge Base Stack (Official Reference: p. 8)](./assets/images/p2_h1s1_ai_for_os_agent.png)\n*Figure: AI for OS Agent Framework and Knowledge Base Stack (Official Reference: p. 8)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Five Core Functions of openEuler Intelligence\n1. **Intelligent Q&A:**\n   * **Workflow Scheduling:** Combines multiple agent steps into an inseparable **atomic operation** with user-defined error recovery, real-time data transfer between steps, and proactive clarification of vague user prompts.\n   * **Task Recommendation:** Semantic intent recognition and next-step guidance based on user habits.\n   * **Enhanced RAG:** Pre-processing query rewriting/routing, fragment vectorization/keyword indexing, and **multi-channel retrieval** (vectorized, keyword, and **Chat2DB** with re-ranking/fusion).\n   * **Corpus Governance:** Fragment relationship extraction, fragment derivative construction (digests), and **OCR** for hybrid image-text documents.\n2. **AI Application Development Framework:** Provides Multi-channel RAG, document governance (deduplication, sensitive data masking, standardization), and **embedding model fine-tuning** (e.g., **BGE models**).\n3. **Intelligent Optimization:** Achieves **heuristic system optimization** by collecting and analyzing performance data via natural language interaction.\n4. **Intelligent Diagnosis (3 Agents):**\n   * **Inspection Agent:** Checks designated IP addresses and outputs an abnormality list (associated container IDs, abnormal CPU/memory metrics).\n   * **Demarcation Agent:** Analyzes a selected abnormality and outputs the **top 3 root cause metrics**.\n   * **Detection (Location) Agent:** Performs profiling location on root cause metrics and outputs hotspot stack, system time, and performance metrics.\n5. **Intelligent Container Image:** Uses natural language to pull images from Docker Hub across **3 container layers**:\n   * **Tier 1 (SDK layer):** Hardware enablement libraries only (e.g., **CUDA**, **CANN**).\n   * **Tier 2 (SDKs + training/inference frameworks):** Adds TensorFlow/PyTorch (e.g., `tensorflow2.15.0-cuda12.2.0`, `pytorch2.1.0.a1-cann7.0.RC1`).\n   * **Tier 3 (SDKs + frameworks + LLMs):** Encapsulates pre-integrated foundation models (e.g., `llama2-7b`, `chatglm2-13b`).","key_takeaways":["openEuler Intelligence supports exactly TWO interaction entries: Web entry and Intelligent shell entry (Ch.01 Quiz Q1).","Intelligent Diagnosis relies on three specialized agents in sequence: Inspection Agent (checks IP/container abnormalities) -> Demarcation Agent (outputs top 3 root cause metrics) -> Detection Agent (profiling location & stack hotspots).","Intelligent Container Images are organized into 3 tiers: (1) SDK layer (CUDA/CANN), (2) SDK + Frameworks (PyTorch/TensorFlow), and (3) SDK + Frameworks + LLMs (llama2-7b, chatglm2-13b)."],"exam_traps":["EXAM TRAP: Do not confuse the three Intelligent Diagnosis agents! Inspection finds abnormal IPs/containers; Demarcation narrows down to the Top 3 root cause metrics; Detection/Location profiles the stack and hotspots.","EXAM TRAP: In openEuler Intelligence RAG, Corpus Governance specifically includes three techniques: (1) Fragment relationship extraction, (2) Fragment derivative construction, and (3) Optical Character Recognition (OCR)."],"content_html":"<h3>1. Evolution of AI and the 5-Layer AI Hierarchy<\/h3>\n<p>The term <strong>Artificial Intelligence (AI)<\/strong> was coined by <strong>John McCarthy in 1956<\/strong> as the <em>\"science and engineering of making intelligent machines, especially intelligent computer programs.\"<\/em> In the modern computing stack, AI is structured into five hierarchical layers built upon the Operating System:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Hierarchy Layer<\/th><th>Core Components &amp; Examples<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>5. Industry Solution<\/strong><\/td><td>Finance, Healthcare, Security, Transportation, Gaming (autonomous driving, smart home, VR/AR, UAVs)<\/td><\/tr>\n<tr><td><strong>4. Technology<\/strong><\/td><td>Perception &amp; Analysis, Understanding &amp; Thinking, Decision-making &amp; Interaction (Speech/Image/Video recognition, NLP, Knowledge Graph)<\/td><\/tr>\n<tr><td><strong>3. Technical Direction<\/strong><\/td><td>Speech processing, Computer vision, Natural Language Processing (NLP), Decision-making systems, Big data/Statistical analysis<\/td><\/tr>\n<tr><td><strong>2. Algorithm<\/strong><\/td><td>Machine learning (ML) and Deep learning (DL)<\/td><\/tr>\n<tr><td><strong>1. Infrastructure &amp; OS<\/strong><\/td><td><strong>openEuler and other OSs<\/strong>, Hardware/Computing capability, and Big Data<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. openEuler Intelligence Architecture (\"AI for OS\")<\/h3>\n<p><strong>openEuler Intelligence<\/strong> integrates Large Language Model (LLM) capabilities and a rich knowledge base of openEuler source code and O&amp;M data into the OS toolchain.<\/p>\n<ul class=\"md-list\">\n<li><strong>Two Interaction Entries (Official Ch.01 Quiz Point):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Web Entry:<\/strong> Easy-to-use browser portal providing openEuler knowledge, community announcements, and O&amp;M solutions via intelligent agents.<\/li>\n<li><strong>Intelligent Shell Entry:<\/strong> Allows O&amp;M engineers and developers to interact with openEuler in the terminal using <strong>natural human language<\/strong> for heuristic tuning and fault diagnosis.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Core Backend Components:<\/strong> Orchestration Engine, Historical Context Management, Agent Framework (Intelligent O&amp;M, Intelligent Optimization, CVE Hotfix services), Document Parsing Engine, and <strong>Retrieval-Augmented Generation (RAG)<\/strong> Knowledge Base.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h1s1_openeuler_ai_platform.png\" alt=\"openEuler OS for AI and AI for OS Architecture\" data-caption=\"openEuler OS for AI and AI for OS Architecture (Official Reference: p. 7)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openEuler OS for AI and AI for OS Architecture<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 7 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h1s1_ai_for_os_agent.png\" alt=\"AI for OS Agent Framework and Knowledge Base Stack\" data-caption=\"AI for OS Agent Framework and Knowledge Base Stack (Official Reference: p. 8)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>AI for OS Agent Framework and Knowledge Base Stack<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 8 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Five Core Functions of openEuler Intelligence<\/h3>\n<ol class=\"md-list\">\n<li><strong>Intelligent Q&amp;A:<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Workflow Scheduling:<\/strong> Combines multiple agent steps into an inseparable <strong>atomic operation<\/strong> with user-defined error recovery, real-time data transfer between steps, and proactive clarification of vague user prompts.<\/li>\n<li><strong>Task Recommendation:<\/strong> Semantic intent recognition and next-step guidance based on user habits.<\/li>\n<li><strong>Enhanced RAG:<\/strong> Pre-processing query rewriting/routing, fragment vectorization/keyword indexing, and <strong>multi-channel retrieval<\/strong> (vectorized, keyword, and <strong>Chat2DB<\/strong> with re-ranking/fusion).<\/li>\n<li><strong>Corpus Governance:<\/strong> Fragment relationship extraction, fragment derivative construction (digests), and <strong>OCR<\/strong> for hybrid image-text documents.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>AI Application Development Framework:<\/strong> Provides Multi-channel RAG, document governance (deduplication, sensitive data masking, standardization), and <strong>embedding model fine-tuning<\/strong> (e.g., <strong>BGE models<\/strong>).<\/li>\n<li><strong>Intelligent Optimization:<\/strong> Achieves <strong>heuristic system optimization<\/strong> by collecting and analyzing performance data via natural language interaction.<\/li>\n<li><strong>Intelligent Diagnosis (3 Agents):<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Inspection Agent:<\/strong> Checks designated IP addresses and outputs an abnormality list (associated container IDs, abnormal CPU/memory metrics).<\/li>\n<li><strong>Demarcation Agent:<\/strong> Analyzes a selected abnormality and outputs the <strong>top 3 root cause metrics<\/strong>.<\/li>\n<li><strong>Detection (Location) Agent:<\/strong> Performs profiling location on root cause metrics and outputs hotspot stack, system time, and performance metrics.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Intelligent Container Image:<\/strong> Uses natural language to pull images from Docker Hub across <strong>3 container layers<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Tier 1 (SDK layer):<\/strong> Hardware enablement libraries only (e.g., <strong>CUDA<\/strong>, <strong>CANN<\/strong>).<\/li>\n<li><strong>Tier 2 (SDKs + training/inference frameworks):<\/strong> Adds TensorFlow/PyTorch (e.g., <code class=\"inline-code\">tensorflow2.15.0-cuda12.2.0<\/code>, <code class=\"inline-code\">pytorch2.1.0.a1-cann7.0.RC1<\/code>).<\/li>\n<li><strong>Tier 3 (SDKs + frameworks + LLMs):<\/strong> Encapsulates pre-integrated foundation models (e.g., <code class=\"inline-code\">llama2-7b<\/code>, <code class=\"inline-code\">chatglm2-13b<\/code>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: openEuler Intelligence Entries, RAG & Diagnostic Agents Verification","duration_mins":8,"exercise_type":"config","prompt_label":"root@openEuler:~#","scenario":"You are deploying openEuler Intelligence for an enterprise O&M team. Complete the architecture verification manifest below to specify the two interaction entries, the three Intelligent Diagnosis agents, and the three Intelligent Container Image tiers.","instructions":["Step 1: Set `INTERACTION_ENTRIES` to the two official access entries supported by the openEuler intelligent platform (`web` and `intelligent shell`).","Step 2: Set `DIAGNOSIS_AGENTS` to the three diagnostic agents in execution order (`Inspection`, `Demarcation`, `Detection`) and specify `TOP_ROOT_CAUSE_METRICS=3`.","Step 3: Set `CONTAINER_TIERS` to include the Huawei Ascend SDK (`CANN`), framework (`PyTorch`), and LLM (`chatglm2-13b` or `llama2-7b`)."],"starter_code":"# openEuler Intelligence Architecture Verification Manifest\nINTERACTION_ENTRIES=\"<entry1>, <entry2>\"\nDIAGNOSIS_AGENTS=\"<agent1> -> <agent2> -> <agent3>\"\nTOP_ROOT_CAUSE_METRICS=<number>\nCONTAINER_TIERS=\"SDK(CUDA/<sdk>) -> Framework(TensorFlow/<framework>) -> LLM(<model>)\"","solution_code":"# openEuler Intelligence Architecture Verification Manifest\nINTERACTION_ENTRIES=\"web, intelligent shell\"\nDIAGNOSIS_AGENTS=\"Inspection -> Demarcation -> Detection\"\nTOP_ROOT_CAUSE_METRICS=3\nCONTAINER_TIERS=\"SDK(CUDA/CANN) -> Framework(TensorFlow/PyTorch) -> LLM(llama2-7b/chatglm2-13b)\"","hints":["Recall Ch.01 Quiz Q1: The openEuler intelligent platform supports two entries: web entry and intelligent shell entry.","In Intelligent Diagnosis, the Inspection Agent checks IPs/containers, the Demarcation Agent outputs the top 3 root cause metrics, and the Detection Agent profiles stack hotspots.","The SDK layer encapsulates CUDA and CANN; the LLM layer includes llama2-7b and chatglm2-13b."],"validation_checks":[{"step":1,"description":"Specify both Web entry and Intelligent Shell entry","required_any":["shell"],"feedback_fail":"Make sure INTERACTION_ENTRIES includes both 'web' and 'intelligent shell'."},{"step":2,"description":"Specify Inspection, Demarcation, and Detection agents with top 3 root cause metrics","required_any":["demarcation"],"feedback_fail":"Include 'Inspection', 'Demarcation', and 'Detection' in DIAGNOSIS_AGENTS."},{"step":3,"description":"Specify CANN SDK and LLM container image tier","required_any":["cann"],"feedback_fail":"Include 'CANN' in the SDK layer of CONTAINER_TIERS."}],"simulated_output":"[OK] openEuler Intelligence Entries Verified: Web Entry + Intelligent Shell Entry\n[OK] RAG Multi-Channel Retrieval Active: Vector + Keyword + Chat2DB\n[OK] Intelligent Diagnosis Pipeline: Inspection Agent -> Demarcation Agent (Top 3 Root Causes) -> Detection Agent (Stack Profiling)\n[OK] Intelligent Container Image Tiers: SDK (CUDA/CANN) | Framework (TensorFlow/PyTorch) | LLM (llama2-7b/chatglm2-13b)","quiz_questions":[{"id":"h1_s1_q1","type":"tf","question":"[Official Ch.01 Quiz Q1] The openEuler intelligent platform currently supports two entries: web entry and intelligent shell entry.","options":["A. True","B. False"],"answer":"A","explanation":"Official Ch.01 Quiz Q1 (p.20): True. openEuler Intelligence is accessible via two entries: the Web entry and the Intelligent shell entry."},{"id":"h1_s1_q2","type":"single","question":"In the Intelligent Diagnosis function of openEuler Intelligence, which agent analyzes an abnormality selected from the inspection result and outputs the top 3 root cause metrics?","options":["A. Inspection Agent","B. Demarcation Agent","C. Detection Agent","D. Orchestration Agent"],"answer":"B","explanation":"Per Ch.01 (p.15), the Inspection Agent checks for abnormalities of designated IP addresses; the Demarcation Agent analyzes and demarcates an abnormality and outputs the top 3 root cause metrics; the Detection Agent performs profiling location on the root cause metrics."},{"id":"h1_s1_q3","type":"multiple","question":"Which of the following capabilities are part of Corpus Governance in openEuler Intelligence's RAG technology?","options":["A. Fragment relationship extraction","B. Fragment derivative construction (digests)","C. Optical Character Recognition (OCR) for hybrid image and text scenarios","D. Kernel space memory paging"],"answer":"ABC","explanation":"Per Ch.01 (pp.10–11), Corpus Governance imports corpuses into the knowledge base through fragment relationship extraction, fragment derivative construction, and OCR."}],"reference_figures":[{"slug":"p2_h1s1_ai_for_os_agent","title":"AI for OS Agent Framework and Knowledge Base Stack","pdf_page":8}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Linux-History-Open-Source-Licenses-and-openEuler","exercise_slug":"04-Exercise-openEuler-Releases-and-Licenses-Lab","lecture":{"title":"Linux History, GNU/FSF, Open Source Licenses & openEuler Community","duration_mins":7,"pdf_ref":"Ch.02, pp. 27–37","objectives":["Trace OS history from Multics (1965) and Unix (1969/1970 by Ken Thompson) to Minix (1987 by Andrew S. Tanenbaum) and Linux (1991 by Linus Torvalds)","Compare the 4 freedoms of the Free Software Foundation (FSF) and major open source licenses (Mulan, GPL, LGPL, BSD)","Distinguish openEuler Innovation releases vs. LTS releases, kernel version numbering, and openEuler community portals"],"content_markdown":"### 1. From Multics and Unix to GNU/Linux\n* **Multics (1965):** Bell Labs, MIT, and GE jointly developed the **Multiplexed Information and Computing Service** time-sharing multitasking system. Bell Labs withdrew in 1969.\n* **Unix (1969–1970):** **Ken Thompson** at Bell Labs wrote a lightweight OS to run his game *Space Travel*, named **Unix** (Uniplexed Information and Computing Service). **1970** is defined as the **Unix Epoch**. Commercial Unix derivatives include **IBM AIX**, **HP-UX**, and **Digital Unix**.\n* **GNU & FSF (1984):** **Richard Stallman** launched the Free Software Campaign and founded the **Free Software Foundation (FSF)**, creating open-source Unix utilities and the **GPL**. FSF defines **Four Freedoms**:\n  1. Freedom to run programs for any purpose.\n  2. Freedom to learn and modify the source code.\n  3. Freedom to redistribute programs.\n  4. Freedom to create derivatives.\n* **Minix (1987) & Linux (1991):** Professor **Andrew S. Tanenbaum** (Vrije University, Amsterdam) wrote **Minix** for teaching. On **September 17, 1991**, **Linus Torvalds** released the free Linux OS online; **Linux kernel 1.0** was officially released in **1994**. Because Linux combines the kernel with GNU utilities, its full name is **GNU/Linux** (`Linux distribution = Linux kernel + utility software`).\n\n---\n\n### 2. Comparison of Open Source Licenses\nIn the openEuler code repository, the **`LICENSES`** directory declares the open source licenses in use (defaulting to **MulanPSL v2** for community projects).\n\n| License | Key Rules & Commercial/Derivative Requirements |\n| :--- | :--- |\n| **Mulan** | **China's first open source license.** Covers 5 aspects: copyright license, patent license, non-trademark license, distribution restriction, and disclaimer/liability limitation. Grants a permanent, global, free, non-exclusive, irrevocable copyright license. |\n| **GPL** | **General Public License.** Strictly contagious (\"copyleft\"): any software that references a GPL library, modifies GPL code, or derives from GPL code **must also use the GPL** (open source and free of charge, though charging for distribution/support is permitted). |\n| **LGPL** | **Lesser GPL.** Designed for class libraries. Allows **commercial software to link to an LGPL library without open-sourcing the commercial code**. However, direct modifications or derivatives of the LGPL library itself must remain LGPL. |\n| **BSD** | **Permissive license.** Allows modification and redistribution as open-source or **proprietary/commercial software**, provided 3 conditions are met: (1) retain original BSD license in source distributions, (2) include BSD license/copyright in binary docs, (3) **do not use the original software/author/institution name for marketing**. |\n\n---\n\n### 3. Linux Kernel Numbering & openEuler Releases\n* **Linux Kernel Version (`X.Y.Z`, hosted at `kernel.org`):**\n  * **1st digit (`X`):** Major release.\n  * **2nd digit (`Y`):** In traditional 3-digit numbering, an **even** number indicates a **stable version**, while an **odd** number indicates a **version under development**.\n  * **3rd digit (`Z`):** Number of revisions. (Example: openEuler 20.03 LTS uses kernel `4.19.90`).\n* **openEuler Release Cadence:**\n  * **Innovation Release** (e.g., openEuler 20.09): Released **every half a year (6 months)** for technical innovation.\n  * **Long-Term Support (LTS) Release** (e.g., openEuler 20.03 LTS, 22.03 LTS, 24.03 LTS): Stable enterprise release published **every 2 years**.\n* **Community Contribution Workflow & Portals:**\n  * Workflow: `Join community -> Sign CLA -> Join SIG -> Assign issues -> Prepare dev. env. -> Submit code -> Review code`.\n  * Key Portals: Official website (`www.openeuler.org`), Code hosting (`gitee.com/openeuler`), Docs (`docs.openeuler.org`), Forum (`forum.openeuler.org`), Issue tracker (`quickissue.openeuler.org`).","key_takeaways":["Mulan is China's first open source license covering 5 aspects (copyright, patent, non-trademark, distribution restriction, disclaimer). openEuler declares its licenses in the LICENSES directory.","LGPL permits commercial software to link to LGPL libraries without open-sourcing the commercial code, whereas GPL requires any software referencing/modifying GPL code to also be GPL.","openEuler Innovation releases are published every 6 months (half a year); openEuler LTS (Long-Term Support) releases are published every 2 years."],"exam_traps":["EXAM TRAP: Do not confuse Innovation vs. LTS release cycles! Innovation = every half a year (6 months); LTS = every 2 years.","EXAM TRAP: In the traditional 3-digit Linux kernel version scheme taught in Ch.02 (p.33), an EVEN second digit denotes a stable version, and an ODD second digit denotes a development version."],"content_html":"<h3>1. From Multics and Unix to GNU/Linux<\/h3>\n<ul class=\"md-list\">\n<li><strong>Multics (1965):<\/strong> Bell Labs, MIT, and GE jointly developed the <strong>Multiplexed Information and Computing Service<\/strong> time-sharing multitasking system. Bell Labs withdrew in 1969.<\/li>\n<li><strong>Unix (1969–1970):<\/strong> <strong>Ken Thompson<\/strong> at Bell Labs wrote a lightweight OS to run his game <em>Space Travel<\/em>, named <strong>Unix<\/strong> (Uniplexed Information and Computing Service). <strong>1970<\/strong> is defined as the <strong>Unix Epoch<\/strong>. Commercial Unix derivatives include <strong>IBM AIX<\/strong>, <strong>HP-UX<\/strong>, and <strong>Digital Unix<\/strong>.<\/li>\n<li><strong>GNU &amp; FSF (1984):<\/strong> <strong>Richard Stallman<\/strong> launched the Free Software Campaign and founded the <strong>Free Software Foundation (FSF)<\/strong>, creating open-source Unix utilities and the <strong>GPL<\/strong>. FSF defines <strong>Four Freedoms<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Freedom to run programs for any purpose.<\/li>\n<li>Freedom to learn and modify the source code.<\/li>\n<li>Freedom to redistribute programs.<\/li>\n<li>Freedom to create derivatives.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Minix (1987) &amp; Linux (1991):<\/strong> Professor <strong>Andrew S. Tanenbaum<\/strong> (Vrije University, Amsterdam) wrote <strong>Minix<\/strong> for teaching. On <strong>September 17, 1991<\/strong>, <strong>Linus Torvalds<\/strong> released the free Linux OS online; <strong>Linux kernel 1.0<\/strong> was officially released in <strong>1994<\/strong>. Because Linux combines the kernel with GNU utilities, its full name is <strong>GNU/Linux<\/strong> (<code class=\"inline-code\">Linux distribution = Linux kernel + utility software<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Comparison of Open Source Licenses<\/h3>\n<p>In the openEuler code repository, the <strong><code class=\"inline-code\">LICENSES<\/code><\/strong> directory declares the open source licenses in use (defaulting to <strong>MulanPSL v2<\/strong> for community projects).<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>License<\/th><th>Key Rules &amp; Commercial/Derivative Requirements<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Mulan<\/strong><\/td><td><strong>China's first open source license.<\/strong> Covers 5 aspects: copyright license, patent license, non-trademark license, distribution restriction, and disclaimer/liability limitation. Grants a permanent, global, free, non-exclusive, irrevocable copyright license.<\/td><\/tr>\n<tr><td><strong>GPL<\/strong><\/td><td><strong>General Public License.<\/strong> Strictly contagious (\"copyleft\"): any software that references a GPL library, modifies GPL code, or derives from GPL code <strong>must also use the GPL<\/strong> (open source and free of charge, though charging for distribution/support is permitted).<\/td><\/tr>\n<tr><td><strong>LGPL<\/strong><\/td><td><strong>Lesser GPL.<\/strong> Designed for class libraries. Allows <strong>commercial software to link to an LGPL library without open-sourcing the commercial code<\/strong>. However, direct modifications or derivatives of the LGPL library itself must remain LGPL.<\/td><\/tr>\n<tr><td><strong>BSD<\/strong><\/td><td><strong>Permissive license.<\/strong> Allows modification and redistribution as open-source or <strong>proprietary/commercial software<\/strong>, provided 3 conditions are met: (1) retain original BSD license in source distributions, (2) include BSD license/copyright in binary docs, (3) <strong>do not use the original software/author/institution name for marketing<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Linux Kernel Numbering &amp; openEuler Releases<\/h3>\n<ul class=\"md-list\">\n<li><strong>Linux Kernel Version (<code class=\"inline-code\">X.Y.Z<\/code>, hosted at <code class=\"inline-code\">kernel.org<\/code>):<\/strong><\/li>\n<li><strong>1st digit (<code class=\"inline-code\">X<\/code>):<\/strong> Major release.<\/li>\n<li><strong>2nd digit (<code class=\"inline-code\">Y<\/code>):<\/strong> In traditional 3-digit numbering, an <strong>even<\/strong> number indicates a <strong>stable version<\/strong>, while an <strong>odd<\/strong> number indicates a <strong>version under development<\/strong>.<\/li>\n<li><strong>3rd digit (<code class=\"inline-code\">Z<\/code>):<\/strong> Number of revisions. (Example: openEuler 20.03 LTS uses kernel <code class=\"inline-code\">4.19.90<\/code>).<\/li>\n<li><strong>openEuler Release Cadence:<\/strong><\/li>\n<li><strong>Innovation Release<\/strong> (e.g., openEuler 20.09): Released <strong>every half a year (6 months)<\/strong> for technical innovation.<\/li>\n<li><strong>Long-Term Support (LTS) Release<\/strong> (e.g., openEuler 20.03 LTS, 22.03 LTS, 24.03 LTS): Stable enterprise release published <strong>every 2 years<\/strong>.<\/li>\n<li><strong>Community Contribution Workflow &amp; Portals:<\/strong><\/li>\n<li>Workflow: <code class=\"inline-code\">Join community -&gt; Sign CLA -&gt; Join SIG -&gt; Assign issues -&gt; Prepare dev. env. -&gt; Submit code -&gt; Review code<\/code>.<\/li>\n<li>Key Portals: Official website (<code class=\"inline-code\">www.openeuler.org<\/code>), Code hosting (<code class=\"inline-code\">gitee.com/openeuler<\/code>), Docs (<code class=\"inline-code\">docs.openeuler.org<\/code>), Forum (<code class=\"inline-code\">forum.openeuler.org<\/code>), Issue tracker (<code class=\"inline-code\">quickissue.openeuler.org<\/code>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Inspecting openEuler Release, Kernel Version & Community Workflow","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You have logged into a freshly provisioned openEuler server. Verify the OS release file, inspect the kernel release and processor architecture using `uname`, and check the `LICENSES` directory.","instructions":["Step 1: View the openEuler release version information stored in `/etc/os-release` using `cat /etc/os-release`.","Step 2: Display the running Linux kernel version and hardware architecture using `uname -r` or `uname -a`.","Step 3: Echo the release cycles (`LTS=2_years`, `Innovation=6_months`) to confirm openEuler lifecycle compliance."],"starter_code":"# Step 1: Display OS release details\n<command_to_view_os_release>\n\n# Step 2: Check kernel version\n<command_to_check_kernel>\n\n# Step 3: Verify release cadence\necho \"LTS=2_years, Innovation=6_months\"","solution_code":"# Step 1: Display OS release details\ncat /etc/os-release\n\n# Step 2: Check kernel version\nuname -r\n\n# Step 3: Verify release cadence\necho \"LTS=2_years, Innovation=6_months\"","hints":["Use `cat /etc/os-release` or `cat /etc/openEuler-release` to inspect the distribution release.","Use `uname -r` or `uname -a` to print the kernel version.","Keep the echo statement in Step 3 intact."],"validation_checks":[{"step":1,"description":"Read /etc/os-release or /etc/openEuler-release","required_any":["/etc/os-release","/etc/openeuler-release"],"feedback_fail":"Use 'cat /etc/os-release' to inspect the openEuler release version."},{"step":2,"description":"Check kernel version with uname","required_any":["uname"],"feedback_fail":"Use 'uname -r' or 'uname -a' to check the Linux kernel version."},{"step":3,"description":"Confirm LTS and Innovation release cycles","required_any":["2_years","6_months"],"feedback_fail":"Ensure the echo line includes 'LTS=2_years, Innovation=6_months'."}],"simulated_output":"NAME=\"openEuler\"\nVERSION=\"24.03 (LTS)\"\nID=\"openEuler\"\nVERSION_ID=\"24.03\"\nPRETTY_NAME=\"openEuler 24.03 (LTS)\"\nANSI_COLOR=\"0;31\"\n\n6.6.0-28.0.0.34.oe2403.aarch64\nLTS=2_years, Innovation=6_months","quiz_questions":[{"id":"h1_s2_q1","type":"single","question":"Which open source license allows commercial software to reference and link to an open-source class library without requiring the commercial software's own source code to be open-sourced?","options":["A. GPL","B. LGPL","C. Proprietary EULA","D. Copyfree Only"],"answer":"B","explanation":"Per Ch.02 (p.30), LGPL (Lesser GPL) is designed for class libraries and allows commercial software to use the LGPL library in link mode without open-sourcing the commercial software code."},{"id":"h1_s2_q2","type":"single","question":"What are the standard release intervals for openEuler Innovation releases and Long-Term Support (LTS) releases, respectively?","options":["A. Every 3 months; Every 1 year","B. Every half a year (6 months); Every 2 years","C. Every 1 year; Every 5 years","D. Every 2 years; Every 6 months"],"answer":"B","explanation":"Per Ch.02 (p.34), an openEuler Innovation release is generally released every half a year (6 months), whereas an LTS release is usually released every two years."},{"id":"h1_s2_q3","type":"multiple","question":"Which five major aspects are covered by China's Mulan open source license?","options":["A. Copyright license and Patent license","B. Non-trademark license","C. Distribution restriction","D. Disclaimer and liability limitation"],"answer":"ABCD","explanation":"Per Ch.02 (p.29), the Mulan license involves five major aspects: copyright license, patent license, non-trademark license, distribution restriction, and disclaimer and liability limitation."}],"reference_figures":[]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Installing-openEuler-OS-and-Partitioning","exercise_slug":"06-Exercise-openEuler-Installation-and-Partition-Plan-Lab","lecture":{"title":"Installing openEuler OS, Hardware Architectures & Partition Planning","duration_mins":7,"pdf_ref":"Ch.02, pp. 38–45, 52","objectives":["Identify the 6 processor architectures and 4 application scenarios supported by openEuler","Distinguish manual installation (USB, CD-ROM, Virtual CD-ROM/ISO) vs. batch automated installation using Kickstart","Configure recommended boot/system partitions (/, /boot, /boot/efi, swap) and Software Selection profiles (Minimum, Server, Hypervisor)"],"content_markdown":"### 1. Pre-Installation Planning: Architectures, Scenarios & Modes\nBefore installing openEuler, administrators must match the installation ISO package to both the target **chip architecture** and **application scenario** (packages across different architectures are incompatible):\n* **6 Supported Processor Architectures:** **x86**, **Arm (AArch64)**, **SW64**, **RISC-V**, **LoongArch**, and **PowerPC**.\n* **4 Application Scenarios:** **Server**, **Cloud Computing**, **Edge Computing**, and **Embedded Systems**.\n* **Installation Modes:**\n  * **Individual Setup:** USB drives, physical CD-ROMs, or virtual CD-ROM drives (mounting `.iso` image).\n  * **Batch Installation:** Automated installation using the **Kickstart** tool, which supports:\n    1. **Semi-automatic installation:** Specify the location of the kickstart file; Kickstart configures keyboard, language, and partitions automatically.\n    2. **Full automation:** The entire OS installation is automated without manual intervention.\n\n---\n\n### 2. Boot Menu & Recommended System Partitions\nWhen booting from the openEuler 24.03/20.03 LTS ISO:\n* **Boot Menu Options:**\n  * `Install openEuler 24.03 LTS`: Directly install the system.\n  * `Test this media & install openEuler 24.03 LTS`: Check the software package integrity first, then install.\n  * `Troubleshooting -->`: Rescue and diagnostic mode.\n  * Keybindings: `[Up]`/`[Down]` to select, **`e`** to edit the selected boot item, or **`c`** for a command prompt.\n* **Recommended Manual Partitions (`Installation Destination`):**\n  In manual partitioning mode, you can configure **common (standard) partitions**, **logical volumes (LVM)**, or **thin-provisioning logical volumes**:\n\n| Partition / Mount Point | Purpose & Sizing Guideline |\n| :--- | :--- |\n| **`/` (Root partition)** | **Everything in Linux starts from the root partition.** Stores core OS directories. |\n| **`/boot`** | Stores kernel and boot loader files required for system booting. |\n| **`/boot/efi`** | Boot device and application program started by the **Extensible Firmware Interface (EFI/UEFI)**. |\n| **`swap`** | Virtual memory swap partition used to swap dirty data from RAM when memory is insufficient. **Sizing rule:** If physical memory is small, set `swap` to **twice (2×) the memory size**; if memory is large, reduce the swap ratio accordingly. |\n<!-- PDF_FIGS_START -->\n![openEuler Installation Summary Spokes (Localization, Software, System) (Official Reference: p. 42)](./assets/images/p2_h1s3_anaconda_summary.png)\n*Figure: openEuler Installation Summary Spokes (Localization, Software, System) (Official Reference: p. 42)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Software Selection & Root/User Account Creation\n* **3 Software Selection Base Environments (openEuler 24.03 LTS):**\n  1. **Minimum installation:** Most software is not installed (default CLI); ideal for learning Linux architecture or minimal footprint servers.\n  2. **Server:** Installs software packages tailored for enterprise server scenarios.\n  3. **Hypervisor:** Installs virtualization host software packages.\n* **Root Password & User Creation:**\n  * `root` is the super administrator with the highest permissions.\n  * **Official Ch.02 Quiz Q1 Note:** Page 45 states *\"During openEuler installation, you need to set the password of the root user. You can create a common user as required.\"* However, **Official Ch.02 Quiz Q1 (p.52)** states: *\"(True or false) You do not need to specify the password of the root user during the openEuler OS installation. However, you must specify the password of the root user when logging in to the OS after the installation.\"* -> **Official Answer Key: A (True)**. Remember this exact wording if it appears verbatim on the exam!","key_takeaways":["openEuler supports 6 processor architectures: x86, Arm, SW64, RISC-V, LoongArch, and PowerPC, across 4 scenarios: Server, Cloud, Edge, and Embedded.","For batch automated installations, openEuler uses the Kickstart tool (semi-automatic or full automation).","Recommended partitions are /, /boot, /boot/efi, and swap (set swap to 2x RAM when memory is small); software selection offers Minimum installation, Server, and Hypervisor."],"exam_traps":["EXAM TRAP (Official Ch.02 Quiz Q1 Verbatim Key): In the official Ch.02 Quiz (p.52), the statement 'You do not need to specify the password of the root user during the openEuler OS installation. However, you must specify the password of the root user when logging in to the OS after the installation' is keyed as A (True). Memorize this exact official answer key!","EXAM TRAP: At the GRUB installation menu, pressing 'e' edits the selected boot item, while pressing 'c' opens a command prompt."],"content_html":"<h3>1. Pre-Installation Planning: Architectures, Scenarios &amp; Modes<\/h3>\n<p>Before installing openEuler, administrators must match the installation ISO package to both the target <strong>chip architecture<\/strong> and <strong>application scenario<\/strong> (packages across different architectures are incompatible):<\/p>\n<ul class=\"md-list\">\n<li><strong>6 Supported Processor Architectures:<\/strong> <strong>x86<\/strong>, <strong>Arm (AArch64)<\/strong>, <strong>SW64<\/strong>, <strong>RISC-V<\/strong>, <strong>LoongArch<\/strong>, and <strong>PowerPC<\/strong>.<\/li>\n<li><strong>4 Application Scenarios:<\/strong> <strong>Server<\/strong>, <strong>Cloud Computing<\/strong>, <strong>Edge Computing<\/strong>, and <strong>Embedded Systems<\/strong>.<\/li>\n<li><strong>Installation Modes:<\/strong><\/li>\n<li><strong>Individual Setup:<\/strong> USB drives, physical CD-ROMs, or virtual CD-ROM drives (mounting <code class=\"inline-code\">.iso<\/code> image).<\/li>\n<li><strong>Batch Installation:<\/strong> Automated installation using the <strong>Kickstart<\/strong> tool, which supports:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Semi-automatic installation:<\/strong> Specify the location of the kickstart file; Kickstart configures keyboard, language, and partitions automatically.<\/li>\n<li><strong>Full automation:<\/strong> The entire OS installation is automated without manual intervention.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Boot Menu &amp; Recommended System Partitions<\/h3>\n<p>When booting from the openEuler 24.03/20.03 LTS ISO:<\/p>\n<ul class=\"md-list\">\n<li><strong>Boot Menu Options:<\/strong><\/li>\n<li><code class=\"inline-code\">Install openEuler 24.03 LTS<\/code>: Directly install the system.<\/li>\n<li><code class=\"inline-code\">Test this media &amp; install openEuler 24.03 LTS<\/code>: Check the software package integrity first, then install.<\/li>\n<li><code class=\"inline-code\">Troubleshooting --&gt;<\/code>: Rescue and diagnostic mode.<\/li>\n<li>Keybindings: <code class=\"inline-code\">[Up]<\/code>/<code class=\"inline-code\">[Down]<\/code> to select, <strong><code class=\"inline-code\">e<\/code><\/strong> to edit the selected boot item, or <strong><code class=\"inline-code\">c<\/code><\/strong> for a command prompt.<\/li>\n<li><strong>Recommended Manual Partitions (<code class=\"inline-code\">Installation Destination<\/code>):<\/strong><\/li>\n<\/ul>\n<p>In manual partitioning mode, you can configure <strong>common (standard) partitions<\/strong>, <strong>logical volumes (LVM)<\/strong>, or <strong>thin-provisioning logical volumes<\/strong>:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Partition / Mount Point<\/th><th>Purpose &amp; Sizing Guideline<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">/<\/code> (Root partition)<\/strong><\/td><td><strong>Everything in Linux starts from the root partition.<\/strong> Stores core OS directories.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/boot<\/code><\/strong><\/td><td>Stores kernel and boot loader files required for system booting.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/boot/efi<\/code><\/strong><\/td><td>Boot device and application program started by the <strong>Extensible Firmware Interface (EFI/UEFI)<\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">swap<\/code><\/strong><\/td><td>Virtual memory swap partition used to swap dirty data from RAM when memory is insufficient. <strong>Sizing rule:<\/strong> If physical memory is small, set <code class=\"inline-code\">swap<\/code> to <strong>twice (2×) the memory size<\/strong>; if memory is large, reduce the swap ratio accordingly.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h1s3_anaconda_summary.png\" alt=\"openEuler Installation Summary Spokes (Localization, Software, System)\" data-caption=\"openEuler Installation Summary Spokes (Localization, Software, System) (Official Reference: p. 42)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openEuler Installation Summary Spokes (Localization, Software, System)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 42 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Software Selection &amp; Root/User Account Creation<\/h3>\n<ul class=\"md-list\">\n<li><strong>3 Software Selection Base Environments (openEuler 24.03 LTS):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Minimum installation:<\/strong> Most software is not installed (default CLI); ideal for learning Linux architecture or minimal footprint servers.<\/li>\n<li><strong>Server:<\/strong> Installs software packages tailored for enterprise server scenarios.<\/li>\n<li><strong>Hypervisor:<\/strong> Installs virtualization host software packages.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Root Password &amp; User Creation:<\/strong><\/li>\n<li><code class=\"inline-code\">root<\/code> is the super administrator with the highest permissions.<\/li>\n<li><strong>Official Ch.02 Quiz Q1 Note:<\/strong> Page 45 states <em>\"During openEuler installation, you need to set the password of the root user. You can create a common user as required.\"<\/em> However, <strong>Official Ch.02 Quiz Q1 (p.52)<\/strong> states: <em>\"(True or false) You do not need to specify the password of the root user during the openEuler OS installation. However, you must specify the password of the root user when logging in to the OS after the installation.\"<\/em> -&gt; <strong>Official Answer Key: A (True)<\/strong>. Remember this exact wording if it appears verbatim on the exam!<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Kickstart & Partitioning Specification for openEuler 24.03 LTS","duration_mins":8,"exercise_type":"config","prompt_label":"root@openEuler:~#","scenario":"You are preparing an automated Kickstart configuration (`anaconda-ks.cfg`) for a batch of openEuler 24.03 LTS UEFI servers with 4 GB RAM. Complete the partition and environment rules.","instructions":["Step 1: Specify the automated batch installation tool name (`Kickstart`) in the header comment.","Step 2: Define the four recommended partitions: `/boot`, `/boot/efi`, `swap` (sized at 2x RAM = `8192` MB), and `/`.","Step 3: Select one of the three official software base environments (`Minimum installation`, `Server`, or `Hypervisor`)."],"starter_code":"# Batch Automation Tool: <tool_name>\npart /boot --fstype=\"ext4\" --size=1024\npart <efi_mount_point> --fstype=\"efi\" --size=200\npart <swap_partition> --fstype=\"swap\" --size=8192\npart <root_mount_point> --fstype=\"ext4\" --grow\nENVIRONMENT=\"<Minimum installation | Server | Hypervisor>\"","solution_code":"# Batch Automation Tool: Kickstart\npart /boot --fstype=\"ext4\" --size=1024\npart /boot/efi --fstype=\"efi\" --size=200\npart swap --fstype=\"swap\" --size=8192\npart / --fstype=\"ext4\" --grow\nENVIRONMENT=\"Server\"","hints":["The automated installation tool in openEuler/RedHat Anaconda is `Kickstart`.","UEFI boot partitions mount at `/boot/efi`, virtual memory is `swap`, and the root partition is `/`.","Choose `Minimum installation`, `Server`, or `Hypervisor` for `ENVIRONMENT`."],"validation_checks":[{"step":1,"description":"Identify Kickstart as the batch installation tool","required_any":["kickstart"],"feedback_fail":"Specify 'Kickstart' as the batch automation tool."},{"step":2,"description":"Configure /boot/efi and swap partitions","required_any":["/boot/efi"],"feedback_fail":"Include '/boot/efi' for the EFI partition mount point."},{"step":3,"description":"Configure swap and software environment","required_any":["part swap"],"feedback_fail":"Include 'part swap' and a valid base environment (Server, Hypervisor, or Minimum installation)."}],"simulated_output":"[Kickstart Validator] Parsing anaconda-ks.cfg...\n -> Tool: Kickstart (Full Automation Mode)\n -> Partition 1: /boot (1024 MB, ext4)\n -> Partition 2: /boot/efi (200 MB, EFI System Partition)\n -> Partition 3: swap (8192 MB = 2x 4GB RAM)\n -> Partition 4: / (Root partition, ext4, remaining capacity)\n -> Software Selection: Server Environment\n[OK] Kickstart configuration is valid for openEuler 24.03 LTS.","quiz_questions":[{"id":"h1_s3_q1","type":"tf","question":"[Official Ch.02 Quiz Q1] You do not need to specify the password of the root user during the openEuler OS installation. However, you must specify the password of the root user when logging in to the OS after the installation.","options":["A. True","B. False"],"answer":"A","explanation":"Official Ch.02 Quiz Q1 (p.52): Marked as A (True) in the official Huawei training material answer key."},{"id":"h1_s3_q2","type":"multiple","question":"Which of the following software installation options are supported on the 'Software Selection' screen of openEuler 24.03 LTS?","options":["A. Minimum installation","B. Server","C. Hypervisor","D. Windows Subsystem"],"answer":"ABC","explanation":"Per Ch.02 (p.44), openEuler 24.03 LTS supports three software installation base options: Minimum installation, Server, and Hypervisor."},{"id":"h1_s3_q3","type":"single","question":"Which tool is recommended in the openEuler documentation for batch automated OS installations?","options":["A. Anaconda GUI","B. Kickstart","C. fdisk","D. PuTTY"],"answer":"B","explanation":"Per Ch.02 (p.39), you can use the Kickstart tool to automatically install openEuler in semi-automatic or full automation mode for batch installations."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-CLI-vs-GUI-Login-and-Bash-Shortcuts","exercise_slug":"08-Exercise-Session-Switching-and-Bash-Shortcuts-Lab","lecture":{"title":"Logging In, CLI vs. GUI Desktops, Virtual Consoles & Bash Shortcuts","duration_mins":7,"pdf_ref":"Ch.02, pp. 47–52 & Ch.03, p. 62","objectives":["Compare CLI vs. GUI and identify the 5 optional desktop environments supported on openEuler (GNOME, UKUI, DDE, Kiran, XFCE)","Perform local virtual console switching (Ctrl+Alt+F1..F6 / Alt+F1..F6) and remote SSH login (PuTTY, Xshell)","Master shell prompts (# vs. ), user switching (su - username, id), and Bash keyboard shortcuts (Tab, history, Ctrl+A/E/C/L)"],"content_markdown":"### 1. CLI vs. GUI and Optional Desktop Environments on openEuler\n* **CLI (Command Line Interface):** Text-based UI driven by keyboard commands, options, and arguments; low resource overhead, scriptable, and the **default interface** after openEuler installation.\n* **GUI (Graphical User Interface):** Visual UI driven by mouse interactions (buttons, menus, dialogs) for ease of use. While openEuler installs in CLI mode by default, users can optionally install **five desktop environments**:\n  1. **GNOME:** Official desktop of the GNU Project; comprehensive and user-friendly.\n  2. **UKUI:** Lightweight, agile Linux desktop developed by the **Kylin Software** team based on GTK and QT with minimal component dependencies.\n  3. **DDE (Deepin Desktop Environment):** Powerful desktop environment developed by the **UnionTech Software** team.\n  4. **Kiran:** Secure, stable, efficient desktop developed by the **Hunan Kylin Information Security** team; supports both **x86 and AArch64**.\n  5. **XFCE:** Lightweight Linux desktop updated from GTK2 to GTK3 and GDBus with Object Introspection (GI).\n\n---\n\n### 2. Local Virtual Consoles, Remote Login & Shell Prompts\n* **Local Login & Virtual Consoles:**\n  * A typical Linux system provides **six virtual consoles (`tty1` to `tty6`)** and one graphical console.\n  * Press **`Ctrl+Alt+F[1–6]`** (or **`Alt+F1` to `Alt+F6`** in text mode) to switch between the 6 independent virtual consoles. If a program deadlocks on one console, you can switch to another virtual console to kill it.\n* **Remote Login:** Enabled by default via SSH using terminal clients like **PuTTY** or **Xshell**.\n* **Shell & System Prompt:**\n  * A **Shell** (compiled in C) acts as the bridge between the user and the Linux kernel. Common shells include **`bash`** (default on openEuler), `sh`, `csh`, and `ksh`.\n  * Prompt format: `[Current login user@Host name Current location]#/`\n  * **`#` (Hash/Pound):** Indicates the **root** superuser (`[root@openEuler ~]#`).\n  * **`` (Dollar sign):** Indicates a **common (regular) user** (`[user@openEuler ~]`).\n  * Use **`su - username`** to switch users, and **`id`** to check the current user's UID/GID.\n\n---\n\n### 3. Essential Bash Shell Keyboard Shortcuts\n| Shortcut / Command | Function in Bash Shell |\n| :--- | :--- |\n| **`Tab`** | **Automatically supplements (auto-completes) commands, parameters, or file names** (Ch.02 Quiz Q2!). Press **`Tab` twice** on an empty line to list all available commands. |\n| **`[Up]` and `[Down]`** | Quickly browse previously executed historical commands. |\n| **`history` / `!n`** | `history` lists recorded commands; `history n` (or `!n`) executes historical command `n`. |\n| **`Home` or `Ctrl+A`** | Moves the cursor to the **beginning** of the current line. |\n| **`End` or `Ctrl+E`** | Moves the cursor to the **end** of the current line. |\n| **`Ctrl+C`** | Immediately **stops/terminates** the currently running foreground program. |\n| **`clear` or `Ctrl+L`** | Quickly **clears the terminal screen**. |","key_takeaways":["openEuler uses the CLI and the bash shell by default; if a GUI is needed, GNOME, UKUI, DDE, Kiran, or XFCE can be installed.","The root user prompt ends with '#', whereas a common user prompt ends with ''. Switch users with 'su - username' and verify identity with 'id'.","Pressing 'Tab' quickly auto-completes commands and parameters (Ch.02 Quiz Q2); Ctrl+A jumps to the start of the line, Ctrl+E jumps to the end, Ctrl+C aborts the current program, and Ctrl+L (or clear) clears the screen."],"exam_traps":["EXAM TRAP (Ch.02 Quiz Q2): 'Tab' is used to quickly supplement commands and parameters—do NOT confuse it with Ctrl+L (clear screen) or Up/Down arrows (command history).","EXAM TRAP: Note the slight typo on Slide 26 of Ch.02 ('Generally, the last prompt of the root user and common users is #') vs. Slide 28 of Ch.02 ('the command prompt of the root user generally ends with #, while that of a common user generally ends with '). Slide 28 is the standard Unix/Linux rule tested on exams!"],"content_html":"<h3>1. CLI vs. GUI and Optional Desktop Environments on openEuler<\/h3>\n<ul class=\"md-list\">\n<li><strong>CLI (Command Line Interface):<\/strong> Text-based UI driven by keyboard commands, options, and arguments; low resource overhead, scriptable, and the <strong>default interface<\/strong> after openEuler installation.<\/li>\n<li><strong>GUI (Graphical User Interface):<\/strong> Visual UI driven by mouse interactions (buttons, menus, dialogs) for ease of use. While openEuler installs in CLI mode by default, users can optionally install <strong>five desktop environments<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>GNOME:<\/strong> Official desktop of the GNU Project; comprehensive and user-friendly.<\/li>\n<li><strong>UKUI:<\/strong> Lightweight, agile Linux desktop developed by the <strong>Kylin Software<\/strong> team based on GTK and QT with minimal component dependencies.<\/li>\n<li><strong>DDE (Deepin Desktop Environment):<\/strong> Powerful desktop environment developed by the <strong>UnionTech Software<\/strong> team.<\/li>\n<li><strong>Kiran:<\/strong> Secure, stable, efficient desktop developed by the <strong>Hunan Kylin Information Security<\/strong> team; supports both <strong>x86 and AArch64<\/strong>.<\/li>\n<li><strong>XFCE:<\/strong> Lightweight Linux desktop updated from GTK2 to GTK3 and GDBus with Object Introspection (GI).<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Local Virtual Consoles, Remote Login &amp; Shell Prompts<\/h3>\n<ul class=\"md-list\">\n<li><strong>Local Login &amp; Virtual Consoles:<\/strong><\/li>\n<li>A typical Linux system provides <strong>six virtual consoles (<code class=\"inline-code\">tty1<\/code> to <code class=\"inline-code\">tty6<\/code>)<\/strong> and one graphical console.<\/li>\n<li>Press <strong><code class=\"inline-code\">Ctrl+Alt+F[1–6]<\/code><\/strong> (or <strong><code class=\"inline-code\">Alt+F1<\/code> to <code class=\"inline-code\">Alt+F6<\/code><\/strong> in text mode) to switch between the 6 independent virtual consoles. If a program deadlocks on one console, you can switch to another virtual console to kill it.<\/li>\n<li><strong>Remote Login:<\/strong> Enabled by default via SSH using terminal clients like <strong>PuTTY<\/strong> or <strong>Xshell<\/strong>.<\/li>\n<li><strong>Shell &amp; System Prompt:<\/strong><\/li>\n<li>A <strong>Shell<\/strong> (compiled in C) acts as the bridge between the user and the Linux kernel. Common shells include <strong><code class=\"inline-code\">bash<\/code><\/strong> (default on openEuler), <code class=\"inline-code\">sh<\/code>, <code class=\"inline-code\">csh<\/code>, and <code class=\"inline-code\">ksh<\/code>.<\/li>\n<li>Prompt format: <code class=\"inline-code\">[Current login user@Host name Current location]#/<\/code><\/li>\n<li><strong><code class=\"inline-code\">#<\/code> (Hash/Pound):<\/strong> Indicates the <strong>root<\/strong> superuser (<code class=\"inline-code\">[root@openEuler ~]#<\/code>).<\/li>\n<li><strong><code class=\"inline-code\"><\/code> (Dollar sign):<\/strong> Indicates a <strong>common (regular) user<\/strong> (<code class=\"inline-code\">[user@openEuler ~]<\/code>).<\/li>\n<li>Use <strong><code class=\"inline-code\">su - username<\/code><\/strong> to switch users, and <strong><code class=\"inline-code\">id<\/code><\/strong> to check the current user's UID/GID.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Essential Bash Shell Keyboard Shortcuts<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Shortcut / Command<\/th><th>Function in Bash Shell<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">Tab<\/code><\/strong><\/td><td><strong>Automatically supplements (auto-completes) commands, parameters, or file names<\/strong> (Ch.02 Quiz Q2!). Press <strong><code class=\"inline-code\">Tab<\/code> twice<\/strong> on an empty line to list all available commands.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">[Up]<\/code> and <code class=\"inline-code\">[Down]<\/code><\/strong><\/td><td>Quickly browse previously executed historical commands.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">history<\/code> / <code class=\"inline-code\">!n<\/code><\/strong><\/td><td><code class=\"inline-code\">history<\/code> lists recorded commands; <code class=\"inline-code\">history n<\/code> (or <code class=\"inline-code\">!n<\/code>) executes historical command <code class=\"inline-code\">n<\/code>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">Home<\/code> or <code class=\"inline-code\">Ctrl+A<\/code><\/strong><\/td><td>Moves the cursor to the <strong>beginning<\/strong> of the current line.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">End<\/code> or <code class=\"inline-code\">Ctrl+E<\/code><\/strong><\/td><td>Moves the cursor to the <strong>end<\/strong> of the current line.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">Ctrl+C<\/code><\/strong><\/td><td>Immediately <strong>stops/terminates<\/strong> the currently running foreground program.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">clear<\/code> or <code class=\"inline-code\">Ctrl+L<\/code><\/strong><\/td><td>Quickly <strong>clears the terminal screen<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>"},"exercise":{"title":"Hands-On Lab: Identity Verification, Shell Inspection & History Navigation","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are logged into openEuler via SSH as `root`. Verify your current UID/GID identity, display recent command history, switch to the common user `openeuler` using a login shell, and exit back to `root`.","instructions":["Step 1: Run the `id` command to display the current user's UID, GID, and group memberships.","Step 2: Run the `history` command to view previously executed shell commands.","Step 3: Switch to the user `openeuler` with a full login environment using `su - openeuler`."],"starter_code":"# Step 1: View current user UID and GID\n<command_1>\n\n# Step 2: View historical commands\n<command_2>\n\n# Step 3: Switch to user 'openeuler' with login environment\n<command_3>","solution_code":"# Step 1: View current user UID and GID\nid\n\n# Step 2: View historical commands\nhistory\n\n# Step 3: Switch to user 'openeuler' with login environment\nsu - openeuler","hints":["The `id` command prints the current user's UID and GID.","The `history` command lists the recorded bash command history.","Use `su - openeuler` to switch to the `openeuler` account."],"validation_checks":[{"step":1,"description":"Run the id command","required_any":["id"],"feedback_fail":"Include the 'id' command to check the current user's UID/GID."},{"step":2,"description":"Run the history command","required_any":["history"],"feedback_fail":"Include the 'history' command to inspect recorded commands."},{"step":3,"description":"Switch user with su - openeuler","required_any":["su - openeuler","su -l openeuler"],"feedback_fail":"Use 'su - openeuler' to switch to the openeuler user."}],"simulated_output":"uid=0(root) gid=0(root) groups=0(root)\n    1  cat /etc/os-release\n    2  uname -r\n    3  id\n    4  history\nLast login: Tue Nov 17 09:15:02 CST 2026 on pts/0\n[openeuler@openEuler ~]","quiz_questions":[{"id":"h1_s4_q1","type":"single","question":"[Official Ch.02 Quiz Q2] Which of the following keys can be used to quickly supplement commands and parameters?","options":["A. Ctrl+L","B. [Up] and [Down]","C. tab","D. Space"],"answer":"C","explanation":"Official Ch.02 Quiz Q2 (p.52): C. The Tab key is used to automatically supplement (auto-complete) commands, file names, and parameters."},{"id":"h1_s4_q2","type":"single","question":"In the Bash shell on openEuler, which keyboard shortcut moves the cursor to the beginning of the current command line, and which moves it to the end?","options":["A. Ctrl+C and Ctrl+L","B. Ctrl+A (or Home) and Ctrl+E (or End)","C. Alt+F1 and Alt+F6","D. Ctrl+Z and Ctrl+D"],"answer":"B","explanation":"Per Ch.02 (p.50) and Ch.03 (p.62), Home or Ctrl+A moves the cursor to the beginning of the line, while End or Ctrl+E moves the cursor to the end of the line."},{"id":"h1_s4_q3","type":"multiple","question":"Which of the following graphical desktop environments can be installed on openEuler if a GUI is required?","options":["A. GNOME and XFCE","B. UKUI (developed by Kylin Software)","C. DDE (developed by UnionTech Software)","D. Kiran (developed by Hunan Kylin Information Security)"],"answer":"ABCD","explanation":"Per Ch.02 (p.47), openEuler uses the CLI by default, and supports installing GNOME, UKUI, DDE, Kiran, or XFCE desktop environments as needed."}],"reference_figures":[]}}]},{"hour_number":2,"folder_name":"Hour-02-openEuler-CLI-Basics-and-File-Operations","title":"openEuler CLI Basics & File Operations","chapter_ref":"Chapter 03 Part 1 (pp. 55–117)","duration_mins":60,"overview":"Master Linux command syntax, the 9 manual (`man`) sections, session and power management commands, the Linux Filesystem Hierarchy Standard (FHS), directory navigation (`pwd`, `cd`, `ls`), file lifecycle operations (`mkdir`, `touch`, `cp`, `mv`, `rm`), file searching (`find`, `locate`, `which`), archiving/compression (`gzip`, `tar`), and hard vs. symbolic links (`ln`).","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-CLI-Syntax-Help-and-Power-Management","exercise_slug":"02-Exercise-Help-Session-and-Power-Commands-Lab","lecture":{"title":"Linux Command Syntax, Help Utilities & Session/Power Management","duration_mins":7,"pdf_ref":"Ch.03, pp. 60–78","objectives":["Parse standard Linux command syntax (`command [-option] [parameter]`) and distinguish short (`-a`) vs. long (`--all`) options","Query documentation using `man` (9 manual sections and `coreutils-help` on openEuler), `whatis`, and `help`","Execute login/session commands (`login`, `last`, `exit`) and safe power management (`shutdown`, `halt`, `reboot`)"],"content_markdown":"### 1. Why CLI & Standard Linux Command Syntax\n* **Why CLI:** Higher efficiency (keyboard + scripting automation), low resource overhead compared to GUI, and often the only choice for production servers.\n* **Standard Syntax:** `command [-option] [parameter]` (e.g., `ls -la /etc`).\n  * Multiple short options can be combined after a single hyphen (`-la` = `-l -a`).\n  * **Short options** use one hyphen (`-a`); **long options** use two hyphens (`--all`).\n\n---\n\n### 2. Help Utilities: `man`, `whatis`, and `help`\n* **`man` (Manual Pages — part of the `man-db` package):**\n  * Searches for `.gz` manual files in `/usr/share/man`.\n  * **openEuler Streamlining Rule:** On openEuler, command binaries and documentation packages are separated! Installing a command does not automatically install its man pages; you must install **`coreutils-help`** to view detailed manuals for core commands.\n  * **9 Manual Sections:**\n    * **`1`**: User commands/programs operable in the shell (e.g., `man 1 passwd`).\n    * **`2`**: System calls invoked by the kernel.\n    * **`3`**: Library functions (e.g., `man 3 sleep`).\n    * **`4`**: Device file descriptions (usually in `/dev`).\n    * **`5`**: File formats and conventions (e.g., `man 5 passwd` for `/etc/passwd`).\n    * **`6`**: Games.\n    * **`7`**: Miscellaneous (macros, conventions).\n    * **`8`**: System management commands (root/superuser only).\n    * **`9`**: Kernel routines (non-standard).\n  * Search man pages by keyword: **`man -k KEYWORD`** or `find /usr/share/man -iname \"*KEYWORD*\"`.\n* **`whatis <command>`:** Pulls the `NAME` section from a manual page to display a one-line summary (e.g., `whatis ls` -> `ls (1) - list directory contents`).\n* **`help [-d|-s] <builtin>`:** Displays help for Bash built-in commands (e.g., `help pwd`). `-d` prints a brief description; `-s` prints command syntax.\n\n---\n\n### 3. Login/Session & Power Management Commands\n* **Login & Session Auditing:**\n  * **`login`**: Logs in to the system (applicable to all users).\n  * **`last`**: Reads `/var/log/wtmp` to display recent user/terminal logins, reboots, and shutdowns. Options: `-n <num>` (number of records), `-t tty` (specific console), `-y` (display year/month/day), `-x` (shutdowns/logins/logouts), `-f file`, `-i IP`.\n  * **`exit`**: Logs out of the current shell session (no options).\n* **Power Management (Superuser Only):**\n  * **`shutdown`**: Safely shuts down or restarts the system, notifying all logged-in users and freezing `login`.\n    * **`-h`**: Powers off after shutdown.\n    * **`-r`**: Restarts after shutdown.\n    * **`-k`**: Sends warning messages to users **without** actually shutting down.\n    * **`-F`**: Forcibly runs filesystem check (`fsck`) on reboot.\n    * **`-t <sec>` / `-time`**: Specifies delay before shutdown.\n  * **`halt`**: Terminates processes, calls `sync` (writes buffer data to disk), and stops the kernel. Options: `-n` (do not sync system calls—used after repairing root partition with `fsck` so kernel doesn't overwrite repaired superblock), `-w` (only write record to `/var/log/wtmp` without halting), `-d` (do not write record to `wtmp`), `-f` (force halt without calling `shutdown`), `-i` (shut down network interfaces first).\n  * **`reboot`**: Restarts the host (`-n`, `-w`, `-d`, `-i`).","key_takeaways":["man pages are divided into 9 sections: 1 = User commands, 2 = System calls, 3 = C library functions, 4 = /dev devices, 5 = Config file formats, 8 = Root admin commands.","On openEuler, command packages and documentation packages are separated; install 'coreutils-help' to access core command manual pages.","shutdown -k only broadcasts a warning without shutting down; halt -w / reboot -w only writes a record to /var/log/wtmp without halting/rebooting."],"exam_traps":["EXAM TRAP: 'man 1 passwd' views the passwd command manual, whereas 'man 5 passwd' views the /etc/passwd configuration file format manual!","EXAM TRAP: Neither 'shutdown -k', 'halt -w', nor 'reboot -w' actually powers off or restarts the server—'-k' only warns users, and '-w' only writes a test record to /var/log/wtmp."],"content_html":"<h3>1. Why CLI &amp; Standard Linux Command Syntax<\/h3>\n<ul class=\"md-list\">\n<li><strong>Why CLI:<\/strong> Higher efficiency (keyboard + scripting automation), low resource overhead compared to GUI, and often the only choice for production servers.<\/li>\n<li><strong>Standard Syntax:<\/strong> <code class=\"inline-code\">command [-option] [parameter]<\/code> (e.g., <code class=\"inline-code\">ls -la /etc<\/code>).<\/li>\n<li>Multiple short options can be combined after a single hyphen (<code class=\"inline-code\">-la<\/code> = <code class=\"inline-code\">-l -a<\/code>).<\/li>\n<li><strong>Short options<\/strong> use one hyphen (<code class=\"inline-code\">-a<\/code>); <strong>long options<\/strong> use two hyphens (<code class=\"inline-code\">--all<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Help Utilities: <code class=\"inline-code\">man<\/code>, <code class=\"inline-code\">whatis<\/code>, and <code class=\"inline-code\">help<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">man<\/code> (Manual Pages — part of the <code class=\"inline-code\">man-db<\/code> package):<\/strong><\/li>\n<li>Searches for <code class=\"inline-code\">.gz<\/code> manual files in <code class=\"inline-code\">/usr/share/man<\/code>.<\/li>\n<li><strong>openEuler Streamlining Rule:<\/strong> On openEuler, command binaries and documentation packages are separated! Installing a command does not automatically install its man pages; you must install <strong><code class=\"inline-code\">coreutils-help<\/code><\/strong> to view detailed manuals for core commands.<\/li>\n<li><strong>9 Manual Sections:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">1<\/code><\/strong>: User commands/programs operable in the shell (e.g., <code class=\"inline-code\">man 1 passwd<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">2<\/code><\/strong>: System calls invoked by the kernel.<\/li>\n<li><strong><code class=\"inline-code\">3<\/code><\/strong>: Library functions (e.g., <code class=\"inline-code\">man 3 sleep<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">4<\/code><\/strong>: Device file descriptions (usually in <code class=\"inline-code\">/dev<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">5<\/code><\/strong>: File formats and conventions (e.g., <code class=\"inline-code\">man 5 passwd<\/code> for <code class=\"inline-code\">/etc/passwd<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">6<\/code><\/strong>: Games.<\/li>\n<li><strong><code class=\"inline-code\">7<\/code><\/strong>: Miscellaneous (macros, conventions).<\/li>\n<li><strong><code class=\"inline-code\">8<\/code><\/strong>: System management commands (root/superuser only).<\/li>\n<li><strong><code class=\"inline-code\">9<\/code><\/strong>: Kernel routines (non-standard).<\/li>\n<li>Search man pages by keyword: <strong><code class=\"inline-code\">man -k KEYWORD<\/code><\/strong> or <code class=\"inline-code\">find /usr/share/man -iname \"<em>KEYWORD<\/em>\"<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">whatis &lt;command&gt;<\/code>:<\/strong> Pulls the <code class=\"inline-code\">NAME<\/code> section from a manual page to display a one-line summary (e.g., <code class=\"inline-code\">whatis ls<\/code> -&gt; <code class=\"inline-code\">ls (1) - list directory contents<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">help [-d|-s] &lt;builtin&gt;<\/code>:<\/strong> Displays help for Bash built-in commands (e.g., <code class=\"inline-code\">help pwd<\/code>). <code class=\"inline-code\">-d<\/code> prints a brief description; <code class=\"inline-code\">-s<\/code> prints command syntax.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Login/Session &amp; Power Management Commands<\/h3>\n<ul class=\"md-list\">\n<li><strong>Login &amp; Session Auditing:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">login<\/code><\/strong>: Logs in to the system (applicable to all users).<\/li>\n<li><strong><code class=\"inline-code\">last<\/code><\/strong>: Reads <code class=\"inline-code\">/var/log/wtmp<\/code> to display recent user/terminal logins, reboots, and shutdowns. Options: <code class=\"inline-code\">-n &lt;num&gt;<\/code> (number of records), <code class=\"inline-code\">-t tty<\/code> (specific console), <code class=\"inline-code\">-y<\/code> (display year/month/day), <code class=\"inline-code\">-x<\/code> (shutdowns/logins/logouts), <code class=\"inline-code\">-f file<\/code>, <code class=\"inline-code\">-i IP<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">exit<\/code><\/strong>: Logs out of the current shell session (no options).<\/li>\n<li><strong>Power Management (Superuser Only):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">shutdown<\/code><\/strong>: Safely shuts down or restarts the system, notifying all logged-in users and freezing <code class=\"inline-code\">login<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">-h<\/code><\/strong>: Powers off after shutdown.<\/li>\n<li><strong><code class=\"inline-code\">-r<\/code><\/strong>: Restarts after shutdown.<\/li>\n<li><strong><code class=\"inline-code\">-k<\/code><\/strong>: Sends warning messages to users <strong>without<\/strong> actually shutting down.<\/li>\n<li><strong><code class=\"inline-code\">-F<\/code><\/strong>: Forcibly runs filesystem check (<code class=\"inline-code\">fsck<\/code>) on reboot.<\/li>\n<li><strong><code class=\"inline-code\">-t &lt;sec&gt;<\/code> / <code class=\"inline-code\">-time<\/code><\/strong>: Specifies delay before shutdown.<\/li>\n<li><strong><code class=\"inline-code\">halt<\/code><\/strong>: Terminates processes, calls <code class=\"inline-code\">sync<\/code> (writes buffer data to disk), and stops the kernel. Options: <code class=\"inline-code\">-n<\/code> (do not sync system calls—used after repairing root partition with <code class=\"inline-code\">fsck<\/code> so kernel doesn't overwrite repaired superblock), <code class=\"inline-code\">-w<\/code> (only write record to <code class=\"inline-code\">/var/log/wtmp<\/code> without halting), <code class=\"inline-code\">-d<\/code> (do not write record to <code class=\"inline-code\">wtmp<\/code>), <code class=\"inline-code\">-f<\/code> (force halt without calling <code class=\"inline-code\">shutdown<\/code>), <code class=\"inline-code\">-i<\/code> (shut down network interfaces first).<\/li>\n<li><strong><code class=\"inline-code\">reboot<\/code><\/strong>: Restarts the host (<code class=\"inline-code\">-n<\/code>, <code class=\"inline-code\">-w<\/code>, <code class=\"inline-code\">-d<\/code>, <code class=\"inline-code\">-i<\/code>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Querying Manual Sections, Session Logs & Safe Shutdown","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"As the system administrator on an openEuler node, you need to look up the manual page for the `/etc/passwd` file format (Section 5), check the brief description of `ls`, inspect the last 5 login records including system shutdowns, and send a simulated shutdown warning.","instructions":["Step 1: View the manual page for the `passwd` configuration file format (Section 5) using `man 5 passwd` and query the brief description of `ls` using `whatis ls`.","Step 2: Display the last 5 login/shutdown records using `last -n 5 -x`.","Step 3: Send a simulated shutdown warning to all logged-in users without actually shutting down using `shutdown -k now`."],"starter_code":"# Step 1: View Section 5 manual for passwd and one-line summary of ls\n<man_command>\n<whatis_command>\n\n# Step 2: Check last 5 login and shutdown records\n<last_command>\n\n# Step 3: Broadcast a simulated shutdown warning without powering off\n<shutdown_warning_command>","solution_code":"# Step 1: View Section 5 manual for passwd and one-line summary of ls\nman 5 passwd\nwhatis ls\n\n# Step 2: Check last 5 login and shutdown records\nlast -n 5 -x\n\n# Step 3: Broadcast a simulated shutdown warning without powering off\nshutdown -k now","hints":["Specify the section number before the topic: `man 5 passwd`, and use `whatis ls`.","Combine `-n 5` and `-x` with the `last` command: `last -n 5 -x`.","Use the `-k` option of `shutdown` (`shutdown -k now`) to send a warning without shutting down."],"validation_checks":[{"step":1,"description":"Query Section 5 manual for passwd and run whatis ls","required_any":["man 5 passwd"],"feedback_fail":"Use 'man 5 passwd' to view the file format manual in Section 5."},{"step":2,"description":"Check recent login records using last","required_any":["last "],"feedback_fail":"Use 'last -n 5 -x' to view the last 5 login and system event records."},{"step":3,"description":"Broadcast warning only with shutdown -k","required_any":["shutdown -k"],"feedback_fail":"Use 'shutdown -k' to warn users without shutting down the server."}],"simulated_output":"PASSWD(5)                     Linux Programmer's Manual                    PASSWD(5)\nNAME\n       passwd - the password file\nls (1)               - list directory contents\n\nroot     pts/0        192.168.110.1    Tue Nov 17 09:15   still logged in\nrunlevel (to lvl 3)   6.6.0-28.0.0.34  Tue Nov 17 09:10   still running\nreboot   system boot  6.6.0-28.0.0.34  Tue Nov 17 09:10   still running\nshutdown system down  6.6.0-28.0.0.34  Tue Nov 17 09:09 - 09:10  (00:01)\n\nBroadcast message from root@openEuler (pts/0) (Tue Nov 17 09:20:00 2026):\nThe system is going down for maintenance NOW! (Warning only - shutdown cancelled)","quiz_questions":[{"id":"h2_s1_q1","type":"single","question":"On openEuler, command packages and their documentation packages are separated to streamline the OS. Which package must be additionally installed to enable the `man` command to access detailed help documentation for core utilities?","options":["A. man-pages-gui","B. coreutils-help","C. bash-doc","D. info-db"],"answer":"B","explanation":"Per Ch.03 (p.66), on openEuler, to enable the man command to access detailed help documentation, you must additionally install the `coreutils-help` package."},
