openEuler Bash shell fundamentals, script execution modes (`sh`, `./`, `nohup`), text streams, redirection (`>`, `>>`, `<`, `<< EOF`), and pipes (`|`), write scripts with variables, quoting, `read`, and arithmetic extensions (`[...]`), implement conditional branches (`if-then-fi`, `case`) and loops (`for`, `while`, `until`, `break`, `continue`), and debug scripts using `bash -x` and `?` exit codes.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Shell-Basics-Execution-Redirection-and-Pipes","exercise_slug":"02-Exercise-Script-Execution-Nohup-and-Redirection-Lab","lecture":{"title":"Shell Basics, Script Execution (`nohup`), Text Streams, Redirection & Pipes","duration_mins":7,"pdf_ref":"Ch.06, pp. 326–341","objectives":["Trace the history of Unix/Linux shells (V6 shell, sh, csh, tcsh, ksh, bash) and inspect shells via `/etc/shells`, `SHELL`, and `0`","Execute scripts via `sh script.sh`, `./script.sh` (`chmod +x`), `PATH`, and persistent background mode (`nohup ./my_script.sh &`)","Redirect standard input/output/error streams (`>`, `>>`, `<`, `<< EOF`) and chain processes with IPC pipes (`|`)"],"content_markdown":"### 1. Shell Evolution & Inspecting Shells in openEuler\nThe **Shell** is the command interpreter in user space that parses user commands, expands variables, and invokes the Linux kernel.\n* **Milestones in Shell History (Ch.06, p.327):**\n  * **1971:** **Ken Thompson** (Bell Labs) develops the first Unix shell (**V6 shell**).\n  * **1977:** **Steven Bourne** (Bell Labs) creates the **Bourne shell (`sh`)** for Unix V7.\n  * **1978:** **Bill Joy** (UC Berkeley) develops the **C shell (`csh`)** for BSD.\n  * **1983:** **Ken Greer** (CMU) develops **`tcsh`**; **David Korn** (Bell Labs) creates **KornShell (`ksh`)**.\n  * **1989:** **Brian Fox** (GNU Project) develops the **Bourne Again Shell (`bash`)**, compatible with `sh`, `csh`, and `ksh`, and the **default shell of Linux/openEuler**.\n* **Inspecting Shells (Ch.06, p.328):**\n  * View all installed shells in the system: **`cat /etc/shells`**\n  * View default shell of the current login user: **`echo SHELL`**\n  * View the currently running shell: **`echo 0`**\n<!-- PDF_FIGS_START -->\n![Shell Command Parsing, Expansion and Kernel Execution Diagram (Official Reference: p. 326)](./assets/images/p2_h7s1_shell_overview.png)\n*Figure: Shell Command Parsing, Expansion and Kernel Execution Diagram (Official Reference: p. 326)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Specifying an Interpreter (`#!`) & Running Shell Scripts\n* **Shebang (`#!`):** The first line of a script specifies the interpreter, e.g., **`#!/bin/bash`** or `#!/bin/csh`.\n* **Execution Modes:**\n  1. **`sh script_name.sh`:** Invokes the interpreter directly (does not require `x` permission on the file).\n  2. **`./script_name.sh` (or via `PATH`):** Requires execute permission (**`chmod +x script_name.sh`**). To invoke by name from any directory, add its directory to `PATH` (persist by adding `export PATH=\"PATH:/new/path\"` to `.bashrc` or `.bash_profile`).\n* **Background Execution (`&` vs. `nohup` — Ch.06, p.336):**\n  * **`./my_script.sh &`:** Runs in the background, **but stops if you exit the shell!**\n  * **`nohup ./my_script.sh &`:** Keeps the script running even after exiting the shell! Standard output and standard error are automatically redirected to **`nohup.out`**. View background jobs with **`jobs`**.\n\n---\n\n### 3. Text Streams, Redirection (`>`, `>>`, `<`, `<<`) & Pipes (`|`)\nEvery Linux process opens **three text stream interfaces**: **Standard Input (stdin)**, **Standard Output (stdout)**, and **Standard Error (stderr)**.\n* **Output Redirection:**\n  * **`ls > dir_log`:** Redirects stdout to `dir_log`, **overwriting** previous contents.\n  * **`ls >> dir_log`:** Redirects stdout to `dir_log`, **appending** to the end of the file.\n* **Input Redirection:**\n  * **`command < inputfile`:** Uses `inputfile` as standard input (e.g., `wc -l < /dev/null`).\n  * **`command << marker` (Inline Input Redirection / Here-Document):** Uses instant inline text as standard input until `marker` (commonly **`EOF`**) is encountered (`command << EOF > file`).\n* **Pipe (`|`):** Inter-Process Communication (IPC) mechanism that connects the `stdout` of `command1` directly to the `stdin` of `command2` (`ls /bin/ | grep python | less`).","key_takeaways":["Check installed shells with 'cat /etc/shells', default login shell with 'echo SHELL', and current shell with 'echo 0'.","Running './my_script.sh &' stops when the shell exits, whereas 'nohup ./my_script.sh &' keeps running after logout and redirects stdout/stderr to nohup.out.","'>' overwrites a file, '>>' appends to a file, '<' redirects file input, '<< EOF' provides inline input redirection (Here-Document), and '|' is an IPC pipe."],"exam_traps":["EXAM TRAP: Running './script.sh' on a newly created file fails with 'Permission denied' unless you first grant execute permission with 'chmod +x script.sh' (or run it via 'sh script.sh').","EXAM TRAP: In inline input redirection ('command << EOF'), the marker 'EOF' marks the start and end of standard input and is NOT included in the standard input content itself!"],"content_html":"<h3>1. Shell Evolution &amp; Inspecting Shells in openEuler<\/h3>\n<p>The <strong>Shell<\/strong> is the command interpreter in user space that parses user commands, expands variables, and invokes the Linux kernel.<\/p>\n<ul class=\"md-list\">\n<li><strong>Milestones in Shell History (Ch.06, p.327):<\/strong><\/li>\n<li><strong>1971:<\/strong> <strong>Ken Thompson<\/strong> (Bell Labs) develops the first Unix shell (<strong>V6 shell<\/strong>).<\/li>\n<li><strong>1977:<\/strong> <strong>Steven Bourne<\/strong> (Bell Labs) creates the <strong>Bourne shell (<code class=\"inline-code\">sh<\/code>)<\/strong> for Unix V7.<\/li>\n<li><strong>1978:<\/strong> <strong>Bill Joy<\/strong> (UC Berkeley) develops the <strong>C shell (<code class=\"inline-code\">csh<\/code>)<\/strong> for BSD.<\/li>\n<li><strong>1983:<\/strong> <strong>Ken Greer<\/strong> (CMU) develops <strong><code class=\"inline-code\">tcsh<\/code><\/strong>; <strong>David Korn<\/strong> (Bell Labs) creates <strong>KornShell (<code class=\"inline-code\">ksh<\/code>)<\/strong>.<\/li>\n<li><strong>1989:<\/strong> <strong>Brian Fox<\/strong> (GNU Project) develops the <strong>Bourne Again Shell (<code class=\"inline-code\">bash<\/code>)<\/strong>, compatible with <code class=\"inline-code\">sh<\/code>, <code class=\"inline-code\">csh<\/code>, and <code class=\"inline-code\">ksh<\/code>, and the <strong>default shell of Linux/openEuler<\/strong>.<\/li>\n<li><strong>Inspecting Shells (Ch.06, p.328):<\/strong><\/li>\n<li>View all installed shells in the system: <strong><code class=\"inline-code\">cat /etc/shells<\/code><\/strong><\/li>\n<li>View default shell of the current login user: <strong><code class=\"inline-code\">echo SHELL<\/code><\/strong><\/li>\n<li>View the currently running shell: <strong><code class=\"inline-code\">echo 0<\/code><\/strong><\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h7s1_shell_overview.png\" alt=\"Shell Command Parsing, Expansion and Kernel Execution Diagram\" data-caption=\"Shell Command Parsing, Expansion and Kernel Execution Diagram (Official Reference: p. 326)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Shell Command Parsing, Expansion and Kernel Execution Diagram<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 326 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Specifying an Interpreter (<code class=\"inline-code\">#!<\/code>) &amp; Running Shell Scripts<\/h3>\n<ul class=\"md-list\">\n<li><strong>Shebang (<code class=\"inline-code\">#!<\/code>):<\/strong> The first line of a script specifies the interpreter, e.g., <strong><code class=\"inline-code\">#!/bin/bash<\/code><\/strong> or <code class=\"inline-code\">#!/bin/csh<\/code>.<\/li>\n<li><strong>Execution Modes:<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">sh script_name.sh<\/code>:<\/strong> Invokes the interpreter directly (does not require <code class=\"inline-code\">x<\/code> permission on the file).<\/li>\n<li><strong><code class=\"inline-code\">./script_name.sh<\/code> (or via <code class=\"inline-code\">PATH<\/code>):<\/strong> Requires execute permission (<strong><code class=\"inline-code\">chmod +x script_name.sh<\/code><\/strong>). To invoke by name from any directory, add its directory to <code class=\"inline-code\">PATH<\/code> (persist by adding <code class=\"inline-code\">export PATH=\"PATH:/new/path\"<\/code> to <code class=\"inline-code\">.bashrc<\/code> or <code class=\"inline-code\">.bash_profile<\/code>).<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Background Execution (<code class=\"inline-code\">&amp;<\/code> vs. <code class=\"inline-code\">nohup<\/code> — Ch.06, p.336):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">./my_script.sh &amp;<\/code>:<\/strong> Runs in the background, <strong>but stops if you exit the shell!<\/strong><\/li>\n<li><strong><code class=\"inline-code\">nohup ./my_script.sh &amp;<\/code>:<\/strong> Keeps the script running even after exiting the shell! Standard output and standard error are automatically redirected to <strong><code class=\"inline-code\">nohup.out<\/code><\/strong>. View background jobs with <strong><code class=\"inline-code\">jobs<\/code><\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Text Streams, Redirection (<code class=\"inline-code\">&gt;<\/code>, <code class=\"inline-code\">&gt;&gt;<\/code>, <code class=\"inline-code\">&lt;<\/code>, <code class=\"inline-code\">&lt;&lt;<\/code>) &amp; Pipes (<code class=\"inline-code\">|<\/code>)<\/h3>\n<p>Every Linux process opens <strong>three text stream interfaces<\/strong>: <strong>Standard Input (stdin)<\/strong>, <strong>Standard Output (stdout)<\/strong>, and <strong>Standard Error (stderr)<\/strong>.<\/p>\n<ul class=\"md-list\">\n<li><strong>Output Redirection:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">ls &gt; dir_log<\/code>:<\/strong> Redirects stdout to <code class=\"inline-code\">dir_log<\/code>, <strong>overwriting<\/strong> previous contents.<\/li>\n<li><strong><code class=\"inline-code\">ls &gt;&gt; dir_log<\/code>:<\/strong> Redirects stdout to <code class=\"inline-code\">dir_log<\/code>, <strong>appending<\/strong> to the end of the file.<\/li>\n<li><strong>Input Redirection:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">command &lt; inputfile<\/code>:<\/strong> Uses <code class=\"inline-code\">inputfile<\/code> as standard input (e.g., <code class=\"inline-code\">wc -l &lt; /dev/null<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">command &lt;&lt; marker<\/code> (Inline Input Redirection / Here-Document):<\/strong> Uses instant inline text as standard input until <code class=\"inline-code\">marker<\/code> (commonly <strong><code class=\"inline-code\">EOF<\/code><\/strong>) is encountered (<code class=\"inline-code\">command &lt;&lt; EOF &gt; file<\/code>).<\/li>\n<li><strong>Pipe (<code class=\"inline-code\">|<\/code>):<\/strong> Inter-Process Communication (IPC) mechanism that connects the <code class=\"inline-code\">stdout<\/code> of <code class=\"inline-code\">command1<\/code> directly to the <code class=\"inline-code\">stdin<\/code> of <code class=\"inline-code\">command2<\/code> (<code class=\"inline-code\">ls /bin/ | grep python | less<\/code>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Shell Inspection, `chmod +x`, `nohup` Backgrounding & Redirection","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are deploying a monitoring script `my_script.sh` on openEuler. Inspect the system's available shells (`/etc/shells`) and current shell (`SHELL`), grant execute permission to `my_script.sh`, run it persistently in the background using `nohup`, and append directory listings to `dir_log`.","instructions":["Step 1: View all installed shells in `/etc/shells` (`cat /etc/shells`) and print the current user's default shell (`echo SHELL`).","Step 2: Grant execute permission to `my_script.sh` (`chmod +x my_script.sh`) and run it persistently in the background using `nohup ./my_script.sh &`.","Step 3: Append the output of `ls` to `dir_log` using `ls >> dir_log`."],"starter_code":"# Step 1: View installed shells and current user's default login shell\n<cat_shells_command>\n<echo_shell_command>\n\n# Step 2: Grant execute permission to my_script.sh and run with nohup in background\n<chmod_x_command>\n<nohup_command>\n\n# Step 3: Append ls output to dir_log\n<append_redirect_command>","solution_code":"# Step 1: View installed shells and current user's default login shell\ncat /etc/shells\necho SHELL\n\n# Step 2: Grant execute permission to my_script.sh and run with nohup in background\nchmod +x my_script.sh\nnohup ./my_script.sh &\n\n# Step 3: Append ls output to dir_log\nls >> dir_log","hints":["Use `cat /etc/shells` and `echo SHELL` (Ch.06 p.328).","Use `chmod +x my_script.sh` and `nohup ./my_script.sh &` (Ch.06 p.334, 336).","Use `ls >> dir_log` to append output (Ch.06 p.339)."],"validation_checks":[{"step":1,"description":"Inspect /etc/shells and SHELL","required_any":["cat /etc/shells"],"feedback_fail":"Include 'cat /etc/shells' and 'echo SHELL'."},{"step":2,"description":"Grant execute permission and run with nohup ./my_script.sh &","required_any":["nohup ./my_script.sh &"],"feedback_fail":"Include 'chmod +x my_script.sh' and 'nohup ./my_script.sh &'."},{"step":3,"description":"Append ls output to dir_log using >>","required_any":["ls >> dir_log"],"feedback_fail":"Use 'ls >> dir_log' to append the standard output."}],"simulated_output":"/bin/sh\n/bin/bash\n/usr/bin/sh\n/usr/bin/bash\n/bin/bash\n\n[1] 14920\nnohup: ignoring input and appending output to 'nohup.out'\n[root@openEuler ~]# cat dir_log\nmy_script.sh\nnohup.out","quiz_questions":[{"id":"h7_s1_q1","type":"single","question":"When running a long-running shell script in the background, which command ensures the script continues running even after you exit the shell, and where are its standard output and standard error redirected by default?","options":["A. `./my_script.sh &`; redirected to `/dev/null`","B. `nohup ./my_script.sh &`; redirected to `nohup.out`","C. `bg ./my_script.sh`; redirected to `/var/log/messages`","D. `jobs ./my_script.sh`; redirected to `stdout.log`"],"answer":"B","explanation":"Per Ch.06 (p.336), running `nohup ./my_script.sh &` ensures the script keeps running after you exit the shell, and redirects its standard output and standard error streams to the `nohup.out` file."},{"id":"h7_s1_q2","type":"single","question":"Who developed the Bourne Again Shell (`bash`) in 1989 for the GNU Project as a free software replacement for the Bourne shell?","options":["A. Ken Thompson","B. Bill Joy","C. Brian Fox","D. David Korn"],"answer":"C","explanation":"Per Ch.06 (p.327), in 1989, Brian Fox developed the Bourne again shell (Bash) for the open source GNU project."},{"id":"h7_s1_q3","type":"multiple","question":"Which of the following statements about shell redirection and pipes in openEuler are TRUE?","options":["A. Every Linux process has three text stream interfaces enabled when started: standard input, standard output, and standard error.","B. `ls > dir_log` overwrites the file's previous contents, whereas `ls >> dir_log` appends to the end of the file.","C. `command << marker` (such as `EOF`) performs inline input redirection, and the `marker` itself is not included in the standard input.","D. A pipe (`|`) is an inter-process communication (IPC) mechanism that connects the output of one command to the input of another."],"answer":"ABCD","explanation":"Per Ch.06 (pp.338–341), all four statements match the official Huawei training material."}],"reference_figures":[]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Shell-Variables-Quoting-and-Arithmetic","exercise_slug":"04-Exercise-Variables-Braces-and-Arithmetic-Lab","lecture":{"title":"Shell Variables, Quoting, `read` & Arithmetic Operations (`[...]`, `++i` vs. `i++`)","duration_mins":7,"pdf_ref":"Ch.06, pp. 342–353, 379","objectives":["Distinguish special characters (`#`, `'`, `\\`, `/`, `!`), environment vs. user-defined variables, and `printenv` vs. `set`","Apply strict variable assignment rules (`variable=value` — NO spaces, `name==Tom` is FALSE [Ch.06 Quiz Q2!]), single vs. double quotes, `{VAR}` brace expansion, and `read`","Evaluate integer arithmetic using `[expression]` (`*` = Multiplication [Ch.06 Quiz Q1!], operator precedence, and `++i` vs. `i++`)"],"content_markdown":"### 1. Special Characters & Variable Scopes (`printenv` vs. `set`)\n* **5 Key Shell Special Characters (Ch.06, p.343):**\n  * **`#` (Hashtag/Remarks):** Comments out lines (`#!` is shebang; `#` inside `'...'` or `\"...\"` is a literal `#`, not a comment!).\n  * **`'` (Single Quote / Full Quoting):** Preserves the **exact literal value** of every character inside; **does NOT expand variables or commands**.\n  * **`\"` (Double Quote):** **Expands variables (`VAR`) and commands** inside the quotes.\n  * **`\\` (Backslash / Escape):** Removes special meaning from the next character, or escapes a newline at the end of a line for line continuation.\n  * **`/` (Forward Slash):** Root directory / path separator, or **division** in arithmetic (`a=4/2`).\n  * **`!` (Bang / Negation):** Negates a test/exit status, `!=` (not equal), or character range negation (`ls a[!0-9]`).\n* **Variable Types & Inspection (Ch.06, p.345):**\n  * **Environment vs. User-defined**, scoped as **Global** (current shell + subshells; persisted via `export` in `.bash_profile` or `.bashrc`) or **Local**.\n  * **`printenv` (or `env`):** Views **global environment variables**.\n  * **`set`:** Built-in shell command that displays **ALL variables in a process** (local, global, user-defined, and shell functions).\n\n---\n\n### 2. Variable Naming, Assignment, Brace Expansion & `read`\n* **Naming Rules:** Consists of letters, digits, and underscores (`_`); **must start with a letter or underscore (`_`)**; cannot use shell keywords.\n* **Assignment Rule (Official Ch.06 Quiz Q2!):**\n  * Syntax: **`variable=value`** (e.g., `name=Tom`).\n  * **NO spaces are allowed on the left or right of `=`!**\n  * **Official Ch.06 Quiz Q2 Trap:** *\"An administrator can run the `name==Tom` command to assign value Tom to variable name.\"* -> **False!** (`==` is equality comparison, NOT assignment!).\n* **Brace Expansion (`${VAR}` — Ch.06, p.347):**\n  * If `FIRST=john`, `FIRST_=Jane`, and `LAST=Doe`, then `echo FIRST_LAST` outputs **`Doe`** (because bash looks up `FIRST_` + `LAST`? Wait: if `FIRST_` was unset it would output `Doe`; on Slide 27, when you want `FIRST` followed by `_` and `LAST`, you **must use braces**: **`echo ${FIRST}_LAST` -> `john_Doe`**!).\n* **`read <var>`:** Waits for user keyboard input and assigns it to `<var>`.\n\n---\n\n### 3. Arithmetic Operations (`[...]`), Precedence & `++i` vs. `i++`\n* **Syntax:** **`[expression]`** (e.g., `echo [1+1]` -> `2`, `echo [2*2]` -> `4`).\n* **Official Ch.06 Quiz Q1:** In a shell script arithmetic expression, **`*` means Multiplication**!\n* **Arithmetic Operator Precedence (Highest to Lowest — Ch.06, p.352):**\n  1. **`<VAR>++`, `<VAR>--`** (Post-increment / Post-decrement)\n  2. **`++<VAR>`, `--<VAR>`** (Pre-increment / Pre-decrement)\n  3. **`-`, `+`** (Unary minus / plus)\n  4. **`**`** (Exponentiation)\n  5. **`*`, `/`, `%`** (Multiplication, Division, Remainder)\n  6. **`+`, `-`** (Addition, Subtraction)\n* **`++i` vs. `i++` (Ch.06, p.353):**\n  * `i++` creates a temporary variable to save the old value of `i`, returns that old value, and then increments `i` by 1.\n  * `++i` directly adds 1 to `i`'s memory space and returns the new value without creating temporary space (higher performance).\n  * **Slide 33 Example:** If `i=3`, `echo [++i]` outputs **`4`** (`i` becomes 4); then `echo [i++]` outputs **`4`** (returns old value 4, while `i` becomes 5); then `echo i` outputs **`5`**!","key_takeaways":["Variable assignment is 'variable=value' with NO spaces around '='; 'name==Tom' is NOT a valid assignment (Ch.06 Quiz Q2 = False).","Single quotes ('') preserve literal characters without variable expansion, whereas double quotes (\"\") expand variables and commands; use ${FIRST}_LAST to disambiguate variable boundaries.","In a shell arithmetic expression ([...]), '*' means Multiplication (Ch.06 Quiz Q1); printenv displays global variables, whereas 'set' displays all local, global, and user-defined variables."],"exam_traps":["EXAM TRAP (Official Ch.06 Quiz Q1): 'Which of the following is the meaning of * in a shell script expression?' -> B. Multiplication!","EXAM TRAP (Official Ch.06 Quiz Q2): 'An administrator can run the name==Tom command to assign value Tom to variable name.' -> False!"],"content_html":"<h3>1. Special Characters &amp; Variable Scopes (<code class=\"inline-code\">printenv<\/code> vs. <code class=\"inline-code\">set<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong>5 Key Shell Special Characters (Ch.06, p.343):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">#<\/code> (Hashtag/Remarks):<\/strong> Comments out lines (<code class=\"inline-code\">#!<\/code> is shebang; <code class=\"inline-code\">#<\/code> inside <code class=\"inline-code\">'...'<\/code> or <code class=\"inline-code\">\"...\"<\/code> is a literal <code class=\"inline-code\">#<\/code>, not a comment!).<\/li>\n<li><strong><code class=\"inline-code\">'<\/code> (Single Quote / Full Quoting):<\/strong> Preserves the <strong>exact literal value<\/strong> of every character inside; <strong>does NOT expand variables or commands<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">\"<\/code> (Double Quote):<\/strong> <strong>Expands variables (<code class=\"inline-code\">VAR<\/code>) and commands<\/strong> inside the quotes.<\/li>\n<li><strong><code class=\"inline-code\"><\/code> (Backslash / Escape):<\/strong> Removes special meaning from the next character, or escapes a newline at the end of a line for line continuation.<\/li>\n<li><strong><code class=\"inline-code\">/<\/code> (Forward Slash):<\/strong> Root directory / path separator, or <strong>division<\/strong> in arithmetic (<code class=\"inline-code\">a=4/2<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">!<\/code> (Bang / Negation):<\/strong> Negates a test/exit status, <code class=\"inline-code\">!=<\/code> (not equal), or character range negation (<code class=\"inline-code\">ls a[!0-9]<\/code>).<\/li>\n<li><strong>Variable Types &amp; Inspection (Ch.06, p.345):<\/strong><\/li>\n<li><strong>Environment vs. User-defined<\/strong>, scoped as <strong>Global<\/strong> (current shell + subshells; persisted via <code class=\"inline-code\">export<\/code> in <code class=\"inline-code\">.bash_profile<\/code> or <code class=\"inline-code\">.bashrc<\/code>) or <strong>Local<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">printenv<\/code> (or <code class=\"inline-code\">env<\/code>):<\/strong> Views <strong>global environment variables<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">set<\/code>:<\/strong> Built-in shell command that displays <strong>ALL variables in a process<\/strong> (local, global, user-defined, and shell functions).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Variable Naming, Assignment, Brace Expansion &amp; <code class=\"inline-code\">read<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong>Naming Rules:<\/strong> Consists of letters, digits, and underscores (<code class=\"inline-code\">_<\/code>); <strong>must start with a letter or underscore (<code class=\"inline-code\">_<\/code>)<\/strong>; cannot use shell keywords.<\/li>\n<li><strong>Assignment Rule (Official Ch.06 Quiz Q2!):<\/strong><\/li>\n<li>Syntax: <strong><code class=\"inline-code\">variable=value<\/code><\/strong> (e.g., <code class=\"inline-code\">name=Tom<\/code>).<\/li>\n<li><strong>NO spaces are allowed on the left or right of <code class=\"inline-code\">=<\/code>!<\/strong><\/li>\n<li><strong>Official Ch.06 Quiz Q2 Trap:<\/strong> <em>\"An administrator can run the <code class=\"inline-code\">name==Tom<\/code> command to assign value Tom to variable name.\"<\/em> -&gt; <strong>False!<\/strong> (<code class=\"inline-code\">==<\/code> is equality comparison, NOT assignment!).<\/li>\n<li><strong>Brace Expansion (<code class=\"inline-code\">{VAR}<\/code> — Ch.06, p.347):<\/strong><\/li>\n<li>If <code class=\"inline-code\">FIRST=john<\/code>, <code class=\"inline-code\">FIRST_=Jane<\/code>, and <code class=\"inline-code\">LAST=Doe<\/code>, then <code class=\"inline-code\">echo FIRST_LAST<\/code> outputs <strong><code class=\"inline-code\">Doe<\/code><\/strong> (because bash looks up <code class=\"inline-code\">FIRST_<\/code> + <code class=\"inline-code\">LAST<\/code>? Wait: if <code class=\"inline-code\">FIRST_<\/code> was unset it would output <code class=\"inline-code\">Doe<\/code>; on Slide 27, when you want <code class=\"inline-code\">FIRST<\/code> followed by <code class=\"inline-code\">_<\/code> and <code class=\"inline-code\">LAST<\/code>, you <strong>must use braces<\/strong>: <strong><code class=\"inline-code\">echo ${FIRST}_LAST<\/code> -&gt; <code class=\"inline-code\">john_Doe<\/code><\/strong>!).<\/li>\n<li><strong><code class=\"inline-code\">read &lt;var&gt;<\/code>:<\/strong> Waits for user keyboard input and assigns it to <code class=\"inline-code\">&lt;var&gt;<\/code>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Arithmetic Operations (<code class=\"inline-code\">[...]<\/code>), Precedence &amp; <code class=\"inline-code\">++i<\/code> vs. <code class=\"inline-code\">i++<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong>Syntax:<\/strong> <strong><code class=\"inline-code\">[expression]<\/code><\/strong> (e.g., <code class=\"inline-code\">echo [1+1]<\/code> -&gt; <code class=\"inline-code\">2<\/code>, <code class=\"inline-code\">echo [2*2]<\/code> -&gt; <code class=\"inline-code\">4<\/code>).<\/li>\n<li><strong>Official Ch.06 Quiz Q1:<\/strong> In a shell script arithmetic expression, **<code class=\"inline-code\">*<\/code> means Multiplication**!<\/li>\n<li><strong>Arithmetic Operator Precedence (Highest to Lowest — Ch.06, p.352):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">&lt;VAR&gt;++<\/code>, <code class=\"inline-code\">&lt;VAR&gt;--<\/code><\/strong> (Post-increment / Post-decrement)<\/li>\n<li><strong><code class=\"inline-code\">++&lt;VAR&gt;<\/code>, <code class=\"inline-code\">--&lt;VAR&gt;<\/code><\/strong> (Pre-increment / Pre-decrement)<\/li>\n<li><strong><code class=\"inline-code\">-<\/code>, <code class=\"inline-code\">+<\/code><\/strong> (Unary minus / plus)<\/li>\n<li><strong><code class=\"inline-code\"><\/strong><\/code>** (Exponentiation)<\/li>\n<li>**<code class=\"inline-code\">*<\/code>, <code class=\"inline-code\">/<\/code>, <code class=\"inline-code\">%<\/code>** (Multiplication, Division, Remainder)<\/li>\n<li><strong><code class=\"inline-code\">+<\/code>, <code class=\"inline-code\">-<\/code><\/strong> (Addition, Subtraction)<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">++i<\/code> vs. <code class=\"inline-code\">i++<\/code> (Ch.06, p.353):<\/strong><\/li>\n<li><code class=\"inline-code\">i++<\/code> creates a temporary variable to save the old value of <code class=\"inline-code\">i<\/code>, returns that old value, and then increments <code class=\"inline-code\">i<\/code> by 1.<\/li>\n<li><code class=\"inline-code\">++i<\/code> directly adds 1 to <code class=\"inline-code\">i<\/code>'s memory space and returns the new value without creating temporary space (higher performance).<\/li>\n<li><strong>Slide 33 Example:<\/strong> If <code class=\"inline-code\">i=3<\/code>, <code class=\"inline-code\">echo [++i]<\/code> outputs <strong><code class=\"inline-code\">4<\/code><\/strong> (<code class=\"inline-code\">i<\/code> becomes 4); then <code class=\"inline-code\">echo [i++]<\/code> outputs <strong><code class=\"inline-code\">4<\/code><\/strong> (returns old value 4, while <code class=\"inline-code\">i<\/code> becomes 5); then <code class=\"inline-code\">echo i<\/code> outputs <strong><code class=\"inline-code\">5<\/code><\/strong>!<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Variable Brace Expansion (`${FIRST}_LAST`) & Shell Arithmetic (`[...]`) Time Calculation","duration_mins":8,"exercise_type":"script","prompt_label":"root@openEuler:~#","scenario":"Complete the official openEuler shell script exercises from Ch.06 (pp. 347–350): use `${FIRST}_LAST` to output `john_Doe`, and calculate the number of seconds in a day (`86400`) using `[ SEC_PER_MIN * MIN_PER_HR * HR_PER_DAY ]`.","instructions":["Step 1: Assign `FIRST=john` and `LAST=Doe` (no spaces around `=`), and echo `{FIRST}_LAST`.","Step 2: Define `SEC_PER_MIN=60`, `MIN_PER_HR=60`, and `HR_PER_DAY=24`.","Step 3: Compute `SEC_PER_DAY=[ SEC_PER_MIN * MIN_PER_HR * HR_PER_DAY ]` and echo the result."],"starter_code":"#!/bin/bash\n# Step 1: Assign FIRST=john, LAST=Doe and print john_Doe using brace expansion\nFIRST=john\nLAST=Doe\necho <brace_expansion>\n\n# Step 2 & 3: Calculate seconds per day using [ ... ]\nSEC_PER_MIN=60\nMIN_PER_HR=60\nHR_PER_DAY=24\nSEC_PER_DAY=<arithmetic_expression>\necho \"There are SEC_PER_DAY seconds in a day\"","solution_code":"#!/bin/bash\n# Step 1: Assign FIRST=john, LAST=Doe and print john_Doe using brace expansion\nFIRST=john\nLAST=Doe\necho {FIRST}_LAST\n\n# Step 2 & 3: Calculate seconds per day using [ ... ]\nSEC_PER_MIN=60\nMIN_PER_HR=60\nHR_PER_DAY=24\nSEC_PER_DAY=[ SEC_PER_MIN * MIN_PER_HR * HR_PER_DAY ]\necho \"There are SEC_PER_DAY seconds in a day\"","hints":["Use `echo {FIRST}_LAST` (Ch.06 p.347).","Use `SEC_PER_DAY=[ SEC_PER_MIN * MIN_PER_HR * HR_PER_DAY ]` (Ch.06 p.350).","Remember `*` is the multiplication operator in shell expressions."],"validation_checks":[{"step":1,"description":"Use brace expansion {FIRST}_LAST","required_any":["{first}_last","{first}_${last}"],"feedback_fail":"Use 'echo ${FIRST}_LAST' so bash expands FIRST separately from the underscore."},{"step":2,"description":"Define time unit variables without spaces around =","required_any":["sec_per_min=60"],"feedback_fail":"Keep 'SEC_PER_MIN=60', 'MIN_PER_HR=60', and 'HR_PER_DAY=24'."},{"step":3,"description":"Calculate SEC_PER_DAY using [ ... ] and *","required_any":["sec_per_day=[","sec_per_day=(("],"feedback_fail":"Use 'SEC_PER_DAY=[ SEC_PER_MIN * MIN_PER_HR * HR_PER_DAY ]'."}],"simulated_output":"john_Doe\nThere are 86400 seconds in a day","quiz_questions":[{"id":"h7_s2_q1","type":"single","question":"[Official Ch.06 Quiz Q1] Which of the following is the meaning of `*` in a shell script expression?","options":["A. Summation","B. Multiplication","C. Subtraction","D. Division"],"answer":"B","explanation":"Official Ch.06 Quiz Q1 (p.379): B (Multiplication). In shell arithmetic expressions (p.351), `*` denotes multiplication and `**` denotes exponentiation."},{"id":"h7_s2_q2","type":"tf","question":"[Official Ch.06 Quiz Q2] An administrator can run the `name==Tom` command to assign value Tom to variable name.","options":["A. True","B. False"],"answer":"B","explanation":"Official Ch.06 Quiz Q2 (p.379): False. Variable assignment in the shell uses a single equals sign with no spaces (`name=Tom`), not `==`."},{"id":"h7_s2_q3","type":"multiple","question":"Which of the following statements about shell variables, quoting, and increments in openEuler are TRUE?","options":["A. `printenv` views global environment variables, while `set` views all variables (local, global, user-defined) and functions in the process.","B. Single quotes (`'`) preserve literal characters without expanding variables, whereas double quotes (`\"`) expand variables and commands.","C. A shell variable name must start with a letter or underscore (`_`) and cannot contain spaces around `=` during assignment.","D. If `i=3`, running `echo [++i]` outputs `4`, and then running `echo [i++]` also outputs `4` (leaving `i` equal to `5`)."],"answer":"ABCD","explanation":"Per Ch.06 (pp.345–353), all four statements are directly from the official Huawei training slides."}],"reference_figures":[]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Shell-Conditional-Statements-if-and-case","exercise_slug":"06-Exercise-If-Then-and-Case-Branching-Lab","lecture":{"title":"Shell Conditional Statements (`if-then-elif-else-fi` and `case-in-esac`)","duration_mins":7,"pdf_ref":"Ch.06, pp. 354–357","objectives":["Explain how Bash `if` evaluates command exit status codes (`0` = True/Success, non-zero = False)","Write `if-then-fi`, `if-then-else-fi`, and `elif` conditional blocks using numeric, string, and file tests","Construct multi-branch `case ... in ... esac` statements using `|` pattern alternation, `;;` terminators, and `*` default wildcards"],"content_markdown":"### 1. How `if-then-fi` Works in Bash (Exit Status Code `0`)\nUnlike C or Java (where `if` evaluates a boolean `true`/`false` expression), **the Bash `if` statement executes the command following `if` and checks its exit status code (`?`)**:\n* **If the exit status code is `0` (Success):** Bash executes the commands inside the **`then`** block!\n* **If the exit status code is non-zero (Failure):** Bash skips the `then` block (and evaluates `elif` / `else`, or moves to the next statement after `fi`).\n\n```bash\nif command\nthen\n    commands\nfi\n```\n* **Common Test Conditions (`[ ... ]` / `test` / `(( ... ))`):**\n  * **Numeric comparisons:** `-eq` (equal), `-ne` (not equal), `-gt` (greater than), `-ge` (greater or equal), `-lt` (less than), `-le` (less or equal), or C-style `(( i % 5 == 0 ))`.\n  * **String comparisons:** `=` / `==` (equal), `!=` (not equal), `-z` (empty string), `-n` (non-empty string).\n  * **File checks:** `-e` (exists), `-f` (regular file), `-d` (directory), `-r` (readable), `-w` (writable), `-x` (executable).\n\n---\n\n### 2. Multi-Branch Judgment with `case ... in ... esac`\nWhen checking a single variable against multiple distinct values/patterns, a **`case`** statement is cleaner and more readable than deeply nested `if-then-elif-else` blocks (Ch.06, p.357):\n\n```bash\ncase variable in\npattern1 | pattern2)\n    commands1\n    ;;\npattern3)\n    commands2\n    ;;\n*)\n    default commands\n    ;;\nesac\n```\n\n---\n\n### 3. Key Syntax Rules for `case` Statements\n* **Opening & Closing Keywords:** Starts with **`case variable in`** and closes with **`esac`** (`case` spelled backwards!).\n* **Pattern Alternation (`|`):** Multiple patterns sharing the same branch are separated by a **vertical bar (`|`)**, followed by a closing parenthesis **`)`**.\n* **Branch Terminator (`;;`):** Every pattern branch (except optionally the last) must end with a **double semicolon (`;;`)**.\n* **Default Catch-All (`*)`):** The asterisk **`*)`** matches **all values that do not match the known patterns** (equivalent to `default:` in C/Java).","key_takeaways":["In a Bash 'if command; then ... fi' statement, the 'then' block executes ONLY when the command following 'if' returns an exit status code of 0!","A multi-branch 'case' statement starts with 'case var in' and ends with 'esac'.","In 'case', multiple patterns are separated by '|', each branch ends with ';;', and '*)' serves as the default catch-all branch."],"exam_traps":["EXAM TRAP: In C/Python, 0 is False and 1 is True; in Bash 'if command', exit status code 0 means SUCCESS (True, executes 'then'), while any non-zero exit code (1–255) means FAILURE (False)!","EXAM TRAP: Do not forget ';;' at the end of each pattern block and 'esac' at the end of a 'case' statement."],"content_html":"<h3>1. How <code class=\"inline-code\">if-then-fi<\/code> Works in Bash (Exit Status Code <code class=\"inline-code\">0<\/code>)<\/h3>\n<p>Unlike C or Java (where <code class=\"inline-code\">if<\/code> evaluates a boolean <code class=\"inline-code\">true<\/code>/<code class=\"inline-code\">false<\/code> expression), <strong>the Bash <code class=\"inline-code\">if<\/code> statement executes the command following <code class=\"inline-code\">if<\/code> and checks its exit status code (<code class=\"inline-code\">?<\/code>)<\/strong>:<\/p>\n<ul class=\"md-list\">\n<li><strong>If the exit status code is <code class=\"inline-code\">0<\/code> (Success):<\/strong> Bash executes the commands inside the <strong><code class=\"inline-code\">then<\/code><\/strong> block!<\/li>\n<li><strong>If the exit status code is non-zero (Failure):<\/strong> Bash skips the <code class=\"inline-code\">then<\/code> block (and evaluates <code class=\"inline-code\">elif<\/code> / <code class=\"inline-code\">else<\/code>, or moves to the next statement after <code class=\"inline-code\">fi<\/code>).<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>if command\nthen\n    commands\nfi<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Common Test Conditions (<code class=\"inline-code\">[ ... ]<\/code> / <code class=\"inline-code\">test<\/code> / <code class=\"inline-code\">(( ... ))<\/code>):<\/strong><\/li>\n<li><strong>Numeric comparisons:<\/strong> <code class=\"inline-code\">-eq<\/code> (equal), <code class=\"inline-code\">-ne<\/code> (not equal), <code class=\"inline-code\">-gt<\/code> (greater than), <code class=\"inline-code\">-ge<\/code> (greater or equal), <code class=\"inline-code\">-lt<\/code> (less than), <code class=\"inline-code\">-le<\/code> (less or equal), or C-style <code class=\"inline-code\">(( i % 5 == 0 ))<\/code>.<\/li>\n<li><strong>String comparisons:<\/strong> <code class=\"inline-code\">=<\/code> / <code class=\"inline-code\">==<\/code> (equal), <code class=\"inline-code\">!=<\/code> (not equal), <code class=\"inline-code\">-z<\/code> (empty string), <code class=\"inline-code\">-n<\/code> (non-empty string).<\/li>\n<li><strong>File checks:<\/strong> <code class=\"inline-code\">-e<\/code> (exists), <code class=\"inline-code\">-f<\/code> (regular file), <code class=\"inline-code\">-d<\/code> (directory), <code class=\"inline-code\">-r<\/code> (readable), <code class=\"inline-code\">-w<\/code> (writable), <code class=\"inline-code\">-x<\/code> (executable).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Multi-Branch Judgment with <code class=\"inline-code\">case ... in ... esac<\/code><\/h3>\n<p>When checking a single variable against multiple distinct values/patterns, a <strong><code class=\"inline-code\">case<\/code><\/strong> statement is cleaner and more readable than deeply nested <code class=\"inline-code\">if-then-elif-else<\/code> blocks (Ch.06, p.357):<\/p>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>case variable in\npattern1 | pattern2)\n    commands1\n    ;;\npattern3)\n    commands2\n    ;;\n*)\n    default commands\n    ;;\nesac<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>3. Key Syntax Rules for <code class=\"inline-code\">case<\/code> Statements<\/h3>\n<ul class=\"md-list\">\n<li><strong>Opening &amp; Closing Keywords:<\/strong> Starts with <strong><code class=\"inline-code\">case variable in<\/code><\/strong> and closes with <strong><code class=\"inline-code\">esac<\/code><\/strong> (<code class=\"inline-code\">case<\/code> spelled backwards!).<\/li>\n<li><strong>Pattern Alternation (<code class=\"inline-code\">|<\/code>):<\/strong> Multiple patterns sharing the same branch are separated by a <strong>vertical bar (<code class=\"inline-code\">|<\/code>)<\/strong>, followed by a closing parenthesis <strong><code class=\"inline-code\">)<\/code><\/strong>.<\/li>\n<li><strong>Branch Terminator (<code class=\"inline-code\">;;<\/code>):<\/strong> Every pattern branch (except optionally the last) must end with a <strong>double semicolon (<code class=\"inline-code\">;;<\/code>)<\/strong>.<\/li>\n<li>**Default Catch-All (<code class=\"inline-code\"><em>)<\/code>):<strong> The asterisk <\/strong><code class=\"inline-code\"><\/em>)<\/code><strong> matches <\/strong>all values that do not match the known patterns** (equivalent to <code class=\"inline-code\">default:<\/code> in C/Java).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Writing `if-then-fi` and Multi-Branch `case ... in ... esac` Scripts","duration_mins":8,"exercise_type":"script","prompt_label":"root@openEuler:~#","scenario":"You are writing a service controller script on openEuler. Use an `if` statement to check whether `/etc/hosts` exists (`ls /etc/hosts`), and use a `case` statement on `ACTION` to handle `start|run`, `stop`, and default `*` branches.","instructions":["Step 1: Complete the `if` statement that checks `ls /etc/hosts` and closes with `fi`.","Step 2: Complete the `case ACTION in` statement using `start | run)` for the first branch and `;;` to terminate branches.","Step 3: Use `*)` for the default branch and close the `case` block with `esac`."],"starter_code":"#!/bin/bash\n# Step 1: Check if /etc/hosts exists using if-then-fi\nif ls /etc/hosts\nthen\n    echo \"/etc/hosts is present\"\n<close_if>\n\n# Step 2 & 3: Multi-branch case statement\nACTION=\"start\"\ncase ACTION in\n<start_or_run_pattern>)\n    echo \"Starting service...\"\n    ;;\nstop)\n    echo \"Stopping service...\"\n    ;;\n<default_pattern>)\n    echo \"Usage: start|stop\"\n    ;;\n<close_case>","solution_code":"#!/bin/bash\n# Step 1: Check if /etc/hosts exists using if-then-fi\nif ls /etc/hosts\nthen\n    echo \"/etc/hosts is present\"\nfi\n\n# Step 2 & 3: Multi-branch case statement\nACTION=\"start\"\ncase ACTION in\nstart | run)\n    echo \"Starting service...\"\n    ;;\nstop)\n    echo \"Stopping service...\"\n    ;;\n*)\n    echo \"Usage: start|stop\"\n    ;;\nesac","hints":["Close an `if` statement with `fi`.","Separate multiple patterns in `case` with a vertical bar: `start | run)`.","Use `*)` for the default pattern and close `case` with `esac`."],"validation_checks":[{"step":1,"description":"Close if statement with fi","required_any":["fi"],"feedback_fail":"Close the 'if' block with 'fi'."},{"step":2,"description":"Use | to combine start and run patterns in case","required_any":["start | run)","start|run)"],"feedback_fail":"Use 'start | run)' to match either start or run."},{"step":3,"description":"Use *) for default branch and esac to close case","required_any":["esac"],"feedback_fail":"Include '*)' for the default branch and 'esac' to close the case statement."}],"simulated_output":"/etc/hosts\n/etc/hosts is present\nStarting service...","quiz_questions":[{"id":"h7_s3_q1","type":"single","question":"In a Bash `if command; then commands; fi` structure, under what condition does the Bash shell execute the commands inside the `then` block?","options":["A. When the command following `if` returns an exit status code of `1`","B. When the command following `if` returns an exit status code of `0`","C. When the command following `if` outputs a non-empty error message to stderr","D. Only when `esac` is specified"],"answer":"B","explanation":"Per Ch.06 (p.356), the Bash shell executes the command following `if` first. If the exit status code is `0`, the Bash shell continues to execute the commands in `then`."},{"id":"h7_s3_q2","type":"single","question":"In a shell `case` statement, which symbol separates multiple patterns in the same branch, and which symbol represents the default catch-all branch?","options":["A. `,` (comma) and `default:`","B. `|` (vertical bar) and `*)`","C. `&&` (double ampersand) and `?)`","D. `;` (semicolon) and `#)`"],"answer":"B","explanation":"Per Ch.06 (p.357), in a `case` statement, multiple patterns can be separated by vertical bars (`|`), and the asterisk (`*`) indicates all values that do not match the known patterns."},{"id":"h7_s3_q3","type":"multiple","question":"Which of the following keywords are used to close an `if` statement and a `case` statement in Bash respectively?","options":["A. `fi` closes an `if` statement","B. `esac` closes a `case` statement","C. `done` closes a `case` statement","D. `endif` closes an `if` statement"],"answer":"AB","explanation":"Per Ch.06 (pp.356–357), `if` closes with `fi` and `case` closes with `esac` (`do` loops close with `done`)."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Shell-Loops-Debugging-and-Best-Practices","exercise_slug":"08-Exercise-Odd-Accumulator-and-Bash-Debug-Lab","lecture":{"title":"Loop Statements (`for`, `while`, `until`), `break`/`continue`, Debugging (`bash -x`) & Best Practices","duration_mins":7,"pdf_ref":"Ch.06, pp. 358–380","objectives":["Write `for` (shell-style & C-style), `while`, and `until` loops, including the official Odd Accumulator (`{1..100..2}`) and 9×9 Multiplication Table scripts","Control loop execution with `break` (exit entire loop) and `continue` (skip current round to next iteration)","Debug shell scripts using `#!/bin/bash -x` / `bash -x`, evaluate `?` exit status codes (`0` vs. `2` for missing file in `ls`), and apply shell coding style best practices"],"content_markdown":"### 1. Loop Statements: `for`, `while`, and `until`\nBash provides three loop constructs (**`for`**, **`while`**, **`until`**), all using **`do ... done`** for the loop body, plus **`break`** and **`continue`**:\n\n| Loop / Control | Syntax & Official Examples (Ch.06, pp. 359–367) |\n| :--- | :--- |\n| **`for` (Shell style)** | `for var in list; do commands; done`<br>• List forms: `host1 host2 host3`, brace range **`host{1..3}`**, step range **`{1..100..2}`**, command substitution **`$(seq 2 2 8)`** or **`$(ls)`**. |\n| **`for` (C style)** | `for (( i = 1; i <= 9; i++ )); do ... done` (used in the 9×9 Multiplication Table script). |\n| **`while` Loop** | Pre-test loop that repeats **while the condition is TRUE**:<br>`sum=0; i=1; while (( i <= 100 )); do let \"sum+=i\"; let \"i += 2\"; done` |\n| **`until` Loop** | Repeats **until the exit condition becomes TRUE** (runs while condition is FALSE):<br>`sum=0; i=1; until (( i > 100 )); do let \"sum+=i\"; let \"i += 2\"; done` |\n| **`break` vs. `continue`** | • **`break`**: Immediately **interrupts and exits the entire loop** (e.g., find first number divisible by 5: `if (( i % 5 == 0 )); then break; fi`).<br>• **`continue`**: **Skips the rest of the current iteration** and starts the next round of the loop (e.g., skip numbers divisible by 3: `if (( i % 3 == 0 )); then continue; fi`). |\n\n* **Official Odd Accumulator Script (`1 + 3 + 5 + ... + 99 = 2500` — Ch.06, p.361):**\n  ```bash\n  #!/bin/bash\n  sum=0\n  for i in {1..100..2}\n  do\n      let \"sum+=i\"\n  done\n  echo \"sum=sum\"\n  ```\n\n---\n\n### 2. Debugging Mode (`-x`) & Exit Status Codes (`?`)\n* **Activating Bash Debugging Mode (2 Ways — Ch.06, pp. 370–371):**\n  1. Add **`-x`** to the shebang line inside the script: **`#!/bin/bash -x`**\n  2. Invoke `bash` with **`-x`** from the CLI: **`bash -x adder.sh`**\n  * *Effect:* Prints each command and expanded variable values in real time (prefixed with `+`) before executing it!\n* **Evaluating Exit Status Codes (`?` — Ch.06, pp. 372–373):**\n  * Every command returns an exit code stored in **`?`**.\n  * **`0`** indicates success (`ls /etc/hosts` -> `echo ?` outputs **`0`**).\n  * Non-zero indicates an error (`ls /etc/nofile` -> `echo ?` outputs **`2`**).\n  * Use **`exit <N>`** (e.g., `exit 1`) inside a script to terminate immediately and return exit code `<N>` to the caller.\n\n---\n\n### 3. Shell Coding Style Best Practices (Ch.06, pp. 374–376)\n* Break long one-liners into readable multi-line steps using descriptive intermediate variables (`PACKAGETYPE=kernel`, `INSTALLEPOCH=...`, `INSTALLDATETIME=...`).\n* Align `if/fi` and `do/done`, indent nested blocks, add comments (`#`), and use blank lines to separate logical sections.","key_takeaways":["while (( i <= 100 )) loops while the condition is true; until (( i > 100 )) loops until the condition becomes true.","break exits the entire loop immediately, whereas continue skips only the current iteration and proceeds to the next loop round.","Enable script trace debugging with '#!/bin/bash -x' or 'bash -x script.sh'; check the previous command's exit status code with 'echo ?' (0 = success)."],"exam_traps":["EXAM TRAP: Do not confuse 'while' and 'until' conditions! For the Odd Accumulator (1 to 100), 'while' uses 'while (( i <= 100 ))', whereas 'until' uses the opposite termination condition 'until (( i > 100 ))'!","EXAM TRAP: When 'ls' fails because a file does not exist ('ls /etc/nofile'), 'echo ?' outputs 2 (Ch.06 p.372)."],"content_html":"<h3>1. Loop Statements: <code class=\"inline-code\">for<\/code>, <code class=\"inline-code\">while<\/code>, and <code class=\"inline-code\">until<\/code><\/h3>\n<p>Bash provides three loop constructs (<strong><code class=\"inline-code\">for<\/code><\/strong>, <strong><code class=\"inline-code\">while<\/code><\/strong>, <strong><code class=\"inline-code\">until<\/code><\/strong>), all using <strong><code class=\"inline-code\">do ... done<\/code><\/strong> for the loop body, plus <strong><code class=\"inline-code\">break<\/code><\/strong> and <strong><code class=\"inline-code\">continue<\/code><\/strong>:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Loop / Control<\/th><th>Syntax &amp; Official Examples (Ch.06, pp. 359–367)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">for<\/code> (Shell style)<\/strong><\/td><td><code class=\"inline-code\">for var in list; do commands; done<\/code>&lt;br&gt;• List forms: <code class=\"inline-code\">host1 host2 host3<\/code>, brace range <strong><code class=\"inline-code\">host{1..3}<\/code><\/strong>, step range <strong><code class=\"inline-code\">{1..100..2}<\/code><\/strong>, command substitution <strong><code class=\"inline-code\">$(seq 2 2 8)<\/code><\/strong> or <strong><code class=\"inline-code\">$(ls)<\/code><\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">for<\/code> (C style)<\/strong><\/td><td><code class=\"inline-code\">for (( i = 1; i &lt;= 9; i++ )); do ... done<\/code> (used in the 9×9 Multiplication Table script).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">while<\/code> Loop<\/strong><\/td><td>Pre-test loop that repeats <strong>while the condition is TRUE<\/strong>:&lt;br&gt;<code class=\"inline-code\">sum=0; i=1; while (( i &lt;= 100 )); do let \"sum+=i\"; let \"i += 2\"; done<\/code><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">until<\/code> Loop<\/strong><\/td><td>Repeats <strong>until the exit condition becomes TRUE<\/strong> (runs while condition is FALSE):&lt;br&gt;<code class=\"inline-code\">sum=0; i=1; until (( i &gt; 100 )); do let \"sum+=i\"; let \"i += 2\"; done<\/code><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">break<\/code> vs. <code class=\"inline-code\">continue<\/code><\/strong><\/td><td>• <strong><code class=\"inline-code\">break<\/code><\/strong>: Immediately <strong>interrupts and exits the entire loop<\/strong> (e.g., find first number divisible by 5: <code class=\"inline-code\">if (( i % 5 == 0 )); then break; fi<\/code>).&lt;br&gt;• <strong><code class=\"inline-code\">continue<\/code><\/strong>: <strong>Skips the rest of the current iteration<\/strong> and starts the next round of the loop (e.g., skip numbers divisible by 3: <code class=\"inline-code\">if (( i % 3 == 0 )); then continue; fi<\/code>).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>Official Odd Accumulator Script (<code class=\"inline-code\">1 + 3 + 5 + ... + 99 = 2500<\/code> — Ch.06, p.361):<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  #!/bin/bash\n  sum=0\n  for i in {1..100..2}\n  do\n      let \"sum+=i\"\n  done\n  echo \"sum=sum\"<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Debugging Mode (<code class=\"inline-code\">-x<\/code>) &amp; Exit Status Codes (<code class=\"inline-code\">?<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Activating Bash Debugging Mode (2 Ways — Ch.06, pp. 370–371):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Add <strong><code class=\"inline-code\">-x<\/code><\/strong> to the shebang line inside the script: <strong><code class=\"inline-code\">#!/bin/bash -x<\/code><\/strong><\/li>\n<li>Invoke <code class=\"inline-code\">bash<\/code> with <strong><code class=\"inline-code\">-x<\/code><\/strong> from the CLI: <strong><code class=\"inline-code\">bash -x adder.sh<\/code><\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><em>Effect:<\/em> Prints each command and expanded variable values in real time (prefixed with <code class=\"inline-code\">+<\/code>) before executing it!<\/li>\n<li><strong>Evaluating Exit Status Codes (<code class=\"inline-code\">?<\/code> — Ch.06, pp. 372–373):<\/strong><\/li>\n<li>Every command returns an exit code stored in <strong><code class=\"inline-code\">?<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">0<\/code><\/strong> indicates success (<code class=\"inline-code\">ls /etc/hosts<\/code> -&gt; <code class=\"inline-code\">echo ?<\/code> outputs <strong><code class=\"inline-code\">0<\/code><\/strong>).<\/li>\n<li>Non-zero indicates an error (<code class=\"inline-code\">ls /etc/nofile<\/code> -&gt; <code class=\"inline-code\">echo ?<\/code> outputs <strong><code class=\"inline-code\">2<\/code><\/strong>).<\/li>\n<li>Use <strong><code class=\"inline-code\">exit &lt;N&gt;<\/code><\/strong> (e.g., <code class=\"inline-code\">exit 1<\/code>) inside a script to terminate immediately and return exit code <code class=\"inline-code\">&lt;N&gt;<\/code> to the caller.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Shell Coding Style Best Practices (Ch.06, pp. 374–376)<\/h3>\n<ul class=\"md-list\">\n<li>Break long one-liners into readable multi-line steps using descriptive intermediate variables (<code class=\"inline-code\">PACKAGETYPE=kernel<\/code>, <code class=\"inline-code\">INSTALLEPOCH=...<\/code>, <code class=\"inline-code\">INSTALLDATETIME=...<\/code>).<\/li>\n<li>Align <code class=\"inline-code\">if/fi<\/code> and <code class=\"inline-code\">do/done<\/code>, indent nested blocks, add comments (<code class=\"inline-code\">#<\/code>), and use blank lines to separate logical sections.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Odd Accumulator Script (`{1..100..2}`), `bash -x` Debugging & `?` Exit Code Check","duration_mins":8,"exercise_type":"script","prompt_label":"root@openEuler:~#","scenario":"Implement the official Odd Accumulator script (`adder.sh`) from Ch.06 (p.361) using `for i in {1..100..2}` and `let \"sum+=i\"`, run it in debug trace mode using `bash -x adder.sh`, and print the exit status code using `echo ?`.","instructions":["Step 1: Complete the `for i in {1..100..2}` loop and accumulate odd numbers using `let \"sum+=i\"`.","Step 2: Execute `adder.sh` in Bash debugging mode using `bash -x adder.sh`.","Step 3: Print the exit status code of the last executed command using `echo ?`."],"starter_code":"#!/bin/bash\n# Step 1: Odd Accumulator from 1 to 100\nsum=0\nfor i in <odd_brace_range>\ndo\n    let \"sum+=i\"\ndone\necho \"sum=sum\"\n\n# Step 2: Run adder.sh in debugging mode\n<bash_debug_command>\n\n# Step 3: Check exit status code\n<echo_exit_code_command>","solution_code":"#!/bin/bash\n# Step 1: Odd Accumulator from 1 to 100\nsum=0\nfor i in {1..100..2}\ndo\n    let \"sum+=i\"\ndone\necho \"sum=sum\"\n\n# Step 2: Run adder.sh in debugging mode\nbash -x adder.sh\n\n# Step 3: Check exit status code\necho ?","hints":["Use `{1..100..2}` for odd numbers from 1 to 100 (Ch.06 p.361).","Use `bash -x adder.sh` to run in debug mode (Ch.06 p.371).","Use `echo ?` to check the exit code (Ch.06 p.372)."],"validation_checks":[{"step":1,"description":"Iterate odd numbers with {1..100..2} and let sum+=i","required_any":["{1..100..2}"],"feedback_fail":"Use 'for i in {1..100..2}' to iterate over odd numbers from 1 to 100."},{"step":2,"description":"Run script in debug mode with bash -x","required_any":["bash -x adder.sh"],"feedback_fail":"Use 'bash -x adder.sh' to debug the script."},{"step":3,"description":"Print exit status code with echo ?","required_any":["echo ?"],"feedback_fail":"Use 'echo ?' to print the exit status code."}],"simulated_output":"+ sum=0\n+ for i in {1..100..2}\n+ let sum+=i\n...\n+ echo sum=2500\nsum=2500\n0","quiz_questions":[{"id":"h7_s4_q1","type":"single","question":"In a Bash loop, what is the difference between the `break` statement and the `continue` statement?","options":["A. `break` skips the current round and enters the next round; `continue` exits the entire loop.","B. `break` interrupts and exits the entire loop; `continue` skips the current loop round and enters the next round.","C. `break` exits the operating system; `continue` restarts the script from line 1.","D. Both `break` and `continue` terminate the shell process."],"answer":"B","explanation":"Per Ch.06 (pp.363–364), `break` is used to interrupt and exit the entire loop when a condition is met, whereas `continue` is used to skip the current loop round and enter the next round."},{"id":"h7_s4_q2","type":"single","question":"Which option can be added to `#!/bin/bash` or the `bash` CLI command to activate script debugging mode (printing each command and expanded variables before execution), and which variable stores the exit status code of the last command?","options":["A. `-v` and `0`","B. `-x` and `?`","C. `-d` and `$`","D. `-e` and `!`"],"answer":"B","explanation":"Per Ch.06 (pp.370–372), adding `-x` (`#!/bin/bash -x` or `bash -x script.sh`) activates debugging mode, and `echo ?` retrieves the exit status code of the previous command."},{"id":"h7_s4_q3","type":"multiple","question":"Which of the following shell loop headers correctly iterate over even or odd number sequences in openEuler Bash?","options":["A. `for i in {1..100..2}; do ... done` (odd numbers from 1 to 99)","B. `for EVEN in (seq 2 2 8); do ... done` (even numbers 2, 4, 6, 8)","C. `while (( i <= 100 )); do ... done` (pre-test while loop)","D. `until (( i > 100 )); do ... done` (until loop that exits when `i > 100`)"],"answer":"ABCD","explanation":"Per Ch.06 (pp.360–366), all four loop syntaxes are official examples in the Huawei HCIA-openEuler V2.0 training material."}],"reference_figures":[]}}]},{"hour_number":8,"folder_name":"Hour-08-openEuler-Native-Container-Engine-iSula","title":"openEuler Native Container Engine iSula (iSulad)","chapter_ref":"Chapter 07 (pp. 382–441)","duration_mins":60,"overview":"Master Linux container kernel primitives (6 Namespaces for resource isolation and `cgroups` for resource limitation), explore the C/C++ architecture and performance advantages of openEuler's native `iSula` (`iSulad`) engine, install/configure `iSulad` and run container lifecycle commands across all 4 container states (`Created`, `Up`, `Paused`, `Exited`), configure CNI bridge networking and `-v` persistent storage, and manage UnionFS (`AUFS`, `OverlayFS`) layered container images.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Container-Primitives-and-iSula-Architecture","exercise_slug":"02-Exercise-Namespaces-Cgroups-and-iSula-Specs-Lab","lecture":{"title":"Container Fundamentals (Namespaces, `cgroups`) & iSula Architecture","duration_mins":7,"pdf_ref":"Ch.07, pp. 387–398","objectives":["Distinguish the two core Linux kernel container features: Namespaces (resource isolation across 6 types) and `cgroups` (resource limitation in `/sys/fs/cgroup`)","Explain what `iSula` (`iSulad`) is, why it is written in C/C++ instead of Go, and its Northbound (CLI/CRI) and Southbound (OCI: LCR, runC, Kata) architecture","Quantify iSula's Lightweight (68%+ less memory), Fast (35% faster startup, 75% faster download, 15% faster `isula-build`), Easy-to-Use (`isula-transform`), and Flexible (REST vs. gRPC) advantages"],"content_markdown":"### 1. Core Linux Kernel Container Primitives: Namespaces vs. `cgroups`\nContainer technology evolved from `chroot` (1982), FreeBSD `Jail` (1998), `Linux-VServer` (2001), `Solaris Zone` (2004), `OpenVZ` (2005), **`cgroups` & `Namespaces` (2007)**, `LXC` (2008), to `Docker`, **`iSula`**, and `Kubernetes` (2011–now).\n* **Namespaces — Function: Resource Isolation (Ch.07, p.391):**\n  Encapsulates global kernel resources so processes in different namespaces are isolated from each other:\n\n| Namespace Type | System Call Parameter | Isolated Resource | Kernel Version |\n| :--- | :--- | :--- | :--- |\n| **PID namespace** | `CLONE_NEWPID` | Process IDs | Linux 2.6.24 |\n| **Mount namespace** | `CLONE_NEWNS` | File system mount points | Linux 2.6.19 |\n| **Network namespace** | `CLONE_NEWNET` | Network devices, IP addresses, ports | Linux 2.6.24–2.6.29 |\n| **User namespace** | `CLONE_NEWUSER` | User IDs (UIDs) and Group IDs (GIDs) | Linux 2.6.23–3.8 |\n| **UTS namespace** | `CLONE_NEWUTS` | **Host names and domain names** | Linux 2.6.19 |\n| **IPC namespace** | `CLONE_NEWIPC` | Semaphores, message queues, shared memory | Linux 2.6.19 |\n\n* **`cgroups` (Linux Control Groups) — Function: Resource Limitation (Ch.07, p.392):**\n  * **Limits system resources** (CPU, memory, block I/O) available to a set of processes, controls process priorities, and suspends/restores processes.\n  * Organized as files and directories in **`/sys/fs/cgroup`**.\n<!-- PDF_FIGS_START -->\n![Development Timeline of Container Virtualization (chroot to iSula) (Official Reference: p. 390)](./assets/images/p2_h8s1_container_history.png)\n*Figure: Development Timeline of Container Virtualization (chroot to iSula) (Official Reference: p. 390)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. What is `iSula` / `iSulad` & Its Unified Architecture\n* **Why `iSula`?** Mainstream engines like Docker and containerd are written in **Go**, which incurs high memory overhead in resource-constrained edge computing, IoT, and high-density server scenarios. **`iSula`** is openEuler's native container solution implemented in **C/C++**, featuring a unified architecture for CT and IT fields (system, secure, common, and embedded containers).\n* **iSulad Architecture (Ch.07, p.394):**\n  * **Northbound Interfaces:** **CLI (`isula`)** and **CRI** (for Kubernetes orchestration).\n  * **Communication Modes:** **Lightweight mode (REST interface)** and **Performance mode (gRPC interface)**.\n  * **Core Daemon (`iSulad`):** Image Service, Execution Service, Content Service, and Rootfs Service (separated to isolate operations).\n  * **Southbound OCI Runtimes:** Interconnects with OCI-compliant runtimes: **LCR (Lightweight Container Runtime — default, written in C)**, **`runC`**, and **`Kata`**.\n<!-- PDF_FIGS_START -->\n![iSula Container Engine Architecture Stack (isulad, CRI, sysCall) (Official Reference: p. 394)](./assets/images/p2_h8s1_isula_architecture.png)\n*Figure: iSula Container Engine Architecture Stack (isulad, CRI, sysCall) (Official Reference: p. 394)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Four Advantages of iSula (Lightweight, Fast, Easy-to-Use, Flexible)\n1. **Lightweight:** **>68% lower stable memory usage** for 100 containers compared to Docker (C/C++, LCR, simplified monitor process).\n2. **Fast:**\n   * **35% faster concurrent startup** (100 containers) using `fork/exec` + direct function calls and separated rootfs/image services.\n   * **75% faster image download** via smart on-demand loading.\n   * **15% faster image building (`isula-build`)** via **DAG-based building** (unlike `docker build`, `isula-build` does **not** start a container for every Dockerfile instruction—only for necessary instructions like `RUN`).\n3. **Easy-to-Use Toolkit:** **`isula-build`** (Dockerfile image builder) and **`isula-transform`** (cold/live migration tool converting Docker containers to iSulad).\n<!-- PDF_FIGS_START -->\n![iSula vs Docker Memory Usage Comparison (100 Containers) (Official Reference: p. 395)](./assets/images/p2_h8s1_isula_vs_docker_mem.png)\n*Figure: iSula vs Docker Memory Usage Comparison (100 Containers) (Official Reference: p. 395)*\n\n![iSula Container Compatibility (isula-build, isula-transform, OCI runtimes) (Official Reference: p. 397)](./assets/images/p2_h8s1_isula_ecosystem.png)\n*Figure: iSula Container Compatibility (isula-build, isula-transform, OCI runtimes) (Official Reference: p. 397)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["Namespaces provide resource ISOLATION (6 types: PID, Mount, Network, User, UTS [host/domain names], IPC), whereas cgroups (/sys/fs/cgroup) provide resource LIMITATION (CPU, memory, block I/O).","iSula (iSulad) is written in C/C++ (unlike Go-based Docker), uses LCR as its default OCI runtime, and supports Lightweight mode (REST) and Performance mode (gRPC).","Compared with Docker, iSula reduces 100-container memory usage by >68%, speeds up concurrent startup by 35%, accelerates smart image downloads by 75%, and speeds up DAG-based image builds (isula-build) by 15%."],"exam_traps":["EXAM TRAP: Do not confuse Namespaces vs. cgroups! Namespaces = Resource Isolation (what a container can SEE); cgroups = Resource Limitation (how much CPU/RAM/I/O a container can USE).","EXAM TRAP: UTS namespace (CLONE_NEWUTS) isolates host names and domain names, whereas IPC namespace (CLONE_NEWIPC) isolates semaphores, message queues, and shared memory."],"content_html":"<h3>1. Core Linux Kernel Container Primitives: Namespaces vs. <code class=\"inline-code\">cgroups<\/code><\/h3>\n<p>Container technology evolved from <code class=\"inline-code\">chroot<\/code> (1982), FreeBSD <code class=\"inline-code\">Jail<\/code> (1998), <code class=\"inline-code\">Linux-VServer<\/code> (2001), <code class=\"inline-code\">Solaris Zone<\/code> (2004), <code class=\"inline-code\">OpenVZ<\/code> (2005), <strong><code class=\"inline-code\">cgroups<\/code> &amp; <code class=\"inline-code\">Namespaces<\/code> (2007)<\/strong>, <code class=\"inline-code\">LXC<\/code> (2008), to <code class=\"inline-code\">Docker<\/code>, <strong><code class=\"inline-code\">iSula<\/code><\/strong>, and <code class=\"inline-code\">Kubernetes<\/code> (2011–now).<\/p>\n<ul class=\"md-list\">\n<li><strong>Namespaces — Function: Resource Isolation (Ch.07, p.391):<\/strong><\/li>\n<\/ul>\n<p>Encapsulates global kernel resources so processes in different namespaces are isolated from each other:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Namespace Type<\/th><th>System Call Parameter<\/th><th>Isolated Resource<\/th><th>Kernel Version<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>PID namespace<\/strong><\/td><td><code class=\"inline-code\">CLONE_NEWPID<\/code><\/td><td>Process IDs<\/td><td>Linux 2.6.24<\/td><\/tr>\n<tr><td><strong>Mount namespace<\/strong><\/td><td><code class=\"inline-code\">CLONE_NEWNS<\/code><\/td><td>File system mount points<\/td><td>Linux 2.6.19<\/td><\/tr>\n<tr><td><strong>Network namespace<\/strong><\/td><td><code class=\"inline-code\">CLONE_NEWNET<\/code><\/td><td>Network devices, IP addresses, ports<\/td><td>Linux 2.6.24–2.6.29<\/td><\/tr>\n<tr><td><strong>User namespace<\/strong><\/td><td><code class=\"inline-code\">CLONE_NEWUSER<\/code><\/td><td>User IDs (UIDs) and Group IDs (GIDs)<\/td><td>Linux 2.6.23–3.8<\/td><\/tr>\n<tr><td><strong>UTS namespace<\/strong><\/td><td><code class=\"inline-code\">CLONE_NEWUTS<\/code><\/td><td><strong>Host names and domain names<\/strong><\/td><td>Linux 2.6.19<\/td><\/tr>\n<tr><td><strong>IPC namespace<\/strong><\/td><td><code class=\"inline-code\">CLONE_NEWIPC<\/code><\/td><td>Semaphores, message queues, shared memory<\/td><td>Linux 2.6.19<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">cgroups<\/code> (Linux Control Groups) — Function: Resource Limitation (Ch.07, p.392):<\/strong><\/li>\n<li><strong>Limits system resources<\/strong> (CPU, memory, block I/O) available to a set of processes, controls process priorities, and suspends/restores processes.<\/li>\n<li>Organized as files and directories in <strong><code class=\"inline-code\">/sys/fs/cgroup<\/code><\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s1_container_history.png\" alt=\"Development Timeline of Container Virtualization (chroot to iSula)\" data-caption=\"Development Timeline of Container Virtualization (chroot to iSula) (Official Reference: p. 390)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Development Timeline of Container Virtualization (chroot to iSula)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 390 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. What is <code class=\"inline-code\">iSula<\/code> / <code class=\"inline-code\">iSulad<\/code> &amp; Its Unified Architecture<\/h3>\n<ul class=\"md-list\">\n<li><strong>Why <code class=\"inline-code\">iSula<\/code>?<\/strong> Mainstream engines like Docker and containerd are written in <strong>Go<\/strong>, which incurs high memory overhead in resource-constrained edge computing, IoT, and high-density server scenarios. <strong><code class=\"inline-code\">iSula<\/code><\/strong> is openEuler's native container solution implemented in <strong>C/C++<\/strong>, featuring a unified architecture for CT and IT fields (system, secure, common, and embedded containers).<\/li>\n<li><strong>iSulad Architecture (Ch.07, p.394):<\/strong><\/li>\n<li><strong>Northbound Interfaces:<\/strong> <strong>CLI (<code class=\"inline-code\">isula<\/code>)<\/strong> and <strong>CRI<\/strong> (for Kubernetes orchestration).<\/li>\n<li><strong>Communication Modes:<\/strong> <strong>Lightweight mode (REST interface)<\/strong> and <strong>Performance mode (gRPC interface)<\/strong>.<\/li>\n<li><strong>Core Daemon (<code class=\"inline-code\">iSulad<\/code>):<\/strong> Image Service, Execution Service, Content Service, and Rootfs Service (separated to isolate operations).<\/li>\n<li><strong>Southbound OCI Runtimes:<\/strong> Interconnects with OCI-compliant runtimes: <strong>LCR (Lightweight Container Runtime — default, written in C)<\/strong>, <strong><code class=\"inline-code\">runC<\/code><\/strong>, and <strong><code class=\"inline-code\">Kata<\/code><\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s1_isula_architecture.png\" alt=\"iSula Container Engine Architecture Stack (isulad, CRI, sysCall)\" data-caption=\"iSula Container Engine Architecture Stack (isulad, CRI, sysCall) (Official Reference: p. 394)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>iSula Container Engine Architecture Stack (isulad, CRI, sysCall)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 394 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Four Advantages of iSula (Lightweight, Fast, Easy-to-Use, Flexible)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Lightweight:<\/strong> <strong>&gt;68% lower stable memory usage<\/strong> for 100 containers compared to Docker (C/C++, LCR, simplified monitor process).<\/li>\n<li><strong>Fast:<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>35% faster concurrent startup<\/strong> (100 containers) using <code class=\"inline-code\">fork/exec<\/code> + direct function calls and separated rootfs/image services.<\/li>\n<li><strong>75% faster image download<\/strong> via smart on-demand loading.<\/li>\n<li><strong>15% faster image building (<code class=\"inline-code\">isula-build<\/code>)<\/strong> via <strong>DAG-based building<\/strong> (unlike <code class=\"inline-code\">docker build<\/code>, <code class=\"inline-code\">isula-build<\/code> does <strong>not<\/strong> start a container for every Dockerfile instruction—only for necessary instructions like <code class=\"inline-code\">RUN<\/code>).<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Easy-to-Use Toolkit:<\/strong> <strong><code class=\"inline-code\">isula-build<\/code><\/strong> (Dockerfile image builder) and <strong><code class=\"inline-code\">isula-transform<\/code><\/strong> (cold/live migration tool converting Docker containers to iSulad).<\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s1_isula_vs_docker_mem.png\" alt=\"iSula vs Docker Memory Usage Comparison (100 Containers)\" data-caption=\"iSula vs Docker Memory Usage Comparison (100 Containers) (Official Reference: p. 395)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>iSula vs Docker Memory Usage Comparison (100 Containers)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 395 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s1_isula_ecosystem.png\" alt=\"iSula Container Compatibility (isula-build, isula-transform, OCI runtimes)\" data-caption=\"iSula Container Compatibility (isula-build, isula-transform, OCI runtimes) (Official Reference: p. 397)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>iSula Container Compatibility (isula-build, isula-transform, OCI runtimes)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 397 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Verifying Kernel `cgroups` Mounts and iSula Architecture Specifications","duration_mins":8,"exercise_type":"config","prompt_label":"root@openEuler:~#","scenario":"You are preparing an engineering specification for migrating edge and cloud workloads from Docker to openEuler iSula. Complete the specification mapping kernel primitives, `iSulad` implementation language, default runtime, and toolkit components.","instructions":["Step 1: Specify the kernel feature for resource isolation (`Namespaces`) and the `/sys/fs/cgroup` feature for resource limitation (`cgroups`), plus the namespace that isolates hostnames (`UTS`).","Step 2: Specify the programming language of `iSulad` (`C/C++`) and its default OCI runtime (`LCR`).","Step 3: Specify the DAG-based image builder (`isula-build`) and Docker container migration tool (`isula-transform`)."],"starter_code":"# iSula & Kernel Container Specification\nRESOURCE_ISOLATION=\"<kernel_isolation_feature>\"\nHOSTNAME_NAMESPACE=\"<namespace_for_hostnames>\"\nRESOURCE_LIMITATION=\"<kernel_limitation_feature> (/sys/fs/cgroup)\"\nISULAD_LANGUAGE=\"<programming_language>\"\nDEFAULT_OCI_RUNTIME=\"<default_runtime>\"\nCONTAINER_TOOLKIT=\"<image_builder>, <migration_tool>\"","solution_code":"# iSula & Kernel Container Specification\nRESOURCE_ISOLATION=\"Namespaces\"\nHOSTNAME_NAMESPACE=\"UTS\"\nRESOURCE_LIMITATION=\"cgroups (/sys/fs/cgroup)\"\nISULAD_LANGUAGE=\"C/C++\"\nDEFAULT_OCI_RUNTIME=\"LCR\"\nCONTAINER_TOOLKIT=\"isula-build, isula-transform\"","hints":["Namespaces handle resource isolation (`UTS` isolates hostnames/domain names) and `cgroups` handle resource limitation.","`iSulad` is written in `C/C++` and uses `LCR` (Lightweight Container Runtime) by default.","The two container toolkit utilities are `isula-build` and `isula-transform`."],"validation_checks":[{"step":1,"description":"Specify Namespaces, UTS, and cgroups","required_any":["uts"],"feedback_fail":"Include 'Namespaces', 'UTS', and 'cgroups'."},{"step":2,"description":"Specify C/C++ language and LCR default runtime","required_any":["c/c++","lcr"],"feedback_fail":"Specify 'C/C++' for ISULAD_LANGUAGE and 'LCR' for DEFAULT_OCI_RUNTIME."},{"step":3,"description":"Specify isula-build and isula-transform toolkit utilities","required_any":["isula-build","isula-transform"],"feedback_fail":"Include 'isula-build' and 'isula-transform' in CONTAINER_TOOLKIT."}],"simulated_output":"[OK] Kernel Primitives Verified: Namespaces (PID, Mount, Network, User, UTS, IPC) + cgroups (/sys/fs/cgroup)\n[OK] iSulad Engine: C/C++ implementation | Default Runtime: LCR | Modes: REST (Lightweight) & gRPC (Performance)\n[OK] Container Toolkit: isula-build (15% faster DAG build) & isula-transform (Docker migration)","quiz_questions":[{"id":"h8_s1_q1","type":"single","question":"In the Linux kernel, what are the respective functions of `Namespaces` and `cgroups` in container virtualization?","options":["A. Namespaces limit CPU/memory usage; cgroups isolate hostnames and process IDs","B. Namespaces implement resource isolation; cgroups implement resource limitation (CPU, memory, block I/O)","C. Both Namespaces and cgroups are used exclusively for formatting ext4 partitions","D. Namespaces encrypt network traffic; cgroups compile C/C++ code"],"answer":"B","explanation":"Per Ch.07 (pp.391–392), Namespaces provide resource isolation (PID, Mount, Network, User, UTS, IPC), while `cgroups` (organized in `/sys/fs/cgroup`) limit the system resources (CPU, memory, block I/O) available to a set of processes."},{"id":"h8_s1_q2","type":"single","question":"Which Linux Namespace type (`CLONE_NEWUTS`) is responsible for isolating host names and domain names for a container?","options":["A. PID namespace","B. IPC namespace","C. UTS namespace","D. Mount namespace"],"answer":"C","explanation":"Per Ch.07 (p.391), the UTS namespace (`CLONE_NEWUTS`) isolates host names and domain names."},{"id":"h8_s1_q3","type":"multiple","question":"Which of the following statements about openEuler's native container engine `iSula` (`iSulad`) are TRUE?","options":["A. Unlike Go-based Docker, `iSula` is implemented in C/C++ and uses LCR as its default southbound OCI runtime.","B. Compared with Docker, `iSula` reduces the stable memory usage of 100 containers by more than 68% and achieves 35% faster concurrent container startup.","C. `isula-build` uses DAG-based image building and does not start a container for every Dockerfile instruction.","D. `iSula` supports Lightweight mode (REST interface) and Performance mode (gRPC interface)."],"answer":"ABCD","explanation":"Per Ch.07 (pp.393–398), all four statements are core technical highlights of `iSula` in the official Huawei training material."}],"reference_figures":[{"slug":"p2_h8s1_isula_architecture","title":"iSula Container Engine Architecture Stack (isulad, CRI, sysCall)","pdf_page":394}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-iSula-Installation-Config-and-Container-Lifecycle","exercise_slug":"04-Exercise-iSula-Container-Lifecycle-Lab","lecture":{"title":"iSula Installation, Configuration Priority & Container Lifecycle Operations","duration_mins":7,"pdf_ref":"Ch.07, pp. 399–417, 439","objectives":["Install `iSulad` via `yum`/`rpm` and apply the configuration priority order (`CLI > /etc/isulad/daemon.json > default code configurations`)","Identify the 4 official container states (`Created`, `Up`, `Paused`, `Exited` — Official Ch.07 Quiz Q1!)","Execute `isula` container lifecycle commands: `create`, `start`, `run` (`-d`, `-it`, `-p`, `-e`, `--workdir`, `--name`, `--dns`, `--restart`, `--rm`), `pause`/`unpause`, `exec`, `ps`, `inspect`, `logs`, `restart`, and `rm`"],"content_markdown":"### 1. Installing & Configuring `iSulad` (Configuration Priority Rule!)\n* **Installation:**\n  * Recommended (auto-resolves dependencies): **`yum install -y iSulad`** (installs iSula 2.0.11 by default on openEuler 22.03 LTS).\n  * Offline RPM (must manually install all
