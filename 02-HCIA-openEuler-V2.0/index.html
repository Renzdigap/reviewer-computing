 dependency RPMs): `rpm -ihv iSulad-xx.aarch64.rpm`.\n* **Configuration Priority (Highest to Lowest — Ch.07, p.401):**\n  $CLI (`isulad --xxx)` > Configuration file (`/etc/isulad/daemon.json)` > Default configurations in code\n  * **CLI Configuration:** e.g., **`isulad -l DEBUG`** (takes effect immediately without restarting; if managed by `systemd`, modifying `OPTIONS` in **`/etc/sysconfig/iSulad`** is equivalent to CLI configuration).\n  * **Config File (`/etc/isulad/daemon.json`):** Modifying `/etc/isulad/daemon.json` **requires restarting `iSulad`** (**`systemctl restart isulad`**) to take effect!\n\n---\n\n### 2. Container Lifecycle & 4 Official Container States (Ch.07 Quiz Q1!)\n* **Official Ch.07 Quiz Q1 (p.439):** Which of the following are container states?\n  * **`A. Created`** (newly created via `isula create nginx`, not yet started)\n  * **`B. Exited`** (stopped container)\n  * **`C. Up`** (running container after `isula start` or `isula run`)\n  * **`D. Paused`** (suspended via `isula pause`) -> **Answer: `ABCD`!**\n<!-- PDF_FIGS_START -->\n![Container State Machine Lifecycle (Created, Running, Paused, Stopped, Deleted) (Official Reference: p. 404)](./assets/images/p2_h8s2_container_lifecycle.png)\n*Figure: Container State Machine Lifecycle (Created, Running, Paused, Stopped, Deleted) (Official Reference: p. 404)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Complete `isula` Container Lifecycle Commands\n| Command | Key Options & Usage Examples (Ch.07, pp. 405–417) |\n| :--- | :--- |\n| **`isula create <image>`** | Creates a container in `Created` state; returns a 64-hex-digit Container ID (first **12 digits** shown in `isula ps`; can use unambiguous prefix like `e` or `7a`). |\n| **`isula start <ID>`** | Starts a `Created` or `Exited` container -> status changes to **`Up`**. |\n| **`isula run [opts] <img >`** | Creates and starts a container in one step:<br>• **`-d`**: Run in background.<br>• **`-it`**: Interactive (`-i`) + allocate pseudo-TTY (`-t`), e.g., `isula run -it nginx /bin/bash`.<br>• **`-p hostPort:containerPort[/udp]`**: Port mapping (can pass multiple `-p`, e.g., `isula run -d -p 8081:80 -p 5000:5000 nginx`).<br>• **`-e KEY=VAL`**: Set environment variable(s) (`-e A=100 -e B=200`).<br>• **`--workdir /tmp`**: Set container working directory.<br>• **`--name test`**: Assign container name.<br>• **`--dns 114.114.114.114`**: Set container DNS server.<br>• **`--restart <policy>`**: Auto-restart policy: **`no`** (default), **`on-failure[:N]`**, **`always`**, **`unless-stopped`**.<br>• **`--rm`**: Automatically delete container when it stops. |\n| **`isula pause / unpause`** | `isula pause <ID>` pauses a running container (`Paused`); `isula unpause <ID>` resumes it (`Up`). |\n| **`isula exec` vs. `attach`** | **`isula exec [-it] <ID> <cmd>`** creates a new terminal to run commands cleanly (**recommended**; `attach` may cause errors and is not recommended). |\n| **`isula ps`** | Lists running containers. **`-a`** (all containers), **`-q`** (only IDs), **`-n 2`** (latest 2 created containers). |\n| **`isula inspect / logs`** | **`isula inspect [--format=\"{{json .NetworkSettings}}\"] <ID>`** (Go template format by default); **`isula logs <ID>`**. |\n| **`isula restart / rm`** | **`isula restart <ID>`**; **`isula rm <ID>`** deletes stopped containers (**`isula rm -f <ID>`** forcibly deletes a running container!). |","key_takeaways":["iSulad configuration priority from highest to lowest is: CLI (isulad --xxx or /etc/sysconfig/iSulad OPTIONS) > Configuration file (/etc/isulad/daemon.json) > Default code configurations.","All four states—Created, Exited, Up, and Paused—are valid iSula container states (Official Ch.07 Quiz Q1: ABCD).","isula rm can only delete stopped containers by default; use 'isula rm -f <ID>' to forcibly delete a running container, or '--rm' on 'isula run' to auto-delete upon exit."],"exam_traps":["EXAM TRAP (Official Ch.07 Quiz Q1): 'Which of the following are container states? A. Created B. Exited C. Up D. Paused' -> ABCD!","EXAM TRAP: In 'isula run -p 8081:80 nginx', the FIRST number (8081) is the HOST port and the SECOND number (80) is the CONTAINER port!"],"content_html":"<h3>1. Installing &amp; Configuring <code class=\"inline-code\">iSulad<\/code> (Configuration Priority Rule!)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Installation:<\/strong><\/li>\n<li>Recommended (auto-resolves dependencies): <strong><code class=\"inline-code\">yum install -y iSulad<\/code><\/strong> (installs iSula 2.0.11 by default on openEuler 22.03 LTS).<\/li>\n<li>Offline RPM (must manually install all dependency RPMs): <code class=\"inline-code\">rpm -ihv iSulad-xx.aarch64.rpm<\/code>.<\/li>\n<li><strong>Configuration Priority (Highest to Lowest — Ch.07, p.401):<\/strong><\/li>\n<\/ul>\n<p>CLI (`isulad --xxx)` &gt; Configuration file (`/etc/isulad/daemon.json)` &gt; Default configurations in code<\/p>\n<ul class=\"md-list\">\n<li><strong>CLI Configuration:<\/strong> e.g., <strong><code class=\"inline-code\">isulad -l DEBUG<\/code><\/strong> (takes effect immediately without restarting; if managed by <code class=\"inline-code\">systemd<\/code>, modifying <code class=\"inline-code\">OPTIONS<\/code> in <strong><code class=\"inline-code\">/etc/sysconfig/iSulad<\/code><\/strong> is equivalent to CLI configuration).<\/li>\n<li><strong>Config File (<code class=\"inline-code\">/etc/isulad/daemon.json<\/code>):<\/strong> Modifying <code class=\"inline-code\">/etc/isulad/daemon.json<\/code> <strong>requires restarting <code class=\"inline-code\">iSulad<\/code><\/strong> (<strong><code class=\"inline-code\">systemctl restart isulad<\/code><\/strong>) to take effect!<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Container Lifecycle &amp; 4 Official Container States (Ch.07 Quiz Q1!)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Official Ch.07 Quiz Q1 (p.439):<\/strong> Which of the following are container states?<\/li>\n<li><strong><code class=\"inline-code\">A. Created<\/code><\/strong> (newly created via <code class=\"inline-code\">isula create nginx<\/code>, not yet started)<\/li>\n<li><strong><code class=\"inline-code\">B. Exited<\/code><\/strong> (stopped container)<\/li>\n<li><strong><code class=\"inline-code\">C. Up<\/code><\/strong> (running container after <code class=\"inline-code\">isula start<\/code> or <code class=\"inline-code\">isula run<\/code>)<\/li>\n<li><strong><code class=\"inline-code\">D. Paused<\/code><\/strong> (suspended via <code class=\"inline-code\">isula pause<\/code>) -&gt; <strong>Answer: <code class=\"inline-code\">ABCD<\/code>!<\/strong><\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s2_container_lifecycle.png\" alt=\"Container State Machine Lifecycle (Created, Running, Paused, Stopped, Deleted)\" data-caption=\"Container State Machine Lifecycle (Created, Running, Paused, Stopped, Deleted) (Official Reference: p. 404)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Container State Machine Lifecycle (Created, Running, Paused, Stopped, Deleted)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 404 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Complete <code class=\"inline-code\">isula<\/code> Container Lifecycle Commands<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Command<\/th><th>Key Options &amp; Usage Examples (Ch.07, pp. 405–417)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">isula create &lt;image&gt;<\/code><\/strong><\/td><td>Creates a container in <code class=\"inline-code\">Created<\/code> state; returns a 64-hex-digit Container ID (first <strong>12 digits<\/strong> shown in <code class=\"inline-code\">isula ps<\/code>; can use unambiguous prefix like <code class=\"inline-code\">e<\/code> or <code class=\"inline-code\">7a<\/code>).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">isula start &lt;ID&gt;<\/code><\/strong><\/td><td>Starts a <code class=\"inline-code\">Created<\/code> or <code class=\"inline-code\">Exited<\/code> container -&gt; status changes to <strong><code class=\"inline-code\">Up<\/code><\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">isula run [opts] &lt;img &gt;<\/code><\/strong><\/td><td>Creates and starts a container in one step:&lt;br&gt;• <strong><code class=\"inline-code\">-d<\/code><\/strong>: Run in background.&lt;br&gt;• <strong><code class=\"inline-code\">-it<\/code><\/strong>: Interactive (<code class=\"inline-code\">-i<\/code>) + allocate pseudo-TTY (<code class=\"inline-code\">-t<\/code>), e.g., <code class=\"inline-code\">isula run -it nginx /bin/bash<\/code>.&lt;br&gt;• <strong><code class=\"inline-code\">-p hostPort:containerPort[/udp]<\/code><\/strong>: Port mapping (can pass multiple <code class=\"inline-code\">-p<\/code>, e.g., <code class=\"inline-code\">isula run -d -p 8081:80 -p 5000:5000 nginx<\/code>).&lt;br&gt;• <strong><code class=\"inline-code\">-e KEY=VAL<\/code><\/strong>: Set environment variable(s) (<code class=\"inline-code\">-e A=100 -e B=200<\/code>).&lt;br&gt;• <strong><code class=\"inline-code\">--workdir /tmp<\/code><\/strong>: Set container working directory.&lt;br&gt;• <strong><code class=\"inline-code\">--name test<\/code><\/strong>: Assign container name.&lt;br&gt;• <strong><code class=\"inline-code\">--dns 114.114.114.114<\/code><\/strong>: Set container DNS server.&lt;br&gt;• <strong><code class=\"inline-code\">--restart &lt;policy&gt;<\/code><\/strong>: Auto-restart policy: <strong><code class=\"inline-code\">no<\/code><\/strong> (default), <strong><code class=\"inline-code\">on-failure[:N]<\/code><\/strong>, <strong><code class=\"inline-code\">always<\/code><\/strong>, <strong><code class=\"inline-code\">unless-stopped<\/code><\/strong>.&lt;br&gt;• <strong><code class=\"inline-code\">--rm<\/code><\/strong>: Automatically delete container when it stops.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">isula pause / unpause<\/code><\/strong><\/td><td><code class=\"inline-code\">isula pause &lt;ID&gt;<\/code> pauses a running container (<code class=\"inline-code\">Paused<\/code>); <code class=\"inline-code\">isula unpause &lt;ID&gt;<\/code> resumes it (<code class=\"inline-code\">Up<\/code>).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">isula exec<\/code> vs. <code class=\"inline-code\">attach<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">isula exec [-it] &lt;ID&gt; &lt;cmd&gt;<\/code><\/strong> creates a new terminal to run commands cleanly (<strong>recommended<\/strong>; <code class=\"inline-code\">attach<\/code> may cause errors and is not recommended).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">isula ps<\/code><\/strong><\/td><td>Lists running containers. <strong><code class=\"inline-code\">-a<\/code><\/strong> (all containers), <strong><code class=\"inline-code\">-q<\/code><\/strong> (only IDs), <strong><code class=\"inline-code\">-n 2<\/code><\/strong> (latest 2 created containers).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">isula inspect / logs<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">isula inspect [--format=\"{{json .NetworkSettings}}\"] &lt;ID&gt;<\/code><\/strong> (Go template format by default); <strong><code class=\"inline-code\">isula logs &lt;ID&gt;<\/code><\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">isula restart / rm<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">isula restart &lt;ID&gt;<\/code><\/strong>; <strong><code class=\"inline-code\">isula rm &lt;ID&gt;<\/code><\/strong> deletes stopped containers (<strong><code class=\"inline-code\">isula rm -f &lt;ID&gt;<\/code><\/strong> forcibly deletes a running container!).<\/td><\/tr>\n<\/tbody><\/table><\/div>"},"exercise":{"title":"Hands-On Lab: Running, Exec-ing, Inspecting & Forcibly Removing `iSula` Containers","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are deploying an `nginx` web container using `iSula` on openEuler (following Ch.07 pp. 408–417). Start a background container named `test` mapping host port `8081` to container port `80` with environment variable `A=100`, execute `/bin/bash` inside `test` using `isula exec -it`, list the latest 2 containers, and forcibly delete container `test`.","instructions":["Step 1: Run `nginx` in the background (`-d`) named `test` (`--name test`) with port mapping `-p 8081:80` and environment variable `-e A=100` (`isula run -d --name test -p 8081:80 -e A=100 nginx`).","Step 2: Execute an interactive shell in container `test` using `isula exec -it test /bin/bash` and list the latest 2 containers using `isula ps -n 2`.","Step 3: Forcibly remove the running container `test` using `isula rm -f test`."],"starter_code":"# Step 1: Run nginx in background named 'test' with -p 8081:80 and -e A=100\n<isula_run_command>\n\n# Step 2: Run interactive /bin/bash via isula exec and list latest 2 containers\n<isula_exec_command>\n<isula_ps_n2_command>\n\n# Step 3: Forcibly remove running container 'test'\n<isula_rm_force_command>","solution_code":"# Step 1: Run nginx in background named 'test' with -p 8081:80 and -e A=100\nisula run -d --name test -p 8081:80 -e A=100 nginx\n\n# Step 2: Run interactive /bin/bash via isula exec and list latest 2 containers\nisula exec -it test /bin/bash\nisula ps -n 2\n\n# Step 3: Forcibly remove running container 'test'\nisula rm -f test","hints":["Use `isula run -d --name test -p 8081:80 -e A=100 nginx`.","Use `isula exec -it test /bin/bash` and `isula ps -n 2` (Ch.07 pp.412–413).","Use `isula rm -f test` (Ch.07 p.417)."],"validation_checks":[{"step":1,"description":"Run nginx container with -d, --name test, -p 8081:80, and -e A=100","required_any":["-p 8081:80"],"feedback_fail":"Include 'isula run -d --name test -p 8081:80 -e A=100 nginx'."},{"step":2,"description":"Access container with isula exec -it and list latest 2 containers with isula ps -n 2","required_any":["isula ps -n 2"],"feedback_fail":"Include 'isula exec -it test /bin/bash' and 'isula ps -n 2'."},{"step":3,"description":"Forcibly delete running container with isula rm -f","required_any":["isula rm -f test"],"feedback_fail":"Use 'isula rm -f test' to forcibly remove the running container."}],"simulated_output":"d306049a6b6af9697a1dab8df72f288137b76a99107e7e26ce8dc4b9ad31e219\nroot@d306049a6b6a:/# echo A\n100\nCONTAINER ID    IMAGE                           COMMAND                  CREATED         STATUS    PORTS                  NAMES\nd306049a6b6a    docker.io/library/nginx:latest  \"/docker-entrypoint.…\"   5 seconds ago   Up        0.0.0.0:8081->80/tcp   test\ntest","quiz_questions":[{"id":"h8_s2_q1","type":"multiple","question":"[Official Ch.07 Quiz Q1] Which of the following are container states?","options":["A. Created","B. Exited","C. Up","D. Paused"],"answer":"ABCD","explanation":"Official Ch.07 Quiz Q1 (p.439): ABCD. All four—`Created`, `Exited`, `Up`, and `Paused`—are valid container states in iSula."},{"id":"h8_s2_q2","type":"single","question":"What is the configuration priority order (from highest to lowest) for the `iSulad` daemon in openEuler?","options":["A. Default code configurations > `/etc/isulad/daemon.json` > CLI","B. `/etc/isulad/daemon.json` > CLI > Default code configurations","C. CLI (`isulad --xxx`) > Configuration file (`/etc/isulad/daemon.json`) > Default configurations in code","D. `/etc/fstab` > `/etc/bashrc` > CLI"],"answer":"C","explanation":"Per Ch.07 (p.401), `iSulad` configuration priority from highest to lowest is: CLI > configuration file (`/etc/isulad/daemon.json`) > default configurations in code."},{"id":"h8_s2_q3","type":"single","question":"When creating a container with `isula run`, which `--restart` policy is used by default if `--restart` is not specified, and which policy restarts a container always EXCEPT when it was already stopped before the `iSulad` daemon started?","options":["A. Default: `always`; Exception policy: `on-failure`","B. Default: `no`; Exception policy: `unless-stopped`","C. Default: `on-failure`; Exception policy: `no`","D. Default: `unless-stopped`; Exception policy: `always`"],"answer":"B","explanation":"Per Ch.07 (p.416), `no` (do not restart when exited) is used by default, and `unless-stopped` always restarts the container when it exits except for containers that were already stopped when the `iSulad` daemon started."}],"reference_figures":[{"slug":"p2_h8s2_container_lifecycle","title":"Container State Machine Lifecycle (Created, Running, Paused, Stopped, Deleted)","pdf_page":404}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-iSula-Networking-CNI-and-Persistent-Storage","exercise_slug":"06-Exercise-iSula-Network-and-Volume-Mount-Lab","lecture":{"title":"iSula Container Networking (CNI) & Persistent Storage (`-v`)","duration_mins":7,"pdf_ref":"Ch.07, pp. 418–426","objectives":["Explain how `iSulad` integrates with Container Network Interface (CNI) plugins and configure CNI in `/etc/isulad/daemon.json`","Distinguish the 3 iSula CNI plugins (`bridge`, `portmap`, `firewall`) and manage networks via `isula network create/ls/inspect` and `--net`","Implement container persistent storage by mounting host files/directories with `isula run -v /host:/container[:rw|:ro]`"],"content_markdown":"### 1. How `iSulad` Implements Container Networking with CNI\n* **Runtime & Network Flow:** `User -> iSula -> Runtime (LCR by default) / CNI / CSI -> Container`.\n* Because `iSulad` does not bundle a built-in network stack, it uses **CNI (Container Network Interface)** binary plugins (v0.9.0+ recommended, v1.3.0 available from `github.com/containernetworking/plugins`).\n* **Supported Network Mode:** While CNI specifications support bridge, VLAN, Flannel, and Calico, **currently `iSula` only supports the `bridge` mode** (Ch.07, p.420), where containers connected to the same Linux bridge communicate directly with each other and with the host.\n* **Enabling CNI in `/etc/isulad/daemon.json` (Ch.07, p.422):**\n  * **`\"network-plugin\": \"cni\"`** (can be set to `cni` or left empty by default).\n  * **`\"cni-bin-dir\": \"/opt/cni/bin\"`** (default directory storing compiled CNI plugin binaries).\n  * **`\"cni-conf-dir\": \"/etc/cni/net.d\"`** (default directory storing CNI network configuration files).\n<!-- PDF_FIGS_START -->\n![How isulad Runs a Container Execution Chain (Official Reference: p. 419)](./assets/images/p2_h8s3_isulad_run_chain.png)\n*Figure: How isulad Runs a Container Execution Chain (Official Reference: p. 419)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Three iSula Network Plugins & `isula network` Commands\nWhen you create a bridge network in iSula, three CNI plugins work together (Ch.07, p.423):\n1. **`bridge` plugin:** Creates a Linux bridge device, connects container virtual NICs to the bridge, and assigns IP addresses via the **`host-local` IPAM** plugin.\n2. **`portmap` plugin:** Implements **NAT port forwarding** between container ports and host ports.\n3. **`firewall` plugin:** Uses **`iptables`** to control ingress/egress container traffic and enforce port-mapping security rules.\n* **iSula Network CLI Operations:**\n  ```bash\n  isula network create cni0\n  isula network ls\n  isula network inspect cni0\n  isula run --net cni0 -d -it isulad/busybox sleep 99d\n  ```\n<!-- PDF_FIGS_START -->\n![CNI and iSula Bridge Network Topology (Official Reference: p. 420)](./assets/images/p2_h8s3_cni_bridge_network.png)\n*Figure: CNI and iSula Bridge Network Topology (Official Reference: p. 420)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Container Persistent Storage (`-v` Host Bind Mounts & SCI)\nBy default, modifications inside a container are written only to its **temporary read/write container layer** and are lost when the container is deleted!\n* **Two Persistent Storage Methods:**\n  1. **Mount host files or directories into the container (`-v`).**\n  2. **Use a third-party storage plugin** (invoked via **SCI**).\n* **Mounting Syntax & Permissions (`-v` on `isula create` or `isula run`):**\n  ```bash\n  isula run -it -n storage \\\n    -v /root/test1.txt:/tmp/test1.txt:rw \\\n    -v /root/test2.txt:/tmp/test2.txt:ro \\\n    oepkgs/test/nginx:latest /bin/bash\n  ```\n  * **`rw` (Default):** Container has **read-write** permission on the mounted host file/directory.\n  * **`ro`:** Container has **read-only** permission (writing inside the container returns `Read-only file system`).","key_takeaways":["iSulad uses LCR as its default runtime and CNI for networking; currently, iSula only supports the 'bridge' network mode.","In /etc/isulad/daemon.json, CNI is configured with 'network-plugin': 'cni', 'cni-bin-dir': '/opt/cni/bin' (default), and 'cni-conf-dir': '/etc/cni/net.d' (default), utilizing the bridge, portmap, and firewall plugins.","Use 'isula run -v /host/path:/container/path[:rw|:ro]' for persistent storage; 'rw' (read-write) is the default mount permission."],"exam_traps":["EXAM TRAP: Do not confuse cni-bin-dir and cni-conf-dir defaults in /etc/isulad/daemon.json! cni-bin-dir defaults to '/opt/cni/bin', whereas cni-conf-dir defaults to '/etc/cni/net.d'.","EXAM TRAP: Currently, iSula only supports the 'bridge' network mode in CNI (Ch.07 p.420)."],"content_html":"<h3>1. How <code class=\"inline-code\">iSulad<\/code> Implements Container Networking with CNI<\/h3>\n<ul class=\"md-list\">\n<li><strong>Runtime &amp; Network Flow:<\/strong> <code class=\"inline-code\">User -&gt; iSula -&gt; Runtime (LCR by default) / CNI / CSI -&gt; Container<\/code>.<\/li>\n<li>Because <code class=\"inline-code\">iSulad<\/code> does not bundle a built-in network stack, it uses <strong>CNI (Container Network Interface)<\/strong> binary plugins (v0.9.0+ recommended, v1.3.0 available from <code class=\"inline-code\">github.com/containernetworking/plugins<\/code>).<\/li>\n<li><strong>Supported Network Mode:<\/strong> While CNI specifications support bridge, VLAN, Flannel, and Calico, <strong>currently <code class=\"inline-code\">iSula<\/code> only supports the <code class=\"inline-code\">bridge<\/code> mode<\/strong> (Ch.07, p.420), where containers connected to the same Linux bridge communicate directly with each other and with the host.<\/li>\n<li><strong>Enabling CNI in <code class=\"inline-code\">/etc/isulad/daemon.json<\/code> (Ch.07, p.422):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">\"network-plugin\": \"cni\"<\/code><\/strong> (can be set to <code class=\"inline-code\">cni<\/code> or left empty by default).<\/li>\n<li><strong><code class=\"inline-code\">\"cni-bin-dir\": \"/opt/cni/bin\"<\/code><\/strong> (default directory storing compiled CNI plugin binaries).<\/li>\n<li><strong><code class=\"inline-code\">\"cni-conf-dir\": \"/etc/cni/net.d\"<\/code><\/strong> (default directory storing CNI network configuration files).<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s3_isulad_run_chain.png\" alt=\"How isulad Runs a Container Execution Chain\" data-caption=\"How isulad Runs a Container Execution Chain (Official Reference: p. 419)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>How isulad Runs a Container Execution Chain<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 419 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Three iSula Network Plugins &amp; <code class=\"inline-code\">isula network<\/code> Commands<\/h3>\n<p>When you create a bridge network in iSula, three CNI plugins work together (Ch.07, p.423):<\/p>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">bridge<\/code> plugin:<\/strong> Creates a Linux bridge device, connects container virtual NICs to the bridge, and assigns IP addresses via the <strong><code class=\"inline-code\">host-local<\/code> IPAM<\/strong> plugin.<\/li>\n<li><strong><code class=\"inline-code\">portmap<\/code> plugin:<\/strong> Implements <strong>NAT port forwarding<\/strong> between container ports and host ports.<\/li>\n<li><strong><code class=\"inline-code\">firewall<\/code> plugin:<\/strong> Uses <strong><code class=\"inline-code\">iptables<\/code><\/strong> to control ingress/egress container traffic and enforce port-mapping security rules.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>iSula Network CLI Operations:<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  isula network create cni0\n  isula network ls\n  isula network inspect cni0\n  isula run --net cni0 -d -it isulad/busybox sleep 99d<\/code><\/pre><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s3_cni_bridge_network.png\" alt=\"CNI and iSula Bridge Network Topology\" data-caption=\"CNI and iSula Bridge Network Topology (Official Reference: p. 420)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>CNI and iSula Bridge Network Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 420 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Container Persistent Storage (<code class=\"inline-code\">-v<\/code> Host Bind Mounts &amp; SCI)<\/h3>\n<p>By default, modifications inside a container are written only to its <strong>temporary read/write container layer<\/strong> and are lost when the container is deleted!<\/p>\n<ul class=\"md-list\">\n<li><strong>Two Persistent Storage Methods:<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Mount host files or directories into the container (<code class=\"inline-code\">-v<\/code>).<\/strong><\/li>\n<li><strong>Use a third-party storage plugin<\/strong> (invoked via <strong>SCI<\/strong>).<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Mounting Syntax &amp; Permissions (<code class=\"inline-code\">-v<\/code> on <code class=\"inline-code\">isula create<\/code> or <code class=\"inline-code\">isula run<\/code>):<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  isula run -it -n storage \\\n    -v /root/test1.txt:/tmp/test1.txt:rw \\\n    -v /root/test2.txt:/tmp/test2.txt:ro \\\n    oepkgs/test/nginx:latest /bin/bash<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">rw<\/code> (Default):<\/strong> Container has <strong>read-write<\/strong> permission on the mounted host file/directory.<\/li>\n<li><strong><code class=\"inline-code\">ro<\/code>:<\/strong> Container has <strong>read-only<\/strong> permission (writing inside the container returns <code class=\"inline-code\">Read-only file system<\/code>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Creating CNI Bridge Networks (`isula network`) and Read-Only/Read-Write Volumes (`-v`)","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are configuring CNI networking and persistent volumes for `iSula` containers (following Ch.07 pp. 423–426). Create a CNI bridge network named `cni0`, launch a `busybox` container attached to `cni0` using `--net cni0`, and launch a container mounting `/root/test1.txt` as `rw` and `/root/test2.txt` as `ro`.","instructions":["Step 1: Create the iSula network `cni0` (`isula network create cni0`) and list existing networks (`isula network ls`).","Step 2: Start a background container attached to `cni0` using `isula run --net cni0 -d -it isulad/busybox sleep 99d`.","Step 3: Mount `/root/test1.txt` (`rw`) and `/root/test2.txt` (`ro`) into `/tmp/` using `-v /root/test1.txt:/tmp/test1.txt:rw -v /root/test2.txt:/tmp/test2.txt:ro`."],"starter_code":"# Step 1: Create iSula network cni0 and list networks\n<isula_net_create_command>\n<isula_net_ls_command>\n\n# Step 2: Run isulad/busybox attached to network cni0\n<isula_run_net_command>\n\n# Step 3: Run container with test1.txt (rw) and test2.txt (ro) mounted\nisula run -it -n storage <volume_mounts> oepkgs/test/nginx:latest /bin/bash","solution_code":"# Step 1: Create iSula network cni0 and list networks\nisula network create cni0\nisula network ls\n\n# Step 2: Run isulad/busybox attached to network cni0\nisula run --net cni0 -d -it isulad/busybox sleep 99d\n\n# Step 3: Run container with test1.txt (rw) and test2.txt (ro) mounted\nisula run -it -n storage -v /root/test1.txt:/tmp/test1.txt:rw -v /root/test2.txt:/tmp/test2.txt:ro oepkgs/test/nginx:latest /bin/bash","hints":["Use `isula network create cni0` and `isula network ls` (Ch.07 p.423).","Use `isula run --net cni0 -d -it isulad/busybox sleep 99d` (Ch.07 p.424).","Use `-v /root/test1.txt:/tmp/test1.txt:rw -v /root/test2.txt:/tmp/test2.txt:ro` (Ch.07 p.426)."],"validation_checks":[{"step":1,"description":"Create and list CNI network cni0","required_any":["isula network create cni0"],"feedback_fail":"Include 'isula network create cni0' and 'isula network ls'."},{"step":2,"description":"Specify --net cni0 when starting the container","required_any":["--net cni0"],"feedback_fail":"Use 'isula run --net cni0 -d -it isulad/busybox sleep 99d'."},{"step":3,"description":"Mount volumes with :rw and :ro using -v","required_any":["/root/test2.txt:/tmp/test2.txt:ro"],"feedback_fail":"Include '-v /root/test1.txt:/tmp/test1.txt:rw -v /root/test2.txt:/tmp/test2.txt:ro'."}],"simulated_output":"cni0\nNAME    VERSION    PLUGIN\ncni0    1.0.0      bridge,portmap,firewall\n\n6a43c0d019609299916ba058886e7a2f0e60465a27a3212ba2982253ed79494c\n\nroot@309f333abd89:/tmp# echo \"test\" >> test1.txt\nroot@309f333abd89:/tmp# echo \"test\" >> test2.txt\nbash: test2.txt: Read-only file system","quiz_questions":[{"id":"h8_s3_q1","type":"single","question":"In `/etc/isulad/daemon.json`, what are the default directories for `cni-bin-dir` (CNI plugin binaries) and `cni-conf-dir` (CNI configuration files)?","options":["A. `/usr/bin/cni` and `/etc/isulad/cni`","B. `/opt/cni/bin` and `/etc/cni/net.d`","C. `/var/lib/cni` and `/etc/sysconfig/cni`","D. `/sbin/cni` and `/opt/cni/conf`"],"answer":"B","explanation":"Per Ch.07 (p.422), the default directory for `cni-bin-dir` is `/opt/cni/bin`, and the default directory for `cni-conf-dir` is `/etc/cni/net.d`."},{"id":"h8_s3_q2","type":"single","question":"When mounting a host directory into an iSula container using `-v /host/dir:/container/dir`, what is the default access permission if neither `:ro` nor `:rw` is specified?","options":["A. Read-only (`ro`)","B. Read-write (`rw`)","C. Execute-only (`x`)","D. No access until `chmod` is run"],"answer":"B","explanation":"Per Ch.07 (p.425), when using `-v` to mount host files or directories during container creation, `-rw` (read-write permission) is the default."},{"id":"h8_s3_q3","type":"multiple","question":"Which three CNI network plugins are used together when `isula network create cni0` creates a container bridge network?","options":["A. `bridge` (creates Linux bridge and assigns IPs via `host-local` IPAM)","B. `portmap` (implements NAT port forwarding between container and host ports)","C. `firewall` (uses `iptables` to set container network access rules)","D. `vsftpd` (transfers files over FTP)"],"answer":"ABC","explanation":"Per Ch.07 (p.423), iSula network plugins for `cni0` are `bridge,portmap,firewall`."}],"reference_figures":[{"slug":"p2_h8s3_cni_bridge_network","title":"CNI and iSula Bridge Network Topology","pdf_page":420}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Container-Image-Architecture-and-Management","exercise_slug":"08-Exercise-iSula-Image-Pull-Tag-Inspect-Rmi-Lab","lecture":{"title":"Container Image Architecture (UnionFS, AUFS, OverlayFS) & Image Management (`isula images/pull/tag/rmi`)","duration_mins":7,"pdf_ref":"Ch.07, pp. 427–438","objectives":["Explain the layered container image structure (read-only `rootfs` image layers up to 128 layers + read/write container layer) and Copy-on-Write (CoW)","Compare UnionFS implementations: AUFS (`aufs/diff` & `aufs/mnt`) vs. OverlayFS (`lowerdir`, `upperdir`, `merged`, `workdir`, `copy_up`, and whiteout/opaque files)","Parse image naming (`[registry/][path/]<imagename>[:tag]`) and manage images with `isula images`, `isula inspect`, `isula pull`, `isula tag`, and `isula rmi`"],"content_markdown":"### 1. Container Image Architecture, Layer Limit & Copy-on-Write (CoW)\n* **What is in a Container Image?** A container image is an immutable template containing a complete operating system **`rootfs` (files and directories)** plus the application and its dependencies.\n  * **Shared Host Kernel:** All containers share the **host OS kernel** and **cannot modify the host kernel**.\n  * **Layer Limit:** An image is immutable and **cannot exceed 128 layers** (Ch.07, p.428).\n* **Image Layers vs. Container Layer & Copy-on-Write (CoW — Ch.07, pp. 429–430):**\n  * **Image layers (Read-Only / R/O):** Shared across containers; enables incremental pulls/storage.\n  * **Container layer (Thin Read/Write / R/W layer):** Mounted on top when a container starts.\n  * **4 File Operations under CoW:**\n    1. **Creating a file:** Added directly to the top R/W **container layer**.\n    2. **Reading a file:** Searched from top layer (`upperdir`/container layer) down to lower image layers (`lowerdir`).\n    3. **Modifying a file:** Looked up from top to bottom; when modified for the first time, the file is **copied from the read-only image layer up to the container layer (`copy_up`)** and modified there (**Copy-on-Write**).\n    4. **Deleting a file/directory:** Because image layers are read-only, UnionFS creates a **whiteout file** (or **opaque directory** in OverlayFS) in the R/W container layer to hide the underlying file/directory!\n<!-- PDF_FIGS_START -->\n![Layered Structure of Container Images (Read-Write Container Layer + R/O Image Layers) (Official Reference: p. 429)](./assets/images/p2_h8s4_image_layers.png)\n*Figure: Layered Structure of Container Images (Read-Write Container Layer + R/O Image Layers) (Official Reference: p. 429)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. UnionFS Drivers: AUFS vs. OverlayFS\n**UnionFS** mounts multiple directories (branches/layers) onto a single unified virtual mount point:\n* **AUFS (Advanced Multi-Layered Unification Filesystem — Ch.07, p.432):**\n  * Stores each image layer and container layer in `/var/lib/xxx/aufs/diff/<ID>`, and presents the unified working directory at **`/var/lib/xxx/aufs/mnt`**.\n* **OverlayFS (`overlay` / `overlay2` — Ch.07, p.433):**\n  * Simpler deployment and higher performance than AUFS; built on top of `ext4` or `xfs` using **four directories**:\n    1. **`lowerdir`:** Read-only image layers (`lowerdir1`, `lowerdir2`...).\n    2. **`upperdir`:** Read-write container layer (stores new, `copy_up`-modified, and whiteout/opaque files).\n    3. **`merged`:** Unified view presented to the user/container.\n    4. **`workdir`:** Internal working directory (**invisible to users**).\n<!-- PDF_FIGS_START -->\n![AUFS Multi-Layered Directory Union Mount Structure (Official Reference: p. 432)](./assets/images/p2_h8s4_aufs_layers.png)\n*Figure: AUFS Multi-Layered Directory Union Mount Structure (Official Reference: p. 432)*\n\n![OverlayFS Structure (lowerdir, upperdir, merged File Overlay) (Official Reference: p. 433)](./assets/images/p2_h8s4_overlayfs_layers.png)\n*Figure: OverlayFS Structure (lowerdir, upperdir, merged File Overlay) (Official Reference: p. 433)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Container Image Naming & `isula` Image Commands\n* **Image Naming Format:** **`[registry/][path/]<imagename>[:tag]`**\n  * If `registry/` is omitted, the configured default public/mirror registry is used.\n  * If `:tag` is omitted, **`latest`** is used by default!\n* **`isula` Image Management Commands (Ch.07, pp. 435–438):**\n  * **`isula images`:** Lists local images on the host.\n  * **`isula inspect <image:tag>`:** Views detailed JSON metadata (e.g., `isula inspect nginx:latest`).\n  * **`isula pull <image>`:** Pulls an image from a registry (`isula pull openeuler/busybox:latest`).\n    * **CRITICAL EXAM TRAP (Ch.07, p.436):** **`iSula` supports the `pull` command and does NOT support the `push` command!**\n  * **`isula tag <source_image:tag> <target_image:tag>`:** Creates a new tag alias referring to the same `IMAGE ID` (e.g., `isula tag openeuler/busybox:latest busybox:test`).\n  * **`isula rmi <image:tag>`:** Deletes an image from the host (`isula rmi busybox:test`).","key_takeaways":["Container images encapsulate the OS rootfs and app dependencies while sharing the host OS kernel; an image is read-only/immutable and cannot exceed 128 layers.","OverlayFS uses four directories: lowerdir (R/O image layers), upperdir (R/W container layer), merged (unified container view), and workdir (invisible to users), using copy_up (CoW) for modifications and whiteout files / opaque directories for deletions.","In '[registry/][path/]<imagename>[:tag]', the default tag is 'latest'; manage images with 'isula images', 'isula pull', 'isula tag', 'isula inspect', and 'isula rmi' (Note: iSula does NOT support 'push'!)."],"exam_traps":["EXAM TRAP (Ch.07 p.436): iSula supports 'isula pull', but DOES NOT support 'isula push'!","EXAM TRAP: Deleting a file inside a container does NOT delete it from the read-only image layer (lowerdir)—instead, AUFS/OverlayFS creates a 'whiteout' file (or 'opaque' directory) in the container layer (upperdir) to mask it."],"content_html":"<h3>1. Container Image Architecture, Layer Limit &amp; Copy-on-Write (CoW)<\/h3>\n<ul class=\"md-list\">\n<li><strong>What is in a Container Image?<\/strong> A container image is an immutable template containing a complete operating system <strong><code class=\"inline-code\">rootfs<\/code> (files and directories)<\/strong> plus the application and its dependencies.<\/li>\n<li><strong>Shared Host Kernel:<\/strong> All containers share the <strong>host OS kernel<\/strong> and <strong>cannot modify the host kernel<\/strong>.<\/li>\n<li><strong>Layer Limit:<\/strong> An image is immutable and <strong>cannot exceed 128 layers<\/strong> (Ch.07, p.428).<\/li>\n<li><strong>Image Layers vs. Container Layer &amp; Copy-on-Write (CoW — Ch.07, pp. 429–430):<\/strong><\/li>\n<li><strong>Image layers (Read-Only / R/O):<\/strong> Shared across containers; enables incremental pulls/storage.<\/li>\n<li><strong>Container layer (Thin Read/Write / R/W layer):<\/strong> Mounted on top when a container starts.<\/li>\n<li><strong>4 File Operations under CoW:<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Creating a file:<\/strong> Added directly to the top R/W <strong>container layer<\/strong>.<\/li>\n<li><strong>Reading a file:<\/strong> Searched from top layer (<code class=\"inline-code\">upperdir<\/code>/container layer) down to lower image layers (<code class=\"inline-code\">lowerdir<\/code>).<\/li>\n<li><strong>Modifying a file:<\/strong> Looked up from top to bottom; when modified for the first time, the file is <strong>copied from the read-only image layer up to the container layer (<code class=\"inline-code\">copy_up<\/code>)<\/strong> and modified there (<strong>Copy-on-Write<\/strong>).<\/li>\n<li><strong>Deleting a file/directory:<\/strong> Because image layers are read-only, UnionFS creates a <strong>whiteout file<\/strong> (or <strong>opaque directory<\/strong> in OverlayFS) in the R/W container layer to hide the underlying file/directory!<\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s4_image_layers.png\" alt=\"Layered Structure of Container Images (Read-Write Container Layer + R/O Image Layers)\" data-caption=\"Layered Structure of Container Images (Read-Write Container Layer + R/O Image Layers) (Official Reference: p. 429)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Layered Structure of Container Images (Read-Write Container Layer + R/O Image Layers)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 429 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. UnionFS Drivers: AUFS vs. OverlayFS<\/h3>\n<p><strong>UnionFS<\/strong> mounts multiple directories (branches/layers) onto a single unified virtual mount point:<\/p>\n<ul class=\"md-list\">\n<li><strong>AUFS (Advanced Multi-Layered Unification Filesystem — Ch.07, p.432):<\/strong><\/li>\n<li>Stores each image layer and container layer in <code class=\"inline-code\">/var/lib/xxx/aufs/diff/&lt;ID&gt;<\/code>, and presents the unified working directory at <strong><code class=\"inline-code\">/var/lib/xxx/aufs/mnt<\/code><\/strong>.<\/li>\n<li><strong>OverlayFS (<code class=\"inline-code\">overlay<\/code> / <code class=\"inline-code\">overlay2<\/code> — Ch.07, p.433):<\/strong><\/li>\n<li>Simpler deployment and higher performance than AUFS; built on top of <code class=\"inline-code\">ext4<\/code> or <code class=\"inline-code\">xfs<\/code> using <strong>four directories<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">lowerdir<\/code>:<\/strong> Read-only image layers (<code class=\"inline-code\">lowerdir1<\/code>, <code class=\"inline-code\">lowerdir2<\/code>...).<\/li>\n<li><strong><code class=\"inline-code\">upperdir<\/code>:<\/strong> Read-write container layer (stores new, <code class=\"inline-code\">copy_up<\/code>-modified, and whiteout/opaque files).<\/li>\n<li><strong><code class=\"inline-code\">merged<\/code>:<\/strong> Unified view presented to the user/container.<\/li>\n<li><strong><code class=\"inline-code\">workdir<\/code>:<\/strong> Internal working directory (<strong>invisible to users<\/strong>).<\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s4_aufs_layers.png\" alt=\"AUFS Multi-Layered Directory Union Mount Structure\" data-caption=\"AUFS Multi-Layered Directory Union Mount Structure (Official Reference: p. 432)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>AUFS Multi-Layered Directory Union Mount Structure<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 432 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h8s4_overlayfs_layers.png\" alt=\"OverlayFS Structure (lowerdir, upperdir, merged File Overlay)\" data-caption=\"OverlayFS Structure (lowerdir, upperdir, merged File Overlay) (Official Reference: p. 433)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>OverlayFS Structure (lowerdir, upperdir, merged File Overlay)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 433 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Container Image Naming &amp; <code class=\"inline-code\">isula<\/code> Image Commands<\/h3>\n<ul class=\"md-list\">\n<li><strong>Image Naming Format:<\/strong> <strong><code class=\"inline-code\">[registry/][path/]&lt;imagename&gt;[:tag]<\/code><\/strong><\/li>\n<li>If <code class=\"inline-code\">registry/<\/code> is omitted, the configured default public/mirror registry is used.<\/li>\n<li>If <code class=\"inline-code\">:tag<\/code> is omitted, <strong><code class=\"inline-code\">latest<\/code><\/strong> is used by default!<\/li>\n<li><strong><code class=\"inline-code\">isula<\/code> Image Management Commands (Ch.07, pp. 435–438):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">isula images<\/code>:<\/strong> Lists local images on the host.<\/li>\n<li><strong><code class=\"inline-code\">isula inspect &lt;image:tag&gt;<\/code>:<\/strong> Views detailed JSON metadata (e.g., <code class=\"inline-code\">isula inspect nginx:latest<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">isula pull &lt;image&gt;<\/code>:<\/strong> Pulls an image from a registry (<code class=\"inline-code\">isula pull openeuler/busybox:latest<\/code>).<\/li>\n<li><strong>CRITICAL EXAM TRAP (Ch.07, p.436):<\/strong> <strong><code class=\"inline-code\">iSula<\/code> supports the <code class=\"inline-code\">pull<\/code> command and does NOT support the <code class=\"inline-code\">push<\/code> command!<\/strong><\/li>\n<li><strong><code class=\"inline-code\">isula tag &lt;source_image:tag&gt; &lt;target_image:tag&gt;<\/code>:<\/strong> Creates a new tag alias referring to the same <code class=\"inline-code\">IMAGE ID<\/code> (e.g., <code class=\"inline-code\">isula tag openeuler/busybox:latest busybox:test<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">isula rmi &lt;image:tag&gt;<\/code>:<\/strong> Deletes an image from the host (<code class=\"inline-code\">isula rmi busybox:test<\/code>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Pulling, Tagging, Inspecting & Removing Images with `isula`","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are managing container images on an openEuler host (following Ch.07 pp. 435–438). Pull `openeuler/busybox:latest`, re-tag it as `busybox:test`, list all local images to verify they share the same `IMAGE ID`, and then remove the `busybox:test` tag using `isula rmi`.","instructions":["Step 1: Pull the `openeuler/busybox:latest` image using `isula pull openeuler/busybox:latest`.","Step 2: Tag `openeuler/busybox:latest` as `busybox:test` using `isula tag openeuler/busybox:latest busybox:test` and list local images with `isula images`.","Step 3: Delete the `busybox:test` image reference using `isula rmi busybox:test`."],"starter_code":"# Step 1: Pull openeuler/busybox:latest from registry\n<isula_pull_command>\n\n# Step 2: Tag openeuler/busybox:latest as busybox:test and list images\n<isula_tag_command>\n<isula_images_command>\n\n# Step 3: Remove the busybox:test image\n<isula_rmi_command>","solution_code":"# Step 1: Pull openeuler/busybox:latest from registry\nisula pull openeuler/busybox:latest\n\n# Step 2: Tag openeuler/busybox:latest as busybox:test and list images\nisula tag openeuler/busybox:latest busybox:test\nisula images\n\n# Step 3: Remove the busybox:test image\nisula rmi busybox:test","hints":["Use `isula pull openeuler/busybox:latest` (Ch.07 p.436).","Use `isula tag openeuler/busybox:latest busybox:test` and `isula images` (Ch.07 p.437).","Use `isula rmi busybox:test` (Ch.07 p.438)."],"validation_checks":[{"step":1,"description":"Pull image with isula pull","required_any":["isula pull openeuler/busybox"],"feedback_fail":"Use 'isula pull openeuler/busybox:latest'."},{"step":2,"description":"Tag image as busybox:test and list images","required_any":["isula tag openeuler/busybox:latest busybox:test"],"feedback_fail":"Include 'isula tag openeuler/busybox:latest busybox:test' and 'isula images'."},{"step":3,"description":"Remove busybox:test with isula rmi","required_any":["isula rmi busybox:test"],"feedback_fail":"Use 'isula rmi busybox:test' to delete the image tag."}],"simulated_output":"Image \"openeuler/busybox:latest\" pulled\n\nREPOSITORY          TAG      IMAGE ID       CREATED               SIZE\nbusybox             test     81968c526c7a   2026-05-21 17:17:32   517.291MB\nopeneuler/busybox   latest   81968c526c7a   2026-05-21 17:17:32   517.291MB\n\nImage \"busybox:test\" removed","quiz_questions":[{"id":"h8_s4_q1","type":"single","question":"What is the maximum number of layers a container image can have, and what Happens when a file inside a read-only image layer (`lowerdir`) is deleted inside a running container?","options":["A. Max 32 layers; the file is physically erased from `lowerdir` on the host disk","B. Max 128 layers; UnionFS (AUFS/OverlayFS) creates a `whiteout` file in the R/W container layer (`upperdir`) to hide the deleted file","C. Max 1024 layers; the host kernel is recompiled","D. Max 4 layers; the container immediately crashes"],"answer":"B","explanation":"Per Ch.07 (p.428 & p.430–433), an image is immutable and cannot exceed 128 layers. When a file is deleted in a container, UnionFS creates a whiteout file at the R/W container layer (`upperdir`) to block/hide the file without altering the read-only image layer."},{"id":"h8_s4_q2","type":"single","question":"Which four directories are used by `OverlayFS` to construct a union file system, and which one is invisible to users?","options":["A. `bootfs`, `rootfs`, `procfs`, `sysfs` (`procfs` is invisible)","B. `lowerdir`, `upperdir`, `merged`, `workdir` (`workdir` is invisible to users)","C. `diff`, `mnt`, `layers`, `tmp` (`mnt` is invisible)","D. `bin`, `sbin`, `usr`, `var` (`var` is invisible)"],"answer":"B","explanation":"Per Ch.07 (p.433), OverlayFS is constructed and implemented using the `lowerdir`, `upperdir`, `merged`, and `workdir` directories, where `workdir` is invisible to users."},{"id":"h8_s4_q3","type":"multiple","question":"Which of the following statements about container image naming and `isula` image commands are TRUE?","options":["A. In `[registry/][path/]<imagename>[:tag]`, if `:tag` is not specified, `latest` is used by default.","B. `isula` supports the `isula pull` command to download images, and does NOT support the `push` command.","C. `isula tag openeuler/busybox:latest busybox:test` modifies/adds image tag information.","D. `isula rmi <image>` deletes an image on the host."],"answer":"ABCD","explanation":"Per Ch.07 (pp.434–438), all four statements are explicitly documented in the official Huawei training material."}],"reference_figures":[{"slug":"p2_h8s4_image_layers","title":"Layered Structure of Container Images (Read-Write Container Layer + R/O Image Layers)","pdf_page":429},{"slug":"p2_h8s4_overlayfs_layers","title":"OverlayFS Structure (lowerdir, upperdir, merged File Overlay)","pdf_page":433}]}}]}],"mock_exam":{"folder_name":"Hour-09-Final-Mock-Exam","title":"HCIA-openEuler V2.0 — National Stage Final Mock Exam","duration_mins":60,"total_points":1000,"passing_points":800,"instructions":"60 Questions in 60 Minutes: 20 Single-Choice (15 pts each), 20 Multiple-Choice (20 pts each, strict all-or-nothing grading), 10 True/False (10 pts each), and 10 Hands-On openEuler/Shell/iSula Labs (20 pts each).","questions":[{"id":1,"type":"single","points":15,"chapter":"Ch.02 Getting Started with openEuler","question":"(Official Ch.02 Quiz Q2) Which of the following keys can be used in the openEuler Bash shell to quickly supplement (auto-complete) commands, options, and file parameters?","options":["A. Ctrl+L","B. Up and Down arrows","C. Tab","D. Space"],"answer":"C","explanation":"Per Ch.02 (p. 50 & p. 52), pressing Tab automatically completes commands, parameters, or filenames (pressing Tab twice lists all matching commands)."},{"id":2,"type":"single","points":15,"chapter":"Ch.02 Getting Started with openEuler","question":"In the openEuler source code repository, which directory explicitly declares all open-source licenses in use, and what is China's first open-source license adopted by openEuler?","options":["A. /etc/licenses directory; GPLv2","B. LICENSES directory; Mulan PSL (Mulan Permissive Software License)","C. /usr/share/doc directory; MIT","D. COPYRIGHT directory; BSD 3-Clause"],"answer":"B","explanation":"Per Ch.02 (p. 29 & p. 35), in the openEuler code repository the `LICENSES` directory declares the open-source licenses in use, and Mulan is China's first open-source license adopted by openEuler."},{"id":3,"type":"single","points":15,"chapter":"Ch.03 openEuler CLI Basics","question":"(Official Ch.03 Quiz Q1) How many lines of a file are displayed by default when running the `head` command without any `-n` option?","options":["A. 5","B. 10","C. 15","D. 20"],"answer":"B","explanation":"Per Ch.03 (p. 98, p. 141 & p. 151), both `head` and `tail` display 10 lines by default when no line count is specified."},{"id":4,"type":"single","points":15,"chapter":"Ch.03 openEuler CLI Basics","question":"Which Linux virtual directory is a direct mapping of system kernel and memory state, allowing administrators to read CPU, memory, and process info directly?","options":["A. /etc","B. /var","C. /proc","D. /opt"],"answer":"C","explanation":"Per Ch.03 (p. 80), `/proc` is a virtual directory mapping system memory; `/etc` holds configuration files, `/var` stores variable logs/spool data, and `/opt` stores third-party optional applications."},{"id":5,"type":"single","points":15,"chapter":"Ch.03 openEuler CLI Basics","question":"When creating links with `ln`, what happens if you create a symbolic (soft) link with `ln -s target linkname` and later delete the original `target` file?","options":["A. The soft link remains valid and retains a full copy of the original file data","B. The soft link becomes a dangling/invalid link because it only stores the path to the target","C. The kernel automatically converts the soft link into a hard link","D. Both the target and link share the same inode, so data cannot be removed until linkname is deleted"],"answer":"B","explanation":"Per Ch.03 (pp. 115–116), a soft link points to a file path (different inode) and becomes invalid if the source file is deleted, whereas a hard link (`ln` without `-s`) shares the same inode and keeps the data intact until all hard links are deleted."},{"id":6,"type":"single","points":15,"chapter":"Ch.03 openEuler CLI Basics","question":"In Vim Command-line (Last-line) mode, which command globally replaces all occurrences of `foo` with `bar` across the entire file?","options":["A. :s/foo/bar","B. :%s/foo/bar/g","C. :r/foo/bar/all","D. /foo/bar/g"],"answer":"B","explanation":"Per Ch.03 (p. 129), `%` targets all lines in the file and the `g` flag replaces all matches on each line (`:%s/foo/bar/g`)."},{"id":7,"type":"single","points":15,"chapter":"Ch.04 openEuler System Configuration","question":"(Official Ch.04 Quiz Q1) Which of the following commands can be used to dynamically check host resource usage (CPU, memory, load average, and running processes) in real time?","options":["A. ps","B. top","C. free","D. lscpu"],"answer":"B","explanation":"Per Ch.04 (p. 249), `top` dynamically monitors real-time CPU, memory, and process resource usage; `ps` shows a static snapshot, `free` displays memory only, and `lscpu` displays CPU hardware architecture."},{"id":8,"type":"single","points":15,"chapter":"Ch.04 openEuler System Configuration","question":"If the current shell `umask` is `0022`, what are the default numeric permissions assigned to a newly created regular file and a newly created directory respectively?","options":["A. File: 666; Directory: 777","B. File: 755; Directory: 644","C. File: 644; Directory: 755","D. File: 600; Directory: 700"],"answer":"C","explanation":"Per Ch.04 (p. 183), default base permissions are `666` for regular files (no execute bit by default) and `777` for directories. Subtracting `022` gives `644` (`rw-r--r--`) for files and `755` (`rwxr-xr-x`) for directories."},{"id":9,"type":"single","points":15,"chapter":"Ch.04 openEuler System Configuration","question":"In `/etc/passwd`, which two colon-separated columns represent the user's UID and login shell respectively?","options":["A. 2nd column and 6th column","B. 3rd column and 7th column","C. 4th column and 5th column","D. 1st column and 7th column"],"answer":"B","explanation":"Per Ch.04 (p. 161), `/etc/passwd` has 7 fields: `1:username`, `2:password placeholder (x)`, `3:UID`, `4:GID`, `5:description`, `6:home directory`, `7:login shell`."},{"id":10,"type":"single","points":15,"chapter":"Ch.04 openEuler System Configuration","question":"When sending process termination signals using `kill`, what is the key difference between signal `15 (SIGTERM)` and signal `9 (SIGKILL)`?","options":["A. Signal 15 pauses a process; Signal 9 resumes it","B. Signal 15 requests graceful termination (can be caught/ignored); Signal 9 forces unconditional immediate termination by the kernel","C. Signal 9 reloads configuration files without stopping the PID","D. Signal 15 can only be executed by root, while Signal 9 is for regular users"],"answer":"B","explanation":"Per Ch.04 (p. 234), Signal 15 (`SIGTERM`, default for `kill PID`) allows a process to clean up and exit gracefully, whereas Signal 9 (`SIGKILL`) cannot be caught or ignored and terminates the process unconditionally."},{"id":11,"type":"single","points":15,"chapter":"Ch.05 Storage and Network Management","question":"(Official Ch.05 Quiz Q2) Which of the following commands correctly formats the `/dev/hdb6` partition with the ext4 file system?","options":["A. mkfs -t ext4 /dev/hdb6","B. format -t ext4 /dev/hdb6","C. format /dev/hdb6","D. makefile -t ext4 /dev/hdb6"],"answer":"A","explanation":"Per Ch.05 (p. 279 & p. 318), `mkfs -t <fstype> <device>` (or `mkfs.ext4 /dev/hdb6`) formats a partition on openEuler."},{"id":12,"type":"single","points":15,"chapter":"Ch.05 Storage and Network Management","question":"Under the traditional MBR disk partitioning scheme for a SCSI disk, what are the maximum disk capacity and partition limits?","options":["A. Max 16 TB; up to 128 primary partitions","B. Max 2 TB; up to 4 primary partitions (or 3 primary + 1 extended) and at most 15 partitions total on a SCSI disk","C. Max 2 TB; unlimited primary partitions","D. Max 4 TB; up to 8 primary partitions"],"answer":"B","explanation":"Per Ch.05 (pp. 269 & 273), MBR has a 2 TB limit and allows up to 4 primary partitions (or 3 primary + 1 extended containing logical partitions, capped at 15 total partitions on SCSI disks), whereas GPT breaks the 2 TB limit and supports 128 primary partitions."},{"id":13,"type":"single","points":15,"chapter":"Ch.05 Storage and Network Management","question":"In LVM online expansion of an `xfs` file system after running `lvextend -L +5G /dev/vg01/lv01`, which command grows the XFS file system to occupy the newly added space?","options":["A. resize2fs /dev/vg01/lv01","B. xfs_growfs /mount_point","C. e2fsck -f /dev/vg01/lv01","D. pvresize /dev/vg01/lv01"],"answer":"B","explanation":"Per Ch.05 (p. 298), `resize2fs` resizes ext2/ext3/ext4 file systems, while `xfs_growfs <mount_point>` (or `xfs_growfs <lv_device>`) expands mounted XFS file systems online."},{"id":14,"type":"single","points":15,"chapter":"Ch.05 Storage and Network Management","question":"When shrinking an ext4 Logical Volume (LV) offline, what is the mandatory safe sequence of operations?","options":["A. lvreduce -> resize2fs -> e2fsck -f -> umount","B. umount -> e2fsck -f -> resize2fs -> lvreduce -> mount","C. resize2fs -> lvreduce -> umount -> mount","D. umount -> lvreduce -> resize2fs -> mount"],"answer":"B","explanation":"Per Ch.05 (p. 299), you MUST unmount first (`umount`), check the filesystem (`e2fsck -f`), shrink the filesystem (`resize2fs`), shrink the LV (`lvreduce`), and finally remount (`mount`). Shrinking the LV before shrinking the filesystem destroys data!"},{"id":15,"type":"single","points":15,"chapter":"Ch.06 Shell Scripts","question":"(Official Ch.06 Quiz Q1) What is the meaning of the `*` operator in a shell script arithmetic expression such as `$((a * b))`?","options":["A. Summation","B. Multiplication","C. Subtraction","D. Division"],"answer":"B","explanation":"Per Ch.06 (p. 351 & p. 379), `*` performs arithmetic multiplication in shell arithmetic expressions (note: when using `expr`, `*` must be escaped as `\\*` to avoid shell glob expansion)."},{"id":16,"type":"single","points":15,"chapter":"Ch.06 Shell Scripts","question":"Which special Bash variable retrieves the exit code of the most recently executed foreground command, and which value indicates success?","options":["A. `#`; 1 indicates success","B. `?`; 0 indicates success","C. `$`; 0 indicates success","D. `@`; 255 indicates success"],"answer":"B","explanation":"Per Ch.06 (p. 372), `?` stores the exit status of the previous command, where `0` means success and any non-zero value (1–255) indicates an error."},{"id":17,"type":"single","points":15,"chapter":"Ch.06 Shell Scripts","question":"Which Bash command-line flag executes a shell script in debugging mode, printing each expanded command prefixed with `+` before executing it?","options":["A. bash -d script.sh","B. bash -x script.sh","C. bash -v script.sh","D. bash -n script.sh"],"answer":"B","explanation":"Per Ch.06 (pp. 370–371), `bash -x script.sh` enables execution tracing (debugging mode), printing each command and its expanded arguments prior to execution."},{"id":18,"type":"single","points":15,"chapter":"Ch.07 Native Container Engine iSula","question":"What is the configuration precedence order (highest to lowest priority) for the `iSulad` container daemon?","options":["A. /etc/isulad/daemon.json > CLI arguments > default code settings","B. CLI arguments (or /etc/sysconfig/iSulad OPTIONS) > /etc/isulad/daemon.json > default configurations in code","C. Default configurations in code > /etc/isulad/daemon.json > CLI arguments","D. Environment variables > /etc/cni/net.d > CLI arguments"],"answer":"B","explanation":"Per Ch.07 (p. 401), iSulad configuration priority is strictly: `CLI > configuration file (/etc/isulad/daemon.json) > default configurations in code`. Modifying `OPTIONS` in `/etc/sysconfig/iSulad` is equivalent to CLI configuration."},{"id":19,"type":"single","points":15,"chapter":"Ch.07 Native Container Engine iSula","question":"In the `OverlayFS` union file system used by container images, which directory acts as an internal scratch directory and is invisible to users?","options":["A. lowerdir","B. upperdir","C. merged","D. workdir"],"answer":"D","explanation":"Per Ch.07 (p. 433), OverlayFS uses `lowerdir` (read-only image layers), `upperdir` (writable container layer), `merged` (unified mount point), and `workdir` (internal helper directory invisible to users)."},{"id":20,"type":"single","points":15,"chapter":"Ch.07 Native Container Engine iSula","question":"Which southbound OCI container runtime does `iSulad` use by default, and which network mode does `iSula` currently support with CNI?","options":["A. runC; overlay network mode","B. LCR (Lightweight Container Runtime); bridge network mode","C. containerd; macvlan network mode","D. Kata; host-only mode"],"answer":"B","explanation":"Per Ch.07 (p. 394 & p. 420), iSula uses LCR as its default southbound OCI runtime (while also supporting runC/Kata) and currently supports `bridge` mode for CNI networking."},{"id":21,"type":"multiple","points":20,"chapter":"Ch.01 OS for the AI Era","question":"Which of the following are core intelligent O&M and AI capabilities provided by the `openEuler Intelligence` platform?","options":["A. Intelligent Q&A (Natural language interaction, OCR, and knowledge retrieval via RAG)","B. AI Application Development Framework (Agents and workflow orchestration)","C. Intelligent Optimization (AI-assisted parameter tuning and performance optimization)","D. Intelligent Diagnosis & Intelligent Container Image analysis"],"answer":"ABCD","explanation":"Per Ch.01 (pp. 8–16), openEuler Intelligence delivers all four capability pillars: Intelligent Q&A, AI Application Development Framework, Intelligent Optimization, Intelligent Diagnosis, and Intelligent Container Images."},{"id":22,"type":"multiple","points":20,"chapter":"Ch.02 Getting Started with openEuler","question":"According to Richard Stallman and the Free Software Foundation (FSF), which four essential freedoms define Free Software?","options":["A. Freedom to run the program for any purpose","B. Freedom to study/learn how the program works and modify the source code","C. Freedom to redistribute copies of the program","D. Freedom to create and distribute modified derivative versions"],"answer":"ABCD","explanation":"Per Ch.02 (p. 29), FSF defines four freedoms: run for any purpose (0), learn and modify source code (1), redistribute programs (2), and create/distribute derivatives (3)."},{"id":23,"type":"multiple","points":20,"chapter":"Ch.02 Getting Started with openEuler","question":"Which of the following statements about openEuler releases and licenses are TRUE?","options":["A. Mulan PSL covers five major aspects: copyright license, patent license, non-trademark license, distribution restriction, and disclaimer/liability limitation.","B. BSD permits modifying, redistributing, and developing commercial software based on the open-source code.","C. Before contributing code to the openEuler community on Gitee, contributors must sign a Contributor License Agreement (CLA).","D. openEuler Innovation releases receive a 6-year enterprise support lifecycle, whereas LTS releases receive only 6 months."],"answer":"ABC","explanation":"Per Ch.02 (pp. 29–36), A, B, and C are true. D is reversed: openEuler LTS (Long Term Support) versions are released every 2 years with long-term maintenance, while Innovation versions are released every 6 months with shorter maintenance."},{"id":24,"type":"multiple","points":20,"chapter":"Ch.03 openEuler CLI Basics","question":"Which of the following help commands can be used on openEuler to inspect command usage, manuals, or brief one-line descriptions?","options":["A. man <command>","B. <command> --help","C. help <builtin_command>","D. whatis <command>"],"answer":"ABCD","explanation":"Per Ch.03 (pp. 65–69), `man` queries `/usr/share/man/*.gz` manual pages, `--help` queries external command options, `help` queries shell built-in commands, and `whatis` prints a brief summary from the man database."},{"id":25,"type":"multiple","points":20,"chapter":"Ch.03 openEuler CLI Basics","question":"Which of the following statements about `tar` and `gzip` archive/compression operations on openEuler are TRUE?","options":["A. `gzip` typically achieves a 60%–70% compression ratio and replaces the original uncompressed file with a `.gz` file by default.","B. `tar -czvf backup.tar.gz /etc/hosts` creates a gzip-compressed tar archive.","C. `tar -tf backup.tar.gz` lists the contents of an archive without extracting it.","D. `tar -xzvf backup.tar.gz -C /tmp` extracts the archive into `/tmp`."],"answer":"ABCD","explanation":"Per Ch.03 (pp. 111–114), all four statements accurately describe `gzip` and `tar` flags (`-c` create, `-x` extract, `-t` list, `-z` gzip, `-v` verbose, `-f` archive file, `-C` target directory)."},{"id":26,"type":"multiple","points":20,"chapter":"Ch.03 openEuler CLI Basics","question":"Which of the following Linux text processing commands and options are matched with their TRUE functions?","options":["A. `grep -i` performs case-insensitive pattern matching; `grep -v` inverts the match (prints non-matching lines).","B. `cut -d ':' -f 1,7 /etc/passwd` extracts the 1st and 7th colon-delimited fields.","C. `wc -l` counts lines, while `sort -n -r` sorts numerically in descending order.","D. `awk -F ':' '{print 1}' /etc/passwd` prints the first field of each line using `:` as the field separator."],"answer":"ABCD","explanation":"Per Ch.03 (pp. 143–147), all four statements accurately describe `grep`, `cut`, `wc`, `sort`, and `awk`."},{"id":27,"type":"multiple","points":20,"chapter":"Ch.04 openEuler System Configuration","question":"Which of the following statements about Linux file types and `chmod`/`chown`/`sticky bit` permissions are TRUE?","options":["A. The 7 Linux file types shown by `ls -l` are `-` (regular), `d` (directory), `l` (symlink), `b` (block), `c` (character), `p` (named pipe), and `s` (socket).","B. Setting the sticky bit (`chmod o+t /share` or `chmod 1777 /share`) ensures that only the file owner, directory owner, or root can delete or rename files inside `/share`.","C. `chown -R user1:group1 /data` recursively changes both the owner and the owning group of `/data`.","D. If `ls -l` displays a `+` sign right after the permission string (e.g., `-rw-r--r--+`), the file has an extended Access Control List (ACL) configured."],"answer":"ABCD","explanation":"Per Ch.04 (pp. 172, 178–185), all four statements are directly confirmed in the official openEuler System Configuration chapter."},{"id":28,"type":"multiple","points":20,"chapter":"Ch.04 openEuler System Configuration","question":"Which of the following statements about RPM and DNF software package management on openEuler are TRUE?","options":["A. `rpm -qa` queries all installed RPM packages, while `rpm -qf /usr/bin/vim` queries which package owns that file.","B. `/etc/dnf/dnf.conf` is the main global configuration file for DNF, and repository `.repo` files reside in `/etc/yum.repos.d/`.","C. Running `rpm -e --nodeps <pkg>` removes a package while ignoring dependencies, which may break dependent software.","D. `dnf` resolves package dependencies automatically, whereas `rpm -ivh` requires dependencies to be resolved manually."],"answer":"ABCD","explanation":"Per Ch.04 (pp. 195–214), all four statements accurately contrast `rpm` and `dnf` operations on openEuler."},{"id":29,"type":"multiple","points":20,"chapter":"Ch.04 openEuler System Configuration","question":"Which of the following `systemctl` and `journald` commands are valid for managing services and inspecting logs on openEuler?","options":["A. `systemctl enable --now httpd` enables the service at boot and starts it immediately.","B. `systemctl status sshd` displays the running status, PID, and recent log lines of `sshd`.","C. `journalctl -u sshd` queries systemd journal logs specifically for the `sshd` unit.","D. A standard systemd `.service` unit file contains three main sections: `[Unit]`, `[Service]`, and `[Install]`."],"answer":"ABCD","explanation":"Per Ch.04 (pp. 216–223), all four statements accurately describe `systemd`, `systemctl`, and `journald`."},{"id":30,"type":"multiple","points":20,"chapter":"Ch.04 openEuler System Configuration","question":"Which of the following statements about process scheduling priority (`nice`), background jobs, and scheduled tasks (`at`/`crontab`) are TRUE?","options":["A. The `nice` value ranges from `-20` (highest priority) to `+19` (lowest priority), and only `root` can assign negative nice values.","B. Pressing `Ctrl+Z` suspends a foreground job and puts it in the background in Stopped state; `bg %1` resumes it in the background, and `fg %1` brings it back to the foreground.","C. `at` schedules a one-time task (`Ctrl+D` saves the job), while `crontab` schedules recurring periodic tasks using 5 time fields (`min hour dom month dow`).","D. Non-root users can execute `renice -n -10 -p <PID>` to increase the priority of any system process."],"answer":"ABC","explanation":"Per Ch.04 (pp. 229–248), A, B, and C are true. D is false because regular users can only lower priority (increase nice value toward +19) for their own processes; only `root` can assign negative nice values."},{"id":31,"type":"multiple","points":20,"chapter":"Ch.05 Storage and Network Management","question":"Which of the following statements about persistent storage, `parted`, and `/etc/fstab` are TRUE?","options":["A. On openEuler, `ext4` and `xfs` are common disk file systems; `blkid` and `lsblk -f` inspect block device UUIDs and file system types.","B. `parted` supports both MBR and GPT partitioning schemes and can run in both interactive mode and non-interactive script mode.","C. In `/etc/fstab`, the 6 columns in order are: Device/UUID, Mount Point, File System Type, Mount Options, Dump backup flag, and fsck Pass order.","D. Setting the `noatime` option in `/etc/fstab` disables updating access timestamps on reads and improves file system performance."],"answer":"ABCD","explanation":"Per Ch.05 (pp. 257–282), all four statements match the official Storage Management slides."},{"id":32,"type":"multiple","points":20,"chapter":"Ch.05 Storage and Network Management","question":"Which of the following statements accurately describe Logical Volume Management (LVM) layers and commands on openEuler?","options":["A. The LVM hierarchy flows bottom-up: Physical Disk/Partition -> Physical Volume (`pvcreate`) -> Volume Group (`vgcreate`) -> Logical Volume (`lvcreate`) -> File System (`mkfs`).","B. A Volume Group (VG) divides storage into fixed-size Physical Extents (PEs), which default to 4 MiB.","C. `vgextend vg01 /dev/sdc1` adds a new Physical Volume into an existing Volume Group `vg01`.","D. `lvcreate -L 10G -n lv_data vg01` creates a 10 GiB Logical Volume named `lv_data` inside `vg01`."],"answer":"ABCD","explanation":"Per Ch.05 (pp. 284–297), all four statements correctly describe LVM concepts and commands."},{"id":33,"type":"multiple","points":20,"chapter":"Ch.05 Storage and Network Management","question":"Which of the following `nmcli` and network diagnostic commands are valid on openEuler?","options":["A. `nmcli con add con-name \"Euler\" type Ethernet ifname enp3s0` creates a new Ethernet connection profile.","B. `nmcli con mod \"Euler\" +ipv4.routes \"192.168.10.0/24 10.0.0.1\"` appends a persistent static route to the connection.","C. `ss -tulnp` inspects listening TCP/UDP sockets along with their owning process PIDs.","D. `tracepath <destination>` traces the network hop path and path MTU to a remote host."],"answer":"ABCD","explanation":"Per Ch.05 (pp. 308–317), all four statements accurately reflect NetworkManager (`nmcli`), `ss`, and `tracepath` usage on openEuler."},{"id":34,"type":"multiple","points":20,"chapter":"Ch.06 Shell Scripts","question":"Which of the following statements about Bash I/O redirection, pipes, and quoting are TRUE?","options":["A. File descriptors `0`, `1`, and `2` correspond to Standard Input (stdin), Standard Output (stdout), and Standard Error (stderr).","B. `command &> output.log` redirects both stdout and stderr to `output.log` (overwriting its content).","C. Single quotes (`'...'`) preserve literal characters and prevent variable/command expansion, whereas double quotes (`\"...\"`) allow `var` and `(cmd)` expansion.","D. A pipe (`cmd1 | cmd2`) sends the stdout of `cmd1` directly as the stdin of `cmd2`."],"answer":"ABCD","explanation":"Per Ch.06 (pp. 338–347), all four statements are true."},{"id":35,"type":"multiple","points":20,"chapter":"Ch.06 Shell Scripts","question":"Which of the following statements about Bash variables, test conditions, and loops are TRUE?","options":["A. `#` gives the number of positional arguments passed to a script, while `0` is the script's own name.","B. In `[ ... ]` test expressions, `-eq` and `-gt` compare integers, while `=` and `-z` evaluate strings.","C. `[ -d /etc/dnf ]` returns exit code 0 (true) if `/etc/dnf` exists and is a directory.","D. In loops, `break` exits the entire enclosing loop immediately, whereas `continue` skips the rest of the current iteration and jumps to the next iteration."],"answer":"ABCD","explanation":"Per Ch.06 (pp. 345–366), all four statements are core Bash scripting fundamentals covered in the training material."},{"id":36,"type":"multiple","points":20,"chapter":"Ch.06 Shell Scripts","question":"When comparing a `while` loop and an `until` loop in Bash, which of the following statements are TRUE?","options":["A. A `while` loop continues executing as long as its test condition evaluates to TRUE (exit code 0).","B. An `until` loop continues executing as long as its test condition evaluates to FALSE (non-zero exit code), and stops once the condition becomes TRUE.","C. Both `while` and `until` loops enclose their loop body between `do` and `done`.","D. In `i++` (post-increment), the current value of `i` is returned first and then `i` is incremented by 1."],"answer":"ABCD","explanation":"Per Ch.06 (pp. 353 & 365–367), all four statements are true."},{"id":37,"type":"multiple","points":20,"chapter":"Ch.07 Native Container Engine iSula","question":"(Official Ch.07 Quiz Q1) Which of the following are valid container states in `iSula`?","options":["A. Created","B. Exited","C. Up","D. Paused"],"answer":"ABCD","explanation":"Per Ch.07 (p. 439), all four (`Created`, `Exited`, `Up`, and `Paused`) are container states displayed by `isula ps -a`."},{"id":38,"type":"multiple","points":20,"chapter":"Ch.07 Native Container Engine iSula","question":"Which Linux kernel mechanisms provide container isolation and resource limits, and what makes `iSula` distinct from Docker?","options":["A. Linux `Namespaces` provide isolation (PID, NET, MNT, IPC, UTS, User), while `cgroups` enforce CPU/memory/I/O resource quotas.","B. `iSulad` is written in C/C++ (unlike Go-based Docker), giving it a smaller memory footprint and ~35% faster concurrent container startup.","C. `iSula` provides northbound CLI and Kubernetes CRI interfaces and southbound OCI interfaces (`LCR`, `runC`, `Kata`).","D. `iSula` can manage both lightweight application containers and system containers."],"answer":"ABCD","explanation":"Per Ch.07 (pp. 390–398), all four statements describe kernel container primitives and `iSula` architectural advantages."},{"id":39,"type":"multiple","points":20,"chapter":"Ch.07 Native Container Engine iSula","question":"Which of the following `isula` CLI commands perform the stated container lifecycle operations?","options":["A. `isula exec -it mybox /bin/sh` runs an interactive shell inside a running container named `mybox`.","B. `isula logs mybox` retrieves stdout/stderr logs generated by container `mybox`.","C. `isula inspect mybox` outputs detailed low-level JSON metadata (IP, mounts, state) for `mybox`.","D. `isula rm -f mybox` forcibly deletes a container (even if currently running)."],"answer":"ABCD","explanation":"Per Ch.07 (pp. 405–417), all four `isula` lifecycle commands are valid and follow Docker-compatible CLI semantics."},{"id":40,"type":"multiple","points":20,"chapter":"Ch.07 Native Container Engine iSula","question":"Which of the following statements about container image layering and Copy-on-Write (CoW) in `iSula` are TRUE?","options":["A. A container image consists of read-only image layers (rootfs/app layers), and running a container mounts a thin read-write container layer on top.","B. When a container attempts to modify a file located in a read-only `lowerdir`, OverlayFS performs a `copy_up` operation to copy the file into `upperdir` before modifying it.","C. Deleting a file that resides in a read-only image layer creates a `whiteout` file in `upperdir` to hide it without modifying the underlying image.","D. `isula pull`, `isula tag`, `isula images`, and `isula rmi` manage local container images on the host."],"answer":"ABCD","explanation":"Per Ch.07 (pp. 428–438), all four statements accurately describe UnionFS/OverlayFS CoW mechanics and image commands."},{"id":41,"type":"tf","points":10,"chapter":"Ch.01 OS for the AI Era","question":"(Official Ch.01 Quiz Q1) The `openEuler Intelligence` platform currently supports two interaction entries: Web entry and Intelligent Shell entry.","options":["A. True","B. False"],"answer":"A","explanation":"Per Ch.01 (p. 8 & p. 20), openEuler Intelligence explicitly exposes two interaction entries: Web and Intelligent Shell."},{"id":42,"type":"tf","points":10,"chapter":"Ch.02 Getting Started with openEuler","question":"(Official Ch.02 Quiz Q1) You do not need to specify the password of the `root` user during the openEuler OS installation; however, you must specify the password of the `root` user when logging in to the OS after the installation.","options":["A. True","B. False"],"answer":"A","explanation":"Per Ch.02 (p. 52), the official quiz states this is True (when root account is skipped or locked/deferred in installer if an admin user is created, or per the official quiz Q1 answer key: True)."},{"id":43,"type":"tf","points":10,"chapter":"Ch.03 openEuler CLI Basics","question":"In the openEuler filesystem, `less` allows only forward
