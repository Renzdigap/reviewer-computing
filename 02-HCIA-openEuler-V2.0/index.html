 (downward) page scrolling and cannot scroll backward, whereas `more` supports full bidirectional scrolling.","options":["A. True","B. False"],"answer":"B","explanation":"Per Ch.03 (p. 104 & pp. 137–139), it is the opposite: `more` only moves forward, while `less` supports both upward and downward scrolling as well as `/` and `?` searching."},{"id":44,"type":"tf","points":10,"chapter":"Ch.03 openEuler CLI Basics","question":"Running `locate myfile.conf` searches an internal file index database (`mlocate.db`), so newly created files may not appear until `updatedb` is executed.","options":["A. True","B. False"],"answer":"A","explanation":"Per Ch.03 (pp. 108–109), `locate` queries a pre-built database rather than scanning live disks like `find`, so `updatedb` must be run to index newly created files."},{"id":45,"type":"tf","points":10,"chapter":"Ch.04 openEuler System Configuration","question":"The `su root` command switches identity to `root` AND resets all environment variables (including `PATH` and `HOME`) to `root`'s login environment, making it completely identical to `su - root`.","options":["A. True","B. False"],"answer":"B","explanation":"Per Ch.04 (p. 191), `su` changes the user identity WITHOUT starting a login shell or loading the target user's environment variables, whereas `su -` (or `su -l`) switches to a full login shell with the target user's environment."},{"id":46,"type":"tf","points":10,"chapter":"Ch.04 openEuler System Configuration","question":"Unlike `at`, which uses `cron` daemon configuration files, `crontab -e` edits a user's personal periodic schedule, and modifying it immediately notifies `crond` without requiring a service restart.","options":["A. True","B. False"],"answer":"A","explanation":"Per Ch.04 (pp. 244–247), editing crontab with `crontab -e` automatically updates and reloads the user's cron schedule in `crond`."},{"id":47,"type":"tf","points":10,"chapter":"Ch.05 Storage and Network Management","question":"(Official Ch.05 Quiz Q1) The `route` command can view or configure host route information, and route entries configured with `route add` remain valid permanently across system reboots.","options":["A. True","B. False"],"answer":"B","explanation":"Per Ch.05 (p. 318), routes added via the `route` command take effect temporarily in runtime kernel memory and are LOST upon reboot; use `nmcli` or route config files for persistence."},{"id":48,"type":"tf","points":10,"chapter":"Ch.06 Shell Scripts","question":"(Official Ch.06 Quiz Q2) An administrator can run the `name==Tom` command in a Bash script to assign the value `Tom` to the variable `name`.","options":["A. True","B. False"],"answer":"B","explanation":"Per Ch.06 (p. 346 & p. 379), variable assignment in Bash uses a single `=` with NO spaces around it (`name=Tom`), NOT `==`."},{"id":49,"type":"tf","points":10,"chapter":"Ch.06 Shell Scripts","question":"If a shell script does not have execute (`+x`) permission, it cannot be invoked directly via `./script.sh`, but it can still be executed via `bash script.sh` or `sh script.sh`.","options":["A. True","B. False"],"answer":"A","explanation":"Per Ch.06 (p. 334), `./script.sh` requires read+execute permission, whereas passing the file to an interpreter (`bash script.sh`) only requires read permission."},{"id":50,"type":"tf","points":10,"chapter":"Ch.07 Native Container Engine iSula","question":"A container started in `iSula` with `-v /root/test2.txt:/tmp/test2.txt:ro` allows processes inside the container to modify `/tmp/test2.txt` and persist those edits to the host.","options":["A. True","B. False"],"answer":"B","explanation":"Per Ch.07 (p. 426), the `:ro` mount option mounts the host path as **read-only** inside the container; `:rw` is required for read-write persistence."},{"id":51,"type":"lab","points":20,"chapter":"Ch.03 openEuler CLI Basics","question":"Lab 1 (Text Processing Pipeline): Complete the command pipeline to extract all lines from `/etc/passwd` whose login shell ends with `bash`, then print ONLY column 1 (username) and column 7 (shell) using `awk` with `:` as delimiter.","starter_code":"____ 'bash' /etc/passwd | ____ ____ ':' '{print 1, 7}'","accepted_keywords":["grep","awk","-f","1","7"],"solution":"grep 'bash' /etc/passwd | awk -F ':' '{print 1, 7}'","options":[],"answer":"grep 'bash' /etc/passwd | awk -F ':' '{print 1, 7}'","explanation":"Per Ch.03 (pp. 144–145), `grep 'bash' /etc/passwd` matches lines ending with `bash`, and `awk -F ':' '{print 1, 7}'` splits on `:` to display username and shell."},{"id":52,"type":"lab","points":20,"chapter":"Ch.03 openEuler CLI Basics","question":"Lab 2 (Archive & Symbolic Link): Write two commands: (1) create a gzip-compressed tar archive `/tmp/etc_conf.tar.gz` from `/etc/hosts`, and (2) create a symbolic (soft) link `/tmp/hosts.link` pointing to `/etc/hosts`.","starter_code":"tar ____ /tmp/etc_conf.tar.gz /etc/hosts\nln ____ /etc/hosts /tmp/hosts.link","accepted_keywords":["tar","-czvf","ln -s"],"solution":"tar -czvf /tmp/etc_conf.tar.gz /etc/hosts\nln -s /etc/hosts /tmp/hosts.link","options":[],"answer":"tar -czvf /tmp/etc_conf.tar.gz /etc/hosts\nln -s /etc/hosts /tmp/hosts.link","explanation":"Per Ch.03 (pp. 113–117), `tar -czvf` creates a gzip-compressed archive and `ln -s` creates a symbolic link (omitting `-s` would create a hard link)."},{"id":53,"type":"lab","points":20,"chapter":"Ch.04 openEuler System Configuration","question":"Lab 3 (User & ACL Permissions): Write two commands: (1) add existing user `alice` to supplementary group `wheel` WITHOUT removing her existing groups, and (2) grant user `alice` read-write-execute (`rwx`) ACL permission on `/opt/app.log`.","starter_code":"usermod ____ wheel alice\nsetfacl ____ u:alice:rwx /opt/app.log","accepted_keywords":["usermod","-ag","setfacl","-m","u:alice:rwx"],"solution":"usermod -aG wheel alice\nsetfacl -m u:alice:rwx /opt/app.log","options":[],"answer":"usermod -aG wheel alice\nsetfacl -m u:alice:rwx /opt/app.log","explanation":"Per Ch.04 (pp.     function escHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function fmtText(s) {
      if (!s) return '';
      let out = String(s);
      out = out.replace(/\\text\{([^}]+)\}/g, '$1')
               .replace(/\\mathbf\{([^}]+)\}/g, '$1')
               .replace(/\\texttt\{([^}]+)\}/g, '`$1`')
               .replace(/\\times/g, '×')
               .replace(/\\ge/g, '≥')
               .replace(/\\le/g, '≤')
               .replace(/\\ne\b/g, '≠')
               .replace(/\\lg\s+([A-Za-z0-9]+)/g, 'lg($1)')
               .replace(/\$(?!\s*[\{\(])([^$\n\r]+?)\$/g, '$1');
      out = escHtml(out);
      out = out.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return out;
    }
    function normWS(s) {
      return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

        const itemsHtml = hUnits.map(({ u, idx }) => {
          const isDone = !!prog[u.uid]?.completed;
          const isActive = idx === currentIdx;
          return `<div class="unit-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="selectUnit(${idx})">

    function spaRunCode() {
      const u = UNITS[currentIdx];

      const checks = ex.validation_checks || [];
      let allPass = true;
      let logs = ['[GRADER] Validating your commands/code...\n'];

      checks.forEach((chk, i) => {
        const reqs = chk.required_any || [];
        const ok = reqs.length === 0 || reqs.some(r => codeNorm.includes(normWS(r)));
        const li = document.getElementById(`spa-inst-${i}`);
        if (ok) {
          if (li) li.classList.add('passed');
          logs.push(`[PASS] Step ${i+1} : ${chk.description}`);
        } else {
          if (li) li.classList.remove('passed');
          allPass = false;
          logs.push(`[FAIL] Step ${i+1} : ${chk.description}\n   ${chk.feedback_fail}`);
        }
      });

      const st = document.getElementById('spa-status');
      if (allPass) {
        st.style.color = '#34d399';
        st.textContent = 'All Steps Passed!';
        logs.push('\n--- SIMULATED OUTPUT ---');
        logs.push(ex.simulated_output || 'Execution succeeded.');
        markDone(u.uid);
      } else {
        st.style.color = '#fbbf24';
        st.textContent = 'Incomplete';
      }
      document.getElementById('spa-console').textContent = logs.join('\n');
    }

    function spaGradeQuiz() {
      const u = UNITS[currentIdx];
      const qs = u.sprint.exercise.quiz_questions || [];
      let corr = 0;
      qs.forEach((q, i) => {
        const sel = Array.from(document.querySelectorAll(`input[name="spa_q_${i}"]:checked`))
          .map(x => x.value).sort().join('');
        const ans = (q.answer || '').toUpperCase().replace(/[^A-Z]/g, '').split('').sort().join('');
        const exp = document.getElementById(`spa-q-exp-${i}`);
        exp.style.display = 'block';
        if (sel === ans) {
          corr++;
          exp.style.background = 'rgba(16,185,129,0.15)';
          exp.style.border = '1px solid rgba(16,185,129,0.4)';
          exp.innerHTML = `<strong>[CORRECT] (${ans})!</strong> ${fmtText(q.explanation || '')}`;
        } else {
          exp.style.background = 'rgba(225,29,72,0.15)';
          exp.style.border = '1px solid rgba(225,29,72,0.4)';
          exp.innerHTML = `<strong>[INCORRECT] Your answer: ${sel || 'None'} | Official: ${ans}</strong><br/>${fmtText(q.explanation || '')}`;
        }
      });
      const res = document.getElementById('spa-quiz-result');
      res.innerHTML = `<div style="padding:10px;background:#1e293b;border-radius:6px;font-weight:700;">
        Score: ${corr} / ${qs.length}
        ${corr === qs.length ? '<button class="btn-primary" style="margin-left:12px;padding:5px 12px;font-size:12px;" onclick="markDone(\'' + u.uid + '\'); stepNav(1);">Next Unit</button>' : ''}
      </div>`;
      if (corr === qs.length) markDone(u.uid);
    }

    selectUnit(0);
  </script>

  <div id="img-lightbox" class="img-lightbox" onclick="if(event.target===this) closeImgZoom()">
    <div class="img-lightbox-box">
      <img id="img-lightbox-target" src="" alt="Zoomed Diagram" />
    </div>
    <div class="img-lightbox-bar">
      <span id="img-lightbox-caption"></span>
      <button type="button" class="img-lightbox-close" onclick="closeImgZoom()">Close</button>
    </div>
  </div>
  <script>
    function openImgZoom(imgEl) {
      if (!imgEl) return;
      document.getElementById('img-lightbox-target').src = imgEl.src;
      document.getElementById('img-lightbox-caption').textContent = imgEl.getAttribute('data-caption') || imgEl.alt || '';
      document.getElementById('img-lightbox').classList.add('open');
    }
    function closeImgZoom() {
      document.getElementById('img-lightbox').classList.remove('open');
      document.getElementById('img-lightbox-target').src = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeImgZoom();
    });
  </script>

</body>
</html>
