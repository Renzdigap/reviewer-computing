only non-blank lines.","Use `head -n 3 /etc/passwd` and `head -n -40 /etc/passwd`.","Use `tail -n 3 /etc/passwd`."],"validation_checks":[{"step":1,"description":"Number non-blank lines of /etc/profile with cat -b","required_any":["cat -b /etc/profile"],"feedback_fail":"Use 'cat -b /etc/profile' to number non-blank lines."},{"step":2,"description":"Use head -n 3 and head -n -40 on /etc/passwd","required_any":["head -n -40 /etc/passwd"],"feedback_fail":"Include both 'head -n 3 /etc/passwd' and 'head -n -40 /etc/passwd'."},{"step":3,"description":"Display last 3 lines of /etc/passwd with tail -n 3","required_any":["tail -n 3 /etc/passwd","tail -3 /etc/passwd"],"feedback_fail":"Use 'tail -n 3 /etc/passwd' to display the last 3 lines."}],"simulated_output":"     1\t# /etc/profile\n     2\t# System wide environment and startup programs\n\nroot:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/sbin/nologin\ndaemon:x:2:2:daemon:/sbin:/sbin/nologin\n\ntcpdump:x:72:72::/:/sbin/nologin\ndbus:x:978:978:System Message Bus:/:/usr/sbin/nologin\nopeneuler:x:1000:1000:openEuler:/home/openeuler:/bin/bash","quiz_questions":[{"id":"h3_s2_q1","type":"single","question":"[Official Ch.03 Quiz Q1] How many lines of a file are displayed by default when using the `head` command?","options":["A. 5","B. 10","C. 15","D. 20"],"answer":"B","explanation":"Official Ch.03 Quiz Q1 (p.151): B (10). By default, both `head` and `tail` display 10 lines of a file."},{"id":"h3_s2_q2","type":"single","question":"Which command reads data from the 3rd line to the end of `file`, and which command reads all lines of `file` EXCEPT the last 3 lines?","options":["A. `tail -n +3 file` and `head -n -3 file`","B. `head -n +3 file` and `tail -n -3 file`","C. `tail -f 3 file` and `head -c 3 file`","D. `more +3 file` and `less -3 file`"],"answer":"A","explanation":"Per Ch.03 (p.97 & p.101), `tail -n +3 file` reads data from the 3rd line to the end of the file, while `head -n -3 file` reads all lines except the last three."},{"id":"h3_s2_q3","type":"multiple","question":"Which of the following statements about `cat`, `more`, `less`, and `tail` are TRUE?","options":["A. `cat -b` numbers only non-empty lines starting from 1, whereas `cat -n` numbers all lines.","B. `cat -E` adds a `` symbol at the end of each output line.","C. Unlike `more` (which loads the entire file from the start), `less` can scroll both upwards and downwards and does not load the entire file before displaying.","D. `tail -f` reads log files cyclically for real-time log monitoring."],"answer":"ABCD","explanation":"Per Ch.03 (pp.101–104, 135–142), all four statements are accurate."}],"reference_figures":[]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Text-Extraction-Filtering-Stats-and-Sorting","exercise_slug":"06-Exercise-Cut-Grep-Wc-Sort-Diff-Tr-Lab","lecture":{"title":"Text Extraction, Filtering, Statistics & Sorting (`cut`, `grep`, `wc`, `sort`, `diff`, `tr`)","duration_mins":7,"pdf_ref":"Ch.03, pp. 143–149","objectives":["Slice columns and character ranges using `cut` (`-b`, `-c`, `-d`, `-f` with ranges `N-`, `N-M`, `-M`)","Filter lines with `grep` (`-c`, `-i`, `-w`, `-x`) and compute line/word/byte counts with `wc` (`-l`, `-w`, `-c`)","Sort, deduplicate, compare, and translate text streams using `sort` (`-n`, `-r`, `-u`, `-o`), `diff` (`-B`, `-c`, `-i`, `-r`, `-w`), and `tr` (`-c`, `-d`, `-s`, `-t`)"],"content_markdown":"### 1. Column Extraction (`cut`) & Keyword Filtering (`grep`)\n* **`cut [option]... [file]` (Extract columns/fields):**\n  * **`-d <char>`:** Specifies the field separator (**default separator is `TAB`**). Example: `cut -d: -f1 /etc/passwd`.\n  * **`-f [range]`:** Selects fields (multiple fields separated by commas `,`).\n  * **`-b [range]` / `-c [range]`:** Selects bytes (`-b`) or characters (`-c`).\n  * **Range Syntax:** **`N-`** (from `N`-th to end), **`N-M`** (from `N`-th to `M`-th inclusive), **`-M`** (from 1st to `M`-th inclusive).\n* **`grep [option] pattern [file]...` (Regular expression line search):**\n  * Enclose multi-word patterns in single or double quotes so words after the first aren't misinterpreted as filenames!\n  * **`-c`:** Prints only the **count** of matching lines.\n  * **`-i`:** Ignores case sensitivity.\n  * **`-w`:** Matches **whole words** only.\n  * **`-x`:** Matches only results spanning the **whole line**.\n\n---\n\n### 2. Text Statistics (`wc`) & Sorting (`sort`)\n* **`wc [option]... [file]...` (Word/Line/Byte Count):**\n  * Reads from `stdin` if no file or `-` is given.\n  * **`-l` (`--lines`):** Displays only the number of **lines**.\n  * **`-w` (`--words`):** Displays only the number of **words**.\n  * **`-c` (`--bytes` / `--chars`):** Displays only the number of **bytes**.\n* **`sort [option]... [file]...` (Line Sorting):**\n  * **`-n`:** Sorts **numerically** by value (instead of ASCII character order).\n  * **`-r`:** Sorts in **reverse** (descending) order.\n  * **`-u`:** Ignores repeated lines (**unique**).\n  * **`-o <file>`:** Saves sorted output directly to `<file>`.\n  * **`-b`** (ignore leading spaces), **`-c`** (check if already sorted), **`-d`** (letters, digits, spaces only), **`-f`** (fold lowercase into uppercase).\n\n---\n\n### 3. File Comparison (`diff`) & Character Translation (`tr`)\n* **`diff [option]... file1 file2` (Line-by-line Comparison):**\n  * If directories are specified, `diff` compares files with the same name in those directories (non-recursively unless `-r` is passed).\n  * **`-B`** (ignore blank lines), **`-c`** (context format marking differences), **`-i`** (ignore case), **`-r`** (compare subdirectories recursively), **`-w`** (ignore all whitespace).\n* **`tr [option]... set1 [set2]` (Character Translation/Deletion from `stdin`):**\n  * Reads **only from standard input (`stdin`)**, converts or deletes characters, and writes to `stdout` (e.g., `cat text.txt | tr a-z A-Z`).\n  * **`-d`:** **Deletes** characters in `set1`.\n  * **`-s`:** **Squeezes** consecutive repeated characters into a single character.\n  * **`-c`:** Inverts (complements) `set1` (processes characters *not* in `set1`).\n  * **`-t`:** Truncates `set1` to the length of `set2`.","key_takeaways":["In 'cut', the default delimiter is TAB; use '-d:' and '-f1' to extract the first colon-separated column of /etc/passwd.","grep -c counts matching lines, -i ignores case, -w matches whole words, and -x matches whole lines; wc -l, -w, -c count lines, words, and bytes.","sort -n sorts numerically, -r reverses order, -u removes duplicate lines; tr reads from stdin (e.g., cat file | tr a-z A-Z) and uses -d to delete characters."],"exam_traps":["EXAM TRAP: The default field separator of 'cut' is TAB, whereas the default field separator of 'awk' is spaces/whitespace!","EXAM TRAP: 'tr' does NOT accept a filename as a command-line argument—it reads from standard input (stdin) via a pipe ('|') or input redirection ('<')."],"content_html":"<h3>1. Column Extraction (<code class=\"inline-code\">cut<\/code>) &amp; Keyword Filtering (<code class=\"inline-code\">grep<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">cut [option]... [file]<\/code> (Extract columns/fields):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-d &lt;char&gt;<\/code>:<\/strong> Specifies the field separator (<strong>default separator is <code class=\"inline-code\">TAB<\/code><\/strong>). Example: <code class=\"inline-code\">cut -d: -f1 /etc/passwd<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">-f [range]<\/code>:<\/strong> Selects fields (multiple fields separated by commas <code class=\"inline-code\">,<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-b [range]<\/code> / <code class=\"inline-code\">-c [range]<\/code>:<\/strong> Selects bytes (<code class=\"inline-code\">-b<\/code>) or characters (<code class=\"inline-code\">-c<\/code>).<\/li>\n<li><strong>Range Syntax:<\/strong> <strong><code class=\"inline-code\">N-<\/code><\/strong> (from <code class=\"inline-code\">N<\/code>-th to end), <strong><code class=\"inline-code\">N-M<\/code><\/strong> (from <code class=\"inline-code\">N<\/code>-th to <code class=\"inline-code\">M<\/code>-th inclusive), <strong><code class=\"inline-code\">-M<\/code><\/strong> (from 1st to <code class=\"inline-code\">M<\/code>-th inclusive).<\/li>\n<li><strong><code class=\"inline-code\">grep [option] pattern [file]...<\/code> (Regular expression line search):<\/strong><\/li>\n<li>Enclose multi-word patterns in single or double quotes so words after the first aren't misinterpreted as filenames!<\/li>\n<li><strong><code class=\"inline-code\">-c<\/code>:<\/strong> Prints only the <strong>count<\/strong> of matching lines.<\/li>\n<li><strong><code class=\"inline-code\">-i<\/code>:<\/strong> Ignores case sensitivity.<\/li>\n<li><strong><code class=\"inline-code\">-w<\/code>:<\/strong> Matches <strong>whole words<\/strong> only.<\/li>\n<li><strong><code class=\"inline-code\">-x<\/code>:<\/strong> Matches only results spanning the <strong>whole line<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Text Statistics (<code class=\"inline-code\">wc<\/code>) &amp; Sorting (<code class=\"inline-code\">sort<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">wc [option]... [file]...<\/code> (Word/Line/Byte Count):<\/strong><\/li>\n<li>Reads from <code class=\"inline-code\">stdin<\/code> if no file or <code class=\"inline-code\">-<\/code> is given.<\/li>\n<li><strong><code class=\"inline-code\">-l<\/code> (<code class=\"inline-code\">--lines<\/code>):<\/strong> Displays only the number of <strong>lines<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">-w<\/code> (<code class=\"inline-code\">--words<\/code>):<\/strong> Displays only the number of <strong>words<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">-c<\/code> (<code class=\"inline-code\">--bytes<\/code> / <code class=\"inline-code\">--chars<\/code>):<\/strong> Displays only the number of <strong>bytes<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">sort [option]... [file]...<\/code> (Line Sorting):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-n<\/code>:<\/strong> Sorts <strong>numerically<\/strong> by value (instead of ASCII character order).<\/li>\n<li><strong><code class=\"inline-code\">-r<\/code>:<\/strong> Sorts in <strong>reverse<\/strong> (descending) order.<\/li>\n<li><strong><code class=\"inline-code\">-u<\/code>:<\/strong> Ignores repeated lines (<strong>unique<\/strong>).<\/li>\n<li><strong><code class=\"inline-code\">-o &lt;file&gt;<\/code>:<\/strong> Saves sorted output directly to <code class=\"inline-code\">&lt;file&gt;<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">-b<\/code><\/strong> (ignore leading spaces), <strong><code class=\"inline-code\">-c<\/code><\/strong> (check if already sorted), <strong><code class=\"inline-code\">-d<\/code><\/strong> (letters, digits, spaces only), <strong><code class=\"inline-code\">-f<\/code><\/strong> (fold lowercase into uppercase).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. File Comparison (<code class=\"inline-code\">diff<\/code>) &amp; Character Translation (<code class=\"inline-code\">tr<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">diff [option]... file1 file2<\/code> (Line-by-line Comparison):<\/strong><\/li>\n<li>If directories are specified, <code class=\"inline-code\">diff<\/code> compares files with the same name in those directories (non-recursively unless <code class=\"inline-code\">-r<\/code> is passed).<\/li>\n<li><strong><code class=\"inline-code\">-B<\/code><\/strong> (ignore blank lines), <strong><code class=\"inline-code\">-c<\/code><\/strong> (context format marking differences), <strong><code class=\"inline-code\">-i<\/code><\/strong> (ignore case), <strong><code class=\"inline-code\">-r<\/code><\/strong> (compare subdirectories recursively), <strong><code class=\"inline-code\">-w<\/code><\/strong> (ignore all whitespace).<\/li>\n<li><strong><code class=\"inline-code\">tr [option]... set1 [set2]<\/code> (Character Translation/Deletion from <code class=\"inline-code\">stdin<\/code>):<\/strong><\/li>\n<li>Reads <strong>only from standard input (<code class=\"inline-code\">stdin<\/code>)<\/strong>, converts or deletes characters, and writes to <code class=\"inline-code\">stdout<\/code> (e.g., <code class=\"inline-code\">cat text.txt | tr a-z A-Z<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-d<\/code>:<\/strong> <strong>Deletes<\/strong> characters in <code class=\"inline-code\">set1<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">-s<\/code>:<\/strong> <strong>Squeezes<\/strong> consecutive repeated characters into a single character.<\/li>\n<li><strong><code class=\"inline-code\">-c<\/code>:<\/strong> Inverts (complements) <code class=\"inline-code\">set1<\/code> (processes characters <em>not<\/em> in <code class=\"inline-code\">set1<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">-t<\/code>:<\/strong> Truncates <code class=\"inline-code\">set1<\/code> to the length of <code class=\"inline-code\">set2<\/code>.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Extracting Usernames (`cut`), Counting Accounts (`wc`), Sorting & `tr` Case Conversion","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are auditing user accounts in `/etc/passwd`. Extract the first column (usernames) delimited by `:`, count how many lines in `/etc/passwd` match `nologin` using `grep -c`, count total lines in `/etc/passwd` using `wc -l`, and convert lowercase letters in `text.txt` to uppercase using `tr`.","instructions":["Step 1: Display the first column of `/etc/passwd` separated by colons (`:`) using `cut -d: -f1 /etc/passwd`.","Step 2: Count matching `nologin` lines with `grep -c nologin /etc/passwd` and count total lines with `wc -l /etc/passwd`.","Step 3: Pipe `cat text.txt` into `tr a-z A-Z` to convert lowercase letters to uppercase."],"starter_code":"# Step 1: Extract the 1st colon-separated column of /etc/passwd\n<cut_command>\n\n# Step 2: Count lines matching 'nologin' and total lines in /etc/passwd\n<grep_count_command>\n<wc_lines_command>\n\n# Step 3: Convert lowercase to uppercase in text.txt using tr\n<tr_command>","solution_code":"# Step 1: Extract the 1st colon-separated column of /etc/passwd\ncut -d: -f1 /etc/passwd\n\n# Step 2: Count lines matching 'nologin' and total lines in /etc/passwd\ngrep -c nologin /etc/passwd\nwc -l /etc/passwd\n\n# Step 3: Convert lowercase to uppercase in text.txt using tr\ncat text.txt | tr a-z A-Z","hints":["Use `cut -d: -f1 /etc/passwd`.","Use `grep -c nologin /etc/passwd` and `wc -l /etc/passwd`.","Use `cat text.txt | tr a-z A-Z`."],"validation_checks":[{"step":1,"description":"Extract 1st column of /etc/passwd with cut -d: -f1","required_any":["cut -d: -f1 /etc/passwd","cut -d ':' -f 1 /etc/passwd","cut -d \":\" -f 1 /etc/passwd"],"feedback_fail":"Use 'cut -d: -f1 /etc/passwd' to extract the first column."},{"step":2,"description":"Count matching lines with grep -c and total lines with wc -l","required_any":["grep -c nologin /etc/passwd"],"feedback_fail":"Include 'grep -c nologin /etc/passwd' and 'wc -l /etc/passwd'."},{"step":3,"description":"Convert lowercase to uppercase using tr a-z A-Z","required_any":["tr a-z a-z","tr 'a-z' 'a-z'"],"feedback_fail":"Use 'cat text.txt | tr a-z A-Z' to convert lowercase to uppercase."}],"simulated_output":"root\nbin\ndaemon\nadm\nopeneuler\n\n28\n32 /etc/passwd\n\nHELLO OPENEULER V2.0","quiz_questions":[{"id":"h3_s3_q1","type":"single","question":"What is the default field separator of the `cut` command if the `-d` option is not specified?","options":["A. Colon (:)","B. Comma (,)","C. TAB","D. Semicolon (;)"],"answer":"C","explanation":"Per Ch.03 (p.143), `-d` specifies a field separator, and the default field separator of `cut` is TAB."},{"id":"h3_s3_q2","type":"single","question":"Which option of the `sort` command sorts numbers by their numeric value, and which option removes duplicate lines?","options":["A. `-n` and `-u`","B. `-d` and `-r`","C. `-f` and `-c`","D. `-b` and `-o`"],"answer":"A","explanation":"Per Ch.03 (p.147), `sort -n` sorts by numeric value and `sort -u` ignores repeated (duplicate) lines."},{"id":"h3_s3_q3","type":"multiple","question":"Which of the following statements about `grep`, `wc`, and `tr` are TRUE?","options":["A. `grep -w` prints whole word matches, while `grep -x` prints only results matching the whole line.","B. `wc -l` displays only the number of lines, and `wc -w` displays only the number of words.","C. `tr -d` deletes specified characters from standard input.","D. `tr -s` reduces consecutive repeated characters to a single character."],"answer":"ABCD","explanation":"Per Ch.03 (pp.145–149), all four options match the official Huawei HCIA-openEuler V2.0 documentation."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Stream-Processing-with-awk-and-sed","exercise_slug":"08-Exercise-Awk-and-Sed-Text-Automation-Lab","lecture":{"title":"Advanced Stream Processing with `awk` and `sed`","duration_mins":7,"pdf_ref":"Ch.03, pp. 144, 150","objectives":["Analyze and slice text streams line-by-line using `awk` (`0`, `1..n`, default space separator, `-F` custom field delimiter)","Understand how `sed` (stream editor) processes lines in a pattern buffer without altering the original file by default","Apply `sed` options (`-n`, `-e`, `-f`, `-i`, `-l`, `-r`) for non-interactive string replacement and in-place file editing"],"content_markdown":"### 1. Column & Pattern Analysis with `awk`\n**`awk`** is a powerful text analysis utility that reads files or standard input **line by line**, slices each line into fields using **spaces (whitespace) as the default separator**, and executes actions on each slice.\n* **Syntax:** `awk [options] 'action' filename`\n* **Positional Field Variables:**\n  * **`0`**: Represents the **entire current line** (e.g., `awk '{print 0}' test.txt`).\n  * **`1`, `2`, `3`...**: Represent the 1st, 2nd, 3rd field of the current line.\n* **Custom Field Separator (`-F`):**\n  * Use `-F` to specify a delimiter other than whitespace, such as `:` for `/etc/passwd`:\n    ```bash\n    awk -F: '{print 1, 3}' /etc/passwd\n    ```\n* **Pipeline Example from Official Material (Ch.03, p.144):**\n  ```bash\n  # Display the last five accounts that have logged in to the system:\n  [root@openEuler ~]# last -n 5 | awk '{print 1}'\n  ```\n\n---\n\n### 2. Non-Interactive Stream Editing with `sed`\n**`sed`** is a streamlined, **non-interactive** stream editor capable of modifying character strings across standard input or files (unlike `tr`, which only performs character-level mapping).\n* **Buffer Execution Principle:**\n  * When `sed` runs, it reads one line at a time from the input into a **temporary memory buffer (pattern space)**, applies the editing commands to the buffer copy, prints the buffer to `stdout`, and moves to the next line.\n  * **Crucial Rule:** By default, **`sed` only modifies the copied text in the buffer and leaves the original file untouched!** To modify the original file directly on disk, you **must pass `-i`**.\n\n---\n\n### 3. Key `sed` Options & Actions\n| Option / Action | Description & Usage |\n| :--- | :--- |\n| **`-n`** | **Cancels default output** (only prints lines explicitly marked with the `p` action, e.g., `sed -n '1,5p' file`). |\n| **`-e <script>`** | Specifies **multipoint editing**, allowing multiple `sed` subcommands in a single invocation. |\n| **`-f <file>`** | Reads `sed` editing commands from a script file. |\n| **`-i`** | **Directly edits the original file in place** (instead of only outputting modified buffer text to `stdout`). |\n| **`-l <N>`** | Specifies the line-wrap length for the `l` command. |\n| **`-r`** | Uses **extended regular expressions (ERE)** in the script. |\n| **`s/old/new/g`** | Substitutes `old` with `new` globally on matched lines; **`d`** deletes matched lines; **`a`/`i`/`c`** appends/inserts/changes lines. |","key_takeaways":["awk reads input line by line using spaces as the default separator; 0 is the entire line, 1 is the first field, and -F changes the field separator.","sed is a non-interactive stream editor that modifies text in a memory buffer by default without changing the source file on disk.","In sed, -i edits the original file directly in place, -n suppresses default output, -e enables multipoint editing, and -r enables extended regular expressions."],"exam_traps":["EXAM TRAP: Running 'sed \"s/foo/bar/g\" file.txt' does NOT modify file.txt on disk—it only prints the modified buffer to standard output! You must use 'sed -i' to edit the original file directly.","EXAM TRAP: Remember the difference between 'tr' and 'sed': 'tr' performs single-character translation/deletion from stdin, whereas 'sed' modifies character strings and lines."],"content_html":"<h3>1. Column &amp; Pattern Analysis with <code class=\"inline-code\">awk<\/code><\/h3>\n<p><strong><code class=\"inline-code\">awk<\/code><\/strong> is a powerful text analysis utility that reads files or standard input <strong>line by line<\/strong>, slices each line into fields using <strong>spaces (whitespace) as the default separator<\/strong>, and executes actions on each slice.<\/p>\n<ul class=\"md-list\">\n<li><strong>Syntax:<\/strong> <code class=\"inline-code\">awk [options] 'action' filename<\/code><\/li>\n<li><strong>Positional Field Variables:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">0<\/code><\/strong>: Represents the <strong>entire current line<\/strong> (e.g., <code class=\"inline-code\">awk '{print 0}' test.txt<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">1<\/code>, <code class=\"inline-code\">2<\/code>, <code class=\"inline-code\">3<\/code>...<\/strong>: Represent the 1st, 2nd, 3rd field of the current line.<\/li>\n<li><strong>Custom Field Separator (<code class=\"inline-code\">-F<\/code>):<\/strong><\/li>\n<li>Use <code class=\"inline-code\">-F<\/code> to specify a delimiter other than whitespace, such as <code class=\"inline-code\">:<\/code> for <code class=\"inline-code\">/etc/passwd<\/code>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>    awk -F: '{print 1, 3}' /etc/passwd<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Pipeline Example from Official Material (Ch.03, p.144):<\/strong><\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  # Display the last five accounts that have logged in to the system:\n  [root@openEuler ~]# last -n 5 | awk '{print 1}'<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Non-Interactive Stream Editing with <code class=\"inline-code\">sed<\/code><\/h3>\n<p><strong><code class=\"inline-code\">sed<\/code><\/strong> is a streamlined, <strong>non-interactive<\/strong> stream editor capable of modifying character strings across standard input or files (unlike <code class=\"inline-code\">tr<\/code>, which only performs character-level mapping).<\/p>\n<ul class=\"md-list\">\n<li><strong>Buffer Execution Principle:<\/strong><\/li>\n<li>When <code class=\"inline-code\">sed<\/code> runs, it reads one line at a time from the input into a <strong>temporary memory buffer (pattern space)<\/strong>, applies the editing commands to the buffer copy, prints the buffer to <code class=\"inline-code\">stdout<\/code>, and moves to the next line.<\/li>\n<li><strong>Crucial Rule:<\/strong> By default, <strong><code class=\"inline-code\">sed<\/code> only modifies the copied text in the buffer and leaves the original file untouched!<\/strong> To modify the original file directly on disk, you <strong>must pass <code class=\"inline-code\">-i<\/code><\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Key <code class=\"inline-code\">sed<\/code> Options &amp; Actions<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Option / Action<\/th><th>Description &amp; Usage<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">-n<\/code><\/strong><\/td><td><strong>Cancels default output<\/strong> (only prints lines explicitly marked with the <code class=\"inline-code\">p<\/code> action, e.g., <code class=\"inline-code\">sed -n '1,5p' file<\/code>).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">-e &lt;script&gt;<\/code><\/strong><\/td><td>Specifies <strong>multipoint editing<\/strong>, allowing multiple <code class=\"inline-code\">sed<\/code> subcommands in a single invocation.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">-f &lt;file&gt;<\/code><\/strong><\/td><td>Reads <code class=\"inline-code\">sed<\/code> editing commands from a script file.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">-i<\/code><\/strong><\/td><td><strong>Directly edits the original file in place<\/strong> (instead of only outputting modified buffer text to <code class=\"inline-code\">stdout<\/code>).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">-l &lt;N&gt;<\/code><\/strong><\/td><td>Specifies the line-wrap length for the <code class=\"inline-code\">l<\/code> command.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">-r<\/code><\/strong><\/td><td>Uses <strong>extended regular expressions (ERE)<\/strong> in the script.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">s/old/new/g<\/code><\/strong><\/td><td>Substitutes <code class=\"inline-code\">old<\/code> with <code class=\"inline-code\">new<\/code> globally on matched lines; <strong><code class=\"inline-code\">d<\/code><\/strong> deletes matched lines; <strong><code class=\"inline-code\">a<\/code>/<code class=\"inline-code\">i<\/code>/<code class=\"inline-code\">c<\/code><\/strong> appends/inserts/changes lines.<\/td><\/tr>\n<\/tbody><\/table><\/div>"},"exercise":{"title":"Hands-On Lab: Pipeline Slicing with `awk` and In-Place Editing with `sed -i`","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are automating log and configuration maintenance on openEuler. Use `last` piped to `awk` to extract the usernames of the last 5 logins, use `sed -n` to print only lines 1 to 3 of `/etc/passwd`, and use `sed -i` to directly replace `enabled=0` with `enabled=1` in `local.repo`.","instructions":["Step 1: Display the first column (account names) of the last 5 login records using `last -n 5 | awk '{print 1}'`.","Step 2: Quietly print only lines 1 to 3 of `/etc/passwd` by canceling default output with `sed -n '1,3p' /etc/passwd`.","Step 3: Directly edit `local.repo` in place to replace `enabled=0` with `enabled=1` using `sed -i 's/enabled=0/enabled=1/g' local.repo`."],"starter_code":"# Step 1: Display the last 5 login account names using last and awk\n<last_awk_command>\n\n# Step 2: Print only lines 1 to 3 of /etc/passwd using sed\n<sed_print_command>\n\n# Step 3: Directly modify local.repo in place using sed -i\n<sed_inplace_command>","solution_code":"# Step 1: Display the last 5 login account names using last and awk\nlast -n 5 | awk '{print 1}'\n\n# Step 2: Print only lines 1 to 3 of /etc/passwd using sed\nsed -n '1,3p' /etc/passwd\n\n# Step 3: Directly modify local.repo in place using sed -i\nsed -i 's/enabled=0/enabled=1/g' local.repo","hints":["Use `last -n 5 | awk '{print 1}'` (exact example from Ch.03 p.144).","Use `sed -n '1,3p' /etc/passwd` so `-n` cancels default output.","Use `sed -i 's/enabled=0/enabled=1/g' local.repo` to edit the file in place."],"validation_checks":[{"step":1,"description":"Pipe last -n 5 into awk '{print 1}'","required_any":["awk '{print 1}'","awk \"{print 1}\""],"feedback_fail":"Use \"last -n 5 | awk '{print 1}'\" to extract the first field."},{"step":2,"description":"Use sed -n to cancel default output and print lines 1 to 3","required_any":["sed -n '1,3p'","sed -n \"1,3p\""],"feedback_fail":"Use \"sed -n '1,3p' /etc/passwd\"."},{"step":3,"description":"Use sed -i to edit local.repo in place","required_any":["sed -i"],"feedback_fail":"Use 'sed -i' to directly edit local.repo in place."}],"simulated_output":"root\nopeneuler\nreboot\nroot\nroot\n\nroot:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/sbin/nologin\ndaemon:x:2:2:daemon:/sbin:/sbin/nologin\n\n[root@openEuler ~]# grep enabled local.repo\nenabled=1","quiz_questions":[{"id":"h3_s4_q1","type":"single","question":"By default, what separator does `awk` use to slice each input line into fields, and which variable represents the entire current line?","options":["A. Colon (:); `1`","B. Spaces (whitespace); `0`","C. Comma (,); `ALL`","D. Semicolon (;); `#`"],"answer":"B","explanation":"Per Ch.03 (p.144), `awk` reads files or standard input by line, uses spaces as the default separator to slice each line, and uses `0` to represent the entire line (`awk '{print 0}' test.txt`)."},{"id":"h3_s4_q2","type":"single","question":"When using the `sed` command, which option must be specified to directly modify the original file on disk instead of only editing the copied text in the memory buffer?","options":["A. -n","B. -e","C. -i","D. -r"],"answer":"C","explanation":"Per Ch.03 (p.150), `sed` only changes the copied text stored in buffers by default. To edit the original file directly, use the `-i` option."},{"id":"h3_s4_q3","type":"multiple","question":"Which of the following accurately describe `sed` command options in openEuler?","options":["A. `-n` cancels the default output.","B. `-e` specifies multipoint editing so multiple subcommands can be executed.","C. `-f` reads editing commands from a script file.","D. `-r` uses extended regular expressions in a script."],"answer":"ABCD","explanation":"Per Ch.03 (p.150), `-n`, `-e`, `-f`, `-i`, `-l`, and `-r` are the six core options of `sed`."}],"reference_figures":[]}}]},{"hour_number":4,"folder_name":"Hour-04-User-Group-and-Permission-Management","title":"User, Group & File Permission Management","chapter_ref":"Chapter 04 Part 1 (pp. 154–193)","duration_mins":60,"overview":"Master Linux multi-user UID/GID architecture and configuration files (`/etc/passwd`, `/etc/group`, `/etc/shadow`), manage accounts and password aging (`useradd`, `usermod`, `userdel`, `passwd`, `chage`, `gpasswd`), configure `rwx` permissions, ownership, and `umask` (`chmod`, `chown`, `chgrp`), and implement Sticky Bit, fine-grained ACLs (`getfacl`, `setfacl`, `chacl`), and privilege escalation (`su`, `sudo`).","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-User-and-Group-Architecture-and-Config-Files","exercise_slug":"02-Exercise-Inspecting-Passwd-and-Group-Files-Lab","lecture":{"title":"User & Group Architecture (UID/GID) and Configuration Files","duration_mins":7,"pdf_ref":"Ch.04, pp. 158–162","objectives":["Distinguish the three Linux user types by UID range: Superuser (0), Virtual/System user (1–999), and Common/Regular user (1000–60000)","Compare Private (primary/owner) groups vs. Public (additional/supplementary) groups","Parse every colon-delimited field of `/etc/passwd` (7 fields) and `/etc/group` (4 fields) along with `/etc/shadow` and `/etc/gshadow`"],"content_markdown":"### 1. Linux User Types (UID) and Group Types (GID)\nWhen a user logs in to Linux, the system identifies the user type by **UID (User ID)**, not by the username!\n* **Three User Categories by UID Range (Ch.04, p.160):**\n  1. **Superuser (`root`):** **`UID = 0`** (and `GID = 0`). Has full control over the entire OS.\n  2. **Virtual user (System user):** **`UID = 1 to 999`**. Used by background services/daemons; cannot log in interactively with a password (typically uses `/sbin/nologin` or `/usr/sbin/nologin`).\n  3. **Common user (Normal/Regular user):** **`UID = 1000 to 60000`**. Can modify files in their own home directory (`/home/username`) and access authorized resources.\n* **User Group Relationships:**\n  * **Private Group (Owner/Primary Group):** Each user has **only one** private group (created with the same name and GID as the user by default). Newly created files belong to this primary group.\n  * **Public Group (Additional/Supplementary Group):** A user can belong to **multiple** public groups to inherit shared permissions.\n\n---\n\n### 2. Structure of `/etc/passwd` (7 Fields) and `/etc/group` (4 Fields)\n* **`/etc/passwd` (User Configuration File — 7 Colon-Separated Columns):**\n  Example: `root:x:0:0:Super User:/root:/bin/bash`\n  1. **Username** (`root`)\n  2. **Password placeholder** (`x` — indicates password authentication is required; actual encrypted hashes are stored in `/etc/shadow`)\n  3. **UID** (`0`)\n  4. **Primary GID** (`0`)\n  5. **User description / comment** (`Super User`)\n  6. **Home directory** (`/root` or `/home/username`)\n  7. **Login shell** (`/bin/bash` for interactive login, or `/sbin/nologin` to forbid shell login)\n* **`/etc/group` (Group Configuration File — 4 Colon-Separated Columns):**\n  Example: `wheel:x:10:openeuler`\n  1. **Group name** (`wheel`)\n  2. **Password placeholder** (`x`)\n  3. **GID** (`10`)\n  4. **Supplementary users list** (Comma-separated list of users for whom this group is a **supplementary/additional group**. Note: If a group is a user's **private/primary group**, the username does **not** appear in the 4th column!).\n\n---\n\n### 3. Companion Account Files\n* **`/etc/shadow`:** Stores encrypted user passwords and password aging policies (readable only by `root`).\n* **`/etc/gshadow`:** Stores encrypted group passwords and group administrators.\n* **`/var/spool/mail/username`:** Stores the user's system mailbox.","key_takeaways":["Linux identifies users by UID: 0 = Superuser (root), 1–999 = Virtual (system) users, and 1000–60000 = Common (regular) users.","/etc/passwd has 7 colon-separated fields: username : password_placeholder(x) : UID : GID : description : home_dir : login_shell.","/etc/group has 4 colon-separated fields: group_name : password_placeholder(x) : GID : supplementary_users (private group owners do not appear in column 4)."],"exam_traps":["EXAM TRAP: The second column 'x' in /etc/passwd is ONLY a password placeholder—the actual encrypted password hash is stored in /etc/shadow!","EXAM TRAP: Each user can have only ONE private (primary) group, but can belong to MULTIPLE public (additional/supplementary) groups."],"content_html":"<h3>1. Linux User Types (UID) and Group Types (GID)<\/h3>\n<p>When a user logs in to Linux, the system identifies the user type by <strong>UID (User ID)<\/strong>, not by the username!<\/p>\n<ul class=\"md-list\">\n<li><strong>Three User Categories by UID Range (Ch.04, p.160):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Superuser (<code class=\"inline-code\">root<\/code>):<\/strong> <strong><code class=\"inline-code\">UID = 0<\/code><\/strong> (and <code class=\"inline-code\">GID = 0<\/code>). Has full control over the entire OS.<\/li>\n<li><strong>Virtual user (System user):<\/strong> <strong><code class=\"inline-code\">UID = 1 to 999<\/code><\/strong>. Used by background services/daemons; cannot log in interactively with a password (typically uses <code class=\"inline-code\">/sbin/nologin<\/code> or <code class=\"inline-code\">/usr/sbin/nologin<\/code>).<\/li>\n<li><strong>Common user (Normal/Regular user):<\/strong> <strong><code class=\"inline-code\">UID = 1000 to 60000<\/code><\/strong>. Can modify files in their own home directory (<code class=\"inline-code\">/home/username<\/code>) and access authorized resources.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>User Group Relationships:<\/strong><\/li>\n<li><strong>Private Group (Owner/Primary Group):<\/strong> Each user has <strong>only one<\/strong> private group (created with the same name and GID as the user by default). Newly created files belong to this primary group.<\/li>\n<li><strong>Public Group (Additional/Supplementary Group):<\/strong> A user can belong to <strong>multiple<\/strong> public groups to inherit shared permissions.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Structure of <code class=\"inline-code\">/etc/passwd<\/code> (7 Fields) and <code class=\"inline-code\">/etc/group<\/code> (4 Fields)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">/etc/passwd<\/code> (User Configuration File — 7 Colon-Separated Columns):<\/strong><\/li>\n<\/ul>\n<p>Example: <code class=\"inline-code\">root:x:0:0:Super User:/root:/bin/bash<\/code><\/p>\n<ol class=\"md-list\">\n<li><strong>Username<\/strong> (<code class=\"inline-code\">root<\/code>)<\/li>\n<li><strong>Password placeholder<\/strong> (<code class=\"inline-code\">x<\/code> — indicates password authentication is required; actual encrypted hashes are stored in <code class=\"inline-code\">/etc/shadow<\/code>)<\/li>\n<li><strong>UID<\/strong> (<code class=\"inline-code\">0<\/code>)<\/li>\n<li><strong>Primary GID<\/strong> (<code class=\"inline-code\">0<\/code>)<\/li>\n<li><strong>User description / comment<\/strong> (<code class=\"inline-code\">Super User<\/code>)<\/li>\n<li><strong>Home directory<\/strong> (<code class=\"inline-code\">/root<\/code> or <code class=\"inline-code\">/home/username<\/code>)<\/li>\n<li><strong>Login shell<\/strong> (<code class=\"inline-code\">/bin/bash<\/code> for interactive login, or <code class=\"inline-code\">/sbin/nologin<\/code> to forbid shell login)<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">/etc/group<\/code> (Group Configuration File — 4 Colon-Separated Columns):<\/strong><\/li>\n<\/ul>\n<p>Example: <code class=\"inline-code\">wheel:x:10:openeuler<\/code><\/p>\n<ol class=\"md-list\">\n<li><strong>Group name<\/strong> (<code class=\"inline-code\">wheel<\/code>)<\/li>\n<li><strong>Password placeholder<\/strong> (<code class=\"inline-code\">x<\/code>)<\/li>\n<li><strong>GID<\/strong> (<code class=\"inline-code\">10<\/code>)<\/li>\n<li><strong>Supplementary users list<\/strong> (Comma-separated list of users for whom this group is a <strong>supplementary/additional group<\/strong>. Note: If a group is a user's <strong>private/primary group<\/strong>, the username does <strong>not<\/strong> appear in the 4th column!).<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. Companion Account Files<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">/etc/shadow<\/code>:<\/strong> Stores encrypted user passwords and password aging policies (readable only by <code class=\"inline-code\">root<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">/etc/gshadow<\/code>:<\/strong> Stores encrypted group passwords and group administrators.<\/li>\n<li><strong><code class=\"inline-code\">/var/spool/mail/username<\/code>:<\/strong> Stores the user's system mailbox.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Auditing `/etc/passwd` and `/etc/group` Field Structures","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are performing a security audit of user accounts on openEuler. Inspect the `root` and `openeuler` entries in `/etc/passwd`, extract usernames and login shells (fields 1 and 7), and inspect `/etc/group`.","instructions":["Step 1: Use `grep` to view the `root` entry in `/etc/passwd` (`grep '^root:' /etc/passwd`).","Step 2: Use `awk -F: '{print 1, 3, 7}' /etc/passwd` to print the username (field 1), UID (field 3), and login shell (field 7).","Step 3: View the first 5 lines of `/etc/group` using `head -n 5 /etc/group`."],"starter_code":"# Step 1: Match the root user line in /etc/passwd\n<grep_root_command>\n\n# Step 2: Print username (1), UID (3), and login shell (7) from /etc/passwd\n<awk_passwd_command>\n\n# Step 3: View the first 5 lines of /etc/group\n<head_group_command>","solution_code":"# Step 1: Match the root user line in /etc/passwd\ngrep '^root:' /etc/passwd\n\n# Step 2: Print username (1), UID (3), and login shell (7) from /etc/passwd\nawk -F: '{print 1, 3, 7}' /etc/passwd\n\n# Step 3: View the first 5 lines of /etc/group\nhead -n 5 /etc/group","hints":["Use `grep '^root:' /etc/passwd`.","Use `awk -F: '{print 1, 3, 7}' /etc/passwd`.","Use `head -n 5 /etc/group`."],"validation_checks":[{"step":1,"description":"Search for root in /etc/passwd","required_any":["grep","/etc/passwd"],"feedback_fail":"Use 'grep \"^root:\" /etc/passwd' to inspect the root entry."},{"step":2,"description":"Extract fields 1, 3, and 7 from /etc/passwd using awk -F:","required_any":["awk -f:","7"],"feedback_fail":"Use \"awk -F: '{print 1, 3, 7}' /etc/passwd\"."},{"step":3,"description":"View the first 5 lines of /etc/group","required_any":["head -n 5 /etc/group","head -5 /etc/group"],"feedback_fail":"Use 'head -n 5 /etc/group' to inspect the group configuration file."}],"simulated_output":"root:x:0:0:Super User:/root:/bin/bash\n\nroot 0 /bin/bash\nbin 1 /usr/sbin/nologin\ndaemon 2 /usr/sbin/nologin\nopeneuler 1000 /bin/bash\n\nroot:x:0:\nbin:x:1:\ndaemon:x:2:\nsys:x:3:\nadm:x:4:","quiz_questions":[{"id":"h4_s1_q1","type":"single","question":"In openEuler, what are the standard UID ranges for the Superuser, Virtual (system) users, and Common (regular) users respectively?","options":["A. Superuser: 1; Virtual users: 2–500; Common users: 501–10000","B. Superuser: 0; Virtual users: 1–999; Common users: 1000–60000","C. Superuser: 0; Virtual users: 1000–1999; Common users: 2000–65535","D. Superuser: 1000; Virtual users: 0–999; Common users: 1001+"],"answer":"B","explanation":"Per Ch.04 (p.160), the Superuser (root) has UID 0, Virtual (system) users have UIDs ranging from 1 to 999, and Common (normal/regular) users have UIDs ranging from 1000 to 60000."},{"id":"h4_s1_q2","type":"single","question":"In the `/etc/passwd` file, what do the 3rd, 4th, 6th, and 7th colon-separated columns represent?","options":["A. UID, GID, User home directory, User login shell","B. Password hash, UID, User description, Mailbox path","C. GID, UID, Login shell, Home directory","D. Username, Password placeholder, Home directory, Group list"],"answer":"A","explanation":"Per Ch.04 (p.161), the 7 columns of `/etc/passwd` are: (1) username, (2) password placeholder, (3) UID, (4) GID, (5) user description, (6) user home directory, and (7) user login shell."},{"id":"h4_s1_q3","type":"multiple","question":"Which of the following statements about user groups and `/etc/group` are TRUE?","options":["A. Each user has only one private (primary) group, but can belong to multiple public (additional) groups.","B. Actual encrypted user passwords are stored in `/etc/shadow`, while group passwords are in `/etc/gshadow`.","C. If a user appears in the 4th column of `/etc/group`, that group serves as a supplementary (additional) group for the user.","D. If a group is a user's private group, the user's name does NOT appear in the 4th column of `/etc/group`."],"answer":"ABCD","explanation":"Per Ch.04 (pp.161–162), all four statements are explicitly documented in the official material."}],"reference_figures":[]}},{"sprint_number":2,"lecture_slug":"03-Lecture-User-and-Group-Lifecycle-Commands","exercise_slug":"04-Exercise-User-Group-and-Password-Aging-Lab","lecture":{"title":"User, Group & Password Lifecycle Commands (`useradd`, `usermod`, `userdel`, `passwd`, `chage`, `gpasswd`)","duration_mins":7,"pdf_ref":"Ch.04, pp. 163–168","objectives":["Create, modify, and delete users and groups with `useradd`, `usermod`, `userdel`, `groupadd`, `groupmod`, and `groupdel`","Manage user passwords and account locks with `passwd` (`-n`, `-x`, `-w`, `-i`, `-d`, `-S`, `-l`, `-u`, `-e`) and password aging with `chage` (`-l`, `-M`, `-m`, `-w`, `-d`, `-I`)","Manage group memberships safely without overwriting existing supplementary groups using `gpasswd` (`-a`, `-d`, `-M`, `-A`) vs. `usermod -G`"],"content_markdown":"### 1. Creating, Modifying & Deleting Users and Groups\n| Command | Key Options & Exam Rules |\n| :--- | :--- |\n| **`useradd [options] user`** | **`-u`** (specify UID), **`-o`** (used with `-u` to allow duplicate UIDs), **`-g`** (specify basic/primary group name or GID), **`-d`** (specify and create home directory), **`-s`** (specify default login shell), **`-D`** (display/change default config). |\n| **`usermod [options] user`** | **`-u`** (modify UID), **`-g`** (modify primary group), **`-G`** (specify supplementary group—**overwrites previous supplementary groups** unless `-a` is combined or `gpasswd -a` is used!), **`-l`** (modify login username), **`-d`** (modify home directory), **`-s`** (modify default shell). |\n| **`userdel [options] user`** | Without options, deletes only the account entry (leaves home/mail files). **`-r`** recursively deletes the user **and their home directory/mail files**. **`-f`** forcibly deletes a user even if currently logged in. |\n| **`groupadd [options] grp`** | **`-g`** (assign GID), **`-o`** (allow duplicate GID), **`-r`** (create system group), **`-f`** (exit successfully if group exists), **`-p`** (encrypted password). |\n| **`groupmod [options] grp`** | **`-g`** (set new GID), **`-n`** (set new group name), **`-o`** (allow duplicate GID), **`-p`** (modify password). |\n| **`groupdel [options] grp`** | Deletes a group. **Rule:** If a group is the primary group of an existing user, delete the user first (or use **`-f`** to force). |\n\n---\n\n### 2. Password Management (`passwd`) & Password Aging (`chage`)\n* **`passwd [OPTION...] user_name`:** (Root can change any user's password; common users can change only their own.)\n  * **`-l` / `-u`:** **Locks (`-l`)** or **unlocks (`-u`)** a user's password.\n  * **`-d`:** Deletes a user's password. **`-e`:** Forces immediate password expiration on next login. **`-S`:** Displays password status.\n  * **`-n <min>` / `-x <max>` / `-w <warn>` / `-i <inactive>`:** Sets min days, max days, warning days, and grace days before disabling an expired account.\n* **`chage [OPTION...] user_name` (Change Age):**\n  * **`-l`:** Lists password expiration details for a user.\n  * **`-M <days>`:** Maximum password validity period.\n  * **`-m <days>`:** Minimum password validity period.\n  * **`-w <days>`:** Warning days before password expires.\n  * **`-I <days>`:** Inactive days after password expiration before account is locked.\n  * **`-d <date/0>`:** Sets last password change date (`-d 0` forces change on next login).\n\n---\n\n### 3. Group Association (`gpasswd`) & `chroot`\n* **Why `gpasswd` instead of `usermod -G`?** Running `usermod -G group_name user_name` adds the user to `group_name` **but removes the user from any previous supplementary groups!** To add a user to a group while retaining existing supplementary groups, use **`gpasswd`**.\n* **`gpasswd [option] group_name`:**\n  * **`-a <user>`:** Adds a user to the group.\n  * **`-d <user>`:** Deletes (removes) a user from the group.\n  * **`-M <u1,u2>`:** Defines the complete list of group members.\n  * **`-A <user>`:** Sets group administrator(s); **`-r`** removes group password; **`-R`** restricts access to members only; **`-Q`** specifies a `chroot` directory.\n* **`chroot`:** Changes the apparent root directory (`/`) for a process, enhancing security, isolating development environments, and aiding bootloader/system recovery.","key_takeaways":["userdel without options keeps the home directory; 'userdel -r username' deletes both the user account and their home/mail directories.","chage -l lists password aging policy, chage -M sets maximum validity days, and passwd -l / -u locks or unlocks an account.","gpasswd -a user group adds a user to a group while keeping existing supplementary groups, whereas 'usermod -G group user' overwrites previous supplementary groups."],"exam_traps":["EXAM TRAP: Do not confuse chage options with passwd options! For maximum password validity days, chage uses uppercase '-M' (chage -M 90 user), whereas passwd uses lowercase '-x' (passwd -x 90 user).","EXAM TRAP: To rename a group, groupmod uses '-n' (groupmod -n newname oldname), whereas to rename a user, usermod uses '-l' (usermod -l newname oldname)."],"content_html":"<h3>1. Creating, Modifying &amp; Deleting Users and Groups<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Command<\/th><th>Key Options &amp; Exam Rules<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">useradd [options] user<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">-u<\/code><\/strong> (specify UID), <strong><code class=\"inline-code\">-o<\/code><\/strong> (used with <code class=\"inline-code\">-u<\/code> to allow duplicate UIDs), <strong><code class=\"inline-code\">-g<\/code><\/strong> (specify basic/primary group name or GID), <strong><code class=\"inline-code\">-d<\/code><\/strong> (specify and create home directory), <strong><code class=\"inline-code\">-s<\/code><\/strong> (specify default login shell), <strong><code class=\"inline-code\">-D<\/code><\/strong> (display/change default config).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">usermod [options] user<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">-u<\/code><\/strong> (modify UID), <strong><code class=\"inline-code\">-g<\/code><\/strong> (modify primary group), <strong><code class=\"inline-code\">-G<\/code><\/strong> (specify supplementary group—<strong>overwrites previous supplementary groups<\/strong> unless <code class=\"inline-code\">-a<\/code> is combined or <code class=\"inline-code\">gpasswd -a<\/code> is used!), <strong><code class=\"inline-code\">-l<\/code><\/strong> (modify login username), <strong><code class=\"inline-code\">-d<\/code><\/strong> (modify home directory), <strong><code class=\"inline-code\">-s<\/code><\/strong> (modify default shell).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">userdel [options] user<\/code><\/strong><\/td><td>Without options, deletes only the account entry (leaves home/mail files). <strong><code class=\"inline-code\">-r<\/code><\/strong> recursively deletes the user <strong>and their home directory/mail files<\/strong>. <strong><code class=\"inline-code\">-f<\/code><\/strong> forcibly deletes a user even if currently logged in.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">groupadd [options] grp<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">-g<\/code><\/strong> (assign GID), <strong><code class=\"inline-code\">-o<\/code><\/strong> (allow duplicate GID), <strong><code class=\"inline-code\">-r<\/code><\/strong> (create system group), <strong><code class=\"inline-code\">-f<\/code><\/strong> (exit successfully if group exists), <strong><code class=\"inline-code\">-p<\/code><\/strong> (encrypted password).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">groupmod [options] grp<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">-g<\/code><\/strong> (set new GID), <strong><code class=\"inline-code\">-n<\/code><\/strong> (set new group name), <strong><code class=\"inline-code\">-o<\/code><\/strong> (allow duplicate GID), <strong><code class=\"inline-code\">-p<\/code><\/strong> (modify password).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">groupdel [options] grp<\/code><\/strong><\/td><td>Deletes a group. <strong>Rule:<\/strong> If a group is the primary group of an existing user, delete the user first (or use <strong><code class=\"inline-code\">-f<\/code><\/strong> to force).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Password Management (<code class=\"inline-code\">passwd<\/code>) &amp; Password Aging (<code class=\"inline-code\">chage<\/code>)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">passwd [OPTION...] user_name<\/code>:<\/strong> (Root can change any user's password; common users can change only their own.)<\/li>\n<li><strong><code class=\"inline-code\">-l<\/code> / <code class=\"inline-code\">-u<\/code>:<\/strong> <strong>Locks (<code class=\"inline-code\">-l<\/code>)<\/strong> or <strong>unlocks (<code class=\"inline-code\">-u<\/code>)<\/strong> a user's password.<\/li>\n<li><strong><code class=\"inline-code\">-d<\/code>:<\/strong> Deletes a user's password. <strong><code class=\"inline-code\">-e<\/code>:<\/strong> Forces immediate password expiration on next login. <strong><code class=\"inline-code\">-S<\/code>:<\/strong> Displays password status.<\/li>\n<li><strong><code class=\"inline-code\">-n &lt;min&gt;<\/code> / <code class=\"inline-code\">-x &lt;max&gt;<\/code> / <code class=\"inline-code\">-w &lt;warn&gt;<\/code> / <code class=\"inline-code\">-i &lt;inactive&gt;<\/code>:<\/strong> Sets min days, max days, warning days, and grace days before disabling an expired account.<\/li>\n<li><strong><code class=\"inline-code\">chage [OPTION...] user_name<\/code> (Change Age):<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-l<\/code>:<\/strong> Lists password expiration details for a user.<\/li>\n<li><strong><code class=\"inline-code\">-M &lt;days&gt;<\/code>:<\/strong> Maximum password validity period.<\/li>\n<li><strong><code class=\"inline-code\">-m &lt;days&gt;<\/code>:<\/strong> Minimum password validity period.<\/li>\n<li><strong><code class=\"inline-code\">-w &lt;days&gt;<\/code>:<\/strong> Warning days before password expires.<\/li>\n<li><strong><code class=\"inline-code\">-I &lt;days&gt;<\/code>:<\/strong> Inactive days after password expiration before account is locked.<\/li>\n<li><strong><code class=\"inline-code\">-d &lt;date/0&gt;<\/code>:<\/strong> Sets last password change date (<code class=\"inline-code\">-d 0<\/code> forces change on next login).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Group Association (<code class=\"inline-code\">gpasswd<\/code>) &amp; <code class=\"inline-code\">chroot<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong>Why <code class=\"inline-code\">gpasswd<\/code> instead of <code class=\"inline-code\">usermod -G<\/code>?<\/strong> Running <code class=\"inline-code\">usermod -G group_name user_name<\/code> adds the user to <code class=\"inline-code\">group_name<\/code> <strong>but removes the user from any previous supplementary groups!<\/strong> To add a user to a group while retaining existing supplementary groups, use <strong><code class=\"inline-code\">gpasswd<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">gpasswd [option] group_name<\/code>:<\/strong><\/li>\n<li><strong><code class=\"inline-code\">-a &lt;user&gt;<\/code>:<\/strong> Adds a user to the group.<\/li>\n<li><strong><code class=\"inline-code\">-d &lt;user&gt;<\/code>:<\/strong> Deletes (removes) a user from the group.<\/li>\n<li><strong><code class=\"inline-code\">-M &lt;u1,u2&gt;<\/code>:<\/strong> Defines the complete list of group members.<\/li>\n<li><strong><code class=\"inline-code\">-A &lt;user&gt;<\/code>:<\/strong> Sets group administrator(s); <strong><code class=\"inline-code\">-r<\/code><\/strong> removes group password; <strong><code class=\"inline-code\">-R<\/code><\/strong> restricts access to members only; <strong><code class=\"inline-code\">-Q<\/code><\/strong> specifies a <code class=\"inline-code\">chroot<\/code> directory.<\/li>\n<li><strong><code class=\"inline-code\">chroot<\/code>:<\/strong> Changes the apparent root directory (<code class=\"inline-code\">/<\/code>) for a process, enhancing security, isolating development environments, and aiding bootloader/system recovery.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Provisioning Accounts, Group Memberships (`gpasswd`) & Password Aging (`chage`)","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are onboarding a developer account `dev01` with UID `1500` and a custom group `devops` with GID `2000`. Create the group and user, add `dev01` to `devops` using `gpasswd -a`, set the maximum password validity period to 90 days using `chage -M 90 dev01`, and remove a temporary account `tempuser` along with its home directory.","instructions":["Step 1: Create the group `devops` with GID `2000` (`groupadd -g 2000 devops`) and create user `dev01` with UID `1500` (`useradd -u 1500 dev01`).","Step 2: Add `dev01` to the `devops` group using `gpasswd -a dev01 devops` and set `dev01`'s maximum password validity period to 90 days using `chage -M 90 dev01`.","Step 3: Delete user `tempuser` and all of its home directory files recursively using `userdel -r tempuser`."],"starter_code":"# Step 1: Create group devops (GID 2000) and user dev01 (UID 1500)\n<groupadd_command>\n<useradd_command>\n\n# Step 2: Add dev01 to devops using gpasswd and set max password age to 90 days\n<gpasswd_command>\n<chage_command>\n\n# Step 3: Delete tempuser and its home directory\n<userdel_command>","solution_code":"# Step 1: Create group devops (GID 2000) and user dev01 (UID 1500)\ngroupadd -g 2000 devops\nuseradd -u 1500 dev01\n\n# Step 2: Add dev01 to devops using gpasswd and set max password age to 90 days\ngpasswd -a dev01 devops\nchage -M 90 dev01\n\n# Step 3: Delete tempuser and its home directory\nuserdel -r tempuser","hints":["Use `groupadd -g 2000 devops` and `useradd -u 1500 dev01`.","Use `gpasswd -a dev01 devops` and `chage -M 90 dev01`.","Use `userdel -r tempuser` so the home directory is also removed."],"validation_checks":[{"step":1,"description":"Create group devops (-g 2000) and user dev01 (-u 1500)","required_any":["useradd -u 1500 dev01"],"feedback_fail":"Use 'groupadd -g 2000 devops' and 'useradd -u 1500 dev01'."},{"step":2,"description":"Add user to group with gpasswd -a and set max password age with chage -M 90","required_any":["gpasswd -a dev01 devops"],"feedback_fail":"Use 'gpasswd -a dev01 devops' and 'chage -M 90 dev01'."},{"step":3,"description":"Delete tempuser and home directory with userdel -r","required_any":["userdel -r tempuser"],"feedback_fail":"Use 'userdel -r tempuser' to remove the user and home directory."}],"simulated_output":"Adding user dev01 to group devops\n[root@openEuler ~]# id dev01\nuid=1500(dev01) gid=1500(dev01) groups=1500(dev01),2000(devops)\n[root@openEuler ~]# chage -l dev01 | grep Maximum\nMaximum number of days between password change\t\t: 90\n[root@openEuler ~]# userdel -r tempuser\n[OK] tempuser and /home/tempuser removed.","quiz_questions":[{"id":"h4_s2_q1","type":"single","question":"Which command and option should be used to delete a user account `Test` along with their home directory and all files inside it?","options":["A. userdel Test","B. userdel -r Test","C. userdel -h Test","D. groupdel -f Test"],"answer":"B","explanation":"Per Ch.04 (p.165), if you do not add any options to `userdel`, only the user account is deleted. To delete the user's home directory and all contents recursively, run `userdel -r Test`."},{"id":"h4_s2_q2","type":"single","question":"Why does the official openEuler documentation recommend `gpasswd -a user_name group_name` over `usermod -G group_name user_name` when adding a user to a supplementary group?","options":["A. Because `usermod -G` cannot be run by the root user.","B. Because `usermod -G group_name user_name` removes the user from any previous supplementary groups, whereas `gpasswd -a` retains previous groups.","C. Because `gpasswd` automatically changes the user's UID to 0.","D. Because `usermod -G` deletes `/etc/group`."],"answer":"B","explanation":"Per Ch.04 (p.168), `usermod -G group_name user_name` adds a user to a specified group, but removes the user from any previous groups. `gpasswd -a` adds the user while retaining previous groups."},{"id":"h4_s2_q3","type":"multiple","question":"Which of the following statements about `passwd` and `chage` are TRUE?","options":["A. Only the `root` user can change any user's password, while common users can change only their own passwords.","B. `passwd -l` locks a user password so the locked user cannot log in to the system, while `passwd -u` unlocks it.","C. `chage -l user_name` checks the password expiration information of a specified user.","D. `chage -M` sets the maximum validity period of a password."],"answer":"ABCD","explanation":"Per Ch.04 (pp.166–167), all four statements accurately describe `passwd` and `chage`."}],"reference_figures":[]}},{"sprint_number":3,"lecture_slug":"05-Lecture-File-Permissions-Ownership-and-umask","exercise_slug":"06-Exercise-Chmod-Chown-Chgrp-and-Umask-Lab","lecture":{"title":"File Types, Permission Bits (`rwx`), Ownership (`chmod`, `chown`, `chgrp`) & `umask`","duration_mins":7,"pdf_ref":"Ch.04, pp. 169–183","objectives":["Identify all 7 Linux file types (`-`, `d`, `b`, `c`, `l`, `p`, `s`) and decode the 10-character `ls -l` permission string (Bits 0 to 9)","Modify permissions and ownership using `chmod` (symbolic & octal), `chown user:group`, and `chgrp`","Calculate default file and directory permissions from any `umask` value (`022`, `027`, `002`, `006`, `007`)"],"content_markdown":"### 1. Seven Linux File Types & 10-Bit Permission Structure (`ls -l`)\nIn `drwxr-xr-x. 2 root root 4096 Jun 1 14:00 shili`, the 10-character mode string is indexed as **Bits 0 to 9**:\n* **Bit 0 (File Type — 7 Types in Linux):**\n  1. **`-`**: Regular/general file (files excluding the other 6 types).\n  2. **`d`**: Directory.\n  3. **`b`**: Block device file (random access storage device, e.g., `/dev/sda`).\n  4. **`c`**: Character device file (one-time/serial read device such as keyboard and mouse).\n  5. **`l`**: Symbolic link file.\n  6. **`p`**: Named pipe (FIFO) file.\n  7. **`s`**: Socket file.\n* **Bits 1–9 (Three 3-Bit Permission Triads):**\n  * **Bits 1–3 (`u` — Owner):** File owner permissions.\n  * **Bits 4–6 (`g` — Group):** Owner group permissions.\n  * **Bits 7–9 (`o` — Others):** Other users' permissions.\n\n| Permission | Octal Value | Meaning on a Regular File (`-`) | Meaning on a Directory (`d`) |\n| :--- | :---: | :--- | :--- |\n| **`r` (Read)** | **4** | Read the actual content of the file. | Read the directory structure list (`ls`). |\n| **`w` (Write)** | **2** | Edit, add, or modify file content (does **not** allow deleting the file itself!). | **Create, delete, rename, or move files** inside the directory! |\n| **`x` (Execute)** | **1** | Execute the file as a program/script. | **Access/enter the directory (`cd`)**. |\n<!-- PDF_FIGS_START -->\n![Detailed Output Fields of 'ls -l' Command (Official Reference: p. 171)](./assets/images/p2_h4s3_ls_l_callouts.png)\n*Figure: Detailed Output Fields of 'ls -l' Command (Official Reference: p. 171)*\n\n![9-Bit File Permission Structure (File Type, Owner, Group, Other) (Official Reference: p. 173)](./assets/images/p2_h4s3_permission_bits.png)\n*Figure: 9-Bit File Permission Structure (File Type, Owner, Group, Other) (Official Reference: p. 173)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Permission & Ownership Commands: `chmod`, `chown`, `chgrp`\n* **`chmod [OPTION]... MODE FILE...` (Usable by file owner or `root`):**\n  * **Octal mode:** `chmod 644 usertxt` (`rw-r--r--`), `chmod -R 755 dir`.\n  * **Symbolic mode:** Objects `u` (owner), `g` (group), `o` (others), `a` (all) + Operators `+` (add), `-` (remove), `=` (set exact) + Permissions `r`, `w`, `x`.\n* **`chown [OPTION]... [OWNER][:[GROUP]] FILE...` (Usable by `root` only):**\n  * Changes file owner, owner group, or **both simultaneously**: `chown user:usergroup usertxt`.\n  * Options: **`-R`** (recursive), **`-h`** (modify symlink itself), **`-c`** (report only when changed), **`-f`** (ignore errors), **`-v`** (verbose).\n* **`chgrp [OPTION]... GROUP FILE...` (Usable by `root`):**\n  * Modifies the group to which a file/directory belongs (`chgrp usergroup01 usertxt`, `-R`, `--reference=<file>`).\n\n---\n\n### 3. Preset Permission Mask (`umask`)\n`umask [-p] [-S] [mode]` defines the permissions **masked out** when creating a new file (base `666`) or directory (base `777`):\n\n| `umask` Value | Default File Permission | Default Directory Permission |\n| :---: | :---: | :---: |\n| **`022`** | **`644`** (`rw-r--r--`) | **`755`** (`rwxr-xr-x`) |\n| **`027`** | **`640`** (`rw-r-----`) | **`750`** (`rwxr-x---`) |\n| **`002`** | **`664`** (`rw-rw-r--`) | **`775`** (`rwxrwxr-x`) |\n| **`006`** | **`660`** (`rw-rw----`) | **`771`** (`rwxrwx--x`) |\n| **`007`** | **`660`** (`rw-rw----`) | **`770`** (`rwxrwx---`) |","key_takeaways":["The 7 Linux file types are '-' (regular), 'd' (directory), 'b' (block device), 'c' (character device), 'l' (symlink), 'p' (named pipe), and 's' (socket).","chmod can be run by the file owner or root, whereas chown can only be run by the administrator (root).","With umask 022, new files get 644 and new directories get 755; with umask 027, new files get 640 and new directories get 750."],"exam_traps":["EXAM TRAP: Write permission ('w') on a file allows editing its content, NOT deleting the file! Deleting or renaming a file is controlled by write ('w') + execute ('x') permissions on the PARENT DIRECTORY.","EXAM TRAP: Notice 'umask 006' in the official table (Ch.04 p.182): directories get 777 - 006 = 771, while files strip the execute bit to get 660!"],"content_html":"<h3>1. Seven Linux File Types &amp; 10-Bit Permission Structure (<code class=\"inline-code\">ls -l<\/code>)<\/h3>\n<p>In <code class=\"inline-code\">drwxr-xr-x. 2 root root 4096 Jun 1 14:00 shili<\/code>, the 10-character mode string is indexed as <strong>Bits 0 to 9<\/strong>:<\/p>\n<ul class=\"md-list\">\n<li><strong>Bit 0 (File Type — 7 Types in Linux):<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">-<\/code><\/strong>: Regular/general file (files excluding the other 6 types).<\/li>\n<li><strong><code class=\"inline-code\">d<\/code><\/strong>: Directory.<\/li>\n<li><strong><code class=\"inline-code\">b<\/code><\/strong>: Block device file (random access storage device, e.g., <code class=\"inline-code\">/dev/sda<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">c<\/code><\/strong>: Character device file (one-time/serial read device such as keyboard and mouse).<\/li>\n<li><strong><code class=\"inline-code\">l<\/code><\/strong>: Symbolic link file.<\/li>\n<li><strong><code class=\"inline-code\">p<\/code><\/strong>: Named pipe (FIFO) file.<\/li>\n<li><strong><code class=\"inline-code\">s<\/code><\/strong>: Socket file.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Bits 1–9 (Three 3-Bit Permission Triads):<\/strong><\/li>\n<li><strong>Bits 1–3 (<code class=\"inline-code\">u<\/code> — Owner):<\/strong> File owner permissions.<\/li>\n<li><strong>Bits 4–6 (<code class=\"inline-code\">g<\/code> — Group):<\/strong> Owner group permissions.<\/li>\n<li><strong>Bits 7–9 (<code class=\"inline-code\">o<\/code> — Others):<\/strong> Other users' permissions.<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Permission<\/th><th>Octal Value<\/th><th>Meaning on a Regular File (<code class=\"inline-code\">-<\/code>)<\/th><th>Meaning on a Directory (<code class=\"inline-code\">d<\/code>)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">r<\/code> (Read)<\/strong><\/td><td><strong>4<\/strong><\/td><td>Read the actual content of the file.<\/td><td>Read the directory structure list (<code class=\"inline-code\">ls<\/code>).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">w<\/code> (Write)<\/strong><\/td><td><strong>2<\/strong><\/td><td>Edit, add, or modify file content (does <strong>not<\/strong> allow deleting the file itself!).<\/td><td><strong>Create, delete, rename, or move files<\/strong> inside the directory!<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">x<\/code> (Execute)<\/strong><\/td><td><strong>1<\/strong><\/td><td>Execute the file as a program/script.<\/td><td><strong>Access/enter the directory (<code class=\"inline-code\">cd<\/code>)<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h4s3_ls_l_callouts.png\" alt=\"Detailed Output Fields of 'ls -l' Command\" data-caption=\"Detailed Output Fields of 'ls -l' Command (Official Reference: p. 171)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Detailed Output Fields of 'ls -l' Command<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 171 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p2_h4s3_permission_bits.png\" alt=\"9-Bit File Permission Structure (File Type, Owner, Group, Other)\" data-caption=\"9-Bit File Permission Structure (File Type, Owner, Group, Other) (Official Reference: p. 173)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>9-Bit File Permission Structure (File Type, Owner, Group, Other)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 173 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Permission &amp; Ownership Commands: <code class=\"inline-code\">chmod<\/code>, <code class=\"inline-code\">chown<\/code>, <code class=\"inline-code\">chgrp<\/code><\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">chmod [OPTION]... MODE FILE...<\/code> (Usable by file owner or <code class=\"inline-code\">root<\/code>):<\/strong><\/li>\n<li><strong>Octal mode:<\/strong> <code class=\"inline-code\">chmod 644 usertxt<\/code> (<code class=\"inline-code\">rw-r--r--<\/code>), <code class=\"inline-code\">chmod -R 755 dir<\/code>.<\/li>\n<li><strong>Symbolic mode:<\/strong> Objects <code class=\"inline-code\">u<\/code> (owner), <code class=\"inline-code\">g<\/code> (group), <code class=\"inline-code\">o<\/code> (others), <code class=\"inline-code\">a<\/code> (all) + Operators <code class=\"inline-code\">+<\/code> (add), <code class=\"inline-code\">-<\/code> (remove), <code class=\"inline-code\">=<\/code> (set exact) + Permissions <code class=\"inline-code\">r<\/code>, <code class=\"inline-code\">w<\/code>, <code class=\"inline-code\">x<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">chown [OPTION]... [OWNER][:[GROUP]] FILE...<\/code> (Usable by <code class=\"inline-code\">root<\/code> only):<\/strong><\/li>\n<li>Changes file owner, owner group, or <strong>both simultaneously<\/strong>: <code class=\"inline-code\">chown user:usergroup usertxt<\/code>.<\/li>\n<li>Options: <strong><code class=\"inline-code\">-R<\/code><\/strong> (recursive), <strong><code class=\"inline-code\">-h<\/code><\/strong> (modify symlink itself), <strong><code class=\"inline-code\">-c<\/code><\/strong> (report only when changed), <strong><code class=\"inline-code\">-f<\/code><\/strong> (ignore errors), <strong><code class=\"inline-code\">-v<\/code><\/strong> (verbose).<\/li>\n<li><strong><code class=\"inline-code\">chgrp [OPTION]... GROUP FILE...<\/code> (Usable by <code class=\"inline-code\">root<\/code>):<\/strong><\/li>\n<li>Modifies the group to which a file/directory belongs (<code class=\"inline-code\">chgrp usergroup01 usertxt<\/code>, <code class=\"inline-code\">-R<\/code>, <code class=\"inline-code\">--reference=&lt;file&gt;<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Preset Permission Mask (<code class=\"inline-code\">umask<\/code>)<\/h3>\n<p><code class=\"inline-code\">umask [-p] [-S] [mode]<\/code> defines the permissions <strong>masked out<\/strong> when creating a new file (base <code class=\"inline-code\">666<\/code>) or directory (base <code class=\"inline-code\">777<\/code>):<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th><code class=\"inline-code\">umask<\/code> Value<\/th><th>Default File Permission<\/th><th>Default Directory Permission<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">022<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">644<\/code><\/strong> (<code class=\"inline-code\">rw-r--r--<\/code>)<\/td><td><strong><code class=\"inline-code\">755<\/code><\/strong> (<code class=\"inline-code\">rwxr-xr-x<\/code>)<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">027<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">640<\/code><\/strong> (<code class=\"inline-code\">rw-r-----<\/code>)<\/td><td><strong><code class=\"inline-code\">750<\/code><\/strong> (<code class=\"inline-code\">rwxr-x---<\/code>)<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">002<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">664<\/code><\/strong> (<code class=\"inline-code\">rw-rw-r--<\/code>)<\/td><td><strong><code class=\"inline-code\">775<\/code><\/strong> (<code class=\"inline-code\">rwxrwxr-x<\/code>)<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">006<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">660<\/code><\/strong> (<code class=\"inline-code\">rw-rw----<\/code>)<\/td><td><strong><code class=\"inline-code\">771<\/code><\/strong> (<code class=\"inline-code\">rwxrwx--x<\/code>)<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">007<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">660<\/code><\/strong> (<code class=\"inline-code\">rw-rw----<\/code>)<\/td><td><strong><code class=\"inline-code\">770<\/code><\/strong> (<code class=\"inline-code\">rwxrwx---<\/code>)<\/td><\/tr>\n<\/tbody><\/table><\/div>"},"exercise":{"title":"Hands-On Lab: Modifying Permissions (`chmod`), Dual Ownership (`chown`) & `umask`","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@openEuler:~#","scenario":"You are securing the directory `usertxt` on openEuler (following the exact official lab on pp. 177–183). Set its permissions to `644`, change both its owner and group to `user:usergroup` using `chown`, change its group to `usergroup01` using `chgrp`, and set the system `umask` to `022`.","instructions":["Step 1: Modify the permissions of `usertxt` to `644` using `chmod 644 usertxt`.","Step 2: Change both the owner and group of `usertxt` to `user:usergroup` using `chown user:usergroup usertxt`, then change its group to `usergroup01` using `chgrp usergroup01 usertxt`.","Step 3: Set the preset permission mask to `022` using `umask 022`."],"starter_code":"# Step 1: Set permissions of usertxt to 644\n<chmod_command>\n\n# Step 2: Change owner and group to user:usergroup, then group to usergroup01\n<chown_command>\n<chgrp_command>\n\n# Step 3: Set permission mask to 022\n<umask_command>","solution_code":"# Step 1: Set permissions of usertxt to 644\nchmod 644 usertxt\n\n# Step 2: Change owner and group to user:usergroup, then group to usergroup01\nchown user:usergroup usertxt\nchgrp usergroup01 usertxt\n\n# Step 3: Set permission mask to 022\numask 022","hints":["Use `chmod 644 usertxt`.","Use `chown user:usergroup usertxt` and `chgrp usergroup01 usertxt` (exact commands from Ch.04 pp.179, 181).","Use `umask 022`."],"validation_checks":[{"step":1,"description":"Set permissions to 644 with chmod","required_any":["chmod 644 usertxt"],"feedback_fail":"Use 'chmod 644 usertxt'."},{"step":2,"description":"Change owner:group with chown and group with chgrp","required_any":["chown user:usergroup usertxt"],"feedback_fail":"Include 'chown user:usergroup usertxt' and 'chgrp usergroup01 usertxt'."},{"step":3,"description":"Set umask to 022","required_any":["umask 022","umask 0022"],"feedback_fail":"Use 'umask 022' to set the permission mask."}],"simulated_output":"[root@openEuler ~]# ls -ld usertxt\ndrw-r--r--. 2 user usergroup01 4096 Jun  8 11:10 usertxt\n[root@openEuler ~]# umask\n0022","quiz_questions":[{"id":"h4_s3_q1","type":"single","question":"In the output of `ls -l`, what does the first character `c` vs. `b` represent in the file type and permission string?","options":["A. `c` = compressed file; `b` = binary executable","B. `c` = character device file (e.g., keyboard/mouse); `b` = block device file (random access storage)","C. `c` = configuration file; `b` = boot loader file","D. `c` = socket file; `b` = named pipe file"],"answer":"B","explanation":"Per Ch.04 (p.172), `b` indicates a block device file (random access device) and `c` indicates a character device file (one-time read device such as keyboard and mouse)."},{"id":"h4_s3_q2","type":"single","question":"According to the openEuler `umask` table, if the `umask` value is set to `027`, what are the default permissions for newly created files and directories respectively?","options":["A. File: 644; Directory: 755","B. File: 640; Directory: 750","C. File: 664; Directory: 775","D. File: 660; Directory: 770"],"answer":"B","explanation":"Per Ch.04 (p.182), when `umask` is `027`, the default file permission is `640` and the default directory permission is `750`."},{"id":"h4_s3_q3","type":"multiple","question":"Which of the following statements about directory permissions (`r`, `w`, `x`) and ownership commands are TRUE?","options":["A. Having `w` (write) permission on a directory allows a user to create, delete, or move files within that directory.","B. Having `x` (execute) permission on a directory allows a user to access (`cd` into) that directory.","C. `chown user:usergroup file` modifies both the file owner and the file owner group at the same time.","D. Any common user can run `chown` to transfer ownership of their files to `root`."],"answer":"ABC","explanation":"Per Ch.04 (pp.174–179), A, B, and C are true. Option D is false because the usage permission for `chown` is restricted to the administrator (`root`)."}],"reference_figures":[{"slug":"p2_h4s3_permission_bits","title":"9-Bit File Permission Structure (File Type, Owner, Group, Other)","pdf_page":173}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Sticky-Bit-ACL-and-Privilege-Escalation","exercise_slug":"08-Exercise-ACL-and-Sudo-Configuration-Lab","lecture":{"title":"Sticky Bit, Access Control Lists (`getfacl`, `setfacl`, `chacl`) & Privilege Escalation (`su`, `sudo`)","duration_mins":7,"pdf_ref":"Ch.04, pp. 184–193","objectives":["Explain how the Sticky Bit (`drwxrwxrwt`) protects shared directories like `/tmp` and `/share` from unauthorized file deletion","Configure fine-grained Access Control Lists using `getfacl`, `setfacl` (`-m`, `-x`, `-b`, `-k`, `-R`, `-d`), and `chacl` (`-b`, `-d`, `-R`, `-D`, `-B`, `-l`, `-r`)","Compare `su`, `su -`, and `sudo`, and author `/etc/sudoers` and `/etc/sudoers.d/username` rules using `visudo`"],"content_markdown":"### 1. Sticky Bit (`t`) & Access Control Lists (ACL)\n* **Sticky Bit (`drwxrwxrwt`, octal prefix `1`, `chmod o+t`):**\n  * Special permission set on shared directories (such as `/tmp` or `/share`).\n  * **Rule:** When the Sticky Bit is enabled on a directory, **only the file owner, the directory owner, or the `root` user can rename or remove files within that directory**—even if all users have `rwx` (`777`) permissions on the directory and files!\n* **Access Control Lists (ACL):**\n  * Solves the limitation of traditional `ugo` (`rwx`) permissions by granting fine-grained permissions to specific individual users or groups.\n  * **Indicator:** In `ls -l`, a **plus sign (`+`)** at the end of the permission string (`-rw-rw-r--+`) indicates the file has an ACL configured!\n  * **3 ACL Commands:**\n    1. **`getfacl [-aceEsRLPtpndvh] file...`:** Obtains ACLs (`-a` file ACL only, `-d` default ACL only, `-c` omit header, `-R` recursive, `-n` numeric UIDs/GIDs).\n    2. **`setfacl [-bkndRLP] {-m|-M|-x|-X} file...`:** Sets ACLs:\n       * **`-m`:** Modifies/adds an ACL entry (e.g., `setfacl -m u:user1:rwx test`; cannot be combined with `-x`).\n       * **`-x`:** Deletes specified ACL entries.\n       * **`-b`:** **Deletes ALL extended ACL entries**.\n       * **`-k`:** Removes default/preset directory ACL entries; **`-d`** presets default directory ACLs; **`-R`** recursive.\n    3. **`chacl`:** Changes file/directory ACLs (`-b` modify file & default dir ACLs, `-d` set default dir ACL, `-R` delete file ACLs only, `-D` delete dir ACLs only, **`-B` delete all ACLs**, `-l` list ACLs, `-r` recursive).\n\n---\n\n### 2. Comparing `su` (`su -`) vs. `sudo`\n| Dimension | `su` (substitute user) | `sudo` (superuser do) |\n| :--- | :--- | :--- |\n| **Basic Function** | Switc
