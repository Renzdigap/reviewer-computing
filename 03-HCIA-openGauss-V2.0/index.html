code\">ON DUPLICATE KEY UPDATE<\/code> requires <code class=\"inline-code\">INSERT<\/code>, <code class=\"inline-code\">SELECT<\/code>, and <code class=\"inline-code\">UPDATE<\/code> on the table plus <code class=\"inline-code\">SELECT<\/code> on the unique/primary key index.<\/li>\n<li><strong>Record Size Limit (p. 397)<\/strong>: Data size of a single inserted record must be <strong>&lt; 64,000 bytes<\/strong> in standard row-store insert precautions.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Updating Data (<code class=\"inline-code\">UPDATE<\/code>, pp. 400–401, Ch.05 p. 405 Quiz Q1!)<\/h3>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>UPDATE table_reference SET col_name = expression [, ...] [ WHERE condition ];<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Official Exam Question (Ch.05 p. 405 Quiz Q1: C!)<\/strong>:<\/li>\n<li>To increase the value of the <code class=\"inline-code\">AGE<\/code> column in the <code class=\"inline-code\">STAFFS<\/code> table by 5 years:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>    UPDATE STAFFS SET AGE = AGE + 5;<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><em>(Why are A, B, D wrong? Because SQL <code class=\"inline-code\">UPDATE<\/code> uses <code class=\"inline-code\">UPDATE &lt;table&gt; SET &lt;col&gt; = &lt;expr&gt;<\/code>, NEVER <code class=\"inline-code\">WITH<\/code>!)<\/em><\/li>\n<li><strong>Column-Store <code class=\"inline-code\">UPDATE<\/code> Precautions (p. 400)<\/strong>:<\/li>\n<li><code class=\"inline-code\">RETURNING<\/code> clause is <strong>not supported<\/strong> for column-store tables.<\/li>\n<li>Memory/space holding old records in a column-store table is <strong>not automatically recycled<\/strong> after <code class=\"inline-code\">UPDATE<\/code> — you must run <strong><code class=\"inline-code\">VACUUM FULL table_name;<\/code><\/strong> to reclaim it.<\/li>\n<li><code class=\"inline-code\">UPDATE<\/code> is <strong>not supported<\/strong> on column-store replication tables.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Deleting Data (<code class=\"inline-code\">DELETE<\/code>, pp. 402–404, Ch.05 p. 406 Quiz Q3!)<\/h3>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>DELETE FROM [schema_name.]table_name [ WHERE condition ];<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Official Exam Question (Ch.05 p. 406 Quiz Q3: A!)<\/strong>:<\/li>\n<li>To delete records for all students whose class ID (<code class=\"inline-code\">cid<\/code>) is <code class=\"inline-code\">6<\/code> from the <code class=\"inline-code\">student<\/code> table:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>    DELETE FROM student WHERE cid = 6;<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>CRITICAL SYNTAX TRAP<\/strong>: Never put <code class=\"inline-code\"><em><\/code> after <code class=\"inline-code\">DELETE<\/code> (<code class=\"inline-code\">DELETE <\/em> FROM ...<\/code> is a syntax error!), and use <code class=\"inline-code\">WHERE<\/code> (not <code class=\"inline-code\">ON<\/code>) for the filter condition!<\/li>\n<li>If the <code class=\"inline-code\">WHERE<\/code> clause is omitted (<code class=\"inline-code\">DELETE FROM student;<\/code>), <strong>all rows in the table are deleted<\/strong>, leaving the empty table structure intact.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Executing Upsert (`ON DUPLICATE KEY UPDATE`), `UPDATE`, and `DELETE`","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Execute the three high-yield DML operations from Chapter 05: perform an upsert on `bank_card` using `ON DUPLICATE KEY UPDATE`, increment all employees' ages by 5 in `STAFFS`, and delete all students in class `cid = 6` from `student`.","instructions":["Step 1: Insert `('6222021302020000001', 'Credit Card', 1)` into `bank_card` and update `b_type = 'Savings Card'` on duplicate key.","Step 2: Increase the `AGE` column in the `STAFFS` table by 5 years using `UPDATE STAFFS SET AGE = AGE + 5;`.","Step 3: Delete all records from `student` where `cid = 6` using `DELETE FROM student WHERE cid = 6;`."],"starter_code":"-- Step 1: Upsert into bank_card using ON DUPLICATE KEY UPDATE\nINSERT INTO bank_card VALUES ('6222021302020000001', 'Credit Card', 1)\n____ ____ ____ UPDATE b_type = 'Savings Card';\n\n-- Step 2 (Ch.05 Quiz Q1): Increase AGE in STAFFS by 5 years\nUPDATE STAFFS ____ AGE = ____;\n\n-- Step 3 (Ch.05 Quiz Q3): Delete students with cid = 6\n____ ____ student ____ cid = 6;\n","solution_code":"INSERT INTO bank_card VALUES ('6222021302020000001', 'Credit Card', 1)\nON DUPLICATE KEY UPDATE b_type = 'Savings Card';\n\nUPDATE STAFFS SET AGE = AGE + 5;\n\nDELETE FROM student WHERE cid = 6;","hints":["Use `ON DUPLICATE KEY UPDATE b_type = 'Savings Card'`.","Use `UPDATE STAFFS SET AGE = AGE + 5;`.","Use `DELETE FROM student WHERE cid = 6;` (do not put `*` after `DELETE`)."],"validation_checks":[{"step":1,"description":"Use `ON DUPLICATE KEY UPDATE`","required_any":["on duplicate key update"],"feedback_fail":"Include `ON DUPLICATE KEY UPDATE b_type = 'Savings Card';`."},{"step":2,"description":"Update `STAFFS` with `UPDATE STAFFS SET AGE = AGE + 5`","required_any":["update staffs set age = age + 5","update staffs set age=age+5","update staffs set age = age+5"],"feedback_fail":"Use `UPDATE STAFFS SET AGE = AGE + 5;`."},{"step":3,"description":"Delete from `student` with `DELETE FROM student WHERE cid = 6`","required_any":["delete from student where cid = 6","delete from student where cid=6"],"feedback_fail":"Use `DELETE FROM student WHERE cid = 6;`."}],"simulated_output":"INSERT 0 1\nUPDATE 42\nDELETE 8","quiz_questions":[{"id":"h6_s4_q1","type":"single","question":"(Official Ch.05 Quiz p. 405 Q1) Which of the following SQL commands can be used to increase the value of the `AGE` column in the `STAFFS` table by five years?","options":["A. UPDATE SET AGE WITH AGE+5","B. UPDATE AGE WITH AGE+5","C. UPDATE STAFFS SET AGE = AGE+5","D. UPDATE STAFFS AGE WITH AGE+5"],"answer":"C","explanation":"Per Chapter 05 (p. 401 & p. 405), the correct `UPDATE` syntax is `UPDATE table_name SET column_name = expression`, so `UPDATE STAFFS SET AGE = AGE+5` is correct."},{"id":"h6_s4_q2","type":"single","question":"(Official Ch.05 Quiz p. 406 Q3) Which of the following SQL statements will delete records for all students whose class ID (specified by `cid`) is 6 from the `student` table?","options":["A. delete FROM student where cid = 6;","B. delete * FROM student where cid = 6;","C. delete FROM student on cid = 6;","D. delete * FROM student on cid = 6;"],"answer":"A","explanation":"Per Chapter 05 (p. 403 & p. 406), the `DELETE` syntax is `DELETE FROM table_name WHERE condition;`. Putting `*` after `DELETE` or using `ON` instead of `WHERE` is invalid."},{"id":"h6_s4_q3","type":"tf","question":"In openGauss, the `IGNORE` keyword in `INSERT IGNORE INTO ...` can be used together with the `ON DUPLICATE KEY UPDATE` clause in the same `INSERT` statement.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.05 p. 398). `IGNORE` ignores records that cause duplicate key errors and CANNOT be used together with `ON DUPLICATE KEY UPDATE`."}],"reference_figures":[]}}]},{"hour_number":7,"folder_name":"Hour-07-SQL-DDL-Objects-Operators-and-Functions","title":"SQL DDL Objects, Sequences, Operators & Built-in Functions","chapter_ref":"Chapter 05 Part 2 (pp. 407–473)","duration_mins":60,"overview":"Master DDL statements (`CREATE`, `ALTER`, `DROP`) for Databases (`template0` vs `template1`), Schemas (`AUTHORIZATION`, `SEARCH_PATH`), Tables & Constraints (`PRIMARY KEY`, `FOREIGN KEY`, `UNIQUE`, `CHECK`, `NOT NULL`, `PARTIAL CLUSTER KEY`), Partitioned Tables & Indexes (`LOCAL`, `GLOBAL`, `CONCURRENTLY`, `UNUSABLE`), Views & Sequences (including decremental sequences!), and Built-in Operators & Functions (Logical, Comparison, String, Arithmetic, Date/Time, Type Conversion, and Geometric).","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-DDL-Databases-Schemas-Tables-and-Constraints","exercise_slug":"02-Exercise-DDL-Database-Schema-and-Table-Constraints-Lab","lecture":{"title":"DDL for Databases, Schemas, Tables & Constraints","duration_mins":7,"pdf_ref":"Ch.05, pp. 407–426","objectives":["Create, modify, and drop Databases (`CREATE/ALTER/DROP DATABASE`), understanding `template0` vs `template1`, `DBCOMPATIBILITY`, and transaction block restrictions","Create Schemas with embedded sub-commands (`CREATE SCHEMA AUTHORIZATION role1 CREATE TABLE ...`) and inspect `SHOW SEARCH_PATH`","Create and alter Tables and Constraints (`PRIMARY KEY`, `UNIQUE`, `CHECK`, `FOREIGN KEY`, and Column-Store constraint rules)"],"content_markdown":"### 1. Defining Databases (`CREATE / ALTER / DROP DATABASE`, pp. 409–414)\n- **Three Default Databases After Installation**: **`postgres`** (default user DB), **`template0`**, and **`template1`** (protected system databases — **cannot be dropped**!).\n- **Template Rule (`template0` vs. `template1`, p. 410)**:\n  - openGauss creates a new database by copying a template database (`template1` by default).\n  - The encoding/locale of `template1` cannot be changed. **If you need to specify a custom `ENCODING` (e.g., `UTF8`, `GBK`, `Latin1`) when creating a database, you MUST specify `TEMPLATE template0`!**\n- **Critical Restrictions (pp. 410, 414)**:\n  - Neither **`CREATE DATABASE`** nor **`DROP DATABASE`** can be executed inside a transaction block (`BEGIN ... COMMIT`)!\n  - A database cannot be dropped while active user sessions are connected (check via **`vsession`** or `pg_stat_activity`).\n  - `ALTER DATABASE db SET TABLESPACE ts_new;` physically moves tables/indexes that are in the database's old default tablespace to `ts_new` (objects explicitly placed in other tablespaces are unaffected).\n\n```sql\nCREATE DATABASE music OWNER jim TEMPLATE template0 ENCODING 'UTF8';\nALTER DATABASE music WITH CONNECTION LIMIT 30;\nALTER DATABASE music RENAME TO music01;\nALTER DATABASE music01 SET TABLESPACE tablespace01;\nALTER DATABASE music01 OWNER TO jim01;\nDROP DATABASE IF EXISTS music01;\n```\n\n---\n\n### 2. Defining Schemas (`CREATE / ALTER / DROP SCHEMA`, pp. 415–419)\n- **Creating a Schema with Sub-Commands (pp. 416–417)**:\n  ```sql\n  CREATE SCHEMA AUTHORIZATION role1\n      CREATE TABLE films (title text, release date, awards text[])\n      CREATE VIEW winners AS SELECT title, release FROM films WHERE awards IS NOT NULL;\n  ```\n  - Supported sub-commands inside `CREATE SCHEMA`: `CREATE TABLE`, `CREATE VIEW`, `CREATE INDEX`, `CREATE PARTITION`, and `GRANT`. All created objects are owned by `role1`.\n  - **Ownership Rule (p. 416)**: If a `SYSADMIN` creates an object inside a schema that has the same name as a common user, the owner of that object is **that common user**, NOT the `SYSADMIN`!\n  - Check current schema resolution order via **`SHOW SEARCH_PATH;`**.\n\n---\n\n### 3. Defining Tables & Constraints (`CREATE / ALTER / DROP TABLE`, pp. 420–426)\n- **Row-Store vs. Column-Store Constraint Support (p. 421)**:\n  - **Row-Store Tables**: Support `NOT NULL`, `NULL`, `DEFAULT`, **`UNIQUE`** (no duplicate values, **but `NULL` is allowed**), **`PRIMARY KEY`** (unique + `NOT NULL`, auto-creates unique index), **`CHECK (expression)`**, and **`FOREIGN KEY ... REFERENCES ...`** (can have duplicate or `NULL` values).\n  - **Column-Store Tables**: Support **ONLY `PARTIAL CLUSTER KEY`** at the table level (**do NOT support `PRIMARY KEY` or `FOREIGN KEY` table-level constraints**), and **ONLY `NULL`, `NOT NULL`, and `DEFAULT` constant values** at the column level!\n- **Modifying Tables (`ALTER TABLE`, pp. 423–425)**:\n  ```sql\n  ALTER TABLE bank_card ADD full_masks INTEGER;\n  ALTER TABLE bank_card MODIFY full_masks NVARCHAR2(20);\n  ALTER TABLE bank_card ADD CONSTRAINT ck_bank_card CHECK(b_c_id > 0);\n  ALTER TABLE bank_card ADD CONSTRAINT uk_bank_card UNIQUE(full_masks);\n  ALTER TABLE bank_card DROP full_masks;\n  DROP TABLE IF EXISTS training CASCADE;\n  ```","key_takeaways":["To change the character encoding when creating a database, you must specify `TEMPLATE template0` (`template1`'s encoding cannot be changed). `CREATE DATABASE` and `DROP DATABASE` cannot run inside a transaction block.","Column-store tables support ONLY `PARTIAL CLUSTER KEY` table constraints (no `PRIMARY KEY` or `FOREIGN KEY`) and ONLY `NULL`, `NOT NULL`, and `DEFAULT` column constraints.","`UNIQUE` constraints disallow duplicate non-null values but allow `NULL`, whereas `FOREIGN KEY` columns can contain duplicate or `NULL` values."],"exam_traps":["EXAM TRAP (Ch.05 p. 446 Quiz Q2): 'Which function is implemented by the `CREATE`, `DROP`, and `ALTER` statements?' -> C. Data definition (DDL)!","EXAM TRAP: If a `SYSADMIN` creates an object inside a schema named after a common user (e.g., `jack.t1`), the owner of `t1` is the common user (`jack`), NOT the `SYSADMIN` (Ch.05 p. 416)!"],"content_html":"<h3>1. Defining Databases (<code class=\"inline-code\">CREATE / ALTER / DROP DATABASE<\/code>, pp. 409–414)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Three Default Databases After Installation<\/strong>: <strong><code class=\"inline-code\">postgres<\/code><\/strong> (default user DB), <strong><code class=\"inline-code\">template0<\/code><\/strong>, and <strong><code class=\"inline-code\">template1<\/code><\/strong> (protected system databases — <strong>cannot be dropped<\/strong>!).<\/li>\n<li><strong>Template Rule (<code class=\"inline-code\">template0<\/code> vs. <code class=\"inline-code\">template1<\/code>, p. 410)<\/strong>:<\/li>\n<li>openGauss creates a new database by copying a template database (<code class=\"inline-code\">template1<\/code> by default).<\/li>\n<li>The encoding/locale of <code class=\"inline-code\">template1<\/code> cannot be changed. <strong>If you need to specify a custom <code class=\"inline-code\">ENCODING<\/code> (e.g., <code class=\"inline-code\">UTF8<\/code>, <code class=\"inline-code\">GBK<\/code>, <code class=\"inline-code\">Latin1<\/code>) when creating a database, you MUST specify <code class=\"inline-code\">TEMPLATE template0<\/code>!<\/strong><\/li>\n<li><strong>Critical Restrictions (pp. 410, 414)<\/strong>:<\/li>\n<li>Neither <strong><code class=\"inline-code\">CREATE DATABASE<\/code><\/strong> nor <strong><code class=\"inline-code\">DROP DATABASE<\/code><\/strong> can be executed inside a transaction block (<code class=\"inline-code\">BEGIN ... COMMIT<\/code>)!<\/li>\n<li>A database cannot be dropped while active user sessions are connected (check via <strong><code class=\"inline-code\">vsession<\/code><\/strong> or <code class=\"inline-code\">pg_stat_activity<\/code>).<\/li>\n<li><code class=\"inline-code\">ALTER DATABASE db SET TABLESPACE ts_new;<\/code> physically moves tables/indexes that are in the database's old default tablespace to <code class=\"inline-code\">ts_new<\/code> (objects explicitly placed in other tablespaces are unaffected).<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>CREATE DATABASE music OWNER jim TEMPLATE template0 ENCODING 'UTF8';\nALTER DATABASE music WITH CONNECTION LIMIT 30;\nALTER DATABASE music RENAME TO music01;\nALTER DATABASE music01 SET TABLESPACE tablespace01;\nALTER DATABASE music01 OWNER TO jim01;\nDROP DATABASE IF EXISTS music01;<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Defining Schemas (<code class=\"inline-code\">CREATE / ALTER / DROP SCHEMA<\/code>, pp. 415–419)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Creating a Schema with Sub-Commands (pp. 416–417)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  CREATE SCHEMA AUTHORIZATION role1\n      CREATE TABLE films (title text, release date, awards text[])\n      CREATE VIEW winners AS SELECT title, release FROM films WHERE awards IS NOT NULL;<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li>Supported sub-commands inside <code class=\"inline-code\">CREATE SCHEMA<\/code>: <code class=\"inline-code\">CREATE TABLE<\/code>, <code class=\"inline-code\">CREATE VIEW<\/code>, <code class=\"inline-code\">CREATE INDEX<\/code>, <code class=\"inline-code\">CREATE PARTITION<\/code>, and <code class=\"inline-code\">GRANT<\/code>. All created objects are owned by <code class=\"inline-code\">role1<\/code>.<\/li>\n<li><strong>Ownership Rule (p. 416)<\/strong>: If a <code class=\"inline-code\">SYSADMIN<\/code> creates an object inside a schema that has the same name as a common user, the owner of that object is <strong>that common user<\/strong>, NOT the <code class=\"inline-code\">SYSADMIN<\/code>!<\/li>\n<li>Check current schema resolution order via <strong><code class=\"inline-code\">SHOW SEARCH_PATH;<\/code><\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Defining Tables &amp; Constraints (<code class=\"inline-code\">CREATE / ALTER / DROP TABLE<\/code>, pp. 420–426)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Row-Store vs. Column-Store Constraint Support (p. 421)<\/strong>:<\/li>\n<li><strong>Row-Store Tables<\/strong>: Support <code class=\"inline-code\">NOT NULL<\/code>, <code class=\"inline-code\">NULL<\/code>, <code class=\"inline-code\">DEFAULT<\/code>, <strong><code class=\"inline-code\">UNIQUE<\/code><\/strong> (no duplicate values, <strong>but <code class=\"inline-code\">NULL<\/code> is allowed<\/strong>), <strong><code class=\"inline-code\">PRIMARY KEY<\/code><\/strong> (unique + <code class=\"inline-code\">NOT NULL<\/code>, auto-creates unique index), <strong><code class=\"inline-code\">CHECK (expression)<\/code><\/strong>, and <strong><code class=\"inline-code\">FOREIGN KEY ... REFERENCES ...<\/code><\/strong> (can have duplicate or <code class=\"inline-code\">NULL<\/code> values).<\/li>\n<li><strong>Column-Store Tables<\/strong>: Support <strong>ONLY <code class=\"inline-code\">PARTIAL CLUSTER KEY<\/code><\/strong> at the table level (<strong>do NOT support <code class=\"inline-code\">PRIMARY KEY<\/code> or <code class=\"inline-code\">FOREIGN KEY<\/code> table-level constraints<\/strong>), and <strong>ONLY <code class=\"inline-code\">NULL<\/code>, <code class=\"inline-code\">NOT NULL<\/code>, and <code class=\"inline-code\">DEFAULT<\/code> constant values<\/strong> at the column level!<\/li>\n<li><strong>Modifying Tables (<code class=\"inline-code\">ALTER TABLE<\/code>, pp. 423–425)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  ALTER TABLE bank_card ADD full_masks INTEGER;\n  ALTER TABLE bank_card MODIFY full_masks NVARCHAR2(20);\n  ALTER TABLE bank_card ADD CONSTRAINT ck_bank_card CHECK(b_c_id &gt; 0);\n  ALTER TABLE bank_card ADD CONSTRAINT uk_bank_card UNIQUE(full_masks);\n  ALTER TABLE bank_card DROP full_masks;\n  DROP TABLE IF EXISTS training CASCADE;<\/code><\/pre><\/div>"},"exercise":{"title":"Hands-On Lab: Creating Databases with `template0`, Schemas with Sub-Commands & Table Constraints","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Create database `music` owned by `jim` using `template0`, create a schema for `role1` with an embedded `CREATE TABLE`, and add `CHECK` and `UNIQUE` constraints to `bank_card`.","instructions":["Step 1: Create database `music` owned by `jim` using `CREATE DATABASE music OWNER jim TEMPLATE template0;` and set its connection limit to 30 (`ALTER DATABASE music WITH CONNECTION LIMIT 30;`).","Step 2: Add a `CHECK(b_c_id > 0)` constraint `ck_bank_card` and a `UNIQUE(full_masks)` constraint `uk_bank_card` to `bank_card` using `ALTER TABLE`."],"starter_code":"-- Step 1: Create database music using template0 and limit connections to 30\nCREATE DATABASE music OWNER jim TEMPLATE ____;\nALTER DATABASE music WITH ____ LIMIT 30;\n\n-- Step 2: Add CHECK and UNIQUE constraints to bank_card\nALTER TABLE bank_card ADD CONSTRAINT ck_bank_card ____(b_c_id > 0);\nALTER TABLE bank_card ADD CONSTRAINT uk_bank_card ____(full_masks);\n","solution_code":"CREATE DATABASE music OWNER jim TEMPLATE template0;\nALTER DATABASE music WITH CONNECTION LIMIT 30;\n\nALTER TABLE bank_card ADD CONSTRAINT ck_bank_card CHECK(b_c_id > 0);\nALTER TABLE bank_card ADD CONSTRAINT uk_bank_card UNIQUE(full_masks);","hints":["Use `TEMPLATE template0` when creating a database that may customize encoding/locale.","Use `WITH CONNECTION LIMIT 30` in `ALTER DATABASE`.","Use `CHECK(b_c_id > 0)` and `UNIQUE(full_masks)`."],"validation_checks":[{"step":1,"description":"Create database using `TEMPLATE template0`","required_any":["template template0"],"feedback_fail":"Specify `TEMPLATE template0` in `CREATE DATABASE`."},{"step":2,"description":"Set connection limit with `CONNECTION LIMIT 30`","required_any":["connection limit 30"],"feedback_fail":"Use `ALTER DATABASE music WITH CONNECTION LIMIT 30;`."},{"step":3,"description":"Add `CHECK` and `UNIQUE` constraints","required_any":["check(b_c_id > 0)","check (b_c_id > 0)","check(b_c_id>0)"],"feedback_fail":"Add `CHECK(b_c_id > 0)` and `UNIQUE(full_masks)`."}],"simulated_output":"CREATE DATABASE\nALTER DATABASE\nALTER TABLE\nALTER TABLE","quiz_questions":[{"id":"h7_s1_q1","type":"single","question":"(Official Ch.05 Quiz p. 446 Q2) SQL integrates data query, data manipulation, data definition, and data control. Which of the following functions is implemented by the `CREATE`, `DROP`, and `ALTER` statements?","options":["A. Data query","B. Data manipulation","C. Data definition","D. Data control"],"answer":"C","explanation":"Per Chapter 05 (p. 408 & p. 446), `CREATE`, `DROP`, and `ALTER` are Data Definition Language (DDL) statements used to define, modify, and remove database objects."},{"id":"h7_s1_q2","type":"single","question":"When creating a new database in openGauss with a custom character encoding format (different from the default template), which template database must be specified?","options":["A. postgres","B. template0","C. template1","D. sys_dummy"],"answer":"B","explanation":"Per Chapter 05 (p. 410), the encoding format of `template1` cannot be changed. If you need to change the encoding format when creating a database, you must use `template0`."},{"id":"h7_s1_q3","type":"tf","question":"In openGauss, column-store tables support table-level `PRIMARY KEY` and `FOREIGN KEY` constraints just like row-store tables.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.05 p. 421). Column-store tables support only `PARTIAL CLUSTER KEY` table-level constraints and do NOT support primary key and foreign key table-level constraints."}],"reference_figures":[]}},{"sprint_number":2,"lecture_slug":"03-Lecture-DDL-Partitioned-Tables-and-Indexes","exercise_slug":"04-Exercise-Partition-Maintenance-and-Index-DDL-Lab","lecture":{"title":"DDL for Partitioned Tables & Indexes","duration_mins":7,"pdf_ref":"Ch.05, pp. 427–437, 446","objectives":["Create Range, Interval, List, and Hash Partitioned Tables with `ENABLE ROW MOVEMENT` and understand partition key constraint rules","Execute partition maintenance clauses (`MOVE`, `EXCHANGE`, `MERGE`, `SPLIT`, `ADD`, `DROP`, `RENAME`)","Create, rebuild, rename, mark `UNUSABLE`, and drop Indexes (`LOCAL` vs `GLOBAL`, `DROP INDEX CONCURRENTLY`), avoiding the Ch.05 Quiz Q1 index-drop trap"],"content_markdown":"### 1. Creating & Maintaining Partitioned Tables (pp. 427–431)\n- **Important Partitioning Rules (p. 428)**:\n  1. **Unique / Primary Key Constraint Rule**: A partitioned table supports `UNIQUE` and `PRIMARY KEY` constraints, **but the constraint key columns MUST contain all partition keys**!\n  2. **Single-Column vs. Multi-Column**: **Range partitioning** supports one or multiple partition key columns; **Hash partitioning** and **List partitioning** currently support **only a single partition key column**!\n  3. **`ENABLE | DISABLE ROW MOVEMENT`**: Controls whether an `UPDATE` that changes a row's partition key value automatically moves the tuple across partitions (`ENABLE ROW MOVEMENT`) or raises an error (`DISABLE`).\n  4. **Execution Order of Multiple Maintenance Clauses (p. 430)**: When multiple partition clauses are combined in `ALTER TABLE`, openGauss executes **`DROP PARTITION` first**, then **`ADD PARTITION`**, and finally the remaining clauses in order (`MOVE`, `EXCHANGE`, `MERGE`, `SPLIT`, `RENAME`).\n\n```sql\nCREATE TABLE training(staff_id INT NOT NULL, course_name CHAR(20), score INT)\nTABLESPACE example1\nPARTITION BY RANGE(staff_id) (\n    PARTITION training1 VALUES LESS THAN(100),\n    PARTITION training2 VALUES LESS THAN(200),\n    PARTITION training3 VALUES LESS THAN(300),\n    PARTITION training4 VALUES LESS THAN(MAXVALUE) TABLESPACE example2\n) ENABLE ROW MOVEMENT;\n\nALTER TABLE training MOVE PARTITION training1 TABLESPACE example3;\nALTER TABLE training MERGE PARTITION training1, training2 INTO PARTITION training3;\nALTER TABLE training DROP PARTITION training4;\nALTER TABLE training RENAME PARTITION training3 TO training5;\n```\n\n---\n\n### 2. Defining, Modifying & Dropping Indexes (pp. 432–437, 446)\n- **Index Classifications (p. 432)**:\n  - **Single-column** vs. **Multi-column (Composite)**: A composite index is used only when the **leading (first) column** is referenced in the query condition; supports up to **16 columns** and max key length **3,900 bytes** (p. 432).\n  - **Common (B-Tree default)**, **Unique** (auto-created on `PRIMARY KEY`), **Function-based**, and **Partitioned (`LOCAL` vs. `GLOBAL`)**.\n- **Modifying & Dropping Indexes (pp. 435–437)**:\n  ```sql\n  CREATE INDEX idx_bank_card ON bank_card(b_number ASC, b_type);\n  CREATE INDEX idx_education ON education(staff_id ASC, higest_degree)\n      LOCAL (PARTITION doctor, PARTITION master, PARTITION undergraduate);\n\n  ALTER INDEX idx_bank_card REBUILD;\n  ALTER INDEX idx_bank_card RENAME TO idx_bank_card_temp;\n  ALTER INDEX idx_bank_card UNUSABLE;\n  DROP INDEX CONCURRENTLY idx_bank_card;\n  ```\n  - **`DROP INDEX CONCURRENTLY` Rules (p. 437)**:\n    - Drops the index **without locking** the table against concurrent reads/writes.\n    - Allows **only one index name** per statement, **does NOT support `CASCADE`**, and **cannot be executed inside a transaction block**!\n  - **CRITICAL EXAM FACT (Ch.05 p. 446 Quiz Q1: False!)**:\n    - **Dropping (canceling) an index on a table NEVER deletes the underlying base table!** (Whereas `DROP TABLE` forcibly deletes the table *and* all indexes/partitions depending on it.)","key_takeaways":["Dropping an index (`DROP INDEX`) deletes ONLY the index structure — it NEVER deletes the corresponding base table (Ch.05 p. 446 Quiz Q1: False!). Conversely, `DROP TABLE` deletes the table and all its dependent indexes and partitions.","On a partitioned table, any `UNIQUE` or `PRIMARY KEY` constraint must include all partition key columns. Range partitioning supports multi-column keys, while List and Hash partitioning support only single-column keys.","`DROP INDEX CONCURRENTLY` drops an index without locking concurrent table access, but accepts only one index name, does not support `CASCADE`, and cannot run inside a transaction block."],"exam_traps":["EXAM TRAP (Ch.05 p. 446 Quiz Q1): '(True or false) When an index is created for a table, the corresponding base table is deleted if the index is canceled.' -> B. False!","EXAM TRAP: `DROP INDEX` can run inside a transaction block, but `DROP INDEX CONCURRENTLY` CANNOT run inside a transaction block and does NOT support `CASCADE` (Ch.05 p. 437)."],"content_html":"<h3>1. Creating &amp; Maintaining Partitioned Tables (pp. 427–431)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Important Partitioning Rules (p. 428)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Unique / Primary Key Constraint Rule<\/strong>: A partitioned table supports <code class=\"inline-code\">UNIQUE<\/code> and <code class=\"inline-code\">PRIMARY KEY<\/code> constraints, <strong>but the constraint key columns MUST contain all partition keys<\/strong>!<\/li>\n<li><strong>Single-Column vs. Multi-Column<\/strong>: <strong>Range partitioning<\/strong> supports one or multiple partition key columns; <strong>Hash partitioning<\/strong> and <strong>List partitioning<\/strong> currently support <strong>only a single partition key column<\/strong>!<\/li>\n<li><strong><code class=\"inline-code\">ENABLE | DISABLE ROW MOVEMENT<\/code><\/strong>: Controls whether an <code class=\"inline-code\">UPDATE<\/code> that changes a row's partition key value automatically moves the tuple across partitions (<code class=\"inline-code\">ENABLE ROW MOVEMENT<\/code>) or raises an error (<code class=\"inline-code\">DISABLE<\/code>).<\/li>\n<li><strong>Execution Order of Multiple Maintenance Clauses (p. 430)<\/strong>: When multiple partition clauses are combined in <code class=\"inline-code\">ALTER TABLE<\/code>, openGauss executes <strong><code class=\"inline-code\">DROP PARTITION<\/code> first<\/strong>, then <strong><code class=\"inline-code\">ADD PARTITION<\/code><\/strong>, and finally the remaining clauses in order (<code class=\"inline-code\">MOVE<\/code>, <code class=\"inline-code\">EXCHANGE<\/code>, <code class=\"inline-code\">MERGE<\/code>, <code class=\"inline-code\">SPLIT<\/code>, <code class=\"inline-code\">RENAME<\/code>).<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>CREATE TABLE training(staff_id INT NOT NULL, course_name CHAR(20), score INT)\nTABLESPACE example1\nPARTITION BY RANGE(staff_id) (\n    PARTITION training1 VALUES LESS THAN(100),\n    PARTITION training2 VALUES LESS THAN(200),\n    PARTITION training3 VALUES LESS THAN(300),\n    PARTITION training4 VALUES LESS THAN(MAXVALUE) TABLESPACE example2\n) ENABLE ROW MOVEMENT;\n\nALTER TABLE training MOVE PARTITION training1 TABLESPACE example3;\nALTER TABLE training MERGE PARTITION training1, training2 INTO PARTITION training3;\nALTER TABLE training DROP PARTITION training4;\nALTER TABLE training RENAME PARTITION training3 TO training5;<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Defining, Modifying &amp; Dropping Indexes (pp. 432–437, 446)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Index Classifications (p. 432)<\/strong>:<\/li>\n<li><strong>Single-column<\/strong> vs. <strong>Multi-column (Composite)<\/strong>: A composite index is used only when the <strong>leading (first) column<\/strong> is referenced in the query condition; supports up to <strong>16 columns<\/strong> and max key length <strong>3,900 bytes<\/strong> (p. 432).<\/li>\n<li><strong>Common (B-Tree default)<\/strong>, <strong>Unique<\/strong> (auto-created on <code class=\"inline-code\">PRIMARY KEY<\/code>), <strong>Function-based<\/strong>, and <strong>Partitioned (<code class=\"inline-code\">LOCAL<\/code> vs. <code class=\"inline-code\">GLOBAL<\/code>)<\/strong>.<\/li>\n<li><strong>Modifying &amp; Dropping Indexes (pp. 435–437)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  CREATE INDEX idx_bank_card ON bank_card(b_number ASC, b_type);\n  CREATE INDEX idx_education ON education(staff_id ASC, higest_degree)\n      LOCAL (PARTITION doctor, PARTITION master, PARTITION undergraduate);\n\n  ALTER INDEX idx_bank_card REBUILD;\n  ALTER INDEX idx_bank_card RENAME TO idx_bank_card_temp;\n  ALTER INDEX idx_bank_card UNUSABLE;\n  DROP INDEX CONCURRENTLY idx_bank_card;<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">DROP INDEX CONCURRENTLY<\/code> Rules (p. 437)<\/strong>:<\/li>\n<li>Drops the index <strong>without locking<\/strong> the table against concurrent reads/writes.<\/li>\n<li>Allows <strong>only one index name<\/strong> per statement, <strong>does NOT support <code class=\"inline-code\">CASCADE<\/code><\/strong>, and <strong>cannot be executed inside a transaction block<\/strong>!<\/li>\n<li><strong>CRITICAL EXAM FACT (Ch.05 p. 446 Quiz Q1: False!)<\/strong>:<\/li>\n<li><strong>Dropping (canceling) an index on a table NEVER deletes the underlying base table!<\/strong> (Whereas <code class=\"inline-code\">DROP TABLE<\/code> forcibly deletes the table <em>and<\/em> all indexes/partitions depending on it.)<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Maintaining Partitioned Tables & Managing Indexes (`REBUILD`, `UNUSABLE`, `DROP`)","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Perform partition maintenance on the `training` range-partitioned table (`MOVE PARTITION`, `MERGE PARTITION`) and manage the `idx_bank_card` index (`REBUILD`, `UNUSABLE`, and `DROP INDEX CONCURRENTLY`).","instructions":["Step 1: Move partition `training1` to tablespace `example3` (`ALTER TABLE training MOVE PARTITION training1 TABLESPACE example3;`) and merge `training1, training2` into `training3` (`ALTER TABLE training MERGE PARTITION training1, training2 INTO PARTITION training3;`).","Step 2: Rebuild index `idx_bank_card` (`ALTER INDEX idx_bank_card REBUILD;`), mark it unusable (`ALTER INDEX idx_bank_card UNUSABLE;`), and drop it without locking the table (`DROP INDEX CONCURRENTLY idx_bank_card;`)."],"starter_code":"-- Step 1: Move partition training1 to example3 and merge training1, training2 into training3\nALTER TABLE training ____ PARTITION training1 TABLESPACE example3;\nALTER TABLE training ____ PARTITION training1, training2 INTO PARTITION training3;\n\n-- Step 2: Rebuild idx_bank_card, set it UNUSABLE, and drop it CONCURRENTLY\nALTER INDEX idx_bank_card ____;\nALTER INDEX idx_bank_card ____;\nDROP INDEX ____ idx_bank_card;\n","solution_code":"ALTER TABLE training MOVE PARTITION training1 TABLESPACE example3;\nALTER TABLE training MERGE PARTITION training1, training2 INTO PARTITION training3;\n\nALTER INDEX idx_bank_card REBUILD;\nALTER INDEX idx_bank_card UNUSABLE;\nDROP INDEX CONCURRENTLY idx_bank_card;","hints":["Use `MOVE PARTITION` and `MERGE PARTITION ... INTO PARTITION ...`.","Use `ALTER INDEX idx_bank_card REBUILD;`, `ALTER INDEX idx_bank_card UNUSABLE;`, and `DROP INDEX CONCURRENTLY idx_bank_card;`."],"validation_checks":[{"step":1,"description":"Use `MOVE PARTITION` and `MERGE PARTITION`","required_any":["merge partition training1"],"feedback_fail":"Use `MOVE PARTITION` and `MERGE PARTITION training1, training2 INTO PARTITION training3`."},{"step":2,"description":"Use `REBUILD` and `UNUSABLE` on `idx_bank_card`","required_any":["idx_bank_card unusable"],"feedback_fail":"Include `ALTER INDEX idx_bank_card REBUILD;` and `ALTER INDEX idx_bank_card UNUSABLE;`."},{"step":3,"description":"Drop index without locking using `DROP INDEX CONCURRENTLY`","required_any":["drop index concurrently idx_bank_card"],"feedback_fail":"Use `DROP INDEX CONCURRENTLY idx_bank_card;`."}],"simulated_output":"ALTER TABLE\nALTER TABLE\nREINDEX\nALTER INDEX\nDROP INDEX","quiz_questions":[{"id":"h7_s2_q1","type":"tf","question":"(Official Ch.05 Quiz p. 446 Q1) When an index is created for a table, the corresponding base table is deleted if the index is canceled (dropped).","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.05 p. 437 & p. 446). Dropping an index deletes only the index; the base table and its data remain intact."},{"id":"h7_s2_q2","type":"single","question":"Which option in `DROP INDEX` deletes an index without locking concurrent access to the underlying table, but cannot be executed inside a transaction block and does not support `CASCADE`?","options":["A. RESTRICT","B. CONCURRENTLY","C. LOCAL","D. UNUSABLE"],"answer":"B","explanation":"Per Chapter 05 (p. 437), `DROP INDEX CONCURRENTLY` deletes an index without locking the table, supports only one index name, does not support `CASCADE`, and cannot run within a transaction."},{"id":"h7_s2_q3","type":"multiple","question":"Which of the following statements about partitioned tables in openGauss are TRUE?","options":["A. A partitioned table supports `UNIQUE` and `PRIMARY KEY` constraints, provided the constraint keys contain all partition keys","B. Range partitioning supports multi-column partition keys, whereas Hash and List partitioning support only single-column partition keys","C. Enabling `ROW MOVEMENT` allows an `UPDATE` on the partition key to move the tuple between partitions","D. Dropping a single partition automatically deletes all other partitions and the entire partitioned table"],"answer":"ABC","explanation":"Per Chapter 05 (pp. 428, 432), A, B, and C are true. Option D is false: dropping a partition removes only that partition without affecting other partitions (whereas `DROP TABLE` deletes all partitions)."}],"reference_figures":[]}},{"sprint_number":3,"lecture_slug":"05-Lecture-DDL-Views-and-Sequences","exercise_slug":"06-Exercise-Views-and-Decremental-Sequences-Lab","lecture":{"title":"DDL for Views & Sequences","duration_mins":7,"pdf_ref":"Ch.05, pp. 438–447","objectives":["Create, replace, and drop Views (`CREATE OR REPLACE [TEMP] VIEW`, `DROP VIEW ... CASCADE | RESTRICT`)","Create, modify, and drop Sequences (`CREATE/ALTER/DROP SEQUENCE`, `nextval()`, `CACHE`, `CYCLE`, `OWNED BY`)","Master the default `MINVALUE`/`MAXVALUE`/`START WITH` rules for ascending vs. descending sequences (Ch.05 p. 447 Quiz Q3: BD!)"],"content_markdown":"### 1. Defining Views (`CREATE [OR REPLACE] VIEW`, `DROP VIEW`, pp. 438–440)\n- **3 Core Benefits of Views (p. 438)**:\n  1. **Simplify complex queries**: Encapsulate frequently used multi-table joins/filters into a single virtual table (`SELECT * FROM view_name;`).\n  2. **Enhance security**: Expose only non-sensitive columns/rows while hiding sensitive columns in the base table.\n  3. **Ensure logical data independence**: Decouple application queries from physical base table restructuring.\n- **Syntax**:\n  ```sql\n  CREATE OR REPLACE VIEW privilege_view AS SELECT b_number, b_type FROM bank_card;\n  SELECT * FROM privilege_view;\n  \\d privilege_view\n  DROP VIEW IF EXISTS privilege_view RESTRICT; -- RESTRICT is default; CASCADE drops dependent views\n  ```\n\n---\n\n### 2. Defining Sequences (`CREATE / ALTER / DROP SEQUENCE`, pp. 441–445)\nA **sequence** is a special single-row object that generates arithmetic progressions (typically used for auto-incrementing primary keys via `DEFAULT nextval('seq_name')`):\n```sql\nCREATE SEQUENCE name\n    [ INCREMENT [ BY ] increment ]\n    [ MINVALUE minvalue | NO MINVALUE | NOMINVALUE ]\n    [ MAXVALUE maxvalue | NO MAXVALUE | NOMAXVALUE ]\n    [ START [ WITH ] start ]\n    [ CACHE cache ]\n    [ [ NO ] CYCLE | NOCYCLE ]\n    [ OWNED BY { table_name.column_name | NONE } ];\n```\n\n---\n\n### 3. Ascending vs. Descending Sequence Default Rules (p. 442, Ch.05 p. 447 Quiz Q3: BD!)\nThis table is **one of the highest-yield exam topics in HCIA-openGauss V2.0**:\n\n| Parameter | Ascending Sequence (`INCREMENT > 0`, Default `+1`) | Descending (Decremental) Sequence (`INCREMENT < 0`, e.g., `-4`) |\n| :--- | :--- | :--- |\n| **Default `MINVALUE`** | **`1`** | **`-2^63 - 1`** (minimum 64-bit signed integer) |\n| **Default `MAXVALUE`** | **`2^63 - 1`** (maximum 64-bit signed integer) | **`-1`** (**CRITICAL!** If `MAXVALUE` is omitted on a negative-increment sequence, `MAXVALUE` defaults to **`-1`**!) |\n| **Default `START WITH`** | **`minvalue`** | **`maxvalue`** (**CRITICAL!** If `START WITH` is omitted on a descending sequence, `START WITH` defaults to **`maxvalue`**!) |\n| **Default `CACHE` / `CYCLE`** | `CACHE 1` (no cache), `NO CYCLE` | `CACHE 1`, `NO CYCLE` |\n\n#### Why Ch.05 p. 447 Quiz Q3 Answer is **BD**!\n*Question*: Create a decremental sequence `seq_1` starting at `400`, step `-4`, minimum `100`, cycling at minimum:\n- **A. `CREATE SEQUENCE seq_1 START WITH 400 MAXVALUE 100 INCREMENT BY -4 CYCLE;`** -> **WRONG!** (`START WITH 400` cannot be greater than `MAXVALUE 100`, and `MINVALUE 100` is missing!)\n- **B. `CREATE SEQUENCE seq_1 MAXVALUE 400 MINVALUE 100 INCREMENT BY -4 CYCLE;`** -> **CORRECT!** Because for a descending sequence (`INCREMENT BY -4`), when `START WITH` is omitted, **`START WITH` automatically defaults to `MAXVALUE` (`400`)**!\n- **C. `CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 INCREMENT BY -4 CYCLE;`** -> **WRONG!** Because `MAXVALUE` was omitted on a descending sequence, **`MAXVALUE` defaults to `-1`**, which fails because `START WITH 400 > MAXVALUE -1`!\n- **D. `CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;`** -> **CORRECT!** Explicitly sets `START WITH 400`, `MINVALUE 100`, `MAXVALUE 400`, `INCREMENT BY -4`, and `CYCLE`.","key_takeaways":["For an ascending sequence (`INCREMENT > 0`), default `MINVALUE = 1`, default `MAXVALUE = 2^63 - 1`, and default `START WITH = minvalue`.","For a descending sequence (`INCREMENT < 0`), default `MINVALUE = -2^63 - 1`, default `MAXVALUE = -1`, and default `START WITH = maxvalue`.","Therefore, for a decremental sequence starting at 400 down to 100 with step -4, you MUST specify `MAXVALUE 400` (`START WITH 400` is optional because it defaults to `MAXVALUE 400`) — making both B and D correct in Ch.05 p. 447 Quiz Q3!"],"exam_traps":["EXAM TRAP (Ch.05 p. 447 Quiz Q3): Why does `CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 INCREMENT BY -4 CYCLE;` (Option C) FAIL with an error? Because for a negative increment, default `MAXVALUE` is `-1`, and `START (400)` cannot be greater than `MAXVALUE (-1)`! Both B and D are the official correct answers (`BD`).","EXAM TRAP: `OWNED BY table_name.column_name` automatically drops the sequence when that column or table is dropped, but it does NOT automatically increment the column on `INSERT` unless `DEFAULT nextval('seq')` is also declared on the column (Ch.05 p. 442)."],"content_html":"<h3>1. Defining Views (<code class=\"inline-code\">CREATE [OR REPLACE] VIEW<\/code>, <code class=\"inline-code\">DROP VIEW<\/code>, pp. 438–440)<\/h3>\n<ul class=\"md-list\">\n<li><strong>3 Core Benefits of Views (p. 438)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Simplify complex queries<\/strong>: Encapsulate frequently used multi-table joins/filters into a single virtual table (<code class=\"inline-code\">SELECT * FROM view_name;<\/code>).<\/li>\n<li><strong>Enhance security<\/strong>: Expose only non-sensitive columns/rows while hiding sensitive columns in the base table.<\/li>\n<li><strong>Ensure logical data independence<\/strong>: Decouple application queries from physical base table restructuring.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Syntax<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  CREATE OR REPLACE VIEW privilege_view AS SELECT b_number, b_type FROM bank_card;\n  SELECT * FROM privilege_view;\n  \\d privilege_view\n  DROP VIEW IF EXISTS privilege_view RESTRICT; -- RESTRICT is default; CASCADE drops dependent views<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Defining Sequences (<code class=\"inline-code\">CREATE / ALTER / DROP SEQUENCE<\/code>, pp. 441–445)<\/h3>\n<p>A <strong>sequence<\/strong> is a special single-row object that generates arithmetic progressions (typically used for auto-incrementing primary keys via <code class=\"inline-code\">DEFAULT nextval('seq_name')<\/code>):<\/p>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>CREATE SEQUENCE name\n    [ INCREMENT [ BY ] increment ]\n    [ MINVALUE minvalue | NO MINVALUE | NOMINVALUE ]\n    [ MAXVALUE maxvalue | NO MAXVALUE | NOMAXVALUE ]\n    [ START [ WITH ] start ]\n    [ CACHE cache ]\n    [ [ NO ] CYCLE | NOCYCLE ]\n    [ OWNED BY { table_name.column_name | NONE } ];<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>3. Ascending vs. Descending Sequence Default Rules (p. 442, Ch.05 p. 447 Quiz Q3: BD!)<\/h3>\n<p>This table is <strong>one of the highest-yield exam topics in HCIA-openGauss V2.0<\/strong>:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Parameter<\/th><th>Ascending Sequence (<code class=\"inline-code\">INCREMENT &gt; 0<\/code>, Default <code class=\"inline-code\">+1<\/code>)<\/th><th>Descending (Decremental) Sequence (<code class=\"inline-code\">INCREMENT &lt; 0<\/code>, e.g., <code class=\"inline-code\">-4<\/code>)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Default <code class=\"inline-code\">MINVALUE<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">1<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">-2^63 - 1<\/code><\/strong> (minimum 64-bit signed integer)<\/td><\/tr>\n<tr><td><strong>Default <code class=\"inline-code\">MAXVALUE<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">2^63 - 1<\/code><\/strong> (maximum 64-bit signed integer)<\/td><td><strong><code class=\"inline-code\">-1<\/code><\/strong> (<strong>CRITICAL!<\/strong> If <code class=\"inline-code\">MAXVALUE<\/code> is omitted on a negative-increment sequence, <code class=\"inline-code\">MAXVALUE<\/code> defaults to <strong><code class=\"inline-code\">-1<\/code><\/strong>!)<\/td><\/tr>\n<tr><td><strong>Default <code class=\"inline-code\">START WITH<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">minvalue<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">maxvalue<\/code><\/strong> (<strong>CRITICAL!<\/strong> If <code class=\"inline-code\">START WITH<\/code> is omitted on a descending sequence, <code class=\"inline-code\">START WITH<\/code> defaults to <strong><code class=\"inline-code\">maxvalue<\/code><\/strong>!)<\/td><\/tr>\n<tr><td><strong>Default <code class=\"inline-code\">CACHE<\/code> / <code class=\"inline-code\">CYCLE<\/code><\/strong><\/td><td><code class=\"inline-code\">CACHE 1<\/code> (no cache), <code class=\"inline-code\">NO CYCLE<\/code><\/td><td><code class=\"inline-code\">CACHE 1<\/code>, <code class=\"inline-code\">NO CYCLE<\/code><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>Why Ch.05 p. 447 Quiz Q3 Answer is <strong>BD<\/strong>!<\/h4>\n<p><em>Question<\/em>: Create a decremental sequence <code class=\"inline-code\">seq_1<\/code> starting at <code class=\"inline-code\">400<\/code>, step <code class=\"inline-code\">-4<\/code>, minimum <code class=\"inline-code\">100<\/code>, cycling at minimum:<\/p>\n<ul class=\"md-list\">\n<li><strong>A. <code class=\"inline-code\">CREATE SEQUENCE seq_1 START WITH 400 MAXVALUE 100 INCREMENT BY -4 CYCLE;<\/code><\/strong> -&gt; <strong>WRONG!<\/strong> (<code class=\"inline-code\">START WITH 400<\/code> cannot be greater than <code class=\"inline-code\">MAXVALUE 100<\/code>, and <code class=\"inline-code\">MINVALUE 100<\/code> is missing!)<\/li>\n<li><strong>B. <code class=\"inline-code\">CREATE SEQUENCE seq_1 MAXVALUE 400 MINVALUE 100 INCREMENT BY -4 CYCLE;<\/code><\/strong> -&gt; <strong>CORRECT!<\/strong> Because for a descending sequence (<code class=\"inline-code\">INCREMENT BY -4<\/code>), when <code class=\"inline-code\">START WITH<\/code> is omitted, <strong><code class=\"inline-code\">START WITH<\/code> automatically defaults to <code class=\"inline-code\">MAXVALUE<\/code> (<code class=\"inline-code\">400<\/code>)<\/strong>!<\/li>\n<li><strong>C. <code class=\"inline-code\">CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 INCREMENT BY -4 CYCLE;<\/code><\/strong> -&gt; <strong>WRONG!<\/strong> Because <code class=\"inline-code\">MAXVALUE<\/code> was omitted on a descending sequence, <strong><code class=\"inline-code\">MAXVALUE<\/code> defaults to <code class=\"inline-code\">-1<\/code><\/strong>, which fails because <code class=\"inline-code\">START WITH 400 &gt; MAXVALUE -1<\/code>!<\/li>\n<li><strong>D. <code class=\"inline-code\">CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;<\/code><\/strong> -&gt; <strong>CORRECT!<\/strong> Explicitly sets <code class=\"inline-code\">START WITH 400<\/code>, <code class=\"inline-code\">MINVALUE 100<\/code>, <code class=\"inline-code\">MAXVALUE 400<\/code>, <code class=\"inline-code\">INCREMENT BY -4<\/code>, and <code class=\"inline-code\">CYCLE<\/code>.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Creating Views & Ascending/Decremental Sequences (`nextval`, `OWNED BY`)","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Create or replace view `privilege_view`, create the official Ch.05 Quiz Q3 decremental sequence `seq_1` (starting at 400, step -4, minvalue 100, cycling), fetch its first value using `nextval('seq_1')`, and associate it with `bank_card.b_c_id`.","instructions":["Step 1: Create or replace view `privilege_view` as `SELECT b_number, b_type FROM bank_card;`.","Step 2: Create decremental sequence `seq_1` using `CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;`.","Step 3: Call `SELECT nextval('seq_1');` and bind the sequence using `ALTER SEQUENCE seq_1 OWNED BY bank_card.b_c_id;`."],"starter_code":"-- Step 1: Create or replace view privilege_view\nCREATE OR ____ VIEW privilege_view AS SELECT b_number, b_type FROM bank_card;\n\n-- Step 2 (Ch.05 Quiz Q3): Create decremental sequence seq_1 (400 down to 100, step -4, cycle)\nCREATE SEQUENCE seq_1 START WITH 400 ____ 100 ____ 400 INCREMENT BY -4 ____;\n\n-- Step 3: Fetch next value and associate seq_1 with bank_card.b_c_id\nSELECT ____('seq_1');\nALTER SEQUENCE seq_1 ____ BY bank_card.b_c_id;\n","solution_code":"CREATE OR REPLACE VIEW privilege_view AS SELECT b_number, b_type FROM bank_card;\n\nCREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;\n\nSELECT nextval('seq_1');\nALTER SEQUENCE seq_1 OWNED BY bank_card.b_c_id;","hints":["Use `CREATE OR REPLACE VIEW` to create or update a view.","For a decremental sequence starting at 400, you must specify `MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE`.","Use `nextval('seq_1')` and `OWNED BY bank_card.b_c_id`."],"validation_checks":[{"step":1,"description":"Use `CREATE OR REPLACE VIEW privilege_view`","required_any":["create or replace view privilege_view"],"feedback_fail":"Use `CREATE OR REPLACE VIEW privilege_view AS ...`."},{"step":2,"description":"Specify `MINVALUE 100`, `MAXVALUE 400`, `INCREMENT BY -4`, and `CYCLE`","required_any":["maxvalue 400"],"feedback_fail":"Make sure `MAXVALUE 400`, `MINVALUE 100`, `INCREMENT BY -4`, and `CYCLE` are all present."},{"step":3,"description":"Call `nextval('seq_1')` and `OWNED BY bank_card.b_c_id`","required_any":["owned by bank_card.b_c_id"],"feedback_fail":"Include `SELECT nextval('seq_1');` and `ALTER SEQUENCE seq_1 OWNED BY bank_card.b_c_id;`."}],"simulated_output":"CREATE VIEW\nCREATE SEQUENCE\n nextval \n---------\n     400\n(1 row)\n\nALTER SEQUENCE","quiz_questions":[{"id":"h7_s3_q1","type":"multiple","question":"(Official Ch.05 Quiz p. 447 Q3) Create a decremental sequence named `seq_1`. The starting value is 400, the step is –4, and the minimum value is 100. When the sequence reaches the minimum value, it can be cyclically executed. Which of the following statements are correct?","options":["A. CREATE SEQUENCE seq_1 START WITH 400 MAXVALUE 100 INCREMENT BY -4 CYCLE;","B. CREATE SEQUENCE seq_1 MAXVALUE 400 MINVALUE 100 INCREMENT BY -4 CYCLE;","C. CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 INCREMENT BY -4 CYCLE;","D. CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;"],"answer":"BD","explanation":"Per Chapter 05 (p. 442 & p. 447), for a descending sequence (`INCREMENT BY -4`), the default `MAXVALUE` is `-1` and the default `START WITH` is `maxvalue`. Thus `MAXVALUE 400` is mandatory (making C fail), while `START WITH 400` defaults to `MAXVALUE 400` when omitted (making both B and D valid)."},{"id":"h7_s3_q2","type":"single","question":"In openGauss `CREATE SEQUENCE`, if `MAXVALUE` is not specified for a descending sequence (`INCREMENT < 0`), what is its default `MAXVALUE`?","options":["A. 1","B. 0","C. -1","D. 2^63 - 1"],"answer":"C","explanation":"Per Chapter 05 (p. 442), if `MAXVALUE` is not specified (or `NO MAXVALUE` is specified), the default value for an ascending sequence is `2^63 - 1`, and for a descending sequence is `-1`."},{"id":"h7_s3_q3","type":"tf","question":"When `OWNED BY table_name.column_name` is specified on a sequence, dropping that column or table automatically deletes the associated sequence.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.05 p. 442 & p. 444). `OWNED BY` associates a sequence with a specified table column so that the sequence is automatically deleted when the column or table is dropped."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Operators-and-Built-In-Functions","exercise_slug":"08-Exercise-String-Numeric-Date-and-Geometric-Functions-Lab","lecture":{"title":"Operators & Built-in Functions (String, Numeric, Date/Time, Pattern Matching, Geometric)","duration_mins":7,"pdf_ref":"Ch.05, pp. 448–469","objectives":["Master Logical Operators (`and`, `or`, `not` — Ch.05 Quiz Q3: ABC!) and the 3 Pattern Matching approaches (`LIKE`, `SIMILAR TO`, `POSIX regular expressions` — Ch.05 Quiz Q4: ACD!)","Evaluate Character Functions (`instr`, `overlay`, `insert`, `substring`, `replace`, `lpad`/`rpad`), Arithmetic Operators (`!!`, `@`, `|/`, `||/`, `^`, `&`, `#`, `~`, `<<`, `>>`) & Functions (`sin`, `round`, `bitand`, `ceil`, `floor` — Ch.05 Quiz Q2: BC!)","Compute Date/Time Arithmetic (`SELECT date '2021-4-28' + integer '7'` — Ch.05 Quiz Q1!), Type Conversions (`cast`, `to_char`, `to_date`, `to_number`), and Geometric Operators/Functions"],"content_markdown":"### 1. Logical Operators, Pattern Matching & Character Functions (pp. 449–454, 469)\n- **Logical Operators (Ch.05 p. 469 Quiz Q3: ABC!)**:\n  - **`and`**, **`or`**, and **`not`** (Priority: `NOT` > `AND` > `OR`). *(`not or` is NOT a logical operator!)*\n- **Three Separate Approaches to Pattern Matching (Ch.05 p. 469 Quiz Q4: ACD!)**:\n  1. **`LIKE`** (traditional SQL wildcard matching with `%` and `_`).\n  2. **`SIMILAR TO`** (SQL:1999 regular expressions).\n  3. **`POSIX regular expressions`** (`~`, `~*`, `!~`, `!~*`). *(Option B `Same` is NOT a pattern matching method!)*\n- **High-Yield Character Processing Functions (pp. 451–454)**:\n  - **`instr(str1, str2, pos, nth)`**: Searches `str1` starting at `pos` for the `nth` occurrence of `str2` and returns the 1-based character index from the start of `str1` (or `0` if not found).\n    - Example: `SELECT instr('abcdabcdabcd', 'bcd', 2, 2);` -> Starts at pos 2 (`'bcdabcdabcd'`), 1st match is at pos 2, **2nd match is at pos `6`**!\n  - **`overlay(str PLACING newstr FROM pos [FOR len])`**: Replaces `len` chars starting at `pos`.\n    - Example: `SELECT overlay('hello' PLACING 'world' FROM 2 FOR 3);` -> Replaces `'ell'` with `'world'` -> **`'hworldo'`**.\n  - **`insert(str, pos, len, newstr)`**: `insert('quadratic', 5, 2, 'what')` \\\\equiv `replace('quadratic', 'ra', 'what')` -> `'quadwhattic'`.\n  - **`substring('Thomas' FROM 2 FOR 3)`** -> **`'hom'`**; **`replace('abcdefabcdef', 'cd', 'XXX')`** -> **`'abXXXefabXXXef'`**.\n  - **`lpad('hi', 5, 'xyza')`** -> **`'xyzhi'`**; **`rpad('hi', 5, 'xy')`** -> **`'hixyx'`**; **`reverse('abcde')`** -> **`'edcba'`**.\n  - **`char_length('hello')`** (char count) vs. **`lengthb('hello')`** (byte count); **`ascii(str)`**; **`concat`** / **`concat_ws`** (max 8000 bytes).\n\n---\n\n### 2. Arithmetic Operators & Functions (pp. 455–458, 468)\n- **Special Arithmetic & Bitwise Operators (p. 455)**:\n  - **`!!`**: Factorial (prefix); **`@`**: Absolute value (`@ -5.0` = `5.0`); **`|/`**: Square root (`|/ 25.0` = `5`); **`||/`**: Cubic root; **`^`**: Power (`2.0^3.0` = `8.0`); **`|`**: Bitwise OR; **`&`**: Bitwise AND (`91 & 15` = `11`); **`#`**: Bitwise XOR (`17 # 5` = `20`); **`~`**: Bitwise NOT; **`<<` / `>>`**: Left/Right shift (`1 << 4` = `16`).\n  - *Priority*: Four arithmetic ops (`* / % + -`) > Shift (`<< >>`) > Bitwise AND (`&`) > Bitwise XOR (`#`) > Bitwise OR (`|`).\n  - *Decimal rounding difference*: Bitwise operators (`&`, `|`, `#`) **round off** decimal inputs first, whereas functions **`BITAND`**, **`BITOR`**, **`BITXOR`** **truncate (round down)** decimal inputs first!\n- **Arithmetic Functions (pp. 456–458, Ch.05 p. 468 Quiz Q2: BC!)**:\n  - **`sin(n)`**, **`cos(n)`**, **`acos(n)`**, **`asin(n)`**, **`abs(n)`**.\n  - **`round(number [, decimals])`**: `round(1234.5678, -2)` -> **`1200`**; `round(1234.5678, 2)` -> **`1234.57`**.\n  - **`bitand(29, 15)`** -> **`13`** (11101_2 \\land 01111_2 = 01101_2 = 13).\n  - **`ceil(-42.8)`** -> **`-42`** (smallest integer \\≥ x); **`floor(-42.8)`** -> **`-43`** (largest integer \\≤ x); **`trunc(42.8)`** -> **`42`**; **`div(9,4)`** -> **`2`**; **`mod(9,4)`** -> **`1`**; **`cbrt(27.0)`** -> **`3`**; **`log(100.0)`** -> **`2`**.\n  - *(Note: `length(str)` and `hex(p1)` are character/string functions, so in Ch.05 p. 468 Quiz Q2 only **`B. sin(n)`** and **`C. round(v numeric, s int)`** are arithmetic functions!)*\n\n---\n\n### 3. Date/Time Operators, Type Conversions & Geometric Operators (pp. 459–468)\n- **Date/Time Arithmetic (pp. 459–462, Ch.05 p. 468 Quiz Q1!)**:\n  - Slide 106 (p. 459): `SELECT date '2021-5-28' + integer '7' AS RESULT;` outputs **`2021-06-04 00:00:00`** in openGauss (where `DATE` in A-compatibility mode includes `00:00:00` time).\n  - **Ch.05 p. 468 Quiz Q1**: `SELECT date '2021-4-28' + integer '7' AS RESULT;` -> Adding 7 days to April 28 (April has 30 days) yields **May 5 (`2021-05-05` / `2021-05-05 00:00:00`)**! *(Note: The official slide 115 answer key prints `A` [`2021-05-05`], while openGauss `gsql` in default Oracle compatibility mode prints `2021-05-05 00:00:00` [Option C]. Know both why April 28 + 7 days = May 5 and the slide key `A` / runtime `C`!)*\n  - **`justify_days(interval '35 days')`** -> **`1 mon 5 days`** (30-day month); **`last_day(...)`** -> last day of month.\n- **Type Conversions**: `cast(x AS y)`, `to_char`, `to_clob`, `to_date`, `to_number`, `to_timestamp`, `to_bigint`, `hextoraw`, `rawtohex`, `numtoday`.\n- **Geometric Operators & Functions (pp. 465–467)**:\n  - Operators: `+` / `-` (translation), `*` / `/` (scaling/rotation), **`#`** (intersection), **`@-@`** (length/circumference), **`@@`** (center), **`<->`** (distance), **`&&`** (overlaps), **`<<` / `>>`** (strictly left/right of), **`<^` / `>^`** (below/above).\n  - Functions: `area(obj)`, `center(obj)`, `diameter(circle)`, `radius(circle)`, `height(box)`, `width(box)`, `length(obj)`, `npoints(path/polygon)`, `isclosed(path)`, `isopen(path)`, `pclose(path)`, `popen(path)`.","key_takeaways":["The arithmetic functions in Ch.05 Quiz Q2 are `B. sin(n)` and `C. round(v numeric, s int)` (`BC`); the logical operators in Quiz Q3 are `and`, `or`, `not` (`ABC`); the 3 pattern matching approaches in Quiz Q4 are `LIKE`, `SIMILAR TO`, and `POSIX regular expressions` (`ACD`).","`instr('abcdabcdabcd', 'bcd', 2, 2)` returns `6`; `overlay('hello' placing 'world' from 2 for 3)` returns `'hworldo'`; `round(1234.5678, -2)` returns `1200`; `bitand(29, 15)` returns `13`.","`SELECT date '2021-4-28' + integer '7' AS RESULT;` adds 7 days to April 28 (30-day month) to produce May 5 (`2021-05-05` in the Ch.05 slide answer key A, or `2021-05-05 00:00:00` in openGauss A-mode runtime C)."],"exam_traps":["EXAM TRAP (Ch.05 p. 469 Quiz Q4): 'Which three separate approaches to pattern matching are provided by a database?' -> `A. LIKE`, `C. SIMILAR TO`, `D. POSIX regular expressions` (`ACD`). `B. Same` does not exist!","EXAM TRAP: Watch negative numbers in `ceil(-42.8)` (`-42`, notsmaller integer) vs. `floor(-42.8)` (`-43`, not larger integer) vs. `round(1234.5678, -2)` (`1200`, rounds two digits to the left of the decimal point)!"],"content_html":"<h3>1. Logical Operators, Pattern Matching &amp; Character Functions (pp. 449–454, 469)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Logical Operators (Ch.05 p. 469 Quiz Q3: ABC!)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">and<\/code><\/strong>, <strong><code class=\"inline-code\">or<\/code><\/strong>, and <strong><code class=\"inline-code\">not<\/code><\/strong> (Priority: <code class=\"inline-code\">NOT<\/code> &gt; <code class=\"inline-code\">AND<\/code> &gt; <code class=\"inline-code\">OR<\/code>). <em>(<code class=\"inline-code\">not or<\/code> is NOT a logical operator!)<\/em><\/li>\n<li><strong>Three Separate Approaches to Pattern Matching (Ch.05 p. 469 Quiz Q4: ACD!)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">LIKE<\/code><\/strong> (traditional SQL wildcard matching with <code class=\"inline-code\">%<\/code> and <code class=\"inline-code\">_<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">SIMILAR TO<\/code><\/strong> (SQL:1999 regular expressions).<\/li>\n<li><strong><code class=\"inline-code\">POSIX regular expressions<\/code><\/strong> (<code class=\"inline-code\">~<\/code>, <code class=\"inline-code\">~<em><\/code>, <code class=\"inline-code\">!~<\/code>, <code class=\"inline-code\">!~<\/em><\/code>). <em>(Option B <code class=\"inline-code\">Same<\/code> is NOT a pattern matching method!)<\/em><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>High-Yield Character Processing Functions (pp. 451–454)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">instr(str1, str2, pos, nth)<\/code><\/strong>: Searches <code class=\"inline-code\">str1<\/code> starting at <code class=\"inline-code\">pos<\/code> for the <code class=\"inline-code\">nth<\/code> occurrence of <code class=\"inline-code\">str2<\/code> and returns the 1-based character index from the start of <code class=\"inline-code\">str1<\/code> (or <code class=\"inline-code\">0<\/code> if not found).<\/li>\n<li>Example: <code class=\"inline-code\">SELECT instr('abcdabcdabcd', 'bcd', 2, 2);<\/code> -&gt; Starts at pos 2 (<code class=\"inline-code\">'bcdabcdabcd'<\/code>), 1st match is at pos 2, <strong>2nd match is at pos <code class=\"inline-code\">6<\/code><\/strong>!<\/li>\n<li><strong><code class=\"inline-code\">overlay(str PLACING newstr FROM pos [FOR len])<\/code><\/strong>: Replaces <code class=\"inline-code\">len<\/code> chars starting at <code class=\"inline-code\">pos<\/code>.<\/li>\n<li>Example: <code class=\"inline-code\">SELECT overlay('hello' PLACING 'world' FROM 2 FOR 3);<\/code> -&gt; Replaces <code class=\"inline-code\">'ell'<\/code> with <code class=\"inline-code\">'world'<\/code> -&gt; <strong><code class=\"inline-code\">'hworldo'<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">insert(str, pos, len, newstr)<\/code><\/strong>: <code class=\"inline-code\">insert('quadratic', 5, 2, 'what')<\/code> \\\\equiv <code class=\"inline-code\">replace('quadratic', 'ra', 'what')<\/code> -&gt; <code class=\"inline-code\">'quadwhattic'<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">substring('Thomas' FROM 2 FOR 3)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">'hom'<\/code><\/strong>; <strong><code class=\"inline-code\">replace('abcdefabcdef', 'cd', 'XXX')<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">'abXXXefabXXXef'<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">lpad('hi', 5, 'xyza')<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">'xyzhi'<\/code><\/strong>; <strong><code class=\"inline-code\">rpad('hi', 5, 'xy')<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">'hixyx'<\/code><\/strong>; <strong><code class=\"inline-code\">reverse('abcde')<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">'edcba'<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">char_length('hello')<\/code><\/strong> (char count) vs. <strong><code class=\"inline-code\">lengthb('hello')<\/code><\/strong> (byte count); <strong><code class=\"inline-code\">ascii(str)<\/code><\/strong>; <strong><code class=\"inline-code\">concat<\/code><\/strong> / <strong><code class=\"inline-code\">concat_ws<\/code><\/strong> (max 8000 bytes).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Arithmetic Operators &amp; Functions (pp. 455–458, 468)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Special Arithmetic &amp; Bitwise Operators (p. 455)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">!!<\/code><\/strong>: Factorial (prefix); <strong><code class=\"inline-code\">@<\/code><\/strong>: Absolute value (<code class=\"inline-code\">@ -5.0<\/code> = <code class=\"inline-code\">5.0<\/code>); <strong><code class=\"inline-code\">|/<\/code><\/strong>: Square root (<code class=\"inline-code\">|/ 25.0<\/code> = <code class=\"inline-code\">5<\/code>); <strong><code class=\"inline-code\">||/<\/code><\/strong>: Cubic root; <strong><code class=\"inline-code\">^<\/code><\/strong>: Power (<code class=\"inline-code\">2.0^3.0<\/code> = <code class=\"inline-code\">8.0<\/code>); <strong><code class=\"inline-code\">|<\/code><\/strong>: Bitwise OR; <strong><code class=\"inline-code\">&amp;<\/code><\/strong>: Bitwise AND (<code class=\"inline-code\">91 &amp; 15<\/code> = <code class=\"inline-code\">11<\/code>); <strong><code class=\"inline-code\">#<\/code><\/strong>: Bitwise XOR (<code class=\"inline-code\">17 # 5<\/code> = <code class=\"inline-code\">20<\/code>); <strong><code class=\"inline-code\">~<\/code><\/strong>: Bitwise NOT; <strong><code class=\"inline-code\">&lt;&lt;<\/code> / <code class=\"inline-code\">&gt;&gt;<\/code><\/strong>: Left/Right shift (<code class=\"inline-code\">1 &lt;&lt; 4<\/code> = <code class=\"inline-code\">16<\/code>).<\/li>\n<li><em>Priority<\/em>: Four arithmetic ops (<code class=\"inline-code\">* / % + -<\/code>) &gt; Shift (<code class=\"inline-code\">&lt;&lt; &gt;&gt;<\/code>) &gt; Bitwise AND (<code class=\"inline-code\">&amp;<\/code>) &gt; Bitwise XOR (<code class=\"inline-code\">#<\/code>) &gt; Bitwise OR (<code class=\"inline-code\">|<\/code>).<\/li>\n<li><em>Decimal rounding difference<\/em>: Bitwise operators (<code class=\"inline-code\">&amp;<\/code>, <code class=\"inline-code\">|<\/code>, <code class=\"inline-code\">#<\/code>) <strong>round off<\/strong> decimal inputs first, whereas functions <strong><code class=\"inline-code\">BITAND<\/code><\/strong>, <strong><code class=\"inline-code\">BITOR<\/code><\/strong>, <strong><code class=\"inline-code\">BITXOR<\/code><\/strong> <strong>truncate (round down)<\/strong> decimal inputs first!<\/li>\n<li><strong>Arithmetic Functions (pp. 456–458, Ch.05 p. 468 Quiz Q2: BC!)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">sin(n)<\/code><\/strong>, <strong><code class=\"inline-code\">cos(n)<\/code><\/strong>, <strong><code class=\"inline-code\">acos(n)<\/code><\/strong>, <strong><code class=\"inline-code\">asin(n)<\/code><\/strong>, <strong><code class=\"inline-code\">abs(n)<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">round(number [, decimals])<\/code><\/strong>: <code class=\"inline-code\">round(1234.5678, -2)<\/code> -&gt; <strong><code class=\"inline-code\">1200<\/code><\/strong>; <code class=\"inline-code\">round(1234.5678, 2)<\/code> -&gt; <strong><code class=\"inline-code\">1234.57<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">bitand(29, 15)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">13<\/code><\/strong> (11101_2 \\land 01111_2 = 01101_2 = 13).<\/li>\n<li><strong><code class=\"inline-code\">ceil(-42.8)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">-42<\/code><\/strong> (smallest integer \\≥ x); <strong><code class=\"inline-code\">floor(-42.8)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">-43<\/code><\/strong> (largest integer \\≤ x$); <strong><code class=\"inline-code\">trunc(42.8)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">42<\/code><\/strong>; <strong><code class=\"inline-code\">div(9,4)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">2<\/code><\/strong>; <strong><code class=\"inline-code\">mod(9,4)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">1<\/code><\/strong>; <strong><code class=\"inline-code\">cbrt(27.0)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">3<\/code><\/strong>; <strong><code class=\"inline-code\">log(100.0)<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">2<\/code><\/strong>.<\/li>\n<li><em>(Note: <code class=\"inline-code\">length(str)<\/code> and <code class=\"inline-code\">hex(p1)<\/code> are character/string functions, so in Ch.05 p. 468 Quiz Q2 only <strong><code class=\"inline-code\">B. sin(n)<\/code><\/strong> and <strong><code class=\"inline-code\">C. round(v numeric, s int)<\/code><\/strong> are arithmetic functions!)<\/em><\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Date/Time Operators, Type Conversions &amp; Geometric Operators (pp. 459–468)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Date/Time Arithmetic (pp. 459–462, Ch.05 p. 468 Quiz Q1!)<\/strong>:<\/li>\n<li>Slide 106 (p. 459): <code class=\"inline-code\">SELECT date '2021-5-28' + integer '7' AS RESULT;<\/code> outputs <strong><code class=\"inline-code\">2021-06-04 00:00:00<\/code><\/strong> in openGauss (where <code class=\"inline-code\">DATE<\/code> in A-compatibility mode includes <code class=\"inline-code\">00:00:00<\/code> time).<\/li>\n<li><strong>Ch.05 p. 468 Quiz Q1<\/strong>: <code class=\"inline-code\">SELECT date '2021-4-28' + integer '7' AS RESULT;<\/code> -&gt; Adding 7 days to April 28 (April has 30 days) yields <strong>May 5 (<code class=\"inline-code\">2021-05-05<\/code> / <code class=\"inline-code\">2021-05-05 00:00:00<\/code>)<\/strong>! <em>(Note: The official slide 115 answer key prints <code class=\"inline-code\">A<\/code> [<code class=\"inline-code\">2021-05-05<\/code>], while openGauss <code class=\"inline-code\">gsql<\/code> in default Oracle compatibility mode prints <code class=\"inline-code\">2021-05-05 00:00:00<\/code> [Option C]. Know both why April 28 + 7 days = May 5 and the slide key <code class=\"inline-code\">A<\/code> / runtime <code class=\"inline-code\">C<\/code>!)<\/em><\/li>\n<li><strong><code class=\"inline-code\">justify_days(interval '35 days')<\/code><\/strong> -&gt; <strong><code class=\"inline-code\">1 mon 5 days<\/code><\/strong> (30-day month); <strong><code class=\"inline-code\">last_day(...)<\/code><\/strong> -&gt; last day of month.<\/li>\n<li><strong>Type Conversions<\/strong>: <code class=\"inline-code\">cast(x AS y)<\/code>, <code class=\"inline-code\">to_char<\/code>, <code class=\"inline-code\">to_clob<\/code>, <code class=\"inline-code\">to_date<\/code>, <code class=\"inline-code\">to_number<\/code>, <code class=\"inline-code\">to_timestamp<\/code>, <code class=\"inline-code\">to_bigint<\/code>, <code class=\"inline-code\">hextoraw<\/code>, <code class=\"inline-code\">rawtohex<\/code>, <code class=\"inline-code\">numtoday<\/code>.<\/li>\n<li><strong>Geometric Operators &amp; Functions (pp. 465–467)<\/strong>:<\/li>\n<li>Operators: <code class=\"inline-code\">+<\/code> / <code class=\"inline-code\">-<\/code> (translation), <code class=\"inline-code\">*<\/code> / <code class=\"inline-code\">/<\/code> (scaling/rotation), <strong><code class=\"inline-code\">#<\/code><\/strong> (intersection), <strong><code class=\"inline-code\">@-@<\/code><\/strong> (length/circumference), <strong><code class=\"inline-code\">@@<\/code><\/strong> (center), <strong><code class=\"inline-code\">&lt;-&gt;<\/code><\/strong> (distance), <strong><code class=\"inline-code\">&amp;&amp;<\/code><\/strong> (overlaps), <strong><code class=\"inline-code\">&lt;&lt;<\/code> / <code class=\"inline-code\">&gt;&gt;<\/code><\/strong> (strictly left/right of), <strong><code class=\"inline-code\">&lt;^<\/code> / <code class=\"inline-code\">&gt;^<\/code><\/strong> (below/above).<\/li>\n<li>Functions: <code class=\"inline-code\">area(obj)<\/code>, <code class=\"inline-code\">center(obj)<\/code>, <code class=\"inline-code\">diameter(circle)<\/code>, <code class=\"inline-code\">radius(circle)<\/code>, <code class=\"inline-code\">height(box)<\/code>, <code class=\"inline-code\">width(box)<\/code>, <code class=\"inline-code\">length(obj)<\/code>, <code class=\"inline-code\">npoints(path/polygon)<\/code>, <code class=\"inline-code\">isclosed(path)<\/code>, <code class=\"inline-code\">isopen(path)<\/code>, <code class=\"inline-code\">pclose(path)<\/code>, <code class=\"inline-code\">popen(path)<\/code>.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Testing String, Arithmetic, Bitwise & Date/Time Functions in openGauss","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Run a diagnostic SQL query in openGauss that tests `instr`, `overlay`, `bitand`, `round` with negative and positive scale, `ceil`/`floor` on negative numbers, and date + integer addition.","instructions":["Step 1: Compute `instr('abcdabcdabcd', 'bcd', 2, 2)` and `overlay('hello' PLACING 'world' FROM 2 FOR 3)`.","Step 2: Compute `bitand(29, 15)`, `round(1234.5678, -2)`, `ceil(-42.8)`, and `floor(-42.8)`.","Step 3: Compute `SELECT date '2021-4-28' + integer '7' AS RESULT;`."],"starter_code":"-- Step 1: String functions instr and overlay\nSELECT ____('abcdabcdabcd', 'bcd', 2, 2) AS pos,\n       ____('hello' PLACING 'world' FROM 2 FOR 3) AS replaced;\n\n-- Step 2: Arithmetic functions bitand, round, ceil, floor\nSELECT ____(29, 15) AS b_and,\n       ____(1234.5678, -2) AS rnd_hundreds,\n       ceil(-42.8) AS c_val,\n       floor(-42.8) AS f_val;\n\n-- Step 3 (Ch.05 Quiz Q1): Add 7 days to 2021-4-28\nSELECT date '2021-4-28' + ____ '7' AS RESULT;\n","solution_code":"SELECT instr('abcdabcdabcd', 'bcd', 2, 2) AS pos,\n       overlay('hello' PLACING 'world' FROM 2 FOR 3) AS replaced;\n\nSELECT bitand(29, 15) AS b_and,\n       round(1234.5678, -2) AS rnd_hundreds,\n       ceil(-42.8) AS c_val,\n       floor(-42.8) AS f_val;\n\nSELECT date '2021-4-28' + integer '7' AS RESULT;","hints":["Use `instr(...)` and `overlay(...)` in Step 1.","Use `bitand(29, 15)` and `round(1234.5678, -2)` in Step 2.","Use `integer '7'` in Step 3."],"validation_checks":[{"step":1,"description":"Call `instr` and `overlay`","required_any":["instr('abcdabcdabcd'"],"feedback_fail":"Use `instr('abcdabcdabcd', 'bcd', 2, 2)` and `overlay(...)`."},{"step":2,"description":"Call `bitand(29, 15)` and `round(1234.5678, -2)`","required_any":["bitand(29, 15)","bitand(29,15)"],"feedback_fail":"Include `bitand(29, 15)` and `round(1234.5678, -2)`."},{"step":3,"description":"Add `integer '7'` to `date '2021-4-28'`","required_any":["integer '7'"],"feedback_fail":"Use `SELECT date '2021-4-28' + integer '7' AS RESULT;`."}],"simulated_output":" pos | replaced \n-----+----------\n   6 | hworldo\n(1 row)\n\n b_and | rnd_hundreds | c_val | f_val \n-------+--------------+-------+-------\n    13 |         1200 |   -42 |   -43\n(1 row)\n\n       result        \n---------------------\n 2021-05-05 00:00:00\n(1 row)","quiz_questions":[{"id":"h7_s4_q1","type":"multiple","question":"(Official Ch.05 Quiz p. 468 Q2) Which of the following are arithmetic functions in openGauss?","options":["A. length(str)","B. sin(n)","C. round(v numeric, s int)","D. hex(p1)"],"answer":"BC","explanation":"Per Chapter 05 (pp. 456–457 & p. 468), `sin(n)` (sine value) and `round(v numeric, s int)` (rounding a numeric value) are arithmetic functions. `length(str)` and `hex(p1)` are character/string functions."},{"id":"h7_s4_q2","type":"multiple","question":"(Official Ch.05 Quiz p. 469 Q4) Which three separate approaches to pattern matching are provided by an openGauss database?","options":["A. LIKE","B. Same","C. SIMILAR TO","D. POSIX regular expressions"],"answer":"ACD","explanation":"Per Chapter 05 (p. 469), the three pattern matching approaches are `LIKE`, `SIMILAR TO`, and `POSIX regular expressions`."},{"id":"h7_s4_q3","type":"multiple","question":"(Official Ch.05 Quiz p. 469 Q3) Which of the following are logical operators in openGauss?","options":["A. and","B. or","C. not","D. not or"],"answer":"ABC","explanation":"Per Chapter 05 (p. 449 & p. 469), the logical operators in openGauss are `and`, `or`, and `not`."}],"reference_figures":[]}}]},{"hour_number":8,"folder_name":"Hour-08-GaussDB-Distributed-Database-and-Ecosystem","title":"GaussDB Enterprise Distributed Database & Cloud Ecosystem","chapter_ref":"Chapter 06 (pp. 474–531)","duration_mins":60,"overview":"Understand the positioning and differences between open-source openGauss and commercial distributed GaussDB, master GaussDB's high-availability topologies (1+1, 1+2, Intra-City Active-Active, 3-AZ Multi-Active, Two-Site Three-Center 3DC Geo-Redundant DR, Remote DR), memorize the roles of all distributed components (CN, DN, GTM/GTM-Lite/GTM-Free, CM/CMS, OM, ETCD), and apply the Huawei Cloud database tool suite (DAS, DRS, UGO, CTS, CES, DBSS).","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-GaussDB-Positioning-and-HA-DR-Topologies","exercise_slug":"02-Exercise-GaussDB-vs-openGauss-and-DR-Topologies-Lab","lecture":{"title":"GaussDB Positioning, Full-Stack Architecture & High-Availability Topologies","duration_mins":7,"pdf_ref":"Ch.06, pp. 474–486","objectives":["Contrast openGauss (open-source standalone & primary/standby) with GaussDB (commercial cloud-native distributed & centralized HTAP database)","Memorize GaussDB scale specifications (> 1,000 nodes scale-out, 4 PB storage, up to 256 shards/DNs, > 100,000 cluster concurrent connections)","Compare GaussDB deployment topologies: Centralized 1+1 vs 1+2, Intra-City Active-Active, Intra-City 3-AZ Multi-Active, 3DC Geo-Redundant, and Dual-Cluster Remote DR"],"content_markdown":"### 1. GaussDB Positioning & Differences from openGauss (pp. 478–480)\n**GaussDB** is Huawei's commercial enterprise-level distributed relational database based on the openGauss ecosystem and full-stack Kunpeng hardware/software co-design:\n\n| Dimension | openGauss | GaussDB |\n| :--- | :--- | :--- |\n| **Delivery Model** | **Open-source** software (Mulan PSL v2) | **Commercial enterprise database / Cloud service** |\n| **Architecture** | **Standalone** & **Primary/Standby** (1P + up to 8S) | **Distributed (Shared-Nothing MPP)** & **Centralized (Primary/Standby)** |\n| **Scale & Capacity** | Single-node up to 10,000 concurrent connections; 32 TB/table | Scale-out of **> 1,000 nodes** (up to **256 shards/DNs** per large cluster), **4 PB** storage, **> 100,000 concurrent connections** per cluster (10,000 per node) |\n| **Workload Focus** | Enterprise OLTP & HTAP on single cluster | Massive distributed transaction expansion + HTAP across regions/AZs |\n\n---\n\n### 2. Primary/Standby Replication Modes: `1+1` vs. `1+2` (p. 481)\n- **`1+1` (Maximum Availability)**:\n  - Data is synchronously replicated to 1 standby node. However, **if synchronous replication fails due to network issues, it automatically degrades to asynchronous replication** (and resumes synchronous replication when the network recovers). If a switchover occurs while unsynchronized, data loss may occur.\n- **`1+2` (Maximum Protection)**:\n  - Data is synchronously replicated to 2 standby nodes across up to 3 AZs (5 replicas supported across multiple AZs). **Confirmation from standby is required before returning commit success to the client**, guaranteeing zero data loss (`RPO = 0`).\n\n---\n\n### 3. Distributed High-Availability & Disaster Recovery Topolo
