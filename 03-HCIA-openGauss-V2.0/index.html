gies (pp. 482–486, 522)\n1. **Centralized Cluster Across 3 AZs (p. 482)**: 1 Primary (`DN + CMS + ETCD`) in AZ 1 + 2 Standby (`DN + CMS + ETCD`) in AZ 2 and AZ 3.\n2. **Distributed Cluster in Intra-City Active-Active / 3-AZ Multi-Active Mode (pp. 483–484)**:\n   - Shards (`DN 1..N`), `CN`s, `GTM`s, `CMS`s, and `ETCD`s are striped across 3 AZs in the same city. Every server runs **`CMA` (Cluster Manager Agent)** and **`OMA` (Operation Manager Agent)**.\n3. **Distributed Cluster in Two-Site Three-Center (3DC Geo-Redundant) Mode (p. 485, 522)**:\n   - E.g., **Shanghai DC 1 (AZ 1)** + **Shanghai DC 2 (AZ 2)** in intra-city active-active mode + **Beijing Remote DC (AZ 3)**. Single cluster across AZs achieves **`RPO = 0, RTO < 60s`**.\n4. **Dual-Cluster Remote DR (via OBS Log Synchronization, p. 486)**:\n   - Primary Cluster (AZ 1 + AZ 2 intra-city active-active) ships incremental logs via **OBS** to a remote DR Cluster (AZ 3) for physical log replay.\n   - **Specifications**: **`RPO = 10 seconds`**, **`RTO = 10 minutes`**.\n<!-- PDF_FIGS_START -->\n![GaussDB HA Centralized Cluster Topology (CMS, ETCD, OMA, Primary/Standby DN) (Official Reference: p. 482)](./assets/images/p3_h8s1_ha_centralized.png)\n*Figure: GaussDB HA Centralized Cluster Topology (CMS, ETCD, OMA, Primary/Standby DN) (Official Reference: p. 482)*\n\n![GaussDB Intra-City Active-Active Distributed Cluster Topology (Official Reference: p. 483)](./assets/images/p3_h8s1_ha_active_active.png)\n*Figure: GaussDB Intra-City Active-Active Distributed Cluster Topology (Official Reference: p. 483)*\n\n![GaussDB Intra-City 3-AZ Multi-Active Distributed Topology (Official Reference: p. 484)](./assets/images/p3_h8s1_ha_3az_multiactive.png)\n*Figure: GaussDB Intra-City 3-AZ Multi-Active Distributed Topology (Official Reference: p. 484)*\n\n![GaussDB 3DC Geo-Redundant Multi-Region Cluster Topology (Official Reference: p. 485)](./assets/images/p3_h8s1_ha_3dc_georedundant.png)\n*Figure: GaussDB 3DC Geo-Redundant Multi-Region Cluster Topology (Official Reference: p. 485)*\n\n![GaussDB Remote Disaster Recovery (Physical Log Replay, RPO 10s / RTO 10m) (Official Reference: p. 486)](./assets/images/p3_h8s1_ha_remote_dr.png)\n*Figure: GaussDB Remote Disaster Recovery (Physical Log Replay, RPO 10s / RTO 10m) (Official Reference: p. 486)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["openGauss is open-source (standalone and primary/standby), whereas GaussDB is Huawei's commercial enterprise cloud database supporting both centralized and distributed (Shared-Nothing) deployment up to >1,000 nodes (256 shards), 4 PB data, and >100,000 concurrent connections.","In Primary/Standby deployment, `1+1` is Maximum Availability (falls back to async on network fault) and `1+2` is Maximum Protection (strict sync confirmation).","In Dual-Cluster Remote DR via OBS log synchronization, the specifications are RPO = 10 seconds and RTO = 10 minutes (whereas intra-city active-active / 3DC achieves RPO = 0, RTO < 60s)."],"exam_traps":["EXAM TRAP: In GaussDB, what is the difference between `1+1` and `1+2` primary/standby modes? `1+1` is 'Maximum Availability' (switches to async replication on network fault), while `1+2` is 'Maximum Protection' (requires standby confirmation before returning to client, Ch.06 p. 481).","EXAM TRAP: In an ETCD cluster within GaussDB, there must be **3 or more ETCD instances** and the total number of ETCDs **must be an odd number** (using the Raft consensus algorithm with Leader and Follower roles, Ch.06 p. 482)."],"content_html":"<h3>1. GaussDB Positioning &amp; Differences from openGauss (pp. 478–480)<\/h3>\n<p><strong>GaussDB<\/strong> is Huawei's commercial enterprise-level distributed relational database based on the openGauss ecosystem and full-stack Kunpeng hardware/software co-design:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Dimension<\/th><th>openGauss<\/th><th>GaussDB<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Delivery Model<\/strong><\/td><td><strong>Open-source<\/strong> software (Mulan PSL v2)<\/td><td><strong>Commercial enterprise database / Cloud service<\/strong><\/td><\/tr>\n<tr><td><strong>Architecture<\/strong><\/td><td><strong>Standalone<\/strong> &amp; <strong>Primary/Standby<\/strong> (1P + up to 8S)<\/td><td><strong>Distributed (Shared-Nothing MPP)<\/strong> &amp; <strong>Centralized (Primary/Standby)<\/strong><\/td><\/tr>\n<tr><td><strong>Scale &amp; Capacity<\/strong><\/td><td>Single-node up to 10,000 concurrent connections; 32 TB/table<\/td><td>Scale-out of <strong>&gt; 1,000 nodes<\/strong> (up to <strong>256 shards/DNs<\/strong> per large cluster), <strong>4 PB<\/strong> storage, <strong>&gt; 100,000 concurrent connections<\/strong> per cluster (10,000 per node)<\/td><\/tr>\n<tr><td><strong>Workload Focus<\/strong><\/td><td>Enterprise OLTP &amp; HTAP on single cluster<\/td><td>Massive distributed transaction expansion + HTAP across regions/AZs<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Primary/Standby Replication Modes: <code class=\"inline-code\">1+1<\/code> vs. <code class=\"inline-code\">1+2<\/code> (p. 481)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">1+1<\/code> (Maximum Availability)<\/strong>:<\/li>\n<li>Data is synchronously replicated to 1 standby node. However, <strong>if synchronous replication fails due to network issues, it automatically degrades to asynchronous replication<\/strong> (and resumes synchronous replication when the network recovers). If a switchover occurs while unsynchronized, data loss may occur.<\/li>\n<li><strong><code class=\"inline-code\">1+2<\/code> (Maximum Protection)<\/strong>:<\/li>\n<li>Data is synchronously replicated to 2 standby nodes across up to 3 AZs (5 replicas supported across multiple AZs). <strong>Confirmation from standby is required before returning commit success to the client<\/strong>, guaranteeing zero data loss (<code class=\"inline-code\">RPO = 0<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Distributed High-Availability &amp; Disaster Recovery Topologies (pp. 482–486, 522)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Centralized Cluster Across 3 AZs (p. 482)<\/strong>: 1 Primary (<code class=\"inline-code\">DN + CMS + ETCD<\/code>) in AZ 1 + 2 Standby (<code class=\"inline-code\">DN + CMS + ETCD<\/code>) in AZ 2 and AZ 3.<\/li>\n<li><strong>Distributed Cluster in Intra-City Active-Active / 3-AZ Multi-Active Mode (pp. 483–484)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Shards (<code class=\"inline-code\">DN 1..N<\/code>), <code class=\"inline-code\">CN<\/code>s, <code class=\"inline-code\">GTM<\/code>s, <code class=\"inline-code\">CMS<\/code>s, and <code class=\"inline-code\">ETCD<\/code>s are striped across 3 AZs in the same city. Every server runs <strong><code class=\"inline-code\">CMA<\/code> (Cluster Manager Agent)<\/strong> and <strong><code class=\"inline-code\">OMA<\/code> (Operation Manager Agent)<\/strong>.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Distributed Cluster in Two-Site Three-Center (3DC Geo-Redundant) Mode (p. 485, 522)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>E.g., <strong>Shanghai DC 1 (AZ 1)<\/strong> + <strong>Shanghai DC 2 (AZ 2)<\/strong> in intra-city active-active mode + <strong>Beijing Remote DC (AZ 3)<\/strong>. Single cluster across AZs achieves <strong><code class=\"inline-code\">RPO = 0, RTO &lt; 60s<\/code><\/strong>.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Dual-Cluster Remote DR (via OBS Log Synchronization, p. 486)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Primary Cluster (AZ 1 + AZ 2 intra-city active-active) ships incremental logs via <strong>OBS<\/strong> to a remote DR Cluster (AZ 3) for physical log replay.<\/li>\n<li><strong>Specifications<\/strong>: <strong><code class=\"inline-code\">RPO = 10 seconds<\/code><\/strong>, <strong><code class=\"inline-code\">RTO = 10 minutes<\/code><\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s1_ha_centralized.png\" alt=\"GaussDB HA Centralized Cluster Topology (CMS, ETCD, OMA, Primary/Standby DN)\" data-caption=\"GaussDB HA Centralized Cluster Topology (CMS, ETCD, OMA, Primary/Standby DN) (Official Reference: p. 482)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GaussDB HA Centralized Cluster Topology (CMS, ETCD, OMA, Primary/Standby DN)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 482 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s1_ha_active_active.png\" alt=\"GaussDB Intra-City Active-Active Distributed Cluster Topology\" data-caption=\"GaussDB Intra-City Active-Active Distributed Cluster Topology (Official Reference: p. 483)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GaussDB Intra-City Active-Active Distributed Cluster Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 483 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s1_ha_3az_multiactive.png\" alt=\"GaussDB Intra-City 3-AZ Multi-Active Distributed Topology\" data-caption=\"GaussDB Intra-City 3-AZ Multi-Active Distributed Topology (Official Reference: p. 484)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GaussDB Intra-City 3-AZ Multi-Active Distributed Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 484 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s1_ha_3dc_georedundant.png\" alt=\"GaussDB 3DC Geo-Redundant Multi-Region Cluster Topology\" data-caption=\"GaussDB 3DC Geo-Redundant Multi-Region Cluster Topology (Official Reference: p. 485)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GaussDB 3DC Geo-Redundant Multi-Region Cluster Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 485 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s1_ha_remote_dr.png\" alt=\"GaussDB Remote Disaster Recovery (Physical Log Replay, RPO 10s / RTO 10m)\" data-caption=\"GaussDB Remote Disaster Recovery (Physical Log Replay, RPO 10s / RTO 10m) (Official Reference: p. 486)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GaussDB Remote Disaster Recovery (Physical Log Replay, RPO 10s / RTO 10m)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 486 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Auditing GaussDB Distributed Cluster Capacity & HA/DR Specifications","duration_mins":8,"exercise_type":"sql","prompt_label":"GaussDB=#","scenario":"You are architecting a financial-grade GaussDB deployment. Record the official GaussDB scale-out limits (4 PB max storage, 256 max shards, 100,000 concurrent connections) and Dual-Cluster Remote DR RPO/RTO metrics.","instructions":["Step 1: Specify `4` (PB) as the maximum storage capacity, `256` as the maximum number of shards/DNs in a single large cluster, and `100000` as the cluster concurrent connections.","Step 2: Specify `'10 seconds'` as the RPO and `'10 minutes'` as the RTO for Dual-Cluster Remote DR."],"starter_code":"-- Complete the GaussDB enterprise specification verification query:\nSELECT\n    ____         AS max_storage_pb,            -- Max petabytes of data (p. 478)\n    ____         AS max_shards_per_cluster,    -- Max shards/DNs per cluster (p. 487/494)\n    ____         AS max_cluster_connections,   -- Max concurrent connections per cluster (p. 494)\n    '____'       AS remote_dr_rpo,             -- Dual-cluster Remote DR RPO (p. 486)\n    '____'       AS remote_dr_rto;             -- Dual-cluster Remote DR RTO (p. 486)\n","solution_code":"SELECT\n    4          AS max_storage_pb,\n    256        AS max_shards_per_cluster,\n    100000     AS max_cluster_connections,\n    '10 seconds' AS remote_dr_rpo,\n    '10 minutes' AS remote_dr_rto;","hints":["GaussDB supports 4 PB of data, up to 256 shards/DNs per large cluster, and > 100,000 (`100000`) concurrent connections per cluster.","Dual-Cluster Remote DR (p. 486) achieves RPO of `'10 seconds'` and RTO of `'10 minutes'`."],"validation_checks":[{"step":1,"description":"Specify `4` PB, `256` shards, and `100000` connections","required_any":["256"],"feedback_fail":"Specify `4`, `256`, and `100000`."},{"step":2,"description":"Specify `'10 seconds'` RPO and `'10 minutes'` RTO","required_any":["10 seconds"],"feedback_fail":"Specify `'10 seconds'` for `remote_dr_rpo` and `'10 minutes'` for `remote_dr_rto`."}],"simulated_output":" max_storage_pb | max_shards_per_cluster | max_cluster_connections | remote_dr_rpo | remote_dr_rto \n----------------+------------------------+-------------------------+---------------+---------------\n              4 |                    256 |                  100000 | 10 seconds    | 10 minutes\n(1 row)","quiz_questions":[{"id":"h8_s1_q1","type":"single","question":"What is the key architectural difference between openGauss and GaussDB?","options":["A. openGauss supports distributed Shared-Nothing deployment, whereas GaussDB supports only standalone deployment","B. openGauss is an open-source database supporting standalone and primary/standby deployments, whereas GaussDB is a commercial cloud database supporting both distributed and centralized deployments","C. openGauss is developed in Java, whereas GaussDB is developed in Python","D. openGauss supports only x86 processors, whereas GaussDB supports only ARM processors"],"answer":"B","explanation":"Per Chapter 06 (p. 478), openGauss is open-source and uses standalone and primary/standby architectures, whereas GaussDB is a commercial cloud service supporting both distributed and centralized systems."},{"id":"h8_s1_q2","type":"single","question":"In GaussDB Primary/Standby deployment, how do `1+1 (maximum availability)` and `1+2 (maximum protection)` differ when a network problem prevents synchronous replication?","options":["A. `1+1` switches to asynchronous replication until network recovery; `1+2` requires synchronous confirmation from a standby node before returning to the client","B. `1+1` shuts down the primary node immediately; `1+2` deletes all standby logs","C. `1+1` requires 3 AZs; `1+2` requires only 1 AZ","D. Both `1+1` and `1+2` discard all uncommitted and committed transactions"],"answer":"A","explanation":"Per Chapter 06 (p. 481), in `1+1 (maximum availability)`, if synchronous replication cannot be completed due to network problems, asynchronous replication is used until recovery. In `1+2 (maximum protection)`, synchronous confirmation from the standby node is required before returning to the client."},{"id":"h8_s1_q3","type":"tf","question":"In a GaussDB cluster, ETCD uses the Raft algorithm at the bottom layer to ensure consistency, and there must be three or more ETCD instances with an odd total number.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.06 p. 482). ETCD uses the Raft algorithm for consistency, and a cluster must have 3 or more ETCDs in an odd number (Leader and Follower roles)."}],"reference_figures":[{"slug":"p3_h8s1_ha_3dc_georedundant","title":"GaussDB 3DC Geo-Redundant Multi-Region Cluster Topology","pdf_page":485}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-GaussDB-Distributed-Components-CN-DN-GTM-CMS-ETCD","exercise_slug":"04-Exercise-Distributed-Query-Flow-and-Components-Lab","lecture":{"title":"GaussDB Distributed Components — CN, DN, GTM, CMS & ETCD","duration_mins":7,"pdf_ref":"Ch.06, pp. 487–495, 527","objectives":["Memorize the exact role of every GaussDB distributed component: CN, DN, GTM, CM/CMS/CMA, OM/OMA, ETCD, WLM, GDS Loader, and Storage (Ch.06 Quiz Q1: D!)","Trace the 5-step distributed parallel SQL execution flow across CNs and DNs","Distinguish the 3 inter-DN data stream operators (`Broadcast`, `Gather`, `Redistribution`)"],"content_markdown":"### 1. GaussDB Distributed Architecture Components (pp. 487, 495, Ch.06 Quiz Q1!)\n\n| Component | Full Name | Official Responsibility in GaussDB (p. 495) |\n| :--- | :--- | :--- |\n| **`CN`** | **Coordinator Node** | Receives SQL access requests from applications, uses the optimizer to **generate distributed execution plans**, breaks down tasks and distributes fragments to DNs for parallel processing, and **summarizes/returns final results** to the client. |\n| **`DN`** | **Data Node** | Stores service data (in row, column, or hybrid mode), executes data query tasks assigned by CNs, and returns result sets to CNs. |\n| **`GTM`** | **Global Transaction Manager** | Generates and maintains globally unique transaction information: **global transaction ID (`GXID`), transaction snapshot, timestamp, and sequence**. |\n| **`ETCD`** | **Editable Text Configuration Daemon** | Distributed key-value store (Raft consensus) **used for sharing configurations and discovering services (service registration and search) — Exact Ch.06 Quiz Q1: D!** |\n| **`CM` (`CMS` + `CMA`)** | **Cluster Manager** | Manages and monitors the running status of functional units and physical resources across the distributed system, driving automatic failover. |\n| **`OM` (`OMA`)** | **Operation Manager** | Provides management interfaces and tools for routine O&M and configuration management of the cluster. |\n| **`Storage`** | **Local Storage** | Server's local storage resources used to store data permanently (Shared-Nothing architecture). |\n| **`GDS Loader` & `WLM`** | **Gauss Data Service / Workload Manager** | High-speed parallel data loading direct to DNs (`GDS`) and workload resource management (`WLM`). |\n\n> **Roles Perceived by the Management Plane (p. 495)**: **`DN`**, **`CN`**, **`GTM`**, **`ETCD`**, and **`CMS`**.\n<!-- PDF_FIGS_START -->\n![GaussDB Distributed Components Architecture and Control/Data Planes (CM, GTM, CN, DN, ETCD, CMS) (Official Reference: p. 495)](./assets/images/p3_h8s2_distributed_components.png)\n*Figure: GaussDB Distributed Components Architecture and Control/Data Planes (CM, GTM, CN, DN, ETCD, CMS) (Official Reference: p. 495)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Five-Step Fully Parallel Distributed Execution Flow (p. 487)\n1. **Step 1 (SQL Submission)**: The service application sends an SQL statement (`SELECT`, `INSERT`, `UPDATE`, `DELETE`/`DROP`) to a **CN**.\n2. **Step 2 (Plan Generation & Dispatch)**: The **CN** uses its query optimizer to generate a distributed execution plan and dispatches plan fragments to the **DNs** (acquiring global snapshot/CSN from **GTM**).\n3. **Step 3 (Inter-DN Stream Exchange)**: Because data is evenly distributed across DNs via consistent hashing, DNs exchange intermediate data when needed using **three types of Streams**:\n   - **`Broadcast` Stream**: Broadcasts a small table's rows to all DNs.\n   - **`Redistribution` Stream**: Re-hashes rows by join/group key across DNs.\n   - **`Gather` Stream**: Collects results from DNs back to the CN.\n4. **Step 4 (Result Return to CN)**: Each **DN** executes its fragment in multi-threaded parallel mode and returns its partial result set to the **CN**.\n5. **Step 5 (Final Aggregation)**: The **CN** summarizes/merges the results and sends the final response to the service application.\n<!-- PDF_FIGS_START -->\n![GaussDB Distributed SQL Execution 5-Step Flow Across CN and DNs (Official Reference: p. 487)](./assets/images/p3_h8s2_distributed_exec_flow.png)\n*Figure: GaussDB Distributed SQL Execution 5-Step Flow Across CN and DNs (Official Reference: p. 487)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Additional High-Performance Engines in GaussDB (pp. 489–490)\n- **High-Speed Parallel Data Loading (`GDS`)**: **CNs** only plan and deliver tasks while **DNs** directly import data in parallel (`CSV`, `TEXT`, or `FIXED` format), fully utilizing all nodes' I/O and network bandwidth.\n- **LLVM Dynamic Compilation (JIT)**: Moves determination of the actual execution path from the executor phase to the **execution initialization phase**, eliminating function-call overhead and branch mispredictions on expression evaluation.\n- **Adaptive Compression**: Automatically selects the optimal compression algorithm by data type (**`RLE`**, **`DELTA`**, **`BYTEPACK`/`BITPACK`**, **`LZ4`**, **`ZLIB`**, **`LOCAL DICTIONARY`**).","key_takeaways":["In GaussDB's distributed architecture, `ETCD` is used for sharing configurations and service discovery (service registration and search) — exact Ch.06 Quiz Q1: D!","`CN` parses SQL, generates distributed plans, dispatches tasks to DNs, and aggregates final results; `DN` stores data and executes query fragments; `GTM` manages global transaction IDs, snapshots, timestamps, and sequences.","GaussDB provides three Stream operators to exchange data among DNs: `Broadcast`, `Gather`, and `Redistribution`."],"exam_traps":["EXAM TRAP (Ch.06 Quiz Q1): 'In the GaussDB distributed architecture, which component is used for sharing configuration and service discovery (service registration and search)?' -> D. `ETCD`! Do not confuse `ETCD` with `GTM` (global transaction info) or `CM` (cluster status monitoring).","EXAM TRAP: During high-speed parallel data loading in GaussDB, does table data pass through the CN? No! CNs are only responsible for task planning and delivery, while DNs import data directly in parallel (Ch.06 p. 489)."],"content_html":"<h3>1. GaussDB Distributed Architecture Components (pp. 487, 495, Ch.06 Quiz Q1!)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Component<\/th><th>Full Name<\/th><th>Official Responsibility in GaussDB (p. 495)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">CN<\/code><\/strong><\/td><td><strong>Coordinator Node<\/strong><\/td><td>Receives SQL access requests from applications, uses the optimizer to <strong>generate distributed execution plans<\/strong>, breaks down tasks and distributes fragments to DNs for parallel processing, and <strong>summarizes/returns final results<\/strong> to the client.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">DN<\/code><\/strong><\/td><td><strong>Data Node<\/strong><\/td><td>Stores service data (in row, column, or hybrid mode), executes data query tasks assigned by CNs, and returns result sets to CNs.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">GTM<\/code><\/strong><\/td><td><strong>Global Transaction Manager<\/strong><\/td><td>Generates and maintains globally unique transaction information: <strong>global transaction ID (<code class=\"inline-code\">GXID<\/code>), transaction snapshot, timestamp, and sequence<\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">ETCD<\/code><\/strong><\/td><td><strong>Editable Text Configuration Daemon<\/strong><\/td><td>Distributed key-value store (Raft consensus) <strong>used for sharing configurations and discovering services (service registration and search) — Exact Ch.06 Quiz Q1: D!<\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">CM<\/code> (<code class=\"inline-code\">CMS<\/code> + <code class=\"inline-code\">CMA<\/code>)<\/strong><\/td><td><strong>Cluster Manager<\/strong><\/td><td>Manages and monitors the running status of functional units and physical resources across the distributed system, driving automatic failover.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">OM<\/code> (<code class=\"inline-code\">OMA<\/code>)<\/strong><\/td><td><strong>Operation Manager<\/strong><\/td><td>Provides management interfaces and tools for routine O&amp;M and configuration management of the cluster.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">Storage<\/code><\/strong><\/td><td><strong>Local Storage<\/strong><\/td><td>Server's local storage resources used to store data permanently (Shared-Nothing architecture).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">GDS Loader<\/code> &amp; <code class=\"inline-code\">WLM<\/code><\/strong><\/td><td><strong>Gauss Data Service / Workload Manager<\/strong><\/td><td>High-speed parallel data loading direct to DNs (<code class=\"inline-code\">GDS<\/code>) and workload resource management (<code class=\"inline-code\">WLM<\/code>).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"md-quote\"><strong>Roles Perceived by the Management Plane (p. 495)<\/strong>: <strong><code class=\"inline-code\">DN<\/code><\/strong>, <strong><code class=\"inline-code\">CN<\/code><\/strong>, <strong><code class=\"inline-code\">GTM<\/code><\/strong>, <strong><code class=\"inline-code\">ETCD<\/code><\/strong>, and <strong><code class=\"inline-code\">CMS<\/code><\/strong>.<\/blockquote>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s2_distributed_components.png\" alt=\"GaussDB Distributed Components Architecture and Control/Data Planes (CM, GTM, CN, DN, ETCD, CMS)\" data-caption=\"GaussDB Distributed Components Architecture and Control/Data Planes (CM, GTM, CN, DN, ETCD, CMS) (Official Reference: p. 495)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GaussDB Distributed Components Architecture and Control/Data Planes (CM, GTM, CN, DN, ETCD, CMS)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 495 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Five-Step Fully Parallel Distributed Execution Flow (p. 487)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Step 1 (SQL Submission)<\/strong>: The service application sends an SQL statement (<code class=\"inline-code\">SELECT<\/code>, <code class=\"inline-code\">INSERT<\/code>, <code class=\"inline-code\">UPDATE<\/code>, <code class=\"inline-code\">DELETE<\/code>/<code class=\"inline-code\">DROP<\/code>) to a <strong>CN<\/strong>.<\/li>\n<li><strong>Step 2 (Plan Generation &amp; Dispatch)<\/strong>: The <strong>CN<\/strong> uses its query optimizer to generate a distributed execution plan and dispatches plan fragments to the <strong>DNs<\/strong> (acquiring global snapshot/CSN from <strong>GTM<\/strong>).<\/li>\n<li><strong>Step 3 (Inter-DN Stream Exchange)<\/strong>: Because data is evenly distributed across DNs via consistent hashing, DNs exchange intermediate data when needed using <strong>three types of Streams<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">Broadcast<\/code> Stream<\/strong>: Broadcasts a small table's rows to all DNs.<\/li>\n<li><strong><code class=\"inline-code\">Redistribution<\/code> Stream<\/strong>: Re-hashes rows by join/group key across DNs.<\/li>\n<li><strong><code class=\"inline-code\">Gather<\/code> Stream<\/strong>: Collects results from DNs back to the CN.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Step 4 (Result Return to CN)<\/strong>: Each <strong>DN<\/strong> executes its fragment in multi-threaded parallel mode and returns its partial result set to the <strong>CN<\/strong>.<\/li>\n<li><strong>Step 5 (Final Aggregation)<\/strong>: The <strong>CN<\/strong> summarizes/merges the results and sends the final response to the service application.<\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s2_distributed_exec_flow.png\" alt=\"GaussDB Distributed SQL Execution 5-Step Flow Across CN and DNs\" data-caption=\"GaussDB Distributed SQL Execution 5-Step Flow Across CN and DNs (Official Reference: p. 487)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GaussDB Distributed SQL Execution 5-Step Flow Across CN and DNs<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 487 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Additional High-Performance Engines in GaussDB (pp. 489–490)<\/h3>\n<ul class=\"md-list\">\n<li><strong>High-Speed Parallel Data Loading (<code class=\"inline-code\">GDS<\/code>)<\/strong>: <strong>CNs<\/strong> only plan and deliver tasks while <strong>DNs<\/strong> directly import data in parallel (<code class=\"inline-code\">CSV<\/code>, <code class=\"inline-code\">TEXT<\/code>, or <code class=\"inline-code\">FIXED<\/code> format), fully utilizing all nodes' I/O and network bandwidth.<\/li>\n<li><strong>LLVM Dynamic Compilation (JIT)<\/strong>: Moves determination of the actual execution path from the executor phase to the <strong>execution initialization phase<\/strong>, eliminating function-call overhead and branch mispredictions on expression evaluation.<\/li>\n<li><strong>Adaptive Compression<\/strong>: Automatically selects the optimal compression algorithm by data type (<strong><code class=\"inline-code\">RLE<\/code><\/strong>, <strong><code class=\"inline-code\">DELTA<\/code><\/strong>, <strong><code class=\"inline-code\">BYTEPACK<\/code>/<code class=\"inline-code\">BITPACK<\/code><\/strong>, <strong><code class=\"inline-code\">LZ4<\/code><\/strong>, <strong><code class=\"inline-code\">ZLIB<\/code><\/strong>, <strong><code class=\"inline-code\">LOCAL DICTIONARY<\/code><\/strong>).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Mapping GaussDB Distributed Components (`CN`, `DN`, `GTM`, `CM`, `OM`, `ETCD`)","duration_mins":8,"exercise_type":"sql","prompt_label":"GaussDB=#","scenario":"Complete the GaussDB distributed component responsibility lookup query so that every component from Chapter 06 Slide 20 (p. 495) is accurately matched to its official role.","instructions":["Step 1: Match `'CN'` to receiving application SQL requests and distributing task fragments, and `'DN'` to storing service data and executing query tasks.","Step 2: Match `'GTM'` to generating global transaction IDs, snapshots, timestamps, and sequences.","Step 3: Match `'ETCD'` to sharing configurations and service discovery (service registration and search — Ch.06 Quiz Q1)."],"starter_code":"-- Map each GaussDB distributed component to its official function:\nSELECT\n    '____' AS sql_coordinator,       -- Breaks down tasks & distributes to DNs\n    '____' AS data_executor,         -- Stores service data & executes query tasks\n    '____' AS global_txn_mgr,        -- Generates global XID, snapshot, timestamp, sequence\n    '____' AS config_and_discovery;  -- Shares configuration & service discovery (Ch.06 Quiz Q1)\n","solution_code":"SELECT\n    'CN'   AS sql_coordinator,\n    'DN'   AS data_executor,\n    'GTM'  AS global_txn_mgr,\n    'ETCD' AS config_and_discovery;","hints":["Coordinator Node is `CN`, Data Node is `DN`, Global Transaction Manager is `GTM`, and Editable Text Configuration Daemon is `ETCD`."],"validation_checks":[{"step":1,"description":"Identify `CN` and `DN`","required_any":["'cn'"],"feedback_fail":"Specify `'CN'` and `'DN'`."},{"step":2,"description":"Identify `GTM`","required_any":["'gtm'"],"feedback_fail":"Specify `'GTM'` for the Global Transaction Manager."},{"step":3,"description":"Identify `ETCD` for configuration sharing and service discovery","required_any":["'etcd'"],"feedback_fail":"Specify `'ETCD'` for sharing configuration and service discovery."}],"simulated_output":" sql_coordinator | data_executor | global_txn_mgr | config_and_discovery \n-----------------+---------------+----------------+----------------------\n CN              | DN            | GTM            | ETCD\n(1 row)","quiz_questions":[{"id":"h8_s2_q1","type":"single","question":"(Official Ch.06 Quiz Q1) In the GaussDB distributed architecture, which of the following components is used for sharing configuration and service discovery (service registration and search)?","options":["A. CN","B. DN","C. GTM","D. ETCD"],"answer":"D","explanation":"Per Chapter 06 (p. 482, p. 495 & p. 527), ETCD is used for sharing configurations and discovering services (service registration and search)."},{"id":"h8_s2_q2","type":"single","question":"In the GaussDB distributed architecture, which component generates and maintains globally unique information such as the global transaction ID, transaction snapshot, timestamp, and sequence?","options":["A. CN (Coordinator Node)","B. DN (Data Node)","C. GTM (Global Transaction Manager)","D. CM (Cluster Manager)"],"answer":"C","explanation":"Per Chapter 06 (p. 487 & p. 495), the GTM (Global Transaction Manager) generates and maintains globally unique information, including the global transaction ID, transaction snapshot, timestamp, and sequence."},{"id":"h8_s2_q3","type":"multiple","question":"Which three types of Stream operators does GaussDB provide to exchange data between DNs during distributed query execution?","options":["A. Broadcast","B. Gather","C. Redistribution","D. ShuffleSplit"],"answer":"ABC","explanation":"Per Chapter 06 (p. 487), GaussDB provides three types of streams — `Broadcast`, `Gather`, and `Redistribution` — to handle data transfer between DNs."}],"reference_figures":[{"slug":"p3_h8s2_distributed_components","title":"GaussDB Distributed Components Architecture and Control/Data Planes (CM, GTM, CN, DN, ETCD, CMS)","pdf_page":495},{"slug":"p3_h8s2_distributed_exec_flow","title":"GaussDB Distributed SQL Execution 5-Step Flow Across CN and DNs","pdf_page":487}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-GaussDB-Enterprise-Features-Storage-GTM-Lite-and-Backup","exercise_slug":"06-Exercise-Distributed-Tables-GTM-Lite-and-Backup-Lab","lecture":{"title":"GaussDB Enterprise Features — Distributed Storage, `GTM-Lite` & Physical/Logical Backup","duration_mins":7,"pdf_ref":"Ch.06, pp. 496–503","objectives":["Contrast GaussDB two-layer distributed storage: inter-shard (`Hash distribution` vs `Replication distribution`) and intra-shard (`Quorum multi-copy`)","Compare `GTM-Lite` (strongly consistent, lock-free CSN) vs. `GTM-Free` (eventually consistent, no central node)","Distinguish GaussDB Physical Backup (full + incremental to OBS) from Logical Backup (streaming table extract to local disk/OBS in TEXT/CSV)"],"content_markdown":"### 1. Two-Layer Distributed Storage: Inter-Shard & Intra-Shard (p. 497)\nGaussDB provides a **two-layer distributed storage architecture**:\n1. **Layer 1 — Inter-Shard Data Distribution (Between Shards)**:\n   - **Hash Distribution (`DISTRIBUTE BY HASH(col)`)**: Applied to **large user tables**. Hashes one or more user-specified distribution keys to spread rows evenly across shards, expanding total capacity and enabling parallel query processing and shard pruning.\n   - **Replication Distribution (`DISTRIBUTE BY REPLICATION`)**: Applied to **small dimension/lookup tables**. Stores a complete copy of the table on **every shard**, allowing multi-table joins to execute locally on each DN without cross-node data redistribution!\n2. **Layer 2 — Intra-Shard Data Storage (Within Each Shard)**:\n   - Uses **quorum-based distributed multi-copy storage** (Primary DN + Standby DNs per shard) with automatic primary/standby switchover, AZ switchover, and forcible promotion to primary.\n\n---\n\n### 2. Distributed Transaction Processing: `GTM-Lite` vs. `GTM-Free` (p. 500)\nTraditional distributed databases maintain a global active transaction list on the GTM, which becomes a central bottleneck. Huawei's **`GTM-Lite`** eliminates this bottleneck via three innovations:\n1. **CSN Replaces Transaction Lists**: Uses a 64-bit **Commit Sequence Number (`CSN`)** to determine tuple visibility immediately without traversing a global active transaction list.\n2. **Lock-Free Atomic Operations**: Assigns CSNs via lock-free atomic instructions so concurrent transactions obtain CSNs simultaneously without single-point contention.\n3. **Minimal Network Overhead**: Only a single CSN integer is exchanged during node interactions.\n\n| Transaction Mode | Consistency Level | Central GTM Dependency & Target Scenario |\n| :--- | :--- | :--- |\n| **`GTM-Lite` Mode** | **Strong Global Consistency** | Connects to lightweight GTM for lock-free CSN snapshots; ideal for general enterprise OLTP requiring real-time cross-shard read consistency. |\n| **`GTM-Free` Mode** | **Eventual Consistency** (does not provide real-time cross-node read consistency) | **Does NOT connect to GTM** (zero central node involvement); achieves maximum throughput in **perfectly sharded OLTP scenarios**. |\n<!-- PDF_FIGS_START -->\n![GTM-Lite Lockless Transaction Timestamp Coordination (Official Reference: p. 500)](./assets/images/p3_h8s3_gtm_lite.png)\n*Figure: GTM-Lite Lockless Transaction Timestamp Coordination (Official Reference: p. 500)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Distributed Physical Backup vs. Logical Backup (pp. 502–503)\n- **Physical Backup (p. 502)**:\n  - Backs up data files of each DN across the **entire cluster in parallel to OBS (Object Storage Service)** in internal database format and restores to **homogeneous databases** (supports compression, flow control, and resumable backup).\n  - **Full Backup vs. Incremental Backup**:\n    - **Full backup**: Backs up all data at a time point (duration proportional to total DB size).\n    - **Incremental backup**: Backs up only data modified since the last backup (duration proportional to changed data size). **Restoring a complete database requires BOTH the full backup and subsequent incremental backups** (e.g., Monday Full + Tue–Sun Incrementals).\n- **Logical Backup (p. 503)**:\n  - Extracts user table records from each DN in parallel streaming mode to **local disk files or OBS in `TEXT` or `CSV` format**, and can restore data into **homogeneous OR heterogeneous databases**.","key_takeaways":["Between shards, GaussDB uses Hash distribution for large tables and Replication distribution (a full copy on every shard) for small lookup tables to accelerate multi-table joins.","`GTM-Lite` provides strong global consistency using lock-free CSNs (replacing active transaction lists), whereas `GTM-Free` provides eventual consistency without connecting to GTM for perfectly sharded OLTP.","Physical backup writes internal-format cluster files to OBS for homogeneous restore (Full + Incremental), whereas Logical backup streams user tables in TEXT/CSV to local disk or OBS for homogeneous or heterogeneous restore."],"exam_traps":["EXAM TRAP: Can you restore a complete database using ONLY an incremental physical backup? No! A complete database can be restored only when BOTH the full backup and incremental backups are used together (Ch.06 p. 502).","EXAM TRAP: Do not confuse `GTM-Lite` (strongly consistent, uses lock-free CSNs) with `GTM-Free` (eventually consistent, does not connect to GTM)."],"content_html":"<h3>1. Two-Layer Distributed Storage: Inter-Shard &amp; Intra-Shard (p. 497)<\/h3>\n<p>GaussDB provides a <strong>two-layer distributed storage architecture<\/strong>:<\/p>\n<ol class=\"md-list\">\n<li><strong>Layer 1 — Inter-Shard Data Distribution (Between Shards)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Hash Distribution (<code class=\"inline-code\">DISTRIBUTE BY HASH(col)<\/code>)<\/strong>: Applied to <strong>large user tables<\/strong>. Hashes one or more user-specified distribution keys to spread rows evenly across shards, expanding total capacity and enabling parallel query processing and shard pruning.<\/li>\n<li><strong>Replication Distribution (<code class=\"inline-code\">DISTRIBUTE BY REPLICATION<\/code>)<\/strong>: Applied to <strong>small dimension/lookup tables<\/strong>. Stores a complete copy of the table on <strong>every shard<\/strong>, allowing multi-table joins to execute locally on each DN without cross-node data redistribution!<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Layer 2 — Intra-Shard Data Storage (Within Each Shard)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Uses <strong>quorum-based distributed multi-copy storage<\/strong> (Primary DN + Standby DNs per shard) with automatic primary/standby switchover, AZ switchover, and forcible promotion to primary.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Distributed Transaction Processing: <code class=\"inline-code\">GTM-Lite<\/code> vs. <code class=\"inline-code\">GTM-Free<\/code> (p. 500)<\/h3>\n<p>Traditional distributed databases maintain a global active transaction list on the GTM, which becomes a central bottleneck. Huawei's <strong><code class=\"inline-code\">GTM-Lite<\/code><\/strong> eliminates this bottleneck via three innovations:<\/p>\n<ol class=\"md-list\">\n<li><strong>CSN Replaces Transaction Lists<\/strong>: Uses a 64-bit <strong>Commit Sequence Number (<code class=\"inline-code\">CSN<\/code>)<\/strong> to determine tuple visibility immediately without traversing a global active transaction list.<\/li>\n<li><strong>Lock-Free Atomic Operations<\/strong>: Assigns CSNs via lock-free atomic instructions so concurrent transactions obtain CSNs simultaneously without single-point contention.<\/li>\n<li><strong>Minimal Network Overhead<\/strong>: Only a single CSN integer is exchanged during node interactions.<\/li>\n<\/ol>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Transaction Mode<\/th><th>Consistency Level<\/th><th>Central GTM Dependency &amp; Target Scenario<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">GTM-Lite<\/code> Mode<\/strong><\/td><td><strong>Strong Global Consistency<\/strong><\/td><td>Connects to lightweight GTM for lock-free CSN snapshots; ideal for general enterprise OLTP requiring real-time cross-shard read consistency.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">GTM-Free<\/code> Mode<\/strong><\/td><td><strong>Eventual Consistency<\/strong> (does not provide real-time cross-node read consistency)<\/td><td><strong>Does NOT connect to GTM<\/strong> (zero central node involvement); achieves maximum throughput in <strong>perfectly sharded OLTP scenarios<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s3_gtm_lite.png\" alt=\"GTM-Lite Lockless Transaction Timestamp Coordination\" data-caption=\"GTM-Lite Lockless Transaction Timestamp Coordination (Official Reference: p. 500)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>GTM-Lite Lockless Transaction Timestamp Coordination<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 500 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Distributed Physical Backup vs. Logical Backup (pp. 502–503)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Physical Backup (p. 502)<\/strong>:<\/li>\n<li>Backs up data files of each DN across the <strong>entire cluster in parallel to OBS (Object Storage Service)<\/strong> in internal database format and restores to <strong>homogeneous databases<\/strong> (supports compression, flow control, and resumable backup).<\/li>\n<li><strong>Full Backup vs. Incremental Backup<\/strong>:<\/li>\n<li><strong>Full backup<\/strong>: Backs up all data at a time point (duration proportional to total DB size).<\/li>\n<li><strong>Incremental backup<\/strong>: Backs up only data modified since the last backup (duration proportional to changed data size). <strong>Restoring a complete database requires BOTH the full backup and subsequent incremental backups<\/strong> (e.g., Monday Full + Tue–Sun Incrementals).<\/li>\n<li><strong>Logical Backup (p. 503)<\/strong>:<\/li>\n<li>Extracts user table records from each DN in parallel streaming mode to <strong>local disk files or OBS in <code class=\"inline-code\">TEXT<\/code> or <code class=\"inline-code\">CSV<\/code> format<\/strong>, and can restore data into <strong>homogeneous OR heterogeneous databases<\/strong>.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Designing Hash vs. Replication Distributed Tables in GaussDB","duration_mins":8,"exercise_type":"sql","prompt_label":"GaussDB=#","scenario":"In a GaussDB distributed cluster, create a large fact table `orders_fact` distributed across shards by `HASH(order_id)` and a small lookup table `currency_dim` replicated on every shard using `DISTRIBUTE BY REPLICATION` so joins do not require network redistribution.","instructions":["Step 1: Create `orders_fact(order_id INT, cust_id INT, amount NUMERIC(10,2))` distributed by hash on `order_id` (`DISTRIBUTE BY HASH(order_id)`).","Step 2: Create `currency_dim(curr_code CHAR(3), curr_name VARCHAR(20))` replicated across all shards (`DISTRIBUTE BY REPLICATION`)."],"starter_code":"-- Step 1: Create large table orders_fact distributed by HASH on order_id\nCREATE TABLE orders_fact (\n    order_id INT,\n    cust_id INT,\n    amount NUMERIC(10,2)\n) DISTRIBUTE BY ____(order_id);\n\n-- Step 2: Create small lookup table currency_dim using REPLICATION distribution\nCREATE TABLE currency_dim (\n    curr_code CHAR(3),\n    curr_name VARCHAR(20)\n) DISTRIBUTE BY ____;\n","solution_code":"CREATE TABLE orders_fact (\n    order_id INT,\n    cust_id INT,\n    amount NUMERIC(10,2)\n) DISTRIBUTE BY HASH(order_id);\n\nCREATE TABLE currency_dim (\n    curr_code CHAR(3),\n    curr_name VARCHAR(20)\n) DISTRIBUTE BY REPLICATION;","hints":["Large tables use `DISTRIBUTE BY HASH(order_id)`.","Small tables frequently joined with large tables use `DISTRIBUTE BY REPLICATION`."],"validation_checks":[{"step":1,"description":"Use `DISTRIBUTE BY HASH(order_id)`","required_any":["distribute by hash(order_id)"],"feedback_fail":"Specify `DISTRIBUTE BY HASH(order_id)` for the large fact table."},{"step":2,"description":"Use `DISTRIBUTE BY REPLICATION`","required_any":["distribute by replication"],"feedback_fail":"Specify `DISTRIBUTE BY REPLICATION` for the small lookup table."}],"simulated_output":"CREATE TABLE\nCREATE TABLE","quiz_questions":[{"id":"h8_s3_q1","type":"single","question":"In GaussDB distributed storage between shards, which distribution mode stores a complete copy of a small table on every shard to improve distributed multi-table join performance?","options":["A. Hash distribution","B. Range partitioning","C. Replication distribution","D. List partitioning"],"answer":"C","explanation":"Per Chapter 06 (p. 497), Replication distribution is used for user tables with a small amount of data and stores all of the table's data in each shard, improving distributed multi-table join performance."},{"id":"h8_s3_q2","type":"multiple","question":"Which of the following statements about GaussDB `GTM-Lite` and `GTM-Free` transaction modes are TRUE?","options":["A. `GTM-Lite` uses Commit Sequence Numbers (CSNs) instead of traversing a global transaction list to quickly determine transaction visibility","B. `GTM-Lite` uses lock-free atomic operations to assign CSNs and provides strong global consistency","C. `GTM-Free` mode does not connect to the GTM and provides eventual consistency for perfectly sharded OLTP workloads","D. `GTM-Free` mode requires every read query to lock all DNs in the cluster via the GTM"],"answer":"ABC","explanation":"Per Chapter 06 (p. 500), A, B, and C are true. Option D is false: `GTM-Free` does not connect to the GTM at all."},{"id":"h8_s3_q3","type":"tf","question":"In GaussDB physical backup, an incremental backup takes a shorter time than a full backup, and a complete database can be restored using only the incremental backup without a full backup.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.06 p. 502). Although an incremental backup takes a shorter timeframe, a complete database can be restored ONLY after both the full backup and incremental backup are performed."}],"reference_figures":[{"slug":"p3_h8s3_gtm_lite","title":"GTM-Lite Lockless Transaction Timestamp Coordination","pdf_page":500}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-GaussDB-Ecosystem-Tools-UGO-DRS-DAS-and-Security","exercise_slug":"08-Exercise-UGO-DRS-DAS-Cloud-Migration-Pipeline-Lab","lecture":{"title":"GaussDB Ecosystem Tools — UGO, DRS, DAS, CTS, CES, DBSS & Industry Cases","duration_mins":7,"pdf_ref":"Ch.06, pp. 504–531","objectives":["Memorize all 6 core functions of UGO (Database and Application Migration UGO — exact Ch.06 Quiz Q2!)","Contrast DAS (Standard, Cloud DBA, Enterprise DevOps), DRS (Real-time migration, Backup migration, Real-time synchronization, Data subscription, Real-time DR), and UGO (heterogeneous schema/SQL migration)","Identify Huawei Cloud security/monitoring services: CTS (7-day console trace query + OBS/KMS dump), CES (resource/log monitoring), and DBSS (bypass security audit + DB firewall)"],"content_markdown":"### 1. Database Management, Replication & Migration Suite: `DAS`, `DRS`, `UGO` (pp. 505–512)\n\n#### A. `DAS` (Data Admin Service, p. 505)\nOne-stop web-based cloud database management console with **3 editions**:\n1. **Standard Edition (for Developers)**: Web client, online SQL editing, intelligent SQL prompts without local client installation.\n2. **Cloud DBA (for DBAs & O&M)**: Instance performance metrics, slow SQL analysis, SQL explorer, real-time and historical diagnosis.\n3. **Enterprise Edition (for Enterprise DevOps)**: Automatic identification of modification risks + permission approval workflows to ensure secure data changes.\n\n#### B. `DRS` (Data Replication Service, pp. 506–509)\nCloud service for **real-time database data migration and synchronization** offering **5 functions**: *Real-time migration*, *Backup migration*, *Real-time synchronization*, *Data subscription*, and *Real-time DR*:\n- **Real-Time Migration**: Online incremental data migration across public networks, VPCs, VPNs, or Direct Connect with minimal downtime.\n- **Backup Migration**: Exports source DB backup files -> uploads to **OBS** -> DRS downloads and restores to destination DB **without exposing the source DB's IP address or connecting directly** (currently supports migrating **SQL Server** to the cloud, p. 508).\n- **Real-Time Synchronization**: Continuous real-time data flow (many-to-one, one-to-many, different table names) for real-time analytics, reporting, and data warehouses.\n\n#### C. `UGO` (Database and Application Migration UGO, pp. 510–512, Ch.06 Quiz Q2!)\nProfessional tool focused on **heterogeneous database object/schema migration and application SQL migration** (e.g., from Oracle 10g/11g/12c, DB2, Teradata, SQL Server to GaussDB / RDS).\n- **The 6 Official Core Functions of UGO (Slide 37, p. 512 & Ch.06 Quiz Q2 Answer!)**:\n  1. **Source database profiling**\n  2. **Destination database selection and specification recommendation**\n  3. **Destination database compatibility analysis**\n  4. **Migration workload evaluation**\n  5. **Database structure migration**\n  6. **Application SQL migration**\n<!-- PDF_FIGS_START -->\n![DRS Service Module: Backup Migration Workflow via OBS (Official Reference: p. 508)](./assets/images/p3_h8s4_drs_backup_migration.png)\n*Figure: DRS Service Module: Backup Migration Workflow via OBS (Official Reference: p. 508)*\n\n![UGO Heterogeneous Database Schema and Application Migration Workflow (Official Reference: p. 510)](./assets/images/p3_h8s4_ugo_migration.png)\n*Figure: UGO Heterogeneous Database Schema and Application Migration Workflow (Official Reference: p. 510)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Cloud Security & Monitoring Services: `CTS`, `CES`, `DBSS` (pp. 513–520)\n\n| Service | Full Name | Core Capabilities & Exam Specifications |\n| :--- | :--- | :--- |\n| **`CTS`** | **Cloud Trace Service** | Log audit service recording console/API operations on cloud resources. **Console queries cover the last 7 days**; dumps compressed trace files to **OBS** for long-term storage encrypted via **KMS**. |\n| **`CES`** | **Cloud Eye Service** | Resource & database monitoring platform (automatic/server monitoring, real-time alarm notifications, OBS dumping, resource grouping, error/slow log & trace monitoring). |\n| **`DBSS`** | **Database Security Service** | Includes **Database Protection (DB firewall, data breach prevention)** and **Database Security Audit**. Deployed in **bypass mode**; provides user behavior detection (associating app & DB layers), multi-dimensional lead analysis (Risk, Session, Statement leads), real-time SQL injection/blacklist/whitelist alarms, and **Sarbanes-Oxley (SOX)** compliance reports. |\n<!-- PDF_FIGS_START -->\n![CTS (Cloud Trace Service) Audit Log Flow (Official Reference: p. 513)](./assets/images/p3_h8s4_cts_flow.png)\n*Figure: CTS (Cloud Trace Service) Audit Log Flow (Official Reference: p. 513)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["The 6 core functions of UGO (Ch.06 Quiz Q2) are: (1) Source database profiling, (2) Destination database selection and specification recommendation, (3) Destination database compatibility analysis, (4) Migration workload evaluation, (5) Database structure migration, and (6) Application SQL migration.","UGO migrates heterogeneous database structures (schemas/objects) and application SQL, whereas DRS migrates and synchronizes the actual data (via Real-Time Migration, Backup Migration via OBS, or Real-Time Synchronization).","DAS provides web-based database management; CTS audits cloud resource operations (7-day console query + KMS-encrypted OBS dump); CES monitors system metrics/alarms; DBSS provides bypass-mode database security auditing and firewall protection."],"exam_traps":["EXAM TRAP (Ch.06 Quiz Q2): Memorize all 6 core functions of UGO verbatim: Source database profiling, Destination database selection and specification recommendation, Destination database compatibility analysis, Migration workload evaluation, Database structure migration, and Application SQL migration!","EXAM TRAP: Which DRS module migrates data without connecting directly to the source database (hiding the source IP by staging backup files in OBS, commonly for SQL Server)? **Backup Migration** (Ch.06 p. 508)!"],"content_html":"<h3>1. Database Management, Replication &amp; Migration Suite: <code class=\"inline-code\">DAS<\/code>, <code class=\"inline-code\">DRS<\/code>, <code class=\"inline-code\">UGO<\/code> (pp. 505–512)<\/h3>\n<h4>A. <code class=\"inline-code\">DAS<\/code> (Data Admin Service, p. 505)<\/h4>\n<p>One-stop web-based cloud database management console with <strong>3 editions<\/strong>:<\/p>\n<ol class=\"md-list\">\n<li><strong>Standard Edition (for Developers)<\/strong>: Web client, online SQL editing, intelligent SQL prompts without local client installation.<\/li>\n<li><strong>Cloud DBA (for DBAs &amp; O&amp;M)<\/strong>: Instance performance metrics, slow SQL analysis, SQL explorer, real-time and historical diagnosis.<\/li>\n<li><strong>Enterprise Edition (for Enterprise DevOps)<\/strong>: Automatic identification of modification risks + permission approval workflows to ensure secure data changes.<\/li>\n<\/ol>\n<h4>B. <code class=\"inline-code\">DRS<\/code> (Data Replication Service, pp. 506–509)<\/h4>\n<p>Cloud service for <strong>real-time database data migration and synchronization<\/strong> offering <strong>5 functions<\/strong>: <em>Real-time migration<\/em>, <em>Backup migration<\/em>, <em>Real-time synchronization<\/em>, <em>Data subscription<\/em>, and <em>Real-time DR<\/em>:<\/p>\n<ul class=\"md-list\">\n<li><strong>Real-Time Migration<\/strong>: Online incremental data migration across public networks, VPCs, VPNs, or Direct Connect with minimal downtime.<\/li>\n<li><strong>Backup Migration<\/strong>: Exports source DB backup files -&gt; uploads to <strong>OBS<\/strong> -&gt; DRS downloads and restores to destination DB <strong>without exposing the source DB's IP address or connecting directly<\/strong> (currently supports migrating <strong>SQL Server<\/strong> to the cloud, p. 508).<\/li>\n<li><strong>Real-Time Synchronization<\/strong>: Continuous real-time data flow (many-to-one, one-to-many, different table names) for real-time analytics, reporting, and data warehouses.<\/li>\n<\/ul>\n<h4>C. <code class=\"inline-code\">UGO<\/code> (Database and Application Migration UGO, pp. 510–512, Ch.06 Quiz Q2!)<\/h4>\n<p>Professional tool focused on <strong>heterogeneous database object/schema migration and application SQL migration<\/strong> (e.g., from Oracle 10g/11g/12c, DB2, Teradata, SQL Server to GaussDB / RDS).<\/p>\n<ul class=\"md-list\">\n<li><strong>The 6 Official Core Functions of UGO (Slide 37, p. 512 &amp; Ch.06 Quiz Q2 Answer!)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Source database profiling<\/strong><\/li>\n<li><strong>Destination database selection and specification recommendation<\/strong><\/li>\n<li><strong>Destination database compatibility analysis<\/strong><\/li>\n<li><strong>Migration workload evaluation<\/strong><\/li>\n<li><strong>Database structure migration<\/strong><\/li>\n<li><strong>Application SQL migration<\/strong><\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s4_drs_backup_migration.png\" alt=\"DRS Service Module: Backup Migration Workflow via OBS\" data-caption=\"DRS Service Module: Backup Migration Workflow via OBS (Official Reference: p. 508)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>DRS Service Module: Backup Migration Workflow via OBS<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 508 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s4_ugo_migration.png\" alt=\"UGO Heterogeneous Database Schema and Application Migration Workflow\" data-caption=\"UGO Heterogeneous Database Schema and Application Migration Workflow (Official Reference: p. 510)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>UGO Heterogeneous Database Schema and Application Migration Workflow<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 510 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Cloud Security &amp; Monitoring Services: <code class=\"inline-code\">CTS<\/code>, <code class=\"inline-code\">CES<\/code>, <code class=\"inline-code\">DBSS<\/code> (pp. 513–520)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Service<\/th><th>Full Name<\/th><th>Core Capabilities &amp; Exam Specifications<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">CTS<\/code><\/strong><\/td><td><strong>Cloud Trace Service<\/strong><\/td><td>Log audit service recording console/API operations on cloud resources. <strong>Console queries cover the last 7 days<\/strong>; dumps compressed trace files to <strong>OBS<\/strong> for long-term storage encrypted via <strong>KMS<\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">CES<\/code><\/strong><\/td><td><strong>Cloud Eye Service<\/strong><\/td><td>Resource &amp; database monitoring platform (automatic/server monitoring, real-time alarm notifications, OBS dumping, resource grouping, error/slow log &amp; trace monitoring).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">DBSS<\/code><\/strong><\/td><td><strong>Database Security Service<\/strong><\/td><td>Includes <strong>Database Protection (DB firewall, data breach prevention)<\/strong> and <strong>Database Security Audit<\/strong>. Deployed in <strong>bypass mode<\/strong>; provides user behavior detection (associating app &amp; DB layers), multi-dimensional lead analysis (Risk, Session, Statement leads), real-time SQL injection/blacklist/whitelist alarms, and <strong>Sarbanes-Oxley (SOX)<\/strong> compliance reports.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h8s4_cts_flow.png\" alt=\"CTS (Cloud Trace Service) Audit Log Flow\" data-caption=\"CTS (Cloud Trace Service) Audit Log Flow (Official Reference: p. 513)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>CTS (Cloud Trace Service) Audit Log Flow<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 513 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Auditing the 6 Core Functions of UGO & Huawei Cloud Ecosystem Tools","duration_mins":8,"exercise_type":"sql","prompt_label":"GaussDB=#","scenario":"You are planning an Oracle-to-GaussDB migration on Huawei Cloud. Complete the SQL verification query listing the 6 official core functions of UGO (Ch.06 Quiz Q2) and matching `DAS`, `DRS`, `CTS`, `CES`, and `DBSS` to their roles.","instructions":["Step 1: Fill in the missing keywords in the 6 official UGO core functions (`profiling`, `recommendation`, `compatibility`, `workload`, `structure`, `Application SQL`).","Step 2: Match `'DRS'` (real-time data migration/sync), `'DAS'` (web console management), and `'DBSS'` (bypass-mode database security audit)."],"starter_code":"-- Step 1 (Ch.06 Quiz Q2): Verify the 6 core functions of UGO\nSELECT\n    'Source database ____'                                      AS ugo_fn_1,\n    'Destination database selection and specification ____'     AS ugo_fn_2,\n    'Destination database ____ analysis'                        AS ugo_fn_3,\n    'Migration ____ evaluation'                                 AS ugo_fn_4,\n    'Database ____ migration'                                   AS ugo_fn_5,\n    '____ migration'                                            AS ugo_fn_6;\n\n-- Step 2: Match Huawei Cloud ecosystem services\nSELECT '____' AS data_replication_service,\n       '____' AS web_admin_console,\n       '____' AS db_security_service;\n","solution_code":"SELECT\n    'Source database profiling'                                          AS ugo_fn_1,\n    'Destination database selection and specification recommendation'    AS ugo_fn_2,\n    'Destination database compatibility analysis'                        AS ugo_fn_3,\n    'Migration workload evaluation'                                      AS ugo_fn_4,\n    'Database structure migration'                                       AS ugo_fn_5,\n    'Application SQL migration'                                          AS ugo_fn_6;\n\nSELECT 'DRS' AS data_replication_service,\n       'DAS' AS web_admin_console,\n       'DBSS' AS db_security_service;","hints":["The 6 UGO functions are: Source database `profiling`, Destination DB selection and specification `recommendation`, Destination DB `compatibility` analysis, Migration `workload` evaluation, Database `structure` migration, and `Application SQL` migration.","Data Replication Service = `DRS`, Data Admin Service = `DAS`, Database Security Service = `DBSS`."],"validation_checks":[{"step":1,"description":"Include `Source database profiling` and `compatibility analysis`","required_any":["source database profiling"],"feedback_fail":"Include `'Source database profiling'` and `'Destination database compatibility analysis'`."},{"step":2,"description":"Include `Database structure migration` and `Application SQL migration`","required_any":["database structure migration"],"feedback_fail":"Include `'Database structure migration'` and `'Application SQL migration'`."},{"step":3,"description":"Identify `DRS`, `DAS`, and `DBSS`","required_any":["'dbss'"],"feedback_fail":"Specify `'DRS'`, `'DAS'`, and `'DBSS'`."}],"simulated_output":"         ugo_fn_1          |                            ugo_fn_2                             |                  ugo_fn_3                   |           ugo_fn_4            |           ugo_fn_5           |         ugo_fn_6          \n---------------------------+-----------------------------------------------------------------+---------------------------------------------+-------------------------------+------------------------------+---------------------------\n Source database profiling | Destination database selection and specification recommendation | Destination database compatibility analysis | Migration workload evaluation | Database structure migration | Application SQL migration\n(1 row)\n\n data_replication_service | web_admin_console | db_security_service \n--------------------------+-------------------+---------------------\n DRS                      | DAS               | DBSS\n(1 row)","quiz_questions":[{"id":"h8_s4_q1","type":"multiple","question":"(Official Ch.06 Quiz Q2) Which of the following belong to the 6 core functions of UGO (Database and Application Migration UGO)?","options":["A. Source database profiling & Destination database selection and specification recommendation","B. Destination database compatibility analysis & Migration workload evaluation","C. Database structure migration & Application SQL migration","D. Bypass-mode SQL injection firewall & 7-day ECS trace recording"],"answer":"ABC","explanation":"Per Chapter 06 (p. 512 & p. 527), the 6 core functions of UGO are: Source database profiling, Destination database selection and specification recommendation, Destination database compatibility analysis, Migration workload evaluation, Database structure migration, and Application SQL migration. Option D describes DBSS and CTS."},{"id":"h8_s4_q2","type":"single","question":"Which Huawei Cloud service provides a database security audit function deployed in bypass mode to generate real-time alarms for SQL injection, risky operations, and Sarbanes-Oxley compliance reports?","options":["A. DAS (Data Admin Service)","B. DRS (Data Replication Service)","C. CES (Cloud Eye Service)","D. DBSS (Database Security Service)"],"answer":"D","explanation":"Per Chapter 06 (pp. 517–520), Database Security Service (DBSS) provides database security audit in bypass mode, detecting SQL injection, blacklist/whitelist hits, and generating compliance reports."},{"id":"h8_s4_q3","type":"tf","question":"In DRS (Data Replication Service), Backup Migration allows you to migrate data by uploading source database backup files to OBS and restoring them to the destination database without exposing the source database's IP address or connecting to it directly.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.06 p. 508). DRS Backup Migration stages backup files via OBS so data migration is completed without exposing or directly connecting to the source database."}],"reference_figures":[{"slug":"p3_h8s4_ugo_migration","title":"UGO Heterogeneous Database Schema and Application Migration Workflow","pdf_page":510}]}}]}],"mock_exam":{"folder_name":"Hour-09-Final-Mock-Exam","title":"HCIA-openGauss V2.0 — National Stage Final Mock Exam","duration_mins":60,"total_points":1000,"passing_points":800,"instructions":"60 Questions in 60 Minutes: 20 Single-Choice (15 pts each), 20 Multiple-Choice (20 pts each, strict all-or-nothing grading), 10 True/False (10 pts each), and 10 Hands-On Command/SQL/Scenario Fill-in Labs (20 pts each).","questions":[{"id":1,"type":"single","points":15,"chapter":"Ch.01 openGauss Overview","question":"(Official Ch.01 Quiz Q1) Which of the following is NOT a component of a database system (DBS)?","options":["A. Database","B. DBMS","C. Database application","D. Database storage medium"],"answer":"D","explanation":"Per Chapter 01 (p. 9 & p. 67), a DBS consists of three logical parts: Database, DBMS, and Database application. Database storage medium is hardware, not one of the three DBS components."},{"id":2,"type":"single","points":15,"chapter":"Ch.01 openGauss Overview","question":"(Official Ch.01 Quiz Q2) Which of the following statements about the ACID feature of database transactions is INCORRECT?","options":["A. A indicates atomicity, whereby operations in a transaction are either all successful or all failed.","B. C refers to consistency, whereby the system status can only be the status before the transaction or after the transaction is successful. No inconsistent intermediate status can occur.","C. I refers to availability, whereby the database system must provide the highest availability possible for transaction execution in order to ensure as many successfully executed transactions as possible.","D. D refers to durability, whereby the status of a successful transaction can be maintained, even if the machine is powered off."],"answer":"C","explanation":"Per Chapter 01 (p. 22 & p. 67), 'I' in ACID stands for Isolation (concurrent transactions do not interfere with one another), NOT Availability."},{"id":3,"type":"single","points":15,"chapter":"Ch.01 openGauss Overview","question":"According to the openGauss technical specifications (Ch.01 p. 57), what is the maximum number of partitions supported in a single partitioned table for Range partitioning versus Hash/List partitioning?","options":["A. 1,024 (Range) / 32 (Hash or List)","B. 32,768 (Range) / 64 (Hash or List)","C. 65,536 (Range) / 256 (Hash or List)","D. Unlimited (Range) / 1,024 (Hash or List)"],"answer":"B","explanation":"Per Chapter 01 (p. 57), a partitioned table in openGauss supports up to 32,768 partitions for range partitioning and 64 partitions for hash or list partitioning."},{"id":4,"type":"single","points":15,"chapter":"Ch.02 Database Installation and Deployment","question":"(Official Ch.02 Quiz Q1) Which of the following is NOT an openGauss server tool?","options":["A. gs_check","B. gs_guc","C. gsql","D. gs_collector"],"answer":"C","explanation":"Per Chapter 02 (p. 102 & p. 126), `gsql` is a Client tool used to connect to the database, whereas `gs_check`, `gs_guc`, and `gs_collector` are Server tools."},{"id":5,"type":"single","points":15,"chapter":"Ch.02 Database Installation and Deployment","question":"(Official Ch.02 Quiz Q2) When the `gs_checkperf` tool is used to check system performance, which of the following can be viewed ONLY by user `root`?","options":["A. openGauss level","B. Host level","C. Session/Process level","D. SSD performance"],"answer":"D","explanation":"Per Chapter 02 (p. 109, p. 110 & p. 126), SSD read/write performance (`gs_checkperf -U USER -i SSD`) can be viewed ONLY by user `root`."},{"id":6,"type":"single","points":15,"chapter":"Ch.02 Database Installation and Deployment","question":"When using `gs_dump` to export a database, which `-F` (`--format`) option generates a binary archive with medium compression by default that is recommended for medium or large databases and restored using `gs_restore`?","options":["A. p (Plain-text)","B. c (Custom)","C. d (Directory)","D. t (.tar)"],"answer":"B","explanation":"Per Chapter 02 (p. 114), `-F c` (Custom) generates a binary archive with medium compression by default, is recommended for medium or large databases, and allows selective object restoration using `gs_restore`."},{"id":7,"type":"single","points":15,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"In the openGauss instance architecture, which background thread copies dirty pages to the double-writer space and flushes them to disk to prevent torn-page corruption before forwarding them to `bgwriter` subthreads?","options":["A. walwriter","B. pagewriter","C. GaussMaster","D. Stat_collector"],"answer":"B","explanation":"Per Chapter 03 (p. 138), `pagewriter` copies dirty page data to the double-writer space and flushes it to disk to prevent data page corruption, then forwards dirty pages to `bgwriter` subthreads."},{"id":8,"type":"single","points":15,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"In the openGauss Resource Pooling architecture, which component includes an independent server process (`DSS Server`) that directly manages raw devices of disk arrays and provides capabilities similar to distributed file systems?","options":["A. DMS (Distributed Memory Service)","B. DSS (Distributed Storage Service)","C. SPQ (Shared-Everything Parallel Query)","D. OCK RDMA"],"answer":"B","explanation":"Per Chapter 03 (p. 147), DSS (Distributed Storage Service) includes DSS API and DSS Server (an independent process that directly manages raw devices of disk arrays)."},{"id":9,"type":"single","points":15,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"In openGauss Dynamic Data Masking, which preset masking function displays `'4880-9898-4545-2525'` as `'xxxx-xxxx-xxxx-2525'` (masking all digits except the last four)?","options":["A. maskall","B. alldigitsmasking","C. creditcardmasking","D. randommasking"],"answer":"C","explanation":"Per Chapter 03 (p. 207), `creditcardmasking` masks all digits with `'x'` except the last four digits (`'xxxx-xxxx-xxxx-2525'`)."},{"id":10,"type":"single","points":15,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"In openGauss Workload Diagnosis Report (WDR), what are the default values of `enable_wdr_snapshot`, `wdr_snapshot_interval`, and `wdr_snapshot_retention_days`?","options":["A. `on`, 30 minutes, 7 days","B. `off`, 1 hour, 8 days","C. `on`, 1 hour, 30 days","D. `off`, 10 minutes, 14 days"],"answer":"B","explanation":"Per Chapter 03 (p. 230), `enable_wdr_snapshot` is `off` by default, `wdr_snapshot_interval` is 1 hour by default, and `wdr_snapshot_retention_days` is 8 days by default."},{"id":11,"type":"single","points":15,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"Which built-in openGauss function generates a single-query index recommendation (returning `table` and `column`) when passed a single `SELECT` statement string?","options":["A. hypopg_create_index","B. gs_index_advise","C. create_wdr_snapshot","D. hypopg_estimate_size"],"answer":"B","explanation":"Per Chapter 03 (pp. 255–257), `gs_index_advise('SELECT ...')` generates a recommended index (table name and column names) for a single `SELECT` query."},{"id":12,"type":"single","points":15,"chapter":"Ch.04 Database and Object Management","question":"(Official Ch.04 Quiz Q2) Which of the following commands can be used to export partial data from the `student` table?","options":["A. gs_dump","B. gs_dumpall","C. copy Conditional statement","D. gs_backup"],"answer":"C","explanation":"Per Chapter 04 (p. 332 & p. 346), `COPY (SELECT * FROM student WHERE ...) TO '...'` (a `copy` conditional statement) exports a query result set (partial table data)."},{"id":13,"type":"single","points":15,"chapter":"Ch.04 Database and Object Management","question":"Which system catalog in openGauss stores information about database authorization identifiers (roles and users, including `rolcanlogin`) across the entire cluster and is accessible only to system administrators?","options":["A. PG_CLASS","B. PG_AUTHID","C. PG_DEPEND","D. PG_NAMESPACE"],"answer":"B","explanation":"Per Chapter 04 (p. 317 & p. 324), `PG_AUTHID` stores information about database authorization identifiers (roles/users, where a user is a role with `rolcanlogin` set) and is accessible only to system administrators."},{"id":14,"type":"single","points":15,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 394 Q1) Which of the following logical expressions is used to search for records whose position is an engineer and salary is greater than 6000?","options":["A. Position = 'Engineer' OR Salary > 6000","B. Position = Engineer AND Salary > 6000","C. Position = Engineer OR Salary > 6000","D. Position = 'Engineer' AND Salary > 6000"],"answer":"D","explanation":"Per Chapter 05 (p. 381 & p. 394), character literals must be enclosed in single quotes (`'Engineer'`) and combined with `AND`."},{"id":15,"type":"single","points":15,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 394 Q2) In a `WHERE` clause, the expression `age between 20 and 30` is equivalent to:","options":["A. age >= 20 and age <= 30","B. age >= 20 or age <= 30","C. age > 20 and age < 30","D. age > 20 or age < 30"],"answer":"A","explanation":"Per Chapter 05 (p. 394), `BETWEEN 20 AND 30` is inclusive of both 20 and 30 (`age >= 20 and age <= 30`)."},{"id":16,"type":"single","points":15,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 405 Q1) Which of the following SQL commands can be used to increase the value of the `AGE` column in the `STAFFS` table by five years?","options":["A. UPDATE SET AGE WITH AGE+5","B. UPDATE AGE WITH AGE+5","C. UPDATE STAFFS SET AGE = AGE+5","D. UPDATE STAFFS AGE WITH AGE+5"],"answer":"C","explanation":"Per Chapter 05 (p. 401 & p. 405), the standard `UPDATE` syntax is `UPDATE STAFFS SET AGE = AGE+5`."},{"id":17,"type":"single","points":15,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 405 Q2) Which of the following four groups of SQL commands belong to the DML commands?","options":["A. CREATE, DROP, UPDATE","B. INSERT, UPDATE, DELETE","C. INSERT, DROP, ALTER","D. UPDATE, DELETE, ALTER"],"answer":"B","explanation":"Per Chapter 05 (p. 359 & p. 405), `INSERT`, `UPDATE`, and `DELETE` are Data Manipulation Language (DML) commands."},{"id":18,"type":"single","points":15,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 406 Q3) Which of the following SQL statements will delete records for all students whose class ID (specified by `cid`) is 6 from the `student` table?","options":["A. delete FROM student where cid = 6;","B. delete * FROM student where cid = 6;","C. delete FROM student on cid = 6;","D. delete * FROM student on cid = 6;"],"answer":"A","explanation":"Per Chapter 05 (p. 403 & p. 406), `delete FROM student where cid = 6;` is the valid SQL `DELETE` statement (never put `*` after `DELETE`, and use `WHERE` rather than `ON`)."},{"id":19,"type":"single","points":15,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 446 Q2) SQL integrates data query, data manipulation, data definition, and data control. Which of the following functions is implemented by the `CREATE`, `DROP`, and `ALTER` statements?","options":["A. Data query","B. Data manipulation","C. Data definition","D. Data control"],"answer":"C","explanation":"Per Chapter 05 (p. 408 & p. 446), `CREATE`, `DROP`, and `ALTER` implement Data Definition (DDL)."},{"id":20,"type":"single","points":15,"chapter":"Ch.06 GaussDB","question":"(Official Ch.06 Quiz Q1) In the GaussDB distributed architecture, which of the following components is used for sharing configuration and service discovery (service registration and search)?","options":["A. CN","B. DN","C. GTM","D. ETCD"],"answer":"D","explanation":"Per Chapter 06 (p. 495 & p. 527), `ETCD` is used for sharing configurations and discovering services (service registration and search)."},{"id":21,"type":"multiple","points":20,"chapter":"Ch.01 openGauss Overview","question":"(Official Ch.01 Quiz Q3) Which of the following phases are involved in the development of data management technologies?","options":["A. Manual management","B. File system","C. DBS","D. AI management"],"answer":"ABC","explanation":"Per Chapter 01 (p. 10 & p. 68), data management technologies went through three stages: Manual management, File system, and DBS."},{"id":22,"type":"multiple","points":20,"chapter":"Ch.01 openGauss Overview","question":"Which three significant common features are shared by all NewSQL database systems (`SQL + NoSQL = NewSQL`)?","options":["A. They support the relational data model","B. They use SQL as the main interface","C. They meet the features of a distributed database (scalable across nodes)","D. They completely abandon ACID transactions in favor of eventual consistency only"],"answer":"ABC","explanation":"Per Chapter 01 (p. 30), all NewSQL systems share three significant common features: they support the relational data model, use SQL as the main interface, and meet the features of a distributed database while preserving ACID transactions."},{"id":23,"type":"multiple","points":20,"chapter":"Ch.01 openGauss Overview","question":"Which of
