 FILTER ON ROLES(dev_audit, bob_audit);\n    -- DML audit policy (ACCESS)\n    CREATE AUDIT POLICY adt4 ACCESS SELECT ON LABEL(adt_lb0), INSERT ON LABEL(adt_lb0), DELETE\n        FILTER ON ROLES(dev_audit, bob_audit), APP(psql, gsql), IP('10.20.30.40', '127.0.0.0/24');<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>4 System Catalogs (p. 223)<\/strong>: <code class=\"inline-code\">GS_AUDITING_POLICY<\/code> (main info), <code class=\"inline-code\">GS_AUDITING_POLICY_ACCESS<\/code> (DML), <code class=\"inline-code\">GS_AUDITING_POLICY_PRIVILEGES<\/code> (DDL), <code class=\"inline-code\">GS_AUDITING_POLICY_FILTERS<\/code> (filters).<\/li>\n<li><strong>Constraint (p. 224)<\/strong>: A single unified audit policy <strong>cannot contain both DDL (<code class=\"inline-code\">PRIVILEGES<\/code>) and DML (<code class=\"inline-code\">ACCESS<\/code>) operations<\/strong>! Max <strong>98<\/strong> unified audit policies.<\/li>\n<li><strong>Transparent Data Encryption (TDE, pp. 225–226)<\/strong>:<\/li>\n<li>Encrypts data automatically when writing to storage media and decrypts when reading, preventing static data file leakage.<\/li>\n<li><strong>3-Layer Key Hierarchy (interconnected with Huawei Cloud KMS)<\/strong>: <strong>Root Key (<code class=\"inline-code\">RK<\/code>)<\/strong> -&gt; <strong>Cluster Master Key (<code class=\"inline-code\">CMK<\/code>)<\/strong> -&gt; <strong>Data Encryption Key (<code class=\"inline-code\">DEK<\/code>, one per table, stored in <code class=\"inline-code\">pg_class.reloptions<\/code>)<\/strong>.<\/li>\n<li>Supports <strong>Heap Row-Store tables only<\/strong> (does <strong>not<\/strong> support column-store, Ustore, materialized views, indexes, sequences, Xlogs, or MOTs).<\/li>\n<li>Algorithms: <strong><code class=\"inline-code\">AES_128_CTR<\/code> (default)<\/strong> or <strong><code class=\"inline-code\">SM4_CTR<\/code><\/strong>. Once specified at <code class=\"inline-code\">CREATE TABLE<\/code>, the algorithm <strong>cannot<\/strong> be changed (and an unencrypted table created without TDE cannot later be converted to an encrypted table), though <strong>DEK key rotation<\/strong> is supported.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Configuring Row-Level Security (RLS) & Unified Audit Policies","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Enable Row-Level Security on `tb_for_audit` so each user can only query rows where `role = CURRENT_USER`, and create a Unified Audit Policy `adt3` that audits `CREATE` operations on resource label `adt_lb0` for role `dev_audit`.","instructions":["Step 1: Enable RLS on `tb_for_audit` using `ALTER TABLE tb_for_audit ENABLE ROW LEVEL SECURITY;`.","Step 2: Create RLS policy `tb_rls` on `tb_for_audit` with `CREATE ROW LEVEL SECURITY POLICY tb_rls ON tb_for_audit USING(role = CURRENT_USER);`.","Step 3: Create unified audit policy `adt3` with `CREATE AUDIT POLICY adt3 PRIVILEGES CREATE ON LABEL(adt_lb0) FILTER ON ROLES(dev_audit);`."],"starter_code":"-- Step 1: Enable Row-Level Security on tb_for_audit\nALTER TABLE tb_for_audit ENABLE ____;\n\n-- Step 2: Create RLS policy so users only see rows where role = CURRENT_USER\nCREATE ROW LEVEL SECURITY POLICY tb_rls ON tb_for_audit ____(role = CURRENT_USER);\n\n-- Step 3: Create Unified Audit Policy adt3 auditing CREATE on adt_lb0 for dev_audit\nCREATE ____ POLICY adt3 PRIVILEGES CREATE ON LABEL(adt_lb0) FILTER ON ROLES(dev_audit);\n","solution_code":"ALTER TABLE tb_for_audit ENABLE ROW LEVEL SECURITY;\n\nCREATE ROW LEVEL SECURITY POLICY tb_rls ON tb_for_audit USING(role = CURRENT_USER);\n\nCREATE AUDIT POLICY adt3 PRIVILEGES CREATE ON LABEL(adt_lb0) FILTER ON ROLES(dev_audit);","hints":["Use `ALTER TABLE <table_name> ENABLE ROW LEVEL SECURITY;`.","In `CREATE ROW LEVEL SECURITY POLICY`, use the `USING(role = CURRENT_USER)` clause.","Use `CREATE AUDIT POLICY adt3 PRIVILEGES CREATE ON LABEL(adt_lb0) FILTER ON ROLES(dev_audit);`."],"validation_checks":[{"step":1,"description":"Enable RLS on `tb_for_audit`","required_any":["enable row level security"],"feedback_fail":"Use `ALTER TABLE tb_for_audit ENABLE ROW LEVEL SECURITY;`."},{"step":2,"description":"Define RLS policy expression with `USING(role = CURRENT_USER)`","required_any":["using(role = current_user)","using (role = current_user)"],"feedback_fail":"Include `USING(role = CURRENT_USER)` in your RLS policy."},{"step":3,"description":"Create unified audit policy with `CREATE AUDIT POLICY adt3`","required_any":["create audit policy adt3"],"feedback_fail":"Use `CREATE AUDIT POLICY adt3 PRIVILEGES CREATE ...`."}],"simulated_output":"ALTER TABLE\nCREATE ROW LEVEL SECURITY POLICY\nCREATE AUDIT POLICY","quiz_questions":[{"id":"h4_s2_q1","type":"single","question":"Which SQL operations can be restricted by a Row-Level Security (RLS) policy in openGauss?","options":["A. SELECT, INSERT, UPDATE, and DELETE","B. SELECT, UPDATE, and DELETE only (not INSERT or MERGE)","C. INSERT and MERGE only","D. CREATE, ALTER, and DROP only"],"answer":"B","explanation":"Per Chapter 03 (pp. 213, 215), Row-Level Security policies can be applied only to `SELECT`, `UPDATE`, and `DELETE` operations, and cannot be applied to `INSERT` and `MERGE` operations."},{"id":"h4_s2_q2","type":"multiple","question":"Which of the following statements about Transparent Data Encryption (TDE) in openGauss are TRUE?","options":["A. TDE uses a three-layer key structure: Root Key (RK), Cluster Master Key (CMK), and Data Encryption Key (DEK)","B. TDE supports `AES_128_CTR` (default) and `SM4_CTR` encryption algorithms","C. If the encryption function is not enabled when a table is created, the table cannot later be switched to an encrypted table","D. TDE supports encrypting column-store tables, Ustore tables, indexes, and Xlogs"],"answer":"ABC","explanation":"Per Chapter 03 (pp. 225–226), A, B, and C are true. Option D is false: TDE supports only heap row-store tables; column-store, Ustore, materialized views, indexes, sequences, Xlogs, and MOTs are NOT supported."},{"id":"h4_s2_q3","type":"tf","question":"In openGauss Unified Auditing, a single unified audit policy can simultaneously audit both DDL operations (`PRIVILEGES`) and DML operations (`ACCESS`).","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.03 p. 224). The unified audit policy syntax applies to either DDL or DML operations; a single unified audit policy cannot contain both DDL and DML operations."}],"reference_figures":[{"slug":"p3_h4s2_rbac_model","title":"Role-Based Access Control (RBAC) User-Role-Permission Mapping","pdf_page":210}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Easy-OM-WDR-Reports-Slow-SQL-and-Session-Diagnosis","exercise_slug":"06-Exercise-WDR-Snapshot-and-Session-Diagnosis-Lab","lecture":{"title":"Easy Maintenance — WDR Reports, One-Click Log Collection, Slow SQL & Session Diagnosis","duration_mins":7,"pdf_ref":"Ch.03, pp. 227–242","objectives":["Enable and generate Workload Diagnosis Reports (WDR) using `enable_wdr_snapshot`, `create_wdr_snapshot()`, and `generate_wdr_report()`","Distinguish WDR Summary vs. Detail report sections and configure Slow SQL diagnosis (`log_min_duration_statement`, `track_stmt_stat_level`, `statement_history`)","Diagnose blocked sessions and top wait events using `pg_thread_wait_status` and `DBE_PERF.local_active_session`"],"content_markdown":"### 1. Workload Diagnosis Report (WDR, pp. 228–233)\nWDR compares performance data between **two snapshots (`>= 2` snapshots required)** to diagnose long-term kernel performance bottlenecks:\n- **Key GUC Parameters (p. 230)**:\n  - **`enable_wdr_snapshot`**: Default is **`off`** (must be set to **`on`**).\n  - **`wdr_snapshot_interval`**: Automatic background snapshot interval; default is **1 hour**.\n  - **`wdr_snapshot_retention_days`**: Snapshot retention period; default is **8 days**.\n- **Generating a WDR HTML Report (pp. 230–231)**:\n  ```sql\n  SELECT * FROM snapshot.snapshot;          -- View existing snapshot IDs\n  SELECT create_wdr_snapshot();             -- Manually create a snapshot (sysadmin only)\n  \\a \\t \\o /home/om/wdrTestNode.html        -- Unaligned, tuples-only, redirect output to file\n  SELECT generate_wdr_report(1, 2, 'all', 'node', 'dn_6001_6002');\n  \\o \\a \\t                                  -- Close output file & restore formatting\n  ```\n  - `report_type`: `'summary'`, `'detail'`, or `'all'`; `report_scope`: `'cluster'` or `'node'`.\n- **Summary vs. Detail Report Contents (pp. 232–233)**:\n  - **Summary Report**: `Database Stat`, `Load Profile` (incl. SQL P85/P90 response time), `Instance Efficiency Percentages` (cache hit ratio), `Events`, `Wait Classes` (`STATUS`, `LWLOCK_EVENT`, `LOCK_EVENT`, `IO_EVENT`), `CPU`, `I/O Profile`, `Memory Statistics`.\n  - **Detail Report**: `Time Model`, `SQL Statistics`, `Wait Events`, `Cache I/O Stats`, `Utility status`, `Object stats`, `Configuration settings`.\n\n---\n\n### 2. One-Click Collection & Slow SQL Diagnosis (pp. 234–238)\n- **One-Click Diagnosis Collection**: Extracts OS info, system catalogs/views, run/cluster logs, config files, core dumps, stack/trace info, and redo logs (xlogs) for rapid fault demarcation.\n- **Slow SQL Diagnosis (v3.1.0+, pp. 236–238)**:\n  - Records SQL jobs whose execution time exceeds **`log_min_duration_statement`**, controlled by **`track_stmt_stat_level`** (default `'OFF,L0'` — part 1 is Full SQL, part 2 is Slow SQL).\n  - **Primary vs. Standby Querying**:\n    - On the **Primary node**, query the **`statement_history`** table (must be queried inside the **`postgres`** database; empty in other DBs) or `DBE_PERF.get_global_full_sql_by_timestamp(start_ts, end_ts)`.\n    - On the **Standby node** (which cannot write to tables), query the function **`dbe_perf.standby_statement_history`** inside the **`postgres`** database (memory/disk bounded by `track_stmt_standby_chain_size`).\n    - Decode the binary `details` column via `pg_catalog.statement_detail_decode(details, 'plaintext', true)`. Sensitive query parameters in plans are automatically masked (`Filter: (name = '***'::text)`).\n\n---\n\n### 3. Active Session Performance Diagnosis (pp. 239–242)\nSamples active sessions at 2 levels: **Level 1 (in-memory real-time, last few minutes)** and **Level 2 (persistent disk history)**:\n```sql\n-- 1. Check session blocking relationships\nSELECT sessionid, block_sessionid FROM pg_thread_wait_status;\n-- 2. Check blocked session and final blocker in active session samples\nSELECT sessionid, block_sessionid, final_block_sessionid FROM DBE_PERF.local_active_session;\n```","key_takeaways":["Generating a WDR report requires `enable_wdr_snapshot = on` (default `off`) and at least 2 snapshots (`create_wdr_snapshot()` can only be run by `sysadmin`). Default interval is 1 hour and retention is 8 days.","Slow SQL diagnosis records queries exceeding `log_min_duration_statement` (controlled by `track_stmt_stat_level`, default `'OFF,L0'`), and `statement_history` / `dbe_perf.standby_statement_history` must be queried in the `postgres` database.","Session blocking relationships are inspected via `pg_thread_wait_status` and `DBE_PERF.local_active_session`."],"exam_traps":["EXAM TRAP: If you query `statement_history` (or `dbe_perf.standby_statement_history` on a standby node) in any database other than `postgres`, the result is empty or unavailable (Ch.03 p. 238)!","EXAM TRAP: `enable_wdr_snapshot` is `off` by default, and at least 2 snapshots must exist before `generate_wdr_report()` can generate a report."],"content_html":"<h3>1. Workload Diagnosis Report (WDR, pp. 228–233)<\/h3>\n<p>WDR compares performance data between <strong>two snapshots (<code class=\"inline-code\">&gt;= 2<\/code> snapshots required)<\/strong> to diagnose long-term kernel performance bottlenecks:<\/p>\n<ul class=\"md-list\">\n<li><strong>Key GUC Parameters (p. 230)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">enable_wdr_snapshot<\/code><\/strong>: Default is <strong><code class=\"inline-code\">off<\/code><\/strong> (must be set to <strong><code class=\"inline-code\">on<\/code><\/strong>).<\/li>\n<li><strong><code class=\"inline-code\">wdr_snapshot_interval<\/code><\/strong>: Automatic background snapshot interval; default is <strong>1 hour<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">wdr_snapshot_retention_days<\/code><\/strong>: Snapshot retention period; default is <strong>8 days<\/strong>.<\/li>\n<li><strong>Generating a WDR HTML Report (pp. 230–231)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  SELECT * FROM snapshot.snapshot;          -- View existing snapshot IDs\n  SELECT create_wdr_snapshot();             -- Manually create a snapshot (sysadmin only)\n  \\a \\t \\o /home/om/wdrTestNode.html        -- Unaligned, tuples-only, redirect output to file\n  SELECT generate_wdr_report(1, 2, 'all', 'node', 'dn_6001_6002');\n  \\o \\a \\t                                  -- Close output file &amp; restore formatting<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><code class=\"inline-code\">report_type<\/code>: <code class=\"inline-code\">'summary'<\/code>, <code class=\"inline-code\">'detail'<\/code>, or <code class=\"inline-code\">'all'<\/code>; <code class=\"inline-code\">report_scope<\/code>: <code class=\"inline-code\">'cluster'<\/code> or <code class=\"inline-code\">'node'<\/code>.<\/li>\n<li><strong>Summary vs. Detail Report Contents (pp. 232–233)<\/strong>:<\/li>\n<li><strong>Summary Report<\/strong>: <code class=\"inline-code\">Database Stat<\/code>, <code class=\"inline-code\">Load Profile<\/code> (incl. SQL P85/P90 response time), <code class=\"inline-code\">Instance Efficiency Percentages<\/code> (cache hit ratio), <code class=\"inline-code\">Events<\/code>, <code class=\"inline-code\">Wait Classes<\/code> (<code class=\"inline-code\">STATUS<\/code>, <code class=\"inline-code\">LWLOCK_EVENT<\/code>, <code class=\"inline-code\">LOCK_EVENT<\/code>, <code class=\"inline-code\">IO_EVENT<\/code>), <code class=\"inline-code\">CPU<\/code>, <code class=\"inline-code\">I/O Profile<\/code>, <code class=\"inline-code\">Memory Statistics<\/code>.<\/li>\n<li><strong>Detail Report<\/strong>: <code class=\"inline-code\">Time Model<\/code>, <code class=\"inline-code\">SQL Statistics<\/code>, <code class=\"inline-code\">Wait Events<\/code>, <code class=\"inline-code\">Cache I/O Stats<\/code>, <code class=\"inline-code\">Utility status<\/code>, <code class=\"inline-code\">Object stats<\/code>, <code class=\"inline-code\">Configuration settings<\/code>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. One-Click Collection &amp; Slow SQL Diagnosis (pp. 234–238)<\/h3>\n<ul class=\"md-list\">\n<li><strong>One-Click Diagnosis Collection<\/strong>: Extracts OS info, system catalogs/views, run/cluster logs, config files, core dumps, stack/trace info, and redo logs (xlogs) for rapid fault demarcation.<\/li>\n<li><strong>Slow SQL Diagnosis (v3.1.0+, pp. 236–238)<\/strong>:<\/li>\n<li>Records SQL jobs whose execution time exceeds <strong><code class=\"inline-code\">log_min_duration_statement<\/code><\/strong>, controlled by <strong><code class=\"inline-code\">track_stmt_stat_level<\/code><\/strong> (default <code class=\"inline-code\">'OFF,L0'<\/code> — part 1 is Full SQL, part 2 is Slow SQL).<\/li>\n<li><strong>Primary vs. Standby Querying<\/strong>:<\/li>\n<li>On the <strong>Primary node<\/strong>, query the <strong><code class=\"inline-code\">statement_history<\/code><\/strong> table (must be queried inside the <strong><code class=\"inline-code\">postgres<\/code><\/strong> database; empty in other DBs) or <code class=\"inline-code\">DBE_PERF.get_global_full_sql_by_timestamp(start_ts, end_ts)<\/code>.<\/li>\n<li>On the <strong>Standby node<\/strong> (which cannot write to tables), query the function <strong><code class=\"inline-code\">dbe_perf.standby_statement_history<\/code><\/strong> inside the <strong><code class=\"inline-code\">postgres<\/code><\/strong> database (memory/disk bounded by <code class=\"inline-code\">track_stmt_standby_chain_size<\/code>).<\/li>\n<li>Decode the binary <code class=\"inline-code\">details<\/code> column via <code class=\"inline-code\">pg_catalog.statement_detail_decode(details, 'plaintext', true)<\/code>. Sensitive query parameters in plans are automatically masked (<code class=\"inline-code\">Filter: (name = '***'::text)<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Active Session Performance Diagnosis (pp. 239–242)<\/h3>\n<p>Samples active sessions at 2 levels: <strong>Level 1 (in-memory real-time, last few minutes)<\/strong> and <strong>Level 2 (persistent disk history)<\/strong>:<\/p>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>-- 1. Check session blocking relationships\nSELECT sessionid, block_sessionid FROM pg_thread_wait_status;\n-- 2. Check blocked session and final blocker in active session samples\nSELECT sessionid, block_sessionid, final_block_sessionid FROM DBE_PERF.local_active_session;<\/code><\/pre><\/div>"},"exercise":{"title":"Hands-On Lab: Generating a WDR Performance Report & Diagnosing Blocked Sessions","duration_mins":8,"exercise_type":"sql","prompt_label":"postgres=#","scenario":"A DBA notices intermittent latency spikes. Manually take a WDR snapshot, generate a WDR report between snapshot IDs 1 and 2, and query `DBE_PERF.local_active_session` to identify any blocked sessions and their `final_block_sessionid`.","instructions":["Step 1: Call `SELECT create_wdr_snapshot();` to create a manual WDR snapshot.","Step 2: Call `SELECT generate_wdr_report(1, 2, 'all', 'cluster', null);` to generate a cluster-wide WDR report between snapshots 1 and 2.","Step 3: Query `SELECT sessionid, block_sessionid, final_block_sessionid FROM DBE_PERF.local_active_session;`."],"starter_code":"-- Step 1: Manually create a WDR performance snapshot\nSELECT ____();\n\n-- Step 2: Generate a WDR report between snapshot 1 and snapshot 2\nSELECT ____(1, 2, 'all', 'cluster', null);\n\n-- Step 3: Check blocked sessions and final blocker in local_active_session\nSELECT sessionid, block_sessionid, final_block_sessionid\nFROM DBE_PERF.____;\n","solution_code":"SELECT create_wdr_snapshot();\n\nSELECT generate_wdr_report(1, 2, 'all', 'cluster', null);\n\nSELECT sessionid, block_sessionid, final_block_sessionid\nFROM DBE_PERF.local_active_session;","hints":["The function to manually take a WDR snapshot is `create_wdr_snapshot()`.","The function to generate the report is `generate_wdr_report(...)`.","Active session samples are stored in `DBE_PERF.local_active_session`."],"validation_checks":[{"step":1,"description":"Call `create_wdr_snapshot()`","required_any":["create_wdr_snapshot()"],"feedback_fail":"Call `SELECT create_wdr_snapshot();`."},{"step":2,"description":"Call `generate_wdr_report`","required_any":["generate_wdr_report"],"feedback_fail":"Call `SELECT generate_wdr_report(1, 2, 'all', 'cluster', null);`."},{"step":3,"description":"Query `DBE_PERF.local_active_session`","required_any":["local_active_session"],"feedback_fail":"Query `FROM DBE_PERF.local_active_session`."}],"simulated_output":"           create_wdr_snapshot           \n-----------------------------------------\n WDR snapshot request has been submitted\n(1 row)\n\n generate_wdr_report \n---------------------\n <html lang=\"en\">...WDR Cluster Report (Snap 1 -> Snap 2)...<\/html>\n(1 row)\n\n   sessionid    | block_sessionid | final_block_sessionid \n----------------+-----------------+-----------------------\n 14021983741696 |  14021983745792 |        14021983749888\n(1 row)","quiz_questions":[{"id":"h4_s3_q1","type":"single","question":"What are the prerequisites for generating a Workload Diagnosis Report (WDR) in openGauss?","options":["A. `enable_wdr_snapshot` is set to `off`, and at least 1 snapshot exists","B. `enable_wdr_snapshot` is set to `on`, and the number of snapshots is greater than or equal to 2","C. The database must be stopped first using `gs_om -t stop`","D. Only a common user without `sysadmin` privileges can run `create_wdr_snapshot()`"],"answer":"B","explanation":"Per Chapter 03 (p. 230), the prerequisites for WDR generation are that `enable_wdr_snapshot` is set to `on` (it is `off` by default) and the number of snapshots is greater than or equal to 2. Only a `sysadmin` user can manually run `create_wdr_snapshot()`."},{"id":"h4_s3_q2","type":"single","question":"In openGauss Slow SQL Diagnosis, which GUC parameter specifies the execution duration threshold above which a SQL statement is recorded as a slow SQL statement, and in which database must `statement_history` be queried?","options":["A. `session_timeout`; queried in `template1`","B. `log_min_duration_statement`; queried in `postgres`","C. `wdr_snapshot_interval`; queried in any user database","D. `lock_wait_timeout`; queried in `template0`"],"answer":"B","explanation":"Per Chapter 03 (pp. 236, 238), Slow SQL diagnosis records jobs exceeding `log_min_duration_statement`, and `statement_history` (or `dbe_perf.standby_statement_history` on standby) contains data only when queried in the `postgres` database."},{"id":"h4_s3_q3","type":"tf","question":"In `gsql`, the meta-commands `\\a \\t \\o /path/report.html` switch output to unaligned mode, tuples-only mode, and redirect query output to the specified HTML file.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.03 p. 231). `\\a` toggles unaligned mode, `\\t` toggles tuples-only mode (hiding column headers and row count footer), and `\\o <file>` redirects query results to the server file."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-AI-Capabilities-AI4DB-and-DB4AI","exercise_slug":"08-Exercise-Index-Advisor-Virtual-Index-and-DB4AI-Lab","lecture":{"title":"AI Capabilities — AI4DB (`X-Tuner`, `SQLdiag`, `Index-advisor`) & DB4AI (`DeepSQL`, Native DB4AI)","duration_mins":7,"pdf_ref":"Ch.03, pp. 243–267","objectives":["Distinguish the two sub-pillars of DBMind: AI4DB (X-Tuner, SQLdiag, Index-advisor, Anomaly-detection) and DB4AI (DeepSQL, Native DB4AI)","Operate X-Tuner (`recommend`, `train`, `tune`), SQLdiag (`train`, `predict`), and Index-advisor (`gs_index_advise`, `hypopg_create_index`, `index_advisor_workload.py`)","Describe DeepSQL (60+ ML/graph algorithms) and Native DB4AI (`CREATE MODEL`, `PREDICT BY`)"],"content_markdown":"### 1. openGauss AI Architecture (`DBMind`: `AI4DB` + `DB4AI`, p. 244)\n- **AI4DB (AI for Database)**: Uses AI to make the database self-tuning, self-diagnosing, self-healing, and self-securing. Includes **`X-Tuner`**, **`SQLdiag`**, **`Index-advisor`**, and **`Anomaly-detection`**.\n- **DB4AI (Database for AI)**: Runs machine learning and deep learning directly inside the database engine using SQL-like syntax without moving data across platforms. Includes **`DeepSQL`** and the **`Native DB4AI Engine`**.\n<!-- PDF_FIGS_START -->\n![openGauss AI4DB (Self-Tuning, Diagnosis) and DB4AI Full Stack (Official Reference: p. 244)](./assets/images/p3_h4s4_ai_overview.png)\n*Figure: openGauss AI4DB (Self-Tuning, Diagnosis) and DB4AI Full Stack (Official Reference: p. 244)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. AI4DB Tools: `X-Tuner`, `SQLdiag` & `Index-advisor` (pp. 245–263)\n\n#### A. `X-Tuner` (Knob Parameter Tuning Tool, pp. 245–249)\n- Uses **Deep Reinforcement Learning (DRL, e.g., DDPG)** and **Global Search Algorithms (Bayesian optimization, Particle Swarm Optimization / PSO)**. Can be run from source (`python main.py`) or installed via `python setup.py install` (`gs_xtuner`).\n- **3 Running Modes (p. 247)**:\n  1. **`recommend`**: Inspects current workload features and generates a parameter recommendation report **in seconds without restarting the database**.\n  2. **`train`**: Iteratively modifies knobs and runs benchmarks to train a DRL model (may restart DB repeatedly).\n  3. **`tune`**: Tunes parameters using either a trained DRL model (requires `train` first with identical knob list/min/max) or a Global Search algorithm (no pre-training required).\n\n#### B. `SQLdiag` (SQL Execution Time Prediction, pp. 250–253)\n- Predicts execution duration of unknown SQL queries using **SQL vectorization and template-based similarity** against historical execution logs **without collecting execution plans** (zero impact on DB performance; works for both OLTP and OLAP!).\n- Requires GUC `log_statement = all` and `log_statement_stats = on`.\n- Usage: `python main.py -m train -f data/train.csv` and `python main.py -m predict -f data/predict.csv`.\n\n#### C. `Index-advisor` (3 Index Recommendation Functions, pp. 254–263)\n1. **Single-Query Index Recommendation**:\n   ```sql\n   SELECT * FROM gs_index_advise('SELECT name, age, sex FROM t1 WHERE age >= 18 AND age < 35 AND sex = ''f'';');\n   -- Supports ONLY a single SELECT statement on standard row-store tables!\n   ```\n2. **Virtual (Hypothetical) Index Recommendation**:\n   - Simulates an index in the optimizer without physical creation time/space overhead:\n   ```sql\n   SELECT * FROM hypopg_create_index('CREATE INDEX ON bmsql_customer(c_w_id)');\n   SET enable_hypo_index = on;               -- Default is off!\n   EXPLAIN SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10;\n   -- Companion functions: hypopg_display_index(), hypopg_drop_index(oid), hypopg_reset_index(), hypopg_estimate_size(oid)\n   ```\n3. **Workload-Level Index Recommendation**:\n   ```bash\n   python index_advisor_workload.py 6001 postgres tpcc_log.txt --max_index_num 10 --multi_iter_mode\n   ```\n<!-- PDF_FIGS_START -->\n![X-Tuner Deep Reinforcement Learning Parameter Optimization Loop (Official Reference: p. 246)](./assets/images/p3_h4s4_xtuner_drl.png)\n*Figure: X-Tuner Deep Reinforcement Learning Parameter Optimization Loop (Official Reference: p. 246)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. DB4AI: `DeepSQL` & Native DB4AI Engine (pp. 264–267)\n- **`DeepSQL`**: Encapsulates **60+ machine learning & graph algorithms** (Linear/Logistic Regression, Random Forest, KNN, K-Means, PCA, shortest path, graph diameter, Pearson correlation) into SQL statements (requires Python 2.7.12+ and `PL/Python`).\n- **Native DB4AI Engine**: Integrates native AI operators and execution planning directly into the openGauss kernel with SQL-like syntax (**`CREATE MODEL ...`** and **`PREDICT BY ...`**), eliminating external Python/platform data transfers.","key_takeaways":["X-Tuner runs in 3 modes: `recommend` (completes in seconds without DB restart), `train` (trains DRL model), and `tune` (uses DRL or global search algorithms).","SQLdiag predicts SQL execution time from historical logs using SQL vectorization and templates WITHOUT needing SQL execution plans.","Index-advisor provides 3 levels: `gs_index_advise('SELECT ...')` (single query), `hypopg_create_index(...)` with `SET enable_hypo_index = on` (virtual index), and `index_advisor_workload.py` (workload-level)."],"exam_traps":["EXAM TRAP: After creating a virtual index with `hypopg_create_index()`, the optimizer will NOT use it in `EXPLAIN` unless you set `SET enable_hypo_index = on;` (default is `off`, Ch.03 p. 258)!","EXAM TRAP: `gs_index_advise()` supports ONLY a single `SELECT` statement and does NOT support column-store tables, views, materialized views, global temp tables, or encrypted databases (Ch.03 p. 255)."],"content_html":"<h3>1. openGauss AI Architecture (<code class=\"inline-code\">DBMind<\/code>: <code class=\"inline-code\">AI4DB<\/code> + <code class=\"inline-code\">DB4AI<\/code>, p. 244)<\/h3>\n<ul class=\"md-list\">\n<li><strong>AI4DB (AI for Database)<\/strong>: Uses AI to make the database self-tuning, self-diagnosing, self-healing, and self-securing. Includes <strong><code class=\"inline-code\">X-Tuner<\/code><\/strong>, <strong><code class=\"inline-code\">SQLdiag<\/code><\/strong>, <strong><code class=\"inline-code\">Index-advisor<\/code><\/strong>, and <strong><code class=\"inline-code\">Anomaly-detection<\/code><\/strong>.<\/li>\n<li><strong>DB4AI (Database for AI)<\/strong>: Runs machine learning and deep learning directly inside the database engine using SQL-like syntax without moving data across platforms. Includes <strong><code class=\"inline-code\">DeepSQL<\/code><\/strong> and the <strong><code class=\"inline-code\">Native DB4AI Engine<\/code><\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h4s4_ai_overview.png\" alt=\"openGauss AI4DB (Self-Tuning, Diagnosis) and DB4AI Full Stack\" data-caption=\"openGauss AI4DB (Self-Tuning, Diagnosis) and DB4AI Full Stack (Official Reference: p. 244)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss AI4DB (Self-Tuning, Diagnosis) and DB4AI Full Stack<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 244 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. AI4DB Tools: <code class=\"inline-code\">X-Tuner<\/code>, <code class=\"inline-code\">SQLdiag<\/code> &amp; <code class=\"inline-code\">Index-advisor<\/code> (pp. 245–263)<\/h3>\n<h4>A. <code class=\"inline-code\">X-Tuner<\/code> (Knob Parameter Tuning Tool, pp. 245–249)<\/h4>\n<ul class=\"md-list\">\n<li>Uses <strong>Deep Reinforcement Learning (DRL, e.g., DDPG)<\/strong> and <strong>Global Search Algorithms (Bayesian optimization, Particle Swarm Optimization / PSO)<\/strong>. Can be run from source (<code class=\"inline-code\">python main.py<\/code>) or installed via <code class=\"inline-code\">python setup.py install<\/code> (<code class=\"inline-code\">gs_xtuner<\/code>).<\/li>\n<li><strong>3 Running Modes (p. 247)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">recommend<\/code><\/strong>: Inspects current workload features and generates a parameter recommendation report <strong>in seconds without restarting the database<\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">train<\/code><\/strong>: Iteratively modifies knobs and runs benchmarks to train a DRL model (may restart DB repeatedly).<\/li>\n<li><strong><code class=\"inline-code\">tune<\/code><\/strong>: Tunes parameters using either a trained DRL model (requires <code class=\"inline-code\">train<\/code> first with identical knob list/min/max) or a Global Search algorithm (no pre-training required).<\/li>\n<\/ol>\n<h4>B. <code class=\"inline-code\">SQLdiag<\/code> (SQL Execution Time Prediction, pp. 250–253)<\/h4>\n<ul class=\"md-list\">\n<li>Predicts execution duration of unknown SQL queries using <strong>SQL vectorization and template-based similarity<\/strong> against historical execution logs <strong>without collecting execution plans<\/strong> (zero impact on DB performance; works for both OLTP and OLAP!).<\/li>\n<li>Requires GUC <code class=\"inline-code\">log_statement = all<\/code> and <code class=\"inline-code\">log_statement_stats = on<\/code>.<\/li>\n<li>Usage: <code class=\"inline-code\">python main.py -m train -f data/train.csv<\/code> and <code class=\"inline-code\">python main.py -m predict -f data/predict.csv<\/code>.<\/li>\n<\/ul>\n<h4>C. <code class=\"inline-code\">Index-advisor<\/code> (3 Index Recommendation Functions, pp. 254–263)<\/h4>\n<ol class=\"md-list\">\n<li><strong>Single-Query Index Recommendation<\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   SELECT * FROM gs_index_advise('SELECT name, age, sex FROM t1 WHERE age &gt;= 18 AND age &lt; 35 AND sex = ''f'';');\n   -- Supports ONLY a single SELECT statement on standard row-store tables!<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong>Virtual (Hypothetical) Index Recommendation<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Simulates an index in the optimizer without physical creation time/space overhead:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   SELECT * FROM hypopg_create_index('CREATE INDEX ON bmsql_customer(c_w_id)');\n   SET enable_hypo_index = on;               -- Default is off!\n   EXPLAIN SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10;\n   -- Companion functions: hypopg_display_index(), hypopg_drop_index(oid), hypopg_reset_index(), hypopg_estimate_size(oid)<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong>Workload-Level Index Recommendation<\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   python index_advisor_workload.py 6001 postgres tpcc_log.txt --max_index_num 10 --multi_iter_mode<\/code><\/pre><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h4s4_xtuner_drl.png\" alt=\"X-Tuner Deep Reinforcement Learning Parameter Optimization Loop\" data-caption=\"X-Tuner Deep Reinforcement Learning Parameter Optimization Loop (Official Reference: p. 246)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>X-Tuner Deep Reinforcement Learning Parameter Optimization Loop<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 246 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. DB4AI: <code class=\"inline-code\">DeepSQL<\/code> &amp; Native DB4AI Engine (pp. 264–267)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">DeepSQL<\/code><\/strong>: Encapsulates <strong>60+ machine learning &amp; graph algorithms<\/strong> (Linear/Logistic Regression, Random Forest, KNN, K-Means, PCA, shortest path, graph diameter, Pearson correlation) into SQL statements (requires Python 2.7.12+ and <code class=\"inline-code\">PL/Python<\/code>).<\/li>\n<li><strong>Native DB4AI Engine<\/strong>: Integrates native AI operators and execution planning directly into the openGauss kernel with SQL-like syntax (<strong><code class=\"inline-code\">CREATE MODEL ...<\/code><\/strong> and <strong><code class=\"inline-code\">PREDICT BY ...<\/code><\/strong>), eliminating external Python/platform data transfers.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Recommending & Testing Indexes with `gs_index_advise` and Virtual Indexes","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"A query `SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10` is running a slow `Seq Scan`. Use `gs_index_advise` to get an index recommendation, create a virtual index using `hypopg_create_index`, enable `enable_hypo_index`, and verify the optimizer switches to an `Index Scan`.","instructions":["Step 1: Call `SELECT * FROM gs_index_advise('SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10');`.","Step 2: Create a virtual index using `SELECT * FROM hypopg_create_index('CREATE INDEX ON bmsql_customer(c_w_id)');`.","Step 3: Enable virtual indexes with `SET enable_hypo_index = on;` and run `EXPLAIN SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10;`."],"starter_code":"-- Step 1: Get single-query index recommendation\nSELECT * FROM ____('SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10');\n\n-- Step 2: Create a virtual (hypothetical) index on bmsql_customer(c_w_id)\nSELECT * FROM ____('CREATE INDEX ON bmsql_customer(c_w_id)');\n\n-- Step 3: Enable virtual index evaluation in the optimizer and run EXPLAIN\nSET ____ = on;\nEXPLAIN SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10;\n","solution_code":"SELECT * FROM gs_index_advise('SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10');\n\nSELECT * FROM hypopg_create_index('CREATE INDEX ON bmsql_customer(c_w_id)');\n\nSET enable_hypo_index = on;\nEXPLAIN SELECT c_discount FROM bmsql_customer WHERE c_w_id = 10;","hints":["Use `gs_index_advise('<SQL>')` for single-query index recommendation.","Use `hypopg_create_index('<CREATE INDEX SQL>')` to create a virtual index.","Set `enable_hypo_index = on` before running `EXPLAIN`."],"validation_checks":[{"step":1,"description":"Call `gs_index_advise`","required_any":["gs_index_advise"],"feedback_fail":"Call `SELECT * FROM gs_index_advise(...)`."},{"step":2,"description":"Create virtual index with `hypopg_create_index`","required_any":["hypopg_create_index"],"feedback_fail":"Call `SELECT * FROM hypopg_create_index(...)`."},{"step":3,"description":"Enable `enable_hypo_index = on`","required_any":["enable_hypo_index = on","enable_hypo_index=on"],"feedback_fail":"Run `SET enable_hypo_index = on;` so `EXPLAIN` uses the virtual index."}],"simulated_output":"     table      |  column  \n----------------+----------\n bmsql_customer | (c_w_id)\n(1 row)\n\n indexrelid |              indexname              \n------------+-------------------------------------\n     329726 | <329726>btree_bmsql_customer_c_w_id\n(1 row)\n\nSET\n                                                 QUERY PLAN                                                 \n------------------------------------------------------------------------------------------------------------\n [Bypass]\n Index Scan using <329726>btree_bmsql_customer_c_w_id on bmsql_customer  (cost=0.00..39678.69 rows=31224 width=4)\n   Index Cond: (c_w_id = 10)\n(3 rows)","quiz_questions":[{"id":"h4_s4_q1","type":"single","question":"Which running mode of the openGauss `X-Tuner` parameter tuning tool generates a parameter recommendation report in seconds based on the running workload WITHOUT restarting the database?","options":["A. train","B. tune","C. recommend","D. predict"],"answer":"C","explanation":"Per Chapter 03 (p. 247), X-Tuner runs in three modes: `recommend`, `train`, and `tune`. In `recommend` mode, operations complete in seconds and the database does not need to be restarted."},{"id":"h4_s4_q2","type":"multiple","question":"Which of the following statements about the openGauss `Index-advisor` and virtual indexes are TRUE?","options":["A. `Index-advisor` provides single-query index recommendation (`gs_index_advise`), virtual index recommendation, and workload-level index recommendation (`index_advisor_workload.py`)","B. To allow the optimizer to consider virtual indexes during `EXPLAIN`, the GUC parameter `enable_hypo_index` must be set to `on`","C. Virtual indexes created by `hypopg_create_index` persist permanently on disk even after the database is restarted","D. `hypopg_estimate_size` can estimate the disk space required to create a specified virtual index"],"answer":"ABD","explanation":"Per Chapter 03 (pp. 254–261), A, B, and D are true. Option C is false: virtual indexes exist in memory at the instance level and are cleared when the database is restarted."},{"id":"h4_s4_q3","type":"tf","question":"`SQLdiag` requires collecting the execution plans of SQL statements in advance to predict their execution time.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.03 pp. 250–251). `SQLdiag` predicts SQL execution time based on statement logic similarity and historical execution logs WITHOUT obtaining the SQL execution plan, so it has no impact on database performance."}],"reference_figures":[{"slug":"p3_h4s4_xtuner_drl","title":"X-Tuner Deep Reinforcement Learning Parameter Optimization Loop","pdf_page":246}]}}]},{"hour_number":5,"folder_name":"Hour-05-Database-and-Object-Management","title":"Database & Object Management (MOT, Tablespaces, Users/Roles, Backup/Export)","chapter_ref":"Chapter 04 (pp. 273–351)","duration_mins":60,"overview":"Master the openGauss logical object hierarchy (Databases, Schemas, Tables, Views, Indexes, Transactions), configure Memory-Optimized Tables (MOT), manage Tablespaces and disk quota thresholds, administer Users, Roles, Account Validity/Locking, and Private (`INDEPENDENT`) Users, query System Catalogs/Views, and perform Data Import/Export (`COPY`, `\\copy`, `gs_dump`, `gs_dumpall`, `gs_restore`, `VACUUM FULL`, `ANALYZE`).","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Logical-Structure-and-Core-Database-Objects","exercise_slug":"02-Exercise-Schemas-Views-Indexes-and-Isolation-Lab","lecture":{"title":"Logical Structure & Core Objects (Databases, Schemas, Tables, Views, Indexes, Transactions)","duration_mins":7,"pdf_ref":"Ch.04, pp. 277–293","objectives":["Navigate the logical hierarchy (Tablespace -> Database -> Schema -> Table -> Datafile Segment -> 8 KB Block)","Use `gsql` meta-commands (`\\h`, `\\c`, `\\l`, `\\dt`, `\\d`, `\\db`) and manage Schemas (`public`, `pg_temp`), Views, and Indexes","Contrast `READ COMMITTED` (statement-level snapshot, default) and `REPEATABLE READ` (transaction-level snapshot) isolation levels"],"content_markdown":"### 1. Logical Structure & `gsql` Meta-Commands (pp. 277–285)\n- **Logical Hierarchy**:\n  - **Tablespace**: Physical directory mapping; can hold files for multiple databases.\n  - **Database**: Isolated collection of schemas and objects (default database: **`postgres`**; default templates: **`template0`**, **`template1`**).\n  - **Schema**: Logical namespace container inside a database (cannot be nested). Every new database has a **`public`** schema by default. Creating a user via `CREATE USER` automatically creates a **schema with the same name** as the user!\n  - **Table -> Datafile Segment (> 1 GB split) -> Block (8 KB default)**.\n- **Essential `gsql` Meta-Commands (p. 285)**:\n  - `\\h [NAME]`: View SQL syntax help (e.g., `\\h create user`).\n  - `\\l`: List all databases.\n  - `\\c dbname`: Switch/connect to `dbname`.\n  - `\\dt`: List all tables in the current schema/database.\n  - `\\d tablename`: Describe columns, types, and indexes of `tablename` (or system catalog).\n  - `\\db`: List all tablespaces.\n  - `\\q`: Quit `gsql`.\n<!-- PDF_FIGS_START -->\n![openGauss Tablespace, Database, Table, and Data Block Hierarchy (Official Reference: p. 277)](./assets/images/p3_h5s1_logical_arch.png)\n*Figure: openGauss Tablespace, Database, Table, and Data Block Hierarchy (Official Reference: p. 277)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Core Objects: Indexes, Views & Schemas (pp. 288–292)\n- **Indexes (pp. 288–289)**:\n  - Recommended on: frequently queried columns, `JOIN` condition columns (composite index), `WHERE` filter/range columns, and `ORDER BY` / `GROUP BY` / `DISTINCT` columns.\n  - Types: Single-column, Composite (`(col1, col2)`), Unique (`CREATE UNIQUE INDEX`), Expression/Function-based (`ON table (expression)`), and Partial (`WHERE predicate`).\n- **Views (`CREATE [TEMP] VIEW view_name AS query;`, p. 290)**:\n  - A **virtual table**: only the view definition is stored in the database; actual data remains in the base tables.\n- **Schemas (`CREATE SCHEMA`, pp. 291–292)**:\n  - **Public Schema Security Rule**: All users have `USAGE` on `public` by default, but **only `SYSADMIN` and initial users** can create functions, aggregates, stored procedures, and synonyms in `public`, and **only the initial user** can create operators in `public`!\n  - **Internal Schemas**: Schemas starting with **`pg_temp`** or **`pg_toast_temp`** are for internal temporary tables/TOAST — **never drop them**!\n\n---\n\n### 3. Transaction Isolation Levels in openGauss (p. 293)\n\n| Isolation Level | Snapshot Timing | Visibility Behavior & Application Notes |\n| :--- | :--- | :--- |\n| **`READ COMMITTED` (Default)** | **Statement-level snapshot** (new snapshot taken at the start of *each* `SELECT` statement) | Sees only data committed before the statement began (plus own uncommitted updates). Two consecutive `SELECT`s in the same transaction may see different data if another transaction commits in between. |\n| **`REPEATABLE READ`** | **Transaction-level snapshot** (single snapshot taken at the start of the *first* statement in the transaction) | Repeated `SELECT` statements within the same transaction always see the exact same data snapshot. Applications must be prepared to retry transactions on serialization conflicts. |","key_takeaways":["When `CREATE USER` is executed, openGauss automatically creates a schema with the same name as the user in the current database.","Schemas cannot be nested, and internal schemas starting with `pg_temp` or `pg_toast_temp` must never be dropped.","At `READ COMMITTED` (default), each statement takes a fresh snapshot; at `REPEATABLE READ`, the transaction uses the snapshot taken at the start of the transaction."],"exam_traps":["EXAM TRAP: A view is a virtual table — the database stores ONLY the view definition, NOT the view data (except materialized views).","EXAM TRAP: Even if an ordinary user is granted `CREATE` permission on the `public` schema, only `SYSADMIN`/initial users can create functions, aggregate functions, stored procedures, and synonyms in `public` (Ch.04 p. 291)!"],"content_html":"<h3>1. Logical Structure &amp; <code class=\"inline-code\">gsql<\/code> Meta-Commands (pp. 277–285)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Logical Hierarchy<\/strong>:<\/li>\n<li><strong>Tablespace<\/strong>: Physical directory mapping; can hold files for multiple databases.<\/li>\n<li><strong>Database<\/strong>: Isolated collection of schemas and objects (default database: <strong><code class=\"inline-code\">postgres<\/code><\/strong>; default templates: <strong><code class=\"inline-code\">template0<\/code><\/strong>, <strong><code class=\"inline-code\">template1<\/code><\/strong>).<\/li>\n<li><strong>Schema<\/strong>: Logical namespace container inside a database (cannot be nested). Every new database has a <strong><code class=\"inline-code\">public<\/code><\/strong> schema by default. Creating a user via <code class=\"inline-code\">CREATE USER<\/code> automatically creates a <strong>schema with the same name<\/strong> as the user!<\/li>\n<li><strong>Table -&gt; Datafile Segment (&gt; 1 GB split) -&gt; Block (8 KB default)<\/strong>.<\/li>\n<li><strong>Essential <code class=\"inline-code\">gsql<\/code> Meta-Commands (p. 285)<\/strong>:<\/li>\n<li><code class=\"inline-code\">\\h [NAME]<\/code>: View SQL syntax help (e.g., <code class=\"inline-code\">\\h create user<\/code>).<\/li>\n<li><code class=\"inline-code\">\\l<\/code>: List all databases.<\/li>\n<li><code class=\"inline-code\">\\c dbname<\/code>: Switch/connect to <code class=\"inline-code\">dbname<\/code>.<\/li>\n<li><code class=\"inline-code\">\\dt<\/code>: List all tables in the current schema/database.<\/li>\n<li><code class=\"inline-code\">\\d tablename<\/code>: Describe columns, types, and indexes of <code class=\"inline-code\">tablename<\/code> (or system catalog).<\/li>\n<li><code class=\"inline-code\">\\db<\/code>: List all tablespaces.<\/li>\n<li><code class=\"inline-code\">\\q<\/code>: Quit <code class=\"inline-code\">gsql<\/code>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h5s1_logical_arch.png\" alt=\"openGauss Tablespace, Database, Table, and Data Block Hierarchy\" data-caption=\"openGauss Tablespace, Database, Table, and Data Block Hierarchy (Official Reference: p. 277)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Tablespace, Database, Table, and Data Block Hierarchy<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 277 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Core Objects: Indexes, Views &amp; Schemas (pp. 288–292)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Indexes (pp. 288–289)<\/strong>:<\/li>\n<li>Recommended on: frequently queried columns, <code class=\"inline-code\">JOIN<\/code> condition columns (composite index), <code class=\"inline-code\">WHERE<\/code> filter/range columns, and <code class=\"inline-code\">ORDER BY<\/code> / <code class=\"inline-code\">GROUP BY<\/code> / <code class=\"inline-code\">DISTINCT<\/code> columns.<\/li>\n<li>Types: Single-column, Composite (<code class=\"inline-code\">(col1, col2)<\/code>), Unique (<code class=\"inline-code\">CREATE UNIQUE INDEX<\/code>), Expression/Function-based (<code class=\"inline-code\">ON table (expression)<\/code>), and Partial (<code class=\"inline-code\">WHERE predicate<\/code>).<\/li>\n<li><strong>Views (<code class=\"inline-code\">CREATE [TEMP] VIEW view_name AS query;<\/code>, p. 290)<\/strong>:<\/li>\n<li>A <strong>virtual table<\/strong>: only the view definition is stored in the database; actual data remains in the base tables.<\/li>\n<li><strong>Schemas (<code class=\"inline-code\">CREATE SCHEMA<\/code>, pp. 291–292)<\/strong>:<\/li>\n<li><strong>Public Schema Security Rule<\/strong>: All users have <code class=\"inline-code\">USAGE<\/code> on <code class=\"inline-code\">public<\/code> by default, but <strong>only <code class=\"inline-code\">SYSADMIN<\/code> and initial users<\/strong> can create functions, aggregates, stored procedures, and synonyms in <code class=\"inline-code\">public<\/code>, and <strong>only the initial user<\/strong> can create operators in <code class=\"inline-code\">public<\/code>!<\/li>\n<li><strong>Internal Schemas<\/strong>: Schemas starting with <strong><code class=\"inline-code\">pg_temp<\/code><\/strong> or <strong><code class=\"inline-code\">pg_toast_temp<\/code><\/strong> are for internal temporary tables/TOAST — <strong>never drop them<\/strong>!<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Transaction Isolation Levels in openGauss (p. 293)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Isolation Level<\/th><th>Snapshot Timing<\/th><th>Visibility Behavior &amp; Application Notes<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">READ COMMITTED<\/code> (Default)<\/strong><\/td><td><strong>Statement-level snapshot<\/strong> (new snapshot taken at the start of <em>each<\/em> <code class=\"inline-code\">SELECT<\/code> statement)<\/td><td>Sees only data committed before the statement began (plus own uncommitted updates). Two consecutive <code class=\"inline-code\">SELECT<\/code>s in the same transaction may see different data if another transaction commits in between.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">REPEATABLE READ<\/code><\/strong><\/td><td><strong>Transaction-level snapshot<\/strong> (single snapshot taken at the start of the <em>first<\/em> statement in the transaction)<\/td><td>Repeated <code class=\"inline-code\">SELECT<\/code> statements within the same transaction always see the exact same data snapshot. Applications must be prepared to retry transactions on serialization conflicts.<\/td><\/tr>\n<\/tbody><\/table><\/div>"},"exercise":{"title":"Hands-On Lab: Managing Schemas, Views, Partial Indexes & `gsql` Meta-Commands","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Create a dedicated schema `hr_schema`, rename it to `hr_prod`, create a partial index on `customer_t1(Amount)` for high-value orders (`WHERE Amount > 1000`), and create a view `vip_customers`.","instructions":["Step 1: Create schema `hr_schema` and rename it to `hr_prod` using `ALTER SCHEMA hr_schema RENAME TO hr_prod;`.","Step 2: Create a partial index `idx_high_amount` on `customer_t1 (Amount) WHERE Amount > 1000;`.","Step 3: Create view `vip_customers` using `CREATE VIEW vip_customers AS SELECT c_customer_id, Amount FROM customer_t1 WHERE Amount > 1000;`."],"starter_code":"-- Step 1: Create schema hr_schema and rename it to hr_prod\nCREATE SCHEMA hr_schema;\nALTER SCHEMA hr_schema ____ TO hr_prod;\n\n-- Step 2: Create partial index idx_high_amount where Amount > 1000\nCREATE INDEX idx_high_amount ON customer_t1 (Amount) ____ Amount > 1000;\n\n-- Step 3: Create view vip_customers\nCREATE ____ vip_customers AS\nSELECT c_customer_id, Amount FROM customer_t1 WHERE Amount > 1000;\n","solution_code":"CREATE SCHEMA hr_schema;\nALTER SCHEMA hr_schema RENAME TO hr_prod;\n\nCREATE INDEX idx_high_amount ON customer_t1 (Amount) WHERE Amount > 1000;\n\nCREATE VIEW vip_customers AS\nSELECT c_customer_id, Amount FROM customer_t1 WHERE Amount > 1000;","hints":["Use `ALTER SCHEMA hr_schema RENAME TO hr_prod;` to rename a schema.","A partial index uses a `WHERE` predicate at the end of `CREATE INDEX`.","Use `CREATE VIEW vip_customers AS SELECT ...` to define the virtual table."],"validation_checks":[{"step":1,"description":"Rename schema with `ALTER SCHEMA hr_schema RENAME TO hr_prod`","required_any":["rename to hr_prod"],"feedback_fail":"Use `ALTER SCHEMA hr_schema RENAME TO hr_prod;`."},{"step":2,"description":"Create partial index with `WHERE Amount > 1000`","required_any":["where amount > 1000"],"feedback_fail":"Add `WHERE Amount > 1000` to the `CREATE INDEX` statement."},{"step":3,"description":"Create view `vip_customers`","required_any":["create view vip_customers"],"feedback_fail":"Use `CREATE VIEW vip_customers AS ...`."}],"simulated_output":"CREATE SCHEMA\nALTER SCHEMA\nCREATE INDEX\nCREATE VIEW","quiz_questions":[{"id":"h5_s1_q1","type":"single","question":"In `gsql`, which meta-command is used to view the column structure and index definitions of a specific table `customer_t1`?","options":["A. \\l customer_t1","B. \\c customer_t1","C. \\d customer_t1","D. \\h customer_t1"],"answer":"C","explanation":"Per Chapter 04 (p. 285), `\\d tablename` displays the table structure, whereas `\\l` lists all databases, `\\c dbname` switches databases, `\\dt` lists all tables, and `\\h` shows SQL command syntax help."},{"id":"h5_s1_q2","type":"multiple","question":"Which of the following statements about schemas in openGauss are TRUE?","options":["A. When a database is initially created, it has a `public` schema by default","B. When `CREATE USER` is executed, the system automatically creates a schema with the same name as the user in that database","C. Different schemas within the same database can contain tables with the exact same name without conflict","D. Schemas can be nested inside other schemas just like OS directories"],"answer":"ABC","explanation":"Per Chapter 04 (p. 291), A, B, and C are true. Option D is false: 'A schema is similar to an OS directory but cannot be nested.'"},{"id":"h5_s1_q3","type":"tf","question":"At the `READ COMMITTED` transaction isolation level in openGauss, two consecutive `SELECT` statements within the same transaction always see the exact same snapshot even if another concurrent transaction commits changes in between.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.04 p. 293). At `READ COMMITTED`, each statement starts with a new snapshot, so two consecutive `SELECT` statements in the same transaction may see different snapshots if another transaction commits in between. `REPEATABLE READ` keeps the initial transaction snapshot."}],"reference_figures":[{"slug":"p3_h5s1_logical_arch","title":"openGauss Tablespace, Database, Table, and Data Block Hierarchy","pdf_page":277}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Storage-Engine-Selection-and-MOT","exercise_slug":"04-Exercise-Memory-Optimized-Table-MOT-Lab","lecture":{"title":"Storage Engine Selection & Memory-Optimized Table (MOT)","duration_mins":7,"pdf_ref":"Ch.04, pp. 294–305","objectives":["Select the optimal storage engine (Row-store, Column-store, or MOT) based on workload characteristics","Explain MOT architecture, performance benchmarks (2.5x–4x throughput, 4.8M tpmC on 4-socket 256-core ARM, 3x–5.5x lower latency, 99% CPU utilization), and memory formula","Authorize `mot_server` (`GRANT USAGE ON FOREIGN SERVER`), create/drop MOTs (`CREATE/DROP FOREIGN TABLE`), and index MOTs (`CREATE INDEX` without `FOREIGN`)"],"content_markdown":"### 1. Storage Engine Selection Rules (pp. 295–301)\n\n| Selection Factor | Choose Row-Store (`ORIENTATION = ROW`) | Choose Column-Store (`ORIENTATION = COLUMN`) | Choose MOT (Memory-Optimized Table) |\n| :--- | :--- | :--- | :--- |\n| **Update / Insert Pattern** | Frequent updates; frequent small inserts | Rarely updated; **large batch inserts** | Mission-critical, ultra-low-latency OLTP |\n| **Column Width & Projection** | Narrow tables or queries reading most columns | Wide tables where queries touch **< 50% of columns** | All data **AND** indexes fit in RAM |\n| **Query Pattern** | Index point queries returning a few rows | Statistical aggregation (`SUM`, `AVG`, `GROUP BY`) & ad-hoc scans | High-concurrency, high-contention OLTP |\n| **Compression** | Moderate compression | **High compression ratio** (trades higher CPU usage for smaller I/O) | In-memory NUMA-aware row store |\n<!-- PDF_FIGS_START -->\n![Row-Store Table Sequential Tuple Disk Layout (Official Reference: p. 296)](./assets/images/p3_h5s2_rowstore_table.png)\n*Figure: Row-Store Table Sequential Tuple Disk Layout (Official Reference: p. 296)*\n\n![Column-Store Table Columnar Compression Layout (Official Reference: p. 298)](./assets/images/p3_h5s2_columnstore_table.png)\n*Figure: Column-Store Table Columnar Compression Layout (Official Reference: p. 298)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Memory-Optimized Table (MOT) Architecture & Benchmarks (pp. 302–304)\n- **What is MOT?**: Production-grade transactional **in-memory row-store engine** integrated with openGauss via the **Foreign Data Wrapper (`FDW`)** mechanism (`mot_server`), storing **both data and indexes entirely in memory**.\n- **Core Technical Pillars**:\n  - **NUMA-aware memory management** + **Lock-free concurrency control & indexing** + **Native query compilation (JIT/LLVM)** + full **ACID** support (WAL logging, Checkpoints, Recovery; supports `READ COMMITTED` and `REPEATABLE READ`).\n  - *Prerequisite*: Set `enable_incremental_checkpoint = off` in `postgresql.conf` before creating MOT tables.\n- **Official Huawei TaiShan (ARM/Kunpeng) TPC-C Benchmarks (p. 304)**:\n  - **Throughput**: **2.5x to 4x** higher than disk tables (**2.5x** gain on 2-socket servers; **4.8 million tpmC** on 4-socket 256-core Arm servers).\n  - **Latency**: Reduces transaction latency by **3x to 5.5x**.\n  - **Resource Utilization**: Reaches **99% CPU utilization** on 4-socket servers under high load and high contention.\n<!-- PDF_FIGS_START -->\n![openGauss Dual Storage Architecture: Disk Engine vs Memory-Optimized Table (MOT) (Official Reference: p. 303)](./assets/images/p3_h5s2_dual_storage_mot.png)\n*Figure: openGauss Dual Storage Architecture: Disk Engine vs Memory-Optimized Table (MOT) (Official Reference: p. 303)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. MOT Memory Formula & SQL Syntax (p. 305)\n- **Mandatory Memory Formula**:\n  $$(max\\_mot\\_global\\_memory + max\\_mot\\_local\\_memory) + 2 GB < max\\_process\\_memory$\n  - **Global memory**: Long-term memory shared across all CPU cores storing all MOT table data and indexes.\n  - **Local memory**: Short-term session memory used to handle private transaction data changes until commit.\n- **MOT SQL Syntax (FDW Mechanism)**:\n  ```sql\n  -- 1. Grant user permission to use mot_server (run once per user)\n  GRANT USAGE ON FOREIGN SERVER mot_server TO jack;\n  -- 2. Create an MOT (uses FOREIGN keyword!)\n  CREATE FOREIGN TABLE test(x INT) SERVER mot_server;\n  -- 3. Create an index on MOT (DO NOT use FOREIGN keyword here!)\n  CREATE INDEX text_index1 ON test(x);\n  -- 4. Drop an MOT (uses FOREIGN keyword!)\n  DROP FOREIGN TABLE test;\n  ```\n  - *Converting a disk table to MOT*: Use `gs_dump` to dump the disk table data, replace `CREATE TABLE` with `CREATE FOREIGN TABLE`, and use `gs_restore` / `gsql` to load data into the MOT.","key_takeaways":["MOT stores all data and indexes in memory using lock-free algorithms and NUMA-aware design, achieving 2.5x–4x higher throughput (4.8M tpmC on 4-socket 256-core ARM) and 3x–5.5x lower latency.","MOT memory configuration must satisfy `(max_mot_global_memory + max_mot_local_memory) + 2 GB < max_process_memory`.","MOT is integrated via FDW (`GRANT USAGE ON FOREIGN SERVER mot_server TO <user>;`): use `CREATE FOREIGN TABLE` and `DROP FOREIGN TABLE`, but do NOT use the `FOREIGN` keyword in `CREATE INDEX` or `DROP INDEX`!"],"exam_traps":["EXAM TRAP: When creating or dropping an index on an MOT, do NOT include the `FOREIGN` keyword (`CREATE INDEX idx ON test(x);`, NOT `CREATE FOREIGN INDEX`)! `FOREIGN` is used only in `CREATE FOREIGN TABLE` and `DROP FOREIGN TABLE` (Ch.04 p. 305).","EXAM TRAP: If a query touches less than 50% of the total columns in a wide table for analytical aggregation, choose a Column-Store table (Ch.04 p. 301)."],"content_html":"<h3>1. Storage Engine Selection Rules (pp. 295–301)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Selection Factor<\/th><th>Choose Row-Store (<code class=\"inline-code\">ORIENTATION = ROW<\/code>)<\/th><th>Choose Column-Store (<code class=\"inline-code\">ORIENTATION = COLUMN<\/code>)<\/th><th>Choose MOT (Memory-Optimized Table)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Update / Insert Pattern<\/strong><\/td><td>Frequent updates; frequent small inserts<\/td><td>Rarely updated; <strong>large batch inserts<\/strong><\/td><td>Mission-critical, ultra-low-latency OLTP<\/td><\/tr>\n<tr><td><strong>Column Width &amp; Projection<\/strong><\/td><td>Narrow tables or queries reading most columns<\/td><td>Wide tables where queries touch <strong>&lt; 50% of columns<\/strong><\/td><td>All data <strong>AND<\/strong> indexes fit in RAM<\/td><\/tr>\n<tr><td><strong>Query Pattern<\/strong><\/td><td>Index point queries returning a few rows<\/td><td>Statistical aggregation (<code class=\"inline-code\">SUM<\/code>, <code class=\"inline-code\">AVG<\/code>, <code class=\"inline-code\">GROUP BY<\/code>) &amp; ad-hoc scans<\/td><td>High-concurrency, high-contention OLTP<\/td><\/tr>\n<tr><td><strong>Compression<\/strong><\/td><td>Moderate compression<\/td><td><strong>High compression ratio<\/strong> (trades higher CPU usage for smaller I/O)<\/td><td>In-memory NUMA-aware row store<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h5s2_rowstore_table.png\" alt=\"Row-Store Table Sequential Tuple Disk Layout\" data-caption=\"Row-Store Table Sequential Tuple Disk Layout (Official Reference: p. 296)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Row-Store Table Sequential Tuple Disk Layout<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 296 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h5s2_columnstore_table.png\" alt=\"Column-Store Table Columnar Compression Layout\" data-caption=\"Column-Store Table Columnar Compression Layout (Official Reference: p. 298)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Column-Store Table Columnar Compression Layout<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 298 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Memory-Optimized Table (MOT) Architecture &amp; Benchmarks (pp. 302–304)<\/h3>\n<ul class=\"md-list\">\n<li><strong>What is MOT?<\/strong>: Production-grade transactional <strong>in-memory row-store engine<\/strong> integrated with openGauss via the <strong>Foreign Data Wrapper (<code class=\"inline-code\">FDW<\/code>)<\/strong> mechanism (<code class=\"inline-code\">mot_server<\/code>), storing <strong>both data and indexes entirely in memory<\/strong>.<\/li>\n<li><strong>Core Technical Pillars<\/strong>:<\/li>\n<li><strong>NUMA-aware memory management<\/strong> + <strong>Lock-free concurrency control &amp; indexing<\/strong> + <strong>Native query compilation (JIT/LLVM)<\/strong> + full <strong>ACID<\/strong> support (WAL logging, Checkpoints, Recovery; supports <code class=\"inline-code\">READ COMMITTED<\/code> and <code class=\"inline-code\">REPEATABLE READ<\/code>).<\/li>\n<li><em>Prerequisite<\/em>: Set <code class=\"inline-code\">enable_incremental_checkpoint = off<\/code> in <code class=\"inline-code\">postgresql.conf<\/code> before creating MOT tables.<\/li>\n<li><strong>Official Huawei TaiShan (ARM/Kunpeng) TPC-C Benchmarks (p. 304)<\/strong>:<\/li>\n<li><strong>Throughput<\/strong>: <strong>2.5x to 4x<\/strong> higher than disk tables (<strong>2.5x<\/strong> gain on 2-socket servers; <strong>4.8 million tpmC<\/strong> on 4-socket 256-core Arm servers).<\/li>\n<li><strong>Latency<\/strong>: Reduces transaction latency by <strong>3x to 5.5x<\/strong>.<\/li>\n<li><strong>Resource Utilization<\/strong>: Reaches <strong>99% CPU utilization<\/strong> on 4-socket servers under high load and high contention.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h5s2_dual_storage_mot.png\" alt=\"openGauss Dual Storage Architecture: Disk Engine vs Memory-Optimized Table (MOT)\" data-caption=\"openGauss Dual Storage Architecture: Disk Engine vs Memory-Optimized Table (MOT) (Official Reference: p. 303)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Dual Storage Architecture: Disk Engine vs Memory-Optimized Table (MOT)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 303 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. MOT Memory Formula &amp; SQL Syntax (p. 305)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Mandatory Memory Formula<\/strong>:<\/li>\n<\/ul>\n<p>$(max\\_mot\\_global\\_memory + max\\_mot\\_local\\_memory) + 2 GB &lt; max\\_process\\_memory$<\/p>\n<ul class=\"md-list\">\n<li><strong>Global memory<\/strong>: Long-term memory shared across all CPU cores storing all MOT table data and indexes.<\/li>\n<li><strong>Local memory<\/strong>: Short-term session memory used to handle private transaction data changes until commit.<\/li>\n<li><strong>MOT SQL Syntax (FDW Mechanism)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  -- 1. Grant user permission to use mot_server (run once per user)\n  GRANT USAGE ON FOREIGN SERVER mot_server TO jack;\n  -- 2. Create an MOT (uses FOREIGN keyword!)\n  CREATE FOREIGN TABLE test(x INT) SERVER mot_server;\n  -- 3. Create an index on MOT (DO NOT use FOREIGN keyword here!)\n  CREATE INDEX text_index1 ON test(x);\n  -- 4. Drop an MOT (uses FOREIGN keyword!)\n  DROP FOREIGN TABLE test;<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><em>Converting a disk table to MOT<\/em>: Use <code class=\"inline-code\">gs_dump<\/code> to dump the disk table data, replace <code class=\"inline-code\">CREATE TABLE<\/code> with <code class=\"inline-code\">CREATE FOREIGN TABLE<\/code>, and use <code class=\"inline-code\">gs_restore<\/code> / <code class=\"inline-code\">gsql<\/code> to load data into the MOT.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Granting `mot_server` Access, Creating an MOT & Indexing It","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Configure a high-throughput Memory-Optimized Table (MOT) `trade_mot` for user `jack`: grant `USAGE` on `FOREIGN SERVER mot_server` to `jack`, create the MOT `trade_mot(trade_id INT, price NUMERIC(10,2))`, create an index `idx_trade_id` on it, and write the statement to drop the MOT.","instructions":["Step 1: Grant MOT usage permission using `GRANT USAGE ON FOREIGN SERVER mot_server TO jack;`.","Step 2: Create the MOT using `CREATE FOREIGN TABLE trade_mot(trade_id INT, price NUMERIC(10,2)) SERVER mot_server;`.","Step 3: Create index `idx_trade_id` on `trade_mot(trade_id)` using `CREATE INDEX idx_trade_id ON trade_mot(trade_id);` (without `FOREIGN`) and drop the table with `DROP FOREIGN TABLE trade_mot;`."],"starter_code":"-- Step 1: Authorize user jack to access mot_server\nGRANT USAGE ON ____ SERVER ____ TO jack;\n\n-- Step 2: Create MOT trade_mot\nCREATE ____ TABLE trade_mot(trade_id INT, price NUMERIC(10,2)) SERVER mot_server;\n\n-- Step 3: Create index on trade_mot (note: no FOREIGN keyword!) and drop MOT\nCREATE ____ idx_trade_id ON trade_mot(trade_id);\nDROP ____ TABLE trade_mot;\n","solution_code":"GRANT USAGE ON FOREIGN SERVER mot_server TO jack;\n\nCREATE FOREIGN TABLE trade_mot(trade_id INT, price NUMERIC(10,2)) SERVER mot_server;\n\nCREATE INDEX idx_trade_id ON trade_mot(trade_id);\nDROP FOREIGN TABLE trade_mot;","hints":["MOT uses the foreign server `mot_server` (`GRANT USAGE ON FOREIGN SERVER mot_server TO jack;`).","Use `CREATE FOREIGN TABLE` and `DROP FOREIGN TABLE` for MOT tables, but standard `CREATE INDEX` for MOT indexes."],"validation_checks":[{"step":1,"description":"Grant usage on `FOREIGN SERVER mot_server`","required_any":["foreign server mot_server"],"feedback_fail":"Use `GRANT USAGE ON FOREIGN SERVER mot_server TO jack;`."},{"step":2,"description":"Create MOT with `CREATE FOREIGN TABLE trade_mot`","required_any":["create foreign table trade_mot"],"feedback_fail":"Use `CREATE FOREIGN TABLE trade_mot(...) SERVER mot_server;`."},{"step":3,"description":"Create index with `CREATE INDEX` and drop with `DROP FOREIGN TABLE`","required_any":["drop foreign table trade_mot"],"feedback_fail":"Use `CREATE INDEX idx_trade_id ON trade_mot(trade_id);` and `DROP FOREIGN TABLE trade_mot;`."}],"simulated_output":"GRANT\nCREATE FOREIGN TABLE\nCREATE INDEX\nDROP FOREIGN TABLE","quiz_questions":[{"id":"h5_s2_q1","type":"single","question":"Which memory configuration formula must be satisfied when configuring openGauss Memory-Optimized Tables (MOT)?","options":["A. `(max_mot_global_memory + max_mot_local_memory) + 2 GB < max_process_memory`","B. `max_mot_global_memory + shared_buffers < work_mem`","C. `max_mot_local_memory > max_mot_global_memory + 2 GB`","D. `cstore_buffers + wal_buffers < max_mot_local_memory`"],"answer":"A","explanation":"Per Chapter 04 (p. 305), the MOT memory configuration must satisfy `(max_mot_global_memory + max_mot_local_memory) + 2 GB < max_process_memory`."},{"id":"h5_s2_q2","type":"single","question":"Which SQL statement correctly creates a Memory-Optimized Table (MOT) named `test` with an integer column `x` in openGauss?","options":["A. `CREATE TABLE test(x int) WITH (ORIENTATION = MOT);`","B. `CREATE FOREIGN TABLE test(x int) SERVER mot_server;`","C. `CREATE MEMORY TABLE test(x int);`","D. `CREATE UNLOGGED TABLE test(x int);`"],"answer":"B","explanation":"Per Chapter 04 (p. 305), MOT is integrated via the FDW mechanism and created using `CREATE FOREIGN TABLE test(x int) [SERVER mot_server];`."},{"id":"h5_s2_q3","type":"tf","question":"When creating an index on a Memory-Optimized Table (MOT), you must specify `CREATE FOREIGN INDEX` before the index name.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.04 p. 305). When creating or deleting an index on an MOT, you do NOT specify the `FOREIGN` keyword (`CREATE INDEX text_index1 ON test(x);`); `FOREIGN` is used only when creating and dropping the table."}],"reference_figures":[{"slug":"p3_h5s2_dual_storage_mot","title":"openGauss Dual Storage Architecture: Disk Engine vs Memory-Optimized Table (MOT)","pdf_page":303}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Tablespaces-Users-Roles-and-Permission-Management","exercise_slug":"06-Exercise-Tablespaces-Users-Roles-and-Account-Lock-Lab","lecture":{"title":"Tablespaces, Users, Roles & Permission Management","duration_mins":7,"pdf_ref":"Ch.04, pp. 306–321, 346","objectives":["Create, inspect, size, rename, and drop Tablespaces (`CREATE TABLESPACE ... RELATIVE LOCATION`, `PG_TABLESPACE_SIZE`, `\\db`, 90% read-only threshold)","Explain why Users and Roles are NOT fully equivalent (Ch.04 Quiz Q1: False! Users have `LOGIN` by default, Roles do not)","Manage Users/Roles (`CREATE/ALTER/DROP USER/ROLE`), Account Validity (`VALID BEGIN ... VALID UNTIL`), Locking (`ACCOUNT LOCK/UNLOCK`), and Private Users (`WITH INDEPENDENT`)"],"content_markdown":"### 1. Tablespace Management & 90% Read-Only Threshold (pp. 307–310)\n- **Why Use Tablespaces?**:\n  1. Expand storage onto other disk partitions when the initial volume is full.\n  2. Separate hot objects (e.g., frequently accessed indexes on fast SSDs) from cold archived tables (on slower disks).\n  3. **90% Read-Only Protection Rule (p. 307)**: If the disk usage where a tablespace resides reaches **90%**, openGauss **automatically switches the database to read-only mode**! It switches back to read/write mode once disk usage drops below 90%.\n- **Tablespace SQL Operations (pp. 308–310)**:\n  ```sql\n  -- 1. Create tablespace (relative to instance data directory; must be an empty r/w directory)\n  CREATE TABLESPACE fastspace RELATIVE LOCATION 'tablespace/tablespace_1';\n  -- 2. Grant CREATE permission on tablespace\n  GRANT CREATE ON TABLESPACE fastspace TO jack;\n  -- 3. Create table in tablespace (or SET default_tablespace = 'fastspace';)\n  CREATE TABLE foo(i INT) TABLESPACE fastspace;\n  -- 4. Inspect tablespaces & check size\n  \\db\n  SELECT * FROM pg_tablespace;\n  SELECT PG_TABLESPACE_SIZE('fastspace');\n  -- 5. Rename & drop tablespace (owner or sysadmin only; must be empty)\n  ALTER TABLESPACE fastspace RENAME TO fspace;\n  DROP TABLESPACE fspace;\n  ```\n\n---\n\n### 2. Users vs. Roles (`pg_authid`, `PUBLIC`, Ch.04 Quiz Q1!)\n- **User vs. Role Distinction (pp. 312–315, 324, 346)**:\n  - **User**: An entity/individual that connects to the database (`rolcanlogin = true` / **`LOGIN` privilege enabled by default**).\n  - **Role**: A carrier of permission sets representing behavioral constraints (**does NOT have `LOGIN` permission by default**).\n  - **CRITICAL EXAM FACT (Ch.04 Quiz Q1: False!)**: Although `CREATE USER` and `CREATE ROLE` share the same syntax in openGauss, **users and roles are NOT fully equivalent** because `CREATE USER` grants `LOGIN` by default whereas `CREATE ROLE` does not (`NOLOGIN` by default)!\n- **Implicit `PUBLIC` Group (p. 313)**: All new users and roles implicitly inherit permissions granted to `PUBLIC` (use `GRANT/REVOKE ... TO/FROM PUBLIC` to manage).\n- **System Catalog & Views (p. 317, 324)**: User/role attributes are stored in the cluster-wide system catalog **`pg_authid`** (accessible **only to `SYSADMIN`**) and exposed via **`pg_user`** and **`pg_roles`** views.\n\n---\n\n### 3. Account Validity, Manual Lock/Unlock & Private (`INDEPENDENT`) Users (pp. 318–321)\n- **Dropping Users (`DROP USER`, p. 318)**: Uses **`RESTRICT` by default** — if the user owns database objects, `DROP USER` fails unless **`CASCADE`** is specified (`DROP USER IF EXISTS joe CASCADE;`).\n- **Setting Account Validity Period (p. 319)**:\n  ```sql\n  CREATE USER joe WITH PASSWORD 'Bigdata@123'\n      VALID BEGIN '2015-10-10 08:00:00' VALID UNTIL '2016-10-10 08:00:00';\n  ALTER USER joe WITH VALID BEGIN '2016-11-10 08:00:00' VALID UNTIL '2017-11-10 08:00:00';\n  ```\n- **Manually Locking and Unlocking Accounts (p. 320)**:\n  ```sql\n  ALTER USER user_read ACCOUNT LOCK;\n  ALTER USER user_read ACCOUNT UNLOCK;\n  ```\n- **Private User (`WITH INDEPENDENT`, p. 321)**:\n  ```sql\n  CREATE USER user_independent WITH INDEPENDENT IDENTIFIED BY '1234@abc';\n  ```\n  - Isolates DBA control permissions from data access permissions in non-separation-of-duties mode: **DBAs (`SYSADMIN`) can manage (`DROP`, `ALTER`, `TRUNCATE`) objects of an `INDEPENDENT` user, but CANNOT access (`SELECT`, `INSERT`, `UPDATE`, `DELETE`, `COPY`, `GRANT`, `REVOKE`, `ALTER OWNER`) their data without explicit authorization from that user!**","key_takeaways":["Users and roles have the same syntax in openGauss, but they are NOT fully equivalent (Ch.04 Quiz Q1: False) because `CREATE USER` includes `LOGIN` by default whereas `CREATE ROLE` does not.","If the disk hosting a tablespace reaches 90% usage, openGauss automatically switches to read-only mode.","For a Private User (`CREATE USER ... WITH INDEPENDENT`), DBAs can manage (`DROP`, `ALTER`, `TRUNCATE`) their objects but cannot access (`SELECT`, `INSERT`, `UPDATE`, `DELETE`, `COPY`) their data without authorization."],"exam_traps":["EXAM TRAP (Ch.04 Quiz Q1): '(True or False) Users and roles have the same syntax in the openGauss database. Therefore, they are fully equivalent.' -> B. False!","EXAM TRAP: If a user owns database objects, `DROP USER username;` fails because `RESTRICT` is the default; you must use `DROP USER username CASCADE;` (Ch.04 p. 318)."],"content_html":"<h3>1. Tablespace Management &amp; 90% Read-Only Threshold (pp. 307–310)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Why Use Tablespaces?<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Expand storage onto other disk partitions when the initial volume is full.<\/li>\n<li>Separate hot objects (e.g., frequently accessed indexes on fast SSDs) from cold archived tables (on slower disks).<\/li>\n<li><strong>90% Read-Only Protection Rule (p. 307)<\/strong>: If the disk usage where a tablespace resides reaches <strong>90%<\/strong>, openGauss <strong>automatically switches the database to read-only mode<\/strong>! It switches back to read/write mode once disk usage drops below 90%.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Tablespace SQL Operations (pp. 308–310)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  -- 1. Create tablespace (relative to instance data directory; must be an empty r/w directory)\n  CREATE TABLESPACE fastspace RELATIVE LOCATION 'tablespace/tablespace_1';\n  -- 2. Grant CREATE permission on tablespace\n  GRANT CREATE ON TABLESPACE fastspace TO jack;\n  -- 3. Create table in tablespace (or SET default_tablespace = 'fastspace';)\n  CREATE TABLE foo(i INT) TABLESPACE fastspace;\n  -- 4. Inspect tablespaces &amp; check size\n  \\db\n  SELECT * FROM pg_tablespace;\n  SELECT PG_TABLESPACE_SIZE('fastspace');\n  -- 5. Rename &amp; drop tablespace (owner or sysadmin only; must be empty)\n  ALTER TABLESPACE fastspace RENAME TO fspace;\n  DROP TABLESPACE fspace;<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Users vs. Roles (<code class=\"inline-code\">pg_authid<\/code>, <code class=\"inline-code\">PUBLIC<\/code>, Ch.04 Quiz Q1!)<\/h3>\n<ul class=\"md-list\">\n<li><strong>User vs. Role Distinction (pp. 312–315, 324, 346)<\/strong>:<\/li>\n<li><strong>User<\/strong>: An entity/individual that connects to the database (<code class=\"inline-code\">rolcanlogin = true<\/code> / <strong><code class=\"inline-code\">LOGIN<\/code> privilege enabled by default<\/strong>).<\/li>\n<li><strong>Role<\/strong>: A carrier of permission sets representing behavioral constraints (<strong>does NOT have <code class=\"inline-code\">LOGIN<\/code> permission by default<\/strong>).<\/li>\n<li><strong>CRITICAL EXAM FACT (Ch.04 Quiz Q1: False!)<\/strong>: Although <code class=\"inline-code\">CREATE USER<\/code> and <code class=\"inline-code\">CREATE ROLE<\/code> share the same syntax in openGauss, <strong>users and roles are NOT fully equivalent<\/strong> because <code class=\"inline-code\">CREATE USER<\/code> grants <code class=\"inline-code\">LOGIN<\/code> by default whereas <code class=\"inline-code\">CREATE ROLE<\/code> does not (<code class=\"inline-code\">NOLOGIN<\/code> by default)!<\/li>\n<li><strong>Implicit <code class=\"inline-code\">PUBLIC<\/code> Group (p. 313)<\/strong>: All new users and roles implicitly inherit permissions granted to <code class=\"inline-code\">PUBLIC<\/code> (use <code class=\"inline-code\">GRANT/REVO
