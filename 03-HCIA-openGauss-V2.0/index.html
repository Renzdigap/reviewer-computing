 **CPU**: At least one 8-core 2.0 GHz CPU (debugging) or 16-core 2.0 GHz CPU (commercial); 2 cores min (4 cores recommended) for individual developers. Supports **Kunpeng (ARM64)** and **x86_64**.\n- **Disk**: At least **1 GB** for application installation, **>= 300 MB** per host for data, and **> 70% free space** reserved for data storage. Recommended: **RAID 1 for system disk**, **4 groups of RAID 5 for data disks**, Disk Cache Policy = **Disabled**.\n- **Network**: >= 300 Mbit/s Ethernet (bond 2 NICs recommended). Recommended **MTU**: **1500 for x86**, **8192 for ARM (Kunpeng)**.\n- **OS & Software Dependencies**:\n  - **OS**: Arm (`openEuler 20.03/22.03 LTS`, `KylinOS`); x86 (`openEuler 20.03/22.03 LTS`, `CentOS 7.6`).\n  - **File system**: Remaining inodes **> 1.5 billion**.\n  - **Python**: **Python 3.7.x** on openEuler/KylinOS; **Python 3.6.x** on CentOS 7.6.\n  - **Packages**: `bzip2`, `libaio-devel` (0.3.109-13), `readline-devel` (7.0-13), `expect`.\n\n---\n\n### 3. Mandatory OS Configuration Changes & User Planning (pp. 86–91)\n1. **Disable SELinux & Firewall**: Set `SELINUX=disabled` in `/etc/selinux/config`, reboot, and run `systemctl disable firewalld.service && systemctl stop firewalld.service`.\n2. **Locale & Timezone**: Add `export LANG=en_US.UTF-8` to `/etc/profile`; copy `/usr/share/zoneinfo/Locale/Timezone` to `/etc/localtime` and sync time with `date -s`. Optional: `swapoff -a` to prevent buffer eviction.\n3. **Disable `RemoveIPC` (Critical on openEuler!)**: Set `RemoveIPC=no` in **both** `/etc/systemd/logind.conf` and `/usr/lib/systemd/system/systemd-logind.service`, then run `systemctl daemon-reload && systemctl restart systemd-logind`.\n4. **Enable Root SSH & Disable Banner**: In `/etc/ssh/sshd_config`, set `PermitRootLogin yes` and comment out `#Banner XXXX` (welcome banners interfere with remote installation scripts).\n5. **User & Group (`dbgrp` and `omm`)**: Create group `dbgrp` (`-G dbgrp`) and OS user `omm` (`-U omm`). During `gs_install`, a database superuser `omm` with the same name is created.","key_takeaways":["openGauss deployment modes are Single-node, One primary + one standby, and One primary + multiple standbys (up to 8 standbys; typically 1 primary + 2 standbys for 99.99% availability). Dual-primary is NOT supported.","On openEuler (ARM64), set RemoveIPC=no in both logind.conf and systemd-logind.service, disable SELinux and firewalld, comment out SSH Banner, and set NIC MTU to 8192 (1500 on x86).","System disk should use RAID 1, data disks should use 4 groups of RAID 5 with Disk Cache Policy Disabled, and remaining inodes should exceed 1.5 billion."],"exam_traps":["EXAM TRAP (Ch.03 Quiz Q1): 'Which of the following are the openGauss deployment modes?' -> A. Single-node, B. One primary and one standby, C. One primary and multiple standbys (ABC). D. Dual primary nodes is FALSE!","EXAM TRAP: Why comment out `Banner` in `/etc/ssh/sshd_config`? Because welcome banner text interferes with automated remote SSH operations during `gs_preinstall` and `gs_install`!"],"content_html":"<h3>1. Three Official openGauss Deployment Modes (pp. 77–81, Ch.03 Quiz Q1!)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Deployment Mode<\/th><th>Data Copies<\/th><th>HA / RPO / RTO<\/th><th>Key Characteristics &amp; Target Scenario<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>1. Standalone (Single-node)<\/strong><\/td><td><strong>1 copy<\/strong><\/td><td>No HA; RTO &amp; RPO uncontrollable<\/td><td>Single instance; lost instance data can only be restored from physical backup. For <strong>trial use, learning, and sandbox testing<\/strong> (not production).<\/td><\/tr>\n<tr><td><strong>2. Primary/Standby (1 Primary + 1 Standby)<\/strong><\/td><td><strong>2 copies<\/strong><\/td><td><strong>RPO = 0<\/strong>, Instance fault <strong>RTO &lt; 10s<\/strong><\/td><td>Primary supports Read/Write; Standby receives/replays WAL logs and supports <strong>Read-only<\/strong>. Protects against instance failure.<\/td><\/tr>\n<tr><td><strong>3. One Primary + Multiple Standbys (Quorum)<\/strong><\/td><td><strong>2 to 4 copies<\/strong> (typically 1P + 2S = <strong>3 copies<\/strong>; up to 8 standbys in v2.0+)<\/td><td><strong>RPO = 0<\/strong>, Instance fault <strong>RTO &lt; 10s<\/strong>, <strong>99.99% reliability<\/strong><\/td><td>Quorum replication synchronizes data to at least one standby node for max performance. Primary and standby nodes <strong>cannot<\/strong> be on the same physical machine.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<blockquote class=\"md-quote\"><strong>CRITICAL EXAM NOTE (Ch.03 Quiz Q1)<\/strong>: openGauss supports <strong>Single-node<\/strong>, <strong>One primary + one standby<\/strong>, and <strong>One primary + multiple standbys<\/strong>. It <strong>DOES NOT<\/strong> support \"Dual primary nodes\" deployment!<\/blockquote>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h2s1_standalone_deploy.png\" alt=\"openGauss Standalone Deployment Architecture\" data-caption=\"openGauss Standalone Deployment Architecture (Official Reference: p. 78)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Standalone Deployment Architecture<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 78 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h2s1_primary_standby.png\" alt=\"openGauss Primary/Standby Deployment Topology\" data-caption=\"openGauss Primary/Standby Deployment Topology (Official Reference: p. 79)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Primary/Standby Deployment Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 79 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h2s1_one_primary_multi_standby.png\" alt=\"openGauss One Primary and Multiple Standbys Topology\" data-caption=\"openGauss One Primary and Multiple Standbys Topology (Official Reference: p. 80)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss One Primary and Multiple Standbys Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 80 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Hardware &amp; Software Requirements (pp. 84–85)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Memory<\/strong>: <strong>&gt;= 32 GB<\/strong> for function debugging; <strong>&gt;= 128 GB<\/strong> for commercial/performance testing; <strong>4 GB min (8 GB recommended)<\/strong> for individual developers.<\/li>\n<li><strong>CPU<\/strong>: At least one 8-core 2.0 GHz CPU (debugging) or 16-core 2.0 GHz CPU (commercial); 2 cores min (4 cores recommended) for individual developers. Supports <strong>Kunpeng (ARM64)<\/strong> and <strong>x86_64<\/strong>.<\/li>\n<li><strong>Disk<\/strong>: At least <strong>1 GB<\/strong> for application installation, <strong>&gt;= 300 MB<\/strong> per host for data, and <strong>&gt; 70% free space<\/strong> reserved for data storage. Recommended: <strong>RAID 1 for system disk<\/strong>, <strong>4 groups of RAID 5 for data disks<\/strong>, Disk Cache Policy = <strong>Disabled<\/strong>.<\/li>\n<li><strong>Network<\/strong>: &gt;= 300 Mbit/s Ethernet (bond 2 NICs recommended). Recommended <strong>MTU<\/strong>: <strong>1500 for x86<\/strong>, <strong>8192 for ARM (Kunpeng)<\/strong>.<\/li>\n<li><strong>OS &amp; Software Dependencies<\/strong>:<\/li>\n<li><strong>OS<\/strong>: Arm (<code class=\"inline-code\">openEuler 20.03/22.03 LTS<\/code>, <code class=\"inline-code\">KylinOS<\/code>); x86 (<code class=\"inline-code\">openEuler 20.03/22.03 LTS<\/code>, <code class=\"inline-code\">CentOS 7.6<\/code>).<\/li>\n<li><strong>File system<\/strong>: Remaining inodes <strong>&gt; 1.5 billion<\/strong>.<\/li>\n<li><strong>Python<\/strong>: <strong>Python 3.7.x<\/strong> on openEuler/KylinOS; <strong>Python 3.6.x<\/strong> on CentOS 7.6.<\/li>\n<li><strong>Packages<\/strong>: <code class=\"inline-code\">bzip2<\/code>, <code class=\"inline-code\">libaio-devel<\/code> (0.3.109-13), <code class=\"inline-code\">readline-devel<\/code> (7.0-13), <code class=\"inline-code\">expect<\/code>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Mandatory OS Configuration Changes &amp; User Planning (pp. 86–91)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Disable SELinux &amp; Firewall<\/strong>: Set <code class=\"inline-code\">SELINUX=disabled<\/code> in <code class=\"inline-code\">/etc/selinux/config<\/code>, reboot, and run <code class=\"inline-code\">systemctl disable firewalld.service &amp;&amp; systemctl stop firewalld.service<\/code>.<\/li>\n<li><strong>Locale &amp; Timezone<\/strong>: Add <code class=\"inline-code\">export LANG=en_US.UTF-8<\/code> to <code class=\"inline-code\">/etc/profile<\/code>; copy <code class=\"inline-code\">/usr/share/zoneinfo/Locale/Timezone<\/code> to <code class=\"inline-code\">/etc/localtime<\/code> and sync time with <code class=\"inline-code\">date -s<\/code>. Optional: <code class=\"inline-code\">swapoff -a<\/code> to prevent buffer eviction.<\/li>\n<li><strong>Disable <code class=\"inline-code\">RemoveIPC<\/code> (Critical on openEuler!)<\/strong>: Set <code class=\"inline-code\">RemoveIPC=no<\/code> in <strong>both<\/strong> <code class=\"inline-code\">/etc/systemd/logind.conf<\/code> and <code class=\"inline-code\">/usr/lib/systemd/system/systemd-logind.service<\/code>, then run <code class=\"inline-code\">systemctl daemon-reload &amp;&amp; systemctl restart systemd-logind<\/code>.<\/li>\n<li><strong>Enable Root SSH &amp; Disable Banner<\/strong>: In <code class=\"inline-code\">/etc/ssh/sshd_config<\/code>, set <code class=\"inline-code\">PermitRootLogin yes<\/code> and comment out <code class=\"inline-code\">#Banner XXXX<\/code> (welcome banners interfere with remote installation scripts).<\/li>\n<li><strong>User &amp; Group (<code class=\"inline-code\">dbgrp<\/code> and <code class=\"inline-code\">omm<\/code>)<\/strong>: Create group <code class=\"inline-code\">dbgrp<\/code> (<code class=\"inline-code\">-G dbgrp<\/code>) and OS user <code class=\"inline-code\">omm<\/code> (<code class=\"inline-code\">-U omm<\/code>). During <code class=\"inline-code\">gs_install<\/code>, a database superuser <code class=\"inline-code\">omm<\/code> with the same name is created.<\/li>\n<\/ol>"},"exercise":{"title":"Hands-On Lab: Preparing openEuler OS Configurations for openGauss","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@opengauss:~#","scenario":"You are preparing a Kunpeng 920 (ARM64) server running openEuler 20.03 LTS for openGauss installation. Disable firewalld, disable `RemoveIPC`, set the ARM64 recommended MTU (8192) on `eth0`, and create the `dbgrp` group and `omm` user.","instructions":["Step 1: Disable and stop `firewalld.service` using `systemctl`.","Step 2: Configure `RemoveIPC=no` in `/etc/systemd/logind.conf` and restart `systemd-logind`.","Step 3: Set the `eth0` MTU to `8192` (recommended for ARM64) and create group `dbgrp` and user `omm` (`groupadd dbgrp && useradd -g dbgrp omm`)."],"starter_code":"# Step 1: Disable and stop firewalld\nsystemctl disable ____\nsystemctl stop firewalld.service\n\n# Step 2: Set RemoveIPC=no and reload systemd-logind\nsed -i 's/.*RemoveIPC.*/____/' /etc/systemd/logind.conf\nsystemctl daemon-reload && systemctl restart systemd-logind\n\n# Step 3: Set ARM64 MTU (8192) on eth0 and create dbgrp/omm\nifconfig eth0 mtu ____\ngroupadd ____ && useradd -g dbgrp ____\n","solution_code":"systemctl disable firewalld.service\nsystemctl stop firewalld.service\nsed -i 's/.*RemoveIPC.*/RemoveIPC=no/' /etc/systemd/logind.conf\nsystemctl daemon-reload && systemctl restart systemd-logind\nifconfig eth0 mtu 8192\ngroupadd dbgrp && useradd -g dbgrp omm","hints":["On openEuler, `RemoveIPC=no` must be set so systemd does not clean up IPC semaphores/shared memory when `omm` logs out.","For ARM (Kunpeng), the recommended NIC MTU is 8192 (for x86 it is 1500).","The standard OS group is `dbgrp` and the OS user is `omm`."],"validation_checks":[{"step":1,"description":"Disable `firewalld`","required_any":["disable firewalld"],"feedback_fail":"Run `systemctl disable firewalld.service`."},{"step":2,"description":"Set `RemoveIPC=no`","required_any":["removeipc=no"],"feedback_fail":"Set `RemoveIPC=no` in `/etc/systemd/logind.conf`."},{"step":3,"description":"Set MTU to `8192` and create `dbgrp` and `omm`","required_any":["mtu 8192"],"feedback_fail":"Set `ifconfig eth0 mtu 8192` and create `dbgrp` and `omm`."}],"simulated_output":"Removed /etc/systemd/system/multi-user.target.wants/firewalld.service.\nRemoveIPC=no\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 8192\nuid=1000(omm) gid=1000(dbgrp) groups=1000(dbgrp)","quiz_questions":[{"id":"h2_s1_q1","type":"multiple","question":"(Official Ch.03 Quiz Q1) Which of the following are the openGauss deployment modes?","options":["A. Single-node deployment","B. Deployment with one primary and one standby","C. Deployment with one primary and multiple standbys","D. Deployment with dual primary nodes"],"answer":"ABC","explanation":"Per Chapter 02 (p. 77) and Chapter 03 Quiz Q1 (p. 268), openGauss supports single-node deployment, one primary and one standby, and one primary and multiple standbys. Dual-primary deployment is NOT supported."},{"id":"h2_s1_q2","type":"single","question":"When configuring the network interface card (NIC) MTU on openGauss database nodes, what are the recommended MTU values for x86 and ARM (Kunpeng) architectures respectively?","options":["A. 1500 for x86; 1500 for ARM","B. 1500 for x86; 8192 for ARM","C. 8192 for x86; 1500 for ARM","D. 9000 for x86; 4096 for ARM"],"answer":"B","explanation":"Per Chapter 02 (p. 89), for x86 the recommended MTU value is 1500, and for ARM (Kunpeng) the recommended MTU value is 8192."},{"id":"h2_s1_q3","type":"tf","question":"In openGauss one-primary-two-standby deployment, the primary and standby nodes can be deployed on the same physical machine in production to save hardware costs.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.02 p. 81). The primary and standby nodes cannot be deployed on the same physical machine because a single physical host failure would take down multiple copies."}],"reference_figures":[{"slug":"p3_h2s1_one_primary_multi_standby","title":"openGauss One Primary and Multiple Standbys Topology","pdf_page":80}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Installing-Starting-Stopping-and-Uninstalling-openGauss","exercise_slug":"04-Exercise-Installation-Lifecycle-and-Uninstallation-Lab","lecture":{"title":"Installing (`install.sh` / `gs_preinstall` / `gs_install`), Starting/Stopping & Uninstalling openGauss","duration_mins":7,"pdf_ref":"Ch.02, pp. 82–94, 124–127","objectives":["Verify all 4 official prerequisites for single-node openGauss installation (Ch.02 Quiz Q3)","Execute both Simplified Single-Node Installation (`sh install.sh -w`) and Standard Enterprise XML Installation (`gs_preinstall` + `gs_install`)","Start and stop openGauss (`gs_om -t start/stop`) and cleanly uninstall (`gs_uninstall --delete-data` + `gs_postuninstall`)"],"content_markdown":"### 1. Single-Node Installation Prerequisites & Procedure (pp. 92–93, Ch.02 Quiz Q3!)\nBefore installing openGauss on a single node, **four prerequisites** must be met (exact **Ch.02 Quiz Q3: ABCD**):\n1. **Users & OS/Network**: A user group and a common user have been created, and all server OSs and networks are functioning properly.\n2. **Directory Permissions**: Common users must have **read, write, and execute (`rwx`)** permissions on the database package decompression directory and installation directory, and the **installation directory must be empty**.\n3. **Package Permission**: Common users have the **execution permission** for the downloaded openGauss package.\n4. **Port Check**: Before installation, check whether the specified openGauss port is occupied. If occupied, change the port number or stop the process using the port.\n\n#### Simplified Single-Node Installation Procedure (`simpleInstall/install.sh`):\n```bash\n# 1. Decompress as common user (omm)\ntar -jxf openGauss-2.0.0-openEuler-64bit.tar.bz2 -C /opt/software/openGauss\n# 2. Go to simpleInstall directory and run install.sh\ncd /opt/software/openGauss/simpleInstall\nsh install.sh -w Huawei@123 -p 5432\n```\n- **`-w`**: Initializes the database password (passed to `gs_initdb`). **Mandatory** for security!\n- **`-p`**: Specifies the openGauss port (**default is `5432`** if not specified).\n- After installation, the default instance name is **`sgnode`**, and the data directory is `/opt/software/openGauss/data/single_node`.\n- **Verification**:\n  - `ps ux | grep gaussdb`\n  - `gs_ctl query -D /opt/software/openGauss/data/single_node` (shows `local_role: Normal`, `db_state: Normal`).\n\n---\n\n### 2. Standard Enterprise XML Installation & Start/Stop Lifecycle (pp. 82, 94)\n1. **Standard Flow**: Prepare OS -> Obtain package -> Configure **XML file** -> Decompress -> Run **`gs_preinstall`** (as `root` to initialize environment, check permissions, and create `omm`/`dbgrp`) -> Switch to `omm` and run **`gs_install -X clusterconfig.xml`** -> (Optional) Set standby node to readable.\n2. **Starting and Stopping openGauss (as `omm`)**:\n   - **Start cluster**: `gs_om -t start` (default timeout is **300s**; customize via `gs_om -t start --time-out=300`).\n   - **Stop cluster**: `gs_om -t stop`\n   - *Note*: An HA cluster must be started in HA mode. If started in standalone mode, restore the HA relationship using `gs_ctl build`.\n<!-- PDF_FIGS_START -->\n![openGauss End-to-End Installation Pipeline (Official Reference: p. 82)](./assets/images/p3_h2s1_install_flowchart.png)\n*Figure: openGauss End-to-End Installation Pipeline (Official Reference: p. 82)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Uninstalling openGauss & Cleaning Up the Environment (pp. 124–125)\nUninstallation is a two-phase process:\n1. **Phase 1 — Uninstall openGauss Application (as OS user `omm`)**:\n   - Cluster-wide uninstallation: `gs_uninstall --delete-data`\n   - Local single-node uninstallation: `gs_uninstall --delete-data -L`\n   - Logs are saved to `GAUSSLOG/om/gs_uninstall-YYYY-MM-DD_HHMMSS.log`.\n2. **Phase 2 — One-Click Environment Cleanup (as user `root` ONLY)**:\n   - Run **`gs_postuninstall -U omm -X clusterconfig.xml --delete-user --delete-group`** to clean up the OS environment settings made by `gs_preinstall`.","key_takeaways":["All 4 items in Ch.02 Quiz Q3 (user/group & OS/network, rwx on decompression & empty install dir, execute permission on package, and checking if the port is occupied) are mandatory prerequisites for single-node installation.","In simplified single-node installation (`sh install.sh -w <password>`), `-w` is mandatory, `-p` defaults to 5432, the database name is `sgnode`, and the data directory is `data/single_node`.","Uninstallation requires `gs_uninstall --delete-data` run as `omm`, followed by `gs_postuninstall` run as `root`."],"exam_traps":["EXAM TRAP (Ch.02 Quiz Q3): All four options (A, B, C, D) are correct prerequisites for installing openGauss on a single node!","EXAM TRAP: Only `root` is authorized to run `gs_preinstall`, `gs_checkos`, and `gs_postuninstall`, whereas `omm` runs `gs_install`, `gs_om`, and `gs_uninstall`."],"content_html":"<h3>1. Single-Node Installation Prerequisites &amp; Procedure (pp. 92–93, Ch.02 Quiz Q3!)<\/h3>\n<p>Before installing openGauss on a single node, <strong>four prerequisites<\/strong> must be met (exact <strong>Ch.02 Quiz Q3: ABCD<\/strong>):<\/p>\n<ol class=\"md-list\">\n<li><strong>Users &amp; OS/Network<\/strong>: A user group and a common user have been created, and all server OSs and networks are functioning properly.<\/li>\n<li><strong>Directory Permissions<\/strong>: Common users must have <strong>read, write, and execute (<code class=\"inline-code\">rwx<\/code>)<\/strong> permissions on the database package decompression directory and installation directory, and the <strong>installation directory must be empty<\/strong>.<\/li>\n<li><strong>Package Permission<\/strong>: Common users have the <strong>execution permission<\/strong> for the downloaded openGauss package.<\/li>\n<li><strong>Port Check<\/strong>: Before installation, check whether the specified openGauss port is occupied. If occupied, change the port number or stop the process using the port.<\/li>\n<\/ol>\n<h4>Simplified Single-Node Installation Procedure (<code class=\"inline-code\">simpleInstall/install.sh<\/code>):<\/h4>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code># 1. Decompress as common user (omm)\ntar -jxf openGauss-2.0.0-openEuler-64bit.tar.bz2 -C /opt/software/openGauss\n# 2. Go to simpleInstall directory and run install.sh\ncd /opt/software/openGauss/simpleInstall\nsh install.sh -w Huawei@123 -p 5432<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">-w<\/code><\/strong>: Initializes the database password (passed to <code class=\"inline-code\">gs_initdb<\/code>). <strong>Mandatory<\/strong> for security!<\/li>\n<li><strong><code class=\"inline-code\">-p<\/code><\/strong>: Specifies the openGauss port (<strong>default is <code class=\"inline-code\">5432<\/code><\/strong> if not specified).<\/li>\n<li>After installation, the default instance name is <strong><code class=\"inline-code\">sgnode<\/code><\/strong>, and the data directory is <code class=\"inline-code\">/opt/software/openGauss/data/single_node<\/code>.<\/li>\n<li><strong>Verification<\/strong>:<\/li>\n<li><code class=\"inline-code\">ps ux | grep gaussdb<\/code><\/li>\n<li><code class=\"inline-code\">gs_ctl query -D /opt/software/openGauss/data/single_node<\/code> (shows <code class=\"inline-code\">local_role: Normal<\/code>, <code class=\"inline-code\">db_state: Normal<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Standard Enterprise XML Installation &amp; Start/Stop Lifecycle (pp. 82, 94)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Standard Flow<\/strong>: Prepare OS -&gt; Obtain package -&gt; Configure <strong>XML file<\/strong> -&gt; Decompress -&gt; Run <strong><code class=\"inline-code\">gs_preinstall<\/code><\/strong> (as <code class=\"inline-code\">root<\/code> to initialize environment, check permissions, and create <code class=\"inline-code\">omm<\/code>/<code class=\"inline-code\">dbgrp<\/code>) -&gt; Switch to <code class=\"inline-code\">omm<\/code> and run <strong><code class=\"inline-code\">gs_install -X clusterconfig.xml<\/code><\/strong> -&gt; (Optional) Set standby node to readable.<\/li>\n<li><strong>Starting and Stopping openGauss (as <code class=\"inline-code\">omm<\/code>)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Start cluster<\/strong>: <code class=\"inline-code\">gs_om -t start<\/code> (default timeout is <strong>300s<\/strong>; customize via <code class=\"inline-code\">gs_om -t start --time-out=300<\/code>).<\/li>\n<li><strong>Stop cluster<\/strong>: <code class=\"inline-code\">gs_om -t stop<\/code><\/li>\n<li><em>Note<\/em>: An HA cluster must be started in HA mode. If started in standalone mode, restore the HA relationship using <code class=\"inline-code\">gs_ctl build<\/code>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h2s1_install_flowchart.png\" alt=\"openGauss End-to-End Installation Pipeline\" data-caption=\"openGauss End-to-End Installation Pipeline (Official Reference: p. 82)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss End-to-End Installation Pipeline<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 82 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Uninstalling openGauss &amp; Cleaning Up the Environment (pp. 124–125)<\/h3>\n<p>Uninstallation is a two-phase process:<\/p>\n<ol class=\"md-list\">\n<li><strong>Phase 1 — Uninstall openGauss Application (as OS user <code class=\"inline-code\">omm<\/code>)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Cluster-wide uninstallation: <code class=\"inline-code\">gs_uninstall --delete-data<\/code><\/li>\n<li>Local single-node uninstallation: <code class=\"inline-code\">gs_uninstall --delete-data -L<\/code><\/li>\n<li>Logs are saved to <code class=\"inline-code\">GAUSSLOG/om/gs_uninstall-YYYY-MM-DD_HHMMSS.log<\/code>.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Phase 2 — One-Click Environment Cleanup (as user <code class=\"inline-code\">root<\/code> ONLY)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Run <strong><code class=\"inline-code\">gs_postuninstall -U omm -X clusterconfig.xml --delete-user --delete-group<\/code><\/strong> to clean up the OS environment settings made by <code class=\"inline-code\">gs_preinstall<\/code>.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Single-Node Installation, Status Verification & Uninstallation","duration_mins":8,"exercise_type":"terminal","prompt_label":"omm@opengauss:~","scenario":"Perform a simplified single-node installation of openGauss using `install.sh`, verify the instance state with `gs_ctl query`, start/stop the cluster with `gs_om`, and write the uninstallation command.","instructions":["Step 1: Run `sh install.sh -w Kunpeng@2026` inside `/opt/software/openGauss/simpleInstall`.","Step 2: Query the instance status using `gs_ctl query -D /opt/software/openGauss/data/single_node`.","Step 3: Start the cluster using `gs_om -t start` and write the command to uninstall openGauss and delete data (`gs_uninstall --delete-data`)."],"starter_code":"# Step 1: Run simplified single-node installation with initial password\ncd /opt/software/openGauss/simpleInstall\nsh install.sh ____ Kunpeng@2026\n\n# Step 2: Check instance HA state using gs_ctl\ngs_ctl ____ -D /opt/software/openGauss/data/single_node\n\n# Step 3: Start cluster and show uninstall command\ngs_om -t ____\n# To uninstall as omm:\ngs_uninstall ____\n","solution_code":"cd /opt/software/openGauss/simpleInstall\nsh install.sh -w Kunpeng@2026\ngs_ctl query -D /opt/software/openGauss/data/single_node\ngs_om -t start\ngs_uninstall --delete-data","hints":["Use `-w` with `install.sh` to specify the mandatory initial database password.","Use `gs_ctl query -D <datadir>` to check the HA state of the node.","Use `gs_om -t start` to start openGauss and `gs_uninstall --delete-data` to uninstall it."],"validation_checks":[{"step":1,"description":"Install openGauss with `sh install.sh -w`","required_any":["install.sh -w"],"feedback_fail":"Pass the `-w` flag to `sh install.sh` to initialize the database password."},{"step":2,"description":"Query instance state with `gs_ctl query -D`","required_any":["gs_ctl query"],"feedback_fail":"Run `gs_ctl query -D /opt/software/openGauss/data/single_node`."},{"step":3,"description":"Include `gs_om -t start` and `gs_uninstall --delete-data`","required_any":["--delete-data"],"feedback_fail":"Include `gs_om -t start` and `gs_uninstall --delete-data`."}],"simulated_output":"[step 1]: check parameter\n[step 2]: start install openGauss\n[step 3]: initdb success, datadir is /opt/software/openGauss/data/single_node\ngs_ctl query ,datadir is /opt/software/openGauss/data/single_node\n HA state:\n        local_role                     : Normal\n        static_connections             : 0\n        db_state                       : Normal\nStarting cluster.\n=========================================\nSuccessfully started.","quiz_questions":[{"id":"h2_s2_q1","type":"multiple","question":"(Official Ch.02 Quiz Q3) Which of the following are the prerequisites for installing openGauss on a single node?","options":["A. User groups and common users have been created, and the operating systems and networks of all servers are running properly.","B. Common users must have the read, write, and execute permissions on the database package decompression directory and installation directory, and the installation directory must be empty.","C. A common user has the execution permission on the downloaded openGauss package.","D. Before the installation, check whether the specified openGauss port is occupied. If the port is occupied, change the port number or stop the process that uses the port."],"answer":"ABCD","explanation":"Per Chapter 02 (p. 92 & p. 127), all four options (A, B, C, and D) are mandatory prerequisites for installing openGauss on a single node."},{"id":"h2_s2_q2","type":"single","question":"When running `sh install.sh` in `simpleInstall` to deploy a single-node openGauss instance without specifying `-p`, what is the default port and default database node name created?","options":["A. Port 3306, node name mysqld","B. Port 5432, node name sgnode","C. Port 1521, node name orcl","D. Port 26000, node name dn_6001"],"answer":"B","explanation":"Per Chapter 02 (p. 92), if `-p` is not specified in `install.sh`, the default port is 5432 and the database node name after installation is `sgnode`."},{"id":"h2_s2_q3","type":"tf","question":"After `gs_uninstall` is executed by user `omm`, any common OS user can run `gs_postuninstall` to clean up the OS environment settings made by `gs_preinstall`.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.02 p. 125). Only user `root` is authorized to run the `gs_postuninstall` command."}],"reference_figures":[{"slug":"p3_h2s1_install_flowchart","title":"openGauss End-to-End Installation Pipeline","pdf_page":82}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Client-Authentication-pg-hba-and-gsql-Connections","exercise_slug":"06-Exercise-pg-hba-Auth-and-gsql-Connection-Lab","lecture":{"title":"Client Authentication (`pg_hba.conf`), `postgresql.conf` & `gsql` Connections","duration_mins":7,"pdf_ref":"Ch.02, pp. 95–100","objectives":["Configure client authentication policies in `pg_hba.conf` using `gs_guc set` and `gs_guc reload`","Distinguish `HOSTTYPE` (`local`, `host`, `hostssl`, `hostnossl`) and `AUTHMETHOD` (`sha256`, `md5`, `trust`, `reject`, `cert`, `gss`)","Inspect node IP and port (`gs_om -t status --detail`, `postgresql.conf`) and connect via `gsql`"],"content_markdown":"### 1. Setting Client Authentication Policies in `pg_hba.conf` (p. 96, 118)\nBy default, parameters in `pg_hba.conf` and `postgresql.conf` are configured for standalone local access. Use **`gs_guc`** (as user `omm`) to modify parameters or host-based authentication policies:\n```bash\ngs_guc [ set | reload ] [-N NODE-NAME] [-I INSTANCE-NAME | -D DATADIR] \\\n  -h \"HOSTTYPE DATABASE USERNAME IPADDR-WITH-IPMASK AUTHMETHOD [authentication-options]\"\n```\n- **`set` vs. `reload`**:\n  - **`set`**: Modifies **only** the parameter in the configuration file (requires restart or reload later).\n  - **`reload`**: Modifies the parameter in the configuration file **AND sends semaphores (signals) to the database process** to reload the configuration file immediately without restarting!\n  - *Removing a policy*: Omit `AUTHMETHOD`/`authentication-options` in `gs_guc ... -h \"...\"` to comment out an existing line in `pg_hba.conf`.\n\n| Parameter | Supported Values & Technical Meaning |\n| :--- | :--- |\n| **`HOSTTYPE`** | **`local`** (Unix domain socket), **`host`** (plain or SSL TCP/IP socket), **`hostssl`** (SSL-encrypted TCP/IP socket only), **`hostnossl`** (non-SSL TCP/IP socket only). |\n| **`AUTHMETHOD`** | **`sha256`** (SHA-256 password hash, **recommended**), **`md5`** (MD5 hash, not supported by default), **`trust`** (no password check; **remote hosts are NOT allowed to use `trust`**), **`reject`** (unconditionally reject connection), **`cert`** (SSL client certificate), **`gss`** (Kerberos authentication). |\n\n---\n\n### 2. Confirming Connection Info & Connecting with `gsql` (pp. 97–99)\n1. **Query Primary Node IP & Data Directory**:\n   ```bash\n   gs_om -t status --detail\n   ```\n2. **Check Port in `postgresql.conf`**:\n   ```bash\n   cat /srv/BigData/gaussdb/data1/dbnode/postgresql.conf | grep port\n   # port = 8000 (or 5432 in simpleInstall)\n   ```\n3. **Connect Locally or Remotely with `gsql`**:\n   ```bash\n   gsql -d postgres -p 8000\n   # Remote connection: gsql -h 192.168.0.11 -d postgres -p 8000 -U jack -W Bigdata@123\n   ```\n   - **Prompt Indicator**: Logging in as administrator `omm` displays **`postgres=#`** (`#` = superuser/admin); logging in as a common user displays **`postgres=>`** (`>` = normal user).\n   - **Timeouts**:\n     - **`session_timeout`**: Automatically disconnects an idle client session (set `session_timeout = 0` to disable idle timeouts).\n     - **`gsql` connection timeout**: Fixed at **5 minutes** when establishing a connection and authenticating.\n   - **Change Password & Exit**:\n     ```sql\n     ALTER ROLE omm IDENTIFIED BY 'NewPass@2026' REPLACE 'OldPass@2012';\n     \\q\n     ```","key_takeaways":["`gs_guc set` only writes to the config file, whereas `gs_guc reload` writes to the config file AND signals the database process to reload immediately.","In `pg_hba.conf`, `sha256` is the recommended authentication method; `trust` is only allowed for local connections (remote hosts cannot use `trust`).","In `gsql`, `DBNAME=#` indicates an administrator (`omm`) prompt, whereas `DBNAME=>` indicates a common user prompt."],"exam_traps":["EXAM TRAP: Remote hosts are NOT allowed to access openGauss using `trust` mode in `pg_hba.conf`! Remote connections must use `sha256` (recommended), `cert`, or `gss`.","EXAM TRAP: System catalogs store structured metadata of openGauss. Never manually add, delete, or modify system catalogs, as doing so causes metadata inconsistency or database unavailability (Ch.02 p. 100)."],"content_html":"<h3>1. Setting Client Authentication Policies in <code class=\"inline-code\">pg_hba.conf<\/code> (p. 96, 118)<\/h3>\n<p>By default, parameters in <code class=\"inline-code\">pg_hba.conf<\/code> and <code class=\"inline-code\">postgresql.conf<\/code> are configured for standalone local access. Use <strong><code class=\"inline-code\">gs_guc<\/code><\/strong> (as user <code class=\"inline-code\">omm<\/code>) to modify parameters or host-based authentication policies:<\/p>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>gs_guc [ set | reload ] [-N NODE-NAME] [-I INSTANCE-NAME | -D DATADIR] \\\n  -h \"HOSTTYPE DATABASE USERNAME IPADDR-WITH-IPMASK AUTHMETHOD [authentication-options]\"<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">set<\/code> vs. <code class=\"inline-code\">reload<\/code><\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">set<\/code><\/strong>: Modifies <strong>only<\/strong> the parameter in the configuration file (requires restart or reload later).<\/li>\n<li><strong><code class=\"inline-code\">reload<\/code><\/strong>: Modifies the parameter in the configuration file <strong>AND sends semaphores (signals) to the database process<\/strong> to reload the configuration file immediately without restarting!<\/li>\n<li><em>Removing a policy<\/em>: Omit <code class=\"inline-code\">AUTHMETHOD<\/code>/<code class=\"inline-code\">authentication-options<\/code> in <code class=\"inline-code\">gs_guc ... -h \"...\"<\/code> to comment out an existing line in <code class=\"inline-code\">pg_hba.conf<\/code>.<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Parameter<\/th><th>Supported Values &amp; Technical Meaning<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">HOSTTYPE<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">local<\/code><\/strong> (Unix domain socket), <strong><code class=\"inline-code\">host<\/code><\/strong> (plain or SSL TCP/IP socket), <strong><code class=\"inline-code\">hostssl<\/code><\/strong> (SSL-encrypted TCP/IP socket only), <strong><code class=\"inline-code\">hostnossl<\/code><\/strong> (non-SSL TCP/IP socket only).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">AUTHMETHOD<\/code><\/strong><\/td><td><strong><code class=\"inline-code\">sha256<\/code><\/strong> (SHA-256 password hash, <strong>recommended<\/strong>), <strong><code class=\"inline-code\">md5<\/code><\/strong> (MD5 hash, not supported by default), <strong><code class=\"inline-code\">trust<\/code><\/strong> (no password check; <strong>remote hosts are NOT allowed to use <code class=\"inline-code\">trust<\/code><\/strong>), <strong><code class=\"inline-code\">reject<\/code><\/strong> (unconditionally reject connection), <strong><code class=\"inline-code\">cert<\/code><\/strong> (SSL client certificate), <strong><code class=\"inline-code\">gss<\/code><\/strong> (Kerberos authentication).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Confirming Connection Info &amp; Connecting with <code class=\"inline-code\">gsql<\/code> (pp. 97–99)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Query Primary Node IP &amp; Data Directory<\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   gs_om -t status --detail<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong>Check Port in <code class=\"inline-code\">postgresql.conf<\/code><\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   cat /srv/BigData/gaussdb/data1/dbnode/postgresql.conf | grep port\n   # port = 8000 (or 5432 in simpleInstall)<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong>Connect Locally or Remotely with <code class=\"inline-code\">gsql<\/code><\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   gsql -d postgres -p 8000\n   # Remote connection: gsql -h 192.168.0.11 -d postgres -p 8000 -U jack -W Bigdata@123<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Prompt Indicator<\/strong>: Logging in as administrator <code class=\"inline-code\">omm<\/code> displays <strong><code class=\"inline-code\">postgres=#<\/code><\/strong> (<code class=\"inline-code\">#<\/code> = superuser/admin); logging in as a common user displays <strong><code class=\"inline-code\">postgres=&gt;<\/code><\/strong> (<code class=\"inline-code\">&gt;<\/code> = normal user).<\/li>\n<li><strong>Timeouts<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">session_timeout<\/code><\/strong>: Automatically disconnects an idle client session (set <code class=\"inline-code\">session_timeout = 0<\/code> to disable idle timeouts).<\/li>\n<li><strong><code class=\"inline-code\">gsql<\/code> connection timeout<\/strong>: Fixed at <strong>5 minutes<\/strong> when establishing a connection and authenticating.<\/li>\n<li><strong>Change Password &amp; Exit<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>     ALTER ROLE omm IDENTIFIED BY 'NewPass@2026' REPLACE 'OldPass@2012';\n     \\q<\/code><\/pre><\/div>"},"exercise":{"title":"Hands-On Lab: Configuring `pg_hba.conf` via `gs_guc` and Connecting with `gsql`","duration_mins":8,"exercise_type":"terminal","prompt_label":"omm@opengauss:~","scenario":"You need to allow remote client `10.252.95.191/32` to connect to all databases as user `testuser` using `sha256` authentication without restarting the database, then connect to the default `postgres` database on port `8000` using `gsql`.","instructions":["Step 1: Check detailed cluster node status and data directory using `gs_om -t status --detail`.","Step 2: Use `gs_guc reload -N all -I all -h \"host all testuser 10.252.95.191/32 sha256\"` to add and immediately reload the client authentication rule.","Step 3: Connect to the `postgres` database on port `8000` using `gsql -d postgres -p 8000`."],"starter_code":"# Step 1: Query detailed cluster instance status\ngs_om -t status ____\n\n# Step 2: Dynamically add and reload pg_hba.conf rule for testuser with sha256\ngs_guc ____ -N all -I all -h \"host all testuser 10.252.95.191/32 ____\"\n\n# Step 3: Connect to the default postgres database on port 8000\n____ -d postgres -p 8000\n","solution_code":"gs_om -t status --detail\ngs_guc reload -N all -I all -h \"host all testuser 10.252.95.191/32 sha256\"\ngsql -d postgres -p 8000","hints":["Use `--detail` with `gs_om -t status` to display the node IP and instance data directory.","Use `gs_guc reload` (instead of `set`) so semaphores are sent to reload `pg_hba.conf` immediately, and specify `sha256`.","Use `gsql -d postgres -p 8000` to connect."],"validation_checks":[{"step":1,"description":"Check detailed status with `gs_om -t status --detail`","required_any":["status --detail"],"feedback_fail":"Include `gs_om -t status --detail`."},{"step":2,"description":"Reload `pg_hba.conf` with `gs_guc reload` and `sha256`","required_any":["gs_guc reload"],"feedback_fail":"Use `gs_guc reload` to update and reload `pg_hba.conf`."},{"step":3,"description":"Specify `sha256` and connect with `gsql -d postgres -p 8000`","required_any":["gsql -d postgres -p 8000"],"feedback_fail":"Connect using `gsql -d postgres -p 8000`."}],"simulated_output":"[   DBnode State   ]\nnode    node_ip         instance                                 state\n-----------------------------------------------------------------------------\n1 plat1 192.168.0.11    5001 /srv/BigData/gaussdb/data1/dbnode   Normal\n\nTotal instances: 1. Failed instances: 0.\nSuccess to perform gs_guc!\n\ngsql ((openGauss 2.0.0 build 78689da9) compiled at 2021-03-31 21:03:52 commit 0 last mr)\nNon-SSL connection (SSL connection is recommended when requiring high-security)\nType \"help\" for help.\npostgres=#","quiz_questions":[{"id":"h2_s3_q1","type":"single","question":"What is the difference between `gs_guc set` and `gs_guc reload` when modifying openGauss parameters?","options":["A. `set` modifies `pg_hba.conf`, while `reload` modifies `postgresql.conf`","B. `set` modifies only the configuration file, while `reload` modifies the configuration file and sends semaphores to the database process to reload it immediately","C. `set` is executed by `root`, while `reload` is executed by `omm`","D. `set` restarts the database cluster automatically, while `reload` stops the cluster"],"answer":"B","explanation":"Per Chapter 02 (p. 96), `set` modifies only parameters in the configuration file, whereas `reload` modifies the parameters in the configuration file and sends semaphores to the database process for reloading the configuration file."},{"id":"h2_s3_q2","type":"single","question":"When connecting to openGauss via `gsql`, what does the prompt `postgres=#` versus `postgres=>` indicate?","options":["A. `=#` indicates an SSL connection; `=>` indicates a Non-SSL connection","B. `=#` indicates login as database administrator (`omm`); `=>` indicates login as a common user","C. `=#` indicates the primary node; `=>` indicates the standby node","D. `=#` indicates interactive mode; `=>` indicates script batch mode"],"answer":"B","explanation":"Per Chapter 02 (p. 98), if you log in as administrator `omm`, `DBNAME=#` is displayed; if you log in as a common user, `DBNAME=>` is displayed."},{"id":"h2_s3_q3","type":"tf","question":"In openGauss `pg_hba.conf`, remote hosts can be configured with the `trust` authentication option to allow passwordless remote connections.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.02 p. 96 & p. 118). Remote hosts are NOT allowed to access openGauss in `trust` mode for security reasons."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-openGauss-Client-and-Server-OM-Tools","exercise_slug":"08-Exercise-Server-Inspection-and-Backup-Tools-Lab","lecture":{"title":"openGauss Client & Server O&M Tools (`gsql`, `gs_check*`, `gs_dump*`, `gs_om`, `gs_ssh`)","duration_mins":7,"pdf_ref":"Ch.02, pp. 101–126","objectives":["Distinguish openGauss Client Tools (`gsql`) from Server Tools (`gs_check`, `gs_checkos`, `gs_checkperf`, `gs_clean`, `gs_collector`, `gs_dump`, `gs_dumpall`, `gs_guc`, `gs_om`, `gs_restore`, `gs_ssh`)","Identify which tool and check item require `root` privileges (`gs_checkos`, `gs_checkperf -i SSD`)","Master the key options of `gs_check`, `gs_checkos`, `gs_checkperf`, `gs_clean`, `gs_collector`, `gs_dump`, `gs_dumpall`, `gs_restore`, `gs_om`, and `gs_ssh`"],"content_markdown":"### 1. Client Tools vs. Server Tools Classification (pp. 102–104, Ch.02 Quiz Q1!)\nAll tools are located in `GPHOME/script` and `GAUSSHOME/bin`.\n- **Client Tool (ONLY ONE in this table!)**:\n  - **`gsql`**: CLI database connection tool used by clients to connect to the server, run interactive/scripted SQL statements, and execute meta-commands (`\\l`, `\\c`, `\\dt`, `\\d`, `\\q`). **(`gsql` is NOT a server tool — exact Ch.02 Quiz Q1: C!)**\n- **11 Server Tools (p. 104)**:\n  1. **`gs_check`**: Comprehensive environment check (OS, network, DB runtime) before major operations. Must specify **`-i ITEM`** (single item, e.g., `-i CheckCPU`) or **`-e SCENE_NAME`** (scenario: `inspect`, `upgrade`, `binary_upgrade`, `health`, `install`). Use `--skip-root-items` to skip root checks.\n  2. **`gs_checkos`**: Checks OS version, kernel parameters, disk/I/O/network settings, and THP. **Only `root` is authorized to run `gs_checkos`!**\n     - `-i A1..A14`: **Checks** OS parameters without modifying them.\n     - `-i B1..B8`: **Sets** OS parameters to expected values (A and B items cannot be used simultaneously; `-f` and `-h` cannot be used together).\n  3. **`gs_checkperf`**: Routinely checks performance at 4 levels:\n     - **openGauss level** (Host/GaussDB CPU usage, shared memory hit rate, in-memory sort ratio, I/O, disk, transaction stats) — run as `omm` (`-i PMK`). *Note*: If PMK statistics are missing, run `ANALYZE pmk.pmk_snapshot;` etc.\n     - **Host level** (CPU, memory, I/O usage) — run as `omm`.\n     - **Session/Process level** (CPU, memory, shared buffer hits) — run as `omm`.\n     - **SSD performance** (read every 7s / write every 10s via `dd flag=direct bs=8M count=2560`) — **Can be viewed ONLY by user `root` (`gs_checkperf -U omm -i SSD`)! (Exact Ch.02 Quiz Q2: D!)**\n  4. **`gs_clean`**: Connects to the primary DN and clears residual temporary tables (`-a`/`--all`, `-e`/`--exclusive`) or rolls back abnormal two-phase transactions (`-r`/`--rollback`) after an unexpected crash. Default concurrency `-j` is 3 (range 1–10).\n  5. **`gs_collector`**: Collects OS info, logs, and config files (`--begin-time`, `--end-time`, `--keyword`, `-C CONFIGFILE`) into a `.tar.gz` package when openGauss is faulty (depends on `gstack`).\n  6. **`gs_dump`**: Exports a **single database** or its objects (schemas, tables, views) consistently without blocking user R/W (acquires shared lock; tune wait via `--lock-wait-timeout`). Supports 4 formats via **`-F`**:\n     - **`p` (Plain-text SQL)**: Restore with **`gsql`** (recommended for small DBs).\n     - **`c` (Custom binary)**: Medium compression by default; restore with **`gs_restore`** (recommended for medium/large DBs).\n     - **`d` (Directory)** & **`t` (`.tar` archive, max 8 GB per table)**: Restore with **`gs_restore`**.\n  7. **`gs_dumpall`**: Exports **all databases** in the cluster + **global objects** (roles/users, tablespaces, global permissions) as a **plain-text SQL script** (restore with **`gsql`**).\n  8. **`gs_guc`**: Modifies `postgresql.conf` / `pg_hba.conf` (`check`, `set`, `reload`, `encrypt -M server|client|source` generating `.key.cipher` and `.key.rand`).\n  9. **`gs_om`**: Cluster lifecycle & config maintenance (`-t start | stop | restart | status | generateconf | refreshconf | view | query | cert | kerberos`).\n  10. **`gs_restore`**: Imports custom (`c`), directory (`d`), or `.tar` (`t`) archives exported by `gs_dump`. Imports incrementally by default; use **`-c`** to clean/drop existing objects before recreating.\n  11. **`gs_ssh`**: Runs the same Linux shell command synchronously across all cluster nodes (`gs_ssh -c \"cmd\"`).","key_takeaways":["`gsql` is a Client tool, NOT a Server tool (Ch.02 Quiz Q1).","When using `gs_checkperf`, SSD performance (`-i SSD`) can be viewed ONLY by user `root` (Ch.02 Quiz Q2). Similarly, `gs_checkos` can only be run by `root`.","`gs_dump` supports 4 formats (`p` plain-text restored via `gsql`; `c` custom, `d` directory, and `t` tar restored via `gs_restore`), whereas `gs_dumpall` exports only plain-text SQL scripts of all databases and global objects."],"exam_traps":["EXAM TRAP (Ch.02 Quiz Q1): 'Which of the following is not an openGauss server tool?' -> C. `gsql` (`gsql` is a client tool!).","EXAM TRAP (Ch.02 Quiz Q2): 'When the `gs_checkperf` tool is used to check system performance, which of the following can be viewed only by user `root`?' -> D. SSD performance!"],"content_html":"<h3>1. Client Tools vs. Server Tools Classification (pp. 102–104, Ch.02 Quiz Q1!)<\/h3>\n<p>All tools are located in <code class=\"inline-code\">GPHOME/script<\/code> and <code class=\"inline-code\">GAUSSHOME/bin<\/code>.<\/p>\n<ul class=\"md-list\">\n<li><strong>Client Tool (ONLY ONE in this table!)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">gsql<\/code><\/strong>: CLI database connection tool used by clients to connect to the server, run interactive/scripted SQL statements, and execute meta-commands (<code class=\"inline-code\">\\l<\/code>, <code class=\"inline-code\">\\c<\/code>, <code class=\"inline-code\">\\dt<\/code>, <code class=\"inline-code\">\\d<\/code>, <code class=\"inline-code\">\\q<\/code>). <strong>(<code class=\"inline-code\">gsql<\/code> is NOT a server tool — exact Ch.02 Quiz Q1: C!)<\/strong><\/li>\n<li><strong>11 Server Tools (p. 104)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">gs_check<\/code><\/strong>: Comprehensive environment check (OS, network, DB runtime) before major operations. Must specify <strong><code class=\"inline-code\">-i ITEM<\/code><\/strong> (single item, e.g., <code class=\"inline-code\">-i CheckCPU<\/code>) or <strong><code class=\"inline-code\">-e SCENE_NAME<\/code><\/strong> (scenario: <code class=\"inline-code\">inspect<\/code>, <code class=\"inline-code\">upgrade<\/code>, <code class=\"inline-code\">binary_upgrade<\/code>, <code class=\"inline-code\">health<\/code>, <code class=\"inline-code\">install<\/code>). Use <code class=\"inline-code\">--skip-root-items<\/code> to skip root checks.<\/li>\n<li><strong><code class=\"inline-code\">gs_checkos<\/code><\/strong>: Checks OS version, kernel parameters, disk/I/O/network settings, and THP. <strong>Only <code class=\"inline-code\">root<\/code> is authorized to run <code class=\"inline-code\">gs_checkos<\/code>!<\/strong><\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><code class=\"inline-code\">-i A1..A14<\/code>: <strong>Checks<\/strong> OS parameters without modifying them.<\/li>\n<li><code class=\"inline-code\">-i B1..B8<\/code>: <strong>Sets<\/strong> OS parameters to expected values (A and B items cannot be used simultaneously; <code class=\"inline-code\">-f<\/code> and <code class=\"inline-code\">-h<\/code> cannot be used together).<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">gs_checkperf<\/code><\/strong>: Routinely checks performance at 4 levels:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>openGauss level<\/strong> (Host/GaussDB CPU usage, shared memory hit rate, in-memory sort ratio, I/O, disk, transaction stats) — run as <code class=\"inline-code\">omm<\/code> (<code class=\"inline-code\">-i PMK<\/code>). <em>Note<\/em>: If PMK statistics are missing, run <code class=\"inline-code\">ANALYZE pmk.pmk_snapshot;<\/code> etc.<\/li>\n<li><strong>Host level<\/strong> (CPU, memory, I/O usage) — run as <code class=\"inline-code\">omm<\/code>.<\/li>\n<li><strong>Session/Process level<\/strong> (CPU, memory, shared buffer hits) — run as <code class=\"inline-code\">omm<\/code>.<\/li>\n<li><strong>SSD performance<\/strong> (read every 7s / write every 10s via <code class=\"inline-code\">dd flag=direct bs=8M count=2560<\/code>) — <strong>Can be viewed ONLY by user <code class=\"inline-code\">root<\/code> (<code class=\"inline-code\">gs_checkperf -U omm -i SSD<\/code>)! (Exact Ch.02 Quiz Q2: D!)<\/strong><\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">gs_clean<\/code><\/strong>: Connects to the primary DN and clears residual temporary tables (<code class=\"inline-code\">-a<\/code>/<code class=\"inline-code\">--all<\/code>, <code class=\"inline-code\">-e<\/code>/<code class=\"inline-code\">--exclusive<\/code>) or rolls back abnormal two-phase transactions (<code class=\"inline-code\">-r<\/code>/<code class=\"inline-code\">--rollback<\/code>) after an unexpected crash. Default concurrency <code class=\"inline-code\">-j<\/code> is 3 (range 1–10).<\/li>\n<li><strong><code class=\"inline-code\">gs_collector<\/code><\/strong>: Collects OS info, logs, and config files (<code class=\"inline-code\">--begin-time<\/code>, <code class=\"inline-code\">--end-time<\/code>, <code class=\"inline-code\">--keyword<\/code>, <code class=\"inline-code\">-C CONFIGFILE<\/code>) into a <code class=\"inline-code\">.tar.gz<\/code> package when openGauss is faulty (depends on <code class=\"inline-code\">gstack<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">gs_dump<\/code><\/strong>: Exports a <strong>single database<\/strong> or its objects (schemas, tables, views) consistently without blocking user R/W (acquires shared lock; tune wait via <code class=\"inline-code\">--lock-wait-timeout<\/code>). Supports 4 formats via <strong><code class=\"inline-code\">-F<\/code><\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">p<\/code> (Plain-text SQL)<\/strong>: Restore with <strong><code class=\"inline-code\">gsql<\/code><\/strong> (recommended for small DBs).<\/li>\n<li><strong><code class=\"inline-code\">c<\/code> (Custom binary)<\/strong>: Medium compression by default; restore with <strong><code class=\"inline-code\">gs_restore<\/code><\/strong> (recommended for medium/large DBs).<\/li>\n<li><strong><code class=\"inline-code\">d<\/code> (Directory)<\/strong> &amp; <strong><code class=\"inline-code\">t<\/code> (<code class=\"inline-code\">.tar<\/code> archive, max 8 GB per table)<\/strong>: Restore with <strong><code class=\"inline-code\">gs_restore<\/code><\/strong>.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">gs_dumpall<\/code><\/strong>: Exports <strong>all databases<\/strong> in the cluster + <strong>global objects<\/strong> (roles/users, tablespaces, global permissions) as a <strong>plain-text SQL script<\/strong> (restore with <strong><code class=\"inline-code\">gsql<\/code><\/strong>).<\/li>\n<li><strong><code class=\"inline-code\">gs_guc<\/code><\/strong>: Modifies <code class=\"inline-code\">postgresql.conf<\/code> / <code class=\"inline-code\">pg_hba.conf<\/code> (<code class=\"inline-code\">check<\/code>, <code class=\"inline-code\">set<\/code>, <code class=\"inline-code\">reload<\/code>, <code class=\"inline-code\">encrypt -M server|client|source<\/code> generating <code class=\"inline-code\">.key.cipher<\/code> and <code class=\"inline-code\">.key.rand<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">gs_om<\/code><\/strong>: Cluster lifecycle &amp; config maintenance (<code class=\"inline-code\">-t start | stop | restart | status | generateconf | refreshconf | view | query | cert | kerberos<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">gs_restore<\/code><\/strong>: Imports custom (<code class=\"inline-code\">c<\/code>), directory (<code class=\"inline-code\">d<\/code>), or <code class=\"inline-code\">.tar<\/code> (<code class=\"inline-code\">t<\/code>) archives exported by <code class=\"inline-code\">gs_dump<\/code>. Imports incrementally by default; use <strong><code class=\"inline-code\">-c<\/code><\/strong> to clean/drop existing objects before recreating.<\/li>\n<li><strong><code class=\"inline-code\">gs_ssh<\/code><\/strong>: Runs the same Linux shell command synchronously across all cluster nodes (<code class=\"inline-code\">gs_ssh -c \"cmd\"<\/code>).<\/li>\n<\/ol>"},"exercise":{"title":"Hands-On Lab: Running `gs_checkos`, `gs_checkperf`, `gs_check`, and `gs_ssh`","duration_mins":8,"exercise_type":"terminal","prompt_label":"root@opengauss:~#","scenario":"Perform a routine pre-upgrade and performance inspection of an openGauss server: check OS parameters as `root` using `gs_checkos`, check SSD read/write performance as `root` using `gs_checkperf`, and run a health scenario check as `omm` using `gs_check`.","instructions":["Step 1: As `root`, run `gs_checkos -i A` to check all 14 OS parameters (A1–A14) without modifying them.","Step 2: As `root`, run `gs_checkperf -U omm -i SSD` to measure SSD read/write performance.","Step 3: As `omm`, run `gs_check -e health` to execute the health inspection scenario."],"starter_code":"# Step 1 (as root): Check OS parameters (A1..A14) using gs_checkos\ngs_checkos -i ____\n\n# Step 2 (as root): Check SSD performance using gs_checkperf\ngs_checkperf -U omm -i ____\n\n# Step 3 (as omm): Run gs_check for the 'health' inspection scenario\nsu - omm -c \"gs_check -e ____\"\n","solution_code":"gs_checkos -i A\ngs_checkperf -U omm -i SSD\nsu - omm -c \"gs_check -e health\"","hints":["In `gs_checkos`, `-i A` checks OS items A1 to A14, whereas `-i B` sets OS parameters B1 to B8.","In `gs_checkperf`, `-i SSD` checks SSD performance and requires `root`.","In `gs_check`, `-e` specifies a scenario name such as `health`, `inspect`, `upgrade`, or `install`."],"validation_checks":[{"step":1,"description":"Check OS parameters with `gs_checkos -i A`","required_any":["gs_checkos -i a"],"feedback_fail":"Use `gs_checkos -i A` to check OS parameters."},{"step":2,"description":"Check SSD performance with `gs_checkperf -U omm -i SSD`","required_any":["-i ssd"],"feedback_fail":"Use `gs_checkperf -U omm -i SSD` as root."},{"step":3,"description":"Run scenario inspection with `gs_check -e health`","required_any":["gs_check -e health"],"feedback_fail":"Use `gs_check -e health` to run the health check scenario."}],"simulated_output":"Checking items:\n    A1. [ OS version status ]                                   : Normal\n    A2. [ Kernel version status ]                               : Normal\n    A6. [ System control parameters status ]                    : Normal\n    A9. [ Disk configuration status ]                           : Normal\nTotal numbers:14. Abnormal numbers:0. Warning numbers:0.\n\nCluster statistics information:\n    SSD Write Performance                                       : 540.25 MB/s\n    SSD Read Performance                                        : 685.80 MB/s\n\nParsing the check items config file successfully.\nThe scenario [health] check completed. Result: All 28 items passed.","quiz_questions":[{"id":"h2_s4_q1","type":"single","question":"(Official Ch.02 Quiz Q1) Which of the following is NOT an openGauss server tool?","options":["A. gs_check","B. gs_guc","C. gsql","D. gs_collector"],"answer":"C","explanation":"Per Chapter 02 (p. 102 & p. 126), `gsql` is a Client tool, whereas `gs_check`, `gs_guc`, and `gs_collector` are Server tools."},{"id":"h2_s4_q2","type":"single","question":"(Official Ch.02 Quiz Q2) When the `gs_checkperf` tool is used to check system performance, which of the following can be viewed ONLY by user `root`?","options":["A. openGauss level","B. Host level","C. Session/Process level","D. SSD performance"],"answer":"D","explanation":"Per Chapter 02 (p. 109, p. 110 & p. 126), SSD read/write performance (`gs_checkperf -U USER -i SSD`) can be viewed ONLY by user `root`."},{"id":"h2_s4_q3","type":"tf","question":"In `gs_checkos`, items A1 to A14 are used to check OS parameters without modifying them, whereas items B1 to B8 set system parameters to expected values, and A and B items cannot be set simultaneously.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.02 p. 107). Items A1–A14 check OS parameters, items B1–B8 set system parameters, and A and B cannot be specified at the same time."}],"reference_figures":[]}}]},{"hour_number":3,"folder_name":"Hour-03-openGauss-Architecture-Resource-Pooling-and-Performance","title":"openGauss Architecture, Resource Pooling & High Performance","chapter_ref":"Chapter 03 Part 1 (pp. 131–198)","duration_mins":60,"overview":"Explore the internal memory, multi-threading, and directory architecture of openGauss, master the 3-layer Resource Pooling architecture (DMS + DSS), compare CBO vs. ABO optimizers and Row-Store vs. Column-Store tables, and configure Partitioned Tables, Kunpeng NUMA optimizations, SMP intra-query parallelism, Primary/Standby Switchover/Failover, and Ultimate RTO.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Instance-Memory-Threads-and-Directory-Layout","exercise_slug":"02-Exercise-Memory-Threads-and-Data-Directory-Lab","lecture":{"title":"Instance Architecture — Memory, Multi-Threading & Directory Layout","duration_mins":7,"pdf_ref":"Ch.03, pp. 135–144","objectives":["Distinguish Shared Memory (`shared_buffers`, `cstore_buffers`, `wal_buffers`, `MOT`) from Session/Local Memory (`work_mem`, `maintenance_work_mem`, `temp_buffers`)","Describe the roles of core openGauss threads (`GaussMaster`, `pagewriter`, `bgwriter`, `walwriter`, `checkpointer`, `WalSender`, `WalReceiver`)","Navigate the logical storage hierarchy (Tablespace -> Database -> Datafile Segment -> 8 KB Block) and physical data directory (`base`, `global`, `pg_xlog`, `pg_clog`, `pg_audit`)"],"content_markdown":"### 1. Memory Structure: Shared vs. Local Memory (pp. 135–137)\n\n| Memory Region | Scope | Purpose & Tuning Guidance |\n| :--- | :--- | :--- |\n| **`shared_buffers` (Shared buffer)** | Shared | Main memory cache bridging disk and CPU for row-store read/write operations. |\n| **`cstore_buffers` (cstore buffer)** | Shared | Shared buffer dedicated to **column-store tables**. When using mostly column-store tables, reduce `shared_buffers` and increase `cstore_buffers`. |\n| **`MOT` (Memory-Optimized Table)** | Shared / Local | Stores all MOT data and indexes in memory (`CREATE FOREIGN TABLE test(x int);`). Supports ACID with RC or RR isolation. |\n| **`wal_buffers` (wal buffer)** | Shared | Shared memory staging area for Write-Ahead Logs (WALs) before flushing to disk. |\n| **`maintenance_work_mem`** | Local (Session) | Local memory used for maintenance tasks: `VACUUM`, `CREATE INDEX`, and `ALTER TABLE`. |\n| **`work_mem`** | Local (Session) | Local memory per query operator for **sorting (`Sort`)** and **hash tables (`HashJoin`/`HashAgg`)**. |\n| **`temp_buffers` (temp buffer)** | Local (Session) | Session-private buffer for accessing **temporary tables**. |\n<!-- PDF_FIGS_START -->\n![openGauss Instance Architecture (GaussMaster, Background Threads, Memory Pools, Storage) (Official Reference: p. 135)](./assets/images/p3_h3s1_instance_architecture.png)\n*Figure: openGauss Instance Architecture (GaussMaster, Background Threads, Memory Pools, Storage) (Official Reference: p. 135)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Main Threads in `gaussdb` (pp. 135, 138)\n- **`GaussMaster` (`postmaster`)**: Main management thread handling startup, shutdown, client connections, and message forwarding.\n- **`pagewriter`**: Copies dirty pages to the **double-write (double-writer) space** and flushes them to disk (preventing torn-page corruption), then forwards dirty pages to `bgwriter` subthreads.\n- **`bgwriter`**: Flushes dirty pages from `shared_buffers` to disk in the background so user query threads do not wait for free buffers and checkpoint spikes are smoothed.\n- **`walwriter`**: Flushes WAL records from `wal_buffers` in memory to WAL files on disk to guarantee durability of committed transactions.\n- **`checkpointer` (`checkpoint`)**: Periodically triggered to flush all dirty pages to disk and advance the recovery redo point.\n- **Other Key Background Threads**: `WalSender` / `WalReceiver` (primary/standby WAL streaming), `AutoVacLauncher` (vacuuming), `Stat_collector` (statistics), `Auditor` (audit logs), `sysLogger` (run logs), `LWLockMonitor`.\n\n---\n\n### 3. Logical Architecture & Physical Directory Structure (pp. 141–144)\n- **Logical Hierarchy**:\n  - **Tablespace**: Physical directory mapping; one tablespace can store objects from multiple databases, and one database can span multiple tablespaces.\n  - **Table & Datafile Segment**: Each table belongs to **only one database and one tablespace**. Each datafile segment belongs to only one table; **tables > 1 GB are split across multiple 1 GB datafile segments**.\n  - **Block (Page)**: Basic unit of database I/O management; **default size is 8 KB**.\n- **Physical Data Directory (`GAUSSHOME/bin`, `lib`, `share`, and Instance Data Dir `0700`)**:\n  - **`base/`**: Subdirectories for each database's tables/indexes.\n  - **`global/`**: Cluster-wide system catalogs (e.g., `pg_database`, `pg_authid`, `pg_tablespace`).\n  - **`pg_xlog/`**: Stores Write-Ahead Logs (WAL / redo logs).\n  - **`pg_clog/` & `pg_csnlog/`**: Transaction commit status logs and Commit Sequence Number logs.\n  - **`pg_audit/` & `pg_log/`**: Audit logs (`0600`) and instance run logs (`<= 0640`).\n  - **`postgresql.conf` / `pg_hba.conf` / `postmaster.opts`**: Parameter file, client auth file, and startup CLI args.\n<!-- PDF_FIGS_START -->\n![openGauss Primary/Standby Logical Architecture (Official Reference: p. 139)](./assets/images/p3_h3s1_logical_primary_standby.png)\n*Figure: openGauss Primary/Standby Logical Architecture (Official Reference: p. 139)*\n\n![Database Logical Objects to Physical Datafile Segments and 8KB Blocks (Official Reference: p. 141)](./assets/images/p3_h3s1_db_physical_mapping.png)\n*Figure: Database Logical Objects to Physical Datafile Segments and 8KB Blocks (Official Reference: p. 141)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["In openGauss logical storage, a table exceeding 1 GB is split into multiple 1 GB datafile segments, and the default block size is 8 KB.","`pagewriter` writes dirty pages to the double-writer space first to prevent torn-page corruption, while `walwriter` flushes WAL buffers to `pg_xlog`.","`base/` holds per-database subdirectories, `global/` holds cluster-wide tables, `pg_xlog/` holds WAL files, and directory permissions are `0750` (program), `0700` (data dir), and `0600` (data/audit files)."],"exam_traps":["EXAM TRAP: Column-store tables rarely use `shared_buffers`; they use `cstore_buffers`! For column-store workloads, decrease `shared_buffers` and increase `cstore_buffers` (Ch.03 p. 136).","EXAM TRAP: Do not confuse `pg_log` (instance runtime logs) with `pg_xlog` (Write-Ahead Logs / redo logs used for crash recovery) or `pg_clog` (transaction commit status logs)."],"content_html":"<h3>1. Memory Structure: Shared vs. Local Memory (pp. 135–137)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Memory Region<\/th><th>Scope<\/th><th>Purpose &amp; Tuning Guidance<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">shared_buffers<\/code> (Shared buffer)<\/strong><\/td><td>Shared<\/td><td>Main memory cache bridging disk and CPU for row-store read/write operations.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">cstore_buffers<\/code> (cstore buffer)<\/strong><\/td><td>Shared<\/td><td>Shared buffer dedicated to <strong>column-store tables<\/strong>. When using mostly column-store tables, reduce <code class=\"inline-code\">shared_buffers<\/code> and increase <code class=\"inline-code\">cstore_buffers<\/code>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">MOT<\/code> (Memory-Optimized Table)<\/strong><\/td><td>Shared / Local<\/td><td>Stores all MOT data and indexes in memory (<code class=\"inline-code\">CREATE FOREIGN TABLE test(x int);<\/code>). Supports ACID with RC or RR isolation.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">wal_buffers<\/code> (wal buffer)<\/strong><\/td><td>Shared<\/td><td>Shared memory staging area for Write-Ahead Logs (WALs) before flushing to disk.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">maintenance_work_mem<\/code><\/strong><\/td><td>Local (Session)<\/td><td>Local memory used for maintenance tasks: <code class=\"inline-code\">VACUUM<\/code>, <code class=\"inline-code\">CREATE INDEX<\/code>, and <code class=\"inline-code\">ALTER TABLE<\/code>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">work_mem<\/code><\/strong><\/td><td>Local (Session)<\/td><td>Local memory per query operator for <strong>sorting (<code class=\"inline-code\">Sort<\/code>)<\/strong> and <strong>hash tables (<code class=\"inline-code\">HashJoin<\/code>/<code class=\"inline-code\">HashAgg<\/code>)<\/strong>.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">temp_buffers<\/code> (temp buffer)<\/strong><\/td><td>Local (Session)<\/td><td>Session-private buffer for accessing <strong>temporary tables<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s1_instance_architecture.png\" alt=\"openGauss Instance Architecture (GaussMaster, Background Threads, Memory Pools, Storage)\" data-caption=\"openGauss Instance Architecture (GaussMaster, Background Threads, Memory Pools, Storage) (Official Reference: p. 135)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Instance Architecture (GaussMaster, Background Threads, Memory Pools, Storage)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 135 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Main Threads in <code class=\"inline-code\">gaussdb<\/code> (pp. 135, 138)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">GaussMaster<\/code> (<code class=\"inline-code\">postmaster<\/code>)<\/strong>: Main management thread handling startup, shutdown, client connections, and message forwarding.<\/li>\n<li><strong><code class=\"inline-code\">pagewriter<\/code><\/strong>: Copies dirty pages to the <strong>double-write (double-writer) space<\/strong> and flushes them to disk (preventing torn-page corruption), then forwards dirty pages to <code class=\"inline-code\">bgwriter<\/code> subthreads.<\/li>\n<li><strong><code class=\"inline-code\">bgwriter<\/code><\/strong>: Flushes dirty pages from <code class=\"inline-code\">shared_buffers<\/code> to disk in the background so user query threads do not wait for free buffers and checkpoint spikes are smoothed.<\/li>\n<li><strong><code class=\"inline-code\">walwriter<\/code><\/strong>: Flushes WAL records from <code class=\"inline-code\">wal_buffers<\/code> in memory to WAL files on disk to guarantee durability of committed transactions.<\/li>\n<li><strong><code class=\"inline-code\">checkpointer<\/code> (<code class=\"inline-code\">checkpoint<\/code>)<\/strong>: Periodically triggered to flush all dirty pages to disk and advance the recovery redo point.<\/li>\n<li><strong>Other Key Background Threads<\/strong>: <code class=\"inline-code\">WalSender<\/code> / <code class=\"inline-code\">WalReceiver<\/code> (primary/standby WAL streaming), <code class=\"inline-code\">AutoVacLauncher<\/code> (vacuuming), <code class=\"inline-code\">Stat_collector<\/code> (statistics), <code class=\"inline-code\">Auditor<\/code> (audit logs), <code class=\"inline-code\">sysLogger<\/code> (run logs), <code class=\"inline-code\">LWLockMonitor<\/code>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Logical Architecture &amp; Physical Directory Structure (pp. 141–144)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Logical Hierarchy<\/strong>:<\/li>\n<li><strong>Tablespace<\/strong>: Physical directory mapping; one tablespace can store objects from multiple databases, and one database can span multiple tablespaces.<\/li>\n<li><strong>Table &amp; Datafile Segment<\/strong>: Each table belongs to <strong>only one database and one tablespace<\/strong>. Each datafile segment belongs to only one table; <strong>tables &gt; 1 GB are split across multiple 1 GB datafile segments<\/strong>.<\/li>\n<li><strong>Block (Page)<\/strong>: Basic unit of database I/O management; <strong>default size is 8 KB<\/strong>.<\/li>\n<li><strong>Physical Data Directory (<code class=\"inline-code\">GAUSSHOME/bin<\/code>, <code class=\"inline-code\">lib<\/code>, <code class=\"inline-code\">share<\/code>, and Instance Data Dir <code class=\"inline-code\">0700<\/code>)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">base/<\/code><\/strong>: Subdirectories for each database's tables/indexes.<\/li>\n<li><strong><code class=\"inline-code\">global/<\/code><\/strong>: Cluster-wide system catalogs (e.g., <code class=\"inline-code\">pg_database<\/code>, <code class=\"inline-code\">pg_authid<\/code>, <code class=\"inline-code\">pg_tablespace<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">pg_xlog/<\/code><\/strong>: Stores Write-Ahead Logs (WAL / redo logs).<\/li>\n<li><strong><code class=\"inline-code\">pg_clog/<\/code> &amp; <code class=\"inline-code\">pg_csnlog/<\/code><\/strong>: Transaction commit status logs and Commit Sequence Number logs.<\/li>\n<li><strong><code class=\"inline-code\">pg_audit/<\/code> &amp; <code class=\"inline-code\">pg_log/<\/code><\/strong>: Audit logs (<code class=\"inline-code\">0600<\/code>) and instance run logs (<code class=\"inline-code\">&lt;= 0640<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">postgresql.conf<\/code> / <code class=\"inline-code\">pg_hba.conf<\/code> / <code class=\"inline-code\">postmaster.opts<\/code><\/strong>: Parameter file, client auth file, and startup CLI args.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s1_logical_primary_standby.png\" alt=\"openGauss Primary/Standby Logical Architecture\" data-caption=\"openGauss Primary/Standby Logical Architecture (Official Reference: p. 139)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Primary/Standby Logical Architecture<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 139 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s1_db_physical_mapping.png\" alt=\"Database Logical Objects to Physical Datafile Segments and 8KB Blocks\" data-caption=\"Database Logical Objects to Physical Datafile Segments and 8KB Blocks (Official Reference: p. 141)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Database Logical Objects to Physical Datafile Segments and 8KB Blocks<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 141 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Inspecting Memory Parameters & Physical Data Directories","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"You are auditing an openGauss instance's memory settings (`shared_buffers`, `cstore_buffers`, `work_mem`, `maintenance_work_mem`) and checking the database OID mapping inside the `base/` directory.","instructions":["Step 1: Query `SHOW shared_buffers;`, `SHOW cstore_buffers;`, and `SHOW work_mem;`.","Step 2: Query `SELECT oid, datname FROM pg_database WHERE datname = 'postgres';` to find the subdirectory OID under `base/`."],"starter_code":"-- Step 1: Check shared, column-store, and operator work memory buffers\nSHOW ____;\nSHOW ____;\nSHOW work_mem;\n\n-- Step 2: Query OID and database name from pg_database\nSELECT oid, datname FROM ____ WHERE datname = 'postgres';\n","solution_code":"SHOW shared_buffers;\nSHOW cstore_buffers;\nSHOW work_mem;\n\nSELECT oid, datname FROM pg_database WHERE datname = 'postgres';","hints":["Use `SHOW shared_buffers;` and `SHOW cstore_buffers;`.","The system catalog storing available databases and their OIDs is `pg_database`."],"validation_checks":[{"step":1,"description":"Check `shared_buffers` and `cstore_buffers`","required_any":["shared_buffers"],"feedback_fail":"Query `SHOW shared_buffers;` and `SHOW cstore_buffers;`."},{"step":2,"description":"Check `cstore_buffers`","required_any":["cstore_buffers"],"feedback_fail":"Include `SHOW cstore_buffers;`."},{"step":3,"description":"Query `pg_database` for the `postgres` OID","required_any":["from pg_database"],"feedback_fail":"Query `SELECT oid, datname FROM pg_database WHERE datname = 'postgres';`."}],"simulated_output":" shared_buffers \n----------------\n 1GB\n(1 row)\n\n cstore_buffers \n----------------\n 512MB\n(1 row)\n\n work_mem \n----------\n 64MB\n(1 row)\n\n  oid  | datname  \n-------+----------\n 15749 | postgres\n(1 row)","quiz_questions":[{"id":"h3_s1_q1","type":"single","question":"In the openGauss instance directory structure, which directory stores Write-Ahead Logs (WALs)?","options":["A. pg_log","B. pg_xlog","C. pg_audit","D. global"],"answer":"B","explanation":"Per Chapter 03 (p. 143), `pg_xlog` stores Write-Ahead Logs (WALs), whereas `pg_log` stores runtime logs, `pg_audit` stores audit logs, and `global` stores cluster-wide system catalogs."},{"id":"h3_s1_q2","type":"single","question":"In the openGauss logical storage architecture, what is the default size of a data Block, and at what size is a table split into multiple Datafile segments?","options":["A. 4 KB block; 512 MB datafile segment","B. 8 KB block; 1 GB datafile segment","C. 16 KB block; 2 GB datafile segment","D. 32 KB block; 4 GB datafile segment"],"answer":"B","explanation":"Per Chapter 03 (p. 141), the basic unit of database management is a Block with a default size of 8 KB, and a table containing more than 1 GB of data is stored in multiple 1 GB datafile segments."},{"id":"h3_s1_q3","type":"tf","question":"Column-store tables primarily use `shared_buffers`, so you should increase `shared_buffers` and decrease `cstore_buffers` for column-store workloads.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.03 p. 136). Column-store tables rarely use `shared_buffers`; they use `cstore_buffers`. Users should reduce `shared_buffers` and increase `cstore_buffers` for column-store workloads."}],"reference_figures":[{"slug":"p3_h3s1_instance_architecture","title":"openGauss Instance Architecture (GaussMaster, Background Threads, Memory Pools, Storage)","pdf_page":135},{"slug":"p3_h3s1_db_physical_mapping","title":"Database Logical Objects to Physical Datafile Segments and 8KB Blocks","pdf_page":141}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Resource-Pooling-Architecture-DMS-and-DSS","exercise_slug":"04-Exercise-Resource-Pooling-DMS-DSS-Architecture-Lab","lecture":{"title":"Resource Pooling Architecture (DMS, DSS & Shared Storage)","duration_mins":7,"pdf_ref":"Ch.03, pp. 145–159","objectives":["Explain how openGauss Resource Pooling decouples Compute, Memory (DMS), and Storage (DSS)","List the hardware/protocol requirements (OceanStor Dorado SAN, SCSI3 PR & CAW, CX5 NIC,
