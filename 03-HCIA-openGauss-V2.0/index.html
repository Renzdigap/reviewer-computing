KE ... TO/FROM PUBLIC<\/code> to manage).<\/li>\n<li><strong>System Catalog &amp; Views (p. 317, 324)<\/strong>: User/role attributes are stored in the cluster-wide system catalog <strong><code class=\"inline-code\">pg_authid<\/code><\/strong> (accessible <strong>only to <code class=\"inline-code\">SYSADMIN<\/code><\/strong>) and exposed via <strong><code class=\"inline-code\">pg_user<\/code><\/strong> and <strong><code class=\"inline-code\">pg_roles<\/code><\/strong> views.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Account Validity, Manual Lock/Unlock &amp; Private (<code class=\"inline-code\">INDEPENDENT<\/code>) Users (pp. 318–321)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Dropping Users (<code class=\"inline-code\">DROP USER<\/code>, p. 318)<\/strong>: Uses <strong><code class=\"inline-code\">RESTRICT<\/code> by default<\/strong> — if the user owns database objects, <code class=\"inline-code\">DROP USER<\/code> fails unless <strong><code class=\"inline-code\">CASCADE<\/code><\/strong> is specified (<code class=\"inline-code\">DROP USER IF EXISTS joe CASCADE;<\/code>).<\/li>\n<li><strong>Setting Account Validity Period (p. 319)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  CREATE USER joe WITH PASSWORD 'Bigdata@123'\n      VALID BEGIN '2015-10-10 08:00:00' VALID UNTIL '2016-10-10 08:00:00';\n  ALTER USER joe WITH VALID BEGIN '2016-11-10 08:00:00' VALID UNTIL '2017-11-10 08:00:00';<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Manually Locking and Unlocking Accounts (p. 320)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  ALTER USER user_read ACCOUNT LOCK;\n  ALTER USER user_read ACCOUNT UNLOCK;<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Private User (<code class=\"inline-code\">WITH INDEPENDENT<\/code>, p. 321)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  CREATE USER user_independent WITH INDEPENDENT IDENTIFIED BY '1234@abc';<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li>Isolates DBA control permissions from data access permissions in non-separation-of-duties mode: <strong>DBAs (<code class=\"inline-code\">SYSADMIN<\/code>) can manage (<code class=\"inline-code\">DROP<\/code>, <code class=\"inline-code\">ALTER<\/code>, <code class=\"inline-code\">TRUNCATE<\/code>) objects of an <code class=\"inline-code\">INDEPENDENT<\/code> user, but CANNOT access (<code class=\"inline-code\">SELECT<\/code>, <code class=\"inline-code\">INSERT<\/code>, <code class=\"inline-code\">UPDATE<\/code>, <code class=\"inline-code\">DELETE<\/code>, <code class=\"inline-code\">COPY<\/code>, <code class=\"inline-code\">GRANT<\/code>, <code class=\"inline-code\">REVOKE<\/code>, <code class=\"inline-code\">ALTER OWNER<\/code>) their data without explicit authorization from that user!<\/strong><\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Managing Tablespaces, Account Validity, Locking & `INDEPENDENT` Users","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Create a tablespace `fastspace` at relative path `'tablespace/tablespace_1'`, create user `joe` with a validity window, lock and unlock account `user_read`, and create a private user `user_independent` with the `INDEPENDENT` attribute.","instructions":["Step 1: Create tablespace `fastspace` using `CREATE TABLESPACE fastspace RELATIVE LOCATION 'tablespace/tablespace_1';`.","Step 2: Create user `joe` with `VALID BEGIN '2026-01-01 08:00:00' VALID UNTIL '2027-01-01 08:00:00'`, and lock `user_read` using `ALTER USER user_read ACCOUNT LOCK;`.","Step 3: Create private user `user_independent` using `CREATE USER user_independent WITH INDEPENDENT IDENTIFIED BY '1234@abc';`."],"starter_code":"-- Step 1: Create tablespace fastspace at relative path\nCREATE TABLESPACE fastspace ____ LOCATION 'tablespace/tablespace_1';\n\n-- Step 2: Create user joe with validity period and lock user_read\nCREATE USER joe WITH PASSWORD 'Bigdata@123'\n    VALID ____ '2026-01-01 08:00:00' VALID ____ '2027-01-01 08:00:00';\nALTER USER user_read ACCOUNT ____;\n\n-- Step 3: Create private user with INDEPENDENT attribute\nCREATE USER user_independent WITH ____ IDENTIFIED BY '1234@abc';\n","solution_code":"CREATE TABLESPACE fastspace RELATIVE LOCATION 'tablespace/tablespace_1';\n\nCREATE USER joe WITH PASSWORD 'Bigdata@123'\n    VALID BEGIN '2026-01-01 08:00:00' VALID UNTIL '2027-01-01 08:00:00';\nALTER USER user_read ACCOUNT LOCK;\n\nCREATE USER user_independent WITH INDEPENDENT IDENTIFIED BY '1234@abc';","hints":["Use `RELATIVE LOCATION` when specifying a tablespace directory relative to the data node directory.","Use `VALID BEGIN '...' VALID UNTIL '...'` for account validity and `ACCOUNT LOCK` to lock an account.","Use `WITH INDEPENDENT` to create a private user."],"validation_checks":[{"step":1,"description":"Create tablespace with `RELATIVE LOCATION`","required_any":["relative location"],"feedback_fail":"Use `CREATE TABLESPACE fastspace RELATIVE LOCATION 'tablespace/tablespace_1';`."},{"step":2,"description":"Specify `VALID BEGIN`, `VALID UNTIL`, and `ACCOUNT LOCK`","required_any":["account lock"],"feedback_fail":"Include `VALID BEGIN ... VALID UNTIL ...` and `ALTER USER user_read ACCOUNT LOCK;`."},{"step":3,"description":"Create private user with `WITH INDEPENDENT`","required_any":["with independent"],"feedback_fail":"Use `CREATE USER user_independent WITH INDEPENDENT IDENTIFIED BY '1234@abc';`."}],"simulated_output":"CREATE TABLESPACE\nCREATE ROLE\nALTER ROLE\nCREATE ROLE","quiz_questions":[{"id":"h5_s3_q1","type":"tf","question":"(Official Ch.04 Quiz Q1) Users and roles have the same syntax in the openGauss database. Therefore, they are fully equivalent.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.04 p. 314 & p. 346). Although users and roles share the same O&M syntax, a user is an entity with `LOGIN` permission by default (`rolcanlogin = true`), whereas a role is a set of permissions that does not have login permission by default."},{"id":"h5_s3_q2","type":"single","question":"What happens in openGauss when the disk usage of a partition where a tablespace resides reaches 90%?","options":["A. The database automatically deletes the oldest partition in the tablespace","B. The database switches to read-only mode until disk usage drops below 90%","C. The database immediately shuts down the cluster via `gs_om -t stop`","D. The database converts all row-store tables in the tablespace into MOTs"],"answer":"B","explanation":"Per Chapter 04 (p. 307), if the usage of a disk where a tablespace resides reaches 90%, the database switches to read-only mode, and switches back to read/write mode when disk usage becomes less than 90%."},{"id":"h5_s3_q3","type":"single","question":"Which user attribute in openGauss creates a 'private user' whose objects can be managed (`DROP`, `ALTER`, `TRUNCATE`) by database administrators, but whose data cannot be accessed (`SELECT`, `INSERT`, `UPDATE`, `DELETE`, `COPY`) by administrators without explicit authorization?","options":["A. SYSADMIN","B. INDEPENDENT","C. AUDITADMIN","D. VCADMIN"],"answer":"B","explanation":"Per Chapter 04 (p. 321), creating a user with the `INDEPENDENT` attribute (`CREATE USER ... WITH INDEPENDENT`) isolates control permissions (`DROP`, `ALTER`, `TRUNCATE`) from data access permissions (`SELECT`, `INSERT`, `UPDATE`, `DELETE`, `COPY`)."}],"reference_figures":[]}},{"sprint_number":4,"lecture_slug":"07-Lecture-System-Catalogs-Views-and-Data-Import-Export","exercise_slug":"08-Exercise-COPY-gs-dump-gs-restore-and-VACUUM-Lab","lecture":{"title":"System Catalogs/Views & Data Import/Export (`COPY`, `gs_dump`, `gs_dumpall`, `gs_restore`, `ANALYZE`, `VACUUM`)","duration_mins":7,"pdf_ref":"Ch.04, pp. 322–347","objectives":["Identify key openGauss System Catalogs (`PG_CLASS`, `PG_ATTRIBUTE`, `PG_AUTHID`, `PG_DATABASE`, `PG_INDEX`, `PG_NAMESPACE`, `PG_PARTITION`) and Views (`PG_STAT_ACTIVITY`, `PG_SETTINGS`, `PG_LOCKS`)","Export partial table data using `COPY (SELECT ...) TO` or `\\copy` (Ch.04 Quiz Q2: C!)","Execute `gs_dump`, `gs_dumpall`, `gs_restore` (`-c`, `-e`, `-s`), `VACUUM FULL`, and `ANALYZE`"],"content_markdown":"### 1. Essential System Catalogs & System Views (pp. 323–328)\n\n| System Catalog (`PG_*`) | Stored Metadata | System View | Displayed Information |\n| :--- | :--- | :--- | :--- |\n| **`PG_DATABASE`** | Available databases | **`PG_STAT_ACTIVITY`** | Current user sessions and running queries |\n| **`PG_CLASS`** | Tables, indexes, views, sequences & relationships | **`PG_SETTINGS`** | Runtime GUC parameters of the database |\n| **`PG_ATTRIBUTE`** | Table columns | **`PG_LOCKS`** | Locks held by open transactions |\n| **`PG_AUTHID`** | Roles & users (`rolcanlogin`; `SYSADMIN` only) | **`PG_ROLES` / `PG_USER`** | Role and user information |\n| **`PG_CONSTRAINT`** | Check, PK, Unique, and FK constraints | **`PG_STATS`** | Single-column statistics from `pg_statistic` |\n| **`PG_INDEX`** | Index metadata (rest in `PG_CLASS`) | **`GS_SQL_COUNT`** | Counts of `SELECT`, `INSERT`, `UPDATE`, `DELETE`, `MERGE INTO` |\n| **`PG_NAMESPACE`** | Schemas (namespaces) | **`GS_AUDITING` / `GS_MASKING` / `GS_LABELS`** | Audit info, masking policies, and resource labels (`SYSADMIN`/`POLADMIN`) |\n| **`PG_PARTITION`** | Partitioned tables, table partitions, index partitions | **`PLAN_TABLE`** | Session-level execution plan info from `EXPLAIN PLAN` |\n| **`PG_DEPEND` / `PG_PROC` / `PG_JOB`** | Object dependencies (`CASCADE`/`RESTRICT`), functions/procedures, scheduled jobs | **`GS_WLM_USER_RESOURCE_HISTORY`** | Reserved catalog for user resource usage history |\n\n---\n\n### 2. Data Import & Export: `INSERT`, `COPY`, and `\\copy` (pp. 330–333, Ch.04 Quiz Q2!)\n1. **`INSERT`**: Simplest way to add data via client or JDBC/ODBC; suitable for **small data volume and low concurrency**.\n2. **SQL `COPY` (`COPY FROM` / `COPY TO`, server-side file I/O) & JDBC `CopyManager` (`org.postgresql.copy.CopyManager`)**:\n   - Applies **only to tables, NOT views**.\n   - **Exporting Partial Table Data (Exact Ch.04 Quiz Q2: C!)**:\n     ```sql\n     COPY t1 FROM '/data/input/t1.txt' DELIMITER '^';\n     COPY t1 TO '/data/input/t1_output.txt' DELIMITER '^';\n     -- Export partial data using a conditional SELECT query:\n     COPY (SELECT * FROM student WHERE age > 20) TO '/data/input/student_part.txt' DELIMITER '^';\n     ```\n3. **`gsql` `\\copy` Meta-Command (Client-side file I/O, p. 333)**:\n   - Unlike SQL `COPY` (which reads/writes files on the **database server**), `\\copy` reads/writes files on the **local `gsql` client host** using the local OS user's file permissions!\n   - Default delimiters: **Tab** in `TEXT` format, **Comma (`,`)** in `CSV` format, none in `FIXED` format.\n\n---\n\n### 3. `gs_dump`, `gs_dumpall`, `gs_restore`, `VACUUM FULL` & `ANALYZE` (pp. 334–345)\n- **`gs_dump` Key Flags (p. 335)**:\n  - `-U <user>`, `-W <pass>`, `-p <port>`, `-f <file>`, `-F p|c|d|t` (format), **`-n <schema>`** (include schema), **`-t <schema.table>`** (include table), **`-T <schema.table>`** (exclude table; if both `-t` and `-T` are given, exports objects in `-t` that are not in `-T`).\n  - **Exporting without direct permission (p. 340)**: Use **`--role <rolename> --rolepassword <pass>`** to assume a role that has export privileges!\n- **`gs_restore` Key Flags (pp. 341–343)**:\n  - Imports `.tar` (`t`), custom (`c`), or directory (`d`) archives exported by `gs_dump`.\n  - **`-d <dbname>`** (target DB), **`-c`** (clean/drop existing objects before recreating), **`-e`** (exit immediately on SQL error), **`-s`** (import **schema/object definitions only**, no data).\n- **Post-Import Maintenance (pp. 344–345)**:\n  - **`VACUUM FULL tablename;`**: Reclaims disk page fragments left by mass updates/deletions and **returns free space to the OS** (run **before** `ANALYZE`).\n  - **`ANALYZE tablename;`**: Updates `PG_STATISTIC` so the CBO generates optimal query plans after data import.","key_takeaways":["To export partial data from a table (e.g., rows matching a condition), use `COPY (SELECT ... WHERE ...) TO '/path/file'` (Ch.04 Quiz Q2: C). `gs_dump` and `gs_dumpall` export whole tables/databases, not conditional subsets.","SQL `COPY` reads/writes files on the database server, whereas the `gsql` meta-command `\\copy` reads/writes files on the local client machine.","After bulk imports/updates/deletes, run `VACUUM FULL <table_name>;` (to reclaim disk page fragments to the OS) followed by `ANALYZE <table_name>;` (to update `PG_STATISTIC`)."],"exam_traps":["EXAM TRAP (Ch.04 Quiz Q2): 'Which of the following commands can be used to export partial data from the student table?' -> C. `copy` Conditional statement (`COPY (SELECT ...) TO ...`)!","EXAM TRAP: In `gs_restore`, `-s` imports ONLY object definitions (schemas/tables without data), `-c` drops existing objects before recreating them, and `-e` exits immediately if an error occurs."],"content_html":"<h3>1. Essential System Catalogs &amp; System Views (pp. 323–328)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>System Catalog (<code class=\"inline-code\">PG_*<\/code>)<\/th><th>Stored Metadata<\/th><th>System View<\/th><th>Displayed Information<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">PG_DATABASE<\/code><\/strong><\/td><td>Available databases<\/td><td><strong><code class=\"inline-code\">PG_STAT_ACTIVITY<\/code><\/strong><\/td><td>Current user sessions and running queries<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_CLASS<\/code><\/strong><\/td><td>Tables, indexes, views, sequences &amp; relationships<\/td><td><strong><code class=\"inline-code\">PG_SETTINGS<\/code><\/strong><\/td><td>Runtime GUC parameters of the database<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_ATTRIBUTE<\/code><\/strong><\/td><td>Table columns<\/td><td><strong><code class=\"inline-code\">PG_LOCKS<\/code><\/strong><\/td><td>Locks held by open transactions<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_AUTHID<\/code><\/strong><\/td><td>Roles &amp; users (<code class=\"inline-code\">rolcanlogin<\/code>; <code class=\"inline-code\">SYSADMIN<\/code> only)<\/td><td><strong><code class=\"inline-code\">PG_ROLES<\/code> / <code class=\"inline-code\">PG_USER<\/code><\/strong><\/td><td>Role and user information<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_CONSTRAINT<\/code><\/strong><\/td><td>Check, PK, Unique, and FK constraints<\/td><td><strong><code class=\"inline-code\">PG_STATS<\/code><\/strong><\/td><td>Single-column statistics from <code class=\"inline-code\">pg_statistic<\/code><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_INDEX<\/code><\/strong><\/td><td>Index metadata (rest in <code class=\"inline-code\">PG_CLASS<\/code>)<\/td><td><strong><code class=\"inline-code\">GS_SQL_COUNT<\/code><\/strong><\/td><td>Counts of <code class=\"inline-code\">SELECT<\/code>, <code class=\"inline-code\">INSERT<\/code>, <code class=\"inline-code\">UPDATE<\/code>, <code class=\"inline-code\">DELETE<\/code>, <code class=\"inline-code\">MERGE INTO<\/code><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_NAMESPACE<\/code><\/strong><\/td><td>Schemas (namespaces)<\/td><td><strong><code class=\"inline-code\">GS_AUDITING<\/code> / <code class=\"inline-code\">GS_MASKING<\/code> / <code class=\"inline-code\">GS_LABELS<\/code><\/strong><\/td><td>Audit info, masking policies, and resource labels (<code class=\"inline-code\">SYSADMIN<\/code>/<code class=\"inline-code\">POLADMIN<\/code>)<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_PARTITION<\/code><\/strong><\/td><td>Partitioned tables, table partitions, index partitions<\/td><td><strong><code class=\"inline-code\">PLAN_TABLE<\/code><\/strong><\/td><td>Session-level execution plan info from <code class=\"inline-code\">EXPLAIN PLAN<\/code><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">PG_DEPEND<\/code> / <code class=\"inline-code\">PG_PROC<\/code> / <code class=\"inline-code\">PG_JOB<\/code><\/strong><\/td><td>Object dependencies (<code class=\"inline-code\">CASCADE<\/code>/<code class=\"inline-code\">RESTRICT<\/code>), functions/procedures, scheduled jobs<\/td><td><strong><code class=\"inline-code\">GS_WLM_USER_RESOURCE_HISTORY<\/code><\/strong><\/td><td>Reserved catalog for user resource usage history<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Data Import &amp; Export: <code class=\"inline-code\">INSERT<\/code>, <code class=\"inline-code\">COPY<\/code>, and <code class=\"inline-code\">\\copy<\/code> (pp. 330–333, Ch.04 Quiz Q2!)<\/h3>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">INSERT<\/code><\/strong>: Simplest way to add data via client or JDBC/ODBC; suitable for <strong>small data volume and low concurrency<\/strong>.<\/li>\n<li><strong>SQL <code class=\"inline-code\">COPY<\/code> (<code class=\"inline-code\">COPY FROM<\/code> / <code class=\"inline-code\">COPY TO<\/code>, server-side file I/O) &amp; JDBC <code class=\"inline-code\">CopyManager<\/code> (<code class=\"inline-code\">org.postgresql.copy.CopyManager<\/code>)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Applies <strong>only to tables, NOT views<\/strong>.<\/li>\n<li><strong>Exporting Partial Table Data (Exact Ch.04 Quiz Q2: C!)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>     COPY t1 FROM '/data/input/t1.txt' DELIMITER '^';\n     COPY t1 TO '/data/input/t1_output.txt' DELIMITER '^';\n     -- Export partial data using a conditional SELECT query:\n     COPY (SELECT * FROM student WHERE age &gt; 20) TO '/data/input/student_part.txt' DELIMITER '^';<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">gsql<\/code> <code class=\"inline-code\">\\copy<\/code> Meta-Command (Client-side file I/O, p. 333)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Unlike SQL <code class=\"inline-code\">COPY<\/code> (which reads/writes files on the <strong>database server<\/strong>), <code class=\"inline-code\">\\copy<\/code> reads/writes files on the <strong>local <code class=\"inline-code\">gsql<\/code> client host<\/strong> using the local OS user's file permissions!<\/li>\n<li>Default delimiters: <strong>Tab<\/strong> in <code class=\"inline-code\">TEXT<\/code> format, <strong>Comma (<code class=\"inline-code\">,<\/code>)<\/strong> in <code class=\"inline-code\">CSV<\/code> format, none in <code class=\"inline-code\">FIXED<\/code> format.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. <code class=\"inline-code\">gs_dump<\/code>, <code class=\"inline-code\">gs_dumpall<\/code>, <code class=\"inline-code\">gs_restore<\/code>, <code class=\"inline-code\">VACUUM FULL<\/code> &amp; <code class=\"inline-code\">ANALYZE<\/code> (pp. 334–345)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">gs_dump<\/code> Key Flags (p. 335)<\/strong>:<\/li>\n<li><code class=\"inline-code\">-U &lt;user&gt;<\/code>, <code class=\"inline-code\">-W &lt;pass&gt;<\/code>, <code class=\"inline-code\">-p &lt;port&gt;<\/code>, <code class=\"inline-code\">-f &lt;file&gt;<\/code>, <code class=\"inline-code\">-F p|c|d|t<\/code> (format), <strong><code class=\"inline-code\">-n &lt;schema&gt;<\/code><\/strong> (include schema), <strong><code class=\"inline-code\">-t &lt;schema.table&gt;<\/code><\/strong> (include table), <strong><code class=\"inline-code\">-T &lt;schema.table&gt;<\/code><\/strong> (exclude table; if both <code class=\"inline-code\">-t<\/code> and <code class=\"inline-code\">-T<\/code> are given, exports objects in <code class=\"inline-code\">-t<\/code> that are not in <code class=\"inline-code\">-T<\/code>).<\/li>\n<li><strong>Exporting without direct permission (p. 340)<\/strong>: Use <strong><code class=\"inline-code\">--role &lt;rolename&gt; --rolepassword &lt;pass&gt;<\/code><\/strong> to assume a role that has export privileges!<\/li>\n<li><strong><code class=\"inline-code\">gs_restore<\/code> Key Flags (pp. 341–343)<\/strong>:<\/li>\n<li>Imports <code class=\"inline-code\">.tar<\/code> (<code class=\"inline-code\">t<\/code>), custom (<code class=\"inline-code\">c<\/code>), or directory (<code class=\"inline-code\">d<\/code>) archives exported by <code class=\"inline-code\">gs_dump<\/code>.<\/li>\n<li><strong><code class=\"inline-code\">-d &lt;dbname&gt;<\/code><\/strong> (target DB), <strong><code class=\"inline-code\">-c<\/code><\/strong> (clean/drop existing objects before recreating), <strong><code class=\"inline-code\">-e<\/code><\/strong> (exit immediately on SQL error), <strong><code class=\"inline-code\">-s<\/code><\/strong> (import <strong>schema/object definitions only<\/strong>, no data).<\/li>\n<li><strong>Post-Import Maintenance (pp. 344–345)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">VACUUM FULL tablename;<\/code><\/strong>: Reclaims disk page fragments left by mass updates/deletions and <strong>returns free space to the OS<\/strong> (run <strong>before<\/strong> <code class=\"inline-code\">ANALYZE<\/code>).<\/li>\n<li><strong><code class=\"inline-code\">ANALYZE tablename;<\/code><\/strong>: Updates <code class=\"inline-code\">PG_STATISTIC<\/code> so the CBO generates optimal query plans after data import.<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Exporting Partial Data with `COPY`, Running `gs_dump`/`gs_restore`, and `VACUUM FULL`","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Export partial data from table `t1` where `a2 = 1` using the SQL `COPY` command with delimiter `'^'`, and perform post-import space reclamation and statistics collection on `product_info` using `VACUUM FULL` and `ANALYZE`.","instructions":["Step 1: Export rows where `a2 = 1` from `t1` using `COPY (SELECT * FROM t1 WHERE a2 = 1) TO '/data/input/t1_output.txt' DELIMITER '^';`.","Step 2: Reclaim disk page fragments on `product_info` and return them to the OS using `VACUUM FULL product_info;`.","Step 3: Update optimizer statistics on `product_info` using `ANALYZE product_info;`."],"starter_code":"-- Step 1: Export partial data from t1 where a2 = 1 using COPY\n____ (SELECT * FROM t1 WHERE a2 = 1) TO '/data/input/t1_output.txt' DELIMITER '^';\n\n-- Step 2: Reclaim disk page fragments on product_info and return space to OS\n____ ____ product_info;\n\n-- Step 3: Update table statistics in PG_STATISTIC\n____ product_info;\n","solution_code":"COPY (SELECT * FROM t1 WHERE a2 = 1) TO '/data/input/t1_output.txt' DELIMITER '^';\n\nVACUUM FULL product_info;\n\nANALYZE product_info;","hints":["Use `COPY (SELECT * FROM t1 WHERE a2 = 1) TO ...` to export partial table data.","Use `VACUUM FULL product_info;` before `ANALYZE product_info;`."],"validation_checks":[{"step":1,"description":"Export partial table data with `COPY (SELECT * FROM t1 WHERE a2 = 1) TO`","required_any":["copy (select * from t1"],"feedback_fail":"Use `COPY (SELECT * FROM t1 WHERE a2 = 1) TO '/data/input/t1_output.txt' DELIMITER '^';`."},{"step":2,"description":"Reclaim disk fragments with `VACUUM FULL product_info`","required_any":["vacuum full product_info"],"feedback_fail":"Run `VACUUM FULL product_info;`."},{"step":3,"description":"Update statistics with `ANALYZE product_info`","required_any":["analyze product_info"],"feedback_fail":"Run `ANALYZE product_info;`."}],"simulated_output":"COPY 15\nVACUUM\nANALYZE","quiz_questions":[{"id":"h5_s4_q1","type":"single","question":"(Official Ch.04 Quiz Q2) Which of the following commands can be used to export partial data from the `student` table?","options":["A. gs_dump","B. gs_dumpall","C. copy Conditional statement","D. gs_backup"],"answer":"C","explanation":"Per Chapter 04 (p. 332 & p. 346), `COPY (SELECT * FROM student WHERE ...) TO '...'` (a `copy` conditional statement) exports a query result set (partial table data), whereas `gs_dump` and `gs_dumpall` export entire tables, schemas, or databases."},{"id":"h5_s4_q2","type":"single","question":"When using `gs_restore` to import an archive exported by `gs_dump`, which option specifies importing ONLY object definitions (schemas/tables) without importing any table data?","options":["A. -c","B. -e","C. -s","D. -d"],"answer":"C","explanation":"Per Chapter 04 (p. 342), `-s` imports only object definitions in schemas and does not import data. `-c` cleans existing objects before import, `-e` exits on error, and `-d` specifies the target database."},{"id":"h5_s4_q3","type":"tf","question":"Unlike the SQL `COPY` statement (which reads and writes files on the database server), the `gsql` meta-command `\\copy` performs read and write operations on local files on the client host.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.04 p. 333). The `\\copy` meta-command in `gsql` reads and writes files on the local client machine using the local user's permissions."}],"reference_figures":[]}}]},{"hour_number":6,"folder_name":"Hour-06-SQL-Basics-Types-DQL-Joins-and-DML","title":"SQL Basics — Classification, Data Types, DQL, Joins & DML","chapter_ref":"Chapter 05 Part 1 (pp. 352–406)","duration_mins":60,"overview":"Master the 4 SQL statement categories (DDL, DML, DCL, DQL), openGauss data types and exact byte sizes (`TINYINT`, `SMALLINT`, `INTEGER`, `BIGINT`, `CHAR`, `VARCHAR`, `CLOB`, Date/Time, Binary, Boolean), DQL filtering (`WHERE`, `BETWEEN`, `AND`/`OR`/`NOT`), sorting (`ORDER BY` column names/positions, `NULLS FIRST/LAST`), pagination (`LIMIT`/`OFFSET`), Joins (`INNER`, `LEFT`, `RIGHT`, `FULL`, Cartesian product), and DML (`INSERT`, `ON DUPLICATE KEY UPDATE`, `UPDATE`, `DELETE`).","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-SQL-Classification-and-Data-Types","exercise_slug":"02-Exercise-SQL-Data-Types-and-Storage-Sizes-Lab","lecture":{"title":"SQL Classification (DDL, DML, DCL, DQL) & Data Types","duration_mins":7,"pdf_ref":"Ch.05, pp. 355–372","objectives":["Classify SQL commands into DDL (`CREATE`, `ALTER`, `DROP`, `TRUNCATE`), DML (`INSERT`, `UPDATE`, `DELETE`), DCL (`COMMIT`, `ROLLBACK`, `GRANT`, `REVOKE`, `LOCK TABLE`), and DQL (`SELECT`)","Memorize exact storage byte sizes for Integer, Serial, Floating-Point, Arbitrary-Precision, Character, Date/Time, Binary, and Boolean types","Avoid the classic exam traps on `BIGINT` (8 bytes, NOT 4 bytes — Ch.05 Quiz!) and `CLOB` (large `TEXT` object — Ch.05 Quiz!)"],"content_markdown":"### 1. Four-Way SQL Statement Classification (pp. 358–359, Ch.05 Quizzes!)\n\n| Category | Full Name | Core SQL Statements in openGauss |\n| :--- | :--- | :--- |\n| **DDL** | **Data Definition Language** | **`CREATE`**, **`ALTER`**, **`DROP`**, **`TRUNCATE TABLE`** (defines/modifies databases, tablespaces, tables, indexes, views, sequences, users, roles, functions) — *Ch.05 p. 446 Quiz Q2: C!* |\n| **DML** | **Data Manipulation Language** | **`INSERT`**, **`UPDATE`**, **`DELETE`** (plus `LOAD`, `DUMP`, `EXPLAIN PLAN`) — *Ch.05 p. 405 Quiz Q2: B!* |\n| **DCL** | **Data Control Language** | **`COMMIT`**, **`ROLLBACK`**, **`GRANT`**, **`REVOKE`**, **`LOCK TABLE`**, **`SHUTDOWN`** |\n| **DQL** | **Data Query Language** | **`SELECT`** (and set combinations of multiple `SELECT` statements) |\n\n---\n\n### 2. Numeric, Character, Date/Time, Binary & Boolean Data Types (pp. 361–372)\n\n| Type Family | Data Type | Storage Space | Key Exam Notes & Aliases |\n| :--- | :--- | :--- | :--- |\n| **Integers** | **`TINYINT` (`INT1`)** | **1 byte** | Whole numbers without decimals |\n| | **`SMALLINT` (`INT2`)** | **2 bytes** | Used when range is guaranteed small |\n| | **`INTEGER` (`INT4` / `BINARY_INTEGER`)** | **4 bytes** | Best balance of range, size, and speed |\n| | **`BIGINT` (`INT8`)** | **8 bytes** | **EXAM TRAP (p. 372 Q1)**: Occupies **8 bytes**, **NOT 4 bytes**! |\n| **Serial (Auto-Inc)** | `SMALLSERIAL` / `SERIAL` / `BIGSERIAL` | **2 / 4 / 8 bytes** | Not true types; creates integer col + sequence + `NOT NULL`. Cannot be added via `ALTER TABLE` or used in temp tables. |\n| **Arbitrary Precision** | `NUMERIC(p,s)` / `DECIMAL(p,s)` / `NUMBER(p,s)` / `DEC(p,s)` | **2 bytes per 4 decimal digits + 8-byte overhead** | `p` (precision) in `[1, 1000]`, `s` (scale) in `[0, p]` |\n| **Floating-Point** | `REAL` (`FLOAT4`) | **4 bytes** | Single-precision inexact float |\n| | `DOUBLE PRECISION` (`FLOAT8` / `BINARY_DOUBLE`) | **8 bytes** | Double-precision inexact float (`FLOAT(p)` is 4 or 8B for p \\in [1,53]) |\n| **Character** | `CHAR(n)` / `CHARACTER(n)` / `NCHAR(n)` | Up to **10 MB** | Fixed-length, blank-padded (default n=1). ASCII = 1B/char; Unicode = 2B/char. |\n| | `VARCHAR(n)` / `VARCHAR2(n)` / `NVARCHAR2(n)` | Up to **10 MB** | Variable-length string without blank padding |\n| | **`TEXT` / `CLOB`** | Up to **1 GB – 1 byte** | **`CLOB` is an alias of `TEXT` used to store large text objects (p. 372 Q2: True!)** |\n| **Date / Time** | `DATE` | **4 bytes** | Date and time |\n| | `TIME [WITHOUT TIME ZONE]` / `TIMESTAMP` / `TIMESTAMPTZ` / `SMALLDATETIME` | **8 bytes** | `SMALLDATETIME` precision is 1 minute (30s–60s rounds up to 1 min!) |\n| | `TIME WITH TIME ZONE` / `INTERVAL [FIELDS]` | **12 bytes** | `INTERVAL DAY(l) TO SECOND(p)` occupies **16 bytes** |\n| **Binary & Boolean** | `BYTEA` / `RAW` / `BLOB` | Up to **1 GB – 8203 B** | `BOOLEAN` occupies **1 byte** (`TRUE`/`1` or `FALSE`/`0`) |","key_takeaways":["`TINYINT` = 1 byte, `SMALLINT` = 2 bytes, `INTEGER` (`BINARY_INTEGER`) = 4 bytes, and `BIGINT` = 8 bytes (Ch.05 p. 372 Quiz Q1: `BIGINT occupies four bytes` is FALSE!).","`CLOB` is an alias of `TEXT` (up to 1 GB minus 1 byte) used to store large character/text objects (Ch.05 p. 372 Quiz Q2: TRUE!).","`INSERT, UPDATE, DELETE` are DML commands (p. 405 Quiz Q2), whereas `CREATE, DROP, ALTER` are DDL commands (p. 446 Quiz Q2)."],"exam_traps":["EXAM TRAP (Ch.05 p. 372 Quiz Q1): '(True or false) BIGINT occupies four bytes.' -> B. False! `BIGINT` (`INT8`) occupies EIGHT (8) bytes (`INTEGER`/`INT4` occupies 4 bytes).","EXAM TRAP (Ch.05 p. 372 Quiz Q2): '(True or false) CLOB is used to store large object data of the TEXT type.' -> A. True!"],"content_html":"<h3>1. Four-Way SQL Statement Classification (pp. 358–359, Ch.05 Quizzes!)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Category<\/th><th>Full Name<\/th><th>Core SQL Statements in openGauss<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>DDL<\/strong><\/td><td><strong>Data Definition Language<\/strong><\/td><td><strong><code class=\"inline-code\">CREATE<\/code><\/strong>, <strong><code class=\"inline-code\">ALTER<\/code><\/strong>, <strong><code class=\"inline-code\">DROP<\/code><\/strong>, <strong><code class=\"inline-code\">TRUNCATE TABLE<\/code><\/strong> (defines/modifies databases, tablespaces, tables, indexes, views, sequences, users, roles, functions) — <em>Ch.05 p. 446 Quiz Q2: C!<\/em><\/td><\/tr>\n<tr><td><strong>DML<\/strong><\/td><td><strong>Data Manipulation Language<\/strong><\/td><td><strong><code class=\"inline-code\">INSERT<\/code><\/strong>, <strong><code class=\"inline-code\">UPDATE<\/code><\/strong>, <strong><code class=\"inline-code\">DELETE<\/code><\/strong> (plus <code class=\"inline-code\">LOAD<\/code>, <code class=\"inline-code\">DUMP<\/code>, <code class=\"inline-code\">EXPLAIN PLAN<\/code>) — <em>Ch.05 p. 405 Quiz Q2: B!<\/em><\/td><\/tr>\n<tr><td><strong>DCL<\/strong><\/td><td><strong>Data Control Language<\/strong><\/td><td><strong><code class=\"inline-code\">COMMIT<\/code><\/strong>, <strong><code class=\"inline-code\">ROLLBACK<\/code><\/strong>, <strong><code class=\"inline-code\">GRANT<\/code><\/strong>, <strong><code class=\"inline-code\">REVOKE<\/code><\/strong>, <strong><code class=\"inline-code\">LOCK TABLE<\/code><\/strong>, <strong><code class=\"inline-code\">SHUTDOWN<\/code><\/strong><\/td><\/tr>\n<tr><td><strong>DQL<\/strong><\/td><td><strong>Data Query Language<\/strong><\/td><td><strong><code class=\"inline-code\">SELECT<\/code><\/strong> (and set combinations of multiple <code class=\"inline-code\">SELECT<\/code> statements)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Numeric, Character, Date/Time, Binary &amp; Boolean Data Types (pp. 361–372)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Type Family<\/th><th>Data Type<\/th><th>Storage Space<\/th><th>Key Exam Notes &amp; Aliases<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Integers<\/strong><\/td><td><strong><code class=\"inline-code\">TINYINT<\/code> (<code class=\"inline-code\">INT1<\/code>)<\/strong><\/td><td><strong>1 byte<\/strong><\/td><td>Whole numbers without decimals<\/td><\/tr>\n<tr><td><\/td><td><strong><code class=\"inline-code\">SMALLINT<\/code> (<code class=\"inline-code\">INT2<\/code>)<\/strong><\/td><td><strong>2 bytes<\/strong><\/td><td>Used when range is guaranteed small<\/td><\/tr>\n<tr><td><\/td><td><strong><code class=\"inline-code\">INTEGER<\/code> (<code class=\"inline-code\">INT4<\/code> / <code class=\"inline-code\">BINARY_INTEGER<\/code>)<\/strong><\/td><td><strong>4 bytes<\/strong><\/td><td>Best balance of range, size, and speed<\/td><\/tr>\n<tr><td><\/td><td><strong><code class=\"inline-code\">BIGINT<\/code> (<code class=\"inline-code\">INT8<\/code>)<\/strong><\/td><td><strong>8 bytes<\/strong><\/td><td><strong>EXAM TRAP (p. 372 Q1)<\/strong>: Occupies <strong>8 bytes<\/strong>, <strong>NOT 4 bytes<\/strong>!<\/td><\/tr>\n<tr><td><strong>Serial (Auto-Inc)<\/strong><\/td><td><code class=\"inline-code\">SMALLSERIAL<\/code> / <code class=\"inline-code\">SERIAL<\/code> / <code class=\"inline-code\">BIGSERIAL<\/code><\/td><td><strong>2 / 4 / 8 bytes<\/strong><\/td><td>Not true types; creates integer col + sequence + <code class=\"inline-code\">NOT NULL<\/code>. Cannot be added via <code class=\"inline-code\">ALTER TABLE<\/code> or used in temp tables.<\/td><\/tr>\n<tr><td><strong>Arbitrary Precision<\/strong><\/td><td><code class=\"inline-code\">NUMERIC(p,s)<\/code> / <code class=\"inline-code\">DECIMAL(p,s)<\/code> / <code class=\"inline-code\">NUMBER(p,s)<\/code> / <code class=\"inline-code\">DEC(p,s)<\/code><\/td><td><strong>2 bytes per 4 decimal digits + 8-byte overhead<\/strong><\/td><td><code class=\"inline-code\">p<\/code> (precision) in <code class=\"inline-code\">[1, 1000]<\/code>, <code class=\"inline-code\">s<\/code> (scale) in <code class=\"inline-code\">[0, p]<\/code><\/td><\/tr>\n<tr><td><strong>Floating-Point<\/strong><\/td><td><code class=\"inline-code\">REAL<\/code> (<code class=\"inline-code\">FLOAT4<\/code>)<\/td><td><strong>4 bytes<\/strong><\/td><td>Single-precision inexact float<\/td><\/tr>\n<tr><td><\/td><td><code class=\"inline-code\">DOUBLE PRECISION<\/code> (<code class=\"inline-code\">FLOAT8<\/code> / <code class=\"inline-code\">BINARY_DOUBLE<\/code>)<\/td><td><strong>8 bytes<\/strong><\/td><td>Double-precision inexact float (<code class=\"inline-code\">FLOAT(p)<\/code> is 4 or 8B for p \\in [1,53])<\/td><\/tr>\n<tr><td><strong>Character<\/strong><\/td><td><code class=\"inline-code\">CHAR(n)<\/code> / <code class=\"inline-code\">CHARACTER(n)<\/code> / <code class=\"inline-code\">NCHAR(n)<\/code><\/td><td>Up to <strong>10 MB<\/strong><\/td><td>Fixed-length, blank-padded (default n=1). ASCII = 1B/char; Unicode = 2B/char.<\/td><\/tr>\n<tr><td><\/td><td><code class=\"inline-code\">VARCHAR(n)<\/code> / <code class=\"inline-code\">VARCHAR2(n)<\/code> / <code class=\"inline-code\">NVARCHAR2(n)<\/code><\/td><td>Up to <strong>10 MB<\/strong><\/td><td>Variable-length string without blank padding<\/td><\/tr>\n<tr><td><\/td><td><strong><code class=\"inline-code\">TEXT<\/code> / <code class=\"inline-code\">CLOB<\/code><\/strong><\/td><td>Up to <strong>1 GB – 1 byte<\/strong><\/td><td><strong><code class=\"inline-code\">CLOB<\/code> is an alias of <code class=\"inline-code\">TEXT<\/code> used to store large text objects (p. 372 Q2: True!)<\/strong><\/td><\/tr>\n<tr><td><strong>Date / Time<\/strong><\/td><td><code class=\"inline-code\">DATE<\/code><\/td><td><strong>4 bytes<\/strong><\/td><td>Date and time<\/td><\/tr>\n<tr><td><\/td><td><code class=\"inline-code\">TIME [WITHOUT TIME ZONE]<\/code> / <code class=\"inline-code\">TIMESTAMP<\/code> / <code class=\"inline-code\">TIMESTAMPTZ<\/code> / <code class=\"inline-code\">SMALLDATETIME<\/code><\/td><td><strong>8 bytes<\/strong><\/td><td><code class=\"inline-code\">SMALLDATETIME<\/code> precision is 1 minute (30s–60s rounds up to 1 min!)<\/td><\/tr>\n<tr><td><\/td><td><code class=\"inline-code\">TIME WITH TIME ZONE<\/code> / <code class=\"inline-code\">INTERVAL [FIELDS]<\/code><\/td><td><strong>12 bytes<\/strong><\/td><td><code class=\"inline-code\">INTERVAL DAY(l) TO SECOND(p)<\/code> occupies <strong>16 bytes<\/strong><\/td><\/tr>\n<tr><td><strong>Binary &amp; Boolean<\/strong><\/td><td><code class=\"inline-code\">BYTEA<\/code> / <code class=\"inline-code\">RAW<\/code> / <code class=\"inline-code\">BLOB<\/code><\/td><td>Up to <strong>1 GB – 8203 B<\/strong><\/td><td><code class=\"inline-code\">BOOLEAN<\/code> occupies <strong>1 byte<\/strong> (<code class=\"inline-code\">TRUE<\/code>/<code class=\"inline-code\">1<\/code> or <code class=\"inline-code\">FALSE<\/code>/<code class=\"inline-code\">0<\/code>)<\/td><\/tr>\n<\/tbody><\/table><\/div>"},"exercise":{"title":"Hands-On Lab: Creating Tables with Numeric, Serial, Character (`CLOB`), and Date/Time Types","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Create a table `type_audit` that tests `TINYINT` (1B), `INTEGER` (4B), `BIGINT` (8B), `DECIMAL(10,4)`, `CLOB` (large text object), and `SMALLDATETIME` (minute-rounded timestamp), insert a test row, and query it.","instructions":["Step 1: Complete `CREATE TABLE type_audit` with columns `a TINYINT`, `b INTEGER`, `c BIGINT`, `d DECIMAL(10,4)`, `e CLOB`, and `f SMALLDATETIME`.","Step 2: Insert `(100, 1000, 10000, 123456.1223, 'Large text description', '2003-04-12 04:05:06')` into `type_audit` and run `SELECT * FROM type_audit;`."],"starter_code":"-- Step 1: Create table type_audit with exact data types\nCREATE TABLE type_audit (\n    a TINYINT,\n    b INTEGER,\n    c ____,          -- 8-byte integer type\n    d DECIMAL(10,4),\n    e ____,          -- Large object data of the TEXT type\n    f SMALLDATETIME\n);\n\n-- Step 2: Insert a test record and query\nINSERT INTO type_audit VALUES (100, 1000, 10000, 123456.1223, 'Large text description', '2003-04-12 04:05:06');\nSELECT * FROM type_audit;\n","solution_code":"CREATE TABLE type_audit (\n    a TINYINT,\n    b INTEGER,\n    c BIGINT,\n    d DECIMAL(10,4),\n    e CLOB,\n    f SMALLDATETIME\n);\n\nINSERT INTO type_audit VALUES (100, 1000, 10000, 123456.1223, 'Large text description', '2003-04-12 04:05:06');\nSELECT * FROM type_audit;","hints":["The 8-byte integer type is `BIGINT`.","The large text object alias of `TEXT` is `CLOB`."],"validation_checks":[{"step":1,"description":"Include `BIGINT` (8-byte integer) and `CLOB` (large text object)","required_any":["c bigint"],"feedback_fail":"Define column `c` as `BIGINT`."},{"step":2,"description":"Define column `e` as `CLOB`","required_any":["e clob"],"feedback_fail":"Define column `e` as `CLOB`."}],"simulated_output":"CREATE TABLE\nINSERT 0 1\n  a  |  b   |   c   |      d      |           e            |          f          \n-----+------+-------+-------------+------------------------+---------------------\n 100 | 1000 | 10000 | 123456.1223 | Large text description | 2003-04-12 04:05:00\n(1 row)","quiz_questions":[{"id":"h6_s1_q1","type":"tf","question":"(Official Ch.05 Quiz p. 372 Q1) `BIGINT` occupies four bytes.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.05 p. 362 & p. 372). `BIGINT` (`INT8`) occupies eight (8) bytes. `INTEGER` (`INT4`) occupies four bytes."},{"id":"h6_s1_q2","type":"tf","question":"(Official Ch.05 Quiz p. 372 Q2) `CLOB` is used to store large object data of the `TEXT` type.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.05 p. 366 & p. 372). `CLOB` is the alias of the `TEXT` type (up to 1 GB minus 1 byte) and is used to store large text objects."},{"id":"h6_s1_q3","type":"single","question":"(Official Ch.05 Quiz p. 405 Q2) Which of the following four groups of SQL commands belong to the DML commands?","options":["A. CREATE, DROP, UPDATE","B. INSERT, UPDATE, DELETE","C. INSERT, DROP, ALTER","D. UPDATE, DELETE, ALTER"],"answer":"B","explanation":"Per Chapter 05 (p. 359 & p. 405), `INSERT`, `UPDATE`, and `DELETE` are Data Manipulation Language (DML) commands, whereas `CREATE`, `DROP`, and `ALTER` are DDL commands."}],"reference_figures":[]}},{"sprint_number":2,"lecture_slug":"03-Lecture-DQL-Filtering-Sorting-and-Pagination","exercise_slug":"04-Exercise-WHERE-ORDER-BY-and-LIMIT-OFFSET-Lab","lecture":{"title":"DQL Queries — Filtering (`WHERE`), Sorting (`ORDER BY`) & Pagination (`LIMIT`/`OFFSET`)","duration_mins":7,"pdf_ref":"Ch.05, pp. 373–395","objectives":["Write `SELECT` queries with column/table aliases (`AS` or space) and `WHERE` conditions (`Position = 'Engineer' AND Salary > 6000`, `BETWEEN ... AND ...`)","Sort results with `ORDER BY` using column names, 1-based column positions (`ORDER BY 2 DESC, 3 ASC` — Ch.05 Quiz!), or expressions, plus `NULLS FIRST | LAST`","Paginate queries using `LIMIT count OFFSET start`, `OFFSET start LIMIT count`, and `LIMIT offset, count`"],"content_markdown":"### 1. Relational Operations & Conditional Filtering (`WHERE`, pp. 374–382, 394)\n- **3 Relational Algebra Operations in `SELECT` (p. 374)**:\n  1. **`SELECT` (Selection)**: Filters rows (tuples) that satisfy a condition.\n  2. **`PROJECT` (Projection)**: Selects specific columns (attributes) and filters out others.\n  3. **`JOIN`**: Combines rows from multiple tables.\n- **Conditional Query Rules (`WHERE`, pp. 380–382, Ch.05 p. 394 Quizzes!)**:\n  - **String & Date Literals**: Single quotation marks (`'...'`) are optional for numbers but **mandatory for character strings and dates**!\n    - **Ch.05 p. 394 Quiz Q1**: Searching for records whose position is an engineer and salary > 6000 is **`Position = 'Engineer' AND Salary > 6000`** (Option D — `'Engineer'` must be in single quotes and joined with `AND`!).\n  - **Range Predicate (`BETWEEN ... AND ...`)**: Inclusive on both bounds!\n    - **Ch.05 p. 394 Quiz Q2**: **`age BETWEEN 20 AND 30`** is strictly equivalent to **`age >= 20 AND age <= 30`** (Option A!).\n  - **Logical Operator Precedence & Three-Valued Logic (`TRUE`, `FALSE`, `NULL`)**:\n    - Priority order: **`NOT` > `AND` > `OR`**.\n    - Truth table with `NULL` (Unknown):\n      - **`TRUE OR NULL` -> `TRUE`**; **`FALSE OR NULL` -> `NULL`**.\n      - **`FALSE AND NULL` -> `FALSE`**; **`TRUE AND NULL` -> `NULL`**.\n      - **`NOT NULL` -> `NULL`**.\n<!-- PDF_FIGS_START -->\n![Relational Operations: SELECT (Rows), PROJECT (Columns), JOIN (Merge) (Official Reference: p. 374)](./assets/images/p3_h6s2_sql_ops_visual.png)\n*Figure: Relational Operations: SELECT (Rows), PROJECT (Columns), JOIN (Merge) (Official Reference: p. 374)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Data Sorting (`ORDER BY`, pp. 390–391, 395)\n```sql\nORDER BY { column_name | number | expression } [ ASC | DESC ] [ NULLS FIRST | NULLS LAST ] [, ...]\n```\n- **Default Order**: **`ASC`** (ascending) is the default when neither `ASC` nor `DESC` is specified!\n- **Sorting by Column Position (`number`)**: `1` refers to the 1st column in the `SELECT` list, `2` refers to the 2nd column, etc.\n  - **Ch.05 p. 395 Quiz Q3 (Answer: AC!)**: To query `name, age, score` from `student` sorted by `age` descending and then `score` ascending:\n    - **Option A**: `SELECT name, age, score FROM student order by age desc, score;` (valid because `score` defaults to `ASC`!)\n    - **Option C**: `SELECT name, age, score FROM student order by 2 desc, 3 asc;` (valid because `2` is `age` and `3` is `score`!)\n- **Default `NULL` Placement (p. 390)**:\n  - For **`ASC`**, **`NULLS FIRST`** is the default in openGauss (per slide 38, p. 390).\n  - For **`DESC`**, **`NULLS LAST`** is the default.\n\n---\n\n### 3. Data Limit & Pagination (`LIMIT` and `OFFSET`, pp. 392–393)\n- **`LIMIT count`**: Maximum number of rows to return.\n- **`OFFSET start`**: Number of initial rows to skip before returning rows.\n- **Three Equivalent Syntax Forms in openGauss (p. 392)**:\n  - **`LIMIT 5, 20`** \\equiv **`LIMIT 20 OFFSET 5`** \\equiv **`OFFSET 5 LIMIT 20`**\n  - All three mean: **skip the first 5 rows, and return at most 20 rows**!","key_takeaways":["String literals in `WHERE` must be enclosed in single quotes (`Position = 'Engineer' AND Salary > 6000`), and `age BETWEEN 20 AND 30` is equivalent to `age >= 20 AND age <= 30` (Ch.05 p. 394 Q1 & Q2).","In `ORDER BY`, `ASC` is the default direction, and you can reference `SELECT` columns by their 1-based position (`ORDER BY 2 DESC, 3 ASC` is equivalent to `ORDER BY age DESC, score` for `SELECT name, age, score` — Ch.05 p. 395 Q3: AC).","`LIMIT 5, 20`, `LIMIT 20 OFFSET 5`, and `OFFSET 5 LIMIT 20` are all equivalent and output 20 rows after skipping 5 rows."],"exam_traps":["EXAM TRAP (Ch.05 p. 395 Quiz Q3): Both `SELECT name, age, score FROM student order by age desc, score;` (A) and `SELECT name, age, score FROM student order by 2 desc, 3 asc;` (C) are correct! Don't forget that omitting `ASC` after `score` defaults to ascending order.","EXAM TRAP: In `LIMIT 5, 20` (comma syntax), the FIRST number (`5`) is the offset (rows skipped) and the SECOND number (`20`) is the row count, whereas in `LIMIT 20 OFFSET 5`, `20` is the count and `5` is the offset!"],"content_html":"<h3>1. Relational Operations &amp; Conditional Filtering (<code class=\"inline-code\">WHERE<\/code>, pp. 374–382, 394)<\/h3>\n<ul class=\"md-list\">\n<li><strong>3 Relational Algebra Operations in <code class=\"inline-code\">SELECT<\/code> (p. 374)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong><code class=\"inline-code\">SELECT<\/code> (Selection)<\/strong>: Filters rows (tuples) that satisfy a condition.<\/li>\n<li><strong><code class=\"inline-code\">PROJECT<\/code> (Projection)<\/strong>: Selects specific columns (attributes) and filters out others.<\/li>\n<li><strong><code class=\"inline-code\">JOIN<\/code><\/strong>: Combines rows from multiple tables.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Conditional Query Rules (<code class=\"inline-code\">WHERE<\/code>, pp. 380–382, Ch.05 p. 394 Quizzes!)<\/strong>:<\/li>\n<li><strong>String &amp; Date Literals<\/strong>: Single quotation marks (<code class=\"inline-code\">'...'<\/code>) are optional for numbers but <strong>mandatory for character strings and dates<\/strong>!<\/li>\n<li><strong>Ch.05 p. 394 Quiz Q1<\/strong>: Searching for records whose position is an engineer and salary &gt; 6000 is <strong><code class=\"inline-code\">Position = 'Engineer' AND Salary &gt; 6000<\/code><\/strong> (Option D — <code class=\"inline-code\">'Engineer'<\/code> must be in single quotes and joined with <code class=\"inline-code\">AND<\/code>!).<\/li>\n<li><strong>Range Predicate (<code class=\"inline-code\">BETWEEN ... AND ...<\/code>)<\/strong>: Inclusive on both bounds!<\/li>\n<li><strong>Ch.05 p. 394 Quiz Q2<\/strong>: <strong><code class=\"inline-code\">age BETWEEN 20 AND 30<\/code><\/strong> is strictly equivalent to <strong><code class=\"inline-code\">age &gt;= 20 AND age &lt;= 30<\/code><\/strong> (Option A!).<\/li>\n<li><strong>Logical Operator Precedence &amp; Three-Valued Logic (<code class=\"inline-code\">TRUE<\/code>, <code class=\"inline-code\">FALSE<\/code>, <code class=\"inline-code\">NULL<\/code>)<\/strong>:<\/li>\n<li>Priority order: <strong><code class=\"inline-code\">NOT<\/code> &gt; <code class=\"inline-code\">AND<\/code> &gt; <code class=\"inline-code\">OR<\/code><\/strong>.<\/li>\n<li>Truth table with <code class=\"inline-code\">NULL<\/code> (Unknown):<\/li>\n<li><strong><code class=\"inline-code\">TRUE OR NULL<\/code> -&gt; <code class=\"inline-code\">TRUE<\/code><\/strong>; <strong><code class=\"inline-code\">FALSE OR NULL<\/code> -&gt; <code class=\"inline-code\">NULL<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">FALSE AND NULL<\/code> -&gt; <code class=\"inline-code\">FALSE<\/code><\/strong>; <strong><code class=\"inline-code\">TRUE AND NULL<\/code> -&gt; <code class=\"inline-code\">NULL<\/code><\/strong>.<\/li>\n<li><strong><code class=\"inline-code\">NOT NULL<\/code> -&gt; <code class=\"inline-code\">NULL<\/code><\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h6s2_sql_ops_visual.png\" alt=\"Relational Operations: SELECT (Rows), PROJECT (Columns), JOIN (Merge)\" data-caption=\"Relational Operations: SELECT (Rows), PROJECT (Columns), JOIN (Merge) (Official Reference: p. 374)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Relational Operations: SELECT (Rows), PROJECT (Columns), JOIN (Merge)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 374 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Data Sorting (<code class=\"inline-code\">ORDER BY<\/code>, pp. 390–391, 395)<\/h3>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>ORDER BY { column_name | number | expression } [ ASC | DESC ] [ NULLS FIRST | NULLS LAST ] [, ...]<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Default Order<\/strong>: <strong><code class=\"inline-code\">ASC<\/code><\/strong> (ascending) is the default when neither <code class=\"inline-code\">ASC<\/code> nor <code class=\"inline-code\">DESC<\/code> is specified!<\/li>\n<li><strong>Sorting by Column Position (<code class=\"inline-code\">number<\/code>)<\/strong>: <code class=\"inline-code\">1<\/code> refers to the 1st column in the <code class=\"inline-code\">SELECT<\/code> list, <code class=\"inline-code\">2<\/code> refers to the 2nd column, etc.<\/li>\n<li><strong>Ch.05 p. 395 Quiz Q3 (Answer: AC!)<\/strong>: To query <code class=\"inline-code\">name, age, score<\/code> from <code class=\"inline-code\">student<\/code> sorted by <code class=\"inline-code\">age<\/code> descending and then <code class=\"inline-code\">score<\/code> ascending:<\/li>\n<li><strong>Option A<\/strong>: <code class=\"inline-code\">SELECT name, age, score FROM student order by age desc, score;<\/code> (valid because <code class=\"inline-code\">score<\/code> defaults to <code class=\"inline-code\">ASC<\/code>!)<\/li>\n<li><strong>Option C<\/strong>: <code class=\"inline-code\">SELECT name, age, score FROM student order by 2 desc, 3 asc;<\/code> (valid because <code class=\"inline-code\">2<\/code> is <code class=\"inline-code\">age<\/code> and <code class=\"inline-code\">3<\/code> is <code class=\"inline-code\">score<\/code>!)<\/li>\n<li><strong>Default <code class=\"inline-code\">NULL<\/code> Placement (p. 390)<\/strong>:<\/li>\n<li>For <strong><code class=\"inline-code\">ASC<\/code><\/strong>, <strong><code class=\"inline-code\">NULLS FIRST<\/code><\/strong> is the default in openGauss (per slide 38, p. 390).<\/li>\n<li>For <strong><code class=\"inline-code\">DESC<\/code><\/strong>, <strong><code class=\"inline-code\">NULLS LAST<\/code><\/strong> is the default.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Data Limit &amp; Pagination (<code class=\"inline-code\">LIMIT<\/code> and <code class=\"inline-code\">OFFSET<\/code>, pp. 392–393)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">LIMIT count<\/code><\/strong>: Maximum number of rows to return.<\/li>\n<li><strong><code class=\"inline-code\">OFFSET start<\/code><\/strong>: Number of initial rows to skip before returning rows.<\/li>\n<li><strong>Three Equivalent Syntax Forms in openGauss (p. 392)<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">LIMIT 5, 20<\/code><\/strong> \\equiv <strong><code class=\"inline-code\">LIMIT 20 OFFSET 5<\/code><\/strong> \\equiv <strong><code class=\"inline-code\">OFFSET 5 LIMIT 20<\/code><\/strong><\/li>\n<li>All three mean: <strong>skip the first 5 rows, and return at most 20 rows<\/strong>!<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Filtering, Positional `ORDER BY`, and `LIMIT / OFFSET` Pagination","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Write three DQL queries against the `employees` and `student` tables to verify exact Huawei exam syntax for `WHERE` filtering, positional `ORDER BY`, and `LIMIT / OFFSET` pagination.","instructions":["Step 1: Query all columns from `employees` where `Position = 'Engineer' AND Salary > 6000` and `age BETWEEN 20 AND 30`.","Step 2: Query `name, age, score` from `student` sorted by `age` descending and `score` ascending using positional numbers (`ORDER BY 2 DESC, 3 ASC`).","Step 3: Add `LIMIT 20 OFFSET 5` to skip 5 rows and return 20 rows."],"starter_code":"-- Step 1: Filter Engineers with Salary > 6000 and age between 20 and 30\nSELECT * FROM employees\nWHERE Position = ____ AND Salary > 6000 AND age ____ 20 AND 30;\n\n-- Step 2 & 3: Query student sorted by 2nd col DESC, 3rd col ASC, skipping 5 rows and returning 20\nSELECT name, age, score FROM student\nORDER BY ____ DESC, ____ ASC\nLIMIT ____ OFFSET ____;\n","solution_code":"SELECT * FROM employees\nWHERE Position = 'Engineer' AND Salary > 6000 AND age BETWEEN 20 AND 30;\n\nSELECT name, age, score FROM student\nORDER BY 2 DESC, 3 ASC\nLIMIT 20 OFFSET 5;","hints":["Enclose `'Engineer'` in single quotes and use the `BETWEEN 20 AND 30` operator.","In `SELECT name, age, score`, `age` is column `2` and `score` is column `3`.","To skip 5 rows and return 20 rows, use `LIMIT 20 OFFSET 5`."],"validation_checks":[{"step":1,"description":"Filter with `Position = 'Engineer'` and `BETWEEN 20 AND 30`","required_any":["position = 'engineer'"],"feedback_fail":"Ensure `'Engineer'` is enclosed in single quotes."},{"step":2,"description":"Sort by positional columns `ORDER BY 2 DESC, 3 ASC`","required_any":["order by 2 desc, 3 asc"],"feedback_fail":"Use `ORDER BY 2 DESC, 3 ASC`."},{"step":3,"description":"Paginate with `LIMIT 20 OFFSET 5`","required_any":["limit 20 offset 5"],"feedback_fail":"Use `LIMIT 20 OFFSET 5` to return 20 rows after skipping 5 rows."}],"simulated_output":" emp_id |  name   | position | salary | age \n--------+---------+----------+--------+-----\n    101 | Li Ming | Engineer |   8500 |  26\n(1 row)\n\n   name   | age | score \n----------+-----+-------\n Zhang Yi |  22 |    88\n Wang Wu  |  22 |    95\n Zhao Liu |  21 |    91\n(3 rows)","quiz_questions":[{"id":"h6_s2_q1","type":"single","question":"(Official Ch.05 Quiz p. 394 Q1) Which of the following logical expressions is used to search for records whose position is an engineer and salary is greater than 6000?","options":["A. Position = 'Engineer' OR Salary > 6000","B. Position = Engineer AND Salary > 6000","C. Position = Engineer OR Salary > 6000","D. Position = 'Engineer' AND Salary > 6000"],"answer":"D","explanation":"Per Chapter 05 (p. 381 & p. 394), character string literals must be enclosed in single quotation marks (`'Engineer'`), and both conditions must hold simultaneously (`AND`)."},{"id":"h6_s2_q2","type":"single","question":"(Official Ch.05 Quiz p. 394 Q2) In a `WHERE` clause, the expression `age between 20 and 30` is equivalent to:","options":["A. age >= 20 and age <= 30","B. age >= 20 or age <= 30","C. age > 20 and age < 30","D. age > 20 or age < 30"],"answer":"A","explanation":"Per Chapter 05 (p. 394), `BETWEEN 20 AND 30` is inclusive of both endpoints and is equivalent to `age >= 20 and age <= 30`."},{"id":"h6_s2_q3","type":"multiple","question":"(Official Ch.05 Quiz p. 395 Q3) Assume that you want to query student names, ages, and scores from the `student` table, and want the results sorted in descending order by age. If there are students of the same age, they are sorted in ascending order by score instead. Which of the following SQL statements can be used?","options":["A. SELECT name, age, score FROM student order by age desc, score;","B. SELECT name, age, score FROM student order by age, score asc;","C. SELECT name, age, score FROM student order by 2 desc, 3 asc;","D. SELECT name, age, score FROM student order by 1 desc, 2;"],"answer":"AC","explanation":"Per Chapter 05 (p. 390 & p. 395), Option A sorts by `age desc` and `score` (which defaults to `ASC`), and Option C uses 1-based column positions (`2` = `age`, `3` = `score`) with `2 desc, 3 asc`."}],"reference_figures":[{"slug":"p3_h6s2_sql_ops_visual","title":"Relational Operations: SELECT (Rows), PROJECT (Columns), JOIN (Merge)","pdf_page":374}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Join-Queries-Inner-Outer-and-Cartesian-Product","exercise_slug":"06-Exercise-Inner-Left-Right-Full-Outer-Join-Lab","lecture":{"title":"Join Queries — Cartesian Product, Inner Join & Outer Joins","duration_mins":7,"pdf_ref":"Ch.05, pp. 383–389","objectives":["Calculate the row count (I × J) and column count (N + M) of a Cartesian Product (`SELECT * FROM A, B;`)","Write `INNER JOIN ... ON` queries and understand the legacy `(+)` operator caveat","Contrast `LEFT [OUTER] JOIN`, `RIGHT [OUTER] JOIN`, and `FULL [OUTER] JOIN` on Huawei's `education` and `training` tables"],"content_markdown":"### 1. Cartesian Product & Join Basics (pp. 383–384)\n- **Cartesian Product (Direct Product, X \\× Y, p. 383)**:\n  - If table X has **I tuples (rows)** and **N attributes (columns)**, and table Y has **J tuples** and **M attributes**, then `SELECT * FROM X, Y;` (a join without any `WHERE` or `ON` join condition) produces:\n    - **I \\× J tuples (rows)** (e.g., 4 rows in A \\× 5 rows in B = **20 rows**).\n    - **N + M attributes (columns)**.\n- **Table References in `FROM`**: Can be ordinary tables, views, or subqueries (`(SELECT ...) AS alias`).\n- **Note on `(+)` Outer Join Operator (p. 384)**: openGauss supports Oracle's `(+)` operator in `WHERE` clauses to convert a join into an outer join, **but it is NOT recommended** because it is not standard SQL syntax.\n\n---\n\n### 2. Inner Join vs. Outer Joins (`LEFT`, `RIGHT`, `FULL`, pp. 385–389)\n\n| Join Type | Syntax (`OUTER` / `INNER` keyword is optional) | Returned Rows & `NULL` Padding Behavior |\n| :--- | :--- | :--- |\n| **Inner Join** | `A [INNER] JOIN B ON A.id = B.id` | Returns **only** rows that satisfy the join condition in **both** tables. |\n| **Left Outer Join** | `A LEFT [OUTER] JOIN B ON A.id = B.id` | Driven by the **left table (`A`)**: returns all rows from `A` + matched data from `B`. Unmatched columns from `B` are filled with **`NULL`**. |\n| **Right Outer Join** | `A RIGHT [OUTER] JOIN B ON A.id = B.id` | Driven by the **right table (`B`)**: returns all rows from `B` + matched data from `A`. Unmatched columns from `A` are filled with **`NULL`**. |\n| **Full Outer Join** | `A FULL [OUTER] JOIN B ON A.id = B.id` | Returns all matched rows **plus** unmatched rows from `A` (padded with `NULL` on the right) **and** unmatched rows from `B` (padded with `NULL` on the left). |\n\n---\n\n### 3. Official Walkthrough: `education e` (`staff_id` 11, 12, 13) \\\\bowtie `training t` (`staff_id` 10, 11, 12) (pp. 387–389)\n- **`education e`**: `(11, 'master')`, `(12, 'doctor')`, `(13, 'scholar')`\n- **`training t`**: `(10, 90)`, `(11, 92)`, `(12, 95)`\n  - **`INNER JOIN`**: Returns only `11` and `12` (2 rows).\n  - **`e LEFT JOIN t`**: Returns `11` (`92`), `12` (`95`), and `13` (`score = NULL`) (3 rows).\n  - **`e RIGHT JOIN t`**: Returns `NULL` (`staff_id` from `e` is `NULL`, `score = 90`), `11` (`92`), and `12` (`95`) (3 rows).\n  - **`e FULL JOIN t`**: Returns `11`, `12`, `13` (`score = NULL`), and `NULL` (`score = 90`) (4 rows).\n<!-- PDF_FIGS_START -->\n![Left Outer Join Row Matching Visual Example (Official Reference: p. 387)](./assets/images/p3_h6s3_left_outer_join.png)\n*Figure: Left Outer Join Row Matching Visual Example (Official Reference: p. 387)*\n\n![Right Outer Join Row Matching Visual Example (Official Reference: p. 388)](./assets/images/p3_h6s3_right_outer_join.png)\n*Figure: Right Outer Join Row Matching Visual Example (Official Reference: p. 388)*\n\n![Full Outer Join Row Matching Visual Example (Official Reference: p. 389)](./assets/images/p3_h6s3_full_outer_join.png)\n*Figure: Full Outer Join Row Matching Visual Example (Official Reference: p. 389)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["A Cartesian product between table X (I rows, N columns) and table Y (J rows, M columns) produces I * J rows and N + M columns.","`LEFT JOIN` preserves all rows from the left table (padding right columns with `NULL`), `RIGHT JOIN` preserves all rows from the right table, and `FULL JOIN` preserves unmatched rows from both sides.","In `LEFT JOIN`, `ON` clause conditions determine row matching (driving `NULL` extension), whereas outer `WHERE` conditions filter the resulting joined rows afterwards."],"exam_traps":["EXAM TRAP: In `SELECT e.staff_id, e.higest_degree, t.score FROM education e RIGHT JOIN training t ON (e.staff_id = t.staff_id);`, why is `e.staff_id` displayed as empty/NULL for `t.staff_id = 10`? Because the `SELECT` list projected `e.staff_id` (from the left table), which has no match for `10`!","EXAM TRAP: If table A has 4 records and table B has 5 records, `SELECT * FROM A, B;` without a join condition returns 20 (4 x 5) records."],"content_html":"<h3>1. Cartesian Product &amp; Join Basics (pp. 383–384)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Cartesian Product (Direct Product, X \\× Y, p. 383)<\/strong>:<\/li>\n<li>If table X has <strong>I tuples (rows)<\/strong> and <strong>N attributes (columns)<\/strong>, and table Y has <strong>J tuples<\/strong> and <strong>M attributes<\/strong>, then <code class=\"inline-code\">SELECT * FROM X, Y;<\/code> (a join without any <code class=\"inline-code\">WHERE<\/code> or <code class=\"inline-code\">ON<\/code> join condition) produces:<\/li>\n<li><strong>I \\× J tuples (rows)<\/strong> (e.g., 4 rows in A \\× 5 rows in B = <strong>20 rows<\/strong>).<\/li>\n<li><strong>N + M attributes (columns)<\/strong>.<\/li>\n<li><strong>Table References in <code class=\"inline-code\">FROM<\/code><\/strong>: Can be ordinary tables, views, or subqueries (<code class=\"inline-code\">(SELECT ...) AS alias<\/code>).<\/li>\n<li><strong>Note on <code class=\"inline-code\">(+)<\/code> Outer Join Operator (p. 384)<\/strong>: openGauss supports Oracle's <code class=\"inline-code\">(+)<\/code> operator in <code class=\"inline-code\">WHERE<\/code> clauses to convert a join into an outer join, <strong>but it is NOT recommended<\/strong> because it is not standard SQL syntax.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Inner Join vs. Outer Joins (<code class=\"inline-code\">LEFT<\/code>, <code class=\"inline-code\">RIGHT<\/code>, <code class=\"inline-code\">FULL<\/code>, pp. 385–389)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Join Type<\/th><th>Syntax (<code class=\"inline-code\">OUTER<\/code> / <code class=\"inline-code\">INNER<\/code> keyword is optional)<\/th><th>Returned Rows &amp; <code class=\"inline-code\">NULL<\/code> Padding Behavior<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Inner Join<\/strong><\/td><td><code class=\"inline-code\">A [INNER] JOIN B ON A.id = B.id<\/code><\/td><td>Returns <strong>only<\/strong> rows that satisfy the join condition in <strong>both<\/strong> tables.<\/td><\/tr>\n<tr><td><strong>Left Outer Join<\/strong><\/td><td><code class=\"inline-code\">A LEFT [OUTER] JOIN B ON A.id = B.id<\/code><\/td><td>Driven by the <strong>left table (<code class=\"inline-code\">A<\/code>)<\/strong>: returns all rows from <code class=\"inline-code\">A<\/code> + matched data from <code class=\"inline-code\">B<\/code>. Unmatched columns from <code class=\"inline-code\">B<\/code> are filled with <strong><code class=\"inline-code\">NULL<\/code><\/strong>.<\/td><\/tr>\n<tr><td><strong>Right Outer Join<\/strong><\/td><td><code class=\"inline-code\">A RIGHT [OUTER] JOIN B ON A.id = B.id<\/code><\/td><td>Driven by the <strong>right table (<code class=\"inline-code\">B<\/code>)<\/strong>: returns all rows from <code class=\"inline-code\">B<\/code> + matched data from <code class=\"inline-code\">A<\/code>. Unmatched columns from <code class=\"inline-code\">A<\/code> are filled with <strong><code class=\"inline-code\">NULL<\/code><\/strong>.<\/td><\/tr>\n<tr><td><strong>Full Outer Join<\/strong><\/td><td><code class=\"inline-code\">A FULL [OUTER] JOIN B ON A.id = B.id<\/code><\/td><td>Returns all matched rows <strong>plus<\/strong> unmatched rows from <code class=\"inline-code\">A<\/code> (padded with <code class=\"inline-code\">NULL<\/code> on the right) <strong>and<\/strong> unmatched rows from <code class=\"inline-code\">B<\/code> (padded with <code class=\"inline-code\">NULL<\/code> on the left).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Official Walkthrough: <code class=\"inline-code\">education e<\/code> (<code class=\"inline-code\">staff_id<\/code> 11, 12, 13) \\\\bowtie <code class=\"inline-code\">training t<\/code> (<code class=\"inline-code\">staff_id<\/code> 10, 11, 12) (pp. 387–389)<\/h3>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">education e<\/code><\/strong>: <code class=\"inline-code\">(11, 'master')<\/code>, <code class=\"inline-code\">(12, 'doctor')<\/code>, <code class=\"inline-code\">(13, 'scholar')<\/code><\/li>\n<li><strong><code class=\"inline-code\">training t<\/code><\/strong>: <code class=\"inline-code\">(10, 90)<\/code>, <code class=\"inline-code\">(11, 92)<\/code>, <code class=\"inline-code\">(12, 95)<\/code><\/li>\n<li><strong><code class=\"inline-code\">INNER JOIN<\/code><\/strong>: Returns only <code class=\"inline-code\">11<\/code> and <code class=\"inline-code\">12<\/code> (2 rows).<\/li>\n<li><strong><code class=\"inline-code\">e LEFT JOIN t<\/code><\/strong>: Returns <code class=\"inline-code\">11<\/code> (<code class=\"inline-code\">92<\/code>), <code class=\"inline-code\">12<\/code> (<code class=\"inline-code\">95<\/code>), and <code class=\"inline-code\">13<\/code> (<code class=\"inline-code\">score = NULL<\/code>) (3 rows).<\/li>\n<li><strong><code class=\"inline-code\">e RIGHT JOIN t<\/code><\/strong>: Returns <code class=\"inline-code\">NULL<\/code> (<code class=\"inline-code\">staff_id<\/code> from <code class=\"inline-code\">e<\/code> is <code class=\"inline-code\">NULL<\/code>, <code class=\"inline-code\">score = 90<\/code>), <code class=\"inline-code\">11<\/code> (<code class=\"inline-code\">92<\/code>), and <code class=\"inline-code\">12<\/code> (<code class=\"inline-code\">95<\/code>) (3 rows).<\/li>\n<li><strong><code class=\"inline-code\">e FULL JOIN t<\/code><\/strong>: Returns <code class=\"inline-code\">11<\/code>, <code class=\"inline-code\">12<\/code>, <code class=\"inline-code\">13<\/code> (<code class=\"inline-code\">score = NULL<\/code>), and <code class=\"inline-code\">NULL<\/code> (<code class=\"inline-code\">score = 90<\/code>) (4 rows).<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h6s3_left_outer_join.png\" alt=\"Left Outer Join Row Matching Visual Example\" data-caption=\"Left Outer Join Row Matching Visual Example (Official Reference: p. 387)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Left Outer Join Row Matching Visual Example<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 387 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h6s3_right_outer_join.png\" alt=\"Right Outer Join Row Matching Visual Example\" data-caption=\"Right Outer Join Row Matching Visual Example (Official Reference: p. 388)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Right Outer Join Row Matching Visual Example<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 388 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h6s3_full_outer_join.png\" alt=\"Full Outer Join Row Matching Visual Example\" data-caption=\"Full Outer Join Row Matching Visual Example (Official Reference: p. 389)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Full Outer Join Row Matching Visual Example<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 389 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Writing `INNER JOIN`, `LEFT JOIN`, and `FULL JOIN` Queries","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Using the official `education e` (`staff_id` 11, 12, 13) and `training t` (`staff_id` 10, 11, 12) tables from Chapter 05 (pp. 387–389), write `LEFT JOIN`, `RIGHT JOIN`, and `FULL JOIN` queries to compare how unmatched rows are padded with `NULL`.","instructions":["Step 1: Write a `LEFT JOIN` query between `education e` and `training t` on `e.staff_id = t.staff_id`.","Step 2: Write a `RIGHT JOIN` query between `education e` and `training t` on `e.staff_id = t.staff_id`.","Step 3: Write a `FULL JOIN` query between `education e` and `training t` on `e.staff_id = t.staff_id`."],"starter_code":"-- Step 1: Preserve all rows from the first table (education e)\nSELECT e.staff_id, e.higest_degree, t.score\nFROM education e ____ JOIN training t ON (e.staff_id = t.staff_id);\n\n-- Step 2: Preserve all rows from the second table (training t)\nSELECT e.staff_id, e.higest_degree, t.score\nFROM education e ____ JOIN training t ON (e.staff_id = t.staff_id);\n\n-- Step 3: Preserve unmatched rows from both tables\nSELECT e.staff_id, e.higest_degree, t.score\nFROM education e ____ JOIN training t ON (e.staff_id = t.staff_id);\n","solution_code":"SELECT e.staff_id, e.higest_degree, t.score\nFROM education e LEFT JOIN training t ON (e.staff_id = t.staff_id);\n\nSELECT e.staff_id, e.higest_degree, t.score\nFROM education e RIGHT JOIN training t ON (e.staff_id = t.staff_id);\n\nSELECT e.staff_id, e.higest_degree, t.score\nFROM education e FULL JOIN training t ON (e.staff_id = t.staff_id);","hints":["Use `LEFT JOIN`, `RIGHT JOIN`, and `FULL JOIN` respectively."],"validation_checks":[{"step":1,"description":"Use `LEFT JOIN`","required_any":["left join","left outer join"],"feedback_fail":"Include `LEFT JOIN` in the first query."},{"step":2,"description":"Use `RIGHT JOIN`","required_any":["right join","right outer join"],"feedback_fail":"Include `RIGHT JOIN` in the second query."},{"step":3,"description":"Use `FULL JOIN`","required_any":["full join","full outer join"],"feedback_fail":"Include `FULL JOIN` in the third query."}],"simulated_output":" staff_id | higest_degree | score \n----------+---------------+-------\n       11 | master        |    92\n       12 | doctor        |    95\n       13 | scholar       |      \n(3 rows)\n\n staff_id | higest_degree | score \n----------+---------------+-------\n          |               |    90\n       11 | master        |    92\n       12 | doctor        |    95\n(3 rows)\n\n staff_id | higest_degree | score \n----------+---------------+-------\n       11 | master        |    92\n       12 | doctor        |    95\n       13 | scholar       |      \n          |               |    90\n(4 rows)","quiz_questions":[{"id":"h6_s3_q1","type":"single","question":"If table A has 4 records and 3 columns, and table B has 5 records and 2 columns, how many records and columns are returned by `SELECT * FROM A, B;` without a `WHERE` condition?","options":["A. 9 records and 5 columns","B. 20 records and 5 columns","C. 20 records and 6 columns","D. 4 records and 3 columns"],"answer":"B","explanation":"Per Chapter 05 (p. 383), the Cartesian product of X (I tuples, N attributes) and Y (J tuples, M attributes) has I * J tuples (4 * 5 = 20 records) and N + M attributes (3 + 2 = 5 columns)."},{"id":"h6_s3_q2","type":"single","question":"Which type of join returns all matched rows plus one row for each unmatched left-hand row (extended with `NULL` on the right) AND one row for each unmatched right-hand row (extended with `NULL` on the left)?","options":["A. INNER JOIN","B. LEFT OUTER JOIN","C. RIGHT OUTER JOIN","D. FULL OUTER JOIN"],"answer":"D","explanation":"Per Chapter 05 (p. 386 & p. 389), `FULL [OUTER] JOIN` returns all joined rows plus unmatched rows from both the left and right tables, filling missing columns with `NULL`."},{"id":"h6_s3_q3","type":"tf","question":"In `SELECT ... FROM table1 INNER JOIN table2 ON ...`, the keyword `INNER` is optional and can be omitted (`JOIN` defaults to `INNER JOIN`).","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.05 p. 385). In `INNER JOIN`, the `INNER` keyword can be omitted."}],"reference_figures":[{"slug":"p3_h6s3_left_outer_join","title":"Left Outer Join Row Matching Visual Example","pdf_page":387}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-DML-Statements-INSERT-UPDATE-and-DELETE","exercise_slug":"08-Exercise-DML-INSERT-ON-DUPLICATE-UPDATE-and-DELETE-Lab","lecture":{"title":"DML Statements — `INSERT`, `UPDATE` & `DELETE`","duration_mins":7,"pdf_ref":"Ch.05, pp. 396–406","objectives":["Master the 3 forms of `INSERT` (`INSERT ... VALUES`, `INSERT ... SELECT`, and `INSERT ... ON DUPLICATE KEY UPDATE` / `INSERT IGNORE`)","Write `UPDATE table SET col = expr [WHERE condition]` statements (`UPDATE STAFFS SET AGE = AGE + 5` — Ch.05 Quiz Q1!)","Write `DELETE FROM table [WHERE condition]` statements (`DELETE FROM student WHERE cid = 6;` — Ch.05 Quiz Q3!) and know column-store DML limitations"],"content_markdown":"### 1. Inserting Data (`INSERT`, pp. 397–399)\nopenGauss supports **three `INSERT` syntax patterns**:\n1. **Insert explicit row values**:\n   ```sql\n   INSERT INTO bank_card(b_number, b_type, b_c_id) VALUES ('6222021302020000001', 'Credit Card', 1);\n   ```\n2. **Insert from a query (`INSERT ... SELECT`)**:\n   ```sql\n   INSERT INTO bank_card1 SELECT * FROM bank_card;\n   -- Number of columns in SELECT list must match the target columns!\n   ```\n3. **Upsert on primary/unique key conflict (`ON DUPLICATE KEY UPDATE` vs. `IGNORE`)**:\n   ```sql\n   INSERT INTO bank_card VALUES ('6222021302020000001', 'Credit Card', 1)\n       ON DUPLICATE KEY UPDATE b_type = 'Savings Card';\n   ```\n   - **`IGNORE`** (`INSERT IGNORE INTO ...`): Silently ignores rows that cause duplicate key errors (**cannot** be used together with `ON DUPLICATE KEY UPDATE`!).\n   - **Permissions**:\n     - `RETURNING` clause requires `SELECT` permission on the table.\n     - `ON DUPLICATE KEY UPDATE` requires `INSERT`, `SELECT`, and `UPDATE` on the table plus `SELECT` on the unique/primary key index.\n   - **Record Size Limit (p. 397)**: Data size of a single inserted record must be **< 64,000 bytes** in standard row-store insert precautions.\n\n---\n\n### 2. Updating Data (`UPDATE`, pp. 400–401, Ch.05 p. 405 Quiz Q1!)\n```sql\nUPDATE table_reference SET col_name = expression [, ...] [ WHERE condition ];\n```\n- **Official Exam Question (Ch.05 p. 405 Quiz Q1: C!)**:\n  - To increase the value of the `AGE` column in the `STAFFS` table by 5 years:\n    ```sql\n    UPDATE STAFFS SET AGE = AGE + 5;\n    ```\n  - *(Why are A, B, D wrong? Because SQL `UPDATE` uses `UPDATE <table> SET <col> = <expr>`, NEVER `WITH`!)*\n- **Column-Store `UPDATE` Precautions (p. 400)**:\n  - `RETURNING` clause is **not supported** for column-store tables.\n  - Memory/space holding old records in a column-store table is **not automatically recycled** after `UPDATE` — you must run **`VACUUM FULL table_name;`** to reclaim it.\n  - `UPDATE` is **not supported** on column-store replication tables.\n\n---\n\n### 3. Deleting Data (`DELETE`, pp. 402–404, Ch.05 p. 406 Quiz Q3!)\n```sql\nDELETE FROM [schema_name.]table_name [ WHERE condition ];\n```\n- **Official Exam Question (Ch.05 p. 406 Quiz Q3: A!)**:\n  - To delete records for all students whose class ID (`cid`) is `6` from the `student` table:\n    ```sql\n    DELETE FROM student WHERE cid = 6;\n    ```\n  - **CRITICAL SYNTAX TRAP**: Never put `*` after `DELETE` (`DELETE * FROM ...` is a syntax error!), and use `WHERE` (not `ON`) for the filter condition!\n  - If the `WHERE` clause is omitted (`DELETE FROM student;`), **all rows in the table are deleted**, leaving the empty table structure intact.","key_takeaways":["To increment `AGE` by 5 in `STAFFS`, use `UPDATE STAFFS SET AGE = AGE + 5;` (Ch.05 p. 405 Quiz Q1: C).","To delete rows where `cid = 6` from `student`, use `DELETE FROM student WHERE cid = 6;` — there is NO `*` between `DELETE` and `FROM`, and the filter uses `WHERE`, not `ON` (Ch.05 p. 406 Quiz Q3: A).","`INSERT ... ON DUPLICATE KEY UPDATE` updates specified columns when a primary/unique key conflict occurs, and cannot be combined with `INSERT IGNORE`."],"exam_traps":["EXAM TRAP (Ch.05 p. 406 Quiz Q3): `DELETE * FROM student WHERE cid = 6;` (B) is INVALID SQL! `DELETE` deletes entire rows, so `*` is never used after `DELETE`. The correct statement is `DELETE FROM student WHERE cid = 6;` (A).","EXAM TRAP: After updating rows in a column-store table, old record space is not recycled automatically; you must run `VACUUM FULL table_name;` (Ch.05 p. 400)."],"content_html":"<h3>1. Inserting Data (<code class=\"inline-code\">INSERT<\/code>, pp. 397–399)<\/h3>\n<p>openGauss supports <strong>three <code class=\"inline-code\">INSERT<\/code> syntax patterns<\/strong>:<\/p>\n<ol class=\"md-list\">\n<li><strong>Insert explicit row values<\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   INSERT INTO bank_card(b_number, b_type, b_c_id) VALUES ('6222021302020000001', 'Credit Card', 1);<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong>Insert from a query (<code class=\"inline-code\">INSERT ... SELECT<\/code>)<\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   INSERT INTO bank_card1 SELECT * FROM bank_card;\n   -- Number of columns in SELECT list must match the target columns!<\/code><\/pre><\/div>\n<ol class=\"md-list\">\n<li><strong>Upsert on primary/unique key conflict (<code class=\"inline-code\">ON DUPLICATE KEY UPDATE<\/code> vs. <code class=\"inline-code\">IGNORE<\/code>)<\/strong>:<\/li>\n<\/ol>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>   INSERT INTO bank_card VALUES ('6222021302020000001', 'Credit Card', 1)\n       ON DUPLICATE KEY UPDATE b_type = 'Savings Card';<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong><code class=\"inline-code\">IGNORE<\/code><\/strong> (<code class=\"inline-code\">INSERT IGNORE INTO ...<\/code>): Silently ignores rows that cause duplicate key errors (<strong>cannot<\/strong> be used together with <code class=\"inline-code\">ON DUPLICATE KEY UPDATE<\/code>!).<\/li>\n<li><strong>Permissions<\/strong>:<\/li>\n<li><code class=\"inline-code\">RETURNING<\/code> clause requires <code class=\"inline-code\">SELECT<\/code> permission on the table.<\/li>\n<li><code class=\"inline-
