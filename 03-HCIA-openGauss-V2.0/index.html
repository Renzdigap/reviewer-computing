the following are categories of execution plan nodes in the openGauss Execution Engine (Ch.01 pp. 53–54)?","options":["A. Scan plan node (e.g., SeqScan, IndexScan, SubQueryScan)","B. Control plan node (e.g., Limit, RecursiveUnion, Union)","C. Materialize plan node (e.g., Agg, Sort)","D. Join plan node (e.g., MergeJoin, SortJoin, HashJoin)"],"answer":"ABCD","explanation":"Per Chapter 01 (pp. 53–54), the operators in the openGauss execution engine are classified into four types: Scan plan nodes, Control plan nodes, Materialize plan nodes, and Join plan nodes."},{"id":24,"type":"multiple","points":20,"chapter":"Ch.02 Database Installation and Deployment","question":"(Official Ch.02 Quiz Q3) Which of the following are the prerequisites for installing openGauss on a single node?","options":["A. User groups and common users have been created, and the operating systems and networks of all servers are running properly.","B. Common users must have the read, write, and execute permissions on the database package decompression directory and installation directory, and the installation directory must be empty.","C. A common user has the execution permission on the downloaded openGauss package.","D. Before the installation, check whether the specified openGauss port is occupied. If the port is occupied, change the port number or stop the process that uses the port."],"answer":"ABCD","explanation":"Per Chapter 02 (p. 92 & p. 127), all four statements (ABCD) are required prerequisites for installing openGauss on a single node."},{"id":25,"type":"multiple","points":20,"chapter":"Ch.02 Database Installation and Deployment","question":"Which of the following `HOSTTYPE` and `authentication-options` values are supported in `pg_hba.conf` when configuring client authentication via `gs_guc -h`?","options":["A. `HOSTTYPE` can be `local`, `host`, `hostssl`, or `hostnossl`","B. `sha256` is the recommended password authentication method","C. `trust`, `reject`, `md5`, `cert`, and `gss` are valid authentication options","D. Remote hosts are permitted to connect using `trust` authentication by default"],"answer":"ABC","explanation":"Per Chapter 02 (p. 96 & p. 118), A, B, and C are true. Option D is false: remote hosts are NOT allowed to access openGauss if `trust` is configured."},{"id":26,"type":"multiple","points":20,"chapter":"Ch.02 Database Installation and Deployment","question":"Which two parts are exported when `gs_dumpall` is used to export all databases in an openGauss cluster (Ch.02 p. 115)?","options":["A. All global objects, including database users and groups, tablespaces, and global attributes/permissions","B. SQL scripts from each openGauss database (by calling `gs_dump`) containing all SQL statements required to restore the databases","C. Binary `.tar` archives that can only be imported using `gs_restore`","D. Operating system kernel parameters and SSD `dd` benchmark logs"],"answer":"AB","explanation":"Per Chapter 02 (p. 115), `gs_dumpall` exports all databases in two parts: (1) all global objects (users/groups, tablespaces, attributes) and (2) SQL scripts from each database by calling `gs_dump`. Both exported parts are plain-text SQL scripts restored using `gsql`."},{"id":27,"type":"multiple","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"(Official Ch.03 Quiz Q1) Which of the following are the openGauss deployment modes?","options":["A. Single-node deployment","B. Deployment with one primary and one standby","C. Deployment with one primary and multiple standbys","D. Deployment with dual primary nodes"],"answer":"ABC","explanation":"Per Chapter 03 Quiz Q1 (p. 268), openGauss supports single-node deployment, one primary and one standby, and one primary and multiple standbys (`ABC`). Dual primary nodes (`D`) is not supported."},{"id":28,"type":"multiple","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"Which three key components make up the Cost-Based Optimizer (CBO) in openGauss (Ch.03 p. 165)?","options":["A. Query converter","B. Cost estimator","C. Execution plan generator","D. Redo log replayer"],"answer":"ABC","explanation":"Per Chapter 03 (p. 165), a CBO consists of three key components: Query converter, Cost estimator, and Execution plan generator."},{"id":29,"type":"multiple","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"Which of the following are advantages of a partitioned table over an ordinary table in openGauss (Ch.03 p. 174 & Ch.05 p. 427)?","options":["A. High query efficiency (queries can specify partitions / use partition pruning)","B. High availability (if one partition is faulty, data in other partitions remains available)","C. Easy maintenance (if a partition is faulty, only that partition needs to be repaired)","D. Balanced I/O (partitions can be mapped to different disks to balance I/O)"],"answer":"ABCD","explanation":"Per Chapter 03 (p. 174) and Chapter 05 (p. 427), partitioned tables provide all four advantages: high query efficiency, high availability, easy maintenance, and balanced I/O."},{"id":30,"type":"multiple","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"How does Symmetric Multi-Processing (SMP) parallel technology improve openGauss database performance on multi-core servers (Ch.03 pp. 187–188)?","options":["A. Significantly reduces the time needed to execute a single complex query","B. Improves system throughput for a given period of time and improves system resource utilization","C. Operates parallel threads within the same process and exchanges data directly through memory via the `Stream` operator without occupying network bandwidth","D. Eliminates all resource contention even when system concurrency is extremely high and data is severely skewed"],"answer":"ABC","explanation":"Per Chapter 03 (pp. 187–188), A, B, and C are true. Option D is false: severe data skew or high system concurrency deteriorates SMP performance."},{"id":31,"type":"multiple","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"In openGauss Role-Based Access Control (RBAC), authorization defines relationships among which three core elements (Ch.03 p. 211)?","options":["A. Who (owner or subject of the permission, e.g., a user)","B. What (object such as a table or function to which the permission applies)","C. How (specific permission, positive or negative authorization)","D. Where (physical disk sector and NUMA node distance)"],"answer":"ABC","explanation":"Per Chapter 03 (p. 211), RBAC authorization defines relationships among Who, What, and How."},{"id":32,"type":"multiple","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"Which system catalogs in openGauss store metadata related to Unified Auditing policies (Ch.03 p. 223)?","options":["A. GS_AUDITING_POLICY","B. GS_AUDITING_POLICY_ACCESS","C. GS_AUDITING_POLICY_FILTERS","D. GS_AUDITING_POLICY_PRIVILEGES"],"answer":"ABCD","explanation":"Per Chapter 03 (p. 223), the four system catalogs related to unified auditing are `GS_AUDITING_POLICY` (main info), `GS_AUDITING_POLICY_ACCESS` (DML), `GS_AUDITING_POLICY_FILTERS` (filters), and `GS_AUDITING_POLICY_PRIVILEGES` (DDL)."},{"id":33,"type":"multiple","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"Which of the following are the three running modes of the `X-Tuner` parameter tuning tool in openGauss (Ch.03 p. 247)?","options":["A. recommend","B. train","C. tune","D. compile"],"answer":"ABC","explanation":"Per Chapter 03 (p. 247), X-Tuner runs in three modes: `recommend`, `train`, and `tune`."},{"id":34,"type":"multiple","points":20,"chapter":"Ch.04 Database and Object Management","question":"(Official Ch.04 Quiz Q3) Which of the following statements about row-store tables and column-store tables are TRUE?","options":["A. Row-store tables are used in scenarios where INSERT and UPDATE operations are frequently performed.","B. Row-store tables are applicable to point queries, that is, simple index-based queries that return a small number of records.","C. Column-store tables are more efficient in compression and projection.","D. Row-store tables are used in scenarios where there are a large number of queries for statistical analysis."],"answer":"ABC","explanation":"Per Chapter 04 Quiz Q3 (p. 347), A, B, and C are true (`ABC`). D is false because statistical analysis queries over large datasets are suited for column-store tables."},{"id":35,"type":"multiple","points":20,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 395 Q3) Assume that you want to query student names, ages, and scores from the `student` table, and want the results sorted in descending order by age. If there are students of the same age, they are sorted in ascending order by score instead. Which of the following SQL statements can be used?","options":["A. SELECT name, age, score FROM student order by age desc, score;","B. SELECT name, age, score FROM student order by age, score asc;","C. SELECT name, age, score FROM student order by 2 desc, 3 asc;","D. SELECT name, age, score FROM student order by 1 desc, 2;"],"answer":"AC","explanation":"Per Chapter 05 (p. 395), Option A (`order by age desc, score` where `score` defaults to `ASC`) and Option C (`order by 2 desc, 3 asc` referencing the 2nd and 3rd selected columns) are correct (`AC`)."},{"id":36,"type":"multiple","points":20,"chapter":"Ch.05 SQL Basics","question":"Which of the following `LIMIT` / `OFFSET` clauses in openGauss are equivalent and output 20 rows after skipping the first 5 rows (Ch.05 p. 392)?","options":["A. LIMIT 5, 20","B. LIMIT 20 OFFSET 5","C. OFFSET 5 LIMIT 20","D. LIMIT 5 OFFSET 20"],"answer":"ABC","explanation":"Per Chapter 05 (p. 392), `LIMIT 5, 20` is equivalent to `LIMIT 20 OFFSET 5` and `OFFSET 5 LIMIT 20` — all three skip 5 rows and return 20 rows."},{"id":37,"type":"multiple","points":20,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 447 Q3) Create a decremental sequence named `seq_1`. The starting value is 400, the step is –4, and the minimum value is 100. When the sequence reaches the minimum value, it can be cyclically executed. Which of the following statements are correct?","options":["A. CREATE SEQUENCE seq_1 START WITH 400 MAXVALUE 100 INCREMENT BY -4 CYCLE;","B. CREATE SEQUENCE seq_1 MAXVALUE 400 MINVALUE 100 INCREMENT BY -4 CYCLE;","C. CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 INCREMENT BY -4 CYCLE;","D. CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;"],"answer":"BD","explanation":"Per Chapter 05 (p. 442 & p. 447), for a descending sequence (`INCREMENT BY -4`), default `MAXVALUE` is `-1` and default `START WITH` is `maxvalue`. Thus `MAXVALUE 400` must be specified, and `START WITH 400` is optional (`BD`)."},{"id":38,"type":"multiple","points":20,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 468 Q2) Which of the following are arithmetic functions in openGauss?","options":["A. length(str)","B. sin(n)","C. round(v numeric, s int)","D. hex(p1)"],"answer":"BC","explanation":"Per Chapter 05 (p. 468), `sin(n)` and `round(v numeric, s int)` are arithmetic functions (`BC`), whereas `length(str)` and `hex(p1)` are string functions."},{"id":39,"type":"multiple","points":20,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 469 Q3 & Q4) Which three separate approaches to pattern matching are provided by openGauss?","options":["A. LIKE","B. Same","C. SIMILAR TO","D. POSIX regular expressions"],"answer":"ACD","explanation":"Per Chapter 05 (p. 469), the three pattern matching approaches are `LIKE`, `SIMILAR TO`, and `POSIX regular expressions` (`ACD`)."},{"id":40,"type":"multiple","points":20,"chapter":"Ch.06 GaussDB","question":"(Official Ch.06 Quiz Q2) Which of the following are core functions of UGO (Database and Application Migration UGO)?","options":["A. Source database profiling","B. Destination database selection and specification recommendation & Destination database compatibility analysis","C. Migration workload evaluation","D. Database structure migration & Application SQL migration"],"answer":"ABCD","explanation":"Per Chapter 06 (p. 512 & p. 527), all six items listed across A, B, C, and D constitute the exact 6 core functions of UGO."},{"id":41,"type":"tf","points":10,"chapter":"Ch.01 openGauss Overview","question":"openGauss uses a single-process multi-threaded architecture (`gaussdb`) and incremental checkpoints (performance fluctuation < 5%), whereas PostgreSQL uses a multi-process architecture and full checkpoints (fluctuation > 15%).","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.01 pp. 48–49). openGauss uses a single-process multi-threaded model with 64-bit XIDs/CSNs and incremental checkpoints."},{"id":42,"type":"tf","points":10,"chapter":"Ch.02 Database Installation and Deployment","question":"Only user `root` is authorized to run the `gs_checkos` and `gs_postuninstall` commands in openGauss.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.02 p. 107 & p. 125). Both `gs_checkos` and `gs_postuninstall` require `root` privileges."},{"id":43,"type":"tf","points":10,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"When Ultimate RTO is enabled in openGauss (`recovery_parse_workers > 1` and `recovery_parallelism > 1`), cascaded standby nodes are fully supported.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.03 p. 192). When Ultimate RTO is enabled, cascaded standby nodes are NOT supported because the standby node cannot synchronize data with a cascaded standby node during parallel recovery."},{"id":44,"type":"tf","points":10,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"In openGauss Row-Level Security (RLS), initial users and system administrators (`SYSADMIN`) are not affected by row-level security policies.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.03 p. 215). Initial users and system administrators bypass row-level security policies."},{"id":45,"type":"tf","points":10,"chapter":"Ch.04 Database and Object Management","question":"(Official Ch.04 Quiz Q1) Users and roles have the same syntax in the openGauss database. Therefore, they are fully equivalent.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.04 p. 314 & p. 346). Users have the `LOGIN` attribute by default, whereas roles do not have login permission by default."},{"id":46,"type":"tf","points":10,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 372 Q1) `BIGINT` occupies four bytes.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.05 p. 362 & p. 372). `BIGINT` (`INT8`) occupies eight (8) bytes."},{"id":47,"type":"tf","points":10,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 372 Q2) `CLOB` is used to store large object data of the `TEXT` type.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.05 p. 366 & p. 372). `CLOB` is the alias of `TEXT` (up to 1 GB minus 1 byte) for storing large text data."},{"id":48,"type":"tf","points":10,"chapter":"Ch.05 SQL Basics","question":"(Official Ch.05 Quiz p. 446 Q1) When an index is created for a table, the corresponding base table is deleted if the index is canceled.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.05 p. 446). Dropping an index (`DROP INDEX`) removes only the index and never deletes the base table."},{"id":49,"type":"tf","points":10,"chapter":"Ch.05 SQL Basics","question":"In openGauss, `CREATE DATABASE` and `DROP DATABASE` statements cannot be executed inside a transaction block, and the preinstalled `POSTGRES`, `TEMPLATE0`, and `TEMPLATE1` databases cannot be deleted.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.05 p. 410 & p. 414). Neither `CREATE DATABASE` nor `DROP DATABASE` can run inside a transaction block, and the three preinstalled databases are protected."},{"id":50,"type":"tf","points":10,"chapter":"Ch.06 GaussDB","question":"In GaussDB Cloud Trace Service (CTS), operation records from the last seven days can be queried on the management console, and traces are regularly dumped to OBS buckets and encrypted using KMS keys.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.06 p. 514). CTS allows querying the last 7 days of traces on the management console and dumps compressed trace files to OBS encrypted with KMS keys."},{"id":51,"type":"lab","points":20,"chapter":"Ch.02 Database Installation and Deployment","question":"Lab 1: Write the `gs_guc` command to dynamically add and immediately reload a client authentication rule in `pg_hba.conf` across all nodes (`-N all -I all`) allowing `host` access to `all` databases by user `testuser` from `10.252.95.191/32` using `sha256` authentication.","starter_code":"gs_guc ____ -N all -I all -h \"host all testuser 10.252.95.191/32 ____\"","accepted_keywords":["gs_guc reload","sha256"],"solution":"gs_guc reload -N all -I all -h \"host all testuser 10.252.95.191/32 sha256\"","options":[],"answer":"gs_guc reload -N all -I all -h \"host all testuser 10.252.95.191/32 sha256\"","explanation":"Use `gs_guc reload` (which modifies `pg_hba.conf` and signals the database process to reload immediately) and specify `sha256` as the authentication method (Ch.02 p. 96 & p. 118)."},{"id":52,"type":"lab","points":20,"chapter":"Ch.02 Database Installation and Deployment","question":"Lab 2: Write the command (executed as user `root`) to check SSD read/write performance using `gs_checkperf` for cluster user `omm`.","starter_code":"gs_checkperf -U omm -i ____","accepted_keywords":["gs_checkperf","-i ssd"],"solution":"gs_checkperf -U omm -i SSD","options":[],"answer":"gs_checkperf -U omm -i SSD","explanation":"Per Chapter 02 (p. 109 & Quiz Q2), SSD performance can only be viewed by `root` using `gs_checkperf -U omm -i SSD`."},{"id":53,"type":"lab","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"Lab 3: Write the two commands (executed as user `omm` on the standby node) to perform a planned primary/standby switchover for data directory `/home/omm/cluster/dn1/` and then record the updated primary/standby roles in the dynamic configuration file.","starter_code":"gs_ctl ____ -D /home/omm/cluster/dn1/\ngs_om -t ____","accepted_keywords":["gs_ctl switchover","refreshconf"],"solution":"gs_ctl switchover -D /home/omm/cluster/dn1/\ngs_om -t refreshconf","options":[],"answer":"gs_ctl switchover -D /home/omm/cluster/dn1/\ngs_om -t refreshconf","explanation":"Per Chapter 03 (pp. 192–193), run `gs_ctl switchover -D /home/omm/cluster/dn1/` on the standby node followed by `gs_om -t refreshconf`."},{"id":54,"type":"lab","points":20,"chapter":"Ch.03 openGauss Architecture and Key Features","question":"Lab 4: Write the SQL statements to create a resource label `label_for_creditcard` on column `user1.table1.creditcard` and create a dynamic data masking policy `msk_creditcard` using the `creditcardmasking` function.","starter_code":"CREATE ____ LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);\nCREATE ____ POLICY msk_creditcard ____ ON LABEL(label_for_creditcard);","accepted_keywords":["create resource label","create masking policy","creditcardmasking"],"solution":"CREATE RESOURCE LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);\nCREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);","options":[],"answer":"CREATE RESOURCE LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);\nCREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);","explanation":"Per Chapter 03 (p. 206), first create the resource label with `CREATE RESOURCE LABEL ... ADD COLUMN(...)`, then bind the masking policy with `CREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);`."},{"id":55,"type":"lab","points":20,"chapter":"Ch.04 Database and Object Management","question":"Lab 5: Write the SQL statements to create a column-store table `customer_t2(state_ID CHAR(2), state_NAME VARCHAR2(40), area_ID NUMBER)` and a Memory-Optimized Table (MOT) `mot_test(x INT)` on `mot_server`.","starter_code":"CREATE TABLE customer_t2(state_ID CHAR(2), state_NAME VARCHAR2(40), area_ID NUMBER) WITH (____ = ____);\nCREATE ____ TABLE mot_test(x INT) SERVER mot_server;","accepted_keywords":["orientation = column","create foreign table"],"solution":"CREATE TABLE customer_t2(state_ID CHAR(2), state_NAME VARCHAR2(40), area_ID NUMBER) WITH (ORIENTATION = COLUMN);\nCREATE FOREIGN TABLE mot_test(x INT) SERVER mot_server;","options":[],"answer":"CREATE TABLE customer_t2(state_ID CHAR(2), state_NAME VARCHAR2(40), area_ID NUMBER) WITH (ORIENTATION = COLUMN);\nCREATE FOREIGN TABLE mot_test(x INT) SERVER mot_server;","explanation":"Per Chapter 04 (p. 299 & p. 305), column-store tables are declared with `WITH (ORIENTATION = COLUMN)` and MOTs are created with `CREATE FOREIGN TABLE ... SERVER mot_server;`."},{"id":56,"type":"lab","points":20,"chapter":"Ch.04 Database and Object Management","question":"Lab 6 (Official Ch.04 Quiz Q2): Write the SQL `COPY` statement to export partial data from table `t1` where `a2 = 1` to `/data/input/t1_output.txt` using delimiter `'^'`.","starter_code":"____ (SELECT * FROM t1 WHERE a2 = 1) ____ '/data/input/t1_output.txt' DELIMITER '^';","accepted_keywords":["copy (select * from t1","to '/data/input/t1_output.txt'"],"solution":"COPY (SELECT * FROM t1 WHERE a2 = 1) TO '/data/input/t1_output.txt' DELIMITER '^';","options":[],"answer":"COPY (SELECT * FROM t1 WHERE a2 = 1) TO '/data/input/t1_output.txt' DELIMITER '^';","explanation":"Per Chapter 04 (p. 332 & p. 346), `COPY (SELECT * FROM t1 WHERE a2 = 1) TO '/data/input/t1_output.txt' DELIMITER '^';` exports a filtered query result set to a file."},{"id":57,"type":"lab","points":20,"chapter":"Ch.05 SQL Basics","question":"Lab 7 (Official Ch.05 Quiz p. 405 Q1 & p. 406 Q3): Write the two DML statements to: (1) increase the `AGE` column in the `STAFFS` table by 5 years, and (2) delete all records from the `student` table where `cid = 6`.","starter_code":"UPDATE STAFFS ____ AGE = ____;\n____ ____ student ____ cid = 6;","accepted_keywords":["update staffs set age","delete from student where cid = 6"],"solution":"UPDATE STAFFS SET AGE = AGE + 5;\nDELETE FROM student WHERE cid = 6;","options":[],"answer":"UPDATE STAFFS SET AGE = AGE + 5;\nDELETE FROM student WHERE cid = 6;","explanation":"Per Chapter 05 (pp. 405–406), use `UPDATE STAFFS SET AGE = AGE + 5;` and `DELETE FROM student WHERE cid = 6;`."},{"id":58,"type":"lab","points":20,"chapter":"Ch.05 SQL Basics","question":"Lab 8 (Official Ch.05 Quiz p. 447 Q3): Write the SQL statement to create a decremental sequence named `seq_1` with starting value `400`, minimum value `100`, maximum value `400`, step `-4`, and cyclic execution.","starter_code":"CREATE SEQUENCE seq_1 START WITH 400 ____ 100 ____ 400 INCREMENT BY -4 ____;","accepted_keywords":["minvalue 100","maxvalue 400","increment by -4","cycle"],"solution":"CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;","options":[],"answer":"CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;","explanation":"Per Chapter 05 (p. 447 Quiz Q3), a decremental sequence starting at 400 with step -4 and minimum 100 must specify `MAXVALUE 400` and `MINVALUE 100` (`CREATE SEQUENCE seq_1 START WITH 400 MINVALUE 100 MAXVALUE 400 INCREMENT BY -4 CYCLE;`)."},{"id":59,"type":"lab","points":20,"chapter":"Ch.05 SQL Basics","question":"Lab 9 (Official Ch.05 Quiz p. 468 Q1): Write the SQL query to add 7 days (`integer '7'`) to `date '2021-4-28'` aliased as `RESULT`, and include a SQL comment (`-- YYYY-MM-DD`) stating the resulting date.","starter_code":"SELECT date '2021-4-28' + ____ '7' AS RESULT;\n-- Resulting date: ____-_     function escHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function fmtText(s) {
      if (!s) return '';
      let out = String(s);
      out = out.replace(/\\text\{([^}]+)\}/g, '$1')
               .replace(/\\mathbf\{([^}]+)\}/g, '$1')
               .replace(/\\texttt\{([^}]+)\}/g, '`$1`')
               .replace(/\\times/g, '×')
               .replace(/\\ge/g, '≥')
               .replace(/\\le/g, '≤')
               .replace(/\\ne\b/g, '≠')
               .replace(/\\lg\s+([A-Za-z0-9]+)/g, 'lg($1)')
               .replace(/\$(?!\s*[\{\(])([^$\n\r]+?)\$/g, '$1');
      out = escHtml(out);
      out = out.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return out;
    }
    function normWS(s) {
      return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }


    const UNITS = [];
    (PILLAR.hours || []).forEach(h => {
      (h.sprints || []).forEach((s, sIdx) => {
        const numLec = String(sIdx * 2 + 1).padStart(2, '0');
        const numEx = String(sIdx * 2 + 2).padStart(2, '0');
        UNITS.push({
          uid: `${PILLAR.id}_h${h.hour_number}_s${s.sprint_number}_lecture`,
          mode: 'lecture',
          hour: h,
          sprint: s,
          label: `${numLec} ${s.lecture.title}`,
          fileRel: `./${h.folder_name}/${s.lecture_slug}.html`
        });
        UNITS.push({
          uid: `${PILLAR.id}_h${h.hour_number}_s${s.sprint_number}_exercise`,
          mode: 'exercise',
          hour: h,
          sprint: s,
          label: `${numEx} ${s.exercise.title}`,
          fileRel: `./${h.folder_name}/${s.exercise_slug}.html`
        });
      });
    });

    let currentIdx = 0;

    function getProgress() {
      return JSON.parse(localStorage.getItem('huawei_study_progress_v1') || '{}');
    }

    function markDone(uid) {
      const prog = getProgress();
      prog[uid] = { completed: true, ts: Date.now() };
      localStorage.setItem('huawei_study_progress_v1', JSON.stringify(prog));
      renderSidebar();
    }

    function renderSidebar() {
      const prog = getProgress();
      let doneCount = 0;
      UNITS.forEach(u => { if (prog[u.uid]?.completed) doneCount++; });
      document.getElementById('overall-progress').textContent = `${doneCount} / ${UNITS.length} Units Completed (${Math.round(doneCount/UNITS.length*100)}%)`;

      const sb = document.getElementById('sidebar');
      sb.innerHTML = (PILLAR.hours || []).map(h => {
        const hUnits = UNITS.map((u, idx) => ({ u, idx })).filter(x => x.u.hour.hour_number === h.hour_number);
        const hDone = hUnits.filter(x => prog[x.u.uid]?.completed).length;
        const itemsHtml = hUnits.map(({ u, idx }) => {
          const isDone = !!prog[u.uid]?.completed;
          const isActive = idx === currentIdx;
          return `<div class="unit-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="selectUnit(${idx})">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(u.label)}</span>
            <span class="check-icon">${isDone ? '✓' : '○'}</span>
          </div>`;
        }).join('');
        return `<div class="hour-group">
          <div class="hour-header">
            <span>Hour 0${h.hour_number}: ${escHtml(h.title)}</span>
            <span style="font-size:11px;color:#38bdf8;">${hDone}/8</span>
          </div>
          <div class="hour-units">${itemsHtml}</div>
        </div>`;
      }).join('') + `
        <div class="hour-group" style="border-color:var(--huawei-red);">
          <div class="hour-header" style="background:rgba(225,29,72,0.22);" onclick="window.location.href='./${PILLAR.mock_exam.folder_name}/Final-Mock-Exam.html'">
            <span>Hour 09: Final Mock Exam (60m)</span>
            <span>|</span>
          </div>
        </div>
      `;
    }

    function selectUnit(idx) {
      if (idx < 0 || idx >= UNITS.length) return;
      currentIdx = idx;
      renderSidebar();
      const u = UNITS[idx];
      const stage = document.getElementById('stage');

      if (u.mode === 'lecture') {
        const lec = u.sprint.lecture;
        const objs = (lec.objectives || []).map(o => `<li>${fmtText(o)}</li>`).join('');
        const kts = (lec.key_takeaways || []).map(k => `<li><strong>${fmtText(k)}</strong></li>`).join('');
        const traps = (lec.exam_traps || []).map(t => `<div class="trap-item">${fmtText(t)}</div>`).join('');
        stage.innerHTML = `
          <div class="lecture-stage">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <span class="badge badge-lecture">BITE-SIZED LECTURE (${lec.duration_mins} MINS)</span>
                <span class="badge badge-ref">${escHtml(PILLAR.pdf_source)} • ${escHtml(lec.pdf_ref)}</span>
                <span class="badge badge-hour">Hour 0${u.hour.hour_number} • Sprint ${u.sprint.sprint_number}/4</span>
              </div>
              <a href="${u.fileRel}" style="font-size:12px;">Open Standalone File</a>
            </div>
            <h1 style="font-size:1.6rem;margin-bottom:14px;">${fmtText(lec.title)}</h1>
            <div class="objectives-card">
              <h3>Learning Objectives</h3>
              <ul class="md-list">${objs}</ul>
            </div>
            <div>${lec.content_html || ''}</div>
            <div class="takeaways-card">
              <h3>Key Takeaways</h3>
              <ul class="md-list">${kts}</ul>
            </div>
            <div class="traps-card">
              <h3>Huawei National Stage Exam Traps</h3>
              ${traps}
            </div>
            <div style="margin-top:24px;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.35);border-radius:10px;">
              <div>
                <div style="font-size:11.5px;color:var(--text-muted);">ACTIVE HANDS-ON REINFORCEMENT</div>
                <div style="font-weight:700;">Proceed immediately to the paired interactive lab exercise!</div>
              </div>
              <button class="btn-primary" onclick="markDone('${u.uid}'); stepNav(1);">
                Complete Lecture & Start Hands-On Exercise
              </button>
            </div>
          </div>
        `;
        stage.scrollTop = 0;
      } else {
        const ex = u.sprint.exercise;
        const insts = (ex.instructions || []).map((inst, i) =>
          `<li id="spa-inst-${i}" class="inst-item"><span class="step-num">${i+1}</span><span>${fmtText(inst)}</span></li>`
        ).join('');
        const qsHtml = (ex.quiz_questions || []).map((q, qIdx) => {
          const isMulti = q.type === 'multiple';
          const inputType = isMulti ? 'checkbox' : 'radio';
          const bTxt = isMulti ? 'Multiple-Choice (Select ALL)' : (q.type === 'tf' ? 'True/False' : 'Single-Choice');
          const opts = (q.options || []).map(opt => {
            const letter = opt.trim().charAt(0).toUpperCase();
            return `<label class="q-opt"><input type="${inputType}" name="spa_q_${qIdx}" value="${letter}" /> <span>${fmtText(opt)}</span></label>`;
          }).join('');
          return `<div class="q-card">
            <div style="font-weight:600;font-size:13.5px;margin-bottom:6px;">Q${qIdx+1} [${bTxt}]: ${fmtText(q.question)}</div>
            <div>${opts}</div>
            <div id="spa-q-exp-${qIdx}" class="q-exp"></div>
          </div>`;
        }).join('');

        stage.innerHTML = `
          <div class="dc-split">
            <div class="dc-left">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <span class="badge badge-exercise">HANDS-ON EXERCISE (${ex.duration_mins} MINS)</span>
                  <span class="badge badge-hour">Hour 0${u.hour.hour_number} • Sprint ${u.sprint.sprint_number}/4</span>
                </div>
                <a href="${u.fileRel}" style="font-size:12px;">Standalone View</a>
              </div>
              <h1 style="font-size:1.35rem;">${fmtText(ex.title)}</h1>
              <div class="scenario-box">
                <div style="font-size:11px;font-weight:700;color:#38bdf8;margin-bottom:4px;">PRACTICAL SCENARIO</div>
                <div>${fmtText(ex.scenario || '')}</div>
              </div>
              ${(ex.reference_figures && ex.reference_figures.length) ? '<div class="pdf-figures-compact">' + ex.reference_figures.map(fig => '<figure class="pdf-figure"><div class="pdf-figure-frame"><img src="./assets/images/' + escHtml(fig.slug) + '.png" alt="' + escHtml(fig.title) + '" data-caption="' + escHtml(fig.title + ' (Official Reference: p. ' + fig.pdf_page + ')') + '" onclick="openImgZoom(this)" loading="lazy" /></div><figcaption><strong>' + escHtml(fig.title) + '</strong><span class="pdf-ref-tag">Official Reference: p. ' + fig.pdf_page + ' | Click to zoom</span></figcaption></figure>').join('') + '</div>' : ''}
              <div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;">
                <h3>Step-by-Step Instructions</h3>
                <ul class="inst-list">${insts}</ul>
                <div style="display:flex;gap:8px;margin-top:8px;">
                  <button class="nav-btn" onclick="spaToggleHint()">Show Hint</button>
                  <button class="nav-btn" onclick="spaShowSolution()">Show Solution</button>
                </div>
                <div id="spa-hint-box" style="display:none;margin-top:10px;padding:10px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.4);border-radius:6px;font-size:12.5px;color:#fde68a;"></div>
              </div>
              <div style="border:1px solid var(--border);border-radius:8px;padding:14px;">
                <h3>National Stage Exam Verification Drill</h3>
                ${qsHtml}
                <button class="btn-primary" style="width:100%;background:var(--blue);" onclick="spaGradeQuiz()">Verify Exam Drill Answers</button>
                <div id="spa-quiz-result" style="margin-top:10px;"></div>
              </div>
            </div>
            <div class="dc-right">
              <div class="editor-header">
                <span style="font-family:var(--font-mono);font-size:12.5px;color:#34d399;">● ${escHtml(ex.prompt_label || 'root@openEuler:~#')}</span>
                <div style="display:flex;gap:8px;">
                  <button class="nav-btn" onclick="spaResetCode()">Reset</button>
                  <button class="btn-primary" style="padding:6px 14px;font-size:12.5px;" onclick="spaRunCode()">Run & Verify (Ctrl+Enter)</button>
                </div>
              </div>
              <textarea id="spa-editor" spellcheck="false"></textarea>
              <div class="console-header">
                <span>EXECUTION OUTPUT & AUTOMATED GRADER</span>
                <span id="spa-status" style="color:#fbbf24;">Ready</span>
              </div>
              <div id="spa-console" class="console-body">Press "Run & Verify (Ctrl+Enter)" to test your solution...</div>
            </div>
          </div>
        `;
        const ed = document.getElementById('spa-editor');
        ed.value = ex.starter_code || '';
        ed.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); spaRunCode(); }
          if (e.key === 'Tab') {
            e.preventDefault();
            const start = ed.selectionStart;
            const end = ed.selectionEnd;
            ed.value = ed.value.substring(0, start) + '    ' + ed.value.substring(end);
            ed.selectionStart = ed.selectionEnd = start + 4;
          }
        });
      }
    }

    function stepNav(delta) {
      selectUnit(currentIdx + delta);
    }

    function copyCodeBlock(btn) {
      const code = btn.parentElement.nextElementSibling.innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    }

    function spaResetCode() {
      const ex = UNITS[currentIdx].sprint.exercise;
      document.getElementById('spa-editor').value = ex.starter_code || '';
    }

    function spaToggleHint() {
      const ex = UNITS[currentIdx].sprint.exercise;
      const box = document.getElementById('spa-hint-box');
      if (box.style.display === 'none') {
        box.style.display = 'block';
        box.innerHTML = '<strong>Hints:</strong><ul style="margin-left:18px;margin-top:4px;">' +
          (ex.hints || []).map(h => `<li>${fmtText(h)}</li>`).join('') + '</ul>';
      } else {
        box.style.display = 'none';
      }
    }

    function spaShowSolution() {
      const ex = UNITS[currentIdx].sprint.exercise;
      document.getElementById('spa-editor').value = ex.solution_code || '';
      spaRunCode();
    }

    function spaRunCode() {
      const u = UNITS[currentIdx];
      const ex = u.sprint.exercise;
      const codeNorm = normWS(document.getElementById('spa-editor').value);
      const checks = ex.validation_checks || [];
      let allPass = true;
      let logs = ['[GRADER] Validating your commands/code...\n'];

      checks.forEach((chk, i) => {
        const reqs = chk.required_any || [];
        const ok = reqs.length === 0 || reqs.some(r => codeNorm.includes(normWS(r)));
        const li = document.getElementById(`spa-inst-${i}`);
        if (ok) {
          if (li) li.classList.add('passed');
          logs.push(`[PASS] Step ${i+1} : ${chk.description}`);
        } else {
          if (li) li.classList.remove('passed');
          allPass = false;
          logs.push(`[FAIL] Step ${i+1} : ${chk.description}\n   ${chk.feedback_fail}`);
        }
      });

      const st = document.getElementById('spa-status');
      if (allPass) {
        st.style.color = '#34d399';
        st.textContent = 'All Steps Passed!';
        logs.push('\n--- SIMULATED OUTPUT ---');
        logs.push(ex.simulated_output || 'Execution succeeded.');
        markDone(u.uid);
      } else {
        st.style.color = '#fbbf24';
        st.textContent = 'Incomplete';
      }
      document.getElementById('spa-console').textContent = logs.join('\n');
    }

    function spaGradeQuiz() {
      const u = UNITS[currentIdx];
      const qs = u.sprint.exercise.quiz_questions || [];
      let corr = 0;
      qs.forEach((q, i) => {
        const sel = Array.from(document.querySelectorAll(`input[name="spa_q_${i}"]:checked`))
          .map(x => x.value).sort().join('');
        const ans = (q.answer || '').toUpperCase().replace(/[^A-Z]/g, '').split('').sort().join('');
        const exp = document.getElementById(`spa-q-exp-${i}`);
        exp.style.display = 'block';
        if (sel === ans) {
          corr++;
          exp.style.background = 'rgba(16,185,129,0.15)';
          exp.style.border = '1px solid rgba(16,185,129,0.4)';
          exp.innerHTML = `<strong>[CORRECT] (${ans})!</strong> ${fmtText(q.explanation || '')}`;
        } else {
          exp.style.background = 'rgba(225,29,72,0.15)';
          exp.style.border = '1px solid rgba(225,29,72,0.4)';
          exp.innerHTML = `<strong>[INCORRECT] Your answer: ${sel || 'None'} | Official: ${ans}</strong><br/>${fmtText(q.explanation || '')}`;
        }
      });
      const res = document.getElementById('spa-quiz-result');
      res.innerHTML = `<div style="padding:10px;background:#1e293b;border-radius:6px;font-weight:700;">
        Score: ${corr} / ${qs.length}
        ${corr === qs.length ? '<button class="btn-primary" style="margin-left:12px;padding:5px 12px;font-size:12px;" onclick="markDone(\'' + u.uid + '\'); stepNav(1);">Next Unit</button>' : ''}
      </div>`;
      if (corr === qs.length) markDone(u.uid);
    }

    selectUnit(0);
  </script>

  <div id="img-lightbox" class="img-lightbox" onclick="if(event.target===this) closeImgZoom()">
    <div class="img-lightbox-box">
      <img id="img-lightbox-target" src="" alt="Zoomed Diagram" />
    </div>
    <div class="img-lightbox-bar">
      <span id="img-lightbox-caption"></span>
      <button type="button" class="img-lightbox-close" onclick="closeImgZoom()">Close</button>
    </div>
  </div>
  <script>
    function openImgZoom(imgEl) {
      if (!imgEl) return;
      document.getElementById('img-lightbox-target').src = imgEl.src;
      document.getElementById('img-lightbox-caption').textContent = imgEl.getAttribute('data-caption') || imgEl.alt || '';
      document.getElementById('img-lightbox').classList.add('open');
    }
    function closeImgZoom() {
      document.getElementById('img-lightbox').classList.remove('open');
      document.getElementById('img-lightbox-target').src = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeImgZoom();
    });
  </script>
