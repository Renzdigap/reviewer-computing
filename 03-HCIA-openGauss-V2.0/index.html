OCK RDMA) and feature limitations","Describe the 6 advanced Resource Pooling enhancements (Standby visibility/Xmin/snapshot caching, Transparent write forwarding, DSS thread pool/blackbox/NoF+, Operator offloading/NDP, Dual-cluster DR, On-demand replay, and SPQ multi-node parallel query)"],"content_markdown":"### 1. Core Components of openGauss Resource Pooling (pp. 146–149)\nResource pooling innovates HA deployment by allowing **1 Read/Write Primary node and up to 7 Read-Only Standby nodes** to **share a single copy of underlying storage** while pooling memory across nodes for **real-time consistent reads** on standby nodes (`RPO = 0`, no delayed read under Read Committed):\n1. **DSS (Distributed Storage Service)**:\n   - Consists of **DSS Server** (an independent process that directly manages raw LUN devices of disk arrays like **OceanStor Dorado** and provides distributed file system semantics) and **DSS API** (a dynamic library integrated into `gaussdb` communicating with DSS Server via shared memory).\n   - System catalog storage is switched from page mode to **segment-page mode** (supports **only segment-page tables**).\n2. **DMS (Distributed Memory Service)**:\n   - A dynamic library integrated into the database that pools memory and exchanges hot data pages in real time between primary and standby shared buffer pools over **TCP** (default) or **OCK RDMA** (with **CX5 NIC**, reducing standby consistent-read latency by **>= 20%**).\n   - Log replication is **not** required between primary and standby nodes during normal operation because pages are exchanged directly via DMS!\n<!-- PDF_FIGS_START -->\n![openGauss Resource Pooling Architecture (DMS, DSS and Shared Storage) (Official Reference: p. 146)](./assets/images/p3_h3s2_resource_pooling.png)\n*Figure: openGauss Resource Pooling Architecture (DMS, DSS and Shared Storage) (Official Reference: p. 146)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Hardware Requirements & Feature Limitations (pp. 150–151)\n- **Hardware Prerequisites**:\n  - Disk array (e.g., **OceanStor Dorado 5000**) with **UltraPath** multipath software installed (**Ceph is NOT supported**).\n  - LUNs must support **SCSI3 PR (`PR OUT`, `PR IN`, `INQUIRY`)** for cluster **I/O FENCE**, and **SCSI3 `CAW` (Compare and Write)** for shared disk locks.\n  - Supports at most **1 primary node + 7 standby nodes** on the same disk array.\n- **Feature Limitations in Resource Pooling Mode (p. 151)**:\n  - **NOT supported**: Global temporary tables, Hash indexes, Cascaded standby nodes, Logical replication publication/subscription (`T_CreatePublicationStmt`, etc.), `gs_xlogdump_*` / `gs_repair_page` functions, and converting between traditional and resource-pooling deployments.\n\n---\n\n### 3. Seven Resource Pooling Performance & HA Enhancements (pp. 152–159)\n1. **Standby Visibility & Snapshot Optimization (v5.1.0+, +50%–80% sysbench read perf)**:\n   - Standby caches `XID -> CSN` mappings in its local L2 cache; Primary locally caches cluster `oldest Xmin` (standbys send local `oldest Xmin` periodically via background thread); Primary can broadcast latest snapshots to standbys.\n2. **Transparent Write Forwarding on Standby (`write-on-standby`)**: Inside an explicit transaction (`BEGIN ... END`) on a standby node, read statements execute locally on the standby while write statements are transparently forwarded to the primary node.\n3. **DSS Enhancements**: Thread pools for DSS Server, crash **black box logs** (`_LOG_LEVEL=0` to disable), and **NoF/NoF+** storage networking APIs.\n4. **Operator Offloading / Near-Data Processing (NDP)**: Offloads `SeqScan`, `Filter`, `Projection`, and `Agg` operators to storage nodes to filter data before network transmission.\n5. **Dual-Cluster DR**: Synchronizes Xlogs between a Primary Cluster and Standby Cluster via **Network Streaming Replication** (v6.0.0-RC1) or **OceanStor Dorado Synchronous Replication** (v5.1.0, intra-city 100 km, `RPO = 0`, `RTO < 30s`).\n6. **On-Demand Replay for Ultimate RTO**: Because standbys in resource pooling do not continuously replay primary WAL logs, upon primary failure the promoted standby rebuilds only essential metadata so services resume immediately, replaying remaining logs on-demand in the background.\n7. **Multi-Node Parallelism (SPQ — Shared-Everything Parallel Query, v6.0.0-RC1)**: Integrates the **ORCA optimizer** to distribute a single large OLAP query across all read nodes in parallel using virtual Node-Groups.","key_takeaways":["Resource Pooling relies on DSS (Distributed Storage Service — DSS Server process + DSS API dynamic library) for shared disk array storage and DMS (Distributed Memory Service) for real-time TCP/RDMA page exchange.","Resource Pooling supports up to 1 Primary + 7 Standby nodes, requires SCSI3 PR (for I/O Fence) and SCSI3 CAW (for shared disk locks) on disk arrays like OceanStor Dorado, and supports ONLY segment-page tables.","Global temporary tables, hash indexes, and cascaded standby nodes are NOT supported in resource pooling mode."],"exam_traps":["EXAM TRAP: Do not confuse DMS (Distributed Memory Service, a dynamic library inside the database for cross-node page exchange) with DSS (Distributed Storage Service, which includes an independent DSS Server process managing raw LUNs).","EXAM TRAP: In Resource Pooling mode, standby nodes do NOT replay logs during normal operation — they exchange pages via DMS and use On-Demand Replay during failover to achieve Ultimate RTO."],"content_html":"<h3>1. Core Components of openGauss Resource Pooling (pp. 146–149)<\/h3>\n<p>Resource pooling innovates HA deployment by allowing <strong>1 Read/Write Primary node and up to 7 Read-Only Standby nodes<\/strong> to <strong>share a single copy of underlying storage<\/strong> while pooling memory across nodes for <strong>real-time consistent reads<\/strong> on standby nodes (<code class=\"inline-code\">RPO = 0<\/code>, no delayed read under Read Committed):<\/p>\n<ol class=\"md-list\">\n<li><strong>DSS (Distributed Storage Service)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Consists of <strong>DSS Server<\/strong> (an independent process that directly manages raw LUN devices of disk arrays like <strong>OceanStor Dorado<\/strong> and provides distributed file system semantics) and <strong>DSS API<\/strong> (a dynamic library integrated into <code class=\"inline-code\">gaussdb<\/code> communicating with DSS Server via shared memory).<\/li>\n<li>System catalog storage is switched from page mode to <strong>segment-page mode<\/strong> (supports <strong>only segment-page tables<\/strong>).<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>DMS (Distributed Memory Service)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>A dynamic library integrated into the database that pools memory and exchanges hot data pages in real time between primary and standby shared buffer pools over <strong>TCP<\/strong> (default) or <strong>OCK RDMA<\/strong> (with <strong>CX5 NIC<\/strong>, reducing standby consistent-read latency by <strong>&gt;= 20%<\/strong>).<\/li>\n<li>Log replication is <strong>not<\/strong> required between primary and standby nodes during normal operation because pages are exchanged directly via DMS!<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s2_resource_pooling.png\" alt=\"openGauss Resource Pooling Architecture (DMS, DSS and Shared Storage)\" data-caption=\"openGauss Resource Pooling Architecture (DMS, DSS and Shared Storage) (Official Reference: p. 146)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Resource Pooling Architecture (DMS, DSS and Shared Storage)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 146 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Hardware Requirements &amp; Feature Limitations (pp. 150–151)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Hardware Prerequisites<\/strong>:<\/li>\n<li>Disk array (e.g., <strong>OceanStor Dorado 5000<\/strong>) with <strong>UltraPath<\/strong> multipath software installed (<strong>Ceph is NOT supported<\/strong>).<\/li>\n<li>LUNs must support <strong>SCSI3 PR (<code class=\"inline-code\">PR OUT<\/code>, <code class=\"inline-code\">PR IN<\/code>, <code class=\"inline-code\">INQUIRY<\/code>)<\/strong> for cluster <strong>I/O FENCE<\/strong>, and <strong>SCSI3 <code class=\"inline-code\">CAW<\/code> (Compare and Write)<\/strong> for shared disk locks.<\/li>\n<li>Supports at most <strong>1 primary node + 7 standby nodes<\/strong> on the same disk array.<\/li>\n<li><strong>Feature Limitations in Resource Pooling Mode (p. 151)<\/strong>:<\/li>\n<li><strong>NOT supported<\/strong>: Global temporary tables, Hash indexes, Cascaded standby nodes, Logical replication publication/subscription (<code class=\"inline-code\">T_CreatePublicationStmt<\/code>, etc.), <code class=\"inline-code\">gs_xlogdump_*<\/code> / <code class=\"inline-code\">gs_repair_page<\/code> functions, and converting between traditional and resource-pooling deployments.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Seven Resource Pooling Performance &amp; HA Enhancements (pp. 152–159)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Standby Visibility &amp; Snapshot Optimization (v5.1.0+, +50%–80% sysbench read perf)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Standby caches <code class=\"inline-code\">XID -&gt; CSN<\/code> mappings in its local L2 cache; Primary locally caches cluster <code class=\"inline-code\">oldest Xmin<\/code> (standbys send local <code class=\"inline-code\">oldest Xmin<\/code> periodically via background thread); Primary can broadcast latest snapshots to standbys.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Transparent Write Forwarding on Standby (<code class=\"inline-code\">write-on-standby<\/code>)<\/strong>: Inside an explicit transaction (<code class=\"inline-code\">BEGIN ... END<\/code>) on a standby node, read statements execute locally on the standby while write statements are transparently forwarded to the primary node.<\/li>\n<li><strong>DSS Enhancements<\/strong>: Thread pools for DSS Server, crash <strong>black box logs<\/strong> (<code class=\"inline-code\">_LOG_LEVEL=0<\/code> to disable), and <strong>NoF/NoF+<\/strong> storage networking APIs.<\/li>\n<li><strong>Operator Offloading / Near-Data Processing (NDP)<\/strong>: Offloads <code class=\"inline-code\">SeqScan<\/code>, <code class=\"inline-code\">Filter<\/code>, <code class=\"inline-code\">Projection<\/code>, and <code class=\"inline-code\">Agg<\/code> operators to storage nodes to filter data before network transmission.<\/li>\n<li><strong>Dual-Cluster DR<\/strong>: Synchronizes Xlogs between a Primary Cluster and Standby Cluster via <strong>Network Streaming Replication<\/strong> (v6.0.0-RC1) or <strong>OceanStor Dorado Synchronous Replication<\/strong> (v5.1.0, intra-city 100 km, <code class=\"inline-code\">RPO = 0<\/code>, <code class=\"inline-code\">RTO &lt; 30s<\/code>).<\/li>\n<li><strong>On-Demand Replay for Ultimate RTO<\/strong>: Because standbys in resource pooling do not continuously replay primary WAL logs, upon primary failure the promoted standby rebuilds only essential metadata so services resume immediately, replaying remaining logs on-demand in the background.<\/li>\n<li><strong>Multi-Node Parallelism (SPQ — Shared-Everything Parallel Query, v6.0.0-RC1)<\/strong>: Integrates the <strong>ORCA optimizer<\/strong> to distribute a single large OLAP query across all read nodes in parallel using virtual Node-Groups.<\/li>\n<\/ol>"},"exercise":{"title":"Hands-On Lab: Auditing Resource Pooling Components, Protocols & Constraints","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"You are designing an openGauss Resource Pooling deployment on Huawei OceanStor Dorado storage. Record the exact component names (`DMS`, `DSS`), required SCSI3 protocols (`PR`, `CAW`), and maximum standby node count (`7`) into an architecture verification query.","instructions":["Step 1: Complete the `SELECT` verification query specifying `'DSS'` as the storage service component and `'DMS'` as the memory service component.","Step 2: Specify `'RDMA'` as the low-latency page exchange protocol (reducing latency by >= 20% over TCP) and `7` as the maximum number of standby nodes supported."],"starter_code":"-- Complete the Resource Pooling architecture specification query:\nSELECT\n    '____' AS storage_component,     -- Distributed Storage Service\n    '____' AS memory_component,      -- Distributed Memory Service\n    '____' AS fast_interconnect,     -- OCK low-latency network protocol\n    ____   AS max_standby_nodes;     -- Maximum standby nodes with 1 primary\n","solution_code":"SELECT\n    'DSS' AS storage_component,\n    'DMS' AS memory_component,\n    'RDMA' AS fast_interconnect,\n    7 AS max_standby_nodes;","hints":["Distributed Storage Service is abbreviated `DSS`, and Distributed Memory Service is abbreviated `DMS`.","Page exchange between primary and standby nodes is accelerated over `RDMA` (OCK RDMA with CX5 NIC), and resource pooling supports 1 primary + `7` standby nodes."],"validation_checks":[{"step":1,"description":"Identify `DSS` and `DMS` components","required_any":["'dss'"],"feedback_fail":"Specify `'DSS'` for Distributed Storage Service."},{"step":2,"description":"Specify `'DMS'` for Distributed Memory Service","required_any":["'dms'"],"feedback_fail":"Specify `'DMS'` for Distributed Memory Service."},{"step":3,"description":"Specify `'RDMA'` and `7` maximum standby nodes","required_any":["'rdma'"],"feedback_fail":"Specify `'RDMA'` and `7` for max standby nodes."}],"simulated_output":" storage_component | memory_component | fast_interconnect | max_standby_nodes \n-------------------+------------------+-------------------+-------------------\n DSS               | DMS              | RDMA              |                 7\n(1 row)","quiz_questions":[{"id":"h3_s2_q1","type":"single","question":"In the openGauss Resource Pooling architecture, which component is responsible for transmitting page data over TCP/RDMA networks and pooling memory between primary and standby nodes to ensure real-time consistent reads?","options":["A. DSS (Distributed Storage Service)","B. DMS (Distributed Memory Service)","C. SPQ (Shared-Everything Parallel Query)","D. GTM (Global Transaction Manager)"],"answer":"B","explanation":"Per Chapter 03 (p. 147), DMS (Distributed Memory Service) is a dynamic library integrated into the database that transmits page data over TCP/RDMA networks and pools memory between primary and standby nodes."},{"id":"h3_s2_q2","type":"multiple","question":"Which of the following are restrictions or limitations of the openGauss Resource Pooling architecture?","options":["A. Supports a maximum of 1 primary node and 7 standby nodes deployed on the same disk array","B. Supports only segment-page tables, and Ceph storage is not supported","C. Global temporary tables, hash indexes, and cascaded standby nodes are not supported","D. Requires continuous WAL log replication between primary and standby nodes within the same cluster to read committed data"],"answer":"ABC","explanation":"Options A, B, and C are exact specifications/limitations (Ch.03 pp. 150–151). Option D is false: log replication is NOT required between primary and standby nodes in the same resource-pooled cluster; real-time page exchange via DMS is used instead (p. 149)."},{"id":"h3_s2_q3","type":"tf","question":"In openGauss Resource Pooling, using the OCK RDMA dynamic library with a CX5 NIC reduces the latency of consistent reads on the standby node by at least 20% compared with TCP.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.03 p. 148). Compared to TCP, the latency of consistent reads on the standby node over OCK RDMA is reduced by at least 20%."}],"reference_figures":[{"slug":"p3_h3s2_resource_pooling","title":"openGauss Resource Pooling Architecture (DMS, DSS and Shared Storage)","pdf_page":146}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-Optimizers-CBO-ABO-Statistics-and-Row-vs-Column-Store","exercise_slug":"06-Exercise-ANALYZE-Statistics-and-Column-Store-Lab","lecture":{"title":"Optimizers (CBO vs ABO), Statistics (`ANALYZE`) & Row-Store vs Column-Store","duration_mins":7,"pdf_ref":"Ch.03, pp. 160–173","objectives":["Compare the Cost-Based Optimizer (CBO, v1.0.0+) and AI-Based Optimizer (ABO, v3.1.0+)","Collect single-column and multi-column statistics using `ANALYZE` and inspect `PG_STATISTIC` / `PG_CLASS`","Contrast Row-Store and Column-Store tables (`WITH (ORIENTATION = COLUMN, COMPRESSION = ...)` — Ch.04 Quiz Q3)"],"content_markdown":"### 1. Query Optimizers: CBO vs. ABO (pp. 161–166)\n- **CBO (Cost-Based Optimizer, introduced in v1.0.0)**:\n  - Consists of **3 key components**:\n    1. **Query converter**: Rewrites SQL statements into lower-cost equivalent forms.\n    2. **Cost estimator**: Calculates execution cost based on table tuples, column width, NULL ratio, distinct count, and **MCV (`most_common_vals`)**.\n    3. **Execution plan generator**: Explores access paths, join methods, and join orders to pick the lowest-cost plan.\n- **ABO (AI-Based Optimizer, 3rd-gen intelligent optimizer introduced in v3.1.0)**:\n  - **Sub-feature 1 — Intelligent Cardinality Estimation**: Uses a **Bayesian network (`BAYESNET`)** model to capture joint distributions across correlated/skewed columns for multi-column equality queries.\n    - Enable via GUC: `SET enable_ai_stats = on; SET multi_stats_type = 'BAYESNET';` (or `'ALL'`), then run `ANALYZE`.\n  - **Sub-feature 2 — Adaptive Plan Selection**: Maintains multiple cached execution plans using range linear expansion and range coverage matching (especially for partial indexes and offsets) rather than a single rigid generic cached plan.\n\n---\n\n### 2. Statistics Collection (`ANALYZE`) & `PG_STATISTIC` (pp. 167–170)\n- **Where Statistics Live**:\n  - **`pg_class`**: Stores global table-level **`relpages`** (disk pages) and **`reltuples`** (estimated rows).\n  - **`pg_statistic`**: Stores column-level statistics (`starelid`, `staattnum`, `stanullfrac` [NULL ratio], `stawidth` [avg byte width], `stadistinct` [distinct values], `stanumbersN`, `stavaluesN`, `histogram_bounds`). Accessible **only to system administrators** (ordinary users query the `PG_STATS` view if authorized).\n- **Sampling Rule**: By default, `default_statistics_target = 100` samples **30,000 rows**. If a table exceeds **1,600,000 rows**, Huawei recommends setting `default_statistics_target = -2` (which samples **2%** of the rows).\n- **Commands**:\n  ```sql\n  ANALYZE tablename;                                    -- Single table\n  ANALYZE;                                              -- Entire database\n  ANALYZE tablename (col_1, col_2);                     -- Specific columns\n  ALTER TABLE tablename ADD STATISTICS ((col_1, col_2)); -- Declare multi-column stats for future ANALYZE\n  ```\n\n---\n\n### 3. Row-Store vs. Column-Store Tables (pp. 171–173, 296–301, Ch.04 Quiz Q3!)\n\n| Feature | Row-Store Table (`ORIENTATION = ROW`, Default) | Column-Store Table (`ORIENTATION = COLUMN`) |\n| :--- | :--- | :--- |\n| **Storage Layout** | All attributes of a row are stored contiguously together | Values of the same column across rows are stored together |\n| **Strengths** | Fast **`INSERT` / `UPDATE` / `DELETE`**; fast **point queries** (index lookup returning a few rows) or `SELECT *` | High **compression ratio**; efficient **projection** (reads only queried columns, drastically reducing disk I/O) |\n| **Weaknesses** | Reading 2 columns out of 50 still reads the entire row from disk | Tuple reconstruction overhead; **inefficient for frequent single-row `INSERT`/`UPDATE` and point queries** |\n| **Best Scenario** | **OLTP**: frequent small writes/updates and point queries | **OLAP**: batch inserts, statistical aggregations (`SUM`/`GROUP BY`), wide tables where queries touch **< 50% of columns** |\n\n```sql\nCREATE TABLE sales_col (id INT, region VARCHAR(20), amount NUMERIC(10,2))\nWITH (ORIENTATION = COLUMN, COMPRESSION = HIGH);\n```\n<!-- PDF_FIGS_START -->\n![Row-Store vs Column-Store Storage Model Visual Comparison (Official Reference: p. 171)](./assets/images/p3_h3s3_row_vs_column_store.png)\n*Figure: Row-Store vs Column-Store Storage Model Visual Comparison (Official Reference: p. 171)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["A CBO consists of three components: Query converter, Cost estimator, and Execution plan generator.","ABO (v3.1.0+) introduces Bayesian Network (`BAYESNET`) intelligent multi-column cardinality estimation (`enable_ai_stats = on`) and Adaptive Plan Selection.","Row-store (default) excels at frequent INSERT/UPDATE and point queries; Column-store (`WITH (ORIENTATION = COLUMN)`) excels at compression, projection, and OLAP statistical aggregations (Ch.04 Quiz Q3: ABC)."],"exam_traps":["EXAM TRAP (Ch.04 Quiz Q3): Statement D claims 'Row-store tables are used in scenarios where there are a large number of queries for statistical analysis.' FALSE! Statistical analysis queries over massive data use Column-store tables (Answer: ABC).","EXAM TRAP: The `PG_STATISTIC` system catalog is accessible ONLY to system administrators; non-admin users must use authorized views (`PG_STATS`)."],"content_html":"<h3>1. Query Optimizers: CBO vs. ABO (pp. 161–166)<\/h3>\n<ul class=\"md-list\">\n<li><strong>CBO (Cost-Based Optimizer, introduced in v1.0.0)<\/strong>:<\/li>\n<li>Consists of <strong>3 key components<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Query converter<\/strong>: Rewrites SQL statements into lower-cost equivalent forms.<\/li>\n<li><strong>Cost estimator<\/strong>: Calculates execution cost based on table tuples, column width, NULL ratio, distinct count, and <strong>MCV (<code class=\"inline-code\">most_common_vals<\/code>)<\/strong>.<\/li>\n<li><strong>Execution plan generator<\/strong>: Explores access paths, join methods, and join orders to pick the lowest-cost plan.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>ABO (AI-Based Optimizer, 3rd-gen intelligent optimizer introduced in v3.1.0)<\/strong>:<\/li>\n<li><strong>Sub-feature 1 — Intelligent Cardinality Estimation<\/strong>: Uses a <strong>Bayesian network (<code class=\"inline-code\">BAYESNET<\/code>)<\/strong> model to capture joint distributions across correlated/skewed columns for multi-column equality queries.<\/li>\n<li>Enable via GUC: <code class=\"inline-code\">SET enable_ai_stats = on; SET multi_stats_type = 'BAYESNET';<\/code> (or <code class=\"inline-code\">'ALL'<\/code>), then run <code class=\"inline-code\">ANALYZE<\/code>.<\/li>\n<li><strong>Sub-feature 2 — Adaptive Plan Selection<\/strong>: Maintains multiple cached execution plans using range linear expansion and range coverage matching (especially for partial indexes and offsets) rather than a single rigid generic cached plan.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Statistics Collection (<code class=\"inline-code\">ANALYZE<\/code>) &amp; <code class=\"inline-code\">PG_STATISTIC<\/code> (pp. 167–170)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Where Statistics Live<\/strong>:<\/li>\n<li><strong><code class=\"inline-code\">pg_class<\/code><\/strong>: Stores global table-level <strong><code class=\"inline-code\">relpages<\/code><\/strong> (disk pages) and <strong><code class=\"inline-code\">reltuples<\/code><\/strong> (estimated rows).<\/li>\n<li><strong><code class=\"inline-code\">pg_statistic<\/code><\/strong>: Stores column-level statistics (<code class=\"inline-code\">starelid<\/code>, <code class=\"inline-code\">staattnum<\/code>, <code class=\"inline-code\">stanullfrac<\/code> [NULL ratio], <code class=\"inline-code\">stawidth<\/code> [avg byte width], <code class=\"inline-code\">stadistinct<\/code> [distinct values], <code class=\"inline-code\">stanumbersN<\/code>, <code class=\"inline-code\">stavaluesN<\/code>, <code class=\"inline-code\">histogram_bounds<\/code>). Accessible <strong>only to system administrators<\/strong> (ordinary users query the <code class=\"inline-code\">PG_STATS<\/code> view if authorized).<\/li>\n<li><strong>Sampling Rule<\/strong>: By default, <code class=\"inline-code\">default_statistics_target = 100<\/code> samples <strong>30,000 rows<\/strong>. If a table exceeds <strong>1,600,000 rows<\/strong>, Huawei recommends setting <code class=\"inline-code\">default_statistics_target = -2<\/code> (which samples <strong>2%<\/strong> of the rows).<\/li>\n<li><strong>Commands<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  ANALYZE tablename;                                    -- Single table\n  ANALYZE;                                              -- Entire database\n  ANALYZE tablename (col_1, col_2);                     -- Specific columns\n  ALTER TABLE tablename ADD STATISTICS ((col_1, col_2)); -- Declare multi-column stats for future ANALYZE<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>3. Row-Store vs. Column-Store Tables (pp. 171–173, 296–301, Ch.04 Quiz Q3!)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Feature<\/th><th>Row-Store Table (<code class=\"inline-code\">ORIENTATION = ROW<\/code>, Default)<\/th><th>Column-Store Table (<code class=\"inline-code\">ORIENTATION = COLUMN<\/code>)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Storage Layout<\/strong><\/td><td>All attributes of a row are stored contiguously together<\/td><td>Values of the same column across rows are stored together<\/td><\/tr>\n<tr><td><strong>Strengths<\/strong><\/td><td>Fast <strong><code class=\"inline-code\">INSERT<\/code> / <code class=\"inline-code\">UPDATE<\/code> / <code class=\"inline-code\">DELETE<\/code><\/strong>; fast <strong>point queries<\/strong> (index lookup returning a few rows) or <code class=\"inline-code\">SELECT *<\/code><\/td><td>High <strong>compression ratio<\/strong>; efficient <strong>projection<\/strong> (reads only queried columns, drastically reducing disk I/O)<\/td><\/tr>\n<tr><td><strong>Weaknesses<\/strong><\/td><td>Reading 2 columns out of 50 still reads the entire row from disk<\/td><td>Tuple reconstruction overhead; <strong>inefficient for frequent single-row <code class=\"inline-code\">INSERT<\/code>/<code class=\"inline-code\">UPDATE<\/code> and point queries<\/strong><\/td><\/tr>\n<tr><td><strong>Best Scenario<\/strong><\/td><td><strong>OLTP<\/strong>: frequent small writes/updates and point queries<\/td><td><strong>OLAP<\/strong>: batch inserts, statistical aggregations (<code class=\"inline-code\">SUM<\/code>/<code class=\"inline-code\">GROUP BY<\/code>), wide tables where queries touch <strong>&lt; 50% of columns<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>CREATE TABLE sales_col (id INT, region VARCHAR(20), amount NUMERIC(10,2))\nWITH (ORIENTATION = COLUMN, COMPRESSION = HIGH);<\/code><\/pre><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s3_row_vs_column_store.png\" alt=\"Row-Store vs Column-Store Storage Model Visual Comparison\" data-caption=\"Row-Store vs Column-Store Storage Model Visual Comparison (Official Reference: p. 171)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Row-Store vs Column-Store Storage Model Visual Comparison<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 171 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Creating Column-Store Tables & Updating Optimizer Statistics","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Create a column-store analytical table `orders_olap` with high compression, declare multi-column statistics on `(region, category)`, and run `ANALYZE` so the CBO/ABO can generate optimal execution plans.","instructions":["Step 1: Create table `orders_olap (order_id INT, region VARCHAR(20), category VARCHAR(20), amount NUMERIC(10,2))` as a column-store table using `WITH (ORIENTATION = COLUMN, COMPRESSION = HIGH);`.","Step 2: Collect statistics on `orders_olap` for columns `(region, category)` using `ANALYZE orders_olap (region, category);`."],"starter_code":"-- Step 1: Create a column-store table with HIGH compression\nCREATE TABLE orders_olap (\n    order_id INT,\n    region VARCHAR(20),\n    category VARCHAR(20),\n    amount NUMERIC(10,2)\n) WITH (____ = ____, COMPRESSION = HIGH);\n\n-- Step 2: Collect statistics on (region, category) in orders_olap\n____ orders_olap (region, category);\n","solution_code":"CREATE TABLE orders_olap (\n    order_id INT,\n    region VARCHAR(20),\n    category VARCHAR(20),\n    amount NUMERIC(10,2)\n) WITH (ORIENTATION = COLUMN, COMPRESSION = HIGH);\n\nANALYZE orders_olap (region, category);","hints":["Use `WITH (ORIENTATION = COLUMN, COMPRESSION = HIGH)` to create a compressed column-store table.","Use the `ANALYZE orders_olap (region, category);` statement to collect column statistics into `PG_STATISTIC`."],"validation_checks":[{"step":1,"description":"Specify `ORIENTATION = COLUMN`","required_any":["orientation = column","orientation=column"],"feedback_fail":"Use `WITH (ORIENTATION = COLUMN, COMPRESSION = HIGH)`."},{"step":2,"description":"Collect statistics with `ANALYZE orders_olap`","required_any":["analyze orders_olap"],"feedback_fail":"Run `ANALYZE orders_olap (region, category);`."}],"simulated_output":"CREATE TABLE\nANALYZE","quiz_questions":[{"id":"h3_s3_q1","type":"multiple","question":"(Official Ch.04 Quiz Q3) Which of the following statements about row-store tables and column-store tables are TRUE?","options":["A. Row-store tables are used in scenarios where INSERT and UPDATE operations are frequently performed.","B. Row-store tables are applicable to point queries, that is, simple index-based queries that return a small number of records.","C. Column-store tables are more efficient in compression and projection.","D. Row-store tables are used in scenarios where there are a large number of queries for statistical analysis."],"answer":"ABC","explanation":"Per Chapter 03 (pp. 171–172) and Chapter 04 Quiz Q3 (p. 347), A, B, and C are true. D is false because statistical analysis queries over large volumes of data are suited to column-store tables."},{"id":"h3_s3_q2","type":"single","question":"Which system catalog in openGauss stores the table and index column statistics collected by the `ANALYZE` statement?","options":["A. PG_STAT_ACTIVITY","B. PG_STATISTIC","C. PG_ATTRIBUTE","D. PG_DEPEND"],"answer":"B","explanation":"Per Chapter 03 (pp. 168–170), the `ANALYZE` statement collects statistics on tables in the database and stores them in the system catalog `PG_STATISTIC`."},{"id":"h3_s3_q3","type":"tf","question":"The openGauss AI-Based Optimizer (ABO) uses a Bayesian network (`BAYESNET`) model to characterize the joint distribution of multi-column data for intelligent cardinality estimation.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.03 p. 162). The ABO employs a Bayesian network model (`enable_ai_stats = on`, `multi_stats_type = 'BAYESNET'`) to accurately estimate cardinality for multi-column equality queries."}],"reference_figures":[{"slug":"p3_h3s3_row_vs_column_store","title":"Row-Store vs Column-Store Storage Model Visual Comparison","pdf_page":171}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Partitioning-Kunpeng-NUMA-SMP-and-HA-Ultimate-RTO","exercise_slug":"08-Exercise-Partitioning-SMP-Switchover-and-RTO-Lab","lecture":{"title":"Table Partitioning, Kunpeng NUMA Optimization, SMP & High Availability / Ultimate RTO","duration_mins":7,"pdf_ref":"Ch.03, pp. 174–198","objectives":["Create and manage Range, List, and Hash partitioned tables and `LOCAL`/`GLOBAL` partitioned indexes","Explain Kunpeng 920 NUMA optimizations (`numactl -H`, ARMv8.1 `casal` atomic instruction, core binding) and SMP (`query_dop`)","Execute Primary/Standby `switchover` vs `failover` (`gs_ctl`, `gs_om -t refreshconf`), configure Ultimate RTO (`recovery_parse_workers`, `recovery_parallelism`), and describe Logical Replication"],"content_markdown":"### 1. Table Partitioning (pp. 174–181)\nopenGauss horizontally splits a table into non-overlapping physical partitions to deliver **high query efficiency (partition pruning)**, **high availability**, **easy maintenance**, and **balanced I/O**:\n- **3 Partitioning Modes**:\n  1. **Range Partitioning (`PARTITION BY RANGE(col)`)**: Maps rows by non-overlapping value ranges (`VALUES LESS THAN (...)`). Most common (often on time/date columns).\n  2. **List Partitioning (`PARTITION BY LIST(col)`)**: Maps rows by discrete key value lists (`VALUES (...)`).\n  3. **Hash Partitioning (`PARTITION BY HASH(col)`)**: Maps rows evenly across partitions using an internal hash function.\n- **Core Partition DDL Operations (pp. 177–180)**:\n  ```sql\n  ALTER TABLE student1 ADD PARTITION score4 VALUES LESS THAN (101);\n  ALTER TABLE student1 DROP PARTITION score1;\n  ALTER TABLE student1 RENAME PARTITION score2 TO score2_new;\n  ALTER TABLE student1 TRUNCATE PARTITION score2_new;\n  SELECT * FROM student1 PARTITION (score2_new);\n  CREATE INDEX student1_index1 ON student1 (score) LOCAL;\n  ALTER INDEX student1_index2 RENAME PARTITION score1_index TO score1_index_new;\n  ```\n\n---\n\n### 2. Kunpeng NUMA Architecture Optimization & SMP Parallelism (pp. 182–188)\n- **Kunpeng 920 NUMA Structure (p. 183)**:\n  - A 2-socket Kunpeng 920 (64 cores, 2 Dies per socket = **4 NUMA nodes 0–3**) has local node access distance **10**, intra-socket cross-die distance **16** (1.6x latency), and cross-socket distance **25–33**. Inspect via **`numactl -H`**.\n  - **5 openGauss NUMA Optimizations (pp. 182–186)**:\n    1. **Thread-to-Core Binding**: Separately binds network interrupts and service threads to CPU cores to prevent cross-core thread migration.\n    2. **NUMA-Aware Data Structures**: Partitions hotspot structures (e.g., Clog partitions, WAL buffers) per NUMA node to reduce cross-node access.\n    3. **Redo Log Batch Insertion** & larger Kunpeng L3 cache-line padding.\n    4. **ARMv8.1 LSE Atomic Instruction (`casal`)**: Replaces 4 instructions (`ldxr` + `stlxr` loop) with **1 single atomic instruction (`casal`)**, boosting 2-socket Kunpeng TPC-C performance by **> 10%** (from **1.34M to 1.51M tpmC**)!\n- **SMP (Symmetric Multi-Processing, pp. 187–188)**:\n  - Intra-query operator-level multi-threaded parallel execution within a single process (exchanging data in memory via the **`Stream`** operator without network overhead).\n  - Controlled by GUC **`query_dop`**: `1` (disabled, default); `0` (adaptive selection between `[1, 8]` when system load < 50%). *Note*: Data skew or high concurrent OLTP load degrades SMP efficiency.\n<!-- PDF_FIGS_START -->\n![Kunpeng NUMA CPU Die Structure and Node Distance Matrix (Official Reference: p. 183)](./assets/images/p3_h3s4_kunpeng_numa_matrix.png)\n*Figure: Kunpeng NUMA CPU Die Structure and Node Distance Matrix (Official Reference: p. 183)*\n\n![NUMA-Aware Kernel Data Partitioning Structure (Official Reference: p. 185)](./assets/images/p3_h3s4_numa_kernel_struct.png)\n*Figure: NUMA-Aware Kernel Data Partitioning Structure (Official Reference: p. 185)*\n\n![Unscheduled Thread Migration vs NUMA-Pinned Core Binding (Official Reference: p. 186)](./assets/images/p3_h3s4_numa_thread_binding.png)\n*Figure: Unscheduled Thread Migration vs NUMA-Pinned Core Binding (Official Reference: p. 186)*\n\n![SMP Multi-Thread Parallel Execution Flow (Official Reference: p. 187)](./assets/images/p3_h3s4_smp_parallel.png)\n*Figure: SMP Multi-Thread Parallel Execution Flow (Official Reference: p. 187)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. High Availability, Switchover/Failover, Ultimate RTO & Logical Replication (pp. 190–198)\n- **Switchover vs. Failover (pp. 190–193)**:\n  - **Switchover (Planned maintenance, zero data loss)**:\n    ```bash\n    gs_om -t status --detail\n    gs_ctl switchover -D /home/omm/cluster/dn1/   # Run on target standby node as omm\n    gs_om -t refreshconf                          # Save dynamic primary/standby role state\n    ```\n  - **Failover (Unplanned primary fault, may cause data loss if async)**:\n    ```bash\n    gs_ctl failover -D /home/omm/cluster/dn1/     # Promote standby to primary\n    gs_om -t refreshconf\n    ```\n  - *Cascaded standby rule*: Cannot be directly promoted to primary; must first switchover/failover to become a normal standby, then primary.\n- **RPO vs. RTO & Ultimate RTO (pp. 195–197)**:\n  - **RPO (Recovery Point Objective)**: Data-oriented — maximum tolerable period of **data loss** (measures data integrity).\n  - **RTO (Recovery Time Objective)**: Application-oriented — maximum tolerable **service downtime** (measures recovery timeliness).\n  - **Ultimate RTO (Parallel Redo + Incremental Checkpoint)**: Uses multi-level pipelines to replay Xlogs in parallel on the standby node. Enabled only when **both `recovery_parse_workers > 1` AND `recovery_parallelism > 1`**. *(Constraint: Cascaded standby nodes are NOT supported when Ultimate RTO is enabled!)*\n- **Logical Replication (p. 198)**: DNs reversely parse physical WAL logs into logical logs (**logical decoding**, supported on standby nodes since v1.1.0); tools like **DRS** convert them into SQL for heterogeneous bidirectional sync with **MySQL** or **Oracle**. *(Constraint: Column-store replication is NOT supported!)*\n<!-- PDF_FIGS_START -->\n![RPO vs RTO Disaster Recovery Metrics on Time Axis (Official Reference: p. 196)](./assets/images/p3_h3s4_rpo_vs_rto_timeline.png)\n*Figure: RPO vs RTO Disaster Recovery Metrics on Time Axis (Official Reference: p. 196)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["On Kunpeng 920 (ARMv8.1 LSE), replacing `ldxr`/`stlxr` (4 instructions) with the single atomic `casal` instruction boosts TPC-C throughput from 1.34M to 1.51M tpmC (+10%).","RPO (Recovery Point Objective) is data-oriented (tolerable data loss), whereas RTO (Recovery Time Objective) is application-oriented (tolerable service downtime).","After running `gs_ctl switchover -D <datadir>` or `gs_ctl failover -D <datadir>` on the standby node, you MUST run `gs_om -t refreshconf` to update the dynamic configuration file."],"exam_traps":["EXAM TRAP: Parallel recovery (Ultimate RTO) is active ONLY when BOTH `recovery_parse_workers > 1` and `recovery_parallelism > 1`, and cascaded standby nodes are NOT supported when Ultimate RTO is enabled (Ch.03 p. 192 & p. 196).","EXAM TRAP: Logical replication supports row-store tables and standby decoding, but Column-store replication is NOT supported (Ch.03 p. 198)."],"content_html":"<h3>1. Table Partitioning (pp. 174–181)<\/h3>\n<p>openGauss horizontally splits a table into non-overlapping physical partitions to deliver <strong>high query efficiency (partition pruning)<\/strong>, <strong>high availability<\/strong>, <strong>easy maintenance<\/strong>, and <strong>balanced I/O<\/strong>:<\/p>\n<ul class=\"md-list\">\n<li><strong>3 Partitioning Modes<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Range Partitioning (<code class=\"inline-code\">PARTITION BY RANGE(col)<\/code>)<\/strong>: Maps rows by non-overlapping value ranges (<code class=\"inline-code\">VALUES LESS THAN (...)<\/code>). Most common (often on time/date columns).<\/li>\n<li><strong>List Partitioning (<code class=\"inline-code\">PARTITION BY LIST(col)<\/code>)<\/strong>: Maps rows by discrete key value lists (<code class=\"inline-code\">VALUES (...)<\/code>).<\/li>\n<li><strong>Hash Partitioning (<code class=\"inline-code\">PARTITION BY HASH(col)<\/code>)<\/strong>: Maps rows evenly across partitions using an internal hash function.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Core Partition DDL Operations (pp. 177–180)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>  ALTER TABLE student1 ADD PARTITION score4 VALUES LESS THAN (101);\n  ALTER TABLE student1 DROP PARTITION score1;\n  ALTER TABLE student1 RENAME PARTITION score2 TO score2_new;\n  ALTER TABLE student1 TRUNCATE PARTITION score2_new;\n  SELECT * FROM student1 PARTITION (score2_new);\n  CREATE INDEX student1_index1 ON student1 (score) LOCAL;\n  ALTER INDEX student1_index2 RENAME PARTITION score1_index TO score1_index_new;<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>2. Kunpeng NUMA Architecture Optimization &amp; SMP Parallelism (pp. 182–188)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Kunpeng 920 NUMA Structure (p. 183)<\/strong>:<\/li>\n<li>A 2-socket Kunpeng 920 (64 cores, 2 Dies per socket = <strong>4 NUMA nodes 0–3<\/strong>) has local node access distance <strong>10<\/strong>, intra-socket cross-die distance <strong>16<\/strong> (1.6x latency), and cross-socket distance <strong>25–33<\/strong>. Inspect via <strong><code class=\"inline-code\">numactl -H<\/code><\/strong>.<\/li>\n<li><strong>5 openGauss NUMA Optimizations (pp. 182–186)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Thread-to-Core Binding<\/strong>: Separately binds network interrupts and service threads to CPU cores to prevent cross-core thread migration.<\/li>\n<li><strong>NUMA-Aware Data Structures<\/strong>: Partitions hotspot structures (e.g., Clog partitions, WAL buffers) per NUMA node to reduce cross-node access.<\/li>\n<li><strong>Redo Log Batch Insertion<\/strong> &amp; larger Kunpeng L3 cache-line padding.<\/li>\n<li><strong>ARMv8.1 LSE Atomic Instruction (<code class=\"inline-code\">casal<\/code>)<\/strong>: Replaces 4 instructions (<code class=\"inline-code\">ldxr<\/code> + <code class=\"inline-code\">stlxr<\/code> loop) with <strong>1 single atomic instruction (<code class=\"inline-code\">casal<\/code>)<\/strong>, boosting 2-socket Kunpeng TPC-C performance by <strong>&gt; 10%<\/strong> (from <strong>1.34M to 1.51M tpmC<\/strong>)!<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>SMP (Symmetric Multi-Processing, pp. 187–188)<\/strong>:<\/li>\n<li>Intra-query operator-level multi-threaded parallel execution within a single process (exchanging data in memory via the <strong><code class=\"inline-code\">Stream<\/code><\/strong> operator without network overhead).<\/li>\n<li>Controlled by GUC <strong><code class=\"inline-code\">query_dop<\/code><\/strong>: <code class=\"inline-code\">1<\/code> (disabled, default); <code class=\"inline-code\">0<\/code> (adaptive selection between <code class=\"inline-code\">[1, 8]<\/code> when system load &lt; 50%). <em>Note<\/em>: Data skew or high concurrent OLTP load degrades SMP efficiency.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s4_kunpeng_numa_matrix.png\" alt=\"Kunpeng NUMA CPU Die Structure and Node Distance Matrix\" data-caption=\"Kunpeng NUMA CPU Die Structure and Node Distance Matrix (Official Reference: p. 183)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Kunpeng NUMA CPU Die Structure and Node Distance Matrix<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 183 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s4_numa_kernel_struct.png\" alt=\"NUMA-Aware Kernel Data Partitioning Structure\" data-caption=\"NUMA-Aware Kernel Data Partitioning Structure (Official Reference: p. 185)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>NUMA-Aware Kernel Data Partitioning Structure<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 185 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s4_numa_thread_binding.png\" alt=\"Unscheduled Thread Migration vs NUMA-Pinned Core Binding\" data-caption=\"Unscheduled Thread Migration vs NUMA-Pinned Core Binding (Official Reference: p. 186)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Unscheduled Thread Migration vs NUMA-Pinned Core Binding<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 186 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s4_smp_parallel.png\" alt=\"SMP Multi-Thread Parallel Execution Flow\" data-caption=\"SMP Multi-Thread Parallel Execution Flow (Official Reference: p. 187)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>SMP Multi-Thread Parallel Execution Flow<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 187 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. High Availability, Switchover/Failover, Ultimate RTO &amp; Logical Replication (pp. 190–198)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Switchover vs. Failover (pp. 190–193)<\/strong>:<\/li>\n<li><strong>Switchover (Planned maintenance, zero data loss)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>    gs_om -t status --detail\n    gs_ctl switchover -D /home/omm/cluster/dn1/   # Run on target standby node as omm\n    gs_om -t refreshconf                          # Save dynamic primary/standby role state<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Failover (Unplanned primary fault, may cause data loss if async)<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>    gs_ctl failover -D /home/omm/cluster/dn1/     # Promote standby to primary\n    gs_om -t refreshconf<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><em>Cascaded standby rule<\/em>: Cannot be directly promoted to primary; must first switchover/failover to become a normal standby, then primary.<\/li>\n<li><strong>RPO vs. RTO &amp; Ultimate RTO (pp. 195–197)<\/strong>:<\/li>\n<li><strong>RPO (Recovery Point Objective)<\/strong>: Data-oriented — maximum tolerable period of <strong>data loss<\/strong> (measures data integrity).<\/li>\n<li><strong>RTO (Recovery Time Objective)<\/strong>: Application-oriented — maximum tolerable <strong>service downtime<\/strong> (measures recovery timeliness).<\/li>\n<li><strong>Ultimate RTO (Parallel Redo + Incremental Checkpoint)<\/strong>: Uses multi-level pipelines to replay Xlogs in parallel on the standby node. Enabled only when <strong>both <code class=\"inline-code\">recovery_parse_workers &gt; 1<\/code> AND <code class=\"inline-code\">recovery_parallelism &gt; 1<\/code><\/strong>. <em>(Constraint: Cascaded standby nodes are NOT supported when Ultimate RTO is enabled!)<\/em><\/li>\n<li><strong>Logical Replication (p. 198)<\/strong>: DNs reversely parse physical WAL logs into logical logs (<strong>logical decoding<\/strong>, supported on standby nodes since v1.1.0); tools like <strong>DRS<\/strong> convert them into SQL for heterogeneous bidirectional sync with <strong>MySQL<\/strong> or <strong>Oracle<\/strong>. <em>(Constraint: Column-store replication is NOT supported!)<\/em><\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h3s4_rpo_vs_rto_timeline.png\" alt=\"RPO vs RTO Disaster Recovery Metrics on Time Axis\" data-caption=\"RPO vs RTO Disaster Recovery Metrics on Time Axis (Official Reference: p. 196)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>RPO vs RTO Disaster Recovery Metrics on Time Axis<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 196 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Executing Primary/Standby Switchover & Configuring Ultimate RTO","duration_mins":8,"exercise_type":"terminal","prompt_label":"omm@opengauss:~","scenario":"You need to enable Ultimate RTO parallel recovery (`recovery_parse_workers = 4`, `recovery_parallelism = 4`), perform a planned primary/standby switchover on standby node `/home/omm/cluster/dn1/`, and persist the new cluster role topology.","instructions":["Step 1: Set `recovery_parse_workers=4` and `recovery_parallelism=4` using `gs_guc set`.","Step 2: Promote standby `/home/omm/cluster/dn1/` via planned switchover using `gs_ctl switchover -D /home/omm/cluster/dn1/`.","Step 3: Persist the updated dynamic primary/standby configuration using `gs_om -t refreshconf`."],"starter_code":"# Step 1: Configure Ultimate RTO parallel recovery workers\ngs_guc set -N all -I all -c \"____=4\"\ngs_guc set -N all -I all -c \"recovery_parallelism=4\"\n\n# Step 2: Perform planned primary/standby switchover on standby dn1\ngs_ctl ____ -D /home/omm/cluster/dn1/\n\n# Step 3: Record the updated primary/standby roles in the dynamic config file\ngs_om -t ____\n","solution_code":"gs_guc set -N all -I all -c \"recovery_parse_workers=4\"\ngs_guc set -N all -I all -c \"recovery_parallelism=4\"\ngs_ctl switchover -D /home/omm/cluster/dn1/\ngs_om -t refreshconf","hints":["Ultimate RTO requires both `recovery_parse_workers` and `recovery_parallelism` to be greater than 1.","Use `gs_ctl switchover -D /home/omm/cluster/dn1/` for planned maintenance switchover.","Always run `gs_om -t refreshconf` after a switchover or failover."],"validation_checks":[{"step":1,"description":"Set `recovery_parse_workers=4`","required_any":["recovery_parse_workers=4","recovery_parse_workers = 4"],"feedback_fail":"Set `recovery_parse_workers=4` using `gs_guc set`."},{"step":2,"description":"Execute `gs_ctl switchover`","required_any":["gs_ctl switchover"],"feedback_fail":"Use `gs_ctl switchover -D /home/omm/cluster/dn1/`."},{"step":3,"description":"Refresh dynamic configuration with `gs_om -t refreshconf`","required_any":["refreshconf"],"feedback_fail":"Run `gs_om -t refreshconf` to save the new primary/standby roles."}],"simulated_output":"Total instances: 2. Failed instances: 0.\nSuccess to perform gs_guc!\n[2026-11-17 14:20:01.102][24810][][gs_ctl]: gs_ctl switchover ,datadir is /home/omm/cluster/dn1/\n[2026-11-17 14:20:03.450][24810][][gs_ctl]: switchover completed (/home/omm/cluster/dn1/)\nGenerating dynamic configuration file for all nodes.\nSuccessfully generated dynamic configuration file.","quiz_questions":[{"id":"h3_s4_q1","type":"single","question":"On Kunpeng 920 (ARMv8.1) processors, which atomic instruction does openGauss use to replace the 4-instruction `ldxr`/`stlxr` loop for Compare-and-Swap (CAS), improving TPC-C throughput by over 10%?","options":["A. cmpxchg8b","B. casal","C. dmb ish","D. yield"],"answer":"B","explanation":"Per Chapter 03 (p. 184), openGauss uses the ARMv8.1 LSE `casal` atomic instruction to implement CAS in 1 instruction instead of 4 (`ldxr` and `stlxr`), increasing throughput from 1.34M to 1.51M tpmC."},{"id":"h3_s4_q2","type":"single","question":"After performing a primary/standby switchover (`gs_ctl switchover`) or failover (`gs_ctl failover`), which command must be executed to update the dynamic configuration file with the current primary and standby roles?","options":["A. gs_om -t generateconf","B. gs_om -t refreshconf","C. gs_guc reload","D. gs_ctl build"],"answer":"B","explanation":"Per Chapter 02 (p. 120) and Chapter 03 (p. 193), `gs_om -t refreshconf` must be executed after a failover or switchover to record the updated primary and standby node roles in the dynamic configuration file."},{"id":"h3_s4_q3","type":"tf","question":"RPO (Recovery Point Objective) is application-oriented and measures the maximum tolerable service downtime, whereas RTO (Recovery Time Objective) is data-oriented and measures the amount of lost data.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.03 pp. 195–196). The definitions are swapped: RTO (Recovery Time Objective) is application-oriented and measures acceptable downtime, whereas RPO (Recovery Point Objective) is data-oriented and measures acceptable data loss over time."}],"reference_figures":[{"slug":"p3_h3s4_numa_thread_binding","title":"Unscheduled Thread Migration vs NUMA-Pinned Core Binding","pdf_page":186},{"slug":"p3_h3s4_rpo_vs_rto_timeline","title":"RPO vs RTO Disaster Recovery Metrics on Time Axis","pdf_page":196}]}}]},{"hour_number":4,"folder_name":"Hour-04-openGauss-Security-Easy-OM-and-AI-Capabilities","title":"openGauss High Security, Easy O&M & AI Capabilities (DBMind)","chapter_ref":"Chapter 03 Part 2 (pp. 199–272)","duration_mins":60,"overview":"Master openGauss's full-lifecycle security architecture (Fully-Encrypted Equality Query, Dynamic Data Masking, RBAC, Row-Level Security, Unified Auditing, and Transparent Data Encryption), configure WDR performance reports, Slow SQL diagnosis, and Active Session diagnosis, and operate the DBMind AI suite (X-Tuner, SQLdiag, Index-advisor, DeepSQL, and Native DB4AI).","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Fully-Encrypted-Database-and-Dynamic-Data-Masking","exercise_slug":"02-Exercise-Resource-Labels-and-Dynamic-Masking-Lab","lecture":{"title":"High Security Part 1 — Fully-Encrypted Database & Dynamic Data Masking","duration_mins":7,"pdf_ref":"Ch.03, pp. 199–208","objectives":["Explain the 3-layer key hierarchy (Root Key, CMK, CEK) and workflow of Fully-Encrypted Equality Queries","Create Resource Labels (`CREATE RESOURCE LABEL`) and Dynamic Data Masking Policies (`CREATE MASKING POLICY`)","Compare all 7 preset masking functions (`creditcardmasking`, `basicemailmasking`, `fullemailmasking`, `alldigitsmasking`, `shufflemasking`, `randommasking`, `maskall`) and their constraints"],"content_markdown":"### 1. Equality Query in a Fully-Encrypted Database (pp. 56, 200–204)\nProtects data privacy across its **entire lifecycle (transmission, computing, and storage)** so data on the server is always in ciphertext — even cloud admins or attackers with root access cannot read plaintext data:\n- **3-Layer Key Hierarchy & Workflow (p. 201)**:\n  1. **Root Key (RK)**: Managed locally via `keytool` on the client host.\n  2. **Client Master Key (`CMK`)**: Stored on the client side and registered in the database metadata; used to encrypt the CEK.\n  3. **Column Encryption Key (`CEK`)**: Encrypted by the CMK on the client and stored as ciphertext on the server; used by the **client driver (`ODBC`/`JDBC`/`gsql -C`)** to encrypt/decrypt column data.\n  - **Encryption Types (`enc_type`)**: **`DETERMINISTIC`** (supports equality queries `=`; server column type becomes `BYTEAWITHOUTORDERWITHEQUALCOL`) vs. **`RANDOMIZED`** (higher security, non-deterministic ciphertext).\n  - **Hardware TEE Support**: Can leverage Intel SGX / Huawei Kunpeng ARM **TEE (`secGear`)** for isolated computation.\n<!-- PDF_FIGS_START -->\n![openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE) (Official Reference: p. 56)](./assets/images/p3_h1s4_fully_encrypted_tee.png)\n*Figure: openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE) (Official Reference: p. 56)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Dynamic Data Masking (pp. 205–208)\nMasks sensitive column data dynamically at query time (`SELECT`) based on the user's identity (`ROLES`), client tool (`APP`), and IP (`IP`) **without modifying the underlying stored data**:\n```sql\n-- Step 1: Create Resource Labels on target table columns\nCREATE RESOURCE LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);\nCREATE RESOURCE LABEL label_for_name ADD COLUMN(user1.table1.name);\n\n-- Step 2: Create Masking Policies bound to Resource Labels\nCREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);\nCREATE MASKING POLICY msk_name randommasking ON LABEL(label_for_name)\n    FILTER ON IP(local), ROLES(dev);\n```\n\n---\n\n### 3. Seven Preconfigured Masking Functions & Constraints (pp. 207–208)\n\n| Preset Masking Function | Masking Rule | Official Example (`Input` -> `Output`) |\n| :--- | :--- | :--- |\n| **`creditcardmasking`** | Masks all digits **except the last 4 digits** with `'x'` | `'4880-9898-4545-2525'` -> **`'xxxx-xxxx-xxxx-2525'`** |\n| **`basicemailmasking`** | Masks all text **before `@`** with `'x'` | `'abcd@mymail.com'` -> **`'xxxx@mymail.com'`** |\n| **`fullemailmasking`** | Masks text **before the first dot (`.`) (except `@`)** with `'x'` | `'abcd@gmail.com'` -> **`'xxxx@xxxxx.com'`** |\n| **`alldigitsmasking`** | Masks **only digits** with `'0'` | `'alex123alex'` -> **`'alex000alex'`** |\n| **`shufflemasking`** | Randomly shuffles character positions (weak masking) | `'hello world'` -> **`'hlwoeor dl'`** |\n| **`randommasking`** | Randomly replaces each character | `'hello world'` -> **`'ad5f5ghdf5'`** |\n| **`maskall`** | Replaces every character with `'x'` | `'4880-9898-4545-2525'` -> **`'xxxxxxxxxxxxxxxxxxx'`** |\n\n- **Key Constraints (p. 208)**:\n  - Must be created by **`POLADMIN`**, **`SYSADMIN`**, or the **initial user** (with GUC `enable_security_policy = on`).\n  - Maximum of **98 dynamic data masking policies**; only the **7 preset masking functions** above can be used.\n  - Applies **only to `COLUMN` resource labels on base tables** and takes effect **only on `SELECT`** queries (Note: `INSERT INTO ... SELECT` or `MERGE INTO` from a masked source column permanently writes the **masked value**!).","key_takeaways":["In a Fully-Encrypted Database, the Client Master Key (CMK) encrypts the Column Encryption Key (CEK), and the client driver encrypts/decrypts data so the server only ever sees ciphertext.","Dynamic Data Masking uses Resource Labels (`CREATE RESOURCE LABEL ... ADD COLUMN(...)`) and Masking Policies (`CREATE MASKING POLICY ... ON LABEL(...)`) and supports 7 preset functions.","`basicemailmasking` masks only before `@` (`xxxx@gmail.com`), whereas `fullemailmasking` masks everything before the last domain dot except `@` (`xxxx@xxxxx.com`)."],"exam_traps":["EXAM TRAP: Dynamic Data Masking can only be created by a user with `POLADMIN`, `SYSADMIN`, or initial user privileges, supports at most 98 policies, and only masks `SELECT` queries on base table columns.","EXAM TRAP: If a user subject to dynamic masking runs `INSERT INTO t2 SELECT masked_col FROM t1`, the inserted data in `t2` is the MASKED value and cannot be restored!"],"content_html":"<h3>1. Equality Query in a Fully-Encrypted Database (pp. 56, 200–204)<\/h3>\n<p>Protects data privacy across its <strong>entire lifecycle (transmission, computing, and storage)<\/strong> so data on the server is always in ciphertext — even cloud admins or attackers with root access cannot read plaintext data:<\/p>\n<ul class=\"md-list\">\n<li><strong>3-Layer Key Hierarchy &amp; Workflow (p. 201)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Root Key (RK)<\/strong>: Managed locally via <code class=\"inline-code\">keytool<\/code> on the client host.<\/li>\n<li><strong>Client Master Key (<code class=\"inline-code\">CMK<\/code>)<\/strong>: Stored on the client side and registered in the database metadata; used to encrypt the CEK.<\/li>\n<li><strong>Column Encryption Key (<code class=\"inline-code\">CEK<\/code>)<\/strong>: Encrypted by the CMK on the client and stored as ciphertext on the server; used by the <strong>client driver (<code class=\"inline-code\">ODBC<\/code>/<code class=\"inline-code\">JDBC<\/code>/<code class=\"inline-code\">gsql -C<\/code>)<\/strong> to encrypt/decrypt column data.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Encryption Types (<code class=\"inline-code\">enc_type<\/code>)<\/strong>: <strong><code class=\"inline-code\">DETERMINISTIC<\/code><\/strong> (supports equality queries <code class=\"inline-code\">=<\/code>; server column type becomes <code class=\"inline-code\">BYTEAWITHOUTORDERWITHEQUALCOL<\/code>) vs. <strong><code class=\"inline-code\">RANDOMIZED<\/code><\/strong> (higher security, non-deterministic ciphertext).<\/li>\n<li><strong>Hardware TEE Support<\/strong>: Can leverage Intel SGX / Huawei Kunpeng ARM <strong>TEE (<code class=\"inline-code\">secGear<\/code>)<\/strong> for isolated computation.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s4_fully_encrypted_tee.png\" alt=\"openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE)\" data-caption=\"openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE) (Official Reference: p. 56)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 56 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Dynamic Data Masking (pp. 205–208)<\/h3>\n<p>Masks sensitive column data dynamically at query time (<code class=\"inline-code\">SELECT<\/code>) based on the user's identity (<code class=\"inline-code\">ROLES<\/code>), client tool (<code class=\"inline-code\">APP<\/code>), and IP (<code class=\"inline-code\">IP<\/code>) <strong>without modifying the underlying stored data<\/strong>:<\/p>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>-- Step 1: Create Resource Labels on target table columns\nCREATE RESOURCE LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);\nCREATE RESOURCE LABEL label_for_name ADD COLUMN(user1.table1.name);\n\n-- Step 2: Create Masking Policies bound to Resource Labels\nCREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);\nCREATE MASKING POLICY msk_name randommasking ON LABEL(label_for_name)\n    FILTER ON IP(local), ROLES(dev);<\/code><\/pre><\/div>\n<p>---<\/p>\n<h3>3. Seven Preconfigured Masking Functions &amp; Constraints (pp. 207–208)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Preset Masking Function<\/th><th>Masking Rule<\/th><th>Official Example (<code class=\"inline-code\">Input<\/code> -&gt; <code class=\"inline-code\">Output<\/code>)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">creditcardmasking<\/code><\/strong><\/td><td>Masks all digits <strong>except the last 4 digits<\/strong> with <code class=\"inline-code\">'x'<\/code><\/td><td><code class=\"inline-code\">'4880-9898-4545-2525'<\/code> -&gt; <strong><code class=\"inline-code\">'xxxx-xxxx-xxxx-2525'<\/code><\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">basicemailmasking<\/code><\/strong><\/td><td>Masks all text <strong>before <code class=\"inline-code\">@<\/code><\/strong> with <code class=\"inline-code\">'x'<\/code><\/td><td><code class=\"inline-code\">'abcd@mymail.com'<\/code> -&gt; <strong><code class=\"inline-code\">'xxxx@mymail.com'<\/code><\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">fullemailmasking<\/code><\/strong><\/td><td>Masks text <strong>before the first dot (<code class=\"inline-code\">.<\/code>) (except <code class=\"inline-code\">@<\/code>)<\/strong> with <code class=\"inline-code\">'x'<\/code><\/td><td><code class=\"inline-code\">'abcd@gmail.com'<\/code> -&gt; <strong><code class=\"inline-code\">'xxxx@xxxxx.com'<\/code><\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">alldigitsmasking<\/code><\/strong><\/td><td>Masks <strong>only digits<\/strong> with <code class=\"inline-code\">'0'<\/code><\/td><td><code class=\"inline-code\">'alex123alex'<\/code> -&gt; <strong><code class=\"inline-code\">'alex000alex'<\/code><\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">shufflemasking<\/code><\/strong><\/td><td>Randomly shuffles character positions (weak masking)<\/td><td><code class=\"inline-code\">'hello world'<\/code> -&gt; <strong><code class=\"inline-code\">'hlwoeor dl'<\/code><\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">randommasking<\/code><\/strong><\/td><td>Randomly replaces each character<\/td><td><code class=\"inline-code\">'hello world'<\/code> -&gt; <strong><code class=\"inline-code\">'ad5f5ghdf5'<\/code><\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">maskall<\/code><\/strong><\/td><td>Replaces every character with <code class=\"inline-code\">'x'<\/code><\/td><td><code class=\"inline-code\">'4880-9898-4545-2525'<\/code> -&gt; <strong><code class=\"inline-code\">'xxxxxxxxxxxxxxxxxxx'<\/code><\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>Key Constraints (p. 208)<\/strong>:<\/li>\n<li>Must be created by <strong><code class=\"inline-code\">POLADMIN<\/code><\/strong>, <strong><code class=\"inline-code\">SYSADMIN<\/code><\/strong>, or the <strong>initial user<\/strong> (with GUC <code class=\"inline-code\">enable_security_policy = on<\/code>).<\/li>\n<li>Maximum of <strong>98 dynamic data masking policies<\/strong>; only the <strong>7 preset masking functions<\/strong> above can be used.<\/li>\n<li>Applies <strong>only to <code class=\"inline-code\">COLUMN<\/code> resource labels on base tables<\/strong> and takes effect <strong>only on <code class=\"inline-code\">SELECT<\/code><\/strong> queries (Note: <code class=\"inline-code\">INSERT INTO ... SELECT<\/code> or <code class=\"inline-code\">MERGE INTO<\/code> from a masked source column permanently writes the <strong>masked value<\/strong>!).<\/li>\n<\/ul>"},"exercise":{"title":"Hands-On Lab: Configuring Resource Labels & Dynamic Data Masking Policies","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Protect customer privacy on `user1.table1`: create a resource label `label_for_creditcard` on column `user1.table1.creditcard` and apply the `creditcardmasking` policy `msk_creditcard` so only the last 4 digits are visible.","instructions":["Step 1: Create the resource label using `CREATE RESOURCE LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);`.","Step 2: Create the masking policy using `CREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);`.","Step 3: Query `SELECT creditcard FROM user1.table1;` to verify the masked output."],"starter_code":"-- Step 1: Create a resource label on user1.table1.creditcard\nCREATE ____ LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);\n\n-- Step 2: Create a masking policy using creditcardmasking\nCREATE ____ POLICY msk_creditcard ____ ON LABEL(label_for_creditcard);\n\n-- Step 3: Query the masked column\nSELECT creditcard FROM user1.table1;\n","solution_code":"CREATE RESOURCE LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);\n\nCREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);\n\nSELECT creditcard FROM user1.table1;","hints":["Use `CREATE RESOURCE LABEL <label_name> ADD COLUMN(<schema.table.col>);`.","Use `CREATE MASKING POLICY <policy_name> creditcardmasking ON LABEL(<label_name>);`."],"validation_checks":[{"step":1,"description":"Create resource label with `CREATE RESOURCE LABEL`","required_any":["create resource label label_for_creditcard"],"feedback_fail":"Use `CREATE RESOURCE LABEL label_for_creditcard ADD COLUMN(user1.table1.creditcard);`."},{"step":2,"description":"Create masking policy with `CREATE MASKING POLICY` and `creditcardmasking`","required_any":["create masking policy msk_creditcard creditcardmasking"],"feedback_fail":"Use `CREATE MASKING POLICY msk_creditcard creditcardmasking ON LABEL(label_for_creditcard);`."}],"simulated_output":"CREATE RESOURCE LABEL\nCREATE MASKING POLICY\n     creditcard      \n---------------------\n xxxx-xxxx-xxxx-2525\n(1 row)","quiz_questions":[{"id":"h4_s1_q1","type":"single","question":"In openGauss Dynamic Data Masking, how will the string `'abcd@gmail.com'` be displayed when masked by `basicemailmasking` versus `fullemailmasking`?","options":["A. `basicemailmasking`: `'xxxx@gmail.com'`; `fullemailmasking`: `'xxxx@xxxxx.com'`","B. `basicemailmasking`: `'xxxx@xxxxx.com'`; `fullemailmasking`: `'xxxxxxxxxxxxxx'`","C. `basicemailmasking`: `'a***@gmail.com'`; `fullemailmasking`: `'a***@g****.com'`","D. `basicemailmasking`: `'abcd@xxxxx.com'`; `fullemailmasking`: `'xxxx@gmail.com'`"],"answer":"A","explanation":"Per Chapter 03 (p. 207), `basicemailmasking` masks all text before `@` (`'xxxx@gmail.com'`), whereas `fullemailmasking` masks all text before the first dot `.` except `@` (`'xxxx@xxxxx.com'`)."},{"id":"h4_s1_q2","type":"multiple","question":"Which of the following statements about openGauss Fully-Encrypted Database equality queries are TRUE?","options":["A. It uses a three-layer key hierarchy consisting of the Root Key, Client Master Key (CMK), and Column Encryption Key (CEK)","B. The CEK is encrypted by the CMK on the client and stored in ciphertext on the database server","C. Data is encrypted and decrypted on the client side, while the server processes ciphertext","D. Plaintext encryption keys are stored in the `pg_class` system catalog on the server so the server can decrypt columns before comparison"],"answer":"ABC","explanation":"Per Chapter 01 (p. 56) and Chapter 03 (p. 201), A, B, and C are true. Option D is false: plaintext key information is NEVER stored on the database server, and the server cannot decrypt ciphertext."},{"id":"h4_s1_q3","type":"tf","question":"In openGauss, any ordinary database user can create a Dynamic Data Masking policy on tables within the `public` schema.","options":["A. True","B. False"],"answer":"B","explanation":"False (Ch.03 p. 208). A dynamic data masking policy must be created by a user with the `POLADMIN` or `SYSADMIN` attribute, or by the initial user."}],"reference_figures":[{"slug":"p3_h1s4_fully_encrypted_tee","title":"openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE)","pdf_page":56}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-RBAC-Row-Level-Security-Unified-Auditing-and-TDE","exercise_slug":"04-Exercise-RLS-and-Unified-Audit-Policy-Lab","lecture":{"title":"High Security Part 2 — RBAC, Row-Level Security (RLS), Unified Auditing & TDE","duration_mins":7,"pdf_ref":"Ch.03, pp. 209–226","objectives":["Explain RBAC (Who, What, How) and Separation of Duties (System, Security, and Audit Administrators)","Configure Row-Level Security (`ALTER TABLE ... ENABLE ROW LEVEL SECURITY`, `CREATE ROW LEVEL SECURITY POLICY`) and understand its constraints","Create Unified Audit Policies (`CREATE AUDIT POLICY`) and Transparent Data Encryption (TDE) tables (`AES_128_CTR` / `SM4_CTR`)"],"content_markdown":"### 1. Access Control: RBAC & Separation of Duties (pp. 209–212)\n- **Separation of Duties (3 Admin Roles, p. 209)**:\n  1. **Security Administrator (`CREATEROLE`)**: Creates and manages users.\n  2. **System Administrator (`SYSADMIN`)**: Grants and revokes user permissions.\n  3. **Audit Administrator (`AUDITADMIN`)**: Audits all user behaviors.\n- **RBAC (Role-Based Access Control)**:\n  - Defines relationships among **Who** (subject/user/role), **What** (target database object), and **How** (specific positive/negative permission).\n  - Supports many-to-many mappings (users <-> roles <-> permissions) and enforces the **principle of least privilege**.\n<!-- PDF_FIGS_START -->\n![Role-Based Access Control (RBAC) User-Role-Permission Mapping (Official Reference: p. 210)](./assets/images/p3_h4s2_rbac_model.png)\n*Figure: Role-Based Access Control (RBAC) User-Role-Permission Mapping (Official Reference: p. 210)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Row-Level Security (RLS, pp. 213–215)\nControls data visibility **row by row** so different users executing the exact same SQL statement see only the rows permitted by policy expressions (`PERMISSIVE` combined via `OR`, or `RESTRICTIVE` combined via `AND`):\n```sql\nALTER TABLE tablename ENABLE ROW LEVEL SECURITY;\nCREATE ROW LEVEL SECURITY POLICY tablename_rls ON tablename USING(role = CURRENT_USER);\n```\n- **RLS Constraints (p. 215)**:\n  - Applies **ONLY to `SELECT`, `UPDATE`, and `DELETE`** operations (**cannot** be applied to `INSERT` or `MERGE`!).\n  - Cannot be defined on **views**, **foreign tables (MOT)**, or **temporary tables**.\n  - Maximum of **100 RLS policies** per table.\n  - **Initial users and `SYSADMIN` users bypass (are not affected by) RLS policies.**\n\n---\n\n### 3. Unified Auditing & Transparent Data Encryption (TDE, pp. 216–226)\n- **Unified Auditing (pp. 217–224)**:\n  - Requires `enable_security_policy = on` and user with **`POLADMIN`**, **`SYSADMIN`**, or **initial user** privileges; logs via OS **`rsyslog`**.\n  - **Syntax**:\n    ```sql\n    CREATE RESOURCE LABEL adt_lb0 ADD TABLE(tb_for_audit);\n    -- DDL audit policy (PRIVILEGES)\n    CREATE AUDIT POLICY adt3 PRIVILEGES CREATE ON LABEL(adt_lb0) FILTER ON ROLES(dev_audit, bob_audit);\n    -- DML audit policy (ACCESS)\n    CREATE AUDIT POLICY adt4 ACCESS SELECT ON LABEL(adt_lb0), INSERT ON LABEL(adt_lb0), DELETE\n        FILTER ON ROLES(dev_audit, bob_audit), APP(psql, gsql), IP('10.20.30.40', '127.0.0.0/24');\n    ```\n  - **4 System Catalogs (p. 223)**: `GS_AUDITING_POLICY` (main info), `GS_AUDITING_POLICY_ACCESS` (DML), `GS_AUDITING_POLICY_PRIVILEGES` (DDL), `GS_AUDITING_POLICY_FILTERS` (filters).\n  - **Constraint (p. 224)**: A single unified audit policy **cannot contain both DDL (`PRIVILEGES`) and DML (`ACCESS`) operations**! Max **98** unified audit policies.\n- **Transparent Data Encryption (TDE, pp. 225–226)**:\n  - Encrypts data automatically when writing to storage media and decrypts when reading, preventing static data file leakage.\n  - **3-Layer Key Hierarchy (interconnected with Huawei Cloud KMS)**: **Root Key (`RK`)** -> **Cluster Master Key (`CMK`)** -> **Data Encryption Key (`DEK`, one per table, stored in `pg_class.reloptions`)**.\n  - Supports **Heap Row-Store tables only** (does **not** support column-store, Ustore, materialized views, indexes, sequences, Xlogs, or MOTs).\n  - Algorithms: **`AES_128_CTR` (default)** or **`SM4_CTR`**. Once specified at `CREATE TABLE`, the algorithm **cannot** be changed (and an unencrypted table created without TDE cannot later be converted to an encrypted table), though **DEK key rotation** is supported.","key_takeaways":["Row-Level Security (RLS) affects ONLY `SELECT`, `UPDATE`, and `DELETE` (not `INSERT` or `MERGE`), supports up to 100 policies per table, and does not affect initial users or `SYSADMIN`.","A single Unified Audit Policy (`CREATE AUDIT POLICY`) can audit either DDL (`PRIVILEGES`) or DML (`ACCESS`), but CANNOT contain both DDL and DML operations in the same policy.","TDE uses a 3-layer key hierarchy (RK -> CMK -> DEK via KMS) with `AES_128_CTR` (default) or `SM4_CTR` on heap row-store tables only."],"exam_traps":["EXAM TRAP: Can a single Unified Audit Policy contain both `PRIVILEGES CREATE` (DDL) and `ACCESS SELECT` (DML)? NO! A unified audit policy applies to either DDL or DML, never both (Ch.03 p. 224).","EXAM TRAP: If a table is created without TDE enabled, it CANNOT later be switched to an encrypted table (only tables created with encryption can toggle encryption state or rotate DEKs, Ch.03 p. 225)."],"content_html":"<h3>1. Access Control: RBAC &amp; Separation of Duties (pp. 209–212)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Separation of Duties (3 Admin Roles, p. 209)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Security Administrator (<code class=\"inline-code\">CREATEROLE<\/code>)<\/strong>: Creates and manages users.<\/li>\n<li><strong>System Administrator (<code class=\"inline-code\">SYSADMIN<\/code>)<\/strong>: Grants and revokes user permissions.<\/li>\n<li><strong>Audit Administrator (<code class=\"inline-code\">AUDITADMIN<\/code>)<\/strong>: Audits all user behaviors.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>RBAC (Role-Based Access Control)<\/strong>:<\/li>\n<li>Defines relationships among <strong>Who<\/strong> (subject/user/role), <strong>What<\/strong> (target database object), and <strong>How<\/strong> (specific positive/negative permission).<\/li>\n<li>Supports many-to-many mappings (users &lt;-&gt; roles &lt;-&gt; permissions) and enforces the <strong>principle of least privilege<\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h4s2_rbac_model.png\" alt=\"Role-Based Access Control (RBAC) User-Role-Permission Mapping\" data-caption=\"Role-Based Access Control (RBAC) User-Role-Permission Mapping (Official Reference: p. 210)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Role-Based Access Control (RBAC) User-Role-Permission Mapping<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 210 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Row-Level Security (RLS, pp. 213–215)<\/h3>\n<p>Controls data visibility <strong>row by row<\/strong> so different users executing the exact same SQL statement see only the rows permitted by policy expressions (<code class=\"inline-code\">PERMISSIVE<\/code> combined via <code class=\"inline-code\">OR<\/code>, or <code class=\"inline-code\">RESTRICTIVE<\/code> combined via <code class=\"inline-code\">AND<\/code>):<\/p>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>ALTER TABLE tablename ENABLE ROW LEVEL SECURITY;\nCREATE ROW LEVEL SECURITY POLICY tablename_rls ON tablename USING(role = CURRENT_USER);<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>RLS Constraints (p. 215)<\/strong>:<\/li>\n<li>Applies <strong>ONLY to <code class=\"inline-code\">SELECT<\/code>, <code class=\"inline-code\">UPDATE<\/code>, and <code class=\"inline-code\">DELETE<\/code><\/strong> operations (<strong>cannot<\/strong> be applied to <code class=\"inline-code\">INSERT<\/code> or <code class=\"inline-code\">MERGE<\/code>!).<\/li>\n<li>Cannot be defined on <strong>views<\/strong>, <strong>foreign tables (MOT)<\/strong>, or <strong>temporary tables<\/strong>.<\/li>\n<li>Maximum of <strong>100 RLS policies<\/strong> per table.<\/li>\n<li><strong>Initial users and <code class=\"inline-code\">SYSADMIN<\/code> users bypass (are not affected by) RLS policies.<\/strong><\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Unified Auditing &amp; Transparent Data Encryption (TDE, pp. 216–226)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Unified Auditing (pp. 217–224)<\/strong>:<\/li>\n<li>Requires <code class=\"inline-code\">enable_security_policy = on<\/code> and user with <strong><code class=\"inline-code\">POLADMIN<\/code><\/strong>, <strong><code class=\"inline-code\">SYSADMIN<\/code><\/strong>, or <strong>initial user<\/strong> privileges; logs via OS <strong><code class=\"inline-code\">rsyslog<\/code><\/strong>.<\/li>\n<li><strong>Syntax<\/strong>:<\/li>\n<\/ul>\n<div class=\"code-block\"><div class=\"code-header\"><span>SQL<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>    CREATE RESOURCE LABEL adt_lb0 ADD TABLE(tb_for_audit);\n    -- DDL audit policy (PRIVILEGES)\n    CREATE AUDIT POLICY adt3 PRIVILEGES CREATE ON LABEL(adt_lb0)
