  <script>
    const PILLAR = {"id":"pillar3","folder_name":"03-HCIA-openGauss-V2.0","title":"HCIA-openGauss V2.0 (Enterprise Relational Database & GaussDB)","subtitle":"Huawei ICT Competition National Stage — Computing Track Pillar 3","pdf_source":"HCIA-openGauss V2.0 Training Material.pdf","total_hours":9,"lesson_hours":8,"mock_exam_hours":1,"description":"Complete 8-hour bite-sized sprint curriculum + 1-hour 60-question Final Mock Exam covering openGauss Database Fundamentals, Installation & O&M Tools (gs_om, gs_guc, gs_ctl, gs_check, gs_checkos, gs_checkperf, gs_dump/gs_restore, gsql), Instance & Resource Pooling Architecture (DMS/DSS), High Performance (CBO/ABO, Row/Column/MOT, Partitioning, Kunpeng NUMA, SMP), High Security (Fully-Encrypted DB, Dynamic Masking, RBAC, RLS, Unified Auditing, TDE), Easy O&M (WDR, Slow SQL) & AI (DBMind: X-Tuner, SQLdiag, Index-advisor, DeepSQL/DB4AI), Object Management, SQL (DQL/DML/DDL/DCL, Functions, Sequences), and Enterprise Distributed GaussDB (CN/DN/GTM/CMS/ETCD, UGO/DRS/DAS).","hours":[{"hour_number":1,"folder_name":"Hour-01-openGauss-Overview-and-Database-Fundamentals","title":"openGauss Overview & Database Fundamentals","chapter_ref":"Chapter 01 (pp. 1–72)","duration_mins":60,"overview":"Master the foundational concepts of databases (Data, DB, DBMS, DBS), trace the three stages of data management evolution and classical data models, evaluate ACID transaction semantics and multi-node database architectures, and understand openGauss positioning, architectural advantages over PostgreSQL, technical specifications, and client APIs.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Data-Management-Evolution-DBS-and-Data-Models","exercise_slug":"02-Exercise-DBS-Components-and-Data-Models-Lab","lecture":{"title":"Data Management Evolution, DBS Components & Classical Data Models","duration_mins":7,"pdf_ref":"Ch.01, pp. 4–19","objectives":["Distinguish Data, Database (DB), Database Management System (DBMS), and Database System (DBS)","Compare the 3 stages of data management technology development: Manual Management, File System, and DBS","Contrast Hierarchical, Network, and Relational database models and trace SQL standardization history"],"content_markdown":"### 1. Core Concepts: Data, DB, DBMS, and DBS\n- **Data**: Facts or statistics represented as discrete **digital data** (symbols, characters, numerals) or continuous **analog data** (audio, video, images). Raw data is meaningless until processed into **information**.\n- **Database (DB)**: A **permanent**, **organized**, and **sharable** collection of structured data stored in a computer according to a data model with minimal redundancy and high independence.\n- **Database Management System (DBMS)**: System software between the user/application and OS that manages the DB. Its 5 core functions are:\n  1. **Data Definition (DDL)** — defining tables, views, indexes, and schemas.\n  2. **Data Manipulation (DML)** — querying, inserting, deleting, and updating data.\n  3. **Database Operation Management** — ensuring security, integrity checks, concurrency control, and fault recovery.\n  4. **Interfaces & Tools** — APIs for developers and O&M tools for DBAs.\n  5. **Creation & Maintenance** — initial data conversion, dump/restore, and performance monitoring.\n- **Database System (DBS)**: The complete operational ecosystem. Per Huawei's official definition (p. 9), **a DBS consists of three core parts**:\n  1. **Database (DB)** — stores data.\n  2. **DBMS** — manages the database.\n  3. **Database Applications** — supplement the DBMS to provide intuitive user-facing data processing (along with DBAs and users).\n<!-- PDF_FIGS_START -->\n![Database System (DBS) Component Stack Diagram (Official Reference: p. 9)](./assets/images/p3_h1s1_dbs_components.png)\n*Figure: Database System (DBS) Component Stack Diagram (Official Reference: p. 9)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Three Stages of Data Management Technology Development\n\n| Dimension | 1. Manual Management (Mid-1950s) | 2. File System (Late 1950s – Mid-1960s) | 3. DBS Stage (Late 1960s – Present) |\n| :--- | :--- | :--- | :--- |\n| **Application** | Scientific computing | Scientific computing & management | Large-scale & distributed data management |\n| **Hardware** | Paper tapes, punch cards (no direct access storage) | Magnetic tapes, disks, magnetic drums | Large-capacity disks, arrays, on-demand expansion |\n| **Software / Manager** | None (managed by User/Program) | File System | **DBMS / DBS** |\n| **Data Sharing** | No sharing; high redundancy | Poor sharing; high redundancy | **Good sharing; low redundancy** |\n| **Data Independence** | Poor (program-bound) | Good physical independence; poor logical independence | **High physical & good logical independence** |\n| **Data Structuring** | Unstructured | Structured inside a record; unstructured as a whole | **Unified data model & overall structuring** |\n<!-- PDF_FIGS_START -->\n![Three Stages of Data Management Development (Official Reference: p. 10)](./assets/images/p3_h1s1_data_mgmt_stages.png)\n*Figure: Three Stages of Data Management Development (Official Reference: p. 10)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 3. Classical Database Models & SQL Evolution\n- **Hierarchical Model (1960s, e.g., IBM IMS, DNS, LDAP, Linux/Windows FS)**: Tree structure where only the **root node** has no parent, and every other node has **exactly one parent node** (1:N).\n- **Network Model**: Graph structure allowing **more than one node to have no parent**, and a node can have **more than one parent** (M:N).\n- **Relational Model (1969/1970, E.F. Codd)**: Uses rigorous two-dimensional tables (**Relations**) composed of rows (**Tuples**), columns (**Attributes**), and primary identifiers (**Keys / Codes**). Relationships must be normalized so every attribute is an indivisible atomic data item.\n- **SQL Standardization Milestones**:\n  - **SQL-86 (1986)**: First ANSI SQL standard.\n  - **SQL-89 (1989)**: Added integrity constraints.\n  - **SQL-92 / SQL2 (1992)**: Introduced standard classification concepts.\n  - **SQL:1999 / SQL3 (1999)**: Major revision adding object-oriented features, regular expressions, triggers, and recursive queries.\n  - **SQL:2003**: XML & Window functions; **SQL:2008**: `TRUNCATE`; **SQL:2011**: Temporal/time-series; **SQL:2016**: JSON.\n<!-- PDF_FIGS_START -->\n![Hierarchical (Tree), Network (Graph), and Relational Models (Official Reference: p. 18)](./assets/images/p3_h1s1_database_models.png)\n*Figure: Hierarchical (Tree), Network (Graph), and Relational Models (Official Reference: p. 18)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["A Database System (DBS) consists of three parts: Database (DB), DBMS, and Database Application (storage medium is hardware, NOT one of the three logical DBS components in Ch.01 Quiz Q1).","Data management evolved through exactly three stages: Manual Management, File System, and Database System (DBS).","In the relational model, each cell must be an indivisible data item; in the hierarchical model, every non-root node has only one parent; in the network model, a node can have multiple parents."],"exam_traps":["EXAM TRAP (Ch.01 Quiz Q1): 'Which of the following is NOT a component of a database system?' -> D. Database storage medium! The three components are Database, DBMS, and Database application.","EXAM TRAP (Ch.01 Quiz Q3): 'Which phases are involved in the development of data management technologies?' -> A. Manual management, B. File system, C. DBS (ABC). 'AI management' (D) is NOT one of the three historical stages!"],"content_html":"<h3>1. Core Concepts: Data, DB, DBMS, and DBS<\/h3>\n<ul class=\"md-list\">\n<li><strong>Data<\/strong>: Facts or statistics represented as discrete <strong>digital data<\/strong> (symbols, characters, numerals) or continuous <strong>analog data<\/strong> (audio, video, images). Raw data is meaningless until processed into <strong>information<\/strong>.<\/li>\n<li><strong>Database (DB)<\/strong>: A <strong>permanent<\/strong>, <strong>organized<\/strong>, and <strong>sharable<\/strong> collection of structured data stored in a computer according to a data model with minimal redundancy and high independence.<\/li>\n<li><strong>Database Management System (DBMS)<\/strong>: System software between the user/application and OS that manages the DB. Its 5 core functions are:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Data Definition (DDL)<\/strong> — defining tables, views, indexes, and schemas.<\/li>\n<li><strong>Data Manipulation (DML)<\/strong> — querying, inserting, deleting, and updating data.<\/li>\n<li><strong>Database Operation Management<\/strong> — ensuring security, integrity checks, concurrency control, and fault recovery.<\/li>\n<li><strong>Interfaces &amp; Tools<\/strong> — APIs for developers and O&amp;M tools for DBAs.<\/li>\n<li><strong>Creation &amp; Maintenance<\/strong> — initial data conversion, dump/restore, and performance monitoring.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Database System (DBS)<\/strong>: The complete operational ecosystem. Per Huawei's official definition (p. 9), <strong>a DBS consists of three core parts<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Database (DB)<\/strong> — stores data.<\/li>\n<li><strong>DBMS<\/strong> — manages the database.<\/li>\n<li><strong>Database Applications<\/strong> — supplement the DBMS to provide intuitive user-facing data processing (along with DBAs and users).<\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s1_dbs_components.png\" alt=\"Database System (DBS) Component Stack Diagram\" data-caption=\"Database System (DBS) Component Stack Diagram (Official Reference: p. 9)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Database System (DBS) Component Stack Diagram<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 9 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Three Stages of Data Management Technology Development<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Dimension<\/th><th>1. Manual Management (Mid-1950s)<\/th><th>2. File System (Late 1950s – Mid-1960s)<\/th><th>3. DBS Stage (Late 1960s – Present)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Application<\/strong><\/td><td>Scientific computing<\/td><td>Scientific computing &amp; management<\/td><td>Large-scale &amp; distributed data management<\/td><\/tr>\n<tr><td><strong>Hardware<\/strong><\/td><td>Paper tapes, punch cards (no direct access storage)<\/td><td>Magnetic tapes, disks, magnetic drums<\/td><td>Large-capacity disks, arrays, on-demand expansion<\/td><\/tr>\n<tr><td><strong>Software / Manager<\/strong><\/td><td>None (managed by User/Program)<\/td><td>File System<\/td><td><strong>DBMS / DBS<\/strong><\/td><\/tr>\n<tr><td><strong>Data Sharing<\/strong><\/td><td>No sharing; high redundancy<\/td><td>Poor sharing; high redundancy<\/td><td><strong>Good sharing; low redundancy<\/strong><\/td><\/tr>\n<tr><td><strong>Data Independence<\/strong><\/td><td>Poor (program-bound)<\/td><td>Good physical independence; poor logical independence<\/td><td><strong>High physical &amp; good logical independence<\/strong><\/td><\/tr>\n<tr><td><strong>Data Structuring<\/strong><\/td><td>Unstructured<\/td><td>Structured inside a record; unstructured as a whole<\/td><td><strong>Unified data model &amp; overall structuring<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s1_data_mgmt_stages.png\" alt=\"Three Stages of Data Management Development\" data-caption=\"Three Stages of Data Management Development (Official Reference: p. 10)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Three Stages of Data Management Development<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 10 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>3. Classical Database Models &amp; SQL Evolution<\/h3>\n<ul class=\"md-list\">\n<li><strong>Hierarchical Model (1960s, e.g., IBM IMS, DNS, LDAP, Linux/Windows FS)<\/strong>: Tree structure where only the <strong>root node<\/strong> has no parent, and every other node has <strong>exactly one parent node<\/strong> (1:N).<\/li>\n<li><strong>Network Model<\/strong>: Graph structure allowing <strong>more than one node to have no parent<\/strong>, and a node can have <strong>more than one parent<\/strong> (M:N).<\/li>\n<li><strong>Relational Model (1969/1970, E.F. Codd)<\/strong>: Uses rigorous two-dimensional tables (<strong>Relations<\/strong>) composed of rows (<strong>Tuples<\/strong>), columns (<strong>Attributes<\/strong>), and primary identifiers (<strong>Keys / Codes<\/strong>). Relationships must be normalized so every attribute is an indivisible atomic data item.<\/li>\n<li><strong>SQL Standardization Milestones<\/strong>:<\/li>\n<li><strong>SQL-86 (1986)<\/strong>: First ANSI SQL standard.<\/li>\n<li><strong>SQL-89 (1989)<\/strong>: Added integrity constraints.<\/li>\n<li><strong>SQL-92 / SQL2 (1992)<\/strong>: Introduced standard classification concepts.<\/li>\n<li><strong>SQL:1999 / SQL3 (1999)<\/strong>: Major revision adding object-oriented features, regular expressions, triggers, and recursive queries.<\/li>\n<li><strong>SQL:2003<\/strong>: XML &amp; Window functions; <strong>SQL:2008<\/strong>: <code class=\"inline-code\">TRUNCATE<\/code>; <strong>SQL:2011<\/strong>: Temporal/time-series; <strong>SQL:2016<\/strong>: JSON.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s1_database_models.png\" alt=\"Hierarchical (Tree), Network (Graph), and Relational Models\" data-caption=\"Hierarchical (Tree), Network (Graph), and Relational Models (Official Reference: p. 18)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Hierarchical (Tree), Network (Graph), and Relational Models<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 18 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Auditing DBS Components, Data Management Stages & Models","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"You are onboarding junior DBAs onto an openGauss environment. Create a reference relational table `dbs_audit` that models a normalized relational structure (with indivisible attributes) and records the three historical data management stages and their characteristics.","instructions":["Step 1: Write a `CREATE TABLE dbs_audit` statement with columns `stage_id INT PRIMARY KEY`, `stage_name VARCHAR(30)`, `manager VARCHAR(20)`, and `independence VARCHAR(40)`.","Step 2: Insert the three official stages (`'Manual management'`, `'File system'`, and `'DBS'`) using `INSERT INTO dbs_audit VALUES ...`.","Step 3: Query all records ordered by `stage_id ASC` using `SELECT * FROM dbs_audit ORDER BY stage_id;`."],"starter_code":"-- Step 1: Create the normalized relational table dbs_audit\nCREATE TABLE dbs_audit (\n    stage_id INT PRIMARY KEY,\n    stage_name VARCHAR(30),\n    manager VARCHAR(20),\n    independence VARCHAR(40)\n);\n\n-- Step 2: Complete the INSERT statement with the 3 official stages\nINSERT INTO dbs_audit VALUES\n    (1, '____', 'User/Program', 'Poor'),\n    (2, '____', 'File system', 'Physical only'),\n    (3, '____', 'DBMS', 'Physical and Logical');\n\n-- Step 3: Query the table\n____ * FROM dbs_audit ORDER BY stage_id;\n","solution_code":"CREATE TABLE dbs_audit (\n    stage_id INT PRIMARY KEY,\n    stage_name VARCHAR(30),\n    manager VARCHAR(20),\n    independence VARCHAR(40)\n);\n\nINSERT INTO dbs_audit VALUES\n    (1, 'Manual management', 'User/Program', 'Poor'),\n    (2, 'File system', 'File system', 'Physical only'),\n    (3, 'DBS', 'DBMS', 'Physical and Logical');\n\nSELECT * FROM dbs_audit ORDER BY stage_id;","hints":["Recall Ch.01 Quiz Q3: The three stages of data management are 'Manual management', 'File system', and 'DBS'.","Use SELECT * FROM dbs_audit ORDER BY stage_id; to retrieve the rows."],"validation_checks":[{"step":1,"description":"Define table `dbs_audit` with `CREATE TABLE`","required_any":["create table dbs_audit"],"feedback_fail":"Ensure your `CREATE TABLE dbs_audit` statement is intact."},{"step":2,"description":"Insert the three official stages: `Manual management`, `File system`, and `DBS`","required_any":["manual management"],"feedback_fail":"Include 'Manual management' as the first stage of data management."},{"step":3,"description":"Include `File system` and `DBS` stages and `SELECT` query","required_any":["file system"],"feedback_fail":"Include 'File system' and 'DBS' in your INSERT values."}],"simulated_output":"CREATE TABLE\nINSERT 0 3\n stage_id |    stage_name     |   manager    |     independence     \n----------+-------------------+--------------+----------------------\n        1 | Manual management | User/Program | Poor\n        2 | File system       | File system  | Physical only\n        3 | DBS               | DBMS         | Physical and Logical\n(3 rows)","quiz_questions":[{"id":"h1_s1_q1","type":"single","question":"(Official Ch.01 Quiz Q1) Which of the following is NOT a component of a database system (DBS)?","options":["A. Database","B. DBMS","C. Database application","D. Database storage medium"],"answer":"D","explanation":"Per Chapter 01 (p. 9 & p. 67), a DBS consists of three parts: Database, DBMS, and Database application. The database storage medium is hardware and not one of the three logical DBS components."},{"id":"h1_s1_q2","type":"multiple","question":"(Official Ch.01 Quiz Q3) Which of the following phases are involved in the development of data management technologies?","options":["A. Manual management","B. File system","C. DBS","D. AI management"],"answer":"ABC","explanation":"Per Chapter 01 (p. 10 & p. 68), data management technologies went through three stages: Manual management, File system, and DBS."},{"id":"h1_s1_q3","type":"tf","question":"In the hierarchical database model, all nodes except the root node can have multiple parent nodes.","options":["A. True","B. False"],"answer":"B","explanation":"False. In the hierarchical model, all nodes except the root node have ONLY ONE parent node. It is the network model that allows a node to have more than one parent."}],"reference_figures":[{"slug":"p3_h1s1_database_models","title":"Hierarchical (Tree), Network (Graph), and Relational Models","pdf_page":18}]}},{"sprint_number":2,"lecture_slug":"03-Lecture-Transactions-ACID-NoSQL-NewSQL-and-Architectures","exercise_slug":"04-Exercise-Transaction-ACID-and-Architecture-Lab","lecture":{"title":"Transactions (ACID), NoSQL vs NewSQL & Database Deployment Architectures","duration_mins":7,"pdf_ref":"Ch.01, pp. 20–41","objectives":["Trace the 5 transaction execution states and explain the 4 ACID properties","Compare Relational Databases, NoSQL (CAP Theorem), and NewSQL","Contrast Single-Node, Master/Backup, Master/Slave, Multi-Master, Shared-Disk, Sharding, Shared-Nothing MPP, and OLTP vs OLAP"],"content_markdown":"### 1. Database Transactions & ACID Properties\nA **transaction** is an indivisible logical unit of work used for database recovery and concurrency control.\n- **5 Transaction States (p. 21)**:\n  1. **Active**: Initial state while statements are executing.\n  2. **Partially committed**: Immediately after the final statement executes, before disk flush completes.\n  3. **Failed**: Normal execution can no longer proceed.\n  4. **Aborted**: Transaction is rolled back and database is restored to its pre-transaction state.\n  5. **Committed**: All operations succeeded and changes are permanently stored.\n- **ACID Properties (p. 22)**:\n  - **Atomicity (A)**: Either all operations in the transaction succeed or none do (all-or-nothing rollback on failure).\n  - **Consistency (C)**: A transaction transitions the database from one valid/consistent state to another (e.g., total money across accounts before and after transfer remains invariant).\n  - **Isolation (I)**: Concurrent transactions execute independently without interfering with each other or exposing uncommitted intermediate states.\n  - **Durability (D)**: Once committed, changes are permanent and survive power loss or system crashes (implemented via **WAL — Write-Ahead Logging**).\n<!-- PDF_FIGS_START -->\n![Database Transaction Execution State Machine (Active, Committed, Failed, End) (Official Reference: p. 20)](./assets/images/p3_h1s2_tx_states.png)\n*Figure: Database Transaction Execution State Machine (Active, Committed, Failed, End) (Official Reference: p. 20)*\n\n![ACID Isolation Concurrent Transactions (T1 and T2) (Official Reference: p. 22)](./assets/images/p3_h1s2_acid_isolation.png)\n*Figure: ACID Isolation Concurrent Transactions (T1 and T2) (Official Reference: p. 22)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. NoSQL (CAP Theory) vs. NewSQL\n- **NoSQL (\"Not Only SQL\")**: Designed for ultra-large-scale concurrent access without fixed schemas:\n  1. **Key-Value**: Redis, Memcached, DynamoDB.\n  2. **Document (JSON)**: MongoDB, CouchDB, Couchbase.\n  3. **Search Engine**: Elasticsearch, Solr, Splunk.\n  4. **Wide-Column / Distributed**: HBase, Cassandra.\n- **CAP Theorem**: A distributed system can satisfy at most **two** of **Consistency (C)**, **Availability (A)**, and **Partition Tolerance (P)**. Because network partitions are inevitable in distributed systems (**P is mandatory**), distributed NoSQL systems must balance between **CP** (e.g., HBase, MongoDB, Redis) and **AP** (e.g., Cassandra, Dynamo, CouchDB), whereas traditional single-site RDBMSs are **CA**.\n- **NewSQL (`SQL + NoSQL = NewSQL`)**: Combines the horizontal scalability of NoSQL with the relational model, SQL interface, and ACID transactions of RDBMS (e.g., Google Spanner, VoltDB, GaussDB).\n\n---\n\n### 3. Evolution of Relational Database Architectures & OLTP vs. OLAP\n\n| Architecture | Key Characteristics | Pros & Bottlenecks |\n| :--- | :--- | :--- |\n| **Single-Node / Standalone** | App & DB separated on standalone server | Easy O&M; limited to vertical **Scale-Up**, suffers from SPOF. |\n| **Master/Backup** | Master does R/W; Backup is idle until failover | Improves fault tolerance; wastes standby resources; single-node perf limit. |\n| **Master/Slave** | Master handles Writes; Slaves handle Reads | Read/write isolation scales reads; replication lag causes temporary inconsistency. |\n| **Multi-Master** | Active-active bidirectional R/W | High resource utilization; complex bidirectional sync and conflict resolution. |\n| **Shared-Disk** | Multiple compute nodes share SAN/FC storage (e.g., Oracle RAC) | High availability; storage I/O bus bandwidth becomes bottleneck. |\n| **Shared-Nothing / MPP** | Each node has independent CPU, RAM, and disk; horizontal **Sharding** | Near-linear **Scale-Out**, no shared bottleneck (e.g., GaussDB, DB2 DPF). |\n\n- **OLTP (Online Transaction Processing)** vs. **OLAP (Online Analytical Processing)**:\n  - **OLTP**: Routine short transactions (insert/update/delete), read/write, dozens of rows via index/hash, 100 MB–GB scale, measured by **transaction throughput (tpmC)** and memory efficiency.\n  - **OLAP**: Decision support & data warehousing, complex multi-dimensional aggregation queries, mostly reads, millions of rows via full/partition scans, 100 GB–TB+ scale, measured by **disk I/O bandwidth and query response time**.\n<!-- PDF_FIGS_START -->\n![Relational Database Deployment Architecture Taxonomy (Official Reference: p. 31)](./assets/images/p3_h1s2_arch_evolution.png)\n*Figure: Relational Database Deployment Architecture Taxonomy (Official Reference: p. 31)*\n\n![Single Node vs Standalone Database Deployment (Official Reference: p. 32)](./assets/images/p3_h1s2_single_node.png)\n*Figure: Single Node vs Standalone Database Deployment (Official Reference: p. 32)*\n\n![Grouping Deployment: Master/Backup Topology (Official Reference: p. 33)](./assets/images/p3_h1s2_master_backup.png)\n*Figure: Grouping Deployment: Master/Backup Topology (Official Reference: p. 33)*\n\n![Grouping Deployment: Master/Slave (Read/Write Split) Topology (Official Reference: p. 34)](./assets/images/p3_h1s2_master_slave.png)\n*Figure: Grouping Deployment: Master/Slave (Read/Write Split) Topology (Official Reference: p. 34)*\n\n![Grouping Deployment: Multi-Master Topology (Official Reference: p. 35)](./assets/images/p3_h1s2_multi_master.png)\n*Figure: Grouping Deployment: Multi-Master Topology (Official Reference: p. 35)*\n\n![Shared Disk Multi-Master Cluster Topology (Official Reference: p. 36)](./assets/images/p3_h1s2_shared_disk.png)\n*Figure: Shared Disk Multi-Master Cluster Topology (Official Reference: p. 36)*\n\n![Horizontal vs Vertical Database Sharding Diagram (Official Reference: p. 37)](./assets/images/p3_h1s2_sharding_split.png)\n*Figure: Horizontal vs Vertical Database Sharding Diagram (Official Reference: p. 37)*\n\n![Shared-Nothing Distributed Architecture (Official Reference: p. 38)](./assets/images/p3_h1s2_shared_nothing.png)\n*Figure: Shared-Nothing Distributed Architecture (Official Reference: p. 38)*\n\n![Massively Parallel Processing (MPP) Execution Topology (Official Reference: p. 39)](./assets/images/p3_h1s2_mpp_architecture.png)\n*Figure: Massively Parallel Processing (MPP) Execution Topology (Official Reference: p. 39)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["In ACID, 'I' stands for Isolation (concurrent transactions do not interfere), NOT Availability!","CAP Theorem states a distributed system can guarantee at most two of Consistency (C), Availability (A), and Partition Tolerance (P).","Shared-Nothing (MPP) gives each node independent CPU, memory, and disk, enabling near-linear horizontal scale-out."],"exam_traps":["EXAM TRAP (Ch.01 Quiz Q2): Option C claims 'I refers to availability, whereby the database system must provide the highest availability possible'. That is INCORRECT! 'I' stands for Isolation.","EXAM TRAP: Do not confuse Master/Backup (standby does NOT provide read services during normal operation) with Master/Slave (slave provides read services via read/write splitting)."],"content_html":"<h3>1. Database Transactions &amp; ACID Properties<\/h3>\n<p>A <strong>transaction<\/strong> is an indivisible logical unit of work used for database recovery and concurrency control.<\/p>\n<ul class=\"md-list\">\n<li><strong>5 Transaction States (p. 21)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Active<\/strong>: Initial state while statements are executing.<\/li>\n<li><strong>Partially committed<\/strong>: Immediately after the final statement executes, before disk flush completes.<\/li>\n<li><strong>Failed<\/strong>: Normal execution can no longer proceed.<\/li>\n<li><strong>Aborted<\/strong>: Transaction is rolled back and database is restored to its pre-transaction state.<\/li>\n<li><strong>Committed<\/strong>: All operations succeeded and changes are permanently stored.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>ACID Properties (p. 22)<\/strong>:<\/li>\n<li><strong>Atomicity (A)<\/strong>: Either all operations in the transaction succeed or none do (all-or-nothing rollback on failure).<\/li>\n<li><strong>Consistency (C)<\/strong>: A transaction transitions the database from one valid/consistent state to another (e.g., total money across accounts before and after transfer remains invariant).<\/li>\n<li><strong>Isolation (I)<\/strong>: Concurrent transactions execute independently without interfering with each other or exposing uncommitted intermediate states.<\/li>\n<li><strong>Durability (D)<\/strong>: Once committed, changes are permanent and survive power loss or system crashes (implemented via <strong>WAL — Write-Ahead Logging<\/strong>).<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_tx_states.png\" alt=\"Database Transaction Execution State Machine (Active, Committed, Failed, End)\" data-caption=\"Database Transaction Execution State Machine (Active, Committed, Failed, End) (Official Reference: p. 20)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Database Transaction Execution State Machine (Active, Committed, Failed, End)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 20 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_acid_isolation.png\" alt=\"ACID Isolation Concurrent Transactions (T1 and T2)\" data-caption=\"ACID Isolation Concurrent Transactions (T1 and T2) (Official Reference: p. 22)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>ACID Isolation Concurrent Transactions (T1 and T2)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 22 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. NoSQL (CAP Theory) vs. NewSQL<\/h3>\n<ul class=\"md-list\">\n<li><strong>NoSQL (\"Not Only SQL\")<\/strong>: Designed for ultra-large-scale concurrent access without fixed schemas:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Key-Value<\/strong>: Redis, Memcached, DynamoDB.<\/li>\n<li><strong>Document (JSON)<\/strong>: MongoDB, CouchDB, Couchbase.<\/li>\n<li><strong>Search Engine<\/strong>: Elasticsearch, Solr, Splunk.<\/li>\n<li><strong>Wide-Column / Distributed<\/strong>: HBase, Cassandra.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>CAP Theorem<\/strong>: A distributed system can satisfy at most <strong>two<\/strong> of <strong>Consistency (C)<\/strong>, <strong>Availability (A)<\/strong>, and <strong>Partition Tolerance (P)<\/strong>. Because network partitions are inevitable in distributed systems (<strong>P is mandatory<\/strong>), distributed NoSQL systems must balance between <strong>CP<\/strong> (e.g., HBase, MongoDB, Redis) and <strong>AP<\/strong> (e.g., Cassandra, Dynamo, CouchDB), whereas traditional single-site RDBMSs are <strong>CA<\/strong>.<\/li>\n<li><strong>NewSQL (<code class=\"inline-code\">SQL + NoSQL = NewSQL<\/code>)<\/strong>: Combines the horizontal scalability of NoSQL with the relational model, SQL interface, and ACID transactions of RDBMS (e.g., Google Spanner, VoltDB, GaussDB).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Evolution of Relational Database Architectures &amp; OLTP vs. OLAP<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Architecture<\/th><th>Key Characteristics<\/th><th>Pros &amp; Bottlenecks<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Single-Node / Standalone<\/strong><\/td><td>App &amp; DB separated on standalone server<\/td><td>Easy O&amp;M; limited to vertical <strong>Scale-Up<\/strong>, suffers from SPOF.<\/td><\/tr>\n<tr><td><strong>Master/Backup<\/strong><\/td><td>Master does R/W; Backup is idle until failover<\/td><td>Improves fault tolerance; wastes standby resources; single-node perf limit.<\/td><\/tr>\n<tr><td><strong>Master/Slave<\/strong><\/td><td>Master handles Writes; Slaves handle Reads<\/td><td>Read/write isolation scales reads; replication lag causes temporary inconsistency.<\/td><\/tr>\n<tr><td><strong>Multi-Master<\/strong><\/td><td>Active-active bidirectional R/W<\/td><td>High resource utilization; complex bidirectional sync and conflict resolution.<\/td><\/tr>\n<tr><td><strong>Shared-Disk<\/strong><\/td><td>Multiple compute nodes share SAN/FC storage (e.g., Oracle RAC)<\/td><td>High availability; storage I/O bus bandwidth becomes bottleneck.<\/td><\/tr>\n<tr><td><strong>Shared-Nothing / MPP<\/strong><\/td><td>Each node has independent CPU, RAM, and disk; horizontal <strong>Sharding<\/strong><\/td><td>Near-linear <strong>Scale-Out<\/strong>, no shared bottleneck (e.g., GaussDB, DB2 DPF).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>OLTP (Online Transaction Processing)<\/strong> vs. <strong>OLAP (Online Analytical Processing)<\/strong>:<\/li>\n<li><strong>OLTP<\/strong>: Routine short transactions (insert/update/delete), read/write, dozens of rows via index/hash, 100 MB–GB scale, measured by <strong>transaction throughput (tpmC)<\/strong> and memory efficiency.<\/li>\n<li><strong>OLAP<\/strong>: Decision support &amp; data warehousing, complex multi-dimensional aggregation queries, mostly reads, millions of rows via full/partition scans, 100 GB–TB+ scale, measured by <strong>disk I/O bandwidth and query response time<\/strong>.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_arch_evolution.png\" alt=\"Relational Database Deployment Architecture Taxonomy\" data-caption=\"Relational Database Deployment Architecture Taxonomy (Official Reference: p. 31)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Relational Database Deployment Architecture Taxonomy<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 31 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_single_node.png\" alt=\"Single Node vs Standalone Database Deployment\" data-caption=\"Single Node vs Standalone Database Deployment (Official Reference: p. 32)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Single Node vs Standalone Database Deployment<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 32 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_master_backup.png\" alt=\"Grouping Deployment: Master/Backup Topology\" data-caption=\"Grouping Deployment: Master/Backup Topology (Official Reference: p. 33)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Grouping Deployment: Master/Backup Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 33 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_master_slave.png\" alt=\"Grouping Deployment: Master/Slave (Read/Write Split) Topology\" data-caption=\"Grouping Deployment: Master/Slave (Read/Write Split) Topology (Official Reference: p. 34)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Grouping Deployment: Master/Slave (Read/Write Split) Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 34 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_multi_master.png\" alt=\"Grouping Deployment: Multi-Master Topology\" data-caption=\"Grouping Deployment: Multi-Master Topology (Official Reference: p. 35)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Grouping Deployment: Multi-Master Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 35 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_shared_disk.png\" alt=\"Shared Disk Multi-Master Cluster Topology\" data-caption=\"Shared Disk Multi-Master Cluster Topology (Official Reference: p. 36)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Shared Disk Multi-Master Cluster Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 36 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_sharding_split.png\" alt=\"Horizontal vs Vertical Database Sharding Diagram\" data-caption=\"Horizontal vs Vertical Database Sharding Diagram (Official Reference: p. 37)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Horizontal vs Vertical Database Sharding Diagram<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 37 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_shared_nothing.png\" alt=\"Shared-Nothing Distributed Architecture\" data-caption=\"Shared-Nothing Distributed Architecture (Official Reference: p. 38)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Shared-Nothing Distributed Architecture<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 38 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s2_mpp_architecture.png\" alt=\"Massively Parallel Processing (MPP) Execution Topology\" data-caption=\"Massively Parallel Processing (MPP) Execution Topology (Official Reference: p. 39)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Massively Parallel Processing (MPP) Execution Topology<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 39 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Simulating Bank Transfer ACID Transactions in openGauss","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"Implement the Chapter 01 (p. 62) bank transfer scenario where Zhang (Account 1, balance 500) starts transferring 200 to Wang (Account 2, balance 100) but cancels (`ROLLBACK`), while Li (Account 3, balance 600) transfers 300 to Wang and commits (`COMMIT`).","instructions":["Step 1: Start a transaction with `START TRANSACTION;`, deduct 200 from Zhang (`id = 1`), add 200 to Wang (`id = 2`), and then cancel the transaction with `ROLLBACK;`.","Step 2: Start a second transaction with `START TRANSACTION;`, deduct 300 from Li (`id = 3`), add 300 to Wang (`id = 2`), and permanently save it with `COMMIT;`.","Step 3: Query `SELECT id, holder, balance FROM accounts ORDER BY id;` to verify Wang's final balance is 400."],"starter_code":"-- Zhang's canceled transfer (Atomicity rollback)\nSTART TRANSACTION;\nUPDATE accounts SET balance = balance - 200 WHERE id = 1;\nUPDATE accounts SET balance = balance + 200 WHERE id = 2;\n____;\n\n-- Li's completed transfer (Atomicity, Consistency, Durability)\nSTART TRANSACTION;\nUPDATE accounts SET balance = balance - 300 WHERE id = 3;\nUPDATE accounts SET balance = balance + 300 WHERE id = 2;\n____;\n\nSELECT id, holder, balance FROM accounts ORDER BY id;\n","solution_code":"START TRANSACTION;\nUPDATE accounts SET balance = balance - 200 WHERE id = 1;\nUPDATE accounts SET balance = balance + 200 WHERE id = 2;\nROLLBACK;\n\nSTART TRANSACTION;\nUPDATE accounts SET balance = balance - 300 WHERE id = 3;\nUPDATE accounts SET balance = balance + 300 WHERE id = 2;\nCOMMIT;\n\nSELECT id, holder, balance FROM accounts ORDER BY id;","hints":["Use ROLLBACK; to abort Zhang's transfer and restore Wang's balance to 100.","Use COMMIT; to permanently persist Li's transfer of 300 so Wang's balance becomes 400."],"validation_checks":[{"step":1,"description":"Use `ROLLBACK` to cancel Zhang's uncommitted transaction","required_any":["rollback"],"feedback_fail":"Make sure you include `ROLLBACK;` at the end of Zhang's transaction."},{"step":2,"description":"Use `COMMIT` to persist Li's transfer transaction","required_any":["commit"],"feedback_fail":"Make sure you include `COMMIT;` at the end of Li's transaction."},{"step":3,"description":"Query the final account balances","required_any":["select id, holder, balance from accounts"],"feedback_fail":"Keep the final `SELECT id, holder, balance FROM accounts` statement."}],"simulated_output":"START TRANSACTION\nUPDATE 1\nUPDATE 1\nROLLBACK\nSTART TRANSACTION\nUPDATE 1\nUPDATE 1\nCOMMIT\n id | holder | balance \n----+--------+---------\n  1 | Zhang  |     500\n  2 | Wang   |     400\n  3 | Li     |     300\n(3 rows)","quiz_questions":[{"id":"h1_s2_q1","type":"single","question":"(Official Ch.01 Quiz Q2) Which of the following statements about the ACID feature of database transactions is INCORRECT?","options":["A. A indicates atomicity, whereby operations in a transaction are either all successful or all failed.","B. C refers to consistency, whereby the system status can only be the status before the transaction or after the transaction is successful. No inconsistent intermediate status can occur.","C. I refers to availability, whereby the database system must provide the highest availability possible for transaction execution in order to ensure as many successfully executed transactions as possible.","D. D refers to durability, whereby the status of a successful transaction can be maintained, even if the machine is powered off."],"answer":"C","explanation":"In ACID, 'I' stands for Isolation (transactions are isolated from each other and do not interfere when executed concurrently), NOT Availability."},{"id":"h1_s2_q2","type":"single","question":"In which multi-node database architecture does each processing unit have its own independent CPU, memory, and hard disk without sharing hardware resources?","options":["A. Shared-Everything","B. Shared-Disk (e.g., Oracle RAC)","C. Shared-Nothing / MPP","D. Single-Host Standalone"],"answer":"C","explanation":"In Shared-Nothing (and MPP) architecture, each node has its own private CPU, memory, and disk, communicating via network protocols for horizontal scale-out."},{"id":"h1_s2_q3","type":"tf","question":"According to the CAP theory for distributed systems, a distributed database can simultaneously satisfy Consistency (C), Availability (A), and Partition Tolerance (P) at all times.","options":["A. True","B. False"],"answer":"B","explanation":"False. CAP theory states that a distributed system can satisfy at most TWO of Consistency (C), Availability (A), and Partition Tolerance (P) at the same time."}],"reference_figures":[{"slug":"p3_h1s2_sharding_split","title":"Horizontal vs Vertical Database Sharding Diagram","pdf_page":37}]}},{"sprint_number":3,"lecture_slug":"05-Lecture-openGauss-Positioning-Evolution-and-PG-Comparison","exercise_slug":"06-Exercise-openGauss-vs-PostgreSQL-Architecture-Lab","lecture":{"title":"openGauss Positioning, Evolution & Differences from PostgreSQL","duration_mins":7,"pdf_ref":"Ch.01, pp. 42–50","objectives":["Trace openGauss's evolution from internal incubation (2001) to open-source release (June 30, 2020) under Mulan PSL v2","Explain the 4 core value pillars of openGauss: High Performance, High Availability, High Security, and Easy O&M","Contrast openGauss and PostgreSQL across process/thread model, concurrency control, checkpoints, NUMA, and storage engines"],"content_markdown":"### 1. openGauss Positioning, License & Evolution Timeline\n**openGauss** is an enterprise-grade, multi-core-optimized open-source relational database developed by Huawei with global partners.\n- **Open-Source License**: Released under **Mulan Permissive Software License v2 (Mulan PSL v2)** — allowing code to be freely modified, used, and referenced commercially.\n- **4 Milestones in openGauss History (p. 44)**:\n  1. **2001–2011 (Internal Incubation)**: Enterprise in-memory database used across Huawei telecom carrier products.\n  2. **2011–2019 (Productization & Joint Innovation)**: Commercialized on HUAWEI CLOUD DWS and major banks; **GaussDB globally released on May 15, 2019**; openGauss open-source announced on **September 19, 2019**.\n  3. **June 30, 2020 (Official Open Source)**: Source code officially opened at `https://gitee.com/opengauss`.\n  4. **2021–Future (Ecosystem Building)**: Community governance via Technical Committee (**TC**), **SIGs** (SQL Engine, Storage Engine, Connectors, Docs, Infra, Security), **Maintainers**, **Committers**, and **Contributors**.\n\n---\n\n### 2. Core Value Pillars of openGauss (p. 46)\n1. **High Performance**: **1.5 million tpmC** on 2-socket Kunpeng 920 (128 cores); NUMA-aware data structures; **SQL-Bypass** intelligent fast path; in-memory **MOT** engine.\n2. **High Availability (HA)**: Hitless primary/standby switchover and Parallel Redo **Ultimate RTO < 10s**.\n3. **High Security**: End-to-end protection including **Fully-Encrypted Equality Query** (TEE/secGear), Dynamic Data Masking, RBAC, RLS, Unified Auditing, and TDE.\n4. **Easy O&M**: Built-in **DBMind AI** (parameter tuning, slow SQL diagnosis, index recommendation, workload time prediction) and WDR snapshots.\n\n---\n\n### 3. Architectural Comparison: openGauss vs. PostgreSQL (pp. 48–49)\n\n| Differentiation Dimension | openGauss | PostgreSQL |\n| :--- | :--- | :--- |\n| **Execution Model** | **Single-process multi-threaded (`gaussdb`)** with thread pool | **Multi-process (`postgres`)** — one process per client connection |\n| **Transaction ID & Concurrency** | **64-bit Transaction ID (XID)** + **CSN (Commit Sequence Number)**; eliminates XID wraparound & resolves the \"five big locks\" bottleneck | 32-bit XID wraparound causes periodic VACUUM FREEZE performance drops; \"five big locks\" limit multi-core scaling |\n| **Logs & Checkpoints** | **Incremental checkpoint**, keeping performance fluctuation **< 5%** | **Full checkpoint**, causing short-term performance fluctuation **> 15%** |\n| **Kunpeng NUMA Scaling** | NUMA data structure reconstruction, cache-line padding, ARMv8.1 native `casal` spin-lock (**1.5M tpmC** on 2-socket Kunpeng) | Weak NUMA multi-core capability (**< 600,000 tpmC** on dual-socket server) |\n| **Storage Engines** | **Multi-engine**: Row-store (Astore/Ustore in-place update), Column-store, and **MOT (Memory-Optimized Table)** | **Row-store only** (append-only MVCC) |\n| **Optimizer & SQL** | CBO + **ABO (AI-Based Optimizer)**; SQL92/99/2003/2011 + enterprise extensions | Standard CBO; average performance in complex enterprise queries |\n<!-- PDF_FIGS_START -->\n![openGauss Thread Pool Architecture vs PostgreSQL Multi-Process Architecture (Official Reference: p. 48)](./assets/images/p3_h1s3_opengauss_vs_pg.png)\n*Figure: openGauss Thread Pool Architecture vs PostgreSQL Multi-Process Architecture (Official Reference: p. 48)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["openGauss uses a single-process multi-threaded architecture (`gaussdb`), whereas PostgreSQL uses a multi-process architecture.","openGauss uses 64-bit transaction IDs with Commit Sequence Numbers (CSNs) and incremental checkpoints (< 5% fluctuation), solving PostgreSQL's 32-bit XID wraparound and full checkpoint (> 15% fluctuation) bottlenecks.","openGauss officially went open source on June 30, 2020 under the Mulan PSL v2 license."],"exam_traps":["EXAM TRAP: PostgreSQL supports only row-store natively, whereas openGauss supports Row-store, Column-store, and Memory-Optimized Table (MOT) engines.","EXAM TRAP: On 2-socket Kunpeng 920 (128 cores), openGauss achieves 1.5 million tpmC (1.5x higher than x86 alternatives), with RTO < 10s."],"content_html":"<h3>1. openGauss Positioning, License &amp; Evolution Timeline<\/h3>\n<p><strong>openGauss<\/strong> is an enterprise-grade, multi-core-optimized open-source relational database developed by Huawei with global partners.<\/p>\n<ul class=\"md-list\">\n<li><strong>Open-Source License<\/strong>: Released under <strong>Mulan Permissive Software License v2 (Mulan PSL v2)<\/strong> — allowing code to be freely modified, used, and referenced commercially.<\/li>\n<li><strong>4 Milestones in openGauss History (p. 44)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>2001–2011 (Internal Incubation)<\/strong>: Enterprise in-memory database used across Huawei telecom carrier products.<\/li>\n<li><strong>2011–2019 (Productization &amp; Joint Innovation)<\/strong>: Commercialized on HUAWEI CLOUD DWS and major banks; <strong>GaussDB globally released on May 15, 2019<\/strong>; openGauss open-source announced on <strong>September 19, 2019<\/strong>.<\/li>\n<li><strong>June 30, 2020 (Official Open Source)<\/strong>: Source code officially opened at <code class=\"inline-code\">https://gitee.com/opengauss<\/code>.<\/li>\n<li><strong>2021–Future (Ecosystem Building)<\/strong>: Community governance via Technical Committee (<strong>TC<\/strong>), <strong>SIGs<\/strong> (SQL Engine, Storage Engine, Connectors, Docs, Infra, Security), <strong>Maintainers<\/strong>, <strong>Committers<\/strong>, and <strong>Contributors<\/strong>.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Core Value Pillars of openGauss (p. 46)<\/h3>\n<ol class=\"md-list\">\n<li><strong>High Performance<\/strong>: <strong>1.5 million tpmC<\/strong> on 2-socket Kunpeng 920 (128 cores); NUMA-aware data structures; <strong>SQL-Bypass<\/strong> intelligent fast path; in-memory <strong>MOT<\/strong> engine.<\/li>\n<li><strong>High Availability (HA)<\/strong>: Hitless primary/standby switchover and Parallel Redo <strong>Ultimate RTO &lt; 10s<\/strong>.<\/li>\n<li><strong>High Security<\/strong>: End-to-end protection including <strong>Fully-Encrypted Equality Query<\/strong> (TEE/secGear), Dynamic Data Masking, RBAC, RLS, Unified Auditing, and TDE.<\/li>\n<li><strong>Easy O&amp;M<\/strong>: Built-in <strong>DBMind AI<\/strong> (parameter tuning, slow SQL diagnosis, index recommendation, workload time prediction) and WDR snapshots.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. Architectural Comparison: openGauss vs. PostgreSQL (pp. 48–49)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Differentiation Dimension<\/th><th>openGauss<\/th><th>PostgreSQL<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Execution Model<\/strong><\/td><td><strong>Single-process multi-threaded (<code class=\"inline-code\">gaussdb<\/code>)<\/strong> with thread pool<\/td><td><strong>Multi-process (<code class=\"inline-code\">postgres<\/code>)<\/strong> — one process per client connection<\/td><\/tr>\n<tr><td><strong>Transaction ID &amp; Concurrency<\/strong><\/td><td><strong>64-bit Transaction ID (XID)<\/strong> + <strong>CSN (Commit Sequence Number)<\/strong>; eliminates XID wraparound &amp; resolves the \"five big locks\" bottleneck<\/td><td>32-bit XID wraparound causes periodic VACUUM FREEZE performance drops; \"five big locks\" limit multi-core scaling<\/td><\/tr>\n<tr><td><strong>Logs &amp; Checkpoints<\/strong><\/td><td><strong>Incremental checkpoint<\/strong>, keeping performance fluctuation <strong>&lt; 5%<\/strong><\/td><td><strong>Full checkpoint<\/strong>, causing short-term performance fluctuation <strong>&gt; 15%<\/strong><\/td><\/tr>\n<tr><td><strong>Kunpeng NUMA Scaling<\/strong><\/td><td>NUMA data structure reconstruction, cache-line padding, ARMv8.1 native <code class=\"inline-code\">casal<\/code> spin-lock (<strong>1.5M tpmC<\/strong> on 2-socket Kunpeng)<\/td><td>Weak NUMA multi-core capability (<strong>&lt; 600,000 tpmC<\/strong> on dual-socket server)<\/td><\/tr>\n<tr><td><strong>Storage Engines<\/strong><\/td><td><strong>Multi-engine<\/strong>: Row-store (Astore/Ustore in-place update), Column-store, and <strong>MOT (Memory-Optimized Table)<\/strong><\/td><td><strong>Row-store only<\/strong> (append-only MVCC)<\/td><\/tr>\n<tr><td><strong>Optimizer &amp; SQL<\/strong><\/td><td>CBO + <strong>ABO (AI-Based Optimizer)<\/strong>; SQL92/99/2003/2011 + enterprise extensions<\/td><td>Standard CBO; average performance in complex enterprise queries<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s3_opengauss_vs_pg.png\" alt=\"openGauss Thread Pool Architecture vs PostgreSQL Multi-Process Architecture\" data-caption=\"openGauss Thread Pool Architecture vs PostgreSQL Multi-Process Architecture (Official Reference: p. 48)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Thread Pool Architecture vs PostgreSQL Multi-Process Architecture<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 48 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Inspecting the Multi-Threaded `gaussdb` Process & Kernel Version","duration_mins":8,"exercise_type":"terminal","prompt_label":"omm@opengauss:~","scenario":"Verify that openGauss runs as a single `gaussdb` process with multiple worker and background threads (unlike PostgreSQL's multi-process model) and check the openGauss version and incremental checkpoint setting.","instructions":["Step 1: Use `ps ux | grep gaussdb` to view the running `gaussdb` master process.","Step 2: Use `ps -T -p 24209` to list the threads (`SPID`) inside the `gaussdb` process.","Step 3: Query the `enable_incremental_checkpoint` parameter using `gsql -d postgres -p 5432 -c \"SHOW enable_incremental_checkpoint;\"`."],"starter_code":"# Step 1: Check the gaussdb process\nps ux | grep ____\n\n# Step 2: View all threads (-T) belonging to process 24209\nps ____ -p 24209\n\n# Step 3: Verify incremental checkpoint is enabled\ngsql -d postgres -p 5432 -c \"SHOW ____;\"\n","solution_code":"ps ux | grep gaussdb\nps -T -p 24209\ngsql -d postgres -p 5432 -c \"SHOW enable_incremental_checkpoint;\"","hints":["The openGauss server binary name is `gaussdb`.","The `ps -T -p <PID>` flag displays all threads running inside a single process.","The GUC parameter for incremental checkpointing is `enable_incremental_checkpoint`."],"validation_checks":[{"step":1,"description":"Check `gaussdb` process with `ps`","required_any":["grep gaussdb"],"feedback_fail":"Use `ps ux | grep gaussdb` to inspect the main database process."},{"step":2,"description":"List threads of the process using `ps -T -p`","required_any":["ps -t -p","ps -t"],"feedback_fail":"Use `ps -T -p 24209` to inspect the threads inside the `gaussdb` process."},{"step":3,"description":"Query `enable_incremental_checkpoint` via `gsql`","required_any":["enable_incremental_checkpoint"],"feedback_fail":"Query `SHOW enable_incremental_checkpoint;` using `gsql`."}],"simulated_output":"omm      24209 11.9  1.0 1852000 355816 pts/0  Sl   01:54   0:33 /opt/software/openGauss/bin/gaussdb -D /opt/software/openGauss/data/single_node\n  PID  SPID TTY          TIME CMD\n24209 24209 pts/0    00:00:02 gaussdb\n24209 24215 pts/0    00:00:01 syslogger\n24209 24217 pts/0    00:00:04 pagewriter\n24209 24218 pts/0    00:00:03 bgwriter\n24209 24219 pts/0    00:00:05 checkpointer\n24209 24220 pts/0    00:00:06 walwriter\n enable_incremental_checkpoint \n-------------------------------\n on\n(1 row)","quiz_questions":[{"id":"h1_s3_q1","type":"single","question":"Under which open-source license is the openGauss database released?","options":["A. GPL v3","B. Apache License 2.0","C. Mulan Permissive Software License v2 (Mulan PSL v2)","D. BSD 3-Clause License"],"answer":"C","explanation":"Per Chapter 01 (pp. 43, 46, 50), openGauss is released under the Mulan Permissive Software License v2 (Mulan PSL v2)."},{"id":"h1_s3_q2","type":"multiple","question":"Which of the following accurately describe architectural advantages of openGauss compared with PostgreSQL?","options":["A. openGauss uses a single-process multi-threaded architecture instead of PostgreSQL's multi-process architecture","B. openGauss uses 64-bit transaction IDs and CSNs to eliminate 32-bit transaction ID wraparound bottlenecks","C. openGauss uses incremental checkpoints with performance fluctuation < 5% instead of full checkpoints (> 15%)","D. openGauss supports only row-store tables whereas PostgreSQL supports row-store, column-store, and MOT"],"answer":"ABC","explanation":"Options A, B, and C are exact advantages of openGauss (Ch.01 pp. 48–49). Option D is reversed: openGauss supports row-store, column-store, and MOT, whereas PostgreSQL supports row-store only."},{"id":"h1_s3_q3","type":"tf","question":"In the openGauss community, the Technical Committee (TC) makes decisions regarding the technical development direction of the community.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.01 p. 50). The TC makes decisions on the technical direction, Maintainers attend to project code, Committers monitor code quality and integrate modifications, and Contributors submit requirements/bugs/code."}],"reference_figures":[{"slug":"p3_h1s3_opengauss_vs_pg","title":"openGauss Thread Pool Architecture vs PostgreSQL Multi-Process Architecture","pdf_page":48}]}},{"sprint_number":4,"lecture_slug":"07-Lecture-Technical-Specifications-APIs-and-SQL-Hints","exercise_slug":"08-Exercise-Specs-JDBC-ODBC-and-Plan-Hints-Lab","lecture":{"title":"openGauss Technical Specifications, APIs (`ODBC`/`JDBC`) & SQL Hints","duration_mins":7,"pdf_ref":"Ch.01, pp. 51–71","objectives":["Identify the 4 categories of execution engine plan nodes (Scan, Control, Materialize, Join)","Memorize official openGauss technical specifications (32 TB table size, 1 GB row/field, 10,000 connections, partition limits)","Configure standard SQL, ODBC 3.5, JDBC 4.0 (JDK 1.8), libpq/ECPG APIs, WAL/Checkpoint transaction durability, and SQL Plan Hints"],"content_markdown":"### 1. Query Optimization, Execution Engine & Storage Engine (pp. 52–54)\n- **Physical Query Optimization Pipeline**:\n  `Table/Column Statistics (Unique + MCV)` -> `Row Estimation (baserel/joinrel/agg)` -> `Cost Estimation` -> `Access Path Generation (Dynamic Programming / Genetic Algorithm)` -> `PlanTree Generation`.\n- **4 Categories of Execution Engine Plan Nodes (pp. 53–54)**:\n  1. **Scan plan nodes** (Leaf nodes, input data + expression filtering): `SeqScan`, `IndexScan`, `SubQueryScan`.\n  2. **Control plan nodes** (Flow control): `Limit`, `RecursiveUnion`, `Union`.\n  3. **Materialize plan nodes** (Cache lower-layer data; return only after all data is scanned): `Agg`, `Sort`.\n  4. **Join plan nodes** (Multiple inputs): `MergeJoin`, `SortJoin` / `NestLoop`, `HashJoin`.\n<!-- PDF_FIGS_START -->\n![openGauss Execution Engine Pipeline (Scan, Plan, Materialization, Join) (Official Reference: p. 53)](./assets/images/p3_h1s4_execution_engine.png)\n*Figure: openGauss Execution Engine Pipeline (Scan, Plan, Materialization, Join) (Official Reference: p. 53)*\n\n![openGauss Storage Engine Layered Stack (Official Reference: p. 54)](./assets/images/p3_h1s4_storage_engine.png)\n*Figure: openGauss Storage Engine Layered Stack (Official Reference: p. 54)*\n\n![Kunpeng Multi-Core CPU Architecture and Dual-Socket Performance (Official Reference: p. 55)](./assets/images/p3_h1s4_kunpeng_numa_perf.png)\n*Figure: Kunpeng Multi-Core CPU Architecture and Dual-Socket Performance (Official Reference: p. 55)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Official openGauss Technical Specifications (p. 57)\n\n| Technical Specification Item | Official Maximum Value |\n| :--- | :--- |\n| **Database capacity** | Varies depending on the OS and hardware |\n| **Maximum size of a single table** | **32 TB** |\n| **Maximum size of data in a single row / single field** | **1 GB** (Row) / **1 GB** (Field) |\n| **Maximum number of records in each table** | **2^{48}** |\n| **Number of columns in a single table** | **250 to 1,600** (varies with field type) |\n| **Number of indexes / constraints on a single table** | **Unlimited** |\n| **Maximum columns in a composite index** | **32** (up to 16 recommended in DDL guide) |\n| **Maximum concurrent connections** | **10,000** |\n| **Maximum partitions in a partitioned table** | **32,768 (Range partitioning)** / **64 (Hash or List partitioning)** |\n| **Size of each partition / records per partition** | **32 TB** / **2^{55} records** |\n\n---\n\n### 3. Standard APIs, Transaction WAL Mechanism & SQL Hints (pp. 59–66)\n- **Standard SQL**: Supports SQL-92, SQL-99, **SQL:2003** standard, and core/optional features of **SQL:2011**.\n- **ODBC 3.5**: Uses `unixODBC-2.3.0` or `iODBC` on Linux/UNIX, or native Windows ODBC Driver Manager. *(Note: Current open-source ODBC driver may be incompatible with `tinyint`, `smalldatetime`, and `nvarchar2`.)*\n- **JDBC 4.0**: Requires **JDK 1.8** for compilation; supports third-party logging frameworks; **does NOT support JDBC-ODBC bridging**.\n- **PostgreSQL Client APIs**: Compatible with **libpq** (C API foundation) and **ECPG** (Embedded SQL in C).\n- **Transaction Mechanism (p. 62–63)**:\n  - Default transaction isolation level is **`READ COMMITTED`** (prevents dirty reads).\n  - Durability is guaranteed by **WAL (Write-Ahead Logging)** — redo logs are flushed to disk upon commit before data pages, while **Checkpoints** flush dirty buffers from the dirty buffer queue to data files.\n- **SQL Plan Hints (`/*+ ... */`)**: Override the optimizer's execution plan by specifying join order, join method (`HashJoin`, `MergeJoin`, `NestLoop`), scan method (`IndexScan`, `SeqScan`), stream mode, or row estimates.\n<!-- PDF_FIGS_START -->\n![openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE) (Official Reference: p. 56)](./assets/images/p3_h1s4_fully_encrypted_tee.png)\n*Figure: openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE) (Official Reference: p. 56)*\n\n![Write-Ahead Logging (WAL) Redo Buffer and Checkpoint Disk Flush Flow (Official Reference: p. 63)](./assets/images/p3_h1s4_wal_redo_mechanism.png)\n*Figure: Write-Ahead Logging (WAL) Redo Buffer and Checkpoint Disk Flush Flow (Official Reference: p. 63)*\n<!-- PDF_FIGS_END -->\n","key_takeaways":["openGauss supports up to 32 TB per table, 1 GB per row/field, 10,000 concurrent connections, 32,768 range partitions, and 64 hash/list partitions.","The default transaction isolation level in openGauss is READ COMMITTED, and durability is enforced via Write-Ahead Logging (WAL).","openGauss supports ODBC 3.5, JDBC 4.0 (requires JDK 1.8, no JDBC-ODBC bridge), libpq, and ECPG."],"exam_traps":["EXAM TRAP: Range partitioning supports up to 32,768 partitions per table, whereas Hash and List partitioning support up to 64 partitions (Ch.01 p. 57).","EXAM TRAP: Materialize plan nodes (such as Agg and Sort) return data ONLY after all lower-layer data has been scanned and cached."],"content_html":"<h3>1. Query Optimization, Execution Engine &amp; Storage Engine (pp. 52–54)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Physical Query Optimization Pipeline<\/strong>:<\/li>\n<\/ul>\n<p><code class=\"inline-code\">Table/Column Statistics (Unique + MCV)<\/code> -&gt; <code class=\"inline-code\">Row Estimation (baserel/joinrel/agg)<\/code> -&gt; <code class=\"inline-code\">Cost Estimation<\/code> -&gt; <code class=\"inline-code\">Access Path Generation (Dynamic Programming / Genetic Algorithm)<\/code> -&gt; <code class=\"inline-code\">PlanTree Generation<\/code>.<\/p>\n<ul class=\"md-list\">\n<li><strong>4 Categories of Execution Engine Plan Nodes (pp. 53–54)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Scan plan nodes<\/strong> (Leaf nodes, input data + expression filtering): <code class=\"inline-code\">SeqScan<\/code>, <code class=\"inline-code\">IndexScan<\/code>, <code class=\"inline-code\">SubQueryScan<\/code>.<\/li>\n<li><strong>Control plan nodes<\/strong> (Flow control): <code class=\"inline-code\">Limit<\/code>, <code class=\"inline-code\">RecursiveUnion<\/code>, <code class=\"inline-code\">Union<\/code>.<\/li>\n<li><strong>Materialize plan nodes<\/strong> (Cache lower-layer data; return only after all data is scanned): <code class=\"inline-code\">Agg<\/code>, <code class=\"inline-code\">Sort<\/code>.<\/li>\n<li><strong>Join plan nodes<\/strong> (Multiple inputs): <code class=\"inline-code\">MergeJoin<\/code>, <code class=\"inline-code\">SortJoin<\/code> / <code class=\"inline-code\">NestLoop<\/code>, <code class=\"inline-code\">HashJoin<\/code>.<\/li>\n<\/ol>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s4_execution_engine.png\" alt=\"openGauss Execution Engine Pipeline (Scan, Plan, Materialization, Join)\" data-caption=\"openGauss Execution Engine Pipeline (Scan, Plan, Materialization, Join) (Official Reference: p. 53)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Execution Engine Pipeline (Scan, Plan, Materialization, Join)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 53 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s4_storage_engine.png\" alt=\"openGauss Storage Engine Layered Stack\" data-caption=\"openGauss Storage Engine Layered Stack (Official Reference: p. 54)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Storage Engine Layered Stack<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 54 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s4_kunpeng_numa_perf.png\" alt=\"Kunpeng Multi-Core CPU Architecture and Dual-Socket Performance\" data-caption=\"Kunpeng Multi-Core CPU Architecture and Dual-Socket Performance (Official Reference: p. 55)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Kunpeng Multi-Core CPU Architecture and Dual-Socket Performance<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 55 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n\n<p>---<\/p>\n<h3>2. Official openGauss Technical Specifications (p. 57)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Technical Specification Item<\/th><th>Official Maximum Value<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Database capacity<\/strong><\/td><td>Varies depending on the OS and hardware<\/td><\/tr>\n<tr><td><strong>Maximum size of a single table<\/strong><\/td><td><strong>32 TB<\/strong><\/td><\/tr>\n<tr><td><strong>Maximum size of data in a single row / single field<\/strong><\/td><td><strong>1 GB<\/strong> (Row) / <strong>1 GB<\/strong> (Field)<\/td><\/tr>\n<tr><td><strong>Maximum number of records in each table<\/strong><\/td><td><strong>2^{48}<\/strong><\/td><\/tr>\n<tr><td><strong>Number of columns in a single table<\/strong><\/td><td><strong>250 to 1,600<\/strong> (varies with field type)<\/td><\/tr>\n<tr><td><strong>Number of indexes / constraints on a single table<\/strong><\/td><td><strong>Unlimited<\/strong><\/td><\/tr>\n<tr><td><strong>Maximum columns in a composite index<\/strong><\/td><td><strong>32<\/strong> (up to 16 recommended in DDL guide)<\/td><\/tr>\n<tr><td><strong>Maximum concurrent connections<\/strong><\/td><td><strong>10,000<\/strong><\/td><\/tr>\n<tr><td><strong>Maximum partitions in a partitioned table<\/strong><\/td><td><strong>32,768 (Range partitioning)<\/strong> / <strong>64 (Hash or List partitioning)<\/strong><\/td><\/tr>\n<tr><td><strong>Size of each partition / records per partition<\/strong><\/td><td><strong>32 TB<\/strong> / <strong>2^{55} records<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Standard APIs, Transaction WAL Mechanism &amp; SQL Hints (pp. 59–66)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Standard SQL<\/strong>: Supports SQL-92, SQL-99, <strong>SQL:2003<\/strong> standard, and core/optional features of <strong>SQL:2011<\/strong>.<\/li>\n<li><strong>ODBC 3.5<\/strong>: Uses <code class=\"inline-code\">unixODBC-2.3.0<\/code> or <code class=\"inline-code\">iODBC<\/code> on Linux/UNIX, or native Windows ODBC Driver Manager. <em>(Note: Current open-source ODBC driver may be incompatible with <code class=\"inline-code\">tinyint<\/code>, <code class=\"inline-code\">smalldatetime<\/code>, and <code class=\"inline-code\">nvarchar2<\/code>.)<\/em><\/li>\n<li><strong>JDBC 4.0<\/strong>: Requires <strong>JDK 1.8<\/strong> for compilation; supports third-party logging frameworks; <strong>does NOT support JDBC-ODBC bridging<\/strong>.<\/li>\n<li><strong>PostgreSQL Client APIs<\/strong>: Compatible with <strong>libpq<\/strong> (C API foundation) and <strong>ECPG<\/strong> (Embedded SQL in C).<\/li>\n<li><strong>Transaction Mechanism (p. 62–63)<\/strong>:<\/li>\n<li>Default transaction isolation level is <strong><code class=\"inline-code\">READ COMMITTED<\/code><\/strong> (prevents dirty reads).<\/li>\n<li>Durability is guaranteed by <strong>WAL (Write-Ahead Logging)<\/strong> — redo logs are flushed to disk upon commit before data pages, while <strong>Checkpoints<\/strong> flush dirty buffers from the dirty buffer queue to data files.<\/li>\n<li>**SQL Plan Hints (<code class=\"inline-code\">/<em>+ ... <\/em>/<\/code>)**: Override the optimizer's execution plan by specifying join order, join method (<code class=\"inline-code\">HashJoin<\/code>, <code class=\"inline-code\">MergeJoin<\/code>, <code class=\"inline-code\">NestLoop<\/code>), scan method (<code class=\"inline-code\">IndexScan<\/code>, <code class=\"inline-code\">SeqScan<\/code>), stream mode, or row estimates.<\/li>\n<\/ul>\n<!-- PDF_FIGS_START --><div class=\"pdf-figures-group\"><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s4_fully_encrypted_tee.png\" alt=\"openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE)\" data-caption=\"openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE) (Official Reference: p. 56)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>openGauss Fully-Encrypted Database Equality Query (Client Driver to TEE)<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 56 | Click image to zoom<\/span><\/figcaption><\/figure><figure class=\"pdf-figure\"><div class=\"pdf-figure-frame\"><img src=\"./assets/images/p3_h1s4_wal_redo_mechanism.png\" alt=\"Write-Ahead Logging (WAL) Redo Buffer and Checkpoint Disk Flush Flow\" data-caption=\"Write-Ahead Logging (WAL) Redo Buffer and Checkpoint Disk Flush Flow (Official Reference: p. 63)\" onclick=\"openImgZoom(this)\" loading=\"lazy\" /><\/div><figcaption><strong>Write-Ahead Logging (WAL) Redo Buffer and Checkpoint Disk Flush Flow<\/strong><span class=\"pdf-ref-tag\">Official Reference: p. 63 | Click image to zoom<\/span><\/figcaption><\/figure><\/div><!-- PDF_FIGS_END -->\n"},"exercise":{"title":"Hands-On Lab: Applying SQL Plan Hints & Inspecting Execution Plans","duration_mins":8,"exercise_type":"sql","prompt_label":"openGauss=#","scenario":"You are tuning a join query between `client c` and `bank_card b`. Check the default transaction isolation level, and use an openGauss SQL Plan Hint (`/*+ ... */`) with `EXPLAIN` to force a `HashJoin(c b)` and `IndexScan(c)`.","instructions":["Step 1: Run `SHOW default_transaction_isolation;` to verify the default isolation level is `read committed`.","Step 2: Use `EXPLAIN SELECT /*+ HashJoin(c b) IndexScan(c) */ c.c_id, b.b_number FROM client c JOIN bank_card b ON c.c_id = b.b_c_id;` to inspect the hinted execution plan."],"starter_code":"-- Step 1: Check default transaction isolation level\nSHOW ____;\n\n-- Step 2: Use SQL Plan Hints to force HashJoin(c b) and IndexScan(c)\nEXPLAIN SELECT /*+ ____(c b) ____(c) */ c.c_id, b.b_number\nFROM client c JOIN bank_card b ON c.c_id = b.b_c_id;\n","solution_code":"SHOW default_transaction_isolation;\n\nEXPLAIN SELECT /*+ HashJoin(c b) IndexScan(c) */ c.c_id, b.b_number\nFROM client c JOIN bank_card b ON c.c_id = b.b_c_id;","hints":["The GUC parameter for default isolation level is `default_transaction_isolation`.","Inside `/*+ ... */`, specify `HashJoin(c b)` and `IndexScan(c)`."],"validation_checks":[{"step":1,"description":"Check `default_transaction_isolation`","required_any":["default_transaction_isolation"],"feedback_fail":"Run `SHOW default_transaction_isolation;`."},{"step":2,"description":"Include `HashJoin(c b)` and `IndexScan(c)` inside the SQL hint comment","required_any":["hashjoin(c b)"],"feedback_fail":"Specify `HashJoin(c b)` and `IndexScan(c)` inside `/*+ ... */`."}],"simulated_output":" default_transaction_isolation \n-------------------------------\n read committed\n(1 row)\n\n                                    QUERY PLAN                                    \n----------------------------------------------------------------------------------\n Hash Join  (cost=15.25..48.60 rows=100 width=42)\n   Hash Cond: (b.b_c_id = c.c_id)\n   ->  Seq Scan on bank_card b  (cost=0.00..22.00 rows=1000 width=38)\n   ->  Hash  (cost=14.00..14.00 rows=100 width=4)\n         ->  Index Scan using client_pkey on client c  (cost=0.00..14.00 rows=100 width=4)\n(5 rows)","quiz_questions":[{"id":"h1_s4_q1","type":"single","question":"According to the openGauss technical specifications, what is the maximum size of a single table and the maximum number of concurrent connections?","options":["A. 16 TB and 5,000 connections","B. 32 TB and 10,000 connections","C. 64 TB and 20,000 connections","D. 128 TB and 100,000 connections"],"answer":"B","explanation":"Per Chapter 01 (p. 57), the maximum size of a single table in openGauss is 32 TB, and the maximum number of concurrent connections on a single node is 10,000."},{"id":"h1_s4_q2","type":"multiple","question":"Which of the following statements about openGauss client APIs and transaction mechanisms are TRUE?","options":["A. openGauss supports ODBC 3.5 and JDBC 4.0 (requiring JDK 1.8)","B. openGauss is compatible with PostgreSQL client APIs libpq and ECPG","C. Transaction durability is implemented using the Write-Ahead Log (WAL) algorithm","D. The default transaction isolation level in openGauss is SERIALIZABLE"],"answer":"ABC","explanation":"Options A, B, and C are true (Ch.01 pp. 60–65). Option D is false: the default transaction isolation level in openGauss is READ COMMITTED."},{"id":"h1_s4_q3","type":"tf","question":"In the openGauss execution engine, Materialize plan nodes (such as Agg and Sort) return data only after all lower-layer data has been scanned.","options":["A. True","B. False"],"answer":"A","explanation":"True (Ch.01 p. 54). Materialize plan nodes cache lower-layer data and return results only after all data is scanned."}],"reference_figures":[{"slug":"p3_h1s4_wal_redo_mechanism","title":"Write-Ahead Logging (WAL) Redo Buffer and Checkpoint Disk Flush Flow","pdf_page":63}]}}]},{"hour_number":2,"folder_name":"Hour-02-openGauss-Installation-Authentication-and-Tools","title":"openGauss Installation, Authentication & O&M Tools","chapter_ref":"Chapter 02 (pp. 73–130)","duration_mins":60,"overview":"Master the three openGauss deployment modes, hardware/software prerequisites, OS preparation steps, single-node and enterprise installation/uninstallation workflows, client authentication (`pg_hba.conf`, `gs_guc`), `gsql` local/remote connections, and the complete suite of openGauss client and server O&M tools.","sprints":[{"sprint_number":1,"lecture_slug":"01-Lecture-Deployment-Modes-Prerequisites-and-OS-Config","exercise_slug":"02-Exercise-Preinstall-OS-and-Hardware-Prep-Lab","lecture":{"title":"Deployment Modes, Hardware/OS Prerequisites & XML Configuration","duration_mins":7,"pdf_ref":"Ch.02, pp. 77–91","objectives":["Compare the 3 official openGauss deployment modes: Standalone, Primary/Standby, and One Primary + Multiple Standbys","Verify hardware (RAM, CPU, Disk, NIC MTU) and software/OS prerequisites (openEuler, Python 3.7, libaio-devel)","Configure OS settings prior to installation: SELinux, firewalld, RemoveIPC=no, locale/timezone, NIC MTU, root SSH, and `dbgrp`/`omm`"],"content_markdown":"### 1. Three Official openGauss Deployment Modes (pp. 77–81, Ch.03 Quiz Q1!)\n\n| Deployment Mode | Data Copies | HA / RPO / RTO | Key Characteristics & Target Scenario |\n| :--- | :--- | :--- | :--- |\n| **1. Standalone (Single-node)** | **1 copy** | No HA; RTO & RPO uncontrollable | Single instance; lost instance data can only be restored from physical backup. For **trial use, learning, and sandbox testing** (not production). |\n| **2. Primary/Standby (1 Primary + 1 Standby)** | **2 copies** | **RPO = 0**, Instance fault **RTO < 10s** | Primary supports Read/Write; Standby receives/replays WAL logs and supports **Read-only**. Protects against instance failure. |\n| **3. One Primary + Multiple Standbys (Quorum)** | **2 to 4 copies** (typically 1P + 2S = **3 copies**; up to 8 standbys in v2.0+) | **RPO = 0**, Instance fault **RTO < 10s**, **99.99% reliability** | Quorum replication synchronizes data to at least one standby node for max performance. Primary and standby nodes **cannot** be on the same physical machine. |\n\n> **CRITICAL EXAM NOTE (Ch.03 Quiz Q1)**: openGauss supports **Single-node**, **One primary + one standby**, and **One primary + multiple standbys**. It **DOES NOT** support \"Dual primary nodes\" deployment!\n<!-- PDF_FIGS_START -->\n![openGauss Standalone Deployment Architecture (Official Reference: p. 78)](./assets/images/p3_h2s1_standalone_deploy.png)\n*Figure: openGauss Standalone Deployment Architecture (Official Reference: p. 78)*\n\n![openGauss Primary/Standby Deployment Topology (Official Reference: p. 79)](./assets/images/p3_h2s1_primary_standby.png)\n*Figure: openGauss Primary/Standby Deployment Topology (Official Reference: p. 79)*\n\n![openGauss One Primary and Multiple Standbys Topology (Official Reference: p. 80)](./assets/images/p3_h2s1_one_primary_multi_standby.png)\n*Figure: openGauss One Primary and Multiple Standbys Topology (Official Reference: p. 80)*\n<!-- PDF_FIGS_END -->\n\n\n---\n\n### 2. Hardware & Software Requirements (pp. 84–85)\n- **Memory**: **>= 32 GB** for function debugging; **>= 128 GB** for commercial/performance testing; **4 GB min (8 GB recommended)** for individual developers.\n-
