, "type": "single", "question": "What are the required cabinet depth, front/rear clearance, and external circuit breaker current ratings for installing a TaiShan 200 (model 2280) server?", "options": ["A. Depth > 600 mm; clearance 400 mm; breaker 10 A AC or 16 A DC", "B. Depth > 1,000 mm (IEC 297); clearance 800 mm; breaker 32 A AC or 63 A DC", "C. Depth > 1,500 mm; clearance 1,200 mm; breaker 100 A AC or 100 A DC", "D. Depth > 800 mm; clearance 500 mm; breaker 16 A AC or 32 A DC"], "answer": "B", "explanation": "According to Ch.05 pp. 291 and 295, cabinets must conform to IEC 297 and exceed 1,000 mm in depth, with 800 mm clearance at front and rear, and external circuit breakers rated at 32 A AC or 63 A DC."}, {"id": "h6_s1_q3", "type": "tf", "question": "By default, the 'System State Upon Power Supply' parameter of a TaiShan 200 (model 2280) server is set to 'Power on', meaning the server automatically powers on when power is supplied to the PSUs.", "options": ["A. True", "B. False"], "answer": "A", "explanation": "True. According to Ch.05 p.295, the server is powered on together with the PSUs by default ('System State Upon Power Supply' = 'Power on', configurable under iBMC WebUI Power > Power Control)."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-TaiShan-2280-Default-Credentials-and-iBMC-Initial-Setup", "exercise_slug": "04-Exercise-iBMC-Default-IP-Credentials-and-WebUI-Navigation-Lab", "lecture": {"title": "TaiShan 200 (2280) Default Credentials & iBMC Initial Setup", "duration_mins": 8, "pdf_ref": "Ch.05, pp. 296–308", "objectives": ["Memorize the exact default IP, subnet mask, and all 3 default user/password pairs of TaiShan 200 (model 2280)", "Know how to query the iBMC IP in BIOS and configure Network, Firmware, Local Users, NTP, VNC, and SNMP in iBMC WebUI", "Compare SNMPv1 (RFC 1157), SNMPv2 (RFC 1901), and SNMPv3 security recommendations"], "content_markdown": "### 1. Default Values of TaiShan 200 (Model 2280) (p. 297 — Must Memorize!)\n| Category | Item | Official Default Value (p. 297) | Remarks |\n| :--- | :--- | :--- | :--- |\n| **iBMC Management Network Port** | IP Address & Subnet Mask | IP: **`192.168.2.100`**<br>Subnet Mask: **`255.255.255.0`** | Can be queried/changed in BIOS (`Advanced > IPMI iBMC Configuration > iBMC Configuration`) or iBMC WebUI |\n| **Default iBMC Login User** | User Name & Password | User: **`root`**<br>Password: **`Huawei12#`** | Default underlying iBMC user |\n| **iBMC WebUI or CLI Login** | User Name & Password | User: **`Administrator`**<br>Password: **`Admin@9000`** | Select Domain: **`Local iBMC`** when logging in to `https://192.168.2.100` |\n| **iBMC U-Boot Data / BIOS** | Default Password | Password: **`Admin@9000`** | Used for U-Boot and BIOS Setup entry |\n\n*(Note on Peripheral Ports, p. 298: The front and rear panels of TaiShan 2280 feature a **VGA port** for display output and **USB 3.0 ports**, but **lack PS/2 ports** for keyboard/mouse — connect a USB keyboard/mouse directly or use a USB-to-PS/2 adapter.)*\n\n---\n\n### 2. iBMC WebUI Initial Configuration Navigation Paths (pp. 300–308)\nConnect a PC to the iBMC management port via crossover or twisted-pair cable, browse to `https://192.168.2.100`, enter `Administrator` / `Admin@9000`, and select **`Local iBMC`**:\n\n| Task | Exact iBMC WebUI Menu Path (pp. 300–308) |\n| :--- | :--- |\n| **Change iBMC Management IP** | **`iBMC Settings > Network Settings`** (locate **Network Protocols** area \\rightarrow Save) |\n| **Check Version & Upgrade Firmware** | **`iBMC Settings > Firmware Upgrade`** (upload file, optionally select *Restart iBMC immediately after upgrade*) |\n| **Change Initial Password** | **`User & Security > Local Users`** (click **Edit** next to the user) |\n| **Configure Time Zone & NTP** | **`iBMC Settings > Time Zone & NTP`** (synchronizes host clocks with **UTC** within **1 ms on LAN** and **tens of ms on WAN**) |\n| **Enable VNC** | **`Services > VNC`** (provides remote video display and keyboard/mouse control) |\n| **Enable SNMP** | **`Services > SNMP`** |\n\n---\n\n### 3. SNMP Versions Supported by iBMC (p. 308)\n- **SNMPv1**: First official SNMP version defined in **RFC 1157**; poses security risks (cleartext community strings).\n- **SNMPv2**: Experimental protocol defined in **RFC 1901** adopting a community-based management architecture; poses security risks.\n- **SNMPv3**: Third official SNMP version revising previous versions with **enhanced security (authentication + encryption)** and remote configuration. **For security purposes, always use SNMPv3!**", "key_takeaways": ["TaiShan 200 (2280) default iBMC IP is 192.168.2.100/24 (255.255.255.0); iBMC WebUI/CLI login is Administrator / Admin@9000 (Domain: Local iBMC); default iBMC user is root / Huawei12#; U-Boot/BIOS password is Admin@9000.", "TaiShan 2280 has VGA and USB 3.0 ports on front/rear panels, but NO PS/2 ports.", "Query iBMC IP via BIOS at Advanced > IPMI iBMC Configuration > iBMC Configuration, or change it in iBMC WebUI at iBMC Settings > Network Settings > Network Protocols.", "SNMPv1 (RFC 1157) and SNMPv2 (RFC 1901) have security risks; SNMPv3 is recommended for security."], "exam_traps": ["EXAM TRAP: Distinguish the two default accounts on p. 297: iBMC WebUI/CLI uses `Administrator` / `Admin@9000`, while the default iBMC login user is `root` / `Huawei12#`!", "EXAM TRAP: Know the exact iBMC WebUI menu paths: Firmware Upgrade, Network Settings, and Time Zone & NTP are under `iBMC Settings`; Local Users is under `User & Security`; VNC and SNMP are under `Services`."], "content_html": "<h3>1. Default Values of TaiShan 200 (Model 2280) (p. 297 — Must Memorize!)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Category<\/th><th>Item<\/th><th>Official Default Value (p. 297)<\/th><th>Remarks<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>iBMC Management Network Port<\/strong><\/td><td>IP Address &amp; Subnet Mask<\/td><td>IP: <strong><code class=\"inline-code\">192.168.2.100<\/code><\/strong>&lt;br&gt;Subnet Mask: <strong><code class=\"inline-code\">255.255.255.0<\/code><\/strong><\/td><td>Can be queried/changed in BIOS (<code class=\"inline-code\">Advanced &gt; IPMI iBMC Configuration &gt; iBMC Configuration<\/code>) or iBMC WebUI<\/td><\/tr>\n<tr><td><strong>Default iBMC Login User<\/strong><\/td><td>User Name &amp; Password<\/td><td>User: <strong><code class=\"inline-code\">root<\/code><\/strong>&lt;br&gt;Password: <strong><code class=\"inline-code\">Huawei12#<\/code><\/strong><\/td><td>Default underlying iBMC user<\/td><\/tr>\n<tr><td><strong>iBMC WebUI or CLI Login<\/strong><\/td><td>User Name &amp; Password<\/td><td>User: <strong><code class=\"inline-code\">Administrator<\/code><\/strong>&lt;br&gt;Password: <strong><code class=\"inline-code\">Admin@9000<\/code><\/strong><\/td><td>Select Domain: <strong><code class=\"inline-code\">Local iBMC<\/code><\/strong> when logging in to <code class=\"inline-code\">https://192.168.2.100<\/code><\/td><\/tr>\n<tr><td><strong>iBMC U-Boot Data / BIOS<\/strong><\/td><td>Default Password<\/td><td>Password: <strong><code class=\"inline-code\">Admin@9000<\/code><\/strong><\/td><td>Used for U-Boot and BIOS Setup entry<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><em>(Note on Peripheral Ports, p. 298: The front and rear panels of TaiShan 2280 feature a <strong>VGA port<\/strong> for display output and <strong>USB 3.0 ports<\/strong>, but <strong>lack PS/2 ports<\/strong> for keyboard/mouse — connect a USB keyboard/mouse directly or use a USB-to-PS/2 adapter.)<\/em><\/p>\n<p>---<\/p>\n<h3>2. iBMC WebUI Initial Configuration Navigation Paths (pp. 300–308)<\/h3>\n<p>Connect a PC to the iBMC management port via crossover or twisted-pair cable, browse to <code class=\"inline-code\">https://192.168.2.100<\/code>, enter <code class=\"inline-code\">Administrator<\/code> / <code class=\"inline-code\">Admin@9000<\/code>, and select <strong><code class=\"inline-code\">Local iBMC<\/code><\/strong>:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Task<\/th><th>Exact iBMC WebUI Menu Path (pp. 300–308)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Change iBMC Management IP<\/strong><\/td><td><strong><code class=\"inline-code\">iBMC Settings &gt; Network Settings<\/code><\/strong> (locate <strong>Network Protocols<\/strong> area \\rightarrow Save)<\/td><\/tr>\n<tr><td><strong>Check Version &amp; Upgrade Firmware<\/strong><\/td><td><strong><code class=\"inline-code\">iBMC Settings &gt; Firmware Upgrade<\/code><\/strong> (upload file, optionally select <em>Restart iBMC immediately after upgrade<\/em>)<\/td><\/tr>\n<tr><td><strong>Change Initial Password<\/strong><\/td><td><strong><code class=\"inline-code\">User &amp; Security &gt; Local Users<\/code><\/strong> (click <strong>Edit<\/strong> next to the user)<\/td><\/tr>\n<tr><td><strong>Configure Time Zone &amp; NTP<\/strong><\/td><td><strong><code class=\"inline-code\">iBMC Settings &gt; Time Zone &amp; NTP<\/code><\/strong> (synchronizes host clocks with <strong>UTC<\/strong> within <strong>1 ms on LAN<\/strong> and <strong>tens of ms on WAN<\/strong>)<\/td><\/tr>\n<tr><td><strong>Enable VNC<\/strong><\/td><td><strong><code class=\"inline-code\">Services &gt; VNC<\/code><\/strong> (provides remote video display and keyboard/mouse control)<\/td><\/tr>\n<tr><td><strong>Enable SNMP<\/strong><\/td><td><strong><code class=\"inline-code\">Services &gt; SNMP<\/code><\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. SNMP Versions Supported by iBMC (p. 308)<\/h3>\n<ul class=\"md-list\">\n<li><strong>SNMPv1<\/strong>: First official SNMP version defined in <strong>RFC 1157<\/strong>; poses security risks (cleartext community strings).<\/li>\n<li><strong>SNMPv2<\/strong>: Experimental protocol defined in <strong>RFC 1901<\/strong> adopting a community-based management architecture; poses security risks.<\/li>\n<li><strong>SNMPv3<\/strong>: Third official SNMP version revising previous versions with <strong>enhanced security (authentication + encryption)<\/strong> and remote configuration. <strong>For security purposes, always use SNMPv3!<\/strong><\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: TaiShan 2280 iBMC Initial Provisioning & Security Hardening", "duration_mins": 8, "exercise_type": "config", "prompt_label": "iBMC:/->", "scenario": "You have just powered on a brand-new TaiShan 200 (model 2280) server. Complete the initialization parameters including default IP, credentials, BIOS lookup path, and SNMP hardening.", "instructions": ["Set `default_ibmc_ip` to `'192.168.2.100'` and `default_subnet_mask` to `'255.255.255.0'`.", "Set `webui_cli_user` to `'Administrator'`, `webui_cli_password` to `'Admin@9000'`, and `default_root_password` to `'Huawei12#'`.", "Set `recommended_snmp_version` to `'SNMPv3'`."], "starter_code": "# TaiShan 200 (2280) iBMC Initialization Parameters\nibmc_defaults:\n  default_ibmc_ip: \"___\"\n  default_subnet_mask: \"___\"\n  webui_cli_user: \"___\"\n  webui_cli_password: \"___\"\n  default_root_password: \"___\"\n  login_domain: \"Local iBMC\"\n\nsecurity_and_menus:\n  bios_ip_lookup_path: \"Advanced > IPMI iBMC Configuration > iBMC Configuration\"\n  recommended_snmp_version: \"___\"\n", "solution_code": "# TaiShan 200 (2280) iBMC Initialization Parameters\nibmc_defaults:\n  default_ibmc_ip: \"192.168.2.100\"\n  default_subnet_mask: \"255.255.255.0\"\n  webui_cli_user: \"Administrator\"\n  webui_cli_password: \"Admin@9000\"\n  default_root_password: \"Huawei12#\"\n  login_domain: \"Local iBMC\"\n\nsecurity_and_menus:\n  bios_ip_lookup_path: \"Advanced > IPMI iBMC Configuration > iBMC Configuration\"\n  recommended_snmp_version: \"SNMPv3\"\n", "hints": ["Default iBMC IP is 192.168.2.100 with mask 255.255.255.0.", "WebUI/CLI user is Administrator (Admin@9000), root password is Huawei12#, and SNMPv3 is recommended."], "validation_checks": [{"step": 1, "description": "Verify default iBMC IP (192.168.2.100) and subnet mask (255.255.255.0)", "required_any": ["192.168.2.100", "255.255.255.0"], "feedback_fail": "Set default_ibmc_ip to '192.168.2.100' and default_subnet_mask to '255.255.255.0'."}, {"step": 2, "description": "Verify Administrator / Admin@9000 and root / Huawei12# credentials", "required_any": ["administrator", "admin@9000", "huawei12#"], "feedback_fail": "Include 'Administrator', 'Admin@9000', and 'Huawei12#'."}, {"step": 3, "description": "Verify SNMPv3 security recommendation", "required_any": ["snmpv3"], "feedback_fail": "Set recommended_snmp_version to 'SNMPv3'."}], "simulated_output": "[OK] TaiShan 200 (2280) iBMC Initial Setup Validated:\n- URL: https://192.168.2.100 (255.255.255.0) | Domain: Local iBMC\n- WebUI/CLI: Administrator / Admin@9000 | Root: root / Huawei12# | U-Boot/BIOS: Admin@9000\n- Hardening: Password updated under User & Security > Local Users; SNMPv3 enabled under Services > SNMP.", "quiz_questions": [{"id": "h6_s2_q1", "type": "single", "question": "What are the default IP address, subnet mask, and WebUI/CLI login user name and password of the iBMC management network port on a TaiShan 200 (model 2280) server?", "options": ["A. 192.168.1.1 / 255.255.255.0; admin / Admin@123", "B. 192.168.2.100 / 255.255.255.0; Administrator / Admin@9000", "C. 10.0.0.100 / 255.0.0.0; root / Huawei@123", "D. 172.16.0.1 / 255.255.0.0; operator / Taishan@2280"], "answer": "B", "explanation": "According to Ch.05 p.297, the default iBMC management port IP is 192.168.2.100, subnet mask is 255.255.255.0, and the default iBMC WebUI or CLI login user/password is Administrator / Admin@9000."}, {"id": "h6_s2_q2", "type": "single", "question": "If the iBMC management IP address of a used TaiShan 200 (model 2280) server has been changed and is unknown, which BIOS menu path should you navigate to after pressing Delete or F4 during boot?", "options": ["A. Main > System Time > Network Configuration", "B. Advanced > IPMI iBMC Configuration > iBMC Configuration", "C. Boot > Boot Type Order > PXE Configuration", "D. Security > Administrator Password > iBMC IP"], "answer": "B", "explanation": "According to Ch.05 pp. 299 and 313, you check or configure the iBMC management port IP address in the BIOS by choosing Advanced > IPMI iBMC Configuration > iBMC Configuration."}, {"id": "h6_s2_q3", "type": "multiple", "question": "Which of the following statements about iBMC WebUI configuration and SNMP versions are true?", "options": ["A. To change the initial user password on the iBMC WebUI, choose User & Security > Local Users.", "B. To upgrade firmware or configure Time Zone & NTP, navigate under the iBMC Settings menu.", "C. SNMPv1 (RFC 1157) and SNMPv2 (RFC 1901) may pose security risks, so SNMPv3 is recommended for security purposes.", "D. The front and rear panels of a TaiShan 200 (model 2280) server provide dedicated purple/green PS/2 keyboard and mouse ports."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.05, pp. 303–308). D is false because Ch.05 p.298 explicitly states that the front and rear panels feature a VGA port and USB 3.0 ports, but lack PS/2 ports for keyboard and mouse input."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Remote-Virtual-Console-KVM-and-BIOS-Configuration", "exercise_slug": "06-Exercise-BIOS-POST-Boot-Order-and-PXE-Configuration-Lab", "lecture": {"title": "Remote Virtual Console (KVM) & BIOS/PXE Configuration", "duration_mins": 7, "pdf_ref": "Ch.05, pp. 309–317", "objectives": ["Distinguish Private vs. Shared modes of Java and HTML5 Integrated Remote Consoles on iBMC", "Master BIOS entry keys (`Delete` or `F4`), the 7-step BIOS POST sequence, and saving changes (`F10`)", "Configure Boot Sequence (`Boot > Boot Type Order`), onboard NIC UEFI PXE (`Advanced > LOM Configuration > PXE Configuration`), and iBMC WebUI `System > BIOS Settings`"], "content_markdown": "### 1. iBMC Remote Virtual Console (KVM): Private vs. Shared Modes (p. 310)\nOn the iBMC WebUI **Home** page, clicking **Virtual Console \\rightarrow Start** offers four options across **Java** and **HTML5** Integrated Remote Consoles:\n- **Java / HTML5 Integrated Remote Console (Private)**: Allows **only 1 local user or VNC user** to access and operate the server through iBMC at a time.\n- **Java / HTML5 Integrated Remote Console (Shared)**: Allows **up to 2 local users or 5 VNC users** to simultaneously access and perform operations on the server through iBMC (each user can view operations performed by the others).\n\n---\n\n### 2. Entering the BIOS & The 7-Step POST Sequence (pp. 311–312)\n- **Entering BIOS Setup (p. 311)**: Power on or reset the server from the Remote Virtual Console, press **`Delete` or `F4`** when the boot menu appears, and enter the BIOS password (default: **`Admin@9000`**).\n- **Power-On Self-Test (POST) 7-Step Sequence (p. 312)**:\n  1. **Initialization of the data bus and control bus** (enables inter-device data transmission)\n  2. **CPU self-check** (checks model, frequency, functions, caches; sets CPU operating mode)\n  3. **Memory self-check** (verifies presence, capacity, speed; configures operating mode and clock frequency)\n  4. **Graphics card self-check** (checks model and video memory capacity; sets display mode)\n  5. **Self-check of drives and other devices** (checks HDDs/SSDs, optical drive, USB peripherals)\n  6. **Result presentation** (presents self-check result via **beep codes** or **on-screen messages**)\n  7. **OS startup** (loads OS from bootable device and hands over control to the OS)\n\n---\n\n### 3. Key BIOS Configuration Tasks & iBMC BIOS Settings (pp. 313–317)\n| BIOS Configuration Task | Exact Menu Path & Keybindings (pp. 313–317) |\n| :--- | :--- |\n| **Configure iBMC IP/User** | **`Advanced > IPMI iBMC Configuration > iBMC Configuration`** |\n| **Set System Date & Time** | **`Main > System Date`** or **`Main > System Time`** |\n| **Set Boot Sequence** | **`Boot > Boot Type Order`**: Use **`+` or `-`** keys to move a boot option up or down, then press **`F10`** (*Save configuration changes and exit?* \\rightarrow **Yes**). |\n| **Configure PXE for Onboard NIC** | **`Advanced > LOM Configuration > PXE Configuration`**: Select `PXE1 Configuration` \\rightarrow **`Enable`**, set **PXE Boot Capability** to **`UEFI: IPv4`**, **`UEFI: IPv6`**, or **`UEFI: IPv4/IPv6`**, then press **`F10`** to save and restart. |\n| **Set Preferred Boot Medium via iBMC WebUI** | **`System > BIOS Settings`**: Select the preferred boot medium to take effect **one time** or **permanently**. |", "key_takeaways": ["Remote Virtual Console (Private) allows 1 local or VNC user; (Shared) allows up to 2 local users or 5 VNC users simultaneously.", "Press Delete or F4 during boot to enter the TaiShan 200 BIOS; use + or - to adjust Boot Type Order; press F10 to save and exit.", "The 7-step BIOS POST order is: Data/control bus init -> CPU self-check -> Memory self-check -> Graphics card self-check -> Drives/peripherals self-check -> Result presentation (beep codes/messages) -> OS startup.", "Enable PXE for the onboard NIC at Advanced > LOM Configuration > PXE Configuration (supports UEFI: IPv4, UEFI: IPv6, or UEFI: IPv4/IPv6)."], "exam_traps": ["EXAM TRAP: In Shared mode of the HTML5/Java Integrated Remote Console, the concurrency limit is up to 2 local users OR 5 VNC users (not 10 users)!", "EXAM TRAP: To enter the BIOS on a TaiShan 200 (2280) server, press `Delete` or `F4` (and press `F10` to save and exit)."], "content_html": "<h3>1. iBMC Remote Virtual Console (KVM): Private vs. Shared Modes (p. 310)<\/h3>\n<p>On the iBMC WebUI <strong>Home<\/strong> page, clicking <strong>Virtual Console \\rightarrow Start<\/strong> offers four options across <strong>Java<\/strong> and <strong>HTML5<\/strong> Integrated Remote Consoles:<\/p>\n<ul class=\"md-list\">\n<li><strong>Java / HTML5 Integrated Remote Console (Private)<\/strong>: Allows <strong>only 1 local user or VNC user<\/strong> to access and operate the server through iBMC at a time.<\/li>\n<li><strong>Java / HTML5 Integrated Remote Console (Shared)<\/strong>: Allows <strong>up to 2 local users or 5 VNC users<\/strong> to simultaneously access and perform operations on the server through iBMC (each user can view operations performed by the others).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Entering the BIOS &amp; The 7-Step POST Sequence (pp. 311–312)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Entering BIOS Setup (p. 311)<\/strong>: Power on or reset the server from the Remote Virtual Console, press <strong><code class=\"inline-code\">Delete<\/code> or <code class=\"inline-code\">F4<\/code><\/strong> when the boot menu appears, and enter the BIOS password (default: <strong><code class=\"inline-code\">Admin@9000<\/code><\/strong>).<\/li>\n<li><strong>Power-On Self-Test (POST) 7-Step Sequence (p. 312)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Initialization of the data bus and control bus<\/strong> (enables inter-device data transmission)<\/li>\n<li><strong>CPU self-check<\/strong> (checks model, frequency, functions, caches; sets CPU operating mode)<\/li>\n<li><strong>Memory self-check<\/strong> (verifies presence, capacity, speed; configures operating mode and clock frequency)<\/li>\n<li><strong>Graphics card self-check<\/strong> (checks model and video memory capacity; sets display mode)<\/li>\n<li><strong>Self-check of drives and other devices<\/strong> (checks HDDs/SSDs, optical drive, USB peripherals)<\/li>\n<li><strong>Result presentation<\/strong> (presents self-check result via <strong>beep codes<\/strong> or <strong>on-screen messages<\/strong>)<\/li>\n<li><strong>OS startup<\/strong> (loads OS from bootable device and hands over control to the OS)<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. Key BIOS Configuration Tasks &amp; iBMC BIOS Settings (pp. 313–317)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>BIOS Configuration Task<\/th><th>Exact Menu Path &amp; Keybindings (pp. 313–317)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Configure iBMC IP/User<\/strong><\/td><td><strong><code class=\"inline-code\">Advanced &gt; IPMI iBMC Configuration &gt; iBMC Configuration<\/code><\/strong><\/td><\/tr>\n<tr><td><strong>Set System Date &amp; Time<\/strong><\/td><td><strong><code class=\"inline-code\">Main &gt; System Date<\/code><\/strong> or <strong><code class=\"inline-code\">Main &gt; System Time<\/code><\/strong><\/td><\/tr>\n<tr><td><strong>Set Boot Sequence<\/strong><\/td><td><strong><code class=\"inline-code\">Boot &gt; Boot Type Order<\/code><\/strong>: Use <strong><code class=\"inline-code\">+<\/code> or <code class=\"inline-code\">-<\/code><\/strong> keys to move a boot option up or down, then press <strong><code class=\"inline-code\">F10<\/code><\/strong> (<em>Save configuration changes and exit?<\/em> \\rightarrow <strong>Yes<\/strong>).<\/td><\/tr>\n<tr><td><strong>Configure PXE for Onboard NIC<\/strong><\/td><td><strong><code class=\"inline-code\">Advanced &gt; LOM Configuration &gt; PXE Configuration<\/code><\/strong>: Select <code class=\"inline-code\">PXE1 Configuration<\/code> \\rightarrow <strong><code class=\"inline-code\">Enable<\/code><\/strong>, set <strong>PXE Boot Capability<\/strong> to <strong><code class=\"inline-code\">UEFI: IPv4<\/code><\/strong>, <strong><code class=\"inline-code\">UEFI: IPv6<\/code><\/strong>, or <strong><code class=\"inline-code\">UEFI: IPv4/IPv6<\/code><\/strong>, then press <strong><code class=\"inline-code\">F10<\/code><\/strong> to save and restart.<\/td><\/tr>\n<tr><td><strong>Set Preferred Boot Medium via iBMC WebUI<\/strong><\/td><td><strong><code class=\"inline-code\">System &gt; BIOS Settings<\/code><\/strong>: Select the preferred boot medium to take effect <strong>one time<\/strong> or <strong>permanently<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>"}, "exercise": {"title": "Hands-On Lab: Remote Console & BIOS/PXE Boot Automation", "duration_mins": 7, "exercise_type": "config", "prompt_label": "bios-setup@taishan-2280:~#", "scenario": "Configure the Remote Virtual Console concurrency parameters and the BIOS boot/PXE settings for automated UEFI PXE network installation.", "instructions": ["Set `shared_console_max_local_users` to `2` and `shared_console_max_vnc_users` to `5`.", "Set `bios_entry_keys` to `'Delete or F4'` and `bios_save_exit_key` to `'F10'`.", "Set `lom_pxe_menu_path` to `'Advanced > LOM Configuration > PXE Configuration'`."], "starter_code": "# Remote Console & BIOS/PXE Configuration\nremote_console:\n  private_console_max_users: 1\n  shared_console_max_local_users: ___\n  shared_console_max_vnc_users: ___\n\nbios_settings:\n  bios_entry_keys: \"___\"\n  boot_order_adjust_keys: \"+ or -\"\n  bios_save_exit_key: \"___\"\n  lom_pxe_menu_path: \"___\"\n  pxe_boot_capabilities:\n    - \"UEFI: IPv4\"\n    - \"UEFI: IPv6\"\n    - \"UEFI: IPv4/IPv6\"\n", "solution_code": "# Remote Console & BIOS/PXE Configuration\nremote_console:\n  private_console_max_users: 1\n  shared_console_max_local_users: 2\n  shared_console_max_vnc_users: 5\n\nbios_settings:\n  bios_entry_keys: \"Delete or F4\"\n  boot_order_adjust_keys: \"+ or -\"\n  bios_save_exit_key: \"F10\"\n  lom_pxe_menu_path: \"Advanced > LOM Configuration > PXE Configuration\"\n  pxe_boot_capabilities:\n    - \"UEFI: IPv4\"\n    - \"UEFI: IPv6\"\n    - \"UEFI: IPv4/IPv6\"\n", "hints": ["Shared remote console supports up to 2 local users or 5 VNC users.", "Enter BIOS with Delete or F4; save and exit with F10; onboard PXE is under Advanced > LOM Configuration > PXE Configuration."], "validation_checks": [{"step": 1, "description": "Verify Shared Remote Console limits (2 local users, 5 VNC users)", "required_any": ["2", "5"], "feedback_fail": "Set shared_console_max_local_users = 2 and shared_console_max_vnc_users = 5."}, {"step": 2, "description": "Verify BIOS entry (Delete or F4) and save/exit (F10) keys", "required_any": ["f4", "f10"], "feedback_fail": "Set bios_entry_keys to 'Delete or F4' and bios_save_exit_key to 'F10'."}, {"step": 3, "description": "Verify LOM Configuration > PXE Configuration path", "required_any": ["lom configuration", "pxe configuration"], "feedback_fail": "Set lom_pxe_menu_path to 'Advanced > LOM Configuration > PXE Configuration'."}], "simulated_output": "[OK] Remote Console & BIOS Configuration Validated:\n- HTML5/Java Console: Private (1 user) | Shared (2 local users or 5 VNC users)\n- BIOS Hotkeys: Entry = Delete / F4 | Move Boot Option = + / - | Save & Exit = F10\n- Onboard PXE: Advanced > LOM Configuration > PXE Configuration (UEFI: IPv4 / IPv6 / IPv4/IPv6).", "quiz_questions": [{"id": "h6_s3_q1", "type": "single", "question": "How many simultaneous users can access the server when using the HTML5 Integrated Remote Console (Shared) mode on the iBMC WebUI?", "options": ["A. Only 1 local user or 1 VNC user", "B. Up to 2 local users or 5 VNC users", "C. Up to 10 local users or 20 VNC users", "D. Unlimited local and VNC users"], "answer": "B", "explanation": "According to Ch.05 p.310, Private mode allows only 1 local user or VNC user, while Shared mode (Java or HTML5) allows up to 2 local users or 5 VNC users simultaneously."}, {"id": "h6_s3_q2", "type": "single", "question": "Which keys are pressed during server startup to enter the TaiShan 200 BIOS Setup utility, and which key saves configuration changes and exits the BIOS?", "options": ["A. Press Ctrl+Alt+Del to enter BIOS; press Esc to save and exit", "B. Press Delete or F4 to enter BIOS; press F10 to save and exit", "C. Press F1 to enter BIOS; press F5 to save and exit", "D. Press Tab to enter BIOS; press Alt+F4 to save and exit"], "answer": "B", "explanation": "According to Ch.05 pp. 298, 311, and 315, press Delete or F4 when the boot menu is displayed to enter the BIOS, use + or - to change boot order, and press F10 to save configuration changes and exit."}, {"id": "h6_s3_q3", "type": "multiple", "question": "In the BIOS Power-On Self-Test (POST) sequence (Ch.05, p. 312), which of the following steps occur BEFORE the BIOS attempts OS startup?", "options": ["A. Initialization of the data bus and control bus", "B. CPU self-check and Memory self-check", "C. Graphics card self-check and Self-check of drives and other peripheral devices", "D. Result presentation in the form of beep codes or on-screen messages"], "answer": "ABCD", "explanation": "All four steps occur in that exact sequence during POST before the BIOS hands over control to OS startup (Ch.05, p.312)."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-Querying-and-Configuring-RAID-and-JBOD", "exercise_slug": "08-Exercise-Avago-MegaRAID-9460-and-iBMC-Storage-Lab", "lecture": {"title": "Querying & Configuring RAID and JBOD (BIOS & iBMC WebUI)", "duration_mins": 8, "pdf_ref": "Ch.05, pp. 318–325", "objectives": ["Query RAID controller card models on iBMC (`System > System Info > Others`) and understand Avago MegaRAID SAS 9460-8i drive/span limits", "Explain JBOD (Just a Bunch of Drives) drive passthrough", "Configure hardware RAID via VNC/BIOS (`Advanced > Avago MegaRAID > Main Menu > Configuration Management > Create Virtual Drive`) and via iBMC WebUI (`System > Storage Management`)"], "content_markdown": "### 1. Querying RAID Info & Avago MegaRAID SAS 9460-8i Specifications (pp. 319–320)\n- **Querying RAID Card Model in iBMC WebUI (p. 319)**: Choose **`System > System Info`**, then click the **`Others`** tab page to view the model of the RAID controller card.\n- **Avago MegaRAID SAS 9460-8i Supported RAID Levels & Drive Quantities (p. 320)**:\n  - **RAID 00 is NOT supported!**\n\n| RAID Level | Total Drives Supported | Spans | Drives per Span | Allowed Failed Drives (p. 320) |\n| :--- | :--- | :---: | :---: | :--- |\n| **RAID 0** | **1 to 32** | N/A | N/A | **0** |\n| **RAID 1** | **Even numbers from 2 to 32** | N/A | N/A | **Half the number of drives** |\n| **RAID 5** | **3 to 32** | N/A | N/A | **1** |\n| **RAID 6** | **3 to 32** (controller table) | N/A | N/A | **2** |\n| **RAID 10** | **Even numbers from 4 to 240** | **2 to 8** RAID 1 | Even numbers **2 to 32** | **Number of spans** (1 per span) |\n| **RAID 50** | **6 to 240** | **2 to 8** RAID 5 | **3 to 32** | **Number of spans** (1 per span) |\n| **RAID 60** | **6 to 240** | **2 to 8** RAID 6 | **3 to 32** | **Twice the number of spans** (2 per span) |\n\n---\n\n### 2. JBOD Drive Passthrough (p. 321)\n- **JBOD (*Just a Bunch of Drives*, pp. 321, 349)**: Also known as **drive passthrough** or **transparent transmission**.\n- **Mechanism**: Bypasses RAID array processing so the RAID controller card transmits user commands directly to connected physical drives, allowing upper-layer services, SDS (like Ceph/FusionStorage), or OS installers to directly access raw physical drives.\n- **OS Installation Impact**: If a RAID controller card **does NOT support passthrough (JBOD)**, you **cannot** install an OS directly on raw physical drives mounted to the card — you **must first configure a virtual drive (RAID)** under the controller card!\n\n---\n\n### 3. Configuring RAID via VNC (BIOS) and via iBMC WebUI (pp. 322–325)\n- **Method 1 — Using VNC / BIOS Configuration Utility (pp. 322–323)**:\n  1. In BIOS **`Advanced`** tab, select the Avago RAID controller card \\rightarrow **`Main Menu > Configuration Management > Create Virtual Drive`**.\n  2. Configure parameters:\n     - **Select RAID Level** (e.g., RAID 1)\n     - **Select Drives From**: **`Unconfigured Capacity`** (free drives not in any virtual drive) or **`Free Capacity`** (unused space in an existing drive group)\n     - **Select Drives**: Use arrow keys and **`Space` bar** to select member drives \\rightarrow **`Apply Changes`**\n     - **Access Policy**: **`Read/Write`**, **`Read Only`**, or **`Blocked`**\n- **Method 2 — Using iBMC WebUI (pp. 324–325)**:\n  1. Choose **`System > Storage Management`**, expand **`PCIe Card`**, and click **`Add`** next to the RAID card to open **Create Logical Drive**.\n  2. Example (p. 325): Set **Name** = `Data`, **Initialization State** = `Quick Init`, **RAID Level** = `5`. With **four 8 TB SATA HDDs** installed, each 8 TB decimal HDD has an actual binary available capacity of about **`7.2 TB`** in Storage Management (so a 4-drive RAID 5 provides 3 \× 7.2\ TB \≈ 21.6\ TB).", "key_takeaways": ["View the RAID controller card model in iBMC WebUI under System > System Info > Others; configure RAID in iBMC WebUI under System > Storage Management.", "Avago MegaRAID SAS 9460-8i supports up to 32 drives for single arrays (RAID 0/1/5/6) and up to 240 drives across 2 to 8 spans for spanned arrays (RAID 10/50/60). RAID 00 is NOT supported.", "JBOD (Just a Bunch of Drives) is drive passthrough. If a RAID card does NOT support passthrough, you can only install an OS on virtual drives (RAID volumes) configured on the card.", "In the BIOS RAID utility (Advanced > Avago MegaRAID > Main Menu > Configuration Management > Create Virtual Drive), press the Space bar to select drives, and note that an 8 TB decimal HDD shows ~7.2 TB actual capacity."], "exam_traps": ["EXAM TRAP: If a RAID controller card does not have JBOD (passthrough) enabled or supported, the OS installer will see ZERO disks until you create a Virtual Drive / Logical Drive!", "EXAM TRAP: In the BIOS RAID utility, 'Unconfigured Capacity' refers to free physical drives not added to any virtual drive, whereas 'Free Capacity' refers to unused space within an existing drive group (p. 322)."], "content_html": "<h3>1. Querying RAID Info &amp; Avago MegaRAID SAS 9460-8i Specifications (pp. 319–320)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Querying RAID Card Model in iBMC WebUI (p. 319)<\/strong>: Choose <strong><code class=\"inline-code\">System &gt; System Info<\/code><\/strong>, then click the <strong><code class=\"inline-code\">Others<\/code><\/strong> tab page to view the model of the RAID controller card.<\/li>\n<li><strong>Avago MegaRAID SAS 9460-8i Supported RAID Levels &amp; Drive Quantities (p. 320)<\/strong>:<\/li>\n<li><strong>RAID 00 is NOT supported!<\/strong><\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>RAID Level<\/th><th>Total Drives Supported<\/th><th>Spans<\/th><th>Drives per Span<\/th><th>Allowed Failed Drives (p. 320)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>RAID 0<\/strong><\/td><td><strong>1 to 32<\/strong><\/td><td>N/A<\/td><td>N/A<\/td><td><strong>0<\/strong><\/td><\/tr>\n<tr><td><strong>RAID 1<\/strong><\/td><td><strong>Even numbers from 2 to 32<\/strong><\/td><td>N/A<\/td><td>N/A<\/td><td><strong>Half the number of drives<\/strong><\/td><\/tr>\n<tr><td><strong>RAID 5<\/strong><\/td><td><strong>3 to 32<\/strong><\/td><td>N/A<\/td><td>N/A<\/td><td><strong>1<\/strong><\/td><\/tr>\n<tr><td><strong>RAID 6<\/strong><\/td><td><strong>3 to 32<\/strong> (controller table)<\/td><td>N/A<\/td><td>N/A<\/td><td><strong>2<\/strong><\/td><\/tr>\n<tr><td><strong>RAID 10<\/strong><\/td><td><strong>Even numbers from 4 to 240<\/strong><\/td><td><strong>2 to 8<\/strong> RAID 1<\/td><td>Even numbers <strong>2 to 32<\/strong><\/td><td><strong>Number of spans<\/strong> (1 per span)<\/td><\/tr>\n<tr><td><strong>RAID 50<\/strong><\/td><td><strong>6 to 240<\/strong><\/td><td><strong>2 to 8<\/strong> RAID 5<\/td><td><strong>3 to 32<\/strong><\/td><td><strong>Number of spans<\/strong> (1 per span)<\/td><\/tr>\n<tr><td><strong>RAID 60<\/strong><\/td><td><strong>6 to 240<\/strong><\/td><td><strong>2 to 8<\/strong> RAID 6<\/td><td><strong>3 to 32<\/strong><\/td><td><strong>Twice the number of spans<\/strong> (2 per span)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. JBOD Drive Passthrough (p. 321)<\/h3>\n<ul class=\"md-list\">\n<li>**JBOD (<em>Just a Bunch of Drives<\/em>, pp. 321, 349)<strong>: Also known as <\/strong>drive passthrough<strong> or <\/strong>transparent transmission**.<\/li>\n<li><strong>Mechanism<\/strong>: Bypasses RAID array processing so the RAID controller card transmits user commands directly to connected physical drives, allowing upper-layer services, SDS (like Ceph/FusionStorage), or OS installers to directly access raw physical drives.<\/li>\n<li><strong>OS Installation Impact<\/strong>: If a RAID controller card <strong>does NOT support passthrough (JBOD)<\/strong>, you <strong>cannot<\/strong> install an OS directly on raw physical drives mounted to the card — you <strong>must first configure a virtual drive (RAID)<\/strong> under the controller card!<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Configuring RAID via VNC (BIOS) and via iBMC WebUI (pp. 322–325)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Method 1 — Using VNC / BIOS Configuration Utility (pp. 322–323)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>In BIOS <strong><code class=\"inline-code\">Advanced<\/code><\/strong> tab, select the Avago RAID controller card \\rightarrow <strong><code class=\"inline-code\">Main Menu &gt; Configuration Management &gt; Create Virtual Drive<\/code><\/strong>.<\/li>\n<li>Configure parameters:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Select RAID Level<\/strong> (e.g., RAID 1)<\/li>\n<li><strong>Select Drives From<\/strong>: <strong><code class=\"inline-code\">Unconfigured Capacity<\/code><\/strong> (free drives not in any virtual drive) or <strong><code class=\"inline-code\">Free Capacity<\/code><\/strong> (unused space in an existing drive group)<\/li>\n<li><strong>Select Drives<\/strong>: Use arrow keys and <strong><code class=\"inline-code\">Space<\/code> bar<\/strong> to select member drives \\rightarrow <strong><code class=\"inline-code\">Apply Changes<\/code><\/strong><\/li>\n<li><strong>Access Policy<\/strong>: <strong><code class=\"inline-code\">Read/Write<\/code><\/strong>, <strong><code class=\"inline-code\">Read Only<\/code><\/strong>, or <strong><code class=\"inline-code\">Blocked<\/code><\/strong><\/li>\n<li><strong>Method 2 — Using iBMC WebUI (pp. 324–325)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Choose <strong><code class=\"inline-code\">System &gt; Storage Management<\/code><\/strong>, expand <strong><code class=\"inline-code\">PCIe Card<\/code><\/strong>, and click <strong><code class=\"inline-code\">Add<\/code><\/strong> next to the RAID card to open <strong>Create Logical Drive<\/strong>.<\/li>\n<li>Example (p. 325): Set <strong>Name<\/strong> = <code class=\"inline-code\">Data<\/code>, <strong>Initialization State<\/strong> = <code class=\"inline-code\">Quick Init<\/code>, <strong>RAID Level<\/strong> = <code class=\"inline-code\">5<\/code>. With <strong>four 8 TB SATA HDDs<\/strong> installed, each 8 TB decimal HDD has an actual binary available capacity of about <strong><code class=\"inline-code\">7.2 TB<\/code><\/strong> in Storage Management (so a 4-drive RAID 5 provides 3 \× 7.2\ TB \≈ 21.6\ TB).<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: Avago MegaRAID & iBMC Storage Configuration", "duration_mins": 8, "exercise_type": "config", "prompt_label": "storage-admin@ibmc-webui:~#", "scenario": "Configure a RAID 5 logical volume named 'Data' across four 8 TB SATA HDDs on a TaiShan 200 (2280) server via iBMC WebUI and verify JBOD and BIOS RAID settings.", "instructions": ["Set `ibmc_raid_query_path` to `'System > System Info > Others'` and `ibmc_raid_config_path` to `'System > Storage Management'`.", "Set `passthrough_mode_name` to `'JBOD'` and `unsupported_raid_level` to `'RAID 00'`.", "For four 8 TB HDDs (`7.2` TB actual capacity each) in RAID 5, set `single_8tb_actual_tb` to `7.2` and `raid5_usable_tb` to `21.6`."], "starter_code": "# TaiShan 2280 Hardware RAID & JBOD Configuration\nibmc_navigation:\n  ibmc_raid_query_path: \"___\"\n  ibmc_raid_config_path: \"___\"\n\ncontroller_capabilities:\n  passthrough_mode_name: \"___\"\n  unsupported_raid_level: \"___\"\n  spanned_array_max_spans: 8\n  spanned_array_max_drives: 240\n\nlogical_drive_data:\n  name: \"Data\"\n  init_state: \"Quick Init\"\n  raid_level: 5\n  single_8tb_actual_tb: ___\n  raid5_usable_tb: ___\n", "solution_code": "# TaiShan 2280 Hardware RAID & JBOD Configuration\nibmc_navigation:\n  ibmc_raid_query_path: \"System > System Info > Others\"\n  ibmc_raid_config_path: \"System > Storage Management\"\n\ncontroller_capabilities:\n  passthrough_mode_name: \"JBOD\"\n  unsupported_raid_level: \"RAID 00\"\n  spanned_array_max_spans: 8\n  spanned_array_max_drives: 240\n\nlogical_drive_data:\n  name: \"Data\"\n  init_state: \"Quick Init\"\n  raid_level: 5\n  single_8tb_actual_tb: 7.2\n  raid5_usable_tb: 21.6\n", "hints": ["Query RAID card model at System > System Info > Others; configure RAID at System > Storage Management.", "Drive passthrough is JBOD; RAID 00 is not supported; an 8 TB HDD has ~7.2 TB actual capacity (3 × 7.2 = 21.6 TB in 4-disk RAID 5)."], "validation_checks": [{"step": 1, "description": "Verify iBMC System Info > Others and System > Storage Management paths", "required_any": ["system info", "storage management"], "feedback_fail": "Set ibmc_raid_query_path to 'System > System Info > Others' and ibmc_raid_config_path to 'System > Storage Management'."}, {"step": 2, "description": "Verify JBOD passthrough and RAID 00 restriction", "required_any": ["jbod", "raid 00"], "feedback_fail": "Set passthrough_mode_name to 'JBOD' and unsupported_raid_level to 'RAID 00'."}, {"step": 3, "description": "Verify 7.2 TB actual drive capacity and 21.6 TB RAID 5 capacity", "required_any": ["7.2", "21.6"], "feedback_fail": "Set single_8tb_actual_tb = 7.2 and raid5_usable_tb = 21.6."}], "simulated_output": "[OK] RAID Controller & Logical Drive Configuration Validated:\n- Query Path: System > System Info > Others (Avago MegaRAID SAS 9460-8i)\n- Config Path: System > Storage Management -> Logical Drive 'Data' (RAID 5, Quick Init)\n- Member Drives: 4 x 8 TB SATA HDD (7.2 TB actual each) -> 21.6 TB Usable Capacity.", "quiz_questions": [{"id": "h6_s4_q1", "type": "single", "question": "Which feature of a RAID controller card, also known as drive passthrough or transparent transmission, allows commands to be directly transmitted to connected physical drives without creating a RAID virtual drive?", "options": ["A. Hot Spare", "B. JBOD (Just a Bunch of Drives)", "C. Changed Block Tracking (CBT)", "D. Preboot Execution Environment (PXE)"], "answer": "B", "explanation": "According to Ch.05 pp. 321 and 349, JBOD (Just a Bunch of Drives), also known as drive passthrough or transparent transmission, allows user commands to be directly transmitted to connected drives."}, {"id": "h6_s4_q2", "type": "single", "question": "On the iBMC WebUI of a TaiShan 200 (model 2280) server, where do you view the model of the RAID controller card, and where do you create or manage RAID logical drives?", "options": ["A. View model at System > System Info > Others; configure RAID at System > Storage Management", "B. View model at Services > VNC; configure RAID at User & Security > Local Users", "C. View model at Maintenance > System Logs; configure RAID at iBMC Settings > Network Settings", "D. View model at Home > Virtual Console; configure RAID at Power > Power Control"], "answer": "A", "explanation": "According to Ch.05 pp. 319 and 324, you view the RAID controller card model at System > System Info (Others tab) and configure RAID logical drives at System > Storage Management."}, {"id": "h6_s4_q3", "type": "multiple", "question": "When configuring a virtual drive in the BIOS Avago MegaRAID Configuration Utility via VNC (Ch.05, pp. 320, 322), which of the following statements are true?", "options": ["A. Under 'Select Drives From', 'Unconfigured Capacity' refers to free drives that are not added to any virtual drives, whereas 'Free Capacity' refers to drive group space not used by any virtual drives.", "B. Virtual drive access policies include Read/Write, Read Only, and Blocked.", "C. Each span of a RAID 10 or RAID 50 array allows for 1 failed drive, while each span of a RAID 60 array allows for 2 failed drives.", "D. Avago MegaRAID SAS 9460-8i natively supports RAID 00 across up to 16 spans."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.05, pp. 320, 322). D is false because Ch.05 p.320 explicitly notes that RAID 00 is NOT supported and spanned arrays support 2 to 8 spans."}]}}]}, {"hour_number": 7, "folder_name": "Hour-07-OS-Driver-and-Service-Deployment", "title": "OS Compatibility, openEuler 22.03 LTS Installation, Drivers/Firmware & Service Deployment", "chapter_ref": "Chapter 05 Part 2 (pp. 326–350)", "duration_mins": 60, "overview": "Master server OS/component compatibility checking, mounting `openEuler-22.03-LTS-aarch64-dvd.iso` via DVD-ROM boot option (Ch.05 Quiz!), custom drive partitioning, Initial vs. Overwrite installation order of Drivers and Firmware, FTP (`vsftpd`) & Private Yum Repository setup, Postfix + Dovecot Mail Server protocols, and openGauss deployment (`gs_preinstall` & `gs_install`).", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-OS-Compatibility-and-openEuler-2203-LTS-Installation", "exercise_slug": "02-Exercise-Mounting-ISO-and-openEuler-Partitioning-Lab", "lecture": {"title": "OS Compatibility & Installing openEuler 22.03 LTS on TaiShan 2280", "duration_mins": 7, "pdf_ref": "Ch.05, pp. 326–332, 346", "objectives": ["Verify OS and hardware component compatibility using the Kunpeng Computing Compatibility Checker before OS installation", "Mount `openEuler-22.03-LTS-aarch64-dvd.iso` via the iBMC Remote Virtual Console and select the DVD-ROM drive boot option (Ch.05 Quiz Q1!)", "Trace the complete openEuler 22.03 LTS installation flow and custom storage partitioning (`/boot`, `/boot/efi`, `swap`, `/`)"], "content_markdown": "### 1. Server OS & Component Compatibility Check (pp. 327–328)\n- Before installing an OS on a server, you **must check both OS compatibility and component compatibility** of the server.\n- **TaiShan 200 (model 2280) Supported OSs**: Supports **CentOS, Ubuntu, openEuler**, SUSE, Kylin, EulerOS, etc.\n- **Official Tool**: Query the **Kunpeng Computing Compatibility Checker** (`https://info.support.huawei.com/computing/ftca/en/product/taishan-server`).\n\n---\n\n### 2. Mounting an ISO File & Boot Option Selection (p. 329 — Official Quiz Q1!)\nTo install **openEuler 22.03 LTS (`openEuler-22.03-LTS-aarch64-dvd.iso`)** via the iBMC WebUI:\n1. Log in to the **Remote Virtual Console** through the iBMC WebUI.\n2. On the virtual console menu bar, mount the image file **`openEuler-22.03-LTS-aarch64-dvd.iso`** to the virtual **DVD-ROM** and change the boot option to **`DVD-ROM drive`** (Official Ch.05 Quiz Q1 on p. 346!).\n3. Restart the server and select **`Install openEuler 22.03-LTS`** in the GRUB installation menu.\n4. Select the language for installation on the openEuler welcome page.\n\n---\n\n### 3. Complete openEuler 22.03 LTS Installation Workflow & Partitioning (pp. 330–332)\n```\n[OS language selection]\n         |\n         v\n[Installation Summary Page]\n  |-- 1. Software selection (e.g., Minimal Install / Server with GUI)\n  |-- 2. Installation drive & Partition configuration (Automatic vs. Custom)\n  |-- 3. Optional configurations:\n  |       - Root password setting\n  |       - User creation\n  |       - Network configuration\n  |       - Host name configuration\n         |\n         v\n[OS installation] --> [Reboot and ISO file detachment]\n```\n- **Partition Configuration (pp. 331–332)**:\n  - By default, partitions are configured **automatically**; select **`Custom`** under *Storage Configuration* for manual partitioning.\n  - Standard UEFI AArch64 partitions on TaiShan 200:\n    - **`/boot/efi`**: EFI System Partition (required for UEFI boot on Arm64)\n    - **`/boot`**: Stores kernel and initramfs boot loader files\n    - **`swap`**: Virtual memory swap partition\n    - **`/`**: Root file system partition\n  - Once installation completes, **detach the ISO file** from the virtual DVD-ROM and click **Reboot System**.", "key_takeaways": ["Always check both OS compatibility and component compatibility using the Kunpeng Computing Compatibility Checker before installing an OS.", "To install openEuler using `openEuler-22.03-LTS-aarch64-dvd.iso` on the iBMC Remote Virtual Console, select the 'DVD-ROM drive' boot option (Ch.05 Quiz Q1).", "Partitions are configured automatically by default; choose 'Custom' under Storage Configuration to manually create `/boot/efi`, `/boot`, `swap`, and `/`, and detach the ISO before rebooting."], "exam_traps": ["EXAM TRAP (Ch.05 Quiz Q1): 'To install the OS using the openEuler-22.03-LTS-aarch64-dvd.iso file, which of the following boot options needs to be used?' -> B. DVD-ROM drive (NOT Hard disk drive, Floppy drive, or PXE)!", "EXAM TRAP: Remember to detach the virtual ISO file at the end of OS installation before rebooting, or the server may boot back into the installer if DVD-ROM is set as permanent first boot device."], "content_html": "<h3>1. Server OS &amp; Component Compatibility Check (pp. 327–328)<\/h3>\n<ul class=\"md-list\">\n<li>Before installing an OS on a server, you <strong>must check both OS compatibility and component compatibility<\/strong> of the server.<\/li>\n<li><strong>TaiShan 200 (model 2280) Supported OSs<\/strong>: Supports <strong>CentOS, Ubuntu, openEuler<\/strong>, SUSE, Kylin, EulerOS, etc.<\/li>\n<li><strong>Official Tool<\/strong>: Query the <strong>Kunpeng Computing Compatibility Checker<\/strong> (<code class=\"inline-code\">https://info.support.huawei.com/computing/ftca/en/product/taishan-server<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Mounting an ISO File &amp; Boot Option Selection (p. 329 — Official Quiz Q1!)<\/h3>\n<p>To install <strong>openEuler 22.03 LTS (<code class=\"inline-code\">openEuler-22.03-LTS-aarch64-dvd.iso<\/code>)<\/strong> via the iBMC WebUI:<\/p>\n<ol class=\"md-list\">\n<li>Log in to the <strong>Remote Virtual Console<\/strong> through the iBMC WebUI.<\/li>\n<li>On the virtual console menu bar, mount the image file <strong><code class=\"inline-code\">openEuler-22.03-LTS-aarch64-dvd.iso<\/code><\/strong> to the virtual <strong>DVD-ROM<\/strong> and change the boot option to <strong><code class=\"inline-code\">DVD-ROM drive<\/code><\/strong> (Official Ch.05 Quiz Q1 on p. 346!).<\/li>\n<li>Restart the server and select <strong><code class=\"inline-code\">Install openEuler 22.03-LTS<\/code><\/strong> in the GRUB installation menu.<\/li>\n<li>Select the language for installation on the openEuler welcome page.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. Complete openEuler 22.03 LTS Installation Workflow &amp; Partitioning (pp. 330–332)<\/h3>\n<div class=\"code-block\"><div class=\"code-header\"><span>BASH<\/span><button class=\"copy-btn\" onclick=\"copyCodeBlock(this)\">Copy<\/button><\/div><pre><code>[OS language selection]\n         |\n         v\n[Installation Summary Page]\n  |-- 1. Software selection (e.g., Minimal Install / Server with GUI)\n  |-- 2. Installation drive &amp; Partition configuration (Automatic vs. Custom)\n  |-- 3. Optional configurations:\n  |       - Root password setting\n  |       - User creation\n  |       - Network configuration\n  |       - Host name configuration\n         |\n         v\n[OS installation] --&gt; [Reboot and ISO file detachment]<\/code><\/pre><\/div>\n<ul class=\"md-list\">\n<li><strong>Partition Configuration (pp. 331–332)<\/strong>:<\/li>\n<li>By default, partitions are configured <strong>automatically<\/strong>; select <strong><code class=\"inline-code\">Custom<\/code><\/strong> under <em>Storage Configuration<\/em> for manual partitioning.<\/li>\n<li>Standard UEFI AArch64 partitions on TaiShan 200:<\/li>\n<li><strong><code class=\"inline-code\">/boot/efi<\/code><\/strong>: EFI System Partition (required for UEFI boot on Arm64)<\/li>\n<li><strong><code class=\"inline-code\">/boot<\/code><\/strong>: Stores kernel and initramfs boot loader files<\/li>\n<li><strong><code class=\"inline-code\">swap<\/code><\/strong>: Virtual memory swap partition<\/li>\n<li><strong><code class=\"inline-code\">/<\/code><\/strong>: Root file system partition<\/li>\n<li>Once installation completes, <strong>detach the ISO file<\/strong> from the virtual DVD-ROM and click <strong>Reboot System<\/strong>.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Virtual DVD-ROM Mounting & openEuler 22.03 LTS Partitioning", "duration_mins": 7, "exercise_type": "config", "prompt_label": "anaconda@openeuler-installer:~#", "scenario": "Configure the Kickstart/Anaconda installation parameters for deploying `openEuler-22.03-LTS-aarch64-dvd.iso` on a TaiShan 200 (2280) server via the iBMC Remote Virtual Console.", "instructions": ["Set `iso_boot_option` to `'DVD-ROM drive'` and `iso_filename` to `'openEuler-22.03-LTS-aarch64-dvd.iso'`.", "Set `manual_partition_mode` to `'Custom'`.", "Specify the EFI partition mount point as `'/boot/efi'` and root partition mount point as `'/'`."], "starter_code": "# openEuler 22.03 LTS AArch64 Installation Spec\nvirtual_media_boot:\n  iso_filename: \"___\"\n  iso_boot_option: \"___\"\n  post_install_action: \"Reboot and ISO file detachment\"\n\nstorage_partitioning:\n  default_partition_mode: \"Automatic\"\n  manual_partition_mode: \"___\"\n  mount_points:\n    - \"___\"\n    - \"/boot\"\n    - \"swap\"\n    - \"___\"\n", "solution_code": "# openEuler 22.03 LTS AArch64 Installation Spec\nvirtual_media_boot:\n  iso_filename: \"openEuler-22.03-LTS-aarch64-dvd.iso\"\n  iso_boot_option: \"DVD-ROM drive\"\n  post_install_action: \"Reboot and ISO file detachment\"\n\nstorage_partitioning:\n  default_partition_mode: \"Automatic\"\n  manual_partition_mode: \"Custom\"\n  mount_points:\n    - \"/boot/efi\"\n    - \"/boot\"\n    - \"swap\"\n    - \"/\"\n", "hints": ["Mounting `openEuler-22.03-LTS-aarch64-dvd.iso` uses the 'DVD-ROM drive' boot option (Ch.05 Quiz Q1).", "Manual partitioning is enabled by choosing 'Custom' under Storage Configuration, with `/boot/efi`, `/boot`, `swap`, and `/`."], "validation_checks": [{"step": 1, "description": "Specify openEuler-22.03-LTS-aarch64-dvd.iso and DVD-ROM drive boot option", "required_any": ["dvd-rom", "openeuler-22.03-lts-aarch64-dvd.iso"], "feedback_fail": "Set iso_filename to 'openEuler-22.03-LTS-aarch64-dvd.iso' and iso_boot_option to 'DVD-ROM drive'."}, {"step": 2, "description": "Specify Custom mode for manual partitioning", "required_any": ["custom"], "feedback_fail": "Set manual_partition_mode to 'Custom'."}, {"step": 3, "description": "Specify /boot/efi and / mount points", "required_any": ["/boot/efi"], "feedback_fail": "Include '/boot/efi' and '/' in mount_points."}], "simulated_output": "[OK] openEuler 22.03 LTS Installation Configuration Verified:\n- Boot Option: DVD-ROM drive (openEuler-22.03-LTS-aarch64-dvd.iso)\n- Storage Configuration: Custom (/boot/efi, /boot, swap, /)\n- Post-Install: Reboot and ISO file detachment.", "quiz_questions": [{"id": "h7_s1_q1", "type": "single", "question": "(Official Ch.05 Quiz Q1) To install the OS using the openEuler-22.03-LTS-aarch64-dvd.iso file, which of the following boot options needs to be used?", "options": ["A. Hard disk drive", "B. DVD-ROM drive", "C. Floppy drive", "D. PXE"], "answer": "B", "explanation": "According to Ch.05 p.329 and p.346 Quiz Q1, when mounting an ISO image (`openEuler-22.03-LTS-aarch64-dvd.iso`) via the virtual console, you must select the DVD-ROM drive boot option."}, {"id": "h7_s1_q2", "type": "single", "question": "Before installing an operating system on a TaiShan 200 (model 2280) server, which two types of compatibility must be verified using the Kunpeng Computing Compatibility Checker?", "options": ["A. Only cabinet color and room lighting compatibility", "B. OS compatibility and component compatibility", "C. Browser font and mouse pad compatibility", "D. Only PS/2 keyboard compatibility"], "answer": "B", "explanation": "According to Ch.05 pp. 327–328, before installing an OS on a server, you must check the OS compatibility and component compatibility of the server using the Kunpeng Computing Compatibility Checker."}, {"id": "h7_s1_q3", "type": "tf", "question": "During openEuler 22.03 LTS installation, drive partitions are configured automatically by default, and you can select 'Custom' under Storage Configuration if manual partitioning is required.", "options": ["A. True", "B. False"], "answer": "A", "explanation": "True. According to Ch.05 p.331, partitions are configured automatically by default, and you can choose 'Custom' under Storage Configuration for manual partitioning."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-Differences-Between-Drivers-and-Firmware-and-Installation", "exercise_slug": "04-Exercise-Initial-vs-Overwrite-Driver-Firmware-Install-Lab", "lecture": {"title": "Differences Between Drivers and Firmware & Installation Workflows", "duration_mins": 7, "pdf_ref": "Ch.05, pp. 333–335", "objectives": ["Contrast Device Drivers (serves software, bridges hardware and OS) with Firmware (serves hardware, pre-installed in ROM, OS-independent)", "Understand privilege requirements (root to install, non-root running user for isolation) and 3 driver installation methods", "Master the exact order difference between Initial Installation (Driver -> Firmware) and Overwrite Installation (Firmware -> Driver)!"], "content_markdown": "### 1. Differences Between Drivers and Firmware (p. 334)\nBoth drivers and firmware are code, but they operate at different layers with distinct purposes:\n\n| Dimension | Device Driver | Firmware |\n| :--- | :--- | :--- |\n| **Primary Target** | **Serves software (OS)** | **Serves hardware** |\n| **Role & Positioning** | Acts as the **\"bridge between hardware and OSs\"**; provides the OS with control over hardware devices (printers, GPUs, NICs, audio/RAID cards). | **Pre-installed in the Read-Only Memory (ROM / Flash)** of a hardware product; tightly integrated with hardware. |\n| **OS Dependency** | **OS-specific**: Must be installed in and compatible with the specific OS and kernel version. | **OS-independent**: Operates independently of the OS and is not designed with OS compatibility in mind. |\n\n---\n\n### 2. Privileges & Three Driver Package Installation Methods (p. 335)\n- **Privilege & Isolation Rule**: Installing a driver and firmware **requires `root` privileges**, but once installed, they can be used by **any user**. Therefore, a dedicated **non-root hardware running user** is created to run service hardware, implementing permission control and user isolation.\n- **Three Driver Installation Methods (p. 335)**:\n  1. **Reconstructed driver package**: Used when **driver customization is required** (reconstruct the driver package and install it).\n  2. **Source code compilation**: Used when driver customization is **not** required.\n  3. **Binary driver file**: Used when driver customization is **not** required **AND** the OS kernel version in the environment is listed in the **version mapping table**.\n\n---\n\n### 3. Initial Installation vs. Overwrite Installation Order (p. 335 — High-Yield Exam Trap!)\nLook carefully at the official flowchart on **Ch.05 Page 335**:\n1. **Common Preparation Steps**:\n   `Start` \\rightarrow `Check the OS` \\rightarrow `Obtain the software package` \\rightarrow `Create a hardware running user`\n2. **Branch A — Initial Installation (brand-new hardware without driver/firmware)**:\n   - **Step 1**: **Install the driver** first! (Because the OS needs the driver to communicate with the hardware card to flash its firmware.)\n   - **Step 2**: **Install the firmware** second!\n3. **Branch B — Overwrite Installation (upgrading a device that already has a driver and firmware installed)**:\n   - **Step 1**: **Install the firmware** first! (Using the existing working driver.)\n   - **Step 2**: **Install the driver** second!", "key_takeaways": ["Drivers serve software and act as 'bridges between hardware and OSs' (OS-dependent); Firmware serves hardware, is stored in hardware ROM, and operates independently of the OS.", "Driver/firmware installation requires root privileges, plus creating a non-root hardware running user for permission isolation.", "CRITICAL FLOWCHART RULE (p. 335): In Initial Installation, install the DRIVER first, then the FIRMWARE. In Overwrite Installation (upgrade), install the FIRMWARE first, then the DRIVER!"], "exam_traps": ["EXAM TRAP (Ch.05, p. 335 Flowchart): Do not mix up Initial vs. Overwrite installation order! Initial installation = Driver FIRST -> Firmware SECOND. Overwrite installation = Firmware FIRST -> Driver SECOND!", "EXAM TRAP: If driver customization is required, you must reconstruct the driver package and install it; a binary driver file can only be installed directly if the kernel version is in the version mapping table."], "content_html": "<h3>1. Differences Between Drivers and Firmware (p. 334)<\/h3>\n<p>Both drivers and firmware are code, but they operate at different layers with distinct purposes:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Dimension<\/th><th>Device Driver<\/th><th>Firmware<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Primary Target<\/strong><\/td><td><strong>Serves software (OS)<\/strong><\/td><td><strong>Serves hardware<\/strong><\/td><\/tr>\n<tr><td><strong>Role &amp; Positioning<\/strong><\/td><td>Acts as the <strong>\"bridge between hardware and OSs\"<\/strong>; provides the OS with control over hardware devices (printers, GPUs, NICs, audio/RAID cards).<\/td><td><strong>Pre-installed in the Read-Only Memory (ROM / Flash)<\/strong> of a hardware product; tightly integrated with hardware.<\/td><\/tr>\n<tr><td><strong>OS Dependency<\/strong><\/td><td><strong>OS-specific<\/strong>: Must be installed in and compatible with the specific OS and kernel version.<\/td><td><strong>OS-independent<\/strong>: Operates independently of the OS and is not designed with OS compatibility in mind.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Privileges &amp; Three Driver Package Installation Methods (p. 335)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Privilege &amp; Isolation Rule<\/strong>: Installing a driver and firmware <strong>requires <code class=\"inline-code\">root<\/code> privileges<\/strong>, but once installed, they can be used by <strong>any user<\/strong>. Therefore, a dedicated <strong>non-root hardware running user<\/strong> is created to run service hardware, implementing permission control and user isolation.<\/li>\n<li><strong>Three Driver Installation Methods (p. 335)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Reconstructed driver package<\/strong>: Used when <strong>driver customization is required<\/strong> (reconstruct the driver package and install it).<\/li>\n<li><strong>Source code compilation<\/strong>: Used when driver customization is <strong>not<\/strong> required.<\/li>\n<li><strong>Binary driver file<\/strong>: Used when driver customization is <strong>not<\/strong> required <strong>AND<\/strong> the OS kernel version in the environment is listed in the <strong>version mapping table<\/strong>.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. Initial Installation vs. Overwrite Installation Order (p. 335 — High-Yield Exam Trap!)<\/h3>\n<p>Look carefully at the official flowchart on <strong>Ch.05 Page 335<\/strong>:<\/p>\n<ol class=\"md-list\">\n<li><strong>Common Preparation Steps<\/strong>:<\/li>\n<\/ol>\n<p><code class=\"inline-code\">Start<\/code> \\rightarrow <code class=\"inline-code\">Check the OS<\/code> \\rightarrow <code class=\"inline-code\">Obtain the software package<\/code> \\rightarrow <code class=\"inline-code\">Create a hardware running user<\/code><\/p>\n<ol class=\"md-list\">\n<li><strong>Branch A — Initial Installation (brand-new hardware without driver/firmware)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Step 1<\/strong>: <strong>Install the driver<\/strong> first! (Because the OS needs the driver to communicate with the hardware card to flash its firmware.)<\/li>\n<li><strong>Step 2<\/strong>: <strong>Install the firmware<\/strong> second!<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Branch B — Overwrite Installation (upgrading a device that already has a driver and firmware installed)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Step 1<\/strong>: <strong>Install the firmware<\/strong> first! (Using the existing working driver.)<\/li>\n<li><strong>Step 2<\/strong>: <strong>Install the driver<\/strong> second!<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Driver & Firmware Installation Workflow Sequencer", "duration_mins": 8, "exercise_type": "config", "prompt_label": "root@openeuler-node:~#", "scenario": "You are writing an automated Ansible playbook for TaiShan 200 accelerator/NIC cards that handles both Initial Installation and Overwrite Installation according to Huawei's official Ch.05 p.335 flowchart.", "instructions": ["Set `driver_serves` to `'software'` and `firmware_serves` to `'hardware'` (stored in `'ROM'`).", "For `initial_installation_order`, specify `['Install the driver', 'Install the firmware']`.", "For `overwrite_installation_order`, specify `['Install the firmware', 'Install the driver']`."], "starter_code": "# Driver vs. Firmware Installation Playbook Spec (Ch.05 p.335)\nconcepts:\n  driver_serves: \"___\"\n  firmware_serves: \"___\"\n  firmware_storage_medium: \"___\"\n  install_privilege_required: \"root\"\n\nworkflows:\n  common_pre_steps:\n    - \"Check the OS\"\n    - \"Obtain the software package\"\n    - \"Create a hardware running user\"\n  initial_installation_order:\n    - \"___\"\n    - \"___\"\n  overwrite_installation_order:\n    - \"___\"\n    - \"___\"\n", "solution_code": "# Driver vs. Firmware Installation Playbook Spec (Ch.05 p.335)\nconcepts:\n  driver_serves: \"software\"\n  firmware_serves: \"hardware\"\n  firmware_storage_medium: \"ROM\"\n  install_privilege_required: \"root\"\n\nworkflows:\n  common_pre_steps:\n    - \"Check the OS\"\n    - \"Obtain the software package\"\n    - \"Create a hardware running user\"\n  initial_installation_order:\n    - \"Install the driver\"\n    - \"Install the firmware\"\n  overwrite_installation_order:\n    - \"Install the firmware\"\n    - \"Install the driver\"\n", "hints": ["Drivers serve software; firmware serves hardware and is pre-installed in ROM.", "Initial installation installs the driver first, then the firmware; Overwrite installation installs the firmware first, then the driver (p. 335)."], "validation_checks": [{"step": 1, "description": "Verify software vs hardware and ROM storage for firmware", "required_any": ["software", "hardware", "rom"], "feedback_fail": "Set driver_serves to 'software', firmware_serves to 'hardware', and firmware_storage_medium to 'ROM'."}, {"step": 2, "description": "Verify Initial Installation order (Install the driver -> Install the firmware)", "required_any": ["install the driver"], "feedback_fail": "Include 'Install the driver' and 'Install the firmware' in the workflows."}, {"step": 3, "description": "Verify Overwrite Installation order (Install the firmware -> Install the driver)", "required_any": ["install the firmware"], "feedback_fail": "Make sure both 'Install the driver' and 'Install the firmware' are present in the correct order."}], "simulated_output": "[OK] Driver & Firmware Installation Workflows Validated (Ch.05 p.335):\n- Common Pre-Steps: Check OS -> Obtain Package -> Create Hardware Running User\n- Initial Installation: [1] Install the driver -> [2] Install the firmware\n- Overwrite Installation: [1] Install the firmware -> [2] Install the driver.", "quiz_questions": [{"id": "h7_s2_q1", "type": "single", "question": "According to the Driver and Firmware Installation flowchart in Chapter 05 (p. 335), what is the correct installation sequence for 'Initial installation' versus 'Overwrite installation' after creating a hardware running user?", "options": ["A. Initial installation: Install firmware then driver; Overwrite installation: Install driver then firmware", "B. Initial installation: Install driver then firmware; Overwrite installation: Install firmware then driver", "C. Both Initial and Overwrite installations must always install firmware before the driver", "D. Both Initial and Overwrite installations must always install the driver before firmware"], "answer": "B", "explanation": "According to the official flowchart on Ch.05 p.335, Initial installation installs the driver first and then the firmware; Overwrite installation installs the firmware first and then the driver."}, {"id": "h7_s2_q2", "type": "multiple", "question": "Which of the following statements accurately describe the differences between device drivers and firmware?", "options": ["A. Drivers serve software and act as 'bridges between hardware and OSs', whereas firmware serves hardware.", "B. Firmware is pre-installed in the ROM of a hardware product and operates independently of the OS.", "C. While installing a driver and firmware requires root privileges, once installed they can be used by a non-root user to achieve permission isolation.", "D. If driver customization is required, you must reconstruct the driver package and install it."], "answer": "ABCD", "explanation": "All four statements come directly from Ch.05 pp. 334–335."}, {"id": "h7_s2_q3", "type": "single", "question": "Under what condition can a binary driver file be used directly for installation without compiling from source code or reconstructing the driver package?", "options": ["A. Only when driver customization is required", "B. When driver customization is not required and the OS kernel in the environment is in the version mapping table", "C. Only on Windows 95 systems", "D. Never; Linux does not support binary driver files"], "answer": "B", "explanation": "According to Ch.05 p.335, if driver customization is not required and the kernel in the environment is in the version mapping table, you can use the binary driver file for installation."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Deploying-Enterprise-Services-FTP-Yum-and-Mail-Server", "exercise_slug": "06-Exercise-vsftpd-Private-Yum-Repo-and-Postfix-Dovecot-Lab", "lecture": {"title": "Deploying Enterprise Services on openEuler: FTP (`vsftpd`), Private Yum & Mail Server", "duration_mins": 8, "pdf_ref": "Ch.05, pp. 336–342", "objectives": ["Understand FTP user classifications (real, guest, anonymous), syslogd logging (`/var/log/`), `chroot` access restriction, and `vsftpd` security mechanisms", "Execute the 6-step deployment of an FTP-based private Yum repository", "Master Linux Mail Server architecture (`Postfix` SMTP + `Dovecot` POP3/IMAP), real vs. virtual users, and POP3 vs. IMAP synchronization"], "content_markdown": "### 1. FTP Server & `vsftpd` Security Architecture (pp. 337–338)\n- **Three Key FTP Server Functions (p. 337)**:\n  1. **User classification**: Classifies users into **real**, **guest**, and **anonymous** users with different permissions (e.g., anonymous users can only download resources, whereas real users have broader permissions).\n  2. **Command and file logs**: Uses the **`syslogd`** service to log command history and data transfer details (transfer time, file size) in **`/var/log/`**.\n  3. **Access restriction (`chroot`)**: Restricts a user to their home directory (**changed root / `chroot`**) so they cannot access sensitive system directories like `/etc`, `/home`, or `/usr/local`.\n- **Why `vsftpd` (*very secure FTP daemon*, p. 338)**: Standard FTP does **not** encrypt data during transmission. `vsftpd` enhances security in 3 ways:\n  1. Runs as an **unprivileged user** and enforces **`chroot`** environments.\n  2. Any command requiring elevated privileges is controlled by a **parent process running with the least privileges required**.\n  3. Integrates common Linux commands (`dir`, `ls`, `cd`) internally to reduce reliance on external binaries.\n\n---\n\n### 2. Six-Step FTP-Based Private Yum Repository Deployment (p. 339)\n1. **Step 1**: Create a Yum repository on the local host (e.g., using `createrepo` and configuring `.repo` files).\n2. **Step 2**: Install the FTP service (`vsftpd`) and enable it to start upon system startup (`systemctl enable --now vsftpd`).\n3. **Step 3**: Modify the `vsftpd` configuration file (`/etc/vsftpd/vsftpd.conf`) to **allow anonymous access and disable write permissions**.\n4. **Step 4**: **Disable the firewall and SELinux** (`systemctl stop firewalld`, `setenforce 0`).\n5. **Step 5**: Set automatic mounting (`/etc/fstab`).\n6. **Step 6**: Test the FTP service and Yum repository (`yum makecache`).\n\n---\n\n### 3. Linux Mail Server: Postfix (SMTP) + Dovecot (POP3/IMAP) (pp. 340–342)\n- **Mainstream Combination**: **Postfix + Dovecot** (often backed by MySQL, storing mail in `/var/mail/mydomain.com/myuser`):\n  - **Postfix**: Open-source Mail Transfer Agent providing the **SMTP (Simple Mail Transfer Protocol)** service for sending and relaying emails between mail servers (e.g., `me@huawei.com` \\rightarrow `smtp.huawei.com` \\rightarrow `smtp.gmail.com`, which saves the email to disk).\n  - **Dovecot**: Famous **POP3** and **IMAP** server implementation responsible **only for the path between the recipient's mail server and the recipient's email client (user agent)**.\n- **POP3 vs. IMAP (pp. 340, 342)**:\n  - **POP3 (Post Office Protocol v3)**: Downloads **entire emails** to the client device and then disconnects; actions on the client do not sync back to the server.\n  - **IMAP (Internet Message Access Protocol)**: Fetches **only key details (such as subjects/headers)** first and downloads full content **on demand**; **synchronizes actions** (deletion, marking as read) with the mail server so status is consistent across webmail and clients.\n- **Two Working Modes of a Postfix Email System (p. 341)**:\n  1. **Local Linux users** (`root@example.com`, limited by allowed number of OS users).\n  2. **Virtual users** (not associated with real Linux users; each has separate drive space; overcomes OS user count limits, enhances security, suitable for multi-user scenarios).", "key_takeaways": ["FTP classifies users into real, guest, and anonymous; logs via syslogd to /var/log/; and isolates users to their home directory using chroot.", "Six steps for an FTP-based private Yum repo: (1) Create local Yum repo -> (2) Install & enable FTP -> (3) Modify vsftpd config (allow anonymous, disable write) -> (4) Disable firewall & SELinux -> (5) Set automatic mounting -> (6) Test FTP.", "In a Linux mail server, Postfix provides SMTP (client-to-server and server-to-server sending/relaying), while Dovecot provides POP3/IMAP (server-to-recipient client retrieval).", "POP3 downloads entire emails and disconnects; IMAP fetches headers/subjects first, downloads full content on demand, and synchronizes read/delete state on the server."], "exam_traps": ["EXAM TRAP: POP3/IMAP (Dovecot) is ONLY responsible for retrieving mail from the recipient's mail server to the recipient's email client; sending mail from the client and relaying between mail servers (`smtp.huawei.com` -> `smtp.gmail.com`) both use SMTP (Postfix)!", "EXAM TRAP: In Step 3 of deploying an FTP-based private Yum repository (p. 339), you modify the vsftpd config file to ALLOW anonymous access and DISABLE write permissions!"], "content_html": "<h3>1. FTP Server &amp; <code class=\"inline-code\">vsftpd<\/code> Security Architecture (pp. 337–338)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Three Key FTP Server Functions (p. 337)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>User classification<\/strong>: Classifies users into <strong>real<\/strong>, <strong>guest<\/strong>, and <strong>anonymous<\/strong> users with different permissions (e.g., anonymous users can only download resources, whereas real users have broader permissions).<\/li>\n<li><strong>Command and file logs<\/strong>: Uses the <strong><code class=\"inline-code\">syslogd<\/code><\/strong> service to log command history and data transfer details (transfer time, file size) in <strong><code class=\"inline-code\">/var/log/<\/code><\/strong>.<\/li>\n<li><strong>Access restriction (<code class=\"inline-code\">chroot<\/code>)<\/strong>: Restricts a user to their home directory (<strong>changed root / <code class=\"inline-code\">chroot<\/code><\/strong>) so they cannot access sensitive system directories like <code class=\"inline-code\">/etc<\/code>, <code class=\"inline-code\">/home<\/code>, or <code class=\"inline-code\">/usr/local<\/code>.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>**Why <code class=\"inline-code\">vsftpd<\/code> (<em>very secure FTP daemon<\/em>, p. 338)<strong>: Standard FTP does <\/strong>not** encrypt data during transmission. <code class=\"inline-code\">vsftpd<\/code> enhances security in 3 ways:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Runs as an <strong>unprivileged user<\/strong> and enforces <strong><code class=\"inline-code\">chroot<\/code><\/strong> environments.<\/li>\n<li>Any command requiring elevated privileges is controlled by a <strong>parent process running with the least privileges required<\/strong>.<\/li>\n<li>Integrates common Linux commands (<code class=\"inline-code\">dir<\/code>, <code class=\"inline-code\">ls<\/code>, <code class=\"inline-code\">cd<\/code>) internally to reduce reliance on external binaries.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Six-Step FTP-Based Private Yum Repository Deployment (p. 339)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Step 1<\/strong>: Create a Yum repository on the local host (e.g., using <code class=\"inline-code\">createrepo<\/code> and configuring <code class=\"inline-code\">.repo<\/code> files).<\/li>\n<li><strong>Step 2<\/strong>: Install the FTP service (<code class=\"inline-code\">vsftpd<\/code>) and enable it to start upon system startup (<code class=\"inline-code\">systemctl enable --now vsftpd<\/code>).<\/li>\n<li><strong>Step 3<\/strong>: Modify the <code class=\"inline-code\">vsftpd<\/code> configuration file (<code class=\"inline-code\">/etc/vsftpd/vsftpd.conf<\/code>) to <strong>allow anonymous access and disable write permissions<\/strong>.<\/li>\n<li><strong>Step 4<\/strong>: <strong>Disable the firewall and SELinux<\/strong> (<code class=\"inline-code\">systemctl stop firewalld<\/code>, <code class=\"inline-code\">setenforce 0<\/code>).<\/li>\n<li><strong>Step 5<\/strong>: Set automatic mounting (<code class=\"inline-code\">/etc/fstab<\/code>).<\/li>\n<li><strong>Step 6<\/strong>: Test the FTP service and Yum repository (<code class=\"inline-code\">yum makecache<\/code>).<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. Linux Mail Server: Postfix (SMTP) + Dovecot (POP3/IMAP) (pp. 340–342)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Mainstream Combination<\/strong>: <strong>Postfix + Dovecot<\/strong> (often backed by MySQL, storing mail in <code class=\"inline-code\">/var/mail/mydomain.com/myuser<\/code>):<\/li>\n<li><strong>Postfix<\/strong>: Open-source Mail Transfer Agent providing the <strong>SMTP (Simple Mail Transfer Protocol)<\/strong> service for sending and relaying emails between mail servers (e.g., <code class=\"inline-code\">me@huawei.com<\/code> \\rightarrow <code class=\"inline-code\">smtp.huawei.com<\/code> \\rightarrow <code class=\"inline-code\">smtp.gmail.com<\/code>, which saves the email to disk).<\/li>\n<li><strong>Dovecot<\/strong>: Famous <strong>POP3<\/strong> and <strong>IMAP<\/strong> server implementation responsible <strong>only for the path between the recipient's mail server and the recipient's email client (user agent)<\/strong>.<\/li>\n<li><strong>POP3 vs. IMAP (pp. 340, 342)<\/strong>:<\/li>\n<li><strong>POP3 (Post Office Protocol v3)<\/strong>: Downloads <strong>entire emails<\/strong> to the client device and then disconnects; actions on the client do not sync back to the server.<\/li>\n<li><strong>IMAP (Internet Message Access Protocol)<\/strong>: Fetches <strong>only key details (such as subjects/headers)<\/strong> first and downloads full content <strong>on demand<\/strong>; <strong>synchronizes actions<\/s
