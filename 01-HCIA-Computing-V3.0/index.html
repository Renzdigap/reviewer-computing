  <script>
    const PILLAR = {"id": "pillar1", "folder_name": "01-HCIA-Computing-V3.0", "title": "HCIA-Computing V3.0 (Kunpeng & Server Ecosystem)", "subtitle": "Huawei ICT Competition National Stage — Computing Track Pillar 1", "pdf_source": "HCIA-Computing V3.0 Training Material.pdf", "total_hours": 9, "lesson_hours": 8, "mock_exam_hours": 1, "description": "Comprehensive, 100% official-PDF-faithful 9-Hour study and lab curriculum for Huawei HCIA-Computing V3.0 (443 pages), covering Computing History & Trends, Computing Systems & FusionCompute Virtualization, Server Hardware (CPU/Memory/Drives/RAID/PCIe/NICs/GPUs/PSUs/Protocols/OS), Kunpeng 920 & TaiShan 200 Ecosystem, Hardware/OS/Service Deployment, and Enterprise O&M (iBMA, iBMC, Smart Provisioning, FusionDirector, eSight, SmartKit, eService).", "hours": [{"hour_number": 1, "folder_name": "Hour-01-History-of-Computing-and-Trends", "title": "History of Computing & Industry Trends", "chapter_ref": "Chapter 01 (pp. 1–67)", "duration_mins": 60, "overview": "Master the complete evolution of computing from primitive knot-counting and mechanical adders to the four generations of electronic computers, cloud computing service/deployment models, the Hadoop/Spark big data ecosystem, and the four foundational elements of AI.", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-Primitive-Mechanical-and-Electronic-Computing", "exercise_slug": "02-Exercise-Computing-Eras-and-Generations-Lab", "lecture": {"title": "Primitive, Mechanical, and Electronic Computing Eras", "duration_mins": 7, "pdf_ref": "Ch.01, pp. 5–28", "objectives": ["Trace computing tools from digits, stones, Inca Quipu knotted strings, counting rods, abacus, and Napier's Bones to logarithmic slide rules", "Understand mechanical calculators including Blaise Pascal's Pascaline (sautoir carry mechanism) and Dorr Eugene Felt's Comptometer", "Differentiate the four generations of electronic computers, Edison effect, Fleming's vacuum diode, Lee de Forest's vacuum triode, ABC, ENIAC, TRADIC, Altair 8800, Apple II/Lisa, and supercomputers"], "content_markdown": "### 1. Primitive Computing Era (pp. 8–15)\nComputing is the process of symbol transformation based on mathematical rules. As human counting demands exceeded fingers/toes (digits) and stones, specialized tools emerged:\n\n| Tool | Historical Period / Inventor | Key Mechanism & Exam Facts |\n| :--- | :--- | :--- |\n| **Knotted Strings (Quipu)** | Ancient Inca (South America) | Woven alpaca/llama hair strings tied to a thicker horizontal string. Place value is determined by distance from the horizontal string: **farthest = Ones place**, **closest = Tens of thousands place (largest)** — covers Ones, Tens, Hundreds, Thousands, and Tens of thousands (**Tens of hundreds** in Ch.01 Quiz Q2). |\n| **Tally Sticks & Counting Rods** | Spring & Autumn / Warring States (770–221 BCE), Han to Sui Dynasties | Bamboo sticks; **Ones place = vertical**, **Tens place = horizontal**, **Hundreds = vertical** (alternating vertical and horizontal). Changed from round (0.23 cm × 14 cm in Han) to triangular/quadrangular for positive/negative numbers and shorter (0.59 cm × 8.85 cm in Sui). |\n| **Abacus** | Pre-Arabic numerals to modern era | Fast arithmetic (addition, subtraction, multiplication, division, exponentiation, root extraction) using bead manipulation rules. |\n| **Napier's Bones (1617)** | John Napier (*Rabdologiae*) | A board (left border marked 1–9) and **10 rods** (top marked 0–9, nine front squares split by a diagonal line separating tens and ones places). Replaces multi-digit multiplication with addition and single-digit multiplication (and division with subtraction). |\n| **Logarithms & Slide Rule** | John Napier & Henry Briggs | Napier invented logarithms (*Mirifici Logarithmorum Canonis Descriptio*); **Henry Briggs** compiled the first base-10 logarithm table (\lg(X)). Combining two logarithmic scales created linear and circular **slide rules**. |\n\n---\n\n### 2. Mechanical Computing Era (pp. 16–18)\n- **Pascal's Adder (Pascaline)**: Invented by French mathematician **Blaise Pascal**. Uses rotary dials for input and small windows above dials for output. Its centerpiece carry mechanism is the **sautoir**, which carries `1` to the next dial when a dial transitions from `9` to `0`. Early models only performed addition; later editions performed subtraction by reversing dial rotation. Marks the transition from **manual to automatic** computing tools.\n- **Key-Driven Calculator (Comptometer, 1886)**: Invented by American engineer **Dorr Eugene Felt**. Resembles a typewriter in a square box with a clearing handle on the right. Each key displays two numbers whose **sum is 9**: the **larger number** is used for addition/multiplication, and the **smaller number** (9's complement) transforms subtraction into addition while blocking carry (e.g., 500 - 427 is computed by pressing `500` and `426` on smaller numbers = 500 + 573 = 73 with carry blocked).\n\n---\n\n### 3. Electronic Computing Era & Four Generations (pp. 19–28)\n- **Vacuum Tubes**: In 1883, Thomas Edison discovered the **Edison effect** (electrons flowing from a heated filament to a cooler metal plate in vacuum). In **1904**, British scientist **John Ambrose Fleming** invented the two-electrode **vacuum diode** (converting AC to DC). In **1906**, **Lee de Forest** added a fence-shaped third electrode to create the **vacuum triode**, enabling signal amplification and high-speed electronic switching.\n\n| Milestone / Generation | Year / Inventor | Core Architecture & Specifications |\n| :--- | :--- | :--- |\n| **Electromechanical Tabulator** | 1889 (Herman Hollerith) | Punch-card tabulating machine for storing accounting data. |\n| **Analog Computer** | 1930 (Vannevar Bush) | World's first analog electronic computer with some digital components. |\n| **ABC (Atanasoff–Berry Computer)** | 1937 | **World's first electronic digital computer**, designed to solve linear equations (not general-purpose/programmable). |\n| **1st Gen: ENIAC** | 1946 (John Mauchly team, Univ. of Pennsylvania) | **Second electronic computer** and **first general-purpose programmable electronic computer**. 30+ m long, 6+ m wide, 2+ m high, **30+ tons**, **17,000+ electron tubes**, **7,000+ crystal diodes**; **5,000 additions/s** or **400 multiplications/s**. |\n| **Von Neumann Parallel Computer** | 1950 | First parallel computer using **von Neumann architecture** (binary format and stored programs). |\n| **2nd Gen: Transistors** | 1947 / 1954 / 1958 | First germanium transistor made in **1947** by **Shockley, Bardeen, and Brattain** at Bell Labs. **TRADIC (1954)** at Bell Labs used ~800 transistors (< 100 W). **RCA 501 (1958)** reached hundreds of thousands of ops/s. |\n| **3rd Gen: Integrated Circuits (IC)** | 1958–1959 / 1970 | **Jack Kilby** (TI, 1958, germanium IC) and **Robert Noyce** (Fairchild, 1959, monolithic silicon IC) solved the \"tyranny of numbers\". **IBM System/370 (1970)** replaced magnetic core storage with LSI circuits and applied virtual memory, separating software from hardware. |\n| **4th Gen: Microprocessors & PCs** | 1971–1983 | **Intel 4004 (1971, Marcian Hoff)**: first microprocessor (2,000+ transistors, 4-bit, 50,000 ops/s, 12\ cm^2). **Altair 8800 (1974/1975, MITS)**: world's first microcomputer based on **Intel 8080** (metal box with LED indicators, no monitor/keyboard/mouse). **Apple II (1977)**: MOS 6502 8-bit CPU, 4 KB RAM, color graphics, built-in BASIC, first batch-manufactured PC. **Apple Lisa (1983)**: world's first PC with both a **GUI and mouse**. |\n| **Supercomputers** | 21st Century | **Sunway TaihuLight** delivers **90 PFLOPS** sustained and **120+ PFLOPS** peak performance. Classified into dedicated (astrophysics, cryptography) and general-purpose (meteorology, finance, medical care). |", "key_takeaways": ["Inca Quipu knots represent Ones (farthest from main horizontal string) up to Tens of thousands (closest to horizontal string); Chinese counting rods alternate vertical (ones, hundreds) and horizontal (tens, thousands).", "Edison discovered the Edison effect (1883); Fleming invented the vacuum diode (1904); Lee de Forest invented the vacuum triode (1906) by adding a grid/fence electrode for amplification and switching.", "ABC (1937) is the first electronic computer; ENIAC (1946) is the second electronic computer and first general-purpose programmable electronic computer (17,000+ tubes, 5,000 additions/s).", "TRADIC (1954) is Bell Labs' first transistorized computer; IBM System/370 (1970) separated hardware and software; MITS Altair 8800 (Intel 8080) is the first microcomputer."], "exam_traps": ["EXAM TRAP (Ch.01 Quiz Q2): In the Inca knot counting method (Quipu), the places represented are Ones, Tens, Hundreds, Thousands, and Tens of thousands ('Tens of hundreds' in the official option list) — NEVER 'Hundreds of thousands'!", "EXAM TRAP: Do not confuse ABC (1937, world's first electronic computer for linear equations) with ENIAC (1946, second electronic computer and world's first general-purpose programmable computer)."], "content_html": "<h3>1. Primitive Computing Era (pp. 8–15)<\/h3>\n<p>Computing is the process of symbol transformation based on mathematical rules. As human counting demands exceeded fingers/toes (digits) and stones, specialized tools emerged:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Tool<\/th><th>Historical Period / Inventor<\/th><th>Key Mechanism &amp; Exam Facts<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Knotted Strings (Quipu)<\/strong><\/td><td>Ancient Inca (South America)<\/td><td>Woven alpaca/llama hair strings tied to a thicker horizontal string. Place value is determined by distance from the horizontal string: <strong>farthest = Ones place<\/strong>, <strong>closest = Tens of thousands place (largest)<\/strong> — covers Ones, Tens, Hundreds, Thousands, and Tens of thousands (<strong>Tens of hundreds<\/strong> in Ch.01 Quiz Q2).<\/td><\/tr>\n<tr><td><strong>Tally Sticks &amp; Counting Rods<\/strong><\/td><td>Spring &amp; Autumn / Warring States (770–221 BCE), Han to Sui Dynasties<\/td><td>Bamboo sticks; <strong>Ones place = vertical<\/strong>, <strong>Tens place = horizontal<\/strong>, <strong>Hundreds = vertical<\/strong> (alternating vertical and horizontal). Changed from round (0.23 cm × 14 cm in Han) to triangular/quadrangular for positive/negative numbers and shorter (0.59 cm × 8.85 cm in Sui).<\/td><\/tr>\n<tr><td><strong>Abacus<\/strong><\/td><td>Pre-Arabic numerals to modern era<\/td><td>Fast arithmetic (addition, subtraction, multiplication, division, exponentiation, root extraction) using bead manipulation rules.<\/td><\/tr>\n<tr><td><strong>Napier's Bones (1617)<\/strong><\/td><td>John Napier (<em>Rabdologiae<\/em>)<\/td><td>A board (left border marked 1–9) and <strong>10 rods<\/strong> (top marked 0–9, nine front squares split by a diagonal line separating tens and ones places). Replaces multi-digit multiplication with addition and single-digit multiplication (and division with subtraction).<\/td><\/tr>\n<tr><td><strong>Logarithms &amp; Slide Rule<\/strong><\/td><td>John Napier &amp; Henry Briggs<\/td><td>Napier invented logarithms (<em>Mirifici Logarithmorum Canonis Descriptio<\/em>); <strong>Henry Briggs<\/strong> compiled the first base-10 logarithm table (\lg(X)). Combining two logarithmic scales created linear and circular <strong>slide rules<\/strong>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Mechanical Computing Era (pp. 16–18)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Pascal's Adder (Pascaline)<\/strong>: Invented by French mathematician <strong>Blaise Pascal<\/strong>. Uses rotary dials for input and small windows above dials for output. Its centerpiece carry mechanism is the <strong>sautoir<\/strong>, which carries <code class=\"inline-code\">1<\/code> to the next dial when a dial transitions from <code class=\"inline-code\">9<\/code> to <code class=\"inline-code\">0<\/code>. Early models only performed addition; later editions performed subtraction by reversing dial rotation. Marks the transition from <strong>manual to automatic<\/strong> computing tools.<\/li>\n<li><strong>Key-Driven Calculator (Comptometer, 1886)<\/strong>: Invented by American engineer <strong>Dorr Eugene Felt<\/strong>. Resembles a typewriter in a square box with a clearing handle on the right. Each key displays two numbers whose <strong>sum is 9<\/strong>: the <strong>larger number<\/strong> is used for addition/multiplication, and the <strong>smaller number<\/strong> (9's complement) transforms subtraction into addition while blocking carry (e.g., 500 - 427 is computed by pressing <code class=\"inline-code\">500<\/code> and <code class=\"inline-code\">426<\/code> on smaller numbers = 500 + 573 = 73 with carry blocked).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Electronic Computing Era &amp; Four Generations (pp. 19–28)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Vacuum Tubes<\/strong>: In 1883, Thomas Edison discovered the <strong>Edison effect<\/strong> (electrons flowing from a heated filament to a cooler metal plate in vacuum). In <strong>1904<\/strong>, British scientist <strong>John Ambrose Fleming<\/strong> invented the two-electrode <strong>vacuum diode<\/strong> (converting AC to DC). In <strong>1906<\/strong>, <strong>Lee de Forest<\/strong> added a fence-shaped third electrode to create the <strong>vacuum triode<\/strong>, enabling signal amplification and high-speed electronic switching.<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Milestone / Generation<\/th><th>Year / Inventor<\/th><th>Core Architecture &amp; Specifications<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Electromechanical Tabulator<\/strong><\/td><td>1889 (Herman Hollerith)<\/td><td>Punch-card tabulating machine for storing accounting data.<\/td><\/tr>\n<tr><td><strong>Analog Computer<\/strong><\/td><td>1930 (Vannevar Bush)<\/td><td>World's first analog electronic computer with some digital components.<\/td><\/tr>\n<tr><td><strong>ABC (Atanasoff–Berry Computer)<\/strong><\/td><td>1937<\/td><td><strong>World's first electronic digital computer<\/strong>, designed to solve linear equations (not general-purpose/programmable).<\/td><\/tr>\n<tr><td><strong>1st Gen: ENIAC<\/strong><\/td><td>1946 (John Mauchly team, Univ. of Pennsylvania)<\/td><td><strong>Second electronic computer<\/strong> and <strong>first general-purpose programmable electronic computer<\/strong>. 30+ m long, 6+ m wide, 2+ m high, <strong>30+ tons<\/strong>, <strong>17,000+ electron tubes<\/strong>, <strong>7,000+ crystal diodes<\/strong>; <strong>5,000 additions/s<\/strong> or <strong>400 multiplications/s<\/strong>.<\/td><\/tr>\n<tr><td><strong>Von Neumann Parallel Computer<\/strong><\/td><td>1950<\/td><td>First parallel computer using <strong>von Neumann architecture<\/strong> (binary format and stored programs).<\/td><\/tr>\n<tr><td><strong>2nd Gen: Transistors<\/strong><\/td><td>1947 / 1954 / 1958<\/td><td>First germanium transistor made in <strong>1947<\/strong> by <strong>Shockley, Bardeen, and Brattain<\/strong> at Bell Labs. <strong>TRADIC (1954)<\/strong> at Bell Labs used ~800 transistors (&lt; 100 W). <strong>RCA 501 (1958)<\/strong> reached hundreds of thousands of ops/s.<\/td><\/tr>\n<tr><td><strong>3rd Gen: Integrated Circuits (IC)<\/strong><\/td><td>1958–1959 / 1970<\/td><td><strong>Jack Kilby<\/strong> (TI, 1958, germanium IC) and <strong>Robert Noyce<\/strong> (Fairchild, 1959, monolithic silicon IC) solved the \"tyranny of numbers\". <strong>IBM System/370 (1970)<\/strong> replaced magnetic core storage with LSI circuits and applied virtual memory, separating software from hardware.<\/td><\/tr>\n<tr><td><strong>4th Gen: Microprocessors &amp; PCs<\/strong><\/td><td>1971–1983<\/td><td><strong>Intel 4004 (1971, Marcian Hoff)<\/strong>: first microprocessor (2,000+ transistors, 4-bit, 50,000 ops/s, 12\ cm^2). <strong>Altair 8800 (1974/1975, MITS)<\/strong>: world's first microcomputer based on <strong>Intel 8080<\/strong> (metal box with LED indicators, no monitor/keyboard/mouse). <strong>Apple II (1977)<\/strong>: MOS 6502 8-bit CPU, 4 KB RAM, color graphics, built-in BASIC, first batch-manufactured PC. <strong>Apple Lisa (1983)<\/strong>: world's first PC with both a <strong>GUI and mouse<\/strong>.<\/td><\/tr>\n<tr><td><strong>Supercomputers<\/strong><\/td><td>21st Century<\/td><td><strong>Sunway TaihuLight<\/strong> delivers <strong>90 PFLOPS<\/strong> sustained and <strong>120+ PFLOPS<\/strong> peak performance. Classified into dedicated (astrophysics, cryptography) and general-purpose (meteorology, finance, medical care).<\/td><\/tr>\n<\/tbody><\/table><\/div>"}, "exercise": {"title": "Hands-On Lab: Computing Evolution & Architecture Milestones Verification", "duration_mins": 8, "exercise_type": "script", "prompt_label": "python3@kunpeng-lab:~", "scenario": "You are preparing a verification script for the Huawei ICT Competition Computing Track study group that validates historical computing milestones, vacuum tube physics, and electronic computer generation specs.", "instructions": ["Set `quipu_largest_place` to `'tens_of_thousands'` (the knot closest to the horizontal string in Inca Quipu).", "Set `first_general_electronic_computer` to `'ENIAC'` and `first_microcomputer` to `'Altair 8800'` (powered by `'Intel 8080'`).", "Set `software_hardware_separation_system` to `'IBM System/370'` and `sunway_peak_pflops` to `120`."], "starter_code": "# Complete the historical milestone dictionary for HCIA-Computing Ch.01:\nmilestones = {\n    \"quipu_largest_place\": \"___\",\n    \"first_electronic_computer_1937\": \"ABC\",\n    \"first_general_electronic_computer\": \"___\",\n    \"first_transistor_computer_1954\": \"TRADIC\",\n    \"software_hardware_separation_system\": \"___\",\n    \"first_microcomputer\": \"___\",\n    \"sunway_peak_pflops\": ___\n}\nprint(milestones)", "solution_code": "# Complete the historical milestone dictionary for HCIA-Computing Ch.01:\nmilestones = {\n    \"quipu_largest_place\": \"tens_of_thousands\",\n    \"first_electronic_computer_1937\": \"ABC\",\n    \"first_general_electronic_computer\": \"ENIAC\",\n    \"first_transistor_computer_1954\": \"TRADIC\",\n    \"software_hardware_separation_system\": \"IBM System/370\",\n    \"first_microcomputer\": \"Altair 8800\",\n    \"sunway_peak_pflops\": 120\n}\nprint(milestones)", "hints": ["Inca Quipu knots closest to the horizontal cord represent the tens of thousands place.", "ENIAC (1946) was the first general-purpose programmable electronic computer; MITS Altair 8800 was the first microcomputer.", "IBM System/370 (1970) introduced virtual memory and separated software from hardware."], "validation_checks": [{"step": 1, "description": "Identify the largest place value on an Inca Quipu (tens of thousands)", "required_any": ["tens_of_thousands", "tens of thousands"], "feedback_fail": "Set quipu_largest_place to 'tens_of_thousands'."}, {"step": 2, "description": "Specify ENIAC and Altair 8800 as the milestone computers", "required_any": ["eniac"], "feedback_fail": "Make sure you include 'ENIAC' as the first general-purpose electronic computer."}, {"step": 3, "description": "Specify Altair 8800, IBM System/370, and 120 PFLOPS", "required_any": ["altair 8800", "370", "120"], "feedback_fail": "Include 'Altair 8800', 'IBM System/370', and 120 PFLOPS."}], "simulated_output": "{'quipu_largest_place': 'tens_of_thousands', 'first_electronic_computer_1937': 'ABC', 'first_general_electronic_computer': 'ENIAC', 'first_transistor_computer_1954': 'TRADIC', 'software_hardware_separation_system': 'IBM System/370', 'first_microcomputer': 'Altair 8800', 'sunway_peak_pflops': 120}\n[OK] All Computing Era milestones verified against HCIA-Computing V3.0 Ch.01.", "quiz_questions": [{"id": "h1_s1_q1", "type": "multiple", "question": "(Official Ch.01 Quiz Q2) Which of the following places can be represented in the knot counting method of the Inca people?", "options": ["A. Hundreds", "B. Tens of hundreds", "C. Hundreds of thousands", "D. Thousands"], "answer": "ABD", "explanation": "In the Inca Quipu knot counting method (Ch.01 p.10 & p.62 Quiz Q2), knots represent Ones (farthest), Tens, Hundreds, Thousands, and Tens of thousands (written as 'Tens of hundreds' in option B of the official quiz). 'Hundreds of thousands' (C) exceeds the Quipu place limit."}, {"id": "h1_s1_q2", "type": "single", "question": "Which electronic device was invented by Lee de Forest in 1906 by adding a fence-shaped third electrode to control current and amplify signals, serving as a high-speed switch for early electronic computers?", "options": ["A. Vacuum diode", "B. Vacuum triode", "C. Germanium transistor", "D. Monolithic silicon IC"], "answer": "B", "explanation": "John Ambrose Fleming invented the vacuum diode in 1904 based on the Edison effect. In 1906, Lee de Forest added a third fence-shaped electrode to create the vacuum triode, which amplifies electrical signals and functions as a fast electronic switch (Ch.01, p.22)."}, {"id": "h1_s1_q3", "type": "tf", "question": "ENIAC (1946) was the world's first electronic digital computer, whereas the Atanasoff-Berry Computer (ABC) was the second electronic computer.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.01 p.23, the Atanasoff–Berry Computer (ABC, 1937) is the world's first electronic computer (designed to solve linear equations), while ENIAC (1946) is the second electronic computer and the first general-purpose programmable electronic computer."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-Cloud-Computing-Architecture-and-Service-Models", "exercise_slug": "04-Exercise-Cloud-Service-and-Deployment-Classification", "lecture": {"title": "Cloud Computing Architecture, Evolution & Service Models", "duration_mins": 7, "pdf_ref": "Ch.01, pp. 29–37", "objectives": ["Master the NIST definition of cloud computing and its 5 core benefits", "Compare the First, Second, and Third IT Platforms and Cloud 1.0, 2.0, and 3.0 phases", "Distinguish IaaS, PaaS, and SaaS responsibility boundaries and Private, Public, and Hybrid cloud deployment models"], "content_markdown": "### 1. NIST Definition & The Three IT Platforms (pp. 31–33)\nAccording to the **National Institute of Standards and Technology (NIST)**, cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction.\n\n#### Evolution of the Three IT Platforms (IDC):\n1. **First Platform (From 1964)**: **Mainframe** era — millions of users, thousands of applications.\n2. **Second Platform (From 1981)**: **LAN, Internet, and client/server** era — hundreds of millions of users, tens of thousands of applications.\n3. **Third Platform (From 2012, mainstream since 2015)**: **Cloud computing, Big Data, Mobile Internet, and IoT** — billions of users, millions of apps; accounts for 1/3 of global IT spending and 100% of IT spending growth.\n\n#### Five Core Benefits of Cloud Computing (p. 33):\n- **On-demand self-service**: Deploy server time and storage without human interaction with the provider.\n- **Widespread network access**: Access via mobile phones, laptops, and tablets over the Internet.\n- **Resource pooling**: Multi-tenant dynamic allocation of physical/virtual resources; users do not need to know exact physical locations.\n- **Quick deployment and auto scaling**: Rapid, elastic provisioning and release of resources.\n- **Metered services**: Pay-per-use (hourly, monthly, or yearly) for CPU, memory, storage, and bandwidth.\n\n---\n\n### 2. Cloud 1.0 vs. Cloud 2.0 vs. Cloud 3.0 (pp. 34–35)\nEnterprise data centers are transforming in 5 ways: from **resource silos to resource pooling**, **centralized to distributed architecture**, **dedicated hardware to software-defined storage (SDS)**, **manual handling to self-service/automation**, and **distributed statistics to unified metering**.\n\n| Phase | Focus & Core Concept | Representative Technologies |\n| :--- | :--- | :--- |\n| **Cloud 1.0 (Efficiency)** | **Virtualization-centric** — abstracts hardware into VMs for higher resource utilization | VMware ESXi, KVM, Xen, Microsoft Hyper-V |\n| **Cloud 2.0 (Cloud Pilot)** | **Resource-centric (Software Defined / Cloud Resource)** — infrastructure migration to cloud, standardized & automated resource services | OpenStack, VMware |\n| **Cloud 3.0 (Cloud Native)** | **Application-centric (Container / Cloud Native)** — agile application development, microservices, and lifecycle management | Docker, Cloud Foundry, Kubernetes |\n\n---\n\n### 3. Cloud Service Models (IaaS, PaaS, SaaS) & Deployment Models (pp. 36–37)\n\n| Layer (Top to Bottom) | Traditional IT | IaaS | PaaS | SaaS |\n| :--- | :---: | :---: | :---: | :---: |\n| **Application & Data** | User | **User** | **User** | Cloud Platform |\n| **Operating Environment, Middleware, OS** | User | **User** | Cloud Platform | Cloud Platform |\n| **Virtualization, Server, Storage, Network** | User | Cloud Platform | Cloud Platform | Cloud Platform |\n\n- **Private Cloud**: Exclusively owned and operated by a single organization behind the enterprise ingress firewall for maximum data protection.\n- **Public Cloud**: Owned and operated by a third-party cloud service provider and shared across organizations over the Internet (like water/electricity utilities).\n- **Hybrid Cloud**: Combines public and private clouds (or on-premises resources) as distinct entities bound together, viewed externally as a single cloud with workload portability.", "key_takeaways": ["The Third Platform (from 2012: Cloud, Big Data, Mobile Internet, IoT) overtook the Second Platform in 2015.", "Cloud 1.0 is virtualization-centric (ESXi, KVM, Xen, Hyper-V); Cloud 2.0 is resource-centric (OpenStack); Cloud 3.0 is application-centric (Docker, Cloud Foundry, Cloud Native).", "In IaaS, users manage OS, Middleware, Runtime, Data, and Applications; in PaaS, users only manage Applications and Data; in SaaS, the cloud platform manages all layers."], "exam_traps": ["EXAM TRAP: In IaaS, the Operating System (OS) is managed by the USER, whereas Virtualization is managed by the Cloud Platform. In PaaS, the OS and Middleware are managed by the Cloud Platform.", "EXAM TRAP: Do not confuse Cloud 2.0 (Resource-centric / OpenStack) with Cloud 3.0 (Application-centric / Containers & Cloud Native)."], "content_html": "<h3>1. NIST Definition &amp; The Three IT Platforms (pp. 31–33)<\/h3>\n<p>According to the <strong>National Institute of Standards and Technology (NIST)<\/strong>, cloud computing is a model for enabling ubiquitous, convenient, on-demand network access to a shared pool of configurable computing resources (networks, servers, storage, applications, and services) that can be rapidly provisioned and released with minimal management effort or service provider interaction.<\/p>\n<h4>Evolution of the Three IT Platforms (IDC):<\/h4>\n<ol class=\"md-list\">\n<li><strong>First Platform (From 1964)<\/strong>: <strong>Mainframe<\/strong> era — millions of users, thousands of applications.<\/li>\n<li><strong>Second Platform (From 1981)<\/strong>: <strong>LAN, Internet, and client/server<\/strong> era — hundreds of millions of users, tens of thousands of applications.<\/li>\n<li><strong>Third Platform (From 2012, mainstream since 2015)<\/strong>: <strong>Cloud computing, Big Data, Mobile Internet, and IoT<\/strong> — billions of users, millions of apps; accounts for 1/3 of global IT spending and 100% of IT spending growth.<\/li>\n<\/ol>\n<h4>Five Core Benefits of Cloud Computing (p. 33):<\/h4>\n<ul class=\"md-list\">\n<li><strong>On-demand self-service<\/strong>: Deploy server time and storage without human interaction with the provider.<\/li>\n<li><strong>Widespread network access<\/strong>: Access via mobile phones, laptops, and tablets over the Internet.<\/li>\n<li><strong>Resource pooling<\/strong>: Multi-tenant dynamic allocation of physical/virtual resources; users do not need to know exact physical locations.<\/li>\n<li><strong>Quick deployment and auto scaling<\/strong>: Rapid, elastic provisioning and release of resources.<\/li>\n<li><strong>Metered services<\/strong>: Pay-per-use (hourly, monthly, or yearly) for CPU, memory, storage, and bandwidth.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Cloud 1.0 vs. Cloud 2.0 vs. Cloud 3.0 (pp. 34–35)<\/h3>\n<p>Enterprise data centers are transforming in 5 ways: from <strong>resource silos to resource pooling<\/strong>, <strong>centralized to distributed architecture<\/strong>, <strong>dedicated hardware to software-defined storage (SDS)<\/strong>, <strong>manual handling to self-service/automation<\/strong>, and <strong>distributed statistics to unified metering<\/strong>.<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Phase<\/th><th>Focus &amp; Core Concept<\/th><th>Representative Technologies<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Cloud 1.0 (Efficiency)<\/strong><\/td><td><strong>Virtualization-centric<\/strong> — abstracts hardware into VMs for higher resource utilization<\/td><td>VMware ESXi, KVM, Xen, Microsoft Hyper-V<\/td><\/tr>\n<tr><td><strong>Cloud 2.0 (Cloud Pilot)<\/strong><\/td><td><strong>Resource-centric (Software Defined / Cloud Resource)<\/strong> — infrastructure migration to cloud, standardized &amp; automated resource services<\/td><td>OpenStack, VMware<\/td><\/tr>\n<tr><td><strong>Cloud 3.0 (Cloud Native)<\/strong><\/td><td><strong>Application-centric (Container / Cloud Native)<\/strong> — agile application development, microservices, and lifecycle management<\/td><td>Docker, Cloud Foundry, Kubernetes<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Cloud Service Models (IaaS, PaaS, SaaS) &amp; Deployment Models (pp. 36–37)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Layer (Top to Bottom)<\/th><th>Traditional IT<\/th><th>IaaS<\/th><th>PaaS<\/th><th>SaaS<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Application &amp; Data<\/strong><\/td><td>User<\/td><td><strong>User<\/strong><\/td><td><strong>User<\/strong><\/td><td>Cloud Platform<\/td><\/tr>\n<tr><td><strong>Operating Environment, Middleware, OS<\/strong><\/td><td>User<\/td><td><strong>User<\/strong><\/td><td>Cloud Platform<\/td><td>Cloud Platform<\/td><\/tr>\n<tr><td><strong>Virtualization, Server, Storage, Network<\/strong><\/td><td>User<\/td><td>Cloud Platform<\/td><td>Cloud Platform<\/td><td>Cloud Platform<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>Private Cloud<\/strong>: Exclusively owned and operated by a single organization behind the enterprise ingress firewall for maximum data protection.<\/li>\n<li><strong>Public Cloud<\/strong>: Owned and operated by a third-party cloud service provider and shared across organizations over the Internet (like water/electricity utilities).<\/li>\n<li><strong>Hybrid Cloud<\/strong>: Combines public and private clouds (or on-premises resources) as distinct entities bound together, viewed externally as a single cloud with workload portability.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Cloud Service Model & Architecture Classifier", "duration_mins": 8, "exercise_type": "config", "prompt_label": "architect@huawei-cloud:~#", "scenario": "An enterprise is migrating from Traditional IT to Huawei Cloud. Complete the architecture mapping configuration defining Cloud 1.0/2.0/3.0 focus areas and IaaS/PaaS/SaaS management boundaries.", "instructions": ["Set `cloud_1_focus` to `'virtualization-centric'`, `cloud_2_focus` to `'resource-centric'`, and `cloud_3_focus` to `'application-centric'`.", "Set `iaas_user_manages_os` to `True` and `paas_user_manages_os` to `False`.", "Specify the two layers managed by the user in PaaS as `'applications'` and `'data'`."], "starter_code": "# Huawei Cloud Migration Matrix Configuration\ncloud_evolution:\n  cloud_1_focus: \"___\"\n  cloud_2_focus: \"___\"\n  cloud_3_focus: \"___\"\n\nservice_models:\n  iaas_user_manages_os: ___\n  paas_user_manages_os: ___\n  paas_user_managed_layers:\n    - \"___\"\n    - \"___\"\n", "solution_code": "# Huawei Cloud Migration Matrix Configuration\ncloud_evolution:\n  cloud_1_focus: \"virtualization-centric\"\n  cloud_2_focus: \"resource-centric\"\n  cloud_3_focus: \"application-centric\"\n\nservice_models:\n  iaas_user_manages_os: True\n  paas_user_manages_os: False\n  paas_user_managed_layers:\n    - \"applications\"\n    - \"data\"\n", "hints": ["Cloud 1.0 is virtualization-centric, Cloud 2.0 is resource-centric, and Cloud 3.0 is application-centric.", "In PaaS, the cloud provider manages the OS, middleware, and runtime environment; users only focus on applications and data."], "validation_checks": [{"step": 1, "description": "Define Cloud 1.0, 2.0, and 3.0 focus areas", "required_any": ["virtualization-centric", "resource-centric", "application-centric"], "feedback_fail": "Make sure cloud_1_focus, cloud_2_focus, and cloud_3_focus are set to virtualization-centric, resource-centric, and application-centric."}, {"step": 2, "description": "Configure PaaS user-managed layers (applications and data)", "required_any": ["applications", "application"], "feedback_fail": "Include 'applications' and 'data' under paas_user_managed_layers."}, {"step": 3, "description": "Verify data layer and boolean flags", "required_any": ["data", "false"], "feedback_fail": "Ensure 'data' and 'False' for paas_user_manages_os are present."}], "simulated_output": "[VALIDATED] Cloud Evolution & Service Model Matrix:\n- Cloud 1.0: Virtualization-centric (KVM, ESXi, Xen, Hyper-V)\n- Cloud 2.0: Resource-centric (OpenStack)\n- Cloud 3.0: Application-centric (Docker, Cloud Foundry)\n- PaaS User Responsibility: Applications + Data only.", "quiz_questions": [{"id": "h1_s2_q1", "type": "single", "question": "In the Platform as a Service (PaaS) cloud computing model, which layers do users need to focus on and manage?", "options": ["A. OS, middleware, data, and applications", "B. Applications and data only", "C. Virtualization, servers, storage, and networks", "D. Users only use applications and manage no layers"], "answer": "B", "explanation": "In PaaS (Ch.01, p.36), the cloud platform provides and maintains the infrastructure (servers, storage, networks, virtualization) and application deployment environment (OS, middleware, operating environment). Users only need to focus on applications and data."}, {"id": "h1_s2_q2", "type": "single", "question": "Which phase of cloud computing evolution is characterized as 'resource-centric' for infrastructure migration to the cloud and standardized, automated services (represented by OpenStack)?", "options": ["A. Cloud 1.0", "B. Cloud 2.0", "C. Cloud 3.0", "D. First Platform"], "answer": "B", "explanation": "Cloud 1.0 is virtualization-centric; Cloud 2.0 is resource-centric (OpenStack); Cloud 3.0 is application-centric (Docker, Cloud Foundry, Cloud Native) (Ch.01, p.34)."}, {"id": "h1_s2_q3", "type": "multiple", "question": "Which of the following are included among the five core benefits of cloud computing defined in HCIA-Computing?", "options": ["A. On-demand self-service", "B. Widespread network access", "C. Resource pooling", "D. Quick deployment and auto scaling", "E. Metered services"], "answer": "ABCDE", "explanation": "All five (On-demand self-service, Widespread network access, Resource pooling, Quick deployment and auto scaling, and Metered services) are the five core benefits of cloud computing (Ch.01, p.33)."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Big-Data-Ecosystem-and-Evolution", "exercise_slug": "06-Exercise-Hadoop-Ecosystem-Component-Mapping", "lecture": {"title": "Big Data Ecosystem, Data Types & Computing Modes", "duration_mins": 8, "pdf_ref": "Ch.01, pp. 38–45, 55", "objectives": ["Distinguish structured, semi-structured, and unstructured data and contrast traditional vs. big data processing ('Fishing in the pond' vs. 'Fishing in the ocean')", "Trace Big Data Architecture 1.0, 2.0, and 3.0 and target personas (programmer, analyst, engineer)", "Map every component of the Hadoop Big Data Ecosystem and the 4 main big data computing modes"], "content_markdown": "### 1. Structured, Semi-Structured, and Unstructured Data (pp. 39–42)\nBig data is a combination of structured, semi-structured, and unstructured data collected, analyzed, and mined to obtain insights:\n- **Structured data**: Stored in relational databases as two-dimensional tables (rows = entities with identical attributes).\n- **Semi-structured data**: Does not comply with relational table schemas but contains semantic labels/tags to separate elements and layer records/fields (e.g., **XML** and **JSON** files).\n- **Unstructured data**: Data without a fixed structure (documents, images, videos, audio), generally stored in binary format.\n\n#### Traditional Data Processing vs. Big Data Processing (p. 42):\n| Dimension | Traditional Data Processing (\"Fishing in the pond\") | Big Data Processing (\"Fishing in the ocean\") |\n| :--- | :--- | :--- |\n| **Data Scale** | Small (in **MB**) | Large (in **GB, TB, or PB**) |\n| **Data Type** | Single data type (mostly structured) | Diverse (structured, semi-structured, unstructured) |\n| **Mode vs. Data Relationship** | **Modes are set before data is generated** (the pond exists before fish come) | **Modes are set after data is generated**; modes evolve as data grows |\n| **Processing Tool** | **One size fits all** | **No size fits all** |\n\n---\n\n### 2. Big Data Evolution: 1.0, 2.0, and 3.0 (pp. 40, 43, 55)\n- **Timeline**: Hadoop created in **2005**; first Big Data white paper by CCC in **2008**; US `Data.gov` in **2009**; IBM Watson won *Jeopardy!* in **Feb 2011**; **Splunk** listed on NASDAQ in **April 2012** (first listed big data company).\n- **Big Data 1.0 (2003, Web app era — Programmer-oriented)**: Distributed storage + query + batch processing (Google GFS, MapReduce, Bigtable).\n- **Big Data 2.0 (2010, Mobile Internet era — Analyst-oriented)**: Interactive analysis + incremental refreshing + graph computing (Spark, Storm, Solr, YARN).\n- **Big Data 3.0 (Intelligent brain / IoT & AI era — Engineer-oriented)**: Intelligent analysis + cloud service (Google Brain, Cloud DataFlow, Spanner).\n\n---\n\n### 3. Hadoop Ecosystem & Four Computing Modes (pp. 44–45)\n\n| Component | Exact Official Role in Hadoop Ecosystem (p. 44) |\n| :--- | :--- |\n| **HDFS** | Distributed file system |\n| **YARN** | Unified resource allocator |\n| **MapReduce** | Batch processing |\n| **Spark** | In-memory computing (also used in batch & stream computing) |\n| **Flink** | Unified stream and batch processing |\n| **Tez** | DAG computing |\n| **Hive / Pig** | Data warehouse (`Hive`) / Data analysis platform (`Pig`) |\n| **HBase** | Distributed non-relational database |\n| **ZooKeeper** | Distributed coordination service |\n| **Ambari / Oozie** | Installation and deployment tool (`Ambari`) / Workflow scheduling system (`Oozie`) |\n| **Flume / Sqoop / Mahout** | Log collection (`Flume`) / ETL tool (`Sqoop`) / Machine learning (`Mahout`) |\n\n#### Four Main Computing Modes of Big Data Applications (p. 45):\n1. **Batch computing**: Massive batch data — **MapReduce, Spark**.\n2. **Stream computing**: Real-time stream data — **Spark, Storm, Flink, Flume, DStream**.\n3. **Graph computing**: Massive graph data — **GraphX** (built-in Spark library), **Gelly** (built-in Flink library), **Giraph** (open-source counterpart to Google Pregel), **PowerGraph** (vertex-cuts for power-law natural graphs).\n4. **Query analytics and computing**: Massive storage & SQL query analytics — **Hive, Impala** (Cloudera, faster than Hive), **Dremel** (Google interactive analysis, referenced by Impala), **Cassandra** (Facebook open-source NoSQL combining Amazon Dynamo + Google Bigtable).", "key_takeaways": ["Traditional data processing sets the schema/mode BEFORE data is generated ('fishing in the pond', One size fits all); Big Data sets the mode AFTER data is generated ('fishing in the ocean', No size fits all).", "Big Data 1.0 is programmer-oriented, Big Data 2.0 is analyst-oriented, and Big Data 3.0 is engineer-oriented.", "Know the exact Hadoop component roles: Ambari (installation/deployment), Oozie (workflow scheduling), ZooKeeper (distributed coordination), Sqoop (ETL), Flume (log collection), GraphX (Spark graph library), Gelly (Flink graph library)."], "exam_traps": ["EXAM TRAP: Do not confuse GraphX (built-in graph library of Spark) with Gelly (built-in graph library of Flink) or Giraph (open-source counterpart to Google's Pregel).", "EXAM TRAP: XML and JSON are semi-structured data (not unstructured data); documents, images, audio, and video are unstructured data."], "content_html": "<h3>1. Structured, Semi-Structured, and Unstructured Data (pp. 39–42)<\/h3>\n<p>Big data is a combination of structured, semi-structured, and unstructured data collected, analyzed, and mined to obtain insights:<\/p>\n<ul class=\"md-list\">\n<li><strong>Structured data<\/strong>: Stored in relational databases as two-dimensional tables (rows = entities with identical attributes).<\/li>\n<li><strong>Semi-structured data<\/strong>: Does not comply with relational table schemas but contains semantic labels/tags to separate elements and layer records/fields (e.g., <strong>XML<\/strong> and <strong>JSON<\/strong> files).<\/li>\n<li><strong>Unstructured data<\/strong>: Data without a fixed structure (documents, images, videos, audio), generally stored in binary format.<\/li>\n<\/ul>\n<h4>Traditional Data Processing vs. Big Data Processing (p. 42):<\/h4>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Dimension<\/th><th>Traditional Data Processing (\"Fishing in the pond\")<\/th><th>Big Data Processing (\"Fishing in the ocean\")<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Data Scale<\/strong><\/td><td>Small (in <strong>MB<\/strong>)<\/td><td>Large (in <strong>GB, TB, or PB<\/strong>)<\/td><\/tr>\n<tr><td><strong>Data Type<\/strong><\/td><td>Single data type (mostly structured)<\/td><td>Diverse (structured, semi-structured, unstructured)<\/td><\/tr>\n<tr><td><strong>Mode vs. Data Relationship<\/strong><\/td><td><strong>Modes are set before data is generated<\/strong> (the pond exists before fish come)<\/td><td><strong>Modes are set after data is generated<\/strong>; modes evolve as data grows<\/td><\/tr>\n<tr><td><strong>Processing Tool<\/strong><\/td><td><strong>One size fits all<\/strong><\/td><td><strong>No size fits all<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Big Data Evolution: 1.0, 2.0, and 3.0 (pp. 40, 43, 55)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Timeline<\/strong>: Hadoop created in <strong>2005<\/strong>; first Big Data white paper by CCC in <strong>2008<\/strong>; US <code class=\"inline-code\">Data.gov<\/code> in <strong>2009<\/strong>; IBM Watson won <em>Jeopardy!<\/em> in <strong>Feb 2011<\/strong>; <strong>Splunk<\/strong> listed on NASDAQ in <strong>April 2012<\/strong> (first listed big data company).<\/li>\n<li><strong>Big Data 1.0 (2003, Web app era — Programmer-oriented)<\/strong>: Distributed storage + query + batch processing (Google GFS, MapReduce, Bigtable).<\/li>\n<li><strong>Big Data 2.0 (2010, Mobile Internet era — Analyst-oriented)<\/strong>: Interactive analysis + incremental refreshing + graph computing (Spark, Storm, Solr, YARN).<\/li>\n<li><strong>Big Data 3.0 (Intelligent brain / IoT &amp; AI era — Engineer-oriented)<\/strong>: Intelligent analysis + cloud service (Google Brain, Cloud DataFlow, Spanner).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Hadoop Ecosystem &amp; Four Computing Modes (pp. 44–45)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Component<\/th><th>Exact Official Role in Hadoop Ecosystem (p. 44)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>HDFS<\/strong><\/td><td>Distributed file system<\/td><\/tr>\n<tr><td><strong>YARN<\/strong><\/td><td>Unified resource allocator<\/td><\/tr>\n<tr><td><strong>MapReduce<\/strong><\/td><td>Batch processing<\/td><\/tr>\n<tr><td><strong>Spark<\/strong><\/td><td>In-memory computing (also used in batch &amp; stream computing)<\/td><\/tr>\n<tr><td><strong>Flink<\/strong><\/td><td>Unified stream and batch processing<\/td><\/tr>\n<tr><td><strong>Tez<\/strong><\/td><td>DAG computing<\/td><\/tr>\n<tr><td><strong>Hive / Pig<\/strong><\/td><td>Data warehouse (<code class=\"inline-code\">Hive<\/code>) / Data analysis platform (<code class=\"inline-code\">Pig<\/code>)<\/td><\/tr>\n<tr><td><strong>HBase<\/strong><\/td><td>Distributed non-relational database<\/td><\/tr>\n<tr><td><strong>ZooKeeper<\/strong><\/td><td>Distributed coordination service<\/td><\/tr>\n<tr><td><strong>Ambari / Oozie<\/strong><\/td><td>Installation and deployment tool (<code class=\"inline-code\">Ambari<\/code>) / Workflow scheduling system (<code class=\"inline-code\">Oozie<\/code>)<\/td><\/tr>\n<tr><td><strong>Flume / Sqoop / Mahout<\/strong><\/td><td>Log collection (<code class=\"inline-code\">Flume<\/code>) / ETL tool (<code class=\"inline-code\">Sqoop<\/code>) / Machine learning (<code class=\"inline-code\">Mahout<\/code>)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>Four Main Computing Modes of Big Data Applications (p. 45):<\/h4>\n<ol class=\"md-list\">\n<li><strong>Batch computing<\/strong>: Massive batch data — <strong>MapReduce, Spark<\/strong>.<\/li>\n<li><strong>Stream computing<\/strong>: Real-time stream data — <strong>Spark, Storm, Flink, Flume, DStream<\/strong>.<\/li>\n<li><strong>Graph computing<\/strong>: Massive graph data — <strong>GraphX<\/strong> (built-in Spark library), <strong>Gelly<\/strong> (built-in Flink library), <strong>Giraph<\/strong> (open-source counterpart to Google Pregel), <strong>PowerGraph<\/strong> (vertex-cuts for power-law natural graphs).<\/li>\n<li><strong>Query analytics and computing<\/strong>: Massive storage &amp; SQL query analytics — <strong>Hive, Impala<\/strong> (Cloudera, faster than Hive), <strong>Dremel<\/strong> (Google interactive analysis, referenced by Impala), <strong>Cassandra<\/strong> (Facebook open-source NoSQL combining Amazon Dynamo + Google Bigtable).<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: Hadoop Big Data Ecosystem & Computing Modes Mapping", "duration_mins": 8, "exercise_type": "config", "prompt_label": "bigdata@mrs-cluster:~#", "scenario": "You are designing a Huawei Cloud MRS big data architecture blueprint. Map the official Hadoop components to their exact roles and assign the graph/query frameworks.", "instructions": ["Set `deployment_tool` to `'Ambari'`, `workflow_scheduler` to `'Oozie'`, `coordination_service` to `'ZooKeeper'`, and `etl_tool` to `'Sqoop'`.", "Set `spark_graph_library` to `'GraphX'` and `flink_graph_library` to `'Gelly'`.", "Set `big_data_mode_relation` to `'after'` (modes are set after data is generated)."], "starter_code": "# Hadoop & Big Data Architecture Mapping\nhadoop_ecosystem:\n  deployment_tool: \"___\"\n  workflow_scheduler: \"___\"\n  coordination_service: \"___\"\n  etl_tool: \"___\"\n  log_collection: \"Flume\"\n  unified_resource_allocator: \"YARN\"\n\ngraph_and_schema:\n  spark_graph_library: \"___\"\n  flink_graph_library: \"___\"\n  big_data_mode_relation: \"___\"\n", "solution_code": "# Hadoop & Big Data Architecture Mapping\nhadoop_ecosystem:\n  deployment_tool: \"Ambari\"\n  workflow_scheduler: \"Oozie\"\n  coordination_service: \"ZooKeeper\"\n  etl_tool: \"Sqoop\"\n  log_collection: \"Flume\"\n  unified_resource_allocator: \"YARN\"\n\ngraph_and_schema:\n  spark_graph_library: \"GraphX\"\n  flink_graph_library: \"Gelly\"\n  big_data_mode_relation: \"after\"\n", "hints": ["Ambari handles installation and deployment; Oozie handles workflow scheduling; ZooKeeper provides distributed coordination; Sqoop is the ETL tool.", "GraphX is built into Spark; Gelly is built into Flink."], "validation_checks": [{"step": 1, "description": "Verify Ambari, Oozie, ZooKeeper, and Sqoop roles", "required_any": ["ambari"], "feedback_fail": "Set deployment_tool to 'Ambari'."}, {"step": 2, "description": "Verify Oozie, ZooKeeper, and Sqoop", "required_any": ["oozie", "zookeeper", "sqoop"], "feedback_fail": "Check workflow_scheduler ('Oozie'), coordination_service ('ZooKeeper'), and etl_tool ('Sqoop')."}, {"step": 3, "description": "Verify GraphX, Gelly, and mode-after-data principle", "required_any": ["graphx", "gelly"], "feedback_fail": "Set spark_graph_library to 'GraphX' and flink_graph_library to 'Gelly'."}], "simulated_output": "[OK] Hadoop Ecosystem Blueprint Validated:\n- Installation & Deployment: Ambari | Workflow Scheduling: Oozie | Coordination: ZooKeeper\n- ETL: Sqoop | Log Collection: Flume | Resource Allocator: YARN\n- Graph Libraries: Spark -> GraphX, Flink -> Gelly\n- Big Data Schema Rule: Modes are set AFTER data is generated (\"Fishing in the ocean\").", "quiz_questions": [{"id": "h1_s3_q1", "type": "single", "question": "In the Hadoop big data ecosystem, which component serves as the workflow scheduling system, and which serves as the installation and deployment tool?", "options": ["A. ZooKeeper (workflow scheduling) and Sqoop (installation/deployment)", "B. Oozie (workflow scheduling) and Ambari (installation/deployment)", "C. Tez (workflow scheduling) and Flume (installation/deployment)", "D. Pig (workflow scheduling) and YARN (installation/deployment)"], "answer": "B", "explanation": "According to Ch.01 p.44, Oozie is the workflow scheduling system, Ambari is the installation and deployment tool, ZooKeeper is the distributed coordination service, and Sqoop is the ETL tool."}, {"id": "h1_s3_q2", "type": "multiple", "question": "Which of the following statements accurately contrast Big Data processing with Traditional Data processing?", "options": ["A. In traditional data processing, modes (schemas) are set before data is generated ('fishing in the pond').", "B. In big data processing, modes are set after data is generated and evolve as data increases ('fishing in the ocean').", "C. XML and JSON files are typical examples of semi-structured data.", "D. Big data 1.0 is analyst-oriented, whereas Big data 2.0 is programmer-oriented."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.01, pp. 39, 42). D is false because Big Data 1.0 is programmer-oriented, Big Data 2.0 is analyst-oriented, and Big Data 3.0 is engineer-oriented (Ch.01, p.55)."}, {"id": "h1_s3_q3", "type": "single", "question": "Which of the following is the built-in graph computing algorithm library of Apache Flink?", "options": ["A. GraphX", "B. Gelly", "C. Impala", "D. Dremel"], "answer": "B", "explanation": "GraphX is the built-in graph computing library of Spark, while Gelly is the built-in graph computing algorithm library of Flink (Ch.01, p.45)."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-Artificial-Intelligence-and-Computing-Trends", "exercise_slug": "08-Exercise-AI-Elements-and-Heterogeneous-Trends-Lab", "lecture": {"title": "Artificial Intelligence History, Basic Elements & Industry Trends", "duration_mins": 8, "pdf_ref": "Ch.01, pp. 46–66", "objectives": ["Master the relationship between AI, Machine Learning, and Deep Learning and the 4 basic elements of AI applications", "Trace the peaks, troughs, recovery, and booming phases of AI development from 1956 to present", "Analyze AI computing power challenges, integer vs. floating-point workloads, x86-to-Arm transition, and cloud-edge collaboration"], "content_markdown": "### 1. AI, Machine Learning, Deep Learning & Basic Elements (pp. 47–51)\n- **Artificial Intelligence (AI)**: Coined by **John McCarthy in 1956** at the **Dartmouth Conference** as the *\"science and engineering of making intelligent machines, especially intelligent computer programs.\"*\n- **Machine Learning (ML, 1980s)**: Proposed by **Arthur Samuel in 1959**; **Tom Mitchell** defined it via experience E, task class T, and performance measure P. Builds models from sample/training data without explicit rules.\n- **Deep Learning (DL, 2010s)**: Subfield of ML originating from artificial neural networks (such as Multilayer Perceptron, **MLP**); **Geoffrey Hinton** spearheaded deep learning with backpropagation in **2006**.\n- **Four Basic Elements of AI Applications (pp. 48, 51, 61 Quiz Q1)**:\n  1. **Data**\n  2. **Algorithms**\n  3. **Computing power**\n  4. **Scenarios**\n  *(Note: On p. 56, the three conditions for explosive AI growth are **algorithm, computing power, and data**. **Talent** is NOT a basic element of AI applications!)*\n\n---\n\n### 2. AI Development History: Peaks & Troughs (pp. 49–50)\n| Period | Phase | Key Milestones & Causes |\n| :--- | :--- | :--- |\n| **1956–1976** | **First Peak** | **1956 Dartmouth Conference** coined AI; **1959 Arthur Samuel** proposed ML. |\n| **1976–1982** | **First Trough** | Failure of machine translation, negative academic reports, low hardware computing power, high algorithm complexity. |\n| **1982–1987** | **Second Peak** | Decision tree models, multi-layer neural networks, **Expert systems** (logical rule inference), and fifth-generation computer projects. |\n| **1987–1997** | **Second Trough** | **1987 Lisp machine market collapsed**; abstract reasoning hit bottlenecks and symbolic AI models faced opposition. |\n| **1997–2010** | **Recovery** | **1997 IBM Deep Blue** beat chess champion Garry Kasparov; **2006 Geoffrey Hinton** proposed Deep Learning; **2010** advent of Big Data era. |\n| **2010–Present** | **Booming** | **2014** Microsoft Cortana; **2017** DeepMind **AlphaGo Zero**; **2018** Transformer-based **BERT**; **2020** OpenAI **GPT-3**; **2022** Google **Imagen & DreamBooth** diffusion models. |\n\n---\n\n### 3. Computing Challenges & Emerging Trends (pp. 53–66)\n- **Top AI Application Fields in China (p. 53)**: Computer vision (**34%**), Data mining (**18%**), Machine learning (**17%**), Intelligent voice (**8%**), NLP (**7%**). The two primary general AI directions are **Computer Vision** and **NLP**.\n- **Challenges of AI Computing Power (p. 56)**: Explosive data growth, rising enterprise hardware investment/cost, **Moore's Law coming to an end** (Intel stopped its 2-year **\"Tick-Tock\"** CPU R&D cycle, extending it to 3 years), and single-CPU performance bottlenecks.\n- **Integer vs. Floating-Point Computing (p. 57)**:\n  - **Integer computations**: Outstanding in **text processing, storage, and big data analysis**.\n  - **Floating-point computations**: Excellent in **scientific computing and video processing**.\n- **Two Major Computing Industry Trends (p. 58)**:\n  1. **PCs \\rightarrow Intelligent Mobile Terminals**: In 2023, 1.17 billion mobile terminals vs. 240 million PCs shipped. Processor shift from **x86 to Arm**, requiring **homogeneous computing power** across cloud data centers (DCs) and mobile devices.\n  2. **All Things Connected (IoT & Cloud-Edge Collaboration)**: **AI computing power accounts for 80%** of computing power consumed in DCs. **Cloud-edge collaboration** uses **central training (Cloud DC) + edge inference (Edge)**.\n- **Key Chapter 01 Acronyms (pp. 64–65)**: **CANN** (*Compute Architecture for Neural Networks*, Ascend heterogeneous compute architecture for AI), **BMS** (*Bare Metal Server*), **NFV** (*Network Functions Virtualization*), **CRM** (*Computing Resource Manager*).", "key_takeaways": ["The 4 basic elements of AI applications are Data, Algorithms, Computing power, and Scenarios — Talent is NOT one of them (Ch.01 Quiz Q1)!", "AI History phases: 1st Peak (1956–1976), 1st Trough (1976–1982), 2nd Peak (1982–1987, Expert Systems), 2nd Trough (1987–1997, Lisp machine collapse), Recovery (1997–2010, Deep Blue & Hinton DL), Booming (2010–present).", "Integer computing excels at text processing, storage, and big data analysis; floating-point computing excels at scientific computing and video processing.", "AI computing power accounts for 80% of DC computing power, and Cloud-Edge collaboration combines Central Training + Edge Inference."], "exam_traps": ["EXAM TRAP (Ch.01 Quiz Q1): 'Which of the following is NOT a basic element of AI applications?' -> D. Talent! (Data, Algorithms, Computing power, and Scenario ARE the four basic elements).", "EXAM TRAP: Do not reverse Integer vs. Floating-point scenarios — Integer is for text processing, storage, and big data; Floating-point is for scientific computing and video processing."], "content_html": "<h3>1. AI, Machine Learning, Deep Learning &amp; Basic Elements (pp. 47–51)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Artificial Intelligence (AI)<\/strong>: Coined by <strong>John McCarthy in 1956<\/strong> at the <strong>Dartmouth Conference<\/strong> as the <em>\"science and engineering of making intelligent machines, especially intelligent computer programs.\"<\/em><\/li>\n<li><strong>Machine Learning (ML, 1980s)<\/strong>: Proposed by <strong>Arthur Samuel in 1959<\/strong>; <strong>Tom Mitchell<\/strong> defined it via experience E, task class T, and performance measure P. Builds models from sample/training data without explicit rules.<\/li>\n<li><strong>Deep Learning (DL, 2010s)<\/strong>: Subfield of ML originating from artificial neural networks (such as Multilayer Perceptron, <strong>MLP<\/strong>); <strong>Geoffrey Hinton<\/strong> spearheaded deep learning with backpropagation in <strong>2006<\/strong>.<\/li>\n<li><strong>Four Basic Elements of AI Applications (pp. 48, 51, 61 Quiz Q1)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Data<\/strong><\/li>\n<li><strong>Algorithms<\/strong><\/li>\n<li><strong>Computing power<\/strong><\/li>\n<li><strong>Scenarios<\/strong><\/li>\n<\/ol>\n<p><em>(Note: On p. 56, the three conditions for explosive AI growth are <strong>algorithm, computing power, and data<\/strong>. <strong>Talent<\/strong> is NOT a basic element of AI applications!)<\/em><\/p>\n<p>---<\/p>\n<h3>2. AI Development History: Peaks &amp; Troughs (pp. 49–50)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Period<\/th><th>Phase<\/th><th>Key Milestones &amp; Causes<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>1956–1976<\/strong><\/td><td><strong>First Peak<\/strong><\/td><td><strong>1956 Dartmouth Conference<\/strong> coined AI; <strong>1959 Arthur Samuel<\/strong> proposed ML.<\/td><\/tr>\n<tr><td><strong>1976–1982<\/strong><\/td><td><strong>First Trough<\/strong><\/td><td>Failure of machine translation, negative academic reports, low hardware computing power, high algorithm complexity.<\/td><\/tr>\n<tr><td><strong>1982–1987<\/strong><\/td><td><strong>Second Peak<\/strong><\/td><td>Decision tree models, multi-layer neural networks, <strong>Expert systems<\/strong> (logical rule inference), and fifth-generation computer projects.<\/td><\/tr>\n<tr><td><strong>1987–1997<\/strong><\/td><td><strong>Second Trough<\/strong><\/td><td><strong>1987 Lisp machine market collapsed<\/strong>; abstract reasoning hit bottlenecks and symbolic AI models faced opposition.<\/td><\/tr>\n<tr><td><strong>1997–2010<\/strong><\/td><td><strong>Recovery<\/strong><\/td><td><strong>1997 IBM Deep Blue<\/strong> beat chess champion Garry Kasparov; <strong>2006 Geoffrey Hinton<\/strong> proposed Deep Learning; <strong>2010<\/strong> advent of Big Data era.<\/td><\/tr>\n<tr><td><strong>2010–Present<\/strong><\/td><td><strong>Booming<\/strong><\/td><td><strong>2014<\/strong> Microsoft Cortana; <strong>2017<\/strong> DeepMind <strong>AlphaGo Zero<\/strong>; <strong>2018<\/strong> Transformer-based <strong>BERT<\/strong>; <strong>2020<\/strong> OpenAI <strong>GPT-3<\/strong>; <strong>2022<\/strong> Google <strong>Imagen &amp; DreamBooth<\/strong> diffusion models.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Computing Challenges &amp; Emerging Trends (pp. 53–66)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Top AI Application Fields in China (p. 53)<\/strong>: Computer vision (<strong>34%<\/strong>), Data mining (<strong>18%<\/strong>), Machine learning (<strong>17%<\/strong>), Intelligent voice (<strong>8%<\/strong>), NLP (<strong>7%<\/strong>). The two primary general AI directions are <strong>Computer Vision<\/strong> and <strong>NLP<\/strong>.<\/li>\n<li><strong>Challenges of AI Computing Power (p. 56)<\/strong>: Explosive data growth, rising enterprise hardware investment/cost, <strong>Moore's Law coming to an end<\/strong> (Intel stopped its 2-year <strong>\"Tick-Tock\"<\/strong> CPU R&amp;D cycle, extending it to 3 years), and single-CPU performance bottlenecks.<\/li>\n<li><strong>Integer vs. Floating-Point Computing (p. 57)<\/strong>:<\/li>\n<li><strong>Integer computations<\/strong>: Outstanding in <strong>text processing, storage, and big data analysis<\/strong>.<\/li>\n<li><strong>Floating-point computations<\/strong>: Excellent in <strong>scientific computing and video processing<\/strong>.<\/li>\n<li><strong>Two Major Computing Industry Trends (p. 58)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>PCs \\rightarrow Intelligent Mobile Terminals<\/strong>: In 2023, 1.17 billion mobile terminals vs. 240 million PCs shipped. Processor shift from <strong>x86 to Arm<\/strong>, requiring <strong>homogeneous computing power<\/strong> across cloud data centers (DCs) and mobile devices.<\/li>\n<li><strong>All Things Connected (IoT &amp; Cloud-Edge Collaboration)<\/strong>: <strong>AI computing power accounts for 80%<\/strong> of computing power consumed in DCs. <strong>Cloud-edge collaboration<\/strong> uses <strong>central training (Cloud DC) + edge inference (Edge)<\/strong>.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Key Chapter 01 Acronyms (pp. 64–65)<\/strong>: <strong>CANN<\/strong> (<em>Compute Architecture for Neural Networks<\/em>, Ascend heterogeneous compute architecture for AI), <strong>BMS<\/strong> (<em>Bare Metal Server<\/em>), <strong>NFV<\/strong> (<em>Network Functions Virtualization<\/em>), <strong>CRM<\/strong> (<em>Computing Resource Manager<\/em>).<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: AI Ecosystem Elements & Computing Workload Audit", "duration_mins": 7, "exercise_type": "script", "prompt_label": "python3@kunpeng-ai:~", "scenario": "Complete the Python audit script verifying the four basic elements of AI applications, AI historical phases, and workload mapping between integer and floating-point computations.", "instructions": ["Define `ai_basic_elements` as the exact 4 elements from Ch.01 (`'data'`, `'algorithms'`, `'computing power'`, `'scenarios'`), and set `not_an_ai_element` to `'talent'`.", "Set `text_and_bigdata_compute_type` to `'integer'` and `scientific_compute_type` to `'floating-point'`.", "Set `cloud_edge_pattern` to `'central training + edge inference'` and `dc_ai_power_percentage` to `80`."], "starter_code": "# Audit script for Ch.01 AI & Computing Trends\nai_basic_elements = [\"data\", \"algorithms\", \"computing power\", \"___\"]\nnot_an_ai_element = \"___\"\ntext_and_bigdata_compute_type = \"___\"\nscientific_compute_type = \"___\"\ncloud_edge_pattern = \"___\"\ndc_ai_power_percentage = ___\n\nprint(\"AI Elements:\", ai_basic_elements, \"| Excluded:\", not_an_ai_element)", "solution_code": "# Audit script for Ch.01 AI & Computing Trends\nai_basic_elements = [\"data\", \"algorithms\", \"computing power\", \"scenarios\"]\nnot_an_ai_element = \"talent\"\ntext_and_bigdata_compute_type = \"integer\"\nscientific_compute_type = \"floating-point\"\ncloud_edge_pattern = \"central training + edge inference\"\ndc_ai_power_percentage = 80\n\nprint(\"AI Elements:\", ai_basic_elements, \"| Excluded:\", not_an_ai_element)", "hints": ["The four basic elements on page 48 and page 51 are data, algorithms, computing power, and scenarios. Talent is the distractor in Ch.01 Quiz Q1.", "Integer computing excels at text processing and big data; floating-point excels at scientific computing."], "validation_checks": [{"step": 1, "description": "Include 'scenarios' in AI basic elements and identify 'talent' as excluded", "required_any": ["scenarios", "scenario"], "feedback_fail": "Include 'scenarios' in ai_basic_elements."}, {"step": 2, "description": "Identify 'talent' as the non-element from Ch.01 Quiz Q1", "required_any": ["talent"], "feedback_fail": "Set not_an_ai_element to 'talent'."}, {"step": 3, "description": "Specify integer vs floating-point and 80% DC AI computing share", "required_any": ["integer", "floating-point", "80"], "feedback_fail": "Specify 'integer', 'floating-point', and 80."}], "simulated_output": "AI Elements: ['data', 'algorithms', 'computing power', 'scenarios'] | Excluded: talent\nWorkload Mapping: Integer -> Text/Storage/Big Data | Floating-Point -> Scientific/Video\nCloud-Edge Synergy: central training + edge inference (AI accounts for 80% of DC compute).", "quiz_questions": [{"id": "h1_s4_q1", "type": "single", "question": "(Official Ch.01 Quiz Q1) Which of the following is not a basic element of AI applications?", "options": ["A. Data", "B. Scenario", "C. Computing power", "D. Talent"], "answer": "D", "explanation": "Data, algorithms, computing power, and scenarios are the four basic elements of AI applications (Ch.01, pp. 48, 51, 61 Quiz Q1). Talent is not one of the basic elements."}, {"id": "h1_s4_q2", "type": "single", "question": "During which period of AI development did expert systems with logical rule inference become popular and fifth-generation computers emerge?", "options": ["A. The first peak (1956–1976)", "B. The first trough (1976–1982)", "C. The second peak (1982–1987)", "D. The recovery period (1997–2010)"], "answer": "C", "explanation": "During the second peak (1982–1987), decision tree models, multi-layer neural networks, expert systems with logical rule inference, and fifth-generation computers emerged, before the Lisp machine market collapsed in 1987 (Ch.01, p.49)."}, {"id": "h1_s4_q3", "type": "tf", "question": "Floating-point computing is outstanding in text processing, storage, and big data analysis, whereas integer computing is mainly used for scientific computing.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.01 p.57, integer computing is outstanding in text processing, storage, and big data analysis, whereas floating-point computing is excellent in scientific computing and video processing."}]}}]}, {"hour_number": 2, "folder_name": "Hour-02-Computing-System-Overview-and-Virtualization", "title": "Computing System Overview, System Software & Virtualization", "chapter_ref": "Chapter 02 (pp. 68–129)", "duration_mins": 60, "overview": "Examine the three-layer computing system architecture (Hardware, Software, Solutions), RASUM server features, CISC vs. RISC instruction sets, OS/Middleware/Database fundamentals, Huawei FusionCompute virtualization, and Kunpeng HPC/MRS/ModelArts solutions.", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-Computing-System-Architecture-and-Server-Classification", "exercise_slug": "02-Exercise-Server-Classification-and-Instruction-Set-Lab", "lecture": {"title": "Computing System Architecture & Server Classification", "duration_mins": 7, "pdf_ref": "Ch.02, pp. 72–83", "objectives": ["Understand the Computing System formula (Computing System = Computer + Data) and its 3 layers (Hardware, Software, Solutions)", "Master the 5 RASUM server features and the chronological evolution of servers", "Compare Tower, Blade, and Rack servers, C/S vs. B/S deployment architectures, and CISC vs. RISC instruction sets"], "content_markdown": "### 1. Computing System Architecture & RASUM Features (pp. 72–75)\n- **Definition**: \Computing System = \Computer + \Data. In a narrow sense, it consists of a **hardware system** (hosts + peripherals) and a **software system** (system software + application software). Broadly, it is divided into three layers: **Hardware**, **Software**, and **Solutions**.\n- **Five Server Features (RASUM, p. 75)**:\n  - **R — Reliability**: Duration that the server operates consecutively without failure.\n  - **A — Availability**: Percentage of normal system uptime and service time.\n  - **S — Scalability**: Hardware expansion and OS support capabilities.\n  - **U — Usability**: Ease of maintaining and restoring server hardware and software.\n  - **M — Manageability**: Monitoring, alarm reporting of running status, and intelligent fault processing.\n\n---\n\n### 2. Server Development Timeline (p. 76 — Official Quiz Q1 Trap!)\nServers evolved strictly in the following chronological sequence:\n1. **Mainframes (1940s–1950s)**: Birth of ENIAC ushered in the mainframe era (modern mainframes are ~2 m high × 1–3 m long × 1 m wide).\n2. **Midrange Computers (1960s–1970s)**: Mainframes scaled down for SMEs and institutions at an affordable cost (cabinet-sized).\n3. **Microcomputers (1970s–1980s)**: Second scale-down; Apple Inc. founded in 1976, Apple II (1977), IBM-PC (1981).\n4. **General-Purpose Servers (1980s–1990s)**: Intel launched the first x86 processor in **1978**; **Compaq launched SystemPro** in the 1980s (world's first standard x86 server); Intel launched **Pentium (1993)** and **Pentium Pro (1995, x86 server CPU)**.\n\n---\n\n### 3. Server Classification by Form Factor, Usage & Processor (pp. 77–83)\n| Form Factor | Characteristics | Advantages | Disadvantages |\n| :--- | :--- | :--- | :--- |\n| **Tower Server** | Vertically placed like a PC; reserved motherboard slots | **Easy maintenance & upgrade**, **Low cost** (ideal for SMEs) | **Large space occupation**, **High power consumption** (independent cooling/PSU) |\n| **Blade Server** | Chassis housing multiple swappable thin server blades | **Small footprint**, **Easy expansion** (hot-swappable blades, unified management) | **High heat dissipation requirements**, **High cost** & complex maintenance |\n| **Rack Server** | Standardized width (**19-inch / 48.26 cm** cabinet); heights in **1U (4.45 cm), 2U (8.9 cm), 4U (17.8 cm)** | **Space saving**, **Low power consumption** (shared cabinet cooling) | **Limited scalability** vs. tower, **High initial cost** (cabinets, power, cooling) |\n\n- **Deployment Architectures (p. 81)**:\n  - **C/S (Client/Server)**: Dedicated client GUI software (e.g., **FileZilla** or **WinSCP**) connects to backend server daemon (e.g., **vsftpd**). Fast communication.\n  - **B/S (Browser/Server)**: Users only need a web browser; application logic is centralized on the server and middleware.\n- **Processor Instruction Sets (pp. 82–83)**:\n  - **CISC (Complex Instruction Set Computing)**: **x86** (Intel Core, AMD Ryzen). Uses microprograms in ROM; variable instruction length; complex hardware structure, **beneficial for compiler development**.\n  - **RISC (Reduced Instruction Set Computing)**: Proposed by **Prof. David Patterson (1979)** after observing **80% of computing uses only 20% of instructions**. Includes **Arm** (Huawei Kunpeng, Apple A-series), **RISC-V** (Qualcomm Snapdragon Wear), and **MIPS** (Loongson 2). Fixed instruction length, register-based operations, simpler CPU hardware, **higher requirements on compiler design**. Software compiled for CISC cannot run directly on RISC without recompilation or binary translation.", "key_takeaways": ["Server evolution order: Mainframes (1940s–50s) -> Midrange computers (1960s–70s) -> Microcomputers (1970s–80s) -> General-purpose servers (1980s–90s, Compaq SystemPro & Intel Pentium Pro).", "1U equals 4.45 cm (1.75 inches), and standard rack cabinets are 19 inches (48.26 cm) wide.", "CISC (x86) has complex CPU hardware but simplifies compiler design; RISC (Arm, RISC-V, MIPS) simplifies CPU hardware with fixed-length instructions but places higher requirements on compiler design."], "exam_traps": ["EXAM TRAP (Ch.02 Quiz Q1): 'Servers are developed from midrange computers to general-purpose servers and then to mainframe servers.' -> FALSE! Mainframes came FIRST (1940s–50s), then Midrange (1960s–70s), Microcomputers (1970s–80s), and General-purpose servers (1980s–90s).", "EXAM TRAP: Loongson 2 uses MIPS (RISC), Qualcomm Snapdragon Wear uses RISC-V, and Huawei Kunpeng uses Arm (RISC)."], "content_html": "<h3>1. Computing System Architecture &amp; RASUM Features (pp. 72–75)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Definition<\/strong>: \Computing System = \Computer + \Data. In a narrow sense, it consists of a <strong>hardware system<\/strong> (hosts + peripherals) and a <strong>software system<\/strong> (system software + application software). Broadly, it is divided into three layers: <strong>Hardware<\/strong>, <strong>Software<\/strong>, and <strong>Solutions<\/strong>.<\/li>\n<li><strong>Five Server Features (RASUM, p. 75)<\/strong>:<\/li>\n<li><strong>R — Reliability<\/strong>: Duration that the server operates consecutively without failure.<\/li>\n<li><strong>A — Availability<\/strong>: Percentage of normal system uptime and service time.<\/li>\n<li><strong>S — Scalability<\/strong>: Hardware expansion and OS support capabilities.<\/li>\n<li><strong>U — Usability<\/strong>: Ease of maintaining and restoring server hardware and software.<\/li>\n<li><strong>M — Manageability<\/strong>: Monitoring, alarm reporting of running status, and intelligent fault processing.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Server Development Timeline (p. 76 — Official Quiz Q1 Trap!)<\/h3>\n<p>Servers evolved strictly in the following chronological sequence:<\/p>\n<ol class=\"md-list\">\n<li><strong>Mainframes (1940s–1950s)<\/strong>: Birth of ENIAC ushered in the mainframe era (modern mainframes are ~2 m high × 1–3 m long × 1 m wide).<\/li>\n<li><strong>Midrange Computers (1960s–1970s)<\/strong>: Mainframes scaled down for SMEs and institutions at an affordable cost (cabinet-sized).<\/li>\n<li><strong>Microcomputers (1970s–1980s)<\/strong>: Second scale-down; Apple Inc. founded in 1976, Apple II (1977), IBM-PC (1981).<\/li>\n<li><strong>General-Purpose Servers (1980s–1990s)<\/strong>: Intel launched the first x86 processor in <strong>1978<\/strong>; <strong>Compaq launched SystemPro<\/strong> in the 1980s (world's first standard x86 server); Intel launched <strong>Pentium (1993)<\/strong> and <strong>Pentium Pro (1995, x86 server CPU)<\/strong>.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. Server Classification by Form Factor, Usage &amp; Processor (pp. 77–83)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Form Factor<\/th><th>Characteristics<\/th><th>Advantages<\/th><th>Disadvantages<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Tower Server<\/strong><\/td><td>Vertically placed like a PC; reserved motherboard slots<\/td><td><strong>Easy maintenance &amp; upgrade<\/strong>, <strong>Low cost<\/strong> (ideal for SMEs)<\/td><td><strong>Large space occupation<\/strong>, <strong>High power consumption<\/strong> (independent cooling/PSU)<\/td><\/tr>\n<tr><td><strong>Blade Server<\/strong><\/td><td>Chassis housing multiple swappable thin server blades<\/td><td><strong>Small footprint<\/strong>, <strong>Easy expansion<\/strong> (hot-swappable blades, unified management)<\/td><td><strong>High heat dissipation requirements<\/strong>, <strong>High cost<\/strong> &amp; complex maintenance<\/td><\/tr>\n<tr><td><strong>Rack Server<\/strong><\/td><td>Standardized width (<strong>19-inch / 48.26 cm<\/strong> cabinet); heights in <strong>1U (4.45 cm), 2U (8.9 cm), 4U (17.8 cm)<\/strong><\/td><td><strong>Space saving<\/strong>, <strong>Low power consumption<\/strong> (shared cabinet cooling)<\/td><td><strong>Limited scalability<\/strong> vs. tower, <strong>High initial cost<\/strong> (cabinets, power, cooling)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>Deployment Architectures (p. 81)<\/strong>:<\/li>\n<li><strong>C/S (Client/Server)<\/strong>: Dedicated client GUI software (e.g., <strong>FileZilla<\/strong> or <strong>WinSCP<\/strong>) connects to backend server daemon (e.g., <strong>vsftpd<\/strong>). Fast communication.<\/li>\n<li><strong>B/S (Browser/Server)<\/strong>: Users only need a web browser; application logic is centralized on the server and middleware.<\/li>\n<li><strong>Processor Instruction Sets (pp. 82–83)<\/strong>:<\/li>\n<li><strong>CISC (Complex Instruction Set Computing)<\/strong>: <strong>x86<\/strong> (Intel Core, AMD Ryzen). Uses microprograms in ROM; variable instruction length; complex hardware structure, <strong>beneficial for compiler development<\/strong>.<\/li>\n<li><strong>RISC (Reduced Instruction Set Computing)<\/strong>: Proposed by <strong>Prof. David Patterson (1979)<\/strong> after observing <strong>80% of computing uses only 20% of instructions<\/strong>. Includes <strong>Arm<\/strong> (Huawei Kunpeng, Apple A-series), <strong>RISC-V<\/strong> (Qualcomm Snapdragon Wear), and <strong>MIPS<\/strong> (Loongson 2). Fixed instruction length, register-based operations, simpler CPU hardware, <strong>higher requirements on compiler design<\/strong>. Software compiled for CISC cannot run directly on RISC without recompilation or binary translation.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Server Form Factor, Timeline & ISA Verification", "duration_mins": 7, "exercise_type": "script", "prompt_label": "python3@kunpeng-lab:~", "scenario": "Write a verification script that checks the chronological evolution of servers, rack unit dimensions, and instruction set mappings.", "instructions": ["Complete `server_timeline` in chronological order: `'mainframes'`, `'midrange'`, `'microcomputers'`, `'general-purpose'`.", "Set `one_u_cm` to `4.45` and `rack_width_inches` to `19`.", "Set `kunpeng_isa` to `'RISC'` and `first_standard_x86_server` to `'SystemPro'`."], "starter_code": "# Server Hardware & ISA Verification\nserver_timeline = [\"mainframes
