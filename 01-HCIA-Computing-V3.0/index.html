s.<\/li>\n<li><strong>Health Evaluation<\/strong>: Outputs device health reports based on logs or inspection reports.<\/li>\n<li><strong>Call Home (p. 437)<\/strong>: Automatic fault reporting method that <strong>automatically sends hardware alarms<\/strong> generated by Huawei devices via <code class=\"inline-code\">eServiceClient<\/code> to the <strong>Huawei technical support center<\/strong>, <strong>automatically creates trouble tickets<\/strong>, and pushes expert inspection reports within hours.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Official Ch.06 Quiz Q1 (p. 438)<\/strong>: Which tools can configure RAIDs on bare-metal TaiShan 200 (2280) servers during project delivery?<\/li>\n<li><strong>Answer: <code class=\"inline-code\">ABC<\/code> — A. Smart Provisioning, B. SmartKit, C. iBMC!<\/strong> (<strong>D. eService<\/strong> is for remote monitoring/inspection/Call Home and <strong>cannot<\/strong> configure RAID!).<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: SmartKit Delivery Pipeline & eService Call Home Verification", "duration_mins": 8, "exercise_type": "config", "prompt_label": "fe-engineer@smartkit-laptop:~#", "scenario": "You are delivering a batch of bare-metal TaiShan 200 (2280) servers on site using SmartKit and configuring eService Call Home for post-delivery maintenance.", "instructions": ["Set `raid_capable_tools` to `['Smart Provisioning', 'SmartKit', 'iBMC']` and `excluded_remote_om_tool` to `'eService'`.", "Set `smartkit_max_parallel_tasks` to `50` and `ts200_burn_in_engine` to `'Smart Provisioning'` (while V3 uses `'FTK.iso'`).", "Set `eservice_auto_ticket_feature` to `'Call Home'`."], "starter_code": "# SmartKit Delivery & eService Remote O&M Configuration\nraid_configuration_quiz:\n  raid_capable_tools:\n    - \"___\"\n    - \"___\"\n    - \"___\"\n  excluded_remote_om_tool: \"___\"\n\nsmartkit_capabilities:\n  smartkit_max_parallel_tasks: ___\n  ts200_burn_in_engine: \"___\"\n  v3_burn_in_iso: \"FTK.iso\"\n  out_of_band_firmware: [\"iBMC\", \"BIOS\", \"Smart Provisioning\"]\n  in_band_firmware: [\"PCIe card firmware\", \"Drive firmware\"]\n\neservice_remote_om:\n  eservice_auto_ticket_feature: \"___\"\n", "solution_code": "# SmartKit Delivery & eService Remote O&M Configuration\nraid_configuration_quiz:\n  raid_capable_tools:\n    - \"Smart Provisioning\"\n    - \"SmartKit\"\n    - \"iBMC\"\n  excluded_remote_om_tool: \"eService\"\n\nsmartkit_capabilities:\n  smartkit_max_parallel_tasks: 50\n  ts200_burn_in_engine: \"Smart Provisioning\"\n  v3_burn_in_iso: \"FTK.iso\"\n  out_of_band_firmware: [\"iBMC\", \"BIOS\", \"Smart Provisioning\"]\n  in_band_firmware: [\"PCIe card firmware\", \"Drive firmware\"]\n\neservice_remote_om:\n  eservice_auto_ticket_feature: \"Call Home\"\n", "hints": ["Smart Provisioning, SmartKit, and iBMC can configure RAID on bare-metal TaiShan 2280 servers; eService cannot (Ch.06 Quiz Q1).", "SmartKit runs up to 50 parallel tasks, uses Smart Provisioning for TS200 burn-in tests, and eService uses Call Home for automatic alarm reporting and ticket creation."], "validation_checks": [{"step": 1, "description": "Verify Smart Provisioning, SmartKit, and iBMC as RAID-capable tools", "required_any": ["smart provisioning", "smartkit", "ibmc"], "feedback_fail": "Include 'Smart Provisioning', 'SmartKit', and 'iBMC' in raid_capable_tools."}, {"step": 2, "description": "Verify eService exclusion and 50 parallel tasks in SmartKit", "required_any": ["eservice", "50"], "feedback_fail": "Set excluded_remote_om_tool to 'eService' and smartkit_max_parallel_tasks to 50."}, {"step": 3, "description": "Verify Call Home feature in eService", "required_any": ["call home"], "feedback_fail": "Set eservice_auto_ticket_feature to 'Call Home'."}], "simulated_output": "[OK] SmartKit & eService O&M Configuration Validated:\n- Bare-Metal RAID Config Tools (Ch.06 Quiz Q1): Smart Provisioning, SmartKit, iBMC (ABC) [eService excluded]\n- SmartKit: 50 parallel tasks | OS Deploy (SP = OS+Driver; Image Mount = Faster) | Burn-in (TS200=SP, V3=FTK.iso)\n- eService: Remote Inspection, Log Collection, Fault Diagnosis (FMA), Health Evaluation, Call Home (auto trouble ticket).", "quiz_questions": [{"id": "h8_s4_q1", "type": "multiple", "question": "(Official Ch.06 Quiz Q1) A batch of TaiShan 200 2280 balanced servers are purchased, but they do not have pre-integrated software. During project delivery, engineers need to configure RAIDs for these servers and install OSs. Which of the following computing management software can be used to configure RAIDs for these servers?", "options": ["A. Smart Provisioning", "B. SmartKit", "C. iBMC", "D. eService"], "answer": "ABC", "explanation": "According to Ch.06 p.438 Official Quiz Q1, Smart Provisioning (A), SmartKit (B), and iBMC (C) can all be used to configure RAIDs on bare-metal TaiShan 200 (2280) servers. eService (D) is a remote O&M platform for monitoring, log collection, health evaluation, and Call Home, and cannot configure RAID."}, {"id": "h8_s4_q2", "type": "single", "question": "In Huawei eService, which feature automatically sends hardware alarms generated by Huawei devices to the Huawei technical support center and automatically creates trouble tickets for quick handling?", "options": ["A. Smart Provisioning", "B. Call Home", "C. Burn-in Test", "D. Electronic label modification"], "answer": "B", "explanation": "According to Ch.06 p.437, Call Home is an automatic fault reporting method in eService that sends hardware alarms from Huawei devices to the Huawei technical support center and automatically creates trouble tickets."}, {"id": "h8_s4_q3", "type": "multiple", "question": "Which of the following statements about Huawei SmartKit functions are true?", "options": ["A. When SmartKit configures device IP addresses using known MAC addresses or SNs (Scenario 1), it uses link-local addresses, so the PC and server cannot be connected across routes.", "B. SmartKit OS deployment via onboard Smart Provisioning deploys the OS and driver simultaneously, whereas direct deployment through image mounting is faster and independent of Smart Provisioning (driver installed after OS).", "C. In SmartKit Firmware Upgrade, iBMC, BIOS, and Smart Provisioning are out-of-band parts, while PCIe card firmware and drive firmware are in-band firmware.", "D. For Burn-in Tests on TaiShan 200 and V5 servers, SmartKit uses iBMC to deliver commands to Smart Provisioning to stress-test the CPU, memory, and disks."], "answer": "ABCD", "explanation": "All four statements come directly from Ch.06 pp. 421, 424, 429, and 430."}]}}]}], "mock_exam": {"folder_name": "Hour-09-Final-Mock-Exam", "title": "HCIA-Computing V3.0 — National Stage Final Mock Exam", "duration_mins": 60, "total_points": 1000, "passing_points": 800, "instructions": "60 Questions in 60 Minutes: 20 Single-Choice (15 pts each), 20 Multiple-Choice (20 pts each, strict all-or-nothing grading), 10 True/False (10 pts each), and 10 Hands-On Command/SQL/Scenario Fill-in Labs (20 pts each).", "questions": [{"id": 1, "type": "single", "points": 15, "chapter": "Ch.01 History of Computing", "question": "(Official Ch.01 Quiz Q1) Which of the following is not a basic element of AI applications?", "options": ["A. Data", "B. Scenario", "C. Computing power", "D. Talent"], "answer": "D", "explanation": "According to Ch.01 pp. 48, 51, and p. 62 Quiz Q1, Data, Algorithms, Computing power, and Scenarios are the four basic elements of AI applications. Talent is not a basic element."}, {"id": 2, "type": "single", "points": 15, "chapter": "Ch.01 History of Computing", "question": "In 1946, a research team led by John Mauchly at the University of Pennsylvania developed the second electronic computer and the world's first general-purpose programmable electronic computer. What was its name and speed?", "options": ["A. ABC; 1,000 additions/second", "B. ENIAC; up to 5,000 additions or 400 multiplications per second", "C. TRADIC; 800,000 operations/second", "D. Altair 8800; 50,000 operations/second"], "answer": "B", "explanation": "According to Ch.01 p.23, ENIAC (1946) is the second electronic computer (after ABC in 1937) and the first general-purpose computer, capable of up to 5,000 additions or 400 multiplications per second using 17,000+ electron tubes."}, {"id": 3, "type": "single", "points": 15, "chapter": "Ch.01 History of Computing", "question": "In the Hadoop big data ecosystem (Ch.01, p. 44), which component acts as the unified resource allocator, and which acts as the distributed coordination service?", "options": ["A. MapReduce (resource allocator) and Ambari (coordination service)", "B. YARN (unified resource allocator) and ZooKeeper (distributed coordination service)", "C. Oozie (resource allocator) and Sqoop (coordination service)", "D. HDFS (resource allocator) and Flume (coordination service)"], "answer": "B", "explanation": "According to Ch.01 p.44, YARN is the unified resource allocator, ZooKeeper is the distributed coordination service, Ambari is the installation/deployment tool, and Oozie is the workflow scheduling system."}, {"id": 4, "type": "single", "points": 15, "chapter": "Ch.02 Computing System Overview", "question": "(Official Ch.02 Quiz Q2 / p. 98) According to the database model definitions in Chapter 02 (p. 98), which database model allows more than one node to have no parent and allows a node to have more than one parent?", "options": ["A. Hierarchical model", "B. Network model", "C. Relational model", "D. Transaction model"], "answer": "B", "explanation": "On Ch.02 p.98, the Network model is explicitly defined as: 'Allows more than one node to have no parent. A node can have more than one parent.' (Whereas the Hierarchical model has only one root node and each non-root node has only one parent)."}, {"id": 5, "type": "single", "points": 15, "chapter": "Ch.02 Computing System Overview", "question": "When comparing Windows Server 2022 Standard edition with Datacenter edition (Ch.02, p. 88), how many Virtual Machines (VMs) does each Standard edition license permit?", "options": ["A. Unlimited VMs and one Hyper-V host", "B. Only two VMs and one Hyper-V host", "C. Up to 16 VMs and two Hyper-V hosts", "D. Zero VMs; Standard edition does not support Hyper-V"], "answer": "B", "explanation": "According to Ch.02 p.88, each Windows Server 2022 Datacenter license allows an unlimited number of VMs and one Hyper-V host (plus SDN, Storage Spaces Direct, and Network Controller), whereas each Standard edition license permits only two VMs and one Hyper-V host."}, {"id": 6, "type": "single", "points": 15, "chapter": "Ch.02 Computing System Overview", "question": "To deploy Huawei FusionCompute on physical servers (Ch.02, p. 115), what are the minimum system drive capacities required for the VRM node and each compute node, respectively?", "options": ["A. VRM >= 150 GB; Compute node >= 270 GB", "B. VRM >= 270 GB; Compute node >= 150 GB", "C. VRM >= 80 GB; Compute node >= 48 GB", "D. VRM >= 500 GB; Compute node >= 500 GB"], "answer": "B", "explanation": "According to Ch.02 p.115, the system drive on the Virtual Resource Manager (VRM) node must be >= 270 GB, and the system drive on each compute node must be >= 150 GB."}, {"id": 7, "type": "single", "points": 15, "chapter": "Ch.03 Server Architecture Overview", "question": "In a server CPU's Control Unit (Ch.03, pp. 138, 224), which component decodes an instruction into an operation code and an address code, and which component generates micro-operation control signals?", "options": ["A. Program Counter (PC) and Instruction Register (IR)", "B. Instruction Decoder (ID) and Operation Controller (OC)", "C. ALU and L1 Cache", "D. SPD and TSOD"], "answer": "B", "explanation": "According to Ch.03 pp. 138 and 224, the Instruction Decoder (ID) decodes instructions into operation codes and address codes, while the Operation Controller (OC) generates operation control signals according to predetermined timing."}, {"id": 8, "type": "single", "points": 15, "chapter": "Ch.03 Server Architecture Overview", "question": "On a TaiShan 200 (model 2280) server equipped with two Kunpeng 920 processors (Ch.03, pp. 147–148), which of the following DIMM counts installed on a SINGLE CPU results in an UNBALANCED memory channel configuration?", "options": ["A. 8 DIMMs on CPU 1 and 8 DIMMs on CPU 2", "B. 16 DIMMs on CPU 1 and 16 DIMMs on CPU 2", "C. 12 DIMMs on CPU 1", "D. 4 DIMMs on CPU 1 and 4 DIMMs on CPU 2"], "answer": "C", "explanation": "According to Ch.03 p.148, each Kunpeng 920 CPU has 8 memory channels (2 DIMMs per channel = 16 slots per CPU). If a single CPU is configured with 3, 5, 7, 9, 10, 11, 12, 13, 14, or 15 DIMMs, the memory configuration between channels is unbalanced."}, {"id": 9, "type": "single", "points": 15, "chapter": "Ch.03 Server Architecture Overview", "question": "According to the drive benchmark table in Chapter 03 (p. 158), what are the typical 4 KB Random Write IOPS and 128 KB Sequential Read Bandwidth of an NVMe SSD?", "options": ["A. 450 IOPS and 290 MB/s", "B. 30–60K IOPS and 540 MB/s", "C. 155K IOPS and 1000 MB/s", "D. 300K IOPS and 3500 MB/s"], "answer": "D", "explanation": "According to Ch.03 p.158: SATA HDD = 330 IOPS / 200 MB/s; SAS 10K = 350 / 195 MB/s; SAS 15K = 450 / 290 MB/s; SATA SSD = 30–60K / 540 MB/s; SAS SSD = 155K / 1000 MB/s; NVMe SSD = 300K IOPS / 3500 MB/s."}, {"id": 10, "type": "single", "points": 15, "chapter": "Ch.03 Server Architecture Overview", "question": "Which RAID level uses two independent distributed parity codes (P and Q, where P uses XOR and Q uses Galois field multiplication) so that data accessibility remains unaffected even if two disks fail simultaneously?", "options": ["A. RAID 1E", "B. RAID 5", "C. RAID 6", "D. RAID 10"], "answer": "C", "explanation": "According to Ch.03 p.161, RAID 6 uses two independent distributed parity codes: P0 = D0 xor D1 and Q0 = (D0*K0) xor (D1*K1), tolerating up to two simultaneous disk failures."}, {"id": 11, "type": "single", "points": 15, "chapter": "Ch.03 Server Architecture Overview", "question": "What are the total pin count and total physical length of a PCIe x16 slot, and what is its bandwidth under PCIe 3.0 vs. PCIe 4.0 (Ch.03, p. 173)?", "options": ["A. 36 pins, 25 mm; 2.0 GB/s (PCIe 3.0) vs. 4.0 GB/s (PCIe 4.0)", "B. 98 pins, 56 mm; 7.88 GB/s (PCIe 3.0) vs. 15.75 GB/s (PCIe 4.0)", "C. 164 pins, 89 mm; 15.8 GB/s (PCIe 3.0) vs. 31.5 GB/s (PCIe 4.0)", "D. 64 pins, 39 mm; 3.94 GB/s (PCIe 3.0) vs. 7.88 GB/s (PCIe 4.0)"], "answer": "C", "explanation": "According to Ch.03 p.173, a PCIe x16 slot has 164 total pins (142 in main port area), a total length of 89 mm (71.65 mm main port area), and delivers 15.8 GB/s in PCIe 3.0 (8.0 GT/s) and 31.5 GB/s in PCIe 4.0 (16.0 GT/s)."}, {"id": 12, "type": "single", "points": 15, "chapter": "Ch.03 Server Architecture Overview", "question": "In computing power measurement (Ch.03, p. 185), how many floating-point operations per second do PFLOPS and EFLOPS represent, and which metric focuses on integer computing power?", "options": ["A. PFLOPS = 10^12, EFLOPS = 10^15; MFLOPS focuses on integer computing", "B. PFLOPS = 10^15 (quadrillion), EFLOPS = 10^18 (quintillion); TOPS focuses on integer computing", "C. PFLOPS = 10^9, EFLOPS = 10^12; GFLOPS focuses on integer computing", "D. PFLOPS = 10^6, EFLOPS = 10^9; DWPD focuses on integer computing"], "answer": "B", "explanation": "According to Ch.03 p.185: MFLOPS = 10^6, GFLOPS = 10^9, TFLOPS = 10^12, PFLOPS = 10^15, EFLOPS = 10^18; TOPS (teraOPS) measures trillions of operations per second focusing on integer computing power."}, {"id": 13, "type": "single", "points": 15, "chapter": "Ch.04 Huawei Computing Industry", "question": "Which bus technology in the Huawei Kunpeng 920 processor provides coherent memory access across cores, devices, and clusters with up to 480 Gbit/s inter-chip bandwidth and supports up to four sockets (256 physical cores)?", "options": ["A. ISA bus", "B. AGP bus", "C. Huawei Cache Coherence System (HCCS) bus", "D. SATA 3.0 bus"], "answer": "C", "explanation": "According to Ch.04 p.237, the Huawei Cache Coherence System (HCCS) bus provides coherent access to system memory with up to 480 Gbit/s inter-chip bandwidth, allowing interconnection of up to four Kunpeng 920 processors (256 physical cores)."}, {"id": 14, "type": "single", "points": 15, "chapter": "Ch.04 Huawei Computing Industry", "question": "In Software-Defined Storage (SDS) scenarios (Ch.04, p. 256), by how much does the Kunpeng 920 processor's built-in compression engine reduce data compression time and increase IOPS compared to traditional processor algorithms?", "options": ["A. Reduces compression time by 10% and increases IOPS by 5%", "B. Reduces compression time by 66% and increases IOPS performance by more than 20%", "C. Reduces compression time by 99% and increases IOPS by 500%", "D. Does not support compression in SDS scenarios"], "answer": "B", "explanation": "According to Ch.04 p.256, in SDS scenarios, the Kunpeng processor uses a built-in data compression engine and multi-core parallel computing to reduce compression time by 66% and increase IOPS performance by more than 20%."}, {"id": 15, "type": "single", "points": 15, "chapter": "Ch.05 Computing Product Deployment", "question": "(Official Ch.05 Quiz Q1) To install the OS using the openEuler-22.03-LTS-aarch64-dvd.iso file, which of the following boot options needs to be used?", "options": ["A. Hard disk drive", "B. DVD-ROM drive", "C. Floppy drive", "D. PXE"], "answer": "B", "explanation": "According to Ch.05 p.329 and p.346 Quiz Q1, when installing the OS using the mounted `openEuler-22.03-LTS-aarch64-dvd.iso` file on the remote virtual console, the boot option must be set to DVD-ROM drive."}, {"id": 16, "type": "single", "points": 15, "chapter": "Ch.05 Computing Product Deployment", "question": "What are the default user name and password for the 'Default iBMC login user' (distinct from the WebUI/CLI `Administrator` account) on a TaiShan 200 (model 2280) server (Ch.05, p. 297)?", "options": ["A. User name: root; Default password: Huawei12#", "B. User name: admin; Default password: Admin@123", "C. User name: omm; Default password: Gauss@123", "D. User name: guest; Default password: Guest@9000"], "answer": "A", "explanation": "According to the table on Ch.05 p.297: Default iBMC login user = `root` / `Huawei12#`; iBMC WebUI or CLI login = `Administrator` / `Admin@9000`; iBMC U-Boot data default password = `Admin@9000`."}, {"id": 17, "type": "single", "points": 15, "chapter": "Ch.05 Computing Product Deployment", "question": "When installing a device driver and firmware on a server (Ch.05, p. 335), what is the correct sequence for 'Overwrite installation' (upgrading a device that already has driver and firmware installed)?", "options": ["A. Install the driver first, and then install the firmware", "B. Install the firmware first, and then install the driver", "C. Uninstall the OS kernel first, and then format the RAID array", "D. Only install the driver; firmware can never be upgraded"], "answer": "B", "explanation": "According to the flowchart on Ch.05 p.335: Initial installation installs the driver first and then the firmware; Overwrite installation installs the firmware first and then the driver."}, {"id": 18, "type": "single", "points": 15, "chapter": "Ch.06 Basic O&M of Computing Products", "question": "In Huawei computing products (such as X6800 and E9000), which control unit complies with IPMI 2.0 specifications and supplements the server node iBMC by managing chassis power supplies, fan speed adjustment, asset collection, and network convergence (Ch.06, pp. 358, 442)?", "options": ["A. IES (Intelligent Edge System)", "B. HMM (Hyper Management Module)", "C. FTK (FusionServer Tools Toolkit)", "D. KML (Kunpeng Math Library)"], "answer": "B", "explanation": "According to Ch.06 pp. 358 and 442, the Hyper Management Module (HMM) is a controller designed for power supply and fan management that complies with IPMI 2.0 and supplements the iBMC of a server node."}, {"id": 19, "type": "single", "points": 15, "chapter": "Ch.06 Basic O&M of Computing Products", "question": "In Huawei FusionDirector's Automatic Go-Online Planning (Ch.06, p. 385), which component is used to obtain the rack U marks of servers in location-based planning, and what happens when location planning is enabled?", "options": ["A. Uses iRM to obtain U marks; the activation switch based on SN/MAC planning is automatically disabled", "B. Uses Postfix to obtain U marks; both location and SN/MAC planning run simultaneously", "C. Uses Dovecot to obtain U marks; the iBMC is formatted", "D. Uses Kbox to obtain U marks; DHCP relay is automatically installed"], "answer": "A", "explanation": "According to Ch.06 p.385, installation planning by location uses iRM to obtain the U marks of servers deployed in a rack. When location planning is enabled, the activation switch based on SN/MAC planning is automatically disabled (and vice versa)."}, {"id": 20, "type": "single", "points": 15, "chapter": "Ch.06 Basic O&M of Computing Products", "question": "In Huawei eSight Device Power-On and Power-Off Management (Ch.06, p. 411), how are task execution priorities numbered and ordered?", "options": ["A. Priorities 1 to 100 in ascending order (100 is powered on first)", "B. Priorities 1 to 10 in descending order (devices with higher priority, i.e., 1, are powered on or off first)", "C. Priorities A to Z in alphabetical order", "D. All devices must be powered on at the exact same millisecond without priority intervals"], "answer": "B", "explanation": "According to Ch.06 p.411, there are intervals at which commands are executed for devices with different priorities (1 to 10 in descending order), and devices with higher priorities are powered on or off first."}, {"id": 21, "type": "multiple", "points": 20, "chapter": "Ch.01 History of Computing", "question": "(Official Ch.01 Quiz Q2) Which of the following places can be represented in the knot counting method of the Inca people?", "options": ["A. Hundreds", "B. Tens of hundreds", "C. Hundreds of thousands", "D. Thousands"], "answer": "ABD", "explanation": "According to Ch.01 p.10 and p.62 Official Quiz Q2, Inca Quipu knots represent Ones, Tens, Hundreds (A), Thousands (D), and Tens of thousands ('Tens of hundreds', B). 'Hundreds of thousands' (C) cannot be represented."}, {"id": 22, "type": "multiple", "points": 20, "chapter": "Ch.01 History of Computing", "question": "Which of the following statements about early and mechanical computing tools in Chapter 01 are true?", "options": ["A. In Chinese counting rods, the ones place uses the vertical format, the tens place uses the horizontal format, and vertical and horizontal formats alternate.", "B. The core idea of Napier's Bones (consisting of a board and 10 rods) is to replace multi-digit multiplication with addition and single-digit multiplication.", "C. The sautoir is the centerpiece carry mechanism of Blaise Pascal's Pascaline adder, which marks the evolution of human computing tools from manual to automatic.", "D. On Dorr Eugene Felt's key-driven Comptometer (1886), each key has two numbers whose sum is 9 (larger for addition/multiplication, smaller for subtraction/division)."], "answer": "ABCD", "explanation": "All four statements are exact facts from Ch.01 pp. 11, 13, 17, and 18."}, {"id": 23, "type": "multiple", "points": 20, "chapter": "Ch.01 History of Computing", "question": "With cloud transformation, enterprise data centers are transformed in which five ways according to Chapter 01 (p. 35)?", "options": ["A. From resource silos to resource pooling", "B. From centralized architecture to distributed architecture", "C. From dedicated hardware to software-defined storage (SDS) mode", "D. From manual handling to self-service and automatic service, and from distributed statistics to unified metering"], "answer": "ABCD", "explanation": "All five transformations are listed on Ch.01 p.35."}, {"id": 24, "type": "multiple", "points": 20, "chapter": "Ch.01 History of Computing", "question": "Which of the following statements about emerging computing trends in Chapter 01 (pp. 56–58) are true?", "options": ["A. Intel stopped using the two-year 'Tick-Tock' processor R&D model as Moore's Law encounters bottlenecks.", "B. Computing is transitioning from traditional PCs (x86) to intelligent mobile terminals (Arm), requiring homogeneous computing power on cloud DCs and devices.", "C. AI computing power accounts for 80% of computing power consumed in data centers.", "D. Cloud-edge collaboration combines central training in the cloud DC with edge inference at the network edge."], "answer": "ABCD", "explanation": "All four statements come directly from Ch.01 pp. 56 and 58."}, {"id": 25, "type": "multiple", "points": 20, "chapter": "Ch.02 Computing System Overview", "question": "(Official Ch.02 Quiz Q3) Which of the following statements are true about computing system solutions?", "options": ["A. The storage subsystem of the HPC solution hardware platform can be built using OceanStor Pacific products.", "B. Most applications in the education and scientific research fields are closed-source. The Kunpeng HPC ecosystem is accelerating the adaptation of these software.", "C. Users can use the MapReduce service (MRS) to run big data components such as HBase and Kafka.", "D. ModelArts is a one-stop AI development platform for developers to quickly create and deploy models."], "answer": "ACD", "explanation": "According to Ch.02 p.125 Official Quiz Q3, A, C, and D are true. B is false because more than 80% of applications in education and scientific research are open-source (Ch.02, pp. 119, 122)."}, {"id": 26, "type": "multiple", "points": 20, "chapter": "Ch.02 Computing System Overview", "question": "Which of the following are the five core features of a server (RASUM) defined in Chapter 02 (p. 75)?", "options": ["A. Reliability (duration that the server operates consecutively) and Availability (percentage of normal system uptime)", "B. Scalability (hardware expansion and OS support capabilities)", "C. Usability (easy to maintain and restore server hardware and software)", "D. Manageability (monitoring, alarm reporting, and intelligent fault processing)"], "answer": "ABCD", "explanation": "Reliability, Availability, Scalability, Usability, and Manageability are the five server features defined on Ch.02 p.75."}, {"id": 27, "type": "multiple", "points": 20, "chapter": "Ch.02 Computing System Overview", "question": "Which of the following statements accurately compare Tower, Blade, and Rack servers (Ch.02, pp. 78–80)?", "options": ["A. Tower servers offer easy maintenance/upgrade and low cost for SMEs, but occupy large space and have high power consumption.", "B. Blade servers have a small footprint and support hot-swappable expansion, but have high requirements on heat dissipation and high cost.", "C. Rack servers save space in 19-inch cabinets and have low power consumption via shared cooling, but have limited scalability compared with tower servers.", "D. Each blade in a blade server chassis cannot run its own independent operating system."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.02, pp. 78–80). D is false because each blade is an independent server and runs its own OS (p. 79)."}, {"id": 28, "type": "multiple", "points": 20, "chapter": "Ch.02 Computing System Overview", "question": "To achieve optimal performance when deploying openGauss 5.0.0+ on a 4-socket Kunpeng server running openEuler 20.03 LTS (Ch.02, p. 101), which hardware specifications are recommended by Huawei?", "options": ["A. Server model: TaiShan 200 (model 2480) with 4 sockets × 64-core Kunpeng 920 AArch64 CPUs", "B. Memory capacity: 1 TB", "C. NIC: Hi1822 family (4 × 25GE) with latency < 0.1 ms", "D. Drives: 4 × NVMe SSDs (V5 NVMe 1 MB sequential write bandwidth reaching 2600 MB/s or higher)"], "answer": "ABCD", "explanation": "All four specifications are listed verbatim in the slide notes on Ch.02 p.101."}, {"id": 29, "type": "multiple", "points": 20, "chapter": "Ch.03 Server Architecture Overview", "question": "(Official Ch.03 Quiz Q1) Which of the following statements are true about NICs of Huawei servers?", "options": ["A. A LOM is integrated in the PCH chip of the server mainboard and cannot be replaced.", "B. Huawei-developed PCIe cards can be installed in standard PCIe slots.", "C. A FlexIO card is integrated on the server panel for front-end service connection.", "D. Mezzanine cards can be used for Huawei rack servers."], "answer": "AB", "explanation": "According to Ch.03 p.177 and p.220 Official Quiz Q1, A and B are true. C is false (FlexIO cards are pluggable rear-panel cards for Huawei rack servers) and D is false (Mezzanine cards are only for Huawei E9000 blade server compute nodes)."}, {"id": 30, "type": "multiple", "points": 20, "chapter": "Ch.03 Server Architecture Overview", "question": "Which of the following features are supported by Huawei's third-generation intelligent converged network chip Hi1822 / IN200 iNIC (Ch.03, pp. 179–180)?", "options": ["A. Converged Ethernet (25GE to 100GE) and Fibre Channel (16G to 32G FC)", "B. 48 built-in programmable data forwarding cores", "C. OVS (15 Mpps forwarding performance) and RoCE v1/v2 protocol offloading, plus SR-IOV support", "D. PCIe 3.0 x16 standard half-height half-length (HHHL) card form factor"], "answer": "ABCD", "explanation": "All four sets of features are explicitly listed on Ch.03 pp. 179–180 for the Hi1822 chip and IN200 iNIC."}, {"id": 31, "type": "multiple", "points": 20, "chapter": "Ch.03 Server Architecture Overview", "question": "Which of the following statements about GPUs and NPUs in Chapter 03 (pp. 181–183) are true?", "options": ["A. The ALU accounts for approximately 5% of the CPU chip space and 40% of the GPU chip space.", "B. Integrated GPUs are built into the CPU, have lower power consumption and price, and occupy system memory, whereas discrete GPUs connect via PCIe and do not occupy system memory.", "C. In an NPU, computation results of neurons at one layer are passed directly to the next layer of neurons without needing to be output to main memory.", "D. Both GPUs and NPUs rely on the cooperation of CPUs to load data, models, and control service processes."], "answer": "ABCD", "explanation": "All four statements come directly from Ch.03 pp. 181–183."}, {"id": 32, "type": "multiple", "points": 20, "chapter": "Ch.03 Server Architecture Overview", "question": "Trace the evolution of the Intelligent Platform Management Interface (IPMI) specification (Ch.03, p. 193). Which of the following statements are true?", "options": ["A. In 1998, Intel, Dell, HP, and NEC proposed IPMI 1.0 to remotely monitor temperature and voltage over the network.", "B. In 2001, IPMI 1.5 added the PCI Management Bus function.", "C. In 2004, IPMI 2.0 added Console Redirection, enhanced security, VLAN support, and blade server support while remaining backward compatible with IPMI 1.0 and 1.5.", "D. IPMI requires the host operating system to be running in order to communicate with the BMC."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.03, p.193). D is false because IPMI exchanges information via the BMC using entry-level intelligent hardware rather than the OS."}, {"id": 33, "type": "multiple", "points": 20, "chapter": "Ch.04 Huawei Computing Industry", "question": "(Official Ch.04 Quiz Q1) Which of the following statements are true about the Huawei Kunpeng 920 processor?", "options": ["A. It adopts the 7 nm manufacturing process.", "B. It supports the 8-channel DDR4 controller.", "C. It supports the PCIe 4.0 interface and is compatible with PCIe 3.0/2.0/1.0.", "D. It supports multiple accelerators."], "answer": "ABCD", "explanation": "All four options (ABCD) are true and match the official Chapter 04 Quiz Q1 on p. 279."}, {"id": 34, "type": "multiple", "points": 20, "chapter": "Ch.04 Huawei Computing Industry", "question": "Which of the following statements about the Kunpeng Accelerator Engine (KAE) on Kunpeng 920 / TaiShan 200 servers are true (Ch.04, pp. 240–242)?", "options": ["A. Data is encrypted and decrypted inside the CPU, keys are stored in an on-chip security zone, and plaintext data is transmitted only through the on-chip bus (preventing PCIe bus data leakage).", "B. KAE supports Chinese national cryptographic algorithms SM3 and SM4, as well as symmetric/asymmetric encryption, digital signature, and compression/decompression.", "C. Users can quickly migrate existing services using standard OpenSSL and zlib interfaces without needing to know internal hardware details.", "D. In the KAE logical architecture, the BMC subsystem manages accelerator licenses, and the BIOS subsystem reports the ACPI table of the accelerator to the kernel."], "answer": "ABCD", "explanation": "All four statements come directly from Ch.04 pp. 240–242."}, {"id": 35, "type": "multiple", "points": 20, "chapter": "Ch.04 Huawei Computing Industry", "question": "What are the four pillars of Huawei's Kunpeng computing industry ecosystem strategy (Ch.04, p. 258)?", "options": ["A. Open hardware", "B. Open source software", "C. Partner enablement", "D. Talent cultivation"], "answer": "ABCD", "explanation": "According to Ch.04 p.258, Huawei promotes Kunpeng industry development by adhering to the strategy of 'open hardware, open source software, partner enablement, and talent cultivation'."}, {"id": 36, "type": "multiple", "points": 20, "chapter": "Ch.05 Computing Product Deployment", "question": "Which of the following ESD (Electrostatic Discharge) prevention precautions must be observed when installing or maintaining server hardware in an equipment room (Ch.05, p. 292)?", "options": ["A. Lay ESD floors, use ESD chairs, and directly ground all floor-standing electric devices, metal frames, and metal chassis shells.", "B. Wear ESD clothing, ESD gloves or an ESD wrist strap (with one end contacting bare skin and the other plugged into the cabinet/chassis ESD jack), and remove conductive objects such as watches and jewelry.", "C. Place temporarily removed components on ESD mats and keep new components in ESD bags until installation.", "D. Touch welding points, pins, and exposed circuits with bare hands to discharge static electricity before inserting boards."], "answer": "ABC", "explanation": "A, B, and C are mandatory ESD rules on Ch.05 p.292. D is strictly forbidden ('Do not touch welding points, pins, or exposed circuits')."}, {"id": 37, "type": "multiple", "points": 20, "chapter": "Ch.05 Computing Product Deployment", "question": "Which of the following statements about `vsftpd` security features and Postfix mail server working modes are true (Ch.05, pp. 338, 341)?", "options": ["A. The vsftpd service is run by an unprivileged user and presents chroot environments to users.", "B. Any vsftpd commands requiring elevated privileges are controlled by a parent process running with the least privileges required.", "C. vsftpd integrates frequently used Linux commands such as dir, ls, and cd to reduce reliance on external commands.", "D. Postfix virtual users are not associated with real Linux users, use separate drive space, and overcome the limit on the allowed number of Linux OS users."], "answer": "ABCD", "explanation": "All four statements come directly from Ch.05 pp. 338 and 341."}, {"id": 38, "type": "multiple", "points": 20, "chapter": "Ch.06 Basic O&M of Computing Products", "question": "(Official Ch.06 Quiz Q1) A batch of TaiShan 200 2280 balanced servers are purchased, but they do not have pre-integrated software. During project delivery, engineers need to configure RAIDs for these servers and install OSs. Which of the following computing management software can be used to configure RAIDs for these servers?", "options": ["A. Smart Provisioning", "B. SmartKit", "C. iBMC", "D. eService"], "answer": "ABC", "explanation": "According to Ch.06 p.438 Official Quiz Q1, Smart Provisioning (A), SmartKit (B), and iBMC (C) can configure RAIDs on bare-metal TaiShan 200 2280 servers; eService (D) is for remote O&M and cannot configure RAID."}, {"id": 39, "type": "multiple", "points": 20, "chapter": "Ch.06 Basic O&M of Computing Products", "question": "In Huawei FusionDirector's Intelligent Energy Efficiency Management (Ch.06, p. 399), which four optimization analysis functions are provided?", "options": ["A. Power distribution optimization analysis (batch power capping on racks with long-term high power usage)", "B. Temperature risk analysis (identifies servers with overheated air intake vents and allows powering them off)", "C. Load optimization analysis (identifies long-term low-load servers for batch operations)", "D. Space optimization analysis (collects statistics on racks with long-term high space usage)"], "answer": "ABCD", "explanation": "All four optimization analysis functions are listed in the table on Ch.06 p.399."}, {"id": 40, "type": "multiple", "points": 20, "chapter": "Ch.06 Basic O&M of Computing Products", "question": "In Huawei SmartKit Batch Distribution and Configuration Check functions (Ch.06, pp. 428, 432), which of the following capabilities are supported?", "options": ["A. Delivering IPMI commands, SNMP commands, and Redfish commands to the BMC in batches", "B. Uploading files and running SSH commands on the OS in batches", "C. Comparing device configurations against a reference baseline device", "D. Comparing device configurations against an imported benchmark configuration file"], "answer": "ABCD", "explanation": "All four capabilities are explicitly described on Ch.06 pp. 428 and 432."}, {"id": 41, "type": "tf", "points": 10, "chapter": "Ch.02 Computing System Overview", "question": "(Official Ch.02 Quiz Q1) Servers are developed from midrange computers to general-purpose servers and then to mainframe servers.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.02 p.76 and p.124 Official Quiz Q1, servers evolved from Mainframes (1940s–1950s) -> Midrange computers (1960s–1970s) -> Microcomputers (1970s–1980s) -> General-purpose servers (1980s–1990s)."}, {"id": 42, "type": "tf", "points": 10, "chapter": "Ch.03 Server Architecture Overview", "question": "(Official Ch.03 Quiz Q2) The baseboard management controller (BMC) complies with the Intelligent Platform Management Interface (IPMI) specification. It collects, processes, and stores sensor signals, and monitors the operating status of components.", "options": ["A. True", "B. False"], "answer": "A", "explanation": "True. This is the exact statement from Ch.03 p.201 and p.220 Official Quiz Q2."}, {"id": 43, "type": "tf", "points": 10, "chapter": "Ch.01 History of Computing", "question": "In 1983, Apple Lisa was launched and became the world's first personal computer that uses both a graphical user interface (GUI) and a mouse device.", "options": ["A. True", "B. False"], "answer": "A", "explanation": "True. According to Ch.01 p.27, Apple II (1977) displayed color graphics, and Apple Lisa (1983) became the world's first PC to use both a GUI and a mouse device."}, {"id": 44, "type": "tf", "points": 10, "chapter": "Ch.02 Computing System Overview", "question": "Apache Tomcat is a lightweight open-source web application server that complies with Servlet and JSP specifications and natively supports Enterprise JavaBeans (EJB).", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.02 p.91, Tomcat complies with Servlet and JSP specifications, but it does NOT support EJB (JBoss can be used instead if open-source EJB support is required)."}, {"id": 45, "type": "tf", "points": 10, "chapter": "Ch.03 Server Architecture Overview", "question": "In RAID 01, data is striped first (RAID 0) and then mirrored (RAID 1); therefore, the failure of a single disk causes the loss of an entire mirrored stripe and transitions the system into a non-redundant RAID 0 array.", "options": ["A. True", "B. False"], "answer": "A", "explanation": "True. According to Ch.03 p.160, RAID 01 stripes first and then mirrors, so losing one disk loses the entire mirrored stripe and degrades the array to RAID 0 (making RAID 10 more reliable than RAID 01)."}, {"id": 46, "type": "tf", "points": 10, "chapter": "Ch.03 Server Architecture Overview", "question": "On a Linux operating system, `/media` is used as a temporary manual mount point by administrators, whereas `/mnt` is where removable USB flash drives are automatically mounted by the system.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.03 p.219, `/media` is where removable devices (USB drives, CD-ROMs) are automatically identified and mounted by Linux, while `/mnt` is the temporary mount point for manual mounting."}, {"id": 47, "type": "tf", "points": 10, "chapter": "Ch.04 Huawei Computing Industry", "question": "On the rear panel of a TaiShan 200 (model 2280) server, I/O modules 1, 2, and 3 can all be interchangeably configured with the exact same 3.5-inch drive module or riser module.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.04 p.249, I/O modules 1 and 2 on the rear panel can be configured with the same drive module or riser module, while I/O module 3 cannot."}, {"id": 48, "type": "tf", "points": 10, "chapter": "Ch.05 Computing Product Deployment", "question": "If a RAID controller card does not support the JBOD (drive passthrough) feature, an operating system can only be installed on virtual drives (RAID volumes) configured under the controller card.", "options": ["A. True", "B. False"], "answer": "A", "explanation": "True. According to Ch.05 p.321, if the controller card does not support the passthrough (JBOD) feature, you can install the OS only on the virtual drives configured under the controller card."}, {"id": 49, "type": "tf", "points": 10, s onboard Huawei intelligent management chip model.", "starter_code": "MAINBOARD_MODEL=\"___\"\nMANAGEMENT_CHIP=\"___\"", "accepted_keywords": ["s920x00", "hi1710"], "solution": "MAINBOARD_MODEL=\"S920X00\"\nMANAGEMENT_CHIP=\"Hi1710\"", "options": [], "answer": "S920X00, Hi1710", "explanation": "According to Ch.03 p.149, the Kunpeng server mainboard model is S920X00, equipped with two Kunpeng 920 processors and the Hi1710 intelligent management chip."}, {"id": 53, "type": "lab", "points": 20, "chapter": "Ch.03 Server Architecture Overview", "question": "Lab 3 (RAID 6 Galois Parity & Utilization): For an 8-disk RAID 6 array (N=8), write the number of parity disks and the drive space utilization percentage.", "starter_code": "raid6_parity_disks: ___\nraid6_utilization_8disks: \"___\"", "accepted_keywords": ["2", "75%"], "solution": "raid6_parity_disks: 2\nraid6_utilization_8disks: \"75%\"", "options": [], "answer": "2, 75%", "explanation": "RAID 6 uses 2 independent parity blocks (P and Q) with utilization (N-2)/N = 6/8 = 75% (Ch.03, pp. 161, 163)."}, {"id": 54, "type": "lab", "points": 20, "chapter": "Ch.03 Server Architecture Overview", "question": "Lab 4 (iBMC Black Box Diagnostic Tools): Specify the name of the iBMC black box feature and its companion parsing tool from Ch.03 p. 202.", "starter_code": "ibmc_black_box: \"___\"\nibmc_parsing_tool: \"___\"", "accepted_keywords": ["kbox", "hwkbox"], "solution": "ibmc_black_box: \"Kbox\"\nibmc_parsing_tool: \"HWKbox\"", "options": [], "answer": "Kbox, HWKbox", "explanation": "According to Ch.03 p.202, iBMC diagnosis assistance provides the Black box (`Kbox`) and Parsing tool (`HWKbox`)."}, {"id": 55, "type": "lab", "points": 20, "chapter": "Ch.04 Huawei Computing Industry", "question": "Lab 5 (Kunpeng 920 Die & Interconnect Specs): Specify the number of CPU dies, number of I/O dies, and HCCS inter-chip bandwidth (in Gbit/s) for the Kunpeng 920 processor.", "starter_code": "kunpeng920_cpu_dies = ___\nkunpeng920_io_dies =     function escHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function fmtText(s) {
      if (!s) return '';
      let out = String(s);
      out = out.replace(/\\text\{([^}]+)\}/g, '$1')
               .replace(/\\mathbf\{([^}]+)\}/g, '$1')
               .replace(/\\texttt\{([^}]+)\}/g, '`$1`')
               .replace(/\\times/g, '×')
               .replace(/\\ge/g, '≥')
               .replace(/\\le/g, '≤')
               .replace(/\\ne\b/g, '≠')
               .replace(/\\lg\s+([A-Za-z0-9]+)/g, 'lg($1)')
               .replace(/\$(?!\s*[\{\(])([^$\n\r]+?)\$/g, '$1');
      out = escHtml(out);
      out = out.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return out;
    }
    function normWS(s) {
      return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    let currentIdx = 0;

    function getProgress() {
      return JSON.parse(localStorage.getItem('huawei_study_progress_v1') || '{}');
    }

    function markDone(uid) {
      const prog = getProgress();
      prog[uid] = { completed: true, ts: Date.now() };
      localStorage.setItem('huawei_study_progress_v1', JSON.stringify(prog));
      renderSidebar();
    }

    function renderSidebar() {
      const prog = getProgress();
      let doneCount = 0;
      UNITS.forEach(u => { if (prog[u.uid]?.completed) doneCount++; });
      document.getElementById('overall-progress').textContent = `${doneCount} / ${UNITS.length} Units Completed (${Math.round(doneCount/UNITS.length*100)}%)`;

      const sb = document.getElementById('sidebar');
      sb.innerHTML = (PILLAR.hours || []).map(h => {
        const hUnits = UNITS.map((u, idx) => ({ u, idx })).filter(x => x.u.hour.hour_number === h.hour_number);
        const hDone = hUnits.filter(x => prog[x.u.uid]?.completed).length;
        const itemsHtml = hUnits.map(({ u, idx }) => {
          const isDone = !!prog[u.uid]?.completed;
          const isActive = idx === currentIdx;
          return `<div class="unit-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="selectUnit(${idx})">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(u.label)}</span>
            <span class="check-icon">${isDone ? '✓' : '○'}</span>
          </div>`;
        }).join('');
        return `<div class="hour-group">
          <div class="hour-header">
            <span>Hour 0${h.hour_number}: ${escHtml(h.title)}</span>
            <span style="font-size:11px;color:#38bdf8;">${hDone}/8</span>
          </div>
          <div class="hour-units">${itemsHtml}</div>
        </div>`;
      }).join('') + `
        <div class="hour-group" style="border-color:var(--huawei-red);">
          <div class="hour-header" style="background:rgba(225,29,72,0.22);" onclick="window.location.href='./${PILLAR.mock_exam.folder_name}/Final-Mock-Exam.html'">
            <span>Hour 09: Final Mock Exam (60m)</span>
            <span>→</span>
          </div>
        </div>
      `;
    }

    function selectUnit(idx) {
      if (idx < 0 || idx >= UNITS.length) return;
      currentIdx = idx;
      renderSidebar();
      const u = UNITS[idx];
      const stage = document.getElementById('stage');

      if (u.mode === 'lecture') {
        const lec = u.sprint.lecture;
        const objs = (lec.objectives || []).map(o => `<li>${fmtText(o)}</li>`).join('');
        const kts = (lec.key_takeaways || []).map(k => `<li><strong>${fmtText(k)}</strong></li>`).join('');
        const traps = (lec.exam_traps || []).map(t => `<div class="trap-item">${fmtText(t)}</div>`).join('');
        stage.innerHTML = `
          <div class="lecture-stage">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <span class="badge badge-lecture">BITE-SIZED LECTURE (${lec.duration_mins} MINS)</span>
                <span class="badge badge-ref">${escHtml(PILLAR.pdf_source)} • ${escHtml(lec.pdf_ref)}</span>
                <span class="badge badge-hour">Hour 0${u.hour.hour_number} • Sprint ${u.sprint.sprint_number}/4</span>
              </div>
              <a href="${u.fileRel}" style="font-size:12px;">Open Standalone File ↗</a>
            </div>
            <h1 style="font-size:1.6rem;margin-bottom:14px;">${fmtText(lec.title)}</h1>
            <div class="objectives-card">
              <h3>Learning Objectives</h3>
              <ul class="md-list">${objs}</ul>
            </div>
            <div>${lec.content_html || ''}</div>
            <div class="takeaways-card">
              <h3>Key Takeaways</h3>
              <ul class="md-list">${kts}</ul>
            </div>
            <div class="traps-card">
              <h3>Huawei National Stage Exam Traps</h3>
              ${traps}
            </div>
            <div style="margin-top:24px;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.35);border-radius:10px;">
              <div>
                <div style="font-size:11.5px;color:var(--text-muted);">ACTIVE HANDS-ON REINFORCEMENT</div>
                <div style="font-weight:700;">Proceed immediately to the paired interactive lab exercise!</div>
              </div>
              <button class="btn-primary" onclick="markDone('${u.uid}'); stepNav(1);">
                Complete Lecture & Start Hands-On Exercise →
              </button>
            </div>
          </div>
        `;
        stage.scrollTop = 0;
      } else {
        const ex = u.sprint.exercise;
        const insts = (ex.instructions || []).map((inst, i) =>
          `<li id="spa-inst-${i}" class="inst-item"><span class="step-num">${i+1}</span><span>${fmtText(inst)}</span></li>`
        ).join('');
        const qsHtml = (ex.quiz_questions || []).map((q, qIdx) => {
          const isMulti = q.type === 'multiple';
          const inputType = isMulti ? 'checkbox' : 'radio';
          const bTxt = isMulti ? 'Multiple-Choice (Select ALL)' : (q.type === 'tf' ? 'True/False' : 'Single-Choice');
          const opts = (q.options || []).map(opt => {
            const letter = opt.trim().charAt(0).toUpperCase();
            return `<label class="q-opt"><input type="${inputType}" name="spa_q_${qIdx}" value="${letter}" /> <span>${fmtText(opt)}</span></label>`;
          }).join('');
          return `<div class="q-card">
            <div style="font-weight:600;font-size:13.5px;margin-bottom:6px;">Q${qIdx+1} [${bTxt}]: ${fmtText(q.question)}</div>
            <div>${opts}</div>
            <div id="spa-q-exp-${qIdx}" class="q-exp"></div>
          </div>`;
        }).join('');

        stage.innerHTML = `
          <div class="dc-split">
            <div class="dc-left">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <span class="badge badge-exercise">HANDS-ON EXERCISE (${ex.duration_mins} MINS)</span>
                  <span class="badge badge-hour">Hour 0${u.hour.hour_number} • Sprint ${u.sprint.sprint_number}/4</span>
                </div>
                <a href="${u.fileRel}" style="font-size:12px;">Standalone View ↗</a>
              </div>
              <h1 style="font-size:1.35rem;">${fmtText(ex.title)}</h1>
              <div class="scenario-box">
                <div style="font-size:11px;font-weight:700;color:#38bdf8;margin-bottom:4px;">PRACTICAL SCENARIO</div>
                <div>${fmtText(ex.scenario || '')}</div>
              </div>
              <div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;">
                <h3>Step-by-Step Instructions</h3>
                <ul class="inst-list">${insts}</ul>
                <div style="display:flex;gap:8px;margin-top:8px;">
                  <button class="nav-btn" onclick="spaToggleHint()">Show Hint</button>
                  <button class="nav-btn" onclick="spaShowSolution()">Show Solution</button>
                </div>
                <div id="spa-hint-box" style="display:none;margin-top:10px;padding:10px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.4);border-radius:6px;font-size:12.5px;color:#fde68a;"></div>
              </div>
              <div style="border:1px solid var(--border);border-radius:8px;padding:14px;">
                <h3>National Stage Exam Verification Drill</h3>
                ${qsHtml}
                <button class="btn-primary" style="width:100%;background:var(--blue);" onclick="spaGradeQuiz()">Verify Exam Drill Answers</button>
                <div id="spa-quiz-result" style="margin-top:10px;"></div>
              </div>
            </div>
            <div class="dc-right">
              <div class="editor-header">
                <span style="font-family:var(--font-mono);font-size:12.5px;color:#34d399;">● ${escHtml(ex.prompt_label || 'root@openEuler:~#')}</span>
                <div style="display:flex;gap:8px;">
                  <button class="nav-btn" onclick="spaResetCode()">↺ Reset</button>
                  <button class="btn-primary" style="padding:6px 14px;font-size:12.5px;" onclick="spaRunCode()">▶ Run & Verify (Ctrl+Enter)</button>
                </div>
              </div>
              <textarea id="spa-editor" spellcheck="false"></textarea>
              <div class="console-header">
                <span>EXECUTION OUTPUT & AUTOMATED GRADER</span>
                <span id="spa-status" style="color:#fbbf24;">Ready</span>
              </div>
              <div id="spa-console" class="console-body">Press "▶ Run & Verify (Ctrl+Enter)" to test your solution...</div>
            </div>
          </div>
        `;
        const ed = document.getElementById('spa-editor');
        ed.value = ex.starter_code || '';
        ed.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); spaRunCode(); }
          if (e.key === 'Tab') {
            e.preventDefault();
            const start = ed.selectionStart;
            const end = ed.selectionEnd;
            ed.value = ed.value.substring(0, start) + '    ' + ed.value.substring(end);
            ed.selectionStart = ed.selectionEnd = start + 4;
          }
        });
      }
    }

    function stepNav(delta) {
      selectUnit(currentIdx + delta);
    }

    function copyCodeBlock(btn) {
      const code = btn.parentElement.nextElementSibling.innerText;
      navigator.clipboard.writeText(code);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    }

    function spaResetCode() {
      const ex = UNITS[currentIdx].sprint.exercise;
      document.getElementById('spa-editor').value = ex.starter_code || '';
    }

    function spaToggleHint() {
      const ex = UNITS[currentIdx].sprint.exercise;
      const box = document.getElementById('spa-hint-box');
      if (box.style.display === 'none') {
        box.style.display = 'block';
        box.innerHTML = '<strong>Hints:</strong><ul style="margin-left:18px;margin-top:4px;">' +
          (ex.hints || []).map(h => `<li>${fmtText(h)}</li>`).join('') + '</ul>';
      } else {
        box.style.display = 'none';
      }
    }

    function spaShowSolution() {
      const ex = UNITS[currentIdx].sprint.exercise;
      document.getElementById('spa-editor').value = ex.solution_code || '';
      spaRunCode();
    }

    function spaRunCode() {
      const u = UNITS[currentIdx];
      const ex = u.sprint.exercise;
      const codeNorm = normWS(document.getElementById('spa-editor').value);
      const checks = ex.validation_checks || [];
      let allPass = true;
      let logs = ['[GRADER] Validating your commands/code...\n'];

      checks.forEach((chk, i) => {
        const reqs = chk.required_any || [];
        const ok = reqs.length === 0 || reqs.some(r => codeNorm.includes(normWS(r)));
        const li = document.getElementById(`spa-inst-${i}`);
        if (ok) {
          if (li) li.classList.add('passed');
          logs.push(`[PASS] Step ${i+1} : ${chk.description}`);
        } else {
          if (li) li.classList.remove('passed');
          allPass = false;
          logs.push(`[FAIL] Step ${i+1} : ${chk.description}\n   ↳ ${chk.feedback_fail}`);
        }
      });

      const st = document.getElementById('spa-status');
      if (allPass) {
        st.style.color = '#34d399';
        st.textContent = 'All Steps Passed!';
        logs.push('\n--- SIMULATED OUTPUT ---');
        logs.push(ex.simulated_output || 'Execution succeeded.');
        markDone(u.uid);
      } else {
        st.style.color = '#fbbf24';
        st.textContent = 'Incomplete';
      }
      document.getElementById('spa-console').textContent = logs.join('\n');
    }

    function spaGradeQuiz() {
      const u = UNITS[currentIdx];
      const qs = u.sprint.exercise.quiz_questions || [];
      let corr = 0;
      qs.forEach((q, i) => {
        const sel = Array.from(document.querySelectorAll(`input[name="spa_q_${i}"]:checked`))
          .map(x => x.value).sort().join('');
        const ans = (q.answer || '').toUpperCase().replace(/[^A-Z]/g, '').split('').sort().join('');
        const exp = document.getElementById(`spa-q-exp-${i}`);
        exp.style.display = 'block';
        if (sel === ans) {
          corr++;
          exp.style.background = 'rgba(16,185,129,0.15)';
          exp.style.border = '1px solid rgba(16,185,129,0.4)';
          exp.innerHTML = `<strong>[CORRECT] (${ans})!</strong> ${fmtText(q.explanation || '')}`;
        } else {
          exp.style.background = 'rgba(225,29,72,0.15)';
          exp.style.border = '1px solid rgba(225,29,72,0.4)';
          exp.innerHTML = `<strong>[INCORRECT] Your answer: ${sel || 'None'} | Official: ${ans}</strong><br/>${fmtText(q.explanation || '')}`;
        }
      });
      const res = document.getElementById('spa-quiz-result');
      res.innerHTML = `<div style="padding:10px;background:#1e293b;border-radius:6px;font-weight:700;">
        Score: ${corr} / ${qs.length}
        ${corr === qs.length ? '<button class="btn-primary" style="margin-left:12px;padding:5px 12px;font-size:12px;" onclick="markDone(\'' + u.uid + '\'); stepNav(1);">Next Unit →</button>' : ''}
      </div>`;
      if (corr === qs.length) markDone(u.uid);
    }

    selectUnit(0);
  </script>
</body>
</html>
