odule 3** (can be drive modules or PCIe riser modules)\n  - **PSU 1 & PSU 2** (with PSU sockets)\n  - **FlexIO card 1 (connected to CPU 1)** and **FlexIO card 2 (connected to CPU 2)**\n  - **USB 3.0 port**, **VGA port**, **Debugging serial port**, and **Management network port (iBMC)**.\n\n---\n\n### 3. Drive Overview (SATA, SAS, NL-SAS, SSD) & Service Categories (pp. 153–154)\n\n| Parameter | SATA HDD | SAS HDD | NL-SAS HDD | SSD |\n| :--- | :--- | :--- | :--- | :--- |\n| **Rotational Speed (RPM)** | **7,200** | **15,000 / 10,000** | **7,200** | **N/A** (Flash/DRAM) |\n| **Serial / Parallel** | Serial | Serial | Serial | Serial |\n| **Typical Capacity** | 1 T / 2 T / 3 T | 0.6 T / 0.9 T / 1.8 T / 2.4 T | 2 T / 3 T / 4 T / 8 T / 10 T | 480 G / 960 G / 1.92 T / 3.84 T |\n| **MTBF (Hours)** | **1,200,000** | **1,600,000** | **1,200,000** | **2,000,000** |\n| **Annual Failure Rate (AFR)** | **~2%** | **< 2%** | **~2%** | Lowest |\n| **Key Features** | SATA 3.0 max **600 MB/s** | Compatible with SATA; **3.0 / 6.0 / 12.0 Gbit/s** | **Enterprise SATA drive with SAS interface** (ideal for storage tiering) | Control unit + storage unit (Flash or DRAM chip); highest price |\n\n- **HDD Service Categories (p. 154)**: Enterprise-class performance, Enterprise-class capacity (SATA/SAS), Enterprise-class cloud drive (24/7 low power), Desktop drive (**5 day / 8 hour** household/PC use).\n- **SSD Service Categories by DWPD (*Drive Writes Per Day*, p. 154)**:\n  - **Read-intensive SSD**: \DWPD < 3 (frequent reads)\n  - **Mixed read/write SSD**: 3 \≤ \DWPD \≤ 10 (balanced reads/writes)\n  - **Write-intensive SSD**: \DWPD > 10 (frequent writes)", "key_takeaways": ["Kunpeng S920X00 mainboard features 2 × Kunpeng 920 CPUs, Hi1710 management chip, 32 DDR4-2933 slots, and 8 PCIe 4.0 slots for 2U/4U rack servers.", "NL-SAS drives are 7,200 RPM enterprise SATA platters equipped with a SAS interface (MTBF 1,200,000 h, AFR ~2%).", "MTBF rankings: SATA/NL-SAS = 1,200,000 h; SAS = 1,600,000 h (<2% AFR); SSD = 2,000,000 h.", "SSD DWPD categories: Read-intensive (< 3), Mixed read/write (3 to 10), Write-intensive (> 10)."], "exam_traps": ["EXAM TRAP: On the TaiShan 200 (2280) rear panel, FlexIO card 1 is connected to CPU 1, and FlexIO card 2 is connected to CPU 2!", "EXAM TRAP: Memorize the DWPD thresholds: Read-intensive (< 3), Mixed read/write (3 to 10), Write-intensive (> 10)."], "content_html": "<h3>1. Kunpeng Server Mainboard (S920X00) &amp; Chassis Sizes (pp. 149–150)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Mainboard Role<\/strong>: Provides the connection platform integrating CPUs, memory, storage, PCIe expansion cards, and external ports. The <strong>chipset<\/strong> is the most important component on the mainboard, managing inter-device communication and built-in functions (such as an integrated GPU).<\/li>\n<li><strong>Kunpeng Server Mainboard Model <code class=\"inline-code\">S920X00<\/code> (p. 149)<\/strong>:<\/li>\n<li><strong>CPUs<\/strong>: <strong>2 × Kunpeng 920 processors<\/strong><\/li>\n<li><strong>Management Chip<\/strong>: <strong>Hi1710<\/strong> intelligent management chip<\/li>\n<li><strong>Memory<\/strong>: Up to <strong>32 DDR4-2933<\/strong> memory slots<\/li>\n<li><strong>PCIe Expansion<\/strong>: <strong>8 × PCIe 4.0<\/strong> slots<\/li>\n<li><strong>Chassis Compatibility<\/strong>: Compatible with <strong>2U or 4U rack servers<\/strong> (e.g., TaiShan 2280 2U and TaiShan 5280 4U share this motherboard!).<\/li>\n<li><strong>Rack Heights (p. 150)<\/strong>: <strong>1U = 1.75 in (4.45 cm)<\/strong>, <strong>2U = 3.5 in (8.9 cm)<\/strong>, <strong>4U = 7 in (17.8 cm)<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. TaiShan 200 (2280) Front and Rear Panels (pp. 151–152)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Supported Front Drive Configurations (p. 151)<\/strong>: <code class=\"inline-code\">12 × 3.5-inch<\/code>, <code class=\"inline-code\">25 × 2.5-inch<\/code>, <code class=\"inline-code\">8 × 2.5\" SAS/SATA + 12 × 2.5\" NVMe<\/code>, <code class=\"inline-code\">24 × 2.5\" SAS/SATA<\/code>, or <code class=\"inline-code\">8 × 2.5-inch<\/code> drives.<\/li>\n<li><strong>Front Panel Components (p. 151)<\/strong>: (1) UID button/indicator, (2) Health status indicator, (3) Power button/indicator, (4) Fault diagnosis LED, (5) <strong>FlexIO card presence indicator<\/strong>, (6) Drives, (7) <strong>VGA port<\/strong>, (8) <strong>USB 3.0 port<\/strong>, (9) Label with SN.<\/li>\n<li><strong>Rear Panel Components (p. 152)<\/strong>:<\/li>\n<li><strong>I/O module 1, I/O module 2, I/O module 3<\/strong> (can be drive modules or PCIe riser modules)<\/li>\n<li><strong>PSU 1 &amp; PSU 2<\/strong> (with PSU sockets)<\/li>\n<li><strong>FlexIO card 1 (connected to CPU 1)<\/strong> and <strong>FlexIO card 2 (connected to CPU 2)<\/strong><\/li>\n<li><strong>USB 3.0 port<\/strong>, <strong>VGA port<\/strong>, <strong>Debugging serial port<\/strong>, and <strong>Management network port (iBMC)<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Drive Overview (SATA, SAS, NL-SAS, SSD) &amp; Service Categories (pp. 153–154)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Parameter<\/th><th>SATA HDD<\/th><th>SAS HDD<\/th><th>NL-SAS HDD<\/th><th>SSD<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Rotational Speed (RPM)<\/strong><\/td><td><strong>7,200<\/strong><\/td><td><strong>15,000 / 10,000<\/strong><\/td><td><strong>7,200<\/strong><\/td><td><strong>N/A<\/strong> (Flash/DRAM)<\/td><\/tr>\n<tr><td><strong>Serial / Parallel<\/strong><\/td><td>Serial<\/td><td>Serial<\/td><td>Serial<\/td><td>Serial<\/td><\/tr>\n<tr><td><strong>Typical Capacity<\/strong><\/td><td>1 T / 2 T / 3 T<\/td><td>0.6 T / 0.9 T / 1.8 T / 2.4 T<\/td><td>2 T / 3 T / 4 T / 8 T / 10 T<\/td><td>480 G / 960 G / 1.92 T / 3.84 T<\/td><\/tr>\n<tr><td><strong>MTBF (Hours)<\/strong><\/td><td><strong>1,200,000<\/strong><\/td><td><strong>1,600,000<\/strong><\/td><td><strong>1,200,000<\/strong><\/td><td><strong>2,000,000<\/strong><\/td><\/tr>\n<tr><td><strong>Annual Failure Rate (AFR)<\/strong><\/td><td><strong>~2%<\/strong><\/td><td><strong>&lt; 2%<\/strong><\/td><td><strong>~2%<\/strong><\/td><td>Lowest<\/td><\/tr>\n<tr><td><strong>Key Features<\/strong><\/td><td>SATA 3.0 max <strong>600 MB/s<\/strong><\/td><td>Compatible with SATA; <strong>3.0 / 6.0 / 12.0 Gbit/s<\/strong><\/td><td><strong>Enterprise SATA drive with SAS interface<\/strong> (ideal for storage tiering)<\/td><td>Control unit + storage unit (Flash or DRAM chip); highest price<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>HDD Service Categories (p. 154)<\/strong>: Enterprise-class performance, Enterprise-class capacity (SATA/SAS), Enterprise-class cloud drive (24/7 low power), Desktop drive (<strong>5 day / 8 hour<\/strong> household/PC use).<\/li>\n<li>**SSD Service Categories by DWPD (<em>Drive Writes Per Day<\/em>, p. 154)**:<\/li>\n<li><strong>Read-intensive SSD<\/strong>: \DWPD &lt; 3 (frequent reads)<\/li>\n<li><strong>Mixed read/write SSD<\/strong>: 3 \≤ \DWPD \≤ 10 (balanced reads/writes)<\/li>\n<li><strong>Write-intensive SSD<\/strong>: \DWPD &gt; 10 (frequent writes)<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: S920X00 Mainboard & Enterprise Drive Spec Classifier", "duration_mins": 8, "exercise_type": "config", "prompt_label": "hw-eng@taishan-2280:~#", "scenario": "Complete the hardware specification file for the Kunpeng S920X00 mainboard and classify enterprise HDD/SSD drive parameters.", "instructions": ["Set `mainboard_model` to `'S920X00'`, `bmc_management_chip` to `'Hi1710'`, and `pcie_4_slots` to `8`.", "Set `sas_mtbf_hours` to `1600000` and `ssd_mtbf_hours` to `2000000`.", "Set `read_intensive_dwpd_max` to `3` and `write_intensive_dwpd_min` to `10`."], "starter_code": "# S920X00 Mainboard & Drive Classification Spec\nmainboard:\n  mainboard_model: \"___\"\n  bmc_management_chip: \"___\"\n  ddr4_2933_slots: 32\n  pcie_4_slots: ___\n\ndrive_specs:\n  sata_nlsas_mtbf_hours: 1200000\n  sas_mtbf_hours: ___\n  ssd_mtbf_hours: ___\n  read_intensive_dwpd_max: ___\n  write_intensive_dwpd_min: ___\n", "solution_code": "# S920X00 Mainboard & Drive Classification Spec\nmainboard:\n  mainboard_model: \"S920X00\"\n  bmc_management_chip: \"Hi1710\"\n  ddr4_2933_slots: 32\n  pcie_4_slots: 8\n\ndrive_specs:\n  sata_nlsas_mtbf_hours: 1200000\n  sas_mtbf_hours: 1600000\n  ssd_mtbf_hours: 2000000\n  read_intensive_dwpd_max: 3\n  write_intensive_dwpd_min: 10\n", "hints": ["The Kunpeng server mainboard model on page 149 is S920X00 with the Hi1710 chip and 8 PCIe 4.0 slots.", "SAS MTBF is 1,600,000 hours; SSD MTBF is 2,000,000 hours; DWPD thresholds are < 3, 3–10, and > 10."], "validation_checks": [{"step": 1, "description": "Verify S920X00 mainboard model, Hi1710 chip, and 8 PCIe 4.0 slots", "required_any": ["s920x00", "hi1710"], "feedback_fail": "Set mainboard_model to 'S920X00' and bmc_management_chip to 'Hi1710'."}, {"step": 2, "description": "Verify SAS (1,600,000 h) and SSD (2,000,000 h) MTBF values", "required_any": ["1600000", "2000000"], "feedback_fail": "Set sas_mtbf_hours to 1600000 and ssd_mtbf_hours to 2000000."}, {"step": 3, "description": "Verify SSD DWPD thresholds (3 and 10)", "required_any": ["3", "10"], "feedback_fail": "Set read_intensive_dwpd_max to 3 and write_intensive_dwpd_min to 10."}], "simulated_output": "[OK] S920X00 Mainboard & Drive Specs Validated:\n- Mainboard: S920X00 (2 x Kunpeng 920 + Hi1710 BMC + 32 DDR4-2933 + 8 PCIe 4.0)\n- MTBF: SATA/NL-SAS = 1.2M h | SAS = 1.6M h | SSD = 2.0M h\n- SSD DWPD: Read-Intensive (<3) | Mixed (3-10) | Write-Intensive (>10).", "quiz_questions": [{"id": "h3_s3_q1", "type": "single", "question": "What are the rotational speed, interface type, and MTBF of an NL-SAS hard disk drive?", "options": ["A. 15,000 RPM, SATA interface, 1,600,000 hours MTBF", "B. 7,200 RPM, enterprise SATA drive with SAS interface, 1,200,000 hours MTBF", "C. 10,000 RPM, PCIe interface, 2,000,000 hours MTBF", "D. 5,400 RPM, parallel ATA interface, 800,000 hours MTBF"], "answer": "B", "explanation": "According to Ch.03 p.153, NL-SAS drives are 7,200 RPM enterprise-class SATA drives with SAS ports, an MTBF of 1,200,000 hours, and an annual failure rate of about 2%."}, {"id": "h3_s3_q2", "type": "single", "question": "How are enterprise SSDs classified based on Drive Writes Per Day (DWPD)?", "options": ["A. Read-intensive: DWPD < 1; Mixed: DWPD 1–3; Write-intensive: DWPD > 3", "B. Read-intensive: DWPD < 3; Mixed: DWPD 3–10; Write-intensive: DWPD > 10", "C. Read-intensive: DWPD < 5; Mixed: DWPD 5–15; Write-intensive: DWPD > 15", "D. Read-intensive: DWPD < 10; Mixed: DWPD 10–50; Write-intensive: DWPD > 50"], "answer": "B", "explanation": "According to Ch.03 p.154, Read-intensive SSDs have DWPD < 3, Mixed read/write SSDs have DWPD between 3 and 10, and Write-intensive SSDs have DWPD > 10."}, {"id": "h3_s3_q3", "type": "multiple", "question": "Which of the following specifications are true regarding the Kunpeng server mainboard (model S920X00)?", "options": ["A. It is equipped with two Kunpeng 920 processors and the Hi1710 intelligent management chip.", "B. It supports up to 32 DDR4-2933 memory slots.", "C. It provides eight PCIe 4.0 slots.", "D. It is compatible with 2U or 4U rack servers."], "answer": "ABCD", "explanation": "All four statements are explicitly stated on Ch.03 p.149 for the Kunpeng server mainboard (model S920X00)."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-Drive-Interfaces-Form-Factors-and-NVMe-Architecture", "exercise_slug": "08-Exercise-Drive-Interface-Rates-and-IOPS-Benchmark-Lab", "lecture": {"title": "Drive Interfaces (SATA/SAS/NVMe), Form Factors & IOPS Benchmarks", "duration_mins": 8, "pdf_ref": "Ch.03, pp. 155–158", "objectives": ["Physically and logically distinguish SATA, SAS, and PCIe (NVMe) drive interfaces and their 1.0/2.0/3.0 transmission rates", "Explain NVMe advantages and 3.5-inch LFF vs. 2.5-inch SFF physical dimensions", "Compare 4 KB Random Write IOPS and 128 KB Sequential Read Bandwidth across all 6 drive types"], "content_markdown": "### 1. Drive Interfaces: SATA vs. SAS vs. PCIe (NVMe) (pp. 155–156)\nMainstream server drives use **SATA**, **SAS**, and **PCIe (NVMe)** interfaces:\n- **Physical Connector Distinction (p. 155)**:\n  - **SATA interface**: Has a **physical gap (notch)** between the power and data pin segments.\n  - **SAS interface**: **Does NOT have a gap** between the segments, and features a **secondary edge connector on the back** (enabling dual-port multipath access and higher rates). SAS backplanes are compatible with SATA drives, but SATA backplanes cannot accept SAS drives.\n- **Transmission Rates by Protocol Version (p. 155)**:\n\n| Interface Type | Version 1.0 | Version 2.0 | Version 3.0 |\n| :--- | :---: | :---: | :---: |\n| **SAS** | **3 Gbit/s** | **6 Gbit/s** | **12 Gbit/s** |\n| **SATA** | **1.5 Gbit/s** | **3 Gbit/s** | **6 Gbit/s** (600 MB/s) |\n\n- **NVMe (Non-Volatile Memory Express, pp. 156, 225)**:\n  - A driver and protocol standard for high-performance **PCIe SSDs** that unifies PCIe SSD drivers from various vendors and integrates them into the OS. Its external physical interface is **PCIe**.\n  - **Two Key Advantages**:\n    1. **High performance**: Directly connects to CPUs through the **PCIe bus**, bypassing SAS/SATA controllers to deliver ultra-high IOPS, high bandwidth, and low latency.\n    2. **Standardization**: Mature OS driver ecosystem.\n\n---\n\n### 2. Drive Physical Form Factors: LFF vs. SFF (p. 157)\nAlthough SSDs have no spinning platters, they use the same form factors as HDDs:\n- **3.5-inch HDD — LFF (Large Form Factor)**:\n  - H \× W = \147\ mm \× 101.85\ mm, enterprise depth = \26.1\ mm.\n- **2.5-inch HDD — SFF (Small Form Factor)**:\n  - H \× W = \100.45\ mm \× 69.85\ mm, enterprise depth = \15\ mm.\n- **2.5-inch SSD — SFF (Small Form Factor)**:\n  - H \× W = \100.45\ mm \× 69.85\ mm, depth can be **7 mm, 9.5 mm, or 15 mm** (never exceeds 15 mm).\n\n---\n\n### 3. Key Performance Indicators (KPIs) & Benchmark Table (p. 158)\nThe 5 key drive performance indicators are: **Drive capacity (volume)**, **Rotational speed (HDDs only)**, **Average access time**, **Data transfer rate (bandwidth)**, and **IOPS (Input/Output Operations Per Second)**.\n\n| Drive Type | IOPS (4 KB Random Write) | Bandwidth (128 KB Sequential Read) |\n| :--- | :---: | :---: |\n| **SATA HDD** | **330** | **200 MB/s** |\n| **SAS 10K HDD** | **350** | **195 MB/s** |\n| **SAS 15K HDD** | **450** | **290 MB/s** |\n| **SATA SSD** | **30–60K** | **540 MB/s** |\n| **SAS SSD** | **155K** | **1000 MB/s** |\n| **NVMe SSD** | **300K** | **3500 MB/s** |", "key_takeaways": ["SATA 1.0/2.0/3.0 rates are 1.5 / 3 / 6 Gbit/s; SAS 1.0/2.0/3.0 rates are 3 / 6 / 12 Gbit/s.", "A SATA connector has a gap between pin sections; a SAS connector has no gap and includes a back-side connector.", "3.5-inch drives are LFF (147 mm × 101.85 mm × 26.1 mm); 2.5-inch drives are SFF (100.45 mm × 69.85 mm, depth <= 15 mm).", "NVMe SSD connects directly to the CPU via PCIe, delivering ~300K IOPS (4 KB random write) and ~3500 MB/s (128 KB sequential read)."], "exam_traps": ["EXAM TRAP: Do not confuse SAS 3.0 (12 Gbit/s) with SATA 3.0 (6 Gbit/s / 600 MB/s)!", "EXAM TRAP: LFF stands for 3.5-inch drives, while SFF stands for 2.5-inch drives (and 2.5-inch SSD depth never exceeds 15 mm)."], "content_html": "<h3>1. Drive Interfaces: SATA vs. SAS vs. PCIe (NVMe) (pp. 155–156)<\/h3>\n<p>Mainstream server drives use <strong>SATA<\/strong>, <strong>SAS<\/strong>, and <strong>PCIe (NVMe)<\/strong> interfaces:<\/p>\n<ul class=\"md-list\">\n<li><strong>Physical Connector Distinction (p. 155)<\/strong>:<\/li>\n<li><strong>SATA interface<\/strong>: Has a <strong>physical gap (notch)<\/strong> between the power and data pin segments.<\/li>\n<li><strong>SAS interface<\/strong>: <strong>Does NOT have a gap<\/strong> between the segments, and features a <strong>secondary edge connector on the back<\/strong> (enabling dual-port multipath access and higher rates). SAS backplanes are compatible with SATA drives, but SATA backplanes cannot accept SAS drives.<\/li>\n<li><strong>Transmission Rates by Protocol Version (p. 155)<\/strong>:<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Interface Type<\/th><th>Version 1.0<\/th><th>Version 2.0<\/th><th>Version 3.0<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>SAS<\/strong><\/td><td><strong>3 Gbit/s<\/strong><\/td><td><strong>6 Gbit/s<\/strong><\/td><td><strong>12 Gbit/s<\/strong><\/td><\/tr>\n<tr><td><strong>SATA<\/strong><\/td><td><strong>1.5 Gbit/s<\/strong><\/td><td><strong>3 Gbit/s<\/strong><\/td><td><strong>6 Gbit/s<\/strong> (600 MB/s)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>NVMe (Non-Volatile Memory Express, pp. 156, 225)<\/strong>:<\/li>\n<li>A driver and protocol standard for high-performance <strong>PCIe SSDs<\/strong> that unifies PCIe SSD drivers from various vendors and integrates them into the OS. Its external physical interface is <strong>PCIe<\/strong>.<\/li>\n<li><strong>Two Key Advantages<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>High performance<\/strong>: Directly connects to CPUs through the <strong>PCIe bus<\/strong>, bypassing SAS/SATA controllers to deliver ultra-high IOPS, high bandwidth, and low latency.<\/li>\n<li><strong>Standardization<\/strong>: Mature OS driver ecosystem.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Drive Physical Form Factors: LFF vs. SFF (p. 157)<\/h3>\n<p>Although SSDs have no spinning platters, they use the same form factors as HDDs:<\/p>\n<ul class=\"md-list\">\n<li><strong>3.5-inch HDD — LFF (Large Form Factor)<\/strong>:<\/li>\n<li>H \× W = \147\ mm \× 101.85\ mm, enterprise depth = \26.1\ mm.<\/li>\n<li><strong>2.5-inch HDD — SFF (Small Form Factor)<\/strong>:<\/li>\n<li>H \× W = \100.45\ mm \× 69.85\ mm, enterprise depth = \15\ mm.<\/li>\n<li><strong>2.5-inch SSD — SFF (Small Form Factor)<\/strong>:<\/li>\n<li>H \× W = \100.45\ mm \× 69.85\ mm, depth can be <strong>7 mm, 9.5 mm, or 15 mm<\/strong> (never exceeds 15 mm).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Key Performance Indicators (KPIs) &amp; Benchmark Table (p. 158)<\/h3>\n<p>The 5 key drive performance indicators are: <strong>Drive capacity (volume)<\/strong>, <strong>Rotational speed (HDDs only)<\/strong>, <strong>Average access time<\/strong>, <strong>Data transfer rate (bandwidth)<\/strong>, and <strong>IOPS (Input/Output Operations Per Second)<\/strong>.<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Drive Type<\/th><th>IOPS (4 KB Random Write)<\/th><th>Bandwidth (128 KB Sequential Read)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>SATA HDD<\/strong><\/td><td><strong>330<\/strong><\/td><td><strong>200 MB/s<\/strong><\/td><\/tr>\n<tr><td><strong>SAS 10K HDD<\/strong><\/td><td><strong>350<\/strong><\/td><td><strong>195 MB/s<\/strong><\/td><\/tr>\n<tr><td><strong>SAS 15K HDD<\/strong><\/td><td><strong>450<\/strong><\/td><td><strong>290 MB/s<\/strong><\/td><\/tr>\n<tr><td><strong>SATA SSD<\/strong><\/td><td><strong>30–60K<\/strong><\/td><td><strong>540 MB/s<\/strong><\/td><\/tr>\n<tr><td><strong>SAS SSD<\/strong><\/td><td><strong>155K<\/strong><\/td><td><strong>1000 MB/s<\/strong><\/td><\/tr>\n<tr><td><strong>NVMe SSD<\/strong><\/td><td><strong>300K<\/strong><\/td><td><strong>3500 MB/s<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>"}, "exercise": {"title": "Hands-On Lab: Storage Interface Rate & IOPS Performance Analyzer", "duration_mins": 8, "exercise_type": "script", "prompt_label": "python3@taishan-storage:~", "scenario": "Complete the storage benchmark script comparing SATA 3.0, SAS 3.0, and NVMe SSD interface rates, form factors, and 4 KB random write IOPS.", "instructions": ["Set `sata_3_rate_gbps` to `6` and `sas_3_rate_gbps` to `12`.", "Set `lff_inches` to `3.5` and `sff_inches` to `2.5`.", "Set `nvme_4k_write_iops` to `'300K'` and `nvme_seq_read_mbps` to `3500`."], "starter_code": "# Drive Interface & Benchmark Verification\ninterface_rates = {\n    \"sata_3_rate_gbps\": ___,\n    \"sas_3_rate_gbps\": ___,\n    \"nvme_external_bus\": \"PCIe\"\n}\nform_factors = {\n    \"lff_inches\": ___,\n    \"sff_inches\": ___,\n    \"max_sff_ssd_depth_mm\": 15\n}\nnvme_4k_write_iops = \"___\"\nnvme_seq_read_mbps = ___\nprint(interface_rates, form_factors, nvme_4k_write_iops, nvme_seq_read_mbps)", "solution_code": "# Drive Interface & Benchmark Verification\ninterface_rates = {\n    \"sata_3_rate_gbps\": 6,\n    \"sas_3_rate_gbps\": 12,\n    \"nvme_external_bus\": \"PCIe\"\n}\nform_factors = {\n    \"lff_inches\": 3.5,\n    \"sff_inches\": 2.5,\n    \"max_sff_ssd_depth_mm\": 15\n}\nnvme_4k_write_iops = \"300K\"\nnvme_seq_read_mbps = 3500\nprint(interface_rates, form_factors, nvme_4k_write_iops, nvme_seq_read_mbps)", "hints": ["SATA 3.0 is 6 Gbit/s; SAS 3.0 is 12 Gbit/s.", "LFF is 3.5-inch, SFF is 2.5-inch; NVMe SSD reaches 300K 4KB random write IOPS and 3500 MB/s 128KB sequential read bandwidth."], "validation_checks": [{"step": 1, "description": "Verify SATA 3.0 (6 Gbit/s) and SAS 3.0 (12 Gbit/s) rates", "required_any": ["6", "12"], "feedback_fail": "Set sata_3_rate_gbps = 6 and sas_3_rate_gbps = 12."}, {"step": 2, "description": "Verify LFF (3.5-inch) and SFF (2.5-inch) form factors", "required_any": ["3.5", "2.5"], "feedback_fail": "Set lff_inches = 3.5 and sff_inches = 2.5."}, {"step": 3, "description": "Verify NVMe SSD 300K IOPS and 3500 MB/s bandwidth", "required_any": ["300k", "3500"], "feedback_fail": "Set nvme_4k_write_iops = '300K' and nvme_seq_read_mbps = 3500."}], "simulated_output": "{'sata_3_rate_gbps': 6, 'sas_3_rate_gbps': 12, 'nvme_external_bus': 'PCIe'} {'lff_inches': 3.5, 'sff_inches': 2.5, 'max_sff_ssd_depth_mm': 15} 300K 3500\n[OK] SATA/SAS/NVMe interfaces, LFF/SFF dimensions, and IOPS benchmarks verified.", "quiz_questions": [{"id": "h3_s4_q1", "type": "single", "question": "What are the maximum transmission rates of SAS 3.0 and SATA 3.0 interfaces, respectively?", "options": ["A. SAS 3.0 = 6 Gbit/s; SATA 3.0 = 3 Gbit/s", "B. SAS 3.0 = 12 Gbit/s; SATA 3.0 = 6 Gbit/s", "C. SAS 3.0 = 16 Gbit/s; SATA 3.0 = 12 Gbit/s", "D. SAS 3.0 = 6 Gbit/s; SATA 3.0 = 6 Gbit/s"], "answer": "B", "explanation": "According to Ch.03 p.155, SAS 1.0/2.0/3.0 rates are 3 / 6 / 12 Gbit/s, while SATA 1.0/2.0/3.0 rates are 1.5 / 3 / 6 Gbit/s."}, {"id": "h3_s4_q2", "type": "single", "question": "How can you physically distinguish a SATA drive interface from a SAS drive interface?", "options": ["A. A SATA interface has a gap between the connectors, whereas a SAS interface has no gap and has an edge connector on the back.", "B. A SAS interface has a gap between the connectors, whereas a SATA interface has no gap.", "C. A SATA interface uses an 89 mm PCIe x16 edge connector.", "D. There is no physical difference between SATA and SAS drive connectors."], "answer": "A", "explanation": "According to Ch.03 p.155, a SATA interface has a physical gap between its two connector segments, while a SAS interface does not have a gap and features an edge connector on its back."}, {"id": "h3_s4_q3", "type": "multiple", "question": "Which of the following statements about NVMe SSDs and drive form factors are true?", "options": ["A. NVMe connects directly to CPUs through the PCIe interface, providing high IOPS, high bandwidth, and low latency.", "B. A 3.5-inch HDD is referred to as Large Form Factor (LFF), and a 2.5-inch HDD/SSD is referred to as Small Form Factor (SFF).", "C. The depth of a 2.5-inch SFF SSD can be 7 mm, 9.5 mm, or 15 mm, and does not exceed 15 mm.", "D. Rotational speed (RPM) is a key performance indicator for both HDDs and NVMe SSDs."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.03, pp. 156–157). D is false because SSDs have no platters, so rotational speed applies to HDDs only (Ch.03, p.158)."}]}}]}, {"hour_number": 4, "folder_name": "Hour-04-RAID-PCIe-NICs-GPUs-and-Server-Software", "title": "RAID Arrays, PCIe Bus, NICs/iNICs, GPU/NPU, Power/Cooling & Server Software", "chapter_ref": "Chapter 03 Part 2 (pp. 159–226)", "duration_mins": 60, "overview": "Master RAID levels (0/1/1E/5/6/10/01/50/60), hot spare & hardware vs. software RAID, PCIe 1.0–5.0 bandwidths, Huawei server NIC types (LOM, PCIe, FlexIO, Mezzanine) & Hi1822 iNIC, GPU vs. NPU, FLOPS/TOPS, liquid/air cooling, PSUs, IPMI/Redfish/SNMP/iBMC/iBMA, BIOS vs. UEFI, and Linux directory hierarchy.", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-RAID-Levels-Parity-and-Hardware-vs-Software-RAID", "exercise_slug": "02-Exercise-RAID-Capacity-Fault-Tolerance-and-Parity-Lab", "lecture": {"title": "RAID Levels, Parity, Hot Spare & Hardware vs. Software RAID", "duration_mins": 8, "pdf_ref": "Ch.03, pp. 159–169", "objectives": ["Understand the 3 core RAID technologies (Data striping, Mirroring, Data parity) and calculate utilization and fault tolerance for RAID 0, 1, 1E, 5, 6, 10, 01, 50, and 60", "Explain Global vs. Dedicated Hot Spare and why RAID is NOT a substitute for data backup", "Contrast Software RAID (and its 6 unsupported features) with Built-in and External Hardware RAID"], "content_markdown": "### 1. RAID Core Technologies & Standard/Nested Levels (pp. 159–163)\nProposed by **Prof. D.A. Patterson** at UC Berkeley in **1988**, **RAID (Redundant Array of Independent Disks)** combines multiple physical disks into logical disks/volumes (**LUNs**) using **Data striping**, **Mirroring**, and **Data parity** (XOR or Galois field P+Q).\n\n| RAID Level | Min Disks | Drive Utilization (N disks, M spans) | Fault Tolerance & Key Mechanism (pp. 160–163) |\n| :--- | :---: | :---: | :--- |\n| **RAID 0** | \≥ 1$ (or \≥ 2) | **100%** (N) | **0 failed disks**. Striping only; highest read/write speed, **low reliability** (graphics workstations). |\n| **RAID 1** | \≥ 2 (2N) | **50%** (N/2) | **1 disk per mirror pair**. Mirroring only; high reliability & read speed, medium write speed. |\n| **RAID 1E** | \≥ 3 | **50%** (N/2) | Each disk has two stripe groups where the next stripe group holds the **right-shifted misplaced mirror** of the previous stripe group. Tolerates **1 disk offline** (or **2 non-adjacent disks** if \≥ 4 disks, provided first and last disks do not fail together). |\n| **RAID 5** | \≥ 3 | **$(N - 1)/N** | **1 failed disk**. Cyclically distributed XOR parity (P_0 = D_0 \\oplus D_1). Single disk failure causes performance degradation during rebuild. |\n| **RAID 6** | \≥ 4 | **(N - 2)/N** | **2 failed disks simultaneously**. Two independent distributed parity codes: **P** (P_0 = D_0 \\oplus D_1) and **Q** (Q_0 = (D_0 \\cdot K_0) \\oplus (D_1 \\cdot K_1) in Galois field). |\n| **RAID 10 vs. 01** | \≥ 4$ (even) | **50%** | **RAID 10** mirrors first (RAID 1) then stripes (RAID 0); tolerates 1 failed disk per RAID 1 span. **RAID 01** stripes first (RAID 0) then mirrors (RAID 1) — losing 1 disk loses an entire stripe and degrades the array into a non-redundant RAID 0! |\n| **RAID 50** | \≥ 6 | **$(N - M)/N** | **RAID 5 first, then RAID 0** across M spans (\≥ 2 spans \× 3 disks = 6 disks min). Tolerates 1 disk failure per RAID 5 span. |\n| **RAID 60** | \≥ 8$ (theory) | **$(N - 2M)/N** | **RAID 6 first, then RAID 0** across M spans (\≥ 2 spans \× 4 disks = 8 disks min on p.161–162). Tolerates 2 disk failures per RAID 6 span. |\n\n---\n\n### 2. Hot Spare, Reconstruction & Why RAID != Backup (pp. 164–165)\n- **Hot Spare**: Automatically replaces a faulty disk in a redundant RAID group and triggers **reconstruction**:\n  - **Global Hot Spare**: Shared by **all** redundant RAID groups in the system.\n  - **Dedicated Hot Spare**: Dedicated to **one specific** redundant RAID group.\n- **RAID Cannot Replace Data Backup (p. 165)**: RAID only protects against physical disk failures; it **cannot** prevent data loss from **viruses, human error, accidental deletion, or OS/file system corruption**.\n\n---\n\n### 3. Software RAID vs. Hardware RAID (Built-in & External) (pp. 166–169)\n- **Software RAID (p. 167)**: Executed by OS kernel disk code using host **CPU** (high CPU overhead for RAID 5 XOR). **Six functions NOT supported by Software RAID**:\n  1. Hot swap of hard disks\n  2. Hot spare of hard disks\n  3. Remote array management\n  4. Bootable arrays\n  5. Array configuration on hard disks\n  6. S.M.A.R.T. for disks\n- **Built-in Hardware RAID**: Uses a PCIe RAID controller card (e.g., **Avago MegaRAID SAS 9440-8i** with Mini-SAS **SFF-8643** ports, heat sink, heartbeat LED, and chip overtemperature LED) with its own independent processor and cache memory; supports bootable arrays.\n- **External Hardware RAID**: Independent external disk array subsystem connected via standard controller; supports dual controllers, hot swap, and ultra-large capacity.", "key_takeaways": ["Drive utilization formulas: RAID 0 = 100%, RAID 1 / 10 / 1E = 50%, RAID 5 = (N-1)/N, RAID 6 = (N-2)/N, RAID 50 = (N-M)/N, RAID 60 = (N-2M)/N.", "RAID 10 mirrors first (RAID 1) then stripes (RAID 0) and is more fault-tolerant than RAID 01 (which stripes first then mirrors).", "RAID 50 requires at least 6 disks (2 × 3-disk RAID 5 spans); theoretical RAID 60 requires at least 8 disks (2 × 4-disk RAID 6 spans).", "Software RAID consumes host CPU cycles and does NOT support hot swap, hot spare, remote array management, bootable arrays, or disk S.M.A.R.T."], "exam_traps": ["EXAM TRAP: RAID CANNOT replace data backup because RAID cannot protect against viruses, accidental file deletion, or OS/filesystem corruption (p. 165)!", "EXAM TRAP: In RAID 1E with >= 4 disks, two offline disks can be tolerated ONLY if they are NOT adjacent (and the first and last disks are not offline simultaneously)."], "content_html": "<h3>1. RAID Core Technologies &amp; Standard/Nested Levels (pp. 159–163)<\/h3>\n<p>Proposed by <strong>Prof. D.A. Patterson<\/strong> at UC Berkeley in <strong>1988<\/strong>, <strong>RAID (Redundant Array of Independent Disks)<\/strong> combines multiple physical disks into logical disks/volumes (<strong>LUNs<\/strong>) using <strong>Data striping<\/strong>, <strong>Mirroring<\/strong>, and <strong>Data parity<\/strong> (XOR or Galois field P+Q).<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>RAID Level<\/th><th>Min Disks<\/th><th>Drive Utilization (N disks, M spans)<\/th><th>Fault Tolerance &amp; Key Mechanism (pp. 160–163)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>RAID 0<\/strong><\/td><td>\≥ 1$ (or \≥ 2)<\/td><td><strong>100%<\/strong> (N)<\/td><td><strong>0 failed disks<\/strong>. Striping only; highest read/write speed, <strong>low reliability<\/strong> (graphics workstations).<\/td><\/tr>\n<tr><td><strong>RAID 1<\/strong><\/td><td>\≥ 2 (2N)<\/td><td><strong>50%<\/strong> (N/2)<\/td><td><strong>1 disk per mirror pair<\/strong>. Mirroring only; high reliability &amp; read speed, medium write speed.<\/td><\/tr>\n<tr><td><strong>RAID 1E<\/strong><\/td><td>\≥ 3<\/td><td><strong>50%<\/strong> (N/2)<\/td><td>Each disk has two stripe groups where the next stripe group holds the <strong>right-shifted misplaced mirror<\/strong> of the previous stripe group. Tolerates <strong>1 disk offline<\/strong> (or <strong>2 non-adjacent disks<\/strong> if \≥ 4 disks, provided first and last disks do not fail together).<\/td><\/tr>\n<tr><td><strong>RAID 5<\/strong><\/td><td>\≥ 3<\/td><td><strong>$(N - 1)/N<\/strong><\/td><td><strong>1 failed disk<\/strong>. Cyclically distributed XOR parity (P_0 = D_0 \\oplus D_1). Single disk failure causes performance degradation during rebuild.<\/td><\/tr>\n<tr><td><strong>RAID 6<\/strong><\/td><td>\≥ 4<\/td><td><strong>(N - 2)/N<\/strong><\/td><td><strong>2 failed disks simultaneously<\/strong>. Two independent distributed parity codes: <strong>P<\/strong> (P_0 = D_0 \\oplus D_1) and <strong>Q<\/strong> (Q_0 = (D_0 \\cdot K_0) \\oplus (D_1 \\cdot K_1) in Galois field).<\/td><\/tr>\n<tr><td><strong>RAID 10 vs. 01<\/strong><\/td><td>\≥ 4$ (even)<\/td><td><strong>50%<\/strong><\/td><td><strong>RAID 10<\/strong> mirrors first (RAID 1) then stripes (RAID 0); tolerates 1 failed disk per RAID 1 span. <strong>RAID 01<\/strong> stripes first (RAID 0) then mirrors (RAID 1) — losing 1 disk loses an entire stripe and degrades the array into a non-redundant RAID 0!<\/td><\/tr>\n<tr><td><strong>RAID 50<\/strong><\/td><td>\≥ 6<\/td><td><strong>$(N - M)/N<\/strong><\/td><td><strong>RAID 5 first, then RAID 0<\/strong> across M spans (\≥ 2 spans \× 3 disks = 6 disks min). Tolerates 1 disk failure per RAID 5 span.<\/td><\/tr>\n<tr><td><strong>RAID 60<\/strong><\/td><td>\≥ 8$ (theory)<\/td><td><strong>$(N - 2M)/N<\/strong><\/td><td><strong>RAID 6 first, then RAID 0<\/strong> across M spans (\≥ 2 spans \× 4 disks = 8 disks min on p.161–162). Tolerates 2 disk failures per RAID 6 span.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Hot Spare, Reconstruction &amp; Why RAID != Backup (pp. 164–165)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Hot Spare<\/strong>: Automatically replaces a faulty disk in a redundant RAID group and triggers <strong>reconstruction<\/strong>:<\/li>\n<li><strong>Global Hot Spare<\/strong>: Shared by <strong>all<\/strong> redundant RAID groups in the system.<\/li>\n<li><strong>Dedicated Hot Spare<\/strong>: Dedicated to <strong>one specific<\/strong> redundant RAID group.<\/li>\n<li><strong>RAID Cannot Replace Data Backup (p. 165)<\/strong>: RAID only protects against physical disk failures; it <strong>cannot<\/strong> prevent data loss from <strong>viruses, human error, accidental deletion, or OS/file system corruption<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Software RAID vs. Hardware RAID (Built-in &amp; External) (pp. 166–169)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Software RAID (p. 167)<\/strong>: Executed by OS kernel disk code using host <strong>CPU<\/strong> (high CPU overhead for RAID 5 XOR). <strong>Six functions NOT supported by Software RAID<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li>Hot swap of hard disks<\/li>\n<li>Hot spare of hard disks<\/li>\n<li>Remote array management<\/li>\n<li>Bootable arrays<\/li>\n<li>Array configuration on hard disks<\/li>\n<li>S.M.A.R.T. for disks<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Built-in Hardware RAID<\/strong>: Uses a PCIe RAID controller card (e.g., <strong>Avago MegaRAID SAS 9440-8i<\/strong> with Mini-SAS <strong>SFF-8643<\/strong> ports, heat sink, heartbeat LED, and chip overtemperature LED) with its own independent processor and cache memory; supports bootable arrays.<\/li>\n<li><strong>External Hardware RAID<\/strong>: Independent external disk array subsystem connected via standard controller; supports dual controllers, hot swap, and ultra-large capacity.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Enterprise RAID Capacity & Fault Tolerance Calculator", "duration_mins": 8, "exercise_type": "script", "prompt_label": "python3@taishan-raid:~", "scenario": "Write a Python script to compute usable capacities for a server with 8 × 4 TB drives across RAID 5, RAID 6, RAID 10, and RAID 60 (with M=2 spans), and verify minimum disk counts.", "instructions": ["Set `raid5_min_disks` to `3`, `raid50_min_disks` to `6`, and `raid60_min_disks` to `8`.", "For `N = 8` disks of `4` TB each (total raw = 32 TB, `M = 2` spans): set `usable_tb_raid5` to `28` ($(8-1)\× 4), `usable_tb_raid6` to `24` ((8-2)\× 4), and `usable_tb_raid60` to `16` ((8 - 2\× 2)\× 4).", "Set `software_raid_supports_bootable_array` to `False`."], "starter_code": "# RAID Capacity & Fault Tolerance Calculator (8 x 4 TB Drives, M = 2 Spans)\nraid5_min_disks = ___\nraid50_min_disks = ___\nraid60_min_disks = ___\n\nusable_tb_raid5 = ___\nusable_tb_raid6 = ___\nusable_tb_raid60 = ___\nsoftware_raid_supports_bootable_array = ___\n\nprint(f\"Min Disks (R5/R50/R60): {raid5_min_disks}/{raid50_min_disks}/{raid60_min_disks}\")\nprint(f\"Usable TB (R5/R6/R60): {usable_tb_raid5}T / {usable_tb_raid6}T / {usable_tb_raid60}T\")", "solution_code": "# RAID Capacity & Fault Tolerance Calculator (8 x 4 TB Drives, M = 2 Spans)\nraid5_min_disks = 3\nraid50_min_disks = 6\nraid60_min_disks = 8\n\nusable_tb_raid5 = 28\nusable_tb_raid6 = 24\nusable_tb_raid60 = 16\nsoftware_raid_supports_bootable_array = False\n\nprint(f\"Min Disks (R5/R50/R60): {raid5_min_disks}/{raid50_min_disks}/{raid60_min_disks}\")\nprint(f\"Usable TB (R5/R6/R60): {usable_tb_raid5}T / {usable_tb_raid6}T / {usable_tb_raid60}T\")", "hints": ["RAID 5 requires >= 3 disks, RAID 50 requires >= 6 disks, and RAID 60 requires >= 8 disks (Ch.03, pp. 161–162).", "With 8 × 4 TB drives: RAID 5 usable = 7 × 4 = 28 TB; RAID 6 usable = 6 × 4 = 24 TB; RAID 60 (2 spans) usable = (8 - 4) × 4 = 16 TB."], "validation_checks": [{"step": 1, "description": "Verify minimum disk counts for RAID 5 (3), RAID 50 (6), and RAID 60 (8)", "required_any": ["3", "6", "8"], "feedback_fail": "Set raid5_min_disks = 3, raid50_min_disks = 6, and raid60_min_disks = 8."}, {"step": 2, "description": "Verify usable capacities (28 TB, 24 TB, 16 TB)", "required_any": ["28", "24", "16"], "feedback_fail": "Check usable_tb_raid5 = 28, usable_tb_raid6 = 24, and usable_tb_raid60 = 16."}, {"step": 3, "description": "Verify that Software RAID does not support bootable arrays", "required_any": ["false"], "feedback_fail": "Set software_raid_supports_bootable_array = False."}], "simulated_output": "Min Disks (R5/R50/R60): 3/6/8\nUsable TB (R5/R6/R60): 28T / 24T / 16T\n[OK] RAID utilization formulas and Software RAID limitations verified.", "quiz_questions": [{"id": "h4_s1_q1", "type": "single", "question": "If a server is configured with N member drives arranged in M spans in a RAID 60 array, what is the drive utilization formula, and what is the theoretical minimum number of drives required to construct RAID 60?", "options": ["A. (N - M)/N; at least 6 drives", "B. (N - M * 2)/N; at least 8 drives", "C. (N - 2)/N; at least 4 drives", "D. 50%; at least 4 drives"], "answer": "B", "explanation": "According to Ch.03 pp. 161–163, RAID 60 sets up RAID 6 (at least 4 drives per span) first and then RAID 0 across M spans, requiring at least 8 drives with drive utilization (N - M × 2)/N."}, {"id": "h4_s1_q2", "type": "multiple", "question": "Which of the following functions are NOT provided by Software RAID according to Chapter 03 (p. 167)?", "options": ["A. Hot swap and hot spare of hard disks", "B. Remote array management", "C. Bootable arrays", "D. S.M.A.R.T. for disks"], "answer": "ABCD", "explanation": "According to Ch.03 p.167, Software RAID does not support hot swap of hard disks, hot spare of hard disks, remote array management, bootable arrays, array configuration on hard disks, or S.M.A.R.T. for disks."}, {"id": "h4_s1_q3", "type": "tf", "question": "Because RAID 6 uses two independent distributed parity codes (P and Q) and can tolerate two simultaneous drive failures, configuring RAID 6 eliminates the need for data backup and disaster recovery.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.03 p.165, RAID cannot be used as an alternative to data backup because it cannot prevent data loss caused by non-disk faults such as viruses, man-made damage, or accidental deletion."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-PCIe-Bus-NICs-iNICs-GPUs-NPUs-and-Power-Cooling", "exercise_slug": "04-Exercise-PCIe-Bandwidth-Huawei-NIC-Types-and-PSU-Lab", "lecture": {"title": "PCIe 1.0–5.0, Riser Cards, Huawei NICs/iNICs, GPU/NPU & Power/Cooling", "duration_mins": 8, "pdf_ref": "Ch.03, pp. 170–189, 220", "objectives": ["Master bus evolution (PC/XT, ISA, EISA, PCI, AGP, PCIe), Riser slot mappings on TaiShan 200, and PCIe 1.0–5.0 transfer rates and bandwidths", "Distinguish Huawei server NIC types (LOM, PCIe card, FlexIO card, Mezzanine card — Ch.03 Quiz Q1!) and Hi1822 iNIC features", "Compare CPU vs. GPU vs. NPU architectures, FLOPS vs. TOPS, Air vs. Liquid Cooling (Cold-plate, Spray, Immersion), and ATX vs. SSI/CRPS PSUs"], "content_markdown": "### 1. Bus Evolution, Riser Cards & PCIe 1.0–5.0 Specifications (pp. 170–173)\n- **Bus History (p. 171)**:\n  - **1st-Gen Buses**: **PC/XT (1981**, 8-bit 8088), **ISA (1984**, 16-bit 80286, max **8 MB/s**), **EISA (1988**, 32-bit @ 8 MHz, **32 MB/s**), VESA, Micro Channel.\n  - **2nd-Gen Buses**: **PCI (1992)**, **AGP (1996)**, **PCI-X**, and **PCIe (2004)**.\n- **TaiShan 200 Riser Cards & PCIe Slots (p. 172)**: Rear **I/O module 1** provides **slots 1–3** (when riser installed: **slot 2 & slot 3**); **I/O module 2** provides **slots 4–6** (when riser installed: **slot 5 & slot 6**); **I/O module 3** provides **slots 7–8**.\n- **PCIe 1.0 to 5.0 Transmission Rates & Bandwidths (p. 173)**:\n\n| PCIe Version | Launch Year | Transfer Rate | \× 1 Bandwidth | \× 4 Bandwidth | \× 8 Bandwidth | \× 16 Bandwidth |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| **PCIe 1.0** | 2003 | **2.5 GT/s** | 250 MB/s | 1.0 GB/s | 2.0 GB/s | **4.0 GB/s** |\n| **PCIe 2.0** | 2007 | **5.0 GT/s** | 500 MB/s | 2.0 GB/s | 4.0 GB/s | **8.0 GB/s** |\n| **PCIe 3.0** | 2010 | **8.0 GT/s** | 984.6 MB/s | 3.94 GB/s | 7.88 GB/s | **15.8 GB/s** |\n| **PCIe 4.0** | 2017 | **16.0 GT/s** | 1969 MB/s | 7.88 GB/s | 15.75 GB/s | **31.5 GB/s** |\n| **PCIe 5.0** | 2019 | **32.0 GT/s** | 3938 MB/s | 15.75 GB/s | 31.51 GB/s | **63.0 GB/s** |\n\n*(Pin counts & lengths: \× 1 = 36\ pins / 25\ mm; \× 4 = 64\ pins / 39\ mm; \× 8 = 98\ pins / 56\ mm; \× 16 = 164\ pins / 89\ mm.)*\n\n---\n\n### 2. Huawei Server NICs & Hi1822 iNIC (pp. 174–180 — Official Quiz Q1!)\n- **Ports**: **Electrical port (RJ45)** for twisted-pair cables (e.g., **TM210** FlexIO 4 \× \GE); **Optical port** (optical cage for **SFP+, SFP28, QSFP+** modules, e.g., **TM280** FlexIO 4 \× 25\GE).\n- **Four Huawei Server NIC Structural Types (p. 177 — Ch.03 Quiz Q1!)**:\n  1. **LOM (LAN on Motherboard)**: **Integrated directly in the PCH chip of the server mainboard and CANNOT be replaced**. Provides 2 \× \GE electrical + 2 \× 10\GE optical/electrical ports; **does NOT occupy PCIe slots**.\n  2. **PCIe Standard Card**: Self-developed or purchased; installed in **standard PCIe slots**.\n  3. **FlexIO Card**: Non-standard Huawei-developed PCIe card mounted at the **rear panel**, used **ONLY on Huawei rack servers**.\n  4. **Mezzanine Card**: Used **ONLY on compute nodes of Huawei E9000 blade servers** (no external physical ports; signals route via blade backplane; not interchangeable across vendors).\n- **Huawei Intelligent Converged Network Chips & IN200 iNIC (pp. 179–180)**:\n  - Evolution: **FE308 (2004, 1st-gen)** \\rightarrow **Hi1821 (2014, 2nd-gen)** \\rightarrow **Hi1822 (2018, 3rd-gen)**.\n  - **Hi1822 / IN200 iNIC**: Converged Ethernet (25GE–100GE) & FC (16G–32G), **48 built-in programmable data forwarding cores**, OVS (15 Mpps) & **RoCE v1/v2** offloading, SR-IOV, PCIe 3.0 x16 HHHL card.\n\n---\n\n### 3. GPU vs. NPU, FLOPS vs. TOPS, Liquid Cooling & PSUs (pp. 181–189)\n- **CPU vs. GPU vs. NPU (pp. 181–183)**:\n  - **ALU Chip Area**: ALU accounts for **5% of CPU chip space** vs. **40% of GPU chip space**. Discrete GPUs (PCIe, e.g., NVIDIA Tesla/GeForce, AMD Radeon/FireStream) have independent video memory; Integrated GPUs (in CPU) occupy system memory.\n  - **NPU**: Simulates biological neurons and synapses at the circuit layer; **intermediate neuron layer results do NOT need to be output to main memory** but pass directly to the next layer, Processing a group of neurons in 1 or a few instructions. Both GPUs and NPUs require **CPU cooperation**.\n- **Computing Power Metrics (pp. 184–185)**:\n  - **FLOPS** (Floating-Point Operations/s): **MFLOPS (10^6)**, **GFLOPS (10^9)**, **TFLOPS (10^{12})**, **PFLOPS (10^{15})**, **EFLOPS (10^{18})**.\n  - **TOPS** (10^{12} Ops/s): Focuses on **integer computing power**.\n- **Server Cooling (pp. 186–187)**:\n  - **Indirect Liquid Cooling**: **Cold plate** (uses safe, non-toxic deionized water + glycol in closed loop over main heat components; other components cooled by air/liquid doors).\n  - **Direct Liquid Cooling (100% liquid)**: **Spray** (selective coolant spray) and **Immersion** (single-phase or two-phase low-boiling-point refrigerant).\n- **Server Power Supplies (pp. 188–189)**:\n  - **ATX** (125–350 W, 20-pin, ATX12V added 4-pin 12V for Pentium 4) vs. **SSI** (Server System Infrastructure, supplies UPS/HVDC).\n  - **Width standards**: **73.5 mm** (CRPS 800W/1300W) and **68.0 mm** (Kunpeng 900W/2000W used in **TaiShan 200 2280** and **2288X V5**; AC input `90V–264V AC`, DC input `180V–300V/320V DC`, output `12V DC`).", "key_takeaways": ["PCIe transfer rates double each generation from Gen 1 to Gen 5: 2.5 -> 5.0 -> 8.0 -> 16.0 -> 32.0 GT/s (x16 bandwidth: 4 -> 8 -> 15.8 -> 31.5 -> 63.0 GB/s).", "Huawei NIC types (Ch.03 Quiz Q1): LOM is integrated in the mainboard PCH chip and cannot be replaced; PCIe cards fit standard PCIe slots; FlexIO cards are rear-panel cards for Huawei rack servers; Mezzanine cards are ONLY for E9000 blade servers.", "ALU accounts for 5% of CPU die area vs. 40% of GPU die area; NPUs pass neuron outputs directly between layers without writing back to main memory.", "Cold-plate is indirect liquid cooling, while Immersion and Spray are direct (100%) liquid cooling. TaiShan 200 (2280) uses 68.0 mm Kunpeng PSUs (900W / 2000W)."], "exam_traps": ["EXAM TRAP (Ch.03 Quiz Q1): Mezzanine cards can ONLY be used on Huawei E9000 blade servers (NOT rack servers!), and FlexIO cards are installed in rear-panel FlexIO slots of rack servers (NOT integrated on the front panel for front-end service connection!). Only A and B are true in Ch.03 Quiz Q1.", "EXAM TRAP: Cold-plate liquid cooling is INDIRECT cooling (coolant does not touch electronics directly), whereas Spray and Immersion are DIRECT cooling."], "content_html": "<h3>1. Bus Evolution, Riser Cards &amp; PCIe 1.0–5.0 Specifications (pp. 170–173)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Bus History (p. 171)<\/strong>:<\/li>\n<li><strong>1st-Gen Buses<\/strong>: <strong>PC/XT (1981<\/strong>, 8-bit 8088), <strong>ISA (1984<\/strong>, 16-bit 80286, max <strong>8 MB/s<\/strong>), <strong>EISA (1988<\/strong>, 32-bit @ 8 MHz, <strong>32 MB/s<\/strong>), VESA, Micro Channel.<\/li>\n<li><strong>2nd-Gen Buses<\/strong>: <strong>PCI (1992)<\/strong>, <strong>AGP (1996)<\/strong>, <strong>PCI-X<\/strong>, and <strong>PCIe (2004)<\/strong>.<\/li>\n<li><strong>TaiShan 200 Riser Cards &amp; PCIe Slots (p. 172)<\/strong>: Rear <strong>I/O module 1<\/strong> provides <strong>slots 1–3<\/strong> (when riser installed: <strong>slot 2 &amp; slot 3<\/strong>); <strong>I/O module 2<\/strong> provides <strong>slots 4–6<\/strong> (when riser installed: <strong>slot 5 &amp; slot 6<\/strong>); <strong>I/O module 3<\/strong> provides <strong>slots 7–8<\/strong>.<\/li>\n<li><strong>PCIe 1.0 to 5.0 Transmission Rates &amp; Bandwidths (p. 173)<\/strong>:<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>PCIe Version<\/th><th>Launch Year<\/th><th>Transfer Rate<\/th><th>\× 1 Bandwidth<\/th><th>\× 4 Bandwidth<\/th><th>\× 8 Bandwidth<\/th><th>\× 16 Bandwidth<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>PCIe 1.0<\/strong><\/td><td>2003<\/td><td><strong>2.5 GT/s<\/strong><\/td><td>250 MB/s<\/td><td>1.0 GB/s<\/td><td>2.0 GB/s<\/td><td><strong>4.0 GB/s<\/strong><\/td><\/tr>\n<tr><td><strong>PCIe 2.0<\/strong><\/td><td>2007<\/td><td><strong>5.0 GT/s<\/strong><\/td><td>500 MB/s<\/td><td>2.0 GB/s<\/td><td>4.0 GB/s<\/td><td><strong>8.0 GB/s<\/strong><\/td><\/tr>\n<tr><td><strong>PCIe 3.0<\/strong><\/td><td>2010<\/td><td><strong>8.0 GT/s<\/strong><\/td><td>984.6 MB/s<\/td><td>3.94 GB/s<\/td><td>7.88 GB/s<\/td><td><strong>15.8 GB/s<\/strong><\/td><\/tr>\n<tr><td><strong>PCIe 4.0<\/strong><\/td><td>2017<\/td><td><strong>16.0 GT/s<\/strong><\/td><td>1969 MB/s<\/td><td>7.88 GB/s<\/td><td>15.75 GB/s<\/td><td><strong>31.5 GB/s<\/strong><\/td><\/tr>\n<tr><td><strong>PCIe 5.0<\/strong><\/td><td>2019<\/td><td><strong>32.0 GT/s<\/strong><\/td><td>3938 MB/s<\/td><td>15.75 GB/s<\/td><td>31.51 GB/s<\/td><td><strong>63.0 GB/s<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><em>(Pin counts &amp; lengths: \× 1 = 36\ pins / 25\ mm; \× 4 = 64\ pins / 39\ mm; \× 8 = 98\ pins / 56\ mm; \× 16 = 164\ pins / 89\ mm.)<\/em><\/p>\n<p>---<\/p>\n<h3>2. Huawei Server NICs &amp; Hi1822 iNIC (pp. 174–180 — Official Quiz Q1!)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Ports<\/strong>: <strong>Electrical port (RJ45)<\/strong> for twisted-pair cables (e.g., <strong>TM210<\/strong> FlexIO 4 \× \GE); <strong>Optical port<\/strong> (optical cage for <strong>SFP+, SFP28, QSFP+<\/strong> modules, e.g., <strong>TM280<\/strong> FlexIO 4 \× 25\GE).<\/li>\n<li><strong>Four Huawei Server NIC Structural Types (p. 177 — Ch.03 Quiz Q1!)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>LOM (LAN on Motherboard)<\/strong>: <strong>Integrated directly in the PCH chip of the server mainboard and CANNOT be replaced<\/strong>. Provides 2 \× \GE electrical + 2 \× 10\GE optical/electrical ports; <strong>does NOT occupy PCIe slots<\/strong>.<\/li>\n<li><strong>PCIe Standard Card<\/strong>: Self-developed or purchased; installed in <strong>standard PCIe slots<\/strong>.<\/li>\n<li><strong>FlexIO Card<\/strong>: Non-standard Huawei-developed PCIe card mounted at the <strong>rear panel<\/strong>, used <strong>ONLY on Huawei rack servers<\/strong>.<\/li>\n<li><strong>Mezzanine Card<\/strong>: Used <strong>ONLY on compute nodes of Huawei E9000 blade servers<\/strong> (no external physical ports; signals route via blade backplane; not interchangeable across vendors).<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Huawei Intelligent Converged Network Chips &amp; IN200 iNIC (pp. 179–180)<\/strong>:<\/li>\n<li>Evolution: <strong>FE308 (2004, 1st-gen)<\/strong> \\rightarrow <strong>Hi1821 (2014, 2nd-gen)<\/strong> \\rightarrow <strong>Hi1822 (2018, 3rd-gen)<\/strong>.<\/li>\n<li><strong>Hi1822 / IN200 iNIC<\/strong>: Converged Ethernet (25GE–100GE) &amp; FC (16G–32G), <strong>48 built-in programmable data forwarding cores<\/strong>, OVS (15 Mpps) &amp; <strong>RoCE v1/v2<\/strong> offloading, SR-IOV, PCIe 3.0 x16 HHHL card.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. GPU vs. NPU, FLOPS vs. TOPS, Liquid Cooling &amp; PSUs (pp. 181–189)<\/h3>\n<ul class=\"md-list\">\n<li><strong>CPU vs. GPU vs. NPU (pp. 181–183)<\/strong>:<\/li>\n<li><strong>ALU Chip Area<\/strong>: ALU accounts for <strong>5% of CPU chip space<\/strong> vs. <strong>40% of GPU chip space<\/strong>. Discrete GPUs (PCIe, e.g., NVIDIA Tesla/GeForce, AMD Radeon/FireStream) have independent video memory; Integrated GPUs (in CPU) occupy system memory.<\/li>\n<li><strong>NPU<\/strong>: Simulates biological neurons and synapses at the circuit layer; <strong>intermediate neuron layer results do NOT need to be output to main memory<\/strong> but pass directly to the next layer, Processing a group of neurons in 1 or a few instructions. Both GPUs and NPUs require <strong>CPU cooperation<\/strong>.<\/li>\n<li><strong>Computing Power Metrics (pp. 184–185)<\/strong>:<\/li>\n<li><strong>FLOPS<\/strong> (Floating-Point Operations/s): <strong>MFLOPS (10^6)<\/strong>, <strong>GFLOPS (10^9)<\/strong>, <strong>TFLOPS (10^{12})<\/strong>, <strong>PFLOPS (10^{15})<\/strong>, <strong>EFLOPS (10^{18})<\/strong>.<\/li>\n<li><strong>TOPS<\/strong> (10^{12} Ops/s): Focuses on <strong>integer computing power<\/strong>.<\/li>\n<li><strong>Server Cooling (pp. 186–187)<\/strong>:<\/li>\n<li><strong>Indirect Liquid Cooling<\/strong>: <strong>Cold plate<\/strong> (uses safe, non-toxic deionized water + glycol in closed loop over main heat components; other components cooled by air/liquid doors).<\/li>\n<li><strong>Direct Liquid Cooling (100% liquid)<\/strong>: <strong>Spray<\/strong> (selective coolant spray) and <strong>Immersion<\/strong> (single-phase or two-phase low-boiling-point refrigerant).<\/li>\n<li><strong>Server Power Supplies (pp. 188–189)<\/strong>:<\/li>\n<li><strong>ATX<\/strong> (125–350 W, 20-pin, ATX12V added 4-pin 12V for Pentium 4) vs. <strong>SSI<\/strong> (Server System Infrastructure, supplies UPS/HVDC).<\/li>\n<li><strong>Width standards<\/strong>: <strong>73.5 mm<\/strong> (CRPS 800W/1300W) and <strong>68.0 mm<\/strong> (Kunpeng 900W/2000W used in <strong>TaiShan 200 2280<\/strong> and <strong>2288X V5<\/strong>; AC input <code class=\"inline-code\">90V–264V AC<\/code>, DC input <code class=\"inline-code\">180V–300V/320V DC<\/code>, output <code class=\"inline-code\">12V DC<\/code>).<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: PCIe Gen 1–5 Bandwidth & Huawei Server NIC Audit", "duration_mins": 8, "exercise_type": "config", "prompt_label": "hw-architect@taishan-2280:~#", "scenario": "Complete the hardware verification file for PCIe 4.0/5.0 bandwidths, Huawei server NIC form factors, CPU/GPU ALU ratios, and TaiShan PSU dimensions.", "instructions": ["Set `pcie4_gt_s` to `16.0`, `pcie4_x16_gbs` to `31.5`, and `pcie5_x16_gbs` to `63.0`.", "Set `non_replaceable_pch_nic` to `'LOM'` and `blade_only_nic` to `'Mezzanine'`.", "Set `cpu_alu_area_percent` to `5`, `gpu_alu_area_percent` to `40`, and `taishan_2280_psu_width_mm` to `68.0`."], "starter_code": "# PCIe, NIC, GPU/NPU & PSU Hardware Audit\npcie_specs:\n  pcie3_gt_s: 8.0\n  pcie4_gt_s: ___\n  pcie4_x16_gbs: ___\n  pcie5_x16_gbs: ___\n\nhuawei_nics:\n  non_replaceable_pch_nic: \"___\"\n  rack_only_nonstandard_nic: \"FlexIO\"\n  blade_only_nic: \"___\"\n  third_gen_inic_chip: \"Hi1822\"\n\ncompute_and_power:\n  cpu_alu_area_percent: ___\n  gpu_alu_area_percent: ___\n  taishan_2280_psu_width_mm: ___\n", "solution_code": "# PCIe, NIC, GPU/NPU & PSU Hardware Audit\npcie_specs:\n  pcie3_gt_s: 8.0\n  pcie4_gt_s: 16.0\n  pcie4_x16_gbs: 31.5\n  pcie5_x16_gbs: 63.0\n\nhuawei_nics:\n  non_replaceable_pch_nic: \"LOM\"\n  rack_only_nonstandard_nic: \"FlexIO\"\n  blade_only_nic: \"Mezzanine\"\n  third_gen_inic_chip: \"Hi1822\"\n\ncompute_and_power:\n  cpu_alu_area_percent: 5\n  gpu_alu_area_percent: 40\n  taishan_2280_psu_width_mm: 68.0\n", "hints": ["PCIe 4.0 runs at 16.0 GT/s (31.5 GB/s for x16); PCIe 5.0 runs at 32.0 GT/s (63.0 GB/s for x16).", "LOM is embedded in the PCH chip; Mezzanine cards are for blade servers only. ALU occupies 5% of CPU vs. 40% of GPU; TaiShan 2280 PSUs are 68.0 mm wide."], "validation_checks": [{"step": 1, "description": "Verify PCIe 4.0 (16.0 GT/s, 31.5 GB/s) and PCIe 5.0 (63.0 GB/s) specs", "required_any": ["16.0", "31.5", "63.0"], "feedback_fail": "Set pcie4_gt_s = 16.0, pcie4_x16_gbs = 31.5, and pcie5_x16_gbs = 63.0."}, {"step": 2, "description": "Verify LOM and Mezzanine card classifications", "required_any": ["lom", "mezzanine"], "feedback_fail": "Set non_replaceable_pch_nic to 'LOM' and blade_only_nic to 'Mezzanine'."}, {"step": 3, "description": "Verify CPU (5%) vs GPU (40%) ALU area and 68.0 mm PSU width", "required_any": ["40", "68"], "feedback_fail": "Set cpu_alu_area_percent = 5, gpu_alu_area_percent = 40, and taishan_2280_psu_width_mm = 68.0."}], "simulated_output": "[OK] PCIe, NIC, Accelerator & PSU Specs Validated:\n- PCIe 4.0 x16 = 31.5 GB/s (16.0 GT/s) | PCIe 5.0 x16 = 63.0 GB/s (32.0 GT/s)\n- NICs: LOM (PCH embedded) | PCIe (Standard) | FlexIO (Rack rear) | Mezzanine (E9000 Blade)\n- ALU Area: CPU = 5%, GPU = 40% | TaiShan 2280 PSU Width = 68.0 mm.", "quiz_questions": [{"id": "h4_s2_q1", "type": "multiple", "question": "(Official Ch.03 Quiz Q1) Which of the following statements are true about NICs of Huawei servers?", "options": ["A. A LOM is integrated in the PCH chip of the server mainboard and cannot be replaced.", "B. Huawei-developed PCIe cards can be installed in standard PCIe slots.", "C. A FlexIO card is integrated on the server panel for front-end service connection.", "D. Mezzanine cards can be used for Huawei rack servers."], "answer": "AB", "explanation": "According to Ch.03 p.177 and p.220 Quiz Q1, A and B are true. C is false (FlexIO cards are pluggable non-standard PCIe cards installed on the rear panel of Huawei rack servers), and D is false (Mezzanine cards can ONLY be used on compute nodes of Huawei E9000 blade servers)."}, {"id": "h4_s2_q2", "type": "single", "question": "What are the transmission rate and x16 bandwidth of PCIe 4.0?", "options": ["A. 8.0 GT/s and 15.8 GB/s", "B. 16.0 GT/s and 31.5 GB/s", "C. 32.0 GT/s and 63.0 GB/s", "D. 5.0 GT/s and 8.0 GB/s"], "answer": "B", "explanation": "According to Ch.03 p.173, PCIe 4.0 (launched in 2017) has an original transmission rate of 16.0 GT/s and a ×16 bandwidth of 31.5 GB/s (×1 = 1969 MB/s, ×4 = 7.88 GB/s, ×8 = 15.75 GB/s)."}, {"id": "h4_s2_q3", "type": "single", "question": "Which of the following liquid cooling solutions is classified as an INDIRECT liquid cooling solution where the coolant does not directly contact electronic components?", "options": ["A. Single-phase immersion liquid cooling", "B. Two-phase immersion liquid cooling", "C. Spray liquid cooling", "D. Cold-plate liquid cooling"], "answer": "D", "explanation": "According to Ch.03 p.187, liquid cooling is divided into direct cooling (Immersion and Spray, 100% liquid cooling where coolant directly contacts heating components) and indirect cooling (Cold plate, where deionized water/glycol flows inside closed cold plates)."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Server-Management-Protocols-IPMI-Redfish-SNMP-and-iBMC", "exercise_slug": "06-Exercise-Redfish-RESTful-API-and-SNMP-Architecture-Lab", "lecture": {"title": "Server Protocols (IPMI, Redfish, SNMP), iBMA & Huawei iBMC", "duration_mins": 7, "pdf_ref": "Ch.03, pp. 191–202, 220", "objectives": ["Trace the evolution of IPMI (1.0 -> 1.5 -> 2.0) and understand how BMC uses IPMI independently of the OS (Ch.03 Quiz Q2!)", "Master Redfish HTTPS/RESTful interfaces (GET, POST, PATCH, DELETE) and iBMA 2.0 in-band/out-of-band BOB mapping", "Explain SNMP architecture (NMS, Agent, MO, MIB over UDP) and Huawei iBMC (Hi1710, Kbox/HWKbox)"], "content_markdown": "### 1. IPMI & Baseboard Management Controller (BMC) (pp. 193, 201–202 — Official Quiz Q2!)\n- **IPMI (Intelligent Platform Management Interface, p. 193)**: Open-standard hardware management interface specification created by **Intel, HP, NEC, Dell, and SuperMicro** that operates **independently of the OS** via the **BMC**:\n  - **1998 (IPMI 1.0)**: Remote monitoring of temperature and voltage over the network.\n  - **2001 (IPMI 1.5)**: Added **PCI Management Bus** function.\n  - **2004 (IPMI 2.0)**: Backward compatible with 1.0/1.5; added **Console Redirection (Serial over LAN)**, remote management via ports/modems/LANs, enhanced security, **VLAN**, and **blade server support**.\n- **BMC & Huawei iBMC (pp. 201–202 — Ch.03 Quiz Q2!)**:\n  - The **BMC** uses the **IPMI specification** to collect, process, and store sensor signals, and monitor the operating status of components.\n  - **Huawei iBMC** runs on the Huawei-developed **Hi1710** management chip and provides **CLI, WebUI, IPMI, SNMP, and Redfish** interfaces:\n    - **Status monitoring**: CPU, memory, drive, SSD, PCIe, RAID, fan, PSU, temperature, voltage.\n    - **Fault diagnosis**: CPU CATERR event, PSU failure, overtemperature alarm, sub-healthy fan, storage medium fault.\n    - **Running records**: Power-on/off recording, serial port voice/data recording, breakdown screenshot & breakdown video recording.\n    - **Diagnosis assistance**: Black box (**Kbox**) and parsing tool (**HWKbox**).\n\n---\n\n### 2. Redfish & iBMA 2.0 Architecture (pp. 194–196)\n- **Redfish (p. 194)**: Maintained by **DMTF (`www.dmtf.org`)** to solve security and horizontal-scalability limitations of IPMI. Based on **HTTPS/SSL** and uses **RESTful APIs** (`JSON`).\n- **Four Redfish HTTP Operations & Plugin Methods (p. 196)**:\n  - `GET` \\rightarrow `getAllInfo` (query resources)\n  - `POST` \\rightarrow `postRequest` (create/action)\n  - `PATCH` \\rightarrow `patchRequest` (update/modify parameters)\n  - `DELETE` \\rightarrow `deleteRequest` (remove resource)\n- **iBMA 2.0 (In-Band Management Agent, p. 195)**: Runs inside the host OS to obtain in-band metrics unavailable to out-of-band BMC (process info, CPU performance, RAID controller details) and integrates with **iBMC** via **vNIC** and **BOB** (*Baseboard Management Controller Out-of-Band*).\n\n---\n\n### 3. Simple Network Management Protocol (SNMP) (pp. 197–200)\nSNMP is an application-layer TCP/IP network management protocol carried over **UDP packets** using a polling + trap notification model:\n- **Four Basic SNMP Components (p. 198)**:\n  1. **NMS (Network Management System)**: Runs on NMS servers; sends `GET`/`SET` requests to agents and receives **Traps**.\n  2. **Agent**: Process running on the managed device; queries/updates the **MIB** and sends **Traps** when faults/events occur.\n  3. **Managed Object (MO)**: Hardware or software configuration parameters on a managed device (one device can have multiple MOs).\n  4. **MIB (Management Information Base)**: Hierarchical database schema defining the variables maintained by the agent.", "key_takeaways": ["IPMI evolution: 1998 (v1.0), 2001 (v1.5, PCI Management Bus), 2004 (v2.0, Console Redirection, VLAN, Blade server support).", "BMC complies with the IPMI specification to collect, process, and store sensor signals and monitor component status independently of the OS (Ch.03 Quiz Q2).", "Redfish (DMTF) uses HTTPS RESTful APIs supporting GET (getAllInfo), POST (postRequest), PATCH (patchRequest), and DELETE (deleteRequest).", "SNMP runs over UDP and consists of 4 basic components: NMS, Agent, Managed Object (MO), and MIB."], "exam_traps": ["EXAM TRAP: SNMP packets are carried over UDP (User Datagram Protocol), whereas Redfish is based on HTTPS/SSL (TCP)!", "EXAM TRAP: In Huawei iBMC diagnosis assistance, the black box is called 'Kbox' and its parsing tool is called 'HWKbox'."], "content_html": "<h3>1. IPMI &amp; Baseboard Management Controller (BMC) (pp. 193, 201–202 — Official Quiz Q2!)<\/h3>\n<ul class=\"md-list\">\n<li><strong>IPMI (Intelligent Platform Management Interface, p. 193)<\/strong>: Open-standard hardware management interface specification created by <strong>Intel, HP, NEC, Dell, and SuperMicro<\/strong> that operates <strong>independently of the OS<\/strong> via the <strong>BMC<\/strong>:<\/li>\n<li><strong>1998 (IPMI 1.0)<\/strong>: Remote monitoring of temperature and voltage over the network.<\/li>\n<li><strong>2001 (IPMI 1.5)<\/strong>: Added <strong>PCI Management Bus<\/strong> function.<\/li>\n<li><strong>2004 (IPMI 2.0)<\/strong>: Backward compatible with 1.0/1.5; added <strong>Console Redirection (Serial over LAN)<\/strong>, remote management via ports/modems/LANs, enhanced security, <strong>VLAN<\/strong>, and <strong>blade server support<\/strong>.<\/li>\n<li><strong>BMC &amp; Huawei iBMC (pp. 201–202 — Ch.03 Quiz Q2!)<\/strong>:<\/li>\n<li>The <strong>BMC<\/strong> uses the <strong>IPMI specification<\/strong> to collect, process, and store sensor signals, and monitor the operating status of components.<\/li>\n<li><strong>Huawei iBMC<\/strong> runs on the Huawei-developed <strong>Hi1710<\/strong> management chip and provides <strong>CLI, WebUI, IPMI, SNMP, and Redfish<\/strong> interfaces:<\/li>\n<li><strong>Status monitoring<\/strong>: CPU, memory, drive, SSD, PCIe, RAID, fan, PSU, temperature, voltage.<\/li>\n<li><strong>Fault diagnosis<\/strong>: CPU CATERR event, PSU failure, overtemperature alarm, sub-healthy fan, storage medium fault.<\/li>\n<li><strong>Running records<\/strong>: Power-on/off recording, serial port voice/data recording, breakdown screenshot &amp; breakdown video recording.<\/li>\n<li><strong>Diagnosis assistance<\/strong>: Black box (<strong>Kbox<\/strong>) and parsing tool (<strong>HWKbox<\/strong>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Redfish &amp; iBMA 2.0 Architecture (pp. 194–196)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Redfish (p. 194)<\/strong>: Maintained by <strong>DMTF (<code class=\"inline-code\">www.dmtf.org<\/code>)<\/strong> to solve security and horizontal-scalability limitations of IPMI. Based on <strong>HTTPS/SSL<\/strong> and uses <strong>RESTful APIs<\/strong> (<code class=\"inline-code\">JSON<\/code>).<\/li>\n<li><strong>Four Redfish HTTP Operations &amp; Plugin Methods (p. 196)<\/strong>:<\/li>\n<li><code class=\"inline-code\">GET<\/code> \\rightarrow <code class=\"inline-code\">getAllInfo<\/code> (query resources)<\/li>\n<li><code class=\"inline-code\">POST<\/code> \\rightarrow <code class=\"inline-code\">postRequest<\/code> (create/action)<\/li>\n<li><code class=\"inline-code\">PATCH<\/code> \\rightarrow <code class=\"inline-code\">patchRequest<\/code> (update/modify parameters)<\/li>\n<li><code class=\"inline-code\">DELETE<\/code> \\rightarrow <code class=\"inline-code\">deleteRequest<\/code> (remove resource)<\/li>\n<li><strong>iBMA 2.0 (In-Band Management Agent, p. 195)<\/strong>: Runs inside the host OS to obtain in-band metrics unavailable to out-of-band BMC (process info, CPU performance, RAID controller details) and integrates with <strong>iBMC<\/strong> via <strong>vNIC<\/strong> and <strong>BOB<\/strong> (<em>Baseboard Management Controller Out-of-Band<\/em>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Simple Network Management Protocol (SNMP) (pp. 197–200)<\/h3>\n<p>SNMP is an application-layer TCP/IP network management protocol carried over <strong>UDP packets<\/strong> using a polling + trap notification model:<\/p>\n<ul class=\"md-list\">\n<li><strong>Four Basic SNMP Components (p. 198)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>NMS (Network Management System)<\/strong>: Runs on NMS servers; sends <code class=\"inline-code\">GET<\/code>/<code class=\"inline-code\">SET<\/code> requests to agents and receives <strong>Traps<\/strong>.<\/li>\n<li><strong>Agent<\/strong>: Process running on the managed device; queries/updates the <strong>MIB<\/strong> and sends <strong>Traps<\/strong> when faults/events occur.<\/li>\n<li><strong>Managed Object (MO)<\/strong>: Hardware or software configuration parameters on a managed device (one device can have multiple MOs).<\/li>\n<li><strong>MIB (Management Information Base)<\/strong>: Hierarchical database schema defining the variables maintained by the agent.<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: Redfish RESTful Operations & SNMP/iBMC Diagnostic Check", "duration_mins": 7, "exercise_type": "terminal", "prompt_label": "admin@mgmt-station:~#", "scenario": "You are configuring out-of-band server management using Redfish HTTPS calls and verifying SNMP and iBMC Kbox parameters.", "instructions": ["Complete the `curl` command using the HTTPS protocol and `GET` method to query the Redfish `/redfish/v1/Systems` endpoint on iBMC.", "Specify the four Redfish HTTP methods (`GET, POST, PATCH, DELETE`) in the verification variable.", "Specify the iBMC black box name (`Kbox`) and its parsing tool (`HWKbox`)."], "starter_code": "# 1. Query Redfish Systems endpoint via HTTPS GET:\ncurl -k -X ___ https://192.168.2.100/redfish/v1/Systems -u Administrator:Admin@9000\n\n# 2. Verify Redfish methods & iBMC Black Box tools:\nREDFISH_METHODS=\"GET, POST, ___, ___\"\nIBMC_BLACKBOX=\"___\"\nIBMC_PARSER=\"___\"\n", "solution_code": "# 1. Query Redfish Systems endpoint via HTTPS GET:\ncurl -k -X GET https://192.168.2.100/redfish/v1/Systems -u Administrator:Admin@9000\n\n# 2. Verify Redfish methods & iBMC Black Box tools:\nREDFISH_METHODS=\"GET, POST, PATCH, DELETE\"\nIBMC_BLACKBOX=\"Kbox\"\nIBMC_PARSER=\"HWKbox\"\n", "hints": ["Redfish uses GET, POST, PATCH, and DELETE over HTTPS.", "On page 202, the iBMC black box is Kbox and the parsing tool is HWKbox."], "validation_checks": [{"step": 1, "description": "Use GET and PATCH/DELETE in Redfish configuration", "required_any": ["patch", "delete"], "feedback_fail": "Include PATCH and DELETE in REDFISH_METHODS."}, {"step": 2, "description": "Identify Kbox as the iBMC black box", "required_any": ["kbox"], "feedback_fail": "Set IBMC_BLACKBOX to 'Kbox'."}, {"step": 3, "description": "Identify HWKbox as the iBMC black box parsing tool", "required_any": ["hwkbox"], "feedback_fail": "Set IBMC_PARSER to 'HWKbox'."}], "simulated_output": "{\n  \"@odata.context\": \"/redfish/v1/metadata#ComputerSystemCollection.ComputerSystemCollection\",\n  \"@odata.id\": \"/redfish/v1/Systems\",\n  \"Name\": \"Computer System Collection\",\n  \"Members\": [{\"@odata.id\": \"/redfish/v1/Systems/1\"}]\n}\n[OK] Redfish HTTPS RESTful API (GET/POST/PATCH/DELETE) and iBMC Kbox/HWKbox verified.", "quiz_questions": [{"id": "h4_s3_q1", "type": "tf", "question": "(Official Ch.03 Quiz Q2) The baseboard management controller (BMC) complies with the Intelligent Platform Management Interface (IPMI) specification. It collects, processes, and stores sensor signals, and monitors the operating status of components.", "options": ["A. True", "B. False"], "answer": "A", "explanation": "True. This is the exact definition of the BMC in Ch.03 p.201 and Official Quiz Q2 on p.220."}, {"id": "h4_s3_q2", "type": "single", "question": "Which standard organization maintains the Redfish specification, and which four HTTP operations are registered by the Redfish service in iBMA/iBMC?", "options": ["A. IEEE; GET, PUT, CONNECT, TRACE", "B. DMTF; GET, POST, PATCH, DELETE", "C. IETF; SNMP-GET, SNMP-SET, TRAP, WALK", "D. NIST; SELECT, INSERT, UPDATE, DELETE"], "answer": "B", "explanation": "According to Ch.03 pp. 194 and 196, DMTF (www.dmtf.org) maintains Redfish, and the Redfish service provides GET, POST, PATCH, and DELETE operations over HTTPS."}, {"id": "h4_s3_q3", "type": "multiple", "question": "Which of the following are the four basic components of the Simple Network Management Protocol (SNMP) architecture?", "options": ["A. Network Management System (NMS)", "B. Agent process", "C. Managed Object (MO)", "D. Management Information Base (MIB)", "E. Serial Presence Detect (SPD)"], "answer": "ABCD", "explanation": "According to Ch.03 p.198, basic SNMP components include the NMS, agent process, managed object (MO), and management information base (MIB)."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-BIOS-vs-UEFI-and-Server-Operating-Systems", "exercise_slug": "08-Exercise-Linux-Root-Directory-Hierarchy-and-Boot-Flow-Lab", "lecture": {"title": "BIOS vs. UEFI Boot Flows, OS Kernel/Shell & Linux Directory Tree", "duration_mins": 8, "pdf_ref": "Ch.03, pp. 203–219", "objectives": ["Compare conventional BIOS and UEFI features and step-by-step boot processes", "Understand OS User Space vs. Kernel Space (Applications/Shell -> Function Libraries -> System Calls -> Kernel)", "Master Unix/Linux history (Multics, Unix, BSD, GNU, MINIX, Linux 1991, openEuler 2019), POSIX.1, and every standard Linux root directory (`/bin` to `/opt`)"], "content_markdown": "### 1. BIOS vs. UEFI Overview & Running Processes (pp. 204–206)\n- **BIOS (Basic Input/Output System, p. 204)**: Embedded firmware bridging the OS kernel and hardware layer. Core functions: **Hardware detection and initialization**, **OS boot**, and **Advanced power management** (plus software upgrade/loading, basic OAM, serial port management, fault recovery, ECC management, hardware diagnosis).\n- **UEFI (Unified Extensible Firmware Interface, p. 205)**: Defines a software interface between the OS and platform firmware as a modern alternative to legacy BIOS.\n  - **Six Key UEFI Features**: **Large drive capacity** (GPT >2\ TB), **High efficiency**, **64-bit system**, **Easy batch installation**, **Fast boot and recovery from hibernation**, and **Secure startup (Secure Boot)**.\n- **Running Processes Comparison (p. 206)**:\n  - **Conventional BIOS Process (6 steps)**: Power on & start device \\rightarrow CPU loads BIOS \\rightarrow Initialize hardware \\rightarrow Perform **POST** (Power-On Self-Test) & hardware self-check \\rightarrow Load boot options \\rightarrow Process system instructions.\n  - **UEFI Process (4 steps)**: Power on & start device \\rightarrow Initialize UEFI \\rightarrow Boot the OS \\rightarrow Enter the OS.\n\n---\n\n### 2. OS Architecture & Unix/Linux Evolution Timeline (pp. 208–218)\n- **OS Layered Architecture (p. 210)**:\n  - **User Space**: **Applications & Shells** (CLI command interpreter) \\rightarrow **Function Libraries** (encapsulate system calls for complex logic) \\rightarrow **System Calls** (kernel access interface).\n  - **Kernel Space**: **Kernel** (manages CPU, memory, file system, processes, and device drivers).\n- **Unix & Linux Historical Timeline (pp. 214, 217)**:\n  - **1964**: Multics released \\rightarrow **1969**: First Unix \\rightarrow **1973**: C-based Unix v3 \\rightarrow **1977**: BSD \\rightarrow **1979**: Unix System V7 \\rightarrow **Sept 27, 1983 / 1984**: **Richard Stallman** announced **GNU Project** (*\"GNU's Not Unix\"*) \\rightarrow **1987**: **MINIX** (educational Unix-like OS) \\rightarrow **Sept/Oct 5, 1991**: **Linus Torvalds** (Univ. of Helsinki) released the first **Linux kernel** (10,000 lines of code) \\rightarrow **1993**: Slackware/Debian \\rightarrow **1994**: Red Hat/SUSE 1.0 \\rightarrow **2004**: Ubuntu \\rightarrow **2019**: **EulerOS open-sourced as openEuler**.\n- **Linux Core Features (p. 218)**: Multi-platform, Multi-user & multitasking, Free/open-source (**GPL**), **Fully compatible with POSIX.1** (**IEEE 1003 / ISO/IEC 9945**), and **\"Everything is a file\"** (files, directories, character/block devices, sockets, printers, processes, pipes accessed via `fopen()`, `fclose()`, `fwrite()`, `fread()`).\n\n---\n\n### 3. Linux File Directory Structure (`/`, p. 219)\n| Directory | Official Function in HCIA-Computing (p. 219) |\n| :--- | :--- |\n| **`/bin`** | Short for **binary**; stores frequently used binary programs/commands used by all users. |\n| **`/boot`** | Stores core files used for **starting (booting) the Linux OS**, including connection files and kernel image files. |\n| **`/dev`** | Short for **device**; stores **peripheral device files** of Linux. |\n| **`/etc`** | Stores all **configuration files** and subdirectories required for system management. |\n| **`/lib` & `/lib64`** | Stores the system's most basic **dynamic link libraries (DLLs / shared libraries)** (32-bit and 64-bit). |\n| **`/media`** | Removable media devices (USB flash drives, CD-ROMs) **automatically identified and mounted** by Linux. |\n| **`/mnt`** | **Temporary mount point** for manual mounting of other file systems (e.g., mounting CD-ROM to `/mnt`). |\n| **`/opt`** | Stores **additional third-party application software** installed on the host (e.g., Oracle installation packages); empty by default. |", "key_takeaways": ["UEFI supports large drive capacity (>2 TB via GPT), 64-bit systems, fast boot, and secure startup, streamlining the 6-step legacy BIOS boot flow into 4 steps.", "OS call hierarchy from top to bottom: Applications & Shells -> Function Libraries -> System Calls -> Kernel -> Hardware.", "POSIX is IEEE 1003 / ISO/IEC 9945; GNU stands for 'GNU's Not Unix' (Richard Stallman, 1983); Linus Torvalds released Linux in 1991; EulerOS was open-sourced as openEuler in 2019.", "Know the exact Linux directories: /bin (binaries), /boot (boot loader/images), /dev (devices), /etc (config files), /lib & /lib64 (shared libraries), /media (auto-mounted removable media), /mnt (temporary manual mount point), /opt (additional application software)."], "exam_traps": ["EXAM TRAP: Do not confuse `/media` (where Linux AUTOMATICALLY identifies and mounts removable USB/CD-ROM devices) with `/mnt` (TEMPORARY mount point used by administrators for manual mounting)!", "EXAM TRAP: Unix is commercial closed-source software (AIX, HP-UX, Solaris) usually bound to specific hardware, whereas Linux is open-source (GPL) and runs across diverse hardware platforms."], "content_html": "<h3>1. BIOS vs. UEFI Overview &amp; Running Processes (pp. 204–206)<\/h3>\n<ul class=\"md-list\">\n<li><strong>BIOS (Basic Input/Output System, p. 204)<\/strong>: Embedded firmware bridging the OS kernel and hardware layer. Core functions: <strong>Hardware detection and initialization<\/strong>, <strong>OS boot<\/strong>, and <strong>Advanced power management<\/strong> (plus software upgrade/loading, basic OAM, serial port management, fault recovery, ECC management, hardware diagnosis).<\/li>\n<li><strong>UEFI (Unified Extensible Firmware Interface, p. 205)<\/strong>: Defines a software interface between the OS and platform firmware as a modern alternative to legacy BIOS.<\/li>\n<li><strong>Six Key UEFI Features<\/strong>: <strong>Large drive capacity<\/strong> (GPT &gt;2\ TB), <strong>High efficiency<\/strong>, <strong>64-bit system<\/strong>, <strong>Easy batch installation<\/strong>, <strong>Fast boot and recovery from hibernation<\/strong>, and <strong>Secure startup (Secure Boot)<\/strong>.<\/li>\n<li><strong>Running Processes Comparison (p. 206)<\/strong>:<\/li>\n<li><strong>Conventional BIOS Process (6 steps)<\/strong>: Power on &amp; start device \\rightarrow CPU loads BIOS \\rightarrow Initialize hardware \\rightarrow Perform <strong>POST<\/strong> (Power-On Self-Test) &amp; hardware self-check \\rightarrow Load boot options \\rightarrow Process system instructions.<\/li>\n<li><strong>UEFI Process (4 steps)<\/strong>: Power on &amp; start device \\rightarrow Initialize UEFI \\rightarrow Boot the OS \\rightarrow Enter the OS.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. OS Architecture &amp; Unix/Linux Evolution Timeline (pp. 208–218)<\/h3>\n<ul class=\"md-list\">\n<li><strong>OS Layered Architecture (p. 210)<\/strong>:<\/li>\n<li><strong>User Space<\/strong>: <strong>Applications &amp; Shells<\/strong> (CLI command interpreter) \\rightarrow <strong>Function Libraries<\/strong> (encapsulate system calls for complex logic) \\rightarrow <strong>System Calls<\/strong> (kernel access interface).<\/li>\n<li><strong>Kernel Space<\/strong>: <strong>Kernel<\/strong> (manages CPU, memory, file system, processes, and device drivers).<\/li>\n<li><strong>Unix &amp; Linux Historical Timeline (pp. 214, 217)<\/strong>:<\/li>\n<li><strong>1964<\/strong>: Multics released \\rightarrow <strong>1969<\/strong>: First Unix \\rightarrow <strong>1973<\/strong>: C-based Unix v3 \\rightarrow <strong>1977<\/strong>: BSD \\rightarrow <strong>1979<\/strong>: Unix System V7 \\rightarrow <strong>Sept 27, 1983 / 1984<\/strong>: <strong>Richard Stallman<\/strong> announced <strong>GNU Project<\/strong> (<em>\"GNU's Not Unix\"<\/em>) \\rightarrow <strong>1987<\/strong>: <strong>MINIX<\/strong> (educational Unix-like OS) \\rightarrow <strong>Sept/Oct 5, 1991<\/strong>: <strong>Linus Torvalds<\/strong> (Univ. of Helsinki) released the first <strong>Linux kernel<\/strong> (10,000 lines of code) \\rightarrow <strong>1993<\/strong>: Slackware/Debian \\rightarrow <strong>1994<\/strong>: Red Hat/SUSE 1.0 \\rightarrow <strong>2004<\/strong>: Ubuntu \\rightarrow <strong>2019<\/strong>: <strong>EulerOS open-sourced as openEuler<\/strong>.<\/li>\n<li><strong>Linux Core Features (p. 218)<\/strong>: Multi-platform, Multi-user &amp; multitasking, Free/open-source (<strong>GPL<\/strong>), <strong>Fully compatible with POSIX.1<\/strong> (<strong>IEEE 1003 / ISO/IEC 9945<\/strong>), and <strong>\"Everything is a file\"<\/strong> (files, directories, character/block devices, sockets, printers, processes, pipes accessed via <code class=\"inline-code\">fopen()<\/code>, <code class=\"inline-code\">fclose()<\/code>, <code class=\"inline-code\">fwrite()<\/code>, <code class=\"inline-code\">fread()<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Linux File Directory Structure (<code class=\"inline-code\">/<\/code>, p. 219)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Directory<\/th><th>Official Function in HCIA-Computing (p. 219)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">/bin<\/code><\/strong><\/td><td>Short f
