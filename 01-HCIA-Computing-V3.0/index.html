trong> (deletion, marking as read) with the mail server so status is consistent across webmail and clients.<\/li>\n<li><strong>Two Working Modes of a Postfix Email System (p. 341)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Local Linux users<\/strong> (<code class=\"inline-code\">root@example.com<\/code>, limited by allowed number of OS users).<\/li>\n<li><strong>Virtual users<\/strong> (not associated with real Linux users; each has separate drive space; overcomes OS user count limits, enhances security, suitable for multi-user scenarios).<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: Deploying FTP-Based Private Yum Repo & Postfix/Dovecot Mail Stack", "duration_mins": 8, "exercise_type": "terminal", "prompt_label": "root@openeuler-services:~#", "scenario": "Configure an FTP-based private Yum repository using `vsftpd` on openEuler 22.03 LTS and verify the Postfix (SMTP) and Dovecot (POP3/IMAP) mail server protocol bindings.", "instructions": ["Enable and start the `vsftpd` service using `systemctl enable --now vsftpd`.", "Set `FTP_JAIL_TECH` to `'chroot'`, `MTA_SMTP_SERVER` to `'Postfix'`, and `MDA_POP3_IMAP_SERVER` to `'Dovecot'`.", "Set `HEADER_ON_DEMAND_SYNC_PROTOCOL` to `'IMAP'`."], "starter_code": "# 1. Enable and start the vsftpd service:\nsystemctl enable --now ___\n\n# 2. Verify FTP chroot and Mail Server protocol roles:\nFTP_JAIL_TECH=\"___\"\nFTP_LOG_DIR=\"/var/log/\"\nMTA_SMTP_SERVER=\"___\"\nMDA_POP3_IMAP_SERVER=\"___\"\nHEADER_ON_DEMAND_SYNC_PROTOCOL=\"___\"\n", "solution_code": "# 1. Enable and start the vsftpd service:\nsystemctl enable --now vsftpd\n\n# 2. Verify FTP chroot and Mail Server protocol roles:\nFTP_JAIL_TECH=\"chroot\"\nFTP_LOG_DIR=\"/var/log/\"\nMTA_SMTP_SERVER=\"Postfix\"\nMDA_POP3_IMAP_SERVER=\"Dovecot\"\nHEADER_ON_DEMAND_SYNC_PROTOCOL=\"IMAP\"\n", "hints": ["The FTP daemon is `vsftpd` and its directory restriction mechanism is `chroot`.", "Postfix provides SMTP, Dovecot provides POP3 and IMAP, and IMAP fetches subjects first and synchronizes status."], "validation_checks": [{"step": 1, "description": "Enable and start vsftpd and specify chroot restriction", "required_any": ["vsftpd", "chroot"], "feedback_fail": "Make sure `vsftpd` and `chroot` are specified."}, {"step": 2, "description": "Specify Postfix for SMTP and Dovecot for POP3/IMAP", "required_any": ["postfix", "dovecot"], "feedback_fail": "Set MTA_SMTP_SERVER='Postfix' and MDA_POP3_IMAP_SERVER='Dovecot'."}, {"step": 3, "description": "Identify IMAP as the protocol that fetches headers first and syncs state", "required_any": ["imap"], "feedback_fail": "Set HEADER_ON_DEMAND_SYNC_PROTOCOL='IMAP'."}], "simulated_output": "Created symlink /etc/systemd/system/multi-user.target.wants/vsftpd.service -> /usr/lib/systemd/system/vsftpd.service.\n[OK] vsftpd (chroot, anonymous read-only Yum repo) and Postfix (SMTP) + Dovecot (POP3/IMAP) verified.", "quiz_questions": [{"id": "h7_s3_q1", "type": "single", "question": "In an FTP server (`vsftpd`), what is the restricted environment called that confines a logged-in FTP user to their home directory and prevents access to sensitive system directories like `/etc` and `/usr/local`?", "options": ["A. SELinux enforcing mode", "B. changed root (chroot)", "C. syslogd", "D. JBOD passthrough"], "answer": "B", "explanation": "According to Ch.05 pp. 337–338, restricting an FTP user to their home directory is called a changed root, or chroot for short."}, {"id": "h7_s3_q2", "type": "single", "question": "In a Linux mail server built with the Postfix + Dovecot combination, which protocols do Postfix and Dovecot provide, respectively, and how does IMAP differ from POP3?", "options": ["A. Postfix provides POP3/IMAP; Dovecot provides SMTP; POP3 syncs actions on the server", "B. Postfix provides SMTP; Dovecot provides POP3 and IMAP; IMAP fetches key details (like subjects) first, downloads full content on demand, and synchronizes read/delete status on the server", "C. Both Postfix and Dovecot only provide FTP and HTTP protocols", "D. Postfix provides SNMP; Dovecot provides Redfish"], "answer": "B", "explanation": "According to Ch.05 pp. 340 and 342, Postfix provides SMTP (for sending/relaying), while Dovecot provides POP3 and IMAP. POP3 downloads entire emails and disconnects, whereas IMAP fetches subjects first, downloads on demand, and mirrors read/delete actions on the server."}, {"id": "h7_s3_q3", "type": "multiple", "question": "Which of the following are valid steps in deploying an FTP-based private Yum repository on openEuler (Ch.05, p. 339)?", "options": ["A. Create a Yum repository on the local host and install/enable the FTP service upon system startup.", "B. Modify the vsftpd configuration file to allow anonymous access and disable write permissions.", "C. Disable the firewall and SELinux.", "D. Set automatic mounting and test the FTP service."], "answer": "ABCD", "explanation": "All four options match the exact 6-step procedure on Ch.05 p.339 for deploying an FTP-based private Yum repository."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-Deploying-openGauss-Database-on-TaiShan-openEuler", "exercise_slug": "08-Exercise-openGauss-XML-gs-preinstall-and-gs-install-Lab", "lecture": {"title": "Deploying openGauss Database on TaiShan / openEuler", "duration_mins": 8, "pdf_ref": "Ch.05, pp. 343–349", "objectives": ["Compare openGauss Standalone deployment vs. HA deployment (1 primary + 1 to 8 standby servers)", "Understand when to use the installation script vs. CLI commands for single vs. multiple instances", "Master the exact 8-step openGauss installation workflow (`XML` config, `gs_preinstall`, `gs_install`, standby readable)"], "content_markdown": "### 1. openGauss Deployment Modes: Standalone vs. HA (p. 344)\nopenGauss supports two deployment modes on openEuler / TaiShan servers:\n1. **Standalone Deployment**:\n   - One or multiple database instances are deployed on a **single host**.\n   - **Not recommended** for production due to **data loss risks** if the single host fails.\n   - **Script vs. CLI Rule (p. 344)**: openGauss provides a **script** for deploying **one database instance** on a single server, whereas **CLI commands are recommended** if you need to deploy **multiple database instances** on a single server.\n2. **HA (High Availability) Deployment**:\n   - Deploys **one primary server** and **at least one (up to eight) standby servers** (`1 Primary + 1..8 Standby`).\n\n---\n\n### 2. Eight-Step openGauss Installation & Deployment Procedure (p. 345)\nLook closely at the official flowchart and step descriptions on **Ch.05 Page 345**:\n1. **Preparing for the installation**: Prepare the hardware and software environments (OS parameters, dependencies, firewall/SELinux).\n2. **Obtaining and verifying the software package**: Download the openGauss installation package from the official website and verify its integrity.\n3. **Configuring the XML file**: Create the cluster configuration **XML file**, which specifies the **server information, installation path, IP address, and port** where openGauss will be deployed.\n4. **Uploading the software package and XML file**: Upload both to the target server(s).\n5. **Decompressing the software package**: Extract the installation tarball.\n6. **Initializing the installation environment (`gs_preinstall`)**: Run the **`gs_preinstall`** command (as `root`) to prepare and initialize the OS installation environment based on the XML file.\n7. **Performing the installation (`gs_install`)**: Switch to the database O&M user (e.g., `omm`) and run the **`gs_install`** command with the XML file to install openGauss.\n8. **(Optional) Setting the standby node to readable**: Configure the standby node to be readable to meet read-scalability and data consistency requirements.", "key_takeaways": ["openGauss supports Standalone deployment (not recommended due to data loss risk; use script for 1 instance, CLI commands for multiple instances on 1 server) and HA deployment (1 primary + 1 to 8 standby servers).", "The openGauss XML configuration file defines the server hostname/IP address, installation path, and database port.", "Use `gs_preinstall` to initialize the installation environment, and then use `gs_install` to perform the actual database installation."], "exam_traps": ["EXAM TRAP: In openGauss HA deployment, a single primary server supports at least 1 and UP TO 8 standby servers (p. 344)!", "EXAM TRAP: Do not reverse `gs_preinstall` and `gs_install`: `gs_preinstall` initializes the installation environment BEFORE `gs_install` installs openGauss!"], "content_html": "<h3>1. openGauss Deployment Modes: Standalone vs. HA (p. 344)<\/h3>\n<p>openGauss supports two deployment modes on openEuler / TaiShan servers:<\/p>\n<ol class=\"md-list\">\n<li><strong>Standalone Deployment<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>One or multiple database instances are deployed on a <strong>single host<\/strong>.<\/li>\n<li><strong>Not recommended<\/strong> for production due to <strong>data loss risks<\/strong> if the single host fails.<\/li>\n<li><strong>Script vs. CLI Rule (p. 344)<\/strong>: openGauss provides a <strong>script<\/strong> for deploying <strong>one database instance<\/strong> on a single server, whereas <strong>CLI commands are recommended<\/strong> if you need to deploy <strong>multiple database instances<\/strong> on a single server.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>HA (High Availability) Deployment<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Deploys <strong>one primary server<\/strong> and <strong>at least one (up to eight) standby servers<\/strong> (<code class=\"inline-code\">1 Primary + 1..8 Standby<\/code>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Eight-Step openGauss Installation &amp; Deployment Procedure (p. 345)<\/h3>\n<p>Look closely at the official flowchart and step descriptions on <strong>Ch.05 Page 345<\/strong>:<\/p>\n<ol class=\"md-list\">\n<li><strong>Preparing for the installation<\/strong>: Prepare the hardware and software environments (OS parameters, dependencies, firewall/SELinux).<\/li>\n<li><strong>Obtaining and verifying the software package<\/strong>: Download the openGauss installation package from the official website and verify its integrity.<\/li>\n<li><strong>Configuring the XML file<\/strong>: Create the cluster configuration <strong>XML file<\/strong>, which specifies the <strong>server information, installation path, IP address, and port<\/strong> where openGauss will be deployed.<\/li>\n<li><strong>Uploading the software package and XML file<\/strong>: Upload both to the target server(s).<\/li>\n<li><strong>Decompressing the software package<\/strong>: Extract the installation tarball.<\/li>\n<li><strong>Initializing the installation environment (<code class=\"inline-code\">gs_preinstall<\/code>)<\/strong>: Run the <strong><code class=\"inline-code\">gs_preinstall<\/code><\/strong> command (as <code class=\"inline-code\">root<\/code>) to prepare and initialize the OS installation environment based on the XML file.<\/li>\n<li><strong>Performing the installation (<code class=\"inline-code\">gs_install<\/code>)<\/strong>: Switch to the database O&amp;M user (e.g., <code class=\"inline-code\">omm<\/code>) and run the <strong><code class=\"inline-code\">gs_install<\/code><\/strong> command with the XML file to install openGauss.<\/li>\n<li><strong>(Optional) Setting the standby node to readable<\/strong>: Configure the standby node to be readable to meet read-scalability and data consistency requirements.<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: openGauss HA Cluster Pre-Install & Installation Commands", "duration_mins": 8, "exercise_type": "terminal", "prompt_label": "root@taishan-db:~#", "scenario": "You are deploying an openGauss HA cluster on TaiShan 200 servers running openEuler 22.03 LTS using an XML configuration file (`/opt/software/openGauss/cluster_config.xml`). Complete the deployment commands and HA limits.", "instructions": ["Use `gs_preinstall` to initialize the installation environment with `-U omm -G dbgrp -X /opt/software/openGauss/cluster_config.xml`.", "Use `gs_install` (as user `omm`) to install openGauss with `-X /opt/software/openGauss/cluster_config.xml`.", "Set `MAX_HA_STANDBY_SERVERS` to `8`."], "starter_code": "# 1. Initialize the openGauss installation environment (as root):\n/opt/software/openGauss/script/___ -U omm -G dbgrp -X /opt/software/openGauss/cluster_config.xml\n\n# 2. Switch to omm and perform the openGauss installation:\nsu - omm -c \"___ -X /opt/software/openGauss/cluster_config.xml\"\n\n# 3. Verify maximum number of standby servers in HA mode:\nMAX_HA_STANDBY_SERVERS=___\n", "solution_code": "# 1. Initialize the openGauss installation environment (as root):\n/opt/software/openGauss/script/gs_preinstall -U omm -G dbgrp -X /opt/software/openGauss/cluster_config.xml\n\n# 2. Switch to omm and perform the openGauss installation:\nsu - omm -c \"gs_install -X /opt/software/openGauss/cluster_config.xml\"\n\n# 3. Verify maximum number of standby servers in HA mode:\nMAX_HA_STANDBY_SERVERS=8\n", "hints": ["`gs_preinstall` prepares and initializes the installation environment; `gs_install` performs the installation.", "In HA deployment (Ch.05, p.344), one primary server and at least 1 (up to 8) standby servers are deployed."], "validation_checks": [{"step": 1, "description": "Use gs_preinstall to initialize the installation environment", "required_any": ["gs_preinstall"], "feedback_fail": "Use `gs_preinstall` in step 1."}, {"step": 2, "description": "Use gs_install to perform the openGauss installation", "required_any": ["gs_install"], "feedback_fail": "Use `gs_install` in step 2."}, {"step": 3, "description": "Verify that HA deployment supports up to 8 standby servers", "required_any": ["8"], "feedback_fail": "Set MAX_HA_STANDBY_SERVERS=8."}], "simulated_output": "Parsing the configuration file.\nSuccessfully checked OSivo status.\nPreinstallation succeeded.\nInstalling the database...\nSuccessfully started cluster.\nSuccessfully installed application.\n[OK] openGauss HA cluster deployed (gs_preinstall -> gs_install, supports 1 primary + up to 8 standby nodes).", "quiz_questions": [{"id": "h7_s4_q1", "type": "single", "question": "During openGauss installation on openEuler (Ch.05, p. 345), which command is used to initialize and prepare the installation environment after decompressing the software package, and which command performs the actual installation?", "options": ["A. gs_initdb (initialize environment) and gs_ctl (install)", "B. gs_preinstall (initialize environment) and gs_install (install)", "C. yum install (initialize environment) and rpm -ivh (install)", "D. gsql (initialize environment) and gs_om (install)"], "answer": "B", "explanation": "According to Ch.05 p.345, you use the `gs_preinstall` command to prepare/initialize the installation environment, and then use the `gs_install` command to install openGauss."}, {"id": "h7_s4_q2", "type": "single", "question": "In openGauss High Availability (HA) deployment mode, how many primary and standby servers can be deployed?", "options": ["A. Two primary servers and no standby servers", "B. One primary server and at least one (up to eight) standby servers", "C. One primary server and at most one standby server", "D. Up to 64 primary servers in a peer-to-peer ring"], "answer": "B", "explanation": "According to Ch.05 p.344, in HA deployment, one primary server and at least one (up to eight) standby servers are deployed."}, {"id": "h7_s4_q3", "type": "multiple", "question": "Which of the following statements about openGauss deployment modes and configuration files are true?", "options": ["A. Standalone deployment is not recommended for production due to data loss risks.", "B. openGauss provides a script for deploying one database instance on a single server, while CLI commands are recommended if you need to deploy multiple database instances on a single server.", "C. The XML configuration file contains information about the server where openGauss will be deployed, including the installation path, IP address, and port.", "D. Setting the standby node to readable is an optional post-installation step to meet data consistency and read requirements."], "answer": "ABCD", "explanation": "All four statements come directly from Ch.05 pp. 344–345."}]}}]}, {"hour_number": 8, "folder_name": "Hour-08-Basic-OM-of-Computing-Products", "title": "Basic O&M of Computing Products: iBMA, iBMC, Smart Provisioning, FusionDirector, eSight, SmartKit & eService", "chapter_ref": "Chapter 06 (pp. 351–443)", "duration_mins": 60, "overview": "Master the complete Huawei Computing O&M ecosystem: O&M evolution (Manual/Scripts -> Tools -> Automation -> Intelligence), In-band (iBMA + BOB) vs. Out-of-band (iBMC + Smart Provisioning) single-node management, Centralized management via FusionDirector (5 Intelligent Features) and eSight (IF1–IF5 interfaces & batch specs), Local O&M via SmartKit, and Remote O&M via eService (Call Home).", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-Computing-OM-Architecture-iBMA-iBMC-and-Smart-Provisioning", "exercise_slug": "02-Exercise-Single-Node-OM-iBMA-BOB-and-Smart-Provisioning-Lab", "lecture": {"title": "Computing O&M Architecture & Single-Node Management (iBMA, iBMC, Smart Provisioning)", "duration_mins": 8, "pdf_ref": "Ch.06, pp. 354–376", "objectives": ["Map each Huawei O&M tool to its exact target scenario and persona (iBMC, iBMA, Smart Provisioning, SmartKit, FusionDirector, eSight, CCManager, eService)", "Distinguish In-Band Management (iBMA + BOB `bobCmd`) from Out-of-Band Management (iBMC on Hi1710/Hi1711 RTOS)", "Master all 6 functions of Smart Provisioning (OS installation, RAID config, Upgrade, Hardware diagnosis, Log collection, Fast vs. Secure Drive erasure)"], "content_markdown": "### 1. Evolution & Overall Architecture of Huawei Computing O&M Software (pp. 355–358)\n- **Four Evolution Phases of O&M Software (p. 355)**:\n  `Manual configuration + Scripts` \\rightarrow `Tools` \\rightarrow `Automation` \\rightarrow `Intelligence` (Note: Intelligence is the ultimate goal, **but the tool-based and automated phases CANNOT be skipped**!).\n\n| Huawei O&M Product | Positioning & Target Scenario / Customer (pp. 356–358) |\n| :--- | :--- |\n| **iBMC** | **Single-node out-of-band** onboard management controller (basis of all computing O&M; runs on **Hi1710/Hi1711** Arm chip + RTOS + PME). |\n| **iBMA 2.0** | **Single-node in-band** management agent running on the host OS; communicates with iBMC via **vNIC** and **BOB**. |\n| **Smart Provisioning (SP)** | **Single-node out-of-band extension** of iBMC running a diskless mini-system from iBMC flash in service memory (no CD-ROM needed). |\n| **SmartKit** | **Local O&M batch toolbox** installed on **service engineers' laptops** for onsite delivery, maintenance, upgrade, and troubleshooting. |\n| **FusionDirector** | **Centralized management platform** for **enterprise customers** (routine server monitoring, batch O&M, and 5 Intelligent Features). |\n| **eSight** | **Cross-domain centralized ICT management** for **large-sized customers / carriers** (manages servers, storage, switches, routers, firewalls, WLAN, PON, cameras). |\n| **CCManager** | **Cross-stack and cross-domain** management for **data centers**. |\n| **eService** | **24/7 Remote O&M platform** for **long-tail customers** (small device counts, unwilling to invest in dedicated O&M; provides **Call Home**). |\n| **HMM / IES** | **HMM** (*Hyper Management Module* for X6800/E9000 chassis power/fan/IPMI 2.0); **IES** (*Intelligent Edge System* for Atlas 500 edge station). |\n\n---\n\n### 2. Single-Node In-Band (`iBMA`) vs. Out-of-Band (`iBMC`) Management (pp. 359–370)\n- **In-Band vs. Out-of-Band Definition (p. 359)**: **In-band management** transmits both network management control info and user carrier service traffic through a **single logical channel**; **Out-of-band management** uses **separate dedicated channels** for each.\n- **iBMA & BOB Forwarding Modes (pp. 360–361)**:\n  - **Two Data Transmission Paths**: (1) `iBMA --> vNIC --> iBMC --> 3rd-party tool`, or (2) `iBMA --> vNIC --> iBMC --> vNIC --> BOB --> 3rd-party tool`.\n  - **BOB (*BMC Out-of-Band*)**: Forwarding tool enabling a remote host on the in-band network to communicate with the local iBMC (via SSH, IPMI, HTTPS, SNMP traps). Managed via **`bobCmd`** CLI (persistent online configuration, does not support independent deployment).\n  - **Key iBMA Functions (p. 361)**: System info (OS, NIC, IB, drive, RAID), file upload & driver/software upgrade via Redfish, iBMC event dump to OS logs, NIC config tracing (`log/ethtool_log`), Mellanox NIC internal error detection (`log/common.log`), storage diagnosis (Sense Code, MD SoftRAID), **Memory soft isolation** of faulty physical memory pages via Redfish, and **black box**.\n- **iBMC Six WebUI Menus (pp. 363–370)**: **Home**, **System Info**, **Maintenance** (alarms, video/screenshots, PCIe/black box/serial logs, iBMC logs), **User & Security** (Local users, LDAP, Kerberos, 2FA, SSL), **Services** (Port, Web, KVM, Virtual Media, VNC, SNMP), and **iBMC Settings** (Firmware upgrade, Network, iBMA, Smart Provisioning). *Note: Deploying an OS through Redfish requires an **iBMC Advanced Edition license** (p. 364)!*\n\n---\n\n### 3. Smart Provisioning (SP) Six Functions (pp. 371–376)\n1. **OS Installation**: UEFI mode; **Recommended** and **Customized** methods for CentOS, EulerOS, openEuler, Ubuntu, SLES, RHEL, Kylin, UOS, BC-Linux, Debian, Windows, VMware.\n2. **RAID Configuration**: Hardware RAID (LSI SAS3008/3108, Avago SAS3408/3508/3416, MegaRAID 9440/9460/9560) and **Software RAID**.\n3. **Upgrade**: Upgrades **in-band firmware** (**PCIe card firmware** such as RAID/NIC cards and **SAS/SATA/NVMe drive firmware**) plus **Smart Provisioning firmware**.\n4. **Toolbox — Hardware Diagnosis**: Diagnoses **processors (CPU), memory, drives, and NICs**.\n5. **Toolbox — Log Collection**: Drive low-level logs (Toshiba/HGST), system logs, and Smart Provisioning logs.\n6. **Toolbox — Drive Erasure**:\n   - **Fast mode**: Erases **partitions of a logical drive**.\n   - **Secure mode**: Erases **all data on a physical drive**.", "key_takeaways": ["In-band management shares a single logical channel with user service traffic (iBMA + BOB); out-of-band management uses a dedicated management channel (iBMC + Smart Provisioning).", "iBMA provides two transmission paths (`iBMA->vNIC->iBMC->3rd` and `iBMA->vNIC->iBMC->vNIC->BOB->3rd`), uses `bobCmd` for BOB CLI, traces ethtool in `log/ethtool_log`, and supports soft isolation of faulty physical memory pages over Redfish.", "Deploying an OS via Redfish requires the iBMC Advanced Edition license.", "Smart Provisioning runs a small system in service memory from iBMC flash and provides 6 functions: OS installation (UEFI only), RAID configuration, Firmware upgrade (PCIe cards, drives, SP), Hardware diagnosis (CPU, memory, drive, NIC), Log collection, and Drive erasure (Fast = logical drive partitions; Secure = all data on physical drive)."], "exam_traps": ["EXAM TRAP: In Smart Provisioning Drive Erasure (p. 376), 'Fast mode' erases partitions of a LOGICAL drive, whereas 'Secure mode' erases all data on a PHYSICAL drive!", "EXAM TRAP: Smart Provisioning only supports OS installation in UEFI mode (not Legacy BIOS MBR mode) (p. 373)."], "content_html": "<h3>1. Evolution &amp; Overall Architecture of Huawei Computing O&amp;M Software (pp. 355–358)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Four Evolution Phases of O&amp;M Software (p. 355)<\/strong>:<\/li>\n<\/ul>\n<p><code class=\"inline-code\">Manual configuration + Scripts<\/code> \\rightarrow <code class=\"inline-code\">Tools<\/code> \\rightarrow <code class=\"inline-code\">Automation<\/code> \\rightarrow <code class=\"inline-code\">Intelligence<\/code> (Note: Intelligence is the ultimate goal, <strong>but the tool-based and automated phases CANNOT be skipped<\/strong>!).<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Huawei O&amp;M Product<\/th><th>Positioning &amp; Target Scenario / Customer (pp. 356–358)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>iBMC<\/strong><\/td><td><strong>Single-node out-of-band<\/strong> onboard management controller (basis of all computing O&amp;M; runs on <strong>Hi1710/Hi1711<\/strong> Arm chip + RTOS + PME).<\/td><\/tr>\n<tr><td><strong>iBMA 2.0<\/strong><\/td><td><strong>Single-node in-band<\/strong> management agent running on the host OS; communicates with iBMC via <strong>vNIC<\/strong> and <strong>BOB<\/strong>.<\/td><\/tr>\n<tr><td><strong>Smart Provisioning (SP)<\/strong><\/td><td><strong>Single-node out-of-band extension<\/strong> of iBMC running a diskless mini-system from iBMC flash in service memory (no CD-ROM needed).<\/td><\/tr>\n<tr><td><strong>SmartKit<\/strong><\/td><td><strong>Local O&amp;M batch toolbox<\/strong> installed on <strong>service engineers' laptops<\/strong> for onsite delivery, maintenance, upgrade, and troubleshooting.<\/td><\/tr>\n<tr><td><strong>FusionDirector<\/strong><\/td><td><strong>Centralized management platform<\/strong> for <strong>enterprise customers<\/strong> (routine server monitoring, batch O&amp;M, and 5 Intelligent Features).<\/td><\/tr>\n<tr><td><strong>eSight<\/strong><\/td><td><strong>Cross-domain centralized ICT management<\/strong> for <strong>large-sized customers / carriers<\/strong> (manages servers, storage, switches, routers, firewalls, WLAN, PON, cameras).<\/td><\/tr>\n<tr><td><strong>CCManager<\/strong><\/td><td><strong>Cross-stack and cross-domain<\/strong> management for <strong>data centers<\/strong>.<\/td><\/tr>\n<tr><td><strong>eService<\/strong><\/td><td><strong>24/7 Remote O&amp;M platform<\/strong> for <strong>long-tail customers<\/strong> (small device counts, unwilling to invest in dedicated O&amp;M; provides <strong>Call Home<\/strong>).<\/td><\/tr>\n<tr><td><strong>HMM / IES<\/strong><\/td><td><strong>HMM<\/strong> (<em>Hyper Management Module<\/em> for X6800/E9000 chassis power/fan/IPMI 2.0); <strong>IES<\/strong> (<em>Intelligent Edge System<\/em> for Atlas 500 edge station).<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Single-Node In-Band (<code class=\"inline-code\">iBMA<\/code>) vs. Out-of-Band (<code class=\"inline-code\">iBMC<\/code>) Management (pp. 359–370)<\/h3>\n<ul class=\"md-list\">\n<li><strong>In-Band vs. Out-of-Band Definition (p. 359)<\/strong>: <strong>In-band management<\/strong> transmits both network management control info and user carrier service traffic through a <strong>single logical channel<\/strong>; <strong>Out-of-band management<\/strong> uses <strong>separate dedicated channels<\/strong> for each.<\/li>\n<li><strong>iBMA &amp; BOB Forwarding Modes (pp. 360–361)<\/strong>:<\/li>\n<li><strong>Two Data Transmission Paths<\/strong>: (1) <code class=\"inline-code\">iBMA --&gt; vNIC --&gt; iBMC --&gt; 3rd-party tool<\/code>, or (2) <code class=\"inline-code\">iBMA --&gt; vNIC --&gt; iBMC --&gt; vNIC --&gt; BOB --&gt; 3rd-party tool<\/code>.<\/li>\n<li>**BOB (<em>BMC Out-of-Band<\/em>)<strong>: Forwarding tool enabling a remote host on the in-band network to communicate with the local iBMC (via SSH, IPMI, HTTPS, SNMP traps). Managed via <\/strong><code class=\"inline-code\">bobCmd<\/code>** CLI (persistent online configuration, does not support independent deployment).<\/li>\n<li><strong>Key iBMA Functions (p. 361)<\/strong>: System info (OS, NIC, IB, drive, RAID), file upload &amp; driver/software upgrade via Redfish, iBMC event dump to OS logs, NIC config tracing (<code class=\"inline-code\">log/ethtool_log<\/code>), Mellanox NIC internal error detection (<code class=\"inline-code\">log/common.log<\/code>), storage diagnosis (Sense Code, MD SoftRAID), <strong>Memory soft isolation<\/strong> of faulty physical memory pages via Redfish, and <strong>black box<\/strong>.<\/li>\n<li><strong>iBMC Six WebUI Menus (pp. 363–370)<\/strong>: <strong>Home<\/strong>, <strong>System Info<\/strong>, <strong>Maintenance<\/strong> (alarms, video/screenshots, PCIe/black box/serial logs, iBMC logs), <strong>User &amp; Security<\/strong> (Local users, LDAP, Kerberos, 2FA, SSL), <strong>Services<\/strong> (Port, Web, KVM, Virtual Media, VNC, SNMP), and <strong>iBMC Settings<\/strong> (Firmware upgrade, Network, iBMA, Smart Provisioning). <em>Note: Deploying an OS through Redfish requires an <strong>iBMC Advanced Edition license<\/strong> (p. 364)!<\/em><\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Smart Provisioning (SP) Six Functions (pp. 371–376)<\/h3>\n<ol class=\"md-list\">\n<li><strong>OS Installation<\/strong>: UEFI mode; <strong>Recommended<\/strong> and <strong>Customized<\/strong> methods for CentOS, EulerOS, openEuler, Ubuntu, SLES, RHEL, Kylin, UOS, BC-Linux, Debian, Windows, VMware.<\/li>\n<li><strong>RAID Configuration<\/strong>: Hardware RAID (LSI SAS3008/3108, Avago SAS3408/3508/3416, MegaRAID 9440/9460/9560) and <strong>Software RAID<\/strong>.<\/li>\n<li><strong>Upgrade<\/strong>: Upgrades <strong>in-band firmware<\/strong> (<strong>PCIe card firmware<\/strong> such as RAID/NIC cards and <strong>SAS/SATA/NVMe drive firmware<\/strong>) plus <strong>Smart Provisioning firmware<\/strong>.<\/li>\n<li><strong>Toolbox — Hardware Diagnosis<\/strong>: Diagnoses <strong>processors (CPU), memory, drives, and NICs<\/strong>.<\/li>\n<li><strong>Toolbox — Log Collection<\/strong>: Drive low-level logs (Toshiba/HGST), system logs, and Smart Provisioning logs.<\/li>\n<li><strong>Toolbox — Drive Erasure<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Fast mode<\/strong>: Erases <strong>partitions of a logical drive<\/strong>.<\/li>\n<li><strong>Secure mode<\/strong>: Erases <strong>all data on a physical drive<\/strong>.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Single-Node O&M (iBMA, iBMC & Smart Provisioning) Configuration", "duration_mins": 7, "exercise_type": "config", "prompt_label": "om-eng@taishan-node:~#", "scenario": "Configure the single-node O&M mapping for iBMA, BOB, iBMC Advanced Edition, and Smart Provisioning toolbox operations.", "instructions": ["Set `bob_cli_command` to `'bobCmd'` and `redfish_os_deploy_license` to `'Advanced Edition'`.", "Set `sp_fast_erase_target` to `'partitions of a logical drive'` and `sp_secure_erase_target` to `'all data on a physical drive'`.", "Set `ibmc_arm_chip` to `'Hi1710'`."], "starter_code": "# Single-Node Management (iBMA, iBMC, Smart Provisioning)\nin_band_ibma:\n  bob_cli_command: \"___\"\n  nic_trace_dir: \"log/ethtool_log\"\n  mellanox_error_log: \"log/common.log\"\n\nout_of_band_ibmc_sp:\n  ibmc_arm_chip: \"___\"\n  redfish_os_deploy_license: \"___\"\n  sp_os_boot_mode: \"UEFI\"\n  sp_fast_erase_target: \"___\"\n  sp_secure_erase_target: \"___\"\n", "solution_code": "# Single-Node Management (iBMA, iBMC, Smart Provisioning)\nin_band_ibma:\n  bob_cli_command: \"bobCmd\"\n  nic_trace_dir: \"log/ethtool_log\"\n  mellanox_error_log: \"log/common.log\"\n\nout_of_band_ibmc_sp:\n  ibmc_arm_chip: \"Hi1710\"\n  redfish_os_deploy_license: \"Advanced Edition\"\n  sp_os_boot_mode: \"UEFI\"\n  sp_fast_erase_target: \"partitions of a logical drive\"\n  sp_secure_erase_target: \"all data on a physical drive\"\n", "hints": ["BOB provides the `bobCmd` CLI; Redfish OS deployment requires the iBMC Advanced Edition license.", "Smart Provisioning Fast erasure erases 'partitions of a logical drive', while Secure erasure erases 'all data on a physical drive'."], "validation_checks": [{"step": 1, "description": "Verify bobCmd CLI and Hi1710 iBMC chip", "required_any": ["bobcmd", "hi1710"], "feedback_fail": "Set bob_cli_command to 'bobCmd' and ibmc_arm_chip to 'Hi1710'."}, {"step": 2, "description": "Verify iBMC Advanced Edition license for Redfish OS deployment", "required_any": ["advanced"], "feedback_fail": "Set redfish_os_deploy_license to 'Advanced Edition'."}, {"step": 3, "description": "Verify Fast (logical drive) vs Secure (physical drive) erasure targets", "required_any": ["logical drive", "physical drive"], "feedback_fail": "Specify 'partitions of a logical drive' for Fast mode and 'all data on a physical drive' for Secure mode."}], "simulated_output": "[OK] Single-Node O&M Configuration Verified:\n- iBMA 2.0: In-band agent | BOB CLI: bobCmd | Memory Soft Isolation via Redfish\n- iBMC: Out-of-band (Hi1710/Hi1711 + RTOS + PME) | Advanced Edition License -> Redfish OS Deploy\n- Smart Provisioning: UEFI OS Install, RAID Config, Upgrade, Diagnosis, Logs, Drive Erasure (Fast=Logical, Secure=Physical).", "quiz_questions": [{"id": "h8_s1_q1", "type": "single", "question": "What is the technical difference between in-band management and out-of-band management in server O&M?", "options": ["A. In-band management transmits both management control information and user service traffic through a single logical channel, while out-of-band management uses separate channels for each.", "B. Out-of-band management shares the service NIC and OS kernel, while in-band management uses a dedicated physical management port.", "C. In-band management can operate when the server OS crashes or the server is powered off.", "D. Out-of-band management is implemented exclusively by iBMA without iBMC."], "answer": "A", "explanation": "According to Ch.06 pp. 359 and 362, in-band management transmits both network management control information and carrier service information through a single logical channel, whereas out-of-band management uses separate channels for each."}, {"id": "h8_s1_q2", "type": "single", "question": "In the Smart Provisioning Toolbox's Drive Erasure function (Ch.06, p. 376), what is the difference between 'Fast mode' and 'Secure mode'?", "options": ["A. Fast mode erases all data on a physical drive; Secure mode erases only the BIOS boot sector.", "B. Fast mode erases partitions of a logical drive; Secure mode erases all data on a physical drive.", "C. Fast mode formats only USB drives; Secure mode formats only CD-ROMs.", "D. There is no difference between Fast mode and Secure mode."], "answer": "B", "explanation": "According to Ch.06 p.376, Fast mode erases partitions of a logical drive, while Secure mode erases all data on a physical drive."}, {"id": "h8_s1_q3", "type": "multiple", "question": "Which of the following functions are supported by Huawei's in-band management agent iBMA 2.0 (Ch.06, p. 361)?", "options": ["A. Obtaining OS, NIC, IB card, drive, and RAID controller card information and reporting it to iBMC", "B. Allowing soft isolation over the Redfish interface to be performed on physical memory pages where the OS is faulty", "C. Dumping iBMC events to system log files on Linux/Windows and providing a black box function", "D. Forwarding in-band requests to the local iBMC via BOB (managed using the bobCmd CLI)"], "answer": "ABCD", "explanation": "All four functions are explicitly listed in the iBMA Functions table on Ch.06 pp. 360–361."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-Centralized-Management-FusionDirector-and-Five-Intelligent-Features", "exercise_slug": "04-Exercise-FusionDirector-Device-Adding-and-Intelligent-Features-Lab", "lecture": {"title": "Centralized Management: FusionDirector & Five Intelligent Features", "duration_mins": 8, "pdf_ref": "Ch.06, pp. 377–400", "objectives": ["Compare the 4 server adding modes in FusionDirector (Manual adding, Batch import, DHCP auto IP allocation, SSDP auto discovery) and log export limits (100 servers)", "Master the Five Intelligent Features of FusionDirector: Intelligent Deployment, Asset, Version, Fault, and Energy Efficiency Management", "Know exact FusionDirector rules and specifications (Server Profile edit/delete restrictions, 30 concurrent OS deployments, 2-hour timeout, Location vs. SN/MAC Auto Go-Online)"], "content_markdown": "### 1. FusionDirector Basic Features: 4 Device Adding Modes & Log Collection (pp. 378–381)\n**FusionDirector** is Huawei's centralized O&M platform for batch server management, communicating southbound with server **iBMCs** via **Redfish** and northbound with upper-layer OSS via **Web/Portal, Redfish, and SNMP**:\n- **Four Server Adding Modes (p. 379)**:\n  1. **Manual adding**: Fuzzy device adding when devices have **consecutive IP addresses** and the **same device accounts**.\n  2. **Batch import**: Accurate device adding via template when devices already have **IP addresses and accounts** configured.\n  3. **DHCP automatic IP address allocation**: Used when devices are in DHCP mode and **accounts, SNs, and MAC addresses** are known (*Restriction*: requires a **DHCP relay server** on the network).\n  4. **SSDP automatic discovery**: Uses **IP-SN mapping mode** (known SNs/accounts) or **IP resource pool allocation mode** (allocates random IPs when device info is unknown). (*Restriction*: **FusionDirector and the devices MUST be on the same Layer 2 (L2) network**!).\n- **One-Click Log Collection (p. 380)**: Exports logs of **a maximum of 100 servers at a time** in one-click mode.\n\n---\n\n### 2. FusionDirector's Five Intelligent Features (pp. 382–400)\n1. **Intelligent Deployment Management (pp. 383–385)**:\n   - **Server Profile (p. 383)**: Configures BIOS, RAID, BMC, NIC, and PCIe topology for a specific server model (Server + NIC + RAID card combination).\n     - *Rules*: Profile **binding is separated from application** (must **bind** before **applying**). You can **delete** a profile **only when it is NOT bound to any server**; you can **modify** a profile **only when it is NOT applied to any server**; backup profiles **cannot** be imported to a different or reinstalled FusionDirector!\n   - **OS Deployment (p. 384)**: Out-of-band deployment (no DHCP/TFTP/PXE required!), **requires servers with Smart Provisioning** and an **OS deployment license**, formats the system disk, has a **2-hour timeout**, and deploys **a maximum of 30 devices at the same time**.\n   - **Automatic Go-Online Planning (p. 385)**:\n     - *Location-based planning*: Uses **iRM** to obtain rack **U marks**.\n     - *SN/MAC-based planning*: Uses **DHCP** (must be in the same DHCP broadcast domain as FusionDirector).\n     - *Mutual Exclusion Rule*: Enabling **location planning automatically disables SN/MAC planning**, and vice versa!\n2. **Intelligent Asset Management (pp. 386–389)**: Hardware automatically identifies and reports rack **U space** assets (**100% asset accuracy**, improves inbound counting efficiency by **>95%**, component-level CPU/memory/disk tracking, 1-year asset change history).\n3. **Intelligent Version Management (pp. 390–394)**: Connects to **HOUP** (*Huawei Online Update Platform*) via out-of-band channels (consumes zero service bandwidth) for **OTA** baseline push, common/OTA/periodic update schedules, firmware/driver update, and software installation/update/rollback/uninstallation.\n4. **Intelligent Fault Management (pp. 395–396)**: AI-based **Disk Fault Prediction** (risk charts) and **Memory Fault Prediction** (DIMM health & historical self-healing records).\n5. **Intelligent Energy Efficiency Management (pp. 397–400)**: Solves data center pain points (rack space utilization only 40%–50%, rack power usage 50%, electricity \≥ 78\% of op costs). Provides AI rack power prediction, **cabinet-level power capping**, PSU hibernation, and 4 optimization analyses: **Power distribution** (batch power capping), **Temperature risk** (power off overheated air-intake servers), **Load optimization** (batch operations on low-load servers), and **Space optimization**.", "key_takeaways": ["FusionDirector SSDP discovery requires FusionDirector and managed servers to be on the same L2 network; one-click log export supports up to 100 servers at a time.", "FusionDirector Five Intelligent Features: Intelligent Deployment, Intelligent Asset, Intelligent Version (HOUP/OTA), Intelligent Fault (Disk & Memory prediction), and Intelligent Energy Efficiency Management.", "Server Profile rules: Delete is allowed ONLY when not bound to any server; Modify is allowed ONLY when not applied to any server.", "FusionDirector OS deployment is out-of-band (requires Smart Provisioning + license, no PXE/DHCP/TFTP needed), has a 2-hour timeout, and deploys up to 30 devices concurrently."], "exam_traps": ["EXAM TRAP: Do not confuse the Server Profile edit vs. delete restrictions (p. 383/414): You can DELETE a profile only when it is NOT BOUND to any server; you can MODIFY a profile only when it is NOT APPLIED to any server!", "EXAM TRAP: In FusionDirector Automatic Go-Online Planning (p. 385), Location planning (via iRM U-marks) and SN/MAC planning (via DHCP) are mutually exclusive — enabling one automatically disables the other!"], "content_html": "<h3>1. FusionDirector Basic Features: 4 Device Adding Modes &amp; Log Collection (pp. 378–381)<\/h3>\n<p><strong>FusionDirector<\/strong> is Huawei's centralized O&amp;M platform for batch server management, communicating southbound with server <strong>iBMCs<\/strong> via <strong>Redfish<\/strong> and northbound with upper-layer OSS via <strong>Web/Portal, Redfish, and SNMP<\/strong>:<\/p>\n<ul class=\"md-list\">\n<li><strong>Four Server Adding Modes (p. 379)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Manual adding<\/strong>: Fuzzy device adding when devices have <strong>consecutive IP addresses<\/strong> and the <strong>same device accounts<\/strong>.<\/li>\n<li><strong>Batch import<\/strong>: Accurate device adding via template when devices already have <strong>IP addresses and accounts<\/strong> configured.<\/li>\n<li><strong>DHCP automatic IP address allocation<\/strong>: Used when devices are in DHCP mode and <strong>accounts, SNs, and MAC addresses<\/strong> are known (<em>Restriction<\/em>: requires a <strong>DHCP relay server<\/strong> on the network).<\/li>\n<li><strong>SSDP automatic discovery<\/strong>: Uses <strong>IP-SN mapping mode<\/strong> (known SNs/accounts) or <strong>IP resource pool allocation mode<\/strong> (allocates random IPs when device info is unknown). (<em>Restriction<\/em>: <strong>FusionDirector and the devices MUST be on the same Layer 2 (L2) network<\/strong>!).<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>One-Click Log Collection (p. 380)<\/strong>: Exports logs of <strong>a maximum of 100 servers at a time<\/strong> in one-click mode.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. FusionDirector's Five Intelligent Features (pp. 382–400)<\/h3>\n<ol class=\"md-list\">\n<li><strong>Intelligent Deployment Management (pp. 383–385)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Server Profile (p. 383)<\/strong>: Configures BIOS, RAID, BMC, NIC, and PCIe topology for a specific server model (Server + NIC + RAID card combination).<\/li>\n<li><em>Rules<\/em>: Profile <strong>binding is separated from application<\/strong> (must <strong>bind<\/strong> before <strong>applying<\/strong>). You can <strong>delete<\/strong> a profile <strong>only when it is NOT bound to any server<\/strong>; you can <strong>modify<\/strong> a profile <strong>only when it is NOT applied to any server<\/strong>; backup profiles <strong>cannot<\/strong> be imported to a different or reinstalled FusionDirector!<\/li>\n<li><strong>OS Deployment (p. 384)<\/strong>: Out-of-band deployment (no DHCP/TFTP/PXE required!), <strong>requires servers with Smart Provisioning<\/strong> and an <strong>OS deployment license<\/strong>, formats the system disk, has a <strong>2-hour timeout<\/strong>, and deploys <strong>a maximum of 30 devices at the same time<\/strong>.<\/li>\n<li><strong>Automatic Go-Online Planning (p. 385)<\/strong>:<\/li>\n<li><em>Location-based planning<\/em>: Uses <strong>iRM<\/strong> to obtain rack <strong>U marks<\/strong>.<\/li>\n<li><em>SN/MAC-based planning<\/em>: Uses <strong>DHCP<\/strong> (must be in the same DHCP broadcast domain as FusionDirector).<\/li>\n<li><em>Mutual Exclusion Rule<\/em>: Enabling <strong>location planning automatically disables SN/MAC planning<\/strong>, and vice versa!<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Intelligent Asset Management (pp. 386–389)<\/strong>: Hardware automatically identifies and reports rack <strong>U space<\/strong> assets (<strong>100% asset accuracy<\/strong>, improves inbound counting efficiency by <strong>&gt;95%<\/strong>, component-level CPU/memory/disk tracking, 1-year asset change history).<\/li>\n<li><strong>Intelligent Version Management (pp. 390–394)<\/strong>: Connects to <strong>HOUP<\/strong> (<em>Huawei Online Update Platform<\/em>) via out-of-band channels (consumes zero service bandwidth) for <strong>OTA<\/strong> baseline push, common/OTA/periodic update schedules, firmware/driver update, and software installation/update/rollback/uninstallation.<\/li>\n<li><strong>Intelligent Fault Management (pp. 395–396)<\/strong>: AI-based <strong>Disk Fault Prediction<\/strong> (risk charts) and <strong>Memory Fault Prediction<\/strong> (DIMM health &amp; historical self-healing records).<\/li>\n<li><strong>Intelligent Energy Efficiency Management (pp. 397–400)<\/strong>: Solves data center pain points (rack space utilization only 40%–50%, rack power usage 50%, electricity \≥ 78\% of op costs). Provides AI rack power prediction, <strong>cabinet-level power capping<\/strong>, PSU hibernation, and 4 optimization analyses: <strong>Power distribution<\/strong> (batch power capping), <strong>Temperature risk<\/strong> (power off overheated air-intake servers), <strong>Load optimization<\/strong> (batch operations on low-load servers), and <strong>Space optimization<\/strong>.<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: FusionDirector Batch Provisioning & Intelligent Policy Config", "duration_mins": 8, "exercise_type": "config", "prompt_label": "admin@fusiondirector:~#", "scenario": "Configure FusionDirector batch management limits, Server Profile lifecycle constraints, and OS deployment parameters for a Kunpeng data center.", "instructions": ["Set `max_log_export_servers` to `100` and `max_concurrent_os_deployments` to `30` (with `os_deploy_timeout_hours: 2`).", "Set `ssdp_discovery_network_requirement` to `'L2'`.", "Set `delete_profile_condition` to `'not bound'` and `modify_profile_condition` to `'not applied'`."], "starter_code": "# FusionDirector Batch & Intelligent Deployment Policy\nbatch_limits:\n  max_log_export_servers: ___\n  max_concurrent_os_deployments: ___\n  os_deploy_timeout_hours: 2\n  ssdp_discovery_network_requirement: \"___\"\n\nserver_profile_rules:\n  bind_before_apply: True\n  delete_profile_condition: \"___\"\n  modify_profile_condition: \"___\"\n  online_update_platform: \"HOUP\"\n", "solution_code": "# FusionDirector Batch & Intelligent Deployment Policy\nbatch_limits:\n  max_log_export_servers: 100\n  max_concurrent_os_deployments: 30\n  os_deploy_timeout_hours: 2\n  ssdp_discovery_network_requirement: \"L2\"\n\nserver_profile_rules:\n  bind_before_apply: True\n  delete_profile_condition: \"not bound\"\n  modify_profile_condition: \"not applied\"\n  online_update_platform: \"HOUP\"\n", "hints": ["FusionDirector exports logs for up to 100 servers at a time and deploys OSs to up to 30 devices concurrently; SSDP requires an L2 network.", "A profile can be deleted only when 'not bound' to any server, and modified only when 'not applied' to any server."], "validation_checks": [{"step": 1, "description": "Verify 100-server log export limit and 30-device concurrent OS deployment limit", "required_any": ["100", "30"], "feedback_fail": "Set max_log_export_servers = 100 and max_concurrent_os_deployments = 30."}, {"step": 2, "description": "Verify L2 network requirement for SSDP discovery", "required_any": ["l2"], "feedback_fail": "Set ssdp_discovery_network_requirement to 'L2'."}, {"step": 3, "description": "Verify 'not bound' (delete) and 'not applied' (modify) profile rules", "required_any": ["not bound", "not applied"], "feedback_fail": "Set delete_profile_condition to 'not bound' and modify_profile_condition to 'not applied'."}], "simulated_output": "[OK] FusionDirector Policies Validated:\n- Device Discovery: Manual (consecutive IPs), Batch Import, DHCP Relay, SSDP (Same L2 network)\n- Batch Capacities: Log Export <= 100 servers | Concurrent OS Deploy <= 30 servers (2h timeout, requires Smart Provisioning)\n- Profile Rules: Delete requires 'not bound'; Modify requires 'not applied'.", "quiz_questions": [{"id": "h8_s2_q1", "type": "single", "question": "In Huawei FusionDirector, what are the restrictions on deleting and modifying a Server Profile (Ch.06, p. 383)?", "options": ["A. You can delete a profile at any time, even when bound and applied to running servers.", "B. You can delete a profile only when it is NOT bound to any server, and you can modify a profile only when it is NOT applied to any server.", "C. You can delete a profile only when it is applied to a server, and modify it only after reinstalling FusionDirector.", "D. Server Profiles cannot be edited or deleted once created."], "answer": "B", "explanation": "According to Ch.06 p.383 (and p.414 for eSight), you can delete a profile only when the profile is not bound to any server, and you can modify a profile only when the profile is not applied to any server."}, {"id": "h8_s2_q2", "type": "multiple", "question": "Which of the following belong to the 'Five Intelligent Features' of Huawei FusionDirector (Ch.06, p. 382)?", "options": ["A. Intelligent deployment management and Intelligent asset management", "B. Intelligent version management", "C. Intelligent fault management (Disk and Memory fault prediction)", "D. Intelligent energy efficiency management"], "answer": "ABCD", "explanation": "All five — Intelligent deployment, Intelligent asset, Intelligent version, Intelligent fault, and Intelligent energy efficiency management — constitute the Five Intelligent Features of FusionDirector (Ch.06, p.382)."}, {"id": "h8_s2_q3", "type": "single", "question": "When using SSDP automatic discovery in FusionDirector to discover devices and allocate IP addresses, what network restriction must be satisfied?", "options": ["A. FusionDirector and the devices must be separated by at least three Layer 3 BGP routers.", "B. FusionDirector and the devices must be on the same Layer 2 (L2) network.", "C. All devices must already be connected to the public Internet via NAT.", "D. SSDP only works over serial RS-232 cables."], "answer": "B", "explanation": "According to Ch.06 p.379, if SSDP automatic discovery is used, FusionDirector and the devices must be on the same L2 network."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Centralized-Management-eSight-Architecture-and-Features", "exercise_slug": "06-Exercise-eSight-Interfaces-IF1-to-IF5-and-Batch-Specs-Lab", "lecture": {"title": "Centralized Management: eSight Architecture, Interfaces (IF1–IF5) & Batch Specs", "duration_mins": 7, "pdf_ref": "Ch.06, pp. 401–414", "objectives": ["Understand eSight's cross-domain ICT scope (Huawei + third-party HP/Cisco/H3C devices), B/S architecture, and HA deployment modes", "Master eSight's five external interfaces (IF1 Southbound, IF2 Northbound, IF3 External Auth, IF4 Notification, IF5 UI)", "Memorize eSight's exact numerical specifications for Batch Import (500), Power-on/off priorities (1–10), OS Deployment (200/task, 40 concurrent), Firmware Upgrade (1000/schedule, 100 concurrent), and Profile Binding (2000 bound, 1000 applied)"], "content_markdown": "### 1. eSight Overview & Service-Oriented Architecture (pp. 402–404)\n- **Unified Enterprise ICT O&M (pp. 402–403)**: Centrally manages switches, routers, WLAN, firewalls, video surveillance/cameras, storage, microwave, PON devices, **servers, and server OSs**, plus pre-integrates third-party devices (**HP, Cisco, H3C**).\n- **Architecture Highlights (p. 403)**:\n  - **B/S (Browser/Server) structure**: Clients access eSight via web browser without plugins; only the server needs upgrading during maintenance.\n  - **Deployment Modes**: Supports **single-node**, **two-node active/standby**, and **multi-node multi-active** deployment with scale-out from dozens to tens of thousands of devices.\n- **Five External Interfaces of eSight (`IF1` to `IF5`, p. 404 — High-Yield Exam Topic!)**:\n\n| Interface | Direction / Role | Supported Protocols & Details (p. 404) |\n| :---: | :--- | :--- |\n| **`IF1`** | **Southbound Interface** (connects to & manages devices) | **SNMP, STelnet, FTP, SFTP, IPMI, HTTP/HTTPS (REST/Redfish), WebSocket, SocketPing, ICMP, WebPing, WebTrace, SSDP, Syslog, WebTelnet, Netconf, TR069** |\n| **`IF2`** | **Northbound Interface** (integrates with upper-layer OSS / 3rd-party NMS & Syslog) | **RESTful, SNMP, FTP, Kafka** (for resources, alarms, performance) + **Syslog** forwarding |\n| **`IF3`** | **External Authentication Server Interface** | **LDAP, RADIUS, and SSO** |\n| **`IF4`** | **Notification Interface** (sends alarms, events, reports) | Connects to enterprise **Mail servers (Email)** and **SMS gateways (SMS)** |\n| **`IF5`** | **User Interface (UI)** | Invoked by system administrators and operators via Web browser |\n\n---\n\n### 2. eSight Server Device Management & Alarm/Power Management (pp. 405–411)\n- **Discovery & Management Protocols by Server Type (p. 406)**:\n  - **Rack, High-density, and TaiShan servers**: Discovery = **Redfish/SNMP**; Management = **Redfish/SNMP**.\n  - **Blade servers**: Discovery = **Redfish/SNMP**; Management = **Redfish/SNMP/SSH**.\n  - **Heterogeneous servers**: Discovery = **Redfish**; Management = **Redfish**.\n- **Alarm Display Colors (p. 410)**: Alarms with a **white background are NOT cleared**; alarms with a **light green background ARE cleared**.\n- **Device Power-On / Power-Off Task Management (p. 411)**:\n  - Supports batch power-on/off tasks (once, daily, weekly, monthly, yearly) with **priorities from 1 to 10 in descending order** (**1 = highest priority**, powered on/off first). Real-time power status updates depend on **device alarm reporting** (otherwise click **Synchronize**).\n\n---\n\n### 3. eSight Server Service Management Batch Specifications (pp. 406, 412–414)\n| eSight Feature | Exact Official Numerical Specification (pp. 406, 412–414) |\n| :--- | :--- |\n| **Batch Import (Excel)** | Up to **500 devices** added at a time via Excel file |\n| **OS Deployment** | Up to **200 devices per task** and **40 devices deployed concurrently** (2-hour timeout; requires **Smart Provisioning**; can optionally deploy **iBMA**) |\n| **Software & Firmware Upgrade** | Up to **1,000 devices per upgrade schedule** and **100 devices upgraded concurrently** (connects to **HOUP** for baselines) |\n| **Server Profile Configuration** | A single profile can be **bound to up to 2,000 devices**, and **up to 1,000 devices** can be selected at a time for **applying** a profile (Delete = not bound; Modify = not applied) |", "key_takeaways": ["eSight external interfaces: IF1 = Southbound (SNMP, Redfish, IPMI, Netconf, TR069, etc.), IF2 = Northbound (RESTful, SNMP, FTP, Kafka, Syslog), IF3 = External Auth (LDAP, RADIUS, SSO), IF4 = Notification (Mail/SMS), IF5 = UI.", "On the eSight alarm panel, a white background indicates an uncleared alarm, while a light green background indicates a cleared alarm.", "eSight batch limits: Excel batch import = 500 devices; OS deployment = 200 devices/task (40 concurrent); Firmware upgrade = 1,000 devices/schedule (100 concurrent); Server Profile = 2,000 bound (1,000 applied at a time)."], "exam_traps": ["EXAM TRAP: Compare Concurrent OS Deployment limits between FusionDirector and eSight: FusionDirector supports 30 concurrent OS deployments (p. 384), whereas eSight supports up to 200 devices per task and 40 concurrent OS deployments (p. 412)!", "EXAM TRAP: Do not mix up eSight interfaces IF1 through IF5 — IF1 is Southbound (to managed devices), IF2 is Northbound (RESTful/SNMP/FTP/Kafka to upper-layer OSS), IF3 is LDAP/RADIUS/SSO authentication, and IF4 is Email/SMS notification."], "content_html": "<h3>1. eSight Overview &amp; Service-Oriented Architecture (pp. 402–404)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Unified Enterprise ICT O&amp;M (pp. 402–403)<\/strong>: Centrally manages switches, routers, WLAN, firewalls, video surveillance/cameras, storage, microwave, PON devices, <strong>servers, and server OSs<\/strong>, plus pre-integrates third-party devices (<strong>HP, Cisco, H3C<\/strong>).<\/li>\n<li><strong>Architecture Highlights (p. 403)<\/strong>:<\/li>\n<li><strong>B/S (Browser/Server) structure<\/strong>: Clients access eSight via web browser without plugins; only the server needs upgrading during maintenance.<\/li>\n<li><strong>Deployment Modes<\/strong>: Supports <strong>single-node<\/strong>, <strong>two-node active/standby<\/strong>, and <strong>multi-node multi-active<\/strong> deployment with scale-out from dozens to tens of thousands of devices.<\/li>\n<li><strong>Five External Interfaces of eSight (<code class=\"inline-code\">IF1<\/code> to <code class=\"inline-code\">IF5<\/code>, p. 404 — High-Yield Exam Topic!)<\/strong>:<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Interface<\/th><th>Direction / Role<\/th><th>Supported Protocols &amp; Details (p. 404)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong><code class=\"inline-code\">IF1<\/code><\/strong><\/td><td><strong>Southbound Interface<\/strong> (connects to &amp; manages devices)<\/td><td><strong>SNMP, STelnet, FTP, SFTP, IPMI, HTTP/HTTPS (REST/Redfish), WebSocket, SocketPing, ICMP, WebPing, WebTrace, SSDP, Syslog, WebTelnet, Netconf, TR069<\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">IF2<\/code><\/strong><\/td><td><strong>Northbound Interface<\/strong> (integrates with upper-layer OSS / 3rd-party NMS &amp; Syslog)<\/td><td><strong>RESTful, SNMP, FTP, Kafka<\/strong> (for resources, alarms, performance) + <strong>Syslog<\/strong> forwarding<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">IF3<\/code><\/strong><\/td><td><strong>External Authentication Server Interface<\/strong><\/td><td><strong>LDAP, RADIUS, and SSO<\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">IF4<\/code><\/strong><\/td><td><strong>Notification Interface<\/strong> (sends alarms, events, reports)<\/td><td>Connects to enterprise <strong>Mail servers (Email)<\/strong> and <strong>SMS gateways (SMS)<\/strong><\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">IF5<\/code><\/strong><\/td><td><strong>User Interface (UI)<\/strong><\/td><td>Invoked by system administrators and operators via Web browser<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. eSight Server Device Management &amp; Alarm/Power Management (pp. 405–411)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Discovery &amp; Management Protocols by Server Type (p. 406)<\/strong>:<\/li>\n<li><strong>Rack, High-density, and TaiShan servers<\/strong>: Discovery = <strong>Redfish/SNMP<\/strong>; Management = <strong>Redfish/SNMP<\/strong>.<\/li>\n<li><strong>Blade servers<\/strong>: Discovery = <strong>Redfish/SNMP<\/strong>; Management = <strong>Redfish/SNMP/SSH<\/strong>.<\/li>\n<li><strong>Heterogeneous servers<\/strong>: Discovery = <strong>Redfish<\/strong>; Management = <strong>Redfish<\/strong>.<\/li>\n<li><strong>Alarm Display Colors (p. 410)<\/strong>: Alarms with a <strong>white background are NOT cleared<\/strong>; alarms with a <strong>light green background ARE cleared<\/strong>.<\/li>\n<li><strong>Device Power-On / Power-Off Task Management (p. 411)<\/strong>:<\/li>\n<li>Supports batch power-on/off tasks (once, daily, weekly, monthly, yearly) with <strong>priorities from 1 to 10 in descending order<\/strong> (<strong>1 = highest priority<\/strong>, powered on/off first). Real-time power status updates depend on <strong>device alarm reporting<\/strong> (otherwise click <strong>Synchronize<\/strong>).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. eSight Server Service Management Batch Specifications (pp. 406, 412–414)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>eSight Feature<\/th><th>Exact Official Numerical Specification (pp. 406, 412–414)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Batch Import (Excel)<\/strong><\/td><td>Up to <strong>500 devices<\/strong> added at a time via Excel file<\/td><\/tr>\n<tr><td><strong>OS Deployment<\/strong><\/td><td>Up to <strong>200 devices per task<\/strong> and <strong>40 devices deployed concurrently<\/strong> (2-hour timeout; requires <strong>Smart Provisioning<\/strong>; can optionally deploy <strong>iBMA<\/strong>)<\/td><\/tr>\n<tr><td><strong>Software &amp; Firmware Upgrade<\/strong><\/td><td>Up to <strong>1,000 devices per upgrade schedule<\/strong> and <strong>100 devices upgraded concurrently<\/strong> (connects to <strong>HOUP<\/strong> for baselines)<\/td><\/tr>\n<tr><td><strong>Server Profile Configuration<\/strong><\/td><td>A single profile can be <strong>bound to up to 2,000 devices<\/strong>, and <strong>up to 1,000 devices<\/strong> can be selected at a time for <strong>applying<\/strong> a profile (Delete = not bound; Modify = not applied)<\/td><\/tr>\n<\/tbody><\/table><\/div>"}, "exercise": {"title": "Hands-On Lab: eSight IF1–IF5 Interface & Batch Specification Verification", "duration_mins": 7, "exercise_type": "config", "prompt_label": "esight-admin@ict-nms:~#", "scenario": "Configure the eSight integration architecture mapping (`IF1`–`IF5`) and batch operation capacity limits for a large carrier data center.", "instructions": ["Map `southbound_interface` to `'IF1'`, `northbound_oss_interface` to `'IF2'`, and `auth_ldap_radius_sso_interface` to `'IF3'`.", "Set `excel_batch_import_max` to `500`, `os_deploy_task_max` to `200`, and `os_deploy_concurrent_max` to `40`.", "Set `fw_upgrade_schedule_max` to `1000`, `profile_bind_max` to `2000`, and `cleared_alarm_bg_color` to `'light green'`."], "starter_code": "# eSight Architecture & Batch Specification Config\nesight_interfaces:\n  southbound_interface: \"___\"\n  northbound_oss_interface: \"___\"\n  auth_ldap_radius_sso_interface: \"___\"\n  notification_mail_sms_interface: \"IF4\"\n  user_ui_interface: \"IF5\"\n\nesight_batch_limits:\n  excel_batch_import_max: ___\n  os_deploy_task_max: ___\n  os_deploy_concurrent_max: ___\n  fw_upgrade_schedule_max: ___\n  fw_upgrade_concurrent_max: 100\n  profile_bind_max: ___\n  cleared_alarm_bg_color: \"___\"\n", "solution_code": "# eSight Architecture & Batch Specification Config\nesight_interfaces:\n  southbound_interface: \"IF1\"\n  northbound_oss_interface: \"IF2\"\n  auth_ldap_radius_sso_interface: \"IF3\"\n  notification_mail_sms_interface: \"IF4\"\n  user_ui_interface: \"IF5\"\n\nesight_batch_limits:\n  excel_batch_import_max: 500\n  os_deploy_task_max: 200\n  os_deploy_concurrent_max: 40\n  fw_upgrade_schedule_max: 1000\n  fw_upgrade_concurrent_max: 100\n  profile_bind_max: 2000\n  cleared_alarm_bg_color: \"light green\"\n", "hints": ["IF1 is southbound, IF2 is northbound, and IF3 is external authentication (LDAP/RADIUS/SSO).", "Batch limits: Excel import = 500, OS deploy = 200/task (40 concurrent), FW upgrade = 1000/schedule (100 concurrent), Profile bind = 2000; cleared alarms have a light green background."], "validation_checks": [{"step": 1, "description": "Verify IF1, IF2, and IF3 interface mappings", "required_any": ["if1", "if2", "if3"], "feedback_fail": "Set southbound_interface='IF1', northbound_oss_interface='IF2', and auth_ldap_radius_sso_interface='IF3'."}, {"step": 2, "description": "Verify eSight batch limits (500, 200, 40, 1000, 2000)", "required_any": ["500", "200", "40", "1000", "2000"], "feedback_fail": "Check the batch limits: 500, 200, 40, 1000, and 2000."}, {"step": 3, "description": "Verify light green background color for cleared alarms", "required_any": ["light green"], "feedback_fail": "Set cleared_alarm_bg_color to 'light green'."}], "simulated_output": "[OK] eSight External Interfaces & Batch Capacities Verified:\n- Interfaces: IF1 (Southbound), IF2 (Northbound RESTful/SNMP/FTP/Kafka), IF3 (LDAP/RADIUS/SSO), IF4 (Mail/SMS), IF5 (UI)\n- Capacities: Excel Import=500 | OS Deploy=200/task (40 concurrent) | FW Upgrade=1000/schedule (100 concurrent) | Profile=2000 bound (1000 applied)\n- Alarms: White background = Uncleared | Light green background = Cleared.", "quiz_questions": [{"id": "h8_s3_q1", "type": "single", "question": "Among the five external interfaces of Huawei eSight (Ch.06, p. 404), which interface is the northbound interface used by upper-layer OSS or third-party systems to obtain resources, alarms, and performance data via RESTful, SNMP, FTP, or Kafka?", "options": ["A. IF1", "B. IF2", "C. IF3", "D. IF4"], "answer": "B", "explanation": "According to Ch.06 p.404: IF1 is the southbound interface to managed devices; IF2 is the northbound interface (RESTful, SNMP, FTP, Kafka, Syslog) to upper-layer OSS; IF3 is for external authentication servers (LDAP, RADIUS, SSO); IF4 is for notifications (Mail/SMS); IF5 is the UI."}, {"id": "h8_s3_q2", "type": "single", "question": "In Huawei eSight OS Deployment (Ch.06, p. 412), what are the maximum number of devices supported per task and the maximum number of devices that can be deployed concurrently?", "options": ["A. Maximum 30 devices per task and 10 devices concurrently", "B. Maximum 200 devices per task and 40 devices concurrently", "C. Maximum 1,000 devices per task and 500 devices concurrently", "D. Maximum 50 devices per task and 50 devices concurrently"], "answer": "B", "explanation": "According to Ch.06 p.412, each eSight OS deployment task supports a maximum of 200 devices and a maximum of 40 devices can be deployed concurrently (requiring servers with Smart Provisioning)."}, {"id": "h8_s3_q3", "type": "multiple", "question": "Which of the following statements about eSight Server Management are true?", "options": ["A. Up to 500 devices can be added at a time using an Excel file in Batch Import mode.", "B. On the eSight alarm panel, alarms with a white background are not cleared, whereas alarms with a light green background are cleared.", "C. In Software and Firmware Upgrade, up to 100 devices can be upgraded concurrently and up to 1,000 devices can be selected for an upgrade schedule.", "D. A single eSight Server Profile can be bound to a maximum of 2,000 devices, and up to 1,000 devices can be selected at a time for applying a profile."], "answer": "ABCD", "explanation": "All four statements match the exact specifications in Ch.06 pp. 406, 410, 413, and 414."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-Local-OM-SmartKit-and-Remote-OM-eService", "exercise_slug": "08-Exercise-SmartKit-and-eService-Call-Home-Scenario-Lab", "lecture": {"title": "Local O&M (SmartKit) & Remote O&M (eService / Call Home)", "duration_mins": 8, "pdf_ref": "Ch.06, pp. 415–443", "objectives": ["Master SmartKit's features (50 parallel tasks, plugin-based, white-box customizable), 4-step local O&M process, and 6 O&M scenarios", "Understand SmartKit IP/IES config (link-local L2 restriction), 2 OS deployment channels, Atlas CANN deployment, Burn-in test (V5/TS200 via SP vs. V3 via FTK.iso), and In-band vs. Out-of-band firmware upgrade", "Master eService Remote O&M functions (Remote Inspection, Log Collection, Fault Diagnosis FMA, Health Evaluation, Call Home) and solve Ch.06 Quiz Q1!"], "content_markdown": "### 1. SmartKit: Local O&M Toolbox for Service Engineers (pp. 416–420)\n**SmartKit** is Huawei's lightweight, wizard-based, plugin-based local O&M toolbox installed on **frontline engineers' laptops**, supporting FusionServer, Kunpeng/TaiShan, Atlas, storage, machine vision, and cloud products:\n- **Key Highlights (pp. 416, 418)**: Processes **up to 50 tasks in parallel**, supports **online updates** from **HOUP**, interconnects with **eService**, and supports **white-box customization** for Kunpeng OEM/ecosystem partners.\n- **Four-Step SmartKit Local O&M Process (p. 417)**:\n  1. **Prepare**: Upgrade tool to latest version, prepare O&M documents (firmware, drivers, templates, scripts, operation guides).\n  2. **Authorize & Connect**: **Obtain customer authorization**, suspend services & back up data if needed, connect to network, and **add devices**.\n  3. **Configure**: Obtain device information and set task parameters.\n  4. **Execute & Restore**: Execute the task and restore customer services.\n- **Six SmartKit Scenarios & Sub-Functions (p. 419)**:\n  1. **Device Management**: Add/manage **iBMC, HMM, OS, CMC, IES, TCE** (prerequisite for all other functions).\n  2. **Site Deployment Delivery**: **IP address configuration**, **IES configuration** (Atlas 500), **Hardware configuration** (iBMC, BIOS, RAID, HMM), **OS deployment**, One-click site deployment, **Atlas batch deployment**.\n  3. **Routine Maintenance**: **Health check** (formerly **\"inspection\" in uMate**), **Power control**, **Configuration check** (compares against a **baseline device** or **baseline file**).\n  4. **Troubleshooting**: **Log collection** (One-click, E9000/TCE custom, or **OS log collection script package** when customer denies service network access), **Burn-in test**, **Hardware diagnosis**, **Device repair**.\n  5. **Upgrade / Patch Installation**: **Firmware upgrade**, E9000/TCE upgrade, Device change, **Software package management** (creates local HOUP repositories), Server bundle upgrade, **Batch distribution** (delivers **IPMI, SNMP, Redfish, SSH commands, and files** in batches).\n  6. **Parts Replacement**: **Electronic label (ELabel) modification**.\n\n---\n\n### 2. Deep-Dive into Key SmartKit Functions (pp. 421–432)\n- **IP Address & IES Configuration (pp. 421–422)**:\n  - *Scenario 1*: Configure new IPv4/IPv6/hostname (or Atlas 500 partition/IEF certificate in IES) using known **MAC address or SN** (*Note*: Uses **link-local address**, so **PC and server CANNOT be connected across routes / L3**!).\n  - *Scenario 2*: Configure new IP using known **IPv4/IPv6 address** (supports cross-route L3 connection).\n- **Two SmartKit OS Deployment Channels (p. 424)**: Deploys OSs in batches over the **management network** (no PXE server or service network required!):\n  1. **Onboard Smart Provisioning**: Deploys the **OS and driver at the same time**.\n  2. **Direct deployment through image mounting**: **Faster speed** and independent of Smart Provisioning, **but you must install the driver separately after installing the OS**.\n- **Atlas Batch Deployment (p. 425)**: Connects to the **service plane (OS) via SSH** to deploy **CANN** software for Atlas series products.\n- **Burn-In Test (p. 429)**: Stress-tests **CPU, memory, and disks** after installation to detect transport damage:\n  - **V5 and TaiShan 200 servers**: Use **iBMC to deliver commands to Smart Provisioning** for stress tests.\n  - **V3 servers**: Mount **`FTK.iso`** (*FusionServer Tools Toolkit*) through iBMC for stress tests.\n- **Firmware Upgrade Classification (p. 430)**:\n  - **Out-of-band parts**: **iBMC, BIOS, and Smart Provisioning** (upgraded directly via iBMC).\n  - **In-band firmware**: **PCIe card firmware and drive firmware** (upgraded after entering the service OS or external mini-memory system).\n\n---\n\n### 3. eService: 24/7 Remote O&M Platform & Call Home (pp. 433–438 — Official Quiz Q1!)\n**eService** provides remote O&M for customers via **eServiceClient** deployed in the customer's equipment room (backed by SQL/NoSQL + HDFS + Elasticsearch + DataCompass):\n- **Four Core eService Functions (pp. 435–437)**:\n  1. **Remote Inspection and Log Collection**: 24/7 secure remote inspection and log package collection.\n  2. **Fault Diagnosis (FMA)**: Analyzes device faults and risks based on collected logs.\n  3. **Health Evaluation**: Outputs device health reports based on logs or inspection reports.\n  4. **Call Home (p. 437)**: Automatic fault reporting method that **automatically sends hardware alarms** generated by Huawei devices via `eServiceClient` to the **Huawei technical support center**, **automatically creates trouble tickets**, and pushes expert inspection reports within hours.\n- **Official Ch.06 Quiz Q1 (p. 438)**: Which tools can configure RAIDs on bare-metal TaiShan 200 (2280) servers during project delivery?\n  - **Answer: `ABC` — A. Smart Provisioning, B. SmartKit, C. iBMC!** (**D. eService** is for remote monitoring/inspection/Call Home and **cannot** configure RAID!).", "key_takeaways": ["SmartKit runs on engineers' laptops, processes up to 50 parallel tasks, and covers 6 scenarios: Device Management, Site Deployment Delivery, Routine Maintenance, Troubleshooting, Upgrade/Patch Installation, and Parts Replacement (Electronic label modification).", "SmartKit OS deployment uses the management network via two channels: (1) Onboard Smart Provisioning (deploys OS + driver simultaneously) or (2) Direct image mounting (faster, independent of SP, install driver after OS).", "SmartKit Burn-in Test stress-tests CPU, memory, and disk: V5/TaiShan 200 uses Smart Provisioning, whereas V3 mounts FTK.iso.", "Out-of-band firmware includes iBMC, BIOS, and Smart Provisioning; In-band firmware includes PCIe card firmware and drive firmware.", "To configure RAID on bare-metal TaiShan 200 2280 servers, you can use Smart Provisioning, SmartKit, or iBMC (ABC) — NOT eService (Ch.06 Quiz Q1)!"], "exam_traps": ["EXAM TRAP (Ch.06 Quiz Q1): eService is a remote O&M platform (Remote Inspection, Log Collection, Fault Diagnosis, Health Evaluation, Call Home automatic trouble ticket creation) — it CANNOT configure RAID or install OSs on bare-metal servers! Only Smart Provisioning (A), SmartKit (B), and iBMC (C) can configure RAID.", "EXAM TRAP: When SmartKit configures device IP addresses based on MAC address or SN (Scenario 1, pp. 421–422), it uses link-local addresses, so the PC and server CANNOT be connected across routes!"], "content_html": "<h3>1. SmartKit: Local O&amp;M Toolbox for Service Engineers (pp. 416–420)<\/h3>\n<p><strong>SmartKit<\/strong> is Huawei's lightweight, wizard-based, plugin-based local O&amp;M toolbox installed on <strong>frontline engineers' laptops<\/strong>, supporting FusionServer, Kunpeng/TaiShan, Atlas, storage, machine vision, and cloud products:<\/p>\n<ul class=\"md-list\">\n<li><strong>Key Highlights (pp. 416, 418)<\/strong>: Processes <strong>up to 50 tasks in parallel<\/strong>, supports <strong>online updates<\/strong> from <strong>HOUP<\/strong>, interconnects with <strong>eService<\/strong>, and supports <strong>white-box customization<\/strong> for Kunpeng OEM/ecosystem partners.<\/li>\n<li><strong>Four-Step SmartKit Local O&amp;M Process (p. 417)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Prepare<\/strong>: Upgrade tool to latest version, prepare O&amp;M documents (firmware, drivers, templates, scripts, operation guides).<\/li>\n<li><strong>Authorize &amp; Connect<\/strong>: <strong>Obtain customer authorization<\/strong>, suspend services &amp; back up data if needed, connect to network, and <strong>add devices<\/strong>.<\/li>\n<li><strong>Configure<\/strong>: Obtain device information and set task parameters.<\/li>\n<li><strong>Execute &amp; Restore<\/strong>: Execute the task and restore customer services.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Six SmartKit Scenarios &amp; Sub-Functions (p. 419)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Device Management<\/strong>: Add/manage <strong>iBMC, HMM, OS, CMC, IES, TCE<\/strong> (prerequisite for all other functions).<\/li>\n<li><strong>Site Deployment Delivery<\/strong>: <strong>IP address configuration<\/strong>, <strong>IES configuration<\/strong> (Atlas 500), <strong>Hardware configuration<\/strong> (iBMC, BIOS, RAID, HMM), <strong>OS deployment<\/strong>, One-click site deployment, <strong>Atlas batch deployment<\/strong>.<\/li>\n<li><strong>Routine Maintenance<\/strong>: <strong>Health check<\/strong> (formerly <strong>\"inspection\" in uMate<\/strong>), <strong>Power control<\/strong>, <strong>Configuration check<\/strong> (compares against a <strong>baseline device<\/strong> or <strong>baseline file<\/strong>).<\/li>\n<li><strong>Troubleshooting<\/strong>: <strong>Log collection<\/strong> (One-click, E9000/TCE custom, or <strong>OS log collection script package<\/strong> when customer denies service network access), <strong>Burn-in test<\/strong>, <strong>Hardware diagnosis<\/strong>, <strong>Device repair<\/strong>.<\/li>\n<li><strong>Upgrade / Patch Installation<\/strong>: <strong>Firmware upgrade<\/strong>, E9000/TCE upgrade, Device change, <strong>Software package management<\/strong> (creates local HOUP repositories), Server bundle upgrade, <strong>Batch distribution<\/strong> (delivers <strong>IPMI, SNMP, Redfish, SSH commands, and files<\/strong> in batches).<\/li>\n<li><strong>Parts Replacement<\/strong>: <strong>Electronic label (ELabel) modification<\/strong>.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Deep-Dive into Key SmartKit Functions (pp. 421–432)<\/h3>\n<ul class=\"md-list\">\n<li><strong>IP Address &amp; IES Configuration (pp. 421–422)<\/strong>:<\/li>\n<li><em>Scenario 1<\/em>: Configure new IPv4/IPv6/hostname (or Atlas 500 partition/IEF certificate in IES) using known <strong>MAC address or SN<\/strong> (<em>Note<\/em>: Uses <strong>link-local address<\/strong>, so <strong>PC and server CANNOT be connected across routes / L3<\/strong>!).<\/li>\n<li><em>Scenario 2<\/em>: Configure new IP using known <strong>IPv4/IPv6 address<\/strong> (supports cross-route L3 connection).<\/li>\n<li><strong>Two SmartKit OS Deployment Channels (p. 424)<\/strong>: Deploys OSs in batches over the <strong>management network<\/strong> (no PXE server or service network required!):<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Onboard Smart Provisioning<\/strong>: Deploys the <strong>OS and driver at the same time<\/strong>.<\/li>\n<li><strong>Direct deployment through image mounting<\/strong>: <strong>Faster speed<\/strong> and independent of Smart Provisioning, <strong>but you must install the driver separately after installing the OS<\/strong>.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Atlas Batch Deployment (p. 425)<\/strong>: Connects to the <strong>service plane (OS) via SSH<\/strong> to deploy <strong>CANN<\/strong> software for Atlas series products.<\/li>\n<li><strong>Burn-In Test (p. 429)<\/strong>: Stress-tests <strong>CPU, memory, and disks<\/strong> after installation to detect transport damage:<\/li>\n<li><strong>V5 and TaiShan 200 servers<\/strong>: Use <strong>iBMC to deliver commands to Smart Provisioning<\/strong> for stress tests.<\/li>\n<li><strong>V3 servers<\/strong>: Mount <strong><code class=\"inline-code\">FTK.iso<\/code><\/strong> (<em>FusionServer Tools Toolkit<\/em>) through iBMC for stress tests.<\/li>\n<li><strong>Firmware Upgrade Classification (p. 430)<\/strong>:<\/li>\n<li><strong>Out-of-band parts<\/strong>: <strong>iBMC, BIOS, and Smart Provisioning<\/strong> (upgraded directly via iBMC).<\/li>\n<li><strong>In-band firmware<\/strong>: <strong>PCIe card firmware and drive firmware<\/strong> (upgraded after entering the service OS or external mini-memory system).<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. eService: 24/7 Remote O&amp;M Platform &amp; Call Home (pp. 433–438 — Official Quiz Q1!)<\/h3>\n<p><strong>eService<\/strong> provides remote O&amp;M for customers via <strong>eServiceClient<\/strong> deployed in the customer's equipment room (backed by SQL/NoSQL + HDFS + Elasticsearch + DataCompass):<\/p>\n<ul class=\"md-list\">\n<li><strong>Four Core eService Functions (pp. 435–437)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Remote Inspection and Log Collection<\/strong>: 24/7 secure remote inspection and log package collection.<\/li>\n<li><strong>Fault Diagnosis (FMA)<\/strong>: Analyzes device faults and risks based on collected log
