or <strong>binary<\/strong>; stores frequently used binary programs/commands used by all users.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/boot<\/code><\/strong><\/td><td>Stores core files used for <strong>starting (booting) the Linux OS<\/strong>, including connection files and kernel image files.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/dev<\/code><\/strong><\/td><td>Short for <strong>device<\/strong>; stores <strong>peripheral device files<\/strong> of Linux.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/etc<\/code><\/strong><\/td><td>Stores all <strong>configuration files<\/strong> and subdirectories required for system management.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/lib<\/code> &amp; <code class=\"inline-code\">/lib64<\/code><\/strong><\/td><td>Stores the system's most basic <strong>dynamic link libraries (DLLs / shared libraries)<\/strong> (32-bit and 64-bit).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/media<\/code><\/strong><\/td><td>Removable media devices (USB flash drives, CD-ROMs) <strong>automatically identified and mounted<\/strong> by Linux.<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/mnt<\/code><\/strong><\/td><td><strong>Temporary mount point<\/strong> for manual mounting of other file systems (e.g., mounting CD-ROM to <code class=\"inline-code\">/mnt<\/code>).<\/td><\/tr>\n<tr><td><strong><code class=\"inline-code\">/opt<\/code><\/strong><\/td><td>Stores <strong>additional third-party application software<\/strong> installed on the host (e.g., Oracle installation packages); empty by default.<\/td><\/tr>\n<\/tbody><\/table><\/div>"}, "exercise": {"title": "Hands-On Lab: Linux Root Directory Inspection & OS Call Chain", "duration_mins": 7, "exercise_type": "terminal", "prompt_label": "root@openeuler:~#", "scenario": "Inspect the openEuler root filesystem (`/`) and verify the exact standard directories for configuration files, peripheral devices, temporary mounts, and third-party software packages.", "instructions": ["Run `ls /` to list the top-level directories under the root filesystem.", "Set `CONFIG_DIR` to `'/etc'`, `DEVICE_DIR` to `'/dev'`, `TEMP_MOUNT_DIR` to `'/mnt'`, and `THIRD_PARTY_APP_DIR` to `'/opt'`.", "Set `POSIX_IEEE_STANDARD` to `'IEEE 1003'`."], "starter_code": "# 1. List all directories under the root filesystem:\n___\n\n# 2. Map standard Linux directories and POSIX standard:\nCONFIG_DIR=\"___\"\nDEVICE_DIR=\"___\"\nTEMP_MOUNT_DIR=\"___\"\nTHIRD_PARTY_APP_DIR=\"___\"\nPOSIX_IEEE_STANDARD=\"___\"\n", "solution_code": "# 1. List all directories under the root filesystem:\nls /\n\n# 2. Map standard Linux directories and POSIX standard:\nCONFIG_DIR=\"/etc\"\nDEVICE_DIR=\"/dev\"\nTEMP_MOUNT_DIR=\"/mnt\"\nTHIRD_PARTY_APP_DIR=\"/opt\"\nPOSIX_IEEE_STANDARD=\"IEEE 1003\"\n", "hints": ["Use `ls /` to list the root directory.", "`/etc` holds configuration files, `/dev` holds device files, `/mnt` is the temporary manual mount directory, `/opt` holds additional application software, and POSIX is IEEE 1003."], "validation_checks": [{"step": 1, "description": "Execute ls / to inspect the root directory", "required_any": ["ls /"], "feedback_fail": "Include `ls /` to list the root directory."}, {"step": 2, "description": "Map /etc, /dev, /mnt, and /opt accurately", "required_any": ["/etc", "/dev", "/mnt", "/opt"], "feedback_fail": "Make sure CONFIG_DIR='/etc', DEVICE_DIR='/dev', TEMP_MOUNT_DIR='/mnt', and THIRD_PARTY_APP_DIR='/opt'."}, {"step": 3, "description": "Specify IEEE 1003 for POSIX standard", "required_any": ["1003"], "feedback_fail": "Set POSIX_IEEE_STANDARD to 'IEEE 1003'."}], "simulated_output": "bin   dev  home  lib64       media  opt   root  sbin  sys  usr\nboot  etc  lib   lost+found  mnt    proc  run   srv   tmp  var\n[OK] Linux root directory hierarchy and IEEE 1003 (POSIX.1) verified.", "quiz_questions": [{"id": "h4_s4_q1", "type": "single", "question": "In the Linux file directory structure, which directory stores all system management configuration files, and which directory is used to store additional third-party application software (such as an Oracle installation package)?", "options": ["A. /bin (configuration files) and /lib (additional software)", "B. /etc (configuration files) and /opt (additional software)", "C. /dev (configuration files) and /mnt (additional software)", "D. /boot (configuration files) and /media (additional software)"], "answer": "B", "explanation": "According to Ch.03 p.219, `/etc` stores all configuration files and subdirectories required for system management, and `/opt` stores additional application software installed on the host (empty by default)."}, {"id": "h4_s4_q2", "type": "multiple", "question": "Which of the following are advantages and features of UEFI compared with conventional BIOS?", "options": ["A. Supports large drive capacities and 64-bit systems", "B. High efficiency, fast boot, and fast recovery from hibernation", "C. Easy batch installation", "D. Secure startup (Secure Boot)"], "answer": "ABCD", "explanation": "All four options list the official features of UEFI on Ch.03 p.205: Large drive capacity, High efficiency, 64-bit system, Easy batch installation, Fast boot and recovery from hibernation, and Secure startup."}, {"id": "h4_s4_q3", "type": "single", "question": "Which of the following statements about Unix and Linux is FALSE?", "options": ["A. Unix systems (such as IBM AIX and HP-UX) are commercial software and are usually compatible only with specific hardware.", "B. Linux is an open-source Unix-like OS whose kernel was first released by Linus Torvalds in 1991.", "C. Linux is fully compatible with the POSIX.1 standard (IEEE 1003 / ISO/IEC 9945) and follows the philosophy 'everything is a file'.", "D. EulerOS was open-sourced by Huawei in 1994 and renamed MINIX."], "answer": "D", "explanation": "D is false because EulerOS was open-sourced by Huawei in 2019 and named openEuler, whereas MINIX was released in 1987 as an educational Unix-like OS (Ch.03, pp. 214, 217)."}]}}]}, {"hour_number": 5, "folder_name": "Hour-05-Huawei-Kunpeng-Computing-Industry", "title": "Huawei Kunpeng Processors, TaiShan Servers, openEuler/openGauss & HPC", "chapter_ref": "Chapter 04 (pp. 227–283)", "duration_mins": 60, "overview": "Master Huawei's Kunpeng computing industry: chip evolution (1991 ASIC to Kunpeng 920 7nm), SoC/Chip/Die/Cluster/Core hierarchy, HCCS inter-chip interconnect, Kunpeng Accelerator Engine (KAE), TaiShan 100 vs. TaiShan 200 (2280/5280/2480/1280/2280E) specifications, openEuler (A-Tune, iSulad), openGauss (1.5M tpmC, NUMA, Mulan PSL v2), and Kunpeng HPC.", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-Kunpeng-Processor-Evolution-and-Kunpeng-920-Architecture", "exercise_slug": "02-Exercise-Kunpeng-920-Die-Cluster-Core-and-HCCS-Lab", "lecture": {"title": "Kunpeng Processor Evolution & Kunpeng 920 Physical Architecture", "duration_mins": 8, "pdf_ref": "Ch.04, pp. 231–239, 279", "objectives": ["Trace Huawei's chip evolution from 1991 ASIC to K3, Kunpeng 912 (Hi1612), Kunpeng 916, and Kunpeng 920", "Master the physical hierarchy of Kunpeng 920: SoC, Chip, Die (2 CPU dies + 1 I/O die via CoWoS), Cluster (8 per die), and Core (4 per cluster)", "Know all Kunpeng 920 performance metrics, HCCS bus (480 Gbit/s, up to 256 cores across 4 sockets), RAS-45, and DEMT"], "content_markdown": "### 1. Evolution of Huawei Kunpeng Processors (pp. 231, 233, 236)\nHuawei's Kunpeng open hardware platform spans **Processor \\rightarrow Single Node ( Kunpeng Open Motherboard / Server) \\rightarrow Cluster**, paired with **Kunpeng DevKit** and **Kunpeng BoostKit**:\n- **Motherboard Highlights (p. 231)**: **25% higher motherboard performance** (56G SerDes), **15% lower failure rate** than industry average (signal bit error rate \BER < 10^{-12}), and **15% higher energy efficiency ratio** via **Dynamic Energy Management Technology (DEMT)**.\n\n| Year | Chip / Processor | Milestone Significance (pp. 233, 236) |\n| :---: | :--- | :--- |\n| **1991** | First ASIC chip | Huawei's first ASIC chip for transmission networks |\n| **2005** | First Arm wireless chip | First Arm-based chip for wireless base stations |\n| **2009** | **K3** | First Arm-based mobile smartphone CPU (predecessor of **Kirin**) |\n| **2014** | **Kunpeng 912 (Hi1612)** | Huawei's **first Arm-based 64-bit (AArch64) processor** |\n| **2016** | **Kunpeng 916** | **Industry's first Arm processor that supports multiple sockets** (data center predecessor) |\n| **Jan 2019** | **Kunpeng 920** | **Industry's first 7 nm data center–level Arm processor** |\n\n---\n\n### 2. Kunpeng 920 Physical Hierarchy: SoC, Chip, Die, Cluster & Core (pp. 234–237)\n- **Area Density Advantage (p. 235)**: The area of an Arm core is only **1/7** of that of an x86 core; for the same chip size, the number of Arm cores is **more than 4 times** that of x86 cores.\n- **Five Physical Architecture Concepts (pp. 234, 237)**:\n  1. **SoC (System on a Chip)**: Integrates the **CPU, southbridge, RoCE NIC, SAS/drive controller, and hardware encryption/compression acceleration engines** on a single chip (4 chips integrated into 1!).\n  2. **Chip**: Encapsulated package using **Chip on Wafer on Substrate (CoWoS)** packaging technology.\n  3. **Die**: Minimum physical silicon unit of a chip. **Kunpeng 920 encapsulates 3 dies**:\n     - **2 Compute (CPU) dies**: Each CPU die contains up to **32 cores** (8 clusters × 4 cores) and **4 DDR4 memory controllers** (2 \× 4 = 8 DDR4 channels total).\n     - **1 I/O die**: Provides **PCIe 4.0/CCIX** interfaces, **100GE RoCE** Ethernet ports, SAS/SATA storage controllers, inter-chip cache coherence interface, and hardware acceleration engines.\n  4. **Cluster**: Set of cores; **1 Cluster = 4 Cores**, and **1 CPU Die = 8 Clusters** (8 \× 4 = 32 cores/die, 64 cores/processor).\n  5. **Core**: Computing unit of the CPU.\n\n---\n\n### 3. HCCS Interconnect & Performance Gains (pp. 237–239 — Official Quiz Q1!)\n- **HCCS (Huawei Cache Coherence System, p. 237)**: Provides cache-coherent memory access across kernels, devices, and clusters with up to **480 Gbit/s inter-chip bandwidth**, supporting **2-socket and 4-socket NUMA interconnection** with up to **256 physical cores** (4 \× 64).\n- **Performance Gains vs. Previous Generation (pp. 238–239)**:\n  - **2.9x** single-processor integer computing performance (**3.9x** CPU core performance) and **4x** chip density.\n  - **8-channel DDR4 controller**: Increases memory bandwidth by **60%**.\n  - **PCIe 4.0 (compatible with PCIe 3.0/2.0/1.0) & CCIX**: Increases total I/O bandwidth by **66%**.\n  - **100GE RoCE Ethernet**: Increases network bandwidth by **4x**.\n  - **Reliability**: Supports **RAS-45** features.", "key_takeaways": ["Kunpeng processor evolution: 2014 Kunpeng 912 (Hi1612, first 64-bit Arm) -> 2016 Kunpeng 916 (first multi-socket Arm) -> Jan 2019 Kunpeng 920 (first 7nm data center Arm).", "Kunpeng 920 encapsulates 3 dies via CoWoS: 2 CPU dies (each with 8 clusters × 4 cores = 32 cores and 4 DDR4 controllers) + 1 I/O die (PCIe 4.0, 100GE RoCE, SAS controller, KAE accelerators).", "Huawei Cache Coherence System (HCCS) delivers up to 480 Gbit/s inter-chip bandwidth, connecting up to 4 Kunpeng 920 sockets (256 physical cores).", "Kunpeng 920 (Ch.04 Quiz Q1): 7nm process, 8-channel DDR4 (+60% BW), PCIe 4.0 compatible with 3.0/2.0/1.0 (+66% I/O BW), 100GE RoCE (+4x network BW), and multiple built-in accelerators."], "exam_traps": ["EXAM TRAP: Kunpeng 920 has THREE dies in total: TWO CPU dies (32 cores + 4 DDR4 channels each) and ONE I/O die — NOT 4 dies or 1 monolithic die!", "EXAM TRAP: Do not confuse Kunpeng 912/Hi1612 (2014, first 64-bit Arm) with Kunpeng 916 (2016, first multi-socket Arm, used in TaiShan 100) or Kunpeng 920 (2019, first 7nm data center Arm, used in TaiShan 200)."], "content_html": "<h3>1. Evolution of Huawei Kunpeng Processors (pp. 231, 233, 236)<\/h3>\n<p>Huawei's Kunpeng open hardware platform spans <strong>Processor \\rightarrow Single Node ( Kunpeng Open Motherboard / Server) \\rightarrow Cluster<\/strong>, paired with <strong>Kunpeng DevKit<\/strong> and <strong>Kunpeng BoostKit<\/strong>:<\/p>\n<ul class=\"md-list\">\n<li><strong>Motherboard Highlights (p. 231)<\/strong>: <strong>25% higher motherboard performance<\/strong> (56G SerDes), <strong>15% lower failure rate<\/strong> than industry average (signal bit error rate \BER &lt; 10^{-12}), and <strong>15% higher energy efficiency ratio<\/strong> via <strong>Dynamic Energy Management Technology (DEMT)<\/strong>.<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Year<\/th><th>Chip / Processor<\/th><th>Milestone Significance (pp. 233, 236)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>1991<\/strong><\/td><td>First ASIC chip<\/td><td>Huawei's first ASIC chip for transmission networks<\/td><\/tr>\n<tr><td><strong>2005<\/strong><\/td><td>First Arm wireless chip<\/td><td>First Arm-based chip for wireless base stations<\/td><\/tr>\n<tr><td><strong>2009<\/strong><\/td><td><strong>K3<\/strong><\/td><td>First Arm-based mobile smartphone CPU (predecessor of <strong>Kirin<\/strong>)<\/td><\/tr>\n<tr><td><strong>2014<\/strong><\/td><td><strong>Kunpeng 912 (Hi1612)<\/strong><\/td><td>Huawei's <strong>first Arm-based 64-bit (AArch64) processor<\/strong><\/td><\/tr>\n<tr><td><strong>2016<\/strong><\/td><td><strong>Kunpeng 916<\/strong><\/td><td><strong>Industry's first Arm processor that supports multiple sockets<\/strong> (data center predecessor)<\/td><\/tr>\n<tr><td><strong>Jan 2019<\/strong><\/td><td><strong>Kunpeng 920<\/strong><\/td><td><strong>Industry's first 7 nm data center–level Arm processor<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>2. Kunpeng 920 Physical Hierarchy: SoC, Chip, Die, Cluster &amp; Core (pp. 234–237)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Area Density Advantage (p. 235)<\/strong>: The area of an Arm core is only <strong>1/7<\/strong> of that of an x86 core; for the same chip size, the number of Arm cores is <strong>more than 4 times<\/strong> that of x86 cores.<\/li>\n<li><strong>Five Physical Architecture Concepts (pp. 234, 237)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>SoC (System on a Chip)<\/strong>: Integrates the <strong>CPU, southbridge, RoCE NIC, SAS/drive controller, and hardware encryption/compression acceleration engines<\/strong> on a single chip (4 chips integrated into 1!).<\/li>\n<li><strong>Chip<\/strong>: Encapsulated package using <strong>Chip on Wafer on Substrate (CoWoS)<\/strong> packaging technology.<\/li>\n<li><strong>Die<\/strong>: Minimum physical silicon unit of a chip. <strong>Kunpeng 920 encapsulates 3 dies<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>2 Compute (CPU) dies<\/strong>: Each CPU die contains up to <strong>32 cores<\/strong> (8 clusters × 4 cores) and <strong>4 DDR4 memory controllers<\/strong> (2 \× 4 = 8 DDR4 channels total).<\/li>\n<li><strong>1 I/O die<\/strong>: Provides <strong>PCIe 4.0/CCIX<\/strong> interfaces, <strong>100GE RoCE<\/strong> Ethernet ports, SAS/SATA storage controllers, inter-chip cache coherence interface, and hardware acceleration engines.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Cluster<\/strong>: Set of cores; <strong>1 Cluster = 4 Cores<\/strong>, and <strong>1 CPU Die = 8 Clusters<\/strong> (8 \× 4 = 32 cores/die, 64 cores/processor).<\/li>\n<li><strong>Core<\/strong>: Computing unit of the CPU.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>3. HCCS Interconnect &amp; Performance Gains (pp. 237–239 — Official Quiz Q1!)<\/h3>\n<ul class=\"md-list\">\n<li><strong>HCCS (Huawei Cache Coherence System, p. 237)<\/strong>: Provides cache-coherent memory access across kernels, devices, and clusters with up to <strong>480 Gbit/s inter-chip bandwidth<\/strong>, supporting <strong>2-socket and 4-socket NUMA interconnection<\/strong> with up to <strong>256 physical cores<\/strong> (4 \× 64).<\/li>\n<li><strong>Performance Gains vs. Previous Generation (pp. 238–239)<\/strong>:<\/li>\n<li><strong>2.9x<\/strong> single-processor integer computing performance (<strong>3.9x<\/strong> CPU core performance) and <strong>4x<\/strong> chip density.<\/li>\n<li><strong>8-channel DDR4 controller<\/strong>: Increases memory bandwidth by <strong>60%<\/strong>.<\/li>\n<li><strong>PCIe 4.0 (compatible with PCIe 3.0/2.0/1.0) &amp; CCIX<\/strong>: Increases total I/O bandwidth by <strong>66%<\/strong>.<\/li>\n<li><strong>100GE RoCE Ethernet<\/strong>: Increases network bandwidth by <strong>4x<\/strong>.<\/li>\n<li><strong>Reliability<\/strong>: Supports <strong>RAS-45<\/strong> features.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Kunpeng 920 Die/Cluster/Core Topology & HCCS Verification", "duration_mins": 7, "exercise_type": "script", "prompt_label": "python3@kunpeng-920:~", "scenario": "Write a Python script that models the internal die, cluster, core, and memory controller topology of a Kunpeng 920 processor and verifies HCCS 4-socket scaling.", "instructions": ["Set `process_nm` to `7`, `cpu_dies` to `2`, and `io_dies` to `1` (total 3 dies).", "Set `clusters_per_cpu_die` to `8`, `cores_per_cluster` to `4`, and `ddr4_controllers_per_cpu_die` to `4`.", "Set `hccs_bandwidth_gbps` to `480` and `max_4p_physical_cores` to `256`."], "starter_code": "# Kunpeng 920 SoC Topology Model\nprocess_nm = ___\ncpu_dies = ___\nio_dies = ___\nclusters_per_cpu_die = ___\ncores_per_cluster = ___\nddr4_controllers_per_cpu_die = ___\nhccs_bandwidth_gbps = ___\nmax_4p_physical_cores = ___\n\ntotal_cores_1p = cpu_dies * clusters_per_cpu_die * cores_per_cluster\ntotal_ddr4_channels = cpu_dies * ddr4_controllers_per_cpu_die\nprint(f\"Kunpeng 920 ({process_nm}nm): {cpu_dies}+{io_dies} dies, {total_cores_1p} cores, {total_ddr4_channels}ch DDR4, HCCS {hccs_bandwidth_gbps}Gbps, 4P={max_4p_physical_cores} cores\")", "solution_code": "# Kunpeng 920 SoC Topology Model\nprocess_nm = 7\ncpu_dies = 2\nio_dies = 1\nclusters_per_cpu_die = 8\ncores_per_cluster = 4\nddr4_controllers_per_cpu_die = 4\nhccs_bandwidth_gbps = 480\nmax_4p_physical_cores = 256\n\ntotal_cores_1p = cpu_dies * clusters_per_cpu_die * cores_per_cluster\ntotal_ddr4_channels = cpu_dies * ddr4_controllers_per_cpu_die\nprint(f\"Kunpeng 920 ({process_nm}nm): {cpu_dies}+{io_dies} dies, {total_cores_1p} cores, {total_ddr4_channels}ch DDR4, HCCS {hccs_bandwidth_gbps}Gbps, 4P={max_4p_physical_cores} cores\")", "hints": ["Kunpeng 920 uses a 7nm process with 2 CPU dies and 1 I/O die.", "Each CPU die has 8 clusters × 4 cores = 32 cores and 4 DDR4 controllers; HCCS provides 480 Gbit/s bandwidth up to 256 cores across 4 sockets."], "validation_checks": [{"step": 1, "description": "Verify 7nm process, 2 CPU dies, and 1 I/O die", "required_any": ["7", "2", "1"], "feedback_fail": "Set process_nm = 7, cpu_dies = 2, and io_dies = 1."}, {"step": 2, "description": "Verify 8 clusters per die and 4 cores per cluster", "required_any": ["8", "4"], "feedback_fail": "Set clusters_per_cpu_die = 8, cores_per_cluster = 4, and ddr4_controllers_per_cpu_die = 4."}, {"step": 3, "description": "Verify 480 Gbit/s HCCS bandwidth and 256 max 4P physical cores", "required_any": ["480", "256"], "feedback_fail": "Set hccs_bandwidth_gbps = 480 and max_4p_physical_cores = 256."}], "simulated_output": "Kunpeng 920 (7nm): 2+1 dies, 64 cores, 8ch DDR4, HCCS 480Gbps, 4P=256 cores\n[OK] Kunpeng 920 CoWoS 3-die architecture and HCCS interconnect verified.", "quiz_questions": [{"id": "h5_s1_q1", "type": "multiple", "question": "(Official Ch.04 Quiz Q1) Which of the following statements are true about the Huawei Kunpeng 920 processor?", "options": ["A. It adopts the 7 nm manufacturing process.", "B. It supports the 8-channel DDR4 controller.", "C. It supports the PCIe 4.0 interface and is compatible with PCIe 3.0/2.0/1.0.", "D. It supports multiple accelerators."], "answer": "ABCD", "explanation": "All four statements (ABCD) are true and come directly from the official Chapter 04 Quiz on p. 279."}, {"id": "h5_s1_q2", "type": "single", "question": "How many dies are encapsulated in a single Kunpeng 920 processor, and how are its cores and clusters organized?", "options": ["A. 1 monolithic die with 16 clusters of 4 cores each", "B. 3 dies (2 CPU dies + 1 I/O die); each CPU die has 8 clusters, and each cluster integrates 4 cores (up to 64 cores total)", "C. 4 CPU dies with 4 clusters of 4 cores each, and no I/O die", "D. 2 dies (1 CPU die + 1 GPU die) with 32 cores total"], "answer": "B", "explanation": "According to Ch.04 pp. 234 and 237, Kunpeng 920 encapsulates 3 dies (two CPU dies for computing and one I/O die). Each CPU die has 8 clusters of 4 cores (up to 32 cores and 4 DDR4 controllers per CPU die)."}, {"id": "h5_s1_q3", "type": "single", "question": "Which Huawei-developed processor was released in 2016 as the industry's first Arm processor to support multiple sockets (and used in TaiShan 100 servers)?", "options": ["A. K3", "B. Kunpeng 912 (Hi1612)", "C. Kunpeng 916", "D. Kunpeng 920"], "answer": "C", "explanation": "According to Ch.04 pp. 233, 236, and 245, Kunpeng 912 (Hi1612, 2014) was the first 64-bit Arm processor; Kunpeng 916 (2016) was the industry's first multi-socket Arm processor (powering TaiShan 100); Kunpeng 920 (2019) was the first 7nm data center Arm processor (powering TaiShan 200)."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-Kunpeng-Accelerator-Engine-KAE-and-TaiShan-200-Servers", "exercise_slug": "04-Exercise-TaiShan-Server-Portfolio-and-KAE-Architecture-Lab", "lecture": {"title": "Kunpeng Accelerator Engine (KAE) & TaiShan 100/200 Server Series", "duration_mins": 8, "pdf_ref": "Ch.04, pp. 240–256", "objectives": ["Understand KAE security advantages (on-chip bus vs. PCIe bus, SM3/SM4 support) and the 4 layers of the KAE logical architecture", "Compare TaiShan 100 (Kunpeng 916) and TaiShan 200 (Kunpeng 920) server portfolios (1280, 2280, 2280E, 2480, 5280, 5290)", "Master the exact hardware differences between TaiShan 2280 (2U balanced) and TaiShan 5280 (4U storage) and x86 servers"], "content_markdown": "### 1. Kunpeng Accelerator Engine (KAE) Security & Architecture (pp. 240–243)\n- **Why KAE Is More Secure Than Traditional PCIe Encryption Cards (p. 240)**:\n  - In traditional servers, plaintext data and keys traverse the **external PCIe bus** to a PCIe encryption card, creating a risk of data leakage.\n  - In **Kunpeng 920**, the encryption/decryption engine is **built into the CPU**, keys are stored in an **on-chip security zone** (only specified programs can write keys, and only the CPU can directly read them), and plaintext data travels **only through the on-chip bus**. Supports Chinese national cryptographic algorithms **SM3/SM4** (as well as AES/RSA) and compression (**Gzip/zlib**), without occupying CPU core resources!\n- **Four-Layer KAE Logical Architecture (p. 242)**:\n  1. **TaiShan Hardware Subsystems**:\n     - **Chip accelerator subsystem** (integrated in Kunpeng 920; provides register operations).\n     - **BIOS subsystem** (checks license, initializes modules, reports **ACPI table** to kernel).\n     - **BMC subsystem** (manages accelerator **licenses** for the server).\n  2. **Accelerator driver subsystem**: Core unified driver interface wrap in kernel space.\n  3. **Application library subsystem**: Standard **OpenSSL** accelerator engine and **zlib** alternate library (hides hardware details so existing SSL/TLS/compression apps migrate seamlessly).\n  4. **Application system**: Upper-layer user applications (Big data stream data, Block data encryption, Smart security video streams, Web service HTTPS handshakes).\n\n---\n\n### 2. TaiShan 100 vs. TaiShan 200 Portfolio (pp. 245–247)\n| Feature | TaiShan 100 Server (2016) | TaiShan 200 Server (2019) |\n| :--- | :--- | :--- |\n| **Processor** | **Kunpeng 916** | **Kunpeng 920** |\n| **Memory** | Up to **16 DDR4** DIMMs | Up to **32 DDR4-2933** DIMMs (up to **4 TB**) |\n| **PCIe Expansion** | **5 × PCIe 3.0** slots | Up to **8 × PCIe 4.0** slots |\n| **Local Drives** | SAS/SATA HDDs and SSDs | **NVMe SSDs**, SAS/SATA HDDs, and SSDs |\n| **Onboard LOM** | **GE / 10GE** LOM | **100GE** LOM (flexible 4\×\GE, 4\× 10\GE, or 4\× 25\GE) |\n| **Cooling** | Air cooling | **Board-level and full liquid cooling** |\n\n#### TaiShan 200 Model Portfolio (p. 247):\n- **2280**: **2U 2-socket balanced model** (max CPU TDP **180 W**, operating temp **5°C–40°C**).\n- **5280**: **4U 2-socket 40-drive storage model** (up to **40 × 3.5\" drives = 560 TB** + 4 × 2.5\" NVMe SSDs; max CPU TDP **200 W**, operating temp **5°C–35°C**).\n- **2480**: **2U 4-socket high-performance model** (compute-intensive / core databases).\n- **1280**: **1U 2-socket high-density compute model**.\n- **5290**: **72-slot high-density storage model**.\n- **2280E**: **Edge computing model**.\n\n---\n\n### 3. Structural Differences: TaiShan 2280 vs. 5280 vs. x86 (pp. 248–256)\n- **Crucial Structural Difference from x86 (p. 250)**: Unlike x86 servers (which use socketed, replaceable CPUs), **the CPUs of a TaiShan server are integrated (soldered) directly onto the motherboard and CANNOT be replaced separately** (3 motherboard variants are available). TaiShan also delivers higher DIMM density (32 slots vs. 24 on x86 Skylake).\n- **Rear I/O Module Rule (p. 249)**: On the rear panel of TaiShan 2280, **I/O modules 1 and 2** can be configured with the same drive module or riser module, while **I/O module 3 cannot** (supports 4\× 2.5'' rear drives or 2\×\PCIe 4.0 x8 FHHL slots).\n- **TaiShan 2280 vs. 5280 Internal Structure (pp. 252–254)**: Both share the **same motherboard**, but differ in **drive backplanes**: 5280 holds **24 × 3.5\" front drives** + **12 × 3.5\" rear lower drives** + **4 × 3.5\" rear upper drives** (up to 40 × 3.5\" drives) + **4 × 2.5\" rear drives**.\n- **Kunpeng Application Benchmarks (p. 256)**: Big Data (**+30% performance**), SDS (**+20% IOPS**, compression time **reduced by 66%**).", "key_takeaways": ["KAE encrypts/decrypts inside the CPU over the on-chip bus (preventing PCIe bus data leakage), supports SM3/SM4, and exposes standard OpenSSL and zlib interfaces.", "In KAE, BMC manages accelerator licenses, while BIOS initializes modules and reports the ACPI table to the kernel.", "Unlike x86 servers, TaiShan server CPUs are integrated on the motherboard and CANNOT be replaced separately!", "TaiShan 2280 (2U 2P balanced, 5°C–40°C) and TaiShan 5280 (4U 2P storage, up to 40 × 3.5\" drives = 560 TB, 5°C–35°C) share the same motherboard but use different drive backplanes."], "exam_traps": ["EXAM TRAP: If a question asks whether a faulty CPU on a TaiShan 200 (2280) server can be replaced independently of the motherboard, the answer is FALSE — Kunpeng CPUs on TaiShan servers are integrated on the motherboard and cannot be replaced separately (p. 250)!", "EXAM TRAP: In KAE, the BMC subsystem manages accelerator licenses, whereas the BIOS subsystem reports the ACPI table of the accelerator to the OS kernel (p. 242)."], "content_html": "<h3>1. Kunpeng Accelerator Engine (KAE) Security &amp; Architecture (pp. 240–243)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Why KAE Is More Secure Than Traditional PCIe Encryption Cards (p. 240)<\/strong>:<\/li>\n<li>In traditional servers, plaintext data and keys traverse the <strong>external PCIe bus<\/strong> to a PCIe encryption card, creating a risk of data leakage.<\/li>\n<li>In <strong>Kunpeng 920<\/strong>, the encryption/decryption engine is <strong>built into the CPU<\/strong>, keys are stored in an <strong>on-chip security zone<\/strong> (only specified programs can write keys, and only the CPU can directly read them), and plaintext data travels <strong>only through the on-chip bus<\/strong>. Supports Chinese national cryptographic algorithms <strong>SM3/SM4<\/strong> (as well as AES/RSA) and compression (<strong>Gzip/zlib<\/strong>), without occupying CPU core resources!<\/li>\n<li><strong>Four-Layer KAE Logical Architecture (p. 242)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>TaiShan Hardware Subsystems<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Chip accelerator subsystem<\/strong> (integrated in Kunpeng 920; provides register operations).<\/li>\n<li><strong>BIOS subsystem<\/strong> (checks license, initializes modules, reports <strong>ACPI table<\/strong> to kernel).<\/li>\n<li><strong>BMC subsystem<\/strong> (manages accelerator <strong>licenses<\/strong> for the server).<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Accelerator driver subsystem<\/strong>: Core unified driver interface wrap in kernel space.<\/li>\n<li><strong>Application library subsystem<\/strong>: Standard <strong>OpenSSL<\/strong> accelerator engine and <strong>zlib<\/strong> alternate library (hides hardware details so existing SSL/TLS/compression apps migrate seamlessly).<\/li>\n<li><strong>Application system<\/strong>: Upper-layer user applications (Big data stream data, Block data encryption, Smart security video streams, Web service HTTPS handshakes).<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. TaiShan 100 vs. TaiShan 200 Portfolio (pp. 245–247)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Feature<\/th><th>TaiShan 100 Server (2016)<\/th><th>TaiShan 200 Server (2019)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Processor<\/strong><\/td><td><strong>Kunpeng 916<\/strong><\/td><td><strong>Kunpeng 920<\/strong><\/td><\/tr>\n<tr><td><strong>Memory<\/strong><\/td><td>Up to <strong>16 DDR4<\/strong> DIMMs<\/td><td>Up to <strong>32 DDR4-2933<\/strong> DIMMs (up to <strong>4 TB<\/strong>)<\/td><\/tr>\n<tr><td><strong>PCIe Expansion<\/strong><\/td><td><strong>5 × PCIe 3.0<\/strong> slots<\/td><td>Up to <strong>8 × PCIe 4.0<\/strong> slots<\/td><\/tr>\n<tr><td><strong>Local Drives<\/strong><\/td><td>SAS/SATA HDDs and SSDs<\/td><td><strong>NVMe SSDs<\/strong>, SAS/SATA HDDs, and SSDs<\/td><\/tr>\n<tr><td><strong>Onboard LOM<\/strong><\/td><td><strong>GE / 10GE<\/strong> LOM<\/td><td><strong>100GE<\/strong> LOM (flexible 4\×\GE, 4\× 10\GE, or 4\× 25\GE)<\/td><\/tr>\n<tr><td><strong>Cooling<\/strong><\/td><td>Air cooling<\/td><td><strong>Board-level and full liquid cooling<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>TaiShan 200 Model Portfolio (p. 247):<\/h4>\n<ul class=\"md-list\">\n<li><strong>2280<\/strong>: <strong>2U 2-socket balanced model<\/strong> (max CPU TDP <strong>180 W<\/strong>, operating temp <strong>5°C–40°C<\/strong>).<\/li>\n<li><strong>5280<\/strong>: <strong>4U 2-socket 40-drive storage model<\/strong> (up to <strong>40 × 3.5\" drives = 560 TB<\/strong> + 4 × 2.5\" NVMe SSDs; max CPU TDP <strong>200 W<\/strong>, operating temp <strong>5°C–35°C<\/strong>).<\/li>\n<li><strong>2480<\/strong>: <strong>2U 4-socket high-performance model<\/strong> (compute-intensive / core databases).<\/li>\n<li><strong>1280<\/strong>: <strong>1U 2-socket high-density compute model<\/strong>.<\/li>\n<li><strong>5290<\/strong>: <strong>72-slot high-density storage model<\/strong>.<\/li>\n<li><strong>2280E<\/strong>: <strong>Edge computing model<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Structural Differences: TaiShan 2280 vs. 5280 vs. x86 (pp. 248–256)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Crucial Structural Difference from x86 (p. 250)<\/strong>: Unlike x86 servers (which use socketed, replaceable CPUs), <strong>the CPUs of a TaiShan server are integrated (soldered) directly onto the motherboard and CANNOT be replaced separately<\/strong> (3 motherboard variants are available). TaiShan also delivers higher DIMM density (32 slots vs. 24 on x86 Skylake).<\/li>\n<li><strong>Rear I/O Module Rule (p. 249)<\/strong>: On the rear panel of TaiShan 2280, <strong>I/O modules 1 and 2<\/strong> can be configured with the same drive module or riser module, while <strong>I/O module 3 cannot<\/strong> (supports 4\× 2.5'' rear drives or 2\×\PCIe 4.0 x8 FHHL slots).<\/li>\n<li><strong>TaiShan 2280 vs. 5280 Internal Structure (pp. 252–254)<\/strong>: Both share the <strong>same motherboard<\/strong>, but differ in <strong>drive backplanes<\/strong>: 5280 holds <strong>24 × 3.5\" front drives<\/strong> + <strong>12 × 3.5\" rear lower drives<\/strong> + <strong>4 × 3.5\" rear upper drives<\/strong> (up to 40 × 3.5\" drives) + <strong>4 × 2.5\" rear drives<\/strong>.<\/li>\n<li><strong>Kunpeng Application Benchmarks (p. 256)<\/strong>: Big Data (<strong>+30% performance<\/strong>), SDS (<strong>+20% IOPS<\/strong>, compression time <strong>reduced by 66%<\/strong>).<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: TaiShan 200 Portfolio & KAE Subsystem Configuration", "duration_mins": 7, "exercise_type": "config", "prompt_label": "admin@taishan-cluster:~#", "scenario": "Complete the TaiShan 200 hardware specification and KAE subsystem mapping for a Kunpeng data center deployment.", "instructions": ["Set `kae_app_libraries` to `'OpenSSL/zlib'`, `kae_license_manager` to `'BMC'`, and `kae_acpi_reporter` to `'BIOS'`.", "Set `taishan_cpu_replaceable_separately` to `False`.", "Map the TaiShan 200 models: `balanced_2u2p` -> `'2280'`, `storage_4u2p` -> `'5280'`, and `high_perf_2u4p` -> `'2480'`."], "starter_code": "# KAE & TaiShan 200 Portfolio Configuration\nkae_architecture:\n  kae_app_libraries: \"___\"\n  kae_license_manager: \"___\"\n  kae_acpi_reporter: \"___\"\n  supported_chinese_crypto: \"SM3/SM4\"\n\ntaishan_200_series:\n  taishan_cpu_replaceable_separately: ___\n  balanced_2u2p: \"___\"\n  storage_4u2p: \"___\"\n  high_perf_2u4p: \"___\"\n  storage_5280_max_3_5_drives: 40\n", "solution_code": "# KAE & TaiShan 200 Portfolio Configuration\nkae_architecture:\n  kae_app_libraries: \"OpenSSL/zlib\"\n  kae_license_manager: \"BMC\"\n  kae_acpi_reporter: \"BIOS\"\n  supported_chinese_crypto: \"SM3/SM4\"\n\ntaishan_200_series:\n  taishan_cpu_replaceable_separately: False\n  balanced_2u2p: \"2280\"\n  storage_4u2p: \"5280\"\n  high_perf_2u4p: \"2480\"\n  storage_5280_max_3_5_drives: 40\n", "hints": ["KAE application libraries are OpenSSL/zlib; BMC manages licenses and BIOS reports the ACPI table.", "TaiShan CPUs are soldered on the mainboard (False); 2280 is 2U2P balanced, 5280 is 4U2P storage, and 2480 is 2U4P high-performance."], "validation_checks": [{"step": 1, "description": "Verify OpenSSL/zlib, BMC license management, and BIOS ACPI reporting in KAE", "required_any": ["openssl", "bmc", "bios"], "feedback_fail": "Set kae_app_libraries to 'OpenSSL/zlib', kae_license_manager to 'BMC', and kae_acpi_reporter to 'BIOS'."}, {"step": 2, "description": "Verify that TaiShan CPUs cannot be replaced separately (False)", "required_any": ["false"], "feedback_fail": "Set taishan_cpu_replaceable_separately to False."}, {"step": 3, "description": "Verify TaiShan 2280, 5280, and 2480 model numbers", "required_any": ["2280", "5280", "2480"], "feedback_fail": "Specify '2280', '5280', and '2480'."}], "simulated_output": "[OK] KAE & TaiShan 200 Series Configuration Validated:\n- KAE: On-chip encryption (SM3/SM4) + compression | BMC (License) + BIOS (ACPI) + OpenSSL/zlib\n- TaiShan 200 Models: 1280 (1U2P), 2280 (2U2P Balanced), 2280E (Edge), 2480 (2U4P), 5280 (4U 40-drive Storage), 5290 (72-slot)\n- CPU Integration: Soldered on mainboard (not separately replaceable).", "quiz_questions": [{"id": "h5_s2_q1", "type": "single", "question": "In the logical architecture of the Kunpeng Accelerator Engine (KAE), which subsystem manages accelerator licenses for servers, and which standard application library interfaces are provided to upper-layer applications?", "options": ["A. BIOS subsystem manages licenses; JDBC and ODBC interfaces are provided", "B. BMC subsystem manages licenses; OpenSSL and zlib interfaces are provided", "C. iBMA manages licenses; POSIX and Win32 interfaces are provided", "D. RAID controller manages licenses; MPI and KML interfaces are provided"], "answer": "B", "explanation": "According to Ch.04 pp. 241–242, the BMC subsystem manages accelerator licenses, the BIOS subsystem reports the ACPI table to the kernel, and the application library subsystem provides standard OpenSSL and zlib interfaces."}, {"id": "h5_s2_q2", "type": "tf", "question": "Like traditional x86 rack servers, the Kunpeng 920 CPUs in a TaiShan 200 (model 2280) server are installed in standard socket latches and can be replaced separately without replacing the motherboard.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.04 p.250, unlike x86 servers, the CPUs of a TaiShan server are integrated on the motherboard and cannot be replaced separately (3 types of motherboards are available)."}, {"id": "h5_s2_q3", "type": "single", "question": "Which TaiShan 200 server model is a 4U 2-socket storage server supporting up to forty 3.5-inch drives (560 TB local storage) and sharing the same motherboard as the TaiShan 2280?", "options": ["A. TaiShan 1280", "B. TaiShan 2480", "C. TaiShan 5280", "D. TaiShan 2280E"], "answer": "C", "explanation": "According to Ch.04 pp. 247 and 252, the TaiShan 5280 is a 4U 2-socket storage server supporting up to 40 × 3.5-inch drives (560 TB) and 4 × 2.5-inch NVMe SSDs, sharing the same motherboard as the 2U TaiShan 2280."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Kunpeng-Software-Ecosystem-openEuler-and-openGauss", "exercise_slug": "06-Exercise-openEuler-ATune-iSulad-and-openGauss-Lab", "lecture": {"title": "Kunpeng Software Ecosystem: openEuler & openGauss", "duration_mins": 7, "pdf_ref": "Ch.04, pp. 257–269", "objectives": ["Understand Huawei's 16-word Kunpeng ecosystem strategy ('open hardware, open source software, partner enablement, and talent cultivation')", "Master openEuler history (2010 EulerOS -> Sept 2019 openEuler -> Nov 9, 2021 OpenAtom Foundation) and technical features (A-Tune, iSulad, Linux kernel 5.10, BiSheng Compiler)", "Master openGauss history (June 30, 2020 open source, Mulan PSL v2) and features (1.5M tpmC, NUMA-aware, SQL bypass, <10s failover, CRC page repair, fully-encrypted DB)"], "content_markdown": "### 1. Kunpeng Ecosystem Strategy & openEuler Overview (pp. 258–260)\n- **Kunpeng Ecosystem Strategy (p. 258)**: **\"Open hardware, open source software, partner enablement, and talent cultivation.\"**\n  - **Open Hardware**: Huawei provides motherboards and components (SSDs, NICs, RAID cards) and prioritizes partners developing their own servers/PCs.\n  - **Open Source Software & Partner Enablement**: **openEuler** (OS), **openGauss** (database), **Kunpeng DevKit**, and **Kunpeng BoostKit**.\n- **openEuler History (pp. 259–260)**:\n  - Named after mathematician **Leonhard Euler**. Introduced as **EulerOS in 2010** (HPC project).\n  - **September 2019**: EulerOS was officially open-sourced as **openEuler** (hosted on **Gitee**, docs at `https://www.openeuler.org/en/`).\n  - **September 25, 2021**: Released as an open-source digital infrastructure OS covering **IT, CT, and OT** (server, cloud, edge, embedded).\n  - **November 9, 2021**: Donated to the **OpenAtom Foundation**.\n\n---\n\n### 2. openEuler Key Technical Features (pp. 261–264)\n- **A-Tune (AI-Driven Automatic Resource Optimization, p. 261)**: Uses non-intrusive system profiling and machine learning clustering/classification across 3 stages — **Sensing** (profiles workloads for Web, Big Data, AI, HPC, Database), **Decision making** (analyzes service models to dynamically schedule resource models), and **Execution** (applies optimal full-stack parameters in real time).\n- **iSulad Container Solution (pp. 262–263)**: Unlike Docker (written in Golang), **iSulad** (written in C/C++) is a lightweight universal container engine for CT and IT with fast bootup, low memory overhead, trusted boot, and hitless upgrade. Supports 3 container deployment models:\n  1. **Application containers**: Integrates **Moby 18.09** for user-defined apps.\n  2. **Secure containers**: Essentially VMs encapsulated with container interfaces; integrates **Kata Containers 1.7** with heterogeneous compute and DPDK/SPDK support.\n  3. **System containers**: Lightweight VM alternative isolating user namespaces with dynamic resource adjustment.\n- **openEuler 22.03 LTS Features (p. 264)**: Built on **Linux kernel 5.10 LTS** (23M lines of new code); uses **systemd** (compatible with SysV init); supports **Kickstart** automated installation, **BiSheng Compiler** (C, C++, Fortran), and MySQL/Spark/Hive/HBase tuning.\n\n---\n\n### 3. openGauss Enterprise-Class Open Source Database (pp. 266–269)\n- **Evolution & License (pp. 266–267)**: Internal incubation (2001–2011) \\rightarrow Joint productization (2011–2019) \\rightarrow **GaussDB global release on May 15, 2019** \\rightarrow **openGauss open-sourced on June 30, 2020** under the **Mulan Permissive Software License v2 (Mulan PSL v2)**.\n- **Four Core Strengths of openGauss (pp. 268–269)**:\n  1. **Superb Performance**: Multi-core concurrency control + Kunpeng optimization reaching **1,500,000 tpmC (1.5M tpmC)** TPC-C benchmark on a **Kunpeng 2-socket server**; **NUMA-aware data structures** in the kernel; **SQL bypass** intelligent engine.\n  2. **Constant Availability**: Primary/standby sync, async, and **cascaded standby** deployment; **Data page CRC check** with automatic damaged-page restoration from standby; parallel recovery promoting **standby to primary within 10 seconds (`< 10s` RTO)**.\n  3. **Rocksolid Security**: **Fully-encrypted computing**, access control, encryption authentication, database audit, and dynamic data masking.\n  4. **Easy O&M**: AI-based parameter tuning, index recommendation, slow SQL diagnosis, and online auto-learning SQL execution time forecasting.", "key_takeaways": ["openEuler timeline: 2010 EulerOS -> Sept 2019 open-sourced as openEuler -> Nov 9, 2021 donated to OpenAtom Foundation. openEuler 22.03 LTS uses Linux kernel 5.10.", "A-Tune optimizes system resources through Sensing, Decision making, and Execution. iSulad supports Application containers (Moby), Secure containers (Kata Containers), and System containers.", "openGauss went open source on June 30, 2020 under the Mulan Permissive Software License v2 (Mulan PSL v2).", "openGauss achieves 1.5M tpmC on a 2-socket Kunpeng server, uses NUMA-aware data structures and SQL bypass, repairs damaged pages via CRC + standby node, and fails over to standby within 10 seconds."], "exam_traps": ["EXAM TRAP: Do not confuse the open-source dates: openEuler was open-sourced in September 2019 (donated to OpenAtom Foundation in Nov 2021), while openGauss was open-sourced on June 30, 2020 (under Mulan PSL v2)!", "EXAM TRAP: In openEuler iSulad, Application containers use Moby 18.09, whereas Secure containers use Kata Containers 1.7 (which are essentially VMs with container interfaces)."], "content_html": "<h3>1. Kunpeng Ecosystem Strategy &amp; openEuler Overview (pp. 258–260)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Kunpeng Ecosystem Strategy (p. 258)<\/strong>: <strong>\"Open hardware, open source software, partner enablement, and talent cultivation.\"<\/strong><\/li>\n<li><strong>Open Hardware<\/strong>: Huawei provides motherboards and components (SSDs, NICs, RAID cards) and prioritizes partners developing their own servers/PCs.<\/li>\n<li><strong>Open Source Software &amp; Partner Enablement<\/strong>: <strong>openEuler<\/strong> (OS), <strong>openGauss<\/strong> (database), <strong>Kunpeng DevKit<\/strong>, and <strong>Kunpeng BoostKit<\/strong>.<\/li>\n<li><strong>openEuler History (pp. 259–260)<\/strong>:<\/li>\n<li>Named after mathematician <strong>Leonhard Euler<\/strong>. Introduced as <strong>EulerOS in 2010<\/strong> (HPC project).<\/li>\n<li><strong>September 2019<\/strong>: EulerOS was officially open-sourced as <strong>openEuler<\/strong> (hosted on <strong>Gitee<\/strong>, docs at <code class=\"inline-code\">https://www.openeuler.org/en/<\/code>).<\/li>\n<li><strong>September 25, 2021<\/strong>: Released as an open-source digital infrastructure OS covering <strong>IT, CT, and OT<\/strong> (server, cloud, edge, embedded).<\/li>\n<li><strong>November 9, 2021<\/strong>: Donated to the <strong>OpenAtom Foundation<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. openEuler Key Technical Features (pp. 261–264)<\/h3>\n<ul class=\"md-list\">\n<li><strong>A-Tune (AI-Driven Automatic Resource Optimization, p. 261)<\/strong>: Uses non-intrusive system profiling and machine learning clustering/classification across 3 stages — <strong>Sensing<\/strong> (profiles workloads for Web, Big Data, AI, HPC, Database), <strong>Decision making<\/strong> (analyzes service models to dynamically schedule resource models), and <strong>Execution<\/strong> (applies optimal full-stack parameters in real time).<\/li>\n<li><strong>iSulad Container Solution (pp. 262–263)<\/strong>: Unlike Docker (written in Golang), <strong>iSulad<\/strong> (written in C/C++) is a lightweight universal container engine for CT and IT with fast bootup, low memory overhead, trusted boot, and hitless upgrade. Supports 3 container deployment models:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Application containers<\/strong>: Integrates <strong>Moby 18.09<\/strong> for user-defined apps.<\/li>\n<li><strong>Secure containers<\/strong>: Essentially VMs encapsulated with container interfaces; integrates <strong>Kata Containers 1.7<\/strong> with heterogeneous compute and DPDK/SPDK support.<\/li>\n<li><strong>System containers<\/strong>: Lightweight VM alternative isolating user namespaces with dynamic resource adjustment.<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>openEuler 22.03 LTS Features (p. 264)<\/strong>: Built on <strong>Linux kernel 5.10 LTS<\/strong> (23M lines of new code); uses <strong>systemd<\/strong> (compatible with SysV init); supports <strong>Kickstart<\/strong> automated installation, <strong>BiSheng Compiler<\/strong> (C, C++, Fortran), and MySQL/Spark/Hive/HBase tuning.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. openGauss Enterprise-Class Open Source Database (pp. 266–269)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Evolution &amp; License (pp. 266–267)<\/strong>: Internal incubation (2001–2011) \\rightarrow Joint productization (2011–2019) \\rightarrow <strong>GaussDB global release on May 15, 2019<\/strong> \\rightarrow <strong>openGauss open-sourced on June 30, 2020<\/strong> under the <strong>Mulan Permissive Software License v2 (Mulan PSL v2)<\/strong>.<\/li>\n<li><strong>Four Core Strengths of openGauss (pp. 268–269)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Superb Performance<\/strong>: Multi-core concurrency control + Kunpeng optimization reaching <strong>1,500,000 tpmC (1.5M tpmC)<\/strong> TPC-C benchmark on a <strong>Kunpeng 2-socket server<\/strong>; <strong>NUMA-aware data structures<\/strong> in the kernel; <strong>SQL bypass<\/strong> intelligent engine.<\/li>\n<li><strong>Constant Availability<\/strong>: Primary/standby sync, async, and <strong>cascaded standby<\/strong> deployment; <strong>Data page CRC check<\/strong> with automatic damaged-page restoration from standby; parallel recovery promoting <strong>standby to primary within 10 seconds (<code class=\"inline-code\">&lt; 10s<\/code> RTO)<\/strong>.<\/li>\n<li><strong>Rocksolid Security<\/strong>: <strong>Fully-encrypted computing<\/strong>, access control, encryption authentication, database audit, and dynamic data masking.<\/li>\n<li><strong>Easy O&amp;M<\/strong>: AI-based parameter tuning, index recommendation, slow SQL diagnosis, and online auto-learning SQL execution time forecasting.<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: openEuler A-Tune/iSulad & openGauss Feature Verification", "duration_mins": 8, "exercise_type": "config", "prompt_label": "root@openeuler-2203:~#", "scenario": "Configure the Kunpeng base software manifest verifying openEuler 22.03 LTS and openGauss technical specifications.", "instructions": ["Set `openeuler_2203_kernel` to `'5.10'`, `ai_tuning_engine` to `'A-Tune'`, and `container_engine` to `'iSulad'`.", "Set `opengauss_license` to `'Mulan PSL v2'` and `opengauss_2p_tpmc` to `1500000`.", "Set `opengauss_failover_seconds` to `10`."], "starter_code": "# openEuler & openGauss Technical Manifest\nopeneuler_specs:\n  open_source_year: 2019\n  foundation: \"OpenAtom Foundation\"\n  openeuler_2203_kernel: \"___\"\n  ai_tuning_engine: \"___\"\n  container_engine: \"___\"\n  automated_install_tool: \"kickstart\"\n\nopengauss_specs:\n  open_source_date: \"2020-06-30\"\n  opengauss_license: \"___\"\n  opengauss_2p_tpmc: ___\n  opengauss_failover_seconds: ___\n", "solution_code": "# openEuler & openGauss Technical Manifest\nopeneuler_specs:\n  open_source_year: 2019\n  foundation: \"OpenAtom Foundation\"\n  openeuler_2203_kernel: \"5.10\"\n  ai_tuning_engine: \"A-Tune\"\n  container_engine: \"iSulad\"\n  automated_install_tool: \"kickstart\"\n\nopengauss_specs:\n  open_source_date: \"2020-06-30\"\n  opengauss_license: \"Mulan PSL v2\"\n  opengauss_2p_tpmc: 1500000\n  opengauss_failover_seconds: 10\n", "hints": ["openEuler 22.03 LTS uses Linux kernel 5.10, A-Tune for AI tuning, and iSulad for lightweight containers.", "openGauss uses Mulan PSL v2, reaches 1,500,000 tpmC on 2-socket Kunpeng, and promotes standby to primary within 10 seconds."], "validation_checks": [{"step": 1, "description": "Verify openEuler 22.03 LTS kernel 5.10, A-Tune, and iSulad", "required_any": ["5.10", "a-tune", "isulad"], "feedback_fail": "Set openeuler_2203_kernel to '5.10', ai_tuning_engine to 'A-Tune', and container_engine to 'iSulad'."}, {"step": 2, "description": "Verify openGauss Mulan PSL v2 license and 1,500,000 tpmC benchmark", "required_any": ["mulan", "1500000"], "feedback_fail": "Set opengauss_license to 'Mulan PSL v2' and opengauss_2p_tpmc to 1500000."}, {"step": 3, "description": "Verify openGauss 10-second standby failover time", "required_any": ["10"], "feedback_fail": "Set opengauss_failover_seconds to 10."}], "simulated_output": "[OK] Kunpeng Software Ecosystem Manifest Verified:\n- openEuler 22.03 LTS: Linux Kernel 5.10 | A-Tune (Sensing/Decision/Execution) | iSulad (Moby/Kata/System) | BiSheng Compiler\n- openGauss: Open-sourced June 30, 2020 (Mulan PSL v2) | 1.5M tpmC (2P Kunpeng) | NUMA-aware + SQL Bypass | <10s Failover.", "quiz_questions": [{"id": "h5_s3_q1", "type": "single", "question": "Which AI-driven automatic optimization system in openEuler uses non-intrusive system profiling (Sensing, Decision making, and Execution) to match optimal resource models to service workloads in real time?", "options": ["A. iSulad", "B. A-Tune", "C. BiSheng Compiler", "D. Kickstart"], "answer": "B", "explanation": "According to Ch.04 p.261, A-Tune is openEuler's AI-driven automatic optimization system that operates through Sensing, Decision making, and Execution."}, {"id": "h5_s3_q2", "type": "multiple", "question": "Which of the following statements about the openGauss enterprise-class open-source database are true?", "options": ["A. openGauss went open source on June 30, 2020 under the Mulan Permissive Software License v2.", "B. It uses NUMA-aware data structures and SQL bypass technology, achieving 1,500,000 tpmC on 2-socket Kunpeng servers.", "C. It supports data page CRC checks (restoring damaged pages via the standby node) and promotes a standby node to primary within 10 seconds.", "D. It supports fully-encrypted computing, dynamic data masking, and AI-based parameter tuning and slow SQL diagnosis."], "answer": "ABCD", "explanation": "All four statements accurately describe openGauss features in Ch.04 pp. 266–269."}, {"id": "h5_s3_q3", "type": "single", "question": "In openEuler's iSulad container solution, which upstream project is integrated to implement 'secure containers' (VMs whose interfaces are encapsulated as container interfaces)?", "options": ["A. Moby 18.09", "B. Kata Containers 1.7", "C. Cloud Foundry", "D. OpenStack Nova"], "answer": "B", "explanation": "According to Ch.04 p.262, openEuler integrates Moby 18.09 for application containers and Kata Containers 1.7 for secure containers (which are essentially VMs with container interfaces)."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-Kunpeng-HPC-Solution-and-HPCKit", "exercise_slug": "08-Exercise-HPC-Application-Classification-and-HPCKit-Lab", "lecture": {"title": "Kunpeng HPC Solution, Workload Types & HPCKit Components", "duration_mins": 8, "pdf_ref": "Ch.04, pp. 270–282", "objectives": ["Understand the 3 paradigms of scientific research and classify HPC workloads into Memory-constrained, Computing-intensive, I/O-intensive, and Network-intensive", "Master the components of HPCKit: Hyper MPI (Open MPI 4.1.1 + Open UCX 1.10.1, MPI-3.1), KML (FFT, matrix/vector), and BiSheng Compiler (LLVM + Fortran + Autotuner)", "Analyze the Kunpeng Cloud HPC solution (PFS, 100G InfiniBand 1.5 us latency) and the petascale university supercomputing case study"], "content_markdown": "### 1. HPC Paradigms & Four Workload Categories (pp. 271–275)\n- **Three Paradigms in Scientific Research (p. 272)**: **Theoretical science**, **Experimental science**, and **Computing science (HPC)**. HPC reduces new vehicle time-to-market (TTM) from **60 months to 24 months** and drug discovery screening from **5,000 years on common computers to 100 days**.\n- **Four Categories of HPC Applications (p. 273 — High-Yield Exam Table!)**:\n\n| HPC Workload Category | Key Hardware Requirement | Representative Applications (p. 273) |\n| :--- | :--- | :--- |\n| **Memory-constrained** | Large memory capacity & high memory bandwidth | **Numerical calculation**, astrophysics, molecular dynamics simulation |\n| **Computing-intensive** | High-speed multi-core CPU | **Meteorology (weather forecasting), earthquake, and aerospace** |\n| **I/O-intensive** | High storage bandwidth & large-capacity shared storage | **Animation rendering and gene analysis (DNA sequence alignment/assembly)** |\n| **Network-intensive** | High-speed, low-latency node interconnection | **CAE simulation** (automotive, aviation, chip geometric modeling) |\n\n- **Four HPC Industry Challenges (p. 275)**: (1) Ever-increasing demand for computing, (2) Diverse industry applications, (3) Application, deployment, and management complexity/CAPEX, (4) Soaring power costs.\n\n---\n\n### 2. Huawei HPCKit Base Software Components (p. 276)\n**HPCKit** provides one-click deployment and collaborative optimization of three core components:\n1. **Hyper MPI (Communication Library)**:\n   - Built on **Open MPI 4.1.1** and **Open UCX 1.10.1**, supporting the **MPI-3.1 standard** for parallel computing.\n   - Provides an optimized collective communication framework and shared memory mechanism between nodes.\n2. **KML (Kunpeng Math Library)**:\n   - Hardware-accelerated mathematical library optimized for Kunpeng processors, supporting **Fast Fourier Transform (FFT)**, matrix calculation, vectorization, and trigonometric/logarithmic functions.\n3. **BiSheng Compiler**:\n   - High-performance compiler developed based on **LLVM** and optimized for Kunpeng, adding **Fortran front-end** support, middle-/back-end optimizations, and the **Autotuner** automatic tuning feature.\n\n---\n\n### 3. Kunpeng Cloud HPC, University Case Study & Chapter 04 Acronyms (pp. 277–282)\n- **Kunpeng Cloud HPC Highlights (p. 277)**:\n  - **30% higher price/performance ratio** than traditional solutions.\n  - Unique **Parallel File System (PFS)** supporting both **object storage and POSIX interfaces** without data copy operations, reducing TCO by **20%**.\n  - Supports **100G InfiniBand** (latency as low as **1.5 microseconds**) and **RDMA**.\n  - On-cloud one-click cluster provisioning improves cluster management efficiency by **90%**.\n- **University Petascale Supercomputing Case Study (p. 278)**:\n  - Deployed **720 Huawei full liquid-cooled high-density servers** in only **10 cabinets** (saving at least **CNY 170,000/year** in electricity fees), plus **20 TaiShan servers** for bioinformatics and fluid dynamics: **30,480 CPU cores**, **2.52 PFLOPS** peak performance, and **63.95% HPL efficiency** (up to **71%** on some nodes).\n- **Key Chapter 04 Acronyms (p. 282)**: **ISV** (*Independent Software Vendor*), **IHV** (*Independent Hardware Vendor*), **C&SI** (*Consulting and Systems Integration*), **SDK** (*Software Development Kit*).", "key_takeaways": ["Four HPC workload types (p. 273): Memory-constrained (numerical calculation/molecular dynamics), Computing-intensive (meteorology/earthquake/aerospace), I/O-intensive (animation rendering/gene analysis), and Network-intensive (CAE simulation).", "HPCKit consists of Hyper MPI (Open MPI 4.1.1 + Open UCX 1.10.1, MPI-3.1), KML (Kunpeng Math Library: FFT, matrix, vector), and BiSheng Compiler (LLVM-based with Fortran front-end and Autotuner).", "Kunpeng Cloud HPC uses Parallel File System (PFS) supporting both Object Storage and POSIX interfaces (-20% TCO) and 100G InfiniBand with 1.5 us latency."], "exam_traps": ["EXAM TRAP: Do not mix up the 4 HPC workload categories on p. 273: Gene analysis & animation rendering are I/O-INTENSIVE; CAE simulation is NETWORK-INTENSIVE; Meteorology/earthquake/aerospace are COMPUTING-INTENSIVE; Numerical calculation is MEMORY-CONSTRAINED!", "EXAM TRAP: BiSheng Compiler is developed based on LLVM (not GCC) and adds Fortran front-end support and Autotuner (p. 276)."], "content_html": "<h3>1. HPC Paradigms &amp; Four Workload Categories (pp. 271–275)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Three Paradigms in Scientific Research (p. 272)<\/strong>: <strong>Theoretical science<\/strong>, <strong>Experimental science<\/strong>, and <strong>Computing science (HPC)<\/strong>. HPC reduces new vehicle time-to-market (TTM) from <strong>60 months to 24 months<\/strong> and drug discovery screening from <strong>5,000 years on common computers to 100 days<\/strong>.<\/li>\n<li><strong>Four Categories of HPC Applications (p. 273 — High-Yield Exam Table!)<\/strong>:<\/li>\n<\/ul>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>HPC Workload Category<\/th><th>Key Hardware Requirement<\/th><th>Representative Applications (p. 273)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Memory-constrained<\/strong><\/td><td>Large memory capacity &amp; high memory bandwidth<\/td><td><strong>Numerical calculation<\/strong>, astrophysics, molecular dynamics simulation<\/td><\/tr>\n<tr><td><strong>Computing-intensive<\/strong><\/td><td>High-speed multi-core CPU<\/td><td><strong>Meteorology (weather forecasting), earthquake, and aerospace<\/strong><\/td><\/tr>\n<tr><td><strong>I/O-intensive<\/strong><\/td><td>High storage bandwidth &amp; large-capacity shared storage<\/td><td><strong>Animation rendering and gene analysis (DNA sequence alignment/assembly)<\/strong><\/td><\/tr>\n<tr><td><strong>Network-intensive<\/strong><\/td><td>High-speed, low-latency node interconnection<\/td><td><strong>CAE simulation<\/strong> (automotive, aviation, chip geometric modeling)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>Four HPC Industry Challenges (p. 275)<\/strong>: (1) Ever-increasing demand for computing, (2) Diverse industry applications, (3) Application, deployment, and management complexity/CAPEX, (4) Soaring power costs.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Huawei HPCKit Base Software Components (p. 276)<\/h3>\n<p><strong>HPCKit<\/strong> provides one-click deployment and collaborative optimization of three core components:<\/p>\n<ol class=\"md-list\">\n<li><strong>Hyper MPI (Communication Library)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Built on <strong>Open MPI 4.1.1<\/strong> and <strong>Open UCX 1.10.1<\/strong>, supporting the <strong>MPI-3.1 standard<\/strong> for parallel computing.<\/li>\n<li>Provides an optimized collective communication framework and shared memory mechanism between nodes.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>KML (Kunpeng Math Library)<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>Hardware-accelerated mathematical library optimized for Kunpeng processors, supporting <strong>Fast Fourier Transform (FFT)<\/strong>, matrix calculation, vectorization, and trigonometric/logarithmic functions.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>BiSheng Compiler<\/strong>:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li>High-performance compiler developed based on <strong>LLVM<\/strong> and optimized for Kunpeng, adding <strong>Fortran front-end<\/strong> support, middle-/back-end optimizations, and the <strong>Autotuner<\/strong> automatic tuning feature.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Kunpeng Cloud HPC, University Case Study &amp; Chapter 04 Acronyms (pp. 277–282)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Kunpeng Cloud HPC Highlights (p. 277)<\/strong>:<\/li>\n<li><strong>30% higher price/performance ratio<\/strong> than traditional solutions.<\/li>\n<li>Unique <strong>Parallel File System (PFS)<\/strong> supporting both <strong>object storage and POSIX interfaces<\/strong> without data copy operations, reducing TCO by <strong>20%<\/strong>.<\/li>\n<li>Supports <strong>100G InfiniBand<\/strong> (latency as low as <strong>1.5 microseconds<\/strong>) and <strong>RDMA<\/strong>.<\/li>\n<li>On-cloud one-click cluster provisioning improves cluster management efficiency by <strong>90%<\/strong>.<\/li>\n<li><strong>University Petascale Supercomputing Case Study (p. 278)<\/strong>:<\/li>\n<li>Deployed <strong>720 Huawei full liquid-cooled high-density servers<\/strong> in only <strong>10 cabinets<\/strong> (saving at least <strong>CNY 170,000/year<\/strong> in electricity fees), plus <strong>20 TaiShan servers<\/strong> for bioinformatics and fluid dynamics: <strong>30,480 CPU cores<\/strong>, <strong>2.52 PFLOPS<\/strong> peak performance, and <strong>63.95% HPL efficiency<\/strong> (up to <strong>71%<\/strong> on some nodes).<\/li>\n<li><strong>Key Chapter 04 Acronyms (p. 282)<\/strong>: <strong>ISV<\/strong> (<em>Independent Software Vendor<\/em>), <strong>IHV<\/strong> (<em>Independent Hardware Vendor<\/em>), <strong>C&amp;SI<\/strong> (<em>Consulting and Systems Integration<\/em>), <strong>SDK<\/strong> (<em>Software Development Kit<\/em>).<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: HPC Workload Classifier & HPCKit Toolchain Config", "duration_mins": 8, "exercise_type": "config", "prompt_label": "hpc-user@kunpeng-cluster:~#", "scenario": "Classify scientific workloads into the four official HPC categories and configure the HPCKit toolchain manifest.", "instructions": ["Map the workloads: `numerical_calculation` -> `'Memory-constrained'`, `meteorology_and_aerospace` -> `'Computing-intensive'`, `animation_and_gene_analysis` -> `'I/O-intensive'`, and `cae_simulation` -> `'Network-intensive'`.", "Set `bisheng_compiler_base` to `'LLVM'` and `hyper_mpi_standard` to `'MPI-3.1'`.", "Set `infiniband_100g_latency_us` to `1.5`."], "starter_code": "# HPC Workload & HPCKit Toolchain Configuration\nhpc_workload_classes:\n  numerical_calculation: \"___\"\n  meteorology_and_aerospace: \"___\"\n  animation_and_gene_analysis: \"___\"\n  cae_simulation: \"___\"\n\nhpckit_toolchain:\n  bisheng_compiler_base: \"___\"\n  bisheng_auto_tuning_feature: \"Autotuner\"\n  hyper_mpi_standard: \"___\"\n  math_library: \"KML\"\n  infiniband_100g_latency_us: ___\n", "solution_code": "# HPC Workload & HPCKit Toolchain Configuration\nhpc_workload_classes:\n  numerical_calculation: \"Memory-constrained\"\n  meteorology_and_aerospace: \"Computing-intensive\"\n  animation_and_gene_analysis: \"I/O-intensive\"\n  cae_simulation: \"Network-intensive\"\n\nhpckit_toolchain:\n  bisheng_compiler_base: \"LLVM\"\n  bisheng_auto_tuning_feature: \"Autotuner\"\n  hyper_mpi_standard: \"MPI-3.1\"\n  math_library: \"KML\"\n  infiniband_100g_latency_us: 1.5\n", "hints": ["Numerical calculation is Memory-constrained, Meteorology/Aerospace is Computing-intensive, Animation/Gene analysis is I/O-intensive, and CAE simulation is Network-intensive.", "BiSheng Compiler is based on LLVM; Hyper MPI supports MPI-3.1; 100G InfiniBand latency is 1.5 microseconds."], "validation_checks": [{"step": 1, "description": "Verify the 4 HPC workload categories", "required_any": ["memory-constrained", "computing-intensive", "i/o-intensive", "network-intensive"], "feedback_fail": "Check the four workload categories: Memory-constrained, Computing-intensive, I/O-intensive, and Network-intensive."}, {"step": 2, "description": "Verify LLVM base for BiSheng Compiler and MPI-3.1 for Hyper MPI", "required_any": ["llvm", "mpi-3.1"], "feedback_fail": "Set bisheng_compiler_base to 'LLVM' and hyper_mpi_standard to 'MPI-3.1'."}, {"step": 3, "description": "Verify 1.5 microsecond latency for 100G InfiniBand", "required_any": ["1.5"], "feedback_fail": "Set infiniband_100g_latency_us to 1.5."}], "simulated_output": "[OK] Kunpeng HPC Workload Classification & HPCKit Manifest Verified:\n- Workloads: Memory-constrained (Numerical) | Computing-intensive (Meteorology) | I/O-intensive (Gene/Animation) | Network-intensive (CAE)\n- HPCKit: BiSheng Compiler (LLVM + Fortran + Autotuner) + Hyper MPI (Open MPI 4.1.1 / UCX 1.10.1 / MPI-3.1) + KML\n- Cloud HPC: PFS (Object + POSIX, -20% TCO) | 100G IB (1.5 us latency).", "quiz_questions": [{"id": "h5_s4_q1", "type": "single", "question": "According to Chapter 04 (p. 273), how are 'animation rendering and gene analysis' and 'CAE simulation' classified among HPC application types?", "options": ["A. Animation/gene analysis is I/O-intensive; CAE simulation is Network-intensive", "B. Animation/gene analysis is Network-intensive; CAE simulation is Memory-constrained", "C. Animation/gene analysis is Computing-intensive; CAE simulation is I/O-intensive", "D. Both are classified exclusively as Memory-constrained"], "answer": "A", "explanation": "According to Ch.04 p.273: Numerical calculation is Memory-constrained; Meteorology, earthquake, and aerospace are Computing-intensive; Animation rendering and gene analysis are I/O-intensive; and CAE simulation is Network-intensive."}, {"id": "h5_s4_q2", "type": "multiple", "question": "Which of the following statements about the components of Huawei's HPCKit are true?", "options": ["A. Hyper MPI is based on Open MPI 4.1.1 and Open UCX 1.10.1 and supports the MPI-3.1 standard.", "B. The Kunpeng Math Library (KML) accelerates FFT, matrix calculation, vectorization, and trigonometric/logarithmic functions.", "C. The BiSheng Compiler is developed based on LLVM, supports the Fortran front-end, and integrates the Autotuner feature.", "D. HPCKit only runs on x86 CISC processors and does not support Arm processors."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.04, p.276). D is false because HPCKit is specifically optimized for Huawei Kunpeng (Arm) processors."}, {"id": "h5_s4_q3", "type": "single", "question": "In the Kunpeng Cloud HPC solution, which storage technology supports both object storage and POSIX interfaces without requiring data copy operations, reducing TCO by 20%?", "options": ["A. Parallel File System (PFS)", "B. FAT32", "C. NTFS", "D. Local SATA RAID 0"], "answer": "A", "explanation": "According to Ch.04 p.277, Huawei's unique Parallel File System (PFS) supports both object storage and POSIX interfaces without data copy operations, reducing TCO by 20%."}]}}]}, {"hour_number": 6, "folder_name": "Hour-06-Computing-Product-Deployment-Hardware-iBMC-BIOS-RAID", "title": "Computing Product Deployment: Equipment Room, iBMC, BIOS & RAID Configuration", "chapter_ref": "Chapter 05 Part 1 (pp. 284–325)", "duration_mins": 60, "overview": "Master data center equipment room layouts, cabinet/environmental/ESD standards, TaiShan 200 (2280) physical installation & power-on specs, default iBMC IP and user credentials, iBMC WebUI setup (firmware, NTP, VNC, SNMPv1/v2/v3), Remote Virtual Console (Private vs. Shared), BIOS POST & PXE configuration, and RAID/JBOD setup.", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-Equipment-Room-Layouts-ESD-and-Physical-Installation", "exercise_slug": "02-Exercise-Equipment-Room-Environment-and-Power-On-Checklist-Lab", "lecture": {"title": "Equipment Room Layouts, Environment/ESD Standards & Server Installation", "duration_mins": 7, "pdf_ref": "Ch.05, pp. 288–295", "objectives": ["Rank the 3 equipment room cooling/aisle layouts by resource utilization, rack power density, PUE, and safety", "Memorize cabinet standards (IEC 297, >1000 mm depth), ambient temperature/humidity, 800 mm clearance, and ESD rules", "Understand the TaiShan 200 (2280) installation workflow, 32 A AC / 63 A DC circuit breaker ratings, and default Power-On state"], "content_markdown": "### 1. Equipment Room Layouts Ranked by Efficiency & PUE (pp. 288–289)\nEquipment rooms can use **air-cooled** or **water-cooled** layouts across three aisle configurations. Ranked from **BEST (most optimal)** to **LEAST optimal** in terms of resource utilization, power density per rack, Power Usage Effectiveness (**PUE**), and safety:\n1. **Best Option**: **In-row air conditioners with contained aisles** (water-cooled or air-cooled).\n2. **Second Best**: **In-room air conditioners with contained aisles**.\n3. **Least Optimal**: **In-room air conditioners with open aisles**.\n\n---\n\n### 2. Cabinet, Ambient Environment & ESD Prevention Specifications (pp. 291–292)\n| Requirement Category | Official Specification (pp. 291–292) |\n| :--- | :--- |\n| **Cabinet Standard** | General **19-inch** cabinets, **exceeding 1,000 mm in depth**, conforming to **IEC 297** standard; air filters on front, AC power supplied from rear. |\n| **Ambient Temperature** | **5°C to 40°C** (41°F to 104°F) |\n| **Ambient Humidity** | **8% RH to 90% RH** (non-condensing) — Note: heating decreases indoor humidity and **increases static electricity**! |\n| **Space & Airflow** | **800 mm clearance** reserved at the **front and rear** of cabinets; front = **cool air intake**, rear = **hot air exhaust**. |\n| **ESD Prevention** | Lay ESD floors, use ESD chairs/mats/bags; ground all metal frames/chassis; remove conductive objects (watches, jewelry); wear **ESD clothing, ESD gloves, and ESD wrist strap** (one end contacts **bare skin**, the other plugged into the **ESD jack on the cabinet/chassis**); never touch pins, welding points, or exposed circuits. |\n\n---\n\n### 3. TaiShan 200 (2280) Installation Workflow & Power-On Specs (pp. 293–295)\n- **Five High-Level Deployment Phases (p. 293)**:\n  `Hardware installation` \\rightarrow `Power-on` \\rightarrow `Initialization` (Query mgmt IP \\rightarrow Log in to iBMC WebUI \\rightarrow Check server \\rightarrow Change initial password) \\rightarrow `Configuring the BIOS` \\rightarrow `Configuring RAID` \\rightarrow `Installing the OS` \\rightarrow `Driver installation`.\n- **Physical Mounting (p. 294)**: Support the server from the **bottom center of both sides**, place it onto the guide rails, slide it into the cabinet, align the mounting ears with the cabinet mounting bars, and tighten the **captive screws**.\n- **Power-On & Circuit Breaker Specifications (p. 295)**:\n  - External power circuit breaker current rating connected to the server: **32 A AC** or **63 A DC**.\n  - **Default Power-On Behavior**: The default value of *System State Upon Power Supply* is **Power on** — the server **automatically powers on as soon as power is supplied to the PSUs**! To change this, log in to the iBMC WebUI and choose **Power > Power Control**.", "key_takeaways": ["Equipment room layout ranking: In-row air conditioners with contained aisles (Best PUE/density) > In-room with contained aisles (2nd) > In-room with open aisles (Least optimal).", "Environment specs: 19-inch IEC 297 cabinet > 1,000 mm deep, 800 mm front/rear clearance, 5°C–40°C temperature, 8%–90% RH non-condensing humidity.", "External circuit breaker rating for TaiShan 200 (2280): 32 A AC or 63 A DC. By default, the server powers on automatically when PSUs receive power (configurable under iBMC Power > Power Control)."], "exam_traps": ["EXAM TRAP: Heating an equipment room DECREASES indoor relative humidity and INCREASES static electricity (ESD risk) (p. 292)!", "EXAM TRAP: By default, a TaiShan 200 (2280) server powers on AUTOMATICALLY when power is supplied to its PSUs ('System State Upon Power Supply' = 'Power on')."], "content_html": "<h3>1. Equipment Room Layouts Ranked by Efficiency &amp; PUE (pp. 288–289)<\/h3>\n<p>Equipment rooms can use <strong>air-cooled<\/strong> or <strong>water-cooled<\/strong> layouts across three aisle configurations. Ranked from <strong>BEST (most optimal)<\/strong> to <strong>LEAST optimal<\/strong> in terms of resource utilization, power density per rack, Power Usage Effectiveness (<strong>PUE<\/strong>), and safety:<\/p>\n<ol class=\"md-list\">\n<li><strong>Best Option<\/strong>: <strong>In-row air conditioners with contained aisles<\/strong> (water-cooled or air-cooled).<\/li>\n<li><strong>Second Best<\/strong>: <strong>In-room air conditioners with contained aisles<\/strong>.<\/li>\n<li><strong>Least Optimal<\/strong>: <strong>In-room air conditioners with open aisles<\/strong>.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Cabinet, Ambient Environment &amp; ESD Prevention Specifications (pp. 291–292)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Requirement Category<\/th><th>Official Specification (pp. 291–292)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Cabinet Standard<\/strong><\/td><td>General <strong>19-inch<\/strong> cabinets, <strong>exceeding 1,000 mm in depth<\/strong>, conforming to <strong>IEC 297<\/strong> standard; air filters on front, AC power supplied from rear.<\/td><\/tr>\n<tr><td><strong>Ambient Temperature<\/strong><\/td><td><strong>5°C to 40°C<\/strong> (41°F to 104°F)<\/td><\/tr>\n<tr><td><strong>Ambient Humidity<\/strong><\/td><td><strong>8% RH to 90% RH<\/strong> (non-condensing) — Note: heating decreases indoor humidity and <strong>increases static electricity<\/strong>!<\/td><\/tr>\n<tr><td><strong>Space &amp; Airflow<\/strong><\/td><td><strong>800 mm clearance<\/strong> reserved at the <strong>front and rear<\/strong> of cabinets; front = <strong>cool air intake<\/strong>, rear = <strong>hot air exhaust<\/strong>.<\/td><\/tr>\n<tr><td><strong>ESD Prevention<\/strong><\/td><td>Lay ESD floors, use ESD chairs/mats/bags; ground all metal frames/chassis; remove conductive objects (watches, jewelry); wear <strong>ESD clothing, ESD gloves, and ESD wrist strap<\/strong> (one end contacts <strong>bare skin<\/strong>, the other plugged into the <strong>ESD jack on the cabinet/chassis<\/strong>); never touch pins, welding points, or exposed circuits.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. TaiShan 200 (2280) Installation Workflow &amp; Power-On Specs (pp. 293–295)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Five High-Level Deployment Phases (p. 293)<\/strong>:<\/li>\n<\/ul>\n<p><code class=\"inline-code\">Hardware installation<\/code> \\rightarrow <code class=\"inline-code\">Power-on<\/code> \\rightarrow <code class=\"inline-code\">Initialization<\/code> (Query mgmt IP \\rightarrow Log in to iBMC WebUI \\rightarrow Check server \\rightarrow Change initial password) \\rightarrow <code class=\"inline-code\">Configuring the BIOS<\/code> \\rightarrow <code class=\"inline-code\">Configuring RAID<\/code> \\rightarrow <code class=\"inline-code\">Installing the OS<\/code> \\rightarrow <code class=\"inline-code\">Driver installation<\/code>.<\/p>\n<ul class=\"md-list\">\n<li><strong>Physical Mounting (p. 294)<\/strong>: Support the server from the <strong>bottom center of both sides<\/strong>, place it onto the guide rails, slide it into the cabinet, align the mounting ears with the cabinet mounting bars, and tighten the <strong>captive screws<\/strong>.<\/li>\n<li><strong>Power-On &amp; Circuit Breaker Specifications (p. 295)<\/strong>:<\/li>\n<li>External power circuit breaker current rating connected to the server: <strong>32 A AC<\/strong> or <strong>63 A DC<\/strong>.<\/li>\n<li><strong>Default Power-On Behavior<\/strong>: The default value of <em>System State Upon Power Supply<\/em> is <strong>Power on<\/strong> — the server <strong>automatically powers on as soon as power is supplied to the PSUs<\/strong>! To change this, log in to the iBMC WebUI and choose <strong>Power &gt; Power Control<\/strong>.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Data Center Site Survey & Power-On Specification Check", "duration_mins": 7, "exercise_type": "config", "prompt_label": "site-eng@dc-survey:~#", "scenario": "Complete the pre-installation site survey checklist for deploying TaiShan 200 (model 2280) servers in a customer equipment room.", "instructions": ["Set `optimal_cooling_layout` to `'In-row air conditioners with contained aisles'` and `cabinet_standard` to `'IEC 297'`.", "Set `min_cabinet_depth_mm` to `1000` and `front_rear_clearance_mm` to `800`.", "Set `ac_breaker_amps` to `32`, `dc_breaker_amps` to `63`, and `default_state_upon_power` to `'Power on'`."], "starter_code": "# Data Center Site Survey Checklist (TaiShan 200 2280)\nfacility_requirements:\n  optimal_cooling_layout: \"___\"\n  cabinet_standard: \"___\"\n  min_cabinet_depth_mm: ___\n  front_rear_clearance_mm: ___\n  temp_range_celsius: \"5 to 40\"\n  humidity_range_rh: \"8% to 90%\"\n\nelectrical_and_power:\n  ac_breaker_amps: ___\n  dc_breaker_amps: ___\n  default_state_upon_power: \"___\"\n", "solution_code": "# Data Center Site Survey Checklist (TaiShan 200 2280)\nfacility_requirements:\n  optimal_cooling_layout: \"In-row air conditioners with contained aisles\"\n  cabinet_standard: \"IEC 297\"\n  min_cabinet_depth_mm: 1000\n  front_rear_clearance_mm: 800\n  temp_range_celsius: \"5 to 40\"\n  humidity_range_rh: \"8% to 90%\"\n\nelectrical_and_power:\n  ac_breaker_amps: 32\n  dc_breaker_amps: 63\n  default_state_upon_power: \"Power on\"\n", "hints": ["In-row air conditioners with contained aisles is the best layout; cabinets conform to IEC 297 (>1000 mm depth) with 800 mm clearance.", "Circuit breakers are 32 A AC or 63 A DC, and the default state upon power supply is 'Power on'."], "validation_checks": [{"step": 1, "description": "Verify in-row contained aisle layout and IEC 297 standard", "required_any": ["in-row", "iec 297"], "feedback_fail": "Specify 'In-row air conditioners with contained aisles' and 'IEC 297'."}, {"step": 2, "description": "Verify >1000 mm cabinet depth and 800 mm front/rear clearance", "required_any": ["1000", "800"], "feedback_fail": "Set min_cabinet_depth_mm = 1000 and front_rear_clearance_mm = 800."}, {"step": 3, "description": "Verify 32 A AC, 63 A DC circuit breakers and 'Power on' default state", "required_any": ["32", "63", "power on"], "feedback_fail": "Set ac_breaker_amps = 32, dc_breaker_amps = 63, and default_state_upon_power = 'Power on'."}], "simulated_output": "[PASS] Equipment Room & Electrical Readiness Verified:\n- Layout: In-row air conditioners with contained aisles (Optimal PUE)\n- Cabinet: 19-inch IEC 297 (>1000 mm depth, 800 mm front/rear clearance, 5-40C, 8-90% RH)\n- Power: 32 A AC / 63 A DC breaker | Default System State Upon Power Supply: Power on.", "quiz_questions": [{"id": "h6_s1_q1", "type": "single", "question": "Among the three common equipment room air-conditioning and aisle layouts, which option is the BEST for optimizing resource utilization, power density per rack, PUE, and safety?", "options": ["A. In-room air conditioners with open aisles", "B. In-room air conditioners with contained aisles", "C. In-row air conditioners with contained aisles", "D. Natural convection without air conditioners or aisles"], "answer": "C", "explanation": "According to Ch.05 p.289, in-row air conditioners with contained aisles are the best option, followed by in-room air conditioners with contained aisles, while in-room air conditioners with open aisles are the least optimal."}, {"id": "h6_s1_q2"
