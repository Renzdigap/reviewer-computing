\", \"___\", \"microcomputers\", \"___\"]\none_u_cm = ___\nrack_width_inches = ___\nkunpeng_isa = \"___\"\nfirst_standard_x86_server = \"___\"\nprint(server_timeline, one_u_cm, rack_width_inches, kunpeng_isa, first_standard_x86_server)", "solution_code": "# Server Hardware & ISA Verification\nserver_timeline = [\"mainframes\", \"midrange\", \"microcomputers\", \"general-purpose\"]\none_u_cm = 4.45\nrack_width_inches = 19\nkunpeng_isa = \"RISC\"\nfirst_standard_x86_server = \"SystemPro\"\nprint(server_timeline, one_u_cm, rack_width_inches, kunpeng_isa, first_standard_x86_server)", "hints": ["Servers evolved from mainframes -> midrange -> microcomputers -> general-purpose servers.", "1U is 4.45 cm (1.75 in) in a 19-inch (48.26 cm) cabinet; Compaq SystemPro was the first standard x86 server."], "validation_checks": [{"step": 1, "description": "Verify chronological server evolution timeline", "required_any": ["midrange", "general-purpose"], "feedback_fail": "Ensure 'midrange' and 'general-purpose' are in server_timeline."}, {"step": 2, "description": "Verify 1U height (4.45 cm) and 19-inch rack standard", "required_any": ["4.45", "19"], "feedback_fail": "Set one_u_cm = 4.45 and rack_width_inches = 19."}, {"step": 3, "description": "Verify RISC architecture and Compaq SystemPro", "required_any": ["risc", "systempro"], "feedback_fail": "Set kunpeng_isa = 'RISC' and first_standard_x86_server = 'SystemPro'."}], "simulated_output": "['mainframes', 'midrange', 'microcomputers', 'general-purpose'] 4.45 19 RISC SystemPro\n[OK] Server timeline, 1U (4.45 cm) / 19-inch rack dimensions, and RISC ISA verified.", "quiz_questions": [{"id": "h2_s1_q1", "type": "tf", "question": "(Official Ch.02 Quiz Q1) Servers are developed from midrange computers to general-purpose servers and then to mainframe servers.", "options": ["A. True", "B. False"], "answer": "B", "explanation": "False. According to Ch.02 p.76 and p.124 Quiz Q1, servers evolved from Mainframes (1940s–1950s) -> Midrange computers (1960s–1970s) -> Microcomputers (1970s–1980s) -> General-purpose servers (1980s–1990s)."}, {"id": "h2_s1_q2", "type": "single", "question": "Which of the following statements about CISC and RISC processor instruction sets is FALSE?", "options": ["A. CISC uses complex instructions of varying lengths and is beneficial for compiler development.", "B. RISC uses a simplified instruction set with fixed instruction length and has higher requirements on compiler design.", "C. Huawei Kunpeng processors use the Arm architecture based on RISC.", "D. Software compiled for the CISC architecture can run directly on a RISC platform without modification or translation."], "answer": "D", "explanation": "According to Ch.02 p.83, software developed based on the CISC architecture cannot directly run on a RISC platform (and vice versa) because instruction formats and encoding modes differ."}, {"id": "h2_s1_q3", "type": "single", "question": "What are the standard height of 1U and the standard width of a data center rack cabinet?", "options": ["A. 1U = 4.45 cm; cabinet width = 19 inches (48.26 cm)", "B. 1U = 2.54 cm; cabinet width = 24 inches (60.96 cm)", "C. 1U = 8.90 cm; cabinet width = 19 inches (48.26 cm)", "D. 1U = 4.45 cm; cabinet width = 10 inches (25.40 cm)"], "answer": "A", "explanation": "1U is 1.75 inches (4.45 cm), 2U is 8.9 cm, 4U is 17.8 cm, and standard rack servers are installed in 19-inch (48.26 cm) cabinets (Ch.02, p.80)."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-System-Software-OS-Middleware-and-Databases", "exercise_slug": "04-Exercise-Database-Models-OLTP-OLAP-and-Sizing-Lab", "lecture": {"title": "System Software: Operating Systems, Middleware & Databases", "duration_mins": 8, "pdf_ref": "Ch.02, pp. 84–101", "objectives": ["Understand OS architecture (System Call Layer + Kernel) and compare Linux vs. Windows Server 2022 Standard and Datacenter editions", "Differentiate JBoss, Tomcat, WebLogic, and WebSphere middleware", "Master DBS components, Hierarchical vs. Network vs. Relational models, OLTP vs. OLAP, and 4-socket Kunpeng openGauss server sizing"], "content_markdown": "### 1. Operating Systems: Linux vs. Windows Server 2022 (pp. 85–89)\n- **OS Structure**: Consists of the **Kernel** (manages CPU, memory, and drive hardware) and the **System Call Layer** (provides APIs so engineers can develop software without directly accessing/damaging the kernel).\n- **Linux**: Open-source OS under **GNU GPL**. Distributions include **openEuler, Red Hat (RHEL), SUSE, and Ubuntu**. Used for **Website servers**, **Key financial/database applications** (openGauss, MySQL, Oracle), and **HPC** (GCC compilation, fluid mechanics).\n- **Windows Server**: Offers **LTSC** (Long-Term Servicing Channel, core stability/security) and **AC** (Annual Channel, frequent updates for containers/microservices). Common scenarios: **Domain controller (Active Directory)**, **Remote Desktop Service (RDS)**, and **Network server (DNS, DHCP, network controller)**.\n  - **Windows Server 2022 Standard vs. Datacenter (p. 88)**: Datacenter uniquely supports **Software-Defined Networking (SDN)**, **Storage Spaces Direct (S2D)**, **Network Controller**, and **unlimited VMs + 1 Hyper-V host** per license, whereas **Standard permits only 2 VMs + 1 Hyper-V host**.\n\n---\n\n### 2. Middleware & Runtime (pp. 90–91)\nMiddleware connects system software (OS) and application software across different architectures. **Runtime** refers to the runtime library/environment supporting program execution (e.g., **JRE, C#, Visual Basic .NET**).\n\n| Middleware | License | JEE / EJB Support & Target Scenario |\n| :--- | :--- | :--- |\n| **JBoss** | Open-source (**LGPL** — free for commercial use) | Complies with **JEE**; supports **EJB 1.1, 2.0, and 3**; SOA enterprise applications. |\n| **Tomcat** | Free, open-source (Apache/Sun) | Lightweight web server complying with **Servlet and JSP** specs; **does NOT support EJB**; used in SMEs with low concurrency. |\n| **WebLogic / WebSphere** | Closed-source commercial | Full **JEE** middleware with high scalability for large-scale enterprise projects. |\n\n---\n\n### 3. Databases, Data Models, OLTP vs. OLAP & Hardware Sizing (pp. 92–101)\n- **Database System (DBS)**: \DBS = \Database (DB) + \DBMS + \Database Applications$ (plus DBA and users). DBMS provides **DDL** (Data Definition Language), **DML** (Data Manipulation Language), operation management (integrity, security, concurrency, fault recovery), and maintenance utilities.\n- **Three Classical Database Models (p. 98 — Official Quiz Q2)**:\n  - **Hierarchical model** (e.g., IBM **IMS**): Tree structure; **only one root node** has no parent; all other nodes have **only one parent node**.\n  - **Network model**: **Allows more than one node to have no parent**, and **a node can have more than one parent**.\n  - **Relational model (born 1969)**: Two-dimensional tables (rows/tuples and columns/attributes); relationships must be normalized with indivisible atomic data items.\n  *(Exam Note: On Ch.02 p.98, the text explicitly defines **Network model** as allowing >1 node with >1 parent; however, the slide notes on p.124 printed `2. C` as an answer-key typo. Always know both the technical definition of Network model and the official slide text!)*\n\n| Feature | OLTP (On-Line Transaction Processing) | OLAP (On-Line Analytical Processing, Codd 1993) |\n| :--- | :--- | :--- |\n| **Orientation & Users** | **Transaction** / Clerks, DBAs | **Analysis** / Decision-making personnel |\n| **Data & Access** | **Current, detailed** / Read & write (short transactions) | **Historical, consolidated** / Mostly read (complex scans) |\n| **Records & Scale** | **Dozens** of records / **100 MB to GB** | **Millions** of records / **100 GB to TB** |\n| **Key Bottleneck / Metric** | **Memory efficiency**, TPS, SQL rate, concurrency | **Drive I/O bandwidth**, SQL duration, partitioning |\n\n- **Server Requirements for Databases (p. 101)**: Peak CPU load must **not exceed 85%**. Reference 4-socket Kunpeng openGauss 5.0.0+ configuration on **openEuler 20.03 LTS**: **TaiShan 200 (model 2480)**, **4 × Kunpeng 920 64-core CPUs**, **1 TB RAM**, **Hi1822 NIC (4 × 25GE, latency < 0.1 ms)**, **4 × NVMe SSDs** (V5 sequential write \≥ 2600\ MB/s).", "key_takeaways": ["Windows Server 2022 Datacenter supports unlimited VMs, SDN, Storage Spaces Direct, and Network Controller; Standard supports only 2 VMs per license.", "Tomcat supports Servlet/JSP but does NOT support EJB (use JBoss under LGPL or commercial WebLogic/WebSphere for EJB).", "Hierarchical model allows only 1 parent per node; Network model allows a node to have >1 parent and >1 root node.", "When selecting a database server CPU, peak CPU load must not exceed 85%."], "exam_traps": ["EXAM TRAP (Ch.02 Quiz Q2): Page 98 explicitly states under 'Network model': 'Allows more than one node to have no parent. A node can have more than one parent.' (Note that p.124 slide notes had a typo listing C; in standard Huawei exams, Network model is the multi-parent graph model).", "EXAM TRAP: Tomcat is lightweight and does NOT support EJB! If an enterprise requires open-source EJB support, choose JBoss (LGPL)."], "content_html": "<h3>1. Operating Systems: Linux vs. Windows Server 2022 (pp. 85–89)<\/h3>\n<ul class=\"md-list\">\n<li><strong>OS Structure<\/strong>: Consists of the <strong>Kernel<\/strong> (manages CPU, memory, and drive hardware) and the <strong>System Call Layer<\/strong> (provides APIs so engineers can develop software without directly accessing/damaging the kernel).<\/li>\n<li><strong>Linux<\/strong>: Open-source OS under <strong>GNU GPL<\/strong>. Distributions include <strong>openEuler, Red Hat (RHEL), SUSE, and Ubuntu<\/strong>. Used for <strong>Website servers<\/strong>, <strong>Key financial/database applications<\/strong> (openGauss, MySQL, Oracle), and <strong>HPC<\/strong> (GCC compilation, fluid mechanics).<\/li>\n<li><strong>Windows Server<\/strong>: Offers <strong>LTSC<\/strong> (Long-Term Servicing Channel, core stability/security) and <strong>AC<\/strong> (Annual Channel, frequent updates for containers/microservices). Common scenarios: <strong>Domain controller (Active Directory)<\/strong>, <strong>Remote Desktop Service (RDS)<\/strong>, and <strong>Network server (DNS, DHCP, network controller)<\/strong>.<\/li>\n<li><strong>Windows Server 2022 Standard vs. Datacenter (p. 88)<\/strong>: Datacenter uniquely supports <strong>Software-Defined Networking (SDN)<\/strong>, <strong>Storage Spaces Direct (S2D)<\/strong>, <strong>Network Controller<\/strong>, and <strong>unlimited VMs + 1 Hyper-V host<\/strong> per license, whereas <strong>Standard permits only 2 VMs + 1 Hyper-V host<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Middleware &amp; Runtime (pp. 90–91)<\/h3>\n<p>Middleware connects system software (OS) and application software across different architectures. <strong>Runtime<\/strong> refers to the runtime library/environment supporting program execution (e.g., <strong>JRE, C#, Visual Basic .NET<\/strong>).<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Middleware<\/th><th>License<\/th><th>JEE / EJB Support &amp; Target Scenario<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>JBoss<\/strong><\/td><td>Open-source (<strong>LGPL<\/strong> — free for commercial use)<\/td><td>Complies with <strong>JEE<\/strong>; supports <strong>EJB 1.1, 2.0, and 3<\/strong>; SOA enterprise applications.<\/td><\/tr>\n<tr><td><strong>Tomcat<\/strong><\/td><td>Free, open-source (Apache/Sun)<\/td><td>Lightweight web server complying with <strong>Servlet and JSP<\/strong> specs; <strong>does NOT support EJB<\/strong>; used in SMEs with low concurrency.<\/td><\/tr>\n<tr><td><strong>WebLogic / WebSphere<\/strong><\/td><td>Closed-source commercial<\/td><td>Full <strong>JEE<\/strong> middleware with high scalability for large-scale enterprise projects.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Databases, Data Models, OLTP vs. OLAP &amp; Hardware Sizing (pp. 92–101)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Database System (DBS)<\/strong>: \DBS = \Database (DB) + \DBMS + \Database Applications (plus DBA and users). DBMS provides <strong>DDL<\/strong> (Data Definition Language), <strong>DML<\/strong> (Data Manipulation Language), operation management (integrity, security, concurrency, fault recovery), and maintenance utilities.<\/li>\n<li><strong>Three Classical Database Models (p. 98 — Official Quiz Q2)<\/strong>:<\/li>\n<li><strong>Hierarchical model<\/strong> (e.g., IBM <strong>IMS<\/strong>): Tree structure; <strong>only one root node<\/strong> has no parent; all other nodes have <strong>only one parent node<\/strong>.<\/li>\n<li><strong>Network model<\/strong>: <strong>Allows more than one node to have no parent<\/strong>, and <strong>a node can have more than one parent<\/strong>.<\/li>\n<li><strong>Relational model (born 1969)<\/strong>: Two-dimensional tables (rows/tuples and columns/attributes); relationships must be normalized with indivisible atomic data items.<\/li>\n<\/ul>\n<p><em>(Exam Note: On Ch.02 p.98, the text explicitly defines <strong>Network model<\/strong> as allowing &gt;1 node with &gt;1 parent; however, the slide notes on p.124 printed <code class=\"inline-code\">2. C<\/code> as an answer-key typo. Always know both the technical definition of Network model and the official slide text!)<\/em><\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Feature<\/th><th>OLTP (On-Line Transaction Processing)<\/th><th>OLAP (On-Line Analytical Processing, Codd 1993)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Orientation &amp; Users<\/strong><\/td><td><strong>Transaction<\/strong> / Clerks, DBAs<\/td><td><strong>Analysis<\/strong> / Decision-making personnel<\/td><\/tr>\n<tr><td><strong>Data &amp; Access<\/strong><\/td><td><strong>Current, detailed<\/strong> / Read &amp; write (short transactions)<\/td><td><strong>Historical, consolidated<\/strong> / Mostly read (complex scans)<\/td><\/tr>\n<tr><td><strong>Records &amp; Scale<\/strong><\/td><td><strong>Dozens<\/strong> of records / <strong>100 MB to GB<\/strong><\/td><td><strong>Millions<\/strong> of records / <strong>100 GB to TB<\/strong><\/td><\/tr>\n<tr><td><strong>Key Bottleneck / Metric<\/strong><\/td><td><strong>Memory efficiency<\/strong>, TPS, SQL rate, concurrency<\/td><td><strong>Drive I/O bandwidth<\/strong>, SQL duration, partitioning<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>Server Requirements for Databases (p. 101)<\/strong>: Peak CPU load must <strong>not exceed 85%<\/strong>. Reference 4-socket Kunpeng openGauss 5.0.0+ configuration on <strong>openEuler 20.03 LTS<\/strong>: <strong>TaiShan 200 (model 2480)<\/strong>, <strong>4 × Kunpeng 920 64-core CPUs<\/strong>, <strong>1 TB RAM<\/strong>, <strong>Hi1822 NIC (4 × 25GE, latency &lt; 0.1 ms)<\/strong>, <strong>4 × NVMe SSDs<\/strong> (V5 sequential write \≥ 2600\ MB/s).<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Database Server Sizing & Middleware Selection", "duration_mins": 7, "exercise_type": "config", "prompt_label": "dba@opengauss-2480:~#", "scenario": "Configure the hardware and software specification sheet for deploying openGauss 5.0.0 on a 4-socket Kunpeng server and validate middleware/OS rules.", "instructions": ["Set `server_model` to `'TaiShan 200 2480'`, `max_cpu_peak_load_percent` to `85`, and `nic_chip` to `'Hi1822'`.", "Set `open_source_ejb_middleware` to `'JBoss'` and `lightweight_no_ejb_middleware` to `'Tomcat'`.", "Set `win2022_standard_max_vms` to `2`."], "starter_code": "# Database Server & Middleware Specification\nopengauss_4p_spec:\n  server_model: \"___\"\n  cpu_sockets_x_cores: \"4 x 64\"\n  memory_capacity: \"1 TB\"\n  max_cpu_peak_load_percent: ___\n  nic_chip: \"___\"\n  nvme_v5_seq_write_mbps: 2600\n\nsoftware_stack:\n  open_source_ejb_middleware: \"___\"\n  lightweight_no_ejb_middleware: \"___\"\n  win2022_standard_max_vms: ___\n", "solution_code": "# Database Server & Middleware Specification\nopengauss_4p_spec:\n  server_model: \"TaiShan 200 2480\"\n  cpu_sockets_x_cores: \"4 x 64\"\n  memory_capacity: \"1 TB\"\n  max_cpu_peak_load_percent: 85\n  nic_chip: \"Hi1822\"\n  nvme_v5_seq_write_mbps: 2600\n\nsoftware_stack:\n  open_source_ejb_middleware: \"JBoss\"\n  lightweight_no_ejb_middleware: \"Tomcat\"\n  win2022_standard_max_vms: 2\n", "hints": ["TaiShan 200 (model 2480) is the 2U 4-socket Kunpeng server; database CPU peak load should not exceed 85%.", "JBoss supports EJB under LGPL, while Tomcat only supports Servlet/JSP. Windows Server 2022 Standard allows 2 VMs."], "validation_checks": [{"step": 1, "description": "Verify TaiShan 2480 model, 85% peak CPU limit, and Hi1822 NIC", "required_any": ["2480", "85", "hi1822"], "feedback_fail": "Specify 'TaiShan 200 2480', 85, and 'Hi1822'."}, {"step": 2, "description": "Verify JBoss and Tomcat middleware distinction", "required_any": ["jboss", "tomcat"], "feedback_fail": "Set open_source_ejb_middleware to 'JBoss' and lightweight_no_ejb_middleware to 'Tomcat'."}, {"step": 3, "description": "Verify Windows Server 2022 Standard 2-VM limit", "required_any": ["2"], "feedback_fail": "Set win2022_standard_max_vms to 2."}], "simulated_output": "[OK] openGauss 4-Socket Hardware & System Software Spec Verified:\n- Server: TaiShan 200 (2480) | 4 x 64-core Kunpeng 920 | 1 TB RAM | Peak CPU <= 85%\n- Network: Hi1822 (4 x 25GE, latency < 0.1 ms) | Storage: 4 x NVMe (>= 2600 MB/s write)\n- Middleware: JBoss (LGPL, supports EJB) vs. Tomcat (Servlet/JSP only).", "quiz_questions": [{"id": "h2_s2_q1", "type": "single", "question": "According to the database model definitions in Chapter 02 (p. 98), which database model allows more than one node to have no parent and allows a node to have more than one parent?", "options": ["A. Hierarchical model", "B. Network model", "C. Relational model", "D. Transaction model"], "answer": "B", "explanation": "On Ch.02 p.98, the Network model is explicitly defined as: 'Allows more than one node to have no parent. A node can have more than one parent.' (Note: p.124 slide notes have a known typo 'C', whereas p.98 defines Network model)."}, {"id": "h2_s2_q2", "type": "single", "question": "Which of the following middleware products is open-source, complies with the LGPL license, and supports Enterprise JavaBeans (EJB) 1.1, 2.0, and 3?", "options": ["A. Tomcat", "B. JBoss", "C. WebLogic", "D. WebSphere"], "answer": "B", "explanation": "JBoss is open-source under LGPL and supports JEE and EJB 1.1, 2.0, and 3. Tomcat is open-source but only supports Servlet/JSP (not EJB). WebLogic and WebSphere are closed-source commercial software (Ch.02, p.91)."}, {"id": "h2_s2_q3", "type": "multiple", "question": "Which of the following statements accurately compare OLTP and OLAP systems?", "options": ["A. OLTP focuses on short, simple online transactions (read and write) and emphasizes memory efficiency and transaction throughput.", "B. OLAP focuses on complex analytical queries (mostly read) over historical data and emphasizes drive I/O bandwidth and query response time.", "C. Typical OLTP database scale is 100 MB to GB accessing dozens of records, whereas OLAP scale is 100 GB to TB accessing millions of records.", "D. When selecting a database server CPU, the peak CPU load should be allowed to reach 99% continuously."], "answer": "ABC", "explanation": "A, B, and C are accurate comparisons from Ch.02 pp. 99–100. D is false because p. 101 states that peak CPU load must not exceed 85% so that the database can respond quickly."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Cloud-OS-and-Huawei-FusionCompute-Virtualization", "exercise_slug": "06-Exercise-FusionCompute-Cluster-Hardware-Planning-Lab", "lecture": {"title": "Cloud OS & Huawei FusionCompute Virtualization Suite", "duration_mins": 7, "pdf_ref": "Ch.02, pp. 102–116", "objectives": ["Master virtualization terminology: Host Machine, Host OS, Hypervisor (VMM), Guest Machine (VM), and Guest OS", "Understand the FusionCompute virtualization suite (FusionCompute, FusionStorage Block, eBackup, UltraVR)", "Know the exact hardware requirements for deploying FusionCompute VRM and CNA compute nodes"], "content_markdown": "### 1. Virtualization Concepts & FusionCompute Suite (pp. 104–108)\nVirtualization creates an abstraction layer over physical hardware to decouple OSs from tight hardware binding, pooling resources via space or time division.\n- **Key Virtualization Terms (p. 105)**:\n  - **Host Machine**: The physical server providing underlying hardware resources.\n  - **Host OS**: The operating system running on the physical machine.\n  - **Hypervisor (Virtual Machine Monitor / VMM)**: The virtualization software layer that abstracts and schedules hardware.\n  - **Guest Machine**: The Virtual Machine (VM).\n  - **Guest OS**: The operating system running inside a VM.\n\n#### Huawei FusionCompute Virtualization Suite (pp. 107–108):\n- **FusionCompute**: Cloud OS software that virtualizes compute, storage, and network resources and centrally manages virtual, service, and user resources.\n- **FusionStorage Block**: Scale-out distributed block storage software deployed on general-purpose servers to consolidate local drives into a virtual storage pool.\n- **eBackup**: Virtualization backup software that works with **FusionCompute snapshots** and **Changed Block Tracking (CBT)** to back up VM data.\n- **UltraVR**: Disaster Recovery (DR) management software providing VM data protection via **asynchronous remote replication** of underlying SAN storage.\n\n---\n\n### 2. Virtual Computing, Storage, Network & Benefits (pp. 109–114)\n- **Virtual Storage (pp. 110–111)**: Aggregates SAN storage, Huawei distributed block storage, and local drives into **Data Stores**, allocating **Virtual Volumes** (`.raw` or `.QCOW2` files) to VMs. Supports features physical drives lack: **snapshots, online resizing, thin provisioning, QoS, and storage migration**.\n- **Virtual Network (p. 112)**: Uses a **Distributed Virtual Switch (DVS)** across multiple hosts. VMs connect to **Virtual Switching Ports** organized into **Port Groups** (isolated by **VLANs**, e.g., VLAN 100/200/300), while physical NICs connect to the DVS as **Uplinks**, ensuring network consistency during cross-host live migration.\n- **FusionCompute Benefits (pp. 113–114)**:\n  - **Resource & Time-based Sharing**: Increases physical server utilization from **5%–10% (before virtualization)** to **60%+ (after virtualization)** with a **1:5 to 1:10 consolidation ratio** (e.g., balancing daytime MMS server peaks `08:00–20:00` with nighttime WAP gateway peaks `22:00–04:00`).\n  - **High Availability (HA) vs. Live Migration**: If a node **fails**, **HA** detects the fault and **restarts** VMs on another healthy host. During **planned maintenance**, VMs are **migrated online (live migration)** without interrupting services.\n\n---\n\n### 3. Hardware Requirements for Deploying FusionCompute (pp. 115–116)\n| Resource | Official FusionCompute Requirement (pp. 115–116) |\n| :--- | :--- |\n| **CPU** | CPUs in the same cluster **must be of the same model** and support hardware virtualization (e.g., **Intel VT-x** enabled in BIOS; x86 Intel/Hygon or Arm **Kunpeng 920**/Phytium). |\n| **Memory** | At least **8 GB** (**48 GB or more** is recommended). Host memory \≥ Management VM memory + Host management domain memory. |\n| **System Drive** | **VRM (Virtual Resource Manager) node**: \≥ \270\ GB; **Compute node (CNA)**: \≥ \150\ GB. Recommended: **two SAS drives in RAID 1** for system drives (and RAID 1 for local VM storage). |\n| **Network Port** | \≥ \1 NIC interface; recommended **6 NICs** at **1000 Mbit/s (1 GE) or higher**. Network load should be \≤ \60\% of bandwidth. |", "key_takeaways": ["eBackup uses snapshots + Changed Block Tracking (CBT) for backup; UltraVR uses SAN asynchronous remote replication for Disaster Recovery (DR).", "Before virtualization, server utilization is 5%–10%; after virtualization with FusionCompute, integration ratio is 1:5 to 1:10 and server utilization reaches 60%+.", "FusionCompute hardware requirements: VRM system drive >= 270 GB, Compute node system drive >= 150 GB, RAM >= 8 GB (>= 48 GB recommended), >= 1 NIC (6 GE+ NICs recommended), network load <= 60%."], "exam_traps": ["EXAM TRAP: Do not swap the system drive capacities for FusionCompute: VRM node requires >= 270 GB, while Compute node requires >= 150 GB!", "EXAM TRAP: HA restarts VMs on another host after an unexpected node fault, whereas Live Migration moves running VMs online without service interruption during planned maintenance."], "content_html": "<h3>1. Virtualization Concepts &amp; FusionCompute Suite (pp. 104–108)<\/h3>\n<p>Virtualization creates an abstraction layer over physical hardware to decouple OSs from tight hardware binding, pooling resources via space or time division.<\/p>\n<ul class=\"md-list\">\n<li><strong>Key Virtualization Terms (p. 105)<\/strong>:<\/li>\n<li><strong>Host Machine<\/strong>: The physical server providing underlying hardware resources.<\/li>\n<li><strong>Host OS<\/strong>: The operating system running on the physical machine.<\/li>\n<li><strong>Hypervisor (Virtual Machine Monitor / VMM)<\/strong>: The virtualization software layer that abstracts and schedules hardware.<\/li>\n<li><strong>Guest Machine<\/strong>: The Virtual Machine (VM).<\/li>\n<li><strong>Guest OS<\/strong>: The operating system running inside a VM.<\/li>\n<\/ul>\n<h4>Huawei FusionCompute Virtualization Suite (pp. 107–108):<\/h4>\n<ul class=\"md-list\">\n<li><strong>FusionCompute<\/strong>: Cloud OS software that virtualizes compute, storage, and network resources and centrally manages virtual, service, and user resources.<\/li>\n<li><strong>FusionStorage Block<\/strong>: Scale-out distributed block storage software deployed on general-purpose servers to consolidate local drives into a virtual storage pool.<\/li>\n<li><strong>eBackup<\/strong>: Virtualization backup software that works with <strong>FusionCompute snapshots<\/strong> and <strong>Changed Block Tracking (CBT)<\/strong> to back up VM data.<\/li>\n<li><strong>UltraVR<\/strong>: Disaster Recovery (DR) management software providing VM data protection via <strong>asynchronous remote replication<\/strong> of underlying SAN storage.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Virtual Computing, Storage, Network &amp; Benefits (pp. 109–114)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Virtual Storage (pp. 110–111)<\/strong>: Aggregates SAN storage, Huawei distributed block storage, and local drives into <strong>Data Stores<\/strong>, allocating <strong>Virtual Volumes<\/strong> (<code class=\"inline-code\">.raw<\/code> or <code class=\"inline-code\">.QCOW2<\/code> files) to VMs. Supports features physical drives lack: <strong>snapshots, online resizing, thin provisioning, QoS, and storage migration<\/strong>.<\/li>\n<li><strong>Virtual Network (p. 112)<\/strong>: Uses a <strong>Distributed Virtual Switch (DVS)<\/strong> across multiple hosts. VMs connect to <strong>Virtual Switching Ports<\/strong> organized into <strong>Port Groups<\/strong> (isolated by <strong>VLANs<\/strong>, e.g., VLAN 100/200/300), while physical NICs connect to the DVS as <strong>Uplinks<\/strong>, ensuring network consistency during cross-host live migration.<\/li>\n<li><strong>FusionCompute Benefits (pp. 113–114)<\/strong>:<\/li>\n<li><strong>Resource &amp; Time-based Sharing<\/strong>: Increases physical server utilization from <strong>5%–10% (before virtualization)<\/strong> to <strong>60%+ (after virtualization)<\/strong> with a <strong>1:5 to 1:10 consolidation ratio<\/strong> (e.g., balancing daytime MMS server peaks <code class=\"inline-code\">08:00–20:00<\/code> with nighttime WAP gateway peaks <code class=\"inline-code\">22:00–04:00<\/code>).<\/li>\n<li><strong>High Availability (HA) vs. Live Migration<\/strong>: If a node <strong>fails<\/strong>, <strong>HA<\/strong> detects the fault and <strong>restarts<\/strong> VMs on another healthy host. During <strong>planned maintenance<\/strong>, VMs are <strong>migrated online (live migration)<\/strong> without interrupting services.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Hardware Requirements for Deploying FusionCompute (pp. 115–116)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Resource<\/th><th>Official FusionCompute Requirement (pp. 115–116)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>CPU<\/strong><\/td><td>CPUs in the same cluster <strong>must be of the same model<\/strong> and support hardware virtualization (e.g., <strong>Intel VT-x<\/strong> enabled in BIOS; x86 Intel/Hygon or Arm <strong>Kunpeng 920<\/strong>/Phytium).<\/td><\/tr>\n<tr><td><strong>Memory<\/strong><\/td><td>At least <strong>8 GB<\/strong> (<strong>48 GB or more<\/strong> is recommended). Host memory \≥ Management VM memory + Host management domain memory.<\/td><\/tr>\n<tr><td><strong>System Drive<\/strong><\/td><td><strong>VRM (Virtual Resource Manager) node<\/strong>: \≥ \270\ GB; <strong>Compute node (CNA)<\/strong>: \≥ \150\ GB. Recommended: <strong>two SAS drives in RAID 1<\/strong> for system drives (and RAID 1 for local VM storage).<\/td><\/tr>\n<tr><td><strong>Network Port<\/strong><\/td><td>\≥ \1 NIC interface; recommended <strong>6 NICs<\/strong> at <strong>1000 Mbit/s (1 GE) or higher<\/strong>. Network load should be \≤ \60\% of bandwidth.<\/td><\/tr>\n<\/tbody><\/table><\/div>"}, "exercise": {"title": "Hands-On Lab: FusionCompute Cluster Readiness Check", "duration_mins": 8, "exercise_type": "config", "prompt_label": "admin@fusioncompute-vrm:~#", "scenario": "You are validating a server bill-of-materials (BOM) before deploying Huawei FusionCompute VRM and CNA compute nodes.", "instructions": ["Set `vrm_min_system_disk_gb` to `270` and `compute_node_min_system_disk_gb` to `150`.", "Set `recommended_system_raid` to `'RAID 1'`, `min_memory_gb` to `8`, and `recommended_memory_gb` to `48`.", "Set `backup_component` to `'eBackup'` and `dr_component` to `'UltraVR'`."], "starter_code": "# FusionCompute Pre-Deployment Check\ncluster_requirements:\n  vrm_min_system_disk_gb: ___\n  compute_node_min_system_disk_gb: ___\n  recommended_system_raid: \"___\"\n  min_memory_gb: ___\n  recommended_memory_gb: ___\n  max_network_load_percent: 60\n\nsuite_components:\n  backup_component: \"___\"\n  dr_component: \"___\"\n", "solution_code": "# FusionCompute Pre-Deployment Check\ncluster_requirements:\n  vrm_min_system_disk_gb: 270\n  compute_node_min_system_disk_gb: 150\n  recommended_system_raid: \"RAID 1\"\n  min_memory_gb: 8\n  recommended_memory_gb: 48\n  max_network_load_percent: 60\n\nsuite_components:\n  backup_component: \"eBackup\"\n  dr_component: \"UltraVR\"\n", "hints": ["On page 115, VRM system drive >= 270 GB, compute node system drive >= 150 GB, minimum memory is 8 GB (48 GB recommended), and two SAS drives in RAID 1 are recommended.", "eBackup provides CBT-based VM backup; UltraVR provides DR management."], "validation_checks": [{"step": 1, "description": "Verify VRM (270 GB) and Compute Node (150 GB) minimum system disk sizes", "required_any": ["270", "150"], "feedback_fail": "Set vrm_min_system_disk_gb to 270 and compute_node_min_system_disk_gb to 150."}, {"step": 2, "description": "Verify RAID 1 recommendation and 8 GB / 48 GB memory thresholds", "required_any": ["raid 1", "48"], "feedback_fail": "Set recommended_system_raid to 'RAID 1', min_memory_gb to 8, and recommended_memory_gb to 48."}, {"step": 3, "description": "Verify eBackup and UltraVR suite components", "required_any": ["ebackup", "ultravr"], "feedback_fail": "Set backup_component to 'eBackup' and dr_component to 'UltraVR'."}], "simulated_output": "[PASS] FusionCompute Cluster BOM Validated:\n- VRM Disk >= 270 GB | Compute Disk >= 150 GB (SAS RAID 1)\n- Memory: 8 GB min / 48 GB+ recommended | Network load <= 60%\n- Suite: FusionCompute + FusionStorage Block + eBackup (CBT) + UltraVR (DR).", "quiz_questions": [{"id": "h2_s3_q1", "type": "single", "question": "When deploying Huawei FusionCompute on physical servers, what are the minimum system drive capacities required for the Virtual Resource Manager (VRM) node and each compute node?", "options": ["A. VRM >= 150 GB; Compute node >= 270 GB", "B. VRM >= 270 GB; Compute node >= 150 GB", "C. VRM >= 500 GB; Compute node >= 300 GB", "D. VRM >= 100 GB; Compute node >= 100 GB"], "answer": "B", "explanation": "According to Ch.02 p.115, the system drive on the VRM node must be >= 270 GB, and the system drive on each compute node must be >= 150 GB."}, {"id": "h2_s3_q2", "type": "single", "question": "In the FusionCompute virtualization suite, which component works with snapshots and Changed Block Tracking (CBT) to back up VM data, and which provides Disaster Recovery (DR) via SAN asynchronous remote replication?", "options": ["A. UltraVR (backup) and eBackup (DR)", "B. eBackup (backup) and UltraVR (DR)", "C. FusionStorage (backup) and FusionAccess (DR)", "D. DVS (backup) and VRM (DR)"], "answer": "B", "explanation": "eBackup works with FusionCompute snapshots and CBT to back up VM data, whereas UltraVR is disaster recovery (DR) management software using SAN asynchronous remote replication (Ch.02, pp. 107–108)."}, {"id": "h2_s3_q3", "type": "multiple", "question": "Which of the following statements about FusionCompute virtual networking and virtual storage are true?", "options": ["A. A Distributed Virtual Switch (DVS) connects to VMs via virtual ports and to physical NICs on hosts via uplinks.", "B. Virtual storage supports snapshots, thin provisioning, QoS, and online resizing, which physical drives alone cannot provide.", "C. Before virtualization, typical server utilization is 5% to 10%; after virtualization, it can reach 60% or higher.", "D. Servers in the same FusionCompute cluster can freely mix Intel x86 and Kunpeng Arm CPUs in a single live-migration pool."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.02, pp. 110–113). D is false because CPUs on servers in the same cluster must be of the same model and support hardware virtualization (Ch.02, p.115)."}]}}, {"sprint_number": 4, "lecture_slug": "07-Lecture-Computing-Solutions-Kunpeng-HPC-MRS-and-ModelArts", "exercise_slug": "08-Exercise-Kunpeng-HPC-and-Cloud-BigData-Solution-Lab", "lecture": {"title": "Computing System Solutions: Kunpeng HPC, Huawei Cloud MRS & ModelArts", "duration_mins": 8, "pdf_ref": "Ch.02, pp. 117–128", "objectives": ["Master the full-stack Kunpeng HPC architecture (Hardware platform, DonauKit, HPCKit, DevKit)", "Distinguish open-source vs. commercial software ecosystems across HPC industries (Ch.02 Quiz Q3 trap!)", "Understand Huawei Cloud Big Data Solution (MRS, DWS, DLI, DataArts Studio, GES, CSS) and ModelArts AI platform"], "content_markdown": "### 1. Kunpeng Full-Stack HPC Solution Architecture (pp. 118–122)\nHuawei's Kunpeng HPC solution delivers **20% higher computing power**, **80%+ HPL efficiency**, **40% higher energy efficiency**, and **15%+ higher application performance** than competing domestic x86 vendors:\n- **Hardware Platform**:\n  - **Computing subsystem**: Kunpeng series CPUs across three server forms.\n  - **Network subsystem**: Evolution from **RoCE v2 to Lingqu**, fixed and modular switches.\n  - **Storage subsystem**: **OceanStor Pacific** and **OceanDisk** high-density storage + homegrown parallel file system **OceanFS**.\n- **Software Subsystem**:\n  - **DonauKit**: Cluster management (**Donau Portal**) + Job scheduling (**Donau Scheduler**).\n  - **HPCKit**: Communication library (**Hyper MPI**), Math library & solver (**KML** — Kunpeng Math Library), and Compilers (**BiSheng Compiler / GCC**).\n  - **DevKit**: Performance profiling, code porting, Kunpeng affinity code optimization, I/O optimization.\n\n---\n\n### 2. HPC Industry Software Ecosystems (pp. 119–122 — Official Quiz Q3 Trap!)\nMost software in the HPC ecosystem is **open source**, while **commercial closed-source software** is mainly used in **manufacturing, EDA, and oil & gas**:\n\n| HPC Industry Field | Software Ecosystem Characteristic | Typical Applications & Migration Progress |\n| :--- | :--- | :--- |\n| **Scientific Research / Education** | **Open source software mainly (>80% in physics/chemistry)** | **VASP, Gaussian, GROMACS, LAMMPS, NAMD, CP2K, Amber, Wannier90, Q-Chem**; 400+ projects migrated covering **90%** of compute needs. |\n| **Meteorology & Oceanography** | **Open source software mainly (80% open source, 20% in-house)** | **WRF** (most common, fp32 single-precision 180 GFlops, 180 GB/s bandwidth, Bcast small packets), **GRAPES, NEMO, FVCOM, ROMS, CESM, CMAQ**; 30+ apps covering **99%** of ecosystem. |\n| **Life Sciences** | **Open source software mainly** | Gene sequencing (**GATK, BWA, BLAST, Bowtie2**), Cryo-EM (**RELION, EMAN**), Drug discovery (**AutoDock, GROMACS**); 1,000+ apps (incl. Bioconda) covering **80%** of compute needs. |\n| **Manufacturing Simulation (CAE)** | **Commercial software mainly** | Crash/Structural (**Abaqus, LS-DYNA, ANSYS Mechanical, Radioss, COMSOL**), Fluid (**Fluent, Star-CCM+, CFX, OpenFOAM**), EM (**HFSS, Maxwell**); 3 native + 20+ binary transcoding enablers. |\n\n---\n\n### 3. Huawei Cloud Big Data (MRS) & ModelArts AI Solutions (pp. 123–125)\n- **Huawei Cloud Big Data Solution (p. 123)**: Built on an enterprise data lake with storage-compute decoupling (**OBS / HDFS**) and Kunpeng optimization:\n  - **MRS (MapReduce Service)**: One-stop big data platform running **HBase, CarbonData, Hive, Spark, SparkSQL, Presto, Flink, Storm, Kafka, Flume, Loader, MapReduce, Tez, MLlib**.\n  - **DWS**: Data Warehouse Service; **DLI**: Data Lake Insight; **CSS**: Cloud Search Service; **GES**: Graph Engine Service; **DataArts Studio**: Unified data integration, governance, and development; **DLV**: Data Visualization; **ROMA**: IoT access.\n- **ModelArts (p. 125 Quiz Q3)**: Huawei Cloud's one-stop AI development platform enabling developers to quickly create, train, and deploy models.", "key_takeaways": ["Kunpeng HPC hardware platform uses OceanStor Pacific / OceanDisk with OceanFS for storage, and RoCE v2 / Lingqu for networking.", "DonauKit provides Donau Portal (cluster management) and Donau Scheduler (job scheduling); HPCKit provides Hyper MPI, KML, and BiSheng Compiler.", "Education/scientific research, meteorology, and life sciences mainly use OPEN-SOURCE software (>80%), whereas Manufacturing, EDA, and Oil & Gas mainly use COMMERCIAL software!", "Huawei Cloud MRS runs open-source big data components (HBase, Kafka, Spark, Hive, Flink), and ModelArts is a one-stop AI development platform."], "exam_traps": ["EXAM TRAP (Ch.02 Quiz Q3): Option B states 'Most applications in the education and scientific research fields are closed-source.' -> FALSE! Over 80% of applications in education/scientific research, meteorology, and life sciences are OPEN-SOURCE. Only manufacturing/EDA/oil & gas are mainly commercial/closed-source!"], "content_html": "<h3>1. Kunpeng Full-Stack HPC Solution Architecture (pp. 118–122)<\/h3>\n<p>Huawei's Kunpeng HPC solution delivers <strong>20% higher computing power<\/strong>, <strong>80%+ HPL efficiency<\/strong>, <strong>40% higher energy efficiency<\/strong>, and <strong>15%+ higher application performance<\/strong> than competing domestic x86 vendors:<\/p>\n<ul class=\"md-list\">\n<li><strong>Hardware Platform<\/strong>:<\/li>\n<li><strong>Computing subsystem<\/strong>: Kunpeng series CPUs across three server forms.<\/li>\n<li><strong>Network subsystem<\/strong>: Evolution from <strong>RoCE v2 to Lingqu<\/strong>, fixed and modular switches.<\/li>\n<li><strong>Storage subsystem<\/strong>: <strong>OceanStor Pacific<\/strong> and <strong>OceanDisk<\/strong> high-density storage + homegrown parallel file system <strong>OceanFS<\/strong>.<\/li>\n<li><strong>Software Subsystem<\/strong>:<\/li>\n<li><strong>DonauKit<\/strong>: Cluster management (<strong>Donau Portal<\/strong>) + Job scheduling (<strong>Donau Scheduler<\/strong>).<\/li>\n<li><strong>HPCKit<\/strong>: Communication library (<strong>Hyper MPI<\/strong>), Math library &amp; solver (<strong>KML<\/strong> — Kunpeng Math Library), and Compilers (<strong>BiSheng Compiler / GCC<\/strong>).<\/li>\n<li><strong>DevKit<\/strong>: Performance profiling, code porting, Kunpeng affinity code optimization, I/O optimization.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. HPC Industry Software Ecosystems (pp. 119–122 — Official Quiz Q3 Trap!)<\/h3>\n<p>Most software in the HPC ecosystem is <strong>open source<\/strong>, while <strong>commercial closed-source software<\/strong> is mainly used in <strong>manufacturing, EDA, and oil &amp; gas<\/strong>:<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>HPC Industry Field<\/th><th>Software Ecosystem Characteristic<\/th><th>Typical Applications &amp; Migration Progress<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Scientific Research / Education<\/strong><\/td><td><strong>Open source software mainly (&gt;80% in physics/chemistry)<\/strong><\/td><td><strong>VASP, Gaussian, GROMACS, LAMMPS, NAMD, CP2K, Amber, Wannier90, Q-Chem<\/strong>; 400+ projects migrated covering <strong>90%<\/strong> of compute needs.<\/td><\/tr>\n<tr><td><strong>Meteorology &amp; Oceanography<\/strong><\/td><td><strong>Open source software mainly (80% open source, 20% in-house)<\/strong><\/td><td><strong>WRF<\/strong> (most common, fp32 single-precision 180 GFlops, 180 GB/s bandwidth, Bcast small packets), <strong>GRAPES, NEMO, FVCOM, ROMS, CESM, CMAQ<\/strong>; 30+ apps covering <strong>99%<\/strong> of ecosystem.<\/td><\/tr>\n<tr><td><strong>Life Sciences<\/strong><\/td><td><strong>Open source software mainly<\/strong><\/td><td>Gene sequencing (<strong>GATK, BWA, BLAST, Bowtie2<\/strong>), Cryo-EM (<strong>RELION, EMAN<\/strong>), Drug discovery (<strong>AutoDock, GROMACS<\/strong>); 1,000+ apps (incl. Bioconda) covering <strong>80%<\/strong> of compute needs.<\/td><\/tr>\n<tr><td><strong>Manufacturing Simulation (CAE)<\/strong><\/td><td><strong>Commercial software mainly<\/strong><\/td><td>Crash/Structural (<strong>Abaqus, LS-DYNA, ANSYS Mechanical, Radioss, COMSOL<\/strong>), Fluid (<strong>Fluent, Star-CCM+, CFX, OpenFOAM<\/strong>), EM (<strong>HFSS, Maxwell<\/strong>); 3 native + 20+ binary transcoding enablers.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>---<\/p>\n<h3>3. Huawei Cloud Big Data (MRS) &amp; ModelArts AI Solutions (pp. 123–125)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Huawei Cloud Big Data Solution (p. 123)<\/strong>: Built on an enterprise data lake with storage-compute decoupling (<strong>OBS / HDFS<\/strong>) and Kunpeng optimization:<\/li>\n<li><strong>MRS (MapReduce Service)<\/strong>: One-stop big data platform running <strong>HBase, CarbonData, Hive, Spark, SparkSQL, Presto, Flink, Storm, Kafka, Flume, Loader, MapReduce, Tez, MLlib<\/strong>.<\/li>\n<li><strong>DWS<\/strong>: Data Warehouse Service; <strong>DLI<\/strong>: Data Lake Insight; <strong>CSS<\/strong>: Cloud Search Service; <strong>GES<\/strong>: Graph Engine Service; <strong>DataArts Studio<\/strong>: Unified data integration, governance, and development; <strong>DLV<\/strong>: Data Visualization; <strong>ROMA<\/strong>: IoT access.<\/li>\n<li><strong>ModelArts (p. 125 Quiz Q3)<\/strong>: Huawei Cloud's one-stop AI development platform enabling developers to quickly create, train, and deploy models.<\/li>\n<\/ul>"}, "exercise": {"title": "Hands-On Lab: Kunpeng HPC Stack & Cloud Solution Verification", "duration_mins": 8, "exercise_type": "config", "prompt_label": "hpc-admin@donau-portal:~#", "scenario": "Configure the Kunpeng HPC solution stack manifest and verify the industry software ecosystem characteristics for the Huawei ICT Competition.", "instructions": ["Set `hpc_storage_product` to `'OceanStor Pacific'` and `parallel_filesystem` to `'OceanFS'`.", "Set `cluster_scheduler_suite` to `'DonauKit'` and `compiler_mpi_math_suite` to `'HPCKit'`.", "Set `education_research_software_type` to `'open-source'` and `manufacturing_cae_software_type` to `'commercial'`."], "starter_code": "# Kunpeng HPC & Cloud Solution Blueprint\nkunpeng_hpc_stack:\n  hpc_storage_product: \"___\"\n  parallel_filesystem: \"___\"\n  cluster_scheduler_suite: \"___\"\n  compiler_mpi_math_suite: \"___\"\n\necosystem_characteristics:\n  education_research_software_type: \"___\"\n  meteorology_software_type: \"open-source\"\n  manufacturing_cae_software_type: \"___\"\n\nhuawei_cloud_services:\n  big_data_platform: \"MRS\"\n  ai_one_stop_platform: \"ModelArts\"\n", "solution_code": "# Kunpeng HPC & Cloud Solution Blueprint\nkunpeng_hpc_stack:\n  hpc_storage_product: \"OceanStor Pacific\"\n  parallel_filesystem: \"OceanFS\"\n  cluster_scheduler_suite: \"DonauKit\"\n  compiler_mpi_math_suite: \"HPCKit\"\n\necosystem_characteristics:\n  education_research_software_type: \"open-source\"\n  meteorology_software_type: \"open-source\"\n  manufacturing_cae_software_type: \"commercial\"\n\nhuawei_cloud_services:\n  big_data_platform: \"MRS\"\n  ai_one_stop_platform: \"ModelArts\"\n", "hints": ["The HPC storage subsystem uses OceanStor Pacific and OceanFS; DonauKit handles cluster management/scheduling; HPCKit includes Hyper MPI, KML, and BiSheng Compiler.", "Education/research and meteorology are mainly open-source, while manufacturing simulation is mainly commercial."], "validation_checks": [{"step": 1, "description": "Verify OceanStor Pacific and OceanFS in HPC storage", "required_any": ["oceanstor pacific", "oceanfs"], "feedback_fail": "Set hpc_storage_product to 'OceanStor Pacific' and parallel_filesystem to 'OceanFS'."}, {"step": 2, "description": "Verify DonauKit and HPCKit software suites", "required_any": ["donaukit", "hpckit"], "feedback_fail": "Set cluster_scheduler_suite to 'DonauKit' and compiler_mpi_math_suite to 'HPCKit'."}, {"step": 3, "description": "Verify open-source (education/research) vs commercial (manufacturing)", "required_any": ["open-source", "commercial"], "feedback_fail": "Set education_research_software_type to 'open-source' and manufacturing_cae_software_type to 'commercial'."}], "simulated_output": "[OK] Kunpeng HPC & Huawei Cloud Solution Blueprint Validated:\n- Storage: OceanStor Pacific + OceanFS | Network: RoCE v2 -> Lingqu\n- Software: DonauKit (Donau Portal + Scheduler) + HPCKit (Hyper MPI + KML + BiSheng Compiler) + DevKit\n- Ecosystem: Education/Research & Meteorology (>80% Open-Source) vs. Manufacturing (Commercial).", "quiz_questions": [{"id": "h2_s4_q1", "type": "multiple", "question": "(Official Ch.02 Quiz Q3) Which of the following statements are true about computing system solutions?", "options": ["A. The storage subsystem of the HPC solution hardware platform can be built using OceanStor Pacific products.", "B. Most applications in the education and scientific research fields are closed-source. The Kunpeng HPC ecosystem is accelerating the adaptation of these software.", "C. Users can use the MapReduce service (MRS) to run big data components such as HBase and Kafka.", "D. ModelArts is a one-stop AI development platform for developers to quickly create and deploy models."], "answer": "ACD", "explanation": "A, C, and D are true (Ch.02, p.125 Quiz Q3). B is false because more than 80% of applications in the education and scientific research fields (as well as meteorology and life sciences) are open-source; closed-source commercial software is mainly used in manufacturing, EDA, and oil & gas (Ch.02, pp. 119, 122)."}, {"id": "h2_s4_q2", "type": "single", "question": "In Huawei's Kunpeng HPC software subsystem, which suite includes the Hyper MPI communication library, Kunpeng Math Library (KML), and BiSheng Compiler?", "options": ["A. DonauKit", "B. HPCKit", "C. DevKit", "D. FusionCompute"], "answer": "B", "explanation": "HPCKit integrates Hyper MPI, Kunpeng Math Library (KML), and BiSheng Compiler/GCC. DonauKit provides cluster management (Donau Portal) and job scheduling (Donau Scheduler), while DevKit provides code porting and performance profiling (Ch.02, p.118)."}, {"id": "h2_s4_q3", "type": "single", "question": "Which meteorological numerical analysis application is the most commonly used open-source weather forecast model on Kunpeng HPC, characterized by single-precision (fp32) computing and memory-intensive bandwidth?", "options": ["A. WRF", "B. Abaqus", "C. GATK", "D. LS-DYNA"], "answer": "A", "explanation": "WRF (Weather Research and Forecasting) is the most commonly used meteorological application, mainly using single-precision fp32 computing (180 GFlops) and high memory bandwidth (180 GB/s) (Ch.02, p.121)."}]}}]}, {"hour_number": 3, "folder_name": "Hour-03-Server-Hardware-CPU-Memory-and-Drives", "title": "Server Hardware Architecture: CPU, Memory, Mainboard & Storage Drives", "chapter_ref": "Chapter 03 Part 1 (pp. 130–158)", "duration_mins": 60, "overview": "Deep-dive into TaiShan 200 (2280) internal hardware components, CPU architecture (Control Unit, ALU, Registers, Cache), Kunpeng 920 processor SKUs, SRAM vs. DRAM/ROM, 8-channel DIMM population rules, S920X00 mainboard, front/rear panel layouts, and SATA/SAS/NL-SAS/SSD/NVMe drive technologies.", "sprints": [{"sprint_number": 1, "lecture_slug": "01-Lecture-CPU-Architecture-Parameters-and-Multi-Socket-Topologies", "exercise_slug": "02-Exercise-CPU-Instruction-Cycle-and-Kunpeng-920-SKU-Lab", "lecture": {"title": "CPU Architecture, Parameters & Multi-Socket Topologies", "duration_mins": 7, "pdf_ref": "Ch.03, pp. 134–141, 223–224", "objectives": ["Identify front/rear exploded hardware components of a TaiShan 200 (model 2280) server", "Master CPU internal components (Control Unit [PC, IR, ID, OC], ALU, Storage Unit [Registers + Cache]) and the 4 basic CPU functions", "Understand key CPU parameters (dominant frequency, cache L1/L2/L3, cores/threads) and TaiShan 200 (2280) Kunpeng 920 processor models"], "content_markdown": "### 1. TaiShan 200 (2280) Exploded View & CPU Internal Structure (pp. 134–138)\n- **Front Exploded Components (p. 134)**: Chassis, Chassis cover, Air ducts, Heat sinks, Drives, Mainboard, CPUs, Fans.\n- **Rear Exploded Components (p. 135)**: RAID controller card, Memory modules, Power supply modules (PSUs), FlexIO cards, Riser module.\n- **Three Core Units of a CPU (pp. 136, 138, 224)**:\n  1. **Control Unit (Command & Control Center)**: Composed of:\n     - **Program Counter (PC)**: Register storing the memory address of the **next instruction** to be executed.\n     - **Instruction Register (IR)**: Register storing the instruction **currently being executed**.\n     - **Instruction Decoder (ID)**: Decodes an instruction into its **operation code** (action to take) and **address code** (location of operand).\n     - **Operation Controller (OC)**: Generates micro-operation control signals according to strict timing pulses.\n  2. **Arithmetic Logic Unit (ALU)**: Execution core performing arithmetic (`+`, `-`, `*`, `/`), logical (`AND`, `OR`, `NOT`, `XOR`), shift, comparison, and transfer operations upon receiving commands from the control unit.\n  3. **Storage Unit**: Includes **on-chip cache (L1/L2/L3)** and the **register group**, which temporarily hold data/results to reduce slow main memory accesses.\n\n---\n\n### 2. Basic CPU Functions & Key Parameters (pp. 139–140)\n- **Four Basic CPU Functions (p. 139)**:\n  1. **Instruction control** (program sequence control — fetching/executing instructions in exact order)\n  2. **Operation control** (generating and sending operation signals for each instruction)\n  3. **Time control** (strict timing sequences for signals and instruction execution)\n  4. **Data processing** (arithmetic and logical operations on data)\n- **Three Key CPU Parameters (p. 140)**:\n  - **Dominant frequency (Clock frequency)**: E.g., at 100 MHz, 1 clock cycle = 10\ ns, which is twice as fast as 50 MHz (20\ ns).\n  - **Cache (L1/L2/L3)**: Bridges the speed gap between fast CPU cores and slower main memory; operates near processor frequency.\n  - **Number of cores & threads**: Normally a **1:1** correspondence (16 cores = 16 threads); with hyper-threading (SMT), it becomes **1:2** (16 cores = 32 threads).\n- **Arm RISC Characteristics (p. 137)**: Small size, low power, supports **Thumb (16-bit) / Arm (32-bit)** dual instruction sets (plus 64-bit AArch64), uses a large number of registers, performs most data operations in registers, and uses **fixed instruction length**.\n\n---\n\n### 3. Multi-Socket CPUs & TaiShan 200 (2280) Kunpeng 920 Models (p. 141)\n\"Socket\" refers to the number of physical CPUs (CPU slots) on the server mainboard (1P, 2P, 4P, multi-socket).\n\n| Processor Model | Supported Sockets | Processor Specifications (p. 141) |\n| :--- | :---: | :--- |\n| **Kunpeng 920 7260** | 2-socket (2P) | **64-core @ 2.6 GHz** |\n| **Kunpeng 920 5250** | 2-socket (2P) | **48-core @ 2.6 GHz** |\n| **Kunpeng 920 5220** | 2-socket (2P) | **32-core @ 2.6 GHz** |\n| **Kunpeng 920 3210** | 2-socket (2P) | **24-core @ 2.6 GHz** |", "key_takeaways": ["The Control Unit consists of the Program Counter (PC, next instruction address), Instruction Register (IR, current instruction), Instruction Decoder (ID, opcode + address code), and Operation Controller (OC).", "The 4 basic CPU functions are Instruction control, Operation control, Time control, and Data processing.", "TaiShan 200 (2280) supports 2-socket Kunpeng 920 models at 2.6 GHz: 7260 (64-core), 5250 (48-core), 5220 (32-core), and 3210 (24-core)."], "exam_traps": ["EXAM TRAP: Do not confuse the Program Counter (PC — stores the memory address of the NEXT instruction) with the Instruction Register (IR — stores the instruction CURRENTLY being executed)!", "EXAM TRAP: Kunpeng 920 model numbers encode core counts and frequency: 7260 = 64 cores @ 2.6 GHz, 5250 = 48 cores @ 2.6 GHz, 5220 = 32 cores @ 2.6 GHz, 3210 = 24 cores @ 2.6 GHz."], "content_html": "<h3>1. TaiShan 200 (2280) Exploded View &amp; CPU Internal Structure (pp. 134–138)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Front Exploded Components (p. 134)<\/strong>: Chassis, Chassis cover, Air ducts, Heat sinks, Drives, Mainboard, CPUs, Fans.<\/li>\n<li><strong>Rear Exploded Components (p. 135)<\/strong>: RAID controller card, Memory modules, Power supply modules (PSUs), FlexIO cards, Riser module.<\/li>\n<li><strong>Three Core Units of a CPU (pp. 136, 138, 224)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Control Unit (Command &amp; Control Center)<\/strong>: Composed of:<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Program Counter (PC)<\/strong>: Register storing the memory address of the <strong>next instruction<\/strong> to be executed.<\/li>\n<li><strong>Instruction Register (IR)<\/strong>: Register storing the instruction <strong>currently being executed<\/strong>.<\/li>\n<li><strong>Instruction Decoder (ID)<\/strong>: Decodes an instruction into its <strong>operation code<\/strong> (action to take) and <strong>address code<\/strong> (location of operand).<\/li>\n<li><strong>Operation Controller (OC)<\/strong>: Generates micro-operation control signals according to strict timing pulses.<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Arithmetic Logic Unit (ALU)<\/strong>: Execution core performing arithmetic (<code class=\"inline-code\">+<\/code>, <code class=\"inline-code\">-<\/code>, <code class=\"inline-code\">*<\/code>, <code class=\"inline-code\">/<\/code>), logical (<code class=\"inline-code\">AND<\/code>, <code class=\"inline-code\">OR<\/code>, <code class=\"inline-code\">NOT<\/code>, <code class=\"inline-code\">XOR<\/code>), shift, comparison, and transfer operations upon receiving commands from the control unit.<\/li>\n<li><strong>Storage Unit<\/strong>: Includes <strong>on-chip cache (L1/L2/L3)<\/strong> and the <strong>register group<\/strong>, which temporarily hold data/results to reduce slow main memory accesses.<\/li>\n<\/ol>\n<p>---<\/p>\n<h3>2. Basic CPU Functions &amp; Key Parameters (pp. 139–140)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Four Basic CPU Functions (p. 139)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>Instruction control<\/strong> (program sequence control — fetching/executing instructions in exact order)<\/li>\n<li><strong>Operation control<\/strong> (generating and sending operation signals for each instruction)<\/li>\n<li><strong>Time control<\/strong> (strict timing sequences for signals and instruction execution)<\/li>\n<li><strong>Data processing<\/strong> (arithmetic and logical operations on data)<\/li>\n<\/ol>\n<ul class=\"md-list\">\n<li><strong>Three Key CPU Parameters (p. 140)<\/strong>:<\/li>\n<li><strong>Dominant frequency (Clock frequency)<\/strong>: E.g., at 100 MHz, 1 clock cycle = 10\ ns, which is twice as fast as 50 MHz (20\ ns).<\/li>\n<li><strong>Cache (L1/L2/L3)<\/strong>: Bridges the speed gap between fast CPU cores and slower main memory; operates near processor frequency.<\/li>\n<li><strong>Number of cores &amp; threads<\/strong>: Normally a <strong>1:1<\/strong> correspondence (16 cores = 16 threads); with hyper-threading (SMT), it becomes <strong>1:2<\/strong> (16 cores = 32 threads).<\/li>\n<li><strong>Arm RISC Characteristics (p. 137)<\/strong>: Small size, low power, supports <strong>Thumb (16-bit) / Arm (32-bit)<\/strong> dual instruction sets (plus 64-bit AArch64), uses a large number of registers, performs most data operations in registers, and uses <strong>fixed instruction length<\/strong>.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. Multi-Socket CPUs &amp; TaiShan 200 (2280) Kunpeng 920 Models (p. 141)<\/h3>\n<p>\"Socket\" refers to the number of physical CPUs (CPU slots) on the server mainboard (1P, 2P, 4P, multi-socket).<\/p>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Processor Model<\/th><th>Supported Sockets<\/th><th>Processor Specifications (p. 141)<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>Kunpeng 920 7260<\/strong><\/td><td>2-socket (2P)<\/td><td><strong>64-core @ 2.6 GHz<\/strong><\/td><\/tr>\n<tr><td><strong>Kunpeng 920 5250<\/strong><\/td><td>2-socket (2P)<\/td><td><strong>48-core @ 2.6 GHz<\/strong><\/td><\/tr>\n<tr><td><strong>Kunpeng 920 5220<\/strong><\/td><td>2-socket (2P)<\/td><td><strong>32-core @ 2.6 GHz<\/strong><\/td><\/tr>\n<tr><td><strong>Kunpeng 920 3210<\/strong><\/td><td>2-socket (2P)<\/td><td><strong>24-core @ 2.6 GHz<\/strong><\/td><\/tr>\n<\/tbody><\/table><\/div>"}, "exercise": {"title": "Hands-On Lab: CPU Control Unit Registers & Kunpeng 920 SKU Inspector", "duration_mins": 7, "exercise_type": "script", "prompt_label": "python3@taishan-2280:~", "scenario": "Write a Python hardware inspection script that maps CPU Control Unit registers (PC, IR, ID, OC) and calculates clock cycle period and total physical cores on a 2-socket TaiShan 200 (2280) server.", "instructions": ["Set `next_instruction_address_register` to `'PC'` and `current_instruction_register` to `'IR'`.", "Calculate `clock_period_ns_at_100mhz` as `10` (since 1 / 100\ MHz = 10\ ns).", "Map the core counts for Kunpeng 920 models: `7260` -> `64`, `5250` -> `48`, `5220` -> `32`, `3210` -> `24`."], "starter_code": "# CPU Architecture & Kunpeng 920 SKU Verification\ncontrol_unit = {\n    \"next_instruction_address_register\": \"___\",\n    \"current_instruction_register\": \"___\",\n    \"decoder\": \"ID\",\n    \"signal_generator\": \"OC\"\n}\nclock_period_ns_at_100mhz = ___\nkunpeng_920_cores = {\n    \"7260\": ___,\n    \"5250\": ___,\n    \"5220\": ___,\n    \"3210\": ___\n}\nprint(control_unit, clock_period_ns_at_100mhz, kunpeng_920_cores)", "solution_code": "# CPU Architecture & Kunpeng 920 SKU Verification\ncontrol_unit = {\n    \"next_instruction_address_register\": \"PC\",\n    \"current_instruction_register\": \"IR\",\n    \"decoder\": \"ID\",\n    \"signal_generator\": \"OC\"\n}\nclock_period_ns_at_100mhz = 10\nkunpeng_920_cores = {\n    \"7260\": 64,\n    \"5250\": 48,\n    \"5220\": 32,\n    \"3210\": 24\n}\nprint(control_unit, clock_period_ns_at_100mhz, kunpeng_920_cores)", "hints": ["PC (Program Counter) holds the address of the next instruction; IR (Instruction Register) holds the current instruction.", "Kunpeng 920 core counts on p. 141 are 64 (7260), 48 (5250), 32 (5220), and 24 (3210)."], "validation_checks": [{"step": 1, "description": "Verify PC and IR registers in the CPU Control Unit", "required_any": ["\"pc\"", "'pc'"], "feedback_fail": "Set next_instruction_address_register to 'PC' and current_instruction_register to 'IR'."}, {"step": 2, "description": "Verify IR register and 10 ns clock cycle at 100 MHz", "required_any": ["\"ir\"", "'ir'", "10"], "feedback_fail": "Ensure 'IR' and clock_period_ns_at_100mhz = 10 are specified."}, {"step": 3, "description": "Verify Kunpeng 920 SKU core counts (64, 48, 32, 24)", "required_any": ["64", "48", "32", "24"], "feedback_fail": "Map 7260->64, 5250->48, 5220->32, and 3210->24."}], "simulated_output": "{'next_instruction_address_register': 'PC', 'current_instruction_register': 'IR', 'decoder': 'ID', 'signal_generator': 'OC'} 10 {'7260': 64, '5250': 48, '5220': 32, '3210': 24}\n[OK] CPU Control Unit registers and Kunpeng 920 SKU table verified.", "quiz_questions": [{"id": "h3_s1_q1", "type": "single", "question": "Within the Control Unit of a CPU, which component stores the memory address of the NEXT instruction to be executed, and which stores the instruction CURRENTLY being executed?", "options": ["A. Instruction Register (next address) and Program Counter (current instruction)", "B. Program Counter (next address) and Instruction Register (current instruction)", "C. Instruction Decoder (next address) and Operation Controller (current instruction)", "D. ALU (next address) and L1 Cache (current instruction)"], "answer": "B", "explanation": "According to Ch.03 pp. 138 and 224, the Program Counter (PC) stores the memory address of the next instruction to be executed, while the Instruction Register (IR) stores the instruction currently being executed."}, {"id": "h3_s1_q2", "type": "multiple", "question": "Which of the following are the four basic functions of a CPU defined in Chapter 03 (p. 139)?", "options": ["A. Instruction control", "B. Operation control", "C. Time control", "D. Data processing", "E. Permanent nonvolatile storage"], "answer": "ABCD", "explanation": "The four basic functions of a CPU are Instruction control, Operation control, Time control, and Data processing (Ch.03, p.139)."}, {"id": "h3_s1_q3", "type": "single", "question": "How many cores and what clock frequency does a single Kunpeng 920 5250 processor provide in a TaiShan 200 (model 2280) server?", "options": ["A. 64 cores at 2.6 GHz", "B. 48 cores at 2.6 GHz", "C. 32 cores at 2.6 GHz", "D. 24 cores at 2.6 GHz"], "answer": "B", "explanation": "On a TaiShan 200 (model 2280), Kunpeng 920 7260 = 64-core 2.6 GHz, 5250 = 48-core 2.6 GHz, 5220 = 32-core 2.6 GHz, and 3210 = 24-core 2.6 GHz (Ch.03, p.141)."}]}}, {"sprint_number": 2, "lecture_slug": "03-Lecture-Memory-Architecture-DRAM-SRAM-and-DIMM-Population-Rules", "exercise_slug": "04-Exercise-DIMM-Channel-Balance-and-SPD-Verification-Lab", "lecture": {"title": "Memory Architecture, DRAM/SRAM/ROM & DIMM Installation Rules", "duration_mins": 8, "pdf_ref": "Ch.03, pp. 142–148, 224–225", "objectives": ["Identify the components of a memory module including the 8-pin 256-byte SPD EEPROM (24LC01B) and timing calibration register", "Contrast DRAM (capacitor, periodic refresh, main memory) vs. SRAM (transistor latch, no refresh, CPU cache) vs. ROM/Flash", "Master TaiShan 200 (2280) 32-slot (8-channel × 2 DPC) DDR4 DIMM installation and channel-balance rules"], "content_markdown": "### 1. Memory Module Structure & SPD Chip (pp. 142–143, 224)\nMemory (internal/main memory) acts as the communication bridge between external storage (drives) and the CPU.\n- **Physical Components of a Memory Module (p. 143)**: Memory chip, Register (used for **timing calibration**), Edge connector, Resistor/Capacitor, Specification mark, Anti-counterfeit mark, and **SPD & TSOD**.\n- **Serial Presence Detect (SPD, pp. 143, 224)**:\n  - An **8-pin SOIC-encapsulated (3 mm × 4 mm) electrically erasable programmable read-only memory (EEPROM)** with a capacity of **256 bytes** (main model: **24LC01B**, located on the right side of the front of a DIMM).\n  - Stores memory capacity, chip/module manufacturer, operating speed, voltage, and row/column address bandwidth. During boot, the mainboard automatically reads the SPD to configure memory working parameters.\n\n---\n\n### 2. Memory Categories: DRAM vs. SRAM vs. ROM & SIMM/DIMM (pp. 144–146, 225)\n| Memory Type | Storage Element & Refresh | Integration / Speed / Power | Primary Application |\n| :--- | :--- | :--- | :--- |\n| **DRAM (Dynamic RAM)** | **Capacitor** + components (charge level = 0 or 1); **requires periodic refresh** due to leakage | Simple architecture, **high integration**, lower cost | **Main memory modules (DIMMs)** |\n| **SRAM (Static RAM)** | **Transistor latch**; **does NOT require refreshing** | Low integration, **high speed**, high power consumption | **Small-capacity, high-efficiency CPU Caches (L1/L2/L3)** |\n| **ROM / Flash** | Nonvolatile (retains data when powered off) | Includes traditional ROM, **EPROM, EEPROM, and Flash memory** | **BIOS ROM** (stored in Flash ROM), SSDs, USB flash drives |\n\n- **Memory Parameters (p. 146)**:\n  - **Memory Frequency**: Measured in **MT/s** (*millions of transfers/times per second*, e.g., 2666, 2933, 3000, 3200, 3600 MT/s).\n  - **SIMM vs. DIMM**: A Single Inline Memory Module (**SIMM**) provides a **32-bit** data channel (4 Bytes); a Dual Inline Memory Module (**DIMM**) provides a **64-bit** data channel (**8 Bytes**).\n  - **Theoretical Memory Bandwidth Formula**: \Bandwidth = \Memory Frequency (MT/s) \× 8\ Bytes (64 bits) \× \Number of Channels.\n\n---\n\n### 3. TaiShan 200 (2280) DIMM Slots & Installation Rules (pp. 147–148)\n- **Slot Topology (p. 147)**: Equipped with two Kunpeng 920 processors (e.g., 7260 or 5250), a TaiShan 200 (2280) provides up to **32 DDR4 DIMM slots**:\n  - Each processor supports **8 DIMM channels**, and each channel supports **2 DIMMs** (2\ CPUs \× 8\ channels \× 2\ DIMMs/channel = 32\ DIMMs).\n- **Mandatory DIMM Installation Rules (p. 148)**:\n  1. **At least one DIMM must be configured in slots supported by CPU 1**.\n  2. **All DIMMs on a server must have the exact same specifications** (capacity, bit width, rank, height) — i.e., **the same part number (P/N code)**.\n  3. **Balanced Configuration Principle**: Optimal performance requires both CPUs to have the **same number of DIMMs** (processor balance) and DIMMs to be **evenly distributed across the 8 memory channels** (channel balance: **1, 2, 4, 6, 8, or 16 DIMMs per CPU**, though 6 is partially populated, **3, 5, 7, 9, 10, 11, 12, 13, 14, or 15 DIMMs on a single CPU** are explicitly listed on p. 148 as **unbalanced channel configurations**!).", "key_takeaways": ["SPD (Serial Presence Detect, model 24LC01B) is an 8-pin, 256-byte EEPROM on a DIMM that stores speed, capacity, voltage, and manufacturer metadata read during startup.", "DRAM uses capacitors and requires periodic refreshing (used for main memory); SRAM uses transistor latches, needs no refreshing, and is used for CPU L1/L2/L3 caches.", "SIMM has a 32-bit data channel; DIMM has a 64-bit (8-byte) data channel.", "TaiShan 200 (2280) has 32 DIMM slots (2 CPUs × 8 channels × 2 DIMMs/channel). All DIMMs must share the same P/N code, at least 1 DIMM must be on CPU 1, and configuring 3, 5, 7, 9, 10, 11, 12, 13, 14, or 15 DIMMs per CPU causes an unbalanced channel configuration."], "exam_traps": ["EXAM TRAP: Do not confuse DRAM and SRAM! DRAM uses capacitors (needs periodic refresh -> main memory), while SRAM uses transistor latches (no refresh needed -> CPU cache).", "EXAM TRAP: On a Kunpeng 920 CPU (8 memory channels), installing 12 DIMMs per CPU is an UNBALANCED channel configuration (12 is not divisible by 8); balanced full/half channel counts per CPU are 1, 2, 4, 8, or 16 DIMMs!"], "content_html": "<h3>1. Memory Module Structure &amp; SPD Chip (pp. 142–143, 224)<\/h3>\n<p>Memory (internal/main memory) acts as the communication bridge between external storage (drives) and the CPU.<\/p>\n<ul class=\"md-list\">\n<li><strong>Physical Components of a Memory Module (p. 143)<\/strong>: Memory chip, Register (used for <strong>timing calibration<\/strong>), Edge connector, Resistor/Capacitor, Specification mark, Anti-counterfeit mark, and <strong>SPD &amp; TSOD<\/strong>.<\/li>\n<li><strong>Serial Presence Detect (SPD, pp. 143, 224)<\/strong>:<\/li>\n<li>An <strong>8-pin SOIC-encapsulated (3 mm × 4 mm) electrically erasable programmable read-only memory (EEPROM)<\/strong> with a capacity of <strong>256 bytes<\/strong> (main model: <strong>24LC01B<\/strong>, located on the right side of the front of a DIMM).<\/li>\n<li>Stores memory capacity, chip/module manufacturer, operating speed, voltage, and row/column address bandwidth. During boot, the mainboard automatically reads the SPD to configure memory working parameters.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>2. Memory Categories: DRAM vs. SRAM vs. ROM &amp; SIMM/DIMM (pp. 144–146, 225)<\/h3>\n<div class=\"table-wrap\"><table class=\"md-table\">\n<thead><tr><th>Memory Type<\/th><th>Storage Element &amp; Refresh<\/th><th>Integration / Speed / Power<\/th><th>Primary Application<\/th><\/tr><\/thead><tbody>\n<tr><td><strong>DRAM (Dynamic RAM)<\/strong><\/td><td><strong>Capacitor<\/strong> + components (charge level = 0 or 1); <strong>requires periodic refresh<\/strong> due to leakage<\/td><td>Simple architecture, <strong>high integration<\/strong>, lower cost<\/td><td><strong>Main memory modules (DIMMs)<\/strong><\/td><\/tr>\n<tr><td><strong>SRAM (Static RAM)<\/strong><\/td><td><strong>Transistor latch<\/strong>; <strong>does NOT require refreshing<\/strong><\/td><td>Low integration, <strong>high speed<\/strong>, high power consumption<\/td><td><strong>Small-capacity, high-efficiency CPU Caches (L1/L2/L3)<\/strong><\/td><\/tr>\n<tr><td><strong>ROM / Flash<\/strong><\/td><td>Nonvolatile (retains data when powered off)<\/td><td>Includes traditional ROM, <strong>EPROM, EEPROM, and Flash memory<\/strong><\/td><td><strong>BIOS ROM<\/strong> (stored in Flash ROM), SSDs, USB flash drives<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul class=\"md-list\">\n<li><strong>Memory Parameters (p. 146)<\/strong>:<\/li>\n<li><strong>Memory Frequency<\/strong>: Measured in <strong>MT/s<\/strong> (<em>millions of transfers/times per second<\/em>, e.g., 2666, 2933, 3000, 3200, 3600 MT/s).<\/li>\n<li><strong>SIMM vs. DIMM<\/strong>: A Single Inline Memory Module (<strong>SIMM<\/strong>) provides a <strong>32-bit<\/strong> data channel (4 Bytes); a Dual Inline Memory Module (<strong>DIMM<\/strong>) provides a <strong>64-bit<\/strong> data channel (<strong>8 Bytes<\/strong>).<\/li>\n<li><strong>Theoretical Memory Bandwidth Formula<\/strong>: \Bandwidth = \Memory Frequency (MT/s) \× 8\ Bytes (64 bits) \× \Number of Channels.<\/li>\n<\/ul>\n<p>---<\/p>\n<h3>3. TaiShan 200 (2280) DIMM Slots &amp; Installation Rules (pp. 147–148)<\/h3>\n<ul class=\"md-list\">\n<li><strong>Slot Topology (p. 147)<\/strong>: Equipped with two Kunpeng 920 processors (e.g., 7260 or 5250), a TaiShan 200 (2280) provides up to <strong>32 DDR4 DIMM slots<\/strong>:<\/li>\n<li>Each processor supports <strong>8 DIMM channels<\/strong>, and each channel supports <strong>2 DIMMs<\/strong> (2\ CPUs \× 8\ channels \× 2\ DIMMs/channel = 32\ DIMMs).<\/li>\n<li><strong>Mandatory DIMM Installation Rules (p. 148)<\/strong>:<\/li>\n<\/ul>\n<ol class=\"md-list\">\n<li><strong>At least one DIMM must be configured in slots supported by CPU 1<\/strong>.<\/li>\n<li><strong>All DIMMs on a server must have the exact same specifications<\/strong> (capacity, bit width, rank, height) — i.e., <strong>the same part number (P/N code)<\/strong>.<\/li>\n<li><strong>Balanced Configuration Principle<\/strong>: Optimal performance requires both CPUs to have the <strong>same number of DIMMs<\/strong> (processor balance) and DIMMs to be <strong>evenly distributed across the 8 memory channels<\/strong> (channel balance: <strong>1, 2, 4, 6, 8, or 16 DIMMs per CPU<\/strong>, though 6 is partially populated, <strong>3, 5, 7, 9, 10, 11, 12, 13, 14, or 15 DIMMs on a single CPU<\/strong> are explicitly listed on p. 148 as <strong>unbalanced channel configurations<\/strong>!).<\/li>\n<\/ol>"}, "exercise": {"title": "Hands-On Lab: Kunpeng 8-Channel Memory Bandwidth & DIMM Balance Calculator", "duration_mins": 8, "exercise_type": "script", "prompt_label": "python3@taishan-2280:~", "scenario": "Write a Python script to validate the SPD EEPROM specs, compute the theoretical peak memory bandwidth of a dual-socket Kunpeng 920 server with DDR4-2933 across 16 total channels (2 × 8 channels), and check DIMM population rules.", "instructions": ["Set `spd_pins` to `8`, `spd_capacity_bytes` to `256`, and `dimm_data_width_bits` to `64`.", "Set `channels_per_cpu` to `8` and `total_dimm_slots_2p` to `32`.", "Specify `dram_storage_element` as `'capacitor'` and `sram_storage_element` as `'transistor'`."], "starter_code": "# TaiShan 200 (2280) Memory & SPD Validator\nspd_pins = ___\nspd_capacity_bytes = ___\ndimm_data_width_bits = ___\nchannels_per_cpu = ___\ntotal_dimm_slots_2p = ___\ndram_storage_element = \"___\"\nsram_storage_element = \"___\"\n\n# Bandwidth per CPU at 2933 MT/s (GB/s) = 2933 * 8 bytes * 8 channels / 1000\nbw_per_cpu_gbs = round(2933 * (dimm_data_width_bits // 8) * channels_per_cpu / 1000, 1)\nprint(f\"SPD: {spd_pins}-pin {spd_capacity_bytes}B | Slots: {total_dimm_slots_2p} | BW/CPU: {bw_per_cpu_gbs} GB/s\")", "solution_code": "# TaiShan 200 (2280) Memory & SPD Validator\nspd_pins = 8\nspd_capacity_bytes = 256\ndimm_data_width_bits = 64\nchannels_per_cpu = 8\ntotal_dimm_slots_2p = 32\ndram_storage_element = \"capacitor\"\nsram_storage_element = \"transistor\"\n\n# Bandwidth per CPU at 2933 MT/s (GB/s) = 2933 * 8 bytes * 8 channels / 1000\nbw_per_cpu_gbs = round(2933 * (dimm_data_width_bits // 8) * channels_per_cpu / 1000, 1)\nprint(f\"SPD: {spd_pins}-pin {spd_capacity_bytes}B | Slots: {total_dimm_slots_2p} | BW/CPU: {bw_per_cpu_gbs} GB/s\")", "hints": ["SPD is an 8-pin, 256-byte EEPROM; each DIMM has a 64-bit data bus.", "TaiShan 200 (2280) has 8 channels per CPU and 32 DIMM slots total; DRAM uses a capacitor while SRAM uses a transistor latch."], "validation_checks": [{"step": 1, "description": "Verify SPD 8-pin 256-byte EEPROM and 64-bit DIMM data width", "required_any": ["256", "64"], "feedback_fail": "Set spd_pins = 8, spd_capacity_bytes = 256, and dimm_data_width_bits = 64."}, {"step": 2, "description": "Verify 8 channels per CPU and 32 total DIMM slots", "required_any": ["32", "8"], "feedback_fail": "Set channels_per_cpu = 8 and total_dimm_slots_2p = 32."}, {"step": 3, "description": "Verify capacitor (DRAM) vs transistor (SRAM)", "required_any": ["capacitor", "transistor"], "feedback_fail": "Set dram_storage_element = 'capacitor' and sram_storage_element = 'transistor'."}], "simulated_output": "SPD: 8-pin 256B | Slots: 32 | BW/CPU: 187.7 GB/s\n[OK] Memory architecture, DRAM/SRAM cell types, and 8-channel DIMM rules verified.", "quiz_questions": [{"id": "h3_s2_q1", "type": "single", "question": "What is the capacity and function of the Serial Presence Detect (SPD) chip on a server memory module (DIMM)?", "options": ["A. A 64-KB SRAM cache chip used to store CPU L1 instructions", "B. An 8-pin, 256-byte EEPROM chip that stores memory capacity, manufacturer, voltage, and operating speed read by the mainboard during startup", "C. A 16-MB Flash ROM chip that stores the UEFI operating system boot loader", "D. A timing calibration register that converts 32-bit SIMM channels into 64-bit DIMM channels"], "answer": "B", "explanation": "According to Ch.03 pp. 143 and 224, SPD (model 24LC01B) is an 8-pin electrically erasable programmable read-only memory (EEPROM) with a capacity of 256 bytes that stores memory metadata (capacity, manufacturer, speed, voltage) detected during startup."}, {"id": "h3_s2_q2", "type": "multiple", "question": "Which of the following statements about DRAM, SRAM, and TaiShan 200 (model 2280) DIMM installation rules are true?", "options": ["A. A storage unit of DRAM uses a capacitor and requires periodic refresh, making it suitable for main memory modules.", "B. A storage unit of SRAM is a transistor latch that does not require refreshing, making it suitable for CPU caches.", "C. All DIMMs installed on the same server must have the same specifications and part number (P/N code), and at least one DIMM must be installed in a slot supported by CPU 1.", "D. Configuring 12 DIMMs on a single 8-channel Kunpeng 920 processor is a balanced channel configuration."], "answer": "ABC", "explanation": "A, B, and C are true (Ch.03, pp. 144, 148). D is false because on an 8-channel processor, configuring 3, 5, 7, 9, 10, 11, 12, 13, 14, or 15 DIMMs per CPU results in an unbalanced channel configuration (p. 148)."}, {"id": "h3_s2_q3", "type": "single", "question": "How many data channel bits does a Single Inline Memory Module (SIMM) provide compared to a Dual Inline Memory Module (DIMM)?", "options": ["A. SIMM provides 16-bit data channels; DIMM provides 32-bit data channels", "B. SIMM provides 32-bit data channels; DIMM provides 64-bit data channels", "C. SIMM provides 64-bit data channels; DIMM provides 128-bit data channels", "D. Both SIMM and DIMM provide 64-bit data channels"], "answer": "B", "explanation": "According to Ch.03 p.146, each SIMM provides 32-bit data channels, whereas each DIMM provides 64-bit data channels."}]}}, {"sprint_number": 3, "lecture_slug": "05-Lecture-Server-Chassis-Mainboard-and-Hard-Disk-Mechanics", "exercise_slug": "06-Exercise-Mainboard-S920X00-and-Drive-MTBF-DWPD-Lab", "lecture": {"title": "Mainboard S920X00, Front/Rear Panels & Drive Classifications", "duration_mins": 7, "pdf_ref": "Ch.03, pp. 149–154", "objectives": ["Master the specifications of the Kunpeng server mainboard S920X00", "Identify every port, button, indicator, and I/O module on the TaiShan 200 (2280) front and rear panels", "Compare SATA, SAS, NL-SAS, and SSD drives by rotational speed, MTBF, annual failure rate, and SSD DWPD classes"], "content_markdown": "### 1. Kunpeng Server Mainboard (S920X00) & Chassis Sizes (pp. 149–150)\n- **Mainboard Role**: Provides the connection platform integrating CPUs, memory, storage, PCIe expansion cards, and external ports. The **chipset** is the most important component on the mainboard, managing inter-device communication and built-in functions (such as an integrated GPU).\n- **Kunpeng Server Mainboard Model `S920X00` (p. 149)**:\n  - **CPUs**: **2 × Kunpeng 920 processors**\n  - **Management Chip**: **Hi1710** intelligent management chip\n  - **Memory**: Up to **32 DDR4-2933** memory slots\n  - **PCIe Expansion**: **8 × PCIe 4.0** slots\n  - **Chassis Compatibility**: Compatible with **2U or 4U rack servers** (e.g., TaiShan 2280 2U and TaiShan 5280 4U share this motherboard!).\n- **Rack Heights (p. 150)**: **1U = 1.75 in (4.45 cm)**, **2U = 3.5 in (8.9 cm)**, **4U = 7 in (17.8 cm)**.\n\n---\n\n### 2. TaiShan 200 (2280) Front and Rear Panels (pp. 151–152)\n- **Supported Front Drive Configurations (p. 151)**: `12 × 3.5-inch`, `25 × 2.5-inch`, `8 × 2.5\" SAS/SATA + 12 × 2.5\" NVMe`, `24 × 2.5\" SAS/SATA`, or `8 × 2.5-inch` drives.\n- **Front Panel Components (p. 151)**: (1) UID button/indicator, (2) Health status indicator, (3) Power button/indicator, (4) Fault diagnosis LED, (5) **FlexIO card presence indicator**, (6) Drives, (7) **VGA port**, (8) **USB 3.0 port**, (9) Label with SN.\n- **Rear Panel Components (p. 152)**:\n  - **I/O module 1, I/O module 2, I/O m
